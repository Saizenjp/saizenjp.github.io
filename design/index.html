<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaiZen Ops 디자인 시스템 — 미리보기</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--border:#e3e6ea;--text:#1f2937;--text2:#525b66;--muted:#8b919b;--accent:#647548;--accentDeep:#4F5E38;--accent2:#9a7322}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
header{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:inset 0 -2px 0 var(--accent);padding:18px 24px}
header h1{font-size:18px;font-weight:900;color:var(--accentDeep)}
header p{font-size:12.5px;color:var(--text2);margin-top:3px}
main{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cell .head{padding:9px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.cell .head b{font-size:13px}
.cell .head .g{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--accent2);border-radius:4px;padding:1px 6px}
.cell iframe{width:100%;height:300px;border:0;background:#f4f5f7}
</style></head><body>
<header>
  <h1>SaiZen Ops 디자인 시스템 — 미리보기 라이브러리</h1>
  <p>정본 강조색 올리브 <code>#647548</code> · 진실 원본 <code>ops/assets/saizen-ops.css</code> + <code>docs/ops-page-skeleton.html</code></p>
</header>
<main>
<div class="grid">
  <div class="cell"><div class="head"><span class="g">Foundations</span><b>Tokens</b></div><iframe src="components/01-tokens.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Actions</span><b>Buttons</b></div><iframe src="components/02-buttons.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Forms</span><b>Inputs</b></div><iframe src="components/03-inputs.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Filters</span><b>Chips</b></div><iframe src="components/04-chips.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Status</span><b>Pills & Badges</b></div><iframe src="components/05-pills-badges.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Containers</span><b>Cards</b></div><iframe src="components/06-cards.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Chrome</span><b>Top bar</b></div><iframe src="components/07-topbar.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Containers</span><b>Panel</b></div><iframe src="components/08-panel.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Status</span><b>Toast</b></div><iframe src="components/09-toast.html"></iframe></div>
  <div class="cell"><div class="head"><span class="g">Data</span><b>List table</b></div><iframe src="components/10-table.html"></iframe></div>
</div>
</main>
</body></html>
