<!-- @dsCard group="Chrome" name="Top bar" subtitle="로고 · STEP · 언어토글 · 후리가나 · 연결상태" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Top bar</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;
  --ok:#2f7d4f;--err:#b13b2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text)}
/* ── 상단바 정본 (skeleton + saizen-ops.css: 헤어라인 + 올리브 인셋) ── */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);box-shadow:inset 0 -2px 0 var(--accent)}
.so-logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;border:none;background:none;cursor:pointer}
.so-logo-mark{height:26px;display:flex;align-items:center;gap:7px;font-weight:900;font-size:17px;letter-spacing:-.02em;color:var(--accentDeep)}
.so-logo-mark .leaf{color:var(--accent)}
.so-logo-sub{font-size:12px;color:var(--text2);font-weight:600;border-left:1px solid var(--border2);padding-left:10px;line-height:1.2}
.step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
.navhome{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;text-decoration:none;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;background:transparent}
.navhome:hover{background:var(--accentSoft)}
.grow{flex:1}
.so-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.so-lang{display:flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.so-lang button{background:transparent;border:none;padding:5px 10px;font-size:11px;font-weight:700;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.so-lang button.active{background:var(--accent);color:#fff}
.so-lang button:not(.active):hover{background:var(--accentSoft);color:var(--accent)}
.so-furi{background:var(--accentSoft);border:1px solid var(--accent);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit}
.so-auth{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:6px;padding:3px 8px;background:var(--surface)}
.so-auth-email{font-size:12px;font-weight:700;color:var(--accent)}
.pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accentSoft);color:var(--ok);border:1px solid #b4cda0}
.note{padding:18px 22px;font-size:12px;color:var(--muted)}
</style></head><body>

<div class="topbar">
  <a class="so-logo"><span class="so-logo-mark"><span class="leaf">◧</span>SaiZen</span><span class="so-logo-sub">야마나미 운영</span></a>
  <span class="step">STEP · 방배정 / 部屋割り</span>
  <a class="navhome">← 현장 운영</a>
  <span class="grow"></span>
  <div class="so-controls">
    <div class="so-lang">
      <button class="active">日本語</button>
      <button>한국어</button>
      <button>EN</button>
    </div>
    <button class="so-furi">ふりがな</button>
    <span class="so-auth"><span>🔐</span><span class="so-auth-email">최민창 님</span></span>
  </div>
  <span class="pill">연결됨</span>
</div>

<p class="note">로고·언어토글·후리가나·로그인은 <code>saizen-ops.js</code>가 전 페이지 상단바에 주입합니다.
헤더는 두꺼운 보더 대신 헤어라인 + 2px 올리브 인셋(제품 크롬)으로 통일됩니다.
※ 실제 로고는 <code>logo-saizen-horizontal.svg</code>이며 여기선 마크로 대체했습니다.</p>
</body></html>
