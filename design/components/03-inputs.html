<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Inputs</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;
  --ok:#2f7d4f;--err:#b13b2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:0}
input,select{font-family:inherit}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 24px 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 24px}
.inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:6px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.sm{font-size:12px;padding:5px 12px}
.hint{font-size:11px;color:var(--muted)}
/* ── 연결바 .conn 정본 ── */
.conn{padding:10px 24px;background:var(--surface2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.conn input{width:230px}
.focus-demo{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
</style></head><body>

<div class="lbl">Text · Select · Focus</div>
<div class="row">
  <input class="inp" type="text" placeholder="검색 — 성명·코드">
  <input class="inp focus-demo" type="text" value="포커스 상태">
  <select class="inp"><option>2026-06</option><option>2026-07</option></select>
  <input class="inp" type="number" value="1" style="width:80px">
</div>

<div class="lbl">연결바 — .conn (Supabase 접속)</div>
<div class="conn">
  <input class="inp" type="text" placeholder="Supabase Project URL">
  <input class="inp" type="password" placeholder="publishable key">
  <button class="btn sm">연결</button>
  <span class="hint">연결 정보는 이 브라우저에만 저장됩니다.</span>
</div>
</body></html>
