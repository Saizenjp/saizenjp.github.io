<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Table</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;
  --ok:#2f7d4f;--err:#b13b2c;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.gbadge{display:inline-block;font-size:8.5px;font-weight:800;border-radius:4px;padding:1px 6px;margin-left:5px;vertical-align:middle;color:#fff;background:var(--accent2)}
/* ── 명세 표 table.list 정본 (settle_merit.html) ── */
.wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
table.list{width:100%;border-collapse:collapse;font-size:12px}
table.list thead th{background:var(--surface3);color:var(--text2);font-weight:800;text-align:left;padding:8px 11px;border-bottom:1px solid var(--border2);white-space:nowrap;font-size:11px;letter-spacing:.02em}
table.list tbody td{padding:8px 11px;border-bottom:1px solid var(--border);color:var(--text)}
table.list tbody tr:hover{background:var(--surface2)}
table.list .num{text-align:right;font-family:var(--mono)}
table.list .tag{font-family:var(--mono);font-weight:700;color:var(--accent)}
table.list tfoot td{padding:9px 11px;font-weight:800;background:var(--accentSoft);color:var(--accentDeep);border-top:2px solid var(--accent)}
</style></head><body>

<div class="lbl">明細 — table.list (現地精算表)</div>
<div class="wrap">
<table class="list">
  <thead><tr><th>코드</th><th>대표자</th><th>숙소</th><th class="num">인원</th><th class="num">박</th><th class="num">숙박비</th><th class="num">송영비</th></tr></thead>
  <tbody>
    <tr><td class="tag">DAあ</td><td>황보관현<span class="gbadge">회원</span></td><td>야마나미</td><td class="num">4</td><td class="num">2</td><td class="num">112,000</td><td class="num">24,000</td></tr>
    <tr><td class="tag">GFな</td><td>김민창</td><td>간지호텔</td><td class="num">2</td><td class="num">3</td><td class="num">96,000</td><td class="num">12,000</td></tr>
    <tr><td class="tag">FAあ</td><td>이대표</td><td>시즈노야도</td><td class="num">6</td><td class="num">1</td><td class="num">102,000</td><td class="num">36,000</td></tr>
  </tbody>
  <tfoot><tr><td colspan="5">合計</td><td class="num">310,000</td><td class="num">72,000</td></tr></tfoot>
</table>
</div>
</body></html>
