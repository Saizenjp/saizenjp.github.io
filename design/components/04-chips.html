<!-- @dsCard group="Filters" name="Chips" subtitle="필터 · 날짜 · 숙소 칩 (.chip / .on)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Chips</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;--err:#b13b2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:28px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ── .chip 정본 (dinner.html 외) — 선택 시 .on = 풀 accent 배경 ── */
.chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 날짜 칩의 「미N」 빨강 배지 (room.html unByDate) */
.chip .un{display:inline-block;margin-left:5px;font-size:9px;font-weight:800;color:#fff;background:var(--err);border-radius:4px;padding:0 4px;vertical-align:middle}
.chip.on .un{background:#fff;color:var(--err)}
</style></head><body>

<div class="lbl">출발지 필터</div>
<div class="row">
  <span class="chip on">전체</span>
  <span class="chip">ICN(인천)</span>
  <span class="chip">PUS(부산)</span>
</div>

<div class="lbl">날짜 칩 (복수 선택 · 미배정 배지)</div>
<div class="row">
  <span class="chip on">전체</span>
  <span class="chip">06/03</span>
  <span class="chip">06/04<span class="un">미2</span></span>
  <span class="chip">06/05</span>
  <span class="chip">06/07<span class="un">미1</span></span>
  <span class="chip">06/10</span>
</div>

<div class="lbl">숙소 다중 필터</div>
<div class="row">
  <span class="chip on">전체</span>
  <span class="chip">간지호텔</span>
  <span class="chip">시즈노야도 료칸</span>
  <span class="chip">쿠주힐즈</span>
  <span class="chip on">야마나미리조트</span>
</div>
</body></html>
