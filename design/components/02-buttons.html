<!-- @dsCard group="Actions" name="Buttons" subtitle="primary / ghost / sm / xs / big / connected / disabled" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Buttons</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;
  --ok:#2f7d4f;--warn:#9a7322;--err:#b13b2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:28px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;width:100%}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ── 실제 .btn 정본 (skeleton + saizen-ops.css 리프레시 r=6) ── */
.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:6px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){background:var(--accentDeep)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
.btn.sm{font-size:12px;padding:5px 12px}
.btn.xs{font-size:12px;padding:3px 9px}
.btn.big{border-radius:7px;font-size:14px;padding:9px 20px}
.btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
</style></head><body>

<div class="lbl">Primary / Ghost</div>
<div class="row">
  <button class="btn">라벨 인쇄</button>
  <button class="btn ghost">취소</button>
</div>

<div class="lbl">Sizes — big / default / sm / xs</div>
<div class="row">
  <button class="btn big">🖨 一括印刷</button>
  <button class="btn">연결</button>
  <button class="btn sm">+ 추가</button>
  <button class="btn xs">✕</button>
</div>

<div class="lbl">상태 — connected / disabled</div>
<div class="row">
  <button class="btn connected">✓ 연결됨</button>
  <button class="btn" disabled>처리 중…</button>
  <button class="btn ghost" disabled>비활성</button>
</div>
</body></html>
