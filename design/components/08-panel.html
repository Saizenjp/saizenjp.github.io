<!-- @dsCard group="Containers" name="Panel & Page help" subtitle=".panel · .page-help (접이식 설명서)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Panel</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 8px}
/* ── 패널 .panel 정본 (saizen-ops.css 리프레시 r=8, 그림자 제거) ── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.panel h3{font-size:13.5px;font-weight:800;color:var(--text);margin:0 0 8px}
.panel p{font-size:12.5px;color:var(--text2);line-height:1.6}
.btn{font-family:inherit;font-size:12px;font-weight:700;border-radius:6px;padding:5px 12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;margin-top:10px}
/* ── 접이식 설명서 .page-help 정본 (saizen-ops.css) ── */
.page-help{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:11px;margin:0 0 14px;overflow:hidden}
.page-help>summary{cursor:pointer;padding:11px 16px;font-weight:800;font-size:13.5px;color:var(--accent);list-style:none}
.page-help>summary::-webkit-details-marker{display:none}
.page-help>summary::before{content:'▸ '}
.page-help[open]>summary::before{content:'▾ '}
.page-help .ph-body{padding:2px 18px 16px;font-size:13px;color:var(--text2);line-height:1.7}
.page-help .ph-body h4{font-size:12.5px;color:var(--text);margin:11px 0 2px}
.page-help .ph-body code{background:var(--surface3);padding:1px 5px;border-radius:4px;font-size:11.5px;font-family:var(--mono)}
.page-help .ph-body ul{margin:3px 0 0 18px}
.page-help .ph-body b{color:var(--text)}
</style></head><body>

<div class="lbl">패널 — .panel</div>
<div class="panel">
  <h3>월 동기화</h3>
  <p>업로드한 파일에 없는 그 달(session_ym) 팀을 확인창을 거쳐 정리합니다. 파일에 있는 팀은 upsert로 id를 유지해 배정을 보존하며, 다른 달은 영향받지 않습니다.</p>
  <button class="btn">동기화 실행</button>
</div>

<div class="lbl">접이식 설명서 — .page-help</div>
<details class="page-help" open>
  <summary>이 페이지는 무엇을 하나요?</summary>
  <div class="ph-body">
    <h4>입력</h4>
    <p>엠클릭 <code>예약리스트.xlsx</code> · <code>일행별예약.xlsx</code>를 업로드합니다.</p>
    <h4>권한</h4>
    <ul><li><b>room</b> 영역 권한자만 쓰기 가능</li><li>읽기는 로그인 전체</li></ul>
  </div>
</details>
</body></html>
