<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Pills & Badges</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;
  --ok:#2f7d4f;--warn:#9a7322;--err:#b13b2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:28px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name{font-size:13px;font-weight:700}
/* ── 상태 알약 .pill (skeleton 정본) ── */
.pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
.pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
/* ── 회원/일반 뱃지 .gbadge (room.html) ── */
.gbadge{display:inline-block;font-size:8.5px;font-weight:800;line-height:1.45;border-radius:4px;padding:1px 6px;margin-left:5px;vertical-align:middle;white-space:nowrap;letter-spacing:.02em;color:var(--text2);background:var(--surface3);border:1px solid var(--border2)}
.gbadge.mem{color:#fff;background:var(--accent2);border-color:var(--accent2)}
/* ── 부서 뱃지 .dbadge (board.html) ── */
.dbadge{font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--surface3);color:var(--text2);border:1px solid var(--border2)}
.dbadge.all{background:var(--accentSoft);color:var(--accent);border-color:#b4cda0}
/* ── 대표 뱃지 .repbadge (room.html) ── */
.repbadge{display:inline-block;font-size:8.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:middle}
/* ── 새 정보 N 뱃지 .nbadge (ops/index.html) ── */
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 4px;margin-left:5px;font-size:9.5px;font-weight:800;color:#fff;background:#b5402f;border-radius:4px;line-height:1;vertical-align:middle}
</style></head><body>

<div class="lbl">연결 상태 — .pill</div>
<div class="row">
  <span class="pill">미연결</span>
  <span class="pill ok">연결됨</span>
  <span class="pill err">연결 실패</span>
</div>

<div class="lbl">회원/일반 — .gbadge · 대표 — .repbadge</div>
<div class="row">
  <span class="name">황보관현<span class="gbadge mem">회원</span></span>
  <span class="name">김민창<span class="gbadge">일반</span></span>
  <span class="name">이대표<span class="repbadge">REP</span></span>
</div>

<div class="lbl">부서 — .dbadge</div>
<div class="row">
  <span class="dbadge all">전체</span>
  <span class="dbadge">프론트</span>
  <span class="dbadge">정산</span>
  <span class="dbadge">주방</span>
</div>

<div class="lbl">새 정보 카운트 — .nbadge</div>
<div class="row">
  <span class="name">가입 요청<span class="nbadge">3</span></span>
  <span class="name">공지<span class="nbadge">12</span></span>
</div>
</body></html>
