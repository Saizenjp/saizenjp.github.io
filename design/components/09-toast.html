<!-- @dsCard group="Status" name="Toast" subtitle=".toast (ok / err / warn)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Toast</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;
  --ok:#2f7d4f;--warn:#9a7322;--err:#b13b2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:30px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:340px;margin:0 auto}
/* ── 토스트 .toast 정본 (skeleton + saizen-ops.css r=8) ── */
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(20,24,28,.14);min-width:200px;text-align:center}
.toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
.toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
.toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}
</style></head><body>

<div class="lbl">토스트 — 화면 하단 중앙 스택, 2.4초 후 페이드</div>
<div class="stack">
  <div class="toast">저장되었습니다</div>
  <div class="toast ok">Supabase 연결됨</div>
  <div class="toast warn">3인팀·홀수 잔여는 보류되었습니다</div>
  <div class="toast err">연결 실패: 정원을 초과했습니다</div>
</div>
</body></html>
