<!-- @dsCard group="Containers" name="Landing cards" subtitle=".card (+feature / print / soon)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>SaiZen Ops · Cards</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f6f7f9;--surface3:#eceef1;
  --border:#e3e6ea;--border2:#cdd2d8;--text:#1f2937;--text2:#525b66;--muted:#8b919b;
  --accent:#647548;--accentDeep:#4F5E38;--accentSoft:#EDF0E2;--accent2:#9a7322;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:10px;margin-bottom:16px}
.cards.one{grid-template-columns:1fr}
/* ── 랜딩 카드 .card 정본 (ops/index.html) ── */
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;padding:14px 15px 12px;transition:.12s;position:relative}
.card:hover{border-color:var(--accent);background:var(--surface2)}
.card .step{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.04em}
.card h4{font-size:14.5px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em;color:var(--text)}
.card .cd{font-size:12px;color:var(--text2);line-height:1.5}
.card .go{margin-top:10px;font-size:11.5px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.card .go::after{content:"→";transition:.12s}
.card.soon{border-left-color:var(--border2);opacity:.6;cursor:default}
.card.soon .step{color:var(--muted)}
.card.soon .badge{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:700;color:var(--muted);background:var(--surface3);border:1px solid var(--border);border-radius:5px;padding:1px 7px}
.card.print{border-left-color:var(--accent2)}
.card.print .step{color:var(--accent2)}
.card.feature{border:1px solid var(--accent);border-left:3px solid var(--accent);background:var(--surface)}
.card.feature h4{font-size:16px;color:var(--accentDeep)}
.card.feature .cd{font-size:12.5px}
.card.feature .req{display:inline-block;margin-bottom:6px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:4px;padding:2px 8px}
</style></head><body>

<div class="lbl">Feature — 데이터 등록 (시스템 출발점)</div>
<div class="cards one">
  <a class="card feature"><span class="req">시작점</span><h4>STEP 1 · 데이터 등록</h4><div class="cd">엠클릭 엑셀을 업로드해 그 달 행사·명단을 Supabase에 동기화합니다.</div><span class="go">열기</span></a>
</div>

<div class="lbl">기본 / 인쇄 / 준비중</div>
<div class="cards">
  <a class="card"><span class="step">ROOM</span><h4>방배정</h4><div class="cd">자동배정·타임라인·분할 체류 관리.</div><span class="go">열기</span></a>
  <a class="card print"><span class="step">PRINT</span><h4>라벨 인쇄 (네임택)</h4><div class="cd">Askul 24면 라벨, 개인 1명당 1장.</div><span class="go">열기</span></a>
  <a class="card print"><span class="step">PRINT</span><h4>夕食オーダー</h4><div class="cd">날짜별 식수 자동집계 A3 인쇄.</div><span class="go">열기</span></a>
  <a class="card soon"><span class="badge">준비중</span><span class="step">GOLF</span><h4>ゴルフ組合せ表</h4><div class="cd">조 편성 표.</div></a>
</div>
</body></html>
