name: CI

# 모든 push / PR 에서 문법 검사 + 단위 테스트를 실행해 깨진 코드가
# main(=GitHub Pages 프로덕션)에 들어가는 것을 막는다.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 외부 의존성 0 (노드 빌트인만 사용) → npm install 불필요
      - name: 인라인 스크립트 문법 검사
        run: node scripts/check-syntax.mjs

      - name: 단위 테스트 (saizen-core)
        run: node --test "tests/**/*.test.mjs"
