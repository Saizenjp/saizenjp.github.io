name: CI

# 모든 push / PR 에서 npm run verify 와 같은 검사(정적 검사 4종 + 단위 테스트)를 돌려 실패를 알린다.
# ⚠ main 에 바로 push 하는 지금 방식에서는 이 검사가 진입을 막지 못한다 — GitHub Pages 배포
#    (pages-build-deployment)는 이 워크플로를 기다리지 않고 push 와 함께 시작하므로, 여기서 실패가
#    뜨면 이미 배포된 뒤다. 배포 전 검사는 push 하기 전에 로컬에서 `npm run verify`.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 외부 의존성 0 (노드 빌트인만 사용) → npm install 불필요
      # 추적 파일 검사를 맨 앞에 둔다 — 앞 단계가 실패하면 뒤 단계는 돌지 않는데, 이 검사의 실패가 가장 급하다.
      - name: 추적 파일 검사 (check-tracked) — 데이터 파일·비밀값
        run: node scripts/check-tracked.mjs

      - name: 문법·정적 검사 (check-syntax)
        run: node scripts/check-syntax.mjs

      - name: 단위 테스트 (saizen-core · 검사 스크립트)
        run: node --test

      - name: 언어 전환 검사 (check-i18n)
        run: node scripts/check-i18n.mjs

      - name: 대기 예약 제외 검사 (check-wait)
        run: node scripts/check-wait.mjs
