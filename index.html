<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>Yamanami 운영 관리 시스템</title>
<!-- JS 꺼져 있어도 0.5초 뒤 이동 (해시·쿼리는 JS가 보존) -->
<meta http-equiv="refresh" content="0.5; url=./ops/">
<link rel="canonical" href="./ops/">
<style>
  :root{ --accent:#3d5424; --accent2:#9a7322; --text:#1f2a18; --text2:#566049;
         --bg:#eef1ea; --surface:#fff; --border:#d6dccb; --accentSoft:#e4ecd9; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(180deg,#f2f5ec 0%,var(--bg) 300px),var(--bg);
    color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .box{
    text-align:center;background:var(--surface);border:1px solid var(--border);
    border-top:4px solid var(--accent);border-radius:14px;padding:38px 44px;
    box-shadow:0 4px 18px rgba(44,61,25,.08);
  }
  h1{font-size:24px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
  .sub{font-size:13px;color:var(--text2);font-weight:600;margin-top:4px}
  .msg{font-size:13px;color:var(--text2);margin-top:18px}
  .spin{
    margin:16px auto 0;width:26px;height:26px;border:3px solid var(--accentSoft);
    border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite;
  }
  @keyframes r{to{transform:rotate(360deg)}}
  a.go{
    display:inline-block;margin-top:18px;font-size:13px;font-weight:700;text-decoration:none;
    color:#fff;background:var(--accent);border-radius:8px;padding:9px 20px;
  }
  a.go:hover{background:#2c3d19}
</style>
</head>
<body>
  <div class="box">
    <h1>SaiZen</h1>
    <div class="sub">Yamanami 運営管理システム · 운영 관리 시스템</div>
    <div class="spin"></div>
    <div class="msg">운영 시스템으로 이동합니다…</div>
    <a class="go" href="./ops/">바로 이동</a>
  </div>
  <script>
    // meta refresh 백업: 즉시 이동.
    // ⚠ 초대/비번재설정 링크는 #access_token=…&type=invite (또는 ?code=) 를 달고
    //    루트로 들어올 수 있다 → 해시·쿼리를 버리면 /ops/에서 비번설정 팝업이 못 뜬다.
    //    그래서 search+hash 를 그대로 이어붙여 넘긴다.
    location.replace('./ops/' + location.search + location.hash);
  </script>
</body>
</html>
