<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#647548">
<link rel="icon" type="image/svg+xml" href="/assets/logo-saizen-vertical.svg">
<title>페이지를 찾을 수 없습니다 · SaiZen Yamanami</title>
<style>
  :root{ --accent:#647548; --text:#1f2a18; --text2:#566049;
         --bg:#eef1ea; --surface:#fff; --border:#d6dccb; --accentSoft:#e4ecd9; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(180deg,#f2f5ec 0%,var(--bg) 300px),var(--bg);
    color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .box{
    text-align:center;background:var(--surface);border:1px solid var(--border);
    border-top:4px solid var(--accent);border-radius:14px;padding:40px 44px;max-width:420px;
    box-shadow:0 4px 18px rgba(44,61,25,.08);
  }
  .code{font-size:46px;font-weight:800;color:var(--accent);letter-spacing:-.02em;line-height:1}
  h1{font-size:18px;font-weight:800;margin-top:10px}
  .msg{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.7}
  a.go{
    display:inline-block;margin-top:22px;font-size:13px;font-weight:700;text-decoration:none;
    color:#fff;background:var(--accent);border-radius:8px;padding:10px 22px;
  }
  a.go:hover{background:#525f3a}
  .foot{margin-top:24px;font-size:10px;color:#9aa392;opacity:.7}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <div class="msg">주소가 바뀌었거나 존재하지 않는 페이지입니다.<br>운영 시스템 홈으로 이동해 주세요.</div>
    <a class="go" href="/ops/">운영 시스템으로</a>
    <div class="foot">본 사이트는 메리트투어가 제작·제공합니다 · © 2026 Merit Tour · SaiZen</div>
  </div>
</body>
</html>
