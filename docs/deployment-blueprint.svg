    <text x="62" y="822" fill="#cfe0f5" font-size="11.5">★ 프론트(로비)=배정 「조회」+정산만 / 방배정 「작업」=백오피스. 손님 표시 태블릿=읽기전용(키오스크).</text>
    <text x="62" y="846" fill="#ffd27f" font-size="11.5">⚠ 확정 필요: 정산 레인 2/3 · POS 매장 수 · 바 KDS 별도여부 · WiFi 건물수(AP) · 위성 리셉션 · iPad/Galaxy</text>
