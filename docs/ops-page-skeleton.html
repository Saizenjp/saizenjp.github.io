<!DOCTYPE html>
<html lang="ja">
<!-- ============================================================================
  표준 ops 페이지 골격 (새 페이지는 이 파일을 복사해 시작)
  ----------------------------------------------------------------------------
  ⚠ 공통 chrome(.topbar/.step/.pill/.conn/.hint/.btn 변형/.inp 변형/#toast)은
    saizen-ops.css 에 없고 "각 페이지 inline" 으로 들어간다. 빠뜨리면 그 페이지만
    통일성이 깨진다(실제로 재고 페이지에서 toast→.step→.btn 변형이 순차 누락됨).
    → 아래 <style> 의 ‘공통 chrome’ 구획을 통째로 유지한 채 페이지 전용 스타일만 추가.
  ⚠ 로드 순서: <style>(inline) → <link saizen-ops.css>  (이 순서 유지).
  ⚠ 권한 게이트가 필요하면 <body data-so-area="step1|room|settle|pos|kitchen|menu|notes|admin">.
============================================================================ -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · (페이지명)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── 공통 chrome (전 ops 페이지 공유 정본 — 수정 금지, 통째 복사) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);
    padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.xs{font-size:12px;padding:3px 9px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 스타일은 여기부터 ── */
  main{padding:16px 20px 60px;max-width:1280px;margin:0 auto}
</style>
<link rel="stylesheet" href="../assets/saizen-ops.css?v=14.66">
</head>
<body><!-- 권한 게이트 필요 시: <body data-so-area="..."> -->
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム"><img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen"></a>
  <span class="step">STEP · (페이지명) / (日本語)</span>
  <a class="navhome" href="../index.html" data-i18n="navHome">← 현장 운영</a>
  <div class="grow so-spacer"></div>
  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>
    </div>
    <button class="so-furi" id="so-furi" onclick="__so_toggleFuri()"></button>
  </div>
  <span class="pill" id="conn-state">미연결</span>
</div>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">
  <input class="inp" id="sb-key" type="password" placeholder="publishable key" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button">연결</button>
  <span class="hint">연결 정보는 이 브라우저에만 저장됩니다.</span>
</div>

<main>
  <!-- 페이지 본문 -->
</main>

<div id="toast"></div>

<script src="../assets/saizen-ops.js?v=14.66"></script>
<script>
const $=s=>document.querySelector(s);
let supa=null;
function setConn(t,c){ const e=$('#conn-state'); if(e){ e.textContent=t; e.className='pill'+(c?' '+c:''); } }
function toast(msg,cls){ const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:''); t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); },2400); }
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn('URL·key 필요','err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.textContent='연결 중…'; btn.classList.remove('connected');
  try{
    supa=window.supabase.createClient(url,key);
    const { error }=await supa.from('bookings').select('event_seq',{count:'exact',head:true});
    if(error) throw error;
    setConn('연결됨','ok'); toast('Supabase 연결됨','ok');
    btn.textContent='✓ 연결됨'; btn.classList.add('connected'); btn.disabled=false;
    /* await load(); */
  }catch(e){
    setConn('연결 실패','err'); toast('연결 실패: '+e.message,'err');
    btn.textContent='연결 실패 · 재시도'; btn.classList.remove('connected'); btn.disabled=false; supa=null;
  }
}
$('#btn-connect').addEventListener('click',connect);
loadCreds();
if($('#sb-url').value && $('#sb-key').value) connect();
</script>
</body>
</html>
