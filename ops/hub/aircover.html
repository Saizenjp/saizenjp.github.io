<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1000px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .prev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px}
  .prev-card{border:2px solid var(--border);border-radius:8px;padding:9px 11px;background:var(--surface2)}
  .prev-tag{font-size:20px;font-weight:800;font-family:Arial,sans-serif;line-height:1;text-align:center;padding:3px 2px}
  .prev-hero{font-size:13px;font-weight:800;text-align:center;margin:5px 0;color:#1a2540}
  .prev-line{font-size:11px;font-family:var(--mono);color:var(--text2);line-height:1.5}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>

    emptyConnect:'연결 후 표시됩니다.',

    preview:'미리보기', printTarget:'출력 대상', prevUseBtn:'실제 크기는 위 「航空カバー 미리보기」 버튼으로 확인하세요.', loading:'불러오는 중…', noMonthData:'해당 월 데이터 없음', loadFail:'로드 실패',

    preview:'Preview', printTarget:'Print list', prevUseBtn:'Check actual size with the “Air-cover preview” button above.', loading:'Loading…', noMonthData:'No data for this month', loadFail:'Load failed',
    teamUnit:' teams', noTeams:'No teams to display.',
    previewNote:(n)=>`※ Preview up to 90 teams · Print covers all ${n} teams`,
    noTeamsPrint:'No teams to print', popupBlocked:'Popup blocked — please allow' }
};
function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function accomL(a){ return (window.SZCore&&SZCore.accomLabel)?SZCore.accomLabel(a,lang()):(a||''); }   // 숙소·구역 표시 라벨(ja/ko/en) = saizen-core 단일 진실원
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }
let supa=null, YM=null, CARDS=[], ORIGIN='all', SELDATES=new Set(), SELACCOMS=new Set();
const ACCOM_ORDER=['간지호텔','시즈노야도 료칸','쿠주힐즈','야마나미리조트'];
const FLIGHT_TIMES={'TW287':'09:25 着','ZE967':'13:25 着','TW288':'10:25 発','ZE968':'14:30 発'};
const ACCOM_COLOR=SZCore.ACCOM_COLOR;   // 세 인쇄물 공통(saizen-core)
const ACCOM_LABEL={Y:'YAMANAMI',K:'KUJU HILLS',G:'GUERNSEY',S:'SHIZUNOYADO'};
const PORT_COLOR={ICN:'#1A4D8F',PUS:'#B0574F'};   // 출발지 색: 인천=파랑 / 부산=차분한 벽돌색(강한 빨강 회피)
const portColor=p=>PORT_COLOR[p]||'#1a2540';
//  출발지 일본어 = saizen-core 의 'city' 형식(현장 손글씨와 같은 釜山/ソウル). 매핑은 core 한 곳.
const PORT_JP=new Proxy({},{get:(_,k)=>SZCore.airportLabel(String(k),'city')});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function mmdd(d){if(!d)return '-';const m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}`:String(d);}
function accomPfx(g){ if(g.accom_prefix) return g.accom_prefix; const a=g.accom||''; if(a.includes('쿠주'))return 'K'; if(a.includes('간지')||a.includes('ガーン'))return 'G'; if(a.includes('시즈'))return 'S'; return 'Y'; }
// 항공편 코드로 출발지 보정 (ZE=부산, TW=인천)
function portOf(inFlight,outFlight,origin){ return SZCore.originPort(origin, inFlight||outFlight); }  // PUS/ICN = saizen-core 단일 진실원(ZE/TW·부산/김해)

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML=`<div class="panel"><div class="deny">${tx('loginNeeded')}<small>${tx('loginHint')}</small></div></div>`; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;
    YM=YM||thisYM();
    renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connRetryBtn');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

function renderUI(){
  $('#content').innerHTML=`
    <div class="panel">
      <h3 id="t-monthfilter">${tx('monthFilter')}</h3>
      <div class="row">
        <div class="ymctrl">
          <button class="btn sm ghost" id="ym-prev" type="button">◀</button>
          <b id="ym-label"></b>
          <button class="btn sm ghost" id="ym-next" type="button">▶</button>
        </div>
        <span style="width:1px;height:20px;background:var(--border)"></span>
        <span class="cnt" id="t-origin">${tx('origin')}</span>
        <div class="chip on" data-o="all">${tx('all')}</div>
        <div class="chip" data-o="icn">ICN(인천)</div>
        <div class="chip" data-o="pus">PUS(부산)</div>
        <span style="flex:1"></span>
        <span class="cnt" id="stat"></span>
        <button class="btn" id="btn-print" type="button" disabled>${tx('print')}</button>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="cnt" id="t-datelbl" style="min-width:46px">${tx('dateLbl')}</span>
        <div id="daychips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="cnt" id="t-accomlbl" style="min-width:46px">${tx('accomLbl')}</span>
        <div id="accomchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="desc" id="t-carddesc" style="margin-top:10px">${tx('cardDesc')}</div>
    </div>
    <div class="panel">
      <h3><span id="t-preview">${tx('printTarget')}</span> <span class="cnt" id="prev-cnt"></span></h3>
      <div id="prev"></div>
    </div>`;
  $('#ym-prev').addEventListener('click',()=>{YM=shiftYM(YM,-1);load();});
  $('#ym-next').addEventListener('click',()=>{YM=shiftYM(YM,1);load();});
  $('#btn-print').addEventListener('click',printCards);
  document.querySelectorAll('.chip[data-o]').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('.chip[data-o]').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); ORIGIN=c.dataset.o; renderPreview();
  }));
}
function renderDayChips(){
  const dates=[...new Set(CARDS.map(c=>c.depRaw).filter(Boolean))].sort();
  const box=$('#daychips'); if(!box) return;
  box.innerHTML=`<div class="chip ${SELDATES.size===0?'on':''}" data-d="__all">${tx('all')}</div>`
    + dates.map(d=>`<div class="chip ${SELDATES.has(d)?'on':''}" data-d="${d}">${SZCore.mdWd(d,lang())}</div>`).join('');
  box.querySelectorAll('.chip[data-d]').forEach(c=>c.addEventListener('click',()=>{
    const d=c.dataset.d; if(d==='__all'){SELDATES.clear();}else{SELDATES.has(d)?SELDATES.delete(d):SELDATES.add(d);}
    renderDayChips(); renderPreview();
  }));
}
function renderAccomChips(){
  const accoms=[...new Set(CARDS.map(c=>c.accom).filter(Boolean))]
    .sort((a,b)=>{const ai=ACCOM_ORDER.indexOf(a),bi=ACCOM_ORDER.indexOf(b);return (ai<0?9:ai)-(bi<0?9:bi);});
  const box=$('#accomchips'); if(!box) return;
  box.innerHTML=`<div class="chip ${SELACCOMS.size===0?'on':''}" data-a="__all">${tx('all')}</div>`
    + accoms.map(a=>`<div class="chip ${SELACCOMS.has(a)?'on':''}" data-a="${esc(a)}">${esc(accomL(a))}</div>`).join('');
  box.querySelectorAll('.chip[data-a]').forEach(c=>c.addEventListener('click',()=>{
    const a=c.dataset.a; if(a==='__all'){SELACCOMS.clear();}else{SELACCOMS.has(a)?SELACCOMS.delete(a):SELACCOMS.add(a);}
    renderAccomChips(); renderPreview();
  }));
}

async function load(){
  if(!supa) return;
  $('#ym-label').textContent=YM; $('#stat').textContent=tx('loading'); $('#btn-print').disabled=true;
  try{
    const {data:gs,error:e1}=await supa.from('guests')
      .select('event_seq,group_code,accom,accom_prefix,pax,bookings!inner(rep_name,dep_date,arr_date,origin,pax,session_ym)')
      .eq('session_ym',YM);
    if(e1) throw e1;
    const gmap={}; (gs||[]).forEach(g=>{ const b=g.bookings||{}; gmap[g.event_seq]={accom:g.accom,accom_prefix:g.accom_prefix,pax:g.pax||b.pax||0,dep:b.dep_date,arr:b.arr_date,origin:b.origin}; });
    const seqs=Object.keys(gmap).map(Number);
    if(!seqs.length){ CARDS=[]; $('#stat').textContent=tx('noMonthData'); SELDATES.clear();SELACCOMS.clear(); renderDayChips();renderAccomChips();renderPreview(); return; }
    // 대표(guest_members is_rep || 최소 seq) + 항공편(passengers)
    const reps={};
    for(let i=0;i<seqs.length;i+=200){
      const chunk=seqs.slice(i,i+200); let pg=0;
      for(;;){
        const {data,error}=await supa.from('guest_members')
          .select('event_seq,person_tag,is_rep,seq_in_team,passengers(dep_flight,ret_flight)')
          .in('event_seq',chunk).order('event_seq').order('seq_in_team').range(pg,pg+999);
        if(error) throw error;
        (data||[]).forEach(m=>{
          const cur=reps[m.event_seq];
          const curSeq=cur?(cur._seq==null?99:cur._seq):99;
          // 이미 is_rep로 확정된 대표는 비대표가 덮어쓰지 못함
          if(!cur || (m.is_rep && curSeq!==0) || (!m.is_rep && curSeq!==0 && (m.seq_in_team||99)<curSeq)){
            reps[m.event_seq]={tag:m.person_tag||'',_seq:m.is_rep?0:(m.seq_in_team||99),
              dep_flight:(m.passengers||{}).dep_flight||'',ret_flight:(m.passengers||{}).ret_flight||''};
          }
        });
        if(!data||data.length<1000) break; pg+=1000;
      }
    }
    // 묶음(대표 지정) 통일 태그용 print_overrides
    const OVR={};
    for(let i=0;i<seqs.length;i+=400){ const chunk=seqs.slice(i,i+400);
      const {data:ov}=await supa.from('print_overrides').select('event_seq,team_group,team_group_rep').in('event_seq',chunk);
      (ov||[]).forEach(o=>{ OVR[o.event_seq]=o; });
    }
    // ── 묶음 전원(달 무관) ─────────────────────────────────────────────────
    //  ⚠ 이 화면은 session_ym 한 달만 읽는데 手配書는 기간(월 경계 포함)으로 읽는다.
    //     묶음 상대가 다른 달이면 예전엔 (list.length<2 · 대표 부재)로 통일코드를 못 붙였고,
    //     일부만 로드되면 번호까지 어긋났다(手配書 S3 ↔ 航空カバー S2).
    //     → 그룹 전원을 달과 무관하게 조회해 手配書와 같은 코드·순번을 쓴다.
    const GRPALL={};
    try{
      const gkeys=[...new Set(seqs.map(s2=>(OVR[s2]||{}).team_group).filter(Boolean))];
      if(gkeys.length){
        const {data:allOv}=await supa.from('print_overrides')
          .select('event_seq,team_group,team_group_rep,team_group_seq').in('team_group',gkeys);
        const ovRows=allOv||[];
        const need=[...new Set(ovRows.map(r=>r.event_seq))].filter(s2=>!gmap[s2]);
        const ext={};
        for(let i=0;i<need.length;i+=200){ const ch=need.slice(i,i+200);
          const {data:g2}=await supa.from('guests').select('event_seq,group_code,pax,bookings!inner(dep_date,pax)').in('event_seq',ch);
          (g2||[]).forEach(g=>{ const b=g.bookings||{}; ext[g.event_seq]={dep:b.dep_date||'', tag:g.group_code||'', pax:g.pax||b.pax||0}; });
          const {data:m2}=await supa.from('guest_members').select('event_seq,person_tag,seq_in_team').in('event_seq',ch).order('seq_in_team');
          (m2||[]).forEach(m=>{ const e=ext[m.event_seq]; if(e&&!e.ptag&&m.person_tag) e.ptag=m.person_tag; });
        }
        const strip=t=>(window.SZCore&&SZCore.tagStripSeq)?SZCore.tagStripSeq(t||''):(t||'');
        const _seen=new Set();
        ovRows.forEach(r=>{
          const _k=r.team_group+'|'+r.event_seq; if(_seen.has(_k)) return; _seen.add(_k);   // 중복=번호 2,4,6 밀림
          const loaded=gmap[r.event_seq], e=ext[r.event_seq]||{};
          (GRPALL[r.team_group]=GRPALL[r.team_group]||[]).push({
            seq:String(r.event_seq), rep:!!r.team_group_rep,
            gseq:(r.team_group_seq==null?null:r.team_group_seq),
            dep: loaded? (loaded.dep||'') : (e.dep||''),
            pax: loaded? (loaded.pax||0) : (e.pax||0),
            tag: loaded? '' : strip(e.ptag||e.tag||'')      // 로드된 팀 태그는 아래에서 카드로 채움
          });
        });
      }
    }catch(e){ console.warn('묶음 전원 조회 실패:',e.message); }

    CARDS=seqs.map(seq=>{
      const g=gmap[seq]||{}; const r=reps[seq]||{};
      // 태그코드는 step1 데이터(person_tag/group_code) 기준 — 수정 불가.
      // 대표만 나오는 출력이라 개인순번 숫자는 빼고 숙소 문자(Y/K/G/S)만 남김("DAあ-1Y"→"DAあ-Y").
      const tag=(window.SZCore&&SZCore.tagStripSeq)?SZCore.tagStripSeq(r.tag||g.group_code||''):(r.tag||g.group_code||'');
      // /app/ 동일: 태그코드 마지막 글자(Y/K/G/S)로 시설 판정, 없으면 accom_prefix 폴백
      const last=tag.slice(-1); const pfx=ACCOM_COLOR[last]?last:accomPfx(g);
      const inF=r.dep_flight||''; const outF=r.ret_flight||'';
      const pax=g.pax||0;
      return {
        seq:String(seq), tag:tag, accom:g.accom||'', accomColor:ACCOM_COLOR[pfx]||'#1A2540', accomLabel:ACCOM_LABEL[pfx]||(g.accom||''),
        from:portOf(inF,outF,g.origin), pax:pax,
        inFlight:inF||'-', inTime:FLIGHT_TIMES[inF]||'', inDate:mmdd(g.dep),
        outFlight:outF||'-', outTime:FLIGHT_TIMES[outF]||'', outDate:mmdd(g.arr),
        depRaw:g.dep||'', arrRaw:g.arr||'',
        numStart:1, numEnd:pax,                 // 番호 범위(단독=1〜pax, 묶음=연속 오프셋)
        grpBase:tag, grpNo:0,                    // 정렬용: 그룹 기준코드·팀번호
        sortDep:g.dep||'', sortFrom:'', sortAccom:g.accom||''   // 정렬 앵커(묶음은 대표 기준으로 대체)
      };
    }).filter(c=>c.tag);
    CARDS.forEach(c=>{ c.sortFrom=c.from; });   // 기본 앵커 = 자기 값
    // 대표 지정 묶음: 표시 태그를 대표 기준코드+팀번호(DRな-Y1/Y2)로 통일 + 묶은 팀은 대표 시설색·라벨로 통일.
    //   (한 팀이 2개 예약으로 나뉜 걸 하나로 합친 것이므로 대표 기준으로 표기)
    if(window.SZCore&&SZCore.orderGroup&&SZCore.teamTagN){
      // 로드된 카드의 태그를 GRPALL 에 채운다(대표가 이 달에 있으면 그 값이 기준코드).
      Object.values(GRPALL).forEach(all=>all.forEach(x=>{
        if(x.tag) return;
        const c=CARDS.find(cc=>String(cc.seq)===x.seq); if(c) x.tag=c.tag;
      }));
      const merged=new Set();   // 한 장으로 합쳐져 사라지는 카드(seq)
      Object.keys(GRPALL).forEach(k=>{
        let all=GRPALL[k]; if(!all||all.length<2) return;                // 진짜 단독 = 번호 없음
        // 같은 태그코드를 쓰는 다른 시기 묶음이 합쳐지는 것 방지(순번 Y2/Y4/Y6 밀림)
        const _anchor=CARDS.find(c=>all.some(x=>x.seq===String(c.seq)));
        if(SZCore.clusterOf && _anchor){
          const cl=SZCore.clusterOf(all.map(x=>({...x,event_seq:x.seq})), String(_anchor.seq));
          if(cl && cl.length>=2) all=cl;
        }
        if(all.length<2) return;
        const allRep=all.find(x=>x.rep); if(!allRep) return;             // 대표 미지정(구 묶음) = 원래 태그 유지
        const base=allRep.tag; if(!base) return;
        const list=CARDS.filter(c=>all.some(x=>x.seq===String(c.seq))); // 이 달에 있는 카드만
        if(!list.length) return;
        const anchor=list.find(c=>String(c.seq)===allRep.seq)||list[0];
        const repColor=anchor.accomColor, repLabel=anchor.accomLabel;
        // 순서 = 手配書와 동일: 수동 순번 전원 지정 시 그 순서, 아니면 orderGroup(대표먼저→dep→seq)
        const hasManual=all.every(x=>x.gseq!=null);
        const ordered=hasManual
          ? all.slice().sort((a,b)=>(a.gseq-b.gseq)||(Number(a.seq)-Number(b.seq)))
          : SZCore.orderGroup(all.map(x=>({event_seq:x.seq,dep:x.dep})), allRep.seq)
                  .map(o=>all.find(x=>x.seq===String(o.event_seq))).filter(Boolean);
        // ── 완전 동일 판정(Min 2026-08) ────────────────────────────────────
        //  출국일·귀국일·출국편·귀국편·출발지가 전부 같고 + 그룹 전원이 이 달에 있을 때만
        //  1장으로 합친다(일부만 있으면 인원 합산이 틀어지므로 합치지 않는다).
        const sig=c=>[c.depRaw,c.arrRaw,c.inFlight,c.outFlight,c.from].join('|');
        if(list.length===all.length && list.length>1 && list.every(c=>sig(c)===sig(anchor))){
          const totPax=list.reduce((n,c)=>n+(c.pax||0),0);
          anchor.tag=base; anchor.pax=totPax; anchor.numStart=1; anchor.numEnd=totPax;
          anchor.accomColor=repColor; anchor.accomLabel=repLabel;
          anchor.mergedFrom=list.length;
          anchor.grpBase=base; anchor.grpNo=0;
          anchor.sortDep=anchor.depRaw; anchor.sortFrom=anchor.from; anchor.sortAccom=anchor.accom;
          list.forEach(c=>{ if(c!==anchor) merged.add(c.seq); });
          return;
        }
        // 番호는 '그룹 전원' 기준 연속(네임택 개인번호와 일치). 이 달에 없는 팀도 자리를 차지한다.
        let off=0;
        ordered.forEach((x,i)=>{
          const card=CARDS.find(c=>String(c.seq)===x.seq);
          const pax=card?(card.pax||0):(x.pax||0);
          if(card){
            card.tag=SZCore.teamTagN(base,i+1);                 // DRな-Y1 · DRな-Y2 …
            card.accomColor=repColor; card.accomLabel=repLabel;
            card.numStart=off+1; card.numEnd=off+pax;
            card.grpBase=base; card.grpNo=i+1;
            card.sortDep=anchor.depRaw; card.sortFrom=anchor.from; card.sortAccom=anchor.accom;
          }
          off+=pax;
        });
      });
      if(merged.size) CARDS=CARDS.filter(c=>!merged.has(c.seq));
    }
    SELDATES.clear(); SELACCOMS.clear();
    $('#stat').textContent=`${CARDS.length}${tx('teamUnit')}`;
    renderDayChips(); renderAccomChips(); renderPreview();
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFail')+': '+e.message,'err'); }
}

// 앵커(날짜→ICN/PUS→숙소→그룹코드) 기준 정렬 → 묶은 팀은 대표 앵커 공유로 인접, 그 안은 팀번호(Y1,Y2)순.
function sortCards(a,b){
  if(a.sortDep!==b.sortDep) return (a.sortDep||'').localeCompare(b.sortDep||'');
  if(a.sortFrom!==b.sortFrom) return a.sortFrom==='ICN'?-1:1;
  const ai=ACCOM_ORDER.indexOf(a.sortAccom), bi=ACCOM_ORDER.indexOf(b.sortAccom);
  if(ai!==bi) return (ai<0?9:ai)-(bi<0?9:bi);
  const cc=String(a.grpBase).localeCompare(String(b.grpBase));
  if(cc!==0) return cc;
  return (a.grpNo||0)-(b.grpNo||0);   // 같은 그룹: Y1 → Y2
}
function filtered(){
  return CARDS.filter(c=>{
    if(ORIGIN==='icn' && c.from!=='ICN') return false;
    if(ORIGIN==='pus' && c.from!=='PUS') return false;
    if(SELDATES.size && !SELDATES.has(c.depRaw)) return false;
    if(SELACCOMS.size && !SELACCOMS.has(c.accom)) return false;
    return true;
  }).sort(sortCards);
}
function renderPreview(){
  const list=filtered(); $('#btn-print').disabled=!list.length;
  $('#prev-cnt').textContent=list.length?`(${list.length}${tx('teamUnit')})`:'';
  const box=$('#prev');
  if(!list.length){ box.innerHTML=`<div class="cnt" style="color:var(--muted);padding:10px 0">${tx('noTeams')}</div>`; return; }
  // 축소 미리보기(실제 인쇄와 크기 다름) 제거 — 실제 크기는 「미리보기」 버튼으로. 팀 수만 표기.
  box.innerHTML=`<div class="cnt" style="color:var(--text2);padding:6px 0">${esc(tx('prevUseBtn'))}</div>`;
}

// 施設 라벨 길이에 따라 폰트 자동 축소 — 긴 이름(SHIZUNOYADO·KUJU HILLS·한글 폴백) 넘침 방지.
// 태그코드 글자수에 맞춰 자동 축소 — A5 세로는 폭이 138mm뿐이라 한 줄을 넘기지 않게.
function acTagSize(tag){
  const n=String(tag||'').length;
  if(n<=4) return '112pt'; if(n===5) return '100pt'; if(n===6) return '88pt';
  if(n===7) return '76pt'; if(n===8) return '66pt'; return '56pt';
}
// A5 세로 카드 1장/팀 인쇄(Min 2026-08 — 가로에서 세로로 전환)

  //   ③ 기간 ④ 番·名. 골프백에 붙일 때 위·아래를 테이프로 감으므로, 출발지를 가운데로 내렸다.
  //  항공편·시각은 보조 정보라 아래에 작게. 그 우선순위 그대로 배치한다.
  const card=c=>`<div class="ac-page"><div class="ac-card">

    </div></div>
    <div class="ac-span">${esc(c.inDate)}<span class="ac-span-dash">–</span>${esc(c.outDate)}</div>
    <div class="ac-nums"><div class="ac-nums-in">
      <div class="ac-hero-no">${c.numStart}〜${c.numEnd}<span class="ac-han">番</span></div>
      <div class="ac-hero-pax"><span class="ac-pax-num">${c.pax}</span><span class="ac-han">名</span></div>
    </div></div>
    <div class="ac-info">
      <div class="ac-row"><div class="ac-label">入　 国</div><div class="ac-value ac-fline"><b class="ac-flight">${esc(c.inFlight)}</b><span class="ac-time">${esc(c.inTime)}</span></div></div>
      <div class="ac-row ac-row-last"><div class="ac-label">帰　 国</div><div class="ac-value ac-fline"><b class="ac-flight">${esc(c.outFlight)}</b><span class="ac-time">${esc(c.outTime)}</span></div></div>
    </div>
  </div></div>`;
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>航空カバー置き場 印刷 — ${YM}</title>

  :root{--acline:.75pt solid #e6eaee}

  .ac-toolbar button{padding:8px 20px;background:#15803D;color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer}
  .ac-toolbar .ac-close{background:#999}.ac-container{padding:20px}
  .ac-page{width:138mm;height:200mm;margin:0 auto 20px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);page-break-after:always;break-inside:avoid;display:flex}
  .ac-page:last-child{page-break-after:auto}

  .ac-tag{font-weight:800;text-align:center;font-family:'Arial Black','Arial','Meiryo',sans-serif;letter-spacing:3pt;line-height:1.1;display:flex;align-items:center;justify-content:center;border-bottom:var(--acline);white-space:nowrap;overflow:hidden;padding:0 3mm}

        맨 위 칸이 가려진다). 크기는 중간(30pt) — 멀리서도 읽히되 태그·번호를 가리지 않게. */

  @media print{html,body{background:#fff}.ac-toolbar{display:none}.ac-container{padding:0}.ac-page{margin:0 auto;box-shadow:none}}
  </style></head><body>
  <script>
  // 각 줄을 칸 폭에 맞춰 자동 축소 — 같은 글자수여도 조합(영문·가나·기호·자릿수)마다
  //  폭이 달라 계산식만으론 부정확하다. 실제로 재서 들어갈 때까지 1pt씩 줄인다.
  //  줄 기준 폰트(em) 구조라 줄 하나만 줄이면 그 줄 전체가 같이 줄어든다.
  var AC_ROWS=[['.ac-tag',null],['.ac-port','.ac-port-in'],['.ac-span',null],['.ac-nums','.ac-nums-in']];
  function acFitTags(){
    document.querySelectorAll('.ac-card').forEach(function(card){
      AC_ROWS.forEach(function(r){
        var box=card.querySelector(r[0]); if(!box) return;
        var inner=r[1]?box.querySelector(r[1]):box; if(!inner) return;
        var pt=parseFloat(getComputedStyle(box).fontSize)/(96/72);
        for(var i=0;i<90 && inner.scrollWidth>box.clientWidth; i++){ pt-=1; box.style.fontSize=pt+'pt'; }
      });
    });
  }
  window.addEventListener('load',acFitTags);
  window.addEventListener('beforeprint',acFitTags);
  <\/script>
  <div class="ac-toolbar"><h1>航空カバー置き場 인쇄 미리보기</h1>
    <div class="meta">A5 세로 · 1팀/장 · ${list.length}장 · ${YM}<br><b style="color:#c0392b">⚠ 용지 A5, 배율 "실제 크기(100%)"</b></div>
    <div style="flex:1"></div><button onclick="window.print()">🖨 ${lang()==='ja'?'印刷':lang()==='en'?'Print':'인쇄'}</button><button class="ac-close" onclick="window.close()">✕ ${lang()==='ja'?'閉じる':lang()==='en'?'Close':'닫기'}</button>
  </div>
  <div class="ac-container">${list.map(card).join('')}</div>
  </body></html>`;
  const w=window.open('','_blank','width=1100,height=900'); if(!w){ toast(tx('popupBlocked'),'err'); return; }
  w.document.write(html); w.document.close();
}

function applyStatic(){
  { const hm=document.getElementById('t-home'); if(hm) hm.textContent=(lang()==='ja'?'← ホーム':(lang()==='en'?'← Home':'← 홈')); }
  const s=$('#t-step'); if(s) s.textContent=tx('step');
  const h=$('#t-connhint'); if(h) h.textContent=tx('connHint');
  const e=$('#t-empty'); if(e) e.textContent=tx('emptyConnect');
  // 미연결 상태(아직 setConn 호출 전)일 때만 기본 pill 라벨 갱신
  const p=$('#conn-state'); if(p && (!p.className.includes('ok')&&!p.className.includes('err'))) p.textContent=tx('notConn');
  // renderUI로 만들어진 정적 라벨(접속 후에만 존재)
  const mf=$('#t-monthfilter'); if(mf) mf.textContent=tx('monthFilter');
  const og=$('#t-origin'); if(og) og.textContent=tx('origin');
  const dl=$('#t-datelbl'); if(dl) dl.textContent=tx('dateLbl');
  const al=$('#t-accomlbl'); if(al) al.textContent=tx('accomLbl');
  const cd=$('#t-carddesc'); if(cd) cd.innerHTML=tx('cardDesc');
  const pv=$('#t-preview'); if(pv) pv.textContent=tx('printTarget');
  const bp=$('#btn-print'); if(bp) bp.textContent=tx('print');
  const bc=$('#btn-connect'); if(bc && !bc.disabled){
    if(supa) bc.textContent=tx('connectedBtn'); else bc.textContent=tx('connect');
  }
}
// 언어 토글 시 정적 라벨 + 화면 미리보기만 재렌더(인쇄 산출물 미변경)
window.onSaizenLangChange=function(){ applyStatic(); if(supa){ renderDayChips(); renderAccomChips(); renderPreview(); } };

applyStatic();
$('#btn-connect').addEventListener('click',connect);
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }
</script>
