<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yamanami 운영 관리 · 경영 통계</title>

<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --blue:#2c5078;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}

  .ctrlbar{padding:11px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .ctrlbar label{font-size:12px;color:var(--text2);font-weight:700}
  .chip{font-size:12px;font-weight:700;padding:6px 13px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{padding:16px 20px 80px;max-width:1240px;margin:0 auto}
  .rangelbl{font-size:12.5px;color:var(--text2);font-weight:700;margin:2px 0 12px}
  .rangelbl b{color:var(--accent)}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:8px}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
  .kpi .l{font-size:11px;color:var(--text2);font-weight:700}
  .kpi .v{font-size:21px;font-weight:800;color:var(--accent);font-family:var(--mono);margin-top:3px;letter-spacing:-.02em}
  .kpi .v small{font-size:12px;color:var(--text2);font-weight:700;font-family:inherit}
  .kpi .sub{font-size:10.5px;color:var(--muted);margin-top:2px}
  .kpi.rev .v{color:var(--accent2)} .kpi.occ .v{color:var(--blue)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 17px}
  .panel h3{font-size:13.5px;font-weight:800;color:var(--accent);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .panel h3 .c{font-size:11px;color:var(--muted);font-weight:700;margin-left:auto}
  table.t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.t th,table.t td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
  table.t th:first-child,table.t td:first-child{text-align:left}
  table.t th{font-size:11px;color:var(--text2);font-weight:700;background:var(--surface2)}
  table.t td.mono{font-family:var(--mono);font-weight:700}
  .barrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
  .barrow .bl{width:62px;flex:none;font-weight:700;color:var(--text2);font-family:var(--mono)}
  .barrow .bt{flex:1;background:var(--surface3);border-radius:5px;height:20px;position:relative;overflow:hidden}
  .barrow .bf{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
  .barrow .bf.rev{background:var(--accent2)}
  .barrow .bv{width:140px;flex:none;text-align:right;font-family:var(--mono);font-weight:700;font-size:11.5px}
  .barrow .bv small{color:var(--muted);font-weight:600}
  .split{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--border);margin-top:6px}
  .split .seg{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-top:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
  .deny{padding:30px;text-align:center;color:var(--muted)}
  /* 📈 예약 추이 */
  .trhead{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:13px;padding:15px 18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
  .trhead .ym{font-size:20px;font-weight:800;color:var(--accent)}
  .trhead .big{font-size:26px;font-weight:800;font-family:var(--mono)}
  .trhead .big small{font-size:13px;color:var(--text2);font-weight:700;margin-left:3px}
  .trhead .dl{margin-left:auto;text-align:right}
  .trhead .dl .d{font-size:19px;font-weight:800;font-family:var(--mono)}
  .trhead .dl .c{font-size:11px;color:var(--muted);font-weight:700}
  .up{color:var(--ok)} .down{color:var(--err)}
  .trbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
  .trbar .lb{font-size:11.5px;font-weight:800;color:var(--text2);margin-right:2px}
  .chg{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .chg span{font-size:11.5px;font-weight:700;border:1px solid var(--border);border-radius:99px;padding:2px 9px;background:var(--surface2)}
  .chg span.a{border-color:var(--ok);color:var(--ok)}
  .chg span.r{border-color:var(--accent2);color:var(--accent2)}
  .chg span.c{border-color:var(--err);color:var(--err)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#2b2f27;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--err)} .toast.warn{background:var(--accent2)}
  /* 📅 캘린더 — 대표님 화면: 하루 = 한 칸, 진할수록 사람이 많다 */
  .calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .calbar b{font-family:var(--mono);font-size:16px;min-width:96px;text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{font-size:11px;font-weight:800;color:var(--text2);text-align:center;padding:2px 0}
  .cal .dow.sun{color:#b13b2c}.cal .dow.sat{color:#2c5078}
  .cell{border:1px solid var(--border);border-radius:9px;min-height:82px;padding:6px 8px;background:var(--surface);position:relative;text-decoration:none;color:inherit;display:block}
  .cell:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.09)}
  .cell.pad{background:transparent;border-color:transparent}
  .cell .dn{font-size:11.5px;font-weight:800;color:var(--text2)}
  .cell.sun .dn{color:#b13b2c}.cell.sat .dn{color:#2c5078}
  .cell.today{outline:2px solid var(--accent2);outline-offset:-2px}
  .cell .pv{font-size:20px;font-weight:800;font-family:var(--mono);line-height:1.15;margin-top:2px}
  .cell .pv .pu{font-size:10.5px;font-weight:700;font-family:var(--sans);color:var(--text2);margin-left:2px}
  .cell .io{font-size:10.5px;font-weight:700;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
  .cell .io .i{color:#2f7d4f}.cell .io .o{color:#8a5a12}
  .ylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .ycard{border:1px solid var(--border);border-radius:10px;padding:11px 13px;background:var(--surface);text-decoration:none;color:inherit;display:block}
  .ycard:hover{border-color:var(--accent)}
  .ycard .ym{font-family:var(--mono);font-weight:800;font-size:14px}
  .ycard .big{font-size:20px;font-weight:800;color:var(--accent);font-family:var(--mono)}
  .ycard .sub{font-size:11.5px;color:var(--text2);margin-top:2px}
  .ycard .bar{height:7px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-top:7px}
  .ycard .bar i{display:block;height:100%;background:var(--accent)}
</style>

<body data-so-area="stats">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム"><img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen"></a>
  <span class="step" id="t-step">경영 통계</span>
  <a class="navhome" href="../index.html" data-i18n="navHome">← 현장 운영</a>
  <div class="grow so-spacer"></div>
  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>
    </div>
  </div>
  <span class="pill" id="conn-state">미연결</span>
</div>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">
  <input class="inp" id="sb-key" type="password" placeholder="Publishable key" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button">연결</button>
  <span class="hint" id="t-connhint"></span>
</div>

<div class="ctrlbar">
  <label id="t-period">기간</label>
  <input class="inp" id="d-from" type="date" style="width:150px">
  <span style="color:var(--muted)">~</span>
  <input class="inp" id="d-to" type="date" style="width:150px">
  <button class="btn sm" id="btn-run" type="button">조회</button>
  <span style="width:8px"></span>
  <button class="chip" id="t-prevm" type="button">◀ 이전 달</button>
  <button class="chip" id="t-nextm" type="button">다음 달 ▶</button>
  <span style="width:8px"></span>
  <button class="chip" id="t-q1" data-q="thismonth" type="button">이번 달</button>
  <button class="chip" id="t-q2" data-q="thisyear" type="button">올해</button>
  <button class="chip" id="t-q3" data-q="lastyear" type="button">작년</button>
  <button class="chip" id="t-q4" data-q="last12" type="button">최근 12개월</button>
  <span style="flex:1"></span>
  <button class="chip on" id="v-sum" type="button">📊 요약</button>
  <button class="chip" id="v-cal" type="button">📅 캘린더</button><!-- 라벨은 applyStatic 이 언어별로 채운다 -->
  <button class="chip" id="v-trend" type="button">📈 예약 추이</button>
</div>

<main>
  <div class="rangelbl" id="rangelbl"></div>
  <div id="content"><div class="deny" id="t-empty">기간을 선택하고 「조회」를 누르세요.</div></div>
</main>

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
// 사전값이 함수(문구 안에 숫자가 들어가는 것)면 인자를 적용해 문자열로 돌려준다.
function tx(k,...a){ const d=L[lang()]||L.ja; const v=(d[k]!==undefined?d[k]:(L.ja[k]!==undefined?L.ja[k]:k));
  return typeof v==='function'?v(...a):v; }
// ⚠ 로컬 전용 키는 data-i18n 금지(saizen-ops 전역 t()가 키 문자열로 덮어씀 — CLAUDE.md §10).
//   id="t-..." 노드만 로컬 사전으로 채운다. navHome 등 전역 키만 data-i18n 사용.
function applyStatic(){
  $('#t-step').textContent=tx('step');
  $('#t-connhint').textContent=tx('connHint');
  $('#t-period').textContent=tx('period');
  $('#btn-run').textContent=tx('run');
  $('#t-prevm').textContent='◀ '+tx('prevMonth'); $('#t-nextm').textContent=tx('nextMonth')+' ▶';
  $('#t-q1').textContent=tx('qThisMonth'); $('#t-q2').textContent=tx('qThisYear');
  $('#t-q3').textContent=tx('qLastYear'); $('#t-q4').textContent=tx('qLast12');
  const emp=$('#t-empty'); if(emp) emp.textContent=tx('emptyHint');
  { const a=$('#v-sum'), b=$('#v-cal'), c=$('#v-trend');   // 뷰 토글 — 언어를 바꿔도 안 바뀌던 곳
    if(a) a.textContent='📊 '+tx('vSum'); if(b) b.textContent='📅 '+tx('vCal'); if(c) c.textContent='📈 '+tx('vTrend'); }
  if(!supa){ setConn(tx('connIdle')); $('#btn-connect').textContent=tx('connect'); }
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
function yen(n){return '¥'+Math.round(Number(n||0)).toLocaleString('ja-JP');}
function num(n){return Number(n||0).toLocaleString('ja-JP');}
function man(n){ n=Number(n||0); if(Math.abs(n)>=1e8) return (n/1e8).toFixed(2)+'億'; if(Math.abs(n)>=1e4) return Math.round(n/1e4).toLocaleString('ja-JP')+'万'; return num(n); }

// ── 기간 ──
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function setRange(f,t){ $('#d-from').value=f; $('#d-to').value=t; }
function quick(q){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  if(q==='thismonth'){ setRange(iso(new Date(y,m,1)), iso(new Date(y,m+1,0))); }
  else if(q==='thisyear'){ setRange(y+'-01-01', y+'-12-31'); }
  else if(q==='lastyear'){ setRange((y-1)+'-01-01', (y-1)+'-12-31'); }
  else if(q==='last12'){ setRange(iso(new Date(y,m-11,1)), iso(new Date(y,m+1,0))); }
  if(supa) run();
}
// ◀/▶ 월 이동: 현재 기간을 n개월 앞뒤로. from=이동 월 1일, to=이동 종료월 말일(단일 월=스텝, 여러 달=폭 유지).
function shiftMonths(n){
  const f=$('#d-from').value; if(!f) return;
  const t=$('#d-to').value||f;
  const [fy,fm]=f.split('-').map(Number), [ty,tm]=t.split('-').map(Number);
  const nf=new Date(fy,(fm-1)+n,1), nt=new Date(ty,(tm-1)+n+1,0);
  setRange(iso(nf), iso(nt));
  if(supa) run();
}

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('connFail'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.classList.add('connected');btn.disabled=false;
    if(!$('#d-from').value){ quick('thismonth'); } else { run(); }
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connect');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

async function run(){
  if(!supa){ toast(tx('connFail'),'warn'); return; }
  const f=$('#d-from').value, t=$('#d-to').value;
  if(!f||!t){ return; }
  $('#rangelbl').innerHTML=`<b>${esc(f)}</b> ~ <b>${esc(t)}</b>`;
  $('#content').innerHTML=`<div class="deny">${tx('loading')}</div>`;
  const {data,error}=await supa.rpc('exec_stats',{p_from:f,p_to:t});
  if(error){
    const msg=/권한|permission/i.test(error.message)?tx('noAuth'):(tx('loadFail')+': '+error.message);
    $('#content').innerHTML=`<div class="deny" style="color:var(--err)">${esc(msg)}</div>`; return;
  }
  DATA=data||{}; render();
}

function render(){
  const d=DATA||{}, tot=d.totals||{}, occ=d.occupancy||{};
  const months=d.months||[];
  const memTot=(d.members&&((d.members.member||0)+(d.members.nonmember||0)))||0;
  const memPct=memTot?Math.round((d.members.member||0)/memTot*100):0;
  //  가동률 = **예약 기준**(그 기간에 겹치는 밤만). 배정 기준은 아래 참고 줄에 따로 낸다 —
  //  예전엔 배정 기준 하나만 보여줘서 「예약이 얼마나 찼나」가 아니라
  //  「방배정을 얼마나 해뒀나」가 가동률로 나왔다(2026-09 실측에서 순위가 뒤집혔다).
  const occPct=(occ.avail>0)?Math.round((occ.occupied||0)/occ.avail*100):0;
  const asgPct=(occ.avail>0)?Math.round((occ.assigned||0)/occ.avail*100):0;
  // KPI
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="l">${tx('kInTeam')}</div><div class="v">${num(tot.teams)}<small>${tx('uTeam')}</small></div></div>
    <div class="kpi"><div class="l">${tx('kInPax')}</div><div class="v">${num(tot.pax)}<small>${tx('uPpl')}</small></div></div>
    <div class="kpi rev"><div class="l">${tx('kB2B')}</div><div class="v">${yen(tot.b2b)}</div><div class="sub">${man(tot.b2b)}</div></div>
    <div class="kpi rev"><div class="l">${tx('kOnsite')}</div><div class="v">${yen(tot.onsite)}</div><div class="sub">${man(tot.onsite)}${tot.onsite_future?' · '+tx('onsiteFuture', yen(tot.onsite_future)):''}</div></div>
    <div class="kpi occ"><div class="l">${tx('kOcc')}</div><div class="v">${occPct}<small>%</small></div><div class="sub">${num(occ.occupied)} / ${num(occ.avail)} · ${tx('occBook')}</div></div>
    <div class="kpi"><div class="l">${tx('kMember')}</div><div class="v">${memPct}<small>%</small></div><div class="sub">${tx('member')} ${num(d.members&&d.members.member)} · ${tx('nonmember')} ${num(d.members&&d.members.nonmember)}</div></div>
  </div>`;

  // 월별 추이 — pax / b2b / onsite 3 metric, bar by 선택. 여기선 pax+매출 동시.
  const maxPax=Math.max(1,...months.map(m=>m.pax||0));
  const maxRev=Math.max(1,...months.map(m=>(m.b2b||0)+(m.onsite||0)));
  const monthBars=months.map(m=>{
    const pw=Math.round((m.pax||0)/maxPax*100);
    const rev=(m.b2b||0)+(m.onsite||0); const rw=Math.round(rev/maxRev*100);
    return `<div style="margin-bottom:11px">
      <div class="barrow"><span class="bl">${esc(m.ym)}</span><span class="bt"><span class="bf" style="width:${pw}%"></span></span><span class="bv">${num(m.pax)} <small>${tx('uPpl')}</small></span></div>
      <div class="barrow"><span class="bl"></span><span class="bt"><span class="bf rev" style="width:${rw}%"></span></span><span class="bv">${man(rev)}</span></div>
    </div>`;
  }).join('') || `<div class="note">—</div>`;
  const monthPanel=`<div class="panel"><h3>${tx('perMonth')}<span class="c">${tx('mPax')} · ${tx('mB2B')}+${tx('mOnsite')}</span></h3>${monthBars}
    <div class="legend"><span><i style="background:var(--accent)"></i>${tx('mPax')}</span><span><i style="background:var(--accent2)"></i>${tx('mB2B')}+${tx('mOnsite')}</span></div></div>`;

  // 숙소별
  const accom=(d.by_accom||[]);
  const accomRows=accom.map(a=>`<tr><td>${esc(a.accom)}</td><td>${num(a.teams)}</td><td>${num(a.pax)}</td><td class="mono">${yen(a.b2b)}</td></tr>`).join('');
  const accomPanel=`<div class="panel"><h3>${tx('byAccom')}</h3><table class="t"><thead><tr><th>${tx('thAccom')}</th><th>${tx('thTeam')}</th><th>${tx('thPax')}</th><th>${tx('thB2B')}</th></tr></thead><tbody>${accomRows||''}</tbody></table></div>`;

  // 출발지
  const orig=(d.by_origin||[]); const oP=orig.reduce((s,o)=>s+(o.pax||0),0)||1;
  const oICN=(orig.find(o=>o.origin==='ICN')||{}).pax||0, oPUS=(orig.find(o=>o.origin==='PUS')||{}).pax||0;
  const origPanel=`<div class="panel"><h3>${tx('byOrigin')}</h3>
    <div class="split">
      ${oICN?`<div class="seg" style="width:${Math.round(oICN/oP*100)}%;background:var(--blue)">ICN ${num(oICN)}</div>`:''}
      ${oPUS?`<div class="seg" style="width:${Math.round(oPUS/oP*100)}%;background:var(--accent2)">PUS ${num(oPUS)}</div>`:''}
    </div>
    <div class="legend"><span><i style="background:var(--blue)"></i>ICN ${num(oICN)}${tx('uPpl')} (${Math.round(oICN/oP*100)}%)</span><span><i style="background:var(--accent2)"></i>PUS ${num(oPUS)}${tx('uPpl')} (${Math.round(oPUS/oP*100)}%)</span></div></div>`;

  // 고객 구성
  const grades=(d.members&&d.members.by_grade)||[];
  const gradeRows=grades.map(g=>`<tr><td>${esc(g.grade)}</td><td>${num(g.persons)}</td></tr>`).join('');
  const custPanel=`<div class="panel"><h3>${tx('custMix')}</h3>
    <div class="split">
      ${(d.members&&d.members.member)?`<div class="seg" style="width:${memPct}%;background:var(--accent)">${tx('member')} ${num(d.members.member)}</div>`:''}
      ${(d.members&&d.members.nonmember)?`<div class="seg" style="width:${100-memPct}%;background:var(--muted)">${tx('nonmember')} ${num(d.members.nonmember)}</div>`:''}
    </div>
    <div style="font-size:11.5px;color:var(--text2);font-weight:700;margin:12px 0 6px">${tx('byGrade')}</div>
    <table class="t"><thead><tr><th>${tx('thGrade')}</th><th>${tx('thPersons')}</th></tr></thead><tbody>${gradeRows||''}</tbody></table></div>`;

  // 현장 매출 구성 (카테고리 + 현금/카드)
  const cats=(d.onsite_by_cat||[]);
  const catRows=cats.map(c=>`<tr><td>${esc(c.category)}</td><td class="mono">${yen(c.amount)}</td></tr>`).join('');
  const pcTot=(tot.cash||0)+(tot.card||0)+(tot.unset||0)||1;
  const payPanel=`<div class="panel"><h3>${tx('onsiteRev')}</h3>
    <div style="font-size:11.5px;color:var(--text2);font-weight:700;margin-bottom:4px">${tx('payMix')}</div>
    <div class="split">
      ${tot.cash?`<div class="seg" style="width:${Math.round(tot.cash/pcTot*100)}%;background:var(--ok)">${tx('cash')} ${man(tot.cash)}</div>`:''}
      ${tot.card?`<div class="seg" style="width:${Math.round(tot.card/pcTot*100)}%;background:var(--blue)">${tx('card')} ${man(tot.card)}</div>`:''}
      ${tot.unset?`<div class="seg" style="width:${Math.round(tot.unset/pcTot*100)}%;background:var(--muted)">${tx('unset')} ${man(tot.unset)}</div>`:''}
    </div>
    <table class="t" style="margin-top:12px"><thead><tr><th>${tx('thCat')}</th><th>${tx('thAmt')}</th></tr></thead><tbody>${catRows||`<tr><td colspan="2" style="text-align:center;color:var(--muted)">—</td></tr>`}</tbody></table></div>`;

  // 가동률(시설별)
  const facs=(occ.by_facility||[]);
  const facRows=facs.map(f=>{ const p=(f.avail>0)?Math.round((f.occupied||0)/f.avail*100):0;
    return `<tr><td>${esc(f.facility||'-')}</td><td>${num(f.occupied)}</td><td>${num(f.avail)}</td><td class="mono">${p}%</td></tr>`;}).join('');
  const occPanel=`<div class="panel"><h3>${tx('occTitle')}</h3><table class="t"><thead><tr><th>${tx('thFac')}</th><th>${tx('thUsed')}</th><th>${tx('thAvail')}</th><th>${tx('thPct')}</th></tr></thead>
    <tbody><tr style="font-weight:800;background:var(--surface2)"><td>${tx('occAll')}</td><td>${num(occ.occupied)}</td><td>${num(occ.avail)}</td><td class="mono">${occPct}%</td></tr>
    <tr style="color:var(--muted)"><td>${tx('occAsg')}</td><td>${num(occ.assigned)}</td><td>${num(occ.avail)}</td><td class="mono">${asgPct}%</td></tr>${facRows}</tbody></table>
    <div class="hint" style="margin-top:8px">${tx('occNote')}</div></div>`;

  $('#content').innerHTML = kpis
    + `<div class="grid2">${monthPanel}${accomPanel}</div>`
    + `<div class="grid2">${origPanel}${custPanel}</div>`
    + `<div class="grid2">${payPanel}${occPanel}</div>`
    + `<div class="note">${tx('noteCalc')}</div>`;
}


// ── 📅 캘린더(대표님 화면) ────────────────────────────────────────────────
//  하루 = 한 칸. 큰 숫자 = 그날 밤 묵는 인원, 아래 🛬 체크인 · 🛫 체크아웃.
//  칸이 진할수록 사람이 많다(성수기가 한눈에). 날짜를 누르면 그날 프론트 데스크.
//  연 보기는 12개월을 한 화면에 — 월별 연인원(인원×박수)·팀수·최다 인원.
let VIEW='sum', CALY=null, CALM=null, CALMODE='month', CALROWS=null, CALKEY='';
function calFirstLast(){
  if(CALMODE==='year') return [CALY+'-01-01', CALY+'-12-31'];
  const f=new Date(CALY,CALM,1), t=new Date(CALY,CALM+1,0);
  return [iso(f), iso(t)];
}
async function calLoad(){
  const [f,t]=calFirstLast();
  const key=CALMODE+'|'+f+'|'+t;
  if(CALKEY===key && CALROWS) return CALROWS;
  // 그 기간에 걸치는 예약(체류가 하루라도 겹치면 포함) — 방배정 전 팀도 예약 기준으로 센다.
  //  ⚠ 대기 예약은 뺀다 — 만실이어도 받아 두는 예약이라 방을 잡지 않는다.
  //    가동률·일별 체류가 이미 빼고 있어, 여기만 넣으면 같은 화면에서 숫자가 어긋난다.
  let rows=[], from=0;
  for(;;){
    const {data,error}=await supa.from('bookings').select('event_seq,pax,dep_date,arr_date,status')
      .lt('dep_date',t).gt('arr_date',f).neq('status','대기')
      .order('event_seq').range(from,from+999);
    if(error) throw error;
    rows=rows.concat(data||[]);
    if(!data||data.length<1000) break; from+=1000;
  }
  CALROWS=rows; CALKEY=key; return rows;
}
// 날짜별 집계 {스테이 인원, 체크인 팀·인원, 체크아웃 팀·인원}
function calDays(rows,f,t){
  const day={};
  const add=(d)=>day[d]=day[d]||{pax:0,teams:0,ci:0,ciT:0,co:0,coT:0};
  for(let d=new Date(f+'T00:00:00'); iso(d)<=t; d.setDate(d.getDate()+1)) add(iso(d));
  rows.forEach(b=>{
    const n=Number(b.pax)||0;
    for(let d=new Date(b.dep_date+'T00:00:00'); iso(d)<b.arr_date; d.setDate(d.getDate()+1)){
      const k=iso(d); if(day[k]){ day[k].pax+=n; day[k].teams++; }   // 그날 '밤' 묵는 인원·팀
    }
    if(day[b.dep_date]){ day[b.dep_date].ci+=n; day[b.dep_date].ciT++; }
    if(day[b.arr_date]){ day[b.arr_date].co+=n; day[b.arr_date].coT++; }
  });
  return day;
}
async function renderCal(){
  const box=$('#content'); if(!box) return;
  box.innerHTML=`<div class="deny">${tx('loading')}</div>`;
  let rows;
  try{ rows=await calLoad(); }
  catch(e){ box.innerHTML=`<div class="deny" style="color:var(--err)">${esc(tx('loadFail')+': '+e.message)}</div>`; return; }
  const [f,t]=calFirstLast();
  const day=calDays(rows,f,t);
  const label = CALMODE==='year' ? `${CALY}` : `${CALY}-${pad(CALM+1)}`;
  const bar=`<div class="calbar">
    <button class="chip" id="c-prev" type="button">◀</button>
    <b>${esc(label)}</b>
    <button class="chip" id="c-next" type="button">▶</button>
    <button class="chip" id="c-today" type="button">${tx('calToday')}</button>
    <span style="width:10px"></span>
    <button class="chip${CALMODE==='month'?' on':''}" id="c-m" type="button">${tx('calMonth')}</button>
    <button class="chip${CALMODE==='year'?' on':''}" id="c-y" type="button">${tx('calYear')}</button>
  </div>`;
  let body='';
  if(CALMODE==='month'){
    const first=new Date(CALY,CALM,1), lastD=new Date(CALY,CALM+1,0).getDate();
    const pad0=first.getDay();
    const max=Math.max(1,...Object.values(day).map(x=>x.pax));
    const dows=(lang()==='ja'?['日','月','火','水','木','金','土']:(lang()==='en'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat']:['일','월','화','수','목','금','토']));
    let cells=dows.map((d,i)=>`<div class="dow${i===0?' sun':(i===6?' sat':'')}">${d}</div>`).join('');
    for(let i=0;i<pad0;i++) cells+=`<div class="cell pad"></div>`;
    const today=iso(new Date());
    for(let d=1; d<=lastD; d++){
      const k=`${CALY}-${pad(CALM+1)}-${pad(d)}`, v=day[k]||{pax:0,teams:0,ci:0,ciT:0,co:0,coT:0};
      const w=new Date(CALY,CALM,d).getDay();
      const a=v.pax?(0.10+0.55*(v.pax/max)):0;    // 인원이 많을수록 진하게
      cells+=`<a class="cell${w===0?' sun':(w===6?' sat':'')}${k===today?' today':''}" href="frontdesk.html?date=${k}"
        style="background:rgba(100,117,72,${a.toFixed(3)})" title="${esc(k)}">
        <div class="dn">${d}</div>
        <div class="pv">${v.pax?num(v.pax):''}${v.pax?`<span class="pu">${tx('uPpl')}${v.teams?` · ${num(v.teams)}${tx('uTeam')}`:''}</span>`:''}</div>
        <div class="io">${v.ciT?`<span class="i">🛬${v.ciT}·${v.ci}</span>`:''}${v.coT?`<span class="o">🛫${v.coT}·${v.co}</span>`:''}</div>
      </a>`;
    }
    const monTot=Object.keys(day).reduce((s,k)=>s+day[k].pax,0);
    const monTeams=new Set(rows.filter(b=>String(b.dep_date).slice(0,7)===`${CALY}-${pad(CALM+1)}`).map(b=>b.event_seq)).size;
    const peak=Object.keys(day).sort((a,b)=>day[b].pax-day[a].pax)[0];
    body=`<div class="panel">
      <h3>${tx('calH')}<span class="c">${tx('calNights',num(monTot))} · ${tx('calTeams',num(monTeams))} · ${tx('calPeak',peak?peak.slice(5):'-',num(peak?day[peak].pax:0))}</span></h3>
      <div class="cal">${cells}</div>
      <div class="note">${tx('calNote')}</div></div>`;
  } else {
    // 연 보기 — 월별 연인원(인원×박수)·팀수·최다 인원
    const byM={};
    for(let m=0;m<12;m++) byM[m]={nights:0,peak:0,teams:new Set()};
    Object.keys(day).forEach(k=>{
      const m=Number(k.slice(5,7))-1, v=day[k];
      byM[m].nights+=v.pax; if(v.pax>byM[m].peak) byM[m].peak=v.pax;
    });
    rows.forEach(b=>{ const m=Number(String(b.dep_date).slice(5,7))-1; if(byM[m]) byM[m].teams.add(b.event_seq); });
    const maxN=Math.max(1,...Object.values(byM).map(x=>x.nights));
    const cards=Object.keys(byM).map(m=>{
      const v=byM[m], mm=Number(m)+1;
      return `<a class="ycard" href="?y=${CALY}&m=${mm}" data-m="${m}">
        <div class="ym">${CALY}-${pad(mm)}</div>
        <div class="big">${num(v.nights)}<span style="font-size:12px;color:var(--text2)">${tx('uNight')||'인박'}</span></div>
        <div class="sub">${tx('calTeams',num(v.teams.size))} · ${tx('calPeakShort',num(v.peak))}</div>
        <div class="bar"><i style="width:${Math.round(v.nights/maxN*100)}%"></i></div></a>`;
    }).join('');
    const yTot=Object.values(byM).reduce((s,v)=>s+v.nights,0);
    body=`<div class="panel"><h3>${tx('calYH',CALY)}<span class="c">${tx('calNights',num(yTot))}</span></h3>
      <div class="ylist">${cards}</div>
      <div class="note">${tx('calNote')}</div></div>`;
  }
  box.innerHTML=bar+body;
  const go=(dy,dm)=>{ if(CALMODE==='year'){ CALY+=dy; } else { CALM+=dm; if(CALM<0){CALM=11;CALY--;} if(CALM>11){CALM=0;CALY++;} } CALROWS=null; renderCal(); };
  $('#c-prev').addEventListener('click',()=>go(-1,-1));
  $('#c-next').addEventListener('click',()=>go(1,1));
  $('#c-today').addEventListener('click',()=>{ const n=new Date(); CALY=n.getFullYear(); CALM=n.getMonth(); CALROWS=null; renderCal(); });
  $('#c-m').addEventListener('click',()=>{ CALMODE='month'; CALROWS=null; renderCal(); });
  $('#c-y').addEventListener('click',()=>{ CALMODE='year'; CALROWS=null; renderCal(); });
  document.querySelectorAll('.ycard[data-m]').forEach(c=>c.addEventListener('click',ev=>{
    ev.preventDefault(); CALMODE='month'; CALM=Number(c.dataset.m); CALROWS=null; renderCal();
  }));
}
// ── 📈 예약 추이 — 매일 자정에 찍어 둔 기록(booking_snapshots)과 지금을 견준다 ──
//   「지금」은 스냅샷이 아니라 실제 예약을 그 자리에서 센다(오늘치가 아직 안 찍혔어도 맞게).
let TR=null, TRYM=null, TRDAYS=7;
async function loadTrend(){
  const c=$('#content'); c.innerHTML=`<div class="deny">${esc(tx('trLoading'))}</div>`;
  try{
    const {data,error}=await supa.rpc('booking_trend',{p_ym:TRYM||null, p_days:TRDAYS});
    if(error) throw error;
    TR=data; TRYM=data.ym; renderTrend();
  }catch(e){
    TR=null;
    const msg=String(e.message||e);
    c.innerHTML=`<div class="deny">${esc(/권한/.test(msg)?tx('noAuth'):tx('trFail'))}<br><small>${esc(msg)}</small></div>`;
  }
}
function dnum(n){ n=Number(n)||0; return (n>0?'+':'')+n.toLocaleString('ja-JP'); }
function dcls(n){ return Number(n)>0?'up':(Number(n)<0?'down':''); }
function renderTrend(){
  const c=$('#content'); if(!TR){ c.innerHTML=`<div class="deny">${esc(tx('trLoading'))}</div>`; return; }
  const ms=TR.months||[], cur=ms.find(m=>m.ym===TR.ym)||{teams:0,pax:0,prev_teams:0,prev_pax:0};
  const hasBase=!!TR.base_date;
  const dT=cur.teams-cur.prev_teams, dP=cur.pax-cur.prev_pax;
  const head=`<div class="trhead">
      <span class="ym">${esc(TR.ym)}</span>
      <span class="big">${(cur.teams||0).toLocaleString('ja-JP')}<small>${esc(tx('uTeam'))}</small></span>
      <span class="big">${(cur.pax||0).toLocaleString('ja-JP')}<small>${esc(tx('uPpl'))}</small></span>
      <span class="dl">${hasBase
        ? `<div class="d ${dcls(dT)}">${dnum(dT)}<small style="font-size:12px">${esc(tx('uTeam'))}</small> · <span class="${dcls(dP)}">${dnum(dP)}</span><small style="font-size:12px">${esc(tx('uPpl'))}</small></div>
           <div class="c">${esc(tx('trDays',TR.days))} · ${esc(tx('trBase',TR.base_date))}</div>`
        : `<div class="c" style="max-width:420px;text-align:right">${esc(tx('trNoBase'))}</div>`}</span>
    </div>`;
  // 월·기간 고르기
  const ymChips=ms.map(m=>`<button type="button" class="chip${m.ym===TR.ym?' on':''}" data-trym="${esc(m.ym)}">${esc(m.ym)}</button>`).join('');
  const dayUnit=(lang()==='ja'?'日':lang()==='en'?'d':'일');
  const dayChips=[7,14,30].map(d=>`<button type="button" class="chip${d===TR.days?' on':''}" data-trd="${d}">${d}${dayUnit}</button>`).join('');
  const bar=`<div class="trbar"><span class="lb">${esc(tx('thYm'))}</span>${ymChips}
      <span style="width:10px"></span><span class="lb">${esc(tx('trCompare'))}</span>${dayChips}</div>`;
  // 월별 표
  const mRows=ms.map(m=>{ const a=m.teams-m.prev_teams, b=m.pax-m.prev_pax;
    return `<tr><td>${esc(m.ym)}</td><td class="mono">${(m.teams||0).toLocaleString('ja-JP')}</td>
      <td class="mono">${(m.pax||0).toLocaleString('ja-JP')}</td>
      <td class="mono ${dcls(a)}">${hasBase?dnum(a):'-'}</td>
      <td class="mono ${dcls(b)}">${hasBase?dnum(b):'-'}</td></tr>`; }).join('');
  const mPanel=`<div class="panel"><h3>${esc(tx('trMonths'))}</h3>
    <table class="t"><thead><tr><th>${esc(tx('thYm'))}</th><th>${esc(tx('thTeam'))}</th><th>${esc(tx('thPax'))}</th>
      <th>${esc(tx('thDelta'))}(${esc(tx('thTeam'))})</th><th>${esc(tx('thDelta'))}(${esc(tx('thPax'))})</th></tr></thead>
      <tbody>${mRows||''}</tbody></table></div>`;
  // 일별 추이 — 기존 막대 부품 그대로
  const se=TR.series||[]; const mx=Math.max(1,...se.map(x=>x.pax||0));
  const sPanel=`<div class="panel"><h3>${esc(tx('trDaily'))}<span class="c">${esc(TR.ym)} · ${esc(tx('mPax'))}</span></h3>`
    + (se.length<2 ? `<div class="deny" style="padding:18px">${esc(tx('trNoBase'))}</div>`
      : se.map(x=>`<div class="barrow"><span class="bl">${esc(String(x.d).slice(5))}</span>
          <span class="bt"><i class="bf" style="width:${Math.round((x.pax/mx)*100)}%"></i></span>
          <span class="bv">${(x.pax||0).toLocaleString('ja-JP')}<small> ${esc(tx('uPpl'))} · ${(x.teams||0)}${esc(tx('uTeam'))}</small></span></div>`).join(''))
    + `</div>`;
  // 구분별 · 숙소별
  const cmp=(rows,keyName,label)=>`<div class="panel"><h3>${esc(label)}</h3>
    <table class="t"><thead><tr><th>${esc(keyName)}</th><th>${esc(tx('thTeam'))}</th><th>${esc(tx('thPax'))}</th><th>${esc(tx('thDelta'))}</th></tr></thead><tbody>
    ${(rows||[]).slice().sort((a,b)=>(b.pax||0)-(a.pax||0)).map(r=>{ const d=(r.pax||0)-(r.prev_pax||0);
      return `<tr><td>${esc(r.status||r.accom||'-')}</td><td class="mono">${(r.teams||0)}</td>
        <td class="mono">${(r.pax||0).toLocaleString('ja-JP')}</td>
        <td class="mono ${dcls(d)}">${hasBase?(d===0?esc(tx('trSame')):dnum(d)):'-'}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  // 바뀐 팀
  const ch=TR.changes||[];
  const grp=k=>ch.filter(x=>x.k===k);
  const chip=(x,cls)=>`<span class="${cls}">${esc(x.no||'')} ${esc(x.rep||'')}${x.n?` ${esc(x.n)}${esc(tx('uPpl'))}`:''}</span>`;
  const chPanel=`<div class="panel"><h3>${esc(tx('trChanges'))}<span class="c">${esc(tx('trDays',TR.days))}</span></h3>`
    + (ch.length ? [['added','trAdded','a'],['removed','trRemoved','r'],['cancelled','trCancelled','c']]
        .filter(([k])=>grp(k).length)
        .map(([k,lab,cls])=>`<div style="margin-bottom:8px"><div style="font-size:11.5px;font-weight:800;color:var(--text2)">${esc(tx(lab))} ${grp(k).length}</div>
          <div class="chg">${grp(k).map(x=>chip(x,cls)).join('')}</div></div>`).join('')
      : `<div class="deny" style="padding:18px">${esc(tx('trNoChange'))}</div>`)
    + `</div>`;
  c.innerHTML=head+bar+`<div style="margin-top:14px">${mPanel}</div>`
    +`<div style="margin-top:16px">${sPanel}</div>`
    +`<div class="grid2">${cmp(TR.by_status,tx('trStatus'),tx('trStatus'))}${cmp(TR.by_accom,tx('thAccom'),tx('trAccom'))}</div>`
    +`<div style="margin-top:16px">${chPanel}</div>`
    +`<div class="note">${esc(tx('trNote'))}</div>`;
  c.querySelectorAll('[data-trym]').forEach(b=>b.addEventListener('click',()=>{ TRYM=b.dataset.trym; loadTrend(); }));
  c.querySelectorAll('[data-trd]').forEach(b=>b.addEventListener('click',()=>{ TRDAYS=+b.dataset.trd; loadTrend(); }));
}

function setView(v){
  VIEW=v;
  $('#v-sum').classList.toggle('on',v==='sum');
  $('#v-cal').classList.toggle('on',v==='cal');
  { const c=$('#v-trend'); if(c) c.classList.toggle('on',v==='trend'); }
  if(v==='cal'){
    if(CALY==null){ const n=new Date(); CALY=n.getFullYear(); CALM=n.getMonth(); }
    if(supa) renderCal();
  } else if(v==='trend'){
    if(supa) loadTrend();
  } else if(DATA) render();
}

// 언어 토글 시 정적 라벨 + 동적 재렌더
window.onSaizenLangChange=function(){ applyStatic(); if(VIEW==='cal') renderCal(); else if(VIEW==='trend') renderTrend(); else if(DATA) render(); };

/* ── 부팅 ── */
$('#btn-connect').addEventListener('click',connect);
$('#btn-run').addEventListener('click',run);
$('#v-sum').addEventListener('click',()=>setView('sum'));
$('#v-cal').addEventListener('click',()=>setView('cal'));
$('#v-trend').addEventListener('click',()=>setView('trend'));
$('#t-prevm').addEventListener('click',()=>shiftMonths(-1));
$('#t-nextm').addEventListener('click',()=>shiftMonths(1));
document.querySelectorAll('.chip[data-q]').forEach(b=>b.addEventListener('click',()=>quick(b.dataset.q)));
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value) connect();

{ const _v=new URLSearchParams(location.search).get('view');
  if(_v==='cal') setView('cal'); else if(_v==='trend') setView('trend'); }
