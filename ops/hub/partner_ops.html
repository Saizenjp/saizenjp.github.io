  · Min 「현지 담당 회사가 쓰던 수배서 목록(월별 xlsx)을 우리 시스템 환경에 맞게 — 파일 그대로가 아니라 우리 스타일로.
         안 봐도 되는 정보는 빼고, 꼭 봐야 하는 건 맞춰서, 기본값은 넣을 수 있게」
    차량 하이에스 3·마이크로버스 1(증설 가능) · 담당 3명 · 호텔 블록 워싱턴 트윈 4·아마넥 트윈 4 · 싱글 블록 없음(싱글은 요금 책정)
    타 여행사 팀도 엠클릭에 넣어 메리트투어가 함께 관리(여행사 명은 엠클릭에 따로) · 요금표(新料金) 구조는 SZCore.partnerQuote.
  · 월 단위 1행=1팀(별도 원장 partner_bookings, step1 이 엠클릭에서 채움). 자동 칸=기간·인원·대표·여행사·항공·비고.
    담당자 입력=호텔·객실 수·싱글 요금·담당·골프 일정(날짜·코스·티타임)·배차(차량·담당)·메모 + 체크 4종(호텔 名簿·골프장 名簿·日程表·請求書).
  · 데이터: SQL 160(partner_ops·partner_golf·partner_dispatch·등록표 partner_hotels/courses/vehicles/staff·partner_settings). 미적용이면 목록만 보이고 입력은 막힌다.
  · 권한: <body data-so-area="partner_kumamoto partner_trial">(둘 중 하나) — RLS 가 brand 로 걸러 자기 상품만 보인다.
  · 인쇄: 월 목록(A4 가로, 일본어 우선) · 팀 名簿(호텔·골프장 송부용) · 配車表(날짜별).

<style>
  /* ── 공통 chrome (docs/ops-page-skeleton.html 정본 — 통째 복사) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;

    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);

  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 ── */

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}

  /* 좁은 화면(노트북 125% 배율 등 1400px 미만): 목록은 전폭, 상세는 오른쪽 서랍(팀을 고르면 덮어서 열림·✕ 로 닫음) — 글자를 구겨 넣지 않는다(Min 2026-11-02 「글씨가 다 안보임」) */
  @media (max-width:1399px){
    .cols{grid-template-columns:1fr}

    .detail.open{display:block}
    .dclose{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-weight:900;cursor:pointer;margin-left:auto}
  }
  /* 블록 띠 */
  .blk{display:grid;grid-template-columns:150px 1fr;gap:6px;align-items:center;margin-bottom:6px}
  .blk .nm{font-size:12.5px;font-weight:800} .blk .nm small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  .blk .days{display:grid;grid-template-columns:repeat(var(--n,31),minmax(0,1fr));gap:2px}
  .blk .dc{font-family:var(--mono);font-size:10.5px;text-align:center;border-radius:4px;padding:3px 0;background:var(--surface3);color:var(--text2);line-height:1.2;cursor:default}
  .blk .dc b{display:block;font-size:9px;font-weight:600;color:var(--muted)}
  .blk .dc.use{background:var(--accentSoft);color:var(--accentDeep)} .blk .dc.full{background:#c8d4e6;color:#1f3a63} .blk .dc.over{background:#f3c9c0;color:var(--err);font-weight:800}
  .blk .dc.off{opacity:.35}
  /* 목록 */
  table.lt{width:100%;border-collapse:collapse;font-size:12.5px}
  .lt th{font-size:11px;font-weight:800;color:var(--text2);text-align:left;padding:6px 7px;border-bottom:2px solid var(--border2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
  .lt td{padding:7px 7px;border-bottom:1px solid var(--border);vertical-align:top;word-break:keep-all}
  .lt td.nw{white-space:nowrap} .lt .gl{font-size:12px;line-height:1.35;word-break:keep-all} .lt .gl .mono{white-space:nowrap}
  .lt tr.tm{cursor:pointer} .lt tr.tm:hover td{background:var(--surface2)} .lt tr.tm.sel td{background:var(--accentSoft)}
  .lt td.n,.lt th.n{text-align:right;font-family:var(--mono);font-weight:800}
  .lt small{display:block;color:var(--muted);font-size:11px;font-weight:600;line-height:1.3}
  .lt .mono{font-family:var(--mono);font-weight:700}
  /* 비고 보기(Min 2026-11-03 「엠클릭의 현지비고란을 보고 싶을 때 클릭해서 볼 수 있게」) — 대표자 칸의 작은 버튼 → 아래 줄에 현지비고·비고 원문 */
  .lt .rmkbtn{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--accent);background:transparent;border:1px solid var(--border2);border-radius:6px;padding:1px 7px;cursor:pointer;line-height:1.5} .lt .rmkbtn.on{background:var(--accentSoft);border-color:var(--accent)}
  .lt tr.rmkrow td{background:var(--surface2);padding:6px 10px 9px 28px;cursor:default} .rmkbox{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;line-height:1.5} .rmkbox b{white-space:nowrap;color:var(--text2)} .rmkbox div{white-space:pre-wrap;word-break:keep-all}
  .dots{display:flex;gap:3px} .dot{width:16px;height:16px;border-radius:50%;background:var(--surface3);color:var(--muted);font-size:9.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border2)}
  .dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .bd{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;margin:1px 2px 1px 0;white-space:nowrap}
  .bd.err{background:#f7e6e2;color:var(--err)} .bd.warn{background:#fbf3e2;color:#7a5a16} .bd.info{background:var(--surface3);color:var(--text2)} .bd.brand{background:var(--accentSoft);color:var(--accentDeep)}
  .yen{font-family:var(--mono);font-weight:800;white-space:nowrap}
  /* 상세 */
  .detail h2{font-size:17px;font-weight:900;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .detail h2 small{font-size:12px;font-weight:700;color:var(--text2)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:8px 0} .kv b{color:var(--text2);font-weight:700;white-space:nowrap}
  .sec{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
  .sec h4{font-size:12.5px;font-weight:800;color:var(--accentDeep);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sec h4 .r{margin-left:auto;display:flex;gap:6px;align-items:center}
  .frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .frm label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--text2)}
  .frm label .inp{font-weight:600;color:var(--text);padding:5px 8px} .frm .wide{grid-column:1/-1}
  .frm input[type=number]{width:100%}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  .mini th{font-size:10.5px;font-weight:800;color:var(--text2);text-align:left;padding:3px 5px;border-bottom:1px solid var(--border2);white-space:nowrap}
  .mini td{padding:3px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
  .mini .inp{padding:4px 6px;font-size:12px;width:100%} .mini input[type=time]{width:104px} .mini input[type=date]{width:136px} .mini input.sm{width:84px}
  .detail{overflow-x:hidden}
  .mini input[data-r=name_ja],.mini input[data-r=name_ko],.mini input[data-r=name]{min-width:150px}
  /* 상세의 골프·배차 줄 = 2줄 격자(표에 7칸을 구겨 넣지 않는다 — 날짜칸 136px 확보) */
  .grow{display:grid;grid-template-columns:128px minmax(100px,1fr) 74px 52px 28px;gap:4px 6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
  .grow.drow{grid-template-columns:128px minmax(100px,1fr) 100px auto}
  .grow .inp{padding:4px 6px;font-size:12px;width:100%;min-width:0} .grow .l2{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap} .grow .l2 .inp{flex:1;min-width:110px}
  .grow.hd{font-size:10.5px;font-weight:800;color:var(--text2);padding:2px 0;border-bottom:1px solid var(--border2)} .grow.prop{opacity:.75;background:var(--surface2)}
  .grow .x{border:0;background:transparent;color:var(--err);font-weight:900;cursor:pointer;font-size:14px;justify-self:center}
  .ckl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--text2);white-space:nowrap} .frm label.ckl{flex-direction:row;align-items:center;flex-wrap:wrap}
  .mini tr.prop td{opacity:.7;background:var(--surface2)} .mini .x{border:0;background:transparent;color:var(--err);font-weight:900;cursor:pointer;font-size:14px}
  .mini .over{color:var(--err);font-weight:800}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ck{border:1px solid var(--border2);border-radius:9px;padding:7px 10px;background:var(--surface2);cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text2);display:flex;flex-direction:column;gap:2px}
  .ck.on{background:var(--accentSoft);border-color:#b4cda0;color:var(--accentDeep)} .ck small{font-weight:600;font-size:11px;color:var(--muted)}
  .quote{background:var(--surface2);border-radius:9px;padding:8px 10px;font-size:12.5px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px 10px}
  .quote b{font-family:var(--mono);font-weight:800;font-size:13px} .quote small{display:block;color:var(--muted);font-size:10.5px;font-weight:600}
  .quote .tot b{color:var(--accentDeep);font-size:14.5px}
  .members{font-size:12px;color:var(--text2);line-height:1.6}
  .members b{color:var(--text);font-weight:700}
  .plus{font-size:11.5px;font-weight:700;color:var(--accent);border:1px dashed var(--accent);background:transparent;border-radius:7px;padding:3px 9px;cursor:pointer}
  /* 배차 */
  .veh{display:inline-flex;flex-direction:column;border:1px solid var(--border2);border-radius:9px;padding:5px 10px;background:var(--surface);font-size:12px;font-weight:700;min-width:120px}

  .defs .panel{margin:0;overflow:auto} #def-hotels,#def-courses,#def-rates{grid-column:1/-1}
  @media (max-width:1100px){ .defs{grid-template-columns:1fr} }
  /* 기간별 요금표(SQL 161) */
  .rp{border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--surface2)} .rp.pend{border-style:dashed;border-color:var(--accent)}
  .rph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--text2)} .rph .inp{padding:5px 8px;font-size:12.5px} .rph .r{margin-left:auto;display:flex;gap:6px;align-items:center}
  .rgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:6px 16px;margin-top:6px} .rgrid .full{grid-column:1/-1} .rgrid>*{min-width:0;overflow:auto}

  table.rt{border-collapse:collapse;font-size:12px;width:100%} .rt th{font-size:10.5px;font-weight:800;color:var(--text2);padding:3px 4px;border-bottom:1px solid var(--border2);text-align:center;white-space:nowrap} .rt th.lb,.rt td.lb{text-align:left;white-space:nowrap;font-weight:700;color:var(--text2)}
  .rt td{padding:2px 3px;border-bottom:1px solid var(--border)} .rt input.rin{width:86px;padding:4px 6px;font-size:12px;text-align:right;border:1px solid var(--border2);border-radius:6px;background:var(--surface)}
  textarea.inp{min-height:54px;resize:vertical}
  /* 초안·저장(Min 2026-11-03 「잘못 수정하면 안 되게 저장 버튼을 따로」) — 상세·날짜별 배차·등록표는 [저장]을 눌러야 DB 에 쓴다 */
  .savebar{position:sticky;top:0;z-index:6;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border);padding:6px 8px 8px;margin:4px 0 6px;font-size:12px;font-weight:700;color:var(--muted)}

  .savebar .sp{margin-left:auto;display:flex;gap:6px}
  .rmk{background:var(--surface2);border:1px dashed var(--accent);border-radius:9px;padding:8px 10px;font-size:12.5px;margin-top:8px;line-height:1.5}
  .rmk b{color:var(--accentDeep)} .rmk .plus{float:right;margin-left:8px} .rmk .hint{display:block;margin-top:4px}
  .bd.sug{background:#eef3e4;color:var(--accentDeep)} .lt small.sug{color:var(--accent2);font-weight:700}
  .regsave{margin-left:auto;display:flex;gap:6px;align-items:center} .mini tr.dirty td{background:#fbf3e2} .lt tr.dirty td{background:#fbf3e2}
  .grow .auto{font-size:10px;font-weight:800;color:var(--accent2);border:1px solid var(--accent2);border-radius:4px;padding:0 4px;justify-self:center}

// ── 날짜 ──
const pad2=n=>String(n).padStart(2,'0');
function today(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function daysIn(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function dstr(ym,d){ return `${ym}-${pad2(d)}`; }
function addDays(ds,n){ const [y,m,d]=ds.split('-').map(Number); const x=new Date(y,m-1,d+n); return `${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`; }
function shiftMonth(ym,n){ const [y,m]=ym.split('-').map(Number); const x=new Date(y,m-1+n,1); return `${x.getFullYear()}-${pad2(x.getMonth()+1)}`; }
function nightsOf(t){ const out=[]; let d=t.dep; let guard=0; while(d<t.arr && guard++<60){ out.push(d); d=addDays(d,1); } return out; }
function mmdd(ds){ return ds?`${Number(ds.slice(5,7))}/${Number(ds.slice(8,10))}`:''; }
const WD=['日','月','火','水','木','金','土'];
function wd(ds){ const [y,m,d]=ds.split('-').map(Number); return WD[new Date(y,m-1,d).getDay()]; }
function hhmm(v){ if(!v) return ''; const s=String(v).trim(); let m=s.match(/(\d{1,2}):(\d{2})/); if(m) return pad2(m[1])+':'+m[2]; m=s.match(/^(\d{1,2})(\d{2})$/); if(m) return pad2(m[1])+':'+m[2]; return ''; }
function addMin(hm,delta){ const m=hhmm(hm); if(!m) return ''; let t=Number(m.slice(0,2))*60+Number(m.slice(3))+delta; t=Math.max(0,Math.min(23*60+59,t)); return pad2(Math.floor(t/60))+':'+pad2(t%60); }
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');

const golf=seq=>(GOLF[seq]||[]).slice().sort((a,b)=>(a.play_date||'').localeCompare(b.play_date||'')||(a.sort||0)-(b.sort||0)||(a.id||0)-(b.id||0));
const disp=seq=>(DISP[seq]||[]).slice().sort((a,b)=>(a.trip_date||'').localeCompare(b.trip_date||'')||(a.depart_time||'99').localeCompare(b.depart_time||'99'));
const hotelById=id=>HOTELS.find(h=>h.id===Number(id))||null;
const courseById=id=>COURSES.find(c=>c.id===Number(id))||null;

function hotelName(h){ if(!h) return ''; return lang()==='ko'&&h.name_ko?h.name_ko:h.name_ja; }
function courseName(c,short){ if(!c) return ''; const n=(lang()==='ko'&&c.name_ko)?c.name_ko:c.name_ja; return short?n.replace(/(ゴルフクラブ|カントリークラブ|ゴルフ倶楽部|カントリー|ゴルフ場|CC|GC)\s*$/,''):n; }

function agencyOf(t){ const o=ops(t.seq); return (o.agency&&o.agency.trim())||t.agency||''; }
function repMember(t){ const ms=t.members||[]; return ms.find(m=>m.is_rep)||ms[0]||null; }
function portOf(origin,flight){ try{ return (window.SZCore&&SZCore.originPort)?SZCore.originPort(origin,flight):''; }catch(e){ return ''; } }
function flightLine(t){ const m=repMember(t); if(!m) return {in:'',out:''}; const port=portOf(m.origin||t.origin,m.dep_flight||t.airline);
  return { in:[m.dep_flight,hhmm(m.loc_arr_time)?hhmm(m.loc_arr_time)+'着':'',port].filter(Boolean).join(' '), out:[m.ret_flight,hhmm(m.ret_dep_time)?hhmm(m.ret_dep_time)+'発':''].filter(Boolean).join(' ') }; }

function quoteFor(t, ov){   // ov={ops,golf,disp} = 상세 초안(저장 전 값으로 견적)
  if(!(window.SZCore&&SZCore.partnerQuote)) return null;
  const o=ov?ov.ops:ops(t.seq), g=(ov?ov.golf:golf(t.seq)).filter(r=>r.course_id||r.course_note), h=hotelById(o.hotel_id);
  const tr={}; (ov?ov.disp:disp(t.seq)).forEach(r=>{ if(r.vehicle_id&&r.trip_date) tr[r.trip_date+'|'+r.vehicle_id]={date:r.trip_date,vehicleId:r.vehicle_id}; });   // 송영 = 저장 배차의 (날짜·차량) 대일
  return SZCore.partnerQuote({ from:t.dep, to:t.arr, hotelId:o.hotel_id||null, golf:g.length?g.map(r=>({date:r.play_date,courseId:r.course_id||null})):undefined, transfer:Object.values(tr),
    surcharge:h?h.surcharge:0, twin:o.twin||0, single:o.single||0, triple:o.triple||0, pax:t.pax, adj:o.price_adj||0, singleRate:(o.single_rate==null?'':o.single_rate) }, RATEROWS);
}
function missingText(list){ const lbl={hotel:tx('rHotel'),golf:tx('rGolf'),single:tx('single'),transfer:tx('rTransfer')}; const seen=new Set(); const out=[]; (list||[]).forEach(m=>{ const [k,d]=m.split(':'); const s=`${lbl[k]||k} ${mmdd(d)}`; if(!seen.has(s)){ seen.add(s); out.push(s); } }); return out.slice(0,6).join(' · ')+(out.length>6?' …':''); }
function blockUse(hotelId, ds){ let u=0; TEAMS.forEach(t=>{ const o=ops(t.seq); if(Number(o.hotel_id)===Number(hotelId) && o.use_block!==false && t.dep<=ds && ds<t.arr) u+=Number(o.twin||0); }); return u; }   // use_block=false(블록 외)는 세지 않는다
function blockOn(h, ds){ if(!h||!(h.block_twin>0)) return 0; if(h.block_from&&ds<h.block_from) return 0; if(h.block_to&&ds>h.block_to) return 0; return h.block_twin; }
function issues(t){
  const o=ops(t.seq), out=[]; const q=quoteFor(t);
  if(!HAS_OPS) return out;

function planFor(t){ if(PLAN[t.seq]) return PLAN[t.seq]; let p; try{ p=(window.SZCore&&SZCore.partnerRemarkPlan)?SZCore.partnerRemarkPlan([t.remark,t.remark_local].filter(Boolean).join('\n'),{pax:t.pax,hotels:HOTELS,courses:COURSES,segFrom:t.dep,segTo:t.arr}):null; }catch(e){ p=null; }
  p=p||{hotelId:null,hotels:[],single:0,twin:0,triple:0,golf:[],golfAssumed:0,agency:'',agencyExplicit:false,empty:true,sig:''}; PLAN[t.seq]=p; return p; }

function draftFor(t){ if(DR&&DR.seq===t.seq) return DR; DR={seq:t.seq, ops:Object.assign({},OPS[t.seq]||{}), golf:(GOLF[t.seq]||[]).map(r=>Object.assign({},r)), disp:(DISP[t.seq]||[]).map(r=>Object.assign({},r)), golfDel:[], dispDel:[], dirty:false}; return DR; }
function dirty(){ return !!(DR&&DR.dirty); }

function rowChanged(saved, row){ if(!saved) return true; return Object.keys(row).some(k=>k!=='id'&&String(row[k]==null?'':row[k])!==String(saved[k]==null?'':saved[k])); }
async function commitDraft(){

  if(ok&&d.ops.party&&(Number(d.ops.party)!==Number(prevParty))){ const v=Number(d.ops.party); await saveOps(v,{party:Math.min(v,t.seq)},'party',true); await saveOps(t.seq,{party:Math.min(v,t.seq)},'party',true); }

  for(const r of d.golf){ const row=Object.assign({},r); if(!HAS_GAUTO) delete row.auto; const saved=(GOLF[t.seq]||[]).find(x=>x.id===r.id); if(row.id<0) delete row.id; else if(!rowChanged(saved,row)) continue; if(!(await saveGolf(row))) ok=false; }

function applyRemarkToDraft(t,d){

const ROUTES=[['airport','','hotel'],['airport','','course'],['airport','hotel','course'],['hotel','','course'],['course','','hotel'],['hotel','','airport'],['course','','airport'],['course','hotel','airport'],['other','','other']];

  $('#list thead').innerHTML=`<tr><th>${esc(tx('hSt'))}</th><th>${esc(tx('hDate'))}</th><th class="n">${esc(tx('hPax'))}</th><th>${esc(tx('hRep'))}</th><th>${esc(tx('hHotel'))}</th><th>${esc(tx('hGolf'))}</th><th>${esc(tx('hStaff'))}</th><th class="n">${esc(tx('hYen'))}</th><th>${esc(tx('hIss'))}</th></tr>`;
  const cand=remarkCandidates(); const rb=$('#btn-remark-all'); rb.hidden=!cand.length; rb.textContent=tx('applyRemarkAll',cand.length);
  if(!vis.length){ $('#list tbody').innerHTML=`<tr><td colspan="9"><div class="empty">—</div></td></tr>`; return; }
  $('#list tbody').innerHTML=vis.map(t=>{ const o=ops(t.seq), h=hotelById(o.hotel_id), g=golf(t.seq).filter(r=>r.course_id||r.course_note), q=quoteFor(t), iss=issues(t), p=planFor(t), isD=DR&&DR.seq===t.seq&&DR.dirty;
    const gl=g.map(r=>`<div class="gl">${esc(mmdd(r.play_date))} ${esc(courseName(courseById(r.course_id),true)||r.course_note||'')}${r.tee_time?` <span class="mono">${esc(r.tee_time)}</span>`:''}</div>`).join('');   // 라운드별 한 줄(글자 단위 줄바꿈 금지)
    return `<tr class="tm${SEL===t.seq?' sel':''}${isD?' dirty':''}" data-seq="${t.seq}">
      <td>${statusDots(o)}${isD?`<span class="bd warn">${esc(tx('unsavedBadge'))}</span>`:''}</td>
      <td class="nw"><span class="mono">${esc(mmdd(t.dep))}→${esc(mmdd(t.arr))}</span><small>${esc(tx('nights',nightsOf(t).length))}${t.sure?'':` <span class="bd warn" title="${esc(tx('unsureT'))}">${esc(tx('unsure'))}</span>`}</small></td>
      <td class="n">${t.pax}</td>
      <td class="nw"><b>${esc(t.rep)}</b> <span class="bd brand">${esc(brandShort(t.brand))}</span>${t.combo?` <span class="bd info">${esc(tx('combo'))}</span>`:''}<small>${esc(agencyOf(t))}</small>${(t.remark||t.remark_local)?`<button class="rmkbtn${RMK_CLOSED.has(t.seq)?'':' on'}" data-act="rmk" data-seq="${t.seq}" type="button">${esc(tx(RMK_CLOSED.has(t.seq)?'rmkOpen':'rmkClose'))}</button>`:''}</td>
      <td class="nw">${esc(hotelName(h)||(o.hotel_note||''))}${h&&h.block_twin>0&&o.use_block===false?` <span class="bd info">${esc(tx('blockOut'))}</span>`:''}<small>${esc(roomsText(o))}</small>${!o.hotel_id&&p.hotelId?`<small class="sug">${esc(tx('remarkTag'))}: ${esc(hotelName(hotelById(p.hotelId)))}</small>`:''}</td>
      <td>${gl}<small>${g.length}/${nightsOf(t).length}</small>${!g.length&&p.golf.length?`<small class="sug">${esc(tx('remarkTag'))}: ${esc(tx('remarkGolf',p.golf.length))}</small>`:''}</td>
      <td class="nw">${esc(o.staff||'')}</td>
      <td class="n yen">${q&&q.ok&&ratesReady()&&q.complete?yen(q.total):''}</td>
      <td>${iss.map(i=>`<span class="bd ${i.sev}">${esc(i.n!=null?tx(i.k,i.n):tx(i.k))}</span>`).join('')}</td></tr>${((t.remark||t.remark_local)&&!RMK_CLOSED.has(t.seq))?rmkRowHTML(t):''}`; }).join('');
}
$('#list').addEventListener('click',e=>{ const rb=e.target.closest('[data-act=rmk]'); if(rb){ e.stopPropagation(); const s=Number(rb.dataset.seq); if(RMK_CLOSED.has(s)) RMK_CLOSED.delete(s); else RMK_CLOSED.add(s); renderList(); return; }   // 비고 보기 토글(팀 선택과 무관)
  const tr=e.target.closest('tr.tm'); if(!tr) return; const seq=Number(tr.dataset.seq); if(seq===SEL) return; if(!canLeave()) return; DR=null; SEL=seq; renderList(); renderDetail(); });
$('#btn-remark-all').addEventListener('click',async()=>{ const cand=remarkCandidates(); if(!cand.length) return; if(!confirm(tx('applyRemarkAllConfirm',cand.length))) return; let n=0,gn=0;
  for(const t of cand){ const p=planFor(t); const row={event_seq:t.seq,twin:p.twin,single:p.single,triple:p.triple}; if(p.hotelId) row.hotel_id=p.hotelId; else if((DEFAULTS.hotel||{})[t.brand]) row.hotel_id=DEFAULTS.hotel[t.brand]; if((DEFAULTS.staff||{})[t.brand]) row.staff=DEFAULTS.staff[t.brand]; if(p.agencyExplicit&&p.agency!==t.agency) row.agency=p.agency; if(HAS_AUTOSIG) row.auto_sig=p.sig;
    const {data,error}=await supa.from('partner_ops').upsert(row,{onConflict:'event_seq'}).select().single(); if(error){ toast(tx('saveFail')+': '+error.message,'err'); break; } OPS[t.seq]=data; n++;
    if(p.golf.length&&!(GOLF[t.seq]||[]).length){ const rows=p.golf.map((x,i)=>{ const r={event_seq:t.seq,play_date:x.date,course_id:x.courseId,sort:i}; if(HAS_GAUTO) r.auto=true; return r; }); const g=await supa.from('partner_golf').insert(rows).select(); if(!g.error){ GOLF[t.seq]=(GOLF[t.seq]||[]).concat(g.data||[]); gn+=rows.length; } }
    logChange(t.seq,'remark_apply',p.hotelName||''); }
  if(n) toast(tx('applyRemarkAllDone',n,gn),'ok'); renderAll(); });

function optList(items, val, labelFn, noneLabel, otherLabel){ return `<option value=""${val?'':' selected'}>${esc(noneLabel)}</option>`+items.map(x=>`<option value="${x.id}"${Number(val)===x.id?' selected':''}>${esc(labelFn(x))}</option>`).join('')+(otherLabel?`<option value="other"${val==='other'?' selected':''}>${esc(otherLabel)}</option>`:''); }
function staffOpts(val){ return `<option value="">—</option>`+STAFF.filter(s=>s.active||s.name===val).map(s=>`<option${s.name===val?' selected':''}>${esc(s.name)}</option>`).join('')+(val&&!STAFF.some(s=>s.name===val)?`<option selected>${esc(val)}</option>`:''); }
function rmkHTML(t,p,o){
  if(p.empty) return `<div class="rmk"><b>${esc(tx('remarkH'))}</b> — ${esc(tx('remarkNone'))}<span class="hint">${esc(tx('remarkFmt'))}</span></div>`;
  const parts=[];
  if(p.hotelId) parts.push(`${tx('hotel')}: ${p.hotels.map(id=>hotelName(hotelById(id))||'').filter(Boolean).join(' / ')}`);
  parts.push(`${tx('twin')}${p.twin} · ${tx('single')}${p.single}${p.triple?` · ${tx('triple')}${p.triple}`:''}${p.odd?` (${tx('remarkOdd')})`:''}`);
  if(p.golf.length) parts.push(`${tx('remarkGolf',p.golf.length)}: `+p.golf.map(x=>`${mmdd(x.date)}${x.explicit?'':'?'} ${courseName(courseById(x.courseId),true)}`).join(' · ')+(p.golfAssumed?` — ${tx('remarkDateAssumed')}`:''));
  if(p.agencyExplicit) parts.push(`${tx('dAgency')}: ${p.agency}`);
  const changed=HAS_AUTOSIG&&o.auto_sig&&p.sig&&o.auto_sig!==p.sig;
  return `<div class="rmk"><button class="plus" data-act="applyRemark" type="button" ${HAS_OPS?'':'disabled'}>${esc(tx('applyRemark'))}</button><b>${esc(tx('remarkH'))}</b>${changed?` <span class="bd warn">${esc(tx('issRemarkChanged'))}</span>`:(!OPS[t.seq]?` <span class="bd sug">${esc(tx('issRemark'))}</span>`:'')}<div>${parts.map(esc).join('<br>')}</div></div>`;
}
function saveBarHTML(d){ return `<div class="savebar${d.dirty?' on':''}" id="savebar"><span>${esc(d.dirty?tx('unsaved'):tx('savedState'))}</span><span class="sp"><button class="btn sm" data-act="save" type="button" ${d.dirty&&HAS_OPS?'':'disabled'}>${esc(tx('save'))}</button><button class="btn sm ghost" data-act="cancel" type="button" ${d.dirty?'':'disabled'}>${esc(tx('cancel'))}</button></span></div>`; }
function refreshSaveBar(){ const sb=$('#savebar'); if(!sb||!DR) return; sb.classList.toggle('on',DR.dirty); sb.querySelector('span').textContent=DR.dirty?tx('unsaved'):tx('savedState'); sb.querySelector('[data-act=save]').disabled=!(DR.dirty&&HAS_OPS); sb.querySelector('[data-act=cancel]').disabled=!DR.dirty; }

        <div><small>${esc(tx('qNights',q.nights))} · ${esc(tx('qRounds',q.rounds))}</small><b class="${q.roomsMatch?'':'over'}" style="font-size:12px">${esc(tx('qPersons',q.persons,t.pax))}</b></div>
        ${q.missing.length&&ratesReady()?`<div style="grid-column:1/-1"><span class="bd warn">${esc(tx('qMissing'))}: ${esc(missingText(q.missing))}</span></div>`:''}</div>`:''}`;

    <div class="sec"><h4>${esc(tx('secHotel'))}<span class="r"><button class="plus" data-act="suggest" type="button">${esc(tx('suggest'))}</button></span></h4>

          <input class="inp" data-g="holes" value="${esc(r.holes||'')}">
          <button class="x" data-act="golfDel" type="button" title="${esc(tx('del'))}">×</button>

function dispRowHTML(r,prop,i){
  const vehSel=`<select class="inp" data-d="vehicle_id">${optList(VEHICLES.filter(v=>v.active||v.id===Number(r.vehicle_id)),r.vehicle_id,v=>`${v.name} (${v.capacity})`,tx('vehNone'))}</select>`;
  const legSel=HAS_PTS?`<select class="inp" data-d="route" ${prop?'disabled':''}>${routeOpts(r)}</select>`:`<select class="inp" data-d="leg" ${prop?'disabled':''}>${LEGS.map(l=>`<option value="${l}"${r.leg===l?' selected':''}>${esc(legLabel(l))}</option>`).join('')}</select>`;
  const pv=prop?`<small>${esc(routeLabel(r))}${r.vehicle_id&&vehById(r.vehicle_id)?' · '+esc(vehById(r.vehicle_id).name):''}${r.note?' · '+esc(r.note):''}</small>`:'';
  return `<div class="grow drow${prop?' prop':''}" ${prop?`data-prop="${i}"`:`data-did="${r.id}"`}>
    <input class="inp" type="date" data-d="trip_date" value="${esc(r.trip_date||'')}" ${prop?'disabled':''}>
    ${legSel}
    <input class="inp" type="time" data-d="depart_time" value="${esc(hhmm(r.depart_time))}" ${prop?'disabled':''}>
    ${prop?`<button class="plus" data-act="dispProp" type="button">${esc(tx('addProp'))}</button>`:`<button class="x" data-act="dispDel" type="button" title="${esc(tx('del'))}">×</button>`}
    ${prop?`<div class="l2">${pv}</div>`:`<div class="l2">${vehSel}<select class="inp" data-d="staff">${staffOpts(r.staff||'')}</select><input class="inp" data-d="note" value="${esc(r.note||'')}" placeholder="${esc(tx('dNote'))}"></div>`}
  </div>`;
}
// 상세 패널 이벤트(위임) — 전부 초안(DR)에만 반영. DB 는 [저장]에서(Min 2026-11-03 「그냥 수정이 되게 되어 있어서 위험함」)
$('#detail').addEventListener('change',e=>{
  const t=teamOf(SEL); if(!t) return; const el=e.target; const d=draftFor(t);
  if(el.dataset.f){ const f=el.dataset.f; let v=el.type==='checkbox'?el.checked:(el.type==='number'?(el.value===''?null:Number(el.value)):el.value); if(f==='hotel_id'||f==='party') v=el.value?Number(el.value):null; if(f==='agency'&&v===t.agency) v=null;
    d.ops[f]=v; mark(); if(f==='hotel_id'||f==='use_block') renderDetail(); else { refreshSaveBar(); const dq=$('#dq'); if(dq) dq.innerHTML=quoteHTML(t,d); } return; }
  const gtr=el.closest('[data-gid]'); if(gtr&&el.dataset.g){ const row=d.golf.find(r=>r.id===Number(gtr.dataset.gid)); if(!row) return; let v=el.type==='checkbox'?el.checked:el.value; if(el.dataset.g==='course_id') v=el.value?Number(el.value):null; if(el.dataset.g==='tee_time') v=el.value.split(',').map(x=>hhmm(x)||x.trim()).filter(Boolean).join(','); row[el.dataset.g]=v; if(row.auto&&(el.dataset.g==='course_id'||el.dataset.g==='play_date')) row.auto=false; mark(); if(el.dataset.g==='course_id'||el.dataset.g==='play_date') renderDetail(); else { refreshSaveBar(); const dq=$('#dq'); if(dq) dq.innerHTML=quoteHTML(t,d); } return; }
  const dtr=el.closest('[data-did]'); if(dtr&&el.dataset.d){ const row=d.disp.find(r=>r.id===Number(dtr.dataset.did)); if(!row) return; let v=el.value;
    if(el.dataset.d==='route'){ const [f,vi,to]=v.split('|'); row.from_pt=f||null; row.via_pt=vi||null; row.to_pt=to||null; row.leg=(window.SZCore&&SZCore.partnerLegOf)?SZCore.partnerLegOf(f,to):'other'; }
    else { if(el.dataset.d==='vehicle_id') v=el.value?Number(el.value):null; row[el.dataset.d]=v; }
    mark(); refreshSaveBar(); if(el.dataset.d==='vehicle_id'||el.dataset.d==='trip_date'){ const dq=$('#dq'); if(dq) dq.innerHTML=quoteHTML(t,d); } }
});
$('#detail').addEventListener('click',async e=>{
  const t=teamOf(SEL); if(!t) return; const d=draftFor(t);
  const ck=e.target.closest('.ck'); if(ck){ const f=ck.dataset.ck, by=ck.dataset.by, on=!!d.ops[f]; d.ops[f]=on?null:new Date().toISOString(); d.ops[by]=on?null:who(); mark(); renderDetail(); return; }

async function periodAct(act,pk){
  const groups=rateGroups(); const g=groups.find(x=>x.key===pk); if(!g) return;
  if(act==='copyPeriod'){ PENDP.push({key:'new'+Date.now(),label:g.label?g.label+' (2)':'',from:'',to:'',rows:g.rows.map(r=>({kind:r.kind,ref_id:r.ref_id,prices:JSON.parse(JSON.stringify(r.prices||{}))})),saved:false}); renderDefs(); return; }
  if(act==='delPeriod'){ if(!g.saved){ PENDP=PENDP.filter(p=>p.key!==pk); renderDefs(); return; } if(!confirm(tx('rDelConfirm'))) return;
    const {error}=await supa.from('partner_rates').delete().in('id',g.rows.map(r=>r.id)); if(error) return toast(tx('saveFail')+': '+error.message,'err');
    logChange('rates','rates_period_del',`${g.label} ${g.from}~${g.to} ${g.rows.length}`); await loadRates(); toast(tx('saved'),'ok'); renderAll(); return; }
  if(act!=='savePeriod') return;
  const box=$$('#def-rates .rp').find(b=>b.dataset.pk===pk); if(!box) return;
  const label=box.querySelector('[data-pf=label]').value.trim()||null, from=box.querySelector('[data-pf=from]').value||null, to=box.querySelector('[data-pf=to]').value||null;
  if(from&&to&&from>to) return toast(tx('rBadPeriod'),'err');
  const cells={};
  box.querySelectorAll('.rin').forEach(inp=>{ const k=inp.dataset.rk+'|'+(inp.dataset.rr||''); const c=cells[k]=cells[k]||{kind:inp.dataset.rk,ref:inp.dataset.rr===''?null:Number(inp.dataset.rr),prices:{},any:false};
    const v=inp.value===''?null:Number(inp.value); const path=inp.dataset.rp.split('.'); let o=c.prices; for(let i=0;i<path.length-1;i++){ o=o[path[i]]=o[path[i]]||{}; } o[path[path.length-1]]=v; if(v!=null) c.any=true; });
  const ups=[], dels=[];
  Object.values(cells).forEach(c=>{ const ex=g.rows.find(r=>r.id&&r.kind===c.kind&&((r.ref_id==null&&c.ref==null)||Number(r.ref_id)===c.ref));
    if(c.any){ const row={kind:c.kind,ref_id:c.ref,label,from_date:from,to_date:to,prices:pruneObj(c.prices)}; if(ex) row.id=ex.id; ups.push(row); } else if(ex) dels.push(ex.id); });
  g.rows.filter(r=>r.id&&!ups.some(u=>u.id===r.id)&&!dels.includes(r.id)).forEach(r=>ups.push({id:r.id,kind:r.kind,ref_id:r.ref_id,label,from_date:from,to_date:to,prices:r.prices||{}}));   // 화면에 없는 행(비활성 대상)도 기간 수정은 같이
  if(ups.length){ const {error}=await supa.from('partner_rates').upsert(ups,{onConflict:'id'}); if(error) return toast(tx('saveFail')+': '+error.message,'err'); }
  if(dels.length){ const {error}=await supa.from('partner_rates').delete().in('id',dels); if(error) return toast(tx('saveFail')+': '+error.message,'err'); }
  PENDP=PENDP.filter(p=>p.key!==pk); logChange('rates','rates_period',`${label||''} ${from||''}~${to||''} +${ups.length} -${dels.length}`);
  await loadRates(); toast(tx('saved'),'ok'); renderAll();
}

async function saveReg(table, id, patch){ const {data,error}=await supa.from(table).update(patch).eq('id',id).select().single(); if(error){ toast(tx('saveFail')+': '+error.message,'err'); return; } const arr={partner_hotels:HOTELS,partner_courses:COURSES,partner_vehicles:VEHICLES,partner_staff:STAFF}[table]; const i=arr.findIndex(r=>r.id===id); if(i>=0) arr[i]=data; logChange(table,'reg',`${table}#${id} ${Object.keys(patch).join(',')}`); }
$('#v-def').addEventListener('change',async e=>{
  const el=e.target; const tbl=el.closest('table[data-table]');
  if(tbl&&el.dataset.r){ const tr=el.closest('tr[data-id]'); const id=Number(tr.dataset.id); let v=el.type==='checkbox'?el.checked:(el.type==='number'?(el.value===''?0:Number(el.value)):(el.value||null)); const table=tbl.dataset.table; REGDIRTY[table]=REGDIRTY[table]||{}; REGDIRTY[table][id]=Object.assign(REGDIRTY[table][id]||{},{[el.dataset.r]:v}); tr.classList.add('dirty');
    const h3=tbl.closest('.panel').querySelector('.regsave'); if(h3&&!h3.querySelector('[data-act=regSave]')) h3.insertAdjacentHTML('afterbegin',`<button class="btn sm" data-act="regSave" type="button"></button>`); const sb=h3&&h3.querySelector('[data-act=regSave]'); if(sb) sb.textContent=tx('regSave',Object.keys(REGDIRTY[table]).length); return; }
  if(el.dataset.def){ const [k,b]=el.dataset.def.split('.'); DEFAULTS[k]=DEFAULTS[k]||{}; DEFAULTS[k][b]=el.dataset.def.startsWith('hotel')?(el.value?Number(el.value):null):(el.value||null); const {error}=await supa.from('partner_settings').upsert({key:'partner_defaults',value:DEFAULTS,updated_by:who()},{onConflict:'key'}); if(error) toast(tx('saveFail')+': '+error.message,'err'); else toast(tx('saved'),'ok'); }
});
$('#v-def').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const panel=b.closest('.panel'); const tbl=panel&&panel.querySelector('table[data-table]'); const table=tbl&&tbl.dataset.table;
  if(b.dataset.act==='addPeriod'){ if(!HAS_RATES) return toast(tx('needSql161'),'warn'); PENDP.push({key:'new'+Date.now(),label:'',from:'',to:'',rows:[],saved:false}); renderDefs(); return; }
  if(b.dataset.act==='copyPeriod'||b.dataset.act==='delPeriod'||b.dataset.act==='savePeriod'){ const rp=b.closest('.rp'); if(rp) await periodAct(b.dataset.act,rp.dataset.pk); return; }
  if(b.dataset.act==='regSave'&&table){ await regSaveAll(table); return; }
  if(b.dataset.act==='add'&&table){ const name=prompt(tx('addPrompt')); if(!name||!name.trim()) return; const row=table==='partner_vehicles'?{name:name.trim(),capacity:9}:(table==='partner_staff'?{name:name.trim()}:{name_ja:name.trim()}); row.sort=({partner_hotels:HOTELS,partner_courses:COURSES,partner_vehicles:VEHICLES,partner_staff:STAFF}[table]).length+1;
    const {data,error}=await supa.from(table).insert(row).select().single(); if(error) return toast(tx('saveFail')+': '+error.message,'err'); ({partner_hotels:HOTELS,partner_courses:COURSES,partner_vehicles:VEHICLES,partner_staff:STAFF}[table]).push(data); logChange(table,'reg_add',name.trim()); renderAll(); }
  if(b.dataset.act==='del'&&table){ const tr=b.closest('tr[data-id]'); const id=Number(tr.dataset.id); if(!confirm(tx('delConfirm'))) return; const {error}=await supa.from(table).delete().eq('id',id); if(error) return toast(tx('saveFail')+': '+error.message,'err'); const arr={partner_hotels:HOTELS,partner_courses:COURSES,partner_vehicles:VEHICLES,partner_staff:STAFF}[table]; const i=arr.findIndex(r=>r.id===id); if(i>=0) arr.splice(i,1); logChange(table,'reg_del',String(id)); renderAll(); }
  if(b.dataset.act==='saveRates'){ const R={}; $$('#def-rates [data-rate]').forEach(inp=>{ const v=inp.value===''?null:Number(inp.value); const [a,b2,c]=inp.dataset.rate.split('.'); if(c){ R[a]=R[a]||{}; R[a][b2]=R[a][b2]||{}; R[a][b2][c]=v; } else { R[a]=R[a]||{}; R[a][b2]=v; } });
    const {error}=await supa.from('partner_settings').upsert({key:'rates',value:R,updated_by:who()},{onConflict:'key'}); if(error) return toast(tx('saveFail')+': '+error.message,'err'); RATES=R; logChange('rates','rates','rates'); toast(tx('saved'),'ok'); renderAll(); }
});

function popup(title, css, body){ const jp=window.__SO_JP_FONT||''; const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${jp}
    body{font-family:'Pretendard','Meiryo','Yu Gothic','Hiragino Sans','Noto Sans JP','Noto Sans KR',sans-serif;color:#111}
    h1{font-size:15pt;margin:0 0 2mm} h1 small{font-size:9.5pt;font-weight:600;color:#444;margin-left:8px}
    table{border-collapse:collapse;width:100%} th,td{border:1px solid #333;padding:1.4mm 1.8mm;font-size:9pt;vertical-align:top} th{background:#eee;font-weight:800;white-space:nowrap}
    .mono{font-family:Consolas,'SZJpMono',monospace;font-weight:800} small{color:#555;font-size:7.5pt;display:block} .c{text-align:center} .r{text-align:right}
    .box{display:inline-block;width:3.6mm;height:3.6mm;border:1.2px solid #333;vertical-align:middle;margin-right:1mm} .box.on{background:#333}
    .ft{margin-top:4mm;font-size:8pt;color:#555} ${css}</style></head><body>${body}</body></html>`;
  const w=window.open('','_blank','width=1100,height=900'); if(!w){ toast(tx('fail'),'err'); return html; } w.document.open(); w.document.write(html); w.document.close(); return html; }
function printList(){
  const P=tx('pv'), vis=visible(); const chk=(o,f)=>`<span class="box${o[f]?' on':''}"></span>`;
  const rows=vis.map(t=>{ const o=ops(t.seq), h=hotelById(o.hotel_id), fl=flightLine(t), g=golf(t.seq).filter(r=>r.course_id||r.course_note), q=quoteFor(t);
    return `<tr><td class="mono">${esc(mmdd(t.dep))}→${esc(mmdd(t.arr))}<small>${esc(wd(t.dep))}〜${esc(wd(addDays(t.arr,0)))}</small></td><td class="c">${nightsOf(t).length}</td><td class="c">${t.pax}</td><td><b>${esc(t.rep)}</b><small>${esc(brandShort(t.brand))}${t.combo?' · '+esc(P.period)+' '+esc(mmdd(t.fullDep))+'→'+esc(mmdd(t.fullArr)):''}</small></td><td>${esc(agencyOf(t))}</td>
      <td>IN ${esc(fl.in||'—')}<br>OUT ${esc(fl.out||'—')}</td><td>${esc(hotelName(h)||o.hotel_note||'')}<small>${esc(roomsText(o))}${o.hotel_note&&h?' · '+esc(o.hotel_note):''}</small></td>
      <td>${g.map(r=>`${esc(mmdd(r.play_date))} ${esc(courseName(courseById(r.course_id),true)||r.course_note||'')}${r.tee_time?' '+esc(r.tee_time):''}${r.holes?' '+esc(r.holes):''}${r.note?' <small>'+esc(r.note)+'</small>':''}`).join('<br>')}</td>
      <td>${esc(o.staff||'')}</td><td class="c" style="white-space:nowrap">${chk(o,'roster_hotel_at')}${chk(o,'roster_golf_at')}${chk(o,'itinerary_at')}${chk(o,'invoiced_at')}</td>
      <td class="r mono">${q&&q.ok&&ratesReady()?esc(yen(q.total)):''}</td><td>${esc([t.remark_local,t.remark,o.memo,o.price_note].filter(Boolean).join(' / '))}</td></tr>`; }).join('');
  return popup(`partner_ops_${YM}`, `@page{size:A4 landscape;margin:9mm} td{font-size:8.5pt}`,
    `<h1>${esc(P.title)} <small>${esc(YM)} · ${vis.length}チーム · ${vis.reduce((a,t)=>a+t.pax,0)}名 · ${esc(P.printed)} ${new Date().toLocaleString('ja-JP')}</small></h1>
     <table><thead><tr><th>${esc(P.period)}</th><th>${esc(P.nights)}</th><th>${esc(P.pax)}</th><th>${esc(P.rep)}</th><th>${esc(P.agency)}</th><th>${esc(P.air)}</th><th>${esc(P.hotel)}</th><th>${esc(P.golf)}</th><th>${esc(P.staff)}</th><th>${esc(P.chk)}</th><th>見積</th><th>${esc(P.note)}</th></tr></thead><tbody>${rows}</tbody></table>
     <div class="ft">${esc(P.chk)} = ■済 □未</div>`);
}
function printRoster(t){
  const P=tx('pv'), o=ops(t.seq), h=hotelById(o.hotel_id), g=golf(t.seq).filter(r=>r.course_id||r.course_note);
  const trs=t.members.map(m=>`<tr><td class="c">${m.seq_in_team}</td><td><b>${esc(m.name_en||'')}</b>${m.name_kr?`<small>${esc(m.name_kr)}</small>`:''}</td><td class="c">${esc(m.gender||'')}</td><td></td></tr>`).join('');
  return popup(`roster_${t.seq}`, `@page{size:A4 portrait;margin:14mm} td,th{font-size:10.5pt;padding:2mm 2.5mm} .meta{display:grid;grid-template-columns:auto 1fr;gap:1mm 6mm;font-size:10.5pt;margin:3mm 0 5mm} .meta b{color:#333}`,
    `<h1>${esc(P.roster)} <small>${esc(t.rep)} 様 · ${t.pax}名</small></h1>
     <div class="meta"><b>${esc(P.period)}</b><span>${esc(t.dep)}（${esc(wd(t.dep))}）〜 ${esc(t.arr)}（${esc(wd(t.arr))}） ${nightsOf(t).length}${esc(P.nights)}</span><b>${esc(P.agency)}</b><span>${esc(agencyOf(t))}</span>
       <b>${esc(P.hotel)}</b><span>${esc(hotelName(h)||o.hotel_note||'—')} ${esc(roomsText(o))}</span><b>${esc(P.golf)}</b><span>${g.map(r=>`${esc(mmdd(r.play_date))} ${esc(courseName(courseById(r.course_id))||r.course_note||'')} ${esc(r.tee_time||'')}`).join('<br>')||'—'}</span><b>${esc(P.staff)}</b><span>${esc(o.staff||'')}</span></div>
     <table><thead><tr><th>${esc(P.no)}</th><th>${esc(P.name)}</th><th>${esc(P.gender)}</th><th>${esc(P.note)}</th></tr></thead><tbody>${trs}</tbody></table>
     <div class="ft">${esc(P.printed)} ${new Date().toLocaleString('ja-JP')}</div>`);
}
function printDispatch(){
  const P=tx('pv'); const rows=DAYROWS.slice().sort((a,b)=>(a.vehicle_id||999)-(b.vehicle_id||999)||(a.depart_time||'99').localeCompare(b.depart_time||'99'));
  const groups={}; rows.forEach(r=>{ const k=r.vehicle_id||0; (groups[k]=groups[k]||[]).push(r); });
  const blocks=Object.keys(groups).sort((a,b)=>Number(a)-Number(b)).map(k=>{ const v=vehById(k); const trs=groups[k].map(r=>{ const t=teamOf(r.event_seq)||{rep:'#'+r.event_seq,pax:0}; return `<tr><td class="mono c">${esc(hhmm(r.depart_time)||'—')}</td><td>${esc(routeLabel(r))}</td><td><b>${esc(t.rep)}</b> 様</td><td class="c">${t.pax}</td><td>${esc(r.staff||'')}</td><td>${esc(r.note||'')}</td></tr>`; }).join('');
    return `<h2>${esc(v?`${v.name}（${v.capacity}）`:P.unassigned)}</h2><table><thead><tr><th>${esc(P.time)}</th><th>${esc(P.leg)}</th><th>${esc(P.team)}</th><th>${esc(P.pax)}</th><th>${esc(P.staff)}</th><th>${esc(P.note)}</th></tr></thead><tbody>${trs}</tbody></table>`; }).join('');
  return popup(`dispatch_${D}`, `@page{size:A4 portrait;margin:12mm} h2{font-size:12pt;margin:4mm 0 1.5mm} td,th{font-size:10pt;padding:1.8mm 2.2mm}`,
    `<h1>${esc(P.disp)} <small>${esc(D)}（${esc(wd(D))}） · ${rows.length}便 · ${esc(P.printed)} ${new Date().toLocaleString('ja-JP')}</small></h1>${blocks||'<div class="ft">—</div>'}`);
}

function setView(v){ VIEW=v; $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); $('#v-list').hidden=v!=='list'; $('#v-disp').hidden=v!=='disp'; $('#v-def').hidden=v!=='def'; $('#btn-print').style.display=v==='list'?'':'none'; if(v==='disp'){ if(!D) D=today(); $('#d').value=D; loadDay(); } if(v==='def') renderDefs(); }
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-v]'); if(b) setView(b.dataset.v); });
function setMonth(ym){ if(!canLeave()){ $('#m').value=YM; return; } DR=null; DDR={}; YM=ym; $('#m').value=YM; load(); }
$('#m').addEventListener('change',()=>setMonth($('#m').value||today().slice(0,7))); $('#m-prev').addEventListener('click',()=>setMonth(shiftMonth(YM,-1))); $('#m-next').addEventListener('click',()=>setMonth(shiftMonth(YM,1)));

// ── 연결 ──
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn('URL·key','err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.classList.remove('connected');
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('partner_bookings').select('event_seq',{count:'exact',head:true}); if(error) throw error;
    setConn('✓','ok'); btn.textContent='✓'; btn.classList.add('connected'); btn.disabled=false;
    await load();
  }catch(e){ setConn('✕','err'); toast(tx('fail')+': '+e.message,'err'); btn.textContent='↻'; btn.classList.remove('connected'); btn.disabled=false; supa=null; }
}
$('#btn-connect').addEventListener('click',connect);
(function init(){
  const q=new URLSearchParams(location.search);
  YM=(q.get('ym')&&/^\d{4}-\d{2}$/.test(q.get('ym')))?q.get('ym'):today().slice(0,7); $('#m').value=YM;
  D=(q.get('date')&&/^\d{4}-\d{2}-\d{2}$/.test(q.get('date')))?q.get('date'):today(); $('#d').value=D;
  if(q.get('view')==='disp'||q.get('view')==='def') setView(q.get('view'));
  applyStatic(); loadCreds(); renderAll();
  if($('#sb-url').value && $('#sb-key').value) connect();
})();
</script>
