  · Min 「현지 담당 회사가 쓰던 수배서 목록(월별 xlsx)을 우리 시스템 환경에 맞게 — 파일 그대로가 아니라 우리 스타일로.

  · 권한: <body data-so-area="partner_kumamoto partner_trial">(둘 중 하나) — RLS 가 brand 로 걸러 자기 상품만 보인다.
  · 인쇄: 월 목록(A4 가로, 일본어 우선) · 팀 名簿(호텔·골프장 송부용) · 配車表(날짜별).

<head>
<meta charset="UTF-8">

<title>Yamanami 운영 관리 · 수배 목록</title>

<style>
  /* ── 공통 chrome (docs/ops-page-skeleton.html 정본 — 통째 복사) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);
    padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select,textarea{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.xs{font-size:12px;padding:3px 9px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 ── */
  main{padding:14px 20px 70px;max-width:1500px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .bar .grp{display:flex;align-items:center;gap:6px}
  .desc{font-size:11.5px;color:var(--muted);margin:0 0 12px;line-height:1.5;word-break:keep-all}
  .sum{font-size:12.5px;color:var(--text2);font-weight:700;margin-left:auto}
  .tabs{display:flex;gap:4px;background:var(--surface3);border-radius:9px;padding:3px}
  .tabs button{font-size:12.5px;font-weight:700;border:0;background:transparent;color:var(--text2);padding:5px 12px;border-radius:7px;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{font-size:12px;font-weight:700;border:1px solid var(--border2);border-radius:99px;padding:3px 10px;background:var(--surface);color:var(--text2);cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .panel h3{font-size:13.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .panel h3 .n{font-size:11px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:1px 8px}
  .warnbar{background:#fbf3e2;border:1px solid #e8d7a8;color:#7a5a16;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;margin-bottom:12px}
  .empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border2);border-radius:10px}
  .cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(380px,.8fr);gap:14px;align-items:start}
  .detail{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-gutter:stable;padding-bottom:70px}
  .dclose{display:none}
  /* 좁은 화면(노트북 125% 배율 등 1400px 미만): 목록은 전폭, 상세는 오른쪽 서랍(팀을 고르면 덮어서 열림·✕ 로 닫음) — 글자를 구겨 넣지 않는다(Min 2026-11-02 「글씨가 다 안보임」) */
  @media (max-width:1399px){
    .cols{grid-template-columns:1fr}
    .detail{display:none;position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);max-height:none;z-index:45;border-radius:0;box-shadow:-10px 0 28px rgba(0,0,0,.18)}
    .detail.open{display:block}
    .dclose{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-weight:900;cursor:pointer;margin-left:auto}
  }
  /* 블록 띠 */
  .blk{display:grid;grid-template-columns:150px 1fr;gap:6px;align-items:center;margin-bottom:6px}
  .blk .nm{font-size:12.5px;font-weight:800} .blk .nm small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  .blk .days{display:grid;grid-template-columns:repeat(var(--n,31),minmax(0,1fr));gap:2px}
  .blk .dc{font-family:var(--mono);font-size:10.5px;text-align:center;border-radius:4px;padding:3px 0;background:var(--surface3);color:var(--text2);line-height:1.2;cursor:default}
  .blk .dc b{display:block;font-size:9px;font-weight:600;color:var(--muted)}
  .blk .dc.use{background:var(--accentSoft);color:var(--accentDeep)} .blk .dc.full{background:#c8d4e6;color:#1f3a63} .blk .dc.over{background:#f3c9c0;color:var(--err);font-weight:800}
  .blk .dc.off{opacity:.35}
  /* 목록 */
  table.lt{width:100%;border-collapse:collapse;font-size:12.5px}
  .lt th{font-size:11px;font-weight:800;color:var(--text2);text-align:left;padding:6px 7px;border-bottom:2px solid var(--border2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
  .lt td{padding:7px 7px;border-bottom:1px solid var(--border);vertical-align:top;word-break:keep-all}
  .lt td.nw{white-space:nowrap} .lt .gl{font-size:12px;line-height:1.35;word-break:keep-all} .lt .gl .mono{white-space:nowrap}
  .lt tr.tm{cursor:pointer} .lt tr.tm:hover td{background:var(--surface2)} .lt tr.tm.sel td{background:var(--accentSoft)}
  .lt td.n,.lt th.n{text-align:right;font-family:var(--mono);font-weight:800}
  .lt small{display:block;color:var(--muted);font-size:11px;font-weight:600;line-height:1.3}
  .lt .mono{font-family:var(--mono);font-weight:700}
  /* 비고 보기(Min 2026-11-03 「엠클릭의 현지비고란을 보고 싶을 때 클릭해서 볼 수 있게」) — 대표자 칸의 작은 버튼 → 아래 줄에 현지비고·비고 원문 */
  .lt .rmkbtn{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--accent);background:transparent;border:1px solid var(--border2);border-radius:6px;padding:1px 7px;cursor:pointer;line-height:1.5} .lt .rmkbtn.on{background:var(--accentSoft);border-color:var(--accent)}
  .lt tr.rmkrow td{background:var(--surface2);padding:6px 10px 9px 28px;cursor:default} .rmkbox{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;line-height:1.5} .rmkbox b{white-space:nowrap;color:var(--text2)} .rmkbox div{white-space:pre-wrap;word-break:keep-all}
  .dots{display:flex;gap:3px} .dot{width:16px;height:16px;border-radius:50%;background:var(--surface3);color:var(--muted);font-size:9.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border2)}
  .dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .bd{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;margin:1px 2px 1px 0;white-space:nowrap}
  .bd.err{background:#f7e6e2;color:var(--err)} .bd.warn{background:#fbf3e2;color:#7a5a16} .bd.info{background:var(--surface3);color:var(--text2)} .bd.brand{background:var(--accentSoft);color:var(--accentDeep)}
  .yen{font-family:var(--mono);font-weight:800;white-space:nowrap}
  /* 상세 */
  .detail h2{font-size:17px;font-weight:900;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .detail h2 small{font-size:12px;font-weight:700;color:var(--text2)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:8px 0} .kv b{color:var(--text2);font-weight:700;white-space:nowrap}
  .sec{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
  .sec h4{font-size:12.5px;font-weight:800;color:var(--accentDeep);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sec h4 .r{margin-left:auto;display:flex;gap:6px;align-items:center}
  .frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .frm label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--text2)}
  .frm label .inp{font-weight:600;color:var(--text);padding:5px 8px} .frm .wide{grid-column:1/-1}
  .frm input[type=number]{width:100%}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  .mini th{font-size:10.5px;font-weight:800;color:var(--text2);text-align:left;padding:3px 5px;border-bottom:1px solid var(--border2);white-space:nowrap}
  .mini td{padding:3px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
  .mini .inp{padding:4px 6px;font-size:12px;width:100%} .mini input[type=time]{width:104px} .mini input[type=date]{width:136px} .mini input.sm{width:84px}
  .detail{overflow-x:hidden}
  .mini input[data-r=name_ja],.mini input[data-r=name_ko],.mini input[data-r=name]{min-width:150px}
  /* 상세의 골프·배차 줄 = 2줄 격자(표에 7칸을 구겨 넣지 않는다 — 날짜칸 136px 확보) */
  .grow{display:grid;grid-template-columns:128px minmax(100px,1fr) 74px 52px 28px;gap:4px 6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
  .grow.drow{grid-template-columns:128px minmax(100px,1fr) 100px auto}
  .grow .inp{padding:4px 6px;font-size:12px;width:100%;min-width:0} .grow .l2{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap} .grow .l2 .inp{flex:1;min-width:110px}
  .grow.hd{font-size:10.5px;font-weight:800;color:var(--text2);padding:2px 0;border-bottom:1px solid var(--border2)} .grow.prop{opacity:.75;background:var(--surface2)}
  .grow .x{border:0;background:transparent;color:var(--err);font-weight:900;cursor:pointer;font-size:14px;justify-self:center}
  .ckl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--text2);white-space:nowrap} .frm label.ckl{flex-direction:row;align-items:center;flex-wrap:wrap}
  .mini tr.prop td{opacity:.7;background:var(--surface2)} .mini .x{border:0;background:transparent;color:var(--err);font-weight:900;cursor:pointer;font-size:14px}
  .mini .over{color:var(--err);font-weight:800}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ck{border:1px solid var(--border2);border-radius:9px;padding:7px 10px;background:var(--surface2);cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text2);display:flex;flex-direction:column;gap:2px}
  .ck.on{background:var(--accentSoft);border-color:#b4cda0;color:var(--accentDeep)} .ck small{font-weight:600;font-size:11px;color:var(--muted)}
  .quote{background:var(--surface2);border-radius:9px;padding:8px 10px;font-size:12.5px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px 10px}
  .quote b{font-family:var(--mono);font-weight:800;font-size:13px} .quote small{display:block;color:var(--muted);font-size:10.5px;font-weight:600}
  .quote .tot b{color:var(--accentDeep);font-size:14.5px}
  .members{font-size:12px;color:var(--text2);line-height:1.6}
  .members b{color:var(--text);font-weight:700}
  /* 명단: 객실 배정·골프 조 — 지정한 칸은 굵게(accent 테두리), 자동 칸은 흐리게 */
  .mrow{display:grid;grid-template-columns:20px minmax(84px,1fr) 24px minmax(104px,132px) minmax(84px,104px);gap:3px 6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px}
  .mrow.hd{font-size:10.5px;font-weight:800;color:var(--text2);padding:2px 0;border-bottom:1px solid var(--border2)}
  .mrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .mrow .nm b{font-weight:700} .mrow .nm small{color:var(--muted);margin-left:4px;font-size:10.5px}
  .mrow .inp{padding:3px 4px;font-size:12px;width:100%;min-width:0} .mrow .inp.au{color:var(--text2)} .mrow .inp.pin{font-weight:800;border-color:var(--accent);background:var(--accentSoft)}
  .mrow .c{text-align:center;color:var(--text2)}
  .asum{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center} .asum>b{font-size:10.5px;font-weight:800;color:var(--text2);margin-right:2px;white-space:nowrap} .asum .bd{white-space:normal;font-weight:700} .asum .bd b{font-weight:900;margin-right:3px} .asum .bd i{font-style:normal;opacity:.65}
  .mfold .hint{margin-top:6px} .mfold .plus{margin-left:6px}
  .plus{font-size:11.5px;font-weight:700;color:var(--accent);border:1px dashed var(--accent);background:transparent;border-radius:7px;padding:3px 9px;cursor:pointer}
  /* 배차 */
  .veh{display:inline-flex;flex-direction:column;border:1px solid var(--border2);border-radius:9px;padding:5px 10px;background:var(--surface);font-size:12px;font-weight:700;min-width:120px}
  .veh small{font-weight:600;color:var(--muted);font-size:10.5px} .veh.over{border-color:var(--err);background:#f7e6e2}
  /* 기본값 */
  .defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}   /* 호텔 블록·골프장·요금표 = 전폭 한 줄, 그 아래 차량·담당자 둘 나란히(Min 2026-11-03) */
  .defs .panel{margin:0;overflow:auto} #def-hotels,#def-courses{grid-column:1/-1}
  @media (max-width:1100px){ .defs{grid-template-columns:1fr} }
  /* 기간별 요금표(SQL 161) */
  .rp{border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--surface2)} .rp.pend{border-style:dashed;border-color:var(--accent)}
  .rph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--text2)} .rph .inp{padding:5px 8px;font-size:12.5px} .rph .r{margin-left:auto;display:flex;gap:6px;align-items:center}
  .rgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:6px 16px;margin-top:6px} .rgrid .full{grid-column:1/-1} .rgrid>*{min-width:0;overflow:auto}
  @media (max-width:900px){ .rgrid{grid-template-columns:1fr} }
  table.rt{border-collapse:collapse;font-size:12px;width:100%} .rt th{font-size:10.5px;font-weight:800;color:var(--text2);padding:3px 4px;border-bottom:1px solid var(--border2);text-align:center;white-space:nowrap} .rt th.lb,.rt td.lb{text-align:left;white-space:nowrap;font-weight:700;color:var(--text2)}
  .rt td{padding:2px 3px;border-bottom:1px solid var(--border)} .rt input.rin{width:86px;padding:4px 6px;font-size:12px;text-align:right;border:1px solid var(--border2);border-radius:6px;background:var(--surface)}

let PRINT_JA=false;   // 인쇄물(월 목록·名簿·配車表)을 조립하는 동안만 true — 인쇄물은 화면 언어와 무관하게 일본어다(머리글 pv 가 세 언어 모두 일본어)
function lang(){ if(PRINT_JA) return 'ja'; return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function inJa(fn){ PRINT_JA=true; try{ return fn(); } finally{ PRINT_JA=false; } }   // 토스트·팝업 버튼은 화면 언어로 남게, 조립이 끝나면 바로 내린다
function tx(k,...a){ const d=L[lang()]||L.ja; let v=(d[k]!==undefined)?d[k]:L.ja[k]; if(typeof v==='function') return a.length?v(...a):v; return v===undefined?k:v; }
function applyStatic(){
  [['t-step','step'],['t-connHint','connHint'],['t-desc','desc'],['t-tabList','tabList'],['t-tabDef','tabDef'],['btn-print','print'],['t-blocks','blocks'],['t-blocksHint','blocksHint'],['nosql','noSql']]
    .forEach(([id,k])=>{ const e=document.getElementById(id); if(e) e.textContent=tx(k); });
  $('#q').placeholder=tx('q');
}
window.onSaizenLangChange=function(){ applyStatic(); renderAll(); };
function toast(msg,cls){ const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:''); t.textContent=msg; $('#toast').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); },2600); }
function setConn(t,c){ const e=$('#conn-state'); e.textContent=t; e.className='pill'+(c?' '+c:''); }
function who(){ try{ return (window.__so_getUser&&__so_getUser())||null; }catch(e){ return null; } }
async function logChange(id,action,label,changes){ try{ await supa.from('change_log').insert({entity:'partner_ops',entity_id:String(id),action,label,changes:changes||null,changed_by:who()}); }catch(e){} }

const pad2=n=>String(n).padStart(2,'0');
function today(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function daysIn(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function dstr(ym,d){ return `${ym}-${pad2(d)}`; }
function addDays(ds,n){ const [y,m,d]=ds.split('-').map(Number); const x=new Date(y,m-1,d+n); return `${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`; }
function shiftMonth(ym,n){ const [y,m]=ym.split('-').map(Number); const x=new Date(y,m-1+n,1); return `${x.getFullYear()}-${pad2(x.getMonth()+1)}`; }

function mmdd(ds){ return ds?`${Number(ds.slice(5,7))}/${Number(ds.slice(8,10))}`:''; }
const WD=['日','月','火','水','木','金','土'];
function wd(ds){ const [y,m,d]=ds.split('-').map(Number); return WD[new Date(y,m-1,d).getDay()]; }
function hhmm(v){ if(!v) return ''; const s=String(v).trim(); let m=s.match(/(\d{1,2}):(\d{2})/); if(m) return pad2(m[1])+':'+m[2]; m=s.match(/^(\d{1,2})(\d{2})$/); if(m) return pad2(m[1])+':'+m[2]; return ''; }
function addMin(hm,delta){ const m=hhmm(hm); if(!m) return ''; let t=Number(m.slice(0,2))*60+Number(m.slice(3))+delta; t=Math.max(0,Math.min(23*60+59,t)); return pad2(Math.floor(t/60))+':'+pad2(t%60); }

// ── 견적·점검 ──
function quoteFix(o){ const f=o&&o.quote_fix; return (f&&typeof f==='object'&&!Array.isArray(f))?f:null; }
function quoteFor(t, ov){   // ov={ops,golf,disp} = 상세 초안(저장 전 값으로 견적). 인솔 요금 = 그 팀 상품(t.brand)의 줄 — 송영 비용은 인솔 요금에 들어 있어 따로 더하지 않는다(Min 2026-11-11)
  if(!(window.SZCore&&SZCore.partnerQuote)) return null;
  const o=ov?ov.ops:ops(t.seq), g=(ov?ov.golf:golf(t.seq)).filter(r=>r.course_id||r.course_note), h=hotelById(o.hotel_id);
  const q=SZCore.partnerQuote({ from:t.dep, to:t.arr, hotelId:o.hotel_id||null, brand:t.brand, golf:g.length?g.map(r=>({date:r.play_date,courseId:r.course_id||null})):undefined,
    surcharge:h?h.surcharge:0, twin:o.twin||0, single:o.single||0, triple:o.triple||0, pax:t.pax, adj:o.price_adj||0, singleRate:(o.single_rate==null?'':o.single_rate) }, RATEROWS);
  // 견적 수정(Min 2026-11-11 「요금표 자동 OK, 그런데 수정 기능도」) — 1인 요금(트윈·싱글·트리플)이나 팀 합계를 직접 적으면 그 값이 이긴다. 자동 값은 auto 에 남긴다.
  const f=quoteFix(o); if(!q||!q.ok||!f) return q;
  const num=k=>(f[k]===''||f[k]==null||!isFinite(Number(f[k])))?null:Number(f[k]);
  const out=Object.assign({},q,{auto:{twin:q.twin,single:q.single,triple:q.triple,total:q.total},fixed:false});
  ['twin','single','triple'].forEach(k=>{ const v=num(k); if(v!=null){ out[k]=v; out.fixed=true; } });
  if(out.fixed) out.total=out.twin*Number(o.twin||0)*2+out.single*Number(o.single||0)+out.triple*Number(o.triple||0)*3;
  const tv=num('total'); if(tv!=null){ out.total=tv; out.fixed=true; }
  if(out.fixed){ out.complete=true; out.missing=[]; }
  return out;
}
function missingText(list){ const lbl={hotel:tx('rHotel'),golf:tx('rGolf'),single:tx('single')}; const seen=new Set(); const out=[]; (list||[]).forEach(m=>{ const [k,d]=m.split(':'); const s=`${lbl[k]||k} ${mmdd(d)}`; if(!seen.has(s)){ seen.add(s); out.push(s); } }); return out.slice(0,6).join(' · ')+(out.length>6?' …':''); }
function blockUse(hotelId, ds){ let u=0; TEAMS.forEach(t=>{ const o=ops(t.seq); if(Number(o.hotel_id)===Number(hotelId) && o.use_block!==false && t.dep<=ds && ds<t.arr) u+=Number(o.twin||0); }); return u; }   // use_block=false(블록 외)는 세지 않는다
function blockOn(h, ds){ if(!h||!(h.block_twin>0)) return 0; if(h.block_from&&ds<h.block_from) return 0; if(h.block_to&&ds>h.block_to) return 0; return h.block_twin; }
// 필수 확인(err) = 이대로는 수배가 안 되는 것 · 확인(warn) = 채워야 할 것. 목록 위 「필수 확인」 띠·행 왼쪽 빨간 줄·상세 맨 위 상자가 같은 목록을 쓴다.
function issues(t){
  const o=ops(t.seq), out=[]; const q=quoteFor(t), fixed=!!(q&&q.fixed);
  if(!HAS_OPS) return out;
  if(!o.hotel_id&&!(o.hotel_note||'').trim()) out.push({k:'issNoHotel',sev:'err'});
  const rooms=Number(o.twin||0)+Number(o.single||0)+Number(o.triple||0);
  if(!rooms) out.push({k:'issRooms0',sev:'err'}); else if(Number(o.twin||0)*2+Number(o.single||0)+Number(o.triple||0)*3!==t.pax) out.push({k:'issRoomsMis',sev:'err'});
  if(!fixed && Number(o.single||0)>0 && (o.single_rate==null||o.single_rate==='') && (!ratesReady()||(q&&q.missing.some(m=>m.startsWith('single:'))))) out.push({k:'issSingleRate',sev:'err'});
  const h=hotelById(o.hotel_id); if(h&&o.use_block!==false&&nightsOf(t).some(ds=>blockOn(h,ds)>0&&blockUse(h.id,ds)>blockOn(h,ds))) out.push({k:'issBlock',sev:'warn'});   // 블록은 확보 수량이지 상한이 아니다 — 초과는 「확인」(주황)
  if(effLegs(t).some(r=>legBad(t,r))) out.push({k:'issVeh',sev:'err'});
  if(HAS_ASSIGN&&canAssign()&&(t.members||[]).length){ if(roomingOf(t,o).over.length) out.push({k:'issRoomOver',sev:'warn'}); if(savedGrouping(t).over.length) out.push({k:'issGrpOver',sev:'warn'}); }   // 지정이 정원을 넘었다(객실 2명·조 4명) — 막지 않고 알린다
  const g=golf(t.seq).filter(r=>r.course_id||(r.course_note||'').trim()); const need=nightsOf(t).length; if(g.length<need) out.push({k:'issGolf',sev:'warn',n:need-g.length});
  if(!(o.staff||'').trim()) out.push({k:'issStaff',sev:'warn'});
  if(/미기재/.test(agencyOf(t))) out.push({k:'issAgency',sev:'warn'});
  const m=repMember(t)||{}; if(!t.combo&&(!hhmm(m.loc_arr_time)||!hhmm(m.ret_dep_time))) out.push({k:'issFlight',sev:'warn'});
  if(!fixed&&ratesReady()&&q){ const miss=q.missing.filter(x=>!x.startsWith('single:')); if(miss.length) out.push({k:'issRateMissing',sev:'warn',n:miss.length}); }
  if(!OPS[t.seq]) out.push({k:'issRemark',sev:'sug'});
  return out;
}
function issOf(t){ return ISS[t.seq]||(ISS[t.seq]=issues(t)); }
function issLabel(i){ return i.n!=null?tx(i.k,i.n):tx(i.k); }
const sevRank=i=>i.sev==='err'?0:(i.sev==='warn'?1:2);
// ── 비고 플랜(SZCore.partnerRemarkPlan — step1 의 자동 채움과 같은 규칙) · 초안(DR) ──
function planFor(t){ if(PLAN[t.seq]) return PLAN[t.seq]; let p; try{ p=(window.SZCore&&SZCore.partnerRemarkPlan)?SZCore.partnerRemarkPlan([t.remark,t.remark_local],{pax:t.pax,hotels:HOTELS,courses:COURSES,segFrom:t.dep,segTo:t.arr,product:t.product}):null; }catch(e){ p=null; }
  p=p||{hotelId:null,hotels:[],single:0,twin:0,triple:0,golf:[],golfAssumed:0,agency:'',agencyExplicit:false,empty:true,sig:''}; PLAN[t.seq]=p; return p; }
function draftFor(t){ if(DR&&DR.seq===t.seq) return DR;
  DR={seq:t.seq, ops:Object.assign({},OPS[t.seq]||{}), golf:(GOLF[t.seq]||[]).map(r=>Object.assign({},r)), disp:(DISP[t.seq]||[]).map(r=>Object.assign({},r)), golfDel:[], dispDel:[], dirty:false};
  if(!DR.golf.length) nightsOf(t).forEach((ds,i)=>DR.golf.push({id:TMP--,event_seq:t.seq,play_date:ds,sort:i,_ph:true}));   // 골프 줄이 없으면 묵는 날마다 빈 줄을 보여 준다 — 코스를 고르기 전에는 저장하지 않는다
  return DR; }

function canLeave(){ if(!dirty()) return true; return confirm(tx('unsavedConfirm')); }
function rowChanged(saved, row){ if(!saved) return true; return Object.keys(row).some(k=>k!=='id'&&String(row[k]==null?'':row[k])!==String(saved[k]==null?'':saved[k])); }
async function commitDraft(){
  const t=teamOf(DR&&DR.seq); if(!t||!DR) return false; if(!HAS_OPS){ toast(tx('noSql'),'warn'); return false; }
  const d=DR; let ok=true; const clean=r=>{ const row=Object.assign({},r); Object.keys(row).forEach(k=>{ if(k[0]==='_') delete row[k]; }); return row; };   // _ph·_pax·_auto 는 화면 전용
  const base=OPS[t.seq]||null, sameV=(a,b)=>JSON.stringify(a==null?null:a)===JSON.stringify(b==null?null:b);   // 고친 칸만 보낸다 — 화면을 열어 둔 사이 다른 사람이 고친 칸을 옛 값으로 덮어쓰지 않는다
  const patch={}; OPS_FIELDS.concat(HAS_USE_BLOCK?['use_block']:[]).concat(HAS_AUTOSIG?['auto_sig']:[]).concat(HAS_QFIX?['quote_fix']:[]).concat(HAS_ASSIGN?['assign']:[]).forEach(f=>{ if(d.ops[f]!==undefined&&(!base||!sameV(d.ops[f],base[f]))) patch[f]=d.ops[f]; });

  const prevParty=(OPS[t.seq]||{}).party||null;

  if(ok&&!d.ops.party&&prevParty){ const rest=TEAMS.filter(x=>x.seq!==t.seq&&Number(ops(x.seq).party)===Number(prevParty)); if(rest.length===1) await saveOps(rest[0].seq,{party:null},'party',true); }   // 묶음을 풀어 한 팀만 남으면 그 팀의 묶음 번호도 지운다
  if(ok&&d.ops.party&&(Number(d.ops.party)!==Number(prevParty))){ const v=Number(d.ops.party); await saveOps(v,{party:Math.min(v,t.seq)},'party',true); await saveOps(t.seq,{party:Math.min(v,t.seq)},'party',true); }
  for(const id of d.golfDel){ const {error}=await supa.from('partner_golf').delete().eq('id',id); if(error){ toast(tx('saveFail')+': '+error.message,'err'); ok=false; } else { GOLF[t.seq]=(GOLF[t.seq]||[]).filter(r=>r.id!==id); logChange(t.seq,'golf_del',String(id)); } }
  for(const r of d.golf){ if(r._ph) continue; const row=clean(r); if(!HAS_GAUTO) delete row.auto; const saved=(GOLF[t.seq]||[]).find(x=>x.id===r.id); if(row.id<0) delete row.id; else if(!rowChanged(saved,row)) continue; const sv=await saveGolf(row); if(!sv) ok=false; else r.id=sv.id; }   // 들어간 새 줄은 초안에도 진짜 id 를 되쓴다 — 일부 실패 뒤 다시 [저장]할 때 같은 줄을 또 넣지 않게
  for(const id of d.dispDel){ const {error}=await supa.from('partner_dispatch').delete().eq('id',id); if(error){ toast(tx('saveFail')+': '+error.message,'err'); ok=false; } else { DISP[t.seq]=(DISP[t.seq]||[]).filter(r=>r.id!==id); logChange(t.seq,'dispatch_del',String(id)); } }
  for(const r of d.disp){ const row=clean(r); if(!HAS_PTS){ delete row.from_pt; delete row.via_pt; delete row.to_pt; } const saved=(DISP[t.seq]||[]).find(x=>x.id===r.id); if(row.id<0) delete row.id; else if(!rowChanged(saved,row)) continue; const sv=await saveDisp(row); if(!sv) ok=false; else r.id=sv.id; }
  if(ok){ DR=null; toast(tx('saved'),'ok'); }
  renderAll(); return ok;
}


// ── 비고 자동 반영(Min 2026-11-11 「비고대로 채우면 되지. 왜 비고대로 채우기 기능이 또 있고」) — 화면을 열 때 버튼 없이 맞춘다 ──
//   ① 수배 행이 없는 팀 → 새 행: 호텔(비고 → 없으면 상품별 기본)·객실 수(비고 → 없으면 인원으로 2인 1실)·담당 기본값·골프 줄(auto)
//   ② 수배 행이 있는 팀 → 「비고에서 읽은 값」이 지난번과 달라진 항목만 비고대로 바꾼다(호텔·객실 수·그날 코스). 달라지지 않은 항목은 여기서 직접 고친 값 그대로.
//      비어 있는 칸(호텔 없음·객실 수 0·골프 줄 없는 날)은 언제든 채운다. 비고에서 빠진 라운드는 손대지 않은 자동 줄(티타임·비고 없음)일 때만 지운다.
//   서명(auto_sig) = 읽은 값 그 자체(v2|h호텔|t트윈|s싱글|r트리플|g날짜@코스…). 옛 해시 서명은 처음 한 번 v2 로 바꾼다.
//   읽기 전용 계정은 RLS 에 막히므로 조용히 건너뛴다.
let LOAD_TOK=0, AUTO_OFF=false, LOAD_AGAIN=false, LOADERR='';   // LOADERR = 이 달 조회가 실패했다(앞 달 내용을 새 달 이름 아래 남기지 않는다)
function planGolfRows(p){ return (p.golf||[]).filter(x=>x.date&&x.courseId); }
function readingOf(p){ return {h:Number(p.hotelId)||0,t:p.twin||0,s:p.single||0,r:p.triple||0,g:planGolfRows(p).map(x=>x.date+'@'+x.courseId)}; }
function sigOf(rd){ return ['v2','h'+rd.h,'t'+rd.t,'s'+rd.s,'r'+rd.r,'g'+rd.g.join(',')].join('|'); }
function parseSig(s){ if(typeof s!=='string'||s.indexOf('v2|')!==0) return null; const a=s.split('|'); if(a.length!==6) return null; const n=x=>Number(String(x).slice(1))||0; return {h:n(a[1]),t:n(a[2]),s:n(a[3]),r:n(a[4]),g:a[5].slice(1).split(',').filter(Boolean)}; }
async function autoSync(){
  if(AUTO_OFF||!HAS_OPS||!supa||!TEAMS.length||document.getElementById('so-readonly')) return;
  const tok=LOAD_TOK, denied=e=>/row-level security|permission denied/i.test(String((e&&e.message)||''));
  let nNew=0, nFix=0, nGolf=0; const logs=[], fresh=new Set(), fullSig={};
  try{
    // ① 수배 행이 없는 팀
    const cand=TEAMS.filter(t=>!OPS[t.seq]);
    if(cand.length){
      const rows=cand.map(t=>{ const p=planFor(t); const r={event_seq:t.seq, hotel_id:p.hotelId||(DEFAULTS.hotel||{})[t.brand]||null, twin:p.twin||0, single:p.single||0, triple:p.triple||0, staff:(DEFAULTS.staff||{})[t.brand]||null, agency:(p.agencyExplicit&&p.agency!==t.agency)?p.agency:null}; if(HAS_AUTOSIG){ const rd=readingOf(p); if(rd.g.length&&!(GOLF[t.seq]||[]).length){ fullSig[t.seq]=sigOf(rd); rd.g=[]; } r.auto_sig=sigOf(rd); } return r; });   // 골프 줄을 넣을 팀은 서명에 골프를 아직 적지 않는다 — 골프 줄 삽입이 실패·중단되면 다음 조회에서 ② 가 채운다
      const {data,error}=await supa.from('partner_ops').upsert(rows,{onConflict:'event_seq',ignoreDuplicates:true}).select();
      if(error){ if(denied(error)){ AUTO_OFF=true; return; } throw error; }
      if(tok!==LOAD_TOK) return;
      const made=data||[], grow=[];
      made.forEach(o=>{ const t=teamOf(o.event_seq); if(!t) return; OPS[o.event_seq]=o; fresh.add(o.event_seq); const p=planFor(t);
        if(!(GOLF[o.event_seq]||[]).length) planGolfRows(p).forEach((x,i)=>{ const r={event_seq:o.event_seq,play_date:x.date,course_id:x.courseId,sort:i}; if(HAS_GAUTO) r.auto=true; grow.push(r); });
        logs.push({id:o.event_seq,action:'remark_auto',label:hotelName(hotelById(o.hotel_id))||''}); });
      nNew=fresh.size;
      const late=cand.filter(t=>!fresh.has(t.seq)).map(t=>t.seq);   // 그 사이 다른 사람이 만든 행 = 그대로 읽어 온다
      if(late.length){ try{ (await fetchIn('partner_ops','*','event_seq',late)).forEach(r=>{ OPS[r.event_seq]=r; }); }catch(e){} }
      if(grow.length){ const g=await supa.from('partner_golf').insert(grow).select(); if(!g.error){ (g.data||[]).forEach(r=>{ (GOLF[r.event_seq]=GOLF[r.event_seq]||[]).push(r); }); nGolf+=(g.data||[]).length;
          for(const k of Object.keys(fullSig)){ if(!grow.some(r=>String(r.event_seq)===k)) continue; const u=await supa.from('partner_ops').update({auto_sig:fullSig[k]}).eq('event_seq',Number(k)).select(); if(!u.error&&(u.data||[])[0]) OPS[u.data[0].event_seq]=u.data[0]; } } }   // 골프 줄이 들어간 뒤에야 서명에 골프까지 적는다
      if(tok!==LOAD_TOK) return;
    }
    // ② 수배 행이 있는 팀 — 비고에서 읽은 값이 달라진 항목만 비고대로
    if(HAS_AUTOSIG){
      for(const t of TEAMS){ const o=OPS[t.seq]; if(!o||fresh.has(t.seq)) continue; const p=planFor(t), nr=readingOf(p), ns=sigOf(nr); if(o.auto_sig===ns) continue;
        const old=parseSig(o.auto_sig), follow=!old&&!!o.auto_sig&&!!p.sig&&o.auto_sig!==p.sig;   // 옛 서명(해시)인데 그 뒤 비고가 바뀜 → 비고가 말하는 호텔·코스는 비고대로
        const patch={}, gAdd=[], gUpd=[], gDel=[];
        const curH=Number(o.hotel_id)||0;
        if(nr.h&&curH!==nr.h&&((!curH&&!String(o.hotel_note||'').trim())||(old&&old.h!==nr.h)||follow)) patch.hotel_id=nr.h;
        const cr=[Number(o.twin)||0,Number(o.single)||0,Number(o.triple)||0];
        if((nr.t||nr.s||nr.r)&&(cr[0]!==nr.t||cr[1]!==nr.s||cr[2]!==nr.r)&&(!(cr[0]||cr[1]||cr[2])||(old&&(old.t!==nr.t||old.s!==nr.s||old.r!==nr.r)))){ patch.twin=nr.t; patch.single=nr.s; patch.triple=nr.r; }
        const g=GOLF[t.seq]||[], onDate=ds=>g.filter(r=>String(r.play_date).slice(0,10)===ds), oldSet=new Set(old?old.g:[]), pg=planGolfRows(p);
        pg.forEach(x=>{ const rows=onDate(x.date);
          if(!rows.length){ const r={event_seq:t.seq,play_date:x.date,course_id:x.courseId,sort:g.length+gAdd.length}; if(HAS_GAUTO) r.auto=true; gAdd.push(r); return; }
          if(rows.some(r=>Number(r.course_id)===Number(x.courseId))) return;
          if(((old&&!oldSet.has(x.date+'@'+x.courseId))||follow)&&rows.length===1) gUpd.push({id:rows[0].id,course_id:x.courseId}); });
        if(old&&HAS_GAUTO) old.g.forEach(k=>{ const a=k.split('@'); if(pg.some(x=>x.date===a[0])) return; onDate(a[0]).forEach(r=>{ if(Number(r.course_id)===Number(a[1])&&r.auto&&!r.tee_time&&!String(r.note||'').trim()&&!r.roster_sent) gDel.push(r.id); }); });
        let stop=false;
        if(gAdd.length){ const gi=await supa.from('partner_golf').insert(gAdd).select(); if(gi.error){ if(denied(gi.error)){ AUTO_OFF=true; break; } throw gi.error; } if(tok!==LOAD_TOK) return; (gi.data||[]).forEach(r=>{ (GOLF[t.seq]=GOLF[t.seq]||[]).push(r); }); }
        for(const u of gUpd){ const gu=await supa.from('partner_golf').update({course_id:u.course_id}).eq('id',u.id).select(); if(gu.error){ if(denied(gu.error)){ AUTO_OFF=true; stop=true; break; } throw gu.error; } const row=(gu.data||[])[0], list=GOLF[t.seq]||[]; if(row){ const i=list.findIndex(r=>r.id===row.id); if(i>=0) list[i]=row; } }
        if(stop) break;
        if(gDel.length){ const gd=await supa.from('partner_golf').delete().in('id',gDel); if(gd.error){ if(denied(gd.error)){ AUTO_OFF=true; break; } throw gd.error; } GOLF[t.seq]=(GOLF[t.seq]||[]).filter(r=>!gDel.includes(r.id)); }
        if(tok!==LOAD_TOK) return;
        patch.auto_sig=ns;
        const u=await supa.from('partner_ops').update(patch).eq('event_seq',t.seq).select();
        if(u.error){ if(denied(u.error)){ AUTO_OFF=true; break; } throw u.error; }
        if(tok!==LOAD_TOK) return;
        if(!(u.data||[]).length){ AUTO_OFF=true; break; }   // 0행 = 쓰기 권한 없음(RLS)
        OPS[t.seq]=u.data[0];
        const nG=gAdd.length+gUpd.length+gDel.length, filled=Object.keys(patch).filter(k=>k!=='auto_sig'); nGolf+=nG;
        if(filled.length||nG){ nFix++; logs.push({id:t.seq,action:'remark_auto_fill',label:filled.concat(nG?['golf '+nG]:[]).join(', ')}); }
      }
    }
  }catch(e){ try{ console.warn('partner_ops autoSync',e); }catch(_){} }
  if(tok!==LOAD_TOK) return;
  if(logs.length){ try{ await supa.from('change_log').insert(logs.map(l=>({entity:'partner_ops',entity_id:String(l.id),action:l.action,label:l.label,changes:null,changed_by:who()}))); }catch(e){} }
  if(nNew||nFix||nGolf){ if(DR&&!DR.dirty) DR=null; toast(tx('autoDone',nNew,nFix,nGolf),'ok'); }
  renderAll();
}

// ── 로드 ──
async function fetchIn(table, sel, col, ids, extra){ let out=[]; for(let i=0;i<ids.length;i+=200){ let q=supa.from(table).select(sel).in(col,ids.slice(i,i+200)); if(extra) q=extra(q); const {data,error}=await q; if(error) throw error; out=out.concat(data||[]); } return out; }
async function loadRefs(){
  const [h,c,v,s,st]=await Promise.all([
    supa.from('partner_hotels').select('*').order('sort').order('id'),
    supa.from('partner_courses').select('*').order('sort').order('id'),
    supa.from('partner_vehicles').select('*').order('sort').order('id'),
    supa.from('partner_staff').select('*').order('sort').order('id'),
    supa.from('partner_settings').select('*')]);
  for(const r of [h,c,v,s,st]) if(r.error) throw r.error;
  HOTELS=h.data||[]; COURSES=c.data||[]; VEHICLES=v.data||[]; STAFF=s.data||[];
  DEFAULTS={}; RATES={}; (st.data||[]).forEach(r=>{ if(r.key==='partner_defaults') DEFAULTS=r.value||{}; if(r.key==='rates') RATES=r.value||{}; });
  await loadRates();
}
async function loadRates(){   // 기간별 요금표(SQL 161). 표가 없거나 비어 있으면 옛 공통 요금표(partner_settings.rates)를 같은 모양의 행으로
  HAS_RATES=false; RATEROWS=[];
  try{ const {data,error}=await supa.from('partner_rates').select('*').order('id'); if(error) throw error; HAS_RATES=true; RATEROWS=(data||[]).map(r=>Object.assign({},r,{prices:r.prices||{}})); }
  catch(e){ HAS_RATES=false; }
  if(!RATEROWS.length && window.SZCore&&SZCore.partnerRateRows) RATEROWS=SZCore.partnerRateRows(RATES);
}
async function load(){
  if(!supa||!YM) return; if(LOADING){ LOAD_AGAIN=true; return; }   // 조회 중에 달이 또 바뀌면 버리지 않는다 — 끝난 뒤 최신 달로 한 번 더 조회
  LOADING=true; LOAD_TOK++; const ymQ=YM; LOADERR='';
  const m1=dstr(YM,1), mEnd=dstr(YM,daysIn(YM));
  $('#sum').textContent=tx('loading');
  try{
    const {data:bs,error}=await supa.from('partner_bookings').select('event_seq,brand,event_no,status,rep_name,pax,dep_date,arr_date,seg_from,seg_to,seg_nights,seg_sure,combo,product_name,origin,airline,remark,remark_local,agency')
      .lte('seg_from',mEnd).gte('seg_to',m1).neq('status','대기').order('seg_from').order('event_seq'); if(error) throw error;
    const seqs=(bs||[]).map(b=>b.event_seq);
    if(HAS_PASSPORT==null){ const pp=await supa.from('partner_members').select('passport_no',{count:'exact',head:true}); HAS_PASSPORT=!pp.error; }   // SQL 164(호텔 제출 명단 열) 적용 여부
    const ms=await fetchIn('partner_members','id,event_seq,seq_in_team,is_rep,name_kr,name_en,gender,dep_flight,ret_flight,origin,airline,dep_time,loc_arr_time,ret_dep_time,kor_arr_time'+(HAS_PASSPORT?',name_en_last,name_en_first,birth,passport_no,passport_exp,passport_country':''),'event_seq',seqs);
    const byTeam={}; ms.forEach(m=>{ (byTeam[m.event_seq]=byTeam[m.event_seq]||[]).push(m); });
    TEAMS=(bs||[]).map(b=>({ seq:b.event_seq, brand:b.brand, no:String(b.event_no||b.event_seq), rep:b.rep_name||'', pax:Number(b.pax||0)||0, status:b.status,
      dep:String(b.seg_from||b.dep_date||'').slice(0,10), arr:String(b.seg_to||b.arr_date||'').slice(0,10), fullDep:String(b.dep_date||'').slice(0,10), fullArr:String(b.arr_date||'').slice(0,10),
      combo:!!b.combo, sure:b.seg_sure!==false, product:b.product_name||'', origin:b.origin||'', airline:b.airline||'', remark:b.remark||'', remark_local:b.remark_local||'', agency:b.agency||'',
      members:(byTeam[b.event_seq]||[]).sort((a,c)=>(a.seq_in_team||0)-(c.seq_in_team||0)) }));
    OPS={}; GOLF={}; DISP={}; PLAN={}; DR=null;
    try{
      await loadRefs();
      const [o,g,d]=await Promise.all([fetchIn('partner_ops','*','event_seq',seqs), fetchIn('partner_golf','*','event_seq',seqs), fetchIn('partner_dispatch','*','event_seq',seqs)]);
      o.forEach(r=>{ OPS[r.event_seq]=r; }); g.forEach(r=>{ (GOLF[r.event_seq]=GOLF[r.event_seq]||[]).push(r); }); d.forEach(r=>{ (DISP[r.event_seq]=DISP[r.event_seq]||[]).push(r); });
      HAS_OPS=true; $('#nosql').hidden=true;
      // 컬럼 존재 확인 7건 — 차례로 보내면 월 이동·재조회마다 왕복 7회가 더해진다 → 한꺼번에 보낸다(판정은 종전과 같다: 오류 = 미적용).
      { const _has=async(t,c)=>{ try{ const pr=await supa.from(t).select(c,{count:'exact',head:true}); return !pr.error; }catch(e){ return false; } };
        [HAS_USE_BLOCK,HAS_PTS,HAS_AUTOSIG,HAS_GAUTO,HAS_QFIX,HAS_ASSIGN,HAS_CBLOCK]=await Promise.all([
          _has('partner_ops','use_block'),        // SQL 161 적용 여부(블록 사용 체크)
          _has('partner_dispatch','from_pt'),     // SQL 162 송영 구간(출발·경유·도착)
          _has('partner_ops','auto_sig'),         // SQL 162 비고 서명
          _has('partner_golf','auto'),            // SQL 162 자동 골프 줄
          _has('partner_ops','quote_fix'),        // SQL 166 견적 수정값
          _has('partner_ops','assign'),           // SQL 167 명단 객실·조 지정
          _has('partner_courses','block_groups')  // SQL 166 골프장 블록(조 수·기간)
        ]); }
      HAS_ALIASES=HOTELS.some(h=>Object.prototype.hasOwnProperty.call(h,'aliases'))||COURSES.some(c=>Object.prototype.hasOwnProperty.call(c,'aliases'));
    }catch(e){ const m=String(e&&e.message||e); if(/partner_(ops|golf|dispatch|hotels|courses|vehicles|staff|settings)|schema cache|does not exist/i.test(m)){ HAS_OPS=false; $('#nosql').hidden=false; } else throw e; }
    if(ymQ!==YM) return;   // 조회 중에 달이 바뀌었다 → 낡은 달은 그리지 않는다(finally 가 최신 달로 다시 조회)
    if(SEL&&!TEAMS.some(t=>t.seq===SEL)) SEL=null;
    renderAll();
    autoSync();   // 비고 자동 반영(기다리지 않는다 — 목록은 먼저 보이고, 끝나면 다시 그린다)
  }catch(e){ const msg=String(e&&e.message||e); toast(tx('loadFail')+': '+msg,'err');
    if(ymQ===YM){ TEAMS=[]; OPS={}; GOLF={}; DISP={}; PLAN={}; DR=null; SEL=null; LOADERR=msg; renderAll(); }   // 실패한 달에 앞 달 팀·띠·합계를 남기지 않는다
    $('#sum').textContent=''; }
  finally{ LOADING=false; if(LOAD_AGAIN||ymQ!==YM){ LOAD_AGAIN=false; load(); } }
}

// ── 저장 ──
const OPS_FIELDS=['agency','staff','hotel_id','hotel_note','twin','single','triple','single_rate','price_adj','price_note','party','memo','roster_hotel_at','roster_hotel_by','roster_golf_at','roster_golf_by','itinerary_at','itinerary_by','invoiced_at','invoiced_by'];
async function saveOps(seq, patch, label, quiet){
  if(!HAS_OPS){ toast(tx('noSql'),'warn'); return false; }
  const cur=OPS[seq]||{}; const row={event_seq:seq}; OPS_FIELDS.concat(HAS_USE_BLOCK?['use_block']:[]).concat(HAS_AUTOSIG?['auto_sig']:[]).concat(HAS_QFIX?['quote_fix']:[]).concat(HAS_ASSIGN?['assign']:[]).forEach(f=>{ if(cur[f]!==undefined) row[f]=cur[f]; }); Object.assign(row,patch); if(!HAS_USE_BLOCK) delete row.use_block; if(!HAS_AUTOSIG) delete row.auto_sig; if(!HAS_QFIX) delete row.quote_fix; if(!HAS_ASSIGN) delete row.assign;
  if(OPS[seq]){   // 이미 있는 행 = 바뀐 칸만 update(행 전체를 화면에 읽어 둔 값으로 덮어쓰지 않는다). 0행(그 사이 지워짐·쓰기 권한 없음)이면 아래 upsert 로 넘어간다
    const pp=Object.assign({},patch); if(!HAS_USE_BLOCK) delete pp.use_block; if(!HAS_AUTOSIG) delete pp.auto_sig; if(!HAS_QFIX) delete pp.quote_fix; if(!HAS_ASSIGN) delete pp.assign;
    if(!Object.keys(pp).length) return true;
    const u=await supa.from('partner_ops').update(pp).eq('event_seq',seq).select();
    if(u.error){ toast(tx('saveFail')+': '+u.error.message,'err'); return false; }
    if((u.data||[]).length){ OPS[seq]=u.data[0]; logChange(seq,'ops',label||Object.keys(patch).join(','),patch); if(!quiet) renderAll(); return true; }
  }
  const {data,error}=await supa.from('partner_ops').upsert(row,{onConflict:'event_seq'}).select().single();
  if(error){ toast(tx('saveFail')+': '+error.message,'err'); return false; }
  OPS[seq]=data; logChange(seq,'ops',label||Object.keys(patch).join(','),patch); if(!quiet) renderAll(); return true;
}
async function saveGolf(row){
  if(!HAS_OPS){ toast(tx('noSql'),'warn'); return null; }

// 송영 구간·차량 제안 — SZCore.partnerLegPlan(공항·호텔·골프장 서로 50분, 도착일 골프면 호텔 경유 가능, 귀국일 골프면 골프장→공항) × partnerVehiclePlan(8명=하이에스 1대 · 20명 이상=마이크로버스)
const ROUTES=[['airport','','hotel'],['airport','','course'],['airport','hotel','course'],['hotel','','course'],['course','','hotel'],['hotel','','airport'],['course','','airport'],['course','hotel','airport'],['other','','other']];
function ptLabel(pt){ return pt?tx({airport:'ptAirport',hotel:'ptHotel',course:'ptCourse',other:'ptOther'}[pt]||'ptOther'):''; }
function routeOf(r){ if(r.from_pt||r.to_pt) return [r.from_pt||'',r.via_pt||'',r.to_pt||'']; const d=(window.SZCore&&SZCore.partnerRouteOf)?SZCore.partnerRouteOf(r.leg):['','']; return [d[0]||'',r.via_pt||'',d[1]||'']; }
function routeLabel(r){ const [f,v,t]=routeOf(r); if(!f&&!t) return legLabel(r.leg); return [f,v,t].filter(Boolean).map(ptLabel).join('→'); }
function routeOpts(r){ const cur=routeOf(r).join('|'); const list=ROUTES.map(x=>x.join('|')); if(cur.replace(/\|/g,'')&&!list.includes(cur)) list.unshift(cur); return list.map(k=>{ const [f,v,t]=k.split('|'); const lb=(f==='other'&&t==='other')?tx('lOther'):[f,v,t].filter(Boolean).map(ptLabel).join('→'); return `<option value="${k}"${k===cur?' selected':''}>${esc(lb)}</option>`; }).join(''); }
function proposeLegs(t, d){

  const legs=SZCore.partnerLegPlan({dep:t.dep,arr:t.arr,fullDep:t.fullDep,fullArr:t.fullArr,arrTime:m.loc_arr_time,retTime:m.ret_dep_time}, g);

    vs.forEach((v,i)=>{ const row={event_seq:t.seq,trip_date:l.trip_date,leg:l.leg,depart_time:l.depart_time||'',vehicle_id:v.vehicleId||null,_pax:v.pax,note:vs.length>1?tx('vehSplit',i+1,vs.length,v.pax):''};

// 실효 배차 = 저장 행 + (저장 행이 덮지 않는 날짜·구간의) 자동 계획. 자동 줄(_auto)은 저장하지 않아도 목록·띠·견적·配車表에 그대로 쓴다 —
//   항공 시각·골프 일정·인원이 바뀌면 같이 바뀐다. 팀 상세에서 고치면 그 줄만 저장 행이 된다.
function courseOn(t,ds){ const g=golf(t.seq).find(r=>r.play_date===ds&&r.course_id); return g?Number(g.course_id):0; }
function stampLeg(t,r){ r._ck=(routeOf(r).indexOf('course')>=0)?courseOn(t,r.trip_date):0; return r; }   // 골프장이 낀 구간은 어느 골프장인지까지가 편의 키(다른 골프장은 합승 아님)
// 한 번에 전 팀을 만든 뒤, **자동 줄의 차량을 팀끼리 다시 나눈다** — 팀마다 따로 계산하면 같은 편으로 오는 두 팀이 둘 다 1호차를 잡는다.
//   저장 줄이 먼저 자리를 차지하고, 자동 줄은 팀 순서대로: 지금 차량에 자리가 있으면(같은 시각·같은 구간 합승, 정원 이내) 그대로,
//   없으면 등록 순서의 다음 차량(20명 미만 팀은 작은 차 먼저). 시각이 없는 줄(복귀 등)은 건드리지 않는다.
function buildEff(){
  const E={__ready:true};
  TEAMS.forEach(t=>{ const st=(ops(t.seq).staff||'').trim()||null;
    const out=disp(t.seq).map(r=>stampLeg(t,Object.assign({},r))).concat(proposeLegs(t).map(p=>stampLeg(t,Object.assign({_auto:true,staff:st},p))));
    out.sort((a,b)=>String(a.trip_date||'').localeCompare(String(b.trip_date||''))||(hhmm(a.depart_time)||'99').localeCompare(hhmm(b.depart_time)||'99'));
    E[t.seq]=out; });
  const slots={}, act=VEHICLES.filter(v=>v.active!==false).slice().sort((a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id);
  const sk=r=>r.trip_date+'|'+hhmm(r.depart_time), rk=r=>routeOf(r).join('>')+'|'+(r._ck||0);
  const paxOf=(t,r)=>{ if(r._pax!=null) return Number(r._pax)||0; const same=E[t.seq].filter(x=>x.trip_date===r.trip_date&&routeOf(x).join('>')===routeOf(r).join('>')).length||1; return Math.ceil(t.pax/same); };
  const take=(r,n)=>{ if(!r.vehicle_id) return; const s=slots[sk(r)]=slots[sk(r)]||{}; const x=s[r.vehicle_id]=s[r.vehicle_id]||{rk:rk(r),pax:0,mix:false}; if(x.rk!==rk(r)) x.mix=true; x.pax+=n; };
  const fits=(r,v,n)=>{ const x=(slots[sk(r)]||{})[v.id]; return x?(x.rk===rk(r)&&!x.mix&&x.pax+n<=v.capacity):(n<=v.capacity); };
  TEAMS.forEach(t=>E[t.seq].forEach(r=>{ if(!r._auto&&r.trip_date&&hhmm(r.depart_time)) take(r,paxOf(t,r)); }));
  TEAMS.forEach(t=>E[t.seq].forEach(r=>{ if(!r._auto||!r.trip_date||!hhmm(r.depart_time)||!r.vehicle_id) return; const n=paxOf(t,r), cur=vehById(r.vehicle_id);
    if(!(cur&&fits(r,cur,n))){ const big=t.pax>=20; const v=act.slice().sort((x,y)=>(((x.capacity>=20)===big)?0:1)-(((y.capacity>=20)===big)?0:1)).find(x=>fits(r,x,n)); if(v) r.vehicle_id=v.id; }

function effLegs(t){ if(!EFF.__ready) buildEff(); return EFF[t.seq]||[]; }
// 상세(초안)에서 다시 계산한 자동 줄에도 같은 차량을 보여 준다 — 같은 날짜·구간의 n번째 자동 줄끼리 맞춘다.
function syncAutoVeh(t, props){ const eff=effLegs(t).filter(x=>x._auto), cnt={}; props.forEach(pr=>{ const k=pr.trip_date+'|'+pr.leg, i=cnt[k]=(cnt[k]||0)+1; const e=eff.filter(x=>x.trip_date===pr.trip_date&&x.leg===pr.leg)[i-1]; if(e&&e.vehicle_id&&hhmm(e.depart_time)===hhmm(pr.depart_time)) pr.vehicle_id=e.vehicle_id; }); return props; }
// 편 = 같은 차량·같은 시각·같은 경로(합승). 인원 합이 정원을 넘거나, 같은 차량이 같은 시각에 다른 경로를 뛰면 빨강.
function runKey(r){ return (r.vehicle_id||0)+'|'+(hhmm(r.depart_time)||'')+'|'+routeOf(r).join('>')+'|'+(r._ck||0); }
function legPax(t,r){ if(r._pax!=null) return Number(r._pax)||0; const rk=routeOf(r).join('>'); const same=effLegs(t).filter(x=>x.trip_date===r.trip_date&&routeOf(x).join('>')===rk).length||1; return Math.ceil(t.pax/same); }
function runsOn(ds){ if(RUNS[ds]) return RUNS[ds]; const byKey={};
  TEAMS.forEach(t=>effLegs(t).forEach(r=>{ if(r.trip_date!==ds) return; const k=runKey(r); const x=byKey[k]=byKey[k]||{key:k,veh:r.vehicle_id||null,time:hhmm(r.depart_time)||'',route:routeLabel(r),leg:r,pax:0,teams:[],auto:true,staff:[],notes:[]};

  return Object.keys(byD).sort().map(ds=>{ const rs=byD[ds], seen=new Set(), segs=[]; const rk=r=>routeOf(r).join('>'), go=rs.find(r=>rk(r)==='hotel>>course'), back=rs.find(r=>rk(r)==='course>>hotel'), both=!!(go&&back&&!hhmm(back.depart_time));   // 왕복(돌아오는 시각 미정)은 한 덩어리로
    rs.forEach(r=>{ if(both&&rk(r)==='course>>hotel') return; const tm=hhmm(r.depart_time)||'', lb=(both&&rk(r)==='hotel>>course')?`${ptLabel('hotel')}⇄${ptLabel('course')}`:routeLabel(r), k=tm+'|'+lb; if(seen.has(k)) return; seen.add(k); segs.push(`<span class="sg">${tm?`<span class="mono">${esc(tm)}</span> `:''}${esc(lb)}</span>`); });
    const vs=[...new Set(rs.map(r=>r.vehicle_id).filter(Boolean))].map(id=>vehById(id)?vehById(id).name:'').filter(Boolean), auto=rs.every(r=>r._auto), bad=rs.some(r=>legBad(t,r));
    return `<div class="gl dl${auto?' auto':''}${bad?' bad':''}">${esc(mmdd(ds))} ${segs.join(' · ')}${vs.length?` <span class="vh">${esc(vs.join('+'))}</span>`:''}</div>`; }).join(''); }
function ddayHTML(t){ const n=Math.round((new Date(t.dep+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000); return (n>=0&&n<=7)?` <span class="bd dday">${esc(tx('dday',n))}</span>`:''; }

    return `<tr class="tm${SEL===t.seq?' sel':''}${isD?' dirty':''}${iss.some(i=>i.sev==='err')?' haserr':''}" data-seq="${t.seq}">

      <td>${gl}<small>${g.length}/${nightsOf(t).length}</small></td>

$('#list').addEventListener('click',e=>{ if(e.target.closest('[data-act=reload]')){ load(); return; }   // 조회 실패 안내의 [다시 불러오기]
  const rb=e.target.closest('[data-act=rmk]'); if(rb){ e.stopPropagation(); const s=Number(rb.dataset.seq); if(RMK_CLOSED.has(s)) RMK_CLOSED.delete(s); else RMK_CLOSED.add(s); renderList(); return; }   // 비고 보기 토글(팀 선택과 무관)

function staffOpts(val){ return `<option value="">—</option>`+STAFF.filter(s=>s.active||s.name===val).map(s=>`<option${s.name===val?' selected':''}>${esc(s.name)}</option>`).join('')+(val&&!STAFF.some(s=>s.name===val)?`<option selected>${esc(val)}</option>`:''); }
function saveBarHTML(d){ return `<div class="savebar${d.dirty?' on':''}" id="savebar"><span>${esc(d.dirty?tx('unsaved'):tx('savedState'))}</span><span class="sp"><button class="btn sm" data-act="save" type="button" ${d.dirty&&HAS_OPS?'':'disabled'}>${esc(tx('save'))}</button><button class="btn sm ghost" data-act="cancel" type="button" ${d.dirty?'':'disabled'}>${esc(tx('cancel'))}</button></span></div>`; }

  const H=RATES.hotel||{}, singleDefault=(H.single&&(H.single.wk||H.single.hi))?`${H.single.wk||'-'}/${H.single.hi||'-'}`:'';
  const ch=k=>!!(q&&q.fixed&&q.auto&&q[k]!==q.auto[k]);
  const cell=(k,lbl,cls)=>`<div${cls?` class="${cls}"`:''}><small>${esc(lbl)}${ch(k)?` <span class="bd dday">${esc(tx('fixed'))}</span>`:''}</small><b>${yen(q[k])}</b>${ch(k)?`<small class="was">${yen(q.auto[k])}</small>`:''}</div>`;
  const fin=(k,lbl)=>`<label>${esc(lbl)}<input class="inp" type="number" min="0" step="100" data-qf="${k}" value="${f[k]==null?'':esc(f[k])}" placeholder="${q&&q.ok&&A[k]!=null?esc(String(A[k])):''}" ${dis}></label>`;

  return `<h4>${esc(tx('secQuote'))}${ratesReady()||(q&&q.fixed)?'':`<span class="bd warn">${esc(tx('issRates'))}</span>`}</h4>
      ${q&&q.ok?`<div class="quote">

        ${q.missing.length&&ratesReady()?`<div style="grid-column:1/-1"><span class="bd warn">${esc(tx('qMissing'))}: ${esc(missingText(q.missing))}</span></div>`:''}</div>`:''}
      <details class="so-fold qfix"${QOPEN||hasAdj?' open':''}><summary>${esc(tx('qEdit'))}${q&&q.fixed?` <span class="so-fsum on">${esc(tx('fixed'))}</span>`:''}</summary>
        <div class="frm" style="margin-top:6px">${fin('twin',tx('qTwin'))}${fin('single',tx('qSingle'))}${fin('triple',tx('qTriple'))}${fin('total',tx('qTotal'))}

          <label class="wide">${esc(tx('priceNote'))}<input class="inp" data-f="price_note" value="${esc(o.price_note||'')}" ${dis2}></label></div>
        <div class="hint">${esc(HAS_QFIX?tx('qEditHint'):tx('needSql166'))}</div></details>`;
}

// 배차 줄 — 저장 행과 자동 줄(prop)을 같은 모양으로. 자동 줄은 고치는 순간 저장 대상이 된다(「제안 추가」 버튼 없음).
function dispRowHTML(r,prop,i){
  const vehSel=`<select class="inp" data-d="vehicle_id">${optList(VEHICLES.filter(v=>v.active||v.id===Number(r.vehicle_id)),r.vehicle_id,v=>`${v.name} (${v.capacity})`,tx('vehNone'))}</select>`;
  const legSel=HAS_PTS?`<select class="inp" data-d="route">${routeOpts(r)}</select>`:`<select class="inp" data-d="leg">${LEGS.map(l=>`<option value="${l}"${r.leg===l?' selected':''}>${esc(legLabel(l))}</option>`).join('')}</select>`;
  return `<div class="grow drow${prop?' prop':''}" ${prop?`data-prop="${i}"`:`data-did="${r.id}"`}>
    <input class="inp" type="date" data-d="trip_date" value="${esc(r.trip_date||'')}">
    ${legSel}
    <input class="inp" type="time" data-d="depart_time" value="${esc(hhmm(r.depart_time))}">
    ${prop?`<span class="auto" title="${esc(tx('autoLegHint'))}">${esc(tx('autoTag'))}</span>`:`<button class="x" data-act="dispDel" type="button" title="${esc(tx('del'))}">×</button>`}
    <div class="l2">${vehSel}<select class="inp" data-d="staff">${staffOpts(r.staff||'')}</select><input class="inp" data-d="note" value="${esc(r.note||'')}" placeholder="${esc(tx('dNote'))}"></div>
  </div>`;
}

// 상세 패널 이벤트(위임) — 전부 초안(DR)에만 반영. DB 는 [저장]에서(Min 2026-11-03 「그냥 수정이 되게 되어 있어서 위험함」)
function setDispField(row, el){ const k=el.dataset.d; let v=el.value;

function pruneObj(o){ if(!o||typeof o!=='object') return o; const out={}; Object.keys(o).forEach(k=>{ const v=o[k]; if(v&&typeof v==='object'){ const p=pruneObj(v); if(Object.keys(p).length) out[k]=p; } else if(v!=null&&v!=='') out[k]=v; }); return out; }
// 초안 → 무엇을 쓸지(순수 계산, 테스트용): 등록표 수정 regUps[{id,patch}] · 요금 삽입 ins[] · 수정 ups[] · 삭제 dels[]
function defPlan(kind){
  const K=DEFK[kind], dr=DD[kind]; if(!dr) return null; const per=K.period(), out={regUps:[],ins:[],ups:[],dels:HAS_RATES?(dr.del||[]).slice():[],bad:''};
  const same=(a,b)=>JSON.stringify(a||{})===JSON.stringify(b||{});
  if(K.refSel){ const seen=new Set(); dr.rows.forEach(r=>{ if(!Object.keys(r.p||{}).length) return; const k=(r.ref==null?0:r.ref)+'|'+(r.from||'')+'|'+(r.to||''); if(seen.has(k)) out.bad=tx('rDupGuide'); seen.add(k); }); }
  dr.rows.forEach(r=>{
    if(r.from&&r.to&&r.from>r.to){ out.bad=tx('rBadPeriod'); return; }
    let from=r.from||null, to=r.to||null;
    if(r.t==='main'){ const e=K.arr().find(x=>x.id===r.ent); if(!e) return; const g=r.reg||{}, patch={};
      if(!String(g.name||'').trim()){ out.bad=tx('nameEmpty'); return; }
      const set=(col,val)=>{ const cur=e[col]; if(typeof val==='number'?Number(cur||0)!==val:String(cur==null?'':cur)!==String(val==null?'':val)) patch[col]=val; };
      set(K.name,String(g.name).trim()); if(K.ko){ set('name_ko',g.name_ko||null); if(HAS_ALIASES) set('aliases',g.aliases||null); }
      if(K.block&&per){ set(K.block,Number(g.block||0)); if(d10(e.block_from)!==(r.from||'')) patch.block_from=from; if(d10(e.block_to)!==(r.to||'')) patch.block_to=to; }
      K.extra.forEach(f=>set(f,Number(g[f]||0)));
      if((e.active!==false)!==!!g.active) patch.active=!!g.active;
      if(Object.keys(patch).length) out.regUps.push({id:e.id,patch});
      if(!per){ from=null; to=null; } }
    if(!HAS_RATES) return;   // SQL 161 전 = 요금 칸이 잠겨 있다 — 등록표만 저장
    const prices=nestPrices(r.p), any=Object.keys(prices).length>0, ex=r.rid?RATEROWS.find(x=>x.id===r.rid):null;
    const exRef=ex?(ex.ref_id==null?null:Number(ex.ref_id)):null, ref=K.refSel?(r.ref==null?null:Number(r.ref)):(ex?exRef:(r.ent==null?null:r.ent));   // 인솔 = 고른 상품 / 그 외 = 대상(호텔·코스) 그대로
    if(ex){ if(!any){ if(!out.dels.includes(ex.id)) out.dels.push(ex.id); }
      else if(!same(pruneObj(ex.prices),prices)||d10(ex.from_date)!==(from||'')||d10(ex.to_date)!==(to||'')||exRef!==ref) out.ups.push({id:ex.id,kind,ref_id:ref,label:ex.label||null,from_date:from,to_date:to,prices}); }
    else if(any) out.ins.push({kind,ref_id:ref,label:null,from_date:from,to_date:to,prices});
  });
  out.dels=out.dels.filter(id=>!out.ups.some(u=>u.id===id));
  return out;
}
async function saveDef(kind){
  captureDef(kind); const K=DEFK[kind], pl=defPlan(kind); if(!pl) return;
  if(pl.bad) return toast(pl.bad,'err');
  if((pl.ins.length||pl.ups.length||pl.dels.length)&&!HAS_RATES) return toast(tx('needSql161'),'warn');
  for(const u of pl.regUps){ const {data,error}=await supa.from(K.table).update(u.patch).eq('id',u.id).select(); if(error) return toast(tx('saveFail')+': '+error.message,'err'); if(!(data||[]).length) return toast(tx('noWrite'),'err'); }   // 0행 = 읽기 전용 계정(RLS) — 성공으로 알리지 않는다
  if(pl.dels.length){ const {data,error}=await supa.from('partner_rates').delete().in('id',pl.dels).select(); if(error) return toast(tx('saveFail')+': '+error.message,'err'); if(!(data||[]).length) return toast(tx('noWrite'),'err'); }
  if(pl.ups.length){ const {error}=await supa.from('partner_rates').upsert(pl.ups,{onConflict:'id'}); if(error) return toast(tx('saveFail')+': '+error.message,'err'); }
  if(pl.ins.length){ const {error}=await supa.from('partner_rates').insert(pl.ins); if(error) return toast(tx('saveFail')+': '+error.message,'err'); }   // 새 줄은 id 없이 따로 넣는다(묶음 upsert 에 섞으면 id 가 null 로 간다)
  logChange(K.table||'rates','def_save',`${kind} reg ${pl.regUps.length} · rate +${pl.ins.length} ~${pl.ups.length} -${pl.dels.length}`);
  delete DD[kind];
  try{ await loadRefs(); }catch(e){ toast(tx('loadFail')+': '+(e.message||e),'err'); }
  PLAN={}; toast(tx('saved'),'ok'); renderAll();
}

function loadExcelJS(){ if(window.ExcelJS) return Promise.resolve(window.ExcelJS); return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js'; s.onload=()=>res(window.ExcelJS); s.onerror=()=>rej(new Error('ExcelJS load')); document.head.appendChild(s); }); }

  return SZCore.partnerHotelList({ seq:t.seq, rep:t.rep, pax:t.pax, from:t.dep, to:t.arr, agency:agencyOf(t) }, t.members||[],

async function downloadHotelList(t){

    const X=await loadExcelJS(); const wb=new X.Workbook(); wb.creator='SaiZen ops';
    const ws=wb.addWorksheet(d.sheet,{ views:[{ state:'frozen', ySplit:d.meta.length+3 }], pageSetup:{ paperSize:9, orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0 } });
    const N=d.head.length, thin={ style:'thin' }, box={ top:thin, left:thin, bottom:thin, right:thin };
    ws.addRow([d.title]); ws.mergeCells(1,1,1,N); ws.getRow(1).font={ size:16, bold:true }; ws.getRow(1).height=26;
    d.meta.forEach(([k,v])=>{ const r=ws.addRow([k,v]); r.getCell(1).font={ bold:true }; ws.mergeCells(r.number,2,r.number,N); });
    ws.addRow([]);
    const hr=ws.addRow(d.head); hr.font={ bold:true }; hr.eachCell(c=>{ c.fill={ type:'pattern', pattern:'solid', fgColor:{ argb:'FFE7ECE0' } }; c.border=box; c.alignment={ horizontal:'center', vertical:'middle' }; });

    d.rows.forEach(row=>{ const r=ws.addRow(row); r.eachCell({ includeEmpty:true },(c,i)=>{ c.border=box; if(HC.has(d.head[i-1])) c.alignment={ horizontal:'center' }; }); });
    d.head.forEach((hn,i)=>{ ws.getColumn(i+1).width=HW[hn]||12; });
    const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{ type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=d.file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    const R=canAssign()?roomingOf(t):null, nAuto=(R&&roomAmbiguous(R))?Object.keys(R.auto).length:0;   // 누가 어느 방인지 사람이 정하지 않은 인원 — 명단 순으로 넣은 것이라 보내기 전에 확인
    if(d.missing.passport) toast(tx(HAS_PASSPORT?'hotelListBlank':'hotelListNoCol',d.missing.passport)+(nAuto?' · '+tx('hotelListAuto',nAuto):''),'warn'); else if(nAuto) toast(tx('hotelListDone',d.rows.length)+' · '+tx('hotelListAuto',nAuto),'warn'); else toast(tx('hotelListDone',d.rows.length));
  }catch(e){ toast(tx('hotelListFail')+': '+((e&&e.message)||e),'err'); }
}
function printRoster(t){
  const P=tx('pv'), o=ops(t.seq), h=hotelById(o.hotel_id), g=golf(t.seq).filter(r=>r.course_id||r.course_note), as=canAssign()&&t.members.length;
  const R=as?roomingOf(t,o):null, G=as?groupingOf(t,o):null, rl=k=>SZCore.partnerRoomLabel(k,'ja'), byId={}; (G?G.teams:[t]).forEach(x=>(x.members||[]).forEach(m=>{ byId[m.id]=m; }));
  const en=id=>{ const m=byId[id]; return m?esc(m.name_en||m.name_kr||''):''; };
  const trs=t.members.map(m=>`<tr><td class="c">${m.seq_in_team}</td><td><b>${esc(m.name_en||'')}</b>${m.name_kr?`<small>${esc(m.name_kr)}</small>`:''}</td><td class="c">${esc(({M:'男',F:'女'})[(window.SZCore&&SZCore.partnerGenderMF)?SZCore.partnerGenderMF(m.gender):'']||m.gender||'')}</td>${as?`<td class="c">${esc(rl(R.of[m.id])||'')}</td><td class="c">${G.of[m.id]||''}</td>`:''}<td></td></tr>`).join('');
  //  部屋割り・組合せ — 화면 명단에서 정한 것(지정 + 나머지 명단 순). 호텔·골프장에 그대로 보낼 수 있게 이름을 방·조별로 묶어 적는다. 조 순서 = 티타임 순서.
  const blocks=as?`<div class="as"><h3>${esc(P.rooming)}</h3>${R.slots.map(x=>`<div><b>${esc(rl(x.key))}</b>${x.ids.map(en).join(' ／ ')||'—'}</div>`).join('')}</div>
     <div class="as"><h3>${esc(P.pairing)}</h3>${G.groups.map(x=>`<div><b>${x.no}${esc(P.grp)}</b>${x.ids.map(en).join(' ／ ')||'—'}</div>`).join('')}</div>`:'';
  return popup(`roster_${t.seq}`, `@page{size:A4 portrait;margin:14mm} td,th{font-size:10.5pt;padding:2mm 2.5mm} .meta{display:grid;grid-template-columns:auto 1fr;gap:1mm 6mm;font-size:10.5pt;margin:3mm 0 5mm} .meta b{color:#333} .as{margin-top:5mm;font-size:10.5pt;break-inside:avoid} .as h3{font-size:11pt;margin:0 0 1.5mm;border-bottom:1px solid #333;padding-bottom:1mm} .as div{padding:.8mm 0} .as b{display:inline-block;min-width:22mm}`,
    `<h1>${esc(P.roster)} <small>${esc(t.rep)} 様 · ${t.pax}名</small></h1>
     <div class="meta"><b>${esc(P.period)}</b><span>${esc(t.dep)}（${esc(wd(t.dep))}）〜 ${esc(t.arr)}（${esc(wd(t.arr))}） ${nightsOf(t).length}${esc(P.nights)}</span><b>${esc(P.agency)}</b><span>${esc(agencyOf(t))}</span>
       <b>${esc(P.hotel)}</b><span>${inJa(()=>esc(hotelName(h)||o.hotel_note||'—')+' '+esc(roomsText(o)))}</span><b>${esc(P.golf)}</b><span>${inJa(()=>g.map(r=>`${esc(mmdd(r.play_date))} ${esc(courseName(courseById(r.course_id))||r.course_note||'')} ${esc(r.tee_time||'')}`).join('<br>'))||'—'}</span><b>${esc(P.staff)}</b><span>${esc(o.staff||'')}</span></div>
     <table><thead><tr><th>${esc(P.no)}</th><th>${esc(P.name)}</th><th>${esc(P.gender)}</th>${as?`<th>${esc(P.room)}</th><th>${esc(P.grp)}</th>`:''}<th>${esc(P.note)}</th></tr></thead><tbody>${trs}</tbody></table>
     ${blocks}
     <div class="ft">${esc(P.printed)} ${new Date().toLocaleString('ja-JP')}</div>`);
}
// 配車表(그날, 차량별) — 「월간 가동 현황」 송영 띠의 칸을 누르면 그날 치를 인쇄한다. 저장하지 않은 자동 배차도 실린다(「自動」 표기).
function printDispatch(ds){
  const P=tx('pv'); const runs=runsOn(ds).list.slice().sort((a,b)=>(a.veh||999)-(b.veh||999)||(a.time||'99').localeCompare(b.time||'99'));
  const groups={}; runs.forEach(r=>{ const k=r.veh||0; (groups[k]=groups[k]||[]).push(r); });
  const blocks=Object.keys(groups).sort((a,b)=>(Number(a)||999)-(Number(b)||999)).map(k=>{ const v=vehById(k); const trs=groups[k].map(r=>`<tr><td class="mono c">${esc(r.time||'—')}</td><td>${esc(r.leg?inJa(()=>routeLabel(r.leg)):r.route)}</td><td>${r.teams.map(t=>`<b>${esc(t.rep)}</b> 様`).join('<br>')}</td><td class="c">${r.pax}</td><td>${esc(r.staff.join('・'))}</td><td>${esc(r.notes.join(' / '))}${r.auto?`<small>${esc(P.auto)}</small>`:''}</td></tr>`).join('');
    return `<h2>${esc(v?`${v.name}（${v.capacity}）`:P.unassigned)}</h2><table><thead><tr><th>${esc(P.time)}</th><th>${esc(P.leg)}</th><th>${esc(P.team)}</th><th>${esc(P.pax)}</th><th>${esc(P.staff)}</th><th>${esc(P.note)}</th></tr></thead><tbody>${trs}</tbody></table>`; }).join('');
  return popup(`dispatch_${ds}`, `@page{size:A4 portrait;margin:12mm} h2{font-size:12pt;margin:4mm 0 1.5mm} td,th{font-size:10pt;padding:1.8mm 2.2mm}`,
    `<h1>${esc(P.disp)} <small>${esc(ds)}（${esc(wd(ds))}） · ${runs.length}便 · ${esc(P.printed)} ${new Date().toLocaleString('ja-JP')}</small></h1>${blocks||'<div class="ft">—</div>'}`);
}
$('#btn-print').addEventListener('click',()=>printList());
window.addEventListener('beforeunload',e=>{ if(dirty()||defDirty()){ e.preventDefault(); e.returnValue=''; } });

// ── 뷰·월·검색 ──
function setView(v){ VIEW=v; $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); $('#v-list').hidden=v!=='list'; $('#v-def').hidden=v!=='def'; $('#btn-print').style.display=v==='list'?'':'none'; if(v==='def') renderDefs(); }
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-v]'); if(b) setView(b.dataset.v); });
function setMonth(ym){ if(!canLeave()){ $('#m').value=YM; return; } DR=null; ISSF=''; YM=ym; $('#m').value=YM; load(); }
$('#m').addEventListener('change',()=>setMonth($('#m').value||today().slice(0,7))); $('#m-prev').addEventListener('click',()=>setMonth(shiftMonth(YM,-1))); $('#m-next').addEventListener('click',()=>setMonth(shiftMonth(YM,1)));
if(window.__so_rowSearch) __so_rowSearch('#q','#list tbody','tr.tm',{count:'#qcnt',label:n=>tx('cnt',n),onFilter:()=>{ $$('#list tbody tr.rmkrow').forEach(r=>{ const p=r.previousElementSibling; r.style.display=(p&&p.style.display==='none')?'none':''; }); }});   // 비고 줄은 주인 팀 줄과 함께 숨긴다

// ── 연결 ──
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn('URL·key','err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.classList.remove('connected');
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('partner_bookings').select('event_seq',{count:'exact',head:true}); if(error) throw error;
    setConn('✓','ok'); btn.textContent='✓'; btn.classList.add('connected'); btn.disabled=false;
    await load();
  }catch(e){ setConn('✕','err'); toast(tx('fail')+': '+e.message,'err'); btn.textContent='↻'; btn.classList.remove('connected'); btn.disabled=false; supa=null; }
}
$('#btn-connect').addEventListener('click',connect);
(function init(){
  const q=new URLSearchParams(location.search);
  YM=(q.get('ym')&&/^\d{4}-\d{2}$/.test(q.get('ym')))?q.get('ym'):today().slice(0,7); $('#m').value=YM;
  if(q.get('view')==='def') setView('def');   // 옛 ?view=disp(배차 날짜별)는 목록으로 — 배차는 목록·띠에서 본다
  applyStatic(); loadCreds(); renderAll();
  if($('#sb-url').value && $('#sb-key').value) connect();
})();
</script>
