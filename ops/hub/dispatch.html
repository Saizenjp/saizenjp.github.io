<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 現地手配書 인쇄</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  /* 각 행 미리보기 버튼: 좁은 操作 칸에서 쪼개지지 않게 — 작은 글씨로 한 줄 유지(표는 가로 스크롤) */
  .btn.sm.pv-btn{font-size:11px;padding:5px 8px;white-space:nowrap}
  table.list th:last-child, table.list td:last-child{white-space:nowrap}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  /* 목록 표가 17열로 넓어 문서형 1180px는 답답 → 전체폭 사용(방배정 화면과 통일). A4 미리보기는 제 폭으로 가운데 정렬됨 */
  .wrap{max-width:1560px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  table.list{width:100%;border-collapse:collapse;font-size:12px}
  table.list th{background:var(--surface3);border:1px solid var(--border);padding:6px 7px;font-weight:700;color:var(--text2);white-space:nowrap}
  table.list td{border:1px solid var(--border);padding:5px 7px}
  table.list td.c{text-align:center}
  table.list td.mono{font-family:var(--mono)}
  .lbl-check{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text2)}
  .rp-back{position:fixed;inset:0;background:rgba(20,25,15,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
  .rp-card{background:var(--surface);border-radius:12px;padding:18px 20px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .rp-card h3{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:5px}
  .rp-hint{font-size:11.5px;color:var(--text2);margin-bottom:12px;line-height:1.5}
  .rp-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
  .rp-item{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:13px}
  .rp-item:hover{border-color:var(--accent);background:var(--surface2)}
  .rp-item input{width:16px;height:16px;accent-color:var(--accent);flex:none}
  .rp-item .rp-tag{font-weight:800;color:var(--accent);min-width:64px}
  .rp-item .rp-nm{flex:1;font-weight:600}
  .rp-item .rp-dt{font-size:11px;color:var(--muted)}
  .rp-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>

<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈"><img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen"></a>
  <span class="step" id="t-step">現地手配書 인쇄</span>
  <a class="navhome" href="../index.html" id="t-navhome">← 홈</a>

  <div class="so-controls">

      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>

</div>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">
  <input class="inp" id="sb-key" type="password" placeholder="Publishable key" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button">接続</button>
  <span class="hint" id="t-connhint"></span>
</div>

<div class="wrap" id="content">
  <div class="panel"><div class="deny" id="t-pre" style="color:var(--muted)"></div></div>
</div>

<div id="toast"></div>

function dispatchNoteSegments(rec){ const segs=[]; const nl=()=>{ if(segs.length)segs.push({t:'\n',b:false}); };

  if(localBigo){ nl(); segs.push(...bigoSegments(localBigo,true)); }

function pickNoteHits(rec, kws){
  const src=[rec.remarkLocal,rec.noteRemarks,rec.remark].map(s=>String(s||'').trim()).filter(Boolean).join('\n');
  if(!src) return '';
  const hits=src.split(/[\n\/]+/).map(s=>s.trim()).filter(s=>{
    if(!s) return false; const low=s.toLowerCase();
    return kws.some(kw=>low.includes(kw));
  });
  return [...new Set(hits)].join(' / ');
}

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){ state.conn='fail'; setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');state.conn='connecting';btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ state.conn='login'; setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+esc(tx('loginDeny'))+'<small>'+esc(tx('loginDenySub'))+'</small></div></div>'; return; }
    state.conn='ok'; setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;

    try{
      const q=new URLSearchParams(location.search);
      const qy=q.get('ym'), qs=q.get('seq');
      if(qy && /^\d{4}-\d{2}$/.test(qy)) YM=qy;
      if(qs) _deepSeq=String(qs).trim();
    }catch(e){}
    YM=YM||thisYM();
    renderUI(); load();
  }catch(e){ state.conn='fail'; setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

// 주문 QR 토큰 확보 — 기존 로드 후 없는 팀만 랜덤 발급(crypto.randomUUID). 권한 없으면 조용히 스킵.
async function ensureOrderTokens(seqs){
  TOKMAP={};
  try{
    for(let i=0;i<seqs.length;i+=300){
      const chunk=seqs.slice(i,i+300);
      const {data}=await supa.from('order_tokens').select('event_seq,token').in('event_seq',chunk);
      (data||[]).forEach(t=>{ TOKMAP[t.event_seq]=t.token; });
    }
    const by=(window.__so_getUser&&__so_getUser())||null;
    const rnd=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,'').slice(0,16)
                 :(Date.now().toString(36)+Math.random().toString(36).slice(2,10));   // 폴백(구브라우저)
    const miss=seqs.filter(s=>!TOKMAP[s]).map(s=>({event_seq:s, token:rnd(), created_by:by}));
    if(miss.length){
      const {error}=await supa.from('order_tokens').insert(miss);
      if(!error) miss.forEach(m=>{ TOKMAP[m.event_seq]=m.token; });
      // error(권한 없음 등)면 발급된 팀만 QR 표시, 나머지는 빈칸으로 graceful
    }
  }catch(_){ /* 토큰 없이도 手配書는 출력 */ }
}
async function load(){
  const _gen=++_loadGen;               // 이 호출이 최신인지 확인용(겹치면 옛 결과는 버린다)
  if(!supa)return;
  if(!RFROM||!RTO){ resetRange(); }   // 최초 진입/월변경 직후 기본=선택 월 전체
  const _f=$('#rng-from'),_t=$('#rng-to'); if(_f&&_f.value!==RFROM)_f.value=RFROM; if(_t&&_t.value!==RTO)_t.value=RTO;
  const crossMonth=(RFROM.slice(0,7)!==RTO.slice(0,7));
  $('#ym-label').textContent=YM; $('#stat').textContent=tx('loading'); $('#btn-print').disabled=true;
  try{
    // 예약(체류 [dep_date, arr_date])이 선택 범위 [RFROM, RTO]에 걸치면 로드 → 월경계 팀(7↔8월) 이어보기.
    //  범위가 한 달이면 그 달 안에서 시작하는 팀만(기존과 동일 집합), 범위를 넓히면 다른 달 팀도 포함.
    const bs=[];
    { let pg=0; for(;;){
        let q=supa.from('bookings')
          .select('event_seq,event_no,rep_name,member_type,dep_date,arr_date,nights_label,origin,airline,product_name,pax,remark,remark_local,team_label,session_ym')
          .lte('dep_date',RTO).gte('arr_date',RFROM).order('event_seq').range(pg,pg+999);
        const {data,error}=await q; if(error)throw error;
        (data||[]).forEach(b=>bs.push(b)); if(!data||data.length<1000)break; pg+=1000;
    } }
    const BMAP={}; bs.forEach(b=>{BMAP[b.event_seq]=b;});
    const seqs=Object.keys(BMAP).map(Number);
    if(!seqs.length){ ROWS=[]; $('#stat').textContent=tx('noMonthData'); DATESEL.clear();ACCOMSEL.clear(); renderDateChips();renderAccomChips(); renderOriginChips();renderList(); return; }
    // 부속 테이블은 event_seq로 조회(범위가 여러 달이어도 정확) — 200개씩 청크
    const GMAP={}, NMAP={}, OMAP={};
    for(let i=0;i<seqs.length;i+=200){ const chunk=seqs.slice(i,i+200);
      const {data:gs}=await supa.from('guests').select('event_seq,group_code,team_tag,accom,accom_prefix,pax').in('event_seq',chunk);
      (gs||[]).forEach(g=>{GMAP[g.event_seq]=g;});
      const {data:ns}=await supa.from('event_notes').select('event_seq,remarks,memo').in('event_seq',chunk);
      (ns||[]).forEach(n=>{NMAP[n.event_seq]=n;});
      // 운영 팀 라벨(print_overrides.team_group) — 手配書 チーム 칸에서 정의·표시
      const {data:os}=await supa.from('print_overrides').select('event_seq,team_group,team_group_rep,team_group_seq').in('event_seq',chunk);
      (os||[]).forEach(o=>{OMAP[o.event_seq]=o;});
    }
    // 주문 QR 토큰: 기존 로드 + 없는 팀은 즉시 발급(팀 고유 랜덤). 발급 권한(print/room) 없으면 조용히 건너뜀.
    await ensureOrderTokens(seqs);
    // 개인 명단(passengers) + 대표/태그(guest_members)
    const PAX={}, REP={};
    for(let i=0;i<seqs.length;i+=200){
      const chunk=seqs.slice(i,i+200);
      // passengers
      let pg=0;
      for(;;){
        const {data,error}=await supa.from('passengers')
          .select('id,event_seq,seq_in_team,name_kr,name_en,gender,birth,birth_yymmdd,passport_no,phone,dep_flight,ret_flight,dep_time,loc_arr_time,ret_dep_time,kor_arr_time,airline,origin,member_grade,member_class,member_div')
          .in('event_seq',chunk).order('event_seq').order('seq_in_team').range(pg,pg+999);
        if(error)throw error;
        (data||[]).forEach(p=>{ (PAX[p.event_seq]=PAX[p.event_seq]||[]).push(p); });
        if(!data||data.length<1000)break; pg+=1000;
      }
      // guest_members (대표 tag·is_rep → passenger_id)
      let mg=0;
      for(;;){
        const {data,error}=await supa.from('guest_members')
          .select('event_seq,person_tag,is_rep,seq_in_team,passenger_id').in('event_seq',chunk).order('event_seq').order('seq_in_team').range(mg,mg+999);
        if(error)throw error;
        (data||[]).forEach(m=>{
          const cur=REP[m.event_seq]; const curSeq=cur?(cur._seq==null?99:cur._seq):99;
          if(!cur || (m.is_rep&&curSeq!==0) || (!m.is_rep&&curSeq!==0&&(m.seq_in_team||99)<curSeq)){
            REP[m.event_seq]={tag:m.person_tag||'',_seq:m.is_rep?0:(m.seq_in_team||99),pid:m.passenger_id};
          }
        });
        if(!data||data.length<1000)break; mg+=1000;
      }
    }
    // 행사별 카드 데이터 구성 (출발일 → 대표자명 순)
    ROWS=seqs.map(seq=>{
      const b=BMAP[seq]||{}, g=GMAP[seq]||{}, note=NMAP[seq]||{};
      const paxList=(PAX[seq]||[]).slice().sort((a,b2)=>(a.seq_in_team||99)-(b2.seq_in_team||99));
      const rep=REP[seq]||{};
      const repPax=paxList.find(p=>p.id===rep.pid)||paxList[0]||{};
      const dep=fmtDate(b.dep_date), arr=fmtDate(b.arr_date);
      const nights=(dep&&arr)?Math.max(0,Math.round((parseLocalDate(arr)-parseLocalDate(dep))/86400000)):0;
      const origin=repPax.origin||b.origin||'';
      const depFlight=repPax.dep_flight||b.airline||'';
      const isPUS=SZCore.isPus(origin, depFlight);  // 출발지 PUS/ICN = saizen-core 단일 진실원(ZE/TW·부산/김해)
      const _tlabel=b.team_label||note.team_label||'', _tg=(OMAP[seq]&&OMAP[seq].team_group)||'', _tgRep=!!(OMAP[seq]&&OMAP[seq].team_group_rep);
      const _tgSeq=(OMAP[seq]&&OMAP[seq].team_group_seq!=null)?OMAP[seq].team_group_seq:null;
      const rec={ eventSeq:seq, eventNo:b.event_no||'', repName:b.rep_name||'', memberType:b.member_type||'', dep, arr, nights, pax:b.pax||g.pax||0,
        accom:g.accom||'', roomType:'', teamName:(_tg?_tg.replace(/#\d+$/,''):_tlabel), teamGroup:_tg, teamGroupRep:_tgRep, teamGroupSeq:_tgSeq, _teamLabelBase:_tlabel, remark:b.remark||'', remarkLocal:b.remark_local||'', noteRemarks:note.remarks||'', noteMemo:note.memo||'',
        sessionYm:b.session_ym||YM, prodName:b.product_name||'' };
      const golf=dispatchGolfRows(rec,isPUS).map(x=>({...x,tee:''}));
      const autoRoom=rec.pax>0?(Math.ceil(rec.pax/2)+'室 (2人1室)'):'-';
      return {
        seq, rec, dep, accom:rec.accom, repPid:repPax.id,
        // 手配書는 팀 단위 표기 → 개인순번 숫자 빼고 숙소 문자만("DMめ-1G"→"DMめ-G")
        tagCode:(window.SZCore&&SZCore.tagStripSeq)?SZCore.tagStripSeq(rep.tag||g.team_tag||g.group_code||''):(rep.tag||g.team_tag||g.group_code||''),
        engName:repPax.name_en||'',
        depFlight, retFlight:repPax.ret_flight||'', depTime:repPax.dep_time||'', locArrTime:repPax.loc_arr_time||'', retTime:repPax.ret_dep_time||'', korArrTime:repPax.kor_arr_time||'', airline:repPax.airline||b.airline||'',
        port:isPUS?'PUS':'ICN', portName:isPUS?'釜山(金海)':'ソウル(仁川)',
        // 출발지 필터용 — 인별 출발지가 섞인 팀은 ICN·PUS 양쪽에 잡히게(팀이 사라지지 않도록)
        ports:(function(){ const st=new Set(); paxList.forEach(p=>st.add(SZCore.isPus(p.origin||'',p.dep_flight||'')?'PUS':'ICN'));
          if(!st.size) st.add(isPUS?'PUS':'ICN'); return [...st]; })(),
        roomCnt:autoRoom, golf, paxList, prodName:rec.prodName, accomJp:dispatchAccomJp(rec.accom),
        orderToken:TOKMAP[seq]||''
      };
    });
    // ── 묶음 전원(기간 무관) ───────────────────────────────────────────────
    //  이 화면은 날짜 범위로 읽으므로 묶음 상대가 범위 밖이면 순번이 어긋난다
    //  (航空カバー와 코드·번호가 갈리는 원인). 그룹 전원을 따로 조회해 기준을 고정한다.
    GFULL={};
    try{
      const gkeys=[...new Set(ROWS.map(r=>r.rec.teamGroup).filter(Boolean))];
      if(gkeys.length){
        const {data:allOv}=await supa.from('print_overrides')
          .select('event_seq,team_group,team_group_rep,team_group_seq').in('team_group',gkeys);
        const ovRows=allOv||[];
        const inView={}; ROWS.forEach(r=>{ inView[r.seq]=r; });
        const need=[...new Set(ovRows.map(r=>r.event_seq))].filter(s2=>!inView[s2]);
        const ext={};
        for(let i=0;i<need.length;i+=200){ const ch=need.slice(i,i+200);
          const {data:g2}=await supa.from('guests').select('event_seq,group_code,bookings!inner(dep_date)').in('event_seq',ch);
          (g2||[]).forEach(g=>{ ext[g.event_seq]={dep:(g.bookings||{}).dep_date||'', tag:g.group_code||''}; });
          const {data:m2}=await supa.from('guest_members').select('event_seq,person_tag,seq_in_team').in('event_seq',ch).order('seq_in_team');
          (m2||[]).forEach(m=>{ const e=ext[m.event_seq]; if(e&&!e.ptag&&m.person_tag) e.ptag=m.person_tag; });
        }
        const strip=t=>(window.SZCore&&SZCore.tagStripSeq)?SZCore.tagStripSeq(t||''):(t||'');
        const _seen=new Set();
        ovRows.forEach(r=>{
          // ⚠ 같은 팀이 두 번 들어가면 순번이 2,4,6 으로 밀린다(로드 겹침 시 실제 발생).
          const _k=r.team_group+'|'+r.event_seq; if(_seen.has(_k)) return; _seen.add(_k);
          const v=inView[r.event_seq], e=ext[r.event_seq]||{};
          (GFULL[r.team_group]=GFULL[r.team_group]||[]).push({
            seq:String(r.event_seq), rep:!!r.team_group_rep,
            gseq:(r.team_group_seq==null?null:r.team_group_seq),
            dep: v? (v.dep||'') : (e.dep||''),
            tag: v? (v.tagCode||'') : strip(e.ptag||e.tag||'')
          });
        });
      }
    }catch(e){ console.warn('묶음 전원 조회 실패:',e.message); }
    if(_gen!==_loadGen) return;      // 그 사이 새 로드가 시작됐으면 이 결과는 버린다
    computeGroupTags();              // GTAG·GREP(대표) 먼저 → 팀별 규칙 정렬에 사용
    ROWS.sort(dispatchOrder);        // 入国→ICN/PUS→숙소→코드→묶음번호(Y1,Y2 인접)→대표자
    ROWS.forEach((d,i)=>{ d.no=i+1; });
    computeAnomBaseline();           // 특이패턴 기준(최빈) — 전체 ROWS 기준 1회

    DATESEL.clear(); ACCOMSEL.clear();
    $('#stat').textContent=`${ROWS.length}${tx('cntUnit')}`;
    renderDateChips(); renderAccomChips(); renderOriginChips(); renderList();
    if(_deepSeq){                                  // 딥링크로 들어왔으면 그 팀만 바로 인쇄 미리보기
      const seq=_deepSeq; _deepSeq=null;
      if(ROWS.some(r=>String(r.seq)===seq)){ SEARCHQ=seq.toLowerCase(); const sx=$('#search'); if(sx) sx.value=seq; renderList(); printDispatch(seq); }
      else toast(tx('noTargets'),'err');
    }
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFail')+': '+e.message,'err'); }
}

function pass(d){
  if(ORIGINSEL!=='all' && !(d.ports||[d.port]).includes(ORIGINSEL)) return false;
  if(ACCOMSEL.size && !ACCOMSEL.has(d.accom)) return false;
  if(DATESEL.size && !DATESEL.has(d.dep)) return false;
  if(SEARCHQ){ const hay=`${d.rec.repName||''} ${d.rec.eventNo||''} ${d.tagCode||''} ${dTag(d)||''} ${d.seq} ${d.rec.remark||''} ${d.rec.remarkLocal||''} ${d.rec.noteRemarks||''} ${d.rec.noteMemo||''}`.toLowerCase(); if(!hay.includes(SEARCHQ)) return false; }
  if(FILT_ANOM && teamAnomaly(d).length===0) return false;   // 特(특이)만 보기
  if(FILT_GROUP && !d.rec.teamGroup) return false;            // 운영팀(묶음) 있는 팀만
  return true;
}
// 선택(날짜·숙소 토글)된 표시분의 회원/일반 인원 합계 — 명단(paxList)의 회원판정 3컬럼 OR 기준.
function memGenCount(list){ let mem=0,gen=0; list.forEach(d=>(d.paxList||[]).forEach(p=>{ (window.SZCore&&SZCore.isMember(p))?mem++:gen++; })); return {mem,gen,tot:mem+gen}; }
// ── 특이 패턴(디폴트=데이터 최빈과 다른 투어) 자동 판정: 콤보체류·출귀국공항·입퇴실요일·항공 ──
//   기준(디폴트)=로드된 전체 ROWS의 최빈값(자동 적응). 화면 목록 「特」 배지 + 툴팁 사유.
let ANOM={ci:{}, co:{}};
// 기본 항공편(정상): 인천-티웨이 TW287/288 · 부산-이스타 ZE967/968. 이 외 = 비표준(특이).
const STD_FLIGHTS=['TW287','TW288','ZE967','ZE968'];
function _fnorm(f){ return String(f||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
// 표준 체류 요일 패턴(입실→퇴실): 3박 목~일 · 4박 일~목 · 7박 수~수. (日0 水3 木4)
// 그 외 박수는 입/퇴실이 수·목·일(3·4·0)이 아니면 특이.
const STD_STAY={3:{ci:4,co:0}, 4:{ci:0,co:4}, 7:{ci:3,co:3}};
const STD_WDAYS=[3,4,0];
function _mode(arr){ const c={}; let best=null,bn=0; arr.forEach(v=>{ if(v==null||v===''||v===-1)return; c[v]=(c[v]||0)+1; if(c[v]>bn){bn=c[v];best=v;} }); return {v:best,n:bn}; }
function _anWd(s){ const d=parseLocalDate(s); return d?d.getDay():-1; }
function _pPort(p){ return (window.SZCore&&SZCore.isPus&&SZCore.isPus(p.origin||'',p.dep_flight||''))?'PUS':'ICN'; }
function _retPort(d){ const rp=(d.paxList||[]).find(p=>p.id===d.repPid)||(d.paxList||[])[0]||{}; return (window.SZCore&&SZCore.isPus&&SZCore.isPus(rp.origin||'',d.retFlight||''))?'PUS':'ICN'; }
function _comboCount(pn){ const s=String(pn||''); let n=0;
  if(/야마나미.*호텔|골프텔|관내별장/.test(s))n++; if(/간지/.test(s))n++; if(/시즈|료칸/.test(s))n++;
  if(/쿠주|별장전용/.test(s))n++; if(/소보별장/.test(s))n++; if(/아소별장/.test(s))n++; if(/돔하우스/.test(s))n++;
  if(/\+/.test(s))n=Math.max(n,2); return n; }
function computeAnomBaseline(){
  ANOM={ci:{},co:{}};
  if(!ROWS.length) return;
  const byN={}; ROWS.forEach(d=>{ const n=d.rec.nights; (byN[n]=byN[n]||{ci:[],co:[]}); byN[n].ci.push(_anWd(d.rec.dep)); byN[n].co.push(_anWd(d.rec.arr)); });
  Object.keys(byN).forEach(n=>{ ANOM.ci[n]=_mode(byN[n].ci).v; ANOM.co[n]=_mode(byN[n].co).v; });
}
const _WDJP=['日','月','火','水','木','金','土'];
function teamAnomaly(d){
  const r=[];
  if(_comboCount(d.prodName)>=2) r.push(tx('anoCombo'));
  // 공항: 출≠귀(비대칭)·팀내 혼재만 특이 (PUS/ICN 자체는 둘 다 기본이라 단독으로는 정상)
  const retP=_retPort(d);
  if(retP!==d.port) r.push(tx('anoPortAsym')(d.port,retP));
  const ports=[...new Set((d.paxList||[]).map(_pPort))];
  if(ports.length>1) r.push(tx('anoPortMixed'));
  // 요일: 표준 패턴(3박 목~일·4박 일~목·7박 수~수) 외 = 특이. 그 외 박수는 입/퇴실이 수·목·일이 아니면 특이.
  const n=d.rec.nights, ci=_anWd(d.rec.dep), co=_anWd(d.rec.arr), std=STD_STAY[n];
  if(std){
    if(ci!==-1 && ci!==std.ci) r.push(tx('anoWdIn')(_WDJP[ci]));
    if(co!==-1 && co!==std.co) r.push(tx('anoWdOut')(_WDJP[co]));
  }else{
    if(ci!==-1 && STD_WDAYS.indexOf(ci)<0) r.push(tx('anoWdIn')(_WDJP[ci]));
    if(co!==-1 && STD_WDAYS.indexOf(co)<0) r.push(tx('anoWdOut')(_WDJP[co]));
  }
  // 항공: 기본편(TW287/288·ZE967/968) 외 = 비표준. 정보 없으면 결측.
  const flights=[d.depFlight,d.retFlight].concat((d.paxList||[]).map(p=>p.dep_flight),(d.paxList||[]).map(p=>p.ret_flight)).map(_fnorm).filter(Boolean);
  const uniq=[...new Set(flights)];
  if(!uniq.length) r.push(tx('anoAirMiss'));
  else { const nonStd=uniq.filter(f=>!STD_FLIGHTS.includes(f)); if(nonStd.length) r.push(tx('anoAirNonstd')(nonStd.join('·'))); }
  return r;
}
function anomBadge(d){ const rs=teamAnomaly(d); if(!rs.length) return '';
  return `<span title="${esc(tx('anoTitle')+': '+rs.join(' / '))}" style="display:inline-block;background:#fdecea;color:#b0472c;border:1px solid #e6a99b;border-radius:5px;padding:0 5px;font-size:10.5px;font-weight:800;margin-right:5px;vertical-align:middle">${esc(tx('anoMark'))}</span>`; }
// 묶은 팀의 표시 태그 = 대표 기준코드 + 팀번호(DRな-Y1/Y2). 단독은 원래 태그.
//   대표=team_group_rep, 없으면 최소 seq. 팀번호=SZCore.orderGroup(대표먼저·dep·seq).
function computeGroupTags(){
  GTAG={}; GREP={};
  if(!(window.SZCore&&SZCore.teamTagN&&SZCore.orderGroup)) return;
  // ⚠ 기준은 GFULL(그룹 전원 · 기간 무관). 화면에 일부만 있어도 순번이 흔들리지 않는다
  //   → 航空カバー·네임택과 항상 같은 코드·번호.
  const keys=Object.keys(GFULL||{});
  const groups={};
  ROWS.forEach(r=>{ const g=r.rec.teamGroup; if(g){ (groups[g]=groups[g]||[]).push(r); } });
  (keys.length?keys:Object.keys(groups)).forEach(k=>{
    const all=(GFULL&&GFULL[k])||null;
    const list=groups[k]||[];
    let src = all && all.length ? all
              : (list.length>1 ? list.map(r=>({seq:String(r.seq),rep:!!r.rec.teamGroupRep,gseq:r.rec.teamGroupSeq,dep:r.dep,tag:r.tagCode||''})) : null);
    if(!src || src.length<2) return;                       // 단독은 번호 없음
    // ⚠ 묶음 이름 = 대표 태그코드라, 같은 코드를 쓰는 다른 시기 묶음과 합쳐질 수 있다
    //   (합쳐지면 순번이 Y2/Y4/Y6 로 밀림). 입국일 간격으로 실제 묶음만 갈라낸다.
    if(SZCore.clusterOf && list.length){
      const anchorSeq=String(list[0].seq);
      const cl=SZCore.clusterOf(src.map(x=>({...x,event_seq:x.seq})), anchorSeq);
      if(cl && cl.length>=2) src=cl;
    }
    if(src.length<2) return;
    const rep=src.find(x=>x.rep);
    if(!rep || !rep.tag) return;   // 대표 미지정(구 묶음) → 원래 태그 유지. 대표 선택 시에만 통일코드.
    const repRow=list.find(r=>String(r.seq)===rep.seq);
    if(repRow) GREP[k]=repRow;     // 그룹 대표(정렬 앵커용) — 화면에 있을 때만
    else if(list.length) GREP[k]=list[0];
    const base=rep.tag;
    // 수동 순번(team_group_seq) 전원 지정 시 그 순서 우선, 아니면 자동정렬(대표먼저→dep→seq)
    const hasManual=src.every(x=>x.gseq!=null);
    const ordered=hasManual
      ? src.slice().sort((a,b)=>(a.gseq-b.gseq)||(Number(a.seq)-Number(b.seq))).map(x=>({event_seq:x.seq,dep:x.dep}))
      : SZCore.orderGroup(src.map(x=>({event_seq:x.seq,dep:x.dep})), rep.seq);
    ordered.forEach((o,i)=>{ GTAG[o.event_seq]=SZCore.teamTagN(base,i+1); });
  });
}
function groupLabel(v){ return String(v==null?'':v).replace(/#\d+$/,''); }   // 묶음 이름에서 내부 구분자 제거
function dTag(d){ return GTAG[d.seq]||d.tagCode; }   // 묶음이면 Y1/Y2, 아니면 원래
// ── 팀별 규칙 정렬: 入国 → ICN/PUS → 숙소 → 코드 → 묶음번호(Y1,Y2 인접) → 대표자 ──
//   묶음은 대표(GREP) 앵커 공유 → 출국지 달라도 같은 그룹이 붙어서 출력.
function dispKey(d){
  const g=d.rec.teamGroup, gt=GTAG[d.seq], rep=g&&GREP[g];
  if(g&&gt&&rep){ const m=String(gt).match(/(\d+)$/); return {dep:rep.dep,port:rep.port,accom:rep.accom,code:rep.tagCode||'',no:m?+m[1]:0,name:d.rec.repName||''}; }
  return {dep:d.dep,port:d.port,accom:d.accom,code:d.tagCode||'',no:0,name:d.rec.repName||''};
}
function dispatchOrder(a,b){
  const ka=dispKey(a), kb=dispKey(b);
  if((ka.dep||'')!==(kb.dep||'')) return (ka.dep||'')<(kb.dep||'')?-1:1;
  if(ka.port!==kb.port) return ka.port==='ICN'?-1:1;
  const ai=ACCOM_ORDER.indexOf(ka.accom), bi=ACCOM_ORDER.indexOf(kb.accom); const da=ai<0?99:ai, db=bi<0?99:bi;
  if(da!==db) return da-db;
  if(ka.code!==kb.code) return String(ka.code).localeCompare(String(kb.code));
  if(ka.no!==kb.no) return ka.no-kb.no;
  return String(ka.name).localeCompare(String(kb.name));
}

// 운영 팀(print_overrides.team_group) = 체크박스 묶기. 라벨=묶음 중 최소 seq 팀의 태그(읽기 좋게). 레스토랑 명패는 이 team_group 단위로 합석(夕食 화면). 구 dining_group은 미사용(보존).
function tgHue(k){ let h=0; for(const c of String(k||'')) h=(h*31+c.charCodeAt(0))%360; return h; }
function _tagPfx(t){ return String(t||'').split('-')[0]; }   // 태그 접두(그룹코드)만 — '-1Y' 같은 개인번호 제거

function teamGroupTags(label){ if(!label) return ''; const tags=ROWS.filter(r=>r.rec.teamGroup===label).map(r=>_tagPfx(r.tagCode)).filter(Boolean); return [...new Set(tags)].join('·'); }
function teamGroupBadge(label){ if(!label) return '<span style="color:var(--muted)">-</span>'; const h=tgHue(label); const tags=teamGroupTags(label); const n=ROWS.filter(r=>r.rec.teamGroup===label).length;

// 대표팀 선택 팝업: 묶은 팀 중 대표(기준코드) 선택 + ▲▼로 순번(Y1/Y2/Y3) 지정 → 인쇄·목록 순서 반영.
function openRepPicker(rows){
  const old=document.getElementById('rp-back'); if(old) old.remove();
  // 대표 기본값: 저장된 대표 → 없으면 회원이 대표인 팀 → 없으면 첫 팀. (담당자가 라디오로 변경 가능)
  const _rowMem=r=>{ const rp=(r.paxList||[]).find(p=>p.id===r.repPid)||(r.paxList||[])[0]||{}; return !!(window.SZCore&&SZCore.isMember(rp)); };
  const repDef=(rows.find(r=>r.rec.teamGroupRep)||rows.find(_rowMem)||rows[0]).seq;
  // 초기 순서: 수동순번 전원 지정 시 그 순서, 아니면 자동정렬(대표먼저→dep→seq)
  let ordered;
  if(rows.every(r=>r.rec.teamGroupSeq!=null)){
    ordered=rows.slice().sort((a,b)=>(a.rec.teamGroupSeq-b.rec.teamGroupSeq)||(a.seq-b.seq));
  }else if(window.SZCore&&SZCore.orderGroup){
    ordered=SZCore.orderGroup(rows.map(r=>({event_seq:r.seq,dep:r.dep})),repDef)
      .map(o=>rows.find(r=>String(r.seq)===String(o.event_seq))).filter(Boolean);
  }else{ ordered=rows.slice(); }
  const item=r=>`<div class="rp-item" data-seq="${r.seq}" draggable="true" style="justify-content:flex-start;gap:9px;cursor:grab">
    <span class="rp-grip" style="color:var(--muted);font-size:16px;line-height:1;user-select:none" title="${esc(tx('repDrag'))}">&#8801;</span>
    <span class="rp-ord mono" style="min-width:18px;font-weight:800;color:var(--accent2);text-align:center"></span>
    <input type="radio" name="rep-pick" value="${r.seq}" ${String(r.seq)===String(repDef)?'checked':''} title="${esc(tx('repRadio'))}">
    <span class="rp-tag mono">${esc(r.tagCode)}</span>
    <span class="rp-nm">${esc(r.rec.repName||'-')}様</span>
    <span class="rp-dt mono">${esc(r.dep||'')}</span></div>`;
  const back=document.createElement('div'); back.className='rp-back'; back.id='rp-back';
  back.innerHTML=`<div class="rp-card">
    <h3>${esc(tx('repTitle'))}</h3>
    <div class="rp-hint">${esc(tx('repHint'))}</div>
    <div class="rp-list" id="rp-list">${ordered.map(item).join('')}</div>
    <div class="rp-btns"><button class="btn ghost sm" id="rp-cancel">${esc(tx('cancel'))}</button><button class="btn sm" id="rp-ok">${esc(tx('repOk'))}</button></div>
  </div>`;
  document.body.appendChild(back);
  const listEl=back.querySelector('#rp-list');
  const renumber=()=>{ [...listEl.children].forEach((el,i)=>{ const o=el.querySelector('.rp-ord'); if(o)o.textContent=(i+1); }); };
  renumber();
  // ≡ 그립을 끌어 위아래로 순번 재정렬 (HTML5 드래그)
  let dragEl=null;
  listEl.addEventListener('dragstart',e=>{ const it=e.target.closest('.rp-item'); if(!it)return; dragEl=it; it.style.opacity='.4'; if(e.dataTransfer)e.dataTransfer.effectAllowed='move'; });
  listEl.addEventListener('dragend',()=>{ if(dragEl)dragEl.style.opacity=''; dragEl=null; renumber(); });
  listEl.addEventListener('dragover',e=>{
    e.preventDefault(); if(!dragEl)return;
    const it=e.target.closest('.rp-item'); if(!it||it===dragEl)return;
    const rect=it.getBoundingClientRect(); const after=(e.clientY-rect.top)/rect.height>0.5;
    listEl.insertBefore(dragEl, after?it.nextElementSibling:it); renumber();
  });
  const close=()=>back.remove();
  back.querySelector('#rp-cancel').addEventListener('click',close);
  back.addEventListener('click',e=>{ if(e.target===back) close(); });
  back.querySelector('#rp-ok').addEventListener('click',async()=>{
    const rep=listEl.querySelector('input[name="rep-pick"]:checked'); if(!rep)return;
    const orderedSeqs=[...listEl.children].map(el=>el.dataset.seq);
    close();
    await saveTeamGroupBulk(orderedSeqs, rep.value);   // orderedSeqs 순서 = 순번(team_group_seq)
    toast(tx('grouped'),'ok');
  });
}

// repSeq=대표 event_seq(null이면 묶음 해제). team_group=대표 기준코드, team_group_rep=대표만 true.
async function saveTeamGroupBulk(seqs,repSeq){
  if(!supa){toast(tx('connectFirst'),'warn');return;}
  try{
    const repRow=repSeq!=null?ROWS.find(r=>String(r.seq)===String(repSeq)):null;
    // ⚠ 묶음 이름은 유니크해야 한다. 태그코드만 쓰면 코드가 재사용될 때(F풀 재활용·
    //   회원 재방문) 다른 시기 묶음과 한 덩어리가 된다(실제 발생: WTル-Y 7월+8월).
    //   → 대표 행사번호를 붙여 구분. 화면 표시는 groupLabel()이 '#…'를 떼고 보여준다.
    const label=repSeq==null?null:((repRow?repRow.tagCode:'팀')+'#'+repSeq);
    for(let i=0;i<seqs.length;i++){
      const seq=seqs[i];
      const isRep=label!=null && String(seq)===String(repSeq);
      const gseq=label==null?null:(i+1);   // seqs 순서 = 순번(Y1/Y2/Y3), 해제 시 null
      const {data:cur}=await supa.from('print_overrides').select('dining_group,excluded,exclude_reason').eq('event_seq',seq).maybeSingle();
      const _rr=ROWS.find(x=>String(x.seq)===String(seq)); const _sym=(_rr&&_rr.rec.sessionYm)||YM;
      const row={event_seq:Number(seq),session_ym:_sym,team_group:label,team_group_rep:isRep,team_group_seq:gseq,
        dining_group:(cur&&cur.dining_group)||null,excluded:!!(cur&&cur.excluded),exclude_reason:(cur&&cur.exclude_reason)||null};
      const {error}=await supa.from('print_overrides').upsert(row,{onConflict:'event_seq'}); if(error)throw error;
      const r=ROWS.find(x=>String(x.seq)===String(seq)); if(r){ r.rec.teamGroup=label||''; r.rec.teamGroupRep=isRep; r.rec.teamGroupSeq=gseq; r.rec.teamName=(label?label.replace(/#\d+$/,''):(r.rec._teamLabelBase||'')); }
    }
    renderList();
  }catch(e){ toast(tx('teamSaveFail')+e.message,'err'); }
}
// 現地メモ(event_notes.memo) 편집 — print 영역도 가능한 RPC 경유(memo만 갱신 + 변경이력 기록)
async function saveDispatchMemo(seq,val){
  if(!supa){toast(tx('connectFirst'),'warn');return;}
  const d=ROWS.find(x=>String(x.seq)===String(seq)); if(!d)return;
  try{
    const {error}=await supa.rpc('dispatch_set_memo',{p_event_seq:Number(seq),p_session_ym:(d.rec.sessionYm||YM),p_memo:val,p_user:curUser()});
    if(error)throw error;
    d.rec.noteMemo=String(val||'').trim();
    toast(tx('memoSaved'),'ok');
  }catch(e){ toast(tx('memoSaveFail')+e.message,'err'); }
}
