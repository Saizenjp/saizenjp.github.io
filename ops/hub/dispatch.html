<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  table.list{width:100%;border-collapse:collapse;font-size:12px}
  table.list th{background:var(--surface3);border:1px solid var(--border);padding:6px 7px;font-weight:700;color:var(--text2);white-space:nowrap}
  table.list td{border:1px solid var(--border);padding:5px 7px}
  table.list td.c{text-align:center}
  table.list td.mono{font-family:var(--mono)}
  .lbl-check{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text2)}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }
function applyStatic(){
  const set=(sel,v)=>{const e=$(sel);if(e)e.textContent=v;};
  set('#t-step',tx('step')); set('#t-navhome',tx('navHome'));
  set('#t-connhint',tx('connHint')); set('#t-pre',tx('pre'));
  refreshConn();
  if($('#ym-label')) applyUIStatic();
}
function refreshConn(){
  const b=$('#btn-connect'); if(!b) return;
  if(state.conn==='ok'){ setConn(tx('connOk'),'ok'); b.textContent=tx('connectedBtn'); }
  else if(state.conn==='fail'){ setConn(tx('connFail'),'err'); b.textContent=tx('connFailBtn'); }
  else if(state.conn==='connecting'){ b.textContent=tx('connecting'); }
  else if(state.conn==='login'){ setConn(tx('needLogin'),'err'); b.textContent=tx('connect'); }
  else { setConn(tx('notConn'),''); b.textContent=tx('connect'); }
}
const state={ conn:'none' };

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function curUser(){ try{ return (window.__so_getUser&&__so_getUser())||''; }catch(e){ return ''; } }
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function today(){return new Date().toISOString().slice(0,10);}

// ── /app/ 동일 날짜·휴일 헬퍼 ──────────────────────────────
function fmtDate(d){ if(!d)return ''; if(d instanceof Date){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;} return String(d).slice(0,10); }
function parseLocalDate(s){ return SZCore.parseLocalDate(s); }  // 공유 모듈 위임
function getWD(d){ const w=['(月)','(火)','(水)','(木)','(金)','(土)','(日)']; try{ const day=new Date(d).getDay(); return w[day===0?6:day-1]; }catch(e){ return ''; } }
function isWeekend(date){ const d=new Date(date).getDay(); return d===0||d===6; }
const JP_HOLIDAYS=new Set(['2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24','2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06','2025-07-21','2025-08-11','2025-09-15','2025-09-22','2025-09-23','2025-10-13','2025-11-03','2025-11-23','2025-11-24','2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23','2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23']);
function isJpHoliday(date){ return JP_HOLIDAYS.has(String(date).slice(0,10)); }
function isNonWorkday(date){ return isWeekend(date)||isJpHoliday(date); }

// ── /app/ 동일 시설·룸타입·코스·비고 헬퍼 ──────────────────
function dispatchAccomJp(accom){ if(accom==='야마나미리조트')return '阿蘇やまなみリゾート'; if(accom==='쿠주힐즈')return '久住ヒルズ'; if(accom==='간지호텔')return '間地ホテル'; if(accom==='시즈노야도 료칸')return 'シズノヤド旅館'; return accom||''; }
function dispatchRoomTypeJp(rt){ const m={'호텔 트윈':'ホテルツイン','호텔 소형트윈':'ホテル小型ツイン','돔하우스':'ドームハウス','관내별장':'館内別荘','장기숙박전용':'長期滞在専用','료칸':'旅館','호텔':'ホテル'}; return m[rt]||rt||'-'; }
function dispatchCourseSummary(d){ const courses=[...new Set((d.golf||[]).map(g=>g.course).filter(Boolean))]; return courses.length?courses.join(' ・ '):'ラウンドなし'; }
const DISPATCH_BOLD_KW=['체크인','체크아웃','얼리','레이트','알러지','알레르기','채식','비건','휠체어','거동','픽업','송영','차량','룸업','업그레이드','생일','기념일','캐디','카트','vip','귀빈','추가','별도','요청'];
function bigoSegments(text,alwaysBold){ if(!text)return []; return String(text).split(/(\n|\/)/).map(seg=>{ if(seg==='\n'||seg==='/')return {t:seg,b:false}; if(alwaysBold)return {t:seg,b:seg.trim()!==''}; const low=seg.toLowerCase(); const hit=DISPATCH_BOLD_KW.some(kw=>low.includes(kw)); return {t:seg,b:hit&&seg.trim()!==''}; }); }
// ops 비고: bookings.remark + event_notes(remarks/memo). 현지 중요(remarks) 굵게 → 비고(remark) 키워드 굵게 → 【現地メモ】(memo)
function dispatchNoteSegments(rec){ const segs=[]; const nl=()=>{ if(segs.length)segs.push({t:'\n',b:false}); };
  const remarks=String(rec.noteRemarks||'').trim(); const bigo=String(rec.remark||'').trim(); const memo=String(rec.noteMemo||'').trim();
  if(remarks){ nl(); segs.push(...bigoSegments(remarks,true)); }
  if(bigo){ nl(); segs.push(...bigoSegments(bigo,false)); }
  // ※現地メモ(memo)는 参考事項에서 분리 → 아래 별도 '現地メモ' 박스로 출력
  while(segs.length&&segs[0].t==='\n') segs.shift(); return segs; }
function dispatchNotesHTML(rec){ return dispatchNoteSegments(rec).map(s=>s.b?`<b>${esc(s.t)}</b>`:esc(s.t)).join(''); }

// ── 라운딩 일정 (/app/ dispatchGolfRows 동일) ──────────────
function dispatchGolfRows(rec,isPUS){
  const rows=[]; if(!rec.dep||!rec.arr)return rows;
  const cur=parseLocalDate(rec.dep),end=parseLocalDate(rec.arr); if(isNaN(cur)||isNaN(end))return rows;
  for(;cur<=end;cur.setDate(cur.getDate()+1)){
    const ds=fmtDate(cur);
    if(ds===rec.dep){ if(isPUS)continue; rows.push({date:ds,course:'やまなみCC',holes:18,note:'入国日'}); }
    else if(ds===rec.arr){ if(!isPUS)continue; rows.push({date:ds,course:'やまなみCC',holes:9,note:'帰国日(釜山便)'}); }
    else{ const nonWork=isNonWorkday(ds); const course=(rec.accom==='간지호텔'&&!nonWork)?'九重高原CC':'やまなみCC'; rows.push({date:ds,course,holes:18,note:nonWork?(isJpHoliday(ds)?'祝日':'週末'):'+9Hサービス対象'}); }
  }
  return rows;
}

async function load(){
  if(!supa)return;
  $('#ym-label').textContent=YM; $('#stat').textContent=tx('loading'); $('#btn-print').disabled=true;
  try{
    const {data:bs,error:e1}=await supa.from('bookings')
      .select('event_seq,event_no,rep_name,member_type,dep_date,arr_date,nights_label,origin,airline,product_name,pax,remark,team_label')
      .eq('session_ym',YM);
    if(e1)throw e1;
    const BMAP={}; (bs||[]).forEach(b=>{BMAP[b.event_seq]=b;});
    const seqs=Object.keys(BMAP).map(Number);
    if(!seqs.length){ ROWS=[]; $('#stat').textContent=tx('noMonthData'); DATESEL.clear();ACCOMSEL.clear(); renderDateChips();renderAccomChips();renderList(); return; }
    const {data:gs}=await supa.from('guests').select('event_seq,group_code,team_tag,accom,accom_prefix,pax').eq('session_ym',YM);
    const GMAP={}; (gs||[]).forEach(g=>{GMAP[g.event_seq]=g;});
    const {data:ns}=await supa.from('event_notes').select('event_seq,remarks,memo').eq('session_ym',YM);
    const NMAP={}; (ns||[]).forEach(n=>{NMAP[n.event_seq]=n;});
    // 운영 팀 라벨(print_overrides.team_group) — 手配書 チーム 칸에서 정의·표시
    const {data:os}=await supa.from('print_overrides').select('event_seq,team_group').eq('session_ym',YM);
    const OMAP={}; (os||[]).forEach(o=>{OMAP[o.event_seq]=o;});
    // 개인 명단(passengers) + 대표/태그(guest_members)
    const PAX={}, REP={};
    for(let i=0;i<seqs.length;i+=200){
      const chunk=seqs.slice(i,i+200);
      // passengers
      let pg=0;
      for(;;){
        const {data,error}=await supa.from('passengers')
          .select('id,event_seq,seq_in_team,name_kr,name_en,gender,birth,birth_yymmdd,passport_no,phone,dep_flight,ret_flight,dep_time,loc_arr_time,ret_dep_time,kor_arr_time,airline,origin,member_grade,member_class,member_div')
          .in('event_seq',chunk).order('event_seq').order('seq_in_team').range(pg,pg+999);
        if(error)throw error;
        (data||[]).forEach(p=>{ (PAX[p.event_seq]=PAX[p.event_seq]||[]).push(p); });
        if(!data||data.length<1000)break; pg+=1000;
      }
      // guest_members (대표 tag·is_rep → passenger_id)
      let mg=0;
      for(;;){
        const {data,error}=await supa.from('guest_members')
          .select('event_seq,person_tag,is_rep,seq_in_team,passenger_id').in('event_seq',chunk).order('event_seq').order('seq_in_team').range(mg,mg+999);
        if(error)throw error;
        (data||[]).forEach(m=>{
          const cur=REP[m.event_seq]; const curSeq=cur?(cur._seq==null?99:cur._seq):99;
          if(!cur || (m.is_rep&&curSeq!==0) || (!m.is_rep&&curSeq!==0&&(m.seq_in_team||99)<curSeq)){
            REP[m.event_seq]={tag:m.person_tag||'',_seq:m.is_rep?0:(m.seq_in_team||99),pid:m.passenger_id};
          }
        });
        if(!data||data.length<1000)break; mg+=1000;
      }
    }
    // 행사별 카드 데이터 구성 (출발일 → 대표자명 순)
    ROWS=seqs.map(seq=>{
      const b=BMAP[seq]||{}, g=GMAP[seq]||{}, note=NMAP[seq]||{};
      const paxList=(PAX[seq]||[]).slice().sort((a,b2)=>(a.seq_in_team||99)-(b2.seq_in_team||99));
      const rep=REP[seq]||{};
      const repPax=paxList.find(p=>p.id===rep.pid)||paxList[0]||{};
      const dep=fmtDate(b.dep_date), arr=fmtDate(b.arr_date);
      const nights=(dep&&arr)?Math.max(0,Math.round((parseLocalDate(arr)-parseLocalDate(dep))/86400000)):0;
      const origin=repPax.origin||b.origin||'';
      const depFlight=repPax.dep_flight||b.airline||'';
      const isPUS=SZCore.isPus(origin, depFlight);  // 출발지 PUS/ICN = saizen-core 단일 진실원(ZE/TW·부산/김해)
      const _tlabel=b.team_label||note.team_label||'', _tg=(OMAP[seq]&&OMAP[seq].team_group)||'';
      const rec={ eventSeq:seq, eventNo:b.event_no||'', repName:b.rep_name||'', memberType:b.member_type||'', dep, arr, nights, pax:b.pax||g.pax||0,
        accom:g.accom||'', roomType:'', teamName:_tg||_tlabel, teamGroup:_tg, _teamLabelBase:_tlabel, remark:b.remark||'', noteRemarks:note.remarks||'', noteMemo:note.memo||'',
        prodName:b.product_name||'' };
      const golf=dispatchGolfRows(rec,isPUS).map(x=>({...x,tee:''}));
      const autoRoom=rec.pax>0?(Math.ceil(rec.pax/2)+'室 (2人1室)'):'-';
      return {
        seq, rec, dep, accom:rec.accom, repPid:repPax.id,
        tagCode:rep.tag||g.team_tag||g.group_code||'',
        engName:repPax.name_en||'',
        depFlight, retFlight:repPax.ret_flight||'', depTime:repPax.dep_time||'', locArrTime:repPax.loc_arr_time||'', retTime:repPax.ret_dep_time||'', korArrTime:repPax.kor_arr_time||'', airline:repPax.airline||b.airline||'',
        port:isPUS?'PUS':'ICN', portName:isPUS?'釜山(金海)':'ソウル(仁川)',
        roomCnt:autoRoom, golf, paxList, prodName:rec.prodName, accomJp:dispatchAccomJp(rec.accom)
      };
    }).sort((a,b)=>(a.dep||'').localeCompare(b.dep||'')||(a.rec.repName||'').localeCompare(b.rec.repName||''))
      .map((d,i)=>{ d.no=i+1; return d; });
    DATESEL.clear(); ACCOMSEL.clear();
    $('#stat').textContent=`${ROWS.length}${tx('cntUnit')}`;
    renderDateChips(); renderAccomChips(); renderList();
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFail')+': '+e.message,'err'); }
}

// 운영 팀(print_overrides.team_group) = 체크박스 묶기. 라벨=묶음 중 최소 seq 팀의 태그(읽기 좋게). 레스토랑 명패는 이 team_group 단위로 합석(夕食 화면). 구 dining_group은 미사용(보존).
function tgHue(k){ let h=0; for(const c of String(k||'')) h=(h*31+c.charCodeAt(0))%360; return h; }
function _tagPfx(t){ return String(t||'').split('-')[0]; }   // 태그 접두(그룹코드)만 — '-1Y' 같은 개인번호 제거
// 묶인 모든 팀 태그(접두) 나열 — 예 'WJあ·DFな·ROキ'. 같은 team_group 공유 행 전부.
function teamGroupTags(label){ if(!label) return ''; const tags=ROWS.filter(r=>r.rec.teamGroup===label).map(r=>_tagPfx(r.tagCode)).filter(Boolean); return [...new Set(tags)].join('·'); }
function teamGroupBadge(label){ if(!label) return '<span style="color:var(--muted)">-</span>'; const h=tgHue(label); const tags=teamGroupTags(label); const n=ROWS.filter(r=>r.rec.teamGroup===label).length;
  return `<span style="display:inline-block;background:hsl(${h},55%,93%);color:hsl(${h},65%,30%);border:1px solid hsl(${h},45%,75%);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;white-space:normal">🔗 ${esc(tags)}${n>1?' ('+n+')':''}</span>`; }
function _dCkSeqs(){ return [...document.querySelectorAll('#list .d-ck:checked')].map(c=>c.dataset.seq); }
async function groupSelected(){

  const label=rows[0].tagCode||('팀'+rows[0].seq);
  await saveTeamGroupBulk(seqs,label); toast(tx('grouped'),'ok');
}
async function ungroupSelected(){
  const seqs=_dCkSeqs();
  if(!seqs.length){ toast(tx('ungroupSel'),'warn'); return; }
  await saveTeamGroupBulk(seqs,null);  toast(tx('ungrouped'),'ok');
}
async function saveTeamGroupBulk(seqs,label){
  if(!supa){toast(tx('connectFirst'),'warn');return;}
  try{
    for(const seq of seqs){
      const {data:cur}=await supa.from('print_overrides').select('dining_group,excluded,exclude_reason').eq('event_seq',seq).maybeSingle();
      const row={event_seq:Number(seq),session_ym:YM,team_group:label,
        dining_group:(cur&&cur.dining_group)||null,excluded:!!(cur&&cur.excluded),exclude_reason:(cur&&cur.exclude_reason)||null};
      const {error}=await supa.from('print_overrides').upsert(row,{onConflict:'event_seq'}); if(error)throw error;
      const r=ROWS.find(x=>String(x.seq)===String(seq)); if(r){ r.rec.teamGroup=label||''; r.rec.teamName=label||r.rec._teamLabelBase||''; }
    }
    renderList();
  }catch(e){ toast(tx('teamSaveFail')+e.message,'err'); }
}
// 現地メモ(event_notes.memo) 편집 — print 영역도 가능한 RPC 경유(memo만 갱신 + 변경이력 기록)
async function saveDispatchMemo(seq,val){
  if(!supa){toast(tx('connectFirst'),'warn');return;}
  const d=ROWS.find(x=>String(x.seq)===String(seq)); if(!d)return;
  try{
    const {error}=await supa.rpc('dispatch_set_memo',{p_event_seq:Number(seq),p_session_ym:YM,p_memo:val,p_user:curUser()});
    if(error)throw error;
    d.rec.noteMemo=String(val||'').trim();
    toast(tx('memoSaved'),'ok');
  }catch(e){ toast(tx('memoSaveFail')+e.message,'err'); }
}
