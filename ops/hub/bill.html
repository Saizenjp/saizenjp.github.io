<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>SaiZen · ご精算確認 / 결제 내역</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f6f2; --surface:#ffffff; --line:#d8ddce; --text:#23291d; --text2:#5d6650; --muted:#8b937c;
    --accent:#647548; --accent2:#9a7322; --ok:#2f7d4f; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans JP','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
  .top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:3px solid var(--accent);background:var(--surface);position:sticky;top:0;z-index:5}
  .top .brand{font-weight:800;font-size:17px;color:var(--accent);letter-spacing:.3px}
  .top .brand small{font-weight:600;color:var(--muted);font-size:11px;margin-left:6px}
  .langs{margin-left:auto;display:flex;gap:5px}
  .langs button{font-family:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:99px;border:1px solid var(--line);
    background:var(--surface);color:var(--text2);cursor:pointer}
  .langs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .body{padding:18px 16px 40px;max-width:640px;margin:0 auto}

  .state{padding:60px 20px;text-align:center;color:var(--text2)}
  .state .big{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:8px}
  .state .sub{font-size:15px;color:var(--muted);line-height:1.6}

  .bhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:4px}
  .bhead .rep{font-size:24px;font-weight:800}
  .bhead .tag{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent2)}
  .bhead .ttl{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
  table.lines{width:100%;border-collapse:collapse;font-size:15.5px}
  table.lines th{text-align:left;font-size:12px;font-weight:700;color:var(--text2);padding:9px 6px;border-bottom:1px solid var(--line)}
  table.lines th.r,table.lines td.r{text-align:right}
  table.lines th.c,table.lines td.c{text-align:center}
  table.lines td{padding:10px 6px;border-bottom:1px solid var(--line);font-weight:600}
  table.lines td.amt{font-family:var(--mono);font-weight:700;white-space:nowrap}
  .nolines{padding:30px;text-align:center;color:var(--muted);font-size:15px}
  .totals{margin-top:16px;margin-left:auto;max-width:420px}
  .trow{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px;font-size:16px}
  .trow .lab{color:var(--text2);font-weight:700}
  .trow .val{font-family:var(--mono);font-weight:800}
  .trow.sum{border-top:2px solid var(--line);margin-top:4px;padding-top:11px}
  .trow.paid .val{color:var(--ok)}
  .trow.due{border-top:3px solid var(--accent);margin-top:6px;padding-top:13px;font-size:24px}
  .trow.due .lab{color:var(--accent);font-weight:800}
  .trow.due .val{color:var(--accent)}
  .trow.settled .val{color:var(--ok)}
  .note{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;line-height:1.6}
  .upd{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}
  /* 직원 바 — 같은 QR을 직원이 스캔했을 때만(로그인 세션 감지) 노출. 손님에겐 안 보임. */
  #staffbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;background:#eef3e6;border-bottom:2px solid var(--accent);padding:9px 14px}
  #staffbar .sb-t{font-size:12px;font-weight:800;color:var(--accent);margin-right:auto}
  #staffbar a{font-size:13px;font-weight:800;text-decoration:none;color:#fff;background:var(--accent);border-radius:7px;padding:7px 13px}
  #staffbar a.alt{background:#fff;color:var(--accent);border:1px solid var(--accent)}
</style>
</head>
<body>
  <div class="top">
    <span class="brand">SaiZen <small>Yamanami Resort</small></span>
    <div class="langs" id="langs">
      <button data-l="ko" class="on">한국어</button>
      <button data-l="ja">日本語</button>
      <button data-l="en">EN</button>
    </div>
  </div>
  <div id="staffbar"></div>
  <div class="body" id="body"></div>

<script>
// ── 손님 셀프 결제내역(QR) — 비로그인(anon). 토큰(?t=)으로 guest_bill RPC 호출 ──
const SB_URL='https://wzfmloivrolpwpiuyhbs.supabase.co';
const SB_KEY='sb_publishable_W76Uh3D9gRPjPoxHwl-LYw_dR9BIj6L';   // publishable(공개·내장 안전)
const $=s=>document.querySelector(s);
const T={
  ko:{ title:'결제 내역', guest:'고객', item:'항목', qty:'수량', amount:'금액',
       noLines:'아직 청구 내역이 없습니다.', subtotal:'청구 합계', paid:'결제 완료', due:'미결제 잔액',
       settled:'전액 결제 완료 ✓', note:'※ 실시간 반영됩니다. 결제는 프런트/직원이 도와드립니다.',
       loading:'불러오는 중…', noToken:'QR 정보가 없습니다', noTokenSub:'체크인 때 받으신 QR을 다시 스캔해 주세요.',
       invalid:'유효하지 않은 QR입니다', invalidSub:'프런트에 문의해 주세요.', errH:'일시적으로 불러오지 못했습니다', errSub:'잠시 후 다시 시도합니다.', updated:'업데이트',
       expired:'이용이 종료된 QR입니다', expiredSub:'체크아웃 후에는 조회할 수 없습니다. 문의사항은 프런트로 연락해 주세요.',
       sbStaff:'직원 모드', sbOrder:'POS 주문', sbSettle:'정산' },
  ja:{ title:'ご精算確認', guest:'お客様', item:'品目', qty:'数量', amount:'金額',
       noLines:'まだご請求はありません。', subtotal:'ご請求合計', paid:'お支払い済', due:'未払い残高',
       settled:'全額お支払い済 ✓', note:'※ リアルタイムで反映されます。お支払いはフロント／スタッフが承ります。',
       loading:'読み込み中…', noToken:'QR情報がありません', noTokenSub:'チェックイン時のQRをもう一度スキャンしてください。',
       invalid:'無効なQRです', invalidSub:'フロントへお問い合わせください。', errH:'一時的に読み込めませんでした', errSub:'しばらくして再試行します。', updated:'更新',
       expired:'ご利用済みのQRです', expiredSub:'チェックアウト後はご確認いただけません。お問い合わせはフロントまで。',
       sbStaff:'スタッフモード', sbOrder:'POS 注文', sbSettle:'精算' },
  en:{ title:'Your Bill', guest:'Guest', item:'Item', qty:'Qty', amount:'Amount',
       noLines:'No charges yet.', subtotal:'Subtotal', paid:'Paid', due:'Balance due',
       settled:'Fully paid ✓', note:'※ Updates in real time. Staff will assist with payment.',
       loading:'Loading…', noToken:'No QR data', noTokenSub:'Please scan the QR from your check-in again.',
       invalid:'Invalid QR', invalidSub:'Please ask the front desk.', errH:'Temporarily unavailable', errSub:'Retrying shortly.', updated:'Updated',
       expired:'This QR has expired', expiredSub:'Not viewable after checkout. Please contact the front desk with any questions.',
       sbStaff:'Staff mode', sbOrder:'POS order', sbSettle:'Settlement' }
};
let lang=localStorage.getItem('saizen_lang')||'ko'; if(!T[lang]) lang='ko';
// 토큰: ?t= 우선, URL 전체가 토큰만인 구형도 허용
const _params=new URLSearchParams(location.search);
const TOKEN=(_params.get('t')||_params.get('token')||'').trim();
let supa=null, pollTimer=null, lastSig='';

function yen(n){ return '¥'+Number(n||0).toLocaleString('ja-JP'); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hhmm(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

document.querySelectorAll('#langs button').forEach(b=>b.addEventListener('click',()=>{
  lang=b.dataset.l; localStorage.setItem('saizen_lang',lang);
  document.querySelectorAll('#langs button').forEach(x=>x.classList.toggle('on',x===b));
  document.documentElement.lang=lang; lastSig=''; tick(); renderStaffBar();
}));
document.querySelectorAll('#langs button').forEach(x=>x.classList.toggle('on',x.dataset.l===lang));
document.documentElement.lang=lang;

function stateView(big,sub){ $('#body').innerHTML=`<div class="state"><div class="big">${esc(big)}</div><div class="sub">${esc(sub||'')}</div></div>`; }

function renderBill(d){
  const L=T[lang];
  const gross=Number(d.gross||0), paid=Number(d.paid||0), due=Number(d.balance||0);
  const lines=Array.isArray(d.lines)?d.lines:[];
  const rows = lines.length ? lines.map(l=>{
    const q=Number(l.qty||1);
    return `<tr><td>${esc(l.description||'')}</td><td class="c">${q%1===0?q:q}</td><td class="r amt">${yen(l.amount)}</td></tr>`;
  }).join('') : `<tr><td colspan="3" class="nolines">${esc(L.noLines)}</td></tr>`;
  const dueRow = due>0
    ? `<div class="trow due"><span class="lab">${esc(L.due)}</span><span class="val">${yen(due)}</span></div>`
    : `<div class="trow due settled"><span class="lab">${esc(L.due)}</span><span class="val">${esc(L.settled)}</span></div>`;
  $('#body').innerHTML=`
    <div class="bhead"><span class="rep">${esc(d.rep_name||L.guest)}</span>${d.tag?`<span class="tag">${esc(d.tag)}</span>`:''}<span class="ttl">${esc(L.title)}</span></div>
    <table class="lines">
      <thead><tr><th>${esc(L.item)}</th><th class="c">${esc(L.qty)}</th><th class="r">${esc(L.amount)}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="totals">
      <div class="trow sum"><span class="lab">${esc(L.subtotal)}</span><span class="val">${yen(gross)}</span></div>
      ${paid>0?`<div class="trow paid"><span class="lab">${esc(L.paid)}</span><span class="val">−${yen(paid)}</span></div>`:''}
      ${dueRow}
    </div>
    <div class="note">${esc(L.note)}</div>
    <div class="upd">${esc(L.updated)} ${hhmm()}</div>`;
}

async function tick(){
  const L=T[lang];
  if(!TOKEN){ if(lastSig!=='no'){ stateView(L.noToken,L.noTokenSub); lastSig='no'; } return; }
  if(!supa){ try{ supa=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){ return; } }
  try{
    const {data,error}=await supa.rpc('guest_bill',{p_token:TOKEN});
    if(error) throw error;
    // 체크아웃 + 유예기간 경과 = 만료(SQL 90) → 폴링 중단하고 '이용 종료' 안내
    if(data && data.expired===true){
      if(lastSig!=='exp'){ stateView(L.expired,L.expiredSub); lastSig='exp'; }
      if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
      return;
    }
    if(!data || data.ok!==true){ if(lastSig!=='inv'){ stateView(L.invalid,L.invalidSub); lastSig='inv'; } return; }
    const sig=lang+'|'+JSON.stringify(data);
    if(sig!==lastSig){ renderBill(data); lastSig=sig; }
  }catch(e){ if(lastSig!=='err'){ stateView(L.errH,L.errSub); lastSig='err'; } }
}

// ── 같은 QR의 이중 용도: 직원(로그인 세션)이 스캔하면 POS·정산 바로가기 바를 띄운다 ──
//   손님(비로그인)에겐 아무것도 안 보임 → QR 1장으로 손님=청구조회 / 직원=팀 딥링크.
//   세션은 같은 origin·기본 storageKey라 ops 페이지 로그인과 공유됨. order_tokens 읽기=로그인 직원 허용.
let STAFF=null;   // {seq, ym}
function renderStaffBar(){
  const bar=$('#staffbar'); if(!bar||!STAFF) return;
  const L=T[lang];
  bar.innerHTML=`<span class="sb-t">🔐 ${esc(L.sbStaff)}</span>`
    +`<a href="pos.html?seq=${encodeURIComponent(STAFF.seq)}">${esc(L.sbOrder)}</a>`
    +`<a class="alt" href="settle.html?ym=${encodeURIComponent(STAFF.ym||'')}&seq=${encodeURIComponent(STAFF.seq)}">${esc(L.sbSettle)}</a>`;
  bar.style.display='flex';
}
async function initStaffBar(){
  if(!TOKEN) return;
  try{
    if(!supa) supa=window.supabase.createClient(SB_URL,SB_KEY);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session) return;                       // 손님 → 바 없음
    const {data:ot}=await supa.from('order_tokens').select('event_seq').eq('token',TOKEN).maybeSingle();
    if(!ot||!ot.event_seq) return;
    let ym='';
    try{ const {data:g}=await supa.from('guests').select('session_ym').eq('event_seq',ot.event_seq).maybeSingle(); ym=(g&&g.session_ym)||''; }catch(e){}
    STAFF={seq:ot.event_seq, ym};
    renderStaffBar();
  }catch(e){ /* 직원 바 실패는 손님 화면에 영향 없음 */ }
}

stateView(T[lang].loading,'');
tick();
initStaffBar();
pollTimer=setInterval(tick, 8000);   // 8초 폴링 — 직원이 청구 추가하면 자동 갱신
</script>
</body>
</html>
