<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 데이터 등록</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad;
    --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e6eeda;
    --ok:#3d5526; --warn:#647548; --err:#b4452f;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text); line-height:1.6; min-height:100vh; padding:32px 20px;
  }
  .wrap{max-width:960px;margin:0 auto}
  header{margin-bottom:28px;border-bottom:2px solid var(--accent);padding-bottom:16px}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
  .brand .step{
    font-size:11px;font-weight:700;color:var(--accent2);
    border:1px solid var(--accent2);border-radius:99px;padding:2px 10px;letter-spacing:.04em;
  }
  .brand .sub{font-size:12.5px;color:var(--text2);margin-left:auto}
  .lead{font-size:13px;color:var(--text2);margin-top:10px}

  /* 연결 설정 */
  .conn{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin-bottom:22px;
  }
  .conn h2{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text);display:flex;align-items:center;gap:8px}
  .conn .row{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;align-items:center}
  .conn label{font-size:12px;color:var(--text2);font-weight:600}
  .conn input{
    width:100%;padding:8px 11px;border:1px solid var(--border2);border-radius:7px;
    background:var(--surface2);color:var(--text);font-size:12.5px;font-family:var(--mono);
  }
  .conn input:focus{outline:none;border-color:var(--accent);background:#fff}
  .conn .hint{grid-column:2;font-size:11px;color:var(--muted);margin-top:-4px}
  .conn-bar{display:flex;align-items:center;gap:10px;margin-top:14px}
  .pill{
    font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:99px;
    background:var(--surface3);color:var(--text2);border:1px solid var(--border);
  }
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#c4ddcc}
  .pill.err{background:#f8e8e3;color:var(--err);border-color:#e6c4ba}

  /* 드롭 그리드 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}.conn .row{grid-template-columns:1fr}.conn .hint,.conn .conn-bar{grid-column:1}}
  /* 등록중 버튼: 깜빡이며 진행 중임을 명확히 */
  #btn-run.running{opacity:1!important;cursor:progress;animation:regpulse 1s ease-in-out infinite}
  #btn-run.off{opacity:.45;box-shadow:none}
  #run-why.flash{animation:whyflash .55s ease-in-out 2}
  @keyframes whyflash{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes regpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
  /* 등록 상태 감도색: 미등록=쨍한 레드 / 등록=쨍한 그린(app 업로드와 동일 계열) */
  .drop{
    background:#fdf1f0;border:1.5px dashed #e98b82;border-radius:12px;
    padding:18px;cursor:pointer;transition:.15s;position:relative;
  }
  .drop:hover{border-color:var(--accent);background:var(--surface2)}
  .drop.over{border-color:var(--accent);background:var(--accentSoft)}
  .drop.done{border-style:solid;border-color:#1fb257;background:#e3f8ec;box-shadow:0 0 0 1px #1fb257 inset}
  .drop .tag{font-size:10.5px;font-weight:700;color:var(--accent2);letter-spacing:.05em;text-transform:uppercase}
  .drop .name{font-size:14px;font-weight:700;margin:5px 0 3px}
  .drop .desc{font-size:11.5px;color:var(--text2);min-height:32px}
  .drop .file{font-size:11.5px;color:var(--text2);margin-top:8px;font-family:var(--mono);word-break:break-all}
  .drop .file b{color:#15a04a}
  .drop input[type=file]{display:none}
  .drop-x{position:absolute;top:8px;right:9px;z-index:2;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);background:var(--surface);color:var(--err,#b13b2c);border-radius:6px;font-size:12px;font-weight:800;line-height:1;cursor:pointer}
  .drop-x:hover{background:#f7e6e2;border-color:#e3bdb4}
  .dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.18)}
  .drop.done .dot{background:#19b257;box-shadow:0 0 0 3px rgba(25,178,87,.2)}

  /* 액션 */
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .btn{
    font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:10px 20px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s;
  }
  .btn:hover:not(:disabled){background:#4f5e38}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .session{font-size:12px;color:var(--text2);margin-left:auto}
  .session b{color:var(--accent);font-family:var(--mono)}

  /* 로그 / 결과 */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .panel h2{font-size:13px;font-weight:700;padding:13px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
  .log{font-family:var(--mono);font-size:12px;padding:14px 18px;max-height:300px;overflow:auto;white-space:pre-wrap}
  .log .l-ok{color:var(--ok)}
  .log .l-warn{color:var(--warn)}
  .log .l-err{color:var(--err)}
  .log .l-dim{color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border)}
  .stat{background:var(--surface);padding:14px 16px}
  .stat .k{font-size:11px;color:var(--text2);font-weight:600}
  .stat .v{font-size:22px;font-weight:800;color:var(--accent);font-family:var(--mono);margin-top:2px}
  .stat .v small{font-size:12px;color:var(--text2);font-weight:600}
  .note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.7}
  .navlink{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;color:var(--text2);text-decoration:none;border:1px solid transparent}
  .navlink:hover{background:rgba(0,0,0,.04)}
  .navlink.cur{background:var(--accentSoft,#e6eeda);color:var(--accent,#647548);border-color:var(--accent,#647548)}
</style>
<link rel="stylesheet" href="../assets/saizen-ops.css?v=22.8">
</head>
<body data-so-area="step1">
<div class="wrap">
  <header>
    <div class="brand so-bar" style="width:100%">
      <a class="so-logo" href="../index.html" title="홈 / ホーム">
        <img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen">
      </a>
      <a class="navhome" href="../index.html" data-i18n="navHome"></a>
      <span class="step" data-i18n="s1_step"></span>
      <span class="sub" data-i18n="s1_sub"></span>
      <span class="so-spacer"></span>
      <div class="so-controls">
        <div class="so-lang">
          <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
          <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
          <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>
        </div>
        <button class="so-furi" id="so-furi" onclick="__so_toggleFuri()"></button>
      </div>
    </div>
    <p class="lead" data-i18n="s1_lead"></p>
  </header>

  <!-- ── Supabase 연결 ── -->
  <div class="conn">
    <h2 data-i18n="s1_h2conn"></h2>
    <div class="row">
      <label for="sb-url" data-i18n="s1_lblUrl"></label>
      <input id="sb-url" type="text" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off">
      <label for="sb-key" data-i18n="s1_lblKey"></label>
      <input id="sb-key" type="password" placeholder="eyJhbGciOi..." autocomplete="off">
      <div class="hint" data-i18n="s1_connHint"></div>
    </div>
    <div class="conn-bar">
      <button class="btn ghost" id="btn-connect" type="button" data-i18n="btnConnect"></button>
      <span class="pill" id="conn-state" data-i18n="connState_none"></span>
    </div>
  </div>

  <!-- ── 라이브러리 로드 실패 경고(사내망 차단 등) ── -->
  <div id="lib-warn" style="display:none;margin:0 0 6px;padding:12px 16px;border:1px solid var(--err);border-left:4px solid var(--err);border-radius:10px;background:#fdecec;color:var(--err);font-size:13px;font-weight:700;line-height:1.6"></div>

  <!-- ── 등록 상태 안내 ── -->
  <div id="reg-status" style="display:none;margin:0 0 6px;padding:12px 16px;border:1px solid #1fb257;border-left:4px solid #1fb257;border-radius:10px;background:#e3f8ec;color:var(--text);font-size:13px;font-weight:600"></div>

  <!-- ── 업로드 파일 ── -->
  <div class="grid" id="drop-grid"></div>

  <!-- ── 실행 ── -->
  <div class="actions">
    <span class="session" id="session-label"></span>
    <span id="run-why" style="display:none;margin-left:auto;font-size:12px;font-weight:700;color:var(--err);line-height:1.5;text-align:right"></span>
    <button class="btn" id="btn-run" type="button" data-i18n="s1_btnRun" style="margin-left:auto;font-size:14.5px;padding:12px 30px;box-shadow:0 2px 8px rgba(61,84,36,.25)"></button>
  </div>

  <!-- ── 결과 통계 ── -->
  <div class="panel" id="stats-panel" style="display:none">
    <h2 data-i18n="s1_h2stats"></h2>
    <div class="stats" id="stats"></div>
    <p class="note" style="padding:0 18px 14px" data-i18n="s1_statsNote"></p>
  </div>

  <!-- ── 변경이력 ── -->
  <div class="panel" id="history-panel" style="display:none">
    <h2 data-i18n="s1_h2history"></h2>
    <p style="padding:8px 18px 0;color:var(--muted);font-size:11px" data-i18n="s1_historyNote"></p>
    <div class="log" id="history"></div>
  </div>

  <!-- ── 월 데이터 삭제 ── -->
  <div class="panel" id="month-del-panel" style="display:none">
    <h2 id="t-mdH"></h2>
    <div style="padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span id="t-mdLbl" style="font-size:12px;color:var(--text2);font-weight:600"></span>
      <select id="month-del-sel" style="padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:13px;font-family:var(--mono);min-width:120px"></select>
      <button class="btn ghost" id="btn-month-del" type="button" disabled style="border-color:var(--err);color:var(--err)"></button>
      <button class="btn ghost" id="btn-month-refresh" type="button" style="font-size:12px;padding:8px 12px"></button>
      <span id="t-mdNote" style="flex-basis:100%;font-size:11px;color:var(--muted)"></span>
    </div>
  </div>

  <!-- ── 로그 ── -->
  <div class="panel">
    <h2 data-i18n="s1_h2log"></h2>
    <div class="log" id="log"><span class="l-dim" data-i18n="s1_logWait"></span></div>
  </div>
</div>

<!-- ── 명단 중복 → 등록 중단 라이트박스: 엠클릭에서 무엇을 고쳐야 하는지 알려 준다 ── -->
<div id="dup-modal" style="display:none;position:fixed;inset:0;z-index:215;background:rgba(31,42,24,.45);align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--surface);border:1px solid var(--err);border-radius:16px;max-width:640px;width:100%;padding:26px;box-shadow:0 16px 48px rgba(15,23,42,.22)">
    <h3 id="dup-title" style="font-size:18px;font-weight:800;color:var(--err);margin-bottom:8px"></h3>
    <p id="dup-lead" style="font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:12px"></p>
    <div id="dup-list" style="background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.7;max-height:220px;overflow:auto;margin-bottom:12px"></div>
    <p id="dup-how" style="font-size:12.5px;color:var(--text);line-height:1.65;margin-bottom:16px"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn ghost" id="dup-copy" type="button"></button>
      <button class="btn" id="dup-close" type="button"></button>
    </div>
  </div>
</div>

<!-- ── 등록 실패 라이트박스 — 실패를 로그 한 줄로만 두면 「눌러도 안 된다」로 보인다 ── -->
<div id="fail-modal" style="display:none;position:fixed;inset:0;z-index:210;background:rgba(31,42,24,.45);align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--surface);border:1px solid var(--err);border-radius:16px;max-width:520px;width:100%;padding:26px;box-shadow:0 16px 48px rgba(15,23,42,.22)">
    <h3 id="fail-title" style="font-size:18px;font-weight:800;color:var(--err);margin-bottom:8px"></h3>
    <p id="fail-step" style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:10px"></p>
    <pre id="fail-msg" style="background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:auto;margin-bottom:14px"></pre>
    <p id="fail-hint" style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:16px"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn ghost" id="fail-copy" type="button"></button>
      <button class="btn" id="fail-close" type="button"></button>
    </div>
  </div>
</div>

<!-- ── 등록 완료 라이트박스 ── -->
<div id="done-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(31,42,24,.45);align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:420px;width:100%;padding:30px 26px;box-shadow:0 16px 48px rgba(15,23,42,.22);text-align:center">
    <div style="width:54px;height:54px;margin:0 auto 12px;border-radius:50%;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800">✓</div>
    <h3 style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px" data-i18n="s1_doneTitle"></h3>
    <p id="done-summary" style="font-size:13px;color:var(--text2);margin-bottom:14px"></p>
    <div style="background:#fbeee9;border:1px solid #e3bdb4;border-radius:10px;padding:12px 14px;margin-bottom:20px;text-align:left">
      <div id="t-delHead" style="font-size:13px;font-weight:800;color:#b13b2c;margin-bottom:4px"></div>
      <div id="t-delBody" style="font-size:12px;color:#8a2a1c;line-height:1.55"></div>
    </div>
    <div id="done-countdown" style="font-size:12.5px;color:var(--accent2,#9a7322);font-weight:700;margin-bottom:12px;min-height:16px"></div>
    <div id="t-roomNote" style="font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.55"></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn" id="done-room" href="room.html" style="text-decoration:none"></a>
      <a class="btn ghost" href="../index.html" data-i18n="s1_btnHome" style="text-decoration:none"></a>
      <button class="btn ghost" id="done-stay" type="button" data-i18n="s1_btnStay"></button>
    </div>
  </div>
</div>

<!-- ── 등록 진행중(화면 유지 안내) 라이트박스 ── -->
<div id="running-modal" style="display:none;position:fixed;inset:0;z-index:250;background:rgba(31,42,24,.55);align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:400px;width:100%;padding:32px 26px;box-shadow:0 16px 48px rgba(15,23,42,.28);text-align:center">
    <div class="run-spin" style="width:46px;height:46px;margin:0 auto 16px;border:5px solid var(--accentSoft,#e6ecd9);border-top-color:var(--accent);border-radius:50%;animation:runspin .9s linear infinite"></div>
    <h3 id="run-title" style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:8px"></h3>
    <p id="run-body" style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px"></p>
    <div id="run-step" style="font-size:12.5px;color:var(--accent2,#9a7322);font-weight:700;min-height:18px;word-break:break-all"></div>
  </div>
</div>
<style>@keyframes runspin{to{transform:rotate(360deg)}}</style>

<script src="../assets/saizen-core.js?v=37"></script>
<script src="../assets/saizen-ops.js?v=22.8"></script>
<script>
// ════════════════════════════════════════════════════════════════════════
//  SaiZen Hub — STEP 1 적재 모듈
//  · 읽기: SheetJS(xlsx)   · 쓰기: supabase-js upsert
//  · 숙소 prefix(v13.4 동일): 야마나미리조트=Y · 쿠주힐즈=K · 간지호텔=G · 시즈노야도료칸=S
// ════════════════════════════════════════════════════════════════════════

const $ = s => document.querySelector(s);
const logEl = $('#log');
let supa = null;

// ── 로컬 i18n (saizen-ops.js t()의 s1_* 키로 덮지 못한 잔여 하드코딩 문자열. 한·일 직원 공용, ja 기본) ──
//   ※ DB 저장값(예: status·check_status)·엑셀 컬럼명은 번역하지 않는다. 화면 표시만.
const L = {
  ja:{
    doneRoomBtn:'客室割当へ →', doneRoomNote:'登録した月の<b>客室割当</b>を開くと、その内容に合わせて<b>自動割当</b>が走ります。手動で割り当てた部屋は固定され、上書きされません。',
    mdH:'月データ削除', mdHsub:'アップロードと無関係に特定の月を全体整理',
    mdLbl:'削除する月', mdDelBtn:'🗑 この月のデータ削除', mdRefreshTitle:'月リスト更新',
    mdNote:'選択した月のチーム・名簿・客室割当・現地記録をすべて削除(cascade)します。他の月には影響しません。元に戻せません。',
    mdNoMonths:'(登録された月なし)', btnRunning:'⏳ データ登録中…',
    dupTitle:'⛔ 登録を中止しました — エムクリックの修正が必要です',
    dupLead:n=>`同行者リストに同じ人が2回入っているチームが ${n}件 あります。このまま登録すると人数が実際と違ってしまい、客室割当·食数·ネームタグがずれます。DBには何も書き込んでいません。`,
    dupRow:(no,rep,pax,nm,bt,cnt,nos)=>`${no} ${rep}(予約${pax}名) — 「${nm}」(生年${bt}) が ${cnt}回 · 同行者リスト No ${nos}`,
    dupHow:'エムクリック「同行者別予約」で上の行を直してから、もう一度ダウンロードして登録してください — <b>実際の同行者名に変える</b>か、まだ未定なら<b>氏名を空欄</b>(無記名)にします。',

function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function plain(v){ v=String(v==null?'':v); return window.__so_plain?__so_plain(v):v; }

function renderDrops(){
  const grid = $('#drop-grid'); grid.innerHTML='';
  SLOTS.forEach(slot=>{
    const card = document.createElement('label');
    card.className = 'drop' + (slot.data?' done':'');
    card.innerHTML = `
      <span class="dot"></span>
      ${slot.file ? `<button type="button" class="drop-x" data-clear="${slot.id}" title="${tx('clearFileTitle')}">✕</button>` : ''}
      <div class="tag">${slotText(slot,'tag')}</div>
      <div class="name">${slotText(slot,'name')}</div>
      <div class="desc">${slotText(slot,'desc')}</div>
      <div class="file">${slot.file ? `<b>✓</b> ${slot.file} · ${slot.data.length.toLocaleString()}${t('s1_dyn_rows')}` : t('s1_dropEmpty')}</div>
      <input type="file" accept=".xlsx,.xls" multiple data-slot="${slot.id}">`;
    const inp = card.querySelector('input');
    inp.addEventListener('change', e=>handleFile(slot.id, e.target.files));
    const xb = card.querySelector('[data-clear]');
    if(xb) xb.addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      if(!confirm(tx('clearFileConfirm'))) return;
      clearSlot(slot.id);
    });
    card.addEventListener('dragover', e=>{e.preventDefault();card.classList.add('over');});
    card.addEventListener('dragleave', ()=>card.classList.remove('over'));
    card.addEventListener('drop', e=>{
      e.preventDefault();card.classList.remove('over');
      if(e.dataTransfer.files.length) handleFile(slot.id, e.dataTransfer.files);
    });
    grid.appendChild(card);
  });
  refreshRunBtn();
}

// ── 파일 읽기(SheetJS) ──
function handleFile(slotId, fileList){
  const files = (fileList && fileList.length!==undefined) ? Array.from(fileList) : (fileList ? [fileList] : []);
  if(!files.length) return;
  const slot = SLOTS.find(s=>s.id===slotId);
  let pending = files.length, merged = [];
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
        merged = merged.concat(rows);
      }catch(err){
        log(`✗ ${slotText(slot,'name')} ${t('s1_dyn_readFail')}: ${err.message}`, 'err');
      }
      if(--pending<=0){
        slot.data = merged;
        slot.file = files.length>1 ? `${files.length}${t('s1_dyn_filesMerged')}` : files[0].name;
        log(`${slotText(slot,'name')} ${t('s1_dyn_load')}: ${slot.data.length.toLocaleString()}${t('s1_dyn_rows')}${files.length>1?' ('+files.length+t('s1_dyn_filesMerged')+')':''}`, 'ok');
        renderDrops();
        detectSession();
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

// ── 세션(YYYY-MM) 자동 감지: 예약리스트 출발월 (여러 달이면 모두 표시) ──
function detectSession(){
  const res = SLOTS.find(s=>s.id==='res').data;
  if(!res) return;
  const months = [...new Set(res.map(r=>(fmtDate(r['출발일자'])||'').slice(0,7)).filter(Boolean))].sort();
  if(months.length){
    window._sessionYM = months[0];   // 폴백용 최솟값
    $('#session-label').innerHTML = `${tx('sessionWord')} <b>${months.join(', ')}</b>`;
  }
}

// ── 날짜 포맷 → YYYY-MM-DD ── (공유 모듈 saizen-core.js 위임: Date·엑셀직렬·한국어·MDY)
function fmtDate(v){ return SZCore.parseFlexDate(v); }
// ── 생년월일 → YYMMDD 6자리 (member_key 조합용) ──
function birthYYMMDD(v){
  const d = fmtDate(v);
  if(!d) return '';
  return d.slice(2,4)+d.slice(5,7)+d.slice(8,10);
}
function birthISO(v){ return fmtDate(v) || null; }

// ── 비고 → 팀명 파싱 (팀:xxx 또는 팀(...)) ──
function parseTeam(remark){
  if(!remark) return null;
  const s = String(remark);
  let m = s.match(/팀\s*[:\(]\s*([^\)\/]+)/);
  return m ? m[1].trim() : null;
}

// ── 숙소 prefix (v13.4 동일) ──
function accomPrefix(accom){
  if(accom==='야마나미리조트') return 'Y';
  if(accom==='쿠주힐즈')      return 'K';
  if(accom==='간지호텔')      return 'G';
  if(accom==='시즈노야도 료칸') return 'S';
  return 'X';
}

// 사내망에서는 요청 하나가 조용히 끊기기도 한다. 그 한 번 때문에 몇 분짜리 등록이 통째로
//  끝나 버리면 「눌러도 안 된다」로 보인다 → **다시 시도**하고, 그래도 안 되면 어디서 멈췄는지 남긴다.
async function sbTry(label, fn, tries){
  const n = tries || 3; let last = null;
  for(let i=1;i<=n;i++){
    runProgress(i===1 ? label : `${label} · ${tx('retryN')(i,n)}`);
    try{
      const r = await fn();
      if(r && r.error) throw r.error;
      return r;
    }catch(e){
      last = e;
      if(i<n) await new Promise(res=>setTimeout(res, i*1200));
    }
  }
  throw last;
}
async function upsertChunked(table, rows, conflict){
  if(!rows.length){ return 0; }
  const SIZE = 500; let done = 0;
  for(let i=0;i<rows.length;i+=SIZE){
    const chunk = rows.slice(i,i+SIZE);
    const label = `${table} ${Math.min(i+SIZE,rows.length)}/${rows.length}`;
    try{
      await sbTry(label, ()=>supa.from(table).upsert(chunk, conflict?{onConflict:conflict}:undefined));
    }catch(e){ throw new Error(`${table}: ${(e&&e.message)||e}`); }
    done += chunk.length;
  }
  return done;
}

    log('✗ '+tx('whyHead')+' '+miss.join(' · '),'err');

  const _rb=$('#btn-run');

  clearLog();
  const ym = window._sessionYM || null;
  const res = SLOTS.find(s=>s.id==='res').data;
  const ilh = SLOTS.find(s=>s.id==='ilhaeng').data;
  const stat = {};

  try{
    log(`▶ ${t('s1_dyn_runStart')} ${ym||t('s1_dyn_noDetect')}`,'dim');

    // ── 0) 그룹코드 참조 맵 (member_key → code) — 관리·마스터(그룹코드)의 member_codes에서 RPC로 채움(아래) ──
    const codeMap = {};

    // ── 1) bookings (예약리스트 = 마스터) ──
    //   운영 대상만 추림: pax>0, 현지예약·항공조인·구마모토시내 제외, 숙소 4종 해당
    const procMap = {};   // event_seq → {accom, accomPfx, pax, repName}
    const bookingRows = [];
    const ymBySeq = {};   // event_seq → 'YYYY-MM' (팀별 출발월 — 여러 달 동시 업로드 대응)
    let badDate=0;        // 출발일자 파싱 실패 팀 수(세션월 폴백으로 오분류 위험)
    res.forEach(r=>{
      const status = String(r['구분']||'').trim();
      if(!['견적','대기','확정','정산'].includes(status)) return;
      const seq = parseInt(String(r['eventSeq']||'').trim(),10);
      if(!seq) return;
      const pax = Number(r['예약']||0);     // v13.4: 예약 컬럼 단독
      const pname = String(r['상품명']||'');
      const accom = detectAccom(pname);
      // ⚠ 사이젠 아소 야마나미 권역 숙소(야마나미·쿠주·간지·시즈)가 인식되지 않는 예약은 운영 원장에서 제외.
      //   detectAccom '' = 타 리조트(스가다이라·14hills·벳푸·시로사토·미야자키 등)·항공조인·구마모토 시내·송영형 현지예약.
      //   이전엔 이 필터가 '현지예약-무accom'만 막아 타 리조트가 bookings에 적재됐음(guests엔 없지만 手配書 오염).
      //   이제 guests(procMap)뿐 아니라 bookings도 accom 없으면 적재 안 함(v13.4 '미해당 제외' 규칙을 bookings에도 적용).
      if(!accom) return;
      // ⚠ 헤더 표기 흔들림 대비(공백 유무·표현 차이) — 한 칸이라도 놓치면 카트·수배서에서 통째로 빠진다
      const pick = (...ks)=>{ for(const k of ks){ const v=r[k]; if(v!=null && String(v).trim()) return String(v).trim(); } return ''; };
      const remark = pick('비고','비 고','비고사항');
      const _depYm = (birthISO(r['출발일자'])||'').slice(0,7);
      if(!_depYm) badDate++;                                          // 출발일자 인식 실패
      const rowYm = _depYm || ym;   // 팀별 출발월(인식 실패 시 세션월로 추정 — 경고 표시)
      bookingRows.push({
        event_seq:seq,
        event_no:String(r['행사번호']||'').trim()||null,
        status,
        rep_name:String(r['대표고객']||'').trim()||null,
        member_type:String(r['회원권구분']||'').trim()||null,
        dep_date:birthISO(r['출발일자']),
        arr_date:birthISO(r['도착일자']),
        reserved_at:birthISO(r['예약일자']||r['예약일']),   // 예약 접수일(우선예약 기간 통계용). 없으면 null.
        nights_label:String(r['기간']||'').trim()||null,
        origin:String(r['출발지']||'').trim()||null,
        airline:String(r['항공']||'').trim()||null,
        product_name:pname||null,
        pax,
        sales_amount:Number(r['판매금액']||0),
        unpaid_amount:Number(r['미수금액']||0),
        remark:remark||null,
        remark_local:pick('현지 비고','현지비고','현지전달비고','현지 전달비고')||null,
        remark_etc:pick('기타 비고','기타비고')||null,
        team_label:parseTeam(remark),
        session_ym:rowYm
      });
      ymBySeq[seq]=rowYm;
      if(pax>0 && accom){
        procMap[seq] = {accom, accomPfx:accomPrefix(accom), pax, repName:String(r['대표고객']||'').trim(), dep:birthISO(r['출발일자']), arr:birthISO(r['도착일자'])};
      }
    });

    // ── 파일에 「취소」로 찍힌 event_seq 수집(팀 전체 취소 자동 삭제용) — 파일에 명시된 팀만 건드리므로 안전 ──
    const cancelSeqs = new Set();
    res.forEach(r=>{
      const seq = parseInt(String(r['eventSeq']||'').trim(),10); if(!seq) return;
      const cc = String(r['cancCd']||'').trim(), cf = String(r['cancFl']||'').trim();
      const st = String(r['구분']||'').trim();
      if((cc && cc!=='0') || (cf && cf!=='0' && cf.toUpperCase()!=='N') || st==='취소') cancelSeqs.add(seq);
    });

    if(badDate) log(tx('badDate')(badDate)+' '+tx('badDateSess')(ym),'warn');
    // 이 업로드에 포함된 월(여러 달일 수 있음) — 동기화·스냅샷·이력 범위
    const fileMonths = [...new Set(Object.values(ymBySeq))].filter(Boolean).sort();
    if(fileMonths.length){ $('#session-label').innerHTML = tx('sessionWord')+' <b>'+fileMonths.join(', ')+'</b>'; }
    // ⚠ 부분 기간 파일 경고(Min 2026-08) — 엠클릭에서 8/14~ 처럼 잘라 받으면 그 앞 날짜 팀은
    //   **파일에 없어 갱신되지 않는다**(삭제되지도 않는다). 비고가 뒤늦게 바뀐 팀이 반영 안 돼
    //   카트·수배서에서 누락처럼 보인다. 파일이 달 전체를 덮지 않으면 알려 준다.
    try{
      const deps=[]; res.forEach(r=>{ const d=birthISO(r['출발일자']); if(d) deps.push(String(d).slice(0,10)); });
      if(deps.length){
        deps.sort();
        const first=deps[0], last=deps[deps.length-1];
        const ymFirst=first.slice(0,7), ymLast=last.slice(0,7);
        const lastDay=(ym)=>{ const [y,m]=ym.split('-').map(Number); return `${ym}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`; };
        const partial = (first!==ymFirst+'-01') || (last!==lastDay(ymLast));
        if(partial) log(tx('partialRange')(first,last), 'warn');
      }
    }catch(e){}

    // ── 사전 점검: 한 팀 명단에 같은 사람이 두 번 ──────────────────────────
    //  Min 결정(2026-08): 이런 파일은 **그대로 등록하면 안 된다**. 인원이 실제와 달라져
    //  방배정·식수·네임택이 어긋나고, 나중에 누가 잘못 넣었는지도 찾기 어렵다.
    //  → DB에 한 글자도 쓰기 전에 멈추고, 엠클릭에서 무엇을 고쳐야 하는지 알려 준다.
    //  (생년이 없는 줄은 자리번호로 구분되므로 애초에 겹치지 않는다 — 무기명 여러 명은 정상)
    {
      const seqSet = new Set(bookingRows.map(b=>b.event_seq));
      const noBySeq = {}, repBySeq = {}, paxBySeq = {};
      bookingRows.forEach(b=>{ noBySeq[b.event_seq]=b.event_no||b.event_seq;
        repBySeq[b.event_seq]=b.rep_name||''; paxBySeq[b.event_seq]=b.pax||0; });
      const seen = {};                    // seq|key → [원본 No…]
      ilh.forEach(r=>{
        const seq = parseInt(String(r['eventSeq']||'').trim(),10);
        if(!seq || !seqSet.has(seq)) return;
        const nm = String(r['고객명']||'').trim() || '무기명';
        const bt = birthYYMMDD(r['생년월일']) || '';
        if(!bt) return;                   // 생년 없음 = 자리번호로 구분 → 충돌 없음
        const k = seq+'|'+nm+'|'+bt;
        (seen[k]=seen[k]||{seq,nm,bt,nos:[]}).nos.push(String(r['No']||'').trim()||'?');
      });
      const dups = Object.values(seen).filter(x=>x.nos.length>1)
        .map(x=>({ ...x, no:noBySeq[x.seq], rep:repBySeq[x.seq], pax:paxBySeq[x.seq] }))
        .sort((a,b)=>String(a.no).localeCompare(String(b.no)));
      if(dups.length){
        dups.forEach(d=>log(tx('dupRow')(d.no, d.rep, d.pax, d.nm, d.bt, d.nos.length, d.nos.join(', ')),'err'));
        log(tx('dupStopped')(dups.length),'err');
        showDupModal(dups);
        return;                           // ⛔ 아무것도 쓰지 않고 종료(finally 에서 정리)
      }
    }

    // ── 수정이력용: 업로드 전 그 달 기존 상태 스냅샷 (upsert 전에 떠야 추가/삭제 구분 가능) ──
    const _oldBk = {};   // event_seq -> rep_name
    const _oldNo = {};   // event_seq -> event_no(행사번호 — 표시용)
    const _oldPx = {};   // event_seq -> { 이름+생년6: {name, grade} }
    try {
      let pg=0;
      while(true){ const {data,error}=await supa.from('bookings').select('event_seq,rep_name,event_no').in('session_ym',fileMonths).range(pg,pg+999);
        if(error||!data||!data.length) break; data.forEach(b=>{_oldBk[b.event_seq]=b.rep_name||''; _oldNo[b.event_seq]=b.event_no||'';}); if(data.length<1000) break; pg+=1000; }
      pg=0;
      while(true){ const {data,error}=await supa.from('passengers').select('event_seq,name_kr,birth_yymmdd,member_grade,bookings!inner(session_ym)').in('bookings.session_ym',fileMonths).range(pg,pg+999);
        if(error||!data||!data.length) break; data.forEach(p=>{const k=(p.name_kr||'')+(p.birth_yymmdd||''); (_oldPx[p.event_seq]=_oldPx[p.event_seq]||{})[k]={name:p.name_kr,grade:p.member_grade,birth:p.birth_yymmdd||''};}); if(data.length<1000) break; pg+=1000; }
    } catch(e){ log(tx('snapFail')+e.message,'dim'); }

    stat['bookings'] = await upsertChunked('bookings', bookingRows, 'event_seq');
    log(`✓ ${t('s1_dyn_log_booking')} ${stat['bookings']}${t('s1_dyn_cases')} (${t('s1_dyn_cntTarget')} ${Object.keys(procMap).length}${t('s1_dyn_teams')})`,'ok');

    // 적재된 event_seq 집합(자식 FK 보호용)
    const validSeq = new Set(bookingRows.map(b=>b.event_seq));

    // ── 2) passengers (일행별예약) ──
    // 영문명·항공편 등 모두 일행별예약에 포함 (현지도착 파일 폐지, v14.2)
    const paxRows = [];
    ilh.forEach(r=>{
      const id = parseInt(String(r['pkgPsgrSeq']||'').trim(),10);
      const seq = parseInt(String(r['eventSeq']||'').trim(),10);
      if(!id || !seq || !validSeq.has(seq)) return;  // FK 보호: 적재된 booking만
      const nameKr = String(r['고객명']||'').trim();
      const enFull = [String(r['영문성']||'').trim(), String(r['영문이름']||'').trim()].filter(Boolean).join(' ');
      paxRows.push({
        id, event_seq:seq,
        seq_in_team:Number(r['No']||0)||null,
        name_kr:nameKr||null,
        name_en:enFull || null,
        gender:String(r['성별']||'').trim()||null,
        birth:birthISO(r['생년월일']),
        birth_yymmdd:birthYYMMDD(r['생년월일'])||null,
        passport_no:String(r['여권번호']||'').trim()||null,
        passport_exp:birthISO(r['만료일']),
        phone:String(r['휴대번호']||'').trim()||null,
        dep_flight:String(r['출발편']||'').trim()||null,
        ret_flight:String(r['귀국편']||'').trim()||null,
        origin:String(r['출발지']||'').trim()||null,
        airline:String(r['항공사']||'').trim()||null,
        pnr:String(r['PNR']||'').trim()||null,
        dest:String(r['도착지']||'').trim()||null,
        dep_time:String(r['한국출발']||'').trim()||null,
        loc_arr_time:String(r['현지도착']||'').trim()||null,
        ret_dep_time:String(r['현지출발']||'').trim()||null,
        kor_arr_time:String(r['한국도착']||'').trim()||null,
        pre_seat:String(r['사전좌석']||'').trim()||null,
        air_included:String(r['항공포함']||'').trim()||null,
        member_no:null,
        // 개인 단위 회원/일반 판정 = 고객등급(T): '회원권'/'일반고객'. room 자동배정 소스. (유지)
        member_grade:String(r['고객등급']||r['회원권구분']||'').trim()||null,
        // 2026-06 신규 컬럼: 회원권구분(V)=실제 등급(EWRCⅡ·다이아몬드…) · 회원구분(U)=정회원 등
        member_class:String(r['회원권구분']||'').trim()||null,
        member_div:String(r['회원구분']||'').trim()||null
      });
    });
    stat['passengers'] = await upsertChunked('passengers', paxRows, 'id');

    // ── 원본 명단(passengers) 유령행 정리 ──────────────────────────────────
    //   엠클릭이 같은 사람에게 **No(pkgPsgrSeq)를 다시 부여**해 내려주는 일이 있다.
    //   passengers 는 id upsert 라 옛 행이 그대로 남아 명단 수가 부풀었다(#30012382: 4명인데 8행).
    //   → 이번 파일에 명단이 실린 팀에 한해, 파일에 없는 행을 지운다.
    //   ⚠ 명단이 0건인 팀은 손대지 않는다(파일 누락 ≠ 취소). FK 는 SET NULL 이라 안전.
    runProgress(tx('stpPxClean'));
    try{
      const fileIds={};   // event_seq → Set(id)
      paxRows.forEach(p=>{ (fileIds[p.event_seq]=fileIds[p.event_seq]||new Set()).add(p.id); });
      const pxSeqs=Object.keys(fileIds).map(Number);
      const stale=[];
      for(let i=0;i<pxSeqs.length;i+=120){ const chunk=pxSeqs.slice(i,i+120);
        let pg=0;
        while(true){ const {data,error}=await supa.from('passengers').select('id,event_seq').in('event_seq',chunk).range(pg,pg+999);
          if(error||!data||!data.length) break;
          data.forEach(r=>{ const set=fileIds[r.event_seq]; if(set && !set.has(r.id)) stale.push(r.id); });
          if(data.length<1000) break; pg+=1000; }
      }
      let pxDel=0;
      for(let i=0;i<stale.length;i+=200){ const {data,error}=await supa.from('passengers').delete().in('id',stale.slice(i,i+200)).select('id'); if(!error&&data) pxDel+=data.length; }
      if(pxDel) log(`✓ ${tx('paxCleaned')(pxDel)}`,'dim');
    }catch(_){ /* 정리 실패는 임포트를 막지 않음 */ }
    log(`✓ ${t('s1_dyn_log_pax')} ${stat['passengers']}${t('s1_dyn_cases')}`,'ok');

    runProgress(tx('stpGuests'));
    // ── 3) guests (팀 운영 원장) — procMap 기준 ──
    // 팀별 대표자 member_key로 그룹코드 매칭(회원). 미매칭 팀은 비회원 F풀 코드를 자동 배정.
    const guestRows = [];
    // 대표자 생년월일은 passengers(일행별)에서 (event_seq, name_kr=repName)로 조회
    const birthByKey = {};
    paxRows.forEach(p=>{ if(p.name_kr) birthByKey[p.event_seq+'|'+p.name_kr] = p.birth_yymmdd; });

    // ── 비회원 F풀 태그코드 (회원 미매칭 팀 자동 배정) ──
    // 18 prefix × 33 가나 = 594개/연도. eventSeq별 영속 · 연도 범위는 session_ym로 충돌 회피.
    //  코드표(18×33=594)·순회 순서는 SZCore 단일 진실원.
    const NM_PREFIX = SZCore.NM_PREFIX, NM_KANA = SZCore.NM_KANA, NM_POOL = SZCore.NM_POOL;
    // ── F풀 재활용(Phase 2): 코드 예약을 '겹치는 팀'끼리로 한정 → 충분히 지난(30일+) 팀의 F코드는 자동 재사용.
    //   ⚠ 겹침 판정 = 30일 쿨다운(Min 2026-07): 두 팀 체류가 30일 이내면 '겹침'으로 봐 다른 코드 부여.
    //     이유=① 턴오버 당일(퇴실=입실) 동시 존재 ② 한 달 안에 같은 코드가 다른 팀에 재등장 → 네임택·식사·기억 혼동.
    //     30일 쿨다운 기준 최대 필요 코드 ≈139(594 풀 여유 충분). 30일+ 지난 팀은 재사용(사실상 소진 없음).
    // ── 닮은꼴 코드 자동 교정 시작일(Min 2026-08) ─────────────────────────────
    //  이 날짜 이후 출발 팀부터는 「같은 날 도착 팀끼리 알파벳·가나가 둘 다 달라야」 한다.
    //  그 전(8/15 이하)은 인쇄물이 이미 나갔으므로 손대지 않는다.
    //  ⚠ 전부 다시 매기는 게 아니라 **규칙을 어긴 코드만** 새로 받는다.
    //     → 규칙을 지키는 코드는 그대로 유지되고, 한 번 교정되면 다음 임포트부터는
    //       어길 게 없어 아무것도 바뀌지 않는다(멱등). 「한번 정한 코드는 안 바꾼다」 원칙 유지.
    const NM_RECODE_FROM = '2026-08-16';
    let recodeFreed = 0;
    const nmAssigned = {};        // event_seq → code (영속: 같은 행사는 같은 코드 유지)
    const fRanges = {};           // code → [{dep,arr}] (그 코드를 쓰는 팀들의 체류구간)
    const impYears = [...new Set([...(fileMonths||[]), ym].filter(Boolean).map(m=>String(m).slice(0,4)))];
    const exAll = [];
    try {
      for(const yr of (impYears.length?impYears:[String(ym||'').slice(0,4)])){
        // ⚠ 페이지네이션 필수 — Supabase 기본 1000행에서 잘리면 그 뒤 F코드가 안 보여
        //   이미 쓰는 코드를 다시 배정한다(같은 코드 두 팀). 연 F팀이 1000을 넘는다.
        let pg=0;
        for(;;){
          runProgress(tx('stpFpool')(yr, exAll.length));
          const { data: ex, error } = await supa.from('guests')
            .select('event_seq, group_code, bookings!inner(dep_date,arr_date)')
            .like('session_ym', yr+'-%')
            .like('group_code', 'F%')
            .order('event_seq').range(pg, pg+999);
          if(error) throw error;
          (ex||[]).forEach(g=>{ const c=g.group_code; if(!c) return; const b=g.bookings||{};
            exAll.push({ seq:g.event_seq, code:c,
              dep:String(b.dep_date||'').slice(0,10), arr:String(b.arr_date||'').slice(0,10) }); });
          if(!ex || ex.length<1000) break;
          pg+=1000;
        }
      }
    } catch(e){}
    // 같은 날 도착 팀끼리 한 글자라도 겹치는 코드를 찾아 '나중 것'만 해제 → 아래에서 새 코드를 받는다.
    //  손댈 수 있는 대상 = 교정 시작일 이후 출발 + 이번 파일에 들어있는 팀뿐.
    //  (그 외 팀은 고정이므로 먼저 자리를 잡아두고, 손댈 수 있는 팀을 예약순으로 검사)
    const freed = new Set();
    {
      const byDay = {};
      exAll.forEach(g=>{ if(g.dep) (byDay[g.dep] = byDay[g.dep] || []).push(g); });
      const movable = g => g.dep >= NM_RECODE_FROM && procMap[g.seq];
      Object.keys(byDay).forEach(d=>{
        const list = byDay[d], P = new Set(), K = new Set();
        list.filter(g=>!movable(g)).forEach(g=>{ P.add(g.code.slice(0,2)); K.add(g.code.slice(2)); });
        list.filter(movable).sort((a,b)=>a.seq-b.seq).forEach(g=>{
          const p = g.code.slice(0,2), k = g.code.slice(2);
          if(P.has(p) || K.has(k)){ freed.add(g.seq); recodeFreed++; }
          else { P.add(p); K.add(k); }
        });
      });
    }
    exAll.forEach(g=>{
      if(freed.has(g.seq)) return;                       // 해제된 팀은 아래에서 새 코드
      nmAssigned[g.seq] = g.code;
      (fRanges[g.code] = fRanges[g.code] || []).push({dep:g.dep, arr:g.arr});
    });
    // F코드 재사용 30일 쿨다운 판정 = SZCore 단일 소스 위임(턴오버·한달내 재등장 충돌 방지).
    const _fOv=(d1,a1,d2,a2)=>SZCore.nmCodeConflict(d1,a1,d2,a2,30);
    const idxToCode = idx => SZCore.nmIdxToCode(idx);
    // ── 닮은꼴 회피 배정(Min 2026-08) ─────────────────────────────────────────
    //  ⚠ 이전 방식(커서 +1)의 문제: idx%18 이 알파벳이라 연속 배정이 FAあ·FBあ·FFあ… 처럼
    //    가나 고정 + 알파벳만 줄줄이(또는 그 반대)로 나와 현장이 서로 헷갈려 했다.
    //  두 가지로 해결한다.
    //   ① 순회 순서 = SZCore.nmSpreadIdx — 한 칸 갈 때마다 알파벳·가나가 **둘 다** 바뀐다.
    //   ② 같은 시기(30일 창)에 현장에 있는 F코드들의 알파벳·가나 사용횟수를 세어
    //      **가장 덜 쓰인 조합**을 고른다(+ 직전 배정과 같은 글자는 강한 감점).
    //      동시 체류가 18팀을 넘으면 알파벳 중복은 수학적으로 불가피 → '몰리지 않게 고르게' 퍼뜨린다.
    let nmCursor = Object.keys(fRanges).length % NM_POOL;   // 재임포트 때도 이어서 전진(기존 팀 코드는 nmAssigned로 보존)
    let lastP='', lastK='';
    function assignNonMemberCode(seq, dep, arr){
      if(nmAssigned[seq]) return nmAssigned[seq];               // 영속
      // 이 팀과 같은 시기(30일 창)에 존재하는 코드 = 사용 불가 + 글자 사용횟수 집계
      //  + 같은 날 도착(dep 동일) 팀의 글자는 따로 모은다 — 룸키 통·명단에서 나란히 놓여
      //    한 글자만 다른 코드(FXめ/FYめ)가 제일 헷갈리는 지점이라 여기는 '금지'로 건다.
      const busy=new Set(), pUse={}, kUse={}, dayP=new Set(), dayK=new Set();
      Object.keys(fRanges).forEach(c=>{
        const rs=fRanges[c]||[];
        if(rs.some(r=>r.dep===dep)){ dayP.add(c.slice(0,2)); dayK.add(c.slice(2)); }   // 같은 날 도착
        if(!rs.some(r=>_fOv(dep,arr,r.dep,r.arr))) return;
        busy.add(c);
        const p=c.slice(0,2), k=c.slice(2);
        pUse[p]=(pUse[p]||0)+1; kUse[k]=(kUse[k]||0)+1;
      });
      // 1차 = 같은 날 도착 팀과 알파벳·가나가 '둘 다' 다른 코드만(하드 조건).
      //   같은 날 팀이 18개를 넘어가면 알파벳이 모자라 불가능 → 2차(점수)로 완화.
      let bestIdx=-1, bestCode=null, bestScore=Infinity;
      for(const strict of [true,false]){
        bestIdx=-1; bestCode=null; bestScore=Infinity;
        for(let step=0; step<NM_POOL; step++){
          const idx=SZCore.nmSpreadIdx(nmCursor+step), code=idxToCode(idx);
          if(busy.has(code)) continue;                                        // 30일 내 겹침=사용 불가
          const p=code.slice(0,2), k=code.slice(2);
          if(strict && (dayP.has(p)||dayK.has(k))) continue;                   // 같은 날 닮은꼴 금지
          let sc=(pUse[p]||0)+(kUse[k]||0);
          if(dayP.has(p)) sc+=6; if(dayK.has(k)) sc+=6;                        // 완화해도 같은 날은 최대한 회피
          if(p===lastP) sc+=3;                                                 // 직전 배정과 닮은꼴 회피
          if(k===lastK) sc+=3;
          if(sc<bestScore){ bestScore=sc; bestIdx=idx; bestCode=code; if(sc===0) break; }
        }
        if(bestCode) break;
      }
      if(!bestCode) return null;  // 594 전부 30일 내 겹침(사실상 불가) = 소진
      nmAssigned[seq]=bestCode; (fRanges[bestCode]=fRanges[bestCode]||[]).push({dep,arr});
      lastP=bestCode.slice(0,2); lastK=bestCode.slice(2);
      nmCursor=(nmCursor+1)%NM_POOL;
      return bestCode;
    }

    // ── 그룹코드 xlsx 미업로드 시: member_codes(Supabase)에서 매칭(RPC) — xlsx 없이도 동작 ──
    runProgress(tx('stpCodes'));
    if(Object.keys(codeMap).length===0 && supa){
      const repKeys=[...new Set(Object.keys(procMap).map(seqStr=>{
        const seq=parseInt(seqStr,10); const info=procMap[seq];
        const b=birthByKey[seq+'|'+info.repName]||''; return b?(info.repName+b):'';
      }).filter(Boolean))];
      if(repKeys.length){
        try{
          const {data:mc}=await supa.rpc('match_group_codes',{p_keys:repKeys});
          (mc||[]).forEach(r=>{ if(r.member_key && r.code) codeMap[r.member_key]=r.code; });
          log(tx('codeMatched')(Object.keys(codeMap).length),'dim');
        }catch(e){ log(tx('codeMatchFail')+e.message,'warn'); }
      }
    }

    if(recodeFreed) log(t('s1_recodeLog').replace('{d}',NM_RECODE_FROM).replace('{n}',String(recodeFreed)),'warn');
    let nmCnt = 0, memCnt = 0, nmFull = 0;
    // 출발일(dep) 순으로 배정 → F코드 커서가 시간순 전진(분산·재사용 순서 안정)
    Object.keys(procMap).sort((a,b)=>{ const da=String((procMap[a]||{}).dep||''), db=String((procMap[b]||{}).dep||''); return da<db?-1:da>db?1:(a-b); }).forEach(seqStr=>{
      const seq = parseInt(seqStr,10);
      const info = procMap[seq];
      const b = birthByKey[seq+'|'+info.repName] || '';
      const mkey = info.repName + b;
      const memberCode = (b && codeMap[mkey]) ? codeMap[mkey] : null;  // 회원 매칭
      let gcode = memberCode;
      if(memberCode){ memCnt++; }
      else { gcode = assignNonMemberCode(seq, info.dep, info.arr); if(gcode) nmCnt++; else nmFull++; }
      guestRows.push({
        event_seq:seq,
        team_tag: gcode ? `${gcode}-${info.accomPfx}` : null,
        group_code: gcode,
        accom:info.accom,
        accom_prefix:info.accomPfx,
        pax:info.pax,
        // ⚠ check_status 는 보내지 않는다. 컬럼 기본값이 '체크인전' 이라 새 팀은 알아서 그 값이 되고,
        //   기존 팀은 upsert 가 보낸 컬럼만 갱신하므로 **체크아웃 처리가 되돌아가지 않는다**.
        session_ym:ymBySeq[seq]||ym
      });
    });
    stat['guests'] = await upsertChunked('guests', guestRows, 'event_seq');
    log(`✓ ${t('s1_dyn_log_guests')} ${stat['guests']}${t('s1_dyn_teams')}`,'ok');
    log(tx('guestsSummary')(memCnt,nmCnt,nmFull),'dim');

    // ── 4) guest_members (개인) — 운영대상 팀의 passengers로 생성 ──
    const guestSeqSet = new Set(guestRows.map(g=>g.event_seq));
    const gmRows = [];
    // 팀별 그룹코드/숙소Pfx 룩업
    const gBySeq = {}; guestRows.forEach(g=>gBySeq[g.event_seq]=g);
    // 팀 내 순번 부여(seq_in_team 기준 정렬)
    const byTeam = {};
    paxRows.forEach(p=>{ if(guestSeqSet.has(p.event_seq)){ (byTeam[p.event_seq]=byTeam[p.event_seq]||[]).push(p); } });
    Object.keys(byTeam).forEach(seqStr=>{
      const seq = parseInt(seqStr,10);
      const g = gBySeq[seq];
      const list = byTeam[seq].sort((a,b)=>(a.seq_in_team||0)-(b.seq_in_team||0));
      list.forEach((p,idx)=>{
        const num = idx+1;
        // 신원키 = 이름|생년6 (회원 판정 member_key 와 같은 규칙). 생년이 없으면 구분할 방법이
        // 없으므로 이름|#자리번호 로 폴백한다. ⚠ 자리번호(seq_in_team)로 사람을 식별하면
        // 동명이인이 합쳐지고 명단 순서가 바뀔 때 방배정이 남에게 옮겨 붙는다(SQL 112).
        const _nm=(String(p.name_kr||'').trim())||'무기명';
        const _bt=String(p.birth_yymmdd||'').trim();
        const personKey = _bt ? (_nm+'|'+_bt) : (_nm+'|#'+num);
        const pfx = g.accom_prefix||'X';
        const personTag = g.group_code ? `${g.group_code}-${num}${pfx}` : null;  // 회원·비회원 모두 group_code 보유
        gmRows.push({
          event_seq:seq,
          person_key:personKey,
          passenger_id:p.id,
          person_tag:personTag,
          seq_in_team:num,
          name_kr:p.name_kr,
          name_en:p.name_en,
          is_rep:(num===1),
          member_grade:p.member_grade||null,   // 회원/일반 판정 (room.html 자동배정용)
          member_class:p.member_class||null,   // 회원권구분(V) 실제 등급
          member_div:p.member_div||null        // 회원구분(U)
        });
      });
    });
    // 같은 (event_seq, person_key) 가 두 번이면 Postgres 가 그 묶음을 통째로 거부한다.
    //   위 사전 점검에서 이미 걸러 여기까지 오지 않지만, 혹시 남으면 **조용히 넘기지 않고** 멈춘다.
    {
      const seen = new Set();
      for(const r of gmRows){
        const k = r.event_seq + '|' + r.person_key;
        if(seen.has(k)) throw new Error(tx('dupGuard')(r.name_kr||'', r.event_seq));
        seen.add(k);
      }
    }
    // 충돌키 = (event_seq, person_key) — 같은 사람이면 자리번호가 바뀌어도 **같은 행**을 갱신한다.
    //   → 방배정(rooms.member_id)·골프 조·개인 청구가 그 사람에게 그대로 붙어 있는다.
    runProgress(tx('stpGm'));
    stat['guest_members'] = await upsertChunked('guest_members', gmRows, 'event_seq,person_key');
    log(`✓ ${t('s1_dyn_log_members')} ${stat['guest_members']}${t('s1_dyn_cntPpl')}`,'ok');

    // ── 유령행 청소: 이번 파일 명단에 없는 사람 행을 지운다 ─────────────────
    //   키가 (event_seq, person_key) 로 바뀐 뒤로는 '자리 초과'가 아니라 **사람 기준**이다.
    //   · 취소된 사람 → 파일에 없으니 여기서 정리된다.
    //   · 같은 사람이 자리만 바뀐 경우 → upsert 가 같은 행을 갱신하므로 애초에 남지 않는다.
    //   ⚠ rooms.member_id FK 는 CASCADE 다. 지우기 전에, 같은 사람의 살아남은 행으로
    //     방배정을 옮긴다(SQL 112 로 `#dup` 로 밀어 둔 옛 중복행이 여기서 정리된다).
    try {
      const keysBySeq = {};
      gmRows.forEach(g=>{ (keysBySeq[g.event_seq]=keysBySeq[g.event_seq]||new Set()).add(g.person_key); });
      const teamSeqs = Object.keys(keysBySeq).map(Number);
      // ⚡ 팀마다 개별 쿼리 대신 벌크 페이지네이션(수백 팀 × 왕복 방지)
      const allGm = [];
      for(let i=0;i<teamSeqs.length;i+=120){ const chunk=teamSeqs.slice(i,i+120);
        let pg=0;
        while(true){ const {data,error}=await supa.from('guest_members')
            .select('id,event_seq,seq_in_team,person_key,passenger_id,name_kr').in('event_seq',chunk).range(pg,pg+999);
          if(error||!data||!data.length) break; allGm.push(...data); if(data.length<1000) break; pg+=1000; }
      }
      // ⚠ `#dup` 만 벗긴다. 같은 팀에 같은 이름이 두 자리인 경우 붙인 `#2`·`#3` 은 **벗기면 안 된다** —
      //   벗으면 두 번째 자리의 방이 첫 번째 사람에게 옮겨 붙는다.
      const baseKey = k => String(k||'').split('#dup')[0];
      // 살아남는 행(= 이번 파일에 있는 사람) 색인 — 방 이전 대상 찾기용
      const survByTeam={};
      allGm.forEach(r=>{ if((keysBySeq[r.event_seq]||new Set()).has(r.person_key)){
        const tt=(survByTeam[r.event_seq]=survByTeam[r.event_seq]||{byKey:{},byPid:{},byName:{}});
        tt.byKey[baseKey(r.person_key)]=r.id;
        if(r.passenger_id!=null) tt.byPid[r.passenger_id]=r.id;
        // 이름 폴백은 그 팀에서 **이름이 하나뿐일 때만** 쓴다. 같은 이름이 두 자리면
        // 누구의 방인지 알 수 없어, 두 번째 자리의 방이 첫 번째 사람에게 붙어 버린다.
        if(r.name_kr){ tt.byName[r.name_kr] = (r.name_kr in tt.byName) ? null : r.id; } } });
      let ghosts = allGm.filter(r=> !(keysBySeq[r.event_seq]||new Set()).has(r.person_key));
      // 🛡 안전장치 — 한 팀에서 절반 넘게 지워야 한다면 키가 어긋난 것이지 취소가 아니다.
      //   (이름 표기 변경·생년 누락 등으로 person_key 가 달라지면 멀쩡한 사람이 통째로 지워질 수 있다)
      {
        const byTeam={}; ghosts.forEach(r=>{ (byTeam[r.event_seq]=byTeam[r.event_seq]||[]).push(r); });
        const skip=new Set();
        Object.keys(byTeam).forEach(seq=>{
          const have=allGm.filter(r=>String(r.event_seq)===String(seq)).length;
          if(have && byTeam[seq].length > Math.max(2, have*0.5)) skip.add(String(seq));
        });
        if(skip.size){
          log(tx('ghostGuard')(skip.size),'warn');
          console.warn('명단 정리 보류(키 불일치 의심) 행사번호:', [...skip].join(', '));
          ghosts = ghosts.filter(r=>!skip.has(String(r.event_seq)));
        }
      }
      let ghost=0, relinked=0;
      for(const o of ghosts){ const surv=survByTeam[o.event_seq]||{byKey:{},byPid:{},byName:{}};
        const newId = surv.byKey[baseKey(o.person_key)]
                   || (o.passenger_id!=null && surv.byPid[o.passenger_id])
                   || (o.name_kr && surv.byName[o.name_kr]);
        if(newId && newId!==o.id){ try{ const {data:mv}=await supa.from('rooms').update({member_id:newId}).eq('member_id',o.id).select('id'); if(mv) relinked+=mv.length; }catch(_){}}
      }
      const ghostIds=ghosts.map(g=>g.id);
      for(let i=0;i<ghostIds.length;i+=200){ const {data,error}=await supa.from('guest_members').delete().in('id',ghostIds.slice(i,i+200)).select('id'); if(!error&&data) ghost+=data.length; }
      if(ghost) log(`✓ ${t('s1_dyn_log_members')} ${tx('ghostCleaned')(ghost)}${relinked?` (방 ${relinked}건 보존)`:''}`,'dim');
    } catch(_){ /* 청소 실패는 임포트 자체를 막지 않음 */ }

    // ── 비고 「팀:A,B」 자동 묶기(등록 시): 「팀:…」의 대표명으로 팀을 찾아 union → 手配書·夕食 그룹핑 ──
    //   · 한쪽 비고에만 적혀 있어도 그 이름으로 상대 팀(rep_name)을 찾아 묶음. 양쪽 다 없으면 못 묶음.
    //   · 같은 session_ym 안에서 rep_name 매칭(동명이인·타 여정 오묶음 방지). 3팀 이상 사슬도 전이적 묶음.
    //   · 이미 team_group 있는 팀(수동 묶기) 포함 그룹은 전체 보존(스킵). dining_group·제외 등 기존 필드 보존.
    try {
      const repIdx={};   // ym -> rep_name -> [event_seq]
      bookingRows.forEach(b=>{ const nm=String(b.rep_name||'').trim(); if(!nm)return; const ym2=b.session_ym||ym;
        (repIdx[ym2]=repIdx[ym2]||{}); (repIdx[ym2][nm]=repIdx[ym2][nm]||[]).push(b.event_seq); });
      const parent={}; bookingRows.forEach(b=>{ parent[b.event_seq]=b.event_seq; });
      const find=x=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
      const uni=(a,c)=>{ const ra=find(a), rb=find(c); if(ra!==rb) parent[ra]=rb; };
      bookingRows.forEach(b=>{ const lbl=String(b.team_label||'').trim(); if(!lbl)return; const ym2=b.session_ym||ym;
        lbl.split(/[,，、·・\/]+/).map(s=>s.trim()).filter(s=>s.length>=1).forEach(nm=>{
          const hits=(repIdx[ym2]&&repIdx[ym2][nm])||[];
          hits.forEach(s=>{ if(s!==b.event_seq) uni(b.event_seq,s); });
        }); });
      const comp={}; bookingRows.forEach(b=>{ const r=find(b.event_seq); (comp[r]=comp[r]||[]).push(b.event_seq); });
      const groups=Object.values(comp).filter(a=>a.length>=2);
      if(groups.length){
        const allSeqs=[...new Set(groups.flat())];
        // ⚡ 성능: 기존 print_overrides를 한 번에 벌크 조회(팀별 select 왕복 제거) → 맵으로 재사용.
        const poMap={}; const hasTG=new Set();   // event_seq -> 기존 행, hasTG=수동 묶음
        for(let i=0;i<allSeqs.length;i+=200){ const chunk=allSeqs.slice(i,i+200);
          const {data}=await supa.from('print_overrides').select('event_seq,team_group,team_group_rep,team_group_seq,dining_group,excluded,exclude_reason,team_tag,pax_override').in('event_seq',chunk);
          (data||[]).forEach(o=>{ poMap[o.event_seq]=o; if(o.team_group) hasTG.add(o.event_seq); });
        }
        const tagBySeq={}; guestRows.forEach(g=>{ tagBySeq[g.event_seq]=g.team_tag||g.group_code||''; });
        // 대표팀 기본값 = 회원이 대표인 팀 우선(없으면 최소 seq). 각 booking 대표승객의 회원 여부(3컬럼 OR).
        //  예) 김용하(일반)·권준희(회원)·김태영 묶음 → 권준희 팀이 대표 기본값.
        const repNameBySeq={}; bookingRows.forEach(b=>{ repNameBySeq[b.event_seq]=String(b.rep_name||'').trim(); });
        const paxByTeam={}; paxRows.forEach(p=>{ (paxByTeam[p.event_seq]=paxByTeam[p.event_seq]||[]).push(p); });
        const repMem={};   // event_seq -> 대표승객이 회원?
        Object.keys(paxByTeam).forEach(s=>{ const list=paxByTeam[s].slice().sort((a,b)=>(a.seq_in_team||99)-(b.seq_in_team||99));
          const rn=repNameBySeq[s]||''; const rp=list.find(p=>String(p.name_kr||'').trim()===rn)||list[0]||{};
          repMem[s]=!!(window.SZCore&&SZCore.isMember(rp)); });
        let grouped=0, repFixed=0; const upRows=[];
        for(const seqs of groups){
          const sorted=[...new Set(seqs)].sort((a,b)=>a-b);
          const memSorted=sorted.filter(s=>repMem[s]);   // 회원 대표 팀(최소 seq 우선)
          if(seqs.some(s=>hasTG.has(s))){
            // ── 이미 묶인 그룹: 그룹 구성·순번·묶기는 그대로 두고, '대표만' 회원으로 승격 ──
            //  · 현재 대표가 일반인데 팀에 회원이 있으면 → 그 회원을 대표로. (예: 김용하→권준희)
            //  · 현재 대표가 이미 회원이거나(=수동 회원 선택 보존) 회원이 아예 없으면 그대로 둠(다운그레이드 금지).
            if(!memSorted.length) continue;
            const curRepSeq=sorted.find(s=>poMap[s]&&poMap[s].team_group_rep);
            if(curRepSeq!=null && repMem[curRepSeq]) continue;   // 이미 회원 대표 → 손대지 않음
            const newRep=memSorted[0]; const label=tagBySeq[newRep]||('팀'+newRep);
            for(const s of sorted){ const cur=poMap[s]||null; if(!cur) continue;   // 기존 행만 갱신(구성 유지)
              upRows.push({ event_seq:s, session_ym:ymBySeq[s]||ym, team_group:label, team_group_rep:(s===newRep),
                team_group_seq:(cur.team_group_seq!=null?cur.team_group_seq:null),   // 담당자 순번(드래그) 보존
                dining_group:cur.dining_group||null, excluded:!!cur.excluded, exclude_reason:cur.exclude_reason||null,
                team_tag:cur.team_tag||null, pax_override:(cur.pax_override!=null)?cur.pax_override:null });
            }
            repFixed++; continue;
          }
          // ── 신규 그룹: 회원 우선 대표로 처음부터 묶기 ──
          const repSeq=(memSorted.length?memSorted[0]:sorted[0]); const label=tagBySeq[repSeq]||('팀'+repSeq);
          for(let i=0;i<sorted.length;i++){ const s=sorted[i]; const cur=poMap[s]||null;
            upRows.push({ event_seq:s, session_ym:ymBySeq[s]||ym, team_group:label, team_group_rep:(s===repSeq), team_group_seq:i+1,
              dining_group:(cur&&cur.dining_group)||null, excluded:!!(cur&&cur.excluded), exclude_reason:(cur&&cur.exclude_reason)||null,
              team_tag:(cur&&cur.team_tag)||null, pax_override:(cur&&cur.pax_override!=null)?cur.pax_override:null });
          }
          grouped++;
        }
        for(let i=0;i<upRows.length;i+=200){ await supa.from('print_overrides').upsert(upRows.slice(i,i+200),{onConflict:'event_seq'}); }
        if(grouped) log(`✓ ${tx('autoGroup')(grouped)}`,'dim');
        if(repFixed) log(`✓ ${tx('repFixed')(repFixed)}`,'dim');   // 기존 그룹 대표=회원 승격 건수
      }
    } catch(_){ /* 자동 묶기 실패는 임포트 자체를 막지 않음 */ }

    // ── 동기화(취소 정리): 파일에 실제로 포함된 '출발일자'만 대상 ──
    //   ⚠ 이전엔 '그 달(session_ym) 전체'에서 파일에 없는 팀을 지워, 하루치만 업로드하면
    //      나머지 날짜 팀+방배정이 통째로 삭제됐음. → 파일에 있는 출발일자(fileDeps)에
    //      해당하는 팀만 정리해, 부분 업로드는 그 날짜만 반영하고 나머지는 보존한다.
    //   · bookings 삭제 → passengers/guests/guest_members/rooms/transactions cascade.
    try {
      const fileSeqs = new Set(), fileDeps = new Set();
      res.forEach(r=>{ const s=parseInt(String(r['eventSeq']||'').trim(),10); if(s) fileSeqs.add(s);
        const dep=birthISO(r['출발일자']); if(dep) fileDeps.add(String(dep).slice(0,10)); });
      if(fileSeqs.size && fileMonths.length && fileDeps.size){
        let exB=[], pg=0;
        while(true){   // 1000행 한계 → 페이지네이션 · 이 파일에 포함된 모든 달
          const { data, error } = await supa.from('bookings').select('event_seq,dep_date').in('session_ym', fileMonths).range(pg, pg+999);
          if(error || !data || !data.length) break;
          exB = exB.concat(data);
          if(data.length<1000) break;
          pg += 1000;
        }
        // 파일에 있는 출발일자 팀 중에서만 orphan 판정(다른 날짜 팀은 파일 범위 밖 → 보존)
        const orphans = exB.filter(r=> fileDeps.has(String(r.dep_date||'').slice(0,10)) && !fileSeqs.has(r.event_seq)).map(r=>r.event_seq);
        if(orphans.length){
          // 항상 자동 반영(확인창 없음) — 엠클릭 파일이 소스이므로 파일 변경을 그대로 반영(Min 결정).
          //   취소는 각 섹션의 취소 이력 패널로 알림 → 방배정·手配書 등 담당자가 각자 조치.
          {
            // 취소 이력 기록용 정보 캡처(삭제 전) — 팀·일정·대표·방배정 멤버(영문명)
            const info=[]; const roomByTeam={};
            try{
              for(let i=0;i<orphans.length;i+=200){ const chunk=orphans.slice(i,i+200);
                const { data } = await supa.from('bookings').select('event_seq,event_no,rep_name,arr_date,dep_date,pax').in('event_seq',chunk);
                (data||[]).forEach(b=>info.push(b));
                const { data: gms } = await supa.from('guest_members').select('id,event_seq,name_kr,name_en').in('event_seq',chunk);
                const gmMap={}; (gms||[]).forEach(g=>gmMap[g.id]=g); const gmIds=(gms||[]).map(g=>g.id);
                for(let j=0;j<gmIds.length;j+=150){ const gc=gmIds.slice(j,j+150);
                  const { data: rms } = await supa.from('rooms').select('member_id,inventory_id').in('member_id',gc);
                  const invIds=[...new Set((rms||[]).map(r=>r.inventory_id).filter(Boolean))]; let invMap={};
                  if(invIds.length){ const {data:invs}=await supa.from('room_inventory').select('id,room_no,facility').in('id',invIds); (invs||[]).forEach(v=>invMap[v.id]=v); }
                  (rms||[]).forEach(r=>{ const g=gmMap[r.member_id]||{}; const v=invMap[r.inventory_id]||{}; (roomByTeam[g.event_seq]=roomByTeam[g.event_seq]||[]).push({name:g.name_kr||'',eng:g.name_en||'',room:v.room_no||'',facility:v.facility||''}); });
                }
              }
            }catch(_){}
            let del=0;
            for(let i=0;i<orphans.length;i+=50){
              const chunk=orphans.slice(i,i+50);
              const { error } = await supa.from('bookings').delete().in('event_seq',chunk);
              if(error){ log(tx('syncDelFail')+error.message,'warn'); break; }
              del += chunk.length;
            }
            // 취소 이력(cancel_log) 기록 → room/shizu 취소 이력 패널
            try{
              const by = ((window.__so_getUser && __so_getUser()) || '').trim();
              const logs = info.map(b=>{ const rms=roomByTeam[b.event_seq]||[];
                return { entity:'cancel_log', action:'팀취소',
                  label:`취소(팀) — ${b.rep_name||''} · #${b.event_no||b.event_seq} · ${(b.dep_date||'').slice(5)}~${(b.arr_date||'').slice(5)} · ${b.pax||0}명${rms.length?(' · 방배정 '+rms.length+'명 해제'):''}`.slice(0,300),
                  changes:{ kind:'team', no:(b.event_no||String(b.event_seq)), dep:b.dep_date||null, arr:b.arr_date||null, rep:b.rep_name||'', pax:b.pax||0, rooms:rms }, changed_by:by||null };
              });
              for(let i=0;i<logs.length;i+=200){ await supa.from('change_log').insert(logs.slice(i,i+200)); }
            }catch(_){}
            log(tx('syncCleaned')(fileMonths.join('·'),del),'ok');
          }
        }
      }
    } catch(e){ log(tx('syncCheckFail')+e.message,'warn'); }

    log(tx('loadDone'),'ok');
    showStats(stat);
    loadMonths();   // 월 삭제 패널 목록 갱신
    // ── 수정이력 diff 계산 (이름+생년6자리 = 사람 단위) ──
    const changes = { teams_added:[], teams_removed:[], persons_added:[], persons_removed:[], grade_changed:[] };
    try {
      const newPx={};
      paxRows.forEach(p=>{ const k=(p.name_kr||'')+(p.birth_yymmdd||''); (newPx[p.event_seq]=newPx[p.event_seq]||{})[k]={name:p.name_kr,grade:p.member_grade}; });
      const newNo={};   // event_seq -> event_no(행사번호 — 표시용)
      bookingRows.forEach(b=>{ newNo[b.event_seq]=b.event_no||''; });
      const noOf = s => newNo[s] || _oldNo[s] || s;   // 행사번호 우선, 없으면 event_seq 폴백
      const newSeqs=new Set(bookingRows.map(b=>b.event_seq));
      const oldSeqs=new Set(Object.keys(_oldBk).map(Number));
      newSeqs.forEach(s=>{ if(!oldSeqs.has(s)) changes.teams_added.push({seq:s, no:noOf(s)}); });
      oldSeqs.forEach(s=>{ if(!newSeqs.has(s)) changes.teams_removed.push({seq:s, no:noOf(s), rep:_oldBk[s], n:Object.keys(_oldPx[s]||{}).length}); });
      newSeqs.forEach(s=>{ if(!oldSeqs.has(s)) return;     // 신규팀은 위에서
        const o=_oldPx[s]||{}, n=newPx[s]||{};
        Object.keys(n).forEach(k=>{ if(!(k in o)) changes.persons_added.push({seq:s,no:noOf(s),name:n[k].name});
          else if((o[k].grade||'')!==(n[k].grade||'')) changes.grade_changed.push({seq:s,no:noOf(s),name:n[k].name,from:o[k].grade||'-',to:n[k].grade||'-'}); });
        Object.keys(o).forEach(k=>{ if(!(k in n)) changes.persons_removed.push({seq:s,no:noOf(s),name:o[k].name,birth:o[k].birth||''}); });
      });
    } catch(e){}
    // ── 개인 취소 자동 반영: 팀은 남았는데 일행리스트에서 빠진 사람 = 취소 → 확인창 없이 자동 삭제 ──
    //   ⚠ 가드: 일행 행이 0건인 팀(파일째 누락 — 예: 엠클릭 오류로 빠진 달)은 취소로 보지 않고 보호.
    //   방배정이 있던 취소자는 change_log(room_assign)에 기록 → 방배정 화면 변경이력에 노출(등록 담당자는 방을 못 만짐).
    try {
      const hasIlh = {}; paxRows.forEach(p=>{ hasIlh[p.event_seq]=true; });   // 이번 파일에 일행 행이 있는 팀
      const allRemoved = changes.persons_removed || [];
      const guarded = allRemoved.filter(r=>!hasIlh[r.seq]);   // 일행 0건 팀 = 데이터 누락 → 보호(취소 아님)
      const removed = allRemoved.filter(r=>hasIlh[r.seq]);    // 실제 취소(일행 있는 팀에서 빠짐)
      changes.persons_removed = removed;                      // 변경이력도 실제 취소만 반영
      if (guarded.length) log(tx('prGuard')(guarded.length), 'dim');
      if (removed.length) {
        const newNames = {};   // 동명이인 오삭제 방지(이름이 새 파일에도 있으면 gm 삭제 스킵)
        paxRows.forEach(p=>{ (newNames[p.event_seq]=newNames[p.event_seq]||new Set()).add(p.name_kr||''); });
        const seqs = [...new Set(removed.map(r=>r.seq))];
        // 방배정 있는 취소자 파악 + 방번호·시설 캡처(cascade로 사라지기 전에)
        const gmByKey = {};   // (seq|name) -> {id,hasRoom,eng}
        const roomByMember = {};   // gmId -> {room_no,facility}
        for (let i=0;i<seqs.length;i+=200){
          const chunk = seqs.slice(i,i+200);
          const { data: gms } = await supa.from('guest_members').select('id,event_seq,name_kr,name_en').in('event_seq',chunk);
          const gmIds = (gms||[]).map(g=>g.id);
          const roomSet = new Set();
          for (let j=0;j<gmIds.length;j+=150){ const gc=gmIds.slice(j,j+150);
            const { data: rms } = await supa.from('rooms').select('member_id,inventory_id').in('member_id',gc);
            const invIds=[...new Set((rms||[]).map(r=>r.inventory_id).filter(Boolean))];
            let invMap={};
            if(invIds.length){ const {data:invs}=await supa.from('room_inventory').select('id,room_no,facility').in('id',invIds); (invs||[]).forEach(v=>invMap[v.id]=v); }
            (rms||[]).forEach(r=>{ roomSet.add(r.member_id); const v=invMap[r.inventory_id]||{}; roomByMember[r.member_id]={room_no:v.room_no||'',facility:v.facility||''}; });
          }
          (gms||[]).forEach(g=>{ gmByKey[g.event_seq+'|'+(g.name_kr||'')]={id:g.id,hasRoom:roomSet.has(g.id),eng:g.name_en||''}; });
        }
        removed.forEach(r=>{ const gk=gmByKey[r.seq+'|'+r.name]; r._hasRoom=!!(gk&&gk.hasRoom); r._gmId=(gk?gk.id:null); r._eng=(gk?gk.eng:''); r._room=(r._gmId&&roomByMember[r._gmId])||null; });
        // ── 자동 삭제 ──
        let delPax=0, delGm=0;
        for (const s of seqs){
          const rem = removed.filter(r=>r.seq===s);
          const remKeys = new Set(rem.map(r=>(r.name||'')+(r.birth||'')));
          const { data: px } = await supa.from('passengers').select('id,name_kr,birth_yymmdd').eq('event_seq',s);
          const paxIds = (px||[]).filter(p=>remKeys.has((p.name_kr||'')+(p.birth_yymmdd||''))).map(p=>p.id);
          const nn = newNames[s] || new Set();
          const gmIds = rem.filter(r=>r._gmId && !nn.has(r.name)).map(r=>r._gmId);
          // rooms.member_id → guest_members 는 ON DELETE CASCADE → gm 삭제 시 방배정 자동 정리(rooms 권한 불요)
          if (gmIds.length){ const {error:ge}=await supa.from('guest_members').delete().in('id',gmIds); if(!ge) delGm+=gmIds.length; }
          if (paxIds.length){ const {error:pe}=await supa.from('passengers').delete().in('id',paxIds); if(!pe) delPax+=paxIds.length; }
        }
        changes._persons_deleted = delPax;
        // ── 취소 이력 기록: 개인 취소 전원 → cancel_log(구조화: 행사번호·일정·팀·영문명·방) → room/shizu 취소 이력 패널 ──
        try {
          const by = ((window.__so_getUser && __so_getUser()) || '').trim();
          const bi = {}; bookingRows.forEach(b=>{ bi[b.event_seq]={no:b.event_no, dep:b.dep_date, arr:b.arr_date, rep:b.rep_name}; });
          const rows = removed.map(r=>{ const b=bi[r.seq]||{}; const rm=r._room;
            return { entity:'cancel_log', action:'개인취소',
              label:`취소(개인) — ${r.name||''}${r._eng?(' '+r._eng):''} · #${b.no||r.seq}${rm?(' · '+(rm.facility||'')+' '+(rm.room_no||'')):''}`.slice(0,300),
              changes:{ kind:'person', no:(b.no||String(r.seq)), dep:b.dep||null, arr:b.arr||null, rep:b.rep||'', name:r.name||'', eng:r._eng||'', room:(rm?rm.room_no:''), facility:(rm?rm.facility:''), had_room:!!rm },
              changed_by: by||null };
          });
          for(let i=0;i<rows.length;i+=200){ await supa.from('change_log').insert(rows.slice(i,i+200)); }
          const roomN = removed.filter(r=>r._room).length;
          if(roomN) log(tx('prRoomNote')(roomN), 'warn');
        } catch(e){}
        log(tx('prDone')(delPax, delGm), 'ok');
      }
    } catch(e){ log(tx('prFail')+e.message,'warn'); }
    // ── 팀 전체 취소 자동 삭제: 파일에 「취소」로 찍혔고 활성행이 없는 팀 → DB에 있으면 cascade 삭제 ──
    //   ⚠ 파일에 명시된 취소 팀만 건드림(부재 기반 아님 → 부분파일이어도 안전). confirmOrphan은 취소행 팀을 못 지움.
    try {
      const activeSeqs = new Set(bookingRows.map(b=>b.event_seq));
      const targets = [...cancelSeqs].filter(s=>!activeSeqs.has(s));
      if (targets.length) {
        const exist = [];
        for (let i=0;i<targets.length;i+=200){ const chunk=targets.slice(i,i+200);
          const { data } = await supa.from('bookings').select('event_seq,event_no,rep_name,arr_date,dep_date,pax').in('event_seq',chunk);
          (data||[]).forEach(b=>exist.push(b)); }
        if (exist.length) {
          const eseqs = exist.map(b=>b.event_seq);
          // 방배정 있던 팀원(영문명 포함) 캡처 — 삭제 전
          const roomMembers = [];   // {seq,name,eng,room_no,facility}
          for (let i=0;i<eseqs.length;i+=200){ const chunk=eseqs.slice(i,i+200);
            const { data: gms } = await supa.from('guest_members').select('id,event_seq,name_kr,name_en').in('event_seq',chunk);
            const gmMap={}; (gms||[]).forEach(g=>gmMap[g.id]=g); const gmIds=(gms||[]).map(g=>g.id);
            for (let j=0;j<gmIds.length;j+=150){ const gc=gmIds.slice(j,j+150);
              const { data: rms } = await supa.from('rooms').select('member_id,inventory_id').in('member_id',gc);
              const invIds=[...new Set((rms||[]).map(r=>r.inventory_id).filter(Boolean))]; let invMap={};
              if(invIds.length){ const {data:invs}=await supa.from('room_inventory').select('id,room_no,facility').in('id',invIds); (invs||[]).forEach(v=>invMap[v.id]=v); }
              (rms||[]).forEach(r=>{ const g=gmMap[r.member_id]||{}; const v=invMap[r.inventory_id]||{}; roomMembers.push({seq:g.event_seq,name:g.name_kr||'',eng:g.name_en||'',room_no:v.room_no||'',facility:v.facility||''}); });
            }
          }
          // cascade 삭제: rooms → guest_members → passengers → bookings
          for (let i=0;i<eseqs.length;i+=100){ const chunk=eseqs.slice(i,i+100);
            const { data: gms2 } = await supa.from('guest_members').select('id').in('event_seq',chunk);
            const gmIds2=(gms2||[]).map(g=>g.id);
            for (let j=0;j<gmIds2.length;j+=150){ await supa.from('rooms').delete().in('member_id',gmIds2.slice(j,j+150)); }
            await supa.from('guest_members').delete().in('event_seq',chunk);
            await supa.from('passengers').delete().in('event_seq',chunk);
            await supa.from('bookings').delete().in('event_seq',chunk);
          }
          // 취소 이력 기록: 팀 1건씩 → cancel_log(구조화)
          try {
            const by = ((window.__so_getUser && __so_getUser()) || '').trim();
            const byTeam={}; roomMembers.forEach(m=>{ (byTeam[m.seq]=byTeam[m.seq]||[]).push(m); });
            const logs = exist.map(b=>{ const rms=byTeam[b.event_seq]||[];
              return { entity:'cancel_log', action:'팀취소',
                label:`취소(팀) — ${b.rep_name||''} · #${b.event_no||b.event_seq} · ${(b.dep_date||'').slice(5)}~${(b.arr_date||'').slice(5)} · ${b.pax||0}명${rms.length?(' · 방배정 '+rms.length+'명 해제'):''}`.slice(0,300),
                changes:{ kind:'team', no:(b.event_no||String(b.event_seq)), dep:b.dep_date||null, arr:b.arr_date||null, rep:b.rep_name||'', pax:b.pax||0, rooms:rms.map(m=>({name:m.name,eng:m.eng,room:m.room_no,facility:m.facility})) },
                changed_by: by||null };
            });
            for (let i=0;i<logs.length;i+=200){ await supa.from('change_log').insert(logs.slice(i,i+200)); }
          } catch(e){}
          changes.teams_cancelled = exist.map(b=>({seq:b.event_seq,no:b.event_no,rep:b.rep_name}));
          log(tx('tcDone')(exist.length, roomMembers.length), 'ok');
        }
      }
    } catch(e){ log(tx('tcFail')+e.message,'warn'); }
    // ── 변경이력 기록 (누가·언제·무슨 파일·건수 + diff) ──
    try {
      const by = ((window.__so_getUser && __so_getUser()) || '').trim();   // 로그인 담당자 이름
      const files = SLOTS.filter(s=>s.file).map(s=>s.file).join(', ');
      const { data: logRow } = await supa.from('import_log').insert({ session_ym: (fileMonths.length?fileMonths.join(', '):ym), uploaded_by: by||null, files, counts: stat }).select().single();
      if(logRow){ try{ await supa.from('import_log').update({ changes }).eq('id', logRow.id); }catch(e){} }  // changes 컬럼 없으면 무시
      if(by){ try{ localStorage.setItem('saizen_hub_uploader', by); }catch(e){} }
      await loadHistory();
    } catch(e){ log('· '+t('s1_dyn_histFail')+': '+e.message, 'warn'); }
    // ── 시즈노야도 미배정팀 자동배정(등록 시 시스템이 판단) ──
    //   취소 정리까지 끝난 상태에서, 미배정 시즈팀을 빈 방에 2인 페어로 자동 배정.
    //   비파괴(삽입만·기존 manual/auto 보존) · 권한(room/shizu/step1) 없으면 조용히 skip.
    try {
      const _months = fileMonths.length ? fileMonths : [ym];
      let _sz=0;
      for(const mm of _months){ try{ const {data:pn}=await supa.rpc('shizu_autofill',{p_ym:mm}); if(typeof pn==='number') _sz+=pn; }catch(_){} }
      if(_sz) log(tx('shizuAuto')(_sz), 'ok');
    } catch(e){}
    // ── 등록 완료 라이트박스 ──
    try {
      const c = stat||{};
      const sm = $('#done-summary');
      if(sm) sm.innerHTML = t('s1_historyNote') + ' &nbsp; ' + (c.bookings??0)+' / '+(c.passengers??0)+' / '+(c.guests??0);
      const _rb=$('#done-room');
      if(_rb){ const _ym=(fileMonths&&fileMonths.length)?fileMonths[0]:(ym||''); _rb.href='room.html'+(_ym?('?ym='+encodeURIComponent(_ym)):''); }
      applyStaticLocal();
      const m = $('#done-modal'); if(m) m.style.display='flex';
      startDoneCountdown(5);   // 5초 뒤 홈 자동 이동(3·2·1 표기, [닫기]로 취소)
    } catch(e){}
  }catch(err){
    log(`✗ ${t('s1_dyn_error')}: ${err.message}`,'err');
    try{ showFailModal(err); }catch(_){}
  }finally{
    window._running = false;
    showRunModal(false);   // 등록중 안내 닫기(완료 라이트박스가 대신 뜸)
    refreshRunBtn();   // 기본 라벨 복원(+등록 가능 여부 재판정)
  }
}

function showStats(stat){
  const panel = $('#stats-panel'); panel.style.display='block';
  const box = $('#stats'); box.innerHTML='';
  const items = [
    ['bookings',tx('statBookings')],['passengers',tx('statPax')],['member_codes',tx('statMember')],
    ['guests',tx('statGuests')],['guest_members',tx('statMembers')]
  ];
  items.forEach(([k,label])=>{
    const div = document.createElement('div'); div.className='stat';
    div.innerHTML = `<div class="k">${label}</div><div class="v">${(stat[k]??0).toLocaleString()}<small> ${tx('statUnit')}</small></div>`;
    box.appendChild(div);
  });
}

// ── 카드별 초기화(그 파일만 폼에서 비움. DB 무관) ──
function clearSlot(id){
  const s = SLOTS.find(x=>x.id===id); if(!s) return;
  s.data=null; s.file='';
  renderDrops();
}

// ── 수정이력(diff) 표시: 취소·추가팀 / 일행 빠짐·추가·등급변경 (이름+생년 기준) ──
function fmtChanges(ch){
  if(!ch || typeof ch!=='object') return '';
  const ta=(ch.teams_added||[]), tr=(ch.teams_removed||[]), pa=(ch.persons_added||[]), pr=(ch.persons_removed||[]), gc=(ch.grade_changed||[]);
  if(!(ta.length+tr.length+pa.length+pr.length+gc.length)) return '';
  const sum=[]; if(tr.length)sum.push(tx('chTeamCancel')(tr.length)); if(ta.length)sum.push(tx('chTeamAdd')(ta.length));
  if(pr.length)sum.push(tx('chPerOut')(pr.length)); if(pa.length)sum.push(tx('chPerAdd')(pa.length)); if(gc.length)sum.push(tx('chGrade')(gc.length));
  // 표시는 행사번호(no). 과거 로그(no 없음)는 seq 폴백. 숫자형(구 teams_added=seq)도 호환.
  const nof = x => (x && typeof x==='object') ? (x.no!=null?x.no:x.seq) : x;
  let d='';
  tr.forEach(t=>d+=`<div style="margin-left:20px;color:var(--err)">${tx('chRowCancel')(nof(t),t.rep,t.n)}</div>`);
  ta.forEach(s=>d+=`<div style="margin-left:20px;color:var(--ok)">${tx('chRowNew')(nof(s))}</div>`);
  pr.forEach(x=>d+=`<div style="margin-left:20px">${tx('chRowOut')(nof(x),x.name)}</div>`);
  pa.forEach(x=>d+=`<div style="margin-left:20px">${tx('chRowIn')(nof(x),x.name)}</div>`);
  gc.forEach(x=>d+=`<div style="margin-left:20px">${tx('chRowGrade')(nof(x),x.name,x.from,x.to)}</div>`);
  return `<div style="margin-left:14px;color:var(--accent2);font-weight:700">↳ ${sum.join(' · ')}</div>${d}`;
}
// ── 변경이력 로드 (import_log) ──
async function loadHistory(){
  if(!supa) return;
  try {
    const { data } = await supa.from('import_log')
      .select('*')
      .order('uploaded_at',{ascending:false}).limit(12);
    const rows = data||[];
    const names = [...new Set(rows.map(r=>r.uploaded_by).filter(Boolean))];
    const dl = $('#uploader-list'); if(dl) dl.innerHTML = names.map(n=>`<option value="${n}"></option>`).join('');
    const box = $('#history');
    if(!rows.length){ box.innerHTML = `<span class="l-dim">${t('s1_historyEmpty')}</span>`; }
    else {
      box.innerHTML = rows.map(r=>{
        const d = new Date(r.uploaded_at); const p = n=>String(n).padStart(2,'0');
        const ts = `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        const c = r.counts||{};
        const cnt = (c.bookings!=null) ? ` · ${c.bookings}/${c.passengers}/${c.guests}` : '';
        return `<div>· <b>${ts}</b> · ${r.uploaded_by||'-'} · ${r.session_ym||''} · ${r.files||''}${cnt}</div>${fmtChanges(r.changes)}`;
      }).join('');
    }
    // 등록 상태 안내 + 등록 결과 복원 (최근 등록분)
    const rs = $('#reg-status');
    if(rows.length && rows[0].counts){
      try{ showStats(rows[0].counts); }catch(e){}
      if(rs){ rs.innerHTML = '\u2713 '+t('s1_regStatusDone')+' ('+(rows[0].session_ym||'')+(rows[0].uploaded_by?' · '+rows[0].uploaded_by:'')+'). '+t('s1_regStatusHint'); rs.style.display='block'; }
    } else if(rs){ rs.style.display='none'; }
    $('#history-panel').style.display='block';
  } catch(e){}
}

// ── 부팅 ──
// ── 업로드 동기화 선택 모달: [데이터 누적] / [없는 팀 정리] ──
// ── 월 데이터 삭제 ──
async function loadMonths(){
  const panel = $('#month-del-panel'); if(!panel || !supa) return;
  const sel = $('#month-del-sel');
  try{
    const seen = new Set(); let pg = 0;
    while(true){
      const { data, error } = await supa.from('bookings').select('session_ym').range(pg, pg+999);
      if(error || !data || !data.length) break;
      data.forEach(r=>{ if(r.session_ym) seen.add(r.session_ym); });
      if(data.length<1000) break; pg += 1000;
    }
    const arr = [...seen].sort();
    if(arr.length){
      sel.innerHTML = arr.map(m=>`<option value="${m}">${m}</option>`).join('');
      $('#btn-month-del').disabled = false;
    } else {
      sel.innerHTML = '<option value="">'+tx('mdNoMonths')+'</option>';
      $('#btn-month-del').disabled = true;
    }
    panel.style.display = 'block';
  }catch(e){ log(tx('monthListFail')+e.message,'warn'); }
}
async function deleteMonth(){
  const ym = $('#month-del-sel').value;
  if(!ym || !supa) return;
  if(!confirm(tx('delMonthConfirm')(ym))) return;
  $('#btn-month-del').disabled = true;
  try{
    let seqs = [], pg = 0;
    while(true){
      const { data, error } = await supa.from('bookings').select('event_seq').eq('session_ym', ym).range(pg, pg+999);
      if(error) throw error;
      if(!data || !data.length) break;
      seqs = seqs.concat(data.map(r=>r.event_seq));
      if(data.length<1000) break; pg += 1000;
    }
    let del = 0;
    for(let i=0;i<seqs.length;i+=50){
      const chunk = seqs.slice(i,i+50);
      const { error } = await supa.from('bookings').delete().in('event_seq', chunk);
      if(error) throw error;
      del += chunk.length;
    }
    log(tx('delMonthDone')(ym,del),'ok');
  }catch(e){ log(tx('delMonthFail')+e.message,'warn'); }
  await loadMonths();
}
$('#btn-month-del') && $('#btn-month-del').addEventListener('click', deleteMonth);
$('#btn-month-refresh') && $('#btn-month-refresh').addEventListener('click', loadMonths);

$('#btn-connect').addEventListener('click', connect);
$('#btn-run').addEventListener('click', run);
// ── 등록 완료 → 홈 자동 이동 카운트다운(3·2·1) · [닫기]나 바깥 클릭으로 취소 ──
let _doneTimer=null;
function stopDoneCountdown(){ if(_doneTimer){ clearInterval(_doneTimer); _doneTimer=null; } const cd=$('#done-countdown'); if(cd) cd.textContent=''; }
function startDoneCountdown(sec){
  stopDoneCountdown();
  let n=sec; const cd=$('#done-countdown');
  const tick=()=>{
    if(n<=0){ clearInterval(_doneTimer); _doneTimer=null; if(cd) cd.textContent=tx('goHomeNow'); location.href='../index.html'; return; }
    if(cd) cd.textContent=tx('goHomeIn')(n); n--; };
  tick(); _doneTimer=setInterval(tick,1000);
}
$('#dup-close') && $('#dup-close').addEventListener('click',()=>{ const m=$('#dup-modal'); if(m) m.style.display='none'; });
$('#dup-copy') && $('#dup-copy').addEventListener('click',()=>{
  const txt=[tx('dupTitle'), tx('dupLead')(_dupLast.length), ...dupTextLines(_dupLast).map(x=>'· '+x),
    plain(tx('dupHow'))].join('\n');
  try{ navigator.clipboard.writeText(txt); }catch(_){}
  const b=$('#dup-copy'); if(b){ const o=b.textContent; b.textContent=tx('failCopied'); setTimeout(()=>{b.textContent=o;},1600); }
});
$('#fail-close') && $('#fail-close').addEventListener('click',()=>{ const m=$('#fail-modal'); if(m) m.style.display='none'; });
$('#fail-copy') && $('#fail-copy').addEventListener('click',()=>{
  const txt=[tx('failTitle'), tx('failStep')(_runStep||'-'), ($('#fail-msg')||{}).textContent||'',
    'UA: '+navigator.userAgent, 'URL: '+location.href].join('\n');
  try{ navigator.clipboard.writeText(txt); }catch(_){}
  const b=$('#fail-copy'); if(b){ const o=b.textContent; b.textContent=tx('failCopied'); setTimeout(()=>{b.textContent=o;},1600); }
});
$('#done-stay') && $('#done-stay').addEventListener('click', ()=>{ stopDoneCountdown(); const m=$('#done-modal'); if(m) m.style.display='none'; });
$('#done-modal') && $('#done-modal').addEventListener('click', e=>{ if(e.target.id==='done-modal'){ stopDoneCountdown(); e.target.style.display='none'; } });
loadCreds();
try{ const u=localStorage.getItem('saizen_hub_uploader'); if(u){ const el=$('#uploader'); if(el) el.value=u; } }catch(e){}
applyStaticLocal();
renderDrops();
log(t('s1_logWait'),'dim');
// 외부 라이브러리(SheetJS·supabase-js)를 못 불러오면 파일 읽기·연결이 통째로 막힌다 → 눈에 띄게 알린다
(function checkLibs(){
  const miss=[]; if(!window.XLSX) miss.push('SheetJS'); if(!window.supabase) miss.push('supabase-js');
  if(!miss.length) return;
  const w=$('#lib-warn'); if(w){ w.style.display='block'; w.textContent=tx('libFail')+' ('+miss.join(', ')+')'; }
  log('✗ '+tx('libFail')+' ('+miss.join(', ')+')','err');
})();
// 저장된 키가 있으면 자동 연결 (재진입 시 연결 상태·변경이력 복원)
if($('#sb-url').value.trim() && $('#sb-key').value.trim()) connect();
// 언어 전환 시: 잔여 정적 라벨 + 동적 카드 다시 렌더
window.onSaizenLangChange = function(){ try{ applyStaticLocal(); renderDrops(); }catch(e){} };
