<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Yamanami 운영 관리 · 방문 통계</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --blue:#2c5078;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  .ctrlbar{padding:11px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .ctrlbar label{font-size:12px;color:var(--text2);font-weight:700}
  .chip{font-size:12px;font-weight:700;padding:6px 13px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{padding:16px 20px 80px;max-width:1240px;margin:0 auto}
  .rangelbl{font-size:12.5px;color:var(--text2);font-weight:700;margin:2px 0 12px}
  .rangelbl b{color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.kpis{grid-template-columns:repeat(1,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
  .kpi .l{font-size:11px;color:var(--text2);font-weight:700}
  .kpi .v{font-size:21px;font-weight:800;color:var(--accent);font-family:var(--mono);margin-top:3px;letter-spacing:-.02em}
  .kpi .v small{font-size:12px;color:var(--text2);font-weight:700;font-family:inherit}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 17px}
  .panel h3{font-size:13.5px;font-weight:800;color:var(--accent);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .panel h3 .hint{margin-left:auto}
  table.t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.t th,table.t td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
  table.t th:first-child,table.t td:first-child{text-align:left}
  table.t th{font-size:11px;color:var(--text2);font-weight:700;background:var(--surface2)}
  table.t td.mono{font-family:var(--mono);font-weight:700}
  .note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
  .deny{padding:30px;text-align:center;color:var(--muted)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#2b2f27;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--err)} .toast.warn{background:var(--accent2)}
</style>
<link rel="stylesheet" href="../assets/saizen-ops.css?v=15.24">
</head>
<body data-so-area="report">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム"><img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen"></a>
  <span class="step" id="t-step">방문 통계</span>
  <a class="navhome" href="../index.html" data-i18n="navHome">← 현장 운영</a>
  <div class="grow so-spacer"></div>
  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>
    </div>
  </div>
  <span class="pill" id="conn-state">미연결</span>
</div>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">
  <input class="inp" id="sb-key" type="password" placeholder="Publishable key" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button">연결</button>
  <span class="hint" id="t-connhint"></span>
</div>

<div class="ctrlbar">
  <label id="t-period">기간</label>
  <input class="inp" id="d-from" type="date" style="width:150px">
  <span style="color:var(--muted)">~</span>
  <input class="inp" id="d-to" type="date" style="width:150px">
  <button class="btn sm" id="btn-run" type="button">조회</button>
  <span style="width:8px"></span>
  <button class="chip" id="t-prevm" type="button">◀ 이전 달</button>
  <button class="chip" id="t-nextm" type="button">다음 달 ▶</button>
  <span style="width:8px"></span>
  <button class="chip" id="t-q1" data-q="thismonth" type="button">이번 달</button>
  <button class="chip" id="t-q2" data-q="thisyear" type="button">올해</button>
  <button class="chip" id="t-q3" data-q="lastyear" type="button">작년</button>
  <button class="chip" id="t-q4" data-q="last12" type="button">최근 12개월</button>
  <span style="flex:1"></span>
</div>

<main>
  <div class="rangelbl" id="rangelbl"></div>
  <div id="vcontent"><div class="deny" id="t-empty">기간을 선택하고 「조회」를 누르세요.</div></div>
</main>

<div id="toast"></div>

    vNote:'※ 訪問=同行者1人1滞在(現地チェックインdep基準)=1延べ訪問。会員判定=顧客等級・会員権区分・会員区分の3列OR。年代=満年齢。営業日報の韓国メンバー/韓国ビジター(宿泊)に対応。 出発地=航空会社(ZE→釜山·TW→仁川)優先、無ければ出発地文字列(釜山·金海=釜山)、既定は仁川。 再訪率=期間内2回+訪問人数/実人数。新規/既存=照会期間以前の全記録に同一人物(氏名+生年)があれば既存。' },
  ko:{ navHome:'홈', step:'방문 통계', connIdle:'미연결', connecting:'연결 중…', connOk:'연결됨', connFail:'연결 실패', connect:'연결', connectedBtn:'✓ 연결됨',

    period:'기간', run:'조회', qThisMonth:'이번 달', qThisYear:'올해', qLastYear:'작년', qLast12:'최근 12개월', prevMonth:'이전 달', nextMonth:'다음 달',
    emptyHint:'기간을 선택하고 「조회」를 누르세요.', loading:'집계 중…', loadFail:'집계 실패', noAuth:'권한이 없습니다(관리자 또는 report 권한자만).',

    vTotal:'연인원(방문)', vGender:'성별', vMale:'남', vFemale:'여', vUnknown:'미상',
    vAge:'나이대별', v70plus:'70대+', vBandSuffix:'대', vSeries:'기간별 추이', thBucket:'기간', vSeriesDesc:'선택한 기간을 아래 단위로 쪼갠 추이입니다. 단위는 이 표에만 적용됩니다.', vGranHint:'※ 기간이 단위보다 짧아 한 줄로 합쳐졌습니다. 「일」·「주」로 바꾸면 잘게 나뉩니다.',

    vAvgNights:'평균 체류', uNights:'박', vOrigin:'출발지별(공항)', vAccom:'숙소별', portICN:'인천(ICN)', portPUS:'부산(PUS)', thTotal:'연인원', vGrade:'회원 등급별', vNights:'연박(체류일)별', vRetention:'리텐션(재방문)', vDistinct:'실인원', vRepeatRate:'재방문율', vRepeatSub:'2회+ 방문', vNewRet:'신규 / 기존', vNew:'신규', vReturning:'기존(재방문)',
    vNote:'※ 방문=일행 1인 1체류(현지 체크인 dep 기준)=1연인원. 회원판정=고객등급·회원권구분·회원구분 3컬럼 OR. 나이=만나이. 営業日報의 韓国メンバー/韓国ビジター(宿泊)에 대응. 출발지=항공사(ZE→부산·TW→인천) 우선, 없으면 출발지 문자열(부산·김해=부산), 기본 인천. 재방문율=기간 내 2회+ 방문 인원/실인원. 신규/기존=조회기간 이전 전체 기록에 같은 사람(이름+생년)이 있으면 기존.' },

    vTotal:'Total visits', vGender:'Gender', vMale:'M', vFemale:'F', vUnknown:'Unknown',
    vAge:'By age', v70plus:'70s+', vBandSuffix:'s', vSeries:'Trend by period', thBucket:'Period', vSeriesDesc:'The selected range split by the unit below. The unit affects only this table.', vGranHint:'※ The range is shorter than the unit, so it collapses to one row. Switch to Day or Week to break it down.',
    vByMember:'Visits by member', thName:'Name', thBirth:'Birth', thGrade:'Grade', thVisits:'Visits',
    vAvgNights:'Avg stay', uNights:'n', vOrigin:'By origin (airport)', vAccom:'By lodging', portICN:'Incheon(ICN)', portPUS:'Busan(PUS)', thTotal:'Total', vGrade:'By member grade', vNights:'By nights', vRetention:'Retention', vDistinct:'Unique guests', vRepeatRate:'Repeat rate', vRepeatSub:'2+ visits', vNewRet:'New / Returning', vNew:'New', vReturning:'Returning',
    vNote:'※ Visit = 1 person-stay (on-site check-in dep) = 1 visit. Member = 3-column OR. Age at visit. Maps to 営業日報 Korean member/visitor (lodging). Origin = airline (ZE→PUS·TW→ICN) first, else origin text (Busan/Gimhae=PUS), default ICN. Repeat rate = guests with 2+ visits / unique guests. New/Returning = same person (name+birth) seen in records before the period = returning.' }
};
function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return (d[k]!==undefined?d[k]:(L.ja[k]!==undefined?L.ja[k]:k)); }
function applyStatic(){
  $('#t-step').textContent=tx('step');
  $('#t-connhint').textContent=tx('connHint');
  $('#t-period').textContent=tx('period');
  $('#btn-run').textContent=tx('run');
  $('#t-prevm').textContent='◀ '+tx('prevMonth'); $('#t-nextm').textContent=tx('nextMonth')+' ▶';
  $('#t-q1').textContent=tx('qThisMonth'); $('#t-q2').textContent=tx('qThisYear');
  $('#t-q3').textContent=tx('qLastYear'); $('#t-q4').textContent=tx('qLast12');
  const emp=$('#t-empty'); if(emp) emp.textContent=tx('emptyHint');
  if(!supa){ setConn(tx('connIdle')); $('#btn-connect').textContent=tx('connect'); }
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function num(n){return Number(n||0).toLocaleString('ja-JP');}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function setRange(f,t){ $('#d-from').value=f; $('#d-to').value=t; }
function quick(q){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  if(q==='thismonth'){ setRange(iso(new Date(y,m,1)), iso(new Date(y,m+1,0))); }
  else if(q==='thisyear'){ setRange(y+'-01-01', y+'-12-31'); }
  else if(q==='lastyear'){ setRange((y-1)+'-01-01', (y-1)+'-12-31'); }
  else if(q==='last12'){ setRange(iso(new Date(y,m-11,1)), iso(new Date(y,m+1,0))); }
  if(supa) run();
}
// ◀/▶ 월 이동: 현재 기간을 n개월 앞뒤로. from=이동 월 1일, to=이동 종료월 말일(단일 월=스텝, 여러 달=폭 유지).
function shiftMonths(n){
  const f=$('#d-from').value; if(!f) return;
  const t=$('#d-to').value||f;
  const [fy,fm]=f.split('-').map(Number), [ty,tm]=t.split('-').map(Number);
  const nf=new Date(fy,(fm-1)+n,1), nt=new Date(ty,(tm-1)+n+1,0);
  setRange(iso(nf), iso(nt));
  if(supa) run();
}
async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('connFail'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    await supa.auth.getSession();
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.classList.add('connected');btn.disabled=false;
    if(!$('#d-from').value){ quick('thismonth'); } else { run(); }
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connect');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}
async function run(){
  if(!supa){ toast(tx('connFail'),'warn'); return; }
  const f=$('#d-from').value, t=$('#d-to').value; if(!f||!t){ return; }
  $('#rangelbl').innerHTML=`<b>${esc(f)}</b> ~ <b>${esc(t)}</b>`;
  $('#vcontent').innerHTML=`<div class="deny">${tx('loading')}</div>`;
  const {data,error}=await supa.rpc('visitor_stats',{p_from:f,p_to:t,p_gran:VGRAN});
  if(error){ const msg=/권한|permission/i.test(error.message)?tx('noAuth'):(tx('loadFail')+': '+error.message);
    $('#vcontent').innerHTML=`<div class="deny" style="color:var(--err)">${esc(msg)}</div>`; return; }
  VDATA=data||{}; VMPAGE=0; renderVisitor();
}
function vmPage(d){ VMPAGE+=d; renderVisitor(); }
function ageLabel(b){ b=Number(b); if(b<0) return tx('vUnknown'); if(b>=70) return tx('v70plus'); return b+tx('vBandSuffix'); }
function renderVisitor(){
  const d=VDATA||{}; const tot=d.total||0, mem=d.member||0, non=d.nonmember||0;
  const memPct=tot?Math.round(mem/tot*100):0;
  const avgN=d.avg_nights;
  const kpi=`<div class="kpis">
    <div class="kpi"><div class="l">${tx('vTotal')}</div><div class="v">${num(tot)}<small>${tx('uPpl')}</small></div></div>
    <div class="kpi"><div class="l">${tx('member')}</div><div class="v">${num(mem)}<small> ${memPct}%</small></div></div>
    <div class="kpi"><div class="l">${tx('nonmember')}</div><div class="v">${num(non)}</div></div>
    <div class="kpi"><div class="l">${tx('vAvgNights')}</div><div class="v">${avgN!=null?avgN:'—'}<small>${tx('uNights')}</small></div></div></div>`;
  const rt=d.retention||null;
  const rpct=(rt&&rt.distinct)?Math.round(rt.repeat/rt.distinct*1000)/10:0;
  const retTbl=rt?`<div class="grid2"><div class="panel"><h3>${tx('vRetention')}</h3>
    <div style="display:flex;gap:26px;flex-wrap:wrap">
      <div><div style="font-size:11px;color:var(--text2);font-weight:700">${tx('vDistinct')}</div><div style="font-size:21px;font-weight:800;color:var(--accent);font-family:var(--mono)">${num(rt.distinct)}<small style="font-size:12px;color:var(--text2)">${tx('uPpl')}</small></div></div>
      <div><div style="font-size:11px;color:var(--text2);font-weight:700">${tx('vRepeatRate')}</div><div style="font-size:21px;font-weight:800;color:var(--accent);font-family:var(--mono)">${rpct}%</div><div class="hint">${num(rt.repeat)}${tx('uPpl')} · ${tx('vRepeatSub')}</div></div>
    </div></div>
    <div class="panel"><h3>${tx('vNewRet')}</h3><table class="t"><thead><tr><th></th><th>${tx('member')}</th><th>${tx('nonmember')}</th></tr></thead><tbody>
      <tr><td>${tx('vNew')}</td><td class="mono">${num(rt.new_mem)}</td><td class="mono">${num(rt.new_non)}</td></tr>
      <tr><td>${tx('vReturning')}</td><td class="mono">${num(rt.ret_mem)}</td><td class="mono">${num(rt.ret_non)}</td></tr>
    </tbody></table></div></div>`:'';
  const portLbl=p=>p==='ICN'?tx('portICN'):p==='PUS'?tx('portPUS'):esc(p);
  const oriRows=(d.by_origin||[]).map(o=>`<tr><td>${portLbl(o.port)}</td><td class="mono">${num(o.total)}</td><td class="mono">${num(o.member)}</td><td class="mono">${num(o.nonmember)}</td></tr>`).join('');
  const oriTbl=`<div class="panel"><h3>${tx('vOrigin')}</h3><table class="t"><thead><tr><th></th><th>${tx('thTotal')}</th><th>${tx('member')}</th><th>${tx('nonmember')}</th></tr></thead><tbody>${oriRows||`<tr><td colspan="4" style="text-align:center;color:var(--muted)">—</td></tr>`}</tbody></table></div>`;
  const accRows=(d.by_accom||[]).map(a=>`<tr><td>${esc(a.accom)}</td><td class="mono">${num(a.total)}</td><td class="mono">${num(a.member)}</td><td class="mono">${num(a.nonmember)}</td></tr>`).join('');
  const accTbl=`<div class="panel"><h3>${tx('vAccom')}</h3><table class="t"><thead><tr><th></th><th>${tx('thTotal')}</th><th>${tx('member')}</th><th>${tx('nonmember')}</th></tr></thead><tbody>${accRows||`<tr><td colspan="4" style="text-align:center;color:var(--muted)">—</td></tr>`}</tbody></table></div>`;
  const grdRows=(d.by_grade||[]).map(a=>`<tr><td>${esc(a.grade)}</td><td class="mono">${num(a.total)}</td></tr>`).join('');
  const grdTbl=`<div class="panel"><h3>${tx('vGrade')}</h3><table class="t"><thead><tr><th></th><th>${tx('thTotal')}</th></tr></thead><tbody>${grdRows||`<tr><td colspan="2" style="text-align:center;color:var(--muted)">—</td></tr>`}</tbody></table></div>`;
  const ngtRows=(d.by_nights||[]).map(a=>`<tr><td>${a.nights}${tx('uNights')}</td><td class="mono">${num(a.total)}</td><td class="mono">${num(a.member)}</td><td class="mono">${num(a.nonmember)}</td></tr>`).join('');
  const ngtTbl=`<div class="panel"><h3>${tx('vNights')}</h3><table class="t"><thead><tr><th></th><th>${tx('thTotal')}</th><th>${tx('member')}</th><th>${tx('nonmember')}</th></tr></thead><tbody>${ngtRows||`<tr><td colspan="4" style="text-align:center;color:var(--muted)">—</td></tr>`}</tbody></table></div>`;
  const g=d.gender||{};
  const genTbl=`<div class="panel"><h3>${tx('vGender')}</h3><table class="t"><thead><tr><th></th><th>${tx('member')}</th><th>${tx('nonmember')}</th></tr></thead><tbody>
    <tr><td>${tx('vMale')}</td><td class="mono">${num(g.m_mem)}</td><td class="mono">${num(g.m_non)}</td></tr>
    <tr><td>${tx('vFemale')}</td><td class="mono">${num(g.f_mem)}</td><td class="mono">${num(g.f_non)}</td></tr>
    ${g.u?`<tr><td>${tx('vUnknown')}</td><td colspan="2" class="mono">${num(g.u)}</td></tr>`:''}</tbody></table></div>`;
  const ageRows=(d.by_age||[]).map(a=>`<tr><td>${esc(ageLabel(a.band))}</td><td class="mono">${num(a.member)}</td><td class="mono">${num(a.nonmember)}</td></tr>`).join('');
  const ageTbl=`<div class="panel"><h3>${tx('vAge')}</h3><table class="t"><thead><tr><th></th><th>${tx('member')}</th><th>${tx('nonmember')}</th></tr></thead><tbody>${ageRows||`<tr><td colspan="3" style="text-align:center;color:var(--muted)">—</td></tr>`}</tbody></table></div>`;
  const serRows=(d.series||[]).map(s=>`<tr><td>${esc(s.bucket)}</td><td class="mono">${num(s.total)}</td><td class="mono">${num(s.member)}</td><td class="mono">${num(s.nonmember)}</td></tr>`).join('');
  const GRANS=[['day','vgDay'],['week','vgWeek'],['month','vgMonth'],['year','vgYear']];
  const granBar=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 9px">
      <span class="hint">${esc(tx('vGran'))}</span>
      ${GRANS.map(([g,k])=>`<button class="chip vg${VGRAN===g?' on':''}" data-g="${g}" type="button">${esc(tx(k))}</button>`).join('')}
    </div>`;
  // 한 칸만 나오면(기간이 단위보다 짧음) 왜 안 바뀌어 보이는지 알려준다
  const oneBucket=(d.series||[]).length<=1 ? `<div class="hint" style="margin-top:8px">${esc(tx('vGranHint'))}</div>` : '';
  const serTbl=`<div class="panel"><h3>${tx('vSeries')}</h3><div class="hint" style="margin-bottom:6px">${esc(tx('vSeriesDesc'))}</div>${granBar}<table class="t"><thead><tr><th>${tx('thBucket')}</th><th>${tx('vTotal')}</th><th>${tx('member')}</th><th>${tx('nonmember')}</th></tr></thead><tbody>${serRows||`<tr><td colspan="4" style="text-align:center;color:var(--muted)">—</td></tr>`}</tbody></table>${oneBucket}</div>`;
  const mm=(d.members||[]);
  const PS=30, pages=Math.max(1,Math.ceil(mm.length/PS));
  if(VMPAGE>=pages) VMPAGE=pages-1; if(VMPAGE<0) VMPAGE=0;
  const pg=mm.slice(VMPAGE*PS,VMPAGE*PS+PS);
  const mmRows=pg.map((m,i)=>`<tr><td class="mono" style="color:var(--muted)">${VMPAGE*PS+i+1}</td><td>${esc(m.name)}</td><td class="mono">${esc(m.birth||'')}</td><td>${esc(m.grade)}</td><td class="mono">${num(m.visits)}</td></tr>`).join('');
  const pager=mm.length>PS?`<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:9px">
    <button class="chip" onclick="vmPage(-1)" ${VMPAGE<=0?'disabled style="opacity:.4"':''}>‹</button>
    <span class="hint">${VMPAGE*PS+1}–${Math.min(mm.length,(VMPAGE+1)*PS)} / ${mm.length}</span>
    <button class="chip" onclick="vmPage(1)" ${VMPAGE>=pages-1?'disabled style="opacity:.4"':''}>›</button></div>`:'';
  const mmTbl=`<div class="panel"><h3>${tx('vByMember')} <span class="hint">(${mm.length})</span></h3><table class="t"><thead><tr><th>#</th><th>${tx('thName')}</th><th>${tx('thBirth')}</th><th>${tx('thGrade')}</th><th>${tx('thVisits')}</th></tr></thead><tbody>${mmRows||`<tr><td colspan="5" style="text-align:center;color:var(--muted)">—</td></tr>`}</tbody></table>${pager}</div>`;
  $('#vcontent').innerHTML = kpi + retTbl + `<div class="grid2">${oriTbl}${accTbl}</div>` + `<div class="grid2">${genTbl}${ageTbl}</div>` + `<div class="grid2">${grdTbl}${ngtTbl}</div>` + `<div class="grid2">${serTbl}${mmTbl}</div>` + `<div class="note">${tx('vNote')}</div>`;
}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}

window.onSaizenLangChange=function(){ applyStatic(); if(VDATA) renderVisitor(); };

$('#btn-connect').addEventListener('click',connect);
$('#btn-run').addEventListener('click',run);
$('#t-prevm').addEventListener('click',()=>shiftMonths(-1));
$('#t-nextm').addEventListener('click',()=>shiftMonths(1));
document.querySelectorAll('.chip[data-q]').forEach(b=>b.addEventListener('click',()=>quick(b.dataset.q)));
// 단위 칩은 「기간별 추이」 패널 안에서 매번 다시 그려지므로 위임으로 받는다
document.getElementById('vcontent').addEventListener('click',e=>{
  const b=e.target.closest('.chip.vg'); if(!b) return;
  VGRAN=b.dataset.g; if(supa) run();
});
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value) connect();
</script>
</body>
</html>
