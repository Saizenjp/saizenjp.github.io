  const FONT='游ゴシック', thin={style:'thin'}, med={style:'medium'};
  const W={A:9,B:6,C:10,D:21.9,E:21,F:22.2,G:21.1,H:19.4,I:21.2,J:18.6,K:10.2};
  Object.entries(W).forEach(([c,w])=>{ ws.getColumn(c).width=w; });
  const yr=(parseISO(ax[0])||new Date()).getFullYear();
  ws.mergeCells('A1:K1');
  const t=ws.getCell('A1'); t.value=`ー志津の宿　　${yr}年　　予約表ー`; t.font={name:FONT,size:26,bold:true}; t.alignment={horizontal:'center',vertical:'middle'}; t.border={bottom:thin};
  ws.getRow(1).height=41.4;
  let row=2;
  activeDates().forEach(date=>{
    const d=parseISO(date), r0=row;
    ws.getRow(r0).height=29.4; for(let k=1;k<=5;k++) ws.getRow(r0+k).height=18; ws.getRow(r0+6).height=20.4;
    const hd=ws.getCell(r0,1); hd.value='日付'; hd.font={name:FONT,size:11}; hd.alignment={horizontal:'center',vertical:'middle'};
    const hw=ws.getCell(r0,2); hw.value='曜日'; hw.font={name:FONT,size:11}; hw.alignment={horizontal:'center',vertical:'middle'};
    SHZ_ROOMS.forEach((nm,i)=>{ const c=ws.getCell(r0,4+i); c.value=nm; c.font={name:FONT,size:18,bold:true}; c.alignment={horizontal:'center',vertical:'middle'}; });
    ws.mergeCells(r0+1,1,r0+5,1); ws.mergeCells(r0+1,2,r0+5,2);
    const dc=ws.getCell(r0+1,1); dc.value=`${zen(d.getMonth()+1)}／${zen(d.getDate())}`; dc.font={name:FONT,size:14,bold:true}; dc.alignment={horizontal:'center',vertical:'middle'};
    const wc=ws.getCell(r0+1,2); wc.value=SHZ_DOW[d.getDay()]; wc.font={name:FONT,size:12,bold:true}; wc.alignment={horizontal:'center',vertical:'middle'};
    ['お名前','大人','子供','合計人数','電話番号'].forEach((lb,i)=>{ const c=ws.getCell(r0+1+i,3); c.value=lb; c.font={name:FONT,size:11,bold:true}; c.alignment={vertical:'middle'}; });
    let tot=0,tm=0,tf=0;
    SHZ_ROOMS.forEach((room,ri)=>{
      const col=4+ri; const occ=cellOcc(room,date);
      const kc=ws.getCell(r0+3,col); kc.value='　　　　　　才'; kc.font={name:FONT,size:11};
      if(!occ.length)return;
      const rep=occ[0];
      // 別棟 방 + 別棟 온천(개인탕) 준비 팀 = 이름 앞에 ♨(엑셀 richText)
      const bk=BOOK[rep.event_seq]||{};
      const onsen=SHZ_BYEOLCHE.includes(room) && SHZ_ANNEX_RE.test(String(bk.remark_local||'')+' '+String(bk.remark||''));
      const nc=ws.getCell(r0+1,col); const loc=isLocalSeq(rep.event_seq); const nm=(loc?'【現地】':'')+nameOf(rep)+'様';
      if(onsen){ nc.value={richText:[{text:'♨ ',font:{name:FONT,size:11,bold:true,color:{argb:'FFC0392B'}}},{text:nm,font:{name:FONT,size:11}}]}; }
      else { nc.value=nm; nc.font={name:FONT,size:11}; }
      nc.alignment={horizontal:'right',vertical:'middle'};
      const ac=ws.getCell(r0+2,col); ac.value=mf(occ); ac.font={name:FONT,size:11}; ac.alignment={vertical:'middle'};
      const sc=ws.getCell(r0+4,col); sc.value=zen(occ.length); sc.font={name:FONT,size:11}; sc.alignment={horizontal:'center',vertical:'middle'};
      const rn=nightsOf(rep); const pc=ws.getCell(r0+5,col); pc.value=`${zen(rn.length)}連泊　${zen(rn.indexOf(date)+1)}`; pc.font={name:FONT,size:11}; pc.alignment={horizontal:'center',vertical:'middle'};
      tot+=occ.length; occ.forEach(g=>{const x=genderOf(g); if(x==='男')tm++; else if(x==='女')tf++;});
    });
    const kN=ws.getCell(r0+1,11); kN.value='合計'; kN.font={name:FONT,size:11,bold:true}; kN.alignment={horizontal:'center',vertical:'middle'};
    const kA=ws.getCell(r0+2,11); kA.value=`大　${zen(tot)}　名`; kA.font={name:FONT,size:11}; kA.alignment={horizontal:'right',vertical:'middle'};
    const kC=ws.getCell(r0+3,11); kC.value='子　　　名'; kC.font={name:FONT,size:11};
    const kS=ws.getCell(r0+4,11); kS.value=`計　${zen(tot)}　名`; kS.font={name:FONT,size:11,bold:true}; kS.alignment={horizontal:'center',vertical:'middle'};
    const kM=ws.getCell(r0+5,11); kM.value=`男${zen(tm)}　女${zen(tf)}`; kM.font={name:FONT,size:11}; kM.alignment={horizontal:'center',vertical:'middle'};
    ws.mergeCells(r0+6,1,r0+6,2);
    const ar=ws.getCell(r0+6,1); ar.value='到着予定時刻'; ar.font={name:FONT,size:12}; ar.alignment={horizontal:'center',vertical:'middle'};
    ws.mergeCells(r0+6,3,r0+6,11);
    const note=NOTES[date]!=null?NOTES[date]:buildNoteAuto(date);
    const nt=ws.getCell(r0+6,3); nt.value=note; nt.font={name:FONT,size:11,bold:true}; nt.alignment={horizontal:'left',vertical:'middle',indent:1};
    for(let rr=r0; rr<=r0+6; rr++){ for(let cc=1; cc<=11; cc++){ const c=ws.getCell(rr,cc); const b={top:thin,bottom:thin,left:thin,right:thin};
      if(rr===r0)b.top=med; if(rr===r0+6)b.bottom=med; if(cc===1)b.left=med; if(cc===11)b.right=med; c.border=b; } }
    row+=7;
  });
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Shizu_chart_${DATESEL.size?[...DATESEL].sort()[0]:YM}.xlsx`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

function applyStatic(){
  const st=$('#t-step'); if(st) st.textContent=tx('step');
  const ch=$('#t-connhint'); if(ch) ch.textContent=tx('connHint');
  const wt=$('#t-wait'); if(wt) wt.textContent=tx('waitConn');
  const cs=$('#conn-state'); const btn=$('#btn-connect');
  if(cs&&btn){ if(!supa){ cs.textContent=tx('notConn'); cs.className='pill'; btn.textContent=tx('connect'); } }
}
window.onSaizenLangChange=function(){
  applyStatic();
  if(typeof _cxSetTitle==='function') _cxSetTitle();                       // 취소 이력 제목 언어 갱신
  { const box=$('#cxbox'); if(box && box.open) loadHist(true); }     // 등록·취소 이력 목록도 현재 언어로 재렌더
  if(supa && $('#ym-label')){ renderUI(); $('#ym-label').textContent=YM;
    const _f=$('#rng-from'),_t=$('#rng-to'); if(_f)_f.value=RFROM; if(_t)_t.value=RTO;   // 언어 재렌더 후 달력 값 복원
    renderDateChips(); renderStats(); renderBoard(); renderPreview();
    const ax=axis(); $('#stat').textContent=`${ax.length}${lang()==='ja'?'日':lang()==='en'?'d':'일'}`;
    $('#btn-print').disabled=!ax.length; }
};

$('#btn-connect').addEventListener('click',connect);
loadCreds();
applyStatic();
if($('#sb-url').value && $('#sb-key').value){ connect(); }

// ── 🚫 취소 이력(cancel_log) — step1 자동 취소 팀/개인. 행사번호·일정·팀·영문명·방해제 ──
const CX_PAGE=40; let _cxRaw=0, _rgRaw=0, _cxLoading=false, _cxDoneC=false, _cxDoneR=false, _cxShown=0;
function _cxT(ko,ja,en){ const l=lang(); return l==='ja'?ja:l==='en'?en:ko; }
// 시즈노야도 관련 취소만: 팀=시즈 방 해제가 있는 취소 / 개인=시즈 방 해제. (다른 시설 취소는 그 섹션 이력에서 확인)
const _cxShzRe=/시즈노야도|志津|しずの/;
function _cxIsShizu(c){
  if(c && c.kind==='team') return (c.rooms||[]).some(m=>_cxShzRe.test(String(m.facility||'')));
  return _cxShzRe.test(String((c&&c.facility)||''));
}
function _cxRowHtml(c, changed_by, changed_at){
  const when=(changed_at||'').replace('T',' ').slice(5,16);
  const team=c.kind==='team'; const ic=team?'🏷':'👤';
  const sched=`${(c.dep||'').slice(5)}~${(c.arr||'').slice(5)}`;
  const who=changed_by?` · ${esc(changed_by)}`:'';
  let main;
  if(team){
    // 시즈 방만 표기(다른 시설 방은 이 화면과 무관하므로 숨김). 시설명은 전부 시즈라 생략, 방(일본어)만.
    const rms=(c.rooms||[]).filter(m=>_cxShzRe.test(String(m.facility||''))).map(m=>`${esc(m.name||'')}${m.eng?(' '+esc(m.eng)):''}(${esc(m.room||'')})`).join(', ');
    main=`<b>${esc(c.rep||'')}</b> · ${c.pax||0}${_cxT('명','名','')}${rms?` · <span style="color:var(--red,#c0392b)">${_cxT('방 해제','部屋解除','room freed')}: ${rms}</span>`:''}`;
  } else {
    const rm=c.room?` · <span style="color:var(--red,#c0392b)">${esc(c.room||'')} ${_cxT('방 해제','部屋解除','room freed')}</span>`:'';
    main=`${esc(c.rep||'')}${c.rep?_cxT('팀 ','チーム ',' team '):''}<b>${esc(c.name||'')}</b>${c.eng?(' '+esc(c.eng)):''}${rm}`;
  }
  return `<div style="display:flex;gap:8px;align-items:baseline;padding:7px 4px;border-top:1px solid var(--border);font-size:12.5px">
    <span style="flex:0 0 16px;text-align:center">${ic}</span>
    <span style="flex:0 0 78px;font-family:var(--mono);color:var(--muted)">${when}</span>
    <span style="flex:0 0 92px;font-family:var(--mono);color:var(--text2)">#${esc(c.no||'')}</span>
    <span style="flex:0 0 84px;font-family:var(--mono);color:var(--muted)">${sched}</span>
    <span style="flex:1;min-width:0">${main}${who}</span>
  </div>`;
}
// 신규 등록 행(초록) — bookings.created_at 기준 시즈 등록
function _rgRowHtml(b){
  const when=(b.created_at||'').replace('T',' ').slice(5,16);
  const sched=`${(b.dep_date||'').slice(5)}~${(b.arr_date||'').slice(5)}`;
  const local=/현지예약/.test(String(b.product_name||''));
  const main=`<b>${esc(b.rep_name||'')}</b> · ${b.pax||0}${_cxT('명','名','')}${local?` <span class="shz-loc">現地</span>`:''} <span style="color:var(--green,#15803D);font-weight:700">${_cxT('신규 등록','新規登録','New')}</span>`;
  return `<div style="display:flex;gap:8px;align-items:baseline;padding:7px 4px;border-top:1px solid var(--border);font-size:12.5px">
    <span style="flex:0 0 16px;text-align:center">➕</span>
    <span style="flex:0 0 78px;font-family:var(--mono);color:var(--muted)">${when}</span>
    <span style="flex:0 0 92px;font-family:var(--mono);color:var(--text2)">${esc(b.event_no||('#'+b.event_seq))}</span>
    <span style="flex:0 0 84px;font-family:var(--mono);color:var(--muted)">${sched}</span>
    <span style="flex:1;min-width:0">${main}</span>
  </div>`;
}
// 등록(bookings.created_at)+취소(cancel_log)를 시간순 병합. 각 소스 페이지 넘겨가며 누적·재정렬.
let _histRows=[];
async function loadHist(reset){
  if(!supa){ $('#cx-list').innerHTML=`<div class="cnt" style="padding:14px;color:var(--muted)">${_cxT('먼저 연결하세요.','先に接続してください。','Connect first.')}</div>`; return; }
  if(_cxLoading) return; _cxLoading=true;
  if(reset){ _cxRaw=0; _rgRaw=0; _cxDoneC=false; _cxDoneR=false; _cxShown=0; _histRows=[]; $('#cx-list').innerHTML=`<div class="cnt" style="padding:14px;color:var(--muted)">…</div>`; }
  try{
    // 취소(시즈만) — CX_PAGE개 모을 때까지 페이지 넘김
    let gotC=0;
    while(gotC<CX_PAGE && !_cxDoneC){
      const {data,error}=await supa.from('change_log').select('changes,changed_by,changed_at')
        .eq('entity','cancel_log').order('changed_at',{ascending:false}).range(_cxRaw,_cxRaw+CX_PAGE-1);
      if(error) throw error;
      const batch=data||[]; _cxRaw+=batch.length; if(batch.length<CX_PAGE) _cxDoneC=true;
      batch.forEach(r=>{ const c=r.changes||{}; if(_cxIsShizu(c)){ _histRows.push({ts:r.changed_at||'', html:_cxRowHtml(c,r.changed_by,r.changed_at)}); gotC++; } });
      if(!batch.length) break;
    }
    // 신규 등록(시즈 상품, created_at desc)
    if(!_cxDoneR){
      const {data,error}=await supa.from('bookings').select('event_seq,event_no,rep_name,pax,dep_date,arr_date,product_name,created_at')
        .ilike('product_name','%시즈노야도%').order('created_at',{ascending:false}).range(_rgRaw,_rgRaw+CX_PAGE-1);
      if(error) throw error;
      const batch=data||[]; _rgRaw+=batch.length; if(batch.length<CX_PAGE) _cxDoneR=true;
      batch.forEach(b=>{ _histRows.push({ts:b.created_at||'', html:_rgRowHtml(b)}); });
    }
    _histRows.sort((a,b)=> a.ts<b.ts?1:a.ts>b.ts?-1:0);
    $('#cx-list').innerHTML=_histRows.map(r=>r.html).join('')||`<div class="cnt" style="padding:14px;color:var(--muted)">${_cxT('시즈노야도 등록·취소 내역이 없습니다.','志津の宿の登録·キャンセル履歴はありません。','No Shizu registrations or cancellations.')}</div>`;
    _cxShown=_histRows.length;
    $('#cx-more').style.display=(_cxDoneC&&_cxDoneR)?'none':'';
  }catch(e){ $('#cx-list').innerHTML=`<div class="cnt" style="padding:14px;color:var(--muted)">${esc(e.message||e)}</div>`; }
  finally{ _cxLoading=false; }
}
function _cxSetTitle(){ const ttl=$('#cx-title'); if(ttl) ttl.innerHTML=`🗂 ${_cxT('등록·취소 이력','登録·キャンセル履歴','Registrations & cancellations')} <span style="font-weight:600;color:var(--muted);font-size:12px">— ${_cxT('시즈노야도 신규 등록·취소 (행사번호·일정·팀·영문명)','志津の宿の新規登録·キャンセル (行事番号·日程·チーム·英文名)','Shizu new/cancelled (event no · dates · team · eng name)')}</span>`; }
function bindCx(){ const box=$('#cxbox'); if(!box) return;
  _cxSetTitle();
  box.addEventListener('toggle',()=>{ if(box.open && !_cxShown) loadHist(true); });
  const mb=$('#cx-more'); if(mb) mb.addEventListener('click',()=>loadHist(false));
}
if(document.readyState!=='loading') bindCx(); else document.addEventListener('DOMContentLoaded',bindCx);
</script>
