<title>Yamanami 운영 관리 · 志津の宿 予約表</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --purple:#7c4dab; --purple2:#5e3a86; --purpleDim:#f0e8f7;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .daychip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer;font-family:inherit}
  .daychip:hover{border-color:var(--accent)}
  .daychip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 13px;min-width:84px;text-align:center}
  .stat .l{font-size:10.5px;color:var(--muted);font-weight:700}
  .stat .v{font-size:19px;font-weight:800;color:var(--accent);font-family:var(--mono)}
  .stat .s{font-size:10px;color:var(--text3,#8a937c)}
  .stat.ons .v{color:var(--purple2)}
  /* 온천 사전신청 패널 */
  .ons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
  .ons-item{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface2);font-size:12.5px}
  .ons-item.on{background:var(--purpleDim);border-color:var(--purple)}
  .ons-item input{width:16px;height:16px;accent-color:var(--purple)}
  .ons-item .rm{font-family:var(--mono);font-size:11px;color:var(--purple2);font-weight:700}
  .ons-item .dt{font-size:10.5px;color:var(--muted)}
  /* 予約表 미리보기(앱 서식 이식) */
  .pv-title{font-size:16px;font-weight:700;text-align:center;margin:6px 0 12px;letter-spacing:.05em}
  .shz-pv{border-collapse:collapse;margin-bottom:14px;width:100%;min-width:900px;font-size:11px}
  .shz-pv th,.shz-pv td{border:1px solid var(--border2);padding:3px 6px;text-align:center;vertical-align:middle}
  .shz-pv-hd th{background:var(--accentSoft);font-weight:700;color:var(--accent)}
  .shz-rno{display:block;font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.5px}
  .shz-pv-zone th{background:var(--surface3);font-weight:800;color:var(--accent);font-size:11px;letter-spacing:.04em}
  .shz-pv-zone th small{font-weight:600;color:var(--muted)}
  .shz-pv-zone th.bz,.shz-pv-hd th.bz{color:var(--purple2)}
  .shz-pv-zone th.bz{background:var(--purpleDim)}
  .shz-pv-dt{background:var(--surface3)!important;font-size:13px;font-weight:700}
  .shz-pv-dt span{font-size:10px;color:var(--muted)}
  .shz-pv-lb{background:var(--surface3);font-weight:700;color:var(--text2);width:78px}
  .shz-pv-nm{text-align:right;background:#eaf2fb}
  .shz-swap{cursor:pointer}
  .shz-swap:hover{outline:2px dashed var(--accent);outline-offset:-2px}
  .shz-sel{outline:2px solid var(--accent)!important;outline-offset:-2px;background:var(--accentSoft)!important}
  .shz-closed{background:#f3ecec!important;color:#b13b2c}
  .shz-pv td:not(.shz-pv-lb):not(.shz-pv-k):not(.shz-pv-note):not(.shz-pv-nm){background:#f2f8fe}
  .shz-pv-k{background:var(--surface3);font-weight:700}
  .shz-pv-note{text-align:left;background:var(--surface);outline:none;min-height:22px;font-weight:600}
  .shz-pv-note:focus{background:var(--accentSoft)}
  .shz-pv-onsen{color:var(--purple2);font-weight:700}
  .shz-pv-bigo{text-align:left;background:#fffdf5;font-size:11px;line-height:1.55;font-weight:600;color:#3a3320}
  .shz-bigo-nm{color:var(--accent);font-weight:800;margin-right:2px}
  .shz-bigo-o{color:#9a8f78;font-weight:400;font-size:10px}
  .shz-annex{display:inline-block;background:var(--purpleDim);color:var(--purple2);border:1px solid var(--purple);border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:800;margin-right:3px}
  .un-badge{display:inline-block;margin-left:5px;background:var(--redDim,#fde8e8);color:var(--red,#c0392b);border:1px solid var(--red,#c0392b);border-radius:99px;padding:0 6px;font-size:10px;font-weight:800;vertical-align:middle}
  .shz-pv-unrow .shz-pv-lb{color:var(--red,#c0392b)}
  .shz-pv-un{text-align:left!important;background:#fdecea;color:var(--red,#c0392b);font-weight:800;cursor:pointer}
  .shz-pv-un:hover{background:#fbdedb}
  .shz-un-go{margin-left:10px;font-size:11px;font-weight:700;color:var(--accent);text-decoration:underline}
  .ap-row{display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid var(--border);border-radius:8px;background:var(--surface2,#fafbf8)}
  .ap-ck{display:flex;align-items:center}
  .ap-nm{font-weight:800;font-size:13px;min-width:88px}
  .ap-tm{flex:1;font-size:11.5px;color:var(--muted)}
  .ap-room{min-width:150px}
  .pv-wrap{overflow-x:auto}
  /* 배정 보드(room.html식 개인 단위) */
  .brd{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
  @media(max-width:820px){.brd{grid-template-columns:1fr}}
  .brd-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .brd-focus{font-size:14px;font-weight:800;color:var(--accent);background:var(--accentSoft);border-radius:99px;padding:3px 12px}
  .brd-selinfo{font-size:12.5px;font-weight:800;color:var(--accent2)}
  .brd-rack{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;max-height:660px;overflow:auto}
  .rk-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:16px 6px}
  .rk-team{background:#fff;border:1px solid var(--border);border-left:3px solid var(--err);border-radius:8px;padding:8px 9px;margin-bottom:8px}
  .rk-team.annex{border-left-color:var(--purple)}
  .rk-hd{font-size:12.5px;font-weight:800;color:var(--text)}
  .rk-hd small{font-weight:600;color:var(--muted);font-size:10.5px}
  .rk-mates{font-size:10.5px;color:var(--accent);margin:2px 0 4px;font-weight:600}
  .rk-mem{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--border2);background:var(--surface3);color:var(--text);border-radius:99px;padding:3px 10px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .brd-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px}
  .rm{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 10px;cursor:pointer;transition:.1s;min-height:80px}
  .rm:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .rm.empty{background:var(--surface2);border-style:dashed}
  .rm.part{border-left:3px solid var(--warn)}
  .rm.full{border-left:3px solid var(--ok)}
  .rm.full3{border-left:3px solid var(--accent2)}
  .rm.closed{background:#f3ecec;border-color:#e3bdb4;cursor:not-allowed;opacity:.75}
  .rm-hd{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;margin-bottom:6px}
  .rm-no{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}
  .rm-zone{font-size:9.5px;font-weight:700;color:var(--accent);background:var(--accentSoft);border-radius:4px;padding:0 5px}
  .rm-zone.bz{color:var(--purple2);background:var(--purpleDim)}
  .rm-cap{margin-left:auto;font-size:11px;font-weight:800;color:var(--text2);font-family:var(--mono)}
  .rm-cap.over{color:var(--err)}
  .oc{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:2px 4px 2px 7px;margin:0 3px 3px 0}
  .oc.onsen{background:var(--purpleDim);border-color:var(--purple);color:var(--purple2)}
  .oc.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .oc .nm{cursor:pointer}
  .oc .x{cursor:pointer;color:var(--err);font-weight:800;border:none;background:none;font-size:12px;padding:0 2px;line-height:1}
  .oc.sel .x{color:#fff}
  .rm-closed{font-size:11px;color:var(--err);font-weight:700}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>

// ── 도메인 상수(앱 shizu 이식) ──
const SHZ_ROOMS=['志津','合歓','北條','山法師','吉祥','瑞雲','馬酔木'];   // 本館 4 + 別棟 3
const SHZ_BYEOLCHE=['吉祥','瑞雲','馬酔木'];
// 호수: 本館 201~204 · 別館 301~303 (순차)
const SHZ_ROOMNO={'志津':'201','合歓':'202','北條':'203','山法師':'204','吉祥':'301','瑞雲':'302','馬酔木':'303'};

function curUser(){ try{ return (window.__so_getUser&&__so_getUser())||''; }catch(e){ return ''; } }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function zen(v){ return String(v).replace(/[0-9]/g,d=>'０１２３４５６７８９'[+d]); }
function titleCase(s){ return String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()); }
function normGender(g){ g=String(g||'').trim(); if(/여|女/.test(g)||/^f/i.test(g))return '女'; if(/남|男/.test(g)||/^m/i.test(g))return '男'; return ''; }
function parseISO(s){ const m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function isoOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthBounds(ym){ const [y,m]=ym.split('-').map(Number); const start=`${y}-${String(m).padStart(2,'0')}-01`; const endD=new Date(y,m,0).getDate(); const end=`${y}-${String(m).padStart(2,'0')}-${String(endD).padStart(2,'0')}`; return {start,end}; }
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}

// ── 한 stay(배정 1행)의 점유 밤 = [ci, co) ──
function nightsOf(g){ const a=parseISO(g.ci), b=parseISO(g.co); if(!a)return []; if(!b||b<=a)return [isoOf(a)]; const out=[]; const d=new Date(a); while(d<b){ out.push(isoOf(d)); d.setDate(d.getDate()+1); } return out; }
function nightsBetween(dep,arr){ return nightsOf({ci:dep,co:arr}); }   // 입~출(체크아웃 전날까지)
function nameOf(g){ return titleCase(g.nameEn)||g.nameKr||''; }
function genderOf(g){ return g.gender||''; }
// 선택 월의 점유 밤(빈 날 테이블 방지)
function axis(){ const set=new Set(); GUESTS.forEach(g=>nightsOf(g).forEach(d=>{ if(d.slice(0,7)===YM) set.add(d); })); UNASSIGNED.forEach(r=>nightsBetween(r.dep,r.arr).forEach(d=>{ if(d.slice(0,7)===YM) set.add(d); })); return [...set].sort(); }
// 화면·인쇄·xlsx 공통 대상 날짜: 특정일 선택 시 그날만, 아니면 그 달 전체
function activeDates(){ const ax=axis(); return (DATESEL && ax.includes(DATESEL)) ? [DATESEL] : ax; }
function cellOcc(room,date){ return GUESTS.filter(g=>g.room_no===room && nightsOf(g).includes(date)).sort((a,b)=>(a.ci||'').localeCompare(b.ci||'')); }
function mf(occ){ let m=0,f=0,u=0; occ.forEach(g=>{const x=genderOf(g); if(x==='男')m++; else if(x==='女')f++; else u++;}); const p=[]; if(m)p.push('男　'+zen(m)); if(f)p.push('女　'+zen(f)); if(u)p.push('（未）'+zen(u)); return p.join('　　'); }
function onsenSummary(){ let persons=0, fee=0; GUESTS.forEach(g=>{ if(g.onsen && SHZ_BYEOLCHE.includes(g.room_no)){ const n=nightsOf(g).filter(d=>d.slice(0,7)===YM).length; if(n>0){ persons++; fee+=SHZ_ONSEN*n; } } }); return {persons,fee}; }

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('loginNeed'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML=`<div class="panel"><div class="deny">${tx('loginCard')}<small>${tx('loginCardSub')}</small></div></div>`; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;
    YM=YM||thisYM();
    renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

async function pagedIn(table, cols, key, vals){
  const out=[]; const uniq=[...new Set(vals)];
  for(let i=0;i<uniq.length;i+=80){
    const chunk=uniq.slice(i,i+80);
    let from=0;
    for(;;){ const {data,error}=await supa.from(table).select(cols).in(key,chunk).range(from,from+999); if(error)throw error; out.push(...(data||[])); if(!data||data.length<1000)break; from+=1000; }
  }
  return out;
}

async function load(){
  if(!supa)return;
  $('#ym-label').textContent=YM; $('#stat').textContent=tx('statLoading'); $('#btn-print').disabled=true;
  NOTES={}; BSEL.clear();
  try{
    const {start,end}=monthBounds(YM);
    // 시즈노야도 배정(월 겹침): check_in <= 월말 AND check_out > 월초
    const {data:rms,error}=await supa.from('rooms').select('id,inventory_id,member_id,event_seq,room_no,check_in,check_out,assigned_pax,assign_source')
      .eq('facility',FACILITY).lte('check_in',end).gt('check_out',start).not('member_id','is',null);
    if(!SHZ_INV){ try{ const {data:inv}=await supa.from('room_inventory').select('id,room_no').eq('facility',FACILITY); SHZ_INV={}; SHZ_INVROOM={}; (inv||[]).forEach(x=>{SHZ_INV[x.room_no]=x.id; SHZ_INVROOM[x.id]=x.room_no;}); }catch(e){ SHZ_INV={}; SHZ_INVROOM={}; } }
    // 객실 폐쇄
    try{ const invIds=Object.values(SHZ_INV||{}); CLOSURES=[]; if(invIds.length){ const {data:cl}=await supa.from('room_closures').select('id,inventory_id,from_date,to_date,reason').in('inventory_id',invIds); CLOSURES=(cl||[]).map(c=>({...c,room_no:SHZ_INVROOM[c.inventory_id]||'',from_date:String(c.from_date).slice(0,10),to_date:String(c.to_date).slice(0,10)})); } }catch(e){ CLOSURES=[]; }
    if(error)throw error;
    const rows=(rms||[]).filter(r=>r.member_id && SHZ_ROOMS.includes(r.room_no));
    const mids=rows.map(r=>r.member_id), seqs=rows.map(r=>r.event_seq).filter(Boolean);
    // guest_members(영문/한글명)
    const gms = mids.length? await pagedIn('guest_members','id,event_seq,name_kr,name_en','id',mids) : [];
    const gmMap={}; gms.forEach(g=>gmMap[g.id]=g);
    // passengers(성별) — seq_in_team 불일치 → event_seq+이름으로 매칭
    const pxs = seqs.length? await pagedIn('passengers','event_seq,name_kr,gender','event_seq',seqs) : [];
    const genMap={}; pxs.forEach(p=>{ const k=p.event_seq+'|'+String(p.name_kr||'').trim(); if(!genMap[k]) genMap[k]=normGender(p.gender); });
    // 온천 사전신청
    const ons = mids.length? await pagedIn('shizu_onsen','member_id,applied','member_id',mids) : [];
    const onSet=new Set(ons.filter(o=>o.applied).map(o=>o.member_id));
    // 현장 물채우기 박수(팀 단위, 기록용)
    WATER={}; try{ const wf = seqs.length? await pagedIn('shizu_water_fill','event_seq,nights','event_seq',seqs):[]; wf.forEach(w=>{ WATER[w.event_seq]=w.nights||0; }); }catch(e){ WATER={}; }
    // 비고·현지비고(+일본어 캐시) — 예약표 참고용
    const bks = seqs.length? await pagedIn('bookings','event_seq,rep_name,remark,remark_local,remark_ja,remark_local_ja','event_seq',seqs) : [];
    BOOK={}; bks.forEach(b=>BOOK[b.event_seq]=b);
    // 담당자 메모(영속) — 그 달 범위
    MEMOS={}; try{ const {data:mm}=await supa.from('shizu_memo').select('memo_date,note').gte('memo_date',start).lte('memo_date',end); (mm||[]).forEach(m=>{ MEMOS[String(m.memo_date).slice(0,10)]=m.note||''; }); }catch(e){}
    GUESTS = rows.map(r=>{
      const gm=gmMap[r.member_id]||{};
      const nameKr=String(gm.name_kr||'').trim();
      return { id:r.id, invId:r.inventory_id, member_id:r.member_id, event_seq:r.event_seq, room_no:r.room_no,
        ci:String(r.check_in).slice(0,10), co:String(r.check_out).slice(0,10), src:r.assign_source||'auto',
        nameKr, nameEn:gm.name_en||'', gender:genMap[r.event_seq+'|'+nameKr]||'', onsen:onSet.has(r.member_id) };
    });
    // ── 전체 로스터(미배정 추적): 그 달 시즈 팀 전원 − 배정된 사람 = 미배정 ──
    try{
      const {data:tgs}=await supa.from('guests').select('event_seq,accom,bookings!inner(dep_date,arr_date)').eq('accom',FACILITY);
      const tMap={};
      (tgs||[]).forEach(g=>{ const dep=String((g.bookings||{}).dep_date||'').slice(0,10), arr=String((g.bookings||{}).arr_date||'').slice(0,10);
        if(dep&&arr&&dep<=end&&arr>start) tMap[g.event_seq]={dep,arr}; });
      const tSeqs=Object.keys(tMap).map(Number);
      const rgms=tSeqs.length? await pagedIn('guest_members','id,event_seq,name_kr,name_en','event_seq',tSeqs) : [];
      const asg=new Set(GUESTS.map(g=>g.member_id));
      ROSTER=rgms.map(m=>{ const t=tMap[m.event_seq]||{}; return {member_id:m.id,event_seq:m.event_seq,dep:t.dep,arr:t.arr,nameKr:m.name_kr||'',nameEn:m.name_en||''}; }).filter(r=>r.dep&&r.arr);
      UNASSIGNED=ROSTER.filter(r=>!asg.has(r.member_id));
      UNBYDATE={}; UNASSIGNED.forEach(r=>nightsBetween(r.dep,r.arr).forEach(d=>{ if(d.slice(0,7)===YM) UNBYDATE[d]=(UNBYDATE[d]||0)+1; }));
    }catch(e){ ROSTER=[]; UNASSIGNED=[]; UNBYDATE={}; }
    const ax=axis();
    if(DATESEL && !ax.includes(DATESEL)) DATESEL=null;   // 다른 달로 넘어가면 선택 해제
    renderDateChips(); renderStats(); renderOnsenPanel(); renderBoard(); renderPreview();
    $('#stat').textContent=`${ax.length}${lang()==='ja'?'日':lang()==='en'?'d':'일'}`;
    $('#btn-print').disabled=!ax.length;
    translateRemarks();   // 미번역 비고 → DeepL(엣지) 번역 후 재렌더(비차단)
  }catch(e){ toast(tx('connFail')+': '+e.message,'err'); $('#stat').textContent=''; }
}

function renderDateChips(){

  let html=chip('',tx('allDays'),!DATESEL);
  ax.forEach(d=>{ const dt=parseISO(d); const un=UNBYDATE[d]||0; const lb=`${dt.getMonth()+1}/${dt.getDate()}<small style="opacity:.7">(${SHZ_DOW[dt.getDay()]})</small>${un?`<span class="un-badge">未${un}</span>`:''}`; html+=chip(d,lb,DATESEL===d); });

}

  const byTeam={};
  GUESTS.filter(g=>SHZ_BYEOLCHE.includes(g.room_no) && nightsOf(g).some(d=>d.slice(0,7)===YM))

  const rows=teams.map(seq=>{
    const ms=byTeam[seq].filter((g,i,a)=>a.findIndex(x=>x.member_id===g.member_id)===i);   // member 중복 제거
    ms.sort((a,b)=>(a.room_no||'').localeCompare(b.room_no||'')||(a.ci||'').localeCompare(b.ci||''));

  }).sort((a,b)=>(a.rooms||'').localeCompare(b.rooms||'')||(a.ci||'').localeCompare(b.ci||''));
  const totWater=Object.values(WATER).reduce((s,n)=>s+(parseInt(n,10)||0),0);
  el.innerHTML=`<div class="ons-grid">${rows.map(t=>`
    <div class="ons-item${t.allOn?' on':''}" style="display:flex;align-items:center;gap:6px">
      <label style="display:flex;align-items:center;gap:6px;flex:1;cursor:pointer;min-width:0">
        <input type="checkbox" ${t.allOn?'checked':''} onchange="toggleOnsenTeam('${t.seq}',this.checked)">
        <span class="rm">${esc(t.rooms)}</span>
        <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.nm)}様 <small style="color:var(--muted)">${t.n}名</small></span>
        <span class="dt">${esc((t.ci||'').slice(5))}~${esc((t.co||'').slice(5))}</span>
      </label>
      <span class="wf" title="${tx('waterTip')}" style="display:inline-flex;align-items:center;gap:2px;font-size:11.5px;color:var(--text2);white-space:nowrap">💧<input type="number" min="0" value="${WATER[t.seq]||0}" onchange="saveWaterFill('${t.seq}',this.value)" style="width:38px;padding:2px 4px;border:1px solid var(--border2);border-radius:5px;font-size:12px">${tx('nightUnit')}</span>
    </div>`).join('')}</div>
    ${totWater?`<div class="cnt" style="margin-top:7px;color:var(--accent2);font-weight:700">💧 ${tx('waterTotal')(totWater)} · ¥${(totWater*SHZ_WATER).toLocaleString()} <small style="color:var(--muted);font-weight:500">(${tx('waterNote')})</small></div>`:''}`;
}

// 팀 단위 온천 사전신청 토글 — 그 팀의 別棟 배정 인원 전원에 일괄 적용(개인 shizu_onsen에 기록)
async function toggleOnsenTeam(seq, on){
  if(!supa)return;
  const ms=GUESTS.filter(g=>String(g.event_seq)===String(seq) && SHZ_BYEOLCHE.includes(g.room_no) && nightsOf(g).some(d=>d.slice(0,7)===YM));
  const ids=[...new Set(ms.map(g=>g.member_id))];
  try{
    if(on){
      const rows=ids.map(id=>({member_id:id,applied:true,session_ym:YM,updated_by:curUser(),updated_at:new Date().toISOString()}));
      const {error}=await supa.from('shizu_onsen').upsert(rows,{onConflict:'member_id'}); if(error)throw error;
    }else{
      const {error}=await supa.from('shizu_onsen').delete().in('member_id',ids); if(error)throw error;
    }
    GUESTS.forEach(g=>{ if(ids.includes(g.member_id)) g.onsen=on; });
    renderStats(); renderOnsenPanel(); renderBoard(); renderPreview();
  }catch(e){ toast(tx('connFail')+': '+e.message,'err'); renderOnsenPanel(); }
}

// 현장 물채우기 박수 기록(팀 단위, 청구 아님·표시/집계용). 0이면 삭제.
async function saveWaterFill(seq, val){
  if(!supa)return;
  const nights=Math.max(0, parseInt(val,10)||0);
  WATER[seq]=nights;
  try{
    if(nights>0){ const {error}=await supa.from('shizu_water_fill').upsert({event_seq:Number(seq),nights,updated_by:curUser(),updated_at:new Date().toISOString()},{onConflict:'event_seq'}); if(error)throw error; }
    else { const {error}=await supa.from('shizu_water_fill').delete().eq('event_seq',Number(seq)); if(error)throw error; }
    renderOnsenPanel();
  }catch(e){ toast(tx('connFail')+': '+e.message,'err'); }
}

// ══ 배정 보드(room.html식 개인 단위: 미배정 행거 + 객실 카드 · 이동/병합) ══
function boardDate(){ const ax=axis(); if(!ax.length) return null; return (DATESEL && ax.includes(DATESEL))?DATESEL:ax[0]; }
function fmtDate(d){ const dt=parseISO(d); return dt?`${dt.getMonth()+1}/${dt.getDate()}(${SHZ_DOW[dt.getDay()]})`:d; }
// member_id → 그 사람의 체류구간(팀 입~출). ROSTER 우선(배정·미배정 모두), 없으면 GUESTS 행.
function memSpan(mid){ const r=ROSTER.find(x=>x.member_id===mid); if(r&&r.dep&&r.arr) return {dep:r.dep,arr:r.arr}; const g=GUESTS.find(x=>x.member_id===mid); return g?{dep:g.ci,arr:g.co}:null; }
// 미배정 팀(그 밤 체류) 목록 — 팀별 그룹 + 이미 배정된 짝(같은 팀)방 표시
function rackTeams(date){
  const list=UNASSIGNED.filter(r=>nightsBetween(r.dep,r.arr).includes(date));
  const byTeam={}; list.forEach(r=>{ (byTeam[r.event_seq]=byTeam[r.event_seq]||[]).push(r); });
  return Object.keys(byTeam).map(seq=>{
    const ms=byTeam[seq].slice().sort((a,b)=>shzMemName(a).localeCompare(shzMemName(b)));
    const bk=BOOK[seq]||{};
    const mates=GUESTS.filter(g=>String(g.event_seq)===String(seq))
      .filter((g,i,a)=>a.findIndex(x=>x.member_id===g.member_id)===i)
      .map(g=>({nm:nameOf(g),room:g.room_no}));
    const annex=SHZ_ANNEX_RE.test(String(bk.remark_local||'')+' '+String(bk.remark||''));
    return {seq,rep:bk.rep_name||'',ms,mates,annex,dep:ms[0].dep,arr:ms[0].arr};
  }).sort((a,b)=>(a.dep||'').localeCompare(b.dep||'')||(a.seq-b.seq));
}
function renderBoard(){
  const board=$('#board'); if(!board) return;
  const date=boardDate();
  const fl=$('#brd-focus'), si=$('#brd-selinfo');
  if(!date){ board.innerHTML=`<div class="rk-empty">${tx('noFocus')}</div>`; if(fl)fl.textContent=''; if(si)si.textContent=''; return; }
  if(fl) fl.textContent=tx('focusLbl')(fmtDate(date));
  if(si) si.textContent=BSEL.size?tx('selN')(BSEL.size):'';
  const teams=rackTeams(date);
  const rackHtml = teams.length ? teams.map(t=>`
    <div class="rk-team${t.annex?' annex':''}">
      <div class="rk-hd">${esc(t.rep||('#'+t.seq))}様 <small>#${t.seq} · ${esc(t.dep.slice(5))}~${esc(t.arr.slice(5))}</small>${t.annex?' <span style="color:var(--purple2)">♨別棟</span>':''}</div>
      ${t.mates.length?`<div class="rk-mates">🛏 ${t.mates.map(m=>esc(m.room+' '+m.nm)).join(' · ')}</div>`:''}
      <div class="rk-mem">${t.ms.map(m=>`<button class="chip${BSEL.has(m.member_id)?' on':''}" onclick="bToggleSel('${m.member_id}')">${esc(shzMemName(m))}様</button>`).join('')}</div>
    </div>`).join('') : `<div class="rk-empty">${tx('unNone')}</div>`;
  const roomsHtml=SHZ_ROOMS.map(room=>{
    const occ=cellOcc(room,date), closed=roomClosedOnDate(room,date), bz=SHZ_BYEOLCHE.includes(room), used=occ.length;
    const cls=closed?'closed':used===0?'empty':used>=3?'full3':used>=2?'full':'part';
    const onsenHere=bz&&occ.some(g=>g.onsen);
    const clReason=closed?((CLOSURES.find(c=>c.room_no===room&&c.from_date<=date&&date<=c.to_date)||{}).reason||''):'';
    const body=closed
      ? `<div class="rm-closed">🔒 ${esc(clReason||tx('swapClosedT'))}</div>`
      : (occ.length? occ.map(g=>`<span class="oc${(g.onsen&&bz)?' onsen':''}${BSEL.has(g.member_id)?' sel':''}"><span class="nm" onclick="event.stopPropagation();bToggleSel('${g.member_id}')">${esc(nameOf(g))}様</span><button class="x" onclick="event.stopPropagation();bUnassign('${g.member_id}')">✕</button></span>`).join('') : `<div class="cnt" style="color:var(--muted)">—</div>`);
    return `<div class="rm ${cls}"${closed?'':` onclick="bPlace('${room}')"`}>
      <div class="rm-hd"><span class="rm-no">${SHZ_ROOMNO[room]||''}</span>${room}<span class="rm-zone${bz?' bz':''}">${bz?tx('annexLbl'):tx('mainLbl')}</span>${onsenHere?' <span style="color:var(--purple2)">♨</span>':''}<span class="rm-cap${used>2?' over':''}">${used}/2</span></div>
      ${body}</div>`;
  }).join('');
  board.innerHTML=`<div class="brd-rack"><div class="cnt" style="font-weight:800;color:var(--err);margin-bottom:7px">⚠ ${tx('rackH')}</div>${rackHtml}</div><div class="brd-rooms">${roomsHtml}</div>`;
}
function bToggleSel(mid){ if(BSEL.has(mid))BSEL.delete(mid); else BSEL.add(mid); renderBoard(); }
// 선택 인원을 room에 배정/이동/병합(개인 단위). 정원(3)·폐쇄 초과는 스킵.
async function bPlace(room){
  if(!supa||!SHZ_INV){ toast(tx('connFail'),'err'); return; }
  if(!BSEL.size){ toast(tx('placeNone'),'warn'); return; }
  const inv=SHZ_INV[room]; if(!inv){ toast(tx('swapNoInv'),'err'); return; }
  const ids=[...BSEL], sel=new Set(ids), accepted=[]; let skipped=0;
  ids.forEach(mid=>{
    const sp=memSpan(mid); if(!sp||roomClosed(room,sp.dep,sp.arr)){ skipped++; return; }
    let used=0;
    GUESTS.forEach(g=>{ if(g.room_no===room && !sel.has(g.member_id) && g.ci<sp.arr && sp.dep<g.co) used++; });   // 기존 점유(이동 대상 제외)
    accepted.forEach(a=>{ if(a.dep<sp.arr && sp.dep<a.arr) used++; });                                          // 이번에 같이 넣는 인원
    if(used+1>3){ skipped++; return; }
    accepted.push({mid,dep:sp.dep,arr:sp.arr});
  });
  if(!accepted.length){ toast(tx('placeBlocked'),'warn'); return; }
  const prows=accepted.map(a=>({member_id:a.mid,inventory_id:inv,room_no:room,check_in:a.dep,check_out:a.arr}));
  try{
    const {data:n,error}=await supa.rpc('shizu_place',{p_rows:prows});
    if(error)throw error;
    const placed=(typeof n==='number')?n:prows.length;
    const miss=skipped+Math.max(0,prows.length-placed);
    BSEL.clear();
    toast(tx('placeDone')(placed)+(miss?tx('placeSkip')(miss):''),'ok'); load();
  }catch(e){ toast(tx('apFail')+(e.message||e),'err'); }
}
// 개인 배정 해제(미배정 행거로)
async function bUnassign(mid){
  if(!supa){ toast(tx('connFail'),'err'); return; }
  try{
    const {error}=await supa.rpc('shizu_unassign',{p_member_ids:[mid]});
    if(error)throw error;
    BSEL.delete(mid); toast(tx('unDone'),'ok'); load();
  }catch(e){ toast(tx('apFail')+(e.message||e),'err'); }
}

// ── 予約表 미리보기(앱 shzRenderPreview 이식) ──
function buildNoteAuto(date){
  const notes={};
  SHZ_ROOMS.forEach(room=>{ const occ=cellOcc(room,date); if(!occ.length)return; const rep=occ[0];
    const sq={}; occ.forEach(g=>sq[g.event_seq]=(sq[g.event_seq]||0)+1);
    Object.keys(sq).forEach(k=>{ notes[k]={nm:nameOf(rep),c:(notes[k]?notes[k].c:0)+sq[k]}; }); });
  return Object.values(notes).filter(x=>x.c>0).map(x=>`${x.nm}様${zen(x.c)}名`).join('　');
}
// ── 비고·현지비고 일본어 번역(DeepL 엣지) — 미번역만 요청 후 캐시·재렌더 ──
const hasKo=s=>/[가-힣]/.test(String(s||''));
async function translateRemarks(){
  if(!supa) return;
  const items=[];
  Object.values(BOOK).forEach(b=>{
    const needR = b.remark && hasKo(b.remark) && !b.remark_ja;
    const needL = b.remark_local && hasKo(b.remark_local) && !b.remark_local_ja;
    if(needR||needL) items.push({ event_seq:b.event_seq, remark:needR?b.remark:'', remark_local:needL?b.remark_local:'' });
  });
  if(!items.length) return;
  try{
    const {data,error}=await supa.functions.invoke('translate-remarks',{body:{items}});
    if(error) throw error;
    if(data&&data.error) throw new Error(data.error);
    const res=(data&&data.results)||{};
    Object.keys(res).forEach(seq=>{ const b=BOOK[seq]; if(!b)return;
      if(res[seq].remark_ja!=null) b.remark_ja=res[seq].remark_ja;
      if(res[seq].remark_local_ja!=null) b.remark_local_ja=res[seq].remark_local_ja; });
    renderPreview();
  }catch(e){ /* DeepL 미설정(보류) 등 실패 시 조용히 원문 표시 — 사용자에게 에러 토스트 안 띄움 */ try{ console.debug('translateRemarks skipped:', e&&e.message); }catch(_){} }
}
// 특정 날짜에 묵는 팀들의 비고(일본어 우선·원문 병기) HTML
function bigoFor(date){
  const seen=new Set(), seqs=[];
  SHZ_ROOMS.forEach(room=>cellOcc(room,date).forEach(g=>{ if(!seen.has(g.event_seq)){ seen.add(g.event_seq); seqs.push(g.event_seq); } }));
  const parts=[];
  seqs.forEach(seq=>{
    const b=BOOK[seq]; if(!b)return;
    const rep=String(b.rep_name||'').trim();
    // 현지비고에 '별채/별관/別棟/別館' 포함 = 別棟 사전신청 → 객실 개인욕탕 물 채우기 필요
    const annex=SHZ_ANNEX_RE.test(String(b.remark_local||'')+' '+String(b.remark||''));
    const segs=[];
    const add=(orig,ja)=>{ orig=String(orig||'').replace(/\s*[\r\n]+\s*/g,' ').trim(); if(!orig)return;
      const jaT=String(ja||'').replace(/\s*[\r\n]+\s*/g,' ').trim();
      if(jaT && jaT!==orig) segs.push(`<b>${esc(jaT)}</b> <span class="shz-bigo-o">(${esc(orig)})</span>`);
      else segs.push(esc(orig)); };
    add(b.remark_local, b.remark_local_ja);   // 현지비고(현장 전달) 우선
    add(b.remark, b.remark_ja);
    const head=annex?`<span class="shz-annex">♨ 別棟 浴槽準備</span> `:'';
    if(segs.length||annex) parts.push(`<span class="shz-bigo-t">${head}<b class="shz-bigo-nm">${esc(rep)}様</b> ${segs.join('　/　')}</span>`);
  });
  return parts.join('<br>');
}

// ── 예약표에서 방 맞바꾸기 / 빈 객실 이동 (rooms 직접 수정 · RPC 경유) ──
//   방 이름 클릭 → 선택(하이라이트) → 다른 방 클릭 = 그 방 팀과 맞바꾸기(빈 방이면 이동).
//   대상은 그 날짜에 겹치는 팀의 '체류 전체'(각 멤버 배정행). 같은 날짜 안에서만.
function shzCellClick(room,date){
  if(!SEL){ if(!cellOcc(room,date).length){ toast(tx('swapPickFirst'),'warn'); return; } SEL={room,date}; renderPreview(); return; }
  if(SEL.date!==date){ SEL=cellOcc(room,date).length?{room,date}:null; renderPreview(); return; }  // 다른 날짜=새 선택
  if(SEL.room===room){ SEL=null; renderPreview(); return; }   // 같은 칸=취소
  swapOrMove(SEL.room, room, date);
}
async function swapOrMove(srcRoom,tgtRoom,date){
  if(!supa || !SHZ_INV){ toast(tx('connFail'),'err'); return; }
  const srcOcc=cellOcc(srcRoom,date), tgtOcc=cellOcc(tgtRoom,date);
  if(!srcOcc.length){ SEL=null; renderPreview(); return; }
  const srcInv=SHZ_INV[srcRoom], tgtInv=SHZ_INV[tgtRoom];
  if(!srcInv||!tgtInv){ toast(tx('swapNoInv'),'err'); return; }
  const move = tgtOcc.length===0;
  const srcIds=srcOcc.map(g=>g.id), tgtIds=tgtOcc.map(g=>g.id);
  const exAll=new Set(srcIds.concat(tgtIds));
  // 충돌: 대상 방이 옮겨갈 팀 체류기간에 (서로 외) 다른 팀으로 차 있으면 불가
  const conflict=(roomNo,rows)=> GUESTS.some(g=> g.room_no===roomNo && !exAll.has(g.id) && rows.some(r=> g.ci<r.co && r.ci<g.co));
  if(conflict(tgtRoom,srcOcc) || (!move && conflict(srcRoom,tgtOcc))){ toast(tx('swapConflict'),'err'); return; }
  // 폐쇄된 객실로는 이동/맞바꾸기 불가
  if(roomClosed(tgtRoom,srcOcc[0].ci,srcOcc[0].co) || (!move && roomClosed(srcRoom,tgtOcc[0].ci,tgtOcc[0].co))){ toast(tx('swapClosedT'),'err'); return; }
  const repNm=(nameOf(srcOcc[0])||srcOcc[0].nameKr||'');
  const msg = move ? `${repNm}様 · ${srcRoom} → ${tgtRoom}\n${tx('swapMoveAsk')}` : `${srcRoom} ↔ ${tgtRoom}\n${tx('swapAsk')}`;
  if(!confirm(msg)) return;
  try{
    const {error}=await supa.rpc('shizu_swap_rooms',{
      p_src_ids:srcIds, p_src_room:srcRoom, p_src_inv:srcInv,
      p_tgt_ids:(move?[]:tgtIds), p_tgt_room:tgtRoom, p_tgt_inv:tgtInv });
    if(error)throw error;
    SEL=null; toast(tx('swapDone'),'ok'); load();
  }catch(e){ toast(tx('swapFail')+(e.message||e),'err'); }
}

// ── 객실 폐쇄 판정 ──
function roomClosed(room,ci,co){ return CLOSURES.some(c=>c.room_no===room && ci<=c.to_date && co>c.from_date); }   // 체류구간 겹침
function roomClosedOnDate(room,date){ return CLOSURES.some(c=>c.room_no===room && c.from_date<=date && date<=c.to_date); }

// ── 자동배정: 미배정 인원을 本館·別棟 2인1실(무조건 2인). 남는 1명=1인 1실. 北條은 최후 ──
//   · auto 배정은 그 달치 전부 정리 후 재배치(manual/맞바꿈/수기추가는 보존).
//   · 현지비고 별채/별관 팀 = 別棟 우선. 방 부족 = 미배정(예약표에 未N 표기).
async function autoAssignShizu(){
  if(!supa||!SHZ_INV){ toast(tx('connFail'),'err'); return; }
  const {start,end}=monthBounds(YM);
  try{
    const {data:gs}=await supa.from('guests').select('event_seq,accom,bookings!inner(dep_date,arr_date)').eq('accom',FACILITY);
    const teams=(gs||[]).map(g=>({seq:g.event_seq,dep:String((g.bookings||{}).dep_date||'').slice(0,10),arr:String((g.bookings||{}).arr_date||'').slice(0,10)}))
      .filter(t=>t.dep&&t.arr&&t.dep<=end&&t.arr>start);
    if(!teams.length){ toast(tx('autoNone'),'warn'); return; }
    const seqs=[...new Set(teams.map(t=>t.seq))];
    const gms=seqs.length? await pagedIn('guest_members','id,event_seq','event_seq',seqs) : [];
    const bks=seqs.length? await pagedIn('bookings','event_seq,remark,remark_local','event_seq',seqs) : [];
    const bkMap={}; bks.forEach(b=>bkMap[b.event_seq]=b);
    // 수기(맞바꿈·강제추가)만 점유 시드로 보존 — auto는 서버에서 정리 후 새로 채움
    const manual=GUESTS.filter(g=>g.src==='manual');
    const keep=new Set(manual.map(g=>g.member_id));
    const byTeam={}; gms.forEach(m=>{ if(!keep.has(m.id)){ (byTeam[m.event_seq]=byTeam[m.event_seq]||[]).push(m.id); } });
    // 현지비고에 별채/별관 포함 = 別棟(별채) 선호
    const annexPref={}; teams.forEach(t=>{ const b=bkMap[t.seq]||{}; annexPref[t.seq]=SHZ_ANNEX_RE.test(String(b.remark_local||'')+' '+String(b.remark||'')); });
    //  · 別棟 선호팀: 별채(吉祥·瑞雲·馬酔木) 먼저 → 본관 → 北條 마지막
    //  · 일반팀: 본관(志津·合歓·山法師) → 별채 → 北條 마지막  (北條은 항상 최후)
    const POOL_ANNEX=['吉祥','瑞雲','馬酔木','志津','合歓','山法師','北條'];
    const POOL_MAIN =['志津','合歓','山法師','吉祥','瑞雲','馬酔木','北條'];
    const pending=[];
    // 점유 = 수기 배정(manual) + 이번 배치(pending)  (auto 기존분은 정리되므로 제외)
    const occ=(room,ci,co)=>{ let n=0; manual.forEach(g=>{ if(g.room_no===room && g.ci<co && ci<g.co) n++; }); pending.forEach(p=>{ if(p.room===room && p.ci<co && ci<p.co) n+=p.cnt; }); return n; };
    const rows=[]; let holds=0;
    // 무조건 2인 1실: 2명씩 묶고, 남는 1명은 1인 1실.  예 2→[2] · 3→[2,1] · 4→[2,2] · 5→[2,2,1]
    const chunkTeam=(n)=>{ const out=[]; while(n>=2){ out.push(2); n-=2; } if(n===1) out.push(1); return out; };
    const placeTeam=(t)=>{
      const mem=byTeam[t.seq]; if(!mem||!mem.length) return;
      if(mem.length===3){ holds+=3; return; }   // 3명팀은 2+1 분리배정하지 않고 통째로 미배정(현장 수기)
      const pool=annexPref[t.seq]?POOL_ANNEX:POOL_MAIN;
      const sizes=chunkTeam(mem.length); let idx=0;
      for(const sz of sizes){
        const chunk=mem.slice(idx,idx+sz); idx+=sz; let placed=false;
        for(const room of pool){
          const inv=SHZ_INV[room]; if(!inv) continue;
          if(roomClosed(room,t.dep,t.arr)) continue;         // 폐쇄 제외
          if(occ(room,t.dep,t.arr)===0){                     // 빈 방만(팀 혼합 방지)
            chunk.forEach(mid=>rows.push({member_id:mid,inventory_id:inv,room_no:room,check_in:t.dep,check_out:t.arr}));
            pending.push({room,ci:t.dep,co:t.arr,cnt:chunk.length}); placed=true; break;
          }
        }
        if(!placed) holds+=chunk.length;   // 방 부족 = 미배정(未N)
      }
    };
    const sorted=teams.slice().sort((a,b)=>a.seq-b.seq);
    sorted.filter(t=>annexPref[t.seq]).forEach(placeTeam);   // 별채 선호팀 먼저(별채 확보)
    sorted.filter(t=>!annexPref[t.seq]).forEach(placeTeam);  // 그다음 일반팀
    if(!rows.length){ toast(tx('autoNone'),'warn'); return; }
    if(!confirm(tx('autoConfirm')(rows.length))) return;
    const {data:placedN,error}=await supa.rpc('shizu_assign_rooms',{p_rows:rows,p_clear_from:start,p_clear_to:end});
    if(error)throw error;
    // RPC는 정원초과 행을 건너뛰고 '되는 데까지' 배정 → 실제 배정 수·미배정 수 반영
    const placed=(typeof placedN==='number')?placedN:rows.length;
    const unplaced=holds + Math.max(0, rows.length-placed);
    toast(tx('autoDone')(placed)+(unplaced?` · ${tx('autoHold')(unplaced)}`:''),'ok'); load();
  }catch(e){ toast(tx('autoFail')+(e.message||e),'err'); }
}

// ── 미배정 인원 수기 배정(2인 초과 강제추가 포함) ──
//   해당 날짜 미배정자 목록 → 각자 방 선택 → shizu_assign_rooms(src:'manual', 정원가드=최대3) ──
function shzRoomOccSpan(room,dep,arr){ let n=0; GUESTS.forEach(g=>{ if(g.room_no===room && g.ci<arr && dep<g.co) n++; }); return n; }
function shzMemName(r){ return titleCase(r.nameEn)||r.nameKr||String(r.member_id||'').slice(0,6); }
function openShzAssignPicker(date){
  if(!supa||!SHZ_INV){ toast(tx('connFail'),'err'); return; }
  const list=UNASSIGNED.filter(r=>nightsBetween(r.dep,r.arr).includes(date));
  if(!list.length){ toast(tx('unNone'),'warn'); return; }
  const old=document.getElementById('ap-back'); if(old) old.remove();
  // 팀별 정렬(같은 팀 연속) — 강제추가 파악 쉽게
  list.sort((a,b)=>(a.event_seq-b.event_seq)||shzMemName(a).localeCompare(shzMemName(b)));
  const rowHtml=list.map((r,i)=>{
    const rep=(BOOK[r.event_seq]||{}).rep_name||'';
    // 같은 팀원이 이미 배정된 방(강제추가 대상) 우선 프리셀렉트
    const mateRoom=(GUESTS.find(g=>g.event_seq===r.event_seq && g.ci<r.arr && r.dep<g.co)||{}).room_no||'';
    const opts=SHZ_ROOMS.map(room=>{
      const n=shzRoomOccSpan(room,r.dep,r.arr); const closed=roomClosed(room,r.dep,r.arr);
      const full=n>=3; const dis=closed||full;
      const sel=(mateRoom&&room===mateRoom)?' selected':'';
      return `<option value="${room}"${sel}${dis?' disabled':''}>${(SHZ_ROOMNO[room]||'')} ${room} (${n}/3)${closed?' 🔒':''}${full?' ✕':''}</option>`;
    }).join('');
    // mate 없으면 첫 빈방 프리셀렉트
    const firstEmpty=SHZ_ROOMS.find(room=>!roomClosed(room,r.dep,r.arr)&&shzRoomOccSpan(room,r.dep,r.arr)===0)||'';
    const preOpts = mateRoom ? opts : opts.replace(`value="${firstEmpty}"`,`value="${firstEmpty}" selected`);
    return `<div class="ap-row" data-mid="${r.member_id}" data-dep="${r.dep}" data-arr="${r.arr}">
      <label class="ap-ck"><input type="checkbox" class="ap-sel" checked></label>
      <span class="ap-nm">${esc(shzMemName(r))}様</span>
      <span class="ap-tm">${esc(rep?rep+'様':'#'+r.event_seq)} · ${esc(r.dep.slice(5))}~${esc(r.arr.slice(5))}</span>
      <select class="inp sm ap-room">${preOpts}</select>
    </div>`;
  }).join('');
  const back=document.createElement('div'); back.id='ap-back';
  back.style.cssText='position:fixed;inset:0;background:rgba(20,25,15,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px';
  back.innerHTML=`<div style="background:#fff;border-radius:12px;padding:18px 20px;max-width:560px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)">
    <h3 style="font-size:15px;font-weight:800;color:var(--accent);margin-bottom:4px">＋ ${tx('apTitle')(date.slice(5))}</h3>
    <div class="cnt" style="color:var(--muted);margin-bottom:10px">${tx('apHint')}</div>
    <div id="ap-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">${rowHtml}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost sm" id="ap-cancel">${tx('clClose')}</button>
      <button class="btn sm" id="ap-save">${tx('apSave')}</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.addEventListener('click',e=>{ if(e.target===back) back.remove(); });
  $('#ap-cancel').addEventListener('click',()=>back.remove());
  $('#ap-save').addEventListener('click',()=>doShzManualAssign(back));
}
async function doShzManualAssign(back){
  const rows=[];
  back.querySelectorAll('.ap-row').forEach(el=>{
    if(!el.querySelector('.ap-sel').checked) return;
    const room=el.querySelector('.ap-room').value; if(!room) return;
    const inv=SHZ_INV[room]; if(!inv) return;
    rows.push({member_id:el.getAttribute('data-mid'),inventory_id:inv,room_no:room,
      check_in:el.getAttribute('data-dep'),check_out:el.getAttribute('data-arr'),src:'manual'});
  });
  if(!rows.length){ toast(tx('apNone'),'warn'); return; }
  try{
    const {error}=await supa.rpc('shizu_assign_rooms',{p_rows:rows});
    if(error)throw error;
    back.remove(); toast(tx('apDone')(rows.length),'ok'); load();
  }catch(e){ toast(tx('apFail')+(e.message||e),'err'); }   // 정원(3)초과 = 트리거가 롤백
}

function renderClosureList(){
  const el=$('#cl-list'); if(!el)return;
  el.innerHTML=CLOSURES.length?CLOSURES.slice().sort((a,b)=>a.from_date.localeCompare(b.from_date)).map(c=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0"><span style="flex:1">🔒 ${(SHZ_ROOMNO[c.room_no]||'')} ${esc(c.room_no)} · ${esc(c.from_date)}~${esc(c.to_date)}${c.reason?' · '+esc(c.reason):''}</span><button class="btn ghost sm" onclick="delClosure('${c.id}')">✕</button></div>`).join(''):`<div class="cnt" style="color:var(--muted)">${tx('clNone')}</div>`;

async function addClosure(){
  const room=$('#cl-room').value, from=$('#cl-from').value, to=$('#cl-to').value, reason=$('#cl-reason').value.trim();
  if(!room||!from||!to){ toast(tx('clNeed'),'warn'); return; }
  if(to<from){ toast(tx('clRangeErr'),'warn'); return; }
  const inv=SHZ_INV[room]; if(!inv){ toast(tx('swapNoInv'),'err'); return; }
  try{
    const {data,error}=await supa.from('room_closures').insert({inventory_id:inv,from_date:from,to_date:to,reason:reason||null}).select().single();
    if(error)throw error;
    CLOSURES.push({id:data.id,inventory_id:inv,room_no:room,from_date:from,to_date:to,reason:reason||''});
    $('#cl-reason').value=''; renderClosureList(); renderPreview(); toast(tx('clDone'),'ok');
  }catch(e){ toast(tx('clFail')+(e.message||e),'err'); }
}
async function delClosure(id){
  try{ const {error}=await supa.from('room_closures').delete().eq('id',id); if(error)throw error;
    CLOSURES=CLOSURES.filter(c=>String(c.id)!==String(id)); renderClosureList(); renderPreview(); toast(tx('clRemoved'),'ok');
  }catch(e){ toast(tx('clFail')+(e.message||e),'err'); }
}

      <tr><td class="shz-pv-lb">到着/メモ</td><td colspan="8" class="shz-pv-note" contenteditable="true" spellcheck="false" data-date="${date}" onblur="saveShizuMemo('${date}',this.textContent)">${esc(note)}</td></tr>
      ${(()=>{ const bg=bigoFor(date); return bg?`<tr><td class="shz-pv-lb">現地備考</td><td colspan="8" class="shz-pv-bigo">${bg}</td></tr>`:''; })()}
      ${(()=>{ const un=UNBYDATE[date]||0; return un?`<tr class="shz-pv-unrow"><td class="shz-pv-lb">未配置</td><td colspan="8" class="shz-pv-un">⚠ ${tx('unassignedN')(un)}</td></tr>`:''; })()}
    </table>`;
  });
  wrap.innerHTML=html;
}

// ── 予約表 xlsx(앱 shzDownload 이식) ──
async function downloadXlsx(){
  const ax=axis(); if(!ax.length){ toast(tx('noOut'),'err'); return; }
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('予約表',{views:[{showGridLines:false}]});
  ws.pageSetup={ paperSize:9, orientation:'portrait', fitToPage:true, fitToWidth:1, fitToHeight:0, horizontalCentered:true,
    margins:{left:0.39,right:0.39,top:0.55,bottom:0.55,header:0.31,footer:0.31} };
  const FONT='游ゴシック', thin={style:'thin'}, med={style:'medium'};
  const W={A:9,B:6,C:10,D:21.9,E:21,F:22.2,G:21.1,H:19.4,I:21.2,J:18.6,K:10.2};
  Object.entries(W).forEach(([c,w])=>{ ws.getColumn(c).width=w; });
  const yr=(parseISO(ax[0])||new Date()).getFullYear();
  ws.mergeCells('A1:K1');
  const t=ws.getCell('A1'); t.value=`ー志津の宿　　${yr}年　　予約表ー`; t.font={name:FONT,size:26,bold:true}; t.alignment={horizontal:'center',vertical:'middle'}; t.border={bottom:thin};
  ws.getRow(1).height=41.4;
  let row=2;
  activeDates().forEach(date=>{
    const d=parseISO(date), r0=row;
    ws.getRow(r0).height=29.4; for(let k=1;k<=5;k++) ws.getRow(r0+k).height=18; ws.getRow(r0+6).height=20.4;
    const hd=ws.getCell(r0,1); hd.value='日付'; hd.font={name:FONT,size:11}; hd.alignment={horizontal:'center',vertical:'middle'};
    const hw=ws.getCell(r0,2); hw.value='曜日'; hw.font={name:FONT,size:11}; hw.alignment={horizontal:'center',vertical:'middle'};
    SHZ_ROOMS.forEach((nm,i)=>{ const c=ws.getCell(r0,4+i); c.value=nm; c.font={name:FONT,size:18,bold:true}; c.alignment={horizontal:'center',vertical:'middle'}; });
    ws.mergeCells(r0+1,1,r0+5,1); ws.mergeCells(r0+1,2,r0+5,2);
    const dc=ws.getCell(r0+1,1); dc.value=`${zen(d.getMonth()+1)}／${zen(d.getDate())}`; dc.font={name:FONT,size:14,bold:true}; dc.alignment={horizontal:'center',vertical:'middle'};
    const wc=ws.getCell(r0+1,2); wc.value=SHZ_DOW[d.getDay()]; wc.font={name:FONT,size:12,bold:true}; wc.alignment={horizontal:'center',vertical:'middle'};
    ['お名前','大人','子供','合計人数','電話番号'].forEach((lb,i)=>{ const c=ws.getCell(r0+1+i,3); c.value=lb; c.font={name:FONT,size:11,bold:true}; c.alignment={vertical:'middle'}; });
    let tot=0,tm=0,tf=0;
    SHZ_ROOMS.forEach((room,ri)=>{
      const col=4+ri; const occ=cellOcc(room,date);
      const kc=ws.getCell(r0+3,col); kc.value='　　　　　　才'; kc.font={name:FONT,size:11};
      if(!occ.length)return;
      const rep=occ[0]; const onsenHere=SHZ_BYEOLCHE.includes(room)&&occ.some(g=>g.onsen);
      const nc=ws.getCell(r0+1,col); nc.value=nameOf(rep)+'様'+(onsenHere?' ♨':''); nc.font={name:FONT,size:11}; nc.alignment={horizontal:'right',vertical:'middle'};
      const ac=ws.getCell(r0+2,col); ac.value=mf(occ); ac.font={name:FONT,size:11}; ac.alignment={vertical:'middle'};
      const sc=ws.getCell(r0+4,col); sc.value=zen(occ.length); sc.font={name:FONT,size:11}; sc.alignment={horizontal:'center',vertical:'middle'};
      const rn=nightsOf(rep); const pc=ws.getCell(r0+5,col); pc.value=`${zen(rn.length)}連泊　${zen(rn.indexOf(date)+1)}`; pc.font={name:FONT,size:11}; pc.alignment={horizontal:'center',vertical:'middle'};
      tot+=occ.length; occ.forEach(g=>{const x=genderOf(g); if(x==='男')tm++; else if(x==='女')tf++;});
    });
    const kN=ws.getCell(r0+1,11); kN.value='合計'; kN.font={name:FONT,size:11,bold:true}; kN.alignment={horizontal:'center',vertical:'middle'};
    const kA=ws.getCell(r0+2,11); kA.value=`大　${zen(tot)}　名`; kA.font={name:FONT,size:11}; kA.alignment={horizontal:'right',vertical:'middle'};
    const kC=ws.getCell(r0+3,11); kC.value='子　　　名'; kC.font={name:FONT,size:11};
    const kS=ws.getCell(r0+4,11); kS.value=`計　${zen(tot)}　名`; kS.font={name:FONT,size:11,bold:true}; kS.alignment={horizontal:'center',vertical:'middle'};
    const kM=ws.getCell(r0+5,11); kM.value=`男${zen(tm)}　女${zen(tf)}`; kM.font={name:FONT,size:11}; kM.alignment={horizontal:'center',vertical:'middle'};
    ws.mergeCells(r0+6,1,r0+6,2);
    const ar=ws.getCell(r0+6,1); ar.value='到着予定時刻'; ar.font={name:FONT,size:12}; ar.alignment={horizontal:'center',vertical:'middle'};
    ws.mergeCells(r0+6,3,r0+6,11);
    const note=NOTES[date]!=null?NOTES[date]:buildNoteAuto(date);
    const nt=ws.getCell(r0+6,3); nt.value=note; nt.font={name:FONT,size:11,bold:true}; nt.alignment={horizontal:'left',vertical:'middle',indent:1};
    for(let rr=r0; rr<=r0+6; rr++){ for(let cc=1; cc<=11; cc++){ const c=ws.getCell(rr,cc); const b={top:thin,bottom:thin,left:thin,right:thin};
      if(rr===r0)b.top=med; if(rr===r0+6)b.bottom=med; if(cc===1)b.left=med; if(cc===11)b.right=med; c.border=b; } }
    row+=7;
  });
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Shizu_chart_${DATESEL||YM}.xlsx`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
