<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 志津の宿 予約表</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --purple:#7c4dab; --purple2:#5e3a86; --purpleDim:#f0e8f7;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .daychip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer;font-family:inherit}
  .daychip:hover{border-color:var(--accent)}
  .daychip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 13px;min-width:84px;text-align:center}
  .stat .l{font-size:10.5px;color:var(--muted);font-weight:700}
  .stat .v{font-size:19px;font-weight:800;color:var(--accent);font-family:var(--mono)}
  .stat .s{font-size:10px;color:var(--text3,#8a937c)}
  .stat.ons .v{color:var(--purple2)}
  /* 온천 사전신청 패널 */
  .ons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
  .ons-item{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface2);font-size:12.5px}
  .ons-item.on{background:var(--purpleDim);border-color:var(--purple)}
  .ons-item input{width:16px;height:16px;accent-color:var(--purple)}
  .ons-item .rm{font-family:var(--mono);font-size:11px;color:var(--purple2);font-weight:700}
  .ons-item .dt{font-size:10.5px;color:var(--muted)}
  /* 予約表 미리보기 = 실제 인쇄물과 동일(흑백 WYSIWYG). 화면·인쇄 동일 서식. */
  .pv-title{font-size:16px;font-weight:700;text-align:center;margin:6px 0 12px;letter-spacing:.05em}
  .shz-pv{border-collapse:collapse;margin-bottom:14px;width:100%;min-width:900px;font-size:11px;color:#1a1a1a}
  .shz-pv th,.shz-pv td{border:1px solid #555;padding:3px 6px;text-align:center;vertical-align:middle}
  .shz-pv-hd th{background:#f0f0f0;font-weight:700;color:#1a1a1a}
  .shz-rno{display:block;font-size:9px;color:#666;font-weight:600;letter-spacing:.5px}
  .shz-pv-zone th{background:#f0f0f0;font-weight:800;color:#1a1a1a;font-size:11px;letter-spacing:.04em}
  .shz-pv-zone th small{font-weight:600;color:#666}
  .shz-pv-zone th.bz{background:#e2e2e2}
  .shz-pv-hd th.bz{background:#e6e6e6}
  .shz-pv-dt{background:#ececec!important;font-size:13px;font-weight:700}
  .shz-pv-dt span{font-size:10px;color:#666}
  .shz-pv-io{font-size:10px;color:#333;letter-spacing:-.02em}
  .shz-pv-bd{font-size:10px;color:#333;letter-spacing:-.02em;text-align:right;background:#fff;line-height:1.3;white-space:nowrap}
  /* 出発地 ICN/PUS — 팀 단위 태그(代表者 칸·미배정 행거 공용) */
  .shz-port{display:inline-block;font-size:9.5px;font-weight:800;line-height:1.5;border:1px solid #888;border-radius:3px;padding:0 4px;margin-right:4px;color:#222;background:#f2f2f2;vertical-align:middle}
  .shz-pv-lb{background:#ececec;font-weight:700;color:#1a1a1a;width:78px}
  .shz-pv-nm{text-align:right;background:#fff;font-size:11px;line-height:1.3}   /* お名前=방 전원 여러 줄 */
  .shz-pv-rep{text-align:center;background:#f7f7f4;font-size:13px;font-weight:800;color:#222}   /* 代表者=크게(인쇄와 같은 서열) */
  .shz-onsen-chk{display:inline-block;margin-right:3px;color:#c0392b;font-weight:900;font-size:12px;background:#fdecea;border:1px solid #e3a89f;border-radius:3px;padding:0 3px;line-height:1.3;vertical-align:middle}
  .shz-loc{display:inline-block;font-size:8.5px;font-weight:800;border:1px solid #999;border-radius:3px;padding:0 3px;margin:0 2px 0 0;color:#555;line-height:1.5;vertical-align:middle;letter-spacing:0}
  .oc.local{border-style:dashed}
  .shz-closed{background:#ececec!important;color:#1a1a1a}
  .shz-pv td:not(.shz-pv-lb):not(.shz-pv-k):not(.shz-pv-note):not(.shz-pv-nm){background:#fff}
  .shz-pv-k{background:#ececec;font-weight:700}
  .shz-pv-note{text-align:left;background:#fff;outline:none;min-height:22px;font-weight:600}
  .shz-pv-note:focus{background:#eee}
  .shz-pv-onsen{color:#1a1a1a;font-weight:700}
  .shz-pv-bigo{text-align:left;background:#fff;font-size:11px;line-height:1.55;font-weight:600;color:#1a1a1a}
  .shz-pv-tmemo{background:#fff;outline:none;font-size:10.5px;line-height:1.35;font-weight:600;color:#1a1a1a;min-height:20px;vertical-align:top}
  .shz-pv-tmemo[contenteditable="true"]:hover{background:#fbfcf7}
  .shz-pv-tmemo[contenteditable="true"]:focus{background:#f4f7ec;box-shadow:inset 0 0 0 2px var(--accent)}
  .shz-bigo-nm{color:#1a1a1a;font-weight:800;margin-right:2px}
  .shz-bigo-o{color:#777;font-weight:400;font-size:10px}
  .shz-annex{display:inline-block;background:#fff;color:#1a1a1a;border:1px solid #555;border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:800;margin-right:3px}
  .un-badge{display:inline-block;margin-left:5px;background:var(--redDim,#fde8e8);color:var(--red,#c0392b);border:1px solid var(--red,#c0392b);border-radius:99px;padding:0 6px;font-size:10px;font-weight:800;vertical-align:middle}
  .io-badge{display:inline-block;margin-left:4px;border-radius:99px;padding:0 5px;font-size:9.5px;font-weight:800;vertical-align:middle;letter-spacing:-.03em}
  .io-badge.ci{background:#e3f0fb;color:#1c62a8;border:1px solid #9cc3e6}
  .io-badge.co{background:#fdf1e3;color:#a86a1c;border:1px solid #e6c79c}
  .to-panel{padding:12px 16px}
  .to-hd{font-weight:800;font-size:13px;color:var(--accent);margin-bottom:8px}
  .to-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;padding:5px 0;border-top:1px solid var(--border);font-size:12.5px}
  .to-row:first-of-type{border-top:none}
  .to-date{flex:0 0 auto;font-weight:800;color:var(--text);min-width:70px}
  .to-seg{flex:1;min-width:220px}
  .to-seg b{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:4px;font-size:11px;margin-right:5px;color:#fff}
  .to-in b{background:#1c62a8}
  .to-out b{background:#a86a1c}
  .to-seg small{color:var(--muted);font-weight:600}
  /* 현지 전달사항 — 체크인/체크아웃 아래 참고 목록 */
  .nt-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px}
  .nt-row:first-of-type{border-top:none}
  .nt-team{font-weight:800;min-width:150px}
  .nt-team small{color:var(--muted);font-weight:600;margin-left:4px}
  .nt-tags{display:flex;gap:4px;flex-wrap:wrap}
  .nt-tag{font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;white-space:nowrap;border:1px solid}
  .nt-tag.combo{color:#2c5078;background:#eaf1fa;border-color:#bdd3ea}
  .nt-tag.annex{color:#5e3a86;background:#f2ecfa;border-color:#d6c4ea}
  .nt-tag.triple{color:#9a5b12;background:#fbf1e2;border-color:#e8d2ab}
  .nt-tag.meal{color:#b13b2c;background:#fdecea;border-color:#efc2ba}
  .nt-tag.etc{color:#5a6b45;background:#eef2e6;border-color:#cddcb8}
  .nt-txt{flex:1;min-width:220px;color:var(--text2);white-space:pre-wrap;line-height:1.45}
  .to-none{color:var(--muted)}
  #shz-search-results{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .shz-sr{cursor:pointer;font-size:12.5px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px}
  .shz-sr:hover{border-color:var(--accent);background:var(--accentSoft)}
  .shz-sr small{color:var(--muted);font-weight:600}
  .shz-sr .mono{font-family:var(--mono);color:var(--text2)}
  .un-badge.ok{background:var(--accentSoft,#eef3e6);color:var(--ok,#2f7d4f);border-color:#b4cda0}
  .shz-pv-unrow .shz-pv-lb{color:var(--red,#c0392b)}
  .shz-pv-un{text-align:left!important;background:#fdecea;color:var(--red,#c0392b);font-weight:800;cursor:pointer}
  .shz-pv-un:hover{background:#fbdedb}
  .shz-un-go{margin-left:10px;font-size:11px;font-weight:700;color:var(--accent);text-decoration:underline}
  .ap-row{display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid var(--border);border-radius:8px;background:var(--surface2,#fafbf8)}
  .ap-ck{display:flex;align-items:center}
  .ap-nm{font-weight:800;font-size:13px;min-width:88px}
  .ap-tm{flex:1;font-size:11.5px;color:var(--muted)}
  .ap-room{min-width:150px}
  .pv-wrap{overflow-x:auto}
  /* ── 인쇄: 팝업 없이 화면 예약표 미리보기(#pv-panel)를 그대로 인쇄. 고정 크기(축소 없음)+표별 페이지 자연 넘김 ── */
  @media print{
    @page{size:A4 landscape;margin:6mm}
    body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body>*{display:none!important}
    body>#content{display:block!important}
    #content>.panel:not(#pv-panel){display:none!important}
    .page-help,#toast{display:none!important}
    #pv-panel{display:block!important;border:none!important;box-shadow:none!important;padding:0!important;margin:0!important;background:none!important}
    #pv-panel>h3{display:none!important}
    .pv-wrap{overflow:visible!important}
    .pv-title{font-size:18px;font-weight:800;text-align:center;margin:2px 0 8px;letter-spacing:.05em;color:#000}
    .shz-pv{border-collapse:collapse;width:100%;margin:0 auto 6mm;page-break-inside:avoid;break-inside:avoid;color:#000}
    .shz-pv th,.shz-pv td{border:1.2px solid #333;padding:2px 6px;text-align:center;vertical-align:middle;font-weight:700;line-height:1.15;background:#fff;font-size:12px}   /* 기본 크기 — 大人·合計人数·連泊 등 무클래스 셀(미지정 시 16px로 커짐) */
    .shz-pv-zone th{background:#e8e8e8!important;font-weight:800;font-size:12px}
    .shz-pv-zone th.bz{background:#d8d8d8!important}
    .shz-pv-hd th{background:#ececec!important;font-weight:800;font-size:14px}
    .shz-pv-hd th.bz{background:#e0e0e0!important}
    .shz-rno{display:block;font-size:9px;color:#555;font-weight:700}
    .shz-pv-dt{background:#e0e0e0!important;font-size:15px;font-weight:800}
    .shz-pv-dt span{font-size:11px;color:#555}
    .shz-pv-io{font-size:11px}
    .shz-pv-bd{font-size:11px;text-align:right;line-height:1.3;white-space:nowrap}
    .shz-port{display:inline-block;font-size:10px;font-weight:800;border:1px solid #333;border-radius:3px;padding:0 4px;margin-right:4px;color:#000;background:#fff!important;vertical-align:middle}
    .shz-pv-lb{background:#e6e6e6!important;font-weight:800;width:74px;font-size:12px}
    .shz-pv-rep{text-align:center;font-weight:800;font-size:15px;color:#111;background:#f0f0ec!important}   /* 대표자=크게 */
    .shz-loc{border:1px solid #333;color:#000;font-size:10px;font-weight:800}                                /* 現地=흑백 또렷 */
    .shz-pv-nm{text-align:right;font-weight:700;font-size:12.5px}                                            /* お名前=작게 */
    .shz-pv-k{background:#e6e6e6!important;font-weight:800;font-size:13px}
    .shz-pv-note{text-align:left;font-weight:700;font-size:12px}
    .shz-pv-bigo{text-align:left;background:#fff!important;font-weight:700;font-size:12px;line-height:1.25}
    .shz-pv-tmemo{background:#fff!important;font-weight:700;font-size:11px;line-height:1.2;vertical-align:top}
    .shz-onsen-chk{color:#c0392b!important;background:#fdecea!important;border:1px solid #e3a89f}
    .shz-pv-unrow{display:none!important}
  }
  /* 배정 보드(room.html식 개인 단위) */
  .brd{display:block}
  .brd-day+.brd-day{margin-top:16px;border-top:2px dashed var(--border);padding-top:14px}
  .brd-day-hd{font-weight:800;font-size:13.5px;color:var(--accent);margin-bottom:9px}
  /* 날짜별 팀 요약 띠(담당자 가독) — 어느 팀 몇 명 어느 방 */
  .brd-tsum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .shz-tsum{font-size:11.5px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:3px 10px;color:var(--text2);font-weight:600;white-space:nowrap}
  .shz-tsum b{color:var(--accent);font-weight:800;margin-left:3px}
  .shz-tsum small{color:var(--muted);font-family:var(--mono);margin-left:6px}
  .brd-grid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
  @media(max-width:820px){.brd-grid{grid-template-columns:1fr}}
  .brd-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .brd-focus{font-size:14px;font-weight:800;color:var(--accent);background:var(--accentSoft);border-radius:99px;padding:3px 12px}
  .brd-selinfo{font-size:12.5px;font-weight:800;color:var(--accent2)}
  .brd-rack{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;max-height:660px;overflow:auto}
  .rk-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:16px 6px}
  .rk-team{background:#fff;border:1px solid var(--border);border-left:3px solid var(--err);border-radius:8px;padding:8px 9px;margin-bottom:8px}
  .rk-team.annex{border-left-color:var(--purple)}
  .rk-hd{font-size:12.5px;font-weight:800;color:var(--text)}
  .rk-hd small{font-weight:600;color:var(--muted);font-size:10.5px}
  .rk-mates{font-size:10.5px;color:var(--accent);margin:2px 0 4px;font-weight:600}
  .rk-mem{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--border2);background:var(--surface3);color:var(--text);border-radius:99px;padding:3px 10px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .brd-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px}
  .rm{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 10px;cursor:pointer;transition:.1s;min-height:80px}
  .rm:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .rm.empty{background:var(--surface2);border-style:dashed}
  .rm.part{border-left:3px solid var(--warn)}
  .rm.full{border-left:3px solid var(--ok)}
  .rm.full3{border-left:3px solid var(--err);background:#fdf2f0}   /* 초과배정(3/2) — 붉게 강조 */
  .rm-over{margin-left:5px;font-size:9.5px;font-weight:800;color:#fff;background:var(--err);border-radius:4px;padding:1px 5px}
  .cl-badge{display:inline-block;margin-left:5px;font-size:10.5px;font-weight:800;color:#fff;background:var(--err);border-radius:9px;padding:0 6px;vertical-align:middle}
  .rm.closed{background:#f3ecec;border-color:#e3bdb4;cursor:not-allowed;opacity:.75}
  .rm.spanbusy{background:#f5efe6;border-color:#e0c9a6;border-style:dashed;cursor:not-allowed;opacity:.85}
  .rm-spanbusy{font-size:11.5px;color:#8a5a2f;font-weight:700;line-height:1.4;text-align:center;padding:6px 2px}
  .rm-spanbusy small{display:block;font-family:var(--mono);font-weight:600;color:#a9803f;font-size:10.5px}
  .rm-sb-lbl{margin-top:3px;color:var(--err);font-weight:800;font-size:10px}
  .rm-hd{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;margin-bottom:6px}
  .rm-no{font-family:var(--mono);font-size:13px;color:var(--text);font-weight:800;margin-right:2px}
  .rm-zone{font-size:9.5px;font-weight:700;color:var(--accent);background:var(--accentSoft);border-radius:4px;padding:0 5px}
  .rm-zone.bz{color:var(--purple2);background:var(--purpleDim)}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function zen(v){ return String(v).replace(/[0-9]/g,d=>'０１２３４５６７８９'[+d]); }
function titleCase(s){ return String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()); }

function parseISO(s){ const m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function isoOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthBounds(ym){ const [y,m]=ym.split('-').map(Number); const start=`${y}-${String(m).padStart(2,'0')}-01`; const endD=new Date(y,m,0).getDate(); const end=`${y}-${String(m).padStart(2,'0')}-${String(endD).padStart(2,'0')}`; return {start,end}; }
// 로드·표시 범위: 달력 범위(RFROM~RTO)가 있으면 그걸, 없으면 선택 월 전체. inScope=그 범위 내 날짜.
function curBounds(){ return (RFROM&&RTO)?{start:RFROM,end:RTO}:monthBounds(YM); }
function inScope(d){ const b=curBounds(); return d>=b.start && d<=b.end; }
// 선택 월 전체로 범위 초기화 + 달력 입력 동기화(◀▶ 이동·리셋 시)

function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}

// ── 한 stay(배정 1행)의 점유 밤 = [ci, co) ──
function nightsOf(g){ const a=parseISO(g.ci), b=parseISO(g.co); if(!a)return []; if(!b||b<=a)return [isoOf(a)]; const out=[]; const d=new Date(a); while(d<b){ out.push(isoOf(d)); d.setDate(d.getDate()+1); } return out; }
function nightsBetween(dep,arr){ return nightsOf({ci:dep,co:arr}); }   // 입~출(체크아웃 전날까지)
// 번들예약(야마나미+시즈)의 현지비고에서 「M/D-M/D 시즈」 구간 추출. 순수 시즈 상품이면 null(예약기간 폴백).
function parseShizuSpan(remark, product, bookDep, bookArr){
  const pd=String(product||''); const bundled=/야마나미|ヤマナミ|山並|간지|ガンジー|쿠주|久住/.test(pd) && /시즈|志津|しずの|しづの/.test(pd);   // 시즈+야마나미뿐 아니라 시즈+간지·시즈+쿠주 콤보도 번들로 인정
  if(!bundled) return null;   // 순수 시즈 = 예약기간이 곧 시즈 숙박(폴백)
  const yr=(String(bookDep||'').slice(0,4))||(String(bookArr||'').slice(0,4)); if(!yr) return null;
  const p=(mo,d)=>`${yr}-${String(+mo).padStart(2,'0')}-${String(+d).padStart(2,'0')}`;
  for(const ln of String(remark||'').split(/\r?\n/)){
    if(!/시즈|志津|しずの|しづの/.test(ln)) continue;                     // '시즈' 언급된 줄에서만
    const m=ln.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*[-~〜～]\s*(\d{1,2})\s*\/\s*(\d{1,2})/);
    if(m){ const dep=p(m[1],m[2]), arr=p(m[3],m[4]); if(dep<arr) return {dep,arr}; }
  }
  return null;
}
function nameOf(g){ return titleCase(g.nameEn)||g.nameKr||''; }
function genderOf(g){ return g.gender||''; }
// 生年月日 표기 — 료칸 숙박자명부용. passengers.birth(date) 우선, 없으면 birth_yymmdd(6자리) 보정.
//   6자리는 세기 판단이 필요: 두 자리 연도가 현재연도 뒤 2자리보다 크면 19xx, 아니면 20xx.
function fmtBirth(b, y6){
  const s=String(b||'').slice(0,10);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s.replace(/-/g,'/');
  const t=String(y6||'').replace(/\D/g,'');
  if(t.length===6){
    const yy=+t.slice(0,2), mm=t.slice(2,4), dd=t.slice(4,6);
    const cut=new Date().getFullYear()%100;
    const yyyy=(yy>cut?1900:2000)+yy;
    return `${yyyy}/${mm}/${dd}`;
  }
  return '';
}
function birthOf(g){ return g.birth||''; }
// 기준일(체크인일) 시점 만나이. 생일 전이면 -1. 잘못된 값은 -1 반환(정렬에서 맨 뒤).
function ageOn(birthISO, refISO){
  const b=String(birthISO||'').slice(0,10), r=String(refISO||'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(b)||!/^\d{4}-\d{2}-\d{2}$/.test(r)) return -1;
  let a=(+r.slice(0,4))-(+b.slice(0,4));
  if(r.slice(5)<b.slice(5)) a--;          // 생일 전이면 한 살 빼기
  return (a>=0&&a<130)?a:-1;
}
// 팀 대표 '영문명' — 予約表 代表者·배정보드 요약/행거 공용(방 칩의 お名前과 표기 통일).
//   영문이 없으면 한글명 → 그것도 없으면 bookings.rep_name(한글) 폴백.
function buildRepEn(){ REPEN={}; GUESTS.forEach(g=>{ const s=g.event_seq, rank=g.isRep?0:(g.seq||99);
  const en=titleCase(g.nameEn)||g.nameKr||''; if(!REPEN[s]||rank<REPEN[s].rank) REPEN[s]={en,rank}; }); }
function repEnOf(seq){ return (REPEN[seq]&&REPEN[seq].en) || String((BOOK[seq]||{}).rep_name||'').trim(); }
// 出発地(ICN/PUS) — 팀 단위. SZCore.originPort 단일 소스(항공편 ZE→PUS·TW→ICN 우선, 없으면 출발지).
function portOf(seq){ const b=BOOK[seq]||{}; try{ return (window.SZCore&&SZCore.originPort)?SZCore.originPort(b.origin||'',b.airline||''):''; }catch(e){ return ''; } }
// 선택 월의 점유 밤(빈 날 테이블 방지)
function axis(){ const set=new Set(); GUESTS.forEach(g=>nightsOf(g).forEach(d=>{ if(inScope(d)) set.add(d); })); UNASSIGNED.forEach(r=>nightsBetween(r.dep,r.arr).forEach(d=>{ if(inScope(d)) set.add(d); })); return [...set].sort(); }
// 화면·인쇄·xlsx 공통 대상 날짜: 특정일 선택 시 그날만, 아니면 그 달 전체
function activeDates(){ const ax=axis(); const s=[...DATESEL].filter(d=>ax.includes(d)); return s.length? s.sort() : ax; }
// 대표(seq=1·is_rep)를 맨 앞으로 — お名前에 팀 대표가 표시되도록(방 합류 순서 무관). ci 동률 시 대표 우선.

  .sort((a,b)=>(a.ci||'').localeCompare(b.ci||'') || (b.isRep?1:0)-(a.isRep?1:0) || (a.seq||99)-(b.seq||99)); }
function mf(occ){ let m=0,f=0,u=0; occ.forEach(g=>{const x=genderOf(g); if(x==='男')m++; else if(x==='女')f++; else u++;}); const p=[]; if(m)p.push('男　'+zen(m)); if(f)p.push('女　'+zen(f)); if(u)p.push('（未）'+zen(u)); return p.join('　　'); }

}

  $('#rng-to').addEventListener('change',_rngChange);
  $('#rng-reset').addEventListener('click',()=>{ resetRange(); DATESEL.clear(); load(); });
  // 예약표 인쇄 = 미리보기 팝업(별창) → 상단 [🖨 인쇄] 버튼. 팝업이 3일/페이지 묶음 + 자동맞춤(축소)
  //   → 여러 날 선택 시 한 장에 묶여 나옴(Min). renderPreview로 최신 화면 반영 후 팝업 오픈.
  $('#btn-print').addEventListener('click',()=>{ renderPreview(); printChart(); });
  $('#btn-autofill').addEventListener('click',autofillShizu);
  // 월별 전체 자동배정(autoAssignShizu)은 미배정 자동배정으로 일원화하며 버튼 제거(함수는 복구용 잔존).
  { const se=$('#shz-search'); if(se) se.addEventListener('input',onShzSearch); }
  $('#btn-close').addEventListener('click',openClosureModal);
  $('#brd-clear').addEventListener('click',()=>{ BSEL.clear(); renderBoard(); });
  $('#brd-clearall').addEventListener('click',bClearAll);
}

async function pagedIn(table, cols, key, vals){
  const out=[]; const uniq=[...new Set(vals)];
  for(let i=0;i<uniq.length;i+=80){
    const chunk=uniq.slice(i,i+80);
    let from=0;
    for(;;){ const {data,error}=await supa.from(table).select(cols).in(key,chunk).range(from,from+999); if(error)throw error; out.push(...(data||[])); if(!data||data.length<1000)break; from+=1000; }
  }
  return out;
}

async function load(){
  if(!supa)return;
  if(!RFROM||!RTO){ resetRange(); }   // 최초/월변경 직후 기본=선택 월 전체
  const _f=$('#rng-from'),_t=$('#rng-to'); if(_f&&_f.value!==RFROM)_f.value=RFROM; if(_t&&_t.value!==RTO)_t.value=RTO;
  $('#ym-label').textContent=YM; $('#stat').textContent=tx('statLoading'); $('#btn-print').disabled=true;
  NOTES={}; BSEL.clear();
  try{
    const {start,end}=curBounds();
    // 시즈노야도 배정(월 겹침): check_in <= 월말 AND check_out > 월초
    const {data:rms,error}=await supa.from('rooms').select('id,inventory_id,member_id,event_seq,room_no,check_in,check_out,assigned_pax,assign_source')
      .eq('facility',FACILITY).lte('check_in',end).gt('check_out',start).not('member_id','is',null);
    if(!SHZ_INV){ try{ const {data:inv}=await supa.from('room_inventory').select('id,room_no').eq('facility',FACILITY); SHZ_INV={}; SHZ_INVROOM={}; (inv||[]).forEach(x=>{SHZ_INV[x.room_no]=x.id; SHZ_INVROOM[x.id]=x.room_no;}); }catch(e){ SHZ_INV={}; SHZ_INVROOM={}; } }
    // 객실 폐쇄
    try{ const invIds=Object.values(SHZ_INV||{}); CLOSURES=[]; if(invIds.length){ const {data:cl}=await supa.from('room_closures').select('id,inventory_id,from_date,to_date,reason').in('inventory_id',invIds); CLOSURES=(cl||[]).map(c=>({...c,room_no:SHZ_INVROOM[c.inventory_id]||'',from_date:String(c.from_date).slice(0,10),to_date:String(c.to_date).slice(0,10)})); } }catch(e){ CLOSURES=[]; }
    if(error)throw error;
    const rows=(rms||[]).filter(r=>r.member_id && SHZ_ROOMS.includes(r.room_no));
    const mids=rows.map(r=>r.member_id), seqs=rows.map(r=>r.event_seq).filter(Boolean);
    // guest_members(영문/한글명)
    const gms = mids.length? await pagedIn('guest_members','id,event_seq,name_kr,name_en,seq_in_team,is_rep','id',mids) : [];
    const gmMap={}; gms.forEach(g=>gmMap[g.id]=g);
    // passengers(성별) — seq_in_team 불일치 → event_seq+이름으로 매칭
    const pxs = seqs.length? await pagedIn('passengers','event_seq,name_kr,gender,birth,birth_yymmdd','event_seq',seqs) : [];
    const genMap={}, birthMap={};
    pxs.forEach(p=>{ const k=p.event_seq+'|'+String(p.name_kr||'').trim();
      if(!genMap[k]) genMap[k]=normGender(p.gender);
      if(!birthMap[k]) birthMap[k]=fmtBirth(p.birth,p.birth_yymmdd);   // 予約表 生年月日(료칸 숙박자명부용)
    });
    // ※ 온천 사전신청·물채우기 직접 관리 폐지(Min) — 현지에서는 아래 現地備考(메리트 현지비고)만 보고 판단
    // 비고·현지비고(+일본어 캐시) — 예약표 참고용
    const bks = seqs.length? await pagedIn('bookings','event_seq,event_no,rep_name,product_name,origin,airline,remark,remark_local,remark_ja,remark_local_ja','event_seq',seqs) : [];
    BOOK={}; bks.forEach(b=>BOOK[b.event_seq]=b);
    // 담당자 메모(영속) — 그 달 범위
    MEMOS={}; try{ const {data:mm}=await supa.from('shizu_memo').select('memo_date,note').gte('memo_date',start).lte('memo_date',end); (mm||[]).forEach(m=>{ MEMOS[String(m.memo_date).slice(0,10)]=m.note||''; }); }catch(e){}
    // 팀 단위 現地메모(현장 수기, 영속) — 표시된 팀만
    TMEMO={}; TREF={}; try{ if(seqs.length){ const {data:tm}=await supa.from('shizu_team_memo').select('event_seq,note,ref_note').in('event_seq',seqs); (tm||[]).forEach(m=>{ TMEMO[m.event_seq]=m.note||''; TREF[m.event_seq]=m.ref_note||''; }); } }catch(e){}
    GUESTS = rows.map(r=>{
      const gm=gmMap[r.member_id]||{};
      const nameKr=String(gm.name_kr||'').trim();
      return { id:r.id, invId:r.inventory_id, member_id:r.member_id, event_seq:r.event_seq, room_no:r.room_no,
        ci:String(r.check_in).slice(0,10), co:String(r.check_out).slice(0,10), src:r.assign_source||'auto',
        seq:gm.seq_in_team||99, isRep:!!gm.is_rep,
        nameKr, nameEn:gm.name_en||'', gender:genMap[r.event_seq+'|'+nameKr]||'',
        birth:birthMap[r.event_seq+'|'+nameKr]||'' };
    });
    buildRepEn();   // 대표 영문명 맵(요약 띠·予約表 공용)
    // ── 전체 로스터(미배정 추적): 그 달 시즈 팀 전원 − 배정된 사람 = 미배정 ──
    try{
      // 로스터 소스 = ① accom 이 시즈인 팀 + ② 상품명에 '시즈'가 든 번들예약 팀(시즈+간지·시즈+야마나미 등).
      //   ②가 없으면 번들예약은 accom 이 야마나미/간지로 기록돼 있어, 배정을 풀는 순간 미배정 목록에서
      //   사라져 다시 배정할 입구가 없어진다(실제 사고: 박영철·전외윤).
      const GSEL='event_seq,accom,bookings!inner(dep_date,arr_date,product_name,remark_local,event_no,rep_name,origin,airline)';
      const [r1,r2]=await Promise.all([
        supa.from('guests').select(GSEL).eq('accom',FACILITY),
        supa.from('guests').select(GSEL).ilike('bookings.product_name','%시즈%')
      ]);
      const _seen=new Set(); const tgs=[];
      [...(r1.data||[]),...(r2.data||[])].forEach(g=>{ if(_seen.has(g.event_seq))return; _seen.add(g.event_seq); tgs.push(g); });
      const tMap={};
      (tgs||[]).forEach(g=>{ const b=g.bookings||{}; const dep=String(b.dep_date||'').slice(0,10), arr=String(b.arr_date||'').slice(0,10);
        if(dep&&arr&&dep<=end&&arr>start){ tMap[g.event_seq]={dep,arr,product:b.product_name||'',remark:b.remark_local||''};
          // 미배정 팀은 BOOK(배정팀만 로드)에 없음 → 여기서 행사번호·대표자 채움(헤더 #예약번호 폴백 방지)
          if(!BOOK[g.event_seq]) BOOK[g.event_seq]={event_seq:g.event_seq,event_no:b.event_no||null,rep_name:b.rep_name||null,product_name:b.product_name||null,origin:b.origin||null,airline:b.airline||null,remark_local:b.remark_local||null}; } });
      const tSeqs=Object.keys(tMap).map(Number);
      const rgms=tSeqs.length? await pagedIn('guest_members','id,event_seq,name_kr,name_en','event_seq',tSeqs) : [];
      const asg=new Set(GUESTS.map(g=>g.member_id));
      // ── 팀별 '실제 시즈 숙박구간' 산출(엠클릭 번들예약=시즈+야마나미 한 예약 → 예약기간≠시즈구간) ──
      //   ① 배정된 방이 있으면 그 방들(union)이 시즈 구간 → ② 번들이면 현지비고에서 「M/D-M/D 시즈」 파싱
      //   → ③ 파싱 실패·순수 시즈 상품이면 예약기간 그대로. 이걸로 미배정(未)이 야마나미 숙박일에 잘못 뜨지 않게 함.
      const asgSpan={};
      GUESTS.forEach(g=>{ if(!g.ci||!g.co)return; const s=asgSpan[g.event_seq]; if(!s)asgSpan[g.event_seq]={dep:g.ci,arr:g.co}; else{ if(g.ci<s.dep)s.dep=g.ci; if(g.co>s.arr)s.arr=g.co; } });
      const teamSpan={};
      tSeqs.forEach(seq=>{ const t=tMap[seq]||{};
        if(asgSpan[seq]) teamSpan[seq]=asgSpan[seq];
        else teamSpan[seq]=parseShizuSpan(t.remark,t.product,t.dep,t.arr) || {dep:t.dep,arr:t.arr}; });
      ROSTER=rgms.map(m=>{ const sp=teamSpan[m.event_seq]||tMap[m.event_seq]||{}; return {member_id:m.id,event_seq:m.event_seq,dep:sp.dep,arr:sp.arr,nameKr:m.name_kr||'',nameEn:m.name_en||''}; }).filter(r=>r.dep&&r.arr);
      UNASSIGNED=ROSTER.filter(r=>!asg.has(r.member_id));
      UNBYDATE={}; UNASSIGNED.forEach(r=>nightsBetween(r.dep,r.arr).forEach(d=>{ if(inScope(d)) UNBYDATE[d]=(UNBYDATE[d]||0)+1; }));
    }catch(e){ ROSTER=[]; UNASSIGNED=[]; UNBYDATE={}; }
    const ax=axis();
    [...DATESEL].forEach(d=>{ if(!ax.includes(d)) DATESEL.delete(d); });   // 다른 달 날짜는 선택 해제
    renderDateChips(); renderStats(); renderBoard(); renderPreview();
    $('#stat').textContent=`${ax.length}${lang()==='ja'?'日':lang()==='en'?'d':'일'}`;
    $('#btn-print').disabled=!ax.length;
    // translateRemarks();   // 参考事項을 현장 직접입력으로 전환(Min 2026-07) → 한국 현지비고 자동표시·DeepL 번역 미사용(bigoFor 잔존이나 미호출)
  }catch(e){ toast(tx('connFail')+': '+e.message,'err'); $('#stat').textContent=''; }
}

function renderDateChips(){
  const box=$('#daychips'); if(!box)return;
  const ax=axis();
  // 그 밤 재실 인원(배정+미배정)이 있는 날짜 = 확인 대상. 전원 배정되면 ✓, 미배정 남으면 未N, 아무도 안 묵는 날만 빈칸(Min 요청).
  const stayN={};
  GUESTS.forEach(g=>nightsOf(g).forEach(d=>{ stayN[d]=(stayN[d]||0)+1; }));
  // 체크인/체크아웃 팀 수(배정된 방 기준 — 정확한 시즈 입·퇴박일). 미배정은 예약 전체기간이라 제외.
  const ciT={}, coT={};
  GUESTS.forEach(g=>{ if(g.ci){(ciT[g.ci]=ciT[g.ci]||new Set()).add(g.event_seq);} if(g.co){(coT[g.co]=coT[g.co]||new Set()).add(g.event_seq);} });
  const chip=(val,label,on)=>`<button type="button" class="daychip${on?' on':''}" data-d="${val}">${label}</button>`;
  let html=chip('',tx('allDays'),DATESEL.size===0);
  ax.forEach(d=>{ const dt=parseISO(d); const un=UNBYDATE[d]||0;
    const occ=(stayN[d]||0)+un;   // 그 밤 총 재실(배정+미배정)
    const badge = un ? `<span class="un-badge">未${un}</span>` : '';   // 미배정만 표기(✓ 폐지 — 入/出+未로 충분, Min)
    const ci=(ciT[d]&&ciT[d].size)||0, co=(coT[d]&&coT[d].size)||0;
    const io = (ci?`<span class="io-badge ci" title="${tx('ciT')}">入${ci}</span>`:'')
             + (co?`<span class="io-badge co" title="${tx('coT')}">出${co}</span>`:'');
    const lb=`${dt.getMonth()+1}/${dt.getDate()}<small style="opacity:.7">(${SHZ_DOW[dt.getDay()]})</small>${io}${badge}`;
    html+=chip(d,lb,DATESEL.has(d)); });
  box.innerHTML=html;
  box.querySelectorAll('.daychip').forEach(b=>b.addEventListener('click',()=>{
    // 다중선택(Min): 여러 날 선택 → 예약표·객실 보드 모두 선택한 날 수만큼 표시·인쇄.
    //   '전체'=비우기(그 달 전체), 날짜=추가/제거 토글.
    const d=b.getAttribute('data-d')||'';
    if(!d) DATESEL.clear(); else if(DATESEL.has(d)) DATESEL.delete(d); else DATESEL.add(d);
    BSEL.clear(); renderDateChips(); renderBoard(); renderPreview();
  }));
}

function renderStats(){
  const inMonth=GUESTS.filter(g=>nightsOf(g).some(d=>inScope(d)));
  // '宿泊者'=범위내 배정 인원(중복 stay는 member_id 기준 distinct)
  const uniq=new Set(inMonth.map(g=>g.member_id)).size;
  // 미배정 합계=범위내 체류 미배정 인원(distinct)
  const unMonth=UNASSIGNED.filter(r=>nightsBetween(r.dep,r.arr).some(d=>inScope(d)));
  const unUniq=new Set(unMonth.map(r=>r.member_id)).size;
  $('#stats').innerHTML=`
    <div class="stat"><div class="l">${tx('stayN')}</div><div class="v">${uniq}</div><div class="s">${tx('nameUnit')}</div></div>
    <div class="stat"><div class="l">${tx('rackH')}</div><div class="v"${unUniq?' style="color:var(--err)"':''}>${unUniq}</div><div class="s">${tx('nameUnit')}</div></div>
`;
  updateCloseBadge();
}
// 예약표 검색 — 이름·영문명·대표자·행사번호로 배정/미배정 인원을 찾아 그 날짜로 점프
function onShzSearch(){
  const inp=$('#shz-search'); if(!inp) return;
  const q=(inp.value||'').trim().toLowerCase();
  const box=$('#shz-search-results'), cnt=$('#shz-search-cnt');
  if(!q){ if(box)box.innerHTML=''; if(cnt)cnt.textContent=''; return; }
  const rep=seq=>String((BOOK[seq]||{}).rep_name||'').trim();
  const seen=new Set(), res=[];
  const push=(o)=>{ const k=o.key; if(seen.has(k))return; seen.add(k); res.push(o); };
  GUESTS.forEach(g=>{ const hay=`${g.nameKr||''} ${g.nameEn||''} ${rep(g.event_seq)} ${evNo(g.event_seq)} ${g.event_seq}`.toLowerCase();
    if(hay.includes(q)) push({key:'a'+g.member_id+g.room_no+g.ci, name:nameOf(g), rep:rep(g.event_seq), room:g.room_no, dep:g.ci, arr:g.co, asg:true, date:g.ci}); });
  UNASSIGNED.forEach(r=>{ const hay=`${r.nameKr||''} ${r.nameEn||''} ${rep(r.event_seq)} ${evNo(r.event_seq)} ${r.event_seq}`.toLowerCase();
    if(hay.includes(q)) push({key:'u'+r.member_id, name:shzMemName(r), rep:rep(r.event_seq), room:'', dep:r.dep, arr:r.arr, asg:false, date:r.dep}); });
  res.sort((a,b)=>(a.dep||'').localeCompare(b.dep||''));
  if(cnt) cnt.textContent=tx('searchCnt')(res.length);
  if(box) box.innerHTML = res.length
    ? res.slice(0,40).map(x=>`<div class="shz-sr" onclick="shzJump('${x.date}')"><b>${esc(x.name)}</b>${x.rep?` <small>${esc(x.rep)}様</small>`:''} · ${x.asg?`🛏 ${esc(x.room)}`:`<span style="color:var(--err)">${esc(tx('rackH'))}</span>`} · <span class="mono">${esc((x.dep||'').slice(5))}〜${esc((x.arr||'').slice(5))}</span></div>`).join('')
    : `<div class="cnt" style="color:var(--muted);padding:6px 2px">${esc(tx('searchNone'))}</div>`;
}
function shzJump(date){ if(!date) return; DATESEL.clear(); DATESEL.add(date); renderDateChips(); renderBoard(); renderPreview(); const b=$('#board'); if(b) b.scrollIntoView({behavior:'smooth',block:'start'}); }
// 객실 폐쇄 버튼에 「이 달 폐쇄 N개」 빨간 배지
function updateCloseBadge(){
  const btn=$('#btn-close'); if(!btn) return;
  let n=0; try{ const {start,end}=curBounds(); n=CLOSURES.filter(c=>c.from_date<=end && c.to_date>=start).length; }catch(_){ n=CLOSURES.length; }
  btn.innerHTML = tx('closeBtn') + (n?` <span class="cl-badge" title="${tx('closeBadgeT')}">${n}</span>`:'');
}


// ══ 배정 보드(room.html식 개인 단위: 미배정 행거 + 객실 카드 · 이동/병합) ══
function boardDate(){ const ax=axis(); if(!ax.length) return null; const s=[...DATESEL].filter(d=>ax.includes(d)).sort(); return s.length? s[0] : ax[0]; }   // 다중선택 시 가장 이른 날 포커스
function fmtDate(d){ const dt=parseISO(d); return dt?`${dt.getMonth()+1}/${dt.getDate()}(${SHZ_DOW[dt.getDay()]})`:d; }
// member_id → 그 사람의 체류구간(팀 입~출). ROSTER 우선(배정·미배정 모두), 없으면 GUESTS 행.
function memSpan(mid){ const r=ROSTER.find(x=>x.member_id===mid); if(r&&r.dep&&r.arr) return {dep:r.dep,arr:r.arr}; const g=GUESTS.find(x=>x.member_id===mid); return g?{dep:g.ci,arr:g.co}:null; }
function memEventSeq(mid){ const r=ROSTER.find(x=>x.member_id===mid); if(r) return r.event_seq; const g=GUESTS.find(x=>x.member_id===mid); return g?g.event_seq:null; }
// 미배정 팀(그 밤 체류) 목록 — 팀별 그룹 + 이미 배정된 짝(같은 팀)방 표시
function rackTeams(date){
  const list=UNASSIGNED.filter(r=>nightsBetween(r.dep,r.arr).includes(date));
  const byTeam={}; list.forEach(r=>{ (byTeam[r.event_seq]=byTeam[r.event_seq]||[]).push(r); });
  return Object.keys(byTeam).map(seq=>{
    const ms=byTeam[seq].slice().sort((a,b)=>shzMemName(a).localeCompare(shzMemName(b)));
    const bk=BOOK[seq]||{};
    const mates=GUESTS.filter(g=>String(g.event_seq)===String(seq))
      .filter((g,i,a)=>a.findIndex(x=>x.member_id===g.member_id)===i)
      .map(g=>({nm:nameOf(g),room:g.room_no}));
    const annex=SHZ_ANNEX_RE.test(String(bk.remark_local||'')+' '+String(bk.remark||''));
    return {seq,rep:repEnOf(seq)||bk.rep_name||'',ms,mates,annex,port:portOf(seq),dep:ms[0].dep,arr:ms[0].arr};
  }).sort((a,b)=>(a.port||'').localeCompare(b.port||'')||(a.dep||'').localeCompare(b.dep||'')||(a.seq-b.seq));   // 出発地(ICN/PUS)끼리 묶어 표시(Min)
}
function renderBoard(){
  const board=$('#board'); if(!board) return;
  const ax=axis();
  const fl=$('#brd-focus'), si=$('#brd-selinfo');
  if(si) si.textContent=BSEL.size?tx('selN')(BSEL.size):'';
  // 선택한 날짜만큼 보드 표시(다중선택). 전체(미선택)면 성능상 첫 날짜만.
  const dates = DATESEL.size ? [...DATESEL].filter(d=>ax.includes(d)).sort() : (ax.length?[ax[0]]:[]);
  if(!dates.length){ board.innerHTML=`<div class="rk-empty">${tx('noFocus')}</div>`; if(fl)fl.textContent=''; renderTurnover([]); return; }
  if(fl) fl.textContent=tx('focusLbl')(dates.map(fmtDate).join(' · '));
  board.innerHTML = dates.map(date=>renderBoardDay(date, dates.length>1)).join('');
  renderTurnover(dates);
}
// 월 선택과 배정 보드 사이: 선택 날짜의 체크인/체크아웃 팀 간략 요약(배정된 방 기준·팀 단위)
function renderTurnover(dates){
  const el=$('#turnover'); if(!el) return;
  if(!dates || !dates.length){ el.style.display='none'; el.innerHTML=''; return; }
  const rows=dates.map(d=>{
    const ci={}, co={};
    GUESTS.forEach(g=>{
      const rep=String((BOOK[g.event_seq]||{}).rep_name||'').trim();
      if(g.ci===d){ (ci[g.event_seq]=ci[g.event_seq]||{rep,rooms:new Set()}).rooms.add(g.room_no); }
      if(g.co===d){ (co[g.event_seq]=co[g.event_seq]||{rep,rooms:new Set()}).rooms.add(g.room_no); }
    });
    const fmt=obj=>{ const a=Object.values(obj); return a.length? a.map(t=>`${esc(t.rep||'-')}<small>(${[...t.rooms].join('·')})</small>`).join(', ') : '<span class="to-none">—</span>'; };
    return `<div class="to-row"><span class="to-date">${fmtDate(d)}</span>`
      +`<span class="to-seg to-in"><b>入</b> ${fmt(ci)}</span>`
      +`<span class="to-seg to-out"><b>出</b> ${fmt(co)}</span></div>`;
  }).join('');
  el.innerHTML=`<div class="to-hd">🔄 ${tx('turnoverH')}</div>${rows}`;
  el.style.display='';
  renderLocalNotes(dates);
}

// ── 현지 전달사항 참고 목록 ─────────────────────────────────────────────
//  선택 날짜에 묵는 팀 중 '현장이 미리 알아야 하는 것'이 있는 팀만 모아 보여준다.
//  소스=엠클릭 현지비고·비고 + 현장 입력(참고사항·現地메모) + 상품명(콤보 판정).
//  분류는 원문을 지우지 않고 배지만 덧붙인다 — 판단은 사람이 원문을 보고 한다.
const NT_TRIPLE=/트리플|트리플룸|triple|3인|3명|삼인|三名|３名/i;
const NT_MEAL=/알러지|알레르기|アレルギ|allerg|채식|비건|vegan|못\s*드시|못\s*먹|식사|お食事|메뉴|기내식|유제품|땅콩|새우|갑각/i;
// 콤보(복수 숙박지) 판정 — 상품명에 시즈 + 다른 숙박지가 같이 들어간 예약
function ntCombo(seq){
  const pd=String((BOOK[seq]||{}).product_name||'');
  if(!/시즈|志津/.test(pd)) return '';
  const other=[['간지','간지|ガンジー'],['야마나미','야마나미|ヤマナミ|山並'],['쿠주','쿠주|久住']]
    .find(([,re])=>new RegExp(re).test(pd));
  return other? `시즈+${other[0]}` : '';
}
function renderLocalNotes(dates){
  const el=$('#localnotes'); if(!el) return;
  if(!dates||!dates.length){ el.style.display='none'; el.innerHTML=''; return; }
  // 그 날짜들에 묵는 팀(배정+미배정) 수집
  const seqs=new Set();
  dates.forEach(d=>{
    GUESTS.forEach(g=>{ if(g.ci<=d && d<g.co) seqs.add(String(g.event_seq)); });
    UNASSIGNED.forEach(r=>{ if(nightsBetween(r.dep,r.arr).includes(d)) seqs.add(String(r.event_seq)); });
  });
  const rows=[...seqs].map(seq=>{
    const bk=BOOK[seq]||{};
    const src=[bk.remark_local,bk.remark,TREF[seq],TMEMO[seq]].map(x=>String(x||'').trim()).filter(Boolean);
    const txt=[...new Set(src)].join(' / ');
    const combo=ntCombo(seq);
    const tags=[];
    if(combo) tags.push({c:'combo', t:`${tx('ntCombo')}: ${combo}`});
    if(SHZ_ANNEX_RE.test(txt)) tags.push({c:'annex', t:tx('ntAnnex')});
    if(NT_TRIPLE.test(txt))    tags.push({c:'triple', t:tx('ntTriple')});
    if(NT_MEAL.test(txt))      tags.push({c:'meal', t:tx('ntMeal')});
    if(txt && !tags.length)    tags.push({c:'etc', t:tx('ntEtc')});
    if(!tags.length) return null;   // 전달할 것이 없는 팀은 아예 빼서 목록을 짧게
    const rep=repEnOf(seq)||bk.rep_name||'';
    return {seq, rep, tags, txt};
  }).filter(Boolean).sort((a,b)=>String(a.rep).localeCompare(String(b.rep)));
  if(!rows.length){ el.style.display='none'; el.innerHTML=''; return; }
  el.innerHTML=`<div class="to-hd">📌 ${tx('noteH')} <span style="color:var(--muted);font-weight:600">(${rows.length})</span></div>`
    + rows.map(r=>`<div class="nt-row">
        <span class="nt-team">${esc(r.rep||evNo(r.seq))}様<small>${esc(evNo(r.seq))}</small></span>
        <span class="nt-tags">${r.tags.map(t=>`<span class="nt-tag ${t.c}">${esc(t.t)}</span>`).join('')}</span>
        <span class="nt-txt">${esc(r.txt)}</span>
      </div>`).join('');
  el.style.display='';
}
function renderBoardDay(date, showHd){
  const teams=rackTeams(date);
  const rackHtml = teams.length ? teams.map(t=>`
    <div class="rk-team${t.annex?' annex':''}">
      <div class="rk-hd">${t.port?`<span class="shz-port">${esc(t.port)}</span>`:''}${esc(t.rep||evNo(t.seq))}様 <small>${esc(evNo(t.seq))} · ${esc(t.dep.slice(5))}~${esc(t.arr.slice(5))}</small>${isLocalSeq(t.seq)?' <span class="shz-loc">現地</span>':''}${t.annex?' <span style="color:var(--purple2)">別棟</span>':''}</div>
      ${t.mates.length?`<div class="rk-mates">🛏 ${t.mates.map(m=>esc(m.room+' '+m.nm)).join(' · ')}</div>`:''}
      <div class="rk-mem">${t.ms.map(m=>`<button class="chip${BSEL.has(m.member_id)?' on':''}" draggable="true" ondragstart="bDragStart(event,'${m.member_id}')" onclick="bToggleSel('${m.member_id}')">${esc(shzMemName(m))}様</button>`).join('')}</div>
    </div>`).join('') : `<div class="rk-empty">${tx('unNone')}</div>`;
  // 선택(배정 대상) 인원의 체류구간·팀 → 이 기간 중 다른 팀이 쓰는 방은 그날 비어보여도 '체류중(기간)'으로 차단(Min: 헷갈림 방지)
  let selSpan=null, selSeq=null;
  if(BSEL.size){ let sd=null,sa=null; BSEL.forEach(mid=>{ const s=memSpan(mid); if(s){ if(!sd||s.dep<sd)sd=s.dep; if(!sa||s.arr>sa)sa=s.arr; } }); if(sd&&sa){ selSpan={dep:sd,arr:sa}; selSeq=memEventSeq([...BSEL][0]); } }
  const roomsHtml=SHZ_ROOMS.map(room=>{
    const occ=cellOcc(room,date), closed=roomClosedOnDate(room,date), bz=SHZ_BYEOLCHE.includes(room), used=occ.length;
    let cls=closed?'closed':used===0?'empty':used>=3?'full3':used>=2?'full':'part';
    // 포커스일엔 비었지만(0/2) 선택팀 체류기간 중 다른 팀이 점유 → 체류중(기간)으로 차단
    let spanHit=null;
    if(selSpan && !closed && used===0){
      // ⚠ 체크아웃일(g.co===date)엔 그날 밤 안 묵으므로 '滞在中' 제외(방 비어 있음 — Min: 담당자 헷갈림 방지).
      //   g.co>date = 그 날짜 밤에도 재실(아직 퇴실 전)인 팀만 기간점유로 표시.
      const others=GUESTS.filter(g=>g.room_no===room && g.ci<selSpan.arr && selSpan.dep<g.co && g.co>date && !BSEL.has(g.member_id) && String(g.event_seq)!==String(selSeq));
      if(others.length){ others.sort((a,b)=>(a.ci||'').localeCompare(b.ci||'')); spanHit=others[0]; cls='empty spanbusy'; }
    }
    const clReason=closed?((CLOSURES.find(c=>c.room_no===room&&c.from_date<=date&&date<=c.to_date)||{}).reason||''):'';
    const body=closed
      ? `<div class="rm-closed">🔒 ${esc(clReason||tx('swapClosedT'))}</div>`
      : spanHit
      ? `<div class="rm-spanbusy">🛏 ${esc(nameOf(spanHit))}様 <small>${esc((spanHit.ci||'').slice(5))}~${esc((spanHit.co||'').slice(5))}</small><div class="rm-sb-lbl">${tx('spanBusyLbl')}</div></div>`
      : (occ.length? occ.map(g=>{ const _rp=String((BOOK[g.event_seq]||{}).rep_name||'').trim(); return `<span class="oc${BSEL.has(g.member_id)?' sel':''}${isLocalSeq(g.event_seq)?' local':''}" draggable="true" ondragstart="bDragStart(event,'${g.member_id}')" title="${esc(_rp?tx('teamOf')(_rp):'')}">${isLocalSeq(g.event_seq)?'<span class="shz-loc">現地</span>':''}<span class="nm" onclick="event.stopPropagation();bToggleSel('${g.member_id}')">${esc(nameOf(g))}様</span><button class="x" onclick="event.stopPropagation();bUnassign('${g.member_id}')">✕</button></span>`; }).join('') : `<div class="cnt" style="color:var(--muted)">—</div>`);
    const act = closed ? '' : spanHit ? ` onclick="bSpanBusy()"` : ` onclick="bPlace('${room}','${date}')" ondragover="bDragOver(event,this)" ondragleave="bDragLeave(this)" ondrop="bDrop(event,'${room}','${date}')"`;
    return `<div class="rm ${cls}"${act}>
      <div class="rm-hd"><span class="rm-no">${SHZ_ROOMNO[room]||''}</span>${room}<span class="rm-zone${bz?' bz':''}">${bz?tx('annexLbl'):tx('mainLbl')}</span><span class="rm-cap${used>2?' over':''}">${spanHit?'🛏':used+'/2'}</span>${used>2?`<span class="rm-over">${tx('overLbl')}</span>`:''}</div>
      ${body}</div>`;
  }).join('');
  // ── 그날 팀별 인원·방 요약(담당자 가독): event_seq로 묶어 '대표 N名 [방]' ──
  //   방 카드는 개인 칩이라 팀 구분이 흐림 → 팀이 여러 방에 나뉘거나(강수연 301·302) 한 방을
  //   두 팀이 나눠 쓸 때(강수연+강석문 합류) 상단 요약으로 한눈에 파악.
  const tsum={};
  SHZ_ROOMS.forEach(room=>{ cellOcc(room,date).forEach(g=>{ const e=tsum[g.event_seq]||(tsum[g.event_seq]={seq:g.event_seq,n:0,rooms:new Set()}); e.n++; e.rooms.add(room); }); });
  const _rno=r=>SHZ_ROOMNO[r]||r;
  const tsumHtml=Object.values(tsum)
    .sort((a,b)=>_rno([...a.rooms].sort()[0]).localeCompare(_rno([...b.rooms].sort()[0])))
    .map(e=>{ const rep=repEnOf(e.seq)||evNo(e.seq);   // 방 칩과 동일하게 영문명(Min)
      const rooms=[...e.rooms].sort((x,y)=>_rno(x).localeCompare(_rno(y))).map(_rno).join('·');
      const loc=isLocalSeq(e.seq)?'<span class="shz-loc">現地</span> ':'';
      return `<span class="shz-tsum">${loc}${esc(rep)}様<b>${e.n}${tx('nameUnit')}</b><small>${esc(rooms)}</small></span>`; }).join('');
  const tsumBar=tsumHtml?`<div class="brd-tsum">${tsumHtml}</div>`:'';
  return `<div class="brd-day">${showHd?`<div class="brd-day-hd">📅 ${fmtDate(date)}</div>`:''}${tsumBar}<div class="brd-grid"><div class="brd-rack" ondragover="bDragOverRack(event,this)" ondragleave="bDragLeave(this)" ondrop="bDropRack(event,this)"><div class="cnt" style="font-weight:800;color:var(--err);margin-bottom:7px">⚠ ${tx('rackH')}</div>${rackHtml}</div><div class="brd-rooms">${roomsHtml}</div></div></div>`;
}
function bToggleSel(mid){ if(BSEL.has(mid))BSEL.delete(mid); else BSEL.add(mid); renderBoard(); }
function bSpanBusy(){ toast(tx('spanBusyMsg'),'warn'); }   // 체류중(기간) 방 클릭 시 안내
// ── 드래그&드롭: 방 카드에 놓기=배정/이동/병합 · 미배정 행거에 놓기=해제 ──
let DRAG=[];
function bDragStart(e,mid){ DRAG = BSEL.has(mid)?[...BSEL]:[mid]; try{ e.dataTransfer.setData('text/plain',mid); e.dataTransfer.effectAllowed='move'; }catch(_){} }
function bDragOver(e,el){ e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){} if(el) el.classList.add('dragover'); }
function bDragOverRack(e,el){ e.preventDefault(); if(el) el.classList.add('dragover'); }
function bDragLeave(el){ if(el) el.classList.remove('dragover'); }
function bDrop(e,room){ e.preventDefault(); if(e.currentTarget) e.currentTarget.classList.remove('dragover'); const ids=DRAG.slice(); DRAG=[]; if(ids.length) bPlaceIds(ids,room); }
function bDropRack(e,el){ e.preventDefault(); if(el) el.classList.remove('dragover'); const ids=DRAG.slice(); DRAG=[]; if(ids.length) bUnassignIds(ids); }
// 선택/드래그 인원을 room에 배정/이동/병합(개인 단위). 정원(3)·폐쇄 초과는 스킵.
function bPlace(room){ if(!BSEL.size){ toast(tx('placeNone'),'warn'); return; } bPlaceIds([...BSEL],room); }
async function bPlaceIds(ids,room){
  if(!supa||!SHZ_INV){ toast(tx('connFail'),'err'); return; }
  const inv=SHZ_INV[room]; if(!inv){ toast(tx('swapNoInv'),'err'); return; }
  const sel=new Set(ids), accepted=[]; let skipped=0;
  ids.forEach(mid=>{
    let sp=memSpan(mid); if(!sp){ skipped++; return; }
    // 같은 팀이 이미 이 방에 있으면 그 방 체류기간으로 합류(예약 전체 span이 아니라 실제 방 체류에 맞춤)
    //   → 예약이 긴 팀(한국출발~귀국 전체)이 미배정일 때 다른 날짜의 타팀까지 겹침으로 세어 정원 오초과되는 문제 방지.
    const es=memEventSeq(mid);
    if(es!=null){ const mate=GUESTS.find(g=>g.room_no===room && String(g.event_seq)===String(es) && g.ci && g.co); if(mate) sp={dep:mate.ci,arr:mate.co}; }
    if(roomClosed(room,sp.dep,sp.arr)){ skipped++; return; }
    let used=0;
    GUESTS.forEach(g=>{ if(g.room_no===room && !sel.has(g.member_id) && g.ci<sp.arr && sp.dep<g.co) used++; });   // 기존 점유(이동 대상 제외)
    accepted.forEach(a=>{ if(a.dep<sp.arr && sp.dep<a.arr) used++; });                                          // 이번에 같이 넣는 인원
    if(used+1>3){ skipped++; return; }   // 정원 2 + 강제 1명(총 3)까지 허용 · 4명째 차단
    accepted.push({mid,dep:sp.dep,arr:sp.arr});
  });
  if(!accepted.length){ toast(tx('placeBlocked'),'warn'); return; }
  // 되돌리기용: 이동 대상 각자의 '이동 직전' 방 상태 스냅샷(배정돼 있던 사람=그 방들 / 미배정이던 사람=빈 rows)
  const preSnap=accepted.map(a=>({mid:a.mid, rows:snapMembers([a.mid])}));
  const prows=accepted.map(a=>({member_id:a.mid,inventory_id:inv,room_no:room,check_in:a.dep,check_out:a.arr}));
  try{
    const {data:n,error}=await supa.rpc('shizu_place',{p_rows:prows});
    if(error)throw error;
    const placed=(typeof n==='number')?n:prows.length;
    const miss=skipped+Math.max(0,prows.length-placed);
    BSEL.clear();
    shzToastUndo(tx('placeDone')(placed)+(miss?tx('placeSkip')(miss):''), ()=>shzRestoreMove(preSnap)); load();   // ↩ 이동 되돌리기
  }catch(e){ toast(tx('apFail')+(e.message||e),'err'); }
}
// 이동 되돌리기: 배정돼 있던 사람은 원래 방으로 재배치, 미배정이던 사람은 다시 미배정으로
async function shzRestoreMove(preSnap){
  if(!supa||!preSnap||!preSnap.length) return;
  const restore=[], back=[];
  preSnap.forEach(p=>{ if(p.rows&&p.rows.length) restore.push(...p.rows); else back.push(p.mid); });
  try{
    if(restore.length){ const {error}=await supa.rpc('shizu_place',{p_rows:restore}); if(error)throw error; }
    if(back.length){ const {error}=await supa.rpc('shizu_unassign',{p_member_ids:back}); if(error)throw error; }
    toast(tx('restored'),'ok'); load();
  }catch(e){ toast(tx('apFail')+(e.message||e),'err'); }
}
// 배정된 인원의 현재 방 상태 스냅샷(되돌리기용)
function snapMembers(ids){ const rows=[]; ids.forEach(mid=>{ GUESTS.filter(g=>g.member_id===mid).forEach(g=>rows.push({member_id:g.member_id,inventory_id:g.invId,room_no:g.room_no,check_in:g.ci,check_out:g.co})); }); return rows; }
// 개인 배정 해제(미배정 행거로) — 되돌리기 토스트
function bUnassign(mid){ bUnassignIds([mid]); }
async function bUnassignIds(ids){
  if(!supa){ toast(tx('connFail'),'err'); return; }
  const assigned=ids.filter(mid=>GUESTS.some(g=>g.member_id===mid));
  if(!assigned.length) return;   // 드래그로 미배정자를 행거에 놓음 = 무시
  const snap=snapMembers(assigned);
  try{
    const {error}=await supa.rpc('shizu_unassign',{p_member_ids:assigned});
    if(error)throw error;
    assigned.forEach(m=>BSEL.delete(m));
    _shzUndo=snap; shzToastUndo(tx('unDone')); load();
  }catch(e){ toast(tx('apFail')+(e.message||e),'err'); }
}
// ── 되돌리기(해제 직후) ──
let _shzUndo=null;
function shzToastUndo(msg, undoFn){
  const box=$('#toast'); if(!box){ toast(msg,'ok'); return; }
  const t=document.createElement('div'); t.className='toast ok';
  const s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
  const b=document.createElement('button'); b.className='btn sm'; b.textContent='↩ '+tx('undo');
  b.onclick=()=>{ t.remove(); (undoFn||shzRestore)(); }; t.appendChild(b);
  box.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 10000);   // 되돌리기 판단 여유(6초→10초, Min)
}
// 자동배정 되돌리기: 배정 직전 auto 스냅샷을 같은 RPC로 재적용(auto만 정리·manual 보존)
async function shzRestoreAuto(snap,start,end){
  if(!supa) return;
  try{ const {error}=await supa.rpc('shizu_assign_rooms',{p_rows:snap||[],p_clear_from:start,p_clear_to:end}); if(error)throw error;
    toast(tx('restored'),'ok'); load(); }
  catch(e){ toast(tx('autoFail')+(e.message||e),'err'); }
}
async function shzRestore(){
  if(!supa||!_shzUndo||!_shzUndo.length) return;
  const rows=_shzUndo; _shzUndo=null;
  try{ const {error}=await supa.rpc('shizu_place',{p_rows:rows}); if(error)throw error; toast(tx('restored'),'ok'); load(); }
  catch(e){ toast(tx('apFail')+(e.message||e),'err'); }
}
// ── 배정 전체 비우기(그 달 시즈 배정 전원 해제 → 미배정, 되돌리기 가능) ──
async function bClearAll(){
  if(!supa){ toast(tx('connFail'),'err'); return; }
  const ids=[...new Set(GUESTS.map(g=>g.member_id))];
  if(!ids.length){ toast(tx('clearAllNone'),'warn'); return; }
  if(!confirm(tx('clearAllConfirm')(ids.length))) return;
  const snap=snapMembers(ids);
  try{
    const {error}=await supa.rpc('shizu_unassign',{p_member_ids:ids});
    if(error)throw error;
    BSEL.clear(); _shzUndo=snap; shzToastUndo(tx('clearAllDone')(ids.length)); load();
  }catch(e){ toast(tx('apFail')+(e.message||e),'err'); }
}

// ── 비고·현지비고 일본어 번역(DeepL 엣지) — 미번역만 요청 후 캐시·재렌더 ──
const hasKo=s=>/[가-힣]/.test(String(s||''));
async function translateRemarks(){
  if(!supa) return;
  const items=[];
  Object.values(BOOK).forEach(b=>{
    const needR = b.remark && hasKo(b.remark) && !b.remark_ja;
    const needL = b.remark_local && hasKo(b.remark_local) && !b.remark_local_ja;
    if(needR||needL) items.push({ event_seq:b.event_seq, remark:needR?b.remark:'', remark_local:needL?b.remark_local:'' });
  });
  if(!items.length) return;
  try{
    const {data,error}=await supa.functions.invoke('translate-remarks',{body:{items}});
    if(error) throw error;
    if(data&&data.error) throw new Error(data.error);
    const res=(data&&data.results)||{};
    Object.keys(res).forEach(seq=>{ const b=BOOK[seq]; if(!b)return;
      if(res[seq].remark_ja!=null) b.remark_ja=res[seq].remark_ja;
      if(res[seq].remark_local_ja!=null) b.remark_local_ja=res[seq].remark_local_ja; });
    renderPreview();
  }catch(e){ /* DeepL 미설정(보류) 등 실패 시 조용히 원문 표시 — 사용자에게 에러 토스트 안 띄움 */ try{ console.debug('translateRemarks skipped:', e&&e.message); }catch(_){} }
}
// 특정 날짜에 묵는 팀들의 비고(일본어 우선·원문 병기) HTML
function bigoFor(date){
  const seen=new Set(), seqs=[];
  SHZ_ROOMS.forEach(room=>cellOcc(room,date).forEach(g=>{ if(!seen.has(g.event_seq)){ seen.add(g.event_seq); seqs.push(g.event_seq); } }));
  const parts=[];
  seqs.forEach(seq=>{
    const b=BOOK[seq]; if(!b)return;
    const rep=String(b.rep_name||'').trim();
    // 현지비고에 '별채/별관/別棟/別館' 포함 = 別棟 사전신청 → 객실 개인욕탕 물 채우기 필요
    const annex=SHZ_ANNEX_RE.test(String(b.remark_local||'')+' '+String(b.remark||''));
    const segs=[];
    const add=(orig,ja)=>{ orig=String(orig||'').replace(/\s*[\r\n]+\s*/g,' ').trim(); if(!orig)return;
      const jaT=String(ja||'').replace(/\s*[\r\n]+\s*/g,' ').trim();
      if(jaT && jaT!==orig) segs.push(`<b>${esc(jaT)}</b> <span class="shz-bigo-o">(${esc(orig)})</span>`);
      else segs.push(esc(orig)); };
    add(b.remark_local, b.remark_local_ja);   // 현지비고(현장 전달) 우선
    add(b.remark, b.remark_ja);
    const head=annex?`<span class="shz-annex">別棟 浴槽準備</span> `:'';
    if(segs.length||annex) parts.push(`<span class="shz-bigo-t">${head}<b class="shz-bigo-nm">${esc(rep)}様</b> ${segs.join('　/　')}</span>`);
  });
  return parts.join('<br>');
}

// ── 예약표에서 방 맞바꾸기 / 빈 객실 이동 (rooms 직접 수정 · RPC 경유) ──
//   방 이름 클릭 → 선택(하이라이트) → 다른 방 클릭 = 그 방 팀과 맞바꾸기(빈 방이면 이동).
//   대상은 그 날짜에 겹치는 팀의 '체류 전체'(각 멤버 배정행). 같은 날짜 안에서만.
function shzCellClick(room,date){
  if(!SEL){ if(!cellOcc(room,date).length){ toast(tx('swapPickFirst'),'warn'); return; } SEL={room,date}; renderPreview(); return; }
  if(SEL.date!==date){ SEL=cellOcc(room,date).length?{room,date}:null; renderPreview(); return; }  // 다른 날짜=새 선택
  if(SEL.room===room){ SEL=null; renderPreview(); return; }   // 같은 칸=취소
  swapOrMove(SEL.room, room, date);
}
async function swapOrMove(srcRoom,tgtRoom,date){
  if(!supa || !SHZ_INV){ toast(tx('connFail'),'err'); return; }
  const srcOcc=cellOcc(srcRoom,date), tgtOcc=cellOcc(tgtRoom,date);
  if(!srcOcc.length){ SEL=null; renderPreview(); return; }
  const srcInv=SHZ_INV[srcRoom], tgtInv=SHZ_INV[tgtRoom];
  if(!srcInv||!tgtInv){ toast(tx('swapNoInv'),'err'); return; }
  const move = tgtOcc.length===0;
  const srcIds=srcOcc.map(g=>g.id), tgtIds=tgtOcc.map(g=>g.id);
  const exAll=new Set(srcIds.concat(tgtIds));
  // 충돌: 대상 방이 옮겨갈 팀 체류기간에 (서로 외) 다른 팀으로 차 있으면 불가
  const conflict=(roomNo,rows)=> GUESTS.some(g=> g.room_no===roomNo && !exAll.has(g.id) && rows.some(r=> g.ci<r.co && r.ci<g.co));
  if(conflict(tgtRoom,srcOcc) || (!move && conflict(srcRoom,tgtOcc))){ toast(tx('swapConflict'),'err'); return; }
  // 폐쇄된 객실로는 이동/맞바꾸기 불가
  if(roomClosed(tgtRoom,srcOcc[0].ci,srcOcc[0].co) || (!move && roomClosed(srcRoom,tgtOcc[0].ci,tgtOcc[0].co))){ toast(tx('swapClosedT'),'err'); return; }
  const repNm=(nameOf(srcOcc[0])||srcOcc[0].nameKr||'');
  const msg = move ? `${repNm}様 · ${srcRoom} → ${tgtRoom}\n${tx('swapMoveAsk')}` : `${srcRoom} ↔ ${tgtRoom}\n${tx('swapAsk')}`;
  if(!confirm(msg)) return;
  try{
    const {error}=await supa.rpc('shizu_swap_rooms',{
      p_src_ids:srcIds, p_src_room:srcRoom, p_src_inv:srcInv,
      p_tgt_ids:(move?[]:tgtIds), p_tgt_room:tgtRoom, p_tgt_inv:tgtInv });
    if(error)throw error;
    SEL=null; toast(tx('swapDone'),'ok'); load();
  }catch(e){ toast(tx('swapFail')+(e.message||e),'err'); }
}

// ── 객실 폐쇄 판정 ──
function roomClosed(room,ci,co){ return CLOSURES.some(c=>c.room_no===room && ci<=c.to_date && co>c.from_date); }   // 체류구간 겹침
function roomClosedOnDate(room,date){ return CLOSURES.some(c=>c.room_no===room && c.from_date<=date && date<=c.to_date); }

// ── 자동배정: 미배정 인원을 本館·別棟 2인1실(무조건 2인). 남는 1명=1인 1실. 北條(203)은 本館 중 후순위 ──
//   · auto 배정은 그 달치 전부 정리 후 재배치(manual/맞바꿈/수기추가는 보존).
//   · 현지비고 별채/별관 팀 = 別棟 우선. 방 부족 = 미배정(예약표에 未N 표기).
// 미배정팀만 빈 방에 증분 배정(기존 manual·auto 전부 보존). 서버 RPC shizu_autofill.
//   step1 등록 시 자동 호출되는 것과 동일 로직 — 여기서 수동 트리거도 가능.
async function autofillShizu(){
  if(!supa){ toast(tx('connFail'),'err'); return; }
  const btn=$('#btn-autofill'); if(btn) btn.disabled=true;
  try{
    // 보이는 범위(달력)에 걸치는 모든 월을 자동배정 — 월경계 보기(7·8월)일 때 양쪽 다 채움
    const b=curBounds(); const months=new Set(); let cur=b.start.slice(0,7);
    for(let i=0;i<24 && cur<=b.end.slice(0,7); i++){ months.add(cur); cur=shiftYM(cur,1); }
    let placed=0;
    for(const mm of months){ const {data:n,error}=await supa.rpc('shizu_autofill',{p_ym:mm}); if(error)throw error; if(typeof n==='number') placed+=n; }
    toast(placed?tx('autofillDone')(placed):tx('autofillNone'), placed?'ok':'warn');
    await load();
  }catch(e){ toast(tx('autoFail')+(e.message||e),'err'); }
  finally{ if(btn) btn.disabled=false; }
}
async function autoAssignShizu(){
  if(!supa||!SHZ_INV){ toast(tx('connFail'),'err'); return; }
  const {start,end}=monthBounds(YM);
  try{
    const {data:gs}=await supa.from('guests').select('event_seq,accom,bookings!inner(dep_date,arr_date)').eq('accom',FACILITY);
    const teams=(gs||[]).map(g=>({seq:g.event_seq,dep:String((g.bookings||{}).dep_date||'').slice(0,10),arr:String((g.bookings||{}).arr_date||'').slice(0,10)}))
      .filter(t=>t.dep&&t.arr&&t.dep<=end&&t.arr>start);
    if(!teams.length){ toast(tx('autoNone'),'warn'); return; }
    const seqs=[...new Set(teams.map(t=>t.seq))];
    const gms=seqs.length? await pagedIn('guest_members','id,event_seq','event_seq',seqs) : [];
    const bks=seqs.length? await pagedIn('bookings','event_seq,remark,remark_local','event_seq',seqs) : [];
    // 팀 최고령 나이 — 「어르신이 있는 팀을 本館(2층)에」 우선 배정용(Min). 생년월일은 passengers 보유.
    const pxAge=seqs.length? await pagedIn('passengers','event_seq,birth,birth_yymmdd','event_seq',seqs) : [];
    const bkMap={}; bks.forEach(b=>bkMap[b.event_seq]=b);
    // 수기(맞바꿈·강제추가)만 점유 시드로 보존 — auto는 서버에서 정리 후 새로 채움
    const manual=GUESTS.filter(g=>g.src==='manual');
    const keep=new Set(manual.map(g=>g.member_id));
    const byTeam={}; gms.forEach(m=>{ if(!keep.has(m.id)){ (byTeam[m.event_seq]=byTeam[m.event_seq]||[]).push(m.id); } });
    // 현지비고에 별채/별관 포함 = 別棟(별채) 선호
    const annexPref={}; teams.forEach(t=>{ const b=bkMap[t.seq]||{}; annexPref[t.seq]=SHZ_ANNEX_RE.test(String(b.remark_local||'')+' '+String(b.remark||'')); });
    //  · 일반팀: 本館 201·202·204(志津·合歓·山法師) → 203(北條) → 離れ 301·302·303(吉祥·瑞雲·馬酔木)
    //    (北條은 완전 최후가 아니라 '本館 중 후순위' — 別棟보다는 먼저)
    //  · 別棟 선호팀(별채 사전신청): 離れ(吉祥·瑞雲·馬酔木) 먼저 → 本館(志津·合歓·山法師) → 北條
    const POOL_ANNEX=['吉祥','瑞雲','馬酔木','志津','合歓','山法師','北條'];
    const POOL_MAIN =['志津','合歓','山法師','北條','吉祥','瑞雲','馬酔木'];
    const pending=[];
    // 점유 = 수기 배정(manual) + 이번 배치(pending)  (auto 기존분은 정리되므로 제외)
    const occ=(room,ci,co)=>{ let n=0; manual.forEach(g=>{ if(g.room_no===room && g.ci<co && ci<g.co) n++; }); pending.forEach(p=>{ if(p.room===room && p.ci<co && ci<p.co) n+=p.cnt; }); return n; };
    const rows=[]; let holds=0;
    // 자동배정 = 2인 1실 페어만. 홀수로 남는 1명은 방에 억지로 안 넣고 미배정(현장에서 3인방으로 수기 추가).
    //   예 2→[2] · 3→[2]+1미배정 · 4→[2,2] · 5→[2,2]+1미배정  (한 방에 3명 몰지 않음 — Min 결정)
    const chunkTeam=(n)=>{ const pairs=[]; while(n>=2){ pairs.push(2); n-=2; } return {pairs, leftover:n}; };  // leftover = 0 또는 1
    const placeTeam=(t)=>{
      const mem=byTeam[t.seq]; if(!mem||!mem.length) return;
      const pool=annexPref[t.seq]?POOL_ANNEX:POOL_MAIN;
      const {pairs,leftover}=chunkTeam(mem.length); let idx=0;
      for(const sz of pairs){
        const chunk=mem.slice(idx,idx+sz); idx+=sz; let placed=false;
        for(const room of pool){
          const inv=SHZ_INV[room]; if(!inv) continue;
          if(roomClosed(room,t.dep,t.arr)) continue;         // 폐쇄 제외
          if(occ(room,t.dep,t.arr)===0){                     // 빈 방만(팀 혼합 방지·남의 방 3번째 안 끼움)
            chunk.forEach(mid=>rows.push({member_id:mid,inventory_id:inv,room_no:room,check_in:t.dep,check_out:t.arr}));
            pending.push({room,ci:t.dep,co:t.arr,cnt:chunk.length}); placed=true; break;
          }
        }
        if(!placed) holds+=chunk.length;   // 방 부족 = 미배정(未N)
      }
      holds += leftover;   // 홀수로 남는 1명 = 미배정(자동으론 3인방 안 만듦, 현장 수기)
    };
    // ── 처리 순서: 별채 선호팀 먼저 → 각 그룹 안에서 '최고령 내림차순' → 동률이면 예약순 ──
    //   本館(志津·合歓·山法師·北條)이 일반팀 풀의 앞이라, 먼저 처리된 팀이 本館을 가져간다.
    //   즉 어르신이 있는 팀이 계단 적은 本館(2층)을 우선 배정받고, 젊은 팀이 離れ(別棟)로 밀린다.
    //   ⚠ 別棟 선호팀은 나이와 무관하게 離れ 우선 — 사전 요청이 나이보다 앞선다.
    //   ⚠ 나이 = 그 팀 체크인일 기준 만나이의 팀 내 최댓값. 생년월일이 없으면 -1(맨 뒤).
    const teamAge={};
    pxAge.forEach(p=>{
      const d=(function(){
        if(p.birth) return String(p.birth).slice(0,10);
        const y6=String(p.birth_yymmdd||'').replace(/\D/g,''); if(y6.length!==6) return '';
        const yy=+y6.slice(0,2), cy=new Date().getFullYear()%100;
        return (yy>cy?1900+yy:2000+yy)+'-'+y6.slice(2,4)+'-'+y6.slice(4,6);
      })();
      if(!d) return;
      const t=teams.find(x=>x.seq===p.event_seq); if(!t) return;
      const ref=t.dep, a=ageOn(d,ref);
      if(a>=0 && a>(teamAge[p.event_seq]===undefined?-1:teamAge[p.event_seq])) teamAge[p.event_seq]=a;
    });
    const ageOf=s2=>(teamAge[s2]===undefined?-1:teamAge[s2]);
    const byAge=(a,b)=>(ageOf(b.seq)-ageOf(a.seq))||(a.seq-b.seq);
    const sorted=teams.slice().sort(byAge);
    sorted.filter(t=>annexPref[t.seq]).forEach(placeTeam);   // 별채 선호팀 먼저(별채 확보)
    sorted.filter(t=>!annexPref[t.seq]).forEach(placeTeam);  // 그다음 일반팀(최고령 순)
    if(!rows.length){ toast(tx('autoNone'),'warn'); return; }
    if(!confirm(tx('autoConfirm')(rows.length))) return;
    // 되돌리기용: 배정 직전 auto 방 스냅샷(manual 제외 — RPC가 manual은 안 건드림)
    const autoSnap=GUESTS.filter(g=>g.src!=='manual').map(g=>({member_id:g.member_id,inventory_id:g.invId,room_no:g.room_no,check_in:g.ci,check_out:g.co}));
    const {data:placedN,error}=await supa.rpc('shizu_assign_rooms',{p_rows:rows,p_clear_from:start,p_clear_to:end});
    if(error)throw error;
    // RPC는 정원초과 행을 건너뛰고 '되는 데까지' 배정 → 실제 배정 수·미배정 수 반영
    const placed=(typeof placedN==='number')?placedN:rows.length;
    const unplaced=holds + Math.max(0, rows.length-placed);
    const msg=tx('autoDone')(placed)+(unplaced?` · ${tx('autoHold')(unplaced)}`:'');
    shzToastUndo(msg, ()=>shzRestoreAuto(autoSnap,start,end)); load();   // ↩ 되돌리기 제공
  }catch(e){ toast(tx('autoFail')+(e.message||e),'err'); }
}

// ── 미배정 인원 수기 배정(2인 초과 강제추가 포함) ──
//   해당 날짜 미배정자 목록 → 각자 방 선택 → shizu_assign_rooms(src:'manual', 정원가드=최대3) ──
function shzRoomOccSpan(room,dep,arr){ let n=0; GUESTS.forEach(g=>{ if(g.room_no===room && g.ci<arr && dep<g.co) n++; }); return n; }
function shzMemName(r){ return titleCase(r.nameEn)||r.nameKr||String(r.member_id||'').slice(0,6); }
function openShzAssignPicker(date){
  if(!supa||!SHZ_INV){ toast(tx('connFail'),'err'); return; }
  const list=UNASSIGNED.filter(r=>nightsBetween(r.dep,r.arr).includes(date));
  if(!list.length){ toast(tx('unNone'),'warn'); return; }
  const old=document.getElementById('ap-back'); if(old) old.remove();
  // 팀별 정렬(같은 팀 연속) — 강제추가 파악 쉽게
  list.sort((a,b)=>(a.event_seq-b.event_seq)||shzMemName(a).localeCompare(shzMemName(b)));
  const rowHtml=list.map((r,i)=>{
    const rep=(BOOK[r.event_seq]||{}).rep_name||'';
    // 같은 팀원이 이미 배정된 방(강제추가 대상) 우선 프리셀렉트
    const mateRoom=(GUESTS.find(g=>g.event_seq===r.event_seq && g.ci<r.arr && r.dep<g.co)||{}).room_no||'';
    const opts=SHZ_ROOMS.map(room=>{
      const n=shzRoomOccSpan(room,r.dep,r.arr); const closed=roomClosed(room,r.dep,r.arr);
      const full=n>=3; const dis=closed||full;
      const sel=(mateRoom&&room===mateRoom)?' selected':'';

      <button class="btn sm" id="ap-save">${tx('apSave')}</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.addEventListener('click',e=>{ if(e.target===back) back.remove(); });

}
async function doShzManualAssign(back){
  const rows=[];
  back.querySelectorAll('.ap-row').forEach(el=>{
    if(!el.querySelector('.ap-sel').checked) return;
    const room=el.querySelector('.ap-room').value; if(!room) return;
    const inv=SHZ_INV[room]; if(!inv) return;
    rows.push({member_id:el.getAttribute('data-mid'),inventory_id:inv,room_no:room,
      check_in:el.getAttribute('data-dep'),check_out:el.getAttribute('data-arr'),src:'manual'});
  });
  if(!rows.length){ toast(tx('apNone'),'warn'); return; }
  try{
    const {error}=await supa.rpc('shizu_assign_rooms',{p_rows:rows});
    if(error)throw error;
    back.remove(); toast(tx('apDone')(rows.length),'ok'); load();
  }catch(e){ toast(tx('apFail')+(e.message||e),'err'); }   // 정원(3)초과 = 트리거가 롤백
}

function renderClosureList(){
  const el=$('#cl-list'); if(!el)return;
  el.innerHTML=CLOSURES.length?CLOSURES.slice().sort((a,b)=>a.from_date.localeCompare(b.from_date)).map(c=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0"><span style="flex:1">🔒 ${(SHZ_ROOMNO[c.room_no]||'')} ${esc(c.room_no)} · ${esc(c.from_date)}~${esc(c.to_date)}${c.reason?' · '+esc(c.reason):''}</span><button class="btn ghost sm" onclick="delClosure('${c.id}')">✕</button></div>`).join(''):`<div class="cnt" style="color:var(--muted)">${tx('clNone')}</div>`;

async function addClosure(){
  const room=$('#cl-room').value, from=$('#cl-from').value, to=$('#cl-to').value, reason=$('#cl-reason').value.trim();
  if(!room||!from||!to){ toast(tx('clNeed'),'warn'); return; }
  if(to<from){ toast(tx('clRangeErr'),'warn'); return; }
  const inv=SHZ_INV[room]; if(!inv){ toast(tx('swapNoInv'),'err'); return; }
  try{
    const {data,error}=await supa.from('room_closures').insert({inventory_id:inv,from_date:from,to_date:to,reason:reason||null}).select().single();
    if(error)throw error;
    CLOSURES.push({id:data.id,inventory_id:inv,room_no:room,from_date:from,to_date:to,reason:reason||''});
    $('#cl-reason').value=''; renderClosureList(); updateCloseBadge(); renderPreview(); toast(tx('clDone'),'ok');
  }catch(e){ toast(tx('clFail')+(e.message||e),'err'); }
}
async function delClosure(id){
  try{ const {error}=await supa.from('room_closures').delete().eq('id',id); if(error)throw error;
    CLOSURES=CLOSURES.filter(c=>String(c.id)!==String(id)); renderClosureList(); updateCloseBadge(); renderPreview(); toast(tx('clRemoved'),'ok');
  }catch(e){ toast(tx('clFail')+(e.message||e),'err'); }
}
