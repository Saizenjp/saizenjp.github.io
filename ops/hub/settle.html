<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 현장 정산</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<style>
  :root{
    /* 사이젠 올리브 그린 기반 라이트 팔레트 (saizen-ops.css 가 accent 통일) */
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad;
    --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
    /* 카테고리 포인트색 */
    --c-round:#1e3a8a; --c-food:#92400e; --c-stay:#5b21b6; --c-shop:#065f46; --c-etc:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);line-height:1.55;min-height:100vh;
  }
  .topbar{
    position:sticky;top:0;z-index:30;background:var(--surface);
    border-bottom:3px solid var(--accent);padding:13px 22px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06);
  }
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  /* 자주 안 쓰는 수기 입력은 접어 둔다 — 평소엔 명세·결제수단·마감만 보이게(Min 2026-08) */
  details.fold{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:8px 0;padding:0 12px}
  details.fold>summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text2);padding:9px 0;list-style:none}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary:hover{color:var(--accent)}
  details.fold[open]{padding-bottom:11px}
  /* 결제수단 = 버튼 2개(현금/카드) — 손님 앞 1동작 선택. 미정이면 앰버 테두리로 눈에 띈다. */
  .pmbtns{display:inline-flex;gap:4px}
  .pmbtn{font-family:inherit;font-size:12px;font-weight:700;padding:4px 11px;border-radius:6px;cursor:pointer;
    border:1px solid var(--border2);background:var(--surface);color:var(--text2)}
  .pmbtn:hover{border-color:var(--accent);color:var(--accent)}
  .pmbtn.on.cash{background:var(--accent);border-color:var(--accent);color:#fff}
  .pmbtn.on.card{background:#2f6f8f;border-color:#2f6f8f;color:#fff}
  .pmbtns.unset .pmbtn{border-color:var(--warn);color:var(--warn)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.connected:hover{background:#266a45}

  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .conn .hint{font-size:11px;color:var(--muted)}

  .toolbar{padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar label{font-size:12px;color:var(--text2);font-weight:600}
  .toolbar .hint{font-size:11px;color:var(--muted)}

  .stage{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px 20px;align-items:start}
  @media(max-width:900px){.stage{grid-template-columns:1fr}}
  .col{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .col > h2{font-size:14px;font-weight:800;padding:12px 16px;border-bottom:2px solid var(--accentSoft);background:var(--surface2);color:var(--accent);display:flex;align-items:center;gap:8px}
  .col > h2 .cnt{font-size:12px;color:var(--text2);font-weight:700;margin-left:auto}
  .col-body{padding:13px;min-height:120px}

  /* folio 카드 */
  .folio-card{
    background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:8px;padding:10px 12px;margin-bottom:9px;cursor:pointer;transition:.12s;
  }
  .folio-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(15,23,42,.1)}
  .folio-card.sel{background:var(--accentSoft);border-color:var(--accent);box-shadow:0 2px 8px rgba(15,23,42,.12)}
  .folio-card .fh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .folio-card .ftag{font-family:var(--mono);font-weight:800;font-size:14px;color:var(--accent)}
  .folio-card .frep{font-size:13px;color:var(--text);font-weight:700}
  .folio-card .fmeta{font-size:12px;color:var(--text2);margin-top:3px}
  .folio-card .fbal{font-family:var(--mono);font-weight:800;font-size:14px;color:var(--text);margin-top:4px}
  .folio-card .fbal.zero{color:var(--ok)}
  .folio-card .fbal.due{color:var(--err)}
  .sbadge{font-size:9.5px;font-weight:700;border-radius:4px;padding:2px 6px;line-height:1;white-space:nowrap}
  .sbadge.s-open{color:#fff;background:var(--accent)}
  .sbadge.s-closed{color:var(--text2);background:var(--surface3);border:1px solid var(--border2)}
  .sbadge.s-settled{color:#fff;background:var(--ok)}
  .sbadge.s-member{color:var(--accent2);background:#fbf3e2;border:1px solid #e6cf95}

  .empty-hint{font-size:12px;color:var(--muted);text-align:center;padding:24px 0}

  /* 팀 그룹(개인 분할이 있는 팀: 팀 folio + 개인 folio 묶음) */
  .folio-group{border:1px solid var(--border2);border-radius:10px;margin-bottom:11px;overflow:hidden;background:var(--surface2)}
  .fg-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:8px 11px;background:var(--accentSoft);border-bottom:1px solid var(--border)}
  .fg-head .fg-tag{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--accent)}
  .fg-head .fg-rep{font-size:12.5px;font-weight:700;color:var(--text)}
  .fg-head .fg-split{font-size:9.5px;font-weight:700;color:var(--accent2);background:#fbf3e2;border:1px solid #e6cf95;border-radius:4px;padding:2px 6px;line-height:1}
  .fg-head .fg-bal{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:12.5px}
  .fg-head .fg-bal.zero{color:var(--ok)} .fg-head .fg-bal.due{color:var(--err)}
  .fg-body{padding:8px 8px 2px}
  .fg-body .folio-card{margin-bottom:7px}
  .fg-body .folio-card.member{margin-left:16px;border-left-width:3px;border-left-color:var(--accent2)}
  .fg-body .folio-card.member .ftag{font-size:11px;color:var(--muted);font-weight:700}

  /* 정산 상세 */
  .det-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:4px 4px 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
  .det-head .dt{font-size:18px;font-weight:800}
  .det-head .ds{font-size:12px;color:var(--text2);margin-top:2px}
  .det-head .dactions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

  table.lines{width:100%;border-collapse:collapse;font-size:13px}
  table.lines th{text-align:left;font-size:11px;color:var(--text2);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--border)}
  table.lines td{padding:6px 8px;border-bottom:1px solid var(--border)}
  table.lines td.num,table.lines th.num{text-align:right;font-family:var(--mono)}
  table.lines tr.voided td{opacity:.4;text-decoration:line-through}
  .catpill{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;color:#fff;white-space:nowrap}
  .cat-라운딩{background:var(--c-round)} .cat-식음{background:var(--c-food)} .cat-숙박{background:var(--c-stay)}
  .cat-골프샵{background:var(--c-shop)} .cat-기타{background:var(--c-etc)}
  .vbtn{cursor:pointer;color:var(--err);font-weight:700;font-size:13px;border:none;background:none;padding:2px 6px}
  .vbtn:hover{text-decoration:underline}

  .panel{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:14px}
  .panel > h3{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:9px}
  .form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .form-row .inp{flex:0 0 auto}
  .form-row .inp.desc{flex:1 1 160px}
  .form-row .calc{font-family:var(--mono);font-size:12px;color:var(--text2);font-weight:700}

  .totals{margin-top:14px;margin-left:auto;max-width:340px;font-size:13px}
  .totals .tr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
  .totals .tr.grand{font-weight:800;font-size:15px;border-bottom:2px solid var(--accent);color:var(--accent)}
  .totals .tr.bal{font-weight:800;font-size:15px}
  .totals .tr .v{font-family:var(--mono)}
  .totals .tr.bal .v.due{color:var(--err)} .totals .tr.bal .v.zero{color:var(--ok)}

  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(40,39,34,.4);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal h2{font-size:15px;font-weight:800;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal .mbody{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
  .modal .mbody label{font-size:12px;font-weight:700;color:var(--text2)}
  .modal .mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
  .pickitem{padding:8px 10px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:13px}
  .pickitem:hover{border-color:var(--accent);background:var(--accentSoft)}
  .pickitem.sel{border-color:var(--accent);background:var(--accentSoft)}
  .pickitem .pi-tag{font-family:var(--mono);font-weight:700;color:var(--accent)}

  #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);animation:popUp .2s;text-align:center;min-width:200px}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}
  /* 토스트는 이미 가운데 정렬된 통(#toast) 안의 flex 자식이다.
     예전 낱개 배치 시절의 translate(-50%)가 남아 있어, 뜰 때 제 너비의 절반만큼
     왼쪽으로 밀렸다가 제자리로 튀었다(Min 2026-08). 세로 이동만 남긴다. */
  @keyframes popUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>

<body data-so-area="settle">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム">
    <img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen">
  </a>
  <span class="step" data-i18n="st_step"></span>
  <a class="navhome" href="../index.html" data-i18n="navHome" style="margin-left:14px"></a>
  <div class="grow so-spacer"></div>
  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>

    <button class="so-furi" id="so-furi" onclick="__so_toggleFuri()"></button>

</div>

<div class="conn">

</div>

<div class="toolbar">

  <input class="inp" id="settle-day" type="date">
  <button class="btn ghost sm" id="btn-day-all" type="button" title="이 달 전체 팀 보기">월 전체</button>
  <button class="btn ghost sm" id="btn-sales" type="button" disabled data-i18n="st_btnSales"></button>
  <span class="hint" data-i18n="st_taxHint"></span>
</div>

<div class="stage">
  <!-- 좌: folio 목록 -->
  <div class="col">
    <h2><span data-i18n="st_colFolios"></span> <span class="cnt" id="folio-cnt"></span></h2>
    <div id="settle-accom" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px"></div>
    <input class="inp" id="settle-q" type="search" placeholder="이름·호수·대표자·그룹코드 검색" autocomplete="off" style="width:100%;margin-bottom:9px">
    <div class="col-body" id="folio-list">
      <div class="empty-hint" data-i18n="st_emptyFolios"></div>
    </div>
  </div>
  <!-- 우: 선택 folio 상세 -->
  <div class="col">
    <h2><span data-i18n="st_colDetail"></span></h2>
    <div class="col-body" id="detail">
      <div class="empty-hint" data-i18n="st_selectFolio"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

// ════════════════════════════════════════════════════════════════════════

let supa=null;

    chargeWord:'件', balance:'残高', monthWhole:'月全体', allChip:'全体',

    chargeMeta:'請求', totalWord:'合計', paidWord:'支払',
    teamUnit:'チーム', teamPrefix:'チーム', noTargetTeam:'対象チームがありません。(日付・宿泊施設フィルタをご確認、または「月全体」)',

    thCat:'区分', thDesc:'内訳', thQty:'数量', thUnit:'単価', thSub:'小計', thTax:'消費税', thTotal:'合計',
    phUnit:'単価(税込・最終価格)', thMethod:'方法', thAmount:'金額', thDate:'日時', thBy:'担当',
    calcTotal:'合計(税込)', calcPretax:'税抜', calcIntax:'内税',
    needQtyUnit:'単価・数量を入力してください', chargeAdded:'請求を追加しました', voidConfirmCharge:'この請求を取消(無効化)しますか？',
    voidFail:'取消失敗', chargeVoided:'請求を取消しました', needPayAmount:'支払金額を入力してください', payAddFail:'支払追加失敗',
    chargeAddFail:'請求追加失敗', payAdded:'支払を追加しました', payVoidConfirm:'この支払を取消(無効化)しますか？', payVoided:'支払を取消しました',
    statusChangeFail:'状態変更失敗', statusTo:'状態 → ',

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }

function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }
// 상태(DB값 open/closed/settled) 표시 다국어 — 저장값은 불변, 표시만 번역
function statusLabel(s){ const m={open:'stOpen',closed:'stClosed',settled:'stSettled'}; return m[s]?tx(m[s]):(STATUS_LABEL[s]||s); }
// 고정 카테고리(저장값=한글 5종) 화면 표시 다국어 — 저장/비교값은 불변
function catLabel(c){ const m={'라운딩':'catRound','식음':'catFood','숙박':'catStay','골프샵':'catShop','기타':'catEtc'}; return m[c]?tx(m[c]):c; }
// 고정 결제수단(저장값=한글 현금/카드) 화면 표시 다국어 — 저장/비교값은 불변
function methodLabel(m){ const k={'현금':'mCash','카드':'mCard'}; return k[m]?tx(k[m]):m; }

const ACCOM_ALL=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸'];

function evNo(seq){ const v=state.noBySeq&&state.noBySeq[seq]; return (v!=null&&v!=='')?v:seq; }

function yen(n){ return '¥'+Number(n||0).toLocaleString('ja-JP'); }
//  받은 일시 — 공용 계정이라 「누가 받았는지」는 이 시각과 근무표로 확인한다.

function payWhen(ts){ return (window.__so_ts?__so_ts(ts):String(ts||'')); }
function taxOf(gross){ gross=Number(gross||0); return gross - Math.round(gross/(1+TAX_RATE)); }  // 内税(포함된 소비세)
function nowYM(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

// ── 연결 (room.html 패턴 재사용) ──
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.textContent=tx('connecting'); btn.disabled=true; btn.classList.remove('connected');
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('folios').select('id',{count:'exact',head:true});
    if(error) throw error;
    setConn(tx('connOk'),'ok'); toast(tx('connOkToast'),'ok');
    btn.textContent=tx('connectedBtn'); btn.classList.add('connected'); btn.disabled=false;
    $('#btn-load').disabled=false; $('#btn-sales').disabled=false;
    loadSession(); startSettleAuto();
  }catch(e){
    setConn(tx('connFail'),'err');
    toast(tx('connFail')+': '+e.message+' '+tx('connFailHint'),'err');
    btn.textContent=tx('connFailRetry'); btn.classList.remove('connected'); btn.disabled=false;
    supa=null; $('#btn-load').disabled=true; $('#btn-sales').disabled=true;
  }
}

// Supabase 기본 1000행 제한 회피 — 쿼리(빌더 팩토리)를 전 행 로드
async function pagedQuery(buildFn){
  let out=[], pg=0;
  while(true){
    const {data,error}=await buildFn().range(pg,pg+999);
    if(error) return {error};
    out=out.concat(data||[]);
    if(!data || data.length<1000) break;
    pg+=1000;
  }
  return {data:out};
}
// ── 세션(월) 로드 — folio + 팀(bookings) + 숙소·태그(guests) + 호수(rooms) ──
async function loadSession(){
  if(!supa){toast(tx('needConnect'),'warn');return;}
  const ym=$('#session-ym').value||nowYM(); state.ym=ym; $('#session-ym').value=ym;
  const fres=await pagedQuery(()=>supa.from('v_folio_balance').select('*').eq('session_ym',ym).order('opened_at').order('folio_id'));
  if(fres.error){toast(tx('folioLoadFail')+': '+fres.error.message,'err');return;}
  state.folios=fres.data||[];
  const {data:bk,error:be}=await supa.from('bookings')
    .select('event_seq,event_no,rep_name,product_name,dep_date,arr_date').eq('session_ym',ym).order('arr_date');
  state.bookings = be ? [] : (bk||[]);
  // 워크인(예약 없는 현장 손님) — bookings 에 없으므로 walkins 를 같은 모양으로 붙인다.
  //   붙여 두면 folio 목록·御請求書·領収書·검색·일일 매출이 예약 팀과 똑같이 동작한다.
  try{
    const {data:wk}=await supa.from('walkins').select('event_seq,walk_date,name,pax,venue')
      .gte('walk_date', ym+'-01').lte('walk_date', ym+'-31');
    (wk||[]).forEach(w=>{
      state.bookings.push({ event_seq:w.event_seq, event_no:'W'+w.event_seq,
        rep_name:w.name||tx('wiTag'), product_name:tx('wiTag'),
        dep_date:w.walk_date, arr_date:w.walk_date, walkin:true, pax:w.pax||1 });
      state.walkinSeq=state.walkinSeq||{}; state.walkinSeq[w.event_seq]=true;
    });
  }catch(e){ /* 120 미적용이면 조용히 건너뛴다 */ }
  state.noBySeq={}; state.bookings.forEach(b=>{ state.noBySeq[b.event_seq]=b.event_no||''; });
  // 숙소·태그(guests)
  const gres=await pagedQuery(()=>supa.from('guests').select('event_seq,accom,team_tag,group_code').eq('session_ym',ym));
  state.accomBySeq={}; state.tagBySeq={};
  (gres.data||[]).forEach(g=>{ state.accomBySeq[g.event_seq]=g.accom||''; state.tagBySeq[g.event_seq]=g.team_tag||g.group_code||''; });
  // 現地手配書에서 묶은 팀의 통일 코드(DFな-Y1). 화면에는 **원래 코드를 괄호로 병기**한다 —
  //   엠클릭·B2B 명세와 대조해야 하기 때문(Min 2026-08). 손님에게 나가는 인쇄물은 통일 코드만.
  try{ state.uni=(window.__so_groupTags? await __so_groupTags(supa, state.bookings.map(b=>b.event_seq)) : {}); }catch(e){ state.uni={}; }
  await loadRoomsSettle(state.bookings.map(b=>b.event_seq));
  // 기본 숙소필터(야마나미+쿠주) · 기본 날짜(오늘이 이 달이면 오늘, 아니면 월 전체)
  if(state.accomSel===null) state.accomSel=new Set(ACCOM_DEFAULT);
  const today=isoTodayS(); state.day=(today.slice(0,7)===ym)?today:'';
  if($('#settle-day')) $('#settle-day').value=state.day;
  state.selId=null; state.charges=[]; state.payments=[];
  renderAccomChips(); renderFolioList(); renderDetail();
  toast(`${ym} · ${state.folios.length}${tx('loadedFolios')}`,'ok');
  // 딥링크(?seq): 그 팀 folio 있으면 자동 열기, 없으면 그 팀 folio를 개설해 바로 착지(프론트=명시적 이동이라 자동 개설)
  if(window._deepSeq){
    const s=window._deepSeq; window._deepSeq=null;
    state.day=''; if($('#settle-day')) $('#settle-day').value='';
    const tf=state.folios.find(f=>f.event_seq===s && f.subject==='team');
    renderFolioList();
    if(tf) selectFolio(tf.folio_id);
    else await openFolio(s);   // 미개설 팀 → 그 팀 정산 folio 자동 개설·선택(월 전체 방치 대신 그 팀에 착지)
  }
}
function isoTodayS(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// 그날 점유/체류 방번호(팀 전체 체류 기준) — 정산은 월뷰라 팀의 배정 호수 전체
async function loadRoomsSettle(seqs){
  state.roomsBySeq={};
  if(!seqs||!seqs.length) return;
  for(let i=0;i<seqs.length;i+=300){
    const chunk=seqs.slice(i,i+300); let pg=0;
    while(true){
      const {data,error}=await supa.from('rooms').select('event_seq,room_no').in('event_seq',chunk).range(pg,pg+999);
      if(error) break;
      (data||[]).forEach(r=>{ if(r.room_no){ const a=state.roomsBySeq[r.event_seq]=state.roomsBySeq[r.event_seq]||[]; if(!a.includes(r.room_no)) a.push(r.room_no); } });
      if(!data||data.length<1000) break; pg+=1000;
    }
  }
  Object.values(state.roomsBySeq).forEach(a=>a.sort((x,y)=>String(x).localeCompare(String(y),undefined,{numeric:true})));
}
function roomsOfS(seq){ return (state.roomsBySeq&&state.roomsBySeq[seq])||[]; }
function roomLabelS(seq){ const r=roomsOfS(seq); return r.length?(r.join(', ')):''; }

// ── 숙소 토글 칩 (기본 야마나미+쿠주, 전체 토글) ──
function renderAccomChips(){
  const box=$('#settle-accom'); if(!box) return;
  const sel=state.accomSel||new Set(ACCOM_DEFAULT);
  const allOn=(sel.size===ACCOM_ALL.length);
  const chip=(label,on,key)=>`<button type="button" class="ac-chip" data-k="${key}" style="font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;cursor:pointer;border:1px solid ${on?'var(--accent)':'var(--border)'};background:${on?'var(--accent)':'var(--surface3)'};color:${on?'#fff':'var(--text2)'}">${label}</button>`;
  box.innerHTML=chip(tx('allChip'),allOn,'__all')+ACCOM_ALL.map(a=>chip(accomL(a),sel.has(a),a)).join('');
  box.querySelectorAll('.ac-chip').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(k==='__all'){ state.accomSel = allOn ? new Set() : new Set(ACCOM_ALL); }
    else { if(sel.has(k)) sel.delete(k); else sel.add(k); state.accomSel=sel; }
    renderAccomChips(); renderFolioList();
  }));
}
function accomPass(seq){
  const sel=state.accomSel; if(!sel||!sel.size) return true;   // 빈 선택=전체
  const a=state.accomBySeq?state.accomBySeq[seq]:''; return sel.has(a);
}
function teamPresentOnDay(b){
  if(!state.day) return true;
  const dep=b.dep_date||'', arr=b.arr_date||'';
  return dep && arr && dep<=state.day && state.day<=arr;   // 체크아웃일 포함
}
function settleHay(b){
  return ((b.rep_name||'')+' '+(b.event_no||'')+' '+(b.product_name||'')+' '+(state.tagBySeq[b.event_seq]||'')+' '+(((state.uni||{})[b.event_seq])||'')+' '+roomsOfS(b.event_seq).join(' ')).toLowerCase();
}
// folio 미개설 팀 카드 — 청구가 없으니 잔액은 ¥0. 클릭하면 청구 추가(계정 자동 개설).
// 통일 코드 + 원래 코드 병기(화면용) / 통일 코드만(손님 인쇄물용)
function tagOrig(seq, snap){
  if((state.walkinSeq||{})[seq]) return tx('wiTag');   // 워크인 = 그룹코드가 없다
  return state.tagBySeq[seq] || snap || (tx('teamPrefix')+(state.noBySeq[seq]||seq));
}
function tagUni(seq, snap){ return ((state.uni||{})[seq]) || tagOrig(seq, snap); }
function tagShow(seq, snap){ const u=(state.uni||{})[seq]; const o=tagOrig(seq,snap); return u? (u+' ('+o+')') : o; }
function pendingCard(b){
  const card=document.createElement('div'); card.className='folio-card';
  const tag=tagShow(b.event_seq);
  const rl=roomLabelS(b.event_seq);
  card.title=tx('cardHint');
  card.innerHTML=`
    <div class="fh"><span class="ftag">${tag}</span><span class="frep">${b.rep_name||''}</span></div>
    <div class="fmeta">${state.accomBySeq[b.event_seq]||''}${rl?' · '+rl:''} · ${(b.arr_date||'').slice(5)} ${tx('checkout')} · ${tx('chargeCount0')}</div>
    <div class="fbal zero">${tx('balanceLabel')} ${yen(0)}</div>`;
  card.addEventListener('click',()=>ensureFolioAndSelect(b.event_seq));
  return card;
}
async function ensureFolioAndSelect(seq){
  const tf=state.folios.find(f=>f.event_seq===seq && f.subject==='team');
  if(tf){ selectFolio(tf.folio_id); return; }
  await openFolio(seq);   // 자동 개설 후 loadSession→select
}
// 기존 folio(팀+개인 묶음/단일) 렌더 — 한 팀
function renderTeamFolios(box, seq, list){
  list.sort((a,b)=>(a.subject==='team'?0:1)-(b.subject==='team'?0:1));
  const members=list.filter(f=>f.subject==='member');
  if(!members.length){ list.forEach(f=>box.appendChild(folioCard(f))); return; }
  const teamF=list.find(f=>f.subject==='team')||list[0];
  const tag=tagShow(seq, teamF.team_tag);
  const gGross=list.reduce((s,f)=>s+Number(f.gross_total||0),0);
  const gPaid =list.reduce((s,f)=>s+Number(f.paid_total||0),0);
  const gBal=gGross-gPaid; const gCls=gBal<=0?'zero':'due';
  const grp=document.createElement('div'); grp.className='folio-group';
  grp.innerHTML=`
    <div class="fg-head">
      <span class="fg-tag">${tag}</span>
      <span class="fg-rep">${teamF.rep_name||''}</span>
      <span class="fg-split">${tx('splitN')} ${members.length}${tx('personUnit')}</span>
      <span class="fg-bal ${gCls}">${tx('teamTotalBal')} ${yen(gBal)}</span>
    </div>`;
  const body=document.createElement('div'); body.className='fg-body';
  list.forEach(f=>body.appendChild(folioCard(f)));
  grp.appendChild(body); box.appendChild(grp);
}

// folio 카드 1장 생성(팀/개인 공통). member=개인 folio면 대표자 대신 개인명 강조.
function folioCard(f){
  const card=document.createElement('div');
  const isMember=f.subject==='member';
  card.className='folio-card'+(isMember?' member':'')+(f.folio_id===state.selId?' sel':'');
  card.dataset.id=f.folio_id;
  const tag=tagShow(f.event_seq, f.team_tag);
  const bal=Number(f.balance||0);
  const balCls=bal<=0?'zero':'due';
  // 개인 folio: 작은 팀태그 + 개인명 강조 / 팀 folio: 팀태그 + 대표자
  const head=isMember
    ? `<span class="ftag">${tag}</span>
       <span class="frep">${f.member_name||f.rep_name||''}</span>
       <span class="sbadge s-${f.status}">${statusLabel(f.status)}</span>
       <span class="sbadge s-member">${tx('personBadge')}</span>`
    : `<span class="ftag">${tag}</span>
       <span class="frep">${f.rep_name||''}</span>
       <span class="sbadge s-${f.status}">${statusLabel(f.status)}</span>`;
  const rl=(!isMember)?roomLabelS(f.event_seq):'';
  card.innerHTML=`
    <div class="fh">${head}</div>
    <div class="fmeta">${rl?rl+' · ':''}${tx('chargeMeta')} ${f.charge_count||0}${tx('chargeWord')} · ${tx('totalWord')} ${yen(f.gross_total)} · ${tx('paidWord')} ${yen(f.paid_total)}</div>
    <div class="fbal ${balCls}">${tx('balanceLabel')} ${yen(bal)}</div>`;
  card.addEventListener('click',()=>selectFolio(f.folio_id));
  return card;
}

// 좌측 목록 = 날짜·숙소·검색으로 거른 '정산 대상 팀'. folio 있으면 잔액 표시, 없으면 미개설(클릭=자동개설).
function renderFolioList(){
  const box=$('#folio-list'); box.innerHTML='';
  // folio 팀별 그룹
  const folioByTeam=new Map();
  state.folios.forEach(f=>{ if(!folioByTeam.has(f.event_seq)) folioByTeam.set(f.event_seq,[]); folioByTeam.get(f.event_seq).push(f); });
  const q=(state.q||'').trim().toLowerCase();
  // 대상 팀 = bookings 필터(날짜+숙소+검색)
  let teams=(state.bookings||[]).filter(b=>teamPresentOnDay(b)&&accomPass(b.event_seq));
  if(q) teams=teams.filter(b=>settleHay(b).includes(q));
  // 정렬: 체크아웃(arr) 빠른 순 → 잔액 있는 팀 우선 → 대표자
  teams.sort((a,b)=>String(a.arr_date||'').localeCompare(String(b.arr_date||''))||String(a.rep_name||'').localeCompare(String(b.rep_name||'')));
  $('#folio-cnt').textContent=`${teams.length}${tx('teamUnit')}${state.day?' · '+state.day.slice(5):' · '+tx('monthWhole')}`;
  if(!teams.length){ box.innerHTML='<div class="empty-hint">'+tx('noTargetTeam')+'</div>'; return; }
  teams.forEach(b=>{
    const flist=folioByTeam.get(b.event_seq);
    if(flist&&flist.length) renderTeamFolios(box, b.event_seq, flist);
    else box.appendChild(pendingCard(b));
  });
}

async function selectFolio(id){
  state.selId=id;
  const {data:c,error:ce}=await supa.from('charges').select('*').eq('folio_id',id).order('charged_at');
  if(ce){toast(tx('chargeLoadFail')+': '+ce.message,'err');return;}
  state.charges=c||[];
  const {data:p,error:pe}=await supa.from('payments').select('*').eq('folio_id',id).order('paid_at');
  if(pe){toast(tx('payLoadFail')+': '+pe.message,'err');return;}
  state.payments=p||[];
  renderFolioList(); renderDetail();
}

// POS 주문·결제가 정산 화면에 바로 반영되도록 가벼운 자동 갱신(선택·날짜필터 보존).
//  loadSession()은 선택을 초기화하므로 쓰지 않고 잔액뷰만 다시 읽어 목록·열린 folio를 새로고침.
//  모달 열림/입력 포커스/탭 비활성일 땐 스킵(편집 방해 방지).
let _settleTimer=null;
function startSettleAuto(){
  if(_settleTimer) clearInterval(_settleTimer);
  _settleTimer=setInterval(autoRefreshSettle, 20000);
}
async function autoRefreshSettle(){
  if(!supa||!state.ym||document.hidden) return;
  if(document.querySelector('.modal-bg')) return;                 // 모달 열림 → 스킵
  const ae=document.activeElement, tag=ae&&ae.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;      // 입력 중 → 스킵
  try{
    const fres=await pagedQuery(()=>supa.from('v_folio_balance').select('*').eq('session_ym',state.ym).order('opened_at').order('folio_id'));
    if(fres.error) return;
    state.folios=fres.data||[];
    renderFolioList();
    if(state.selId){
      if(state.folios.some(f=>f.folio_id===state.selId)) await selectFolio(state.selId);   // 열린 계산서에 새 POS 청구 즉시 반영
      else { state.selId=null; state.charges=[]; state.payments=[]; renderDetail(); }
    }
  }catch(_){}
}
function curFolio(){ return state.folios.find(f=>f.folio_id===state.selId)||null; }

      </div>

    ${editable?`

    <div class="panel">

      <div class="tr"><span data-i18n="st_subtotal"></span><span class="v">${yen(subTotal)}</span></div>
      <div class="tr"><span data-i18n="st_tax"></span><span class="v">${yen(taxTotal)}</span></div>
      <div class="tr grand"><span data-i18n="st_grand"></span><span class="v">${yen(grand)}</span></div>
      <div class="tr"><span data-i18n="st_paid"></span><span class="v">${yen(paid)}</span></div>
      <div class="tr bal"><span data-i18n="st_balance"></span><span class="v ${bal<=0?'zero':'due'}">${yen(bal)}</span></div>
    </div>`;

  // 동적 라벨 다국어 적용
  if(window.SaizenOps) window.SaizenOps.apply();

  // 이벤트 바인딩
  box.querySelectorAll('[data-void-charge]').forEach(b=>b.addEventListener('click',()=>voidCharge(b.dataset.voidCharge)));
  box.querySelectorAll('[data-void-pay]').forEach(b=>b.addEventListener('click',()=>voidPayment(b.dataset.voidPay)));
  const st=$('#btn-statement'); if(st) st.addEventListener('click',()=>previewStatement(f));
  const rc=$('#btn-receipt'); if(rc) rc.addEventListener('click',()=>openReceipt(f));
  const bq=$('#btn-billqr'); if(bq) bq.addEventListener('click',()=>showBillQR(f));
  const bc=$('#btn-close'); if(bc) bc.addEventListener('click',()=>setStatus(f.folio_id,'closed'));
  const bs=$('#btn-settle'); if(bs) bs.addEventListener('click',()=>setStatus(f.folio_id,'settled'));
  const br=$('#btn-reopen'); if(br) br.addEventListener('click',()=>setStatus(f.folio_id,'open'));
  if(editable){
    const recalc=()=>{
      const q=Number($('#ch-qty').value||0), u=Number($('#ch-unit').value||0);
      const amt=Math.round(q*u);
      $('#ch-calc').textContent=`${tx('calcTotal')} ${yen(amt)} · ${tx('calcPretax')} ${yen(amt-taxOf(amt))} + ${tx('calcIntax')} ${yen(taxOf(amt))}`;
    };
    $('#ch-qty').addEventListener('input',recalc); $('#ch-unit').addEventListener('input',recalc); recalc();
    $('#btn-add-charge').addEventListener('click',addCharge);
    $('#btn-add-pay').addEventListener('click',addPayment);
    box.querySelectorAll('.pmbtn').forEach(b=>b.addEventListener('click',()=>{
      const on=b.classList.contains('on');
      const wrap=b.parentElement;
      wrap.querySelectorAll('.pmbtn').forEach(x=>x.classList.remove('on','cash','card'));
      if(!on){ b.classList.add('on', b.dataset.v==='현금'?'cash':'card'); }
      wrap.classList.toggle('unset', on);
      updatePayMethod(b.dataset.pm, on?'':b.dataset.v);
    }));
    const ac=$('#btn-all-cash'); if(ac) ac.addEventListener('click',()=>bulkPay('현금'));
    const ar=$('#btn-all-card'); if(ar) ar.addEventListener('click',()=>bulkPay('카드'));
    const sa=$('#btn-settle-auto'); if(sa) sa.addEventListener('click',()=>settleClose(f));
  }
}

async function settleClose(f){
  const chs=state.charges.filter(c=>!c.voided);
  if(!chs.length){ toast(tx('noCharges'),'warn'); return; }
  const tot=c=>Number(c.amount||0)+Number(c.tax||0)+Number(c.service_charge||0);
  const pays=state.payments.filter(p=>!p.voided);
  const gross=Math.round(chs.reduce((s,c)=>s+tot(c),0));
  const paid =Math.round(pays.reduce((s,p)=>s+Number(p.amount||0),0));
  const rest =gross-paid;                       // 아직 못 받은 금액
  const u=(window.__so_getUser&&__so_getUser())||null;
  const rows=[];

  if(rest>0){
    // 남은 잔액을 받는다 — 줄마다 지정한 현금/카드 기준으로 나눈다.
    const unset=chs.filter(c=>!c.pay_method);
    if(unset.length){ toast(tx('needAllMethod')+` (${unset.length})`,'warn'); return; }
    let cash=0,card=0;
    chs.forEach(c=>{ if(c.pay_method==='현금')cash+=tot(c); else if(c.pay_method==='카드')card+=tot(c); });
    const paidCash=pays.filter(p=>p.method==='현금').reduce((s,p)=>s+Number(p.amount||0),0);
    const paidCard=pays.filter(p=>p.method==='카드').reduce((s,p)=>s+Number(p.amount||0),0);
    // ⚠ 이미 받은 금액을 되돌리는 **음수 결제는 만들지 않는다**(부분 결제를 섞으면 예전엔 음수가 나와
    //   현금/카드 집계가 뒤집혔다 — 카드 매출 통계가 틀어진다).
    let addCash=Math.max(0,Math.round(cash-paidCash));
    let addCard=Math.max(0,Math.round(card-paidCard));
    // 합이 남은 잔액과 어긋나면(부분 결제를 미리 받은 경우) **잔액에 맞춘다** — 과오납·이중청구 방지.
    const sum=addCash+addCard;
    if(sum!==rest){
      if(sum<=0){ addCard=rest; addCash=0; }
      else { addCash=Math.round(rest*addCash/sum); addCard=rest-addCash; }
    }
    if(!confirm(`${tx('settleConfirm')}\n${tx('mCash')}: ${yen(addCash)} / ${tx('mCard')}: ${yen(addCard)}`)) return;
    if(addCash>0) rows.push({folio_id:f.folio_id, method:'현금', amount:addCash, received_by:u});
    if(addCard>0) rows.push({folio_id:f.folio_id, method:'카드', amount:addCard, received_by:u});
  } else {
    // 이미 다 받았다(부분 결제를 나눠 받은 경우 포함) → **결제를 더 만들지 않고 마감만** 한다.
    const msg = rest<0 ? tx('settleOverpaid')(yen(-rest)) : tx('settleAlreadyPaid')(yen(paid));
    if(!confirm(msg)) return;
  }

  try{
    if(rows.length){ const {error}=await supa.from('payments').insert(rows); if(error)throw error; }
    const {error:e2}=await supa.from('folios').update({status:'settled',closed_at:new Date().toISOString()}).eq('id',f.folio_id);
    if(e2)throw e2;
    toast(tx('settledDone'),'ok');
    await refreshAfterChange(f.folio_id);
  }catch(e){ toast(tx('statusChangeFail')+': '+e.message,'err'); }
}

// ── 御請求書 HTML 미리보기 팝업(→ 인쇄). 즉시 엑셀 다운로드 대신 한 단계 거침. ──
// ── 청구서 QR — 손님이 폰으로 찍으면 그 팀 청구내역(bill.html)이 열린다.
//    최종 체크아웃 전날·정산 시점에 종이 없이 확인시키는 용도. 토큰은 주문 QR과 같은 것.
async function billToken(seq){
  const {data}=await supa.from('order_tokens').select('token').eq('event_seq',seq).maybeSingle();
  if(data&&data.token) return data.token;
  const tok=(window.crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,'').slice(0,16):(Date.now().toString(36)+Math.random().toString(36).slice(2,10));
  const {error}=await supa.from('order_tokens').insert({event_seq:seq, token:tok, created_by:(window.__so_getUser&&__so_getUser())||null});
  if(error) throw error;
  return tok;
}
function qrImg(text,px){
  try{ const q=qrcode(0,'M'); q.addData(String(text)); q.make(); return q.createDataURL(px||8,0); }catch(_){ return ''; }
}
function billUrlOf(token){ return new URL('bill.html?t='+encodeURIComponent(token), location.href).href; }
function escQ(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function showBillQR(f){
  if(typeof qrcode!=='function'){ toast(tx('qrLibFail'),'err'); return; }
  let tok;
  try{ tok=await billToken(f.event_seq); }catch(e){ toast(tx('qrTokFail')(String(e.message||e)),'err'); return; }
  const url=billUrlOf(tok), img=qrImg(url,10);
  const tag=tagShow(f.event_seq, f.team_tag);
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" style="max-width:400px;text-align:center">
    <h3 style="margin-bottom:2px">${tx('billQrTitle')}</h3>
    <div style="font-size:13px;font-weight:800;color:var(--accent);margin-bottom:2px">${escQ(tag)} ${escQ(f.rep_name||'')}</div>
    <div class="hint" style="margin-bottom:10px">${tx('billQrSub')}</div>
    <img src="${img}" alt="QR" style="width:236px;height:236px;image-rendering:pixelated;border:1px solid var(--border);border-radius:10px;padding:8px;background:#fff">
    <div class="hint" style="margin-top:9px;word-break:break-all">${escQ(url)}</div>
    <div class="form-row" style="justify-content:center;margin-top:12px">
      <button class="btn ghost sm" id="bq-close" type="button">${tx('closeBtn')}</button>
    </div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector('#bq-close').addEventListener('click',close);
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
}

async function exportStatement(f){
  // folio 데이터가 현재 선택본과 다르면 다시 로드
  if(f.folio_id!==state.selId) await selectFolio(f.folio_id);
  const wb=new ExcelJS.Workbook(); wb.creator='SaiZen';
  const ws=wb.addWorksheet('御請求書');
  ws.columns=[{width:10},{width:34},{width:8},{width:12},{width:13},{width:11},{width:13}];

  // 머리글
  ws.mergeCells('A1:G1');
  const tt=ws.getCell('A1'); tt.value='御　請　求　書'; tt.font={bold:true,size:18,color:{argb:XLM.navy}};
  tt.alignment={horizontal:'center'};
  ws.mergeCells('A2:G2');
  const sub=ws.getCell('A2'); sub.value='アソ ヤマナミリゾート ／ 株式会社SaiZen';
  sub.font={size:10,color:{argb:XLM.blue}}; sub.alignment={horizontal:'center'};

  const tag=tagUni(f.event_seq, f.team_tag);   // 손님에게 나가는 인쇄물 = 코드 하나만
  ws.getCell('A4').value='宛名 / 御一行'; ws.getCell('A4').font={bold:true,color:{argb:XLM.navy}};
  ws.getCell('B4').value=`${tag}  ${f.rep_name||''}${f.subject==='member'?('  ('+(f.member_name||'')+'様)'):' 御一行様'}`;
  ws.getCell('A5').value='発行日'; ws.getCell('A5').font={bold:true,color:{argb:XLM.navy}};
  ws.getCell('B5').value=new Date().toISOString().slice(0,10);
  ws.getCell('A6').value='御部屋 / Room'; ws.getCell('A6').font={bold:true,color:{argb:XLM.navy}};
  ws.getCell('B6').value=(roomsOfS(f.event_seq).join(', '))||'-';
  ws.getCell('E4').value='event'; ws.getCell('F4').value=evNo(f.event_seq);
  ws.getCell('E5').value='session'; ws.getCell('F5').value=state.ym;

  // 명세 헤더
  const hr=8;
  const heads=['区分','内訳','数量','単価','小計','消費税','合計'];
  heads.forEach((h,i)=>{
    const c=ws.getRow(hr).getCell(i+1);
    c.value=h; c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill=xFill(XLM.navy);
    c.alignment={horizontal:i<2?'left':'right'}; c.border=xBorderAll();
  });
  let r=hr+1;
  const lines=state.charges.filter(c=>!c.voided);
  const catJ={'라운딩':'ラウンド','식음':'飲食','숙박':'宿泊','골프샵':'ゴルフショップ','기타':'その他'};
  lines.forEach((c,idx)=>{
    const row=ws.getRow(r);
    const total=Number(c.amount||0)+Number(c.tax||0)+Number(c.service_charge||0);
    row.getCell(1).value=catJ[c.category]||c.category;
    row.getCell(2).value=c.description||'';
    row.getCell(3).value=Number(c.qty||0);
    row.getCell(4).value=Number(c.unit_price||0);
    row.getCell(5).value=Number(c.amount||0);
    row.getCell(6).value=Number(c.tax||0);
    row.getCell(7).value=total;
    for(let i=1;i<=7;i++){
      const cell=row.getCell(i);
      cell.border=xBorderAll();
      cell.alignment={horizontal:i<3?'left':'right'};
      if(i>=4&&i<=7) cell.numFmt='¥#,##0';
      if(idx%2===1) cell.fill=xFill(XLM.zebra);
    }
    r++;
  });
  if(!lines.length){ ws.mergeCells(`A${r}:G${r}`); ws.getCell(`A${r}`).value='(請求項目なし)'; r++; }

  // 합계
  const subTotal=lines.reduce((s,c)=>s+Number(c.amount||0),0);
  const taxTotal=lines.reduce((s,c)=>s+Number(c.tax||0),0);
  const grand=subTotal+taxTotal+lines.reduce((s,c)=>s+Number(c.service_charge||0),0);
  const paid=state.payments.filter(p=>!p.voided).reduce((s,p)=>s+Number(p.amount||0),0);
  const bal=grand-paid;
  r++;
  const totRows=[['小計(税抜)',subTotal],['うち消費税(10%·内税)',taxTotal],['御請求合計',grand],['入金',paid],['残額',bal]];
  totRows.forEach((tr,i)=>{
    ws.mergeCells(`E${r}:F${r}`);
    const lab=ws.getCell(`E${r}`); lab.value=tr[0]; lab.alignment={horizontal:'right'};
    const val=ws.getCell(`G${r}`); val.value=tr[1]; val.numFmt='¥#,##0'; val.alignment={horizontal:'right'};
    if(tr[0]==='御請求合計'||tr[0]==='残額'){ lab.font={bold:true,color:{argb:XLM.navy}}; val.font={bold:true,color:{argb:XLM.navy}}; lab.fill=xFill(XLM.soft); val.fill=xFill(XLM.soft); }
    r++;
  });

  // 결제 내역
  if(state.payments.filter(p=>!p.voided).length){
    r++; ws.getCell(`A${r}`).value='お支払い内訳'; ws.getCell(`A${r}`).font={bold:true,color:{argb:XLM.blue}}; r++;
    ['方法','金額','日付'].forEach((h,i)=>{ const c=ws.getRow(r).getCell(i+1); c.value=h; c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill=xFill(XLM.blue); c.border=xBorderAll(); });
    r++;
    state.payments.filter(p=>!p.voided).forEach(p=>{
      const row=ws.getRow(r);
      row.getCell(1).value=p.method==='현금'?'現金':'カード';
      row.getCell(2).value=Number(p.amount||0); row.getCell(2).numFmt='¥#,##0';
      row.getCell(3).value=(p.paid_at||'').slice(0,10);
      for(let i=1;i<=3;i++) row.getCell(i).border=xBorderAll();
      r++;
    });
  }

  await downloadWB(wb,`Statement_${state.ym}_event${evNo(f.event_seq)}.xlsx`);
  toast(tx('stmtDownloaded'),'ok');
}

async function exportSalesSummary(){
  if(!supa){toast(tx('needConnect'),'warn');return;}
  const {data,error}=await supa.from('v_settlement_by_category').select('*').eq('session_ym',state.ym);
  if(error){toast(tx('salesLoadFail')+': '+error.message,'err');return;}
  const rows=data||[];
  const wb=new ExcelJS.Workbook(); wb.creator='SaiZen';
  const ws=wb.addWorksheet('売上要約');
  ws.columns=[{width:14},{width:10},{width:14},{width:13},{width:14}];
  ws.mergeCells('A1:E1');
  const tt=ws.getCell('A1'); tt.value=`売上要約 ${state.ym}`; tt.font={bold:true,size:15,color:{argb:XLM.navy}};
  const heads=['区分','件数','小計(税抜)','消費税','合計'];
  heads.forEach((h,i)=>{ const c=ws.getRow(3).getCell(i+1); c.value=h; c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill=xFill(XLM.navy); c.border=xBorderAll(); c.alignment={horizontal:i?'right':'left'}; });
  const catJ={'라운딩':'ラウンド','식음':'飲食','숙박':'宿泊','골프샵':'ゴルフショップ','기타':'その他'};
  let r=4; let tC=0,tS=0,tT=0,tG=0;
  // 카테고리 고정 순서로 정렬
  CATEGORIES.forEach(cat=>{
    const row=rows.find(x=>x.category===cat); if(!row) return;
    const wsr=ws.getRow(r);
    wsr.getCell(1).value=catJ[cat]||cat;
    wsr.getCell(2).value=Number(row.line_count||0);
    wsr.getCell(3).value=Number(row.charge_amount||0);
    wsr.getCell(4).value=Number(row.tax_amount||0);
    wsr.getCell(5).value=Number(row.gross_total||0);
    for(let i=1;i<=5;i++){ const c=wsr.getCell(i); c.border=xBorderAll(); c.alignment={horizontal:i?'right':'left'}; if(i>=3) c.numFmt='¥#,##0'; }
    tC+=Number(row.line_count||0); tS+=Number(row.charge_amount||0); tT+=Number(row.tax_amount||0); tG+=Number(row.gross_total||0);
    r++;
  });
  const tot=ws.getRow(r);

  for(let i=1;i<=5;i++){ const c=tot.getCell(i); c.font={bold:true,color:{argb:XLM.navy}}; c.fill=xFill(XLM.soft); c.border=xBorderAll(); c.alignment={horizontal:i?'right':'left'}; if(i>=3) c.numFmt='¥#,##0'; }
  await downloadWB(wb,`SalesSummary_${state.ym}.xlsx`);
  toast(tx('salesDownloaded'),'ok');
}

async function downloadWB(wb,filename){
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);
}
