<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad;
    --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --c-라운딩:#1e3a8a; --c-식음:#92400e; --c-숙박:#5b21b6; --c-골프샵:#065f46; --c-기타:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06);}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select,textarea{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.danger{border-color:var(--err);background:transparent;color:var(--err)}
  .btn.danger:hover{background:#fbeeeb}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}

  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .conn .hint{font-size:11px;color:var(--muted)}

  .wrap{padding:16px 20px 90px;max-width:1180px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel > h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .panel > h3 .cnt{font-size:12px;color:var(--text2);font-weight:700;margin-left:auto}
  .formgrid{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .formgrid .f{display:flex;flex-direction:column;gap:3px}
  .formgrid .f label{font-size:10.5px;font-weight:700;color:var(--text2)}
  .formgrid .f .inp{min-width:90px}

  table.menu{width:100%;border-collapse:collapse;font-size:13px}
  table.menu th{position:sticky;top:0;text-align:left;font-size:11px;color:#fff;background:var(--accent);font-weight:700;padding:7px 8px;white-space:nowrap}
  table.menu td{padding:5px 7px;border-bottom:1px solid var(--border);vertical-align:middle}
  table.menu tr.inactive{opacity:.5}
  table.menu .inp{width:100%;min-width:60px}
  table.menu .inp.code{width:62px} table.menu .inp.price{width:92px;text-align:right;font-family:var(--mono)}
  table.menu .inp.sort{width:56px;text-align:center}
  .venue-h{font-size:13px;font-weight:800;color:var(--accent2);background:var(--surface2);padding:8px 10px;border-top:2px solid var(--accentSoft)}
  .stbadge{font-size:9.5px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap}
  .st-kitchen{color:#fff;background:var(--c-식음)} .st-bar{color:#fff;background:var(--c-라운딩)} .st-none{color:var(--text2);background:var(--surface3);border:1px solid var(--border2)}
  .rowbtns{display:flex;gap:5px;white-space:nowrap}
  .empty-hint{font-size:13px;color:var(--muted);text-align:center;padding:30px 0}
  /* 장소(venue) 탭 */
  .venue-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .vtab{font-size:13px;font-weight:700;padding:6px 14px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;transition:.12s}
  .vtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .vtab:not(.active):hover{background:var(--accentSoft);color:var(--accent)}
  .vtab .vc{opacity:.7;font-weight:600;margin-left:4px}
  table.menu .inp.code[readonly]{background:var(--surface3);color:var(--text2);border-style:dashed;cursor:not-allowed}
  /* 수정 이력 */
  .hist .hrow{display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:baseline;font-size:12.5px}
  .hist .ht{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .hist .ha{font-weight:800;border-radius:4px;padding:1px 6px;font-size:10px;color:#fff}
  .ha-insert{background:var(--ok)} .ha-update{background:var(--accent2)} .ha-delete{background:var(--err)}
  .hist .hby{color:var(--text2);font-weight:700}
  .hist .hd{color:var(--text2)}
  details.bulk summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--accent)}
  details.bulk textarea{width:100%;min-height:120px;margin-top:10px;padding:10px;border:1px solid var(--border2);border-radius:8px;font-family:var(--mono);font-size:12px;line-height:1.5}
  .bulk .fmt{font-size:11.5px;color:var(--text2);margin-top:8px;line-height:1.6}
  .bulk .fmt code{font-family:var(--mono);background:var(--surface3);padding:1px 5px;border-radius:4px}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}
</style>

<script>
// ════════════════════════════════════════════════════════════════════════
//  SaiZen Hub — 메뉴 관리(menu_items CRUD)  · POS/KDS 단가·station 마스터
//  · station: kitchen(주방행 티켓) / bar(드링크바 즉석) / none(골프샵 등)
//  · 기존 charges 는 발생 시점 단가를 스냅샷 저장 → 메뉴 삭제해도 과거 청구 안전.
// ════════════════════════════════════════════════════════════════════════
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let supa=null;

// ── i18n (한·일 직원 공용. ja 기본. me_* 등은 saizen-ops.js, 나머지 로컬 키는 여기서) ──
const L={
  ja:{ phCode:'自動', tipNextCode:'場所に合う次のコードを生成(FR1·GS1…)', phNameKo:'생맥주',
    saveAll:'💾 一括保存', saveVenue:'💾 この場所を一括保存', tipCodeLock:'適用済みのコードは修正不可',
    histTitle:'🕘 変更履歴', histEmptyConnect:'接続後に表示されます。', histEmptyNone:'まだ変更履歴がありません。',
    histTblMissing:'履歴テーブル未設置(29_change_log.sql の実行が必要)', histRecent:n=>`(直近 ${n}件)`,
    needUrlKey:'URL・key必要', connecting:'接続中…', connOk:'接続済', connectedToast:'Supabaseに接続しました',
    connectedBtn:'✓ 接続済', connFail:'接続失敗', connFailToast:e=>'接続失敗: '+e+' (メニュー SQL 11·12 実行・key確認)', connFailBtn:'接続失敗・再試行',
    loadFail:'読み込み失敗: ', needJaName:'日本語名は必須', noChange:'変更なし',
    saveFail:'保存失敗: ', saved:'保存しました', needConn:'先に接続してください',
    bulkNeedJa:x=>`日本語名なし: ${x}`, noRowsToSave:'保存する行がありません', bulkSaveFail:'一括保存失敗: ',
    bulkSaved:(n,m)=>`${n}件 保存 · 変更 ${m}件`, delFail:'削除失敗: ', deleted:'削除しました', confirmDel:'このメニューを削除しますか?(過去の請求記録には影響しません)',
    addNeedJa:'日本語名を入力してください', addFail:'追加失敗: ', added:'メニューを追加しました',
    actInsert:'追加', actUpdate:'修正', actDelete:'削除',
    flCode:'コード', flNameJa:'日本語名', flNameKo:'韓国語名', flCat:'区分', flVenue:'場所', flStation:'station', flPrice:'単価', flSort:'並び順', flActive:'有効',
    catRound:'ラウンド', catFb:'飲食', catRoom:'ルーム', catProshop:'ゴルフショップ', catEtc:'その他',
    venRestaurant:'レストラン', venProshop:'ゴルフショップ', venBanquet:'宴会', venEtc:'その他', all:'全体' },
  ko:{ phCode:'자동', tipNextCode:'장소에 맞는 다음 코드 생성(FR1·GS1…)', phNameKo:'생맥주',
    saveAll:'💾 전체 저장', saveVenue:'💾 이 장소 전체 저장', tipCodeLock:'적용된 코드는 수정 불가',
    histTitle:'🕘 수정 이력', histEmptyConnect:'연결 후 표시됩니다.', histEmptyNone:'아직 수정 이력이 없습니다.',
    histTblMissing:'이력 테이블 미설치(29_change_log.sql 실행 필요)', histRecent:n=>`(최근 ${n}건)`,
    needUrlKey:'URL·key 필요', connecting:'연결 중…', connOk:'연결됨', connectedToast:'Supabase 연결됨',
    connectedBtn:'✓ 연결됨', connFail:'연결 실패', connFailToast:e=>'연결 실패: '+e+' (메뉴 SQL 11·12 실행·키 확인)', connFailBtn:'연결 실패 · 재시도',
    loadFail:'로드 실패: ', needJaName:'日本語名은 필수', noChange:'변경 없음',
    saveFail:'저장 실패: ', saved:'저장됨', needConn:'먼저 연결하세요',
    bulkNeedJa:x=>`日本語名 누락: ${x}`, noRowsToSave:'저장할 행이 없습니다', bulkSaveFail:'일괄 저장 실패: ',
    bulkSaved:(n,m)=>`${n}건 저장됨 · 변경 ${m}건`, delFail:'삭제 실패: ', deleted:'삭제됨', confirmDel:'이 메뉴를 삭제할까요? (과거 청구 기록은 영향 없음)',
    addNeedJa:'日本語名을 입력하세요', addFail:'추가 실패: ', added:'메뉴 추가됨',
    actInsert:'추가', actUpdate:'수정', actDelete:'삭제',
    flCode:'코드', flNameJa:'日本語名', flNameKo:'한국어명', flCat:'구분', flVenue:'장소', flStation:'station', flPrice:'단가', flSort:'정렬', flActive:'활성',
    catRound:'라운딩', catFb:'식음', catRoom:'룸', catProshop:'골프샵', catEtc:'기타',
    venRestaurant:'레스토랑', venProshop:'골프샵', venBanquet:'연회', venEtc:'기타', all:'전체' },
  en:{ phCode:'Auto', tipNextCode:'Generate next code for this venue (FR1·GS1…)', phNameKo:'생맥주',
    saveAll:'💾 Save all', saveVenue:'💾 Save this venue', tipCodeLock:'Applied code cannot be edited',
    histTitle:'🕘 Change history', histEmptyConnect:'Shown after connecting.', histEmptyNone:'No change history yet.',
    histTblMissing:'History table missing (run 29_change_log.sql)', histRecent:n=>`(last ${n})`,
    needUrlKey:'URL·key required', connecting:'Connecting…', connOk:'Connected', connectedToast:'Connected to Supabase',
    connectedBtn:'✓ Connected', connFail:'Connection failed', connFailToast:e=>'Connection failed: '+e+' (run menu SQL 11·12 / check key)', connFailBtn:'Failed · retry',
    loadFail:'Load failed: ', needJaName:'Japanese name required', noChange:'No change',
    saveFail:'Save failed: ', saved:'Saved', needConn:'Connect first',
    bulkNeedJa:x=>`Missing Japanese name: ${x}`, noRowsToSave:'No rows to save', bulkSaveFail:'Bulk save failed: ',
    bulkSaved:(n,m)=>`${n} saved · ${m} changed`, delFail:'Delete failed: ', deleted:'Deleted', confirmDel:'Delete this menu item? (past billing records are unaffected)',
    addNeedJa:'Enter a Japanese name', addFail:'Add failed: ', added:'Menu item added',
    actInsert:'Add', actUpdate:'Edit', actDelete:'Delete',
    flCode:'Code', flNameJa:'Name (JA)', flNameKo:'Name (KO)', flCat:'Category', flVenue:'Venue', flStation:'station', flPrice:'Price', flSort:'Sort', flActive:'Active',
    catRound:'Round', catFb:'F&B', catRoom:'Room', catProshop:'Pro shop', catEtc:'Other',
    venRestaurant:'Restaurant', venProshop:'Pro shop', venBanquet:'Banquet', venEtc:'Other', all:'All' }
};
function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; const v=d[k]!==undefined?d[k]:(L.ja[k]||k); return v; }

const CATS=['라운딩','식음','숙박','골프샵','기타'];
// 라인(구분) 표시 라벨 — 저장값(한국어)은 그대로(정산·御請求書 영향 없음), 표시만 언어별 번역('숙박'→룸/ルーム/Room)
const CAT_TXKEY={'라운딩':'catRound','식음':'catFb','숙박':'catRoom','골프샵':'catProshop','기타':'catEtc'};
function catLabel(c){ const k=CAT_TXKEY[c]; return k?tx(k):(c||tx('catEtc')); }
const STATIONS=['kitchen','bar','none'];
let state={ items:[], venueFilter:'__all' };

// ── 장소(venue) 레지스트리: 저장값(key)은 그대로, 화면은 라벨(언어별), 신규코드는 prefix+번호 ──
const VENUES=[
  {key:'restaurant', txkey:'venRestaurant', prefix:'FR'},
  {key:'proshop',    txkey:'venProshop',    prefix:'GS'},
  {key:'banquet',    txkey:'venBanquet',    prefix:'BQ'},
  {key:'etc',        txkey:'venEtc',        prefix:'ET'},
];
const VENUE_BY_KEY=Object.fromEntries(VENUES.map(v=>[v.key,v]));
function venueLabel(k){ const v=VENUE_BY_KEY[k]; return v?tx(v.txkey):(k||'etc'); }
function venuePrefix(k){ return (VENUE_BY_KEY[k]&&VENUE_BY_KEY[k].prefix) || 'X'; }
function venueIdx(k){ const i=VENUES.findIndex(v=>v.key===k); return i===-1?99:i; }
// 데이터에 등장하는 모든 venue(레지스트리 + 미등록 venue) 를 순서대로. label=현재 언어 라벨로 해석
function allVenues(){
  const seen=new Set(VENUES.map(v=>v.key));
  const list=VENUES.map(v=>({key:v.key,label:venueLabel(v.key),prefix:v.prefix}));
  state.items.forEach(it=>{ const k=it.venue||'etc'; if(!seen.has(k)){ seen.add(k); list.push({key:k,label:k,prefix:'X'}); } });
  return list;
}

// ── 코드 자동 채번: 장소 prefix + 번호(FR1, FR2 …). 기존 의미형 코드와 충돌 없이 최대치+1 ──
function nextCode(venueKey){
  const p=venuePrefix(venueKey); let max=0;
  state.items.forEach(it=>{ const mm=String(it.code||'').match(new RegExp('^'+p+'(\\d+)$')); if(mm) max=Math.max(max,parseInt(mm[1],10)); });
  return p+(max+1);
}
// station(조리 위치) 자동 기본값: 프론트·골프샵 매점=none, 식음=kitchen, 그 외=none.
function autoStation(cat,venue){
  if(venue==='front'||venue==='proshop') return 'none';
  return cat==='식음' ? 'kitchen' : 'none';
}
let lastAuto='';
// 비어있거나 직전 자동값 그대로면 다음 코드로 갱신(수동 입력은 보존). force=버튼.
function fillNextCode(force){
  const el=$('#n-code'); if(!el) return;
  const cur=el.value.trim();
  if(force || !cur || cur===lastAuto){ const nc=nextCode($('#n-venue').value); el.value=nc; lastAuto=nc; }
}
// 새 메뉴 폼 장소 select 채우기
function fillVenueSelect(){
  const sel=$('#n-venue'); if(!sel) return;
  const cur=sel.value||'restaurant';
  sel.innerHTML=VENUES.map(v=>`<option value="${v.key}">${esc(venueLabel(v.key))} (${v.prefix})</option>`).join('');
  sel.value=VENUE_BY_KEY[cur]?cur:'restaurant';
}
// 새 메뉴 폼 구분(category) select 채우기 — 저장값(한국어 key)은 유지, 라벨만 언어별
function fillCatSelect(){
  const sel=$('#n-cat'); if(!sel) return;
  const cur=sel.value||'식음';
  sel.innerHTML=CATS.map(c=>`<option value="${esc(c)}" ${c===cur?'selected':''}>${esc(catLabel(c))}</option>`).join('');
  if(CATS.indexOf(cur)<0) sel.value='식음';
}
// 정적 chrome(데이터-i18n 외) 갱신
function applyStatic(){
  const cd=$('#n-code'); if(cd) cd.placeholder=tx('phCode');
  const nc=$('#btn-nextcode'); if(nc) nc.title=tx('tipNextCode');
  const ko=$('#n-ko'); if(ko) ko.placeholder=tx('phNameKo');
  const sa=$('#btn-saveall'); if(sa) sa.textContent=tx('saveAll');
  const ht=$('#t-histtitle'); if(ht) ht.textContent=tx('histTitle');
  refreshHistEmpty();
  refreshConnBtn();
}
// 이력 비어있을 때 안내문(연결 전/이력 0건은 render에서 갱신)
function refreshHistEmpty(){
  const he=$('#t-histempty'); if(he && !supa) he.textContent=tx('histEmptyConnect');
}
// 연결 버튼/배지 — 현재 conn 상태 텍스트만 언어 반영(미연결은 data-i18n connState_none이 처리)
function refreshConnBtn(){
  const b=$('#btn-connect'); if(!b) return;
  if(b.classList.contains('connected')) b.textContent=tx('connectedBtn');
}

function toast(msg,cls){const t=document.createElement('div');t.className='toast'+(cls?' '+cls:'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(txt,cls){const e=$('#conn-state');e.textContent=txt;e.className='pill'+(cls?' '+cls:'');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.textContent=tx('connecting'); btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('menu_items').select('id',{count:'exact',head:true});
    if(error) throw error;
    setConn(tx('connOk'),'ok'); toast(tx('connectedToast'),'ok');
    btn.textContent=tx('connectedBtn'); btn.classList.add('connected'); btn.disabled=false;
    $('#btn-add').disabled=false; $('#btn-saveall').disabled=false;
    await load();
  }catch(e){
    setConn(tx('connFail'),'err');
    toast(tx('connFailToast')(e.message),'err');
    btn.textContent=tx('connFailBtn'); btn.disabled=false; supa=null;
  }
}

async function load(){
  const {data,error}=await supa.from('menu_items').select('*').order('venue').order('sort_order').order('id');
  if(error){toast(tx('loadFail')+error.message,'err');return;}
  state.items=data||[];
  render();
  fillNextCode();   // 현재 DB 기준 다음 코드 자동 채움
  loadHistory();    // 수정 이력 갱신
}

// 장소 탭(전체 + 각 장소, 건수 표시)
function renderVenueTabs(){
  const box=$('#venue-tabs'); if(!box) return;
  const vs=allVenues();
  const cnt=k=>state.items.filter(m=>(m.venue||'etc')===k).length;
  const tab=(key,label,n)=>`<button class="vtab${state.venueFilter===key?' active':''}" data-vtab="${esc(key)}">${esc(label)}<span class="vc">${n}</span></button>`;
  let html=tab('__all',tx('all'),state.items.length);
  vs.forEach(v=>{ html+=tab(v.key, v.label, cnt(v.key)); });
  box.innerHTML=html;
  box.querySelectorAll('[data-vtab]').forEach(b=>b.addEventListener('click',()=>{ state.venueFilter=b.dataset.vtab; render(); }));
}
function venueOpts(cur){
  const seen=new Set(); let html='';
  allVenues().forEach(v=>{ seen.add(v.key); html+=`<option value="${esc(v.key)}" ${v.key===cur?'selected':''}>${esc(v.label)}</option>`; });
  if(cur && !seen.has(cur)) html+=`<option value="${esc(cur)}" selected>${esc(cur)}</option>`;
  return html;
}

function render(){
  renderVenueTabs();
  const body=$('#menu-body'); body.innerHTML='';
  // 장소별 단일 보기: 장소(헤더) 안을 라인(카테고리)으로 다시 묶음 → 장소순 → 라인순 → 정렬순
  const items=(state.venueFilter==='__all' ? state.items : state.items.filter(m=>(m.venue||'etc')===state.venueFilter))
    .slice().sort((a,b)=>(venueIdx(a.venue||'etc')-venueIdx(b.venue||'etc'))
      ||(CATS.indexOf(a.category||'기타')-CATS.indexOf(b.category||'기타'))
      ||((a.sort_order||0)-(b.sort_order||0)));
  $('#list-cnt').innerHTML=`${items.length}${t('me_cntItem')}`;
  if(!items.length){ body.innerHTML='<tr><td colspan="10" class="empty-hint">'+t('me_empty')+'</td></tr>'; return; }
  let lastVenue=null, lastCat=null;
  items.forEach(m=>{
    const venue=m.venue||'etc';
    const cat=m.category||'기타';
    // 장소 헤더 (장소 전체 저장 버튼 포함)
    if(venue!==lastVenue){
      lastVenue=venue; lastCat=null;
      const vr=document.createElement('tr');
      vr.innerHTML=`<td colspan="10" class="venue-h"><div style="display:flex;align-items:center;gap:10px">
        <span>${esc(venueLabel(venue))} <span style="color:var(--muted);font-weight:600">(${esc(venuePrefix(venue))})</span></span>
        <button class="btn ghost sm" type="button" data-savevenue style="margin-left:auto">${esc(tx('saveVenue'))}</button>
      </div></td>`;
      const sb=vr.querySelector('[data-savevenue]'); if(sb) sb.addEventListener('click',()=>saveVenue(venue));
      body.appendChild(vr);
    }
    // 라인(카테고리) 서브헤더 — 장소 안 구분
    if(cat!==lastCat){
      lastCat=cat;
      const cr=document.createElement('tr');
      cr.innerHTML=`<td colspan="10" class="line-subh" style="background:var(--surface2);color:var(--text2);font-weight:700;font-size:12px;padding:5px 14px 5px 26px;border-bottom:1px solid var(--border)">▸ ${esc(catLabel(cat))}</td>`;
      body.appendChild(cr);
    }
    const tr=document.createElement('tr');
    if(!m.active) tr.className='inactive';
    tr.dataset.id=m.id;
    const catOpts=CATS.map(c=>`<option value="${esc(c)}" ${c===m.category?'selected':''}>${esc(catLabel(c))}</option>`).join('');
    const stOpts=STATIONS.map(s=>`<option value="${s}" ${s===m.station?'selected':''}>${s}</option>`).join('');
    tr.innerHTML=`
      <td><input class="inp code" data-f="code" value="${esc(m.code)}" readonly title="${esc(tx('tipCodeLock'))}"></td>
      <td><input class="inp" data-f="name_ja" value="${esc(m.name_ja)}"></td>
      <td><input class="inp" data-f="name_ko" value="${esc(m.name_ko)}"></td>
      <td><select class="inp" data-f="category">${catOpts}</select></td>
      <td><select class="inp" data-f="venue">${venueOpts(venue)}</select></td>
      <td><select class="inp" data-f="station">${stOpts}</select></td>
      <td><input class="inp price" data-f="unit_price" type="number" min="0" step="100" value="${Number(m.unit_price||0)}"></td>
      <td><input class="inp sort" data-f="sort_order" type="number" value="${Number(m.sort_order||0)}"></td>
      <td style="text-align:center"><input type="checkbox" data-f="active" ${m.active?'checked':''}></td>
      <td><div class="rowbtns">
        <button class="btn sm" data-save="${m.id}" data-i18n="me_save"></button>
        <button class="btn sm danger" data-del="${m.id}" data-i18n="me_del"></button>
      </div></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>saveRow(b.dataset.save)));
  body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>delRow(b.dataset.del)));
  if(window.SaizenOps) window.SaizenOps.apply();
}

function rowPatch(tr){
  const g=f=>tr.querySelector(`[data-f="${f}"]`);
  return {
    code:g('code').value.trim()||null,
    name_ja:g('name_ja').value.trim(),
    name_ko:g('name_ko').value.trim()||null,
    category:g('category').value,
    venue:g('venue').value.trim()||'etc',
    station:g('station').value,
    unit_price:Math.round(Number(g('unit_price').value||0)),
    sort_order:Math.round(Number(g('sort_order').value||0)),
    active:g('active').checked,
  };
}
// ── 변경이력(change_log) 기록 — best-effort(테이블 없거나 실패해도 저장은 진행) ──
const LOG_FIELDS=['code','name_ja','name_ko','category','venue','station','unit_price','sort_order','active'];
function norm(v){ return (v===true||v===false)?v:(v==null?'':String(v)); }
function diffItem(before,after){
  const ch={};
  LOG_FIELDS.forEach(f=>{ const a=norm(before?before[f]:undefined), b=norm(after?after[f]:undefined);
    if(a!==b) ch[f]={from:(before?before[f]:null)??null, to:(after?after[f]:null)??null}; });
  return ch;
}
function curUser(){ return (window.__so_getUser&&window.__so_getUser())||null; }
async function logChange(action,opt){
  if(!supa) return; opt=opt||{};
  const rec={ entity:'menu_item', action, entity_id:opt.id!=null?String(opt.id):null, label:opt.label||null, changed_by:curUser() };
  if(opt.changes && Object.keys(opt.changes).length) rec.changes=opt.changes;
  try{ const {error}=await supa.from('change_log').insert(rec); if(error) console.warn('change_log skip:',error.message); }
  catch(e){ console.warn('change_log skip:',e.message); }
}
async function logMany(recs){
  if(!supa||!recs.length) return;
  const who=curUser();
  const rows=recs.map(r=>({entity:'menu_item',action:r.action,entity_id:r.id!=null?String(r.id):null,label:r.label||null,
    changes:(r.changes&&Object.keys(r.changes).length)?r.changes:null,changed_by:who}));
  try{ const {error}=await supa.from('change_log').insert(rows); if(error) console.warn('change_log batch skip:',error.message); }
  catch(e){ console.warn('change_log batch skip:',e.message); }
}

async function saveRow(id){
  const tr=$(`tr[data-id="${id}"]`); if(!tr) return;
  const before=state.items.find(m=>String(m.id)===String(id));
  const patch=rowPatch(tr);
  if(!patch.name_ja){toast(tx('needJaName'),'warn');return;}
  const ch=diffItem(before,patch);
  if(!Object.keys(ch).length){toast(tx('noChange'),'warn');return;}
  const {error}=await supa.from('menu_items').update(patch).eq('id',id);
  if(error){toast(tx('saveFail')+error.message,'err');return;}
  await logChange('update',{id,label:patch.code||patch.name_ja,changes:ch});
  toast(tx('saved'),'ok'); await load();
}
// ── 일괄 저장: 여러 행을 한 번의 upsert 로 묶어 저장 + 변경분만 이력 기록 ──
async function saveMany(items){
  if(!supa){toast(tx('needConn'),'warn');return;}
  const rows=[]; const logs=[];
  for(const m of items){
    const tr=$(`tr[data-id="${m.id}"]`); if(!tr) continue;
    const p=rowPatch(tr);
    if(!p.name_ja){toast(tx('bulkNeedJa')(m.code||m.name_ko||m.id),'warn');return;}
    const ch=diffItem(m,p);
    p.id=m.id; rows.push(p);
    if(Object.keys(ch).length) logs.push({action:'update',id:m.id,label:p.code||p.name_ja,changes:ch});
  }
  if(!rows.length){toast(tx('noRowsToSave'),'warn');return;}
  const {error}=await supa.from('menu_items').upsert(rows);
  if(error){toast(tx('bulkSaveFail')+error.message,'err');return;}
  await logMany(logs);
  toast(tx('bulkSaved')(rows.length,logs.length),'ok'); await load();
}
function saveVenue(venue){ saveMany(state.items.filter(m=>(m.venue||'etc')===venue)); }
function saveAll(){ saveMany(state.items); }

async function delRow(id){
  const before=state.items.find(m=>String(m.id)===String(id));
  if(!confirm(tx('confirmDel'))) return;
  const {error}=await supa.from('menu_items').delete().eq('id',id);
  if(error){toast(tx('delFail')+error.message,'err');return;}
  await logChange('delete',{id,label:(before&&(before.code||before.name_ja))||id,changes:diffItem(before,{})});
  toast(tx('deleted'),'warn'); await load();
}

async function addOne(){
  const venue=$('#n-venue').value||'etc';
  const row={
    code:$('#n-code').value.trim()||null,
    name_ja:$('#n-ja').value.trim(),
    name_ko:$('#n-ko').value.trim()||null,
    category:$('#n-cat').value,
    venue:venue,
    station:autoStation($('#n-cat').value, venue),
    unit_price:Math.round(Number($('#n-price').value||0)),
    sort_order:Math.round(Number($('#n-sort').value||0)),
  };
  if(!row.name_ja){toast(tx('addNeedJa'),'warn');return;}
  const {data:ins,error}=await supa.from('menu_items').insert(row).select().single();
  if(error){toast(tx('addFail')+error.message,'err');return;}
  await logChange('insert',{id:ins&&ins.id,label:row.code||row.name_ja,changes:diffItem({},row)});
  toast(tx('added'),'ok');
  ['n-code','n-ja','n-ko'].forEach(id=>$('#'+id).value=''); $('#n-price').value=0; lastAuto='';
  await load();   // load()가 다음 코드 자동 채움
}

// ── 수정 이력 뷰어 ──
function fmtDt(s){ if(!s) return ''; const d=new Date(s); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
async function loadHistory(){
  const body=$('#hist-body'); if(!body||!supa) return;
  const {data,error}=await supa.from('change_log').select('*').eq('entity','menu_item').order('changed_at',{ascending:false}).limit(40);
  if(error){ body.innerHTML='<div class="empty-hint">'+esc(tx('histTblMissing'))+'</div>'; $('#hist-cnt').textContent=''; return; }
  renderHistory(data||[]);
}
const HIST_FKEY={code:'flCode',name_ja:'flNameJa',name_ko:'flNameKo',category:'flCat',venue:'flVenue',station:'flStation',unit_price:'flPrice',sort_order:'flSort',active:'flActive'};
function histFLabel(f){ const k=HIST_FKEY[f]; return k?tx(k):f; }
function renderHistory(list){
  $('#hist-cnt').textContent=list.length?tx('histRecent')(list.length):'';
  const body=$('#hist-body');
  if(!list.length){ body.innerHTML='<div class="empty-hint">'+esc(tx('histEmptyNone'))+'</div>'; return; }
  const AL={insert:tx('actInsert'),update:tx('actUpdate'),delete:tx('actDelete')};
  body.innerHTML=list.map(r=>{
    let diff='';
    let c=r.changes; if(typeof c==='string'){ try{c=JSON.parse(c);}catch(e){c=null;} }
    if(c && typeof c==='object'){ diff=Object.keys(c).map(k=>`${histFLabel(k)}: ${esc(c[k]&&c[k].from)}→${esc(c[k]&&c[k].to)}`).join(' · '); }
    else if(r.field){ diff=`${histFLabel(r.field)}: ${esc(r.old_value)}→${esc(r.new_value)}`; }
    return `<div class="hrow"><span class="ht">${fmtDt(r.changed_at)}</span>`
      +`<span class="ha ha-${esc(r.action)}">${AL[r.action]||r.action}</span>`
      +`<span class="hby">${esc(r.label||'')}</span>`
      +`<span class="hd">${diff}</span>`
      +`<span class="ht">${esc(r.changed_by||'')}</span></div>`;
  }).join('');
}

// ── 부팅 ──
$('#btn-connect').addEventListener('click',connect);
$('#btn-add').addEventListener('click',addOne);
$('#btn-saveall').addEventListener('click',saveAll);
$('#btn-nextcode').addEventListener('click',()=>fillNextCode(true));
$('#n-venue').addEventListener('change',()=>fillNextCode());   // 장소 바꾸면 그 장소의 다음 코드
fillVenueSelect();
fillCatSelect();
applyStatic();
// 품목이 늘어나면 눈으로 못 찾는다 — 공용 행 검색(재렌더 자동 재적용)
if(window.__so_rowSearch) __so_rowSearch('#menu-q','#menu-body','tr',{count:'#menu-qc',label:n=>n+'건'});
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }   // 진입 시 자동 연결
// 언어 토글 시: 정적 chrome + 폼 select 라벨 + 동적 목록·이력 재렌더(선택값 보존)
window.onSaizenLangChange=function(){
  applyStatic();
  const vsel=$('#n-venue'), csel=$('#n-cat');
  const vcur=vsel?vsel.value:null, ccur=csel?csel.value:null;
  fillVenueSelect(); if(vsel&&vcur)vsel.value=vcur;
  fillCatSelect();   if(csel&&ccur)csel.value=ccur;
  try{ if(state.items.length) render(); }catch(e){}
  try{ if(supa) loadHistory(); }catch(e){}   // 이력 패널 라벨도 언어 반영
};
</script>
