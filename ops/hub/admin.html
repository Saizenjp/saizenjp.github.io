<html lang="ja">
<head>

<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;

    --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06);}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{padding:16px 20px 90px;max-width:1100px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel > h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:6px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}

  table.users{width:100%;border-collapse:collapse;font-size:13px}
  table.users th{text-align:left;font-size:11px;color:#fff;background:var(--accent);font-weight:700;padding:8px;white-space:nowrap}
  table.users td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  table.users tr.me{background:var(--accentSoft)}
  .uname{font-weight:700}
  .uemail{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .prof{display:flex;flex-direction:column;gap:5px;min-width:160px}
  .prof .psm{font-size:12px;padding:5px 8px;width:160px}
  .rolesel{min-width:108px}
  .areas{display:flex;flex-wrap:wrap;gap:10px 14px;max-width:460px}
  .areas label{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text2);white-space:nowrap}
  /* 이름·설명이 길어도 [수정][보기]는 오른쪽 같은 줄에 — 설명만 아래로 접힌다 */
  .areas .arealine{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:2px 12px;min-width:236px;white-space:normal}
  .areas .arealine .aname{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0;white-space:normal;grid-column:1}
  .areas .lvl{display:inline-flex;gap:10px;white-space:nowrap;grid-column:2;grid-row:1;justify-self:end}
  .areas .lw{color:var(--accent,#3d5424);font-weight:700}
  .areas .lr{color:#9a7322;font-weight:700}
  .areas .lw input,.areas .lr input{margin-right:3px;vertical-align:-1px}
  .areas.dim{opacity:.4;pointer-events:none}
  .areas .allnote{font-size:11.5px;color:var(--accent2);font-weight:700}
  .deptgrp{border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:var(--surface2)}
  .depthead{font-size:12px;color:var(--text);margin-bottom:5px;border-bottom:1px dashed var(--border2);padding-bottom:4px}
  .depthead .dnote{font-size:10.5px;color:var(--muted);font-weight:600}
  .deptkids{display:flex;flex-direction:column;gap:5px;padding-left:3px}
  .areas label{flex-wrap:wrap}
  .areahint{flex-basis:100%;font-size:10.5px;color:var(--muted);font-weight:500;padding-left:2px;line-height:1.35;white-space:normal}
  .aname .lvlm{font-size:9.5px;font-weight:800;color:#8a2f22;background:#f7e6e2;border:1px solid #e3bdb4;border-radius:5px;padding:1px 6px;white-space:nowrap}
  .rbadge{font-size:9.5px;font-weight:800;border-radius:4px;padding:2px 7px;white-space:nowrap}
  .rb-admin{color:#fff;background:var(--accent2)} .rb-manager{color:#fff;background:var(--accent)} .rb-staff{color:var(--text2);background:var(--surface3);border:1px solid var(--border2)}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}
</style>

</div>

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }

// ── 데이터 키(저장값)는 불변 — 라벨만 언어별로 파생 ──
const AREA_KEYS=['step1','groupcodes','room','hk','print','shizu','golf','front','settle','pos','kitchen','menu','stats','report','watch','board'];
function AREA_LABEL_(k){ return tx('a_'+k)||k; }
function AREA_CARDS_(k){ return tx('ac_'+k)||''; }
// 마스터급 중요 영역 — 권한관리 목록에서 🔒 배지로 한눈에 구분(보통 마스터 본인에게만 부여).
const HIGH_AREAS=new Set(['watch']);
// 부서(부서 단위로 카드를 묶어 한 번에 체크) — area 키는 그대로 카드별 저장
const DEPTS=[
  ['dg_data',['step1','groupcodes']],
  ['dg_frontroom',['front','room','hk','print','shizu','golf','settle']],
  ['dg_fnb',['pos','kitchen','menu']],
  ['dg_common',['board']],
  ['dg_mgmt',['stats','report','watch']],
];
const ROLE_KEYS=['admin','manager','staff'];
function ROLE_LABEL_(r){ return tx('role_'+r)||r; }
// 프로필 부서 선택지(전 페이지 공유 부서 목록) — 키는 front/fnb/golf/acct 고정
const PROF_DEPTS=(window.__so_DEPTS||[['front','pd_front'],['fnb','pd_fnb'],['golf','pd_golf'],['acct','pd_acct']]);
function profDeptLabel(k){ const tk='pd_'+k; const v=tx(tk); return v!==tk?v:k; }
function deptOpts(cur){ return `<option value="">${esc(tx('deptNone'))}</option>`+PROF_DEPTS.map(([k])=>`<option value="${k}" ${k===cur?'selected':''}>${esc(profDeptLabel(k))}</option>`).join(''); }

// 부서별로 묶은 카드 권한 HTML — 영역별 [수정]/[보기] 2단계
//   수정 체크=쓰기(읽기 포함) · 보기만 체크=읽기 전용 · 둘 다 해제=접근 없음
function buildAreas(checked, readChecked){
  const set=new Set(checked||[]); const rset=new Set(readChecked||[]);
  return DEPTS.map(([dlabKey,keys])=>{
    const kids=keys.map(k=>{const ac=AREA_CARDS_(k);const hi=HIGH_AREAS.has(k)?`<span class="lvlm" title="${esc(tx('lvlMasterT'))}">${esc(tx('lvlMaster'))}</span>`:'';return `<label class="arealine"><span class="aname">${esc(AREA_LABEL_(k))}${hi}${ac?`<span class="areahint">${esc(ac)}</span>`:''}</span><span class="lvl"><span class="lw"><input type="checkbox" data-area="${k}" ${set.has(k)?'checked':''}> ${esc(tx('thEdit'))}</span><span class="lr"><input type="checkbox" data-read-area="${k}" ${rset.has(k)&&!set.has(k)?'checked':''}> ${esc(tx('thView'))}</span></span></label>`;}).join('');
    return `<div class="deptgrp">
        <label class="depthead"><input type="checkbox" data-deptall="${keys.join(',')}"> <b>${esc(tx(dlabKey))}</b> <span class="dnote">${esc(tx('deptAll'))}</span></label>
        <div class="deptkids">${kids}</div>
      </div>`;
  }).join('');
}
// 수정 ↔ 보기 상호배타: 한 영역에 둘 다 체크 불가
//   수정=쓰기(보기 포함) / 보기=읽기 전용 / 둘 다 해제=접근 없음
function wireAreaExclusive(scope){
  scope.querySelectorAll('[data-area]').forEach(w=>{
    const k=w.dataset.area; const r=scope.querySelector(`[data-read-area="${k}"]`); if(!r)return;
    w.addEventListener('change',()=>{ if(w.checked) r.checked=false; });
    r.addEventListener('change',()=>{ if(r.checked) w.checked=false; });
  });
}
// 부서 전체 체크박스 ↔ 하위 카드 동기화
function wireDeptAll(scope){
  scope.querySelectorAll('[data-deptall]').forEach(master=>{
    const keys=master.dataset.deptall.split(',');
    const kids=()=>keys.map(k=>scope.querySelector(`[data-area="${k}"]`)).filter(Boolean);
    const sync=()=>{const ks=kids();master.checked=ks.length&&ks.every(c=>c.checked);master.indeterminate=!master.checked&&ks.some(c=>c.checked);};
    master.addEventListener('change',()=>{kids().forEach(c=>{c.checked=master.checked; if(master.checked){const r=scope.querySelector(`[data-read-area="${c.dataset.area}"]`); if(r)r.checked=false;}});});
    kids().forEach(c=>c.addEventListener('change',sync));
    sync();
  });
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg,cls){const t=document.createElement('div');t.className='toast'+(cls?' '+cls:'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(txt,cls){const e=$('#conn-state');e.textContent=txt;e.className='pill'+(cls?' '+cls:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#users').innerHTML='<div class="deny">'+esc(tx('needConnLogin'))+'<small>'+esc(tx('needConnLoginSub'))+'</small></div>'; return; }
    const {data:acc,error}=await supa.rpc('me_access');
    if(error) throw error;
    myRole=(acc&&acc[0]&&acc[0].role)||'staff';
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.classList.add('connected');btn.disabled=false;
    if(myRole!=='admin'){
      $('#users').innerHTML='<div class="deny">'+esc(tx('adminOnly'))+'<small>'+esc(tx('currentRole'))+esc(ROLE_LABEL_(myRole))+esc(tx('noAccess'))+'</small></div>';
      return;
    }
    await load();
    await loadRequests();
  }catch(e){
    setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn');btn.disabled=false; supa=null;
    toast(tx('toastConnFail')+e.message+tx('connFailHint'),'err');
  }
}

async function load(){
  const {data,error}=await supa.rpc('admin_list_users');
  if(error){toast(tx('toastListFail')+error.message,'err');return;}
  rows=data||[];
  render();
}

function render(){
  const box=$('#users');
  if(!rows.length){ box.innerHTML='<div class="deny" style="color:var(--muted)">'+esc(tx('noAccounts'))+'</div>'; return; }
  let html='<table class="users"><thead><tr><th>'+esc(tx('thAccount'))+'</th><th>'+esc(tx('thProfile'))+'</th><th>'+esc(tx('thRole'))+'</th><th>'+esc(tx('thCards'))+'(<span style="color:#d8e7c2">'+esc(tx('thEdit'))+'</span> / <span style="color:#f0cd7a">'+esc(tx('thView'))+'</span>)</th><th></th></tr></thead><tbody>';
  rows.forEach(u=>{
    const roleOpts=ROLE_KEYS.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${esc(ROLE_LABEL_(r))}</option>`).join('');
    const showAreas=u.role!=='admin';
    const areaBoxes=buildAreas(u.areas||[], u.read_areas||[]);
    const blocked=u.active===false;
    // 마스터는 차단 불가(서버에서도 거부). 일반·관리담당만 차단/해제 버튼.
    const blockBtn = u.role==='admin' ? '' :
      `<button class="btn sm" data-block style="margin-top:5px;${blocked?'background:var(--ok);border-color:var(--ok);color:#fff':'background:transparent;color:var(--err);border-color:#e3bdb4'}">${esc(blocked?tx('btnUnblock'):tx('btnBlock'))}</button>`;
    html+=`<tr data-id="${u.user_id}" data-active="${!blocked}"${blocked?' style="background:#fbeeeb"':''}>
      <td><div class="uemail">${esc(u.email||'')}</div>${blocked?` <span class="rbadge" style="background:var(--err);color:#fff;margin-top:4px;display:inline-block">🚫 ${esc(tx('blockedBadge'))}</span>`:''}</td>
      <td><div class="prof">
        <input class="inp psm" data-f="name" value="${esc(u.name||'')}" placeholder="${esc(tx('phName'))}">
        <select class="inp psm" data-f="dept">${deptOpts(u.dept)}</select>
        <input class="inp psm" data-f="title" value="${esc(u.title||'')}" placeholder="${esc(tx('phTitle'))}">
      </div></td>
      <td><select class="inp rolesel" data-f="role">${roleOpts}</select></td>
      <td><div class="areas${showAreas?'':' dim'}" data-areas>${showAreas?areaBoxes:`<span class="allnote">${esc(tx('allCardsMaster'))}</span>`}</div></td>
      <td><button class="btn sm" data-save>${esc(tx('save'))}</button>${blockBtn?'<br>'+blockBtn:''}</td>
    </tr>`;
  });
  html+='</tbody></table>';
  box.innerHTML=html;
  box.querySelectorAll('[data-areas]').forEach(ar=>{ if(ar.querySelector('[data-area]')){ wireAreaExclusive(ar); wireDeptAll(ar); } });
  // 역할 변경 시 카드 영역 활성/비활성 토글
  box.querySelectorAll('select[data-f="role"]').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const tr=sel.closest('tr'); const ar=tr.querySelector('[data-areas]');
      if(sel.value!=='admin'){
        ar.classList.remove('dim');
        if(!ar.querySelector('[data-area]')){   // allnote 상태면 체크박스 생성(기존 체크는 보존)
          ar.innerHTML=buildAreas([],[]); wireDeptAll(ar);
        }
      }else{
        ar.classList.add('dim'); ar.innerHTML=`<span class="allnote">${esc(tx('allCardsMaster'))}</span>`;
      }
    });
  });
  box.querySelectorAll('button[data-save]').forEach(b=>b.addEventListener('click',()=>saveRow(b.closest('tr'))));
  box.querySelectorAll('button[data-block]').forEach(b=>b.addEventListener('click',()=>toggleBlock(b.closest('tr'))));
}
// 계정 차단/해제 — admin_set_active(마스터·본인은 서버에서 거부)
async function toggleBlock(tr){
  const id=tr.dataset.id, active=tr.getAttribute('data-active')!=='false';
  if(active && !confirm(tx('confirmBlock'))) return;   // 차단 시에만 확인
  try{
    const {error}=await supa.rpc('admin_set_active',{p_user:id,p_active:!active});
    if(error) throw error;
    toast(active?tx('toastBlocked'):tx('toastUnblocked'),'ok');
    await load();
  }catch(e){ toast(tx('toastBlockFail')+(e.message||e),'err'); }
}

async function saveRow(tr){
  const id=tr.dataset.id;
  const role=tr.querySelector('select[data-f="role"]').value;
  const name=(tr.querySelector('[data-f="name"]').value||'').trim();
  const dept=tr.querySelector('[data-f="dept"]').value||'';
  const title=(tr.querySelector('[data-f="title"]').value||'').trim();
  const areas=role!=='admin'
    ? [...tr.querySelectorAll('[data-area]')].filter(c=>c.checked).map(c=>c.dataset.area)
    : [];
  // 보기 체크 영역(수정에 이미 있으면 제외 — 수정이 읽기 포함)
  const wset=new Set(areas);
  const read_areas=role!=='admin'
    ? [...tr.querySelectorAll('[data-read-area]')].filter(c=>c.checked).map(c=>c.dataset.readArea).filter(a=>!wset.has(a))
    : [];
  const {error}=await supa.rpc('admin_set_access',{p_user:id,p_role:role,p_areas:areas,p_read_areas:read_areas,p_name:name,p_dept:dept,p_title:title});
  if(error){toast(tx('toastSaveFail')+error.message,'err');return;}
  toast(tx('toastSaved'),'ok');
  await load();
}

// ── 가입 요청 검토 (28_access_requests.sql) ──
function fmtDt(s){ if(!s) return ''; const d=new Date(s); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
async function loadRequests(){
  const panel=$('#req-panel'); if(!panel||!supa) return;
  const {data,error}=await supa.from('access_requests').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){ panel.style.display='none'; return; }   // 권한 없음/테이블 없음 → 패널 숨김
  panel.style.display=''; renderRequests(data||[]);
}
function renderRequests(list){
  const pend=list.filter(r=>r.status==='pending');
  const badge=$('#req-badge');
  if(badge){ badge.style.display=''; badge.className='pill'+(pend.length?' err':' ok'); badge.textContent=tx('reqWaiting')+' '+pend.length; }
  const box=$('#req-list');
  if(!list.length){ box.innerHTML='<div class="deny" style="color:var(--muted)">'+esc(tx('reqNone'))+'</div>'; return; }
  const STAT={pending:[tx('stPending'),'rb-staff'],approved:[tx('stApproved'),'rb-manager'],rejected:[tx('stRejected'),'rb-admin']};
  let html='<table class="users"><thead><tr><th>'+esc(tx('reqRequester'))+'</th><th>'+esc(tx('reqEmail'))+'</th><th>'+esc(tx('reqDeptMemo'))+'</th><th>'+esc(tx('reqTime'))+'</th><th>'+esc(tx('reqStatus'))+'</th><th></th></tr></thead><tbody>';
  list.forEach(r=>{
    const st=STAT[r.status]||[r.status,'rb-staff'];
    html+=`<tr data-id="${esc(r.id)}">
      <td class="uname">${esc(r.name||'')}</td>
      <td><span class="uemail">${esc(r.email||'')}</span></td>
      <td style="font-size:12px;color:var(--text2)">${esc(r.dept||'')}${r.message?('<div style="color:var(--muted);margin-top:2px">'+esc(r.message)+'</div>'):''}</td>
      <td style="font-size:11.5px;color:var(--muted);white-space:nowrap">${fmtDt(r.created_at)}</td>
      <td><span class="rbadge ${st[1]}">${esc(st[0])}</span>${r.handled_by?('<div style="font-size:10.5px;color:var(--muted);margin-top:3px">'+esc(r.handled_by)+'</div>'):''}</td>
      <td style="white-space:nowrap">
        ${r.status!=='approved'?`<button class="btn sm" data-act="approved">${esc(tx('btnDone'))}</button> `:''}
        ${r.status!=='rejected'?`<button class="btn sm" data-act="rejected" style="background:transparent;color:var(--err);border-color:#e3bdb4">${esc(tx('btnReject'))}</button> `:''}
        <button class="btn sm" data-act="delete" style="background:transparent;color:var(--muted);border-color:var(--border2)">${esc(tx('btnDelete'))}</button>
      </td>
    </tr>`;
  });
  html+='</tbody></table>';
  box.innerHTML=html;
  box.querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',()=>handleReq(b.closest('tr').dataset.id,b.dataset.act)));
}
async function handleReq(id,act){
  if(act==='delete'){
    if(!confirm(tx('confirmDelete'))) return;
    const {error}=await supa.from('access_requests').delete().eq('id',id);
    if(error){toast(tx('toastDeleteFail')+error.message,'err');return;}
    toast(tx('toastDeleted'),'ok');
  }else{
    const who=(window.__so_getUser&&__so_getUser())||'';
    const {error}=await supa.from('access_requests').update({status:act,handled_by:who||null,handled_at:new Date().toISOString()}).eq('id',id);
    if(error){toast(tx('toastHandleFail')+error.message,'err');return;}
    toast(act==='approved'?tx('toastMarkApproved'):tx('toastMarkRejected'),'ok');
  }
  await loadRequests();
}

// 정적 라벨 적용(언어별)
function applyStatic(){
  $('#t-step').textContent=tx('step');
  $('#t-home').textContent=tx('home');
  $('#t-connhint').textContent=tx('connHint');
  const cb=$('#btn-connect'); if(cb && !cb.classList.contains('connected') && !cb.disabled) cb.textContent=tx('connect');
  // 가입 요청 패널
  const rt=$('#req-panel') && $('#req-panel').querySelector('[data-i18n="reqTitle"]'); if(rt) rt.textContent=tx('reqTitle');
  $('#t-req-desc').innerHTML=tx('reqDesc');
  const rl=$('#t-req-loading'); if(rl) rl.textContent=tx('reqLoading');
  // 담당자 권한 관리 패널
  $('#t-users-h').textContent=tx('usersTitle');
  $('#t-users-desc').innerHTML=tx('usersDesc');
  const ue=$('#t-users-empty'); if(ue) ue.textContent=tx('usersEmpty');
  // 연결 상태 pill(연결 전만 기본값으로 갱신)
  const e=$('#conn-state'); if(e && !e.classList.contains('ok') && !e.classList.contains('err')) e.textContent=tx('notConn');
}
// 언어 토글 시 정적 라벨 + 동적 표(역할/카드/요청) 재렌더
window.onSaizenLangChange=function(){ applyStatic(); if(rows.length) render(); if(supa) loadRequests(); };

$('#btn-connect').addEventListener('click',connect);
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }
</script>
