function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; const v=d[k]; return v!=null?v:(L.ja[k]!=null?L.ja[k]:k); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2500);}
function setConn(t,c){const e=$('#conn-state');if(e){e.textContent=t;e.className='pill'+(c?' '+c:'');}}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}

let supa=null, YM=null, DATESEL=null;
let TEAMS=[];      // {seq, dep, arr, accom, tag, isPus, members:[{id,name,eng,gender}], golfDays:[date]}
let ROSTER=[];     // 그날 라운딩 인원 [{id,name,eng,gender,seq,tag}]
let GROUPS=[];     // 화면 조 [{id?,course,tee,slot,note, members:[member]}]
let SEL=new Set(); // 선택된 member id (풀에서)

function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthBounds(ym){const [y,m]=ym.split('-').map(Number);const start=`${y}-${String(m).padStart(2,'0')}-01`;const endD=new Date(y,m,0).getDate();const end=`${y}-${String(m).padStart(2,'0')}-${String(endD).padStart(2,'0')}`;return {start,end};}
function fmtDate(d){ if(!d)return''; if(d instanceof Date){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;} return String(d).slice(0,10); }
function parseLocalDate(s){ return SZCore.parseLocalDate(s); }
function isWeekend(date){ const d=new Date(date).getDay(); return d===0||d===6; }
function isNonWorkday(date){ return isWeekend(date)||JP_HOLIDAYS.has(String(date).slice(0,10)); }
function dow(d){ const w=['日','月','火','水','木','金','土']; try{ return '('+w[new Date(d).getDay()]+')'; }catch(e){ return ''; } }
function normGender(g){ g=String(g||'').trim(); if(/여|女/.test(g)||/^f/i.test(g))return '女'; if(/남|男/.test(g)||/^m/i.test(g))return '男'; return ''; }
function titleCase(s){ return String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()); }

// 팀의 라운딩 날짜 = 상품명 기반(dispatchGolfRows 동일 규칙): 입국ICN·중간일·귀국PUS
function golfDaysFor(t){
  const out=[]; if(!t.dep||!t.arr) return out;
  const cur=parseLocalDate(t.dep), end=parseLocalDate(t.arr); if(isNaN(cur)||isNaN(end)) return out;
  for(; cur<=end; cur.setDate(cur.getDate()+1)){
    const ds=fmtDate(cur);
    if(ds===t.dep){ if(t.isPus) continue; out.push(ds); }       // 입국일=ICN만
    else if(ds===t.arr){ if(!t.isPus) continue; out.push(ds); } // 귀국일=PUS만
    else out.push(ds);                                          // 중간일=전원
  }
  return out;
}

async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.textContent=tx('connecting');
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('loginNeed'),'err'); btn.textContent=tx('connBtn'); btn.disabled=false; return; }
    setConn(tx('connOk'),'ok'); btn.textContent='✓'; btn.classList.add('connected'); btn.disabled=false;
    YM=YM||thisYM(); renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFail'); btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

        <button class="btn sm ghost" id="btn-print" type="button" disabled>${tx('print')}</button>
      </div>

        <span class="cnt">${tx('daySel')}</span>
        <span id="daychips" style="display:flex;flex-wrap:wrap;gap:5px"></span>
      </div>
      <div class="cnt" style="color:var(--muted);margin-top:5px">${tx('dayNote')}</div>
    </div>
    <div id="board"></div>`;
  $('#ym-prev').addEventListener('click',()=>{YM=shiftYM(YM,-1);DATESEL=null;load();});
  $('#ym-next').addEventListener('click',()=>{YM=shiftYM(YM,1);DATESEL=null;load();});
  $('#btn-save').addEventListener('click',saveBoard);
  $('#btn-print').addEventListener('click',printSheet);
}

async function pagedIn(table, cols, key, vals){
  const out=[]; const uniq=[...new Set(vals)];
  for(let i=0;i<uniq.length;i+=80){ const chunk=uniq.slice(i,i+80); let from=0;
    for(;;){ const {data,error}=await supa.from(table).select(cols).in(key,chunk).range(from,from+999); if(error)throw error; out.push(...(data||[])); if(!data||data.length<1000)break; from+=1000; } }
  return out;
}

async function load(){
  if(!supa)return;
  $('#ym-label').textContent=YM; $('#stat').textContent='…';
  try{
    const {start,end}=monthBounds(YM);
    // 그 달에 겹치는 팀
    const {data:bs,error}=await supa.from('bookings').select('event_seq,dep_date,arr_date,rep_name,origin').lte('dep_date',end).gt('arr_date',start);
    if(error)throw error;
    const seqs=(bs||[]).map(b=>b.event_seq);
    const gs = seqs.length? await pagedIn('guests','event_seq,accom,group_code,team_tag','event_seq',seqs):[];
    const gmap={}; gs.forEach(g=>gmap[g.event_seq]=g);
    const gms = seqs.length? await pagedIn('guest_members','id,event_seq,name_kr,name_en','event_seq',seqs):[];
    const pxs = seqs.length? await pagedIn('passengers','event_seq,name_kr,gender,origin,dep_flight','event_seq',seqs):[];
    // 성별 매칭(event_seq+이름)
    const genMap={}; pxs.forEach(p=>{ const k=p.event_seq+'|'+String(p.name_kr||'').trim(); if(!genMap[k]) genMap[k]=normGender(p.gender); });
    // 대표 출발지(팀 isPus)
    const oriMap={}; pxs.forEach(p=>{ if(oriMap[p.event_seq]==null){ oriMap[p.event_seq]=SZCore.isPus(p.origin,p.dep_flight); } });
    const memByTeam={}; gms.forEach(m=>{ const nm=String(m.name_kr||'').trim();
      (memByTeam[m.event_seq]=memByTeam[m.event_seq]||[]).push({ id:m.id, name:nm, eng:titleCase(m.name_en), gender:genMap[m.event_seq+'|'+nm]||'', seq:m.event_seq }); });
    TEAMS=(bs||[]).map(b=>{ const g=gmap[b.event_seq]||{};
      const t={ seq:b.event_seq, dep:fmtDate(b.dep_date), arr:fmtDate(b.arr_date), accom:g.accom||'',
        tag:(window.SZCore&&SZCore.tagStripSeq)?SZCore.tagStripSeq(g.team_tag||g.group_code||''):(g.team_tag||g.group_code||''),
        isPus: oriMap[b.event_seq]!=null?oriMap[b.event_seq]:SZCore.isPus(b.origin,''), rep:b.rep_name||'',
        members: memByTeam[b.event_seq]||[] };
      t.golfDays=golfDaysFor(t); return t;
    }).filter(t=>t.members.length);
    renderDateChips();
    const ax=golfDates();
    if(DATESEL && !ax.includes(DATESEL)) DATESEL=null;
    $('#stat').textContent=`${TEAMS.length}${tx('teamUnit')}`;
    if(DATESEL) await loadBoard(DATESEL); else renderBoard();
  }catch(e){ toast(tx('loadFail')+': '+e.message,'err'); $('#stat').textContent=''; }
}

function golfDates(){ const s=new Set(); TEAMS.forEach(t=>t.golfDays.forEach(d=>{ if(d.slice(0,7)===YM) s.add(d); })); return [...s].sort(); }
function teamsOnDate(date){ return TEAMS.filter(t=>t.golfDays.includes(date)); }

function renderDateChips(){
  const box=$('#daychips'); if(!box)return;
  const ax=golfDates();
  box.innerHTML=ax.map(d=>{ const dt=parseLocalDate(d); return `<button type="button" class="daychip${DATESEL===d?' on':''}" data-d="${d}">${dt.getMonth()+1}/${dt.getDate()}<small style="opacity:.7">${dow(d)}</small></button>`; }).join('')
    || `<span class="cnt" style="color:var(--muted)">${tx('noData')}</span>`;
  box.querySelectorAll('.daychip').forEach(b=>b.addEventListener('click',async()=>{ DATESEL=b.getAttribute('data-d'); SEL.clear(); renderDateChips(); await loadBoard(DATESEL); }));
}

// 저장된 조 로드 → 화면 GROUPS 구성
async function loadBoard(date){
  const teams=teamsOnDate(date);
  ROSTER=[]; teams.forEach(t=>t.members.forEach(m=>ROSTER.push({...m, tag:t.tag})));
  GROUPS=[];
  try{
    const {data:grps}=await supa.from('golf_groups').select('id,course_code,tee_time,cart_no,slot_no,note').eq('play_date',date).order('slot_no',{nullsFirst:false});
    const gids=(grps||[]).map(g=>g.id);
    const gmembers = gids.length? await pagedIn('golf_group_members','id,group_id,member_id,event_seq,seq','group_id',gids):[];
    const byG={}; gmembers.forEach(m=>{ (byG[m.group_id]=byG[m.group_id]||[]).push(m); });
    (grps||[]).forEach(g=>{
      const mems=(byG[g.id]||[]).sort((a,b)=>(a.seq||0)-(b.seq||0)).map(gm=>{
        const r=ROSTER.find(x=>x.id===gm.member_id); return r|| {id:gm.member_id,name:'?',eng:'',gender:'',seq:gm.event_seq,tag:''};
      });
      GROUPS.push({ id:g.id, course:g.course_code||'', tee:g.tee_time||'', cart:g.cart_no||'', slot:g.slot_no||null, note:g.note||'', members:mems });
    });
  }catch(e){ /* 없으면 빈 편성 */ }
  renderBoard();
}

function assignedIds(){ const s=new Set(); GROUPS.forEach(g=>g.members.forEach(m=>s.add(m.id))); return s; }
function poolMembers(){ const a=assignedIds(); return ROSTER.filter(m=>!a.has(m.id)); }

function renderBoard(){
  const box=$('#board'); if(!box)return;
  $('#btn-save').disabled=!DATESEL; $('#btn-print').disabled=!(DATESEL&&GROUPS.length);
  if(!DATESEL){ box.innerHTML=`<div class="panel"><div class="deny">${tx('noDay')}</div></div>`; return; }
  const teams=teamsOnDate(DATESEL);
  if(!teams.length){ box.innerHTML=`<div class="panel"><div class="deny">${tx('noData')}</div></div>`; return; }
  const pool=poolMembers();
  // 풀(팀별)
  const byTeam={}; pool.forEach(m=>{ (byTeam[m.tag||m.seq]=byTeam[m.tag||m.seq]||[]).push(m); });
  const poolHTML=Object.keys(byTeam).length? Object.keys(byTeam).map(k=>{
    const ms=byTeam[k];
    return `<div class="pool-team"><div class="pt-h">${esc(ms[0].tag||('#'+ms[0].seq))}</div>${ms.map(memChip).join('')}</div>`;
  }).join('') : `<div class="cnt" style="color:var(--muted);padding:8px">${lang()==='ja'?'全員編成済':lang()==='en'?'All assigned':'전원 편성됨'}</div>`;

  box.innerHTML=`<div class="board">
    <div class="panel pool">
      <h3>${tx('poolH')} <span class="cnt">${tx('unassigned')(pool.length)}</span></h3>
      <div class="row" style="margin-bottom:8px">
        <button class="btn xs ghost" id="b-selm" type="button">${tx('male')}</button>
        <button class="btn xs ghost" id="b-self" type="button">${tx('female')}</button>
        <button class="btn xs" id="b-tognew" type="button">${tx('selToGrp')}</button>
      </div>
      <div id="poolbox">${poolHTML}</div>
    </div>
    <div class="panel groups">
      <h3>${tx('groupsH')} <span class="cnt">${GROUPS.length}${tx('grp')}</span>
        <span style="flex:1"></span>
        <button class="btn xs ghost" id="b-auto" type="button">${tx('autoTeam')}</button>
        <button class="btn xs ghost" id="b-add" type="button">${tx('addGrp')}</button>
        <button class="btn xs ghost" id="b-clear" type="button" style="color:var(--err)">${tx('clearAll')}</button>
      </h3>
      <div class="grp-grid" id="grpgrid">${GROUPS.map(grpCard).join('')||`<div class="cnt" style="color:var(--muted)">${tx('addGrp')} →</div>`}</div>
    </div>
  </div>`;
  bindBoard();
}
function memChip(m){ const g=m.gender==='男'?'<span class="g m">♂</span>':m.gender==='女'?'<span class="g f">♀</span>':'';
  return `<span class="mem${SEL.has(m.id)?' sel':''}" data-id="${m.id}">${g}${esc(m.name)}</span>`; }
function grpCard(g,i){
  const full=g.members.length>=4;
  const opts=COURSES.map(c=>`<option value="${c.code}"${g.course===c.code?' selected':''}>${lang()==='ja'?c.ja:c.ko}</option>`).join('');
  return `<div class="grp ${g.course?('course-'+g.course):''}${full?' full':''}" data-i="${i}">
    <div class="grp-h"><span class="no">${i+1}${tx('grp')}</span><span class="cap">${g.members.length}/4</span></div>
    <div class="grp-ctl">
      <select class="cs" data-i="${i}"><option value="">${tx('course')}</option>${opts}</select>
      <input class="tt" data-i="${i}" placeholder="${tx('tee')}" value="${esc(g.tee||'')}">
      <input class="ct" data-i="${i}" placeholder="${tx('cart')}" value="${esc(g.cart||'')}" style="width:56px">
    </div>
    <div class="grp-m">${g.members.map((m,mi)=>{ const gg=m.gender==='男'?'<span class="g m">♂</span>':m.gender==='女'?'<span class="g f">♀</span>':'';
      return `<div class="gm">${gg}${esc(m.name)} <span class="tag">${esc(m.tag||'')}</span><span class="x" data-i="${i}" data-mi="${mi}">✕</span></div>`; }).join('')}</div>
  </div>`;
}
function bindBoard(){
  document.querySelectorAll('#poolbox .mem').forEach(el=>el.addEventListener('click',()=>{ const id=el.dataset.id; if(SEL.has(id))SEL.delete(id); else SEL.add(id); el.classList.toggle('sel'); }));
  document.querySelectorAll('#grpgrid .grp').forEach(el=>el.addEventListener('click',ev=>{ if(ev.target.closest('.x')||ev.target.closest('select')||ev.target.closest('input'))return; assignSelTo(+el.dataset.i); }));
  document.querySelectorAll('#grpgrid .x').forEach(el=>el.addEventListener('click',ev=>{ ev.stopPropagation(); removeMember(+el.dataset.i,+el.dataset.mi); }));
  document.querySelectorAll('#grpgrid .cs').forEach(el=>el.addEventListener('change',()=>{ GROUPS[+el.dataset.i].course=el.value; renderBoard(); }));
  document.querySelectorAll('#grpgrid .tt').forEach(el=>el.addEventListener('change',()=>{ GROUPS[+el.dataset.i].tee=el.value.trim(); }));
  document.querySelectorAll('#grpgrid .ct').forEach(el=>el.addEventListener('change',()=>{ GROUPS[+el.dataset.i].cart=el.value.trim(); }));
  $('#b-add').addEventListener('click',()=>{ GROUPS.push({course:autoCourse(),tee:'',cart:'',slot:GROUPS.length+1,note:'',members:[]}); renderBoard(); });
  $('#b-clear').addEventListener('click',()=>{ GROUPS=[]; SEL.clear(); renderBoard(); });
  $('#b-auto').addEventListener('click',autoAssign);
  $('#b-tognew').addEventListener('click',()=>{ if(!SEL.size){ toast(tx('selNone'),'warn'); return; } GROUPS.push({course:autoCourse(),tee:'',cart:'',slot:GROUPS.length+1,note:'',members:[]}); assignSelTo(GROUPS.length-1); });
  $('#b-selm').addEventListener('click',()=>selByGender('男'));
  $('#b-self').addEventListener('click',()=>selByGender('女'));
}
function selByGender(g){ SEL.clear(); poolMembers().forEach(m=>{ if(m.gender===g) SEL.add(m.id); }); renderBoard(); }
function autoCourse(){ // 인기순(아소>소보>쿠주) 균형 — 코스별 조 수 최소인 곳
  const cnt={aso:0,sobo:0,kuju:0}; GROUPS.forEach(g=>{ if(cnt[g.course]!=null)cnt[g.course]++; });
  return COURSES.slice().sort((a,b)=>(cnt[a.code]-cnt[b.code])||(a.pop-b.pop))[0].code;
}
function assignSelTo(gi){
  const g=GROUPS[gi]; if(!g)return; if(!SEL.size){ toast(tx('selNone'),'warn'); return; }
  const pool=poolMembers();
  for(const m of pool){ if(!SEL.has(m.id))continue; if(g.members.length>=4){ toast(tx('capFull'),'warn'); break; } g.members.push(m); }
  SEL.clear(); renderBoard();
}
function removeMember(gi,mi){ const g=GROUPS[gi]; if(!g)return; g.members.splice(mi,1); renderBoard(); }
// 그 날 그 팀의 홀 수(9홀=귀국일 부산팀 / 18홀=그 외) — 게시판 備考·티오프 순서 기준
function holesOfTeam(t){
  const r=SZCore.golfRows({dep:t.dep,arr:t.arr,accom:t.accom},t.isPus).find(x=>x.date===DATESEL);
  return r?r.holes:18;
}
function teamOfGroup(g){ const s=g.members&&g.members[0]&&g.members[0].seq; return TEAMS.find(t=>t.seq===s)||null; }
// 코스별 티오프 = 6:50부터 7분 간격(마지막 8:42 = 17조). GROUPS 순서대로 채운다.
function applyTeeTimes(){
  const slots=SZCore.teeSlots(); const idx={};
  GROUPS.forEach((g,i)=>{ const c=g.course||''; idx[c]=idx[c]||0; g.tee=slots[idx[c]]||''; idx[c]++; g.slot=i+1; });
  return slots.length;
}
function autoAssign(){
  // 규칙(Min 2026-08): 팀을 4명 정원으로 균등 분할(2명=1조 · 4명=1조 · 6명=3+3 · 8명=4+4).
  //  한 팀의 조는 같은 코스에 연속으로 두고, 9홀(귀국일) 팀을 앞 시간대에 배치.
  //  티오프는 코스별 6:50 시작 7분 간격(마지막 8:42).
  const teams=teamsOnDate(DATESEL);
  if(!teams.length){ toast(tx('noData'),'warn'); return; }
  GROUPS=[];                                   // 자동 편성은 그날 전체를 다시 짠다
  const order=teams.slice().sort((a,b)=>(holesOfTeam(a)-holesOfTeam(b))||String(a.tag).localeCompare(String(b.tag)));
  const cnt={}; COURSES.forEach(c=>cnt[c.code]=0);
  order.forEach(t=>{
    const sizes=SZCore.splitTeam(t.members.length);
    if(!sizes.length) return;
    // 코스 = 조 수 적은 곳(인기순 타이브레이크) — 한 팀은 한 코스에 몰아서
    const c=COURSES.slice().sort((a,b)=>(cnt[a.code]-cnt[b.code])||(a.pop-b.pop))[0].code;
    let i=0;
    sizes.forEach(sz=>{
      const ms=t.members.slice(i,i+sz).map(m=>({...m,tag:t.tag})); i+=sz;
      GROUPS.push({course:c,tee:'',cart:'',slot:0,note:'',members:ms});
      cnt[c]++;
    });
  });
  const cap=applyTeeTimes();
  renderBoard();
  const over=COURSES.filter(c=>cnt[c.code]>cap);
  if(over.length) toast(tx('teeOver')(over.map(c=>lang()==='ja'?c.ja:c.ko).join('·'),cap),'warn');
}

async function saveBoard(){
  if(!supa||!DATESEL)return;
  const by=(window.__so_getUser&&__so_getUser())||'';
  try{
    // 그날 기존 조 전부 교체(멤버는 cascade)
    await supa.from('golf_groups').delete().eq('play_date',DATESEL);
    let n=0;
    for(let i=0;i<GROUPS.length;i++){ const g=GROUPS[i]; if(!g.members.length && !g.course && !g.tee) continue;
      const {data:ins,error}=await supa.from('golf_groups').insert({ play_date:DATESEL, course_code:g.course||null, tee_time:g.tee||null, cart_no:g.cart||null, slot_no:i+1, assign_source:'manual', capacity:4, note:g.note||null, created_by:by }).select('id').single();
      if(error)throw error;
      const rows=g.members.map((m,mi)=>({ group_id:ins.id, member_id:m.id, event_seq:m.seq, seq:mi+1 }));
      if(rows.length){ const {error:e2}=await supa.from('golf_group_members').insert(rows); if(e2)throw e2; }
      n++;
    }
    toast(tx('savedN')(n),'ok'); await loadBoard(DATESEL);
  }catch(e){ toast(tx('saveFail')+(e.message||e),'err'); }
}

function printSheet(){
  if(!DATESEL||!GROUPS.length){ toast(tx('noData'),'err'); return; }
  const dt=parseLocalDate(DATESEL);
  const slots=SZCore.teeSlots();
  // ── 현장 게시판 양식(Min 2026-08 사진 기준) ─────────────────────────────
  //  코스마다 [시간 · Group · 대표자명 · 備考] 표. 시간은 6:50~8:42 고정 17행.
  //  備考 = 9홀(귀국일) 「9홀 플레이 이후 점심/출국」 · 그 외 「18홀 이후 점심식사 예정」.
  //  같은 문구가 이어지면 세로로 병합(rowspan) — 사진과 동일.
  //  ⚠ 손님(한국 골퍼)용 게시물이라 한국어 고정(화면 언어 토글과 무관).
  const N9='9홀 플레이 이후\n점심/출국', N18='18홀 플레이 이후\n점심식사 예정';
  const byC={}; COURSES.forEach(c=>byC[c.code]=[]);
  GROUPS.forEach(g=>{ if(byC[g.course]) byC[g.course].push(g); });
  const courseTable=c=>{
    const list=byC[c.code].slice().sort((a,b)=>String(a.tee||'zz').localeCompare(String(b.tee||'zz')));
    const bySlot={}; list.forEach(g=>{ if(g.tee) bySlot[g.tee]=g; });
    let free=list.filter(g=>!g.tee), fi=0;
    const rows=slots.map(t=>{
      const g=bySlot[t]||free[fi++]||null;
      if(!g) return {t, tag:'', rep:'', note:''};
      const team=teamOfGroup(g);
      const holes=team?holesOfTeam(team):18;
      const rep=team&&team.rep?`${team.rep}님 일행`:'';
      return {t, tag:(g.members[0]&&g.members[0].tag)||'', rep, note:(holes===9?N9:N18)};
    });
    // 備考 세로 병합 — 같은 문구가 이어지는 구간을 한 칸으로
    const span=rows.map(()=>0);
    for(let i=0;i<rows.length;){
      if(!rows[i].note){ span[i]=1; i++; continue; }
      let j=i; while(j+1<rows.length && rows[j+1].note===rows[i].note) j++;
      span[i]=j-i+1; for(let k=i+1;k<=j;k++) span[k]=0; i=j+1;
    }
    const tr=rows.map((r,i)=>`<tr>
      <td class="tm">${esc(r.t.replace(/^0/,''))}</td>
      <td class="gp">${esc(r.tag)}</td>
      <td class="rp">${esc(r.rep)}</td>
      ${span[i]?`<td class="bg${r.note===N9?' n9':(r.note?' n18':'')}" rowspan="${span[i]}">${esc(r.note).replace(/\n/g,'<br>')}</td>`:''}
    </tr>`).join('');
    return `<div class="ct">
      <table><thead>
        <tr><th class="dt" colspan="4">${dt.getMonth()+1}/${dt.getDate()} &nbsp; ${esc(c.ko)}(${c.code.toUpperCase()}) 코스</th></tr>
        <tr><th class="tm">시간</th><th class="gp">Group</th><th class="rp">대표자명</th><th class="bg">備考</th></tr>
      </thead><tbody>${tr}</tbody></table>
      <div class="foot"><b>점심식사 권장</b>
        <div>◆ 당일 코스 내 흐름에 따라 18홀 플레이 후 식사에서 9홀 플레이 후 식사로 변경될 수 있사오니 양해 부탁드립니다.</div></div>
    </div>`;
  };
  const css=`<style>@page{size:A4 landscape;margin:8mm}*{box-sizing:border-box}
    body{font-family:'Malgun Gothic','Yu Gothic',sans-serif;color:#111}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm;padding:4mm}
    .ct{break-inside:avoid}
    table{width:100%;border-collapse:collapse;font-size:11.5pt}
    th,td{border:1px solid #444;padding:1.6mm 2mm;text-align:center}
    th.dt{background:#e8e8e8;font-size:13pt;text-align:left;padding:2.4mm 3mm}
    thead tr:nth-child(2) th{background:#f2f2f2;font-size:10.5pt}
    td.tm{width:15%;font-weight:700;font-variant-numeric:tabular-nums}
    td.gp{width:16%;font-family:'Yu Gothic',monospace;font-weight:800}
    td.rp{width:34%;text-align:left;padding-left:3mm}
    td.bg{width:35%;font-weight:800;line-height:1.35}
    td.bg.n9{background:#e6e6e6}
    td.bg.n18{background:#f7f2dd}
    .foot{border:1px solid #444;border-top:none;background:#eef2ea;font-size:9.5pt;padding:2mm 3mm;line-height:1.4}
    .foot b{display:inline-block;margin-right:3mm}
    .bar{position:sticky;top:0;background:#fff;border-bottom:2px solid #647548;padding:9px 14px;display:flex;gap:10px;align-items:center}
    .bar button{padding:8px 18px;border:none;border-radius:6px;font-weight:800;cursor:pointer}
    .bar .p{background:#15803D;color:#fff}.bar .c{background:#e5e7e0}
    @media print{.bar{display:none}}</style>`;
  const w=window.open('','_blank'); if(!w){ toast('popup','err'); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>golf_tee_${DATESEL}</title>${css}</head><body>
    <div class="bar"><b style="flex:1">티오프 안내 · ${DATESEL} ${dow(DATESEL)}</b>
      <button class="p" onclick="window.print()">🖨 ${lang()==='ja'?'印刷':lang()==='en'?'Print':'인쇄'}</button>
      <button class="c" onclick="window.close()">✕ ${lang()==='ja'?'閉じる':lang()==='en'?'Close':'닫기'}</button></div>
    <div class="grid">${COURSES.map(courseTable).join('')}</div>
  </body></html>`);
  w.document.close();
}

function applyStatic(){
  const st=$('#t-step'); if(st) st.textContent=tx('step');
  const ch=$('#t-connhint'); if(ch) ch.textContent=tx('connHint');
  if(!supa){ setConn(tx('notConn')); }
}
window.onSaizenLangChange=function(){ applyStatic(); if(supa&&$('#ym-label')){ renderUI(); $('#ym-label').textContent=YM; renderDateChips(); renderBoard(); } };

$('#btn-connect').addEventListener('click',connect);
loadCreds(); applyStatic();
if($('#sb-url').value && $('#sb-key').value){ connect(); }
</script>
