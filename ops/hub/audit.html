<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad;
    --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06);}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{padding:16px 20px 90px;max-width:1000px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .bar h2{font-size:16px;font-weight:800;color:var(--accent)}
  .bar .meta{font-size:12px;color:var(--muted);font-weight:600}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .allok{padding:34px 20px;text-align:center;color:var(--ok);font-size:17px;font-weight:800;background:var(--accentSoft);border:1px solid #b4cda0;border-radius:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-left-width:5px;border-radius:11px;padding:13px 16px;margin-bottom:13px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .card.ok{border-left-color:var(--ok)}
  .card.warn{border-left-color:var(--warn)}
  .card.err{border-left-color:var(--err)}
  .card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .nm{font-size:14.5px;font-weight:800;color:var(--text)}
  .cnt{font-size:12px;font-weight:800;border-radius:99px;padding:2px 11px;white-space:nowrap}
  .cnt.zero{background:var(--accentSoft);color:var(--ok);border:1px solid #b4cda0}
  .cnt.hit{background:#f7e6e2;color:var(--err);border:1px solid #e3bdb4}
  .cnt.hitw{background:#fbf3e2;color:#7a5a16;border:1px solid #e6d3a8}
  .card .ds{font-size:12.5px;color:var(--text2);margin-top:7px;line-height:1.55}
  .card .fx{font-size:12px;color:var(--accent2);font-weight:700;margin-top:5px}
  .samps{margin-top:10px;border-top:1px dashed var(--border2);padding-top:9px;display:flex;flex-direction:column;gap:4px}
  .samp{font-size:12px;font-family:var(--mono);color:var(--text2);display:flex;gap:9px}
  .samp .es{font-weight:800;color:var(--accent);min-width:74px}
  .more{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  /* 묶음 그룹코드 조회 */
  .gsec{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 16px;margin-bottom:18px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .gsec .desc{font-size:12px;color:var(--text2);margin:2px 0 10px;line-height:1.55}
  .gtbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:7px}
  .gtbl th{background:var(--surface3);color:var(--text2);font-size:11px;font-weight:800;padding:5px 7px;border:1px solid var(--border);white-space:nowrap}
  .gtbl td{padding:5px 7px;border:1px solid var(--border);white-space:nowrap}
  .gtbl td.mono{font-family:var(--mono)}
  .gtbl tr.rep td{background:var(--accentSoft)}
  .gtbl td.uni{font-weight:800;color:var(--accent)}
  .gtbl td.orig{color:var(--muted)}
  .ghd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px}
  .ghd .gk{font-size:12px;font-family:var(--mono);color:var(--muted)}
  .ghd .gn{font-size:13.5px;font-weight:800;color:var(--text)}
  .gwarn{display:inline-block;background:#fbf3e2;color:#7a5a16;border:1px solid #e6d3a8;border-radius:5px;padding:1px 8px;font-size:11px;font-weight:800}
  .gerr{display:inline-block;background:#f7e6e2;color:var(--err);border:1px solid #e3bdb4;border-radius:5px;padding:1px 8px;font-size:11px;font-weight:800}
  .gok{display:inline-block;background:var(--accentSoft);color:var(--ok);border:1px solid #b4cda0;border-radius:5px;padding:1px 8px;font-size:11px;font-weight:800}
  .gsum{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
</style>
<link rel="stylesheet" href="../assets/saizen-ops.css?v=15.40">
</head>

<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム">
    <img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen">
  </a>
  <span class="step" id="t-step">データ検収 · マスター</span>
  <a class="navhome" href="../index.html" style="margin-left:14px" id="t-home">← ホーム</a>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">

  <button class="btn sm" id="btn-connect" type="button">接続</button>
  <span class="hint" id="t-connhint">ログイン後、マスター(admin)のみ利用できます。</span>
</div>

<div class="wrap">
  <div class="gsec">
    <div class="bar" style="margin-bottom:4px">
      <h2 id="t-gtitle">グループ照会</h2>
      <input class="inp" id="gq-q" type="text" style="width:250px" placeholder="…" autocomplete="off">
      <button class="btn sm" id="btn-gq" type="button" disabled>照会</button>
      <button class="btn sm" id="btn-gall" type="button" disabled>全体</button>
      <span class="meta" id="gq-meta"></span>
    </div>
    <div class="desc" id="t-gdesc"></div>
    <div id="gq-res"></div>
  </div>
  <div class="bar">
    <h2 id="t-title">データ検収</h2>
    <button class="btn" id="btn-run" type="button" disabled>再検収</button>
    <span class="meta" id="run-meta"></span>
  </div>
  <div id="result"><div class="deny" id="t-empty" style="color:var(--muted)">接続後、[再検収]で実行します。</div></div>
</div>

<div id="toast"></div>

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; const v=(k in d)?d[k]:(L.ja[k]); return v==null?k:v; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg,cls){const t=document.createElement('div');t.className='toast'+(cls?' '+cls:'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,cls){const e=$('#conn-state');e.textContent=t;e.className='pill'+(cls?' '+cls:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}

// 정적 텍스트(로컬 전용 키 → id="t-", data-i18n 사용 안 함) 채우기
function applyStatic(){
  $('#t-step').textContent=tx('step');
  $('#t-home').textContent=tx('home');
  $('#t-title').textContent=tx('title');
  $('#t-connhint').textContent=tx('connHint');
  const em=$('#t-empty'); if(em) em.textContent=tx('emptyHint');
  $('#btn-run').textContent=tx('runBtn');
  const bc=$('#btn-connect'); if(bc && !supa) bc.textContent=tx('connect');
  $('#t-gtitle').textContent=tx('gTitle');
  $('#t-gdesc').textContent=tx('gDesc');
  $('#gq-q').placeholder=tx('gPh');
  $('#btn-gq').textContent=tx('gBtn');
  $('#btn-gall').textContent=tx('gAll');
}
window.onSaizenLangChange=function(){ applyStatic(); if(RESULT) render(); if(GQLAST) groupQuery(GQLAST.all); };

async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.textContent=tx('connecting'); btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect'); btn.disabled=false;
      $('#result').innerHTML='<div class="deny">'+esc(tx('needConnLogin'))+'<small>'+esc(tx('needConnLoginSub'))+'</small></div>'; return; }
    const {data:acc,error}=await supa.rpc('me_access');
    if(error) throw error;
    myRole=(acc&&acc[0]&&acc[0].role)||'staff';
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn'); btn.classList.add('connected'); btn.disabled=false;
    if(myRole!=='admin'){
      $('#btn-run').disabled=true;
      $('#result').innerHTML='<div class="deny">'+esc(tx('adminOnly'))+'<small>'+esc(tx('currentRole'))+esc(myRole)+esc(tx('noAccess'))+'</small></div>';
      return;
    }
    $('#btn-run').disabled=false;
    $('#btn-gq').disabled=false; $('#btn-gall').disabled=false;
    await runAudit();
  }catch(e){
    setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn'); btn.disabled=false; supa=null;
    toast(tx('connFail')+': '+e.message+tx('connFailHint'),'err');
  }
}

async function runAudit(){
  if(!supa) return;
  const btn=$('#btn-run'); btn.disabled=true; btn.textContent=tx('running');
  try{
    const {data,error}=await supa.rpc('data_audit');
    if(error) throw error;
    RESULT=Array.isArray(data)?data:[];
    const now=new Date();
    const stamp=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    $('#run-meta').textContent=tx('ranAt')(stamp);
    render();
  }catch(e){ toast(tx('connFail')+': '+e.message,'err'); }
  finally{ btn.disabled=(myRole!=='admin'); btn.textContent=tx('runBtn'); }
}

// ════════════════════════════════════════════════════════════════════════
//  묶음 그룹코드 조회 — 手配書·航空カバー가 인쇄하는 통일코드·순번을 그대로 재현.
//   ⚠ 두 화면은 로드 범위가 다르다(手配書=날짜범위 / 航空カバー=한 달).
//      여기서는 print_overrides 를 통째로 읽어 '그룹 전원' 기준으로 계산하므로
//      어느 화면이 무엇을 출력해야 맞는지의 기준값이 된다.
// ════════════════════════════════════════════════════════════════════════
let GRPS=null;   // key → {key, teams:[…], base, rep, ordered:[…], cross, noRep, manual}
let GQLAST=null; // 마지막 조회(언어 전환 시 재렌더용)

async function ensureGroups(){
  if(GRPS) return GRPS;
  // 1) 묶음이 지정된 print_overrides 전부(달 무관)
  let rows=[], pg=0;
  while(true){
    const {data,error}=await supa.from('print_overrides')
      .select('event_seq,team_group,team_group_rep,team_group_seq')
      .not('team_group','is',null).order('event_seq').range(pg,pg+999);
    if(error) throw error;
    rows=rows.concat(data||[]);
    if(!data||data.length<1000) break; pg+=1000;
  }
  // 2) 관련 팀 기본정보(기준코드·입국일·인원·대표자)
  const seqs=[...new Set(rows.map(r=>r.event_seq))];
  const info={};
  for(let i=0;i<seqs.length;i+=200){
    const ch=seqs.slice(i,i+200);
    const {data:g}=await supa.from('guests')
      .select('event_seq,group_code,pax,bookings!inner(dep_date,pax,rep_name,session_ym)').in('event_seq',ch);
    (g||[]).forEach(x=>{ const b=x.bookings||{};
      info[x.event_seq]={ dep:b.dep_date||'', pax:x.pax||b.pax||0, name:b.rep_name||'', ym:b.session_ym||'', tag:x.group_code||'' }; });
    const {data:m}=await supa.from('guest_members')
      .select('event_seq,person_tag,seq_in_team').in('event_seq',ch).order('seq_in_team');
    (m||[]).forEach(x=>{ const e=info[x.event_seq]; if(e&&!e.ptag&&x.person_tag) e.ptag=x.person_tag; });
  }
  const strip=t=>(window.SZCore&&SZCore.tagStripSeq)?SZCore.tagStripSeq(t||''):(t||'');
  // 3) 그룹별 계산 — 手配書/航空カバー와 동일 규칙(수동 순번 전원 지정 시 우선, 아니면 orderGroup)
  const map={};
  rows.forEach(r=>{
    const e=info[r.event_seq]||{};
    (map[r.team_group]=map[r.team_group]||[]).push({
      seq:String(r.event_seq), rep:!!r.team_group_rep,
      gseq:(r.team_group_seq==null?null:r.team_group_seq),
      dep:e.dep||'', pax:e.pax||0, name:e.name||'', ym:e.ym||'',
      tag:strip(e.ptag||e.tag||'')
    });
  });
  GRPS={};
  Object.keys(map).forEach(k=>{
    // ⚠ 묶음 이름이 태그코드라 코드 재사용 시 다른 시기 묶음이 합쳐진다(대표가 2명 이상).
    //   手配書·航空カバー·네임택과 같은 규칙(SZCore.clusterOf)으로 갈라 보여준다.
    const parts=(window.SZCore&&SZCore.splitByReps)
      ? SZCore.splitByReps(map[k].map(x=>({...x,event_seq:x.seq}))) : [map[k]];
    parts.forEach((teams,pi)=>{
    const key=parts.length>1?(k+' ('+(pi+1)+'/'+parts.length+')'):k;
    if(teams.length<2) return;                       // 혼자 남은 묶음 = 단독 취급
    const rep=teams.find(x=>x.rep)||null;
    const base=rep?rep.tag:'';
    const manual=teams.every(x=>x.gseq!=null);
    const ordered=manual
      ? teams.slice().sort((a,b)=>(a.gseq-b.gseq)||(Number(a.seq)-Number(b.seq)))
      : (rep&&window.SZCore&&SZCore.orderGroup
          ? SZCore.orderGroup(teams.map(x=>({event_seq:x.seq,dep:x.dep})), rep.seq)
              .map(o=>teams.find(x=>x.seq===String(o.event_seq))).filter(Boolean)
          : teams.slice());
    const yms=[...new Set(teams.map(x=>x.ym).filter(Boolean))];
    GRPS[key]={ key, teams, rep, base, manual, ordered,
      split:parts.length>1,
      cross:yms.length>1, noRep:!rep, noBase:!!rep&&!base };
    });
  });
  return GRPS;
}

function uniTag(g,i){
  if(!g.base||!window.SZCore||!SZCore.teamTagN) return '';
  return SZCore.teamTagN(g.base,i+1);
}
function grpTable(g){
  const th=['thNo','thSeq','thRep','thOrig','thUni','thDep','thPax','thYm']
    .map(k=>`<th>${esc(tx(k))}</th>`).join('');
  const body=g.ordered.map((t,i)=>{
    const uni=uniTag(g,i);
    return `<tr class="${t.rep?'rep':''}">
      <td class="mono">${i+1}</td>
      <td class="mono">${esc(t.seq)}</td>
      <td>${esc(t.name||'-')}${t.rep?` <span class="gok">${esc(tx('gRepMark'))}</span>`:''}</td>
      <td class="mono orig">${esc(t.tag||'-')}</td>
      <td class="mono uni">${esc(uni||t.tag||'-')}</td>
      <td class="mono">${esc(t.dep||'-')}</td>
      <td class="mono">${esc(t.pax||0)}</td>
      <td class="mono">${esc(t.ym||'-')}</td>
    </tr>`;
  }).join('');
  const flags=[
    g.cross?`<span class="gwarn">${esc(tx('gCross'))}</span>`:'',
    g.noRep?`<span class="gerr">${esc(tx('gNoRep'))}</span>`:'',
    g.noBase?`<span class="gerr">${esc(tx('gNoBase'))}</span>`:'',
    g.manual?`<span class="gok">${esc(tx('gManual'))}</span>`:'',
    g.split?`<span class="gwarn">${esc(tx('gSplit'))}</span>`:''
  ].filter(Boolean).join(' ');
  return `<div class="ghd"><span class="gn">${esc(g.base||'—')}</span>
      <span class="gk">${esc(g.key)}</span>${flags}</div>
    <table class="gtbl"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}

async function groupQuery(all){
  if(!supa) return;
  const q=(all?'':($('#gq-q').value||'').trim().toLowerCase());
  if(!all && !q){ toast(tx('gNeedQ'),'err'); return; }
  const b1=$('#btn-gq'), b2=$('#btn-gall');
  b1.disabled=b2.disabled=true; $('#gq-meta').textContent=tx('gLoading');
  try{
    const G=await ensureGroups();
    GQLAST={all:!!all};
    const keys=Object.keys(G);
    const tot=keys.reduce((n,k)=>n+G[k].teams.length,0);
    let hits;
    if(all){ hits=keys; }
    else{
      hits=keys.filter(k=>{
        const g=G[k];
        if(String(k).toLowerCase().includes(q)) return true;
        if((g.base||'').toLowerCase().includes(q)) return true;
        return g.ordered.some((t,i)=>
          String(t.seq).includes(q) ||
          (t.tag||'').toLowerCase().includes(q) ||
          (t.name||'').toLowerCase().includes(q) ||
          (uniTag(g,i)||'').toLowerCase().includes(q));
      });
    }
    const cross=hits.filter(k=>G[k].cross).length;
    const norep=hits.filter(k=>G[k].noRep||G[k].noBase).length;
    $('#gq-meta').textContent=tx('gLoaded')(keys.length,tot);
    if(!hits.length){ $('#gq-res').innerHTML=`<div class="desc">${esc(tx('gNone'))}</div>`; return; }
    // 월경계·대표미지정을 먼저(확인이 필요한 것부터)
    hits.sort((a,b)=>{
      const sa=(G[a].noRep||G[a].noBase?2:0)+(G[a].cross?1:0);
      const sb=(G[b].noRep||G[b].noBase?2:0)+(G[b].cross?1:0);
      return sb-sa || String(G[a].base||'').localeCompare(String(G[b].base||''));
    });
    const sum=`<div class="gsum">
      <span class="gok">${esc(tx(all?'gSumG':'gHitN')(hits.length))}</span>
      ${cross?`<span class="gwarn">${esc(tx('gSumCross')(cross))}</span>`:''}
      ${norep?`<span class="gerr">${esc(tx('gSumNoRep')(norep))}</span>`:''}
      ${(all&&!cross&&!norep)?`<span class="gok">${esc(tx('gOkAll'))}</span>`:''}
    </div>`;
    const notes=[
      cross?`<div class="desc" style="margin-top:8px">${esc(tx('gCrossNote'))}</div>`:'',
      norep?`<div class="desc" style="margin-top:2px">${esc(tx('gNoRepNote'))}</div>`:''
    ].join('');
    $('#gq-res').innerHTML=sum+notes+hits.slice(0,60).map(k=>grpTable(G[k])).join('')
      +(hits.length>60?`<div class="more">${esc(tx('moreN')(hits.length-60))}</div>`:'');
  }catch(e){ $('#gq-meta').textContent=''; toast(tx('connFail')+': '+e.message,'err'); }
  finally{ b1.disabled=b2.disabled=false; }
}

function render(){
  if(!RESULT){ return; }
  const box=$('#result');
  // RPC가 준 순서를 우선, 없으면 CHECKS 순
  const byKey={}; RESULT.forEach(r=>byKey[r.key]=r);
  const order=RESULT.map(r=>r.key);
  CHECKS.forEach(k=>{ if(!order.includes(k)) order.push(k); });
  const total=RESULT.reduce((s,r)=>s+(+r.count||0),0);
  let head;
  if(total===0){ head=`<div class="allok">${esc(tx('allClear'))}</div>`; }
  else{ head=`<div class="bar" style="margin-bottom:12px"><span class="pill err">${esc(tx('issuesN')(total))}</span></div>`; }
  const cards=order.map(k=>{
    const r=byKey[k]; if(!r) return '';
    const n=+r.count||0;
    const sev=r.sev||'warn';
    const cls=n===0?'ok':(sev==='error'?'err':'warn');
    const cntCls=n===0?'zero':(sev==='error'?'hit':'hitw');
    const cntTxt=n===0?tx('okNone'):`${n} ${sev==='error'?tx('rowsUnit'):tx('teamsUnit')}`;
    let samps='';
    if(n>0 && Array.isArray(r.samples) && r.samples.length){
      const rows=r.samples.map(s=>`<div class="samp"><span class="es">#${esc(s.event_seq)}</span><span>${esc(s.detail||'')}</span></div>`).join('');
      const more=(n>r.samples.length)?`<div class="more">${esc(tx('moreN')(n-r.samples.length))}</div>`:'';
      samps=`<div class="samps">${rows}${more}</div>`;
    }
    const body=n>0?`<div class="ds">${tx('d_'+k)}</div><div class="fx">${tx('f_'+k)}</div>${samps}`:'';
    return `<div class="card ${cls}">
      <div class="hd"><span class="nm">${esc(tx('n_'+k))}</span><span class="cnt ${cntCls}">${esc(cntTxt)}</span></div>
      ${body}
    </div>`;
  }).join('');
  box.innerHTML=head+cards;
}

document.addEventListener('DOMContentLoaded',()=>{
  applyStatic(); loadCreds();
  $('#btn-connect').addEventListener('click',connect);
  $('#btn-run').addEventListener('click',runAudit);
  $('#btn-gq').addEventListener('click',()=>groupQuery(false));
  $('#btn-gall').addEventListener('click',()=>groupQuery(true));
  $('#gq-q').addEventListener('keydown',e=>{ if(e.key==='Enter') groupQuery(false); });
  // 접속정보 내장 자동연결(saizen-ops가 채워둠) — 값 있으면 자동 접속
  if(($('#sb-url').value||'').trim() && ($('#sb-key').value||'').trim()){ connect(); }
});
