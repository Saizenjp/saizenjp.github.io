<!DOCTYPE html>
<html lang="ja">
<!-- ============================================================================
  객실 청소 배정표 (housekeeping.html)
  ----------------------------------------------------------------------------
  Min 2026-08: 방배정은 프론트 사무실이 하고, 객실 청소팀은 *수정 권한 없이*
  배정된 결과 + 체크인·체크아웃·체류 기간을 태블릿으로 본다. 읽기 전용.

  실제 호텔 하우스키핑 시스템의 표준을 그대로 따랐다.
   · 하루 단위 · 층(섹션) 단위 워크시트 — 청소팀은 층을 맡아 움직인다.
   · 방 상태 5종: 턴오버(퇴실+당일입실) · 퇴실 · 연박 · 입실 · 공실 (+ 폐쇄)
   · 정렬 = 우선순위: 턴오버 → 퇴실 → 연박 → 입실 → 공실
     (당일 입실이 걸린 방을 먼저 비워야 체크인 시각을 못 지키는 사고가 없다)
   · 층 머리에 층별 요약(청소 실수). ※소요시간·필요 인원 추정은 두지 않는다(Min 2026-08).
   · 시트 교체 = 연박 N박째마다(LINEN_EVERY).
  여기에 우리만 가능한 것 하나:
   · 그날 라운딩 티오프 시각을 같이 띄운다. 연박 방은 팀이 나간 뒤라야 들어가므로
     티오프가 이른 방부터 청소하면 대기가 없다. (연박은 티오프 빠른 순 정렬)
============================================================================ -->

<style>
  /* ── 공통 chrome (전 ops 페이지 공유 정본) ── */
  :root{

    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);
    padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.xs{font-size:12px;padding:3px 9px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 — 태블릿 기준으로 글자·터치 여백을 키운다 ── */
  main{padding:16px 20px 70px;max-width:1500px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:4px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .lbl{font-size:12px;font-weight:800;color:var(--text2);margin-right:2px}
  .chip.off{background:var(--surface3);border:1px dashed var(--border2);color:var(--muted);cursor:default;font-weight:600}
  .chip{font-size:13px;font-weight:700;padding:6px 13px;border-radius:99px;background:var(--surface3);
    color:var(--text2);border:1px solid var(--border);cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:38px 20px;text-align:center;color:var(--muted);font-size:14px;font-weight:700}
  .dnav{display:flex;align-items:center;gap:7px}
  .dnav .inp{font-size:15px;font-weight:800;padding:8px 12px}
  .dwd{font-size:13px;font-weight:800;color:var(--text2)}
  .dwd.sat{color:#2b5f9e} .dwd.sun{color:var(--err)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:9px}
  .kpi{border:1px solid var(--border2);border-radius:10px;padding:9px 12px;background:var(--surface2)}
  .kpi .k{font-size:11px;font-weight:800;color:var(--text2)}
  .kpi .v{font-size:26px;font-weight:800;font-family:var(--mono);line-height:1.15}
  .kpi .u{font-size:11px;font-weight:700;color:var(--muted);margin-left:3px}
  .kpi.turn{background:#fbeeeb;border-color:#e3bdb4} .kpi.turn .v{color:var(--err)}
  .kpi.out{background:#fdf3e3;border-color:#e6cf9e} .kpi.out .v{color:#8a6410}
  .kpi.stay{background:#eef3fa;border-color:#c2d3ea} .kpi.stay .v{color:#2b5f9e}
  .kpi.inn{background:var(--accentSoft);border-color:#b4cda0} .kpi.inn .v{color:var(--ok)}
  .kpi.work{background:var(--surface);border-color:var(--accent);border-width:2px}

  /* 층 섹션 */
  .flr{margin-bottom:16px;border:1px solid var(--border2);border-radius:11px;overflow:hidden;background:var(--surface)}

  .flr-h .fst{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;font-size:12px;font-weight:700}
  .flr-h .fst b{font-family:var(--mono)}
  .flr-h .car{color:var(--muted);width:14px;display:inline-block}
  .hkt{width:100%;border-collapse:collapse}
  .hkt th{background:var(--surface2);border-bottom:1px solid var(--border2);padding:6px 10px;text-align:left;
    font-size:10.5px;font-weight:800;letter-spacing:.03em;color:var(--text2);white-space:nowrap}
  .hkt td{border-bottom:1px solid var(--border);padding:7px 10px;font-size:13.5px;vertical-align:middle}
  .hkt tr:last-child td{border-bottom:none}
  .hkt tr.r-turn td{background:#fdf1ee} .hkt tr.r-out td{background:#fdf8ee}
  .hkt tr.r-vacant td{color:var(--muted)} .hkt tr.r-ooo td{background:#f1f2f4;color:var(--muted)}
  .hkt td.c-no{font-weight:800;font-size:16px;font-family:var(--mono);white-space:nowrap;border-left:5px solid transparent}
  .hkt tr.r-turn td.c-no{border-left-color:var(--err)}
  .hkt tr.r-out  td.c-no{border-left-color:#d99a2b}
  .hkt tr.r-stay td.c-no{border-left-color:#2b5f9e}
  .hkt tr.r-in   td.c-no{border-left-color:var(--ok)}
  .hkt td.c-ty{font-size:11.5px;color:var(--text2);white-space:nowrap}
  .hkt td.c-pax,.hkt td.c-nth{font-family:var(--mono);white-space:nowrap;text-align:center}
  .hkt td.c-stay{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .hkt td.c-tee{font-family:var(--mono);font-weight:800;white-space:nowrap}
  .st{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 9px;white-space:nowrap;color:#fff}
  .st.turn{background:var(--err)} .st.out{background:#c8891f} .st.stay{background:#2b5f9e}
  .st.in{background:var(--ok)} .st.vacant{background:#aeb4bd} .st.ooo{background:#4b5563}
  .tline{display:block;font-size:12.5px;white-space:nowrap}
  .tline .ar{font-size:10.5px;font-weight:800;color:var(--muted);margin-right:4px}
  .tag{font-family:var(--mono);font-weight:800;color:var(--accent2);margin-right:5px}
  .note{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;margin:1px 4px 1px 0;

  .rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
  .rc{border:1px solid var(--border2);border-radius:11px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .rc-h{display:flex;align-items:center;gap:8px;padding:7px 11px;color:#fff}
  .rc-h .no{font-family:var(--mono);font-size:22px;font-weight:800;line-height:1.1}
  .rc-h .st2{font-size:11.5px;font-weight:800;margin-left:auto;white-space:nowrap;opacity:.95}
  .rc.s-turn .rc-h{background:#b13b2c} .rc.s-out .rc-h{background:#c8891f}
  .rc.s-stay .rc-h{background:#2b5f9e} .rc.s-in .rc-h{background:#2f7d4f}
  .rc.s-vacant .rc-h{background:#aeb4bd} .rc.s-ooo .rc-h{background:#4b5563}
  .rc-ty{font-size:11px;font-weight:700;opacity:.9}
  .rc-b{padding:8px 11px 10px}
  .rc-team{font-size:13px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc-team i{font-size:10px;font-weight:800;color:var(--muted);font-style:normal;margin-right:4px}
  .rc-meta{font-size:12px;color:var(--text2);font-family:var(--mono);margin-top:4px}
  .rc-tee{font-weight:800;color:var(--text)}
  .rc-notes{margin-top:5px}
  .rc.s-vacant .rc-b{min-height:34px;color:var(--muted);font-size:12px}
  .zchips{display:flex;gap:6px;flex-wrap:wrap}
  .zchip{font-size:14px;font-weight:800;padding:7px 15px;border-radius:9px;border:1px solid var(--border2);
    background:var(--surface);color:var(--text2);cursor:pointer;user-select:none}
  .zchip:hover{border-color:var(--accent)}
  .zchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .zchip .zn{font-size:10.5px;font-weight:700;opacity:.8;margin-left:6px}
  .lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);font-weight:700;margin-top:9px;align-items:center}

  @media print{
    @page{size:A4 portrait;margin:9mm}
    .topbar,.conn,.noprint,#toast,.so-footer,.so-totop{display:none!important}
    body{background:#fff}
    main{max-width:none;padding:0}
    .panel{border:none;box-shadow:none;padding:0;margin:0 0 6mm}
    .flr{page-break-inside:auto;break-inside:auto;border:1px solid #999}
    .flr-h{background:#ececec!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .hkt td,.hkt th{font-size:11pt}
    .st,.note,.kpi{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .flr+.flr{page-break-before:always}
  }

async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.textContent=tx('connecting');
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect'); btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+esc(tx('loginTitle'))+'<br><small>'+esc(tx('loginSub'))+'</small></div></div>'; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn'); btn.classList.add('connected'); btn.disabled=false;
    renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn'); btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

async function paged(qf){
  const out=[]; let from=0;
  for(;;){ const {data,error}=await qf(from,from+999); if(error) return {error};
    out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return {data:out};
}
async function pagedIn(table,cols,col,vals){
  const out=[];
  for(let i=0;i<vals.length;i+=200){
    const ch=vals.slice(i,i+200);
    const r=await paged((a,b)=>supa.from(table).select(cols).in(col,ch).order(col).range(a,b));
    if(r.error) return r; out.push(...r.data);
  }
  return {data:out};
}

async function load(){
  if(!supa) return;
  const st=$('#stat'); if(st) st.textContent=tx('loading');
  renderWd();
  try{
    const D=DATE, Dn=shiftDate(D,1);
    // 1) 객실 마스터
    const iv=await paged((a,b)=>supa.from('room_inventory')
      .select('id,facility,zone,room_no,room_type,capacity,max_capacity,active,note').order('id').range(a,b));
    if(iv.error) throw iv.error;
    INV=iv.data||[];
    const invMap={}; INV.forEach(i=>{ invMap[i.id]=i; });

    // 2) 그날에 걸치는 배정 — 그날 밤 체류(check_in<=D<check_out) + 그날 퇴실(check_out=D)
    const rm=await paged((a,b)=>supa.from('rooms')
      .select('event_seq,member_id,inventory_id,room_no,check_in,check_out')
      .lte('check_in',D).gte('check_out',D).order('event_seq').range(a,b));
    if(rm.error) throw rm.error;
    ROWS=(rm.data||[]).filter(r=>invMap[r.inventory_id]);

    // 3) 팀 정보(그룹코드·대표·전체 체류)
    const seqs=[...new Set(ROWS.map(r=>r.event_seq))];
    TEAM={};
    if(seqs.length){
      const gs=await pagedIn('guests','event_seq,group_code,team_tag,accom','event_seq',seqs);
      if(gs.error) throw gs.error;
      (gs.data||[]).forEach(g=>{ TEAM[g.event_seq]={tag:g.team_tag||g.group_code||'', accom:g.accom||'', rep:'', dep:'', arr:''}; });
      const bs=await pagedIn('bookings','event_seq,rep_name,dep_date,arr_date','event_seq',seqs);
      if(bs.error) throw bs.error;
      (bs.data||[]).forEach(b=>{ const t=(TEAM[b.event_seq]=TEAM[b.event_seq]||{tag:'',accom:''});
        t.rep=b.rep_name||''; t.dep=b.dep_date||''; t.arr=b.arr_date||''; });
    }

    // 4) 그날 폐쇄된 방
    const cl=await supa.from('room_closures').select('inventory_id,from_date,to_date,reason')
      .lte('from_date',D).gte('to_date',D);
    CLO=cl.error?[]:(cl.data||[]);

    // 5) 그날 라운딩 티오프 — 연박 방은 팀이 나간 뒤라야 청소할 수 있다
    TEE={};
    const gg=await supa.from('golf_groups').select('event_seq,tee_time,course_code').eq('play_date',D);
    if(!gg.error){
      (gg.data||[]).forEach(g=>{
        if(g.event_seq==null||!g.tee_time) return;
        const cur=TEE[g.event_seq];
        if(!cur||String(g.tee_time)<cur.time) TEE[g.event_seq]={time:String(g.tee_time).slice(0,5), course:g.course_code||''};
      });
    }
    if(!Object.keys(COURSE).length){
      const gc=await supa.from('golf_courses').select('code,name_ja,name_ko');
      if(!gc.error) (gc.data||[]).forEach(c=>{ COURSE[c.code]=c; });
    }
    renderAccomChips();
    render();
  }catch(e){ if(st) st.textContent=tx('loadFail'); toast(tx('loadFail')+': '+String(e&&e.message||e),'err'); }
}

function courseL(code){ const c=COURSE[code]; if(!c) return ''; return lang()==='ko'?(c.name_ko||''):(c.name_ja||''); }

// ── 방 1개 → 그날의 상태 레코드 ──
function roomRecord(inv){
  const D=DATE;
  const mine=ROWS.filter(r=>r.inventory_id===inv.id);
  const night=mine.filter(r=>r.check_in<=D && D<r.check_out);        // 그날 밤 묵는 사람
  const outs =mine.filter(r=>r.check_out===D);                        // 그날 퇴실
  const ins  =night.filter(r=>r.check_in===D);                        // 그날 입실
  const stays=night.filter(r=>r.check_in<D);                          // 연박
  const clo=CLO.find(c=>c.inventory_id===inv.id);
  let status;
  if(clo || inv.active===false) status='ooo';
  else if(outs.length && ins.length) status='turn';
  else if(outs.length) status='out';
  else if(stays.length) status='stay';
  else if(ins.length) status='in';
  else status='vacant';

  const grp=list=>{
    const g={};
    list.forEach(r=>{ const t=TEAM[r.event_seq]||{};
      const k=r.event_seq;
      if(!g[k]) g[k]={seq:k, tag:t.tag||'', rep:t.rep||'', pax:0, ci:r.check_in, co:r.check_out};
      g[k].pax++;
      if(r.check_in<g[k].ci) g[k].ci=r.check_in;
      if(r.check_out>g[k].co) g[k].co=r.check_out;
    });
    return Object.values(g);
  };
  const gOut=grp(outs), gStay=grp(stays), gIn=grp(ins);

  // 연박 = 몇 박째인지(그날 아침 기준 = 이미 묵은 밤 수) · 마지막 밤이면 표시
  let nth=0, total=0, lastNight=false;
  const base=gStay[0]||gIn[0]||gOut[0];
  if(base){
    total=Math.max(1,dayDiff(base.ci,base.co));
    nth=Math.max(0,dayDiff(base.ci,D));
    lastNight=(status==='stay'||status==='in') && shiftDate(D,1)===base.co;
  }
  // 티오프 = 그날 이 방에 남아 있는 팀(연박) 기준 — 나간 뒤 청소
  const teeSeq=(gStay[0]||gIn[0]||{}).seq;
  const tee=teeSeq!=null?TEE[teeSeq]:null;

  const paxNight=night.length, paxOut=outs.length;
  const linen = status==='stay' && nth>0 && nth%LINEN_EVERY===0;

  return {inv, status, gOut, gStay, gIn, paxNight, paxOut, nth, total, lastNight, tee, clo, linen};
}

function stLabel(s){ return {turn:tx('sTurn'),out:tx('sOut'),stay:tx('sStay'),in:tx('sIn'),vacant:tx('sVacant'),ooo:tx('sOoo')}[s]; }

function render(){
  const box=$('#floors'); if(!box) return;
  const invs=INV.filter(invInScope);
  const recs=invs.map(roomRecord);
  renderKpis(recs);
  const st=$('#stat'); if(st) st.textContent=tx('statN')(md(DATE),recs.length);
  if(!recs.length){ box.innerHTML=`<div class="panel"><div class="deny">${esc(tx('noRooms'))}</div></div>`; return; }

  // 층(zone) 단위 — 청소팀은 층을 맡아 움직인다
  const groups={};
  recs.forEach(r=>{ const k=(r.inv.facility||'')+'|'+(r.inv.zone||r.inv.facility||'');
    (groups[k]=groups[k]||{fac:r.inv.facility||'', zone:r.inv.zone||r.inv.facility||'', list:[]}).list.push(r); });
  const keys=Object.keys(groups).sort((a,b)=>{
    const A=groups[a], B=groups[b];
    const fi=accomIdx(A.fac)-accomIdx(B.fac); if(fi) return fi;
    const fa=String(A.zone).match(/^(\d+)층$/), fb=String(B.zone).match(/^(\d+)층$/);
    if(fa&&fb) return (+fa[1])-(+fb[1]);
    if(fa) return -1; if(fb) return 1;
    return String(A.zone).localeCompare(String(B.zone));
  });
  if(ZONE && !groups[ZONE]) ZONE=null;              // 필터가 바뀌어 사라진 층 → 전체로
  renderZoneChips(groups,keys);
  const show = ZONE ? [ZONE] : keys;
  box.innerHTML=show.map(k=>floorHtml(groups[k],k)).join('');
}

function renderKpis(recs){
  const box=$('#kpis'); if(!box) return;
  const c={turn:0,out:0,stay:0,in:0,vacant:0,ooo:0};
  recs.forEach(r=>{ c[r.status]++; });
  const kpi=(cls,k,v,u)=>`<div class="kpi ${cls}"><div class="k">${esc(k)}</div><div class="v">${v}<span class="u">${esc(u||'')}</span></div></div>`;
  box.innerHTML=
     kpi('turn',tx('kTurn'),c.turn,tx('roomsU'))
    +kpi('out', tx('kOut'), c.out, tx('roomsU'))
    +kpi('stay',tx('kStay'),c.stay,tx('roomsU'))
    +kpi('inn', tx('kIn'),  c.in,  tx('roomsU'))
    +kpi('',    tx('kVacant'),c.vacant,tx('roomsU'))
    +(c.ooo?kpi('',tx('kOoo'),c.ooo,tx('roomsU')):'');
}

function floorHtml(g,key){
  const clean=g.list.filter(r=>r.status!=='ooo'&&r.status!=='vacant').length;
  const c={turn:0,out:0,stay:0,in:0};
  g.list.forEach(r=>{ if(c[r.status]!==undefined) c[r.status]++; });
  const list=g.list.slice().sort((a,b)=>{
    if(SORT==='no') return String(a.inv.room_no).localeCompare(String(b.inv.room_no),undefined,{numeric:true});
    const p=PRIO[a.status]-PRIO[b.status]; if(p) return p;
    // 연박은 티오프 빠른 순 — 팀이 먼저 나가는 방부터 들어간다
    if(a.status==='stay'){
      const ta=(a.tee&&a.tee.time)||'99:99', tb=(b.tee&&b.tee.time)||'99:99';
      if(ta!==tb) return ta<tb?-1:1;
    }
    return String(a.inv.room_no).localeCompare(String(b.inv.room_no),undefined,{numeric:true});
  });
  const badge=(cls,lab,n)=>n?`<span class="st ${cls}" style="font-size:10.5px;padding:2px 7px">${esc(lab)} ${n}</span>`:'';
  return `<div class="flr">
    <div class="flr-h">
      <span>${esc(g.zone)}</span><span class="fac">${esc(accomL(g.fac))}</span>
      <span class="fst">
        ${badge('turn',tx('sTurn'),c.turn)}${badge('out',tx('sOut'),c.out)}
        ${badge('stay',tx('sStay'),c.stay)}${badge('in',tx('sIn'),c.in)}
        <span class="cnt">${esc(tx('floorStat')(clean))}</span>
      </span>
    </div>
    ${VIEW==='card'?`<div class="rcards" style="padding:11px">${list.map(cardHtml).join('')}</div>`:`<table class="hkt">
      <thead><tr>
        <th>${tx('thState')}</th><th>${tx('thRoom')}</th><th>${tx('thType')}</th>
        <th style="text-align:center">${tx('thPax')}</th><th>${tx('thTeam')}</th>
        <th>${tx('thStay')}</th><th style="text-align:center">${tx('thNth')}</th>
        <th>${tx('thTee')}</th><th>${tx('thNote')}</th>
      </tr></thead>
      <tbody>${list.map(rowHtml).join('')}</tbody></table>`}
  </div>`;
}

// 카드 한 장 = 객실 하나. 상태색을 머리줄로 크게 잡아 멀리서도 구분되게.
function cardHtml(r){
  const line=(lab,arr)=>arr.map(t=>`<div class="rc-team"><i>${esc(lab)}</i><span class="tag">${esc(t.tag)}</span>${esc(t.rep)} (${t.pax})</div>`).join('');
  const base=r.gStay[0]||r.gIn[0]||r.gOut[0];
  const notes=[];
  if(r.linen) notes.push(`<span class="note linen">${esc(tx('linen'))}</span>`);
  if(r.status==='turn'||r.status==='in'){ const n=r.gIn.reduce((s,t)=>s+t.pax,0);
    if(n) notes.push(`<span class="note next">${esc(tx('nextIn')(n))}</span>`); }
  if(r.lastNight) notes.push(`<span class="note">${esc(tx('lastNight'))}</span>`);
  if(r.clo) notes.push(`<span class="note clo">${esc(tx('closed')(md(r.clo.from_date),md(r.clo.to_date),r.clo.reason||''))}</span>`);
  if(r.inv.note) notes.push(`<span class="note">${esc(r.inv.note)}</span>`);
  const teams=line(tx('arOut'),r.gOut)+line(tx('arStay'),r.gStay)+line(tx('arIn'),r.gIn);
  const nth=(r.status==='stay'||r.status==='in')&&r.total?` · ${tx('nthOf')(r.nth,r.total)}`:'';
  const tee=r.tee?` · <span class="rc-tee">${r.tee.time}${r.tee.course?' '+esc(courseL(r.tee.course)):''}</span>`:'';
  return `<div class="rc s-${r.status}">
    <div class="rc-h">
      <span class="no">${esc(String(r.inv.room_no).replace(/호$/,''))}</span>
      <span class="rc-ty">${esc(r.inv.room_type||'')}</span>
      <span class="st2">${esc(stLabel(r.status))}</span>
    </div>
    <div class="rc-b">
      ${teams||`<div class="rc-team" style="color:var(--muted)">—</div>`}
      ${base?`<div class="rc-meta">${md(base.ci)}~${md(base.co)}${nth}${tee}</div>`:''}
      ${notes.length?`<div class="rc-notes">${notes.join('')}</div>`:''}
    </div>
  </div>`;
}

function rowHtml(r){
  const tl=(cls,lab,arr)=>arr.map(t=>`<span class="tline"><i class="ar">${esc(lab)}</i><span class="tag">${esc(t.tag)}</span>${esc(t.rep)}<span class="cnt"> (${t.pax})</span></span>`).join('');
  const teams = tl('out',tx('arOut'),r.gOut) + tl('stay',tx('arStay'),r.gStay) + tl('in',tx('arIn'),r.gIn);
  const base=r.gStay[0]||r.gIn[0]||r.gOut[0];
  const stayTxt=base?`${md(base.ci)}~${md(base.co)}`:'';
  const nthTxt=(r.status==='stay'||r.status==='in')&&r.total?tx('nthOf')(r.nth,r.total):'';
  const tee=r.tee?`${r.tee.time}${r.tee.course?` <span class="cnt">${esc(courseL(r.tee.course))}</span>`:''}`:'';
  const notes=[];
  if(r.linen) notes.push(`<span class="note linen">${esc(tx('linen'))}</span>`);
  if(r.status==='turn'||r.status==='in'){
    const n=r.gIn.reduce((s,t)=>s+t.pax,0);
    if(n) notes.push(`<span class="note next">${esc(tx('nextIn')(n))}</span>`);
  }
  if(r.lastNight) notes.push(`<span class="note">${esc(tx('lastNight'))}</span>`);
  if(r.clo) notes.push(`<span class="note clo">${esc(tx('closed')(md(r.clo.from_date),md(r.clo.to_date),r.clo.reason||''))}</span>`);
  if(r.inv.note) notes.push(`<span class="note">${esc(r.inv.note)}</span>`);
  const pax=r.status==='out'?r.paxOut:r.paxNight;
  return `<tr class="r-${r.status}">
    <td><span class="st ${r.status==='in'?'in':r.status}">${esc(stLabel(r.status))}</span></td>
    <td class="c-no">${esc(r.inv.room_no)}</td>
    <td class="c-ty">${esc(r.inv.room_type||'')}</td>
    <td class="c-pax">${pax||''}</td>
    <td>${teams}</td>
    <td class="c-stay">${esc(stayTxt)}</td>
    <td class="c-nth">${esc(nthTxt)}</td>
    <td class="c-tee">${tee}</td>
    <td>${notes.join('')}</td>
  </tr>`;
}

function applyStatic(){
  const st=$('#t-step'); if(st) st.textContent=tx('step');
  const ch=$('#t-connhint'); if(ch) ch.textContent=tx('connHint');
  const pc=$('#t-preconn'); if(pc) pc.textContent=tx('preConn');
  const btn=$('#btn-connect');
  if(supa){ setConn(tx('connOk'),'ok'); if(btn) btn.textContent=tx('connectedBtn'); }
  else { setConn(tx('notConn'),''); if(btn) btn.textContent=tx('connect'); }
}
window.onSaizenLangChange=function(){
  applyStatic();
  if(supa && $('#floors')){ renderUI(); renderAccomChips(); render(); }
};

$('#btn-connect').addEventListener('click',connect);
applyStatic(); loadCreds();
if($('#sb-url').value && $('#sb-key').value) connect();
</script>
