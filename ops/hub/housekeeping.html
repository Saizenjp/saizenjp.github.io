<!DOCTYPE html>
<html lang="ja">
<!-- ============================================================================
  객실 청소 배정표 (housekeeping.html)
  ----------------------------------------------------------------------------
  Min 2026-08: 방배정은 프론트 사무실이 하고, 객실 청소팀은 *수정 권한 없이*
  배정된 결과 + 체크인·체크아웃·체류 기간을 태블릿으로 본다. 읽기 전용.

  실제 호텔 하우스키핑 시스템의 표준을 그대로 따랐다.
   · 하루 단위 · 층(섹션) 단위 워크시트 — 청소팀은 층을 맡아 움직인다.
   · 방 상태 5종: 턴오버(퇴실+당일입실) · 퇴실 · 연박 · 입실 · 공실 (+ 폐쇄)
   · 정렬 = 우선순위: 턴오버 → 퇴실 → 연박 → 입실 → 공실
     (당일 입실이 걸린 방을 먼저 비워야 체크인 시각을 못 지키는 사고가 없다)
   · 층 머리에 층별 요약(청소 실수). ※소요시간·필요 인원 추정은 두지 않는다(Min 2026-08).
   · 시트 교체 = 연박 N박째마다(LINEN_EVERY).
  여기에 우리만 가능한 것 하나:
   · 그날 라운딩 티오프 시각을 같이 띄운다. 연박 방은 팀이 나간 뒤라야 들어가므로
     티오프가 이른 방부터 청소하면 대기가 없다. (연박은 티오프 빠른 순 정렬)
============================================================================ -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 객실 청소</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── 공통 chrome (전 ops 페이지 공유 정본) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);
    padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.xs{font-size:12px;padding:3px 9px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 — 태블릿 기준으로 글자·터치 여백을 키운다 ── */
  main{padding:16px 20px 70px;max-width:1500px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:4px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .lbl{font-size:12px;font-weight:800;color:var(--text2);margin-right:2px}
  .chip.off{background:var(--surface3);border:1px dashed var(--border2);color:var(--muted);cursor:default;font-weight:600}
  .chip{font-size:13px;font-weight:700;padding:6px 13px;border-radius:99px;background:var(--surface3);
    color:var(--text2);border:1px solid var(--border);cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:38px 20px;text-align:center;color:var(--muted);font-size:14px;font-weight:700}
  .dnav{display:flex;align-items:center;gap:7px}
  .dnav .inp{font-size:15px;font-weight:800;padding:8px 12px}
  .dwd{font-size:13px;font-weight:800;color:var(--text2)}
  .dwd.sat{color:#2b5f9e} .dwd.sun{color:var(--err)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:9px}
  .kpi{border:1px solid var(--border2);border-radius:10px;padding:9px 12px;background:var(--surface2)}
  .kpi .k{font-size:11px;font-weight:800;color:var(--text2)}
  .kpi .v{font-size:26px;font-weight:800;font-family:var(--mono);line-height:1.15}
  .kpi .u{font-size:11px;font-weight:700;color:var(--muted);margin-left:3px}
  .kpi.turn{background:#fbeeeb;border-color:#e3bdb4} .kpi.turn .v{color:var(--err)}
  .kpi.out{background:#fdf3e3;border-color:#e6cf9e} .kpi.out .v{color:#8a6410}
  .kpi.stay{background:#eef3fa;border-color:#c2d3ea} .kpi.stay .v{color:#2b5f9e}
  .kpi.inn{background:var(--accentSoft);border-color:#b4cda0} .kpi.inn .v{color:var(--ok)}
  .kpi.pax{background:var(--surface);border-color:var(--accent2)} .kpi.pax .v{color:var(--accent2)}
  /* 청소·타월 진행 카드 — 1건이라도 끝나면 초록 막대가 채워지기 시작해 완료 시 카드 전체가 초록(Min 2026-08) */
  .kpi.work{background:var(--surface);border-color:var(--accent);border-width:2px;position:relative;overflow:hidden;padding-bottom:13px}
  .kpi.work .pbar{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--border2)}
  .kpi.work .pbar i{display:block;height:100%;background:var(--ok);width:0%;transition:width .25s}
  .kpi.work.done{background:var(--accentSoft);border-color:var(--ok)}
  .kpi.work.done .v{color:var(--ok)}
  /* 위 KPI 행도 층 칩처럼 고정 — 스크롤해도 진행 상황이 계속 보인다(Min 2026-08).
     panel 밖으로 뺀 이유: panel 안에 있으면 그 짧은 박스 끝에서 고정이 풀린다(층 목록까지 못 따라옴). */
  .kpis{position:sticky;top:var(--hkTop2,100px);z-index:16;background:var(--surface);
        border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;
        box-shadow:0 1px 3px rgba(15,23,42,.04)}
  @media print{ .kpis{position:static;box-shadow:none;border:none;padding:0} }

  /* 층 섹션 */
  .flr{margin-bottom:16px;border:1px solid var(--border2);border-radius:11px;overflow:hidden;background:var(--surface)}
  .flr-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface3);
    padding:9px 14px;font-size:15px;font-weight:800;cursor:pointer;user-select:none}
  .flr-h .fac{font-size:11.5px;font-weight:700;color:var(--text2)}
  .flr-h .fst{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;font-size:12px;font-weight:700}
  .flr-h .fst b{font-family:var(--mono)}
  .flr-h .car{color:var(--muted);width:14px;display:inline-block}
  .hkt{width:100%;border-collapse:collapse}
  .hkt th{background:var(--surface2);border-bottom:1px solid var(--border2);padding:6px 10px;text-align:left;
    font-size:10.5px;font-weight:800;letter-spacing:.03em;color:var(--text2);white-space:nowrap}
  .hkt td{border-bottom:1px solid var(--border);padding:7px 10px;font-size:13.5px;vertical-align:middle}
  .hkt tr:last-child td{border-bottom:none}
  .hkt tr.r-turn td{background:#fdf1ee} .hkt tr.r-out td{background:#fdf8ee}
  .hkt tr.r-vacant td{color:var(--muted)} .hkt tr.r-ooo td{background:#f1f2f4;color:var(--muted)}
  .hkt td.c-no{font-weight:800;font-size:16px;font-family:var(--mono);white-space:nowrap;border-left:5px solid transparent}
  .hkt tr.r-turn td.c-no{border-left-color:var(--err)}
  .hkt tr.r-out  td.c-no{border-left-color:#d99a2b}
  .hkt tr.r-stay td.c-no{border-left-color:#2b5f9e}
  .hkt tr.r-in   td.c-no{border-left-color:var(--ok)}
  .hkt td.c-ty{font-size:11.5px;color:var(--text2);white-space:nowrap}
  .hkt td.c-pax,.hkt td.c-nth{font-family:var(--mono);white-space:nowrap;text-align:center}
  .hkt td.c-stay{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .hkt td.c-tee{font-family:var(--mono);font-weight:800;white-space:nowrap}
  .st{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 9px;white-space:nowrap;color:#fff}
  .st.turn{background:var(--err)} .st.out{background:#c8891f} .st.stay{background:#2b5f9e}
  .st.in{background:var(--ok)} .st.vacant{background:#aeb4bd} .st.ooo{background:#4b5563}
  .tline{display:block;font-size:12.5px;white-space:nowrap}
  .tline .ar{font-size:10.5px;font-weight:800;color:var(--muted);margin-right:4px}
  .tag{font-family:var(--mono);font-weight:800;color:var(--accent2);margin-right:5px}
  .note{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;margin:1px 4px 1px 0;
    background:var(--surface3);color:var(--text2);border:1px solid var(--border2)}
  .rc-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  /* 완료 토글 — 태블릿에서 장갑 낀 손으로 누른다(Min 2026-08). 손가락 목표 최소 48px·전폭 */
  .dbtn{width:100%;min-height:52px;font-size:17px;font-weight:800;border:2px solid var(--border2);background:var(--surface);
    color:var(--text2);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:8px;-webkit-tap-highlight-color:transparent;transition:transform .06s,background .12s}
  .dbtn:active{transform:scale(.97)}
  .dbtn:hover{border-color:var(--accent);color:var(--accent)}
  .dbtn::before{content:'○';font-size:19px;line-height:1}
  .dbtn.on{background:var(--ok,#2f7d4f);border-color:var(--ok,#2f7d4f);color:#fff;box-shadow:0 2px 8px rgba(47,125,79,.28)}
  .dbtn.on::before{content:'✓';font-weight:900}
  .dbtn.tw{border-color:#a9bcd4;color:#2c5078}
  .dbtn.tw.on{background:#2c5078;border-color:#2c5078;color:#fff;box-shadow:0 2px 8px rgba(44,80,120,.28)}
  .rc-acts{margin-top:9px}
  /* 표 보기에서도 같은 버튼을 쓰지만 셀 안이라 폭만 자동 */
  .hkt .dbtn{width:auto;min-width:118px}
  /* 층 단위 일괄 — 층 머리줄 오른쪽 */
  /* 객실 쪽지 — 카드 맨 위(방에 들어가기 전에 본다) */
  .rc-note-bar{display:flex;flex-direction:column}
  .rn{display:flex;align-items:center;gap:7px;padding:7px 10px;font-size:13.5px;font-weight:700;
    background:#fbeeeb;color:#8a2a1c;border-bottom:1px solid rgba(0,0,0,.08)}
  .rn.k-fix{background:#fdf3e2;color:#7a5a16}
  .rn.k-etc{background:var(--surface3);color:var(--text2)}
  .rn .ri{font-size:15px}
  .rn .rb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rn .rdone{border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;
    padding:3px 9px;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
  .nbtn{min-height:44px;font-size:13px;font-weight:800;border:1.5px dashed var(--border2);background:var(--surface);
    color:var(--text2);border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .nbtn:hover{border-color:var(--accent2);color:var(--accent2)}
  /* 입력 팝업 */
  .nm-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;align-items:center;justify-content:center;padding:16px}
  .nm{background:var(--surface);border-radius:14px;padding:18px;width:min(460px,94vw);box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .nm h3{font-size:15px;margin-bottom:12px}
  .nm h3 b{font-family:var(--mono);color:var(--accent)}
  .nm-kinds{display:flex;gap:8px;margin-bottom:10px}
  .nk{flex:1;min-height:48px;font-size:14px;font-weight:800;border:2px solid var(--border2);background:var(--surface);
    color:var(--text2);border-radius:11px;cursor:pointer}
  .nk.on{border-color:var(--accent);background:var(--accentSoft);color:var(--accentDeep)}
  .nm #note-text{width:100%;font-size:16px;min-height:46px}
  .nm-quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
  .nm-quick button{font-size:12.5px;font-weight:700;border:1px solid var(--border2);background:var(--surface2);
    color:var(--text2);border-radius:99px;padding:6px 11px;cursor:pointer}
  .nm-acts{display:flex;gap:8px;justify-content:flex-end}
  @media print{ .rn .rdone,.nbtn,.nm-bg{display:none!important} }
  .flr-all{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
  .allb{min-height:34px;font-size:12.5px;font-weight:800;border:1.5px solid var(--border2);background:var(--surface);
    color:var(--text2);border-radius:9px;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .allb:hover{border-color:var(--accent);color:var(--accent)}
  .allb.on{background:var(--ok,#2f7d4f);border-color:var(--ok,#2f7d4f);color:#fff}
  .allb.tw{border-color:#a9bcd4;color:#2c5078}
  .allb.tw.on{background:#2c5078;border-color:#2c5078;color:#fff}
  @media print{ .flr-all{display:none} }
  @media(max-width:1100px){   /* 태블릿 세로 — 카드를 크게, 버튼은 더 크게 */
    .rcards{grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
    .dbtn{min-height:60px;font-size:18.5px}
  }
  .note.dl{background:#fdf3e3;color:#8a5a12;border-color:#e8cf9a;font-weight:800}
  .note.linen{background:#efeaf7;color:#5e3a86;border-color:#cfc0e4}
  .note.next{background:var(--accentSoft);color:#2f5d3a;border-color:#b4cda0}
  .note.clo{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  /* 카드 보기 — 태블릿에서 한 층을 한눈에. 상태색을 머리줄 배경으로 크게 */
  .rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
  .rc{border:1px solid var(--border2);border-radius:11px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .rc-h{display:flex;align-items:center;gap:8px;padding:7px 11px;color:#fff}
  .rc-h .no{font-family:var(--mono);font-size:22px;font-weight:800;line-height:1.1}
  .rc-h .st2{font-size:11.5px;font-weight:800;margin-left:auto;white-space:nowrap;opacity:.95}
  .rc.s-turn .rc-h{background:#b13b2c} .rc.s-out .rc-h{background:#c8891f}
  .rc.s-stay .rc-h{background:#2b5f9e} .rc.s-in .rc-h{background:#2f7d4f}
  .rc.s-vacant .rc-h{background:#aeb4bd} .rc.s-ooo .rc-h{background:#4b5563}
  .rc-ty{font-size:11px;font-weight:700;opacity:.9}
  .rc-b{padding:8px 11px 10px}
  .rc-team{font-size:13px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc-team i{font-size:10px;font-weight:800;color:var(--muted);font-style:normal;margin-right:4px}
  .rc-meta{font-size:12px;color:var(--text2);font-family:var(--mono);margin-top:4px}
  .rc-tee{font-weight:800;color:var(--text)}
  .rc-notes{margin-top:5px}
  .rc.s-vacant .rc-b{min-height:34px;color:var(--muted);font-size:12px}
  /* 층 칩 줄 = 화면 위에 고정(스크롤해도 따라옴). 지금 보는 층이 켜지고, 누르면 그 층으로 이동 */
  .zbar{position:sticky;top:var(--hkTop,54px);z-index:20;background:var(--surface);
        border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px;
        display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(15,23,42,.08)}
  .zchips{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto;scrollbar-width:thin}
  @media print{ .zbar{position:static;box-shadow:none} }
  .zchip{font-size:14px;font-weight:800;padding:7px 15px;border-radius:9px;border:1px solid var(--border2);
    background:var(--surface);color:var(--text2);cursor:pointer;user-select:none}
  .zchip:hover{border-color:var(--accent)}
  .zchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .zchip .zn{font-size:10.5px;font-weight:700;opacity:.8;margin-left:6px}
  .noroom{margin:10px 0 0;padding:10px 13px;border-radius:9px;background:#fbf3e2;border:1px solid #e3d3a8;
    color:#7a5a16;font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .noroom a{color:var(--accent);font-weight:800}

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }
function accomL(a){ return (window.SZCore&&SZCore.accomLabel)?SZCore.accomLabel(a,lang()):(a||''); }
// 방 타입·층 이름도 언어 토글을 따른다(저장값=한글 불변, 표시만) — 예전엔 한글 그대로 노출되던 버그(Min 2026-08)
function roomTypeL(t){ return (window.SZCore&&SZCore.roomTypeLabel)?SZCore.roomTypeLabel(t,lang()):(t||''); }
function zoneL(z){ return (window.SZCore&&SZCore.zoneLabel)?SZCore.zoneLabel(z,lang()):(z||''); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');if(e){e.textContent=t;e.className='pill'+(c?' '+c:'');}}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
function todayISO(){ return SZCore.fmtDate(new Date()); }
function shiftDate(iso,n){ const d=SZCore.parseLocalDate(iso); d.setDate(d.getDate()+n); return SZCore.fmtDate(d); }
function md(iso){ return iso?iso.slice(5).replace('-','/'):''; }
function dayDiff(a,b){ return Math.round((SZCore.parseLocalDate(b)-SZCore.parseLocalDate(a))/86400000); }

const ACCOM_ORDER=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸'];
function accomIdx(a){ const i=ACCOM_ORDER.indexOf(a); return i<0?99:i; }

// 상태 우선순위 — 당일 입실이 걸린 방이 맨 위
const PRIO={turn:0, out:1, stay:2, in:3, vacant:4, ooo:5};

let supa=null, INV=[], ROWS=[], TEAM={}, CLO=[], TEE={}, COURSE={};
let NOROOM=0;   // 그날 묵는데 방배정이 없는 팀 수(배정 자체가 비어 있으면 「공실 N」으로 오해한다)
let DONE={};    // 완료 상태 {inventory_id|kind:{by}}
let NOTES={};   // 객실 쪽지(열린 것) {inventory_id:[{id,kind,body,created_by,created_at}]} — SQL 115
let ORIGIN={};  // event_seq → 'ICN'|'PUS'
let DATE=todayISO(), SORT='prio';
// 숙소 구분은 방배정 화면과 같은 기준(SZCore) — 소보별장·아소별장·돔하우스 배정도 그대로 보인다
let PLACESEL=new Set();          // 비면 「전체」 = 야마나미 복합 + 쿠주힐즈(간지·시즈 제외)
let ZONE=null;                   // 선택한 층/동 (null = 전체)
let VIEW=(function(){ try{ const v=localStorage.getItem('saizen_hk_view'); return (v==='table'||v==='card')?v:'card'; }catch(e){ return 'card'; } })();
function placeKeys(inv){ return SZCore.roomPlaceKeys(inv); }
// 간지호텔·시즈노야도는 우리 청소팀 담당이 아니다(외부 위탁) → 이 화면에서 제외한다(Min 2026-08).
//   칩으로도 켤 수 없고, 대신 칩 줄 끝에 「제외」 표시만 남겨 왜 안 보이는지 알 수 있게 한다.
const HK_EXCLUDE=['간지호텔','시즈노야도'];
function hkExcluded(inv){ return placeKeys(inv).some(k=>HK_EXCLUDE.includes(k)); }
function invInScope(inv){
  if(hkExcluded(inv)) return false;
  return SZCore.placeInScope(placeKeys(inv), PLACESEL);
}

async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);

async function paged(qf){
  const out=[]; let from=0;
  for(;;){ const {data,error}=await qf(from,from+999); if(error) return {error};
    out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return {data:out};
}
async function pagedIn(table,cols,col,vals){
  const out=[];
  for(let i=0;i<vals.length;i+=200){
    const ch=vals.slice(i,i+200);
    const r=await paged((a,b)=>supa.from(table).select(cols).in(col,ch).order(col).range(a,b));
    if(r.error) return r; out.push(...r.data);
  }
  return {data:out};
}

// 스크롤에 따라 '지금 보고 있는 층'을 칩에 표시
let _zSpy=null;
function wireZoneSpy(){
  if(_zSpy) _zSpy.disconnect();
  if(!('IntersectionObserver' in window)) return;
  const bar=document.querySelector('.zbar');
  const top=(bar?bar.getBoundingClientRect().height:0)+70;
  _zSpy=new IntersectionObserver(es=>{
    const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(vis) setZoneChip(vis.target.dataset.zone||'');
  },{rootMargin:`-${top}px 0px -55% 0px`, threshold:0});
  document.querySelectorAll('#floors .flr').forEach(el=>_zSpy.observe(el));
}

async function load(){

    // 1) 객실 마스터

      .select('id,facility,zone,room_no,room_type,capacity,max_capacity,active,note').order('id').range(a,b));
    if(iv.error) throw iv.error;
    INV=iv.data||[];
    const invMap={}; INV.forEach(i=>{ invMap[i.id]=i; });

    // 2) 그날에 걸치는 배정 — 그날 밤 체류(check_in<=D<check_out) + 그날 퇴실(check_out=D)
    const rm=await paged((a,b)=>supa.from('rooms')

      .lte('check_in',D).gte('check_out',D).order('event_seq').range(a,b));

    // 3) 팀 정보(그룹코드·대표·전체 체류)
    const seqs=[...new Set(ROWS.map(r=>r.event_seq))];
    TEAM={};
    if(seqs.length){
      const gs=await pagedIn('guests','event_seq,group_code,team_tag,accom','event_seq',seqs);
      if(gs.error) throw gs.error;
      (gs.data||[]).forEach(g=>{ TEAM[g.event_seq]={tag:g.team_tag||g.group_code||'', accom:g.accom||'', rep:'', dep:'', arr:''}; });
      // 묶은 팀(現地手配書)은 대표팀 코드+팀번호로 표시 — 인쇄물과 같은 코드
      try{ const GT=(window.__so_groupTags? await __so_groupTags(supa,seqs) : {});
        Object.keys(GT).forEach(k=>{ if(TEAM[k]) TEAM[k].tag=GT[k]; }); }catch(e){}
      const bs=await pagedIn('bookings','event_seq,rep_name,dep_date,arr_date','event_seq',seqs);
      if(bs.error) throw bs.error;
      (bs.data||[]).forEach(b=>{ const t=(TEAM[b.event_seq]=TEAM[b.event_seq]||{tag:'',accom:''});
        t.rep=b.rep_name||''; t.dep=b.dep_date||''; t.arr=b.arr_date||''; });
    }

    // 4) 그날 폐쇄된 방
    const cl=await supa.from('room_closures').select('inventory_id,from_date,to_date,reason')
      .lte('from_date',D).gte('to_date',D);
    CLO=cl.error?[]:(cl.data||[]);

    // 5) 그날 라운딩 티오프 — 연박 방은 팀이 나간 뒤라야 청소할 수 있다
    TEE={};
    const gg=await supa.from('golf_groups').select('event_seq,tee_time,course_code').eq('play_date',D);
    if(!gg.error){
      (gg.data||[]).forEach(g=>{
        if(g.event_seq==null||!g.tee_time) return;
        const cur=TEE[g.event_seq];
        if(!cur||String(g.tee_time)<cur.time) TEE[g.event_seq]={time:String(g.tee_time).slice(0,5), course:g.course_code||''};
      });
    }
    if(!Object.keys(COURSE).length){
      const gc=await supa.from('golf_courses').select('code,name_ja,name_ko');
      if(!gc.error) (gc.data||[]).forEach(c=>{ COURSE[c.code]=c; });
    }
    // 6) 그날 묵는 팀 vs 방배정된 팀 — 배정이 비어 있으면 「공실 126」으로 오해하게 된다
    NOROOM=0;
    try{
      // 오늘 입실 팀의 출발지 — 인천(09:25 착)·부산(13:25 착)에 따라 청소 마감이 다르다
      try{
        const inSeqs=[...new Set(ROWS.filter(r=>r.check_in===D).map(r=>r.event_seq))];
        ORIGIN={};
        if(inSeqs.length){
          const og=await pagedIn('bookings','event_seq,origin,airline','event_seq',inSeqs);
          (og.data||[]).forEach(x=>{ ORIGIN[x.event_seq]=SZCore.originPort(x.origin,x.airline)||''; });
        }
      }catch(e){ ORIGIN={}; }
      // 청소·타월 완료 상태(hk_done, SQL 107)
      try{
        DONE={};
        const dn=await supa.from('hk_done').select('inventory_id,kind,done_by').eq('work_date',D);
        (dn.data||[]).forEach(x=>{ DONE[x.inventory_id+'|'+x.kind]={by:x.done_by||''}; });
      }catch(e){ DONE={}; }
      // 객실 쪽지(벌레·고장·특이사항) — 처리 전(done=false)만. 날짜와 무관하게 계속 뜬다.
      try{
        NOTES={};
        const nt=await supa.from('room_notes').select('id,inventory_id,kind,body,created_by,created_at')
          .eq('done',false).order('created_at',{ascending:false});
        (nt.data||[]).forEach(x=>{ (NOTES[x.inventory_id]=NOTES[x.inventory_id]||[]).push(x); });
      }catch(e){ NOTES={}; }
      const bk=await paged((a,b)=>supa.from('bookings').select('event_seq')
        .lte('dep_date',D).gt('arr_date',D).order('event_seq').range(a,b));
      if(!bk.error){
        const staying=new Set((bk.data||[]).map(x=>x.event_seq));
        const placed=new Set(ROWS.map(r=>r.event_seq));
        NOROOM=[...staying].filter(sq=>!placed.has(sq)).length;
      }
    }catch(_){ NOROOM=0; }
    renderAccomChips();
    render();
  }catch(e){ if(st) st.textContent=tx('loadFail'); toast(tx('loadFail')+': '+String(e&&e.message||e),'err'); }
}

function courseL(code){ const c=COURSE[code]; if(!c) return ''; return lang()==='ko'?(c.name_ko||''):(c.name_ja||''); }

// ── 방 1개 → 그날의 상태 레코드 ──
function roomRecord(inv){
  const D=DATE;
  const mine=ROWS.filter(r=>r.inventory_id===inv.id);
  const night=mine.filter(r=>r.check_in<=D && D<r.check_out);        // 그날 밤 묵는 사람
  const outs =mine.filter(r=>r.check_out===D);                        // 그날 퇴실
  const ins  =night.filter(r=>r.check_in===D);                        // 그날 입실
  const stays=night.filter(r=>r.check_in<D);                          // 연박
  const clo=CLO.find(c=>c.inventory_id===inv.id);
  let status;
  if(clo || inv.active===false) status='ooo';
  else if(outs.length && ins.length) status='turn';
  else if(outs.length) status='out';
  else if(stays.length) status='stay';
  else if(ins.length) status='in';
  else status='vacant';

  const grp=list=>{
    const g={};
    list.forEach(r=>{ const t=TEAM[r.event_seq]||{};
      const k=r.event_seq;
      if(!g[k]) g[k]={seq:k, tag:t.tag||'', rep:t.rep||'', pax:0, ci:r.check_in, co:r.check_out};
      g[k].pax++;
      if(r.check_in<g[k].ci) g[k].ci=r.check_in;
      if(r.check_out>g[k].co) g[k].co=r.check_out;
    });
    return Object.values(g);
  };
  const gOut=grp(outs), gStay=grp(stays), gIn=grp(ins);

  // 연박 = 몇 박째인지(그날 아침 기준 = 이미 묵은 밤 수) · 마지막 밤이면 표시
  let nth=0, total=0, lastNight=false;
  const base=gStay[0]||gIn[0]||gOut[0];
  if(base){
    total=Math.max(1,dayDiff(base.ci,base.co));
    nth=Math.max(0,dayDiff(base.ci,D));
    lastNight=(status==='stay'||status==='in') && shiftDate(D,1)===base.co;
  }
  // 티오프 = 그날 이 방에 남아 있는 팀(연박) 기준 — 나간 뒤 청소
  const teeSeq=(gStay[0]||gIn[0]||{}).seq;
  const tee=teeSeq!=null?TEE[teeSeq]:null;

  const paxNight=night.length, paxOut=outs.length, paxIn=ins.length;
  // 체류 청소 = 3일차마다(3박 이하 제외·퇴실일 제외). nth=이미 묵은 밤 수 → 일차=nth+1
  const day=nth+1;
  const linen = status==='stay' && total>NO_CLEAN_NIGHTS && day>1 && day%CLEAN_EVERY===0 && day<=total;
  // 오늘 들어올 팀의 출발지(인천/부산) → 도착 시간이 달라 청소 순서가 갈린다
  const inSeq=(gIn[0]||{}).seq;
  const port=inSeq!=null?(ORIGIN[inSeq]||''):'';
  const deadline=(status==='turn'||status==='in')?(DEADLINE[port]||DEADLINE.none):DEADLINE.none;

  return {inv, status, gOut, gStay, gIn, paxNight, paxOut, paxIn, nth, total, lastNight, tee, clo, linen,
          day, port, deadline, cleanDone:isDone(inv.id,'clean'), towelDone:isDone(inv.id,'towel')};
}

// 완료 상태(hk_done) — 있으면 완료, 지우면 미완료

//   예전엔 서버 응답을 기다렸다가 전체를 다시 그려서 누를 때마다 한 박자 늦었다(Min 2026-08).

    } else {
      const {error}=await supa.from('hk_done')
        .upsert({work_date:DATE, inventory_id:invId, kind, done_by:by, done_at:new Date().toISOString()},
                {onConflict:'work_date,inventory_id,kind'});
      if(error) throw error;
    }
  }catch(e){
    setDone(invId,kind,was,by); paintDone(invId,kind); refreshCounts();   // ③ 실패하면 되돌린다
    toast(tx('hkSaveFail')(e.message),'err');
  }
}
// ── 층 단위 일괄 ── 그 층의 대상 객실을 한 번에 완료/취소한다.
// 층 묶음 키 — 목록 그리기와 일괄 처리가 같은 기준을 쓰게 한 곳에 둔다
function zoneKeyOf(r){ return (r.inv.facility||'')+'|'+(r.inv.zone||r.inv.facility||''); }
async function toggleFloor(zoneKey, kind){
  const invs=INV.filter(invInScope).map(roomRecord)
    .filter(r=>zoneKeyOf(r)===zoneKey)
    .filter(r=> kind==='clean' ? needsClean(r) : needsTowel(r));
  if(!invs.length) return;
  const ids=invs.map(r=>r.inv.id);
  const allOn=ids.every(id=>DONE[id+'|'+kind]);
  const by=(window.__so_getUser&&__so_getUser())||null;
  ids.forEach(id=>{ setDone(id,kind,!allOn,by); paintDone(id,kind); });   // ① 먼저 화면
  refreshCounts();
  try{
    if(allOn){
      const {error}=await supa.from('hk_done').delete().eq('work_date',DATE).eq('kind',kind).in('inventory_id',ids);
      if(error) throw error;
    } else {
      const now=new Date().toISOString();
      const rows=ids.map(id=>({work_date:DATE, inventory_id:id, kind, done_by:by, done_at:now}));
      const {error}=await supa.from('hk_done').upsert(rows,{onConflict:'work_date,inventory_id,kind'});
      if(error) throw error;
    }
    toast(allOn?tx('allUndone')(ids.length):tx('allDone')(ids.length),'ok');
  }catch(e){
    ids.forEach(id=>{ setDone(id,kind,allOn,by); paintDone(id,kind); });
    refreshCounts(); toast(tx('hkSaveFail')(e.message),'err');
  }
}
// 그 방이 오늘 '청소 대상'인가 — 퇴실/턴오버(무조건) + 체류 청소일
function needsClean(r){ return r.status==='turn'||r.status==='out'||r.linen; }
// 그 방이 오늘 '타월만 따로' 대상인가 — 청소 대상 방은 청소에 타월이 포함되므로 뺀다(중복 집계 방지).
//  KPI 진행률(921행)·카드 버튼 노출(1060행)과 반드시 같은 기준을 써야 층 일괄 버튼 수가 안 어긋난다.
function needsTowel(r){ return !needsClean(r) && r.status!=='vacant' && r.status!=='ooo'; }
function stLabel(s){ return {turn:tx('sTurn'),out:tx('sOut'),stay:tx('sStay'),in:tx('sIn'),vacant:tx('sVacant'),ooo:tx('sOoo')}[s]; }

function render(){
  const box=$('#floors'); if(!box) return;
  const invs=INV.filter(invInScope);
  const recs=invs.map(roomRecord);
  renderKpis(recs);
  const st=$('#stat'); if(st) st.textContent=tx('statN')(md(DATE),recs.length,recs.reduce((s,r)=>s+r.paxNight,0));
  if(!recs.length){ box.innerHTML=`<div class="panel"><div class="deny">${esc(tx('noRooms'))}</div></div>`; return; }
  // (버튼 결선은 아래 목록 그린 뒤 bindDone() 에서)

  // 층(zone) 단위 — 청소팀은 층을 맡아 움직인다
  const groups={};
  recs.forEach(r=>{ const k=zoneKeyOf(r);
    (groups[k]=groups[k]||{fac:r.inv.facility||'', zone:r.inv.zone||r.inv.facility||'', list:[]}).list.push(r); });
  const keys=Object.keys(groups).sort((a,b)=>{
    const A=groups[a], B=groups[b];
    const fi=accomIdx(A.fac)-accomIdx(B.fac); if(fi) return fi;
    const fa=String(A.zone).match(/^(\d+)층$/), fb=String(B.zone).match(/^(\d+)층$/);
    if(fa&&fb) return (+fa[1])-(+fb[1]);
    if(fa) return -1; if(fb) return 1;
    return String(A.zone).localeCompare(String(B.zone));
  });
  if(ZONE && !groups[ZONE]) ZONE=null;              // 필터가 바뀌어 사라진 층 → 전체로
  renderZoneChips(groups,keys);
  const show = keys;   // 층 칩은 필터가 아니라 이동(목차)이므로 전 층을 다 그린다
  box.innerHTML=show.map(k=>floorHtml(groups[k],k)).join('');
  // 완료 버튼(청소·타월) — 누르면 바로 저장되고 진행률이 올라간다
  box.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation(); toggleDone(b.dataset.done, b.dataset.kind);
  }));
  box.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation(); toggleFloor(b.dataset.zone, b.dataset.all);
  }));
  box.querySelectorAll('[data-note]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation(); openNote(b.dataset.note, b.dataset.room);
  }));
  box.querySelectorAll('[data-ndone]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation(); doneNote(b.dataset.ndone);
  }));
  wireZoneSpy(); syncStickyTop();
}

// 쪽지 팝업 — 라벨·자주 쓰는 문구는 언어에 따라 채운다
function applyNoteUI(){
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('t-noteH',tx('noteH')); set('t-nkBug',tx('nkBug')); set('t-nkFix',tx('nkFix')); set('t-nkEtc',tx('nkEtc'));
  const c=document.getElementById('note-cancel'); if(c) c.textContent=tx('noteCancel');
  const sv=document.getElementById('note-save'); if(sv) sv.textContent=tx('noteSave');
  const inp=document.getElementById('note-text'); if(inp) inp.placeholder=tx('noteH');
  const q=document.getElementById('note-quick');
  if(q){ q.innerHTML=(tx('noteQuick')||[]).map(t=>`<button type="button">${esc(t)}</button>`).join('');
    q.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      const i=document.getElementById('note-text'); if(i){ i.value=b.textContent; i.focus(); } })); }
}
function wireNoteModal(){
  const box=document.getElementById('note-modal'); if(!box) return;
  box.querySelectorAll('.nk').forEach(b=>b.addEventListener('click',()=>{
    box.querySelectorAll('.nk').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }));
  const c=document.getElementById('note-cancel'); if(c) c.addEventListener('click',closeNote);
  const sv=document.getElementById('note-save'); if(sv) sv.addEventListener('click',saveNote);
  box.addEventListener('click',e=>{ if(e.target===box) closeNote(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeNote(); });
  const inp=document.getElementById('note-text');
  if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter') saveNote(); });
  applyNoteUI();
}
function renderKpis(recs){
  const box=$('#kpis'); if(!box) return;
  const c={turn:0,out:0,stay:0,in:0,vacant:0,ooo:0};
  recs.forEach(r=>{ c[r.status]++; });
  const kpi=(cls,k,v,u)=>`<div class="kpi ${cls}"><div class="k">${esc(k)}</div><div class="v">${v}<span class="u">${esc(u||'')}</span></div></div>`;
  // 청소·타월 진행 카드 — 1건이라도 끝나면 초록 막대가 채워지고, 전부 끝나면 카드 전체가 초록(Min 2026-08)
  const kpiProg=(k,d,t)=>{ const pct=t>0?Math.round(d/t*100):0, done=t>0&&d===t;
    return `<div class="kpi work${done?' done':''}"><div class="k">${esc(k)}</div><div class="v">${d}/${t}</div>`
         + `<div class="pbar"><i style="width:${pct}%"></i></div></div>`; };
  box.innerHTML=
     kpi('turn',tx('kTurn'),c.turn,tx('roomsU'))
    +kpi('out', tx('kOut'), c.out, tx('roomsU'))
    +kpi('stay',tx('kStay'),c.stay,tx('roomsU'))
    +kpi('inn', tx('kIn'),  c.in,  tx('roomsU'))
    +kpi('',    tx('kVacant'),c.vacant,tx('roomsU'))
    +(c.ooo?kpi('',tx('kOoo'),c.ooo,tx('roomsU')):'')
    // 인원 — 그날 밤 묵는 사람 수(입·퇴실 인원은 있을 때만). 방 수만으로는 규모가 안 보인다.
    + (()=>{ const sum=(f)=>recs.reduce((s,r)=>s+f(r),0);
             const pN=sum(r=>r.paxNight), pI=sum(r=>r.paxIn), pO=sum(r=>r.paxOut);
             return kpi('pax',tx('kPax'),pN,tx('paxU'))
                  + (pI?kpi('',tx('kPaxIn'),pI,tx('paxU')):'')
                  + (pO?kpi('',tx('kPaxOut'),pO,tx('paxU')):''); })()
    // 진행 상태 — 오늘 할 청소·타월 중 몇 개가 끝났는지(현장이 어디까지 했는지 한눈에)
    + (()=>{ const need=recs.filter(needsClean);
             const tw=recs.filter(needsTowel);
             const cd=need.filter(r=>r.cleanDone).length, td=tw.filter(r=>r.towelDone).length;
             return kpiProg(tx('hkProg')(cd,need.length), cd, need.length)
                  + kpiProg(tx('hkTowelProg')(td,tw.length), td, tw.length); })();
}

        return `<span class="flr-all">

    </div>

      <thead><tr>

// ── 객실 쪽지(SQL 115) ── 벌레·고장·특이사항을 **방에** 짧게 남긴다.
//   날짜가 아니라 열림/닫힘으로 관다 — 처리할 때까지 매일 뜬다(다음날 청소자도 본다).
const NOTE_KINDS=[['bug','🐛'],['fix','🔧'],['etc','📌']];
function noteIcon(k){ return (NOTE_KINDS.find(x=>x[0]===k)||NOTE_KINDS[2])[1]; }
function noteBar(invId){
  const list=NOTES[invId]||[]; if(!list.length) return '';
  return `<div class="rc-note-bar">`+list.map(x=>
    `<div class="rn k-${esc(x.kind)}">
       <span class="ri">${noteIcon(x.kind)}</span>

// 입력 팝업 — 태블릿에서 한 손으로. 종류 3개 + 자주 쓰는 문구 + 30자.
let _noteInv=null;
function openNote(invId, roomNo){
  _noteInv=invId;
  const box=document.getElementById('note-modal'); if(!box) return;
  box.querySelector('.nm-room').textContent=roomNo||'';
  box.querySelectorAll('.nk').forEach(b=>b.classList.toggle('on', b.dataset.k==='bug'));
  const inp=box.querySelector('#note-text'); inp.value='';
  box.style.display='flex'; setTimeout(()=>inp.focus(),30);
}
function closeNote(){ const b=document.getElementById('note-modal'); if(b) b.style.display='none'; _noteInv=null; }
async function saveNote(){
  const box=document.getElementById('note-modal'); if(!box||!_noteInv) return;
  const kind=(box.querySelector('.nk.on')||{}).dataset ? box.querySelector('.nk.on').dataset.k : 'etc';
  const body=String(box.querySelector('#note-text').value||'').trim().slice(0,30);
  if(!body){ toast(tx('noteEmpty'),'warn'); return; }
  const by=(window.__so_getUser&&__so_getUser())||null;
  const invId=_noteInv;
  const tmp={id:'tmp-'+Date.now(), inventory_id:invId, kind, body, created_by:by};
  (NOTES[invId]=NOTES[invId]||[]).unshift(tmp); closeNote(); render();      // 먼저 화면
  try{
    const {data,error}=await supa.from('room_notes')
      .insert({inventory_id:invId, kind, body, created_by:by}).select('id').single();
    if(error) throw error;
    tmp.id=data.id;
  }catch(e){
    NOTES[invId]=(NOTES[invId]||[]).filter(x=>x.id!==tmp.id); render();
    toast(tx('hkSaveFail')(e.message),'err');
  }
}
async function doneNote(id){
  let invId=null, keep=null;
  Object.keys(NOTES).forEach(k=>{ const f=(NOTES[k]||[]).find(x=>x.id===id); if(f){ invId=k; keep=f; } });
  if(!invId) return;
  NOTES[invId]=(NOTES[invId]||[]).filter(x=>x.id!==id); render();           // 먼저 화면
  try{
    const by=(window.__so_getUser&&__so_getUser())||null;
    const {error}=await supa.from('room_notes')
      .update({done:true, done_by:by, done_at:new Date().toISOString()}).eq('id',id);
    if(error) throw error;
  }catch(e){
    (NOTES[invId]=NOTES[invId]||[]).unshift(keep); render();
    toast(tx('hkSaveFail')(e.message),'err');
  }
}

  return `<tr class="r-${r.status}">
    <td><span class="st ${r.status==='in'?'in':r.status}">${esc(stLabel(r.status))}</span></td>
    <td class="c-no">${esc(r.inv.room_no)}</td>
    <td class="c-ty">${esc(roomTypeL(r.inv.room_type))}</td>
    <td class="c-pax">${pax||''}</td>
    <td>${teams}</td>
    <td class="c-stay">${esc(stayTxt)}</td>
    <td class="c-nth">${esc(nthTxt)}</td>
    <td class="c-tee">${tee}</td>
    <td>${notes.join('')}</td>
  </tr>`;
}

function applyStatic(){
  const st=$('#t-step'); if(st) st.textContent=tx('step');
  const ch=$('#t-connhint'); if(ch) ch.textContent=tx('connHint');
  const pc=$('#t-preconn'); if(pc) pc.textContent=tx('preConn');
  const btn=$('#btn-connect');
  if(supa){ setConn(tx('connOk'),'ok'); if(btn) btn.textContent=tx('connectedBtn'); }
  else { setConn(tx('notConn'),''); if(btn) btn.textContent=tx('connect'); }
}
window.onSaizenLangChange=function(){
  applyStatic(); applyNoteUI();
  if(supa && $('#floors')){ renderUI(); renderAccomChips(); render(); }
};

$('#btn-connect').addEventListener('click',connect);
applyStatic(); wireNoteModal(); loadCreds();
if($('#sb-url').value && $('#sb-key').value) connect();
</script>
