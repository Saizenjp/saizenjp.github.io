<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 주방 화면(KDS)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad;
    --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.45;min-height:100vh;
  }
  .topbar{
    position:sticky;top:0;z-index:30;background:var(--surface);
    border-bottom:3px solid var(--accent);padding:11px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06);
  }
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  .pill.live{background:var(--accentSoft);color:var(--accent);border-color:#b4cda0}
  input{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}

  .conn{padding:9px 18px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px}
  .conn .hint{font-size:11px;color:var(--muted)}

  .toolbar{padding:9px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
  .seg button{font-family:inherit;font-size:12px;font-weight:700;padding:6px 13px;border:none;background:var(--surface);color:var(--text2);cursor:pointer}
  .seg button.active{background:var(--accent);color:#fff}
  .toolbar label{font-size:12px;color:var(--text2);font-weight:700;display:flex;align-items:center;gap:5px}
  .toolbar .hint{font-size:11px;color:var(--muted)}

  .board{padding:16px 18px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
  .ticket{
    background:var(--surface);border:1px solid var(--border);border-top:6px solid var(--accent);
    border-radius:12px;padding:14px 15px 13px;box-shadow:0 2px 8px rgba(15,23,42,.08);
    display:flex;flex-direction:column;gap:9px;
  }
  .ticket.aged{border-top-color:var(--warn)}
  .ticket.old{border-top-color:var(--err)}
  .ticket.accepted{border-top-color:var(--accent2);background:#fbf6ea}
  .ticket .cooking{font-size:12px;font-weight:800;color:var(--accent2);display:flex;align-items:center;gap:5px}
  @keyframes ktflash{0%,100%{box-shadow:0 2px 8px rgba(15,23,42,.08)}50%{box-shadow:0 0 0 5px var(--accent2)}}
  .ticket.flash{animation:ktflash .7s ease 5}
  .ticket .th{display:flex;align-items:baseline;gap:8px}
  .ticket .tteam{font-family:var(--mono);font-weight:800;font-size:16px;color:var(--accent)}
  .ticket .tage{margin-left:auto;font-size:12px;font-weight:700;color:var(--text2)}
  .ticket .tage.warn{color:var(--warn)} .ticket .tage.err{color:var(--err)}
  .ticket .titem{font-size:19px;font-weight:800;line-height:1.25}
  .ticket .tqty{font-family:var(--mono);color:var(--accent2)}
  .ticket .tnote{font-size:12px;color:var(--text2)}
  .ticket .done{margin-top:2px;width:100%;font-size:15px;padding:11px;border-radius:9px;border:1px solid var(--ok);background:var(--ok);color:#fff;font-weight:800;cursor:pointer}
  .ticket .done:hover{background:#266a45}
  .ticket .accept{margin-top:2px;width:100%;font-size:15px;padding:11px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:800;cursor:pointer}
  .ticket .accept:hover{background:var(--accentDeep)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:15px;padding:60px 0}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}
</style>
<link rel="stylesheet" href="../assets/saizen-ops.css?v=15.41">
</head>
<body data-so-area="kitchen">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム">
    <img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen">
  </a>
  <span class="step" data-i18n="ki_step"></span>
  <a class="navhome" href="../index.html" data-i18n="navHome" style="margin-left:14px"></a>
  <div class="grow so-spacer"></div>
  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>
    </div>
    <button class="so-furi" id="so-furi" onclick="__so_toggleFuri()"></button>
  </div>
  <span class="pill" id="pending" data-i18n="ki_waiting"></span>
  <span class="pill" id="conn-state" data-i18n="connState_none"></span>
</div>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">
  <input class="inp" id="sb-key" type="password" data-i18n-ph="rm_keyPlaceholder" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button" data-i18n="btnConnectShort"></button>
  <span class="hint" data-i18n="st_connHint"></span>
</div>

<div class="toolbar">
  <div class="seg" id="station-seg">
    <button data-station="kitchen" data-i18n="ki_stKitchen"></button>
    <button data-station="front" data-i18n="ki_stFront"></button>
  </div>
  <label><input type="checkbox" id="auto" checked> <span data-i18n="ki_auto"></span></label>
  <label id="snd-label" title=""><input type="checkbox" id="snd" checked> <span id="t-snd"></span></label>
  <button class="btn ghost sm" id="btn-refresh" type="button" data-i18n="ki_refresh"></button>
  <span class="hint" id="updated"></span>
</div>

<div class="board" id="board">
  <div class="empty" data-i18n="ki_connectFirst"></div>
</div>

<div id="toast"></div>

<script src="../assets/saizen-ops.js?v=16.9"></script>
<script>
// ════════════════════════════════════════════════════════════════════════
//  SaiZen Hub — 주방 화면(KDS)  · docs 정산명세(04) Phase 3
//  · kitchen_tickets(status=new) 라이브 큐. 자동 폴링(7초). [완료] → status=done.
//  · charges(돈)와 분리된 조리 큐. POS 전송 시 주방행 항목만 티켓 발행됨.
// ════════════════════════════════════════════════════════════════════════
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let supa=null;

// ── i18n (한·일 직원 공용. ja 기본) ──
//  화면 chrome 대부분은 saizen-ops.js의 data-i18n(t())이 처리. 여기 L은
//  data-i18n으로 못 거는 동적 JS 문자열(토스트·상태·alert)과 정적 일부만 담당.
const L={
  ja:{ sndLabel:'通知', sndTitle:'新規注文の通知音',
    needUrlKey:'URL・key必要', connecting:'接続中…', connectedTxt:'接続済', connectedBtn:'✓ 接続済',
    connOkToast:'Supabaseに接続しました', connFail:'接続失敗', connFailBtn:'接続失敗・再試行',
    connFailToast:'接続失敗', connFailHint:'（厨房SQL 12を実行・keyを確認）',
    reconnecting:'再接続中…', acceptFail:'受付処理に失敗しました', doneFail:'完了処理に失敗しました' },
  ko:{ sndLabel:'알림', sndTitle:'신규 주문 알림음',
    needUrlKey:'URL·key 필요', connecting:'연결 중…', connectedTxt:'연결됨', connectedBtn:'✓ 연결됨',
    connOkToast:'Supabase 연결됨', connFail:'연결 실패', connFailBtn:'연결 실패 · 재시도',
    connFailToast:'연결 실패', connFailHint:'(주방 SQL 12 실행·키 확인)',
    reconnecting:'재연결 중…', acceptFail:'접수 처리 실패', doneFail:'완료 처리 실패' },
  en:{ sndLabel:'Sound', sndTitle:'New order alert sound',
    needUrlKey:'URL·key required', connecting:'Connecting…', connectedTxt:'Connected', connectedBtn:'✓ Connected',
    connOkToast:'Connected to Supabase', connFail:'Connection failed', connFailBtn:'Failed · retry',
    connFailToast:'Connection failed', connFailHint:'(run kitchen SQL 12 · check key)',
    reconnecting:'Reconnecting…', acceptFail:'Accept failed', doneFail:'Done update failed' }
};
function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }
function applyStatic(){
  const sl=$('#t-snd'); if(sl) sl.textContent=tx('sndLabel');
  const lab=$('#snd-label'); if(lab) lab.title=tx('sndTitle');
}

const POLL_MS=7000;
const AGE_WARN=600, AGE_OLD=1200;   // 10분 경과 주의 · 20분 경과 지연(초)
// ?view=front 로 들어오면 바·프론트(주방+바 전체) 화면으로 시작.
const _view=new URLSearchParams(location.search).get('view');
let state={ station:(_view==='front'?'front':'kitchen'), tickets:[] };
let pollTimer=null;
let seenNew=new Set(), firstLoad=true, flashIds=new Set(), audioCtx=null, reconnecting=false;

// ── 알림음(Web Audio, 외부 파일 없음): 신규 주문 "딩동" ──
function initAudio(){
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
}
function chime(){
  if(!audioCtx || !$('#snd').checked) return;
  const t0=audioCtx.currentTime;
  [880,1320].forEach((f,i)=>{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
    const ts=t0+i*0.16;
    g.gain.setValueAtTime(0.0001,ts);
    g.gain.exponentialRampToValueAtTime(0.35,ts+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ts+0.32);
    o.start(ts); o.stop(ts+0.36);
  });
}

function toast(msg,cls){
  const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:'');
  t.textContent=msg; $('#toast').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2400);
}
function setConn(txt,cls){const e=$('#conn-state');e.textContent=txt;e.className='pill'+(cls?' '+cls:'');}
function agoText(sec){
  if(sec<60) return `${sec}${t('ki_sec')}`;
  const m=Math.floor(sec/60); return `${m}${t('ki_min')}`;
}

function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  initAudio();   // 연결 클릭=사용자 제스처 → 알림음 언락
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.textContent=tx('connecting'); btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('kitchen_tickets').select('id',{count:'exact',head:true});
    if(error) throw error;
    setConn(tx('connectedTxt'),'ok'); toast(tx('connOkToast'),'ok');
    btn.textContent=tx('connectedBtn'); btn.classList.add('connected'); btn.disabled=false;
    await refresh(); startPoll();
  }catch(e){
    setConn(tx('connFail'),'err');
    toast(tx('connFailToast')+': '+e.message+' '+tx('connFailHint'),'err');
    btn.textContent=tx('connFailBtn'); btn.disabled=false; supa=null;
  }
}

async function refresh(){
  if(!supa) return;
  let q=supa.from('kitchen_tickets').select('*').in('status',['new','accepted']).order('created_at');
  if(state.station==='kitchen') q=q.eq('station','kitchen');
  else if(state.station==='front') q=q.in('station',['kitchen','bar']);   // 바·프론트=주방+바 전부
  const {data,error}=await q;
  if(error){ handleConnLoss(error); return; }
  reconnecting=false;
  // 신규(new) 먼저, 그다음 조리중(accepted) — 각각 시간순
  state.tickets=(data||[]).sort((a,b)=>
    (a.status==='new'?0:1)-(b.status==='new'?0:1) || new Date(a.created_at)-new Date(b.created_at));
  // 신규 주문 감지 → 알림음 + 점멸
  const curNew=state.tickets.filter(x=>x.status==='new').map(x=>x.id);
  const fresh=curNew.filter(id=>!seenNew.has(id));
  seenNew=new Set(curNew);
  if(!firstLoad && fresh.length){ chime(); flashIds=new Set(fresh); setTimeout(()=>{flashIds=new Set();},4000); }
  firstLoad=false;
  render();
  const now=new Date();
  $('#updated').innerHTML=t('ki_updated')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');   // ki_updated=후리가나 → innerHTML
}

function render(){
  const box=$('#board'); box.innerHTML='';
  const newCnt=state.tickets.filter(x=>x.status==='new').length;
  $('#pending').innerHTML=t('ki_waiting')+' '+newCnt;   // ki_waiting=후리가나 → innerHTML
  if(!state.tickets.length){ box.innerHTML='<div class="empty">'+t('ki_empty')+'</div>'; return; }
  const now=Date.now();
  state.tickets.forEach(tk=>{
    const sec=Math.max(0,Math.floor((now-new Date(tk.created_at).getTime())/1000));
    const ageCls=sec>=AGE_OLD?'old':(sec>=AGE_WARN?'aged':'');
    const ageTxtCls=sec>=AGE_OLD?'err':(sec>=AGE_WARN?'warn':'');
    const accepted=tk.status==='accepted';
    const card=document.createElement('div');
    card.className='ticket '+(accepted?'accepted ':'')+(flashIds.has(tk.id)?'flash ':'')+ageCls;
    const action=accepted
      ? `<div class="cooking">${t('ki_cooking')}</div><button class="done" data-done="${tk.id}">✓ ${t('ki_done')}</button>`
      : `<button class="accept" data-accept="${tk.id}">${t('ki_accept')}</button>`;
    card.innerHTML=`
      <div class="th">
        <span class="tteam">${tk.team_tag||('#'+tk.event_seq)}</span>
        <span class="tage ${ageTxtCls}">${agoText(sec)}${t('ki_ago')}</span>
      </div>
      <div class="titem">${tk.item_name} <span class="tqty">×${Number(tk.qty)}</span></div>
      ${tk.note?`<div class="tnote">${tk.note}</div>`:''}
      ${action}`;
    const ab=card.querySelector('[data-accept]'); if(ab) ab.addEventListener('click',()=>markAccept(tk.id));
    const db=card.querySelector('[data-done]'); if(db) db.addEventListener('click',()=>markDone(tk.id));
    box.appendChild(card);
  });
}

async function markAccept(id){
  // 낙관적: 상태만 변경(목록에 남김) 후 서버 반영
  const tk=state.tickets.find(x=>x.id===id); if(tk){ tk.status='accepted'; render(); }
  const by=(window.__so_getUser&&window.__so_getUser())||'';
  const {error}=await supa.from('kitchen_tickets')
    .update({status:'accepted',accepted_at:new Date().toISOString(),accepted_by:by}).eq('id',id);
  if(error){toast(tx('acceptFail')+': '+error.message,'err'); refresh();}
}

async function markDone(id){
  // 낙관적 제거 후 서버 반영
  state.tickets=state.tickets.filter(x=>x.id!==id); render();
  const {error}=await supa.from('kitchen_tickets').update({status:'done',done_at:new Date().toISOString()}).eq('id',id);
  if(error){toast(tx('doneFail')+': '+error.message,'err'); refresh();}
}

function startPoll(){
  stopPoll();
  if($('#auto').checked) pollTimer=setInterval(refresh,POLL_MS);
}
function stopPoll(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
function handleConnLoss(err){
  // 연결 끊김 → 끊고 워치독이 자동 재연결. 재연결 후 기존 큐로 알림 안 울리게 firstLoad 리셋.
  if(reconnecting) return; reconnecting=true;
  setConn(tx('reconnecting'),'err'); supa=null; stopPoll(); firstLoad=true;
}

// ── 부팅 ──
$('#btn-connect').addEventListener('click',connect);
$('#btn-refresh').addEventListener('click',refresh);
$('#auto').addEventListener('change',()=>{ if($('#auto').checked){refresh();startPoll();} else stopPoll(); });
$('#station-seg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  state.station=b.dataset.station;
  $('#station-seg').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
  refresh();
}));
// 초기 활성 탭(=?view 반영)
$('#station-seg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.station===state.station));
window.addEventListener('pointerdown',initAudio);   // 첫 터치/클릭에 알림음 언락
// 연결 끊김 자동 재연결(10초마다 점검)
setInterval(()=>{ if(!supa && $('#sb-url').value && $('#sb-key').value){ connect(); } }, 10000);
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }   // 진입 시 자동 연결

// 경과시간 라벨만 갱신(폴링과 별개로 매 20초 다시 그림)
setInterval(()=>{ if(state.tickets.length) render(); }, 20000);
window.onSaizenLangChange=function(){ try{ applyStatic(); render(); }catch(e){} };
</script>
</body>
</html>
