<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 주문 입력(간이 POS)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad;
    --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --c-라운딩:#1e3a8a; --c-식음:#92400e; --c-숙박:#5b21b6; --c-골프샵:#065f46; --c-기타:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);line-height:1.5;min-height:100vh;
  }
  .topbar{
    position:sticky;top:0;z-index:30;background:var(--surface);
    border-bottom:3px solid var(--accent);padding:13px 22px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06);
  }
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:8px 12px;border:1px solid var(--border2);border-radius:7px;background:var(--surface);color:var(--text);font-size:14px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:14px;font-weight:700;border-radius:8px;padding:9px 18px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:13px;padding:6px 13px}
  .btn.big{font-size:17px;padding:14px 26px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}

  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .conn .hint{font-size:11px;color:var(--muted)}

  .toolbar{padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar label{font-size:12px;color:var(--text2);font-weight:600}
  .toolbar .hint{font-size:11px;color:var(--muted)}

  .wrap{padding:14px 20px 90px}
  .sec-title{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .sec-title .cnt{font-size:12px;color:var(--text2);font-weight:700}

  /* 팀 선택 큰 버튼 */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .team-btn{
    text-align:left;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--accent);
    border-radius:12px;padding:16px 16px 14px;cursor:pointer;transition:.12s;box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .team-btn:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(15,23,42,.12);transform:translateY(-2px)}
  .team-btn .ttag{font-family:var(--mono);font-weight:800;font-size:18px;color:var(--accent)}
  .team-btn .trep{font-size:15px;font-weight:700;margin-top:3px}
  .team-btn .tmeta{font-size:12.5px;color:var(--text2);margin-top:5px}
  /* 팀 검색 + 주문중 우선 */
  .team-search{display:flex;gap:10px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
  .team-search .inp{flex:1;min-width:240px;max-width:440px;font-size:16px;padding:12px 15px}
  .team-search .cnt{font-size:12.5px;color:var(--accent2);font-weight:800;white-space:nowrap}
  .team-btn.active-team{border-left-color:var(--accent2);background:linear-gradient(180deg,#fff 0%,#fbf6ea 100%)}
  .team-btn .tactive{display:inline-block;margin-left:7px;font-size:10px;font-weight:800;color:#fff;background:var(--accent2);border-radius:99px;padding:1px 8px;vertical-align:middle}
  .team-btn .tac{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px}
  .team-btn .troom{font-family:var(--mono);font-weight:800;font-size:15px;margin-top:6px}
  .team-btn .tnoroom{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;color:#9a6b00;background:#fff4d6;border:1px solid #f0d48a;border-radius:99px;padding:2px 9px}
  .team-btn .tdate{font-size:10.5px;color:var(--muted);font-weight:600}
  /* 날짜 섹션 헤더 + 일행 검색 결과 */
  .tg-head{font-size:12.5px;font-weight:800;color:var(--accent2);margin:14px 0 9px;display:flex;align-items:center;gap:8px}
  .tg-head::after{content:"";flex:1;height:1px;background:var(--border)}
  #team-grid > .team-grid{margin-bottom:4px}
  .mhit-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
  .mhit{text-align:left;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:3px}
  .mhit:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(15,23,42,.12);transform:translateY(-1px)}
  .mhit .mh-name{font-size:15px;font-weight:800}
  .mhit .mh-mem{margin-left:5px;font-size:9.5px;font-weight:800;color:#fff;background:var(--accent2);border-radius:8px;padding:0 5px;vertical-align:middle}
  .mhit .mh-team{font-family:var(--mono);font-size:12px;color:var(--text2)}

  /* 주문 뷰 */
  .order-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:14px}
  .order-head .ot{font-size:20px;font-weight:800}
  .order-head .ot .otag{font-family:var(--mono);color:var(--accent)}
  .order-head .orun{margin-left:auto;font-size:13px;color:var(--text2);font-weight:700}
  .order-head .orun b{font-family:var(--mono);color:var(--text);font-size:16px}

  .order-stage{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  @media(max-width:880px){.order-stage{grid-template-columns:1fr}}

  .venue-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .venue-tab{font-size:13px;font-weight:700;padding:7px 15px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;transition:.12s}
  .venue-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .venue-tab:not(.active):hover{background:var(--accentSoft);color:var(--accent)}

  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .menu-btn{
    position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);
    border-radius:11px;padding:14px 13px 12px;cursor:pointer;transition:.1s;min-height:92px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .menu-btn:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(15,23,42,.12)}
  .menu-btn:active{transform:scale(.97)}
  .menu-btn .mcode{position:absolute;top:9px;right:11px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
  .menu-btn .mja{font-size:15.5px;font-weight:800;line-height:1.25}
  .menu-btn .mko{font-size:12px;color:var(--text2);margin-top:1px}
  .menu-btn .mprice{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--accent);margin-top:8px}
  .menu-btn .mcat{position:absolute;top:9px;left:11px;width:8px;height:8px;border-radius:2px}
  .cat-라운딩{background:var(--c-라운딩)} .cat-식음{background:var(--c-식음)} .cat-숙박{background:var(--c-숙박)}
  .cat-골프샵{background:var(--c-골프샵)} .cat-기타{background:var(--c-기타)}

  /* 카트 */
  .cart{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:sticky;top:74px}
  .cart > h3{font-size:14px;font-weight:800;padding:12px 15px;border-bottom:2px solid var(--accentSoft);background:var(--surface2);color:var(--accent)}
  .cart-body{padding:11px 13px;max-height:46vh;overflow:auto}
  .cart-line{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .cart-line .cl-name{font-size:13.5px;font-weight:700}
  .cart-line .cl-price{font-family:var(--mono);font-size:11.5px;color:var(--text2)}
  .cart-line .qtybox{display:flex;align-items:center;gap:6px}
  .qbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);font-size:17px;font-weight:800;color:var(--accent);cursor:pointer;line-height:1}
  .qbtn:hover{background:var(--accentSoft)}
  .cart-line .qn{font-family:var(--mono);font-weight:800;min-width:22px;text-align:center}
  .cart-line .cl-rm{cursor:pointer;color:var(--err);font-weight:700;border:none;background:none;font-size:15px;padding:0 4px}
  .cart-empty{font-size:13px;color:var(--muted);text-align:center;padding:26px 0}
  .cart-foot{padding:13px 15px;border-top:1px solid var(--border);background:var(--surface2)}
  .cart-foot .tr{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
  .cart-foot .tr.grand{font-weight:800;font-size:16px;color:var(--accent);border-top:2px solid var(--accent);margin-top:5px;padding-top:7px}
  .cart-foot .tr .v{font-family:var(--mono)}
  .cart-foot .btn{width:100%;margin-top:11px}
  /* 결제 주체(payer) — 팀 공통 / 개인·N분의1 */
  .payer{padding:9px 13px;border-bottom:1px solid var(--border);background:var(--surface2)}
  .payer-mode{display:flex;gap:6px;margin-bottom:7px}
  .pm{flex:1;font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 8px;border:1px solid var(--border2);border-radius:7px;background:var(--surface);color:var(--text2);cursor:pointer;transition:.12s}
  .pm.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .payer-roster{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:7px}
  .pchip{font-family:inherit;font-size:14.5px;font-weight:700;padding:11px 15px;min-width:104px;border:1.5px solid var(--border2);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;transition:.12s;display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.25;text-align:left}
  .pchip:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(15,23,42,.1)}
  .pchip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(100,117,72,.25)}
  .pchip .pc-top{display:flex;align-items:center;gap:4px}
  .pchip .pc-en{font-size:12px;font-weight:600;color:var(--text2);margin-top:2px}
  .pchip.on .pc-en{color:rgba(255,255,255,.92)}
  .pchip .mbadge{background:var(--accent2);color:#fff;border-radius:8px;padding:0 4px;font-size:9px;margin-left:3px;font-weight:700}
  .payer-hint{font-size:11px;color:var(--muted)}
  .payer-act{display:flex;gap:6px;margin-top:5px}
  .payer-act button{font-family:inherit;font-size:10.5px;font-weight:700;padding:2px 8px;border:1px solid var(--border2);border-radius:5px;background:var(--surface);color:var(--text2);cursor:pointer}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:11px 20px;font-size:14px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);animation:popUp .2s;text-align:center;min-width:220px}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}
  @keyframes popUp{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .empty-hint{font-size:13px;color:var(--muted);text-align:center;padding:30px 0}
</style>
<link rel="stylesheet" href="../assets/saizen-ops.css?v=15.14">
</head>
<body data-so-area="pos">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム">
    <img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen">
  </a>
  <span class="step" data-i18n="po_step"></span>
  <a class="navhome" href="../index.html" data-i18n="navHome" style="margin-left:14px"></a>
  <div class="grow so-spacer"></div>
  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>
    </div>
    <button class="so-furi" id="so-furi" onclick="__so_toggleFuri()"></button>
  </div>
  <span class="pill" id="conn-state" data-i18n="connState_none"></span>
</div>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">
  <input class="inp" id="sb-key" type="password" data-i18n-ph="rm_keyPlaceholder" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button" data-i18n="btnConnectShort"></button>
  <span class="hint" data-i18n="st_connHint"></span>
</div>

<div class="toolbar">
  <span class="pill" id="outlet-tag" style="display:none;background:var(--accentSoft);color:var(--accent);border-color:#b4cda0;font-size:13px"></span>
  <label data-i18n="po_dateLabel"></label>
  <button class="btn ghost sm" id="btn-day-prev" type="button" style="padding:5px 9px">◀</button>
  <input class="inp" id="date-pick" type="date">
  <button class="btn ghost sm" id="btn-day-next" type="button" style="padding:5px 9px">▶</button>
  <button class="btn ghost sm" id="btn-today" type="button"></button>
  <button class="btn sm" id="btn-load" type="button" disabled data-i18n="po_btnLoad"></button>
  <button class="btn ghost sm" id="btn-back" type="button" style="display:none" data-i18n="po_btnBack"></button>
  <span class="hint" data-i18n="st_taxHint"></span>
</div>

<div class="wrap">
  <!-- 1단계: 팀 선택 -->
  <div id="team-view">
    <div class="sec-title"><span data-i18n="po_pickTeam"></span> <span class="cnt" id="team-cnt"></span></div>
    <div class="team-search">
      <input class="inp" id="team-q" type="search" data-i18n-ph="po_teamSearch" autocomplete="off">
      <button class="btn" id="btn-qr-scan" type="button" data-i18n="po_qrScan"></button>
      <span class="cnt" id="active-cnt"></span>
    </div>
    <div id="pos-accom" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
    <div id="team-grid">
      <div class="empty-hint" data-i18n="po_emptyTeams"></div>
    </div>
  </div>

  <!-- 2단계: 주문 입력 -->
  <div id="order-view" style="display:none">
    <div class="order-head">
      <div class="ot"><span class="otag" id="oh-tag"></span> <span id="oh-rep"></span></div>
      <div class="orun"><span data-i18n="po_runningTotal"></span> <b id="oh-run">¥0</b></div>
      <button class="btn ghost sm" id="btn-cust-display" type="button" style="margin-left:10px"></button>
    </div>
    <div class="order-stage">
      <div>
        <div class="venue-tabs" id="venue-tabs"></div>
        <div class="menu-grid" id="menu-grid"></div>
      </div>
      <div class="cart">
        <h3 data-i18n="po_cart"></h3>
        <div class="payer" id="payer"></div>
        <div class="cart-body" id="cart-body"><div class="cart-empty" data-i18n="po_cartEmpty"></div></div>
        <div class="cart-foot">
          <div class="tr"><span data-i18n="po_subtotal"></span><span class="v" id="cart-sub">¥0</span></div>
          <div class="tr"><span data-i18n="po_tax"></span><span class="v" id="cart-tax">¥0</span></div>
          <div class="tr grand"><span data-i18n="po_total"></span><span class="v" id="cart-total">¥0</span></div>
          <button class="btn big" id="btn-send" type="button" disabled data-i18n="po_send"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 주문 현황 — 주방 접수/완료를 프론트가 실시간 확인(오늘 전체) -->
<div class="wrap" id="ko-status" style="display:none;margin-top:6px">
  <div class="sec-title" style="display:flex;align-items:center;gap:10px">
    <span id="ko-title"></span>
    <span class="pill" id="ko-meta"></span>
    <button class="btn ghost sm" id="ko-refresh" type="button" style="margin-left:auto">↻</button>
  </div>
  <div id="ko-list"></div>
</div>

<div id="toast"></div>

<!-- 손님 주문 QR 스캔 모달 -->
<div id="qr-modal" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(20,24,18,.55);align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--surface);border-radius:16px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)">
      <b style="font-size:15px;flex:1" data-i18n="po_qrTitle"></b>
      <button class="btn ghost sm" id="qr-close" type="button">✕</button>
    </div>
    <div style="padding:16px 18px">
      <div id="qr-reader" style="width:100%;border-radius:10px;overflow:hidden"></div>
      <div id="qr-status" style="font-size:12.5px;color:var(--text2);margin-top:8px;min-height:18px"></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px" data-i18n="po_qrNoQrHint"></div>
    </div>
  </div>
</div>

<!-- 팀 확인 뷰(수기 선택 시): 대표자·명단 대조로 방번호 오인 → 오과금 방지 -->
<div id="conf-modal" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(20,24,18,.55);align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--surface);border-radius:16px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border)"><b id="conf-title" style="font-size:16px"></b></div>
    <div style="padding:18px 20px">
      <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
        <span id="conf-tag" style="font-family:var(--mono);font-weight:800;font-size:16px;color:var(--accent)"></span>
        <span id="conf-rep" style="font-size:20px;font-weight:800"></span>
      </div>
      <div id="conf-sub" style="font-size:13px;color:var(--text2);margin-top:5px"></div>
      <div style="margin-top:12px">
        <div id="conf-roster-lab" style="font-size:11.5px;font-weight:800;color:var(--text2);margin-bottom:5px"></div>
        <div id="conf-roster" style="font-size:15px;line-height:1.7"></div>
      </div>
      <div id="conf-hint" style="font-size:12px;color:var(--muted);margin-top:12px"></div>
    </div>
    <div style="padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px">
      <button class="btn ghost" id="conf-no" type="button" style="flex:1"></button>

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }

// venue = DB 저장값(영문 키: restaurant/banquet/proshop/front/etc). 저장 유지, 표시만 번역.
const VENUE_TXK={restaurant:'vRestaurant',banquet:'vBanquet',proshop:'vProshop',front:'vFront',etc:'vEtc'};
function venueLabel(v){ const k=VENUE_TXK[v]; return k?tx(k):v; }
// 매장(outlet) = venue 묶음. ?outlet= 로 해당 매장만 노출. 라벨은 언어별, venues 는 DB 키 그대로.
const OUTLETS={
  front:     {labelKey:'oFront',      venues:['front']},
  restaurant:{labelKey:'oRestaurant', venues:['restaurant','banquet']},
  golf:      {labelKey:'oGolf',       venues:['proshop']}
};
function outletLabel(o){ return tx(OUTLETS[o].labelKey); }
const _outletParam=new URLSearchParams(location.search).get('outlet')||'';
let state={ date:'', teams:[], menu:[], venue:'__all__', team:null, folioId:null, runningGross:0, cart:[],
  roster:[], payerMode:'split', payerSel:new Set(), memberFolio:{},
  outlet:(OUTLETS[_outletParam]?_outletParam:null), teamQ:'', activeSeqs:new Set(), members:[], roomsBySeq:{}, accomSel:null };
const ACCOM_ALL=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸'];
const ACCOM_DEFAULT=['야마나미리조트','쿠주힐즈'];   // 기본 = 야마나미쪽(골프텔·호텔·별장·돔하우스)+쿠주힐즈
// 숙소별 색상(시인성) — 카드 좌측 보더·숙소 칩·방번호·섹션 헤더에 공통 적용
const ACCOM_COLOR={'야마나미리조트':'#647548','쿠주힐즈':'#2f7d4f','간지호텔':'#2c5078','시즈노야도 료칸':'#9a5b12'};
function accomColor(a){ return ACCOM_COLOR[a]||'#8b919b'; }
// 이 매장이 다루는 venue 목록(없으면 전 매장)
function outletVenues(){ return state.outlet ? OUTLETS[state.outlet].venues : null; }
// 주문 기록 담당자 = 공유 상단바 담당자(saizen_ops_user). 없으면 폴백.
function opBy(){ return (window.__so_getUser && __so_getUser()) || localStorage.getItem('saizen_op_name') || 'pos'; }

function yen(n){ return '¥'+Number(n||0).toLocaleString('ja-JP'); }
function taxOf(gross){ gross=Number(gross||0); return gross - Math.round(gross/(1+TAX_RATE)); }  // 内税(포함된 소비세)
function isoToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function ymOf(iso){ return String(iso||'').slice(0,7); }
function toast(msg,cls){
  const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:'');
  t.textContent=msg; $('#toast').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);
}
function setConn(txt,cls){const e=$('#conn-state');e.textContent=txt;e.className='pill'+(cls?' '+cls:'');}
// data-i18n(saizen-ops.js) 미사용 정적 요소 — 언어 토글 시 직접 갱신
function applyStatic(){
  const today=$('#btn-today'); if(today){ today.textContent=tx('today'); today.title=tx('backToday'); }
  const dp=$('#btn-day-prev'); if(dp) dp.title=tx('prevDay');
  const dn=$('#btn-day-next'); if(dn) dn.title=tx('nextDay');
  const kt=$('#ko-title'); if(kt) kt.textContent=tx('koTitle');
  const cb=$('#btn-cust-display'); if(cb) cb.title=tx('custOnTitle');
}

// ── 연결 ──
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.textContent=tx('connecting'); btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('menu_items').select('id',{count:'exact',head:true});
    if(error) throw error;
    setConn(tx('connOk'),'ok'); toast(tx('connectedToast'),'ok');
    btn.textContent=tx('connectedBtn'); btn.classList.add('connected'); btn.disabled=false;
    $('#btn-load').disabled=false;
    await loadMenu();
    await loadTeams();
    $('#ko-status').style.display=''; koRefresh(); startKoPoll();
  }catch(e){
    setConn(tx('connFail'),'err');
    toast(tx('connFailToast')(e.message),'err');
    btn.textContent=tx('connFailBtn'); btn.classList.remove('connected'); btn.disabled=false;
    supa=null; $('#btn-load').disabled=true;
  }
}

async function loadMenu(){
  const {data,error}=await supa.from('menu_items').select('*').eq('active',true).order('venue').order('sort_order');
  if(error){toast(tx('menuLoadFail')(error.message),'err');return;}
  state.menu=data||[];
}

// ── 오늘 체크인(체류) 팀 로드 (room.html loadDay 패턴) ──
async function loadTeams(){
  if(!supa){toast(tx('needConn'),'warn');return;}
  const d=$('#date-pick').value||isoToday(); state.date=d; $('#date-pick').value=d;
  const {data,error}=await supa.from('guests')
    .select('event_seq,team_tag,group_code,accom,pax,session_ym,bookings!inner(event_no,rep_name,dep_date,arr_date)')
    .lte('bookings.dep_date',d).gt('bookings.arr_date',d);
  if(error){toast(tx('teamLoadFail')(error.message),'err');return;}
  state.teams=(data||[]).map(x=>({
    event_seq:x.event_seq, team_tag:x.team_tag, group_code:x.group_code, accom:x.accom, pax:x.pax,
    session_ym:x.session_ym||ymOf(d), rep:x.bookings?.rep_name||'', event_no:x.bookings?.event_no||'',
    checkin:(x.bookings?.dep_date||''),
  })).sort((a,b)=>(a.accom||'').localeCompare(b.accom||'')||(a.rep||'').localeCompare(b.rep||''));
  await loadActive();   // 주문중(folio 발생) 팀 표시·우선정렬용
  await loadMembers();  // 일행 이름 검색용
  await loadRooms();    // 방배정 호수(그날 점유) — 표시·검색용
  renderAccomPos();     // 숙소 토글(기본 야마나미+쿠주)
  backToTeams();
  toast(tx('stayToast')(d,state.teams.length),'ok');
}

// 그날 점유 방번호(event_seq → [호수…]) — 방배정 후 POS/검색에 표기
async function loadRooms(){
  state.roomsBySeq={};
  const seqs=state.teams.map(x=>x.event_seq);
  if(!seqs.length||!supa) return;
  const d=state.date;
  let pg=0;
  while(true){
    const {data,error}=await supa.from('rooms').select('event_seq,room_no,check_in,check_out').in('event_seq',seqs).range(pg,pg+999);
    if(error) break;
    (data||[]).forEach(r=>{
      if(r.room_no && r.check_in<=d && d<r.check_out){   // 그날 밤 점유 방만
        const arr=state.roomsBySeq[r.event_seq]=state.roomsBySeq[r.event_seq]||[];
        if(!arr.includes(r.room_no)) arr.push(r.room_no);
      }
    });
    if(!data||data.length<1000) break;
    pg+=1000;
  }
  Object.values(state.roomsBySeq).forEach(a=>a.sort((x,y)=>String(x).localeCompare(String(y),undefined,{numeric:true})));
}
function roomsOf(seq){ return (state.roomsBySeq&&state.roomsBySeq[seq])||[]; }
function roomLabel(seq){ const r=roomsOf(seq); return r.length?(r.join(', ')):''; }

// ── 숙소 토글 칩 (기본 야마나미+쿠주, 전체 토글) ──
function accomPass(accom){ const s=state.accomSel; if(!s||!s.size) return true; return s.has(accom); }
function renderAccomPos(){
  const box=$('#pos-accom'); if(!box) return;
  if(state.accomSel===null) state.accomSel=new Set(ACCOM_DEFAULT);
  const sel=state.accomSel; const allOn=(sel.size===ACCOM_ALL.length);
  const chip=(label,on,key)=>`<button type="button" class="ac-chip" data-k="${key}" style="font-size:13px;font-weight:700;padding:6px 13px;border-radius:99px;cursor:pointer;border:1px solid ${on?'var(--accent)':'var(--border)'};background:${on?'var(--accent)':'var(--surface3)'};color:${on?'#fff':'var(--text2)'}">${label}</button>`;
  box.innerHTML=chip(tx('allVenues'),allOn,'__all')+ACCOM_ALL.map(a=>chip(a,sel.has(a),a)).join('');
  box.querySelectorAll('.ac-chip').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(k==='__all'){ state.accomSel = allOn ? new Set() : new Set(ACCOM_ALL); }
    else { if(sel.has(k)) sel.delete(k); else sel.add(k); state.accomSel=sel; }
    renderAccomPos(); renderTeams();
  }));
}

// 이 날 팀들의 일행 명단(이름 검색·동명이인 구분용) — 1000행 페이지네이션
async function loadMembers(){
  state.members=[];
  const seqs=state.teams.map(x=>x.event_seq);
  if(!seqs.length||!supa) return;
  let pg=0;
  while(true){
    const {data,error}=await supa.from('guest_members')
      .select('id,event_seq,name_kr,name_en,seq_in_team,member_grade,member_class,member_div')
      .in('event_seq',seqs).order('event_seq').order('seq_in_team').range(pg,pg+999);
    if(error) break;
    (data||[]).forEach(m=>state.members.push(m));
    if(!data||data.length<1000) break;
    pg+=1000;
  }
}

// 이번 체류에 이미 주문이 있는(=진행중) 팀 event_seq 집합
async function loadActive(){
  state.activeSeqs=new Set();
  const seqs=state.teams.map(x=>x.event_seq);
  if(!seqs.length||!supa) return;
  try{
    const {data}=await supa.from('v_folio_balance').select('event_seq,gross_total').in('event_seq',seqs);
    (data||[]).forEach(f=>{ if(Number(f.gross_total||0)>0) state.activeSeqs.add(f.event_seq); });
  }catch(e){}
}

function backToTeams(){
  if(custShownSeq!=null) pushCustomerDisplay(null);   // 팀에서 나가면 손님 화면 비움(대기)
  state.team=null; state.folioId=null; state.cart=[];
  $('#order-view').style.display='none';
  $('#team-view').style.display='';
  $('#btn-back').style.display='none';
  renderTeams();
}

// ── 손님 확인 화면(pos_customer.html) 연동 — 이 팀 계산서를 손님 태블릿에 표시 ──
const POS_STATION=new URLSearchParams(location.search).get('station')||'main';
let custShownSeq=null;
async function pushCustomerDisplay(seq){
  if(!supa) return;
  try{
    const {error}=await supa.from('pos_display').upsert(
      {station:POS_STATION, event_seq:seq, updated_by:(window.__so_getUser&&__so_getUser())||null, updated_at:new Date().toISOString()},
      {onConflict:'station'});
    if(error) throw error;
    custShownSeq=seq; updateCustBtn();
    toast(seq?tx('custShown'):tx('custCleared'),'ok');
  }catch(e){ toast(tx('custFail')(e.message),'err'); }
}
function updateCustBtn(){
  const b=$('#btn-cust-display'); if(!b) return;
  const on=!!(state.team && custShownSeq===state.team.event_seq);
  b.textContent = on?tx('custHide'):tx('custShow');
  b.title = tx('custOnTitle');
  b.style.background = on?'var(--accent)':''; b.style.color = on?'#fff':'';
}

function teamBySeq(seq){ return state.teams.find(x=>x.event_seq===seq); }
// 회원 판정은 공유 모듈(saizen-core.js)이 단일 진실원 — 3컬럼 OR(회원 우선) 위임.
function posIsMember(m){ return SZCore.isMember(m); }
function fmtMD(iso){ if(!iso||iso==='-') return '-'; const p=String(iso).slice(0,10).split('-'); return p.length===3?`${+p[1]}/${+p[2]}`:iso; }
function teamCardEl(tm){
  const act=state.activeSeqs.has(tm.event_seq);
  const col=accomColor(tm.accom);
  const room=roomLabel(tm.event_seq);
  const b=document.createElement('button'); b.type='button'; b.className='team-btn'+(act?' active-team':'');
  if(!act) b.style.borderLeftColor=col;   // 숙소색 좌측 보더(주문중은 골드 유지)
  b.innerHTML=`<div class="ttag">${teamTag(tm)}${act?`<span class="tactive">${t('po_active')}</span>`:''}</div>
    <div class="trep">${escP(tm.rep||'')}</div>
    <div class="tmeta"><span class="tac" style="background:${col}1f;color:${col}">${escP(tm.accom||'')}</span> · ${tm.pax}${t('po_cntPpl')} · #${teamNo(tm)}${tm.checkin?` · <span class="tdate">${fmtMD(tm.checkin)} ${t('po_checkin')}</span>`:''}</div>
    ${room?`<div class="troom" style="color:${col}">${room}</div>`:`<div class="tnoroom">${tx('unassigned')}</div>`}`;
  b.addEventListener('click',()=>confirmTeam(tm));   // 수기 선택 → "이 팀 맞습니까?" 확인(오과금 방지)
  return b;
}
function gridOf(arr){ const g=document.createElement('div'); g.className='team-grid'; arr.forEach(tm=>g.appendChild(teamCardEl(tm))); return g; }
function headEl(txt){ const h=document.createElement('div'); h.className='tg-head'; h.textContent=txt; return h; }
// 숙소별 색상 헤더(시인성)
function accomHeadEl(acc, n){ const col=accomColor(acc); const h=document.createElement('div'); h.className='tg-head';
  h.style.color=col; h.style.borderLeft='4px solid '+col; h.style.paddingLeft='9px';
  h.innerHTML=`${escP(acc||'-')} · ${n}${t('po_cntTeam')}`; return h; }

function renderTeams(){
  const box=$('#team-grid'); box.innerHTML='';
  const q=(state.teamQ||'').trim().toLowerCase();
  const ac=$('#active-cnt');
  const pool=state.teams.filter(tm=>accomPass(tm.accom));   // 숙소 토글 필터

  if(q){   // ── 검색: 팀 + 일행(동명이인은 팀으로 구분) ──
    const teamHits=pool
      .filter(tm=>((tm.group_code||'')+' '+(tm.team_tag||'')+' '+(tm.rep||'')+' '+(tm.event_no||'')+' '+(tm.accom||'')+' '+roomsOf(tm.event_seq).join(' ')).toLowerCase().includes(q))
      .slice().sort((a,b)=>(state.activeSeqs.has(b.event_seq)?1:0)-(state.activeSeqs.has(a.event_seq)?1:0));
    const memHits=state.members.filter(m=>{const tm=teamBySeq(m.event_seq);return tm&&accomPass(tm.accom)&&((m.name_kr||'')+' '+(m.name_en||'')).toLowerCase().includes(q);});
    $('#team-cnt').innerHTML=`${t('po_secTeam')} ${teamHits.length} · ${t('po_secMember')} ${memHits.length}`;
    if(ac) ac.textContent='';
    if(!teamHits.length && !memHits.length){ box.innerHTML='<div class="empty-hint">'+t('po_emptyTeams')+'</div>'; return; }
    if(teamHits.length){ box.appendChild(headEl(t('po_secTeam'))); box.appendChild(gridOf(teamHits)); }
    if(memHits.length){
      box.appendChild(headEl(`${t('po_secMember')} · ${t('po_dupHint')}`));
      const wrap=document.createElement('div'); wrap.className='mhit-list';
      memHits.slice(0,80).forEach(m=>{
        const tm=teamBySeq(m.event_seq); if(!tm) return;
        const isMem=posIsMember(m);
        const btn=document.createElement('button'); btn.type='button'; btn.className='mhit';
        btn.innerHTML=`<span class="mh-name">${escP(m.name_kr||m.name_en||'-')}${isMem?`<span class="mh-mem">${tx('member')}</span>`:''}</span>`
          +`<span class="mh-team">${teamTag(tm)} · ${escP(tm.rep||'')} · #${teamNo(tm)}${tm.accom?(' · '+escP(tm.accom)):''}${roomLabel(tm.event_seq)?(' · '+roomLabel(tm.event_seq)):''}</span>`;
        btn.addEventListener('click',()=>confirmTeam(tm));
        wrap.appendChild(btn);
      });
      box.appendChild(wrap);
    }
    return;
  }

  // ── 검색 없음: 숙소별 색상 섹션(섹션 내 = 주문중 우선 → 그룹코드순) ──
  //   POS 응대는 장소 단위라 숙소로 묶고 색 구분. 정렬은 대표자명이 아닌 그룹코드(직원이 태그로 찾음).
  $('#team-cnt').innerHTML=`${pool.length}${t('po_cntTeam')}`;
  if(ac) ac.innerHTML=state.activeSeqs.size?(''+t('po_active')+' '+state.activeSeqs.size):'';
  if(!pool.length){ box.innerHTML='<div class="empty-hint">'+t('po_emptyTeams')+'</div>'; return; }
  const byAccom={};
  pool.forEach(tm=>{ const k=tm.accom||'-'; (byAccom[k]=byAccom[k]||[]).push(tm); });
  const order=ACCOM_ALL.concat(Object.keys(byAccom).filter(k=>ACCOM_ALL.indexOf(k)<0));
  order.forEach(acc=>{ const arr=byAccom[acc]; if(!arr||!arr.length) return;
    arr.sort((a,b)=>((state.activeSeqs.has(b.event_seq)?1:0)-(state.activeSeqs.has(a.event_seq)?1:0))
                    || String(teamTag(a)).localeCompare(String(teamTag(b)),undefined,{numeric:true}));
    box.appendChild(accomHeadEl(acc, arr.length));
    box.appendChild(gridOf(arr));
  });
}
// 팀 라벨 통일: 상단 = 그룹코드, # 뒤 = 행사번호(event_no)
function teamTag(tm){ return tm.group_code||tm.team_tag||tx('teamFallback')(tm.event_seq); }
function teamNo(tm){ return tm.event_no||tm.event_seq; }
function escP(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── 팀 선택 → 주문 뷰 ──
async function selectTeam(tm){
  state.team=tm; state.cart=[]; state.venue='__all__';
  state.folioId=null; state.memberFolio={}; state.payerMode='split'; state.payerSel=new Set();   // 기본=개인 지정 모드(Min)
  // 이 팀의 모든 folio(팀+개인) 누적 = 러닝 합계. 팀/개인 열린 folio id 캐시.
  state.runningGross=0;
  const {data}=await supa.from('v_folio_balance').select('folio_id,gross_total,status,subject,member_id')
    .eq('event_seq',tm.event_seq);
  (data||[]).forEach(f=>{
    state.runningGross+=Number(f.gross_total||0);
    if(f.status==='open' && f.subject==='team' && !state.folioId) state.folioId=f.folio_id;
    if(f.status==='open' && f.subject==='member' && f.member_id) state.memberFolio[f.member_id]=f.folio_id;
  });
  // 개인 분할용 명단(guest_members) 로드
  const {data:gm}=await supa.from('guest_members')
    .select('id,seq_in_team,name_kr,name_en,is_rep,member_grade,member_class,member_div')
    .eq('event_seq',tm.event_seq).order('seq_in_team',{ascending:true});
  state.roster=gm||[];
  $('#team-view').style.display='none';
  $('#order-view').style.display='';
  $('#btn-back').style.display='';
  $('#oh-tag').textContent=teamTag(tm);
  $('#oh-rep').textContent=(tm.rep||'')+'  ·  #'+teamNo(tm);
  $('#oh-run').textContent=yen(state.runningGross);
  renderVenueTabs(); renderMenu(); renderPayer(); renderCart(); updateCustBtn();
}

// ── 결제 주체(payer): 팀 공통 / 개인·N분의1 ──
function renderPayer(){
  const box=$('#payer'); if(!box) return;
  const mode=state.payerMode;
  let h=`<div class="payer-mode">
    <button type="button" class="pm${mode==='split'?' on':''}" data-pm="split">${tx('paySplit')}</button>
    <button type="button" class="pm${mode==='team'?' on':''}" data-pm="team">${tx('payTeam')}</button>
  </div>`;
  if(mode==='split'){
    if(!state.roster.length){
      h+=`<div class="payer-hint">${tx('noRoster')}</div>`;
    } else {
      const chips=state.roster.map(m=>{
        const on=state.payerSel.has(String(m.id));
        const isMem=posIsMember(m);
        return `<button type="button" class="pchip${on?' on':''}" data-mid="${m.id}">`
          +`<span class="pc-top">${m.seq_in_team!=null?m.seq_in_team+'. ':''}${escP(m.name_kr||m.name_en||'-')}`
          +`${isMem?`<span class="mbadge">${tx('member')}</span>`:''}</span>`
          +`${m.name_en&&m.name_kr?`<span class="pc-en">${escP(m.name_en)}</span>`:''}</button>`;
      }).join('');
      const k=state.payerSel.size;
      const hint=k===0?tx('pickPayer'):(k===1?tx('payerOne'):tx('payerN')(k));
      h+=`<div class="payer-roster">${chips}</div>`
        +`<div class="payer-act"><button type="button" id="pa-all">${tx('paAll')}</button><button type="button" id="pa-none">${tx('paNone')}</button></div>`
        +`<div class="payer-hint">${hint}</div>`;
    }
  }
  box.innerHTML=h;
  box.querySelectorAll('[data-pm]').forEach(b=>b.addEventListener('click',()=>{
    state.payerMode=b.dataset.pm; if(state.payerMode==='team') state.payerSel.clear(); renderPayer();
  }));
  box.querySelectorAll('[data-mid]').forEach(b=>b.addEventListener('click',()=>{
    const id=String(b.dataset.mid);
    state.payerSel.has(id)?state.payerSel.delete(id):state.payerSel.add(id); renderPayer();
  }));
  const all=box.querySelector('#pa-all'), none=box.querySelector('#pa-none');
  if(all) all.addEventListener('click',()=>{ state.roster.forEach(m=>state.payerSel.add(String(m.id))); renderPayer(); });
  if(none) none.addEventListener('click',()=>{ state.payerSel.clear(); renderPayer(); });
}

function renderVenueTabs(){
  const box=$('#venue-tabs'); box.innerHTML='';
  const ov=outletVenues();
  // 매장이 지정되면 그 매장 venue만, 아니면 메뉴에 존재하는 전 venue
  let venues=[...new Set(state.menu.map(m=>m.venue||'etc'))];
  if(ov) venues=ov.filter(v=>venues.includes(v));
  // venue 1개뿐이면 탭 숨김(프론트·골프샵 등)
  if(ov && venues.length<=1){ state.venue='__all__'; return; }
  const tabs=[['__all__',t('po_allVenues')]].concat(venues.map(v=>[v,venueLabel(v)]));
  tabs.forEach(([v,label])=>{
    const b=document.createElement('button'); b.type='button';
    b.className='venue-tab'+(state.venue===v?' active':'');
    b.textContent=label;
    b.addEventListener('click',()=>{state.venue=v;renderVenueTabs();renderMenu();});
    box.appendChild(b);
  });
}

const POS_CAT_ORDER=['라운딩','식음','숙박','골프샵','기타'];
// category = DB 저장값(한국어 키, CSS class·정렬에도 사용) — 저장·키 유지, 표시 라벨만 번역
const POS_CATL={ '라운딩':{ja:'ラウンド',en:'Round'}, '식음':{ja:'飲食',en:'F&B'},
  '숙박':{ja:'ルーム',en:'Room'}, '골프샵':{ja:'ゴルフショップ',en:'Pro shop'}, '기타':{ja:'その他',en:'Other'} };
function posCatLabel(c){ const m=POS_CATL[c||'기타']; const lg=lang(); return m?(lg==='ja'?m.ja:(lg==='en'?m.en:c)):(c||'기타'); }
function renderMenu(){
  const box=$('#menu-grid'); box.innerHTML='';
  const ov=outletVenues();
  const list=state.menu.filter(m=>{
    const v=m.venue||'etc';
    if(ov && !ov.includes(v)) return false;               // 이 매장 venue만
    return state.venue==='__all__' || v===state.venue;    // 선택 탭
  });
  if(!list.length){ box.innerHTML='<div class="empty-hint">'+t('po_emptyMenu')+'</div>'; return; }
  // 구분(라인=category)별 섹션 헤더로 묶기
  const byCat={}; list.forEach(m=>{ const c=m.category||'기타'; (byCat[c]=byCat[c]||[]).push(m); });
  const cats=Object.keys(byCat).sort((a,b)=>{const ai=POS_CAT_ORDER.indexOf(a),bi=POS_CAT_ORDER.indexOf(b);return (ai<0?99:ai)-(bi<0?99:bi);});
  const card=(m)=>{
    const b=document.createElement('button'); b.type='button'; b.className='menu-btn';
    b.innerHTML=`<span class="mcat cat-${m.category}"></span>
      ${m.code?`<span class="mcode">${m.code}</span>`:''}
      <div><div class="mja">${m.name_ja||''}</div>${m.name_ko?`<div class="mko">${m.name_ko}</div>`:''}</div>
      <div class="mprice">${Number(m.unit_price)>0?yen(m.unit_price):t('po_manualPrice')}</div>`;
    b.addEventListener('click',()=>addToCart(m));
    return b;
  };
  cats.forEach(c=>{
    const h=document.createElement('div');
    h.style.cssText='grid-column:1/-1;font-size:13px;font-weight:800;color:var(--accent2);padding:6px 2px 2px;border-bottom:1px solid var(--border);margin-top:4px';
    h.textContent=posCatLabel(c);
    box.appendChild(h);
    byCat[c].forEach(m=>box.appendChild(card(m)));
  });
}

// ── 카트 ──
function addToCart(m){
  let price=Number(m.unit_price||0), desc=m.name_ja||m.name_ko||'';
  if(price<=0){ // 기타(수동) — 금액·내역 직접 입력
    const v=prompt(tx('promptAmount'),'');
    if(v===null) return;
    price=Math.round(Number(v)||0);
    if(price<=0){toast(tx('needAmount'),'warn');return;}
    const d=prompt(tx('promptDesc'),desc); if(d) desc=d;
  }
  const key=m.id+'|'+price+'|'+desc;
  const exist=state.cart.find(l=>l.key===key);
  if(exist) exist.qty+=1;
  else { const vv=m.venue||'etc';
    // station: 메뉴 지정값 우선. 단 프론트·골프샵 매점은 주방/바로 보내지 않음(none).
    let st=m.station||'kitchen';
    if(vv==='front'||vv==='proshop') st='none';
    state.cart.push({key, id:m.id, category:m.category, venue:vv, station:st, name_ja:desc, name_ko:(price===Number(m.unit_price)?m.name_ko:''), unit_price:price, qty:1}); }
  renderCart();
}
function changeQty(key,delta){
  const l=state.cart.find(x=>x.key===key); if(!l) return;
  l.qty+=delta; if(l.qty<=0) state.cart=state.cart.filter(x=>x.key!==key);
  renderCart();
}
function removeLine(key){ state.cart=state.cart.filter(x=>x.key!==key); renderCart(); }

function renderCart(){
  const body=$('#cart-body'); body.innerHTML='';
  if(!state.cart.length){ body.innerHTML='<div class="cart-empty">'+t('po_cartEmpty')+'</div>'; }
  else state.cart.forEach(l=>{
    const row=document.createElement('div'); row.className='cart-line';
    row.innerHTML=`<div>
        <div class="cl-name">${l.name_ja}${l.name_ko?` <span style="color:var(--text2);font-weight:400">${l.name_ko}</span>`:''}</div>
        <div class="cl-price">${yen(l.unit_price)} × ${l.qty} = ${yen(l.unit_price*l.qty)}</div>
      </div>
      <div class="qtybox">
        <button class="qbtn" data-minus="${l.key}">−</button>
        <span class="qn">${l.qty}</span>
        <button class="qbtn" data-plus="${l.key}">＋</button>
        <button class="cl-rm" data-rm="${l.key}">✕</button>
      </div>`;
    body.appendChild(row);
  });
  body.querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.minus,-1)));
  body.querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.plus,1)));
  body.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>removeLine(b.dataset.rm)));
  const gross=state.cart.reduce((s,l)=>s+l.unit_price*l.qty,0);   // 메뉴가 합계(税込=최종가)
  const tax=state.cart.reduce((s,l)=>s+taxOf(l.unit_price*l.qty),0);  // 内税(포함분)
  $('#cart-sub').textContent=yen(gross-tax);   // 세전 소계
  $('#cart-tax').textContent=yen(tax);
  $('#cart-total').textContent=yen(gross);     // 합계 = 메뉴가 그대로
  $('#btn-send').disabled=!state.cart.length;
}

// ── 전송: folio 확보 후 charges 적재 ──
async function ensureFolio(){
  if(state.folioId) return state.folioId;
  const tm=state.team;
  // 혹시 동시간대 다른 단말이 이미 열었을 수 있으니 재조회
  const {data:ex}=await supa.from('folios').select('id').eq('event_seq',tm.event_seq)
    .eq('subject','team').eq('status','open').limit(1);
  if(ex&&ex.length){ state.folioId=ex[0].id; return state.folioId; }
  const {data,error}=await supa.from('folios').insert({
    event_seq:tm.event_seq, subject:'team', status:'open', session_ym:tm.session_ym,
    created_by:opBy()
  }).select('id').single();
  if(error) throw error;
  state.folioId=data.id; return state.folioId;
}
// 개인(guest_members.id) 열린 folio 확보(없으면 생성)
async function ensureMemberFolio(memberId){
  memberId=String(memberId);
  if(state.memberFolio[memberId]) return state.memberFolio[memberId];
  const tm=state.team;
  const {data:ex}=await supa.from('folios').select('id')
    .eq('event_seq',tm.event_seq).eq('subject','member').eq('member_id',memberId).eq('status','open').limit(1);
  if(ex&&ex.length){ state.memberFolio[memberId]=ex[0].id; return ex[0].id; }
  const {data,error}=await supa.from('folios').insert({
    event_seq:tm.event_seq, subject:'member', member_id:memberId, status:'open', session_ym:tm.session_ym, created_by:opBy()
  }).select('id').single();
  if(error) throw error;
  state.memberFolio[memberId]=data.id; return data.id;
}
async function sendCart(){
  if(!state.cart.length||!state.team) return;
  $('#btn-send').disabled=true;
  try{
    const by=opBy();
    let rows=[];
    if(state.payerMode==='split'){
      const mids=[...state.payerSel];
      if(!mids.length){ toast(tx('pickPayer'),'warn'); $('#btn-send').disabled=false; return; }
      const folioOf={};
      for(const mid of mids){ folioOf[mid]=await ensureMemberFolio(mid); }
      const k=mids.length;
      state.cart.forEach(l=>{
        const gross=l.unit_price*l.qty;
        if(k===1){
          const mid=mids[0], tax=taxOf(gross);
          rows.push({ folio_id:folioOf[mid], event_seq:state.team.event_seq, member_id:mid,
            category:l.category, source:l.venue, description:l.name_ja+(l.qty>1?` ×${l.qty}`:''),
            qty:l.qty, unit_price:l.unit_price, amount:gross-tax, tax, service_charge:0, source_ref:'menu:'+l.id, created_by:by });
        } else {
          const base=Math.floor(gross/k); let rem=gross-base*k;   // 잔돈은 앞 인원부터 +1엔
          mids.forEach((mid,i)=>{
            const share=base+(i<rem?1:0); if(share<=0) return;
            const tax=taxOf(share);
            rows.push({ folio_id:folioOf[mid], event_seq:state.team.event_seq, member_id:mid,
              category:l.category, source:l.venue, description:l.name_ja+(l.qty>1?` ×${l.qty}`:'')+` (${k}인 분할)`,
              qty:1, unit_price:share, amount:share-tax, tax, service_charge:0, source_ref:'menu:'+l.id, created_by:by });
          });
        }
      });
    } else {
      const folioId=await ensureFolio();
      state.cart.forEach(l=>{
        const gross=l.unit_price*l.qty, tax=taxOf(gross);
        rows.push({ folio_id:folioId, event_seq:state.team.event_seq, member_id:null,
          category:l.category, source:l.venue, description:l.name_ja+(l.qty>1?` ×${l.qty}`:''),
          qty:l.qty, unit_price:l.unit_price, amount:gross-tax, tax, service_charge:0, source_ref:'menu:'+l.id, created_by:by });
      });
    }
    const {error}=await supa.from('charges').insert(rows);
    if(error) throw error;
    // 주방(kitchen)·바(bar)행 모두 KDS 티켓 발행(none=매점은 미발행).
    //  주방 화면=kitchen만 / 바·프론트 화면=kitchen+bar 전부. 조리는 분할 무관 풀 수량(팀 단위).
    const tickets=state.cart.filter(l=>l.station==='kitchen'||l.station==='bar').map(l=>({
      folio_id:state.folioId||null, event_seq:state.team.event_seq, team_tag:teamTag(state.team),
      station:l.station, item_name:l.name_ja, qty:l.qty, created_by:by }));
    if(tickets.length){
      const {error:te}=await supa.from('kitchen_tickets').insert(tickets);
      if(te) toast(tx('ticketFail')(te.message),'warn');
    }
    const total=rows.reduce((s,r)=>s+r.amount+r.tax,0);
    const who=state.payerMode==='split'?tx('splitN')(state.payerSel.size):tx('payTeam');
    toast(tx('sendToast')(teamTag(state.team),who,state.cart.length,yen(total),tickets.length),'ok');
    state.runningGross+=total; $('#oh-run').textContent=yen(state.runningGross);
    state.cart=[]; renderCart();
    if(tickets.length) koRefresh();   // 방금 보낸 주문이 현황에 바로 뜨도록
  }catch(e){
    toast(tx('sendFail')(e.message),'err'); $('#btn-send').disabled=false;
  }
}

// ── 주문 현황(주방 접수/완료 확인) — 오늘 전체, 폴링 ──
let koTimer=null;
function startKoPoll(){ stopKoPoll(); koTimer=setInterval(koRefresh,7000); }
function stopKoPoll(){ if(koTimer){clearInterval(koTimer);koTimer=null;} }
async function koRefresh(){
  if(!supa) return;
  const {data,error}=await supa.from('kitchen_tickets').select('*')
    .gte('created_at', isoToday()+'T00:00:00').order('created_at',{ascending:true});
  if(error) return;
  koRender(data||[]);
}
function koBadge(st){
  if(st==='accepted') return `<span class="pill" style="background:var(--accent2);color:#fff;border-color:var(--accent2)">${t('ki_cooking')}</span>`;
  if(st==='done')     return `<span class="pill ok">✓ ${t('ki_done')}</span>`;
  return `<span class="pill" style="background:#f6e8c8;color:#7a5a16;border-color:#e6d3a3">${t('ki_waiting')}</span>`;
}
function koRender(rows){
  const list=$('#ko-list');
  if(!rows.length){ list.innerHTML='<div class="empty-hint" style="padding:10px">'+t('ki_empty')+'</div>'; $('#ko-meta').textContent=''; return; }
  const nNew=rows.filter(r=>r.status==='new').length, nAcc=rows.filter(r=>r.status==='accepted').length;
  $('#ko-meta').innerHTML=`${t('ki_waiting')} ${nNew} · ${nAcc}`;
  const groups={};
  rows.forEach(r=>{ const tm=teamBySeq(r.event_seq); const k=r.team_tag||('#'+((tm&&tm.event_no)||r.event_seq)); (groups[k]=groups[k]||[]).push(r); });
  let html='';
  Object.keys(groups).forEach(team=>{
    html+=`<div style="margin:8px 0;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)">
      <div style="font-weight:800;color:var(--accent);font-family:var(--mono);margin-bottom:5px">${team}</div>`;
    groups[team].forEach(r=>{
      html+=`<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px">
        <span style="flex:1">${r.item_name} <b style="color:var(--accent2)">×${Number(r.qty)}</b></span>${koBadge(r.status)}</div>`;
    });
    html+='</div>';
  });
  list.innerHTML=html;
}

// 매장 고정 표시(?outlet=) — 지정 시 그 매장만, 미지정이면 전 매장(기존 동작)
function applyOutlet(){
  const tag=$('#outlet-tag'); if(!tag) return;
  if(state.outlet){ const lbl=outletLabel(state.outlet); tag.textContent=lbl; tag.style.display='';
    try{ document.title='POS · '+lbl; }catch(e){} }
  else tag.style.display='none';
}

// ── 팀 확인 뷰(수기 선택 시) — 대표자·명단 대조로 방번호 오인 → 오과금 방지 ──
//   QR 스캔은 기계가 정확히 특정하므로 확인 생략, 검색/명단 클릭 등 사람이 고른 경우만 확인.
let _confTm=null;
function confirmTeam(tm){
  _confTm=tm;
  const roster=state.members.filter(m=>m.event_seq===tm.event_seq).map(m=>(m.name_kr||m.name_en||'').trim()).filter(Boolean);
  const room=roomLabel(tm.event_seq);
  $('#conf-title').textContent=tx('confTitle');
  $('#conf-tag').textContent=teamTag(tm);
  $('#conf-rep').textContent=(tm.rep||'')+tx('confHonor');
  $('#conf-sub').textContent=[tm.accom||'', tm.pax+tx('confPplUnit'), room||tx('unassigned'), '#'+teamNo(tm)].filter(Boolean).join(' · ');
  $('#conf-roster-lab').textContent=tx('confRoster');
  $('#conf-roster').textContent=roster.length?roster.join(' · '):'-';
  $('#conf-hint').textContent=tx('confHint');
  $('#conf-no').textContent=tx('confNo');
  $('#conf-yes').textContent=tx('confYes');
  $('#conf-modal').style.display='flex';
}
function closeConfirm(){ $('#conf-modal').style.display='none'; _confTm=null; }

// ── 손님 주문 QR 스캔 → 그 팀 자동 선택 ──
let _qr=null;
function qrStatus(msg){ const el=$('#qr-status'); if(el) el.textContent=msg||''; }
async function openScan(){
  if(!supa){ toast(tx('needConn'),'warn'); return; }
  $('#qr-modal').style.display='flex';
  $('#qr-manual-in').value=''; qrStatus(tx('qrScanning'));
  try{
    if(!window.Html5Qrcode) throw new Error('lib');
    _qr=new Html5Qrcode('qr-reader');
    await _qr.start({facingMode:'environment'}, {fps:10, qrbox:{width:220,height:220}},
      (decoded)=>{ scanResolve(decoded); },  // 성공 콜백
      ()=>{});                               // 프레임 실패는 무시
  }catch(e){ _qr=null; qrStatus(tx('qrOpenFail')); }   // 카메라 불가 → 수기입력 안내
}
async function stopScan(){
  if(_qr){ try{ await _qr.stop(); }catch(_){} try{ _qr.clear(); }catch(_){} _qr=null; }
}
async function closeScan(){ await stopScan(); $('#qr-modal').style.display='none'; }
// raw = 카메라가 읽은 QR 토큰. 정확일치하는 팀을 즉시 선택(기계 판별이라 확인 생략).
//  ※QR이 없으면 이 모달을 쓰지 않고, 팀 검색창에 태그코드/그룹코드/대표자를 입력하면 됩니다(검색이 이미 매칭).
async function scanResolve(raw){
  const token=String(raw||'').trim(); if(!token) return;
  await stopScan();   // 한 번 인식하면 카메라 정지(중복 방지)
  try{
    const {data,error}=await supa.from('order_tokens').select('event_seq').eq('token',token).limit(1);
    if(error) throw error;
    if(!data||!data.length){ qrStatus(tx('qrNoMatch')); return; }
    const seq=data[0].event_seq;
    let tm=state.teams.find(t=>t.event_seq===seq);
    if(!tm){   // 그날 목록에 없으면(다른 날짜 보기 등) 그 팀 직접 조회
      const {data:g}=await supa.from('guests')
        .select('event_seq,team_tag,group_code,accom,pax,session_ym,bookings!inner(event_no,rep_name,dep_date,arr_date)')
        .eq('event_seq',seq).limit(1);
      if(g&&g.length){ const x=g[0]; tm={event_seq:x.event_seq,team_tag:x.team_tag,group_code:x.group_code,accom:x.accom,pax:x.pax,
        session_ym:x.session_ym||ymOf(state.date||isoToday()),rep:x.bookings?.rep_name||'',event_no:x.bookings?.event_no||'',checkin:x.bookings?.dep_date||''}; }
    }
    if(!tm){ qrStatus(tx('qrTeamGone')); return; }
    $('#qr-modal').style.display='none';
    toast(tx('qrMatched')(tm.team_tag||tm.group_code||('#'+tm.event_no)),'ok');
    selectTeam(tm);
  }catch(e){ qrStatus(tx('qrNoMatch')); }
}

// ── 부팅 ──
$('#btn-connect').addEventListener('click',connect);
$('#btn-load').addEventListener('click',loadTeams);
$('#btn-qr-scan').addEventListener('click',openScan);
$('#qr-close').addEventListener('click',closeScan);
$('#qr-modal').addEventListener('click',e=>{ if(e.target.id==='qr-modal') closeScan(); });
$('#conf-yes').addEventListener('click',()=>{ const tm=_confTm; $('#conf-modal').style.display='none'; _confTm=null; if(tm) selectTeam(tm); });
$('#conf-no').addEventListener('click',closeConfirm);
$('#conf-modal').addEventListener('click',e=>{ if(e.target.id==='conf-modal') closeConfirm(); });
// 날짜 이동(◀▶·오늘) — 기본은 오늘, 백데이트/사전 조회용
function shiftPosDay(delta){
  const cur=$('#date-pick').value||isoToday();
  const d=new Date(cur+'T00:00:00'); d.setDate(d.getDate()+delta);
  $('#date-pick').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if(supa) loadTeams();
}
$('#btn-day-prev').addEventListener('click',()=>shiftPosDay(-1));
$('#btn-day-next').addEventListener('click',()=>shiftPosDay(1));
$('#btn-today').addEventListener('click',()=>{ $('#date-pick').value=isoToday(); if(supa) loadTeams(); });
$('#date-pick').addEventListener('change',()=>{ if(supa) loadTeams(); });
$('#btn-back').addEventListener('click',backToTeams);
$('#btn-cust-display').addEventListener('click',()=>{
  if(!state.team) return;
  const on=custShownSeq===state.team.event_seq;
  pushCustomerDisplay(on?null:state.team.event_seq);
});
$('#team-q') && $('#team-q').addEventListener('input',e=>{ state.teamQ=e.target.value; renderTeams(); });
$('#btn-send').addEventListener('click',sendCart);
$('#ko-refresh').addEventListener('click',koRefresh);
$('#date-pick').value=isoToday();
applyStatic();
applyOutlet();
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }   // 진입 시 자동 연결

window.onSaizenLangChange=function(){
  try{
    applyStatic(); applyOutlet();
    if(state.team){ renderVenueTabs(); renderMenu(); renderPayer(); renderCart(); updateCustBtn(); }
    else { if(state.teams.length) renderAccomPos(); renderTeams(); }
    if(supa) koRefresh();
  }catch(e){}
};
</script>
