<!-- ============================================================================
  안내 모니터 관리 (monitors.html) — 2026-10-26
  · Min 「모니터는 2대(1층·2층 엘리베이터 앞), 추후 추가 가능 · 둘 다 같은 정보도, 다른 내용도」
        「안내 모니터가 다 나뉘어 있는데 하나의 카드에 들어가서 거기 안에서 모니터를 관리하는 게 낫지 않아?」
  · 랜딩의 모니터 카드 5장(로비·디지털 월·코스·2층 석식·직원용) → 이 화면 1장. 모니터(설치 장소)마다 화면 종류·테마·글자 배율·전환 초·보일 화면을 정한다.
  · TV 는 모니터마다 주소 하나(signage.html?monitor=<id>)를 한 번만 연다 — 여기서 [저장]하면 TV 가 60초 안에 설정을 다시 읽어 스스로 바뀐다(SQL 150 signage_monitors).
  · 권한: signage 영역(<body data-so-area="signage">). 읽기는 anon 포함(TV), 쓰기는 signage 영역.
============================================================================ -->

    theme:'Theme', th_auto:'Auto (light 06–17 / dark 18–05)', th_light:'Light', th_dark:'Dark', scale:'Text scale', def:'default', rot:'Rotation (seconds, default 20)', cut:'Switch to tomorrow at', cutDef:'Default (dinner 21:00 · course/wall 17:00)',
    panes:'Panes to show (ticked only · none ticked = all)', p_welcome:'Welcome (today’s check-ins)', p_course:'Today’s rounds', p_depart:'Departures', p_dsum:'Dinner', p_promo:'Resort info (bath · promos)', p_weather:'Weather', p_notice:'Notices', p_wmeal:'Today’s meals',
    enabled:'Enabled', open:'Open on TV ↗', copy:'Copy URL', copied:'TV URL copied', urlLbl:'TV URL', save:'Save', saved:'Saved — the TV switches within a minute', del:'Delete',
    delConfirm:n=>`Delete “${n}”? That TV will no longer find its settings and show “preparing”.`, deleted:'Deleted', preview:'Preview (same as the TV)', reload:'Refresh', sameAs:'Same as another monitor…', sameDone:'Settings copied — press [Save]',
    updAt:(d,u)=>`Updated ${d}${u?' · '+u:''}`, loading:'Loading…', empty:'No monitors yet. Use “Add monitor”.', loadFail:'Load failed', saveFail:'Save failed', addDone:'Monitor added — open the URL on the TV',
    idBad:'ID: 2–24 lowercase letters, digits, - or _ (must start with a letter or digit)', idDup:'A monitor with this ID already exists', nameNeed:'Enter a name', off:'Disabled (the TV shows “preparing”)' }
};
function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k,...a){ const d=L[lang()]||L.ja; let v=(d[k]!==undefined)?d[k]:L.ja[k]; if(typeof v==='function') v=v(...a); return v===undefined?k:v; }
function applyStatic(){
  ['step','connHint','title','desc','tip','addTitle','idLbl','nameKo','nameJa','place','screen'].forEach(k=>{ const e=$('#t-'+k); if(e) e.textContent=tx(k); });
  $('#btn-add').textContent=tx('add'); $('#btn-create').textContent=tx('create'); $('#btn-cancel').textContent=tx('cancel');
  const cur=$('#a-screen').value; $('#a-screen').innerHTML=SCREENS.map(s=>`<option value="${s}">${esc(tx('scr_'+s))}</option>`).join(''); if(cur) $('#a-screen').value=cur;
}
window.onSaizenLangChange=function(){ applyStatic(); if(MONS.length) render(); };

// ── 공통 ──
function setConn(t,c){ const e=$('#conn-state'); if(e){ e.textContent=t; e.className='pill'+(c?' '+c:''); } }
function toast(msg,cls){ const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:''); t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); },2600); }
function who(){ try{ return (window.__so_getUser&&__so_getUser())||null; }catch(e){ return null; } }
function monName(m){ return (lang()==='ja'?(m.name_ja||m.name_ko):(m.name_ko||m.name_ja))||m.id; }
function tvUrl(id){ return 'signage.html?monitor='+encodeURIComponent(id); }
function absUrl(id){ try{ return new URL(tvUrl(id),location.href).href; }catch(e){ return tvUrl(id); } }
function fmtDT(iso){ const d=new Date(iso); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function paneKeys(screen){ return PANE_KEYS[screen]||[]; }
function paneSel(p){ const v=p&&p.panes; return Array.isArray(v)?v:String(v||'').split(',').map(s=>s.trim()).filter(Boolean); }
function rotOn(screen){ return screen==='lobby'||screen==='wall'; }

// ── 렌더 ──
function panesHTML(screen,p){ const sel=paneSel(p); return paneKeys(screen).map(k=>`<label><input type="checkbox" class="f-pane" value="${k}" ${(!sel.length||sel.includes(k))?'checked':''}> ${esc(tx('p_'+k))}</label>`).join(''); }
function cardHTML(m){
  const p=(m.params&&typeof m.params==='object')?m.params:{}; const on=rotOn(m.screen);
  return `<section class="mon ${m.enabled===false?'off':''}" data-id="${esc(m.id)}">
    <header>
      <span class="mid">${esc(m.id)}</span>
      <input class="inp f-name_ko" placeholder="${esc(tx('nameKo'))}" value="${esc(m.name_ko||'')}" autocomplete="off">
      <input class="inp f-name_ja" placeholder="${esc(tx('nameJa'))}" value="${esc(m.name_ja||'')}" autocomplete="off">
      <input class="inp sm f-place" placeholder="${esc(tx('place'))}" value="${esc(m.place||'')}" autocomplete="off">
      <label class="sw"><input type="checkbox" class="f-enabled" ${m.enabled!==false?'checked':''}> ${esc(tx('enabled'))}</label>
      <span class="grow"></span>
      <a class="btn ghost sm b-open" href="${esc(tvUrl(m.id))}" target="_blank" rel="noopener">${esc(tx('open'))}</a>
      <button class="btn ghost sm b-copy" type="button">${esc(tx('copy'))}</button>
    </header>
    <div class="url"><b>${esc(tx('urlLbl'))}</b>${esc(absUrl(m.id))}${m.enabled===false?` · <span style="color:var(--err)">${esc(tx('off'))}</span>`:''}</div>
    <div class="body">
      <div class="form">
        <label>${esc(tx('screen'))}<select class="inp f-screen">${SCREENS.map(s=>`<option value="${s}" ${m.screen===s?'selected':''}>${esc(tx('scr_'+s))}</option>`).join('')}</select></label>
        <div class="row3">
          <label>${esc(tx('theme'))}<select class="inp f-theme">${['auto','light','dark'].map(v=>`<option value="${v}" ${(p.theme||'auto')===v?'selected':''}>${esc(tx('th_'+v))}</option>`).join('')}</select></label>
          <label>${esc(tx('scale'))}<select class="inp f-scale">${SCALES.map(v=>`<option value="${v}" ${String(p.scale||'1')===v?'selected':''}>${v==='1'?'1.0 ('+esc(tx('def'))+')':v}</option>`).join('')}</select></label>
          <label class="only-rot" ${on?'':'hidden'}>${esc(tx('rot'))}<input class="inp f-rot" type="number" min="8" max="120" value="${esc(p.rot||'')}" placeholder="20"></label>
          <label>${esc(tx('cut'))}<select class="inp f-cut"><option value="">${esc(tx('cutDef'))}</option>${Array.from({length:24},(_,h)=>`<option value="${h}" ${(p.cut!==undefined&&p.cut!==null&&String(p.cut)===String(h))?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></label>
        </div>
        <fieldset class="panes only-rot" ${on?'':'hidden'}><legend>${esc(tx('panes'))}</legend>${panesHTML(m.screen,p)}</fieldset>
        <div class="acts">
          <select class="inp f-same"><option value="">${esc(tx('sameAs'))}</option>${MONS.filter(o=>o.id!==m.id).map(o=>`<option value="${esc(o.id)}">${esc(monName(o))}</option>`).join('')}</select>
          <button class="btn b-save" type="button">${esc(tx('save'))}</button>
          <button class="btn ghost b-del" type="button">${esc(tx('del'))}</button>
          <span class="hint f-upd">${m.updated_at?esc(tx('updAt',fmtDT(m.updated_at),m.updated_by||'')):''}</span>
        </div>
      </div>
      <div class="prev"><div class="pv-h"><span>${esc(tx('preview'))}</span><button class="btn xs ghost b-reload" type="button">${esc(tx('reload'))}</button></div><div class="frame"><iframe src="${esc(tvUrl(m.id))}" loading="lazy" title="${esc(monName(m))}"></iframe></div></div>
    </div>
  </section>`;
}
function render(){ $('#list').innerHTML=MONS.length?MONS.map(cardHTML).join(''):`<div class="empty">${esc(tx('empty'))}</div>`; }
function onScreenChange(sec){ const screen=sec.querySelector('.f-screen').value, on=rotOn(screen);
  sec.querySelectorAll('.only-rot').forEach(e=>{ e.hidden=!on; });
  const fs=sec.querySelector('.panes'); const keep=[...sec.querySelectorAll('.f-pane')].filter(c=>c.checked).map(c=>c.value);
  fs.innerHTML=`<legend>${esc(tx('panes'))}</legend>`+panesHTML(screen,{panes:keep.filter(k=>paneKeys(screen).includes(k))}); }
function reloadFrame(sec){ const f=sec.querySelector('iframe'); if(f){ const u=f.getAttribute('src').split('&_r=')[0]; f.setAttribute('src',u+'&_r='+Date.now()); } }

// ── 저장·추가·삭제 ──
function readForm(sec,m){
  const screen=sec.querySelector('.f-screen').value, params={};
  const th=sec.querySelector('.f-theme').value; if(th&&th!=='auto') params.theme=th;
  const sc=sec.querySelector('.f-scale').value; if(sc&&sc!=='1') params.scale=sc;
  const rot=parseInt(sec.querySelector('.f-rot').value,10); if(rotOn(screen)&&rot&&rot!==20) params.rot=rot;
  const cut=sec.querySelector('.f-cut').value; if(cut!=='') params.cut=parseInt(cut,10);
  if(rotOn(screen)){ const all=[...sec.querySelectorAll('.f-pane')], on=all.filter(c=>c.checked).map(c=>c.value); if(on.length&&on.length<all.length) params.panes=on.join(','); }
  return { id:m.id, name_ko:sec.querySelector('.f-name_ko').value.trim(), name_ja:sec.querySelector('.f-name_ja').value.trim(), place:sec.querySelector('.f-place').value.trim(),
    screen, params, enabled:sec.querySelector('.f-enabled').checked, sort:m.sort||0, updated_by:who() };
}
function diffOf(a,b){ const d={}; ['name_ko','name_ja','place','screen','enabled'].forEach(k=>{ if(String(a[k]==null?'':a[k])!==String(b[k]==null?'':b[k])) d[k]={from:a[k],to:b[k]}; });
  const pa=JSON.stringify(a.params||{}), pb=JSON.stringify(b.params||{}); if(pa!==pb) d.params={from:a.params||{},to:b.params||{}}; return d; }
async function logChange(id,action,label,changes){ try{ await supa.from('change_log').insert({entity:'signage_monitor',entity_id:id,action,label,changes:changes||null,changed_by:who()}); }catch(e){} }
async function saveCard(sec){
  const m=MONS.find(x=>x.id===sec.dataset.id); if(!m) return; const row=readForm(sec,m);
  if(!row.name_ko&&!row.name_ja){ toast(tx('nameNeed'),'warn'); return; }
  const btn=sec.querySelector('.b-save'); btn.disabled=true;
  try{ const {error}=await supa.from('signage_monitors').upsert(row,{onConflict:'id'}); if(error) throw error;
    const diff=diffOf(m,row); Object.assign(m,row,{updated_at:new Date().toISOString()}); if(Object.keys(diff).length) logChange(m.id,'update',monName(m),diff);
    toast(tx('saved'),'ok'); sec.querySelector('.f-upd').textContent=tx('updAt',fmtDT(m.updated_at),m.updated_by||''); sec.classList.toggle('off',m.enabled===false);
    sec.querySelector('.url').innerHTML=`<b>${esc(tx('urlLbl'))}</b>${esc(absUrl(m.id))}${m.enabled===false?` · <span style="color:var(--err)">${esc(tx('off'))}</span>`:''}`; reloadFrame(sec);
  }catch(e){ toast(tx('saveFail')+': '+(e&&e.message||e),'err'); }
  btn.disabled=false;
}
async function delCard(sec){
  const m=MONS.find(x=>x.id===sec.dataset.id); if(!m) return; if(!confirm(tx('delConfirm',monName(m)))) return;
  try{ const {error}=await supa.from('signage_monitors').delete().eq('id',m.id); if(error) throw error;
    MONS=MONS.filter(x=>x.id!==m.id); logChange(m.id,'delete',monName(m),null); render(); toast(tx('deleted'),'ok');
  }catch(e){ toast(tx('saveFail')+': '+(e&&e.message||e),'err'); }
}
function copyFrom(sec,srcId){ const s=MONS.find(x=>x.id===srcId); if(!s) return; const p=(s.params&&typeof s.params==='object')?s.params:{};
  sec.querySelector('.f-screen').value=s.screen; onScreenChange(sec);
  sec.querySelector('.f-theme').value=p.theme||'auto'; sec.querySelector('.f-scale').value=String(p.scale||'1'); sec.querySelector('.f-rot').value=p.rot||'';
  sec.querySelector('.f-cut').value=(p.cut===undefined||p.cut===null)?'':String(p.cut);
  const sel=paneSel(p); sec.querySelectorAll('.f-pane').forEach(c=>{ c.checked=!sel.length||sel.includes(c.value); });
  toast(tx('sameDone'),'ok'); }
async function copyUrl(sec){ const u=absUrl(sec.dataset.id); try{ await navigator.clipboard.writeText(u); toast(tx('copied'),'ok'); }catch(e){ prompt(tx('urlLbl'),u); } }
async function addMonitor(){
  const id=$('#a-id').value.trim().toLowerCase();
  if(!/^[a-z0-9][a-z0-9_-]{1,23}$/.test(id)){ toast(tx('idBad'),'warn'); return; }
  if(MONS.some(m=>m.id===id)){ toast(tx('idDup'),'warn'); return; }
  const row={ id, name_ko:$('#a-name_ko').value.trim(), name_ja:$('#a-name_ja').value.trim(), place:$('#a-place').value.trim(), screen:$('#a-screen').value||'lobby', params:{}, enabled:true,
    sort:Math.max(0,...MONS.map(m=>m.sort||0))+1, updated_by:who() };
  if(!row.name_ko&&!row.name_ja){ toast(tx('nameNeed'),'warn'); return; }
  try{ const {error}=await supa.from('signage_monitors').insert(row); if(error) throw error;
    MONS.push({...row,updated_at:new Date().toISOString()}); logChange(id,'insert',monName(row),null);
    $('#add-box').hidden=true; ['a-id','a-name_ko','a-name_ja','a-place'].forEach(i=>{ $('#'+i).value=''; }); render(); toast(tx('addDone'),'ok');
  }catch(e){ toast(tx('saveFail')+': '+(e&&e.message||e),'err'); }
}

// ── 이벤트(위임) ──
$('#list').addEventListener('click',e=>{ const sec=e.target.closest('.mon'); if(!sec) return;
  if(e.target.closest('.b-save')) saveCard(sec); else if(e.target.closest('.b-del')) delCard(sec); else if(e.target.closest('.b-copy')) copyUrl(sec); else if(e.target.closest('.b-reload')) reloadFrame(sec); });
$('#list').addEventListener('change',e=>{ const sec=e.target.closest('.mon'); if(!sec) return;
  if(e.target.classList.contains('f-screen')) onScreenChange(sec); else if(e.target.classList.contains('f-same')){ if(e.target.value) copyFrom(sec,e.target.value); e.target.value=''; } });
$('#btn-add').addEventListener('click',()=>{ $('#add-box').hidden=!$('#add-box').hidden; if(!$('#add-box').hidden) $('#a-id').focus(); });
$('#btn-cancel').addEventListener('click',()=>{ $('#add-box').hidden=true; });
$('#btn-create').addEventListener('click',addMonitor);

// ── 로드·연결 ──
async function load(){ $('#list').innerHTML=`<div class="hint">${esc(tx('loading'))}</div>`;
  try{ const {data,error}=await supa.from('signage_monitors').select('*').order('sort').order('id'); if(error) throw error; MONS=data||[]; render(); }
  catch(e){ toast(tx('loadFail')+': '+(e&&e.message||e),'err'); $('#list').innerHTML=''; } }
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn('URL·key 필요','err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.textContent='연결 중…'; btn.classList.remove('connected');
  try{
    supa=window.supabase.createClient(url,key);
    const { error }=await supa.from('signage_monitors').select('id',{count:'exact',head:true});
    if(error) throw error;
    setConn('연결됨','ok'); btn.textContent='✓ 연결됨'; btn.classList.add('connected'); btn.disabled=false;
    await load();
  }catch(e){
    setConn('연결 실패','err'); toast('연결 실패: '+e.message,'err');
    btn.textContent='연결 실패 · 재시도'; btn.classList.remove('connected'); btn.disabled=false; supa=null;
  }
}
$('#btn-connect').addEventListener('click',connect);
applyStatic(); loadCreds();
if($('#sb-url').value && $('#sb-key').value) connect();
</script>
</body>
</html>
