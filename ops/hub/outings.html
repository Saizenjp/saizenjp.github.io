  · Min 「어느 날 라운딩을 하지 않고 쇼핑이나 다른 안내 — 전체가 아니라 신청자만」「팀의 개인들만 신청도(한 명·두 명, 나머지는 라운딩) → 코스 배정표 연동」
  · 날짜별 행사 등록 → 그날 묵는 팀 명단에서 사람을 체크해 신청 → DB 트리거(SQL 152)가 golf_absentees 에 불참을 넣어 코스 배정표·손님 코스 화면에서 자동 제외.
  · 로비(1층·2층)·디지털 월 로테이션 「오늘의 안내 · 신청 행사」 는 signage.html 이 outings 표를 직접 읽는다(anon 읽기, 이름 없음).
  · 권한: 프론트 데스크 카드(<body data-so-area="frontdesk">). 쓰기 RLS = front·golf.
============================================================================ -->

<style>

  :root{

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;

  .btn.xs{font-size:12px;padding:3px 9px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}

  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  .sum{font-size:12.5px;color:var(--text2);font-weight:700;margin-left:auto}

  .empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border2);border-radius:10px}

  .oc .m b{font-family:var(--mono);color:var(--text)}

  .oc .st{display:flex;gap:4px} .oc .st button{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer}

  .oc .st button.on[data-st="cancelled"]{background:var(--err);border-color:var(--err)}
  .oc .note{font-size:12px;color:var(--text2);margin-top:4px;white-space:pre-wrap}

  .frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .frm label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--text2)}
  .frm label .inp{font-weight:600;color:var(--text)} .frm .wide{grid-column:1/-1}
  .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}

  .team .tag{font-family:var(--mono);font-weight:800;color:var(--accent2)} .team .rep{font-weight:800} .team .acc{font-size:11.5px;color:var(--muted)}

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k,...a){ const d=L[lang()]||L.ja; let v=(d[k]!==undefined)?d[k]:L.ja[k]; if(typeof v==='function') return a.length?v(...a):v; return v===undefined?k:v; }   // 함수 키는 인자 없이 부르면 함수 자체(tx('cnt',n,c) 꼴)
function applyStatic(){
  ['step','connHint','desc','golfNote','date','kind','meet','ret','titleKo','titleJa','place','cap','fee','vehicle','noteKo','noteJa','outings','signups'].forEach(k=>{ const e=$('#t-'+k); if(e) e.textContent=tx(k); });

  const cur=$('#e-kind').value; $('#e-kind').innerHTML=KINDS.map(k=>`<option value="${k}">${esc(tx('k_'+k))}</option>`).join(''); if(cur) $('#e-kind').value=cur;
  $('#e-title').textContent=EDIT&&EDIT.id?tx('edit'):tx('newT');
}

// ── 공통 ──
function setConn(t,c){ const e=$('#conn-state'); if(e){ e.textContent=t; e.className='pill'+(c?' '+c:''); } }
function toast(msg,cls){ const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:''); t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); },2600); }
function who(){ try{ return (window.__so_getUser&&__so_getUser())||null; }catch(e){ return null; } }
const pad2=n=>String(n).padStart(2,'0');
function today(){ const n=new Date(); return n.getFullYear()+'-'+pad2(n.getMonth()+1)+'-'+pad2(n.getDate()); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function hm(v){ const m=String(v||'').match(/(\d{1,2}):(\d{2})/); return m?pad2(m[1])+':'+m[2]:''; }
function titleOf(o){ return (lang()==='ja'?(o.title_ja||o.title_ko):(o.title_ko||o.title_ja))||tx('k_'+(o.kind||'other')); }
function yen(v){ return '¥'+Number(v||0).toLocaleString('ja-JP'); }
function fmtDT(iso){ const d=new Date(iso); if(isNaN(d)) return ''; return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
async function logChange(id,action,label,changes){ try{ await supa.from('change_log').insert({entity:'outing',entity_id:String(id),action,label,changes:changes||null,changed_by:who()}); }catch(e){} }
async function fetchIn(table, sel, col, ids, chunk){ let out=[]; for(let i=0;i<ids.length;i+=(chunk||200)){ const {data,error}=await supa.from(table).select(sel).in(col,ids.slice(i,i+(chunk||200))); if(error) throw error; out=out.concat(data||[]); } return out; }

// ── 로드 ──
async function load(){
  if(!supa||!D) return;
  $('#olist').innerHTML=`<div class="hint">${esc(tx('loading'))}</div>`;
  try{
    const {data:os,error}=await supa.from('outings').select('*').eq('outing_date',D).order('meet_time',{nullsFirst:false}).order('id'); if(error) throw error;
    OUTS=os||[];
    const ids=OUTS.map(o=>o.id);
    SIGN=ids.length?await fetchIn('outing_signups','outing_id,member_id,event_seq,note,signed_by,signed_at','outing_id',ids):[];
    await loadStay();
    const mids=[...new Set(SIGN.map(s=>s.member_id))].filter(id=>!memberById(id));   // 묵는 팀 명단에 없는 사람(날짜가 바뀐 행사 등)은 따로 읽는다
    if(mids.length){ const extra=await fetchIn('guest_members','id,event_seq,name_kr,name_en,seq_in_team,is_rep,member_grade,member_class,member_div','id',mids); extra.forEach(m=>{ EXTRA[String(m.id)]=m; }); }
    if(SEL!=null && !OUTS.some(o=>o.id===SEL)) SEL=null;
    render();
  }catch(e){ toast(tx('fail')+': '+(e&&e.message||e),'err'); $('#olist').innerHTML=''; }
}
let EXTRA={};
async function loadStay(){
  if(STAY_D===D) return;
  const {data:bs,error}=await supa.from('bookings').select('event_seq,event_no,rep_name,dep_date,arr_date,pax,status').lte('dep_date',D).gt('arr_date',D).neq('status','대기').order('dep_date').order('event_seq'); if(error) throw error;
  const seqs=(bs||[]).map(b=>b.event_seq);
  const gs=seqs.length?await fetchIn('guests','event_seq,accom,team_tag,group_code','event_seq',seqs):[];
  const gm=seqs.length?await fetchIn('guest_members','id,event_seq,name_kr,name_en,seq_in_team,is_rep,member_grade,member_class,member_div','event_seq',seqs):[];
  const abs=await supa.from('golf_absentees').select('member_id,reason').eq('play_date',D); const ABS={}; (abs.data||[]).forEach(a=>{ ABS[String(a.member_id)]=a.reason||''; });
  const G={}; gs.forEach(g=>{ G[g.event_seq]=g; });
  STAY=(bs||[]).map(b=>{ const g=G[b.event_seq]||{}; const members=gm.filter(m=>m.event_seq===b.event_seq).sort((a,c)=>(a.seq_in_team||99)-(c.seq_in_team||99)).map(m=>({...m,abs:ABS[String(m.id)]}));
    return {seq:b.event_seq, no:String(b.event_no||''), rep:b.rep_name||'', tag:g.team_tag||g.group_code||'', accom:g.accom||'', pax:b.pax||0, members}; });
  STAY_D=D;
}
function memberById(id){ for(const t of STAY){ const m=t.members.find(x=>String(x.id)===String(id)); if(m) return {...m,team:t}; } const e=EXTRA[String(id)]; return e?{...e,team:null}:null; }
function teamOfSeq(seq){ return STAY.find(t=>String(t.seq)===String(seq))||null; }

// ── 렌더 ──
function render(){
  const sel=OUTS.find(o=>o.id===SEL)||null;
  $('#n-out').textContent=OUTS.length; $('#sum').textContent=tx('sum',OUTS.length, OUTS.reduce((s,o)=>s+(Number(o.signed)||0),0));
  $('#olist').innerHTML=OUTS.length?OUTS.map(o=>{ const n=SIGN.filter(s=>s.outing_id===o.id).length, over=o.capacity&&n>o.capacity;
    return `<div class="oc st-${esc(o.status)}${o.id===SEL?' sel':''}" data-id="${o.id}">
      <div class="h"><span class="kind">${esc(tx('k_'+(o.kind||'other')))}</span><span class="tt">${esc(o.title_ko||o.title_ja||'')}${(o.title_ko&&o.title_ja)?`<small>${esc(o.title_ja)}</small>`:''}</span><span class="cnt${over?' over':''}">${esc(tx('cnt',n,o.capacity||0))}</span></div>
      <div class="m">${o.meet_time?`<span>${esc(tx('meet'))} <b>${esc(hm(o.meet_time))}</b></span>`:''}${o.meet_place?`<span>${esc(o.meet_place)}</span>`:''}${o.return_time?`<span>${esc(tx('retL'))} <b>${esc(hm(o.return_time))}</b></span>`:''}${o.fee?`<span>${esc(tx('feeL'))} <b>${esc(yen(o.fee))}</b></span>`:''}${o.vehicle?`<span>${esc(tx('vehicleL'))} ${esc(o.vehicle)}</span>`:''}</div>
      ${(o.note_ko||o.note_ja)?`<div class="note">${esc(o.note_ko||'')}${(o.note_ko&&o.note_ja)?' / ':''}${esc(o.note_ja||'')}</div>`:''}
      <div class="acts"><div class="st">${['open','closed','cancelled'].map(st=>`<button type="button" data-st="${st}" class="${o.status===st?'on':''}">${esc(tx('st_'+st))}</button>`).join('')}</div>
        <button type="button" class="btn xs ghost b-edit">${esc(tx('edit'))}</button><button type="button" class="btn xs ghost b-print">${esc(tx('print'))}</button><button type="button" class="btn xs ghost b-del">${esc(tx('del'))}</button>
        <span class="hint">${o.updated_at?esc(tx('updBy',fmtDT(o.updated_at),o.created_by||'')):''}</span></div>
    </div>`; }).join(''):`<div class="empty">${esc(tx('none'))}</div>`;
  renderSign(sel);
}
function renderSign(sel){
  const box=$('#slist'); if(!sel){ $('#n-sign').textContent='0'; box.innerHTML=`<div class="empty">${esc(tx('selectHint'))}</div>`; return; }
  const rows=SIGN.filter(s=>s.outing_id===sel.id); $('#n-sign').textContent=rows.length;
  const byTeam={}; rows.forEach(s=>{ (byTeam[s.event_seq]=byTeam[s.event_seq]||[]).push(s); });
  const html=Object.keys(byTeam).map(seq=>{ const t=teamOfSeq(seq); const ms=byTeam[seq].map(s=>({s, m:memberById(s.member_id)}));
    return `<div class="team" data-seq="${esc(seq)}"><div class="th"><span class="tag">${esc(t?t.tag:'')}</span><span class="rep">${esc(t?t.rep:'#'+seq)}</span><span class="acc">${esc(t?t.accom:'')}</span><span class="n">${ms.length}${lang()==='ja'?'名':lang()==='en'?'':'명'}${t?` / ${t.pax}`:''}</span></div>
      <div class="chips">${ms.map(({s,m})=>`<span class="mchip" data-mid="${esc(s.member_id)}">${esc(m?(m.name_kr||m.name_en||'?'):'?')}${m&&m.name_en?`<small>${esc(m.name_en)}</small>`:''}${s.signed_by==='QR'?`<small style="color:var(--accent2);font-weight:800" title="QR">QR</small>`:''}<button type="button" class="b-unsign" title="${esc(tx('signRemoved'))}">✕</button></span>`).join('')}</div></div>`; }).join('');
  box.innerHTML=`<div class="rsum">${esc(titleOf(sel))} · ${esc(tx('cnt',rows.length,sel.capacity||0))}</div>`+(html||`<div class="empty">${esc(tx('noSign'))}</div>`)
    +`<div class="acts"><button type="button" class="btn sm" id="btn-pick">${esc(tx('addSign'))}</button></div><div id="pickbox"></div>`;
  if(PICK) renderPick(sel);
}
function renderPick(sel){
  const box=$('#pickbox'); if(!box) return; const signed=new Set(SIGN.filter(s=>s.outing_id===sel.id).map(s=>String(s.member_id)));
  const q=PQ.trim().toLowerCase();
  const teams=STAY.filter(t=>!q||[t.tag,t.rep,t.no,t.accom,...t.members.map(m=>(m.name_kr||'')+' '+(m.name_en||''))].join(' ').toLowerCase().includes(q));
  box.innerHTML=`<div class="pick"><div class="ph"><b>${esc(tx('staying'))}</b> <span class="hint">${STAY.length}</span><input class="inp" id="pq" placeholder="${esc(tx('search'))}" value="${esc(PQ)}" autocomplete="off"><button type="button" class="btn sm ghost" id="btn-pick-qr" title="${esc(tx('qrHint'))}">${esc(tx('qrBtn'))}</button><button type="button" class="btn sm" id="btn-pick-save">${esc(tx('pickSave',0))}</button><button type="button" class="btn sm ghost" id="btn-pick-close">${esc(tx('pickCancel'))}</button></div>
    <div class="list">${teams.length?teams.map(t=>`<div class="team" data-seq="${esc(t.seq)}"><div class="th"><span class="tag">${esc(t.tag)}</span><span class="rep">${esc(t.rep)}</span><span class="acc">${esc(t.accom)}</span><span class="n">${t.members.length} / ${t.pax}</span></div>
      <div class="chips">${t.members.map(m=>{ const done=signed.has(String(m.id)); const abs=!done&&m.abs; const mem=(window.SZCore&&SZCore.isMember)?SZCore.isMember(m):false;
        return `<label class="pm${done?' done':''}${abs?' abs':''}" title="${abs?esc(tx('absOther')+': '+m.abs):''}"><input type="checkbox" class="pm-chk" value="${esc(m.id)}" data-seq="${esc(t.seq)}" ${done?'checked disabled':''}> ${esc(m.name_kr||m.name_en||'?')}${mem?` <small>${esc(tx('member'))}</small>`:''}${done?` <small>${esc(tx('done'))}</small>`:''}</label>`; }).join('')}</div></div>`).join(''):`<div class="empty">${esc(tx('noStay'))}</div>`}</div></div>`;
  const pq=$('#pq'); if(pq){ pq.addEventListener('input',()=>{ PQ=pq.value; const at=pq.selectionStart; renderPick(sel); const n=$('#pq'); if(n){ n.focus(); try{ n.setSelectionRange(at,at); }catch(e){} } }); }
  updatePickBtn();
}
function updatePickBtn(){ const n=document.querySelectorAll('.pm-chk:checked:not(:disabled)').length; const b=$('#btn-pick-save'); if(b){ b.textContent=tx('pickSave',n); b.disabled=!n; } }

// ── 편집 ──
function openEdit(o){
  EDIT=o?{...o}:{id:null,outing_date:D,kind:'shopping',title_ko:'',title_ja:'',meet_time:'',meet_place:'',return_time:'',capacity:null,fee:null,vehicle:'',note_ko:'',note_ja:'',status:'open'};
  $('#e-date').value=EDIT.outing_date||D; $('#e-kind').value=EDIT.kind||'shopping'; $('#e-meet').value=hm(EDIT.meet_time); $('#e-ret').value=hm(EDIT.return_time);
  $('#e-title_ko').value=EDIT.title_ko||''; $('#e-title_ja').value=EDIT.title_ja||''; $('#e-place').value=EDIT.meet_place||''; $('#e-cap').value=EDIT.capacity||''; $('#e-fee').value=(EDIT.fee===null||EDIT.fee===undefined)?'':EDIT.fee;
  $('#e-vehicle').value=EDIT.vehicle||''; $('#e-note_ko').value=EDIT.note_ko||''; $('#e-note_ja').value=EDIT.note_ja||'';
  $('#e-title').textContent=EDIT.id?tx('edit'):tx('newT'); $('#edit').hidden=false; $('#e-title_ko').focus();
}
function readEdit(){
  const v=id=>$('#'+id).value.trim();
  const cap=parseInt(v('e-cap'),10), fee=parseInt(v('e-fee'),10);
  return { outing_date:v('e-date')||D, kind:KINDS.includes(v('e-kind'))?v('e-kind'):'other', title_ko:v('e-title_ko'), title_ja:v('e-title_ja'), meet_time:v('e-meet')||null, return_time:v('e-ret')||null,
    meet_place:v('e-place'), capacity:isNaN(cap)||cap<=0?null:cap, fee:isNaN(fee)||fee<0?null:fee, vehicle:v('e-vehicle'), note_ko:v('e-note_ko'), note_ja:v('e-note_ja') };
}
async function saveEdit(){
  const row=readEdit(); if(!row.title_ko&&!row.title_ja){ toast(tx('titleNeed'),'warn'); return; }
  const btn=$('#btn-save'); btn.disabled=true;
  try{
    if(EDIT&&EDIT.id){ const {error}=await supa.from('outings').update(row).eq('id',EDIT.id); if(error) throw error;
      const diff={}; Object.keys(row).forEach(k=>{ if(String(EDIT[k]==null?'':EDIT[k])!==String(row[k]==null?'':row[k])) diff[k]={from:EDIT[k],to:row[k]}; });
      logChange(EDIT.id,'update',row.title_ko||row.title_ja,diff); }
    else { const {data,error}=await supa.from('outings').insert({...row,status:'open',created_by:who()}).select('id').single(); if(error) throw error;
      logChange(data&&data.id,'insert',row.title_ko||row.title_ja,{date:row.outing_date}); SEL=data?data.id:SEL; }
    $('#edit').hidden=true; EDIT=null; toast(tx('saved'),'ok');
    if(row.outing_date!==D){ D=row.outing_date; $('#d').value=D; STAY_D=''; }
    await load();
  }catch(e){ toast(tx('fail')+': '+(e&&e.message||e),'err'); }
  btn.disabled=false;
}
async function setStatus(o,st){ if(o.status===st) return; try{ const {error}=await supa.from('outings').update({status:st}).eq('id',o.id); if(error) throw error; logChange(o.id,'status',titleOf(o),{status:{from:o.status,to:st}}); o.status=st; render(); toast(tx('saved'),'ok'); }catch(e){ toast(tx('fail')+': '+(e&&e.message||e),'err'); } }
async function delOuting(o){ const n=SIGN.filter(s=>s.outing_id===o.id).length; if(!confirm(tx('delConfirm',titleOf(o)+(n?' · '+n:'')))) return;
  try{ const {error}=await supa.from('outings').delete().eq('id',o.id); if(error) throw error; logChange(o.id,'delete',titleOf(o),{signups:n}); if(SEL===o.id) SEL=null; toast(tx('deleted'),'ok'); await load(); }catch(e){ toast(tx('fail')+': '+(e&&e.message||e),'err'); } }

// ── 신청 ──
async function savePick(sel){
  const picks=[...document.querySelectorAll('.pm-chk:checked:not(:disabled)')].map(c=>({member_id:c.value,event_seq:Number(c.dataset.seq)})); if(!picks.length) return;
  const cur=SIGN.filter(s=>s.outing_id===sel.id).length;
  if(sel.capacity && cur+picks.length>sel.capacity && !confirm(tx('capWarn',cur+picks.length,sel.capacity))) return;
  const by=who(); const rows=picks.map(p=>({outing_id:sel.id,member_id:p.member_id,event_seq:p.event_seq,signed_by:by}));
  try{ const {error}=await supa.from('outing_signups').upsert(rows,{onConflict:'outing_id,member_id'}); if(error) throw error;
    logChange(sel.id,'signup',titleOf(sel),{added:rows.map(r=>r.member_id)}); toast(tx('signSaved',rows.length),'ok'); PICK=false; PQ=''; await load();
  }catch(e){ toast(tx('fail')+': '+(e&&e.message||e),'err'); }
}
async function unsign(sel,mid){
  try{ const {error}=await supa.from('outing_signups').delete().eq('outing_id',sel.id).eq('member_id',mid); if(error) throw error;
    logChange(sel.id,'unsign',titleOf(sel),{removed:mid}); toast(tx('signRemoved'),'ok'); await load();
  }catch(e){ toast(tx('fail')+': '+(e&&e.message||e),'err'); }
}

// ── 명단 인쇄(A4 · 직원용 · 일본어 우선 병기) ──
function printRoster(o){
  const P=tx('pv'); const rows=SIGN.filter(s=>s.outing_id===o.id); const byTeam={}; rows.forEach(s=>{ (byTeam[s.event_seq]=byTeam[s.event_seq]||[]).push(s); });
  let i=0; const trs=Object.keys(byTeam).map(seq=>{ const t=teamOfSeq(seq); return byTeam[seq].map(s=>{ const m=memberById(s.member_id); i++;
    return `<tr><td class="c">${i}</td><td class="mono">${esc(t?t.tag:'')}</td><td>${esc(t?t.rep:'#'+seq)}</td><td><b>${esc(m?(m.name_kr||''):'')}</b>${m&&m.name_en?` <small>${esc(m.name_en)}</small>`:''}</td><td>${esc(t?t.accom:'')}</td><td class="c"><span class="box"></span></td><td>${esc(s.note||'')}</td></tr>`; }).join(''); }).join('');
  const meta=[[P.date,o.outing_date],[P.meet,[hm(o.meet_time),o.meet_place].filter(Boolean).join(' · ')],[P.ret,hm(o.return_time)],[P.vehicle,o.vehicle],[P.cap,o.capacity?String(o.capacity):''],[P.fee,o.fee?yen(o.fee):'']].filter(x=>x[1]);
  const now=new Date(); const jp=window.__SO_JP_FONT||'';
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>outing_${o.outing_date}</title><style>${jp}
    @page{size:A4 portrait;margin:14mm} body{font-family:'Pretendard','Meiryo','Yu Gothic','Hiragino Sans','Noto Sans JP','Noto Sans KR',sans-serif;color:#111;font-size:11pt}
    h1{font-size:16pt;margin:0 0 2mm} h1 small{font-size:10pt;font-weight:600;color:#444;margin-left:8px} .sub{font-size:12pt;font-weight:800;margin:0 0 4mm}
    .meta{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:1mm 6mm;font-size:10.5pt;margin-bottom:5mm} .meta b{color:#333}
    table{border-collapse:collapse;width:100%} th,td{border:1px solid #333;padding:1.8mm 2.2mm;font-size:10.5pt;vertical-align:middle} th{background:#eee;font-weight:800}
    td.c{text-align:center} .mono{font-family:Consolas,'SZJpMono',monospace;font-weight:800} small{color:#555;font-size:8.5pt} .box{display:inline-block;width:5mm;height:5mm;border:1.5px solid #333;vertical-align:middle}
    .tot{margin-top:4mm;font-weight:800;font-size:12pt} .ft{margin-top:6mm;font-size:9pt;color:#555}
    .bar{position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid #ccc;padding:6px 10px} @media print{.bar{display:none}} @media screen{body{padding-top:40px}}
  </style></head><body><div class="bar"><button onclick="window.print()">印刷 / 인쇄</button></div>
    <h1>${esc(P.title)}<small>${esc(tx('k_'+(o.kind||'other')))}</small></h1><div class="sub">${esc(o.title_ja||'')}${(o.title_ja&&o.title_ko)?' ／ ':''}${esc(o.title_ko||'')}</div>
    <div class="meta">${meta.map(([k,v])=>`<b>${esc(k)}</b><span>${esc(v)}</span>`).join('')}</div>
    <table><thead><tr>${P.th.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${trs||`<tr><td colspan="7" class="c">—</td></tr>`}</tbody></table>
    <div class="tot">${esc(P.total)} ${rows.length}${lang()==='en'?'':'名'}</div>
    <div class="ft">${esc(P.out)} ${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}${(o.note_ja||o.note_ko)?' · '+esc(o.note_ja||o.note_ko):''}</div>
  <\/body></html>`;
  const w=window.open('','_blank','width=900,height=1000'); if(!w){ toast(tx('fail'),'err'); return; } w.document.open(); w.document.write(html); w.document.close(); return html;
}

// ── QR 스캔으로 팀 바로 선택(Min 2026-10-27 「신청도 QR코드를 대면 굳이 사람들 다 검색하지 않아도」) ──
//  손님 QR 카드(bill.html?t=토큰) → order_tokens(로그인 읽기) → 팀 → 피커를 그 팀만으로 좁히고 아직 신청 안 한 팀원을 전부 체크(담당자가 확인하고 [신청]).
//  하드웨어 리더기(키보드 입력, __so_hidScan)는 어느 칸에 포커스가 있어도 동작 · 카메라는 피커의 [QR 스캔](html5-qrcode).
let _qr=null;
function qrStatus(m){ const e=$('#qr-status'); if(e) e.textContent=m||''; }
async function openScanCam(){
  $('#qr-modal').style.display='flex'; $('#qr-title').textContent=tx('qrTitle'); $('#qr-hint').textContent=tx('qrHint'); qrStatus(tx('qrScanning'));
  try{ if(!window.Html5Qrcode) throw new Error('lib'); _qr=new Html5Qrcode('qr-reader');
    await _qr.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},(decoded)=>{ scanResolve(decoded); },()=>{}); }
  catch(e){ _qr=null; qrStatus(tx('qrOpenFail')); }
}
async function stopScan(){ if(_qr){ try{ await _qr.stop(); }catch(_){} try{ _qr.clear(); }catch(_){} _qr=null; } }
async function closeScan(){ await stopScan(); const m=$('#qr-modal'); if(m) m.style.display='none'; }
async function scanResolve(raw){
  let token=String(raw||'').trim(); if(!token) return;
  const m=token.match(/[?&]t=([^&\s]+)/); if(m) token=decodeURIComponent(m[1]);   // QR=bill URL 이면 ?t= 토큰 추출
  await closeScan();
  if(!supa) return;
  const sel=OUTS.find(o=>o.id===SEL); if(!sel){ toast(tx('qrNoOuting'),'warn'); return; }
  try{
    const {data,error}=await supa.from('order_tokens').select('event_seq').eq('token',token).limit(1); if(error) throw error;
    if(!data||!data.length){ toast(tx('qrNoMatch'),'err'); return; }
    const seq=data[0].event_seq; const t=teamOfSeq(seq);
    if(!t){ toast(tx('qrNotStay'),'err'); return; }
    PICK=true; PQ=t.tag||t.rep||String(seq); renderPick(sel);
    let n=0; document.querySelectorAll(`.pm-chk[data-seq="${seq}"]:not(:disabled)`).forEach(c=>{ c.checked=true; n++; });
    updatePickBtn();
    const box=$('#pickbox'); if(box&&box.scrollIntoView) box.scrollIntoView({block:'nearest'});
    toast(tx('qrMatched',t.tag||t.rep||('#'+seq),n),'ok');
  }catch(e){ toast(tx('qrNoMatch'),'err'); }
}
if(window.__so_hidScan) __so_hidScan(function(raw){ if(supa) scanResolve(raw); });
$('#qr-close').addEventListener('click',closeScan);

// ── 이벤트 ──
$('#olist').addEventListener('click',e=>{ const card=e.target.closest('.oc'); if(!card) return; const o=OUTS.find(x=>String(x.id)===card.dataset.id); if(!o) return;
  if(e.target.closest('.b-edit')) openEdit(o); else if(e.target.closest('.b-print')) printRoster(o); else if(e.target.closest('.b-del')) delOuting(o);
  else if(e.target.closest('.st button')) setStatus(o,e.target.closest('.st button').dataset.st);
  else { SEL=o.id; PICK=false; PQ=''; render(); } });
$('#slist').addEventListener('click',e=>{ const sel=OUTS.find(o=>o.id===SEL); if(!sel) return;
  if(e.target.closest('#btn-pick')){ PICK=true; renderPick(sel); const pq=$('#pq'); if(pq) pq.focus(); }
  else if(e.target.closest('#btn-pick-close')){ PICK=false; PQ=''; $('#pickbox').innerHTML=''; }
  else if(e.target.closest('#btn-pick-qr')) openScanCam();
  else if(e.target.closest('#btn-pick-save')) savePick(sel);
  else if(e.target.closest('.b-unsign')){ const mid=e.target.closest('.mchip').dataset.mid; unsign(sel,mid); } });
$('#slist').addEventListener('change',e=>{ if(e.target.classList.contains('pm-chk')) updatePickBtn(); });
$('#btn-add').addEventListener('click',()=>openEdit(null));
$('#btn-cancel').addEventListener('click',()=>{ $('#edit').hidden=true; EDIT=null; });
$('#btn-save').addEventListener('click',saveEdit);
function setDate(d){ D=d; $('#d').value=D; SEL=null; PICK=false; PQ=''; STAY_D=''; EXTRA={}; load(); }
$('#d').addEventListener('change',()=>{ if($('#d').value) setDate($('#d').value); });
$('#d-prev').addEventListener('click',()=>setDate(addDays(D,-1))); $('#d-next').addEventListener('click',()=>setDate(addDays(D,1)));

// ── 연결 ──
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn('URL·key','err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.classList.remove('connected');
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('outings').select('id',{count:'exact',head:true}); if(error) throw error;
    setConn('✓','ok'); btn.textContent='✓'; btn.classList.add('connected'); btn.disabled=false;
    await load();
  }catch(e){ setConn('✕','err'); toast(tx('fail')+': '+e.message,'err'); btn.textContent='↻'; btn.classList.remove('connected'); btn.disabled=false; supa=null; }
}
$('#btn-connect').addEventListener('click',connect);
(function init(){
  const q=new URLSearchParams(location.search); D=(q.get('date')&&/^\d{4}-\d{2}-\d{2}$/.test(q.get('date')))?q.get('date'):today(); $('#d').value=D;
  applyStatic(); loadCreds();
  if($('#sb-url').value && $('#sb-key').value) connect();
})();
</script>
