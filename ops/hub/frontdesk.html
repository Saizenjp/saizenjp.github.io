<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 프론트 데스크</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}

  .datebar{padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .datebar label{font-size:12px;color:var(--text2);font-weight:600}
  .accombar{padding:8px 20px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface2)}
  .accombar .fds{margin-left:auto;min-width:230px;padding:7px 11px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text)}
  .accombar .fds:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  @media(max-width:560px){.accombar .fds{margin-left:0;width:100%}}
  .accombar > label{font-size:12px;color:var(--text2);font-weight:700;margin-right:2px}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{padding:16px 20px 70px;max-width:1280px;margin:0 auto}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .fu-panel{background:#fff7ed;border:1px solid #f0c98a;border-left:4px solid #d98f2b;border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .fu-panel .fu-h{font-weight:800;color:#9a5b12;font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .fu-panel .fu-h .fu-cnt{background:#d98f2b;color:#fff;border-radius:999px;padding:1px 9px;font-size:12px}
  .fu-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #f0d9b6;border-radius:9px;padding:8px 11px;margin-bottom:6px}
  .fu-row:last-child{margin-bottom:0}
  .fu-row .fu-title{font-weight:700;font-size:13px;color:var(--text)}
  .fu-row .fu-detail{font-size:11.5px;color:var(--muted)}
  .fu-row .fu-area{font-size:10.5px;background:#eef2e6;color:#5a6b3e;border-radius:6px;padding:1px 7px;font-weight:700}
  .fu-row .fu-act{margin-left:auto;display:flex;gap:6px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;position:relative;transition:.13s}
  .kpi.go{cursor:pointer}
  .kpi.go:hover{border-color:var(--accent);box-shadow:0 5px 14px rgba(15,23,42,.11);transform:translateY(-2px);background:var(--surface2)}
  .kpi.go:active{transform:translateY(0);box-shadow:0 2px 6px rgba(15,23,42,.08)}
  .kpi .goh{position:absolute;top:10px;right:12px;font-size:10.5px;font-weight:800;color:var(--muted);background:var(--surface3);border:1px solid var(--border);border-radius:99px;padding:1px 8px;opacity:.85;transition:.13s}
  .kpi.go:hover .goh{color:#fff;background:var(--accent);border-color:var(--accent);opacity:1}
  .kpi .l{font-size:11.5px;color:var(--text2);font-weight:700}
  .kpi .v{font-size:23px;font-weight:800;color:var(--accent);font-family:var(--mono);margin-top:2px}
  .kpi .v small{font-size:12px;color:var(--text2);font-weight:600}
  .kpi.due .v{color:var(--err)}

  .stage{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  /* 오른쪽 정산표 셀을 고정 — 왼쪽 목록을 내려도 따라옴(방배정과 동일 원리). 패널이 화면보다 길면 내부 스크롤. */
  .stage>.col:last-child{position:sticky;top:74px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-bottom:76px;scrollbar-gutter:stable}
  @media(max-width:900px){.stage{grid-template-columns:1fr}.stage>.col:last-child{position:static;max-height:none;overflow:visible}}
  .col h3{font-size:13px;font-weight:800;color:var(--accent);margin:6px 0 8px;display:flex;align-items:center;gap:8px}
  .col h3 .c{font-size:11.5px;color:var(--text2);font-weight:700}
  .sect{margin-bottom:16px}
  .sect .sh{font-size:12.5px;font-weight:800;margin:0 0 7px;padding:5px 10px;border-radius:8px;display:flex;align-items:center;gap:8px}
  .sh.arr{background:#e7efe1;color:#3c5230} .sh.dep{background:#f5ecd8;color:#7a5a14} .sh.stay{background:#e9f0f7;color:#2c5078}
  .sh.dine{background:#f3eefa;color:#553a86} .sh.dineex{background:#fbeeeb;color:#8a2a1c}
  /* 체크인 안 공항별 소구분 — 도착 시각·안내가 완전히 갈리는 팀이라 나눠 본다(Min 2026-08) */
  .portg{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;color:var(--text2);margin:10px 0 5px;padding:0 2px}
  .portg:first-child{margin-top:2px}
  .portg .pl{padding:2px 9px;border-radius:99px;background:var(--surface3)}
  .portg.icn .pl{background:#e0ecf7;color:#2c5f8a}
  .portg.pus .pl{background:#f7e8e0;color:#8a5a2c}
  .portg.acc{font-size:11px;font-weight:700;margin:8px 0 4px;padding-left:10px}
  .portg::after{content:'';flex:1;height:1px;background:var(--border)}
  .trow .dpax{font-family:var(--mono);font-weight:800;font-size:13.5px;color:#553a86}
  .trow .dmark{font-size:10.5px;font-weight:800;border-radius:99px;padding:1px 8px;flex:none;white-space:nowrap;border:1px solid var(--border2);background:var(--surface2);color:var(--text2)}
  .trow .dmark.up{background:#fdf6e6;color:var(--accent2);border-color:#e6cf95}
  .trow .dmark.eco{background:#f5ecd8;color:#7a5a14;border-color:#e6cf95}
  .trow .dmark.ex{background:#fbeeeb;color:#8a2a1c;border-color:#e3bdb4}
  .trow .dmark.grp{background:var(--accentSoft);color:var(--accent);border-color:#b4cda0}
  .trow.exd{opacity:.72}
  .dhint{font-size:11.5px;color:var(--muted);margin:-2px 0 8px 2px}
  .sh .c{margin-left:auto;font-family:var(--mono)}
  .trow{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 8px 9px 12px;margin-bottom:7px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .trow:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(15,23,42,.10);transform:translateY(-1px);background:var(--surface2)}
  .trow:active{transform:translateY(0)}
  .trow.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  /* 체크아웃 처리 — 완료 팀은 눌러 죽이고, 선택 체크박스는 체크아웃 섹션에만 */
  .trow.done{opacity:.62;background:var(--surface2)}
  .cock{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
  .cobadge{font-size:10.5px;font-weight:800;color:#fff;background:var(--ok);border-radius:5px;padding:1px 6px;white-space:nowrap}
  .cobar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 8px}
  .cohint{font-size:11px;color:var(--muted)}
  .trow::after{content:"›";font-size:19px;font-weight:800;line-height:1;color:var(--border2);margin-left:2px;transition:.12s;flex:none}
  .trow:hover::after{color:var(--accent);transform:translateX(2px)}
  .trow.sel::after{color:var(--accent)}
  .trow .tag{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--accent)}
  .trow .rep{font-weight:700;font-size:14px}
  .trow .pax{font-size:12px;color:var(--text2)}
  .trow .room{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text2)}
  /* 결제 기록 — 손님 앞에서 누르는 칸이라 크게, 현금/카드는 1동작 버튼 */
  .paybox{margin-top:12px;border:1px solid var(--border2);border-radius:10px;background:var(--surface2);padding:10px 12px}
  .paybox .pt{font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:8px}
  .paybox .prow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
  .paybox select,.paybox input{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border2);border-radius:7px;background:var(--surface);color:var(--text)}
  .paybox input.amt{flex:1;min-width:110px;font-family:var(--mono);font-weight:800;font-size:15px;text-align:right}
  .paybox select{width:100%}
  .pmb{font-family:inherit;font-size:13px;font-weight:800;padding:8px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer}
  .pmb.on{color:#fff;border-color:var(--accent);background:var(--accent)}
  .pmb.on.card{border-color:#1A4D8F;background:#1A4D8F}
  .paybox .go{margin-left:auto;font-family:inherit;font-size:13px;font-weight:800;padding:8px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .paybox .go:disabled{opacity:.5;cursor:default}
  .paybox .hh2{font-size:11px;color:var(--muted);font-weight:600}
  .paybox .plist{margin-top:7px;font-size:11.5px;color:var(--text2);line-height:1.7;border-top:1px dashed var(--border2);padding-top:6px}
  .paybox .plist b{font-family:var(--mono)}
  .paybox .deny2{font-size:12px;color:var(--err);font-weight:700}
  .trow .bal{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:13px}
  .trow .bal.due{color:var(--err)} .trow .bal.zero{color:var(--muted)}
  .trow .accom{font-size:11px;color:var(--muted)}
  .trow .memchip{font-size:10.5px;font-weight:800;color:#6a3fa0;background:#f1ecfa;border:1px solid #d8c8ef;border-radius:99px;padding:1px 8px;flex:none;white-space:nowrap}
  .empty{padding:14px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--border);border-radius:9px}

  /* 상세 패널 */
  .detail{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 17px}
  .detail .dh{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  /* 객실 쪽지(벌레·고장) — 그 팀이 쓰는 방에 붙은 것. 손님 응대 중 바로 보이게 위에 둔다. */
  .dnotes{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .dnote{font-size:12.5px;font-weight:700;border-radius:8px;padding:6px 10px;background:#fbeeeb;color:#8a2a1c}
  .dnote.k-fix{background:#fdf3e2;color:#7a5a16}
  .dnote.k-etc{background:var(--surface3);color:var(--text2)}
  .detail .dh .tag{font-family:var(--mono);color:var(--accent)}
  .detail .dsub{font-size:12px;color:var(--text2);margin-top:3px}
  .detail .drow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border)}
  .detail .drow b{font-weight:700}
  .detail .big{font-size:20px;font-weight:800;font-family:var(--mono)}
  .detail .big.due{color:var(--err)} .detail .big.zero{color:var(--muted)}
  .detail .memo{font-size:12.5px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:9px 11px;margin-top:8px;white-space:pre-wrap;min-height:38px}
  .detail .ntf{width:100%;font-family:inherit;font-size:12.5px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:4px;resize:vertical;min-height:38px;line-height:1.5}
  .detail .ntf:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accentSoft)}
  .detail .ntlab{font-size:11.5px;color:var(--text2);font-weight:700;margin-top:9px;display:flex;align-items:center;gap:6px}
  .detail .ntlab .hh{font-weight:500;color:var(--muted);font-size:10.5px}
  .detail .ostat{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .detail .ob{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);text-decoration:none;display:inline-flex;align-items:center;gap:3px}
  .detail .ob.warn{background:#fbf3e2;color:#7a5a16;border-color:#e6cf95}
  .detail .ob.err{background:#fbeeeb;color:#8a2a1c;border-color:#e3bdb4}
  .detail .ob.acc{background:var(--accentSoft);color:var(--accent);border-color:#b4cda0}
  .detail .ob.gold{background:#fdf6e6;color:var(--accent2);border-color:#e6cf95}
  .detail .ob.mem{background:#f1ecfa;color:#6a3fa0;border-color:#d8c8ef}
  a.ob:hover{filter:brightness(.97);text-decoration:none}
  .detail .links{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px}
  /* 체크인·체크아웃은 서로 반대 동작인데 다른 링크 버튼과 나란히 있어 오탭 위험이 있었다(Min 2026-08)
     — 구분선으로 떼어놓고, 둘 사이도 더 벌리고, 버튼도 한 단계 키운다. */
  .detail .links .lsep{width:1px;align-self:stretch;background:var(--border2);margin:0 3px}
  .detail .links .ckgrp{display:flex;gap:16px}
  .detail .links .ckgrp .btn{font-size:13.5px;padding:8px 18px}
  .detail .none{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}

  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>

<body data-so-area="front">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム"><img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen"></a>
  <span class="step" id="t-step">フロントデスク</span>
  <a class="navhome" href="../index.html" data-i18n="navHome">← 현장 운영</a>

  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>
    </div>
  </div>
  <span class="pill" id="conn-state">未接続</span>
</div>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">
  <input class="inp" id="sb-key" type="password" placeholder="Publishable key" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button">接続</button>
  <span class="hint" id="t-connhint"></span>
</div>

<div class="datebar">
  <label id="t-datelbl">日付</label>
  <button class="btn ghost sm" id="d-prev" type="button">◀</button>
  <input class="inp" id="day-pick" type="date" style="width:160px">
  <button class="btn ghost sm" id="d-next" type="button">▶</button>
  <button class="btn ghost sm" id="d-today" type="button">今日</button>

  <div class="stage">
    <div class="col" id="lists"><div class="empty" id="t-empty"></div></div>
    <div class="col"><div class="detail" id="detail"><div class="none" id="t-none"></div></div></div>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
let supa=null;

// ── i18n (한·일 직원 공용. ja 기본) ──
const L={
  ja:{ step:'フロントデスク', connHint:'リアルタイム到着・出発・在室 ＋ チーム別の客室番号・残高・メモ。閲覧中心。',
    custShow:'🖥 お客様画面に表示', custOn:'🖥 表示中 · 消す', custT:'カウンターのお客様タブレットにこのチームのご精算を表示します',
    custDone:'お客様画面に表示しました', custClear:'お客様画面を消しました', custFail:'お客様画面の更新に失敗',
    connect:'接続', connecting:'接続中…', connectedBtn:'✓ 接続済', connFailBtn:'接続失敗・再試行',

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function accomL(a){ return (window.SZCore&&SZCore.accomLabel)?SZCore.accomLabel(a,lang()):(a||''); }   // 숙소·구역 표시 라벨(ja/ko/en) = saizen-core 단일 진실원
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }

let state={ day:'', teams:[], byId:{}, selSeq:null, accomSel:new Set(['야마나미리조트','쿠주힐즈']), q:'', conn:'none', dineOpen:false };
function accomPass(ac){ return state.accomSel.size===0 || state.accomSel.has(ac); }
function renderAccomChips(){
  const box=$('#accomchips'); if(!box) return;
  const accoms=[...new Set(state.teams.map(t=>t.accom).filter(Boolean))]
    .sort((a,b)=>{const O=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸'];const ai=O.indexOf(a),bi=O.indexOf(b);return (ai<0?9:ai)-(bi<0?9:bi);});
  const chip=(k,l,on)=>`<div class="chip${on?' on':''}" data-a="${esc(k)}">${esc(l)}</div>`;
  box.innerHTML=chip('__all',tx('all'),state.accomSel.size===0)+accoms.map(a=>chip(a,accomL(a),state.accomSel.has(a))).join('');
  box.querySelectorAll('[data-a]').forEach(c=>c.addEventListener('click',()=>{
    const a=c.dataset.a;
    if(a==='__all') state.accomSel.clear();
    else state.accomSel.has(a)?state.accomSel.delete(a):state.accomSel.add(a);
    render();
  }));
}

// 이름 표기 — 일본어 화면이면 가타카나(표시 전용, 검색은 원문도 같이 건다)
function pn(kr,en){ return window.__so_pname?__so_pname(kr,en):(kr||en||''); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function yen(n){const v=Math.round(Number(n)||0);return '¥'+v.toLocaleString('ja-JP');}
function setConn(t,c){const e=$('#conn-state');if(e){e.textContent=t;e.className='pill'+(c?' '+c:'');}}
function refreshConn(){

// ── 석식 인원 = 夕食オーダー(dinner.html) 와 같은 규칙 ────────────────────
//   그날 묵는 인원 − 조기퇴실(그 끼니에 이미 떠난 사람) − 업그레이드 인분(기본 석식이 안 나감).
//   夕食除外 팀은 합계에서 빠지고 따로 모아 보여준다. 규칙은 SZCore 단일 진실원.
function dineGone(t,day){ return (window.SZCore&&SZCore.mealGoneCount)?SZCore.mealGoneCount(t.earlyDeps||[],day,'d'):0; }
function dineUp(t){ return (t.addons||[]).filter(a=>a.kind==='upgrade').reduce((s,a)=>s+(parseInt(a.qty,10)||0),0); }
function dinePax(t,day){ return Math.max(0,(parseInt(t.pax,10)||0)-dineGone(t,day)); }
function dineNet(t,day){ const p=dinePax(t,day); return Math.max(0,p-Math.min(p,dineUp(t))); }

function render(){
  renderAccomChips();
  renderFollowups();
  const day=state.day;
  const tw=tx('teamWord'), nw=tx('nameWord');

  const arr=pool.filter(t=>t.dep===day);                    // 체크인
  const dep=pool.filter(t=>t.arr===day);                    // 체크아웃
  const stay=pool.filter(t=>t.dep<day&&t.arr>day);          // 연박(재실)
  const dine=pool.filter(t=>t.dep<=day&&t.arr>day);         // 그날 묵는 전원 = 석식 대상
  const ppl=a=>a.reduce((s,t)=>s+(parseInt(t.pax,10)||0),0);
  const dineOn=dine.filter(t=>!t.excluded && dinePax(t,day)>0);   // 전원 조기퇴실 팀은 명단에 안 올린다
  const dineEx=dine.filter(t=>t.excluded);
  const dineN=dineOn.reduce((s,t)=>s+dineNet(t,day),0);
  const dueSum=pool.reduce((s,t)=>s+Math.max(0,t.bal),0);
  $('#kpis').innerHTML=
    kpi(tx('kpiOut'),`${dep.length}<small>${tw} · ${ppl(dep)}${nw}</small>`,'','sec-dep')+

    kpi(tx('kpiDinner'),`${dineN}<small>${nw} · ${dineOn.length}${tw}</small>`,'',null,'dine')+

  const html=block('dep',tx('secOut'),dep)+block('arr',tx('secIn'),arr)+block('stay',tx('secStay'),stay)

function kpi(l,v,cls,go,open){

}
function sect(kind,title,list){

  const row=t=>{
    const balCls=t.bal>0?'due':(t.cnt?'':'zero');
    return `<div class="trow ${t.seq===state.selSeq?'sel':''}${done(t)?' done':''}" data-seq="${t.seq}">
      ${pick?`<input type="checkbox" class="cock" data-cos="${t.seq}"${done(t)?' disabled':''}>`:''}
      <span class="tag">${esc(t.tag)}</span>${done(t)?`<span class="cobadge">${ci?tx('ciDone'):tx('coDone')}</span>`:''}
      <span class="rep">${esc(pn(t.rep,''))}</span>${membChip(t)}
      <span class="pax">${t.pax}${nw}</span>
      <span class="room">${t.rooms.length?t.rooms.join(','):`<span style="color:var(--muted)">${tx('unassigned')}</span>`}</span>
      <span class="accom">${esc(accomL(t.accom))}</span>
      <span class="bal ${balCls}">${t.cnt?yen(t.bal):'-'}</span>
    </div>`;
  };
  // 숙소별 소구분 헤더 — 정렬만으로는 구간이 안 보여 "숙소별로 나뉜 게 맞냐"는 문의가 있었다(Min 2026-08).
  const accomGroups=arr=>{
    const by={}; const order=[];
    arr.forEach(t=>{ const k=t.accom||''; if(!by[k]){ by[k]=[]; order.push(k); } by[k].push(t); });
    order.sort((a,b)=>a.localeCompare(b));
    return order.map(k=>({accom:k,list:by[k]}));
  };
  const accomHtml=arr=>accomGroups(sortAccom(arr)).map(g=>
    `<div class="portg acc"><span class="pl">${esc(accomL(g.accom)||tx('noAccom'))}</span><span class="pc">${g.list.length}${tw}</span></div>${g.list.map(row).join('')}`
  ).join('');
  let rows;
  if(!list.length){ rows=`<div class="empty">${tx('noneApplicable')}</div>`; }
  else if(ci){
    // 체크인은 출발지(인천/부산)로 먼저 나누고, 그 안에서 다시 숙소별로 나눈다(Min 2026-08)
    const icn=list.filter(t=>t.port!=='PUS'), pus=list.filter(t=>t.port==='PUS');
    const grp=(lab,cls,arr)=>arr.length?`<div class="portg ${cls}"><span class="pl">${lab}</span><span class="pc">${arr.length}${tw}</span></div>${accomHtml(arr)}`:'';
    rows=grp(tx('portICN'),'icn',icn)+grp(tx('portPUS'),'pus',pus);
  } else {
    rows=accomHtml(list);
  }
  const bar=pick&&list.length ? `<div class="cobar">
      <button class="btn sm" id="btn-${ci?'ci':'co'}-sel" type="button">${(ci?tx('btnCiSel'):tx('btnCoSel'))(0)}</button>
      <button class="btn sm ghost" id="btn-${ci?'ci':'co'}-all" type="button">${ci?tx('btnCiAll'):tx('btnCoAll')}</button>
      <span class="cohint">${ci?tx('ciHint'):tx('coHint')}</span>
    </div>` : '';
  return `<div class="sect" id="sec-${kind}"><div class="sh ${kind}">${title}<span class="c">${list.length}${tw}</span></div>${bar}${rows}</div>`;
}
// 🍽 오늘 석식 목록 — 夕食オーダー(dinner.html)에서 정리한 내용을 그대로 보여준다.
//   인원 = 그날 묵는 인원 − 조기퇴실 − 업그레이드 인분. 제외 팀은 아래에 따로 모은다.
function dineSect(list, ex, day, total){
  const nw=tx('nameWord'), tw=tx('teamWord');
  const row=(t,excluded)=>{
    const base=parseInt(t.pax,10)||0, gone=dineGone(t,day), up=dineUp(t), net=dineNet(t,day);
    const ad=(t.addons||[]);
    const nAdd=ad.filter(a=>a.kind==='add').length, nAlg=ad.filter(a=>a.kind==='allergy').length;
    const marks=[];
    if(gone) marks.push(`<span class="dmark eco">${esc(tx('dnEco')(gone))}</span>`);
    if(up)   marks.push(`<span class="dmark up">${esc(tx('dnUp')(up))}</span>`);
    if(nAdd) marks.push(`<span class="dmark">${esc(tx('dnAdd')(nAdd))}</span>`);
    if(nAlg) marks.push(`<span class="dmark ex">${esc(tx('dnAlg')(nAlg))}</span>`);
    if(t.teamGroup) marks.push(`<span class="dmark grp" title="${tx('obTeamT')}">🔗 ${esc(tx('dnGrp'))}</span>`);
    if(excluded) marks.push(`<span class="dmark ex">${esc(tx('dnEx'))}${t.excludeReason?': '+esc(t.excludeReason):''}</span>`);
    return `<div class="trow ${t.seq===state.selSeq?'sel':''}${excluded?' exd':''}" data-seq="${t.seq}">
      <span class="tag">${esc(t.tag)}</span>
      <span class="rep">${esc(pn(t.rep,''))}</span>${membChip(t)}
      <span class="dpax">${excluded?'-':net+nw}</span>
      ${(!excluded&&net!==base)?`<span class="pax">(${base}${nw})</span>`:''}
      <span class="room">${t.rooms.length?t.rooms.join(','):`<span style="color:var(--muted)">${tx('unassigned')}</span>`}</span>
      <span class="accom">${esc(accomL(t.accom))}</span>
      ${marks.join('')}
    </div>`;
  };
  const sorted=a=>a.slice().sort((x,y)=>(x.accom||'').localeCompare(y.accom||'')||String(x.tag).localeCompare(String(y.tag)));
  const main=list.length?sorted(list).map(t=>row(t,false)).join(''):`<div class="empty">${tx('noneApplicable')}</div>`;
  const exHtml=ex.length?`<div class="sect"><div class="sh dineex">${tx('secDineEx')}<span class="c">${ex.length}${tw}</span></div>`
    +sorted(ex).map(t=>row(t,true)).join('')+`</div>`:'';
  return `<div class="sect" id="sec-dine"><div class="sh dine">${tx('secDine')}<span class="c">${total}${nw} · ${list.length}${tw}</span></div>
    <div class="dhint">${tx('dineHint')}</div>${main}</div>${exHtml}`;
}

// ── 체크아웃 처리 ────────────────────────────────────────────────────────
//  담당자가 명시적으로 누르는 행위 = 정산완료 신호(Min 결정). 잔액 0 자동판정은
//  아무것도 안 산 팀이 입실 첫날부터 잔액 0이라 쓸 수 없다.
//  잔액이 남아도 막지 않는다(후불·B2B 이월이 실제로 있음) — 경고 후 진행.
function coSelected(kind){
  const root=kind?document.getElementById('sec-'+kind):document; if(!root) return [];
  return [...root.querySelectorAll('.cock:checked')].map(c=>Number(c.dataset.cos));
}
function refreshCoBar(){
  const b=document.getElementById('btn-co-sel'); if(b) b.textContent=tx('btnCoSel')(coSelected('dep').length);
  const c=document.getElementById('btn-ci-sel'); if(c) c.textContent=tx('btnCiSel')(coSelected('arr').length);
}
//  status='체크아웃' = 퇴실 처리 / '체크인' = 도착 확인.
//  undo=true 면 '체크인' 이 **체크아웃 취소**를 뜻한다(같은 상태값, 다른 확인 문구).
async function doCheckout(seqs,status,undo){
  if(!supa){ toast(tx('connectFirst'),'err'); return; }
  seqs=[...new Set(seqs)].filter(Boolean);
  if(!seqs.length){ toast(status==='체크인'&&!undo?tx('ciNone'):tx('coNone'),'warn'); return; }
  if(status==='체크아웃'){
    const due=seqs.map(s=>state.byId[s]).filter(t=>t&&t.bal>0);
    const msg=due.length ? tx('coDue')(due.length, yen(due.reduce((s,t)=>s+t.bal,0)))
                         : tx('coConfirm')(seqs.length);
    if(!confirm(msg)) return;
  }else if(undo){ if(!confirm(tx('coUndoConfirm'))) return; }
  else if(!confirm(tx('ciConfirm')(seqs.length))) return;
  try{
    const {data,error}=await supa.rpc('set_check_status',{p_seqs:seqs,p_status:status,p_by:curUser()});
    if(error) throw error;
    seqs.forEach(s=>{ const t=state.byId[s]; if(!t) return;
      t.co=(status==='체크아웃'); t.ci=true; });   // 체크인·체크아웃 둘 다 '도착함'
    render();
    toast((status==='체크아웃'?tx('coOk'):(undo?tx('coOk'):tx('ciOk')))((data&&data.updated)||seqs.length),'ok');
  }catch(e){ toast(tx('coFail')+e.message,'err'); }
}
// 목록 행 회원 칩 — 클릭 전 VIP 식별. 등급 라벨 그대로(서열 없음), 없으면 '회원'
function membChip(t){
  if(!t.memb||!t.memb.n) return '';
  const g=t.memb.g, keys=Object.keys(g).filter(k=>k!=='일반');
  const lab=keys.map(k=>k==='회원'?tx('obMember'):k).join('·');
  return `<span class="memchip" title="${tx('obMemberT')}">${esc(lab)}</span>`;
}
function selectTeam(seq){
  state.selSeq=seq; render();
  const col=document.querySelector('.stage>.col:last-child');
  if(col && col.scrollTop) col.scrollTop=0;
}
// 운영 상태 배지 — 각 섹션에서 입력한 것을 팀 카드 한 곳에 모음(조기퇴실·석식·키택·운영팀·확인필요)
function statusBadges(t){
  const b=[];
  // 회원 배지 — 등급 라벨 그대로 나열(서열 없음, member_class(V) 있으면 골드·특별 등, 없으면 '회원'). 팀 내 회원 응대 식별용
  if(t.memb && t.memb.n>0){
    const g=t.memb.g, keys=Object.keys(g).filter(k=>k!=='일반');
    const txt=keys.map(k=>`${k==='회원'?tx('obMember'):k} ${g[k]}`).join(' · ');
    b.push(`<span class="ob mem" title="${tx('obMemberT')}">${esc(txt)}</span>`);
  }
  if(t.ecoCnt>0) b.push(`<span class="ob warn" title="${tx('obEcoT')}">🛫 ${tx('obEco')} ${t.ecoCnt}</span>`);
  if(t.excluded) b.push(`<span class="ob err" title="${tx('obExclT')}">🍽 ${tx('obExcl')}</span>`);
  if(t.dinnerSplit) b.push(`<span class="ob gold" title="${tx('obSplitT')}">✂ ${tx('obSplit')}</span>`);
  if(t.teamGroup) b.push(`<span class="ob gold" title="${tx('obTeamT')}: ${esc(t.teamGroup)}">🔗 ${tx('obTeam')}</span>`);
  if(t.followups&&t.followups.length){ const f=t.followups[0]; const href=f.link||('settle.html?ym='+ymOf(t.dep)+'&seq='+t.seq);
    b.push(`<a class="ob err" href="${esc(href)}" title="${esc(t.followups.map(x=>x.title).join(' / '))}">🔔 ${tx('obFu')} ${t.followups.length}</a>`); }
  return b.length?`<div class="ostat">${b.join('')}</div>`:'';
}

// ── 결제 기록 ────────────────────────────────────────────────────────────
//  손님이 프론트에서 돈을 내는 자리가 곧 여기다 → 정산 화면까지 가지 않고 바로 기록한다.
//  ⚠ 넣기만 한다. **취소·정정은 정산 화면**에서 — 잘못 누른 것을 같은 자리에서 지우게 두면
//    되돌린 줄 알고 두 번 지우는 사고가 난다(금전 기록이라 흔적을 남겨 고친다).
//  청구가 팀·개인으로 갈리면(N분의1) folio 를 골라 넣는다. 하나뿐이면 고를 것도 없다.
let PAYM='';   // 이번에 고른 결제수단(현금/카드)
//  ⚠ 담당자를 결제마다 적게 하지 않는다(Min 결정) — 프론트는 공용 계정이라 이름칸을 두면
//    교대 후에도 이전 사람 이름이 그대로 남아 **틀린 이름**이 기록된다(빈 값보다 나쁘다).
//    대신 **받은 시각(paid_at)** 을 남기고 화면에 보여 준다 — 그 시간대 근무자는 근무표로 안다.
function payBoxHtml(t){
  const fs=(t.folios||[]).filter(f=>f.cnt>0);
  if(!fs.length) return `<div class="paybox"><div class="pt">${tx('payTitle')}</div><div class="hh2">${tx('payNoFolio')}</div></div>`;
  if(!canSettle()) return `<div class="paybox"><div class="pt">${tx('payTitle')}</div><div class="deny2">${tx('payDeny')}</div></div>`;
  const sel=fs.length>1
    ? `<div class="prow"><select id="pay-folio">`+fs.map(f=>`<option value="${esc(f.id)}" data-bal="${f.bal}">`
        +`${f.subject==='member'?esc(f.name||'-'):tx('payTeamFolio')} · ${tx('balance')} ${yen(f.bal)}</option>`).join('')+`</select></div>`
    : `<input type="hidden" id="pay-folio" value="${esc(fs[0].id)}" data-bal="${fs[0].bal}">`;
  const def=Math.max(0,fs[0].bal);
  return `<div class="paybox">
    <div class="pt">${tx('payTitle')}</div>
    ${sel}
    <div class="prow">
      <button type="button" class="pmb" id="pm-cash" data-m="현금">${tx('payCash')}</button>
      <button type="button" class="pmb card" id="pm-card" data-m="카드">${tx('payCard')}</button>
      <input class="amt" id="pay-amt" type="number" min="0" step="1" value="${def}" title="${tx('payAmtHint')}">
      <button type="button" class="go" id="pay-go">${tx('payDo')}</button>
    </div>
    <div class="hh2">${tx('payAmtHint')} · ${tx('payTimeHint')} · ${tx('payFixHint')}</div>
    <div class="plist" id="pay-list"></div>
  </div>`;
}
//  정산 권한이 있어야 payments 에 넣을 수 있다(RLS: settle·pos). 없으면 폼 대신 안내를 낸다.
//  ⚠ __so_meAccess() 는 **Promise** 다 → 한 번 풀어서 캐시해 두고 화면은 그 값을 본다.
//    아직 못 읽은 동안엔 막지 않는다(서버 RLS 가 최종 판단이라 틀려도 안전한 쪽).
let _canSettle=null;
function canSettle(){ return _canSettle===null ? true : _canSettle; }
(function primeAccess(){
  if(!window.__so_meAccess) return;
  Promise.resolve(__so_meAccess()).then(a=>{
    if(!a){ _canSettle=null; return; }                    // 미로그인 등 — 판단 보류
    const ar=[].concat(a.areas||[]);
    _canSettle=(a.role==='admin')||ar.indexOf('settle')>=0||ar.indexOf('pos')>=0;
    if(state.selSeq) selectTeam(state.selSeq);            // 이미 열려 있으면 다시 그린다
  }).catch(()=>{ _canSettle=null; });
})();
function wirePayBox(t){
  PAYM='';
  const go=document.getElementById('pay-go'); if(!go) return;
  const fsel=document.getElementById('pay-folio'), amt=document.getElementById('pay-amt');
  //  folio 를 바꾸면 금액 기본값도 그 계정 잔액으로
  if(fsel&&fsel.tagName==='SELECT') fsel.addEventListener('change',()=>{
    const o=fsel.selectedOptions[0]; if(o&&amt) amt.value=Math.max(0,Number(o.dataset.bal||0));
  });
  ['pm-cash','pm-card'].forEach(id=>{ const b=document.getElementById(id); if(!b) return;
    b.addEventListener('click',()=>{
      PAYM=(PAYM===b.dataset.m)?'':b.dataset.m;           // 같은 걸 다시 누르면 해제
      document.getElementById('pm-cash').classList.toggle('on',PAYM==='현금');
      document.getElementById('pm-card').classList.toggle('on',PAYM==='카드');
    });
  });
  go.addEventListener('click',()=>addPaymentFD(t,go));
  renderPayList(t);
}
async function renderPayList(t){
  const box=document.getElementById('pay-list'); if(!box) return;
  const ids=(t.folios||[]).map(f=>f.id);
  if(!ids.length){ box.innerHTML=''; return; }
  try{
    const {data}=await supa.from('payments').select('amount,method,paid_at,received_by,voided')
      .in('folio_id',ids).order('paid_at',{ascending:false}).limit(5);
    const live=(data||[]).filter(p=>!p.voided);
    box.innerHTML=live.length
      ? `<b>${tx('payRecent')}</b> `+live.map(p=>`${esc(payWhen(p.paid_at))} ${esc(methodL(p.method))} <b>${yen(p.amount)}</b>${p.received_by?' · '+esc(p.received_by):''}`).join(' / ')
      : '';
  }catch(e){ box.innerHTML=''; }
}
function methodL(m){ return m==='현금'?tx('payCash'):(m==='카드'?tx('payCard'):(m||'')); }
//  받은 시각 — 오늘이면 시:분만, 다른 날이면 날짜+시:분(현지 시각으로 보여 준다)
function payWhen(ts){
  if(!ts) return '';
  const d=new Date(ts); if(isNaN(d)) return String(ts).slice(5,16).replace('T',' ');
  const p=n=>String(n).padStart(2,'0');
  const hm=p(d.getHours())+':'+p(d.getMinutes());
  const today=new Date();
  const sameDay=d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate();
  return sameDay?hm:(p(d.getMonth()+1)+'/'+p(d.getDate())+' '+hm);
}
async function addPaymentFD(t,btn){
  const fsel=document.getElementById('pay-folio'), amtEl=document.getElementById('pay-amt');
  const folio_id=fsel?fsel.value:'';
  const amount=Math.round(Number(amtEl?amtEl.value:0)||0);
  if(!folio_id) return;
  if(amount<=0){ toast(tx('payNeedAmt'),'warn'); return; }
  if(!PAYM){ toast(tx('payNeedMethod'),'warn'); return; }
  btn.disabled=true;
  try{
    const by=(window.__so_getUser&&__so_getUser())||null;   // 계정(직책) 이름 — 개인 추적은 시각으로
    const {error}=await supa.from('payments').insert({folio_id, method:PAYM, amount, received_by:by});
    if(error) throw error;
    toast(tx('payOk')(yen(amount)+' '+methodL(PAYM)),'ok');
    await load();                                  // 잔액·미수 KPI 까지 같이 맞춘다
    if(state.selSeq===t.seq) selectTeam(t.seq);
  }catch(e){ toast(tx('payFail')+(e.message||e),'err'); }
  finally{ btn.disabled=false; }
}

// ── 領収書 발행 — 손님이 그 자리에서 요구하는 것이라 정산 화면까지 가지 않고 여기서 낸다.
//   발행 팝업·인쇄물은 saizen-ops.js 공용(__so_receipt) = 정산 화면과 같은 한 벌.
//   収入印紙 판정에 **현금 수령액**이 필요해 payments 를 그때 읽는다(목록엔 합계만 있다).
async function openReceiptFD(t){
  if(!window.__so_receipt){ toast(tx('rcLoadFail'),'err'); return; }
  let paid=Math.round(Number(t.paid)||0), cash=0;
  try{
    const {data:fs}=await supa.from('folios').select('folio_id').eq('event_seq',t.seq);
    const ids=(fs||[]).map(f=>f.folio_id);
    if(ids.length){
      const {data:ps}=await supa.from('payments').select('amount,method,voided').in('folio_id',ids);
      const live=(ps||[]).filter(p=>!p.voided);
      paid=Math.round(live.reduce((s,p)=>s+Number(p.amount||0),0));
      cash=Math.round(live.filter(p=>p.method==='현금').reduce((s,p)=>s+Number(p.amount||0),0));
    }
  }catch(e){ toast(tx('rcLoadFail'),'warn'); }   // 합계(t.paid)로라도 진행 — 발행 자체는 막지 않는다
  __so_receipt({ tag:t.tag||t.tagOrig||'', repName:t.rep||'', no:t.no!=null?t.no:t.seq, paid, cash });
}
// ── 카운터 손님 태블릿(pos_customer.html) 연동 ────────────────────────────
//  프런트에서 팀을 고르고 「손님 화면 표시」 → pos_display(station) 에 기록.
//  태블릿은 그 행을 폴링해 그 팀 계산서만 읽기전용으로 띄운다(41_pos_display.sql).
//  계산대가 여럿이면 주소에 ?station=front2 처럼 붙여 나눈다.
const CUST_STATION=new URLSearchParams(location.search).get('station')||'main';
let CUST_SEQ=null;
async function loadCustomerDisplay(){
  if(!supa) return;
  try{
    const {data}=await supa.from('pos_display').select('event_seq').eq('station',CUST_STATION).maybeSingle();
    CUST_SEQ=data&&data.event_seq!=null?Number(data.event_seq):null;
  }catch(e){ CUST_SEQ=null; }
}
async function pushCustomerDisplay(seq){
  if(!supa) return;
  try{
    const {error}=await supa.from('pos_display').upsert(
      {station:CUST_STATION, event_seq:seq, updated_by:curUser()||null, updated_at:new Date().toISOString()},
      {onConflict:'station'});
    if(error) throw error;
    CUST_SEQ=seq;
    toast(seq?tx('custDone'):tx('custClear'),'ok');
    if(state.selSeq && state.byId[state.selSeq]) renderDetail(state.byId[state.selSeq]);
  }catch(e){ toast(tx('custFail')+': '+String(e&&e.message||e),'err'); }
}

function curUser(){ try{ return (window.__so_getUser&&__so_getUser())||''; }catch(e){ return ''; } }
// 프론트에서 바로 비고/메모 저장 → event_note_set RPC(front 영역 허용, 변경이력 자동기록). 별도 메모 페이지 불요.
async function saveNote(seq, field, val){
  const t=state.byId[seq]; if(!t||!supa) return;
  const cur=(field==='remarks'?t.remarks:field==='team_label'?t.teamLabel:t.noteMemo)||'';
  if(String(val).trim()===String(cur).trim()) return;   // 변경 없으면 저장 안 함
  try{
    const {error}=await supa.rpc('event_note_set',{p_event_seq:Number(seq),p_session_ym:ymOf(t.dep),p_field:field,p_value:val,p_user:curUser()});
    if(error) throw error;
    if(field==='remarks') t.remarks=String(val).trim();
    else if(field==='team_label') t.teamLabel=String(val).trim();
    else t.noteMemo=String(val).trim();
    t.memo=[t.remarks,t.noteMemo].filter(Boolean).join(' / ');
    t.search=[t.tag,t.rep,t.accom,t.memo,t.teamLabel,...(t.members||[]),...(t.rooms||[])].filter(Boolean).join(' ').toLowerCase();
    toast(tx('noteSaved'),'ok');
  }catch(e){ toast(tx('noteSaveFail')+e.message,'err'); }
}

// 언어 토글 시 정적 라벨 + 동적 목록 재렌더
// ── 하드웨어 QR 스캐너(HID) — 손님 카드를 찍으면 그 팀이 바로 열린다 ──────────
if(window.__so_hidScan) __so_hidScan(async function(raw){
  if(!supa) return;
  const token=__so_qrToken(raw);
  try{
    const {data}=await supa.from('order_tokens').select('event_seq').eq('token',token).limit(1);
    const seq=data&&data[0]&&data[0].event_seq;
    if(!seq){ toast(tx('qrNoMatch'),'err'); return; }
    if(state.byId&&state.byId[seq]){ selectTeam(Number(seq)); return; }
    toast(tx('qrNotToday'),'warn');          // 그날 목록에 없는 팀(다른 날짜)
  }catch(e){ toast(tx('qrNoMatch'),'err'); }
});
