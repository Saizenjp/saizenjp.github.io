<style>

  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}

  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}

  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}

// ── 등급 판정 = room.html 자동배정과 동일 규칙 ────────────────────────────────
//  3층은 실질 등급 한 단계 아래(3층 디럭스=트윈 / 3층 트윈=컴팩트). 3층엔 컴팩트가 없음.
const LOW_GRADE_FLOOR=3;
const TYPE_DOWNGRADE={'디럭스더블트윈':'트윈','디럭스트윈':'트윈','트윈':'컴팩트트윈'};
const DELUXE_TYPES=['디럭스더블트윈','디럭스트윈'];
function floorOf(inv){ const m=String(inv&&inv.zone||'').match(/^(\d+)층$/); return m?+m[1]:0; }
function effType(inv){
  const t=inv&&inv.room_type||'';
  return (floorOf(inv)===LOW_GRADE_FLOOR && TYPE_DOWNGRADE[t]) ? TYPE_DOWNGRADE[t] : t;
}
function gradeOf(inv){
  const t=effType(inv);
  if(DELUXE_TYPES.includes(t)) return 'dlx';
  if(t==='트윈') return 'twin';
  if(t==='컴팩트트윈') return 'compact';
  return 'etc';
}
const GRADES=['dlx','twin','compact','etc'];
// 실질 등급 기준 디럭스 정원(05_room_inventory_real.sql 실제 재고 · 3층 강등 반영)
//  3·4박=9·6층 각 4실=8실 / 7박=11층(디럭스3+디럭스트윈1)·10·7·4층=16실 / 그 외=12층(디럭스트윈4)·8·5층=10실
const CAPS={3:8, 4:8, 7:16, etc:10};
const GKEY={dlx:'gDlx',twin:'gTwin',compact:'gCompact',etc:'gEtc'};

let supa=null, YEAR=new Date().getFullYear(), DATA=null;

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+tx('loginNeedTitle')+'<small>'+tx('loginNeedSub')+'</small></div></div>'; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;
    renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

async function paged(qf){
  const out=[]; let from=0;
  for(;;){ const {data,error}=await qf(from,from+999); if(error) return {error};
    out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return {data:out};
}
async function pagedIn(table,cols,col,vals){
  const out=[];
  for(let i=0;i<vals.length;i+=200){
    const chunk=vals.slice(i,i+200);
    const r=await paged((a,b)=>supa.from(table).select(cols).in(col,chunk).order(col).range(a,b));
    if(r.error) return r; out.push(...r.data);
  }
  return {data:out};
}

function renderUI(){
  $('#content').innerHTML=`
    <div class="panel">
      <div class="row">
        <span class="cnt">${tx('year')}</span>
        <div class="ymctrl">
          <button class="btn sm ghost" id="y-prev" type="button">◀</button>
          <b id="y-label"></b>
          <button class="btn sm ghost" id="y-next" type="button">▶</button>
        </div>
        <span style="flex:1"></span>
        <span class="cnt" id="stat"></span>
      </div>
      <div class="desc" style="margin-top:8px"><b>${tx('scope')}</b> — ${tx('scopeNote')}</div>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="panel"><h3>${tx('t1')}</h3><div class="desc">${tx('t1d')}</div><div id="tbl1"></div></div>
    <div class="panel"><h3>${tx('t2')}</h3><div class="desc">${tx('t2d')}</div><div id="tbl2"></div></div>
    <div class="panel"><h3>${tx('t3')}</h3><div class="desc">${tx('t3d')}</div><div id="tbl3"></div></div>`;
  $('#y-prev').addEventListener('click',()=>{YEAR--;load();});
  $('#y-next').addEventListener('click',()=>{YEAR++;load();});
}

async function load(){
  if(!supa) return;
  $('#y-label').textContent=YEAR; $('#stat').textContent=tx('loading');
  const from=`${YEAR}-01-01`, to=`${YEAR}-12-31`;
  try{
    // 1) 그 해 입국(dep_date) 예약
    const bs=await paged((a,b)=>supa.from('bookings')
      .select('event_seq,reserved_at,dep_date,arr_date,rep_name').gte('dep_date',from).lte('dep_date',to).order('event_seq').range(a,b));
    if(bs.error) throw bs.error;
    const BMAP={}; (bs.data||[]).forEach(x=>BMAP[x.event_seq]=x);
    const seqs=Object.keys(BMAP).map(Number);
    if(!seqs.length){ DATA=null; $('#stat').textContent=tx('noData'); ['#kpis','#tbl1','#tbl2','#tbl3'].forEach(s=>{const e=$(s); if(e)e.innerHTML='';}); return; }
    // 2) 객실 마스터 · 배정 · 개인 · 생년(사람 식별)
    const invR=await paged((a,b)=>supa.from('room_inventory').select('id,facility,zone,room_no,room_type').order('id').range(a,b));
    if(invR.error) throw invR.error;
    const INV={}; (invR.data||[]).forEach(i=>INV[i.id]=i);
    const rmR=await pagedIn('rooms','event_seq,member_id,inventory_id,room_no,check_in,check_out','event_seq',seqs);
    if(rmR.error) throw rmR.error;
    const gmR=await pagedIn('guest_members','id,event_seq,passenger_id,name_kr,member_grade,member_class,member_div','event_seq',seqs);
    if(gmR.error) throw gmR.error;
    const GM={}; (gmR.data||[]).forEach(m=>GM[m.id]=m);
    const pxR=await pagedIn('passengers','id,name_kr,birth_yymmdd','event_seq',seqs);
    if(pxR.error) throw pxR.error;
    const PX={}; (pxR.data||[]).forEach(p=>PX[p.id]=p);

    // 3) 야마나미 호텔동(3~12층) 배정만, 회원만
    const rows=[];
    (rmR.data||[]).forEach(r=>{
      const inv=INV[r.inventory_id]; if(!inv) return;
      if(inv.facility!=='야마나미리조트' || !/^\d+층$/.test(inv.zone||'')) return;   // 호텔동만
      const m=GM[r.member_id]; if(!m) return;
      if(!(window.SZCore&&SZCore.isMember(m))) return;                              // 회원만
      const b=BMAP[r.event_seq]||{};
      const px=m.passenger_id!=null?PX[m.passenger_id]:null;
      const name=(m.name_kr||(px&&px.name_kr)||'').trim();
      const birth=(px&&px.birth_yymmdd)||'';
      rows.push({
        eventSeq:r.event_seq, grade:gradeOf(inv), floor:floorOf(inv), roomNo:r.room_no,
        rsvM: b.reserved_at ? String(b.reserved_at).slice(0,7) : '',
        ci:r.check_in, co:r.check_out,
        nights: Math.max(0,Math.round((new Date(r.check_out)-new Date(r.check_in))/864e5)),
        key: name+(birth?'|'+birth:'|?'+r.event_seq), name
      });
    });
    DATA={rows};
    $('#stat').textContent=`${rows.length}`;
    renderAll();
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFail')+': '+e.message,'err'); }
}

function renderAll(){
  if(!DATA||!DATA.rows.length){ ['#kpis','#tbl1','#tbl2','#tbl3'].forEach(s=>{const e=$(s); if(e)e.innerHTML='';}); return; }
  const rows=DATA.rows;
  // ── 사람 단위 집계 ──
  const byPerson={};
  rows.forEach(r=>{ const p=byPerson[r.key]||(byPerson[r.key]={name:r.name,stays:0,grades:{}});
    p.stays++; p.grades[r.grade]=(p.grades[r.grade]||0)+1; });
  const people=Object.values(byPerson);
  const noDlx=people.filter(p=>!p.grades.dlx).sort((a,b)=>b.stays-a.stays||a.name.localeCompare(b.name));
  const dlxStays=rows.filter(r=>r.grade==='dlx').length;

  // KPI
  $('#kpis').innerHTML=[
    {k:tx('kMembers'),v:people.length,s:''},
    {k:tx('kStays'),v:rows.length,s:tx('perStay')},
    {k:tx('kNoDlx'),v:noDlx.length,s:tx('ofMembers')(people.length),cls:noDlx.length?'bad':'good'},
    {k:tx('kDlxRate'),v:Math.round(dlxStays/rows.length*100)+'%',s:tx('perStay')}
  ].map(x=>`<div class="kpi ${x.cls||''}"><div class="k">${esc(x.k)}</div><div class="v">${esc(String(x.v))}</div><div class="s">${esc(x.s)}</div></div>`).join('');

  // ── ① 예약월 × 등급 ──
  const byM={};
  rows.forEach(r=>{ const k=r.rsvM||'__'; (byM[k]=byM[k]||{dlx:0,twin:0,compact:0,etc:0}); byM[k][r.grade]++; });
  const months=Object.keys(byM).filter(k=>k!=='__').sort();
  if(byM['__']) months.push('__');
  const tot={dlx:0,twin:0,compact:0,etc:0};
  const maxTot=Math.max(1,...months.map(m=>GRADES.reduce((s,g)=>s+byM[m][g],0)));
  const trs=months.map(m=>{
    const c=byM[m], t=GRADES.reduce((s,g)=>s+c[g],0);
    GRADES.forEach(g=>tot[g]+=c[g]);
    const pct=t?Math.round(c.dlx/t*100):0;
    const hl=(m!=='__' && +m.slice(0,4)===YEAR-1 && +m.slice(5,7)>=9);   // 작년 9~12월 강조
    return `<tr class="${hl?'hl':''}"><td>${m==='__'?esc(tx('unknown')):esc(m)}</td>`
      +GRADES.map(g=>`<td class="${c[g]?'':'z'}">${c[g]||'·'}</td>`).join('')
      +`<td>${t}</td><td>${pct}%<span class="bar${pct>=60?'':pct>=30?' d':' c'}" style="width:${Math.round(pct*0.42)}px"></span></td></tr>`;
  }).join('');
  const totT=GRADES.reduce((s,g)=>s+tot[g],0);
  $('#tbl1').innerHTML=`<table class="t"><thead><tr><th>${tx('cMonth')}</th><th>${tx('cDlx')}</th><th>${tx('cTwin')}</th><th>${tx('cCompact')}</th><th>${tx('cEtc')}</th><th>${tx('cTotal')}</th><th>${tx('cDlxPct')}</th></tr></thead>`
    +`<tbody>${trs}<tr class="sum"><td>${tx('cTotal')}</td>`+GRADES.map(g=>`<td>${tot[g]}</td>`).join('')
    +`<td>${totT}</td><td>${totT?Math.round(tot.dlx/totT*100):0}%</td></tr></tbody></table>`
    +(byM['__']?`<div class="lgd">${esc(tx('noRsv'))}</div>`:'');

  // ── ② 디럭스 0회 회원 ──
  $('#tbl2').innerHTML = noDlx.length
    ? `<div class="warnbox">${esc(tx('someBad')(noDlx.length))}</div>`
      +`<div class="namelist">${noDlx.map(p=>`<span class="nm">${esc(p.name||'-')}<small>${p.stays}× · ${GRADES.filter(g=>p.grades[g]).map(g=>esc(tx(GKEY[g]))).join('/')}</small></span>`).join('')}</div>`
    : `<div class="okbox">${esc(tx('noneGood'))}</div>`;

  // ── ③ 박수별 디럭스 경합 ──
  const FIXED={3:[9,6,3],4:[9,6,3],7:[11,10,7,4]}, FLEX=[12,8,5];
  const buckets=[{n:3,fl:FIXED[3]},{n:4,fl:FIXED[4]},{n:7,fl:FIXED[7]},{n:null,fl:FLEX}];
  // 각 버킷의 디럭스 정원(실질 등급 기준) — 로드된 재고에서 직접 센다
  const rows3=buckets.map(bk=>{
    const inBucket=r=> bk.n!=null ? r.nights===bk.n : ![3,4,7].includes(r.nights);
    const sel=rows.filter(inBucket);
    // 피크일 = 그 버킷에서 같은 날 밤에 동시에 묵은 회원 최대 수
    const days={};
    sel.forEach(r=>{ for(let d=new Date(r.ci); d<new Date(r.co); d.setDate(d.getDate()+1)){
      const k=d.toISOString().slice(0,10); days[k]=(days[k]||0)+1; } });
    const peak=Math.max(0,...Object.values(days));
    const cap=(CAPS[bk.n==null?'etc':bk.n]||0);
    const short=Math.max(0,peak-cap*2);
    return `<tr class="${short?'hl':''}"><td>${bk.n!=null?tx('nights')(bk.n):tx('etcNights')}</td>`
      +`<td style="font-family:inherit">${esc(tx('floors')(bk.fl))}</td>`
      +`<td>${esc(tx('rooms')(cap))} (${esc(tx('people')(cap*2))})</td>`
      +`<td>${peak}</td><td class="${short?'':'z'}">${short||'·'}</td></tr>`;
  }).join('');
  $('#tbl3').innerHTML=`<table class="t"><thead><tr><th>${tx('cNights')}</th><th>${tx('cFloors')}</th><th>${tx('cCap')}</th><th>${tx('cPeak')}</th><th>${tx('cShort')}</th></tr></thead><tbody>${rows3}</tbody></table>`;
}
function applyStatic(){
  const step=$('#t-step'); if(step) step.textContent=tx('step');
  const home=$('#t-home'); if(home) home.textContent=tx('home');
  const hint=$('#t-connhint'); if(hint) hint.textContent=tx('connHint');
  const pre=$('#t-preconn'); if(pre) pre.textContent=tx('preConn');
  const btn=$('#btn-connect');
  if(supa){ setConn(tx('connOk'),'ok'); if(btn) btn.textContent=tx('connectedBtn'); }
  else { setConn(tx('notConn'),''); if(btn) btn.textContent=tx('connect'); }
}
window.onSaizenLangChange=function(){ applyStatic(); if(supa){ renderUI(); $('#y-label').textContent=YEAR; renderAll(); } };

$('#btn-connect').addEventListener('click',connect);
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }
