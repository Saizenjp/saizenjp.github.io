<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 방배정 통계(회원 객실등급)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:4px}
  .panel .desc{font-size:12px;color:var(--text2);margin:6px 0 11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:58px;text-align:center}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}
  .kpi{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
  .kpi .k{font-size:11px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:22px;font-weight:800;font-family:var(--mono);line-height:1.2;margin-top:2px}
  .kpi.bad .v{color:var(--err)} .kpi.good .v{color:var(--ok)}
  .kpi .s{font-size:11px;color:var(--text2);font-weight:600}
  table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.t th{background:var(--surface2);border-bottom:1px solid var(--border2);padding:7px 9px;text-align:right;font-size:11px;color:var(--text2);font-weight:700;white-space:nowrap}
  table.t th:first-child{text-align:left}
  table.t td{border-bottom:1px solid var(--border);padding:6px 9px;text-align:right;font-family:var(--mono);white-space:nowrap}
  table.t td:first-child{text-align:left;font-family:inherit;font-weight:700}
  table.t tr:hover td{background:var(--surface2)}
  table.t tr.hl td{background:#fdf6e7}
  table.t tr.sum td{border-top:2px solid var(--border2);font-weight:800;background:var(--surface2)}
  table.t td.z{color:var(--muted)}
  table.t td.bad{color:var(--err);font-weight:800}
  table.t td.good{color:var(--ok)}
  .bar{display:inline-block;height:8px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-left:6px;min-width:2px}
  .bar.d{background:var(--accent2)} .bar.c{background:var(--muted)}
  .lgd{font-size:11px;color:var(--muted);font-weight:600;margin-top:6px}
  .warnbox{background:#fdf6e7;border:1px solid #e6d3a3;border-radius:9px;padding:9px 12px;font-size:12px;color:#6b5312;font-weight:600;margin-top:10px}
  .okbox{background:var(--accentSoft);border:1px solid #b4cda0;border-radius:9px;padding:9px 12px;font-size:12px;color:#234d2f;font-weight:700;margin-top:10px}
  .namelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:280px;overflow:auto}
  .nm{font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 9px}
  .nm small{font-weight:600;color:var(--muted);margin-left:5px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>
<link rel="stylesheet" href="../assets/saizen-ops.css?v=23.9">
</head>
<body data-so-area="room">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈"><img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen"></a>
  <span class="step" id="t-step">방배정 통계</span>
  <a class="navhome" href="../index.html" id="t-home">← 홈</a>
  <div class="grow so-spacer"></div>
  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>

      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>

  <span class="pill" id="conn-state">미연결</span>
</div>

<div class="conn">
  <input class="inp" id="sb-url" type="text" placeholder="Supabase Project URL" autocomplete="off">
  <input class="inp" id="sb-key" type="password" placeholder="Publishable key" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button">연결</button>
  <span class="hint" id="t-connhint">야마나미 호텔동 방배정을 읽어 회원이 어느 객실등급에 배정됐는지 집계합니다. 읽기 전용.</span>
</div>

<div class="wrap" id="content">

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}

// ── 등급 판정 = room.html 자동배정과 동일 규칙 ────────────────────────────────
//  3층은 실질 등급 한 단계 아래(3층 디럭스=트윈 / 3층 트윈=컴팩트). 3층엔 컴팩트가 없음.
const LOW_GRADE_FLOOR=3;
const TYPE_DOWNGRADE={'디럭스더블트윈':'트윈','디럭스트윈':'트윈','트윈':'컴팩트트윈'};
const DELUXE_TYPES=['디럭스더블트윈','디럭스트윈'];
function floorOf(inv){ const m=String(inv&&inv.zone||'').match(/^(\d+)층$/); return m?+m[1]:0; }
function effType(inv){
  const t=inv&&inv.room_type||'';
  return (floorOf(inv)===LOW_GRADE_FLOOR && TYPE_DOWNGRADE[t]) ? TYPE_DOWNGRADE[t] : t;
}
function gradeOf(inv){
  const t=effType(inv);
  if(DELUXE_TYPES.includes(t)) return 'dlx';
  if(t==='트윈') return 'twin';
  if(t==='컴팩트트윈') return 'compact';
  return 'etc';
}
const GRADES=['dlx','twin','compact','etc'];
// 실질 등급 기준 디럭스 정원(05_room_inventory_real.sql 실제 재고 · 3층 강등 반영)
//  3·4박=9·6층 각 4실=8실 / 7박=11층(디럭스3+디럭스트윈1)·10·7·4층=16실 / 그 외=12층(디럭스트윈4)·8·5층=10실
const CAPS={3:8, 4:8, 7:16, etc:10};
const GKEY={dlx:'gDlx',twin:'gTwin',compact:'gCompact',etc:'gEtc'};

let supa=null, YEAR=new Date().getFullYear(), DATA=null;
// ⑤ 예약일 기간(기본 = Min 요청 구간 2025-09-08 ~ 1주일)
const RSV={from:'2025-09-08', to:'2025-09-14'};

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+tx('loginNeedTitle')+'<small>'+tx('loginNeedSub')+'</small></div></div>'; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;
    renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

async function paged(qf){
  const out=[]; let from=0;
  for(;;){ const {data,error}=await qf(from,from+999); if(error) return {error};
    out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return {data:out};
}
async function pagedIn(table,cols,col,vals){
  const out=[];
  for(let i=0;i<vals.length;i+=200){
    const chunk=vals.slice(i,i+200);
    const r=await paged((a,b)=>supa.from(table).select(cols).in(col,chunk).order(col).range(a,b));
    if(r.error) return r; out.push(...r.data);
  }
  return {data:out};
}

async function load(){
  if(!supa) return;
  $('#y-label').textContent=YEAR; $('#stat').textContent=tx('loading');
  const from=`${YEAR}-01-01`, to=`${YEAR}-12-31`;
  try{
    // 1) 그 해 입국(dep_date) 예약
    const bs=await paged((a,b)=>supa.from('bookings')
      .select('event_seq,reserved_at,dep_date,arr_date,rep_name').gte('dep_date',from).lte('dep_date',to).order('event_seq').range(a,b));
    if(bs.error) throw bs.error;
    const BMAP={}; (bs.data||[]).forEach(x=>BMAP[x.event_seq]=x);
    const seqs=Object.keys(BMAP).map(Number);
    if(!seqs.length){ DATA=null; $('#stat').textContent=tx('noData'); ['#kpis','#tbl1','#tbl2','#tbl3','#tbl4','#tbl5'].forEach(s=>{const e=$(s); if(e)e.innerHTML='';}); return; }
    // 2) 객실 마스터 · 배정 · 개인 · 생년(사람 식별)
    const invR=await paged((a,b)=>supa.from('room_inventory').select('id,facility,zone,room_no,room_type').order('id').range(a,b));
    if(invR.error) throw invR.error;
    const INV={}; (invR.data||[]).forEach(i=>INV[i.id]=i);
    const rmR=await pagedIn('rooms','event_seq,member_id,inventory_id,room_no,check_in,check_out','event_seq',seqs);
    if(rmR.error) throw rmR.error;
    const gmR=await pagedIn('guest_members','id,event_seq,passenger_id,name_kr,member_grade,member_class,member_div','event_seq',seqs);
    if(gmR.error) throw gmR.error;
    const GM={}; (gmR.data||[]).forEach(m=>GM[m.id]=m);
    const pxR=await pagedIn('passengers','id,name_kr,birth_yymmdd','event_seq',seqs);
    if(pxR.error) throw pxR.error;
    const PX={}; (pxR.data||[]).forEach(p=>PX[p.id]=p);

    // 3-a) 호텔동 배정 전체(회원·일반 모두) — ④ 동반 일반고객 부족분 계산용
    const stays=[];
    (rmR.data||[]).forEach(r=>{
      const inv=INV[r.inventory_id]; if(!inv) return;
      if(inv.facility!=='야마나미리조트' || !/^\d+층$/.test(inv.zone||'')) return;
      const m=GM[r.member_id]; if(!m) return;
      stays.push({ seq:r.event_seq, mem:!!(window.SZCore&&SZCore.isMember(m)), ci:r.check_in, co:r.check_out });
    });
    // 실질 등급 기준 디럭스 보유 실수(호텔동)
    const dlxSupply=(invR.data||[]).filter(i=>i.facility==='야마나미리조트' && /^\d+층$/.test(i.zone||'') && gradeOf(i)==='dlx').length;

    // 3-b) 회원 배정만(①②③용)
    const rows=[];
    (rmR.data||[]).forEach(r=>{
      const inv=INV[r.inventory_id]; if(!inv) return;
      if(inv.facility!=='야마나미리조트' || !/^\d+층$/.test(inv.zone||'')) return;   // 호텔동만
      const m=GM[r.member_id]; if(!m) return;
      if(!(window.SZCore&&SZCore.isMember(m))) return;                              // 회원만
      const b=BMAP[r.event_seq]||{};
      const px=m.passenger_id!=null?PX[m.passenger_id]:null;
      const nameKr=(m.name_kr||(px&&px.name_kr)||'').trim();
      const name=(window.__so_pname?__so_pname(nameKr,m.name_en):nameKr)||nameKr;
      const birth=(px&&px.birth_yymmdd)||'';
      rows.push({
        eventSeq:r.event_seq, grade:gradeOf(inv), floor:floorOf(inv), roomNo:r.room_no,
        rsvM: b.reserved_at ? String(b.reserved_at).slice(0,7) : '',
        rsv: b.reserved_at ? String(b.reserved_at).slice(0,10) : '',
        rep: b.rep_name||'', dep: b.dep_date||'',
        ci:r.check_in, co:r.check_out,
        nights: Math.max(0,Math.round((new Date(r.check_out)-new Date(r.check_in))/864e5)),
        key: name+(birth?'|'+birth:'|?'+r.event_seq), name
      });
    });
    DATA={rows, stays, dlxSupply};
    $('#stat').textContent=`${rows.length}`;
    renderAll();
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFail')+': '+e.message,'err'); }
}

function renderAll(){
  if(!DATA||!DATA.rows.length){ ['#kpis','#tbl1','#tbl2','#tbl3','#tbl4','#tbl5'].forEach(s=>{const e=$(s); if(e)e.innerHTML='';}); return; }
  const rows=DATA.rows;
  // ── 사람 단위 집계 ──
  const byPerson={};
  rows.forEach(r=>{ const p=byPerson[r.key]||(byPerson[r.key]={name:r.name,stays:0,grades:{}});
    p.stays++; p.grades[r.grade]=(p.grades[r.grade]||0)+1; });
  const people=Object.values(byPerson);
  const noDlx=people.filter(p=>!p.grades.dlx).sort((a,b)=>b.stays-a.stays||a.name.localeCompare(b.name));
  const dlxStays=rows.filter(r=>r.grade==='dlx').length;

  // KPI
  $('#kpis').innerHTML=[
    {k:tx('kMembers'),v:people.length,s:''},
    {k:tx('kStays'),v:rows.length,s:tx('perStay')},
    {k:tx('kNoDlx'),v:noDlx.length,s:tx('ofMembers')(people.length),cls:noDlx.length?'bad':'good'},
    {k:tx('kDlxRate'),v:Math.round(dlxStays/rows.length*100)+'%',s:tx('perStay')}
  ].map(x=>`<div class="kpi ${x.cls||''}"><div class="k">${esc(x.k)}</div><div class="v">${esc(String(x.v))}</div><div class="s">${esc(x.s)}</div></div>`).join('');

  // ── ① 예약월 × 등급 ──
  const byM={};
  rows.forEach(r=>{ const k=r.rsvM||'__'; (byM[k]=byM[k]||{dlx:0,twin:0,compact:0,etc:0}); byM[k][r.grade]++; });
  const months=Object.keys(byM).filter(k=>k!=='__').sort();
  if(byM['__']) months.push('__');
  const tot={dlx:0,twin:0,compact:0,etc:0};
  const maxTot=Math.max(1,...months.map(m=>GRADES.reduce((s,g)=>s+byM[m][g],0)));
  const trs=months.map(m=>{
    const c=byM[m], t=GRADES.reduce((s,g)=>s+c[g],0);
    GRADES.forEach(g=>tot[g]+=c[g]);
    const pct=t?Math.round(c.dlx/t*100):0;
    const hl=(m!=='__' && +m.slice(0,4)===YEAR-1 && +m.slice(5,7)>=9);   // 작년 9~12월 강조
    return `<tr class="${hl?'hl':''}"><td>${m==='__'?esc(tx('unknown')):esc(m)}</td>`
      +GRADES.map(g=>`<td class="${c[g]?'':'z'}">${c[g]||'·'}</td>`).join('')
      +`<td>${t}</td><td>${pct}%<span class="bar${pct>=60?'':pct>=30?' d':' c'}" style="width:${Math.round(pct*0.42)}px"></span></td></tr>`;
  }).join('');
  const totT=GRADES.reduce((s,g)=>s+tot[g],0);
  $('#tbl1').innerHTML=`<table class="t"><thead><tr><th>${tx('cMonth')}</th><th>${tx('cDlx')}</th><th>${tx('cTwin')}</th><th>${tx('cCompact')}</th><th>${tx('cEtc')}</th><th>${tx('cTotal')}</th><th>${tx('cDlxPct')}</th></tr></thead>`
    +`<tbody>${trs}<tr class="sum"><td>${tx('cTotal')}</td>`+GRADES.map(g=>`<td>${tot[g]}</td>`).join('')
    +`<td>${totT}</td><td>${totT?Math.round(tot.dlx/totT*100):0}%</td></tr></tbody></table>`
    +(byM['__']?`<div class="lgd">${esc(tx('noRsv'))}</div>`:'');

  // ── ② 디럭스 0회 회원 ──
  $('#tbl2').innerHTML = noDlx.length
    ? `<div class="warnbox">${esc(tx('someBad')(noDlx.length))}</div>`
      +`<div class="namelist">${noDlx.map(p=>`<span class="nm">${esc(p.name||'-')}<small>${p.stays}× · ${GRADES.filter(g=>p.grades[g]).map(g=>esc(tx(GKEY[g]))).join('/')}</small></span>`).join('')}</div>`
    : `<div class="okbox">${esc(tx('noneGood'))}</div>`;

  // ── ③ 박수별 디럭스 경합 ──
  const FIXED={3:[9,6,3],4:[9,6,3],7:[11,10,7,4]}, FLEX=[12,8,5];
  const buckets=[{n:3,fl:FIXED[3]},{n:4,fl:FIXED[4]},{n:7,fl:FIXED[7]},{n:null,fl:FLEX}];
  // 각 버킷의 디럭스 정원(실질 등급 기준) — 로드된 재고에서 직접 센다
  const rows3=buckets.map(bk=>{
    const inBucket=r=> bk.n!=null ? r.nights===bk.n : ![3,4,7].includes(r.nights);
    const sel=rows.filter(inBucket);
    // 피크일 = 그 버킷에서 같은 날 밤에 동시에 묵은 회원 최대 수
    const days={};
    sel.forEach(r=>{ for(let d=new Date(r.ci); d<new Date(r.co); d.setDate(d.getDate()+1)){
      const k=d.toISOString().slice(0,10); days[k]=(days[k]||0)+1; } });
    const peak=Math.max(0,...Object.values(days));
    const cap=(CAPS[bk.n==null?'etc':bk.n]||0);
    const short=Math.max(0,peak-cap*2);
    return `<tr class="${short?'hl':''}"><td>${bk.n!=null?tx('nights')(bk.n):tx('etcNights')}</td>`
      +`<td style="font-family:inherit">${esc(tx('floors')(bk.fl))}</td>`
      +`<td>${esc(tx('rooms')(cap))} (${esc(tx('people')(cap*2))})</td>`
      +`<td>${peak}</td><td class="${short?'':'z'}">${short||'·'}</td></tr>`;
  }).join('');
  $('#tbl3').innerHTML=`<table class="t"><thead><tr><th>${tx('cNights')}</th><th>${tx('cFloors')}</th><th>${tx('cCap')}</th><th>${tx('cPeak')}</th><th>${tx('cShort')}</th></tr></thead><tbody>${rows3}</tbody></table>`;

  // ── ④ 회원 동반 일반고객까지 같은 등급으로 줄 때의 부족분 ──────────────
  //  Min 2026-08: "일반고객은 무조건 회원보다 후순위"가 아니라, 회원과 같이 온
  //  일반고객도 그 회원과 같은 등급으로 넣을 경우 얼마나 부족한지.
  //  · 1박 단위로 그 밤에 묵는 팀을 보고, 회원이 있는 팀만 디럭스 대상.
  //  · 필요 실수 = ceil(그 팀 인원/2). 회원만/동반포함 두 가지로 계산.
  const stays=DATA.stays||[], supply=DATA.dlxSupply||0;
  const nights={};   // 날짜 → { event_seq → {mem,gen} }
  stays.forEach(st=>{
    if(!st.ci||!st.co) return;
    const c=SZCore.parseLocalDate(st.ci), e=SZCore.parseLocalDate(st.co);
    if(isNaN(c)||isNaN(e)) return;
    for(const d=new Date(c); d<e; d.setDate(d.getDate()+1)){
      const ds=SZCore.fmtDate(d); if(ds.slice(0,4)!==String(YEAR)) continue;
      const t=(nights[ds]=nights[ds]||{});
      const x=(t[st.seq]=t[st.seq]||{mem:0,gen:0});
      st.mem?x.mem++:x.gen++;
    }
  });
  const perNight=Object.keys(nights).sort().map(d=>{
    let needM=0, needC=0;
    Object.values(nights[d]).forEach(x=>{
      if(!x.mem) return;                               // 회원 없는 팀 = 디럭스 대상 아님
      needM+=Math.ceil(x.mem/2);
      needC+=Math.ceil((x.mem+x.gen)/2);
    });
    return {d, needM, needC, short:Math.max(0,needC-supply)};
  });
  const byMon={};
  perNight.forEach(n=>{ const m=n.d.slice(0,7);
    const b=byMon[m]||(byMon[m]={needM:0,needC:0,short:0,days:0,peak:''});
    if(n.needM>b.needM) b.needM=n.needM;
    if(n.needC>b.needC){ b.needC=n.needC; b.peak=n.d; }
    if(n.short>b.short) b.short=n.short;
    if(n.short>0) b.days++;
  });
  const mk=Object.keys(byMon).sort();
  const maxShort=perNight.reduce((n,x)=>Math.max(n,x.short),0);
  const shortDays=perNight.filter(x=>x.short>0).length;
  const rows4=mk.map(m=>{ const b=byMon[m];
    return `<tr>
      <td>${esc(m)}</td>
      <td>${b.needM}</td>
      <td class="${b.needC>supply?'bad':''}">${b.needC}</td>
      <td>${b.needC-b.needM>0?('+'+(b.needC-b.needM)):'-'}</td>
      <td>${supply}</td>
      <td class="${b.short?'bad':'good'}">${b.short||'-'}</td>
      <td>${b.days||'-'}</td>
      <td class="mono" style="font-size:11px">${esc(b.peak?b.peak.slice(5):'')}</td>
    </tr>`; }).join('');
  $('#tbl4').innerHTML = mk.length
    ? (maxShort?`<div class="warnbox">${esc(tx('t4bad')(maxShort,shortDays))}</div>`:`<div class="okbox">${esc(tx('t4ok'))}</div>`)
      +`<table class="t"><thead><tr><th>${tx('c4Month')}</th><th>${tx('c4NeedM')}</th><th>${tx('c4NeedC')}</th><th>${tx('c4Add')}</th>`
      +`<th>${tx('c4Supply')}</th><th>${tx('c4Short')}</th><th>${tx('c4Days')}</th><th>${tx('c4Peak')}</th></tr></thead><tbody>${rows4}</tbody></table>`
      +`<div class="lgd">${esc(tx('t4sup')(supply))}</div>`
    : '';

  renderRange();   // ⑤ 예약일 기간 필터
}
// ── ⑤ 예약일 기간으로 좁혀보기 ────────────────────────────────────────────
//  Min: "2025-09-08부터 1주일 사이에 들어온 예약으로 회원이 디럭스를 못 받는 경우가 많은지".
//  reserved_at 이 그 구간인 예약만 골라, 그 예약의 회원들이 실제로 받은 등급을 본다.
function renderRange(){
  const box=$('#tbl5'); if(!box) return;
  if(!DATA||!DATA.rows.length){ box.innerHTML=''; return; }
  const {from,to}=RSV;
  const rows=DATA.rows.filter(r=> r.rsv && (!from||r.rsv>=from) && (!to||r.rsv<=to));
  if(!rows.length){ box.innerHTML=`<div class="lgd">${esc(tx('t5none'))}</div>`; return; }
  // 사람 단위(같은 사람이 여러 번 묵어도 이 구간 예약 안에서만)
  const byPerson={};
  rows.forEach(r=>{ const p=byPerson[r.key]||(byPerson[r.key]={name:r.name,grades:{},stays:0});
    p.stays++; p.grades[r.grade]=(p.grades[r.grade]||0)+1; });
  const people=Object.values(byPerson);
  const noDlx=people.filter(p=>!p.grades.dlx).sort((a,b)=>b.stays-a.stays||String(a.name).localeCompare(String(b.name)));
  const dlxPeople=people.length-noDlx.length;
  const pct=people.length?Math.round(noDlx.length/people.length*100):0;
  // 예약(팀) 단위 표
  const byTeam={};
  rows.forEach(r=>{ const t=byTeam[r.eventSeq]||(byTeam[r.eventSeq]={seq:r.eventSeq,rsv:r.rsv,rep:r.rep,dep:r.dep,nights:r.nights,mem:0,grades:{}});
    t.mem++; t.grades[r.grade]=(t.grades[r.grade]||0)+1;
    if(r.nights>t.nights) t.nights=r.nights; });
  const teams=Object.values(byTeam).sort((a,b)=>String(a.rsv).localeCompare(String(b.rsv))||a.seq-b.seq);
  const trs=teams.map(t=>{
    const dlx=t.grades.dlx||0;
    const gr=GRADES.filter(g=>t.grades[g]).map(g=>`${tx(GKEY[g])} ${t.grades[g]}`).join(' · ');
    return `<tr class="${dlx?'':'hl'}">
      <td>${esc(t.rsv)}</td>
      <td class="mono">${esc(t.seq)}</td>
      <td>${esc(t.rep||'-')}</td>
      <td>${esc(t.dep||'-')}</td>
      <td>${t.nights}</td>
      <td>${t.mem}</td>
      <td class="${dlx?'good':'bad'}">${dlx||'-'}</td>
      <td style="text-align:left;font-family:inherit">${esc(gr)}</td>
    </tr>`;
  }).join('');
  box.innerHTML =
    `<div class="lgd">${esc(tx('t5sum')(teams.length,people.length,dlxPeople))}</div>`
    +(noDlx.length?`<div class="warnbox">${esc(tx('t5bad')(noDlx.length,pct))}</div>`:`<div class="okbox">${esc(tx('t5ok'))}</div>`)
    +(noDlx.length?`<div class="lgd" style="margin-top:9px">${esc(tx('t5list'))}</div>
      <div class="namelist">${noDlx.map(p=>`<span class="nm">${esc(p.name||'-')}<small>${p.stays}× · ${GRADES.filter(g=>p.grades[g]).map(g=>esc(tx(GKEY[g]))).join('/')}</small></span>`).join('')}</div>`:'')
    +`<table class="t"><thead><tr>
        <th>${tx('c5Rsv')}</th><th>${tx('c5Team')}</th><th>${tx('c5Rep')}</th><th>${tx('c5Dep')}</th>
        <th>${tx('c5Nights')}</th><th>${tx('c5Mem')}</th><th>${tx('c5Dlx')}</th><th>${tx('c5Grades')}</th>
      </tr></thead><tbody>${trs}</tbody></table>`;
}

function applyStatic(){
  const step=$('#t-step'); if(step) step.textContent=tx('step');
  const home=$('#t-home'); if(home) home.textContent=tx('home');
  const hint=$('#t-connhint'); if(hint) hint.textContent=tx('connHint');
  const pre=$('#t-preconn'); if(pre) pre.textContent=tx('preConn');
  const btn=$('#btn-connect');
  if(supa){ setConn(tx('connOk'),'ok'); if(btn) btn.textContent=tx('connectedBtn'); }
  else { setConn(tx('notConn'),''); if(btn) btn.textContent=tx('connect'); }
}
window.onSaizenLangChange=function(){ applyStatic(); if(supa){ renderUI(); $('#y-label').textContent=YEAR; renderAll(); } };

$('#btn-connect').addEventListener('click',connect);
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }
</script>
