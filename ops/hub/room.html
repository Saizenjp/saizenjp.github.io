<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 호텔 방배정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* 디자인 리프레시: 중립 회색 캔버스 + 올리브는 '강조'에만 (모던 SaaS 톤) */
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;   /* 중립 그레이 본문/보조 */
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e9eede;  /* 사이젠 올리브 / 골드 (강조 전용) */
    --accentDeep:#4c5a37;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    /* 숙소별 포인트색 (사이젠 앱 표준) */
    --y:#1e3a8a; --k:#5b21b6; --g:#065f46; --s:#92400e;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);line-height:1.55;min-height:100vh;
  }
  .topbar{
    position:sticky;top:0;z-index:30;background:var(--surface);
    border-bottom:3px solid var(--accent);padding:13px 22px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    box-shadow:0 1px 4px rgba(15,23,42,.06);
  }
  .topbar h1{font-size:19px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.connected:hover{background:#266a45}

  /* 연결 바 */
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .conn .hint{font-size:11px;color:var(--muted)}

  /* 날짜 선택 */
  .datebar{padding:7px 20px 5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .datebar label{font-size:12px;color:var(--text2);font-weight:600}
  .mode-toggle{display:inline-flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
  .mode-btn{font-family:inherit;font-size:12px;font-weight:700;padding:6px 13px;border:none;background:var(--surface);color:var(--text2);cursor:pointer;transition:.12s}
  .mode-btn.active{background:var(--accent);color:#fff}
  .mode-btn:not(.active):hover{background:var(--accentSoft)}
  .datebar .legend{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--text2);align-items:center}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}

  /* 2단 레이아웃 */
  /* 미배정 목록을 서랍으로 뺐으므로 객실 배정표가 화면 전폭을 쓴다(Min 2026-08) */
  .stage{display:grid;grid-template-columns:1fr;gap:16px;padding:16px 20px;align-items:start}
  /* 미배정 서랍 — 화면을 막지 않는다(뒤의 객실을 그대로 클릭해 배정) */
  .ua-drawer{position:fixed;left:0;top:0;bottom:0;width:340px;max-width:88vw;z-index:60;
    background:var(--surface);border-right:2px solid var(--accent);box-shadow:6px 0 22px rgba(15,23,42,.16);
    display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .18s ease}
  .ua-drawer.open{transform:none}
  .ua-drawer .uah{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--border);
    background:var(--surface2);font-size:14px;font-weight:800;color:var(--accent)}
  .ua-drawer .uah .cnt{font-weight:700;color:var(--text2)}
  .ua-drawer .uab{flex:1;overflow:auto;padding:11px}
  .ua-fab{position:fixed;left:14px;bottom:16px;z-index:59}
  @media(max-width:860px){ .ua-drawer{width:92vw} }
  /* 좌측 미배정 팀 패널 = 스크롤 동행(고정바 아래 sticky, 길면 내부 스크롤). 순수 CSS라 랙 없음 */
  /* 컨트롤 바(월·버튼+날짜칩) = 상단 topbar 아래 고정. top은 JS가 topbar 높이로 동기화. */
  .ctrlbar{position:sticky;top:56px;z-index:25;background:var(--bg);box-shadow:0 4px 8px -5px rgba(0,0,0,.22)}
  /* 좌측 미배정 패널 = 컨트롤 바 아래에 고정(높이는 JS가 --stick2로 계산) */
  .stage > .col:first-child{position:sticky;top:var(--stick2,150px);max-height:calc(100vh - var(--stick2,150px) - 12px);overflow:auto}
  @media(max-width:860px){.stage{grid-template-columns:1fr}.stage > .col:first-child{position:static;max-height:none;overflow:visible}}

  .col{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .col > h2{font-size:14px;font-weight:800;padding:12px 16px;border-bottom:2px solid var(--accentSoft);background:var(--surface2);color:var(--accent);display:flex;align-items:center;gap:8px}
  .col > h2 .cnt{font-size:12px;color:var(--text2);font-weight:700;margin-left:auto}
  .col-body{padding:13px;min-height:120px}

  /* 미배정 팀 카드 */
  .team-card{
    background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--muted);
    border-radius:8px;padding:0;margin-bottom:8px;transition:.12s;overflow:hidden;
  }
  /* 팀 머리줄 — 전체 선택 체크박스 + 코드 + 남은 인원 */
  .team-card .tc-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:6px 9px;background:var(--surface2)}
  .team-card .tc-h .tchk{width:15px;height:15px;cursor:pointer;flex:none}
  .team-card .tc-s{font-size:11px;color:var(--text2);padding:3px 9px 5px;line-height:1.45}
  .team-card .tc-s b{color:var(--accent2)}
  .team-card .left{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--err);white-space:nowrap}
  .team-card .left.ok{color:var(--ok)}
  .team-card .dtog{width:100%;text-align:left;font-family:inherit;font-size:10.5px;font-weight:700;color:var(--muted);
    background:var(--surface2);border:none;border-top:1px solid var(--border);padding:4px 9px;cursor:pointer}
  .team-card .dtog:hover{background:var(--accentSoft);color:var(--accent)}
  .team-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(15,23,42,.1)}
  .team-card.dragging{opacity:.4}
  .team-card.acc-Y{border-left-color:var(--y)} .team-card.acc-K{border-left-color:var(--k)}
  .team-card.acc-G{border-left-color:var(--g)} .team-card.acc-S{border-left-color:var(--s)}
  .team-card .tag{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--accent)}
  .team-card .tag.none{color:var(--muted);font-weight:600}
  .team-card .mbadge{font-size:9.5px;font-weight:700;border-radius:4px;padding:2px 6px;line-height:1;white-space:nowrap}
  .team-card .mbadge.mb-mem{color:var(--surface);background:var(--accent)}
  .team-card .mbadge.mb-non{color:var(--text2);background:var(--surface3);border:1px solid var(--border2)}
  .team-card .meta{font-size:11px;color:var(--text2)}
  .team-card .evno{font-size:10px;font-weight:700;color:var(--accent2);background:var(--surface3);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;font-family:var(--mono);white-space:nowrap}
  .team-card .pax{display:inline-block;font-weight:700;color:var(--text)}
  .team-card .rtype{font-size:11px;color:var(--accent2);font-weight:700}
  .team-card .tag-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .team-card .roster{display:flex;flex-direction:column}
  .team-card .rmember{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.3;
    padding:4px 9px;border-top:1px solid var(--border)}
  .team-card .rmember .mchk{width:14px;height:14px;flex:none;cursor:pointer}
  .team-card .rmember.sel{background:var(--accentSoft)}
  .team-card .rmember.done{background:var(--surface2);color:var(--muted)}
  .team-card .rmember.rep{font-weight:700}
  .team-card .rmember.dim{color:var(--muted);font-size:11px}
  .team-card .rtag{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:800;width:50px;flex:none}
  .team-card .rname{color:var(--text);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team-card .rname .repbadge{display:inline-block;font-size:8.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:3px;padding:1px 4px;margin-left:5px;font-style:normal;vertical-align:middle}
  /* 회원/일반 등급 뱃지 — 전 위치 동일 모양(줄바꿈 방지) */
  .gbadge{display:inline-block;font-size:8.5px;font-weight:800;line-height:1.45;border-radius:4px;padding:1px 6px;margin-left:5px;vertical-align:middle;white-space:nowrap;letter-spacing:.02em;font-style:normal;color:var(--text2);background:var(--surface3);border:1px solid var(--border2)}
  .gbadge.mem{color:#fff;background:var(--accent2);border-color:var(--accent2)}
  .team-card .ren{flex:none;font-family:var(--mono);font-size:9.5px;color:var(--muted);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team-card .rdone{flex:none;font-size:10px;font-weight:700;color:var(--text2);white-space:nowrap}
  /* 객실 칩: 그룹코드 헤더 + 사람 명단 */
  .room .chip{flex-direction:column;align-items:stretch;gap:3px}
  .room .chip .chip-head{display:flex;align-items:center;gap:6px}
  .room .chip .cpeople{display:flex;flex-direction:column;gap:1px;padding-left:2px}
  .room .chip .cperson{font-size:11px;color:var(--text2);line-height:1.3}
  .room .chip .cperson b{color:var(--text);font-weight:700}

  /* 시설 그룹 */
  .fac{margin-bottom:22px}
  .fac > h3{font-size:14.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .fac > h3 .dot{width:11px;height:11px;border-radius:2px}
  .fac.f-Y h3 .dot{background:var(--y)} .fac.f-K h3 .dot{background:var(--k)}
  .fac.f-G h3 .dot{background:var(--g)} .fac.f-S h3 .dot{background:var(--s)}
  .fac > h3 .util{font-size:12px;color:var(--text2);font-weight:600;margin-left:auto}
  .zone-label{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 7px;padding-left:2px;display:flex;align-items:center;gap:10px}
  .floorplan-btn{font-family:inherit;font-size:11px;font-weight:700;color:var(--accent);background:var(--accentSoft);border:1px solid #c4ddcc;border-radius:6px;padding:3px 11px;cursor:pointer;transition:.12s}
  .floorplan-btn:hover{background:var(--accent);color:#fff}

  .rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
  /* ── 표 보기(대량 배정용) — 행 1개 = 객실 1개. 태블릿 터치도 고려해 행 높이 여유 ── */
  .tbl-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px;font-size:12.5px;color:var(--text2)}
  .tbl-bar label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700}
  .rtbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:14px}
  .rtbl th{position:sticky;top:0;z-index:3;background:var(--surface2);font-size:10.5px;font-weight:800;letter-spacing:.03em;color:var(--text2);text-align:left;padding:6px 9px;border-bottom:1px solid var(--border2)}
  .rtbl td{padding:5px 9px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.5px}
  .rtbl tr:last-child td{border-bottom:none}
  .rtbl .frow td{background:var(--surface3);font-weight:800;font-size:12px;color:var(--text);padding:6px 9px;cursor:pointer;user-select:none;position:sticky;top:26px;z-index:2}
  .rtbl .frow .fstat{font-weight:600;color:var(--text2);font-size:11px;margin-left:10px}
  .rtbl .frow .zwarn{color:var(--err);font-weight:800}
  .rtbl .frow .fcar{display:inline-block;width:12px;color:var(--muted)}
  .rtbl .rrow{cursor:pointer}
  .rtbl .rrow:hover{background:var(--accentSoft)}
  .rtbl .rrow.over{background:var(--accentSoft);box-shadow:inset 0 0 0 2px var(--accent)}
  .rtbl .rrow.inactive{opacity:.5}
  .rtbl .c-no{white-space:nowrap;font-weight:800;font-size:13px;border-left:4px solid transparent}
  .rtbl .rrow.full .c-no{border-left-color:var(--ok)}
  .rtbl .rrow.partial .c-no{border-left-color:var(--warn)}
  .rtbl .rrow.warn .c-no{border-left-color:var(--err)}
  .rtbl .c-no .lock{margin-left:6px;cursor:pointer;font-size:12px;opacity:.6}
  .rtbl .c-ty{color:var(--text2);white-space:nowrap;font-size:11.5px}
  .rtbl .c-cap{white-space:nowrap;font-family:var(--mono);font-size:11.5px;color:var(--text2);text-align:center;width:56px}
  .rtbl .rrow.warn .c-cap{color:var(--err);font-weight:800}
  .rtbl .c-gu{width:100%}
  .rtbl .c-clo{color:var(--err);font-weight:700;font-size:11px;white-space:nowrap}
  .tchip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface3);border:1px solid var(--border2);border-radius:7px;padding:2px 8px;margin:2px 5px 2px 0}
  .tchip.chip-in{background:#e6f2ea;border-color:#b6d8c2}
  .tchip.chip-cont{background:#e9eef6;border-color:#c3d2e6}
  .tchip .ctag{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--accent)}
  .tchip .cflag{font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px}
  .tchip .tdate{font-size:10px;color:var(--muted);font-family:var(--mono)}
  /* 아소별장 이동 가능 표기 */
  .mm-sec{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:9px}
  .mm-sec h4{font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:5px}
  .mm-sec .n{font-size:11.5px;color:var(--text2);line-height:1.5;margin-bottom:7px}
  .mm-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mm-now{font-size:12.5px;font-family:var(--mono);background:var(--surface2);border-radius:7px;padding:6px 10px;margin-bottom:4px}
  .mm-name{cursor:pointer}
  .mm-name:hover{text-decoration:underline;text-decoration-style:dotted}
  .cpin{font-size:10px;margin-left:2px;filter:saturate(.9)}
  .sgb{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:var(--err);border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap}
  .hd-card{display:block;width:100%;text-align:left;font-family:inherit;background:var(--surface);
    border:1px solid var(--border);border-radius:9px;padding:8px 11px;margin-bottom:7px}
  .hd-team{cursor:pointer}
  .hd-team:hover{border-color:var(--accent);box-shadow:0 1px 6px rgba(0,0,0,.07)}
  .hd-plain{border-left:4px solid var(--err)}
  .hd-r{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--text2);
    background:var(--surface2);border-radius:6px;padding:4px 8px;margin-top:5px;line-height:1.45}
  .hd-cat{flex:0 0 auto;font-weight:800;color:#fff;background:var(--err);border-radius:5px;padding:1px 7px;font-size:11px}
  .hd-go{margin-top:6px;font-size:11.5px;font-weight:800;color:var(--accent)}
  .sgn{display:block;font-size:11px;color:#8a2a1c;background:#fbeeeb;border:1px solid #e3bdb4;border-radius:6px;padding:3px 8px;margin-top:4px;line-height:1.4}
  .btn.xs.sg-doc{margin-left:5px;padding:1px 8px;font-size:10.5px;color:var(--err);border-color:#e3bdb4}
  .asob{display:inline-block;font-size:9px;font-weight:800;color:#fff;background:#7a5aa8;border-radius:4px;padding:1px 5px;margin-left:4px;white-space:nowrap}
  .aso-panel{background:#f6f2fb;border:1px solid #d6c8ea;border-radius:11px;padding:11px 13px;margin-bottom:12px}
  .aso-panel h4{font-size:13px;font-weight:800;color:#5e3a86;margin-bottom:3px}
  .aso-panel .d{font-size:11.5px;color:var(--text2);margin-bottom:8px;line-height:1.5}
  .aso-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:12.5px}
  .aso-row .g{font-family:var(--mono);font-weight:800;color:var(--accent)}
  .aso-row .fit{font-size:9.5px;font-weight:800;color:#fff;background:#7a5aa8;border-radius:99px;padding:1px 8px}
  .aso-row .now{color:var(--text2);font-size:11.5px}
  .aso-row .go{margin-left:auto}
  .tmem{display:inline-flex;align-items:center;gap:3px;background:var(--surface);border-radius:5px;padding:1px 5px;border:1px solid var(--border)}
  .tmem>b{font-weight:700;font-size:12px}
  .tmem .cmen{font-size:9px;color:var(--muted);font-family:var(--mono)}
  .tmem.eco{opacity:.62;text-decoration:line-through}
  .tmem .cx{cursor:pointer;color:var(--err);font-weight:800;font-size:12px;padding:0 2px}
  .tmem .csplit{cursor:pointer;color:var(--accent2);font-weight:800;font-size:11px;padding:0 2px}
  .tmem .ceco-btn{cursor:pointer;font-size:10px;padding:0 1px;opacity:.6;filter:grayscale(.4)}
  .tmem .ceco-btn.on{opacity:1;filter:none}
  .tmem .ceco{font-size:9px;font-weight:700;color:var(--err)}
  .room{
    background:var(--surface2);border:1px dashed var(--border2);border-radius:9px;
    padding:11px 13px 12px;min-height:80px;transition:.12s;position:relative;
  }
  .room.over{border-color:var(--accent);border-style:solid;background:var(--accentSoft)}
  .room.filled{border-style:solid;background:#fff;border-color:var(--accent);box-shadow:0 1px 4px rgba(15,23,42,.1)}
  .room.inactive{opacity:.5;background:repeating-linear-gradient(45deg,#f0eee7,#f0eee7 6px,#e9e6dd 6px,#e9e6dd 12px)}
  .room .rn{font-size:15px;font-weight:800}
  .room .rt{font-size:12px;color:var(--text2);margin-top:1px}
  /* 본관/별채 등 zone을 약하게(실제 객실명 옆 작은 muted 라벨) */

  <input class="inp" id="sb-key" type="password" data-i18n-ph="rm_keyPlaceholder" autocomplete="off">
  <button class="btn sm" id="btn-connect" type="button" data-i18n="btnConnectShort"></button>
  <span class="hint" data-i18n="rm_connHint"></span>
</div>

<div class="ctrlbar" id="ctrlbar">
<div class="datebar">
  <label id="lbl-from">월</label>
  <button class="btn ghost sm" id="date-prev" type="button" title="이전 달" style="padding:5px 9px">◀</button>
  <input class="inp" id="month-pick" type="month" style="width:140px">
  <button class="btn ghost sm" id="date-next" type="button" title="다음 달" style="padding:5px 9px">▶</button>
  <button class="btn ghost sm" id="date-today" type="button" title="이번 달·오늘">오늘</button>
  <button class="btn sm" id="btn-load" type="button" disabled data-i18n="rm_btnLoad"></button>
  <input type="date" id="date-pick" hidden><input type="date" id="date-to" hidden>
  <button class="btn sm" id="btn-unassigned" type="button" title="미배정 팀 열기(선택 후 객실 클릭)" style="background:var(--accent2);border-color:var(--accent2)">미배정</button>
  <label class="hint" id="t-autorun" style="display:flex;align-items:center;gap:5px;font-weight:700;cursor:pointer;white-space:nowrap">
    <input type="checkbox" id="ck-autorun"><span id="t-autorun-lbl">열 때 자동배정</span></label>
  <button class="btn ghost sm" id="btn-closure" type="button" disabled title="특정 객실을 기간 지정해 폐쇄(잠금) — 대표님 사용 중·점검 등. 폐쇄 기간엔 배정 불가" style="color:var(--err);border-color:#e3bdb4">🔒 객실 폐쇄</button>
  <button class="btn sm" id="btn-holds" type="button" style="display:none;background:#fdf6e7;color:#6b5312;border-color:#e6d3a3;font-weight:800"></button>
  <!-- 위 버튼 라벨/타이틀은 applyStaticRoom()이 언어별로 채움(월/오늘/자동배정/전체 비우기/충돌 점검/객실 폐쇄) -->
  <span class="hint" id="session-hint"></span>
  <span id="sel-bar" style="display:none;align-items:center;gap:8px">
    <span class="pill" id="sel-cnt"></span>
    <button class="btn ghost sm" id="btn-sel-clear" type="button" data-i18n="rm_selClear"></button>
    <span class="hint" style="font-size:11px" data-i18n="rm_selHint"></span>
  </span>
  <!-- 검색은 같은 줄 오른쪽 — 고정행을 한 줄이라도 낮춘다 -->
  <div class="rsearch">
    <input class="inp" id="room-search" type="search" autocomplete="off" placeholder="🔎 배정 검색 — 태그코드·한글명·영문명·행사번호"><!-- placeholder는 applyStaticRoom()이 언어별로 채움 -->
    <span class="hint" id="room-search-cnt"></span>
    <div id="room-search-results"></div>
  </div>
</div>
<!-- 숙소 토글 — 날짜 칩(+N·미N)과 미배정 목록이 모두 이 범위를 따른다(Min 2026-08:
     "이 토글을 상단 일정 토글 위쪽으로"). id 는 그대로라 기존 핸들러·필터가 그대로 동작. -->
<div class="fac-filter" id="team-filter"></div>
<!-- 방 타입 토글 — 그 숙소에 실제 있는 타입만 자동 노출(타입이 하나뿐이면 숨김). 카드·표·타임라인 공통 -->
<div class="fac-filter" id="type-filter" style="display:none"></div>
<div class="day-strip" id="day-strip"></div>
</div><!-- /ctrlbar -->

<!-- 🚫 취소 이력 — step1 자동 취소(팀/개인)를 cancel_log로 기록 → 상단 배치(실무 동선) -->
<details id="cxbox" style="margin:10px 20px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden">
  <summary id="cx-title" style="cursor:pointer;padding:10px 16px;font-weight:800;font-size:13.5px;color:var(--red,#c0392b);list-style:none">🚫 취소 이력 <span style="font-weight:600;color:var(--muted);font-size:12px">— 팀·개인 취소 (행사번호·일정·팀·영문명)</span></summary>
  <div style="padding:0 16px 16px">
    <div id="cx-list"><div class="empty-hint" style="padding:14px">펼치면 최근 취소 내역이 표시됩니다.</div></div>
    <div style="text-align:center;margin-top:10px"><button class="btn ghost sm" id="cx-more" type="button" style="display:none">더 보기 (다음 40건)</button></div>
  </div>
</details>

<details id="histbox" style="margin:8px 20px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden">
  <summary id="hist-title" style="cursor:pointer;padding:12px 16px;font-weight:800;font-size:14px;color:var(--accent);list-style:none">🕘 방배정 변경 이력 <span style="font-weight:600;color:var(--muted);font-size:12px">— 누가·언제·어디로 (자동배정=요약 1건)</span></summary>
  <div style="padding:0 16px 16px">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <input class="inp" id="hist-q" placeholder="이름·방번호·그룹코드 검색" style="flex:1;min-width:200px;max-width:380px">
      <button class="btn ghost sm" id="hist-search" type="button">검색</button>
      <span class="hint" id="hist-cnt" style="margin-left:auto"></span>
    </div>
    <div id="hist-list"><div class="empty-hint" style="padding:14px">펼치면 최근 변경 이력이 표시됩니다.</div></div>
    <div style="text-align:center;margin-top:10px"><button class="btn ghost sm" id="hist-more" type="button" style="display:none">더 보기 (다음 40건)</button></div>
    <!-- 이력 패널 정적 텍스트는 applyStaticRoom()이 언어별로 채움 -->
  </div>
</details>

<!-- 미배정 팀 = 서랍(팝업). 배정은 "선택 → 객실 클릭"이라 화면을 막지 않는 서랍이 맞다.
     반대 방향(빈 방 클릭 → 그 방에 넣을 사람 고르기)은 기존 배정 피커가 그대로 담당. -->
<div class="ua-drawer" id="ua-drawer">
  <div class="uah">
    <span id="t-uaTitle">미배정 팀</span> <span class="cnt" id="unassigned-cnt"></span>
    <button class="btn ghost sm" id="ua-close" type="button" style="margin-left:auto">닫기</button>
  </div>
  <div class="uab" id="unassigned" data-drop="unassign">
    <div class="empty-hint" data-i18n="rm_emptyHint"></div>
  </div>
</div>

<div class="stage">
  <div class="col">
    <h2><span data-i18n="rm_colRooms"></span> <span class="cnt" id="assign-summary"></span>
      <span class="view-toggle">
        <button class="vbtn active" id="view-table" type="button" title="표 형식 — 한 화면에 더 많은 객실">표</button>
        <button class="vbtn" id="view-card" type="button">카드</button>
        <button class="vbtn" id="view-timeline" type="button" title="객실×날짜 점유 한눈에">타임라인</button>
        <!-- 카드/타임라인 라벨·타이틀은 applyStaticRoom()이 언어별로 채움 -->
      </span>
    </h2>
    <div class="col-body" id="facilities"></div>
    <div class="col-body" id="timeline" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
// HTML 이스케이프 — title 속성 등에 사용. ⚠ 정의 없이 호출되어 render()가 ReferenceError로 죽던 것 복구
//   (증상: 화면이 반만 그려지고 connect()의 catch에 걸려 「연결 실패」로 표시됨)
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function accomL(a){ return (window.SZCore&&SZCore.accomLabel)?SZCore.accomLabel(a,lang()):(a||''); }   // 숙소·구역 표시 라벨(ja/ko/en) = saizen-core 단일 진실원
function tx(k,...a){ const d=L[lang()]||L.ja; let v=d[k]; if(v===undefined) v=L.ja[k]; if(v===undefined) return k; return (typeof v==='function')?v(...a):v; }
// 정적 chrome(버튼·라벨·placeholder·title) 언어 적용. data-i18n/rm_* 는 saizen-ops.js가 처리하므로 여기선 미커버 항목만.
function applyStaticRoom(){
  const set=(sel,prop,key)=>{ const el=$(sel); if(el) el[prop]=tx(key); };
  set('#date-prev','title','prevMonth'); set('#date-next','title','nextMonth');
  set('#date-today','title','thisMonthToday'); set('#date-today','textContent','today');
  set('#lbl-from','textContent','monthLbl');
  updateAutoBtnLabel(); updateHoldsBtn();
  set('#btn-closure','textContent','btnClosure'); set('#btn-closure','title','btnClosureT');
  refreshUndoBulkBtn();   // 되돌리기 버튼 라벨도 언어 토글에 맞춰 갱신
  set('#room-search','placeholder','roomSearchPh');
  set('#view-card','textContent','viewCard'); set('#view-timeline','textContent','viewTimeline'); set('#view-timeline','title','viewTimelineT');
  set('#view-table','textContent','viewTable'); set('#view-table','title','viewTableT');
  set('#t-uaTitle','textContent','uaDrawerT'); set('#ua-close','textContent','uaClose');
  set('#t-autorun-lbl','textContent','autoRunLbl'); set('#t-autorun','title','autoRunT');
  try{ updateUaBtn(); }catch(e){}
  const _oe=$('#tbl-empty-lbl'); if(_oe) _oe.textContent=tx('onlyEmpty');
  set('#hist-q','placeholder','histQph'); set('#hist-search','textContent','histSearch');
  const ht=$('#hist-title'); if(ht) ht.innerHTML=`${tx('histTitle')} <span style="font-weight:600;color:var(--muted);font-size:12px">${tx('histTitleSub')}</span>`;
  const hm=$('#hist-more'); if(hm) hm.textContent=tx('histMore');
}

// 표시는 행사번호(event_no, guests에 적재). 없으면 event_seq 폴백. (예약번호=event_seq는 내부키)
function evNo(seq){ const g=state.guests.find(x=>x.event_seq===seq); return (g&&g.event_no)||seq; }

const PFX={'야마나미리조트':'Y','쿠주힐즈':'K','간지호텔':'G','시즈노야도 료칸':'S'};

// ── 판매분류(booking roomType) → 야마나미 현장 등급 기본값 ──
//   예약 정책이 '통합 리조트 숙박'으로 바뀌면 이 표만 수정하면 됨.
//   ※ 현장 실제 타입(엑셀 기준): 디럭스더블트윈/디럭스트윈/트윈/컴팩트트윈/트리플/싱글/더블

//   소형트윈·관내별장도 호텔 배정 팀이고 스탠다드 트윈부터 준다 —
//   예전 라벨(컴팩트트윈 / 현장지정)은 자동배정에서 빠지는 것처럼 읽혔다.
const ROOMTYPE_MAP={
  '호텔 트윈':'트윈',          // 표준 트윈
  '호텔 소형트윈':'트윈',      // 舊 SGL+SGL — 현장은 트윈과 동급으로 보므로 트윈부터(컴팩트는 마지막에 소진)
  '돔하우스':'트윈',          // 돔하우스 동
  '관내별장':'트윈',          // 소보를 비우고 호텔동으로 — 호텔 배정 팀
  '장기숙박전용':'2인1동',    // 쿠주
  '호텔':'트윈',              // 간지
  '료칸':'트윈',              // 시즈노야도
};

// ── 객실 타입 한글 → 영문 (외국인 직원용 병기) ──
const TYPE_EN={
  '디럭스더블트윈':'Deluxe Double Twin','디럭스트윈':'Deluxe Twin','트윈':'Standard Twin',
  '컴팩트트윈':'Compact Twin','트리플':'Triple','싱글':'Single','더블':'Double',
  '4인실':'Quad Room','8인실':'Octa Room','2인1동':'Cottage (2p)',
};
// ── 표시 전용 한글 명칭(저장값은 불변) — '트윈'은 화면에 '스탠다드 트윈'으로 표기 ──
const TYPE_KO={ '트윈':'스탠다드 트윈' };
// 간지호텔은 트윈 한 종류뿐이다(싱글 없음) — 야마나미의 「스탠다드 트윈」 등급 개념을 붙이지 않는다(Min 2026-08).
// 간지호텔·돔하우스는 트윈 한 종류뿐(2인 1실) — 야마나미 호텔동의 등급 개념을 붙이지 않는다.
function typeLabel(t,fac,zone){
  if(fac==='간지호텔'||zone==='돔하우스') return lang()==='ko'?'트윈':(lang()==='en'?'Twin':'ツイン');
  const ko=TYPE_KO[t]||t; const en=TYPE_EN[t]; return en?`${ko} · ${en}`:ko;
}
// 시즈노야도 등 본관/별채 zone 을 객실명 옆에 약하게 표기(실제 객실명이 주, zone 은 보조).
function zonePin(inv){
  const z=inv&&inv.zone;
  if(inv&&inv.facility==='시즈노야도 료칸'&&(z==='본관'||z==='별채'))
    return `<small class="zone-pin${z==='별채'?' bz':''}">${z==='별채'?'別棟':'本館'}</small>`;

function isoToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function isoShift(iso,delta){const d=new Date((iso||isoToday())+'T00:00:00');d.setDate(d.getDate()+delta);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
// 자동배정 버튼 = 「🪄 자동배정 (8/25~10/31)」 — '월별'이라는 말이 실제 동작(불러온 기간 전체)과

function autoRangeLabel(){
  const f=state&&state.from, t=state&&state.to;

function updateAutoBtnLabel(){

function fmtMD(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${+m[2]}/${+m[3]}`:'-';}
function teamNights(g){if(!g.dep||!g.arr)return 0;return Math.max(0,Math.round((new Date(g.arr)-new Date(g.dep))/864e5));}
// 특정 객실의 '기준일(state.from) 하룻밤' 점유 행들 (카드 보기 = 그날 현황)
function roomOccAt(invId, d){
  return state.rooms.filter(r=>r.inventory_id===invId && (!d || (r.check_in<=d && d<r.check_out)));
}
// 기간 폐쇄: 체류 [dep,arr) 가 폐쇄 [from_date,to_date](종료 포함)와 겹치면 그 폐쇄 반환
function roomClosure(invId, dep, arr){
  return (state.closures||[]).find(c=>c.inventory_id===invId && dep<=c.to_date && arr>c.from_date) || null;
}
// 기준 하룻밤(focus) 폐쇄 여부
function roomClosedFocus(invId){
  const d=state.focus||state.from; if(!d) return null;
  const nx=fmtDate(addDays(parseISO(d),1));
  return roomClosure(invId, d, nx);
}
function parseISO(s){ const p=String(s).slice(0,10).split('-'); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }
function addDays(dt,n){ const d=new Date(dt); d.setDate(d.getDate()+n); return d; }
function fmtDate(d){ return SZCore.fmtDate(d); }  // 공유 모듈 위임
// ── 배정 맥락: 인원을 선택하면 카드/카운트를 '그 팀 체류기간' 점유로 보이게(빈 듯해도 그 기간 사용중이면 꽉 참) ──
function selAssignSpan(){
  if(!state.sel || !state.sel.size) return null;
  let dep=null, arr=null;
  state.sel.forEach(mid=>{ const m=memberById(mid); if(!m) return;
    const g=state.guests.find(x=>x.event_seq===m.event_seq); if(!g||!g.dep||!g.arr) return;
    if(dep===null||g.dep<dep) dep=g.dep; if(arr===null||g.arr>arr) arr=g.arr; });
  return (dep&&arr)?{dep,arr}:null;
}
// 기간 [dep,arr) 동안 그 방의 점유 행 + '하룻밤 최대 점유'(정원 판정 = 막힘 로직과 동일 프레임)
function roomOccOver(invId, dep, arr){
  const rows=state.rooms.filter(r=>r.inventory_id===invId && overlaps(dep,arr,r.check_in,r.check_out));
  const days=new Set([dep]); rows.forEach(r=>{ if(r.check_in>dep && r.check_in<arr) days.add(r.check_in); });
  let peak=0; days.forEach(d=>{ if(d<arr){ const u=rows.filter(r=>r.check_in<=d && d<r.check_out).reduce((s,r)=>s+(r.assigned_pax||0),0); if(u>peak) peak=u; } });
  return {rows, peak};
}
function roomUsedPax(inv){
  const span=selAssignSpan();
  if(span) return roomOccOver(inv.id, span.dep, span.arr).peak;     // 선택팀 기간 기준
  return roomOccAt(inv.id, state.focus||state.from).reduce((s,r)=>s+(r.assigned_pax||0),0);   // 평소=기준일 하룻밤
}

// ── 선택 범위에 점유 중인 팀 + 배정 로드 ──
//   하루 모드: from=to=선택일 → 그날 머무는(dep<=날<arr) 모든 팀
//   기간 모드: from~to → 그 기간에 한 번이라도 머무는 팀 (dep < to+1 AND arr > from)
// Supabase 기본 1000행 제한 회피 — event_seq IN 조회를 id 순으로 페이지네이션(전 행 로드)
async function pagedInSeq(table, sel, seqs){
  let out=[], pg=0;
  while(true){
    const {data,error}=await supa.from(table).select(sel).in('event_seq',seqs).order('id').range(pg,pg+999);
    if(error) return {error};
    out=out.concat(data||[]);
    if(!data || data.length<1000) break;
    pg+=1000;
  }
  return {data:out};
}
// 임의 쿼리(빌더 팩토리)를 1000행 제한 없이 전부 로드. buildFn()은 매번 새 쿼리(.order 포함) 반환.
async function pagedQuery(buildFn){
  let out=[], pg=0;
  while(true){
    const {data,error}=await buildFn().range(pg,pg+999);
    if(error) return {error};
    out=out.concat(data||[]);
    if(!data || data.length<1000) break;
    pg+=1000;
  }
  return {data:out};
}
async function loadDay(){
  const from=$('#date-pick').value;
  let to = $('#date-to').value || from;     // 종료 비우면 단일일
  if(!from){toast(tx('pickDate'),'warn');return;}
  if(to<from) to=from;                       // 종료<시작이면 단일일로 보정
  state.from=from; state.to=to; state.date=from; state.focus=from; state.days=new Set(); state.splitPending=null;   // 기준일=시작, 일별선택·분할모드 초기화

  // 점유 판정: dep_date <= to(범위끝) AND arr_date > from(범위시작)
  //   → 그 기간에 체크인~체크아웃이 한 번이라도 걸치는 팀
  const gres=await pagedQuery(()=>supa
    .from('guests')
    .select('event_seq,team_tag,group_code,accom,accom_prefix,pax,check_status,bookings!inner(event_no,rep_name,dep_date,arr_date,product_name,member_type,remark,remark_local,status)')
    .lte('bookings.dep_date',to)
    .gt('bookings.arr_date',from)
    .order('event_seq'));
  if(gres.error){toast(tx('teamLoadFail',gres.error.message),'err');return;}
  const g=gres.data;
  state.guests=(g||[]).map(x=>({
    event_seq:x.event_seq, team_tag:x.team_tag, group_code:x.group_code,
    accom:x.accom, pfx:x.accom_prefix||PFX[x.accom]||'X', pax:x.pax,
    rep:x.bookings?.rep_name||'', dep:x.bookings?.dep_date, arr:x.bookings?.arr_date,
    event_no:x.bookings?.event_no||'',   // 행사번호(예약순 표시·우선순위)
    member_type:x.bookings?.member_type||'',
    status:x.bookings?.status||'',            // 구분: 견적/대기/확정/정산 (대기=대기예약)
    remark:x.bookings?.remark||'',
    remark_local:x.bookings?.remark_local||'',   // 현지비고(싱글 지정 탐지용)
    isNewCheckin: x.bookings?.dep_date===from,   // 이 범위 시작일에 신규 체크인
    sale_type:guessSaleType(x.bookings?.product_name, x.accom),
  }));
  // 팀 묶음(手配書 묶기) — 아소별장 이동 후보 판정에 쓴다
  state.tgroup={};
  // 기존 배정 rooms 로드
  const seqs=state.guests.map(g=>g.event_seq);
  if(seqs.length){
    try{
      const po=await pagedInSeq('print_overrides','event_seq,team_group',seqs);
      if(!po.error) (po.data||[]).forEach(x=>{ if(x.team_group) state.tgroup[x.event_seq]=x.team_group; });
    }catch(e){}
  }
  state.rooms=[];
  state.members={};
  if(seqs.length){
    const rr=await pagedInSeq('rooms','*',seqs);
    if(rr.error){toast(tx('roomLoadFail',rr.error.message),'err');return;}
    state.rooms=rr.data||[];
    clearLastBulk();   // 새로 불러오면 직전 스냅샷은 무효(다른 상태 기준이라 되돌리기 의미 없음)
    const mm=await pagedInSeq('guest_members','id,event_seq,seq_in_team,name_kr,name_en,is_rep,member_grade,member_class,member_div,actual_dep,actual_dep_reason',seqs);
    if(mm.error){toast(tx('rosterLoadFail',mm.error.message),'warn');}
    else (mm.data||[]).forEach(x=>{(state.members[x.event_seq]=state.members[x.event_seq]||[]).push(x);});
    // ── 명단 중복 방어 (Min 2026-08) ──────────────────────────────────────
    //  guest_members 에 같은 사람이 두 번 들어온 데이터가 관측됐다(예: -1Y/-2Y 김명환).
    //  그대로 두면 미배정 인원이 2배로 부풀고 같은 사람이 두 방에 배정된다.
    //  화면에서는 한 명으로 합쳐 보여주고(이미 배정된 행을 우선 보존), 재임포트를 안내한다.
    {
      const done=new Set(state.rooms.map(r=>r.member_id));
      let dup=0;
      Object.keys(state.members).forEach(seq=>{
        const rows=state.members[seq]||[]; const keep=new Map();
        rows.forEach(m=>{
          const k=(m.name_kr||'').trim()+'|'+(m.name_en||'').trim();
          const cur=keep.get(k);
          if(!cur){ keep.set(k,m); return; }
          const better = done.has(m.id)&&!done.has(cur.id) ? m
                       : (!done.has(m.id)&&done.has(cur.id) ? cur
                       : ((m.seq_in_team||0)<(cur.seq_in_team||0) ? m : cur));
          keep.set(k,better);
        });
        const list=[...keep.values()].sort((a,b)=>(a.seq_in_team||0)-(b.seq_in_team||0));
        dup+=rows.length-list.length;
        state.members[seq]=list;
      });
      if(dup>0){ toast(tx('dupHidden',dup),'warn'); console.warn('명단 중복 숨김:',dup); }
      // 숨긴 중복 인원에 이미 붙어 있던 배정 정리 — 같은 방·같은 기간이면 삭제, 아니면 남은 사람으로 옮김
      const keptIds=new Set(); Object.values(state.members).forEach(a=>a.forEach(m=>keptIds.add(m.id)));
      const dupRows=state.rooms.filter(r=>r.member_id!=null && !keptIds.has(r.member_id));
      if(dupRows.length){
        window._dupRows=dupRows;
        toastUndo(tx('dupAssign',dupRows.length), fixDupAssign, tx('dupFix'));
      }
    }
  }
  // 기간 폐쇄(잠금) 로드 — 범위에 겹치는 폐쇄(from_date<=to AND to_date>=from)
  state.closures=[];
  try{
    const cl=await supa.from('room_closures').select('*').lte('from_date',to).gte('to_date',from);
    if(!cl.error) state.closures=cl.data||[];
  }catch(e){}
  state.sel=new Set();
  rebuildAssignMap();
  render();
  const label = (state.from===state.to) ? state.from : `${state.from}~${state.to}`;
  toast(tx('loadedTeams',label,state.guests.length),'ok');
  // 불러온 뒤 미배정이 남아 있으면 자동배정을 바로 한 번 돌린다(Min 2026-08 — 버튼을 안 눌러도).
  //  · 수기·분할 배정은 그대로 두고 auto 만 정리하므로 반복 실행해도 안전하다.
  //  · [되돌리기] 로 직전 상태 복원 가능. 사용자가 이미 무언가 하고 있으면 건너뛴다.
  try{
    const left=state.guests.reduce((n,g)=>n+unassignedMembers(g.event_seq).length,0);
    if(left>0 && autoRunOn() && !_autoRunning && !state.splitPending){
      toast(tx('autoRunNote',left),'ok');
      await autoAssign();
    }
  }catch(e){ console.warn('자동 실행 건너뜀:',e&&e.message); }
}

function guessSaleType(pname,accom){
  const s=String(pname||'');
  if(accom==='야마나미리조트'){
    if(s.includes('소형트윈')) return '호텔 소형트윈';
    // 「돔하우스」·「여행사」 표기 예약은 모두 돔하우스 자동배정(Min 2026-08)
    if(s.includes('돔하우스')||s.includes('여행사')) return '돔하우스';
    if(s.includes('별장')) return '관내별장';
    return '호텔 트윈';
  }
  if(accom==='쿠주힐즈') return '장기숙박전용';
  if(accom==='간지호텔') return '호텔';
  if(accom==='시즈노야도 료칸') return '료칸';
  return '';
}

// ── 일별 칩 ──
//   · 카드 보기 = 하루만(단일 선택). 보고 있는 날만 하이라이트.
//   · 타임라인 보기 = 복수 선택. '전체'면 모든 날짜가 켜진 것처럼 표시. 빈 선택=전체.
function renderDayStrip(){
  const box=$('#day-strip'); if(!box) return;
  if(!state.from){ box.innerHTML=''; return; }
  const dates=dateRangeList(state.from,state.to);
  if(dates.length<=1){ box.innerHTML=''; return; }
  if(!state.days) state.days=new Set();
  const WD=[0,1,2,3,4,5,6].map(i=>SZCore.weekday('2026-02-0'+(i+1),lang()));   // 요일 표기 = SZCore(화면 언어 연동)
  // ⚠ 날짜 칩의 +N(도착)·미N(미배정)은 **숙소 토글(미배정 팀 필터)** 범위만 센다(Min 2026-08).
  //   숙소를 좁혀 작업할 때 다른 숙소 미배정까지 세면 "이 날짜 끝났나?"를 판단할 수 없다.
  const inScope=g=>teamMatch(g);
  const inByDate={}; state.guests.forEach(g=>{ if(g.dep && inScope(g)) inByDate[g.dep]=(inByDate[g.dep]||0)+1; });
  // 그 날 현지도착인데 아직 미배정인 팀 수(=0 되도록 맞추면 그 날짜 완료)
  const unByDate={}; state.guests.forEach(g=>{ if(g.dep && inScope(g) && unassignedMembers(g.event_seq).length>0) unByDate[g.dep]=(unByDate[g.dep]||0)+1; });
  const scopeTxt = teamSel.size ? [...teamSel].map(k=>accomL(k)).join('·') : tx('dcAll');
  const chip=(d,active)=>{
    const wd=WD[new Date(d+'T00:00:00').getDay()]; const we=(wd==='토'||wd==='일'); const cin=inByDate[d]||0; const un=unByDate[d]||0;
    // 도착이 있는 날 미배정 남으면 「미N」(빨강), 전원 배정 완료면 ✓(초록) — 시즈 예약표와 동일 양식
    const stat = un ? `<span class="dun">${tx('unShort')}${un}</span>` : (cin ? `<span class="dun ok" title="${tx('dcDone')}">✓</span>` : '');
    return `<button class="day-chip${active?' active':''}${we?' we':''}" data-d="${d}" title="${tx('dcChipT',d,cin,un)}">${fmtMD(d)}<small>${wd}</small>${cin?`<span class="dcnt">+${cin}</span>`:''}${stat}</button>`;
  };
  if(viewMode==='timeline'){
    const all=state.days.size===0;
    // data-d="전체" 는 클릭 핸들러의 비교 키 — 절대 번역하지 않음(표시 라벨만 번역)
    box.innerHTML=`<span class="ds-lbl">${tx('tlDays')} <small>${tx('tlMulti')} · ${esc(scopeTxt)}</small></span>`
      +`<button class="day-chip ds-all${all?' active':''}" data-d="전체" title="${tx('tlAllDates')}">${all?'✓ ':''}${tx('dcAll')}</button>`
      + dates.map(d=>chip(d, all || state.days.has(d))).join('');   // 전체면 전부 하이라이트
  } else {
    box.innerHTML=`<span class="ds-lbl">${tx('dateOne')} <small>${tx('dayOne')} · ${esc(scopeTxt)}</small></span>`
      + dates.map(d=>chip(d, d===(state.focus||state.from))).join('');
  }
}

// ── 타임라인(테이프 차트): 객실(행) × 날짜(열) 점유 한눈에 ──
function dateRangeList(from,to){
  const out=[]; let d=from, guard=0;
  while(d<=to && guard<400){ out.push(d); d=isoShift(d,1); guard++; }
  return out;
}
function tlTypeClass(rt){
  if(DELUXE_TYPES.includes(rt)) return 't-dlx';
  if(rt==='트윈') return 't-twin';
  if(rt==='컴팩트트윈') return 't-cmp';
  return 't-etc';
}
function renderTimeline(){
  const box=$('#timeline'); if(!box) return;
  if(!state.from){ box.innerHTML=`<div class="empty-hint">${tx('tlLoadDate')}</div>`; return; }
  const dates=(state.days && state.days.size) ? [...state.days].sort() : dateRangeList(state.from,state.to);
  const WD=[0,1,2,3,4,5,6].map(i=>SZCore.weekday('2026-02-0'+(i+1),lang()));   // 요일 표기 = SZCore(화면 언어 연동)
  const rooms=[...state.inventory].filter(r=>r.active && roomMatch(r))
    .sort((a,b)=>(a.facility||'').localeCompare(b.facility||'')||(a.sort_order||0)-(b.sort_order||0));
  let html='<div class="tl-legend">'
    +`<span><span class="sw" style="background:#ecddb5"></span>${tx('tlLegDlx')}</span>`
    +`<span><span class="sw" style="background:#d6e2f2"></span>${tx('tlLegTwin')}</span>`
    +`<span><span class="sw" style="background:#e6eef7"></span>${tx('tlLegCmp')}</span>`
    +`<span><span class="sw" style="background:var(--accentSoft)"></span>${tx('tlLegEtc')}</span>`
    +`<span style="margin-left:auto;color:var(--muted)">${tx('tlHover')}</span></div>`;
  html+='<table class="tl"><thead><tr><th class="tl-room">'+tx('tlRoom')+' ('+rooms.length+')</th>';
  dates.forEach(d=>{
    const wd=WD[new Date(d+'T00:00:00').getDay()];
    html+=`<th class="${(wd==='토'||wd==='일')?'tl-we':''}">${fmtMD(d)}<small>${wd}</small></th>`;
  });
  html+='</tr></thead><tbody>';
  rooms.forEach(inv=>{
    const cap=inv.max_capacity||inv.capacity;
    const pfx=(PFX[inv.facility]||'X').toLowerCase();
    html+=`<tr><td class="tl-room" title="${inv.facility} · ${typeLabel(inv.room_type,inv.facility,inv.zone)}">`
      +`<span class="tl-fac" style="background:var(--${pfx})"></span>`
      +`<b>${inv.room_no}</b>${zonePin(inv)}<span>${inv.room_type}</span></td>`;
    const rr=state.rooms.filter(r=>r.inventory_id===inv.id);
    dates.forEach(d=>{
      const wd=WD[new Date(d+'T00:00:00').getDay()];
      const we=(wd==='토'||wd==='일');
      const occ=rr.filter(r=> r.check_in<=d && d<r.check_out);
      if(occ.length){
        const used=occ.reduce((s,x)=>s+(x.assigned_pax||0),0);
        const r0=occ[0];
        const tag=teamGroupCode(r0.event_seq)||(tx('teamPrefix')+evNo(r0.event_seq));
        const names=[...new Set(occ.map(x=>{const m=x.member_id!=null?memberById(x.member_id):null;return m?m.name_kr:'';}).filter(Boolean))].join(', ');
        html+=`<td class="tl-c occ ${tlTypeClass(inv.room_type)}${used>cap?' tl-over':''}" `
          +`title="${tag} · ${names} · ${r0.check_in}~${r0.check_out} (${used}/${cap})">`
          +`${r0.check_in===d?`<span class="tl-bar">${tag}</span>`:''}</td>`;
      }else{
        html+=`<td class="tl-c${we?' tl-we':''}"></td>`;
      }
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  box.innerHTML=html;
}

function assignedSeqSet(){

// 선택한 날짜(카드=focus 하루 / 타임라인=선택 일자, 비면 전체)에 머무는 팀인가
//   · 객실 카드/타임라인이 보여주는 날짜와 미배정 목록을 일치시켜 "어느 날짜에 배정하는지" 명확화
function teamInDayScope(g){
  if(!g.dep || !g.arr) return true;
  if(viewMode==='timeline'){
    if(!state.days || state.days.size===0) return true;            // 전체
    for(const d of state.days){ if(g.dep<=d && d<g.arr) return true; }
    return false;
  }
  const d=state.focus||state.from;
  return g.dep<=d && d<g.arr;                                       // 그 하루에 점유
}
function dayScopeLabel(){
  if(viewMode==='timeline') return (state.days && state.days.size) ? [...state.days].sort().map(fmtMD).join('·') : tx('dcAll');
  return fmtMD(state.focus||state.from);
}

// ── 미배정 팀 배정 팝업 (Min 2026-08) ─────────────────────────────────
//   ① 미배정 팀 목록 → ② 그 팀에 넣을 방 목록 → 배정. 한 팝업 안에서 끝난다.

function wzTeams(){
  return state.guests.filter(g=>!teamFullyAssigned(g.event_seq) && teamMatch(g) && teamInDayScope(g))
    .sort((a,b)=>String(a.dep).localeCompare(String(b.dep))||a.event_seq-b.event_seq);
}
// 그 팀이 예약한 숙소의 방인가 — 간지 팀에 야마나미 방을 먼저 내미는 일이 없게(Min 2026-08).
//   숙소 토글(상단)이 「전체」면 오프사이트(간지·시즈)가 빠지는데, 자기 숙소만은 토글과 무관하게 항상 보여준다.
function wzOwnRoom(g,inv){
  const tk=teamPlaceKeys(g);
  return roomPlaceKeys(inv).some(k=>tk.includes(k));
}
function wzRooms(g,need){
  return state.inventory.filter(inv=>{
    if(!inv.active) return false;
    if(!wzOwnRoom(g,inv) && !roomMatch(inv)) return false;
    if(roomClosure(inv.id,g.dep,g.arr)) return false;
    const cap=inv.max_capacity||inv.capacity;
    return (cap-roomOccOver(inv.id,g.dep,g.arr).peak)>=Math.max(1,need);
  }).map(inv=>({inv, own:wzOwnRoom(g,inv), free:(inv.max_capacity||inv.capacity)-roomOccOver(inv.id,g.dep,g.arr).peak}));
}
// 객실 카드 타입 표기 — 간지호텔·돔하우스는 「트윈」 하나뿐(야마나미 등급명을 쓰지 않는다)
function wzTypeLabel(inv){
  if(inv.facility==='간지호텔'||inv.zone==='돔하우스') return typeLabel(inv.room_type,inv.facility,inv.zone);

}

  bg.querySelector('#wz-q').placeholder=_wzSeq?tx('wzSearchRoom'):tx('wzSearchTeam');
  bg.querySelector('#wz-q').value='';
  const chips=bg.querySelector('#wz-chips');
  if(chips){
    if(_wzSeq){ chips.style.display='none'; }
    else{
      const all=wzTeams();
      const nS=all.filter(g=>singleNote(g)).length, nW=all.filter(g=>String(g.status||'').includes('대기')).length;
      chips.style.display='flex';
      chips.innerHTML=`<button type="button" class="ffbtn${_wzFilter==='all'?' active':''}" data-wzf="all">${tx('wzAll')} ${all.length}</button>`
        +(nS?`<button type="button" class="ffbtn${_wzFilter==='single'?' active':''}" data-wzf="single">${tx('wzOnlySingle',nS)}</button>`:'')
        +(nW?`<button type="button" class="ffbtn${_wzFilter==='wait'?' active':''}" data-wzf="wait">${tx('wzOnlyWait',nW)}</button>`:'');
      chips.querySelectorAll('[data-wzf]').forEach(b=>b.addEventListener('click',()=>{ _wzFilter=b.dataset.wzf; renderWizard(); }));

  bg.querySelector('#wz-body').innerHTML=wzBody();

  const wzAll=bg.querySelector('#wz-all');

    const boxes=[...bg.querySelectorAll('.wz-m')];
    const on=!boxes.every(c=>c.checked);
    boxes.forEach(c=>{ c.checked=on; });
    wzAll.textContent=on?tx('wzNoneSel'):tx('wzAllSel');
  });
  bg.querySelectorAll('.wz-room').forEach(b=>b.addEventListener('click',async()=>{
    const inv=state.inventory.find(x=>String(x.id)===b.dataset.inv); if(!inv) return;
    let ids=[...bg.querySelectorAll('.wz-m:checked')].map(c=>c.dataset.mid);
    if(!ids.length){ toast(tx('wzPickWho'),'warn'); return; }
    // 싱글(빈자리 1)에 3명을 넣으려 하면 앞에서 1명만 — 정원 초과를 애초에 만들지 않는다
    const free=(inv.max_capacity||inv.capacity)-roomOccOver(inv.id,_g().dep,_g().arr).peak;
    if(ids.length>free){ toast(tx('wzCap',inv.room_no,free),'warn'); ids=ids.slice(0,Math.max(1,free)); }
    const names=ids.map(id=>{ const m=memberById(id); return (m&&(m.name_kr||m.name_en))||''; }).filter(Boolean).join(', ');
    if(!confirm(tx('wzAsk',inv.room_no,wzTypeLabel(inv),names,ids.length))) return;
    await assignMembers(ids,inv);
    const g2=state.guests.find(x=>x.event_seq===_wzSeq);
    if(g2 && unassignedMembers(g2.event_seq).length===0) _wzSeq=null;   // 그 팀 끝나면 목록으로
    renderWizard();
  }));
}

// 중복 인원 배정 정리 — 같은 사람이 두 번 배정된 것을 해소한다(Min 2026-08)
async function fixDupAssign(){
  const rows=window._dupRows||[]; if(!rows.length) return;
  const keptOf=id=>{ // 숨겨진 중복 → 남은 사람(같은 팀·같은 이름)
    const r=state.rooms.find(x=>x.id===id); return null;
  };
  let del=0, mov=0;
  for(const r of rows){
    const same=state.rooms.find(x=>x.id!==r.id && x.inventory_id===r.inventory_id
      && x.check_in===r.check_in && x.check_out===r.check_out && x.event_seq===r.event_seq
      && (state.members[x.event_seq]||[]).some(m=>m.id===x.member_id));
    if(same){ const {error}=await supa.from('rooms').delete().eq('id',r.id); if(!error){ del++; state.rooms=state.rooms.filter(x=>x.id!==r.id); } }
    else {
      const free=(state.members[r.event_seq]||[]).find(m=>!state.rooms.some(x=>x.member_id===m.id));
      if(free){ const {error}=await supa.from('rooms').update({member_id:free.id}).eq('id',r.id); if(!error){ r.member_id=free.id; mov++; } }
      else { const {error}=await supa.from('rooms').delete().eq('id',r.id); if(!error){ del++; state.rooms=state.rooms.filter(x=>x.id!==r.id); } }
    }
  }
  window._dupRows=null;
  rebuildAssignMap(); render();
  toast(tx('dupFixed',del+mov),'ok');
}

// 팀별 「배정됨 N명」 펼침 상태(미배정 목록)
const uaDoneOpen=new Set();
// 팀 전체 선택/해제 — 미배정 인원만 대상
function selTeamAll(seq,on){
  const beforeSpan=JSON.stringify(selAssignSpan());
  if(!state.sel) state.sel=new Set();
  unassignedMembers(seq).forEach(m=>{ if(on) state.sel.add(m.id); else state.sel.delete(m.id); });
  renderUnassigned(); renderSelBar();
  if(JSON.stringify(selAssignSpan())!==beforeSpan){ if(viewMode==='timeline') renderTimeline(); else renderFacilities(); }
}

function renderUnassigned(){
  const box=$('#unassigned'); box.innerHTML='';
  if(!state.sel) state.sel=new Set();
  const done=assignedMemberSet();
  // 미배정 인원이 남은 팀만 (+ 숙소 필터 + 선택 날짜 점유)
  const list=state.guests.filter(g=>!teamFullyAssigned(g.event_seq) && teamMatch(g) && teamInDayScope(g));
  const totalLeft=list.reduce((s,g)=>s+unassignedMembers(g.event_seq).length,0);
  $('#unassigned-cnt').innerHTML=`${dayScopeLabel()}${tx('basisSuffix')} · ${list.length}${t('rm_cntTeam')} · ${totalLeft}${t('rm_cntPpl')}`;
  // 🚪 오늘 퇴실 목록은 제거(Min 결정): 빈 방은 카드에 이미 보이고, 퇴실 확인은 프론트데스크 소관.
  if(!list.length){ const e=document.createElement('div'); e.className='empty-hint'; e.innerHTML=t('rm_allAssigned'); box.appendChild(e); renderSelBar(); return; }
  function mkCard(g){
    const roster=teamRoster(g.event_seq);
    const leftN=unassignedMembers(g.event_seq).length;
    const card=document.createElement('div');
    card.className='team-card acc-'+g.pfx;
    card.dataset.seq=g.event_seq;
    const gcode=teamGroupCode(g.event_seq)||tx('codeUndecided');
    const showDone=uaDoneOpen.has(g.event_seq);
    const rosterHtml=roster.length? roster.filter(m=>showDone||!done.has(m.id)).map(m=>{
      const isDone=done.has(m.id);
      const checked=state.sel.has(m.id);
      return `<div class="rmember${m.is_rep?' rep':''}${isDone?' done':''}${checked?' sel':''}" data-mid="${m.id}" ${isDone?'':'draggable="true"'}>
        <input type="checkbox" class="mchk" data-mid="${m.id}" ${isDone?'disabled':''} ${checked?'checked':''}>
        <span class="rtag">${m.tag||(m.num)}</span>
        <span class="rname">${m.name_kr||'-'}${m.is_rep?`<i class="repbadge">${tx('repBadge')}</i>`:''}<i class="gbadge${isMember(m)?' mem':''}" title="${esc(gradeLabel(m))}">${gradeShort(m)}</i></span>
        <span class="ren">${m.name_en||''}</span>
        ${isDone?`<span class="rdone" title="${tx('assignedRoomT')}">${memberRoomLabel(m.id)} <button class="runassign" data-mid="${m.id}" title="${tx('unassignClearT')}">${tx('unassignClear')}</button></span>`:''}
        ${(!isDone && m.actual_dep)?`<button class="reco-cancel" data-mid="${m.id}" title="${tx('ecoUndoUnassignedT')}" style="margin-left:auto;font-size:10.5px;font-weight:700;color:#9a6b00;background:#fff4d6;border:1px solid #f0d48a;border-radius:99px;padding:1px 7px;cursor:pointer">🛫${fmtMD(m.actual_dep)} ✕</button>`:''}
      </div>`;
    }).join('') : `<div class="rmember dim">${tx('rosterNone')}</div>`;
    const isNonMem=(g.group_code||'').startsWith('F');
    const doneN=roster.length-leftN;
    const openDone=uaDoneOpen.has(g.event_seq);
    card.innerHTML=`
      <div class="tc-h">
        <input type="checkbox" class="tchk" data-seq="${g.event_seq}" title="${tx('selTeamT')}">
        <span class="tag">${gcode}</span>
        <span class="mbadge ${isNonMem?'mb-non':'mb-mem'}">${isNonMem?t('rm_nonmember'):t('rm_member')}</span>
        ${String(g.status||'').includes('대기')?`<span class="sgb" style="background:#7a5aa8" title="${esc(tx('waitBadgeT'))}">${tx('waitBadge')}</span>`:''}
        ${g.event_no?`<span class="evno" title="${tx('evnoT')}">${g.event_no}</span>`:''}
        <span class="left${leftN?'':' ok'}">${leftN?tx('leftOf',leftN,roster.length||g.pax):tx('allDone')}</span>
      </div>
      ${singleNote(g)?`<div class="tc-s" style="padding-top:0">${singleBadgeHtml(g)}</div>`:''}
      <div class="tc-s">${fmtMD(g.dep)} → ${fmtMD(g.arr)} · ${teamNights(g)}${tx('nightUnit')} · ${g.pax}${tx('nameUnit')}${g.isNewCheckin?` <b class="cnew">${tx('todayCheckin')}</b>`:''}
        <br>${esc(g.accom||'')} · <b>${esc(g.sale_type||'')} → ${esc(ROOMTYPE_MAP[g.sale_type]||tx('onsiteFix'))}</b></div>
      <div class="roster">${rosterHtml}</div>
      ${doneN?`<button type="button" class="dtog" data-seq="${g.event_seq}">${tx('doneToggle',doneN,openDone)}</button>`:''}`;
    // 행 선택 토글 (행 어디를 눌러도 1회 토글). 체크박스/행 클릭 일원화.
    function setSel(mid,on,rowEl){
      const beforeSpan=JSON.stringify(selAssignSpan());
      if(on) state.sel.add(mid); else state.sel.delete(mid);
      if(rowEl){ rowEl.classList.toggle('sel',on);
        const c=rowEl.querySelector('.mchk'); if(c) c.checked=on; }
      renderSelBar();
      // 선택팀 체류기간이 바뀌면 카드 점유를 그 기간 기준으로 다시 그림(빈 듯해도 사용중 표시)
      if(JSON.stringify(selAssignSpan())!==beforeSpan){ if(viewMode==='timeline') renderTimeline(); else renderFacilities(); }
    }
    card.querySelectorAll('.rmember[data-mid]').forEach(row=>{
      if(row.classList.contains('done')) return; // 배정완료 행은 무시
      const mid=row.dataset.mid;
      const chk=row.querySelector('.mchk');
      // 행 클릭 = 토글 (체크박스를 직접 누른 경우는 기본동작이 이미 토글하므로 중복방지)
      row.addEventListener('click',e=>{
        if(e.target===chk) return; // 체크박스 직접 클릭은 아래 change 가 처리
        const on=!state.sel.has(mid);
        setSel(mid,on,row);
      });
      if(chk){
        chk.addEventListener('change',()=>setSel(mid,chk.checked,row));
      }
      // 드래그 → 드롭 배정. 미선택이면 그 한 명 포함.
      row.addEventListener('dragstart',e=>{
        if(!state.sel.has(mid)) setSel(mid,true,row);
        e.dataTransfer.setData('text/plain','member');
        e.dataTransfer.effectAllowed='move';
        row.classList.add('dragging');
      });
      row.addEventListener('dragend',()=>row.classList.remove('dragging'));
    });
    // 팀 전체 선택 — 대량 배정에서 사람마다 클릭하지 않게(체크=미배정 전원 선택)
    const tchk=card.querySelector('.tchk');
    if(tchk){
      const rest=unassignedMembers(g.event_seq).map(m=>m.id);
      tchk.checked = rest.length>0 && rest.every(id=>state.sel.has(id));
      tchk.addEventListener('click',ev=>ev.stopPropagation());
      tchk.addEventListener('change',()=>{ selTeamAll(g.event_seq, tchk.checked); });
    }
    wireSingleDoc(card);
    const dtog=card.querySelector('.dtog');
    if(dtog) dtog.addEventListener('click',ev=>{ ev.stopPropagation();
      uaDoneOpen.has(g.event_seq)?uaDoneOpen.delete(g.event_seq):uaDoneOpen.add(g.event_seq);
      renderUnassigned(); });
    // 배정완료 행의 ✕해제 → 그 사람 배정 전부 풀어 명단으로
    card.querySelectorAll('.runassign').forEach(btn=>btn.addEventListener('click',ev=>{ev.stopPropagation();unassignMember(btn.dataset.mid);}));
    card.querySelectorAll('.reco-cancel').forEach(btn=>btn.addEventListener('click',ev=>{ev.stopPropagation();cancelEcoByMember(btn.dataset.mid);}));
    return card;
  }
  // ── 현지도착일 기준 2그룹: 「오늘 현지도착」 / 「이전 도착·미배정 잔류」 (카드 보기) ──
  const leftOf=g=>unassignedMembers(g.event_seq).length;
  const focusDay = (viewMode!=='timeline') ? (state.focus||state.from) : null;
  function secHead(txt){ const d=document.createElement('div'); d.className='ua-sec'; d.innerHTML=txt; return d; }
  if(focusDay){
    const arrivals=list.filter(g=>g.dep===focusDay);
    const carry   =list.filter(g=>g.dep!==focusDay);
    box.appendChild(secHead(tx('arrSec',fmtMD(focusDay),arrivals.length,arrivals.reduce((s,g)=>s+leftOf(g),0))));
    if(arrivals.length) arrivals.forEach(g=>box.appendChild(mkCard(g)));
    else { const e=document.createElement('div'); e.className='empty-hint'; e.style.cssText='padding:14px 10px;font-size:13px;color:var(--ok)'; e.textContent=tx('noArrUnassigned'); box.appendChild(e); }
    // 이전 도착·미배정 잔류도 **카드로 띄운다**(Min 2026-08).
    //   예전엔 한 줄 안내만 뒀는데, 미배정 목록이 서랍으로 바뀐 뒤로는 그 팀을 열 방법이 없어져
    //   「버튼은 미배정 2팀인데 목록은 비어 있다」가 됐다. 머리글로 구분만 하고 전부 보여준다.
    if(carry.length){
      box.appendChild(secHead(tx('carrySec',carry.length,carry.reduce((s,g)=>s+leftOf(g),0))));
      carry.forEach(g=>box.appendChild(mkCard(g)));
    }
  } else {
    list.forEach(g=>box.appendChild(mkCard(g)));
  }
  renderSelBar(); updateUaBtn();
}

// 그 방 숙소가 팀 예약 숙소와 맞는가(같은 숙소 우선정렬용)
function roomFitsTeam(inv,g){ const rk=roomPlaceKeys(inv)||[]; const tk=teamPlaceKeys(g)||[]; return rk.some(k=>tk.includes(k)); }
function closeAssignPicker(){ const m=$('#assign-picker'); if(m) m.remove(); }
// ── 빈 방 클릭 → "이 방·이 날짜에 배정 가능한 미배정 인원" 팝업 ──
function openAssignPicker(inv){
  closeAssignPicker();
  if(!inv.active){ toast(inv.room_no+': '+tx('inactiveRoomT'),'warn'); return; }
  const _cloF=roomClosedFocus(inv.id);
  if(_cloF){ toast(tx('closedRange',inv.room_no,_cloF.from_date,_cloF.to_date,_cloF.reason),'warn'); return; }
  const cap=inv.max_capacity||inv.capacity;
  const usedNow=roomUsedPax(inv);
  const remain=Math.max(0, cap-usedNow);
  // 후보: 선택 날짜 점유 + 미배정 인원 남은 팀. 같은 숙소 팀 먼저.
  const teams=state.guests.filter(g=>teamInDayScope(g) && unassignedMembers(g.event_seq).length>0);
  teams.sort((a,b)=>{
    const fa=roomFitsTeam(inv,a)?0:1, fb=roomFitsTeam(inv,b)?0:1;
    if(fa!==fb) return fa-fb;
    return String(a.event_no||'').localeCompare(String(b.event_no||'')) || a.event_seq-b.event_seq;
  });
  const gbadge=(m)=>`<i class="gbadge${isMember(m)?' mem':''}" title="${esc(gradeLabel(m))}">${gradeShort(m)}</i>`;
  const body = teams.length ? teams.map(g=>{
    const fit=roomFitsTeam(inv,g);
    const gcode=teamGroupCode(g.event_seq)||tx('codeUndecided');
    const mem=unassignedMembers(g.event_seq);
    const rows=mem.map(m=>`<label class="ap-m" data-hay="${esc([m.name_kr,m.name_en,m.tag,m.num,gcode,g.event_no,g.rep].filter(Boolean).join(' ').toLowerCase())}" style="display:flex;align-items:center;gap:7px;padding:5px 9px;cursor:pointer;border-top:1px solid var(--border)">
        <input type="checkbox" class="ap-chk" data-mid="${m.id}" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer">
        <span style="font-family:var(--mono);font-size:11px;color:var(--text2);min-width:30px">${m.tag||m.num||''}</span>
        <span style="font-size:13px;font-weight:600">${m.name_kr||'-'}${m.is_rep?` <i style="font-size:8px;font-weight:800;color:var(--accent2)">${tx('repBadge')}</i>`:''}${gbadge(m)}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--muted)">${m.name_en||''}</span>
      </label>`).join('');
    return `<div class="ap-team" data-hay="${esc([gcode,g.rep,g.event_no,g.accom].filter(Boolean).join(' ').toLowerCase())}" style="border:1px solid ${fit?'var(--accent)':'var(--border)'};border-radius:9px;margin-bottom:8px;overflow:hidden;${fit?'box-shadow:0 0 0 1px var(--accent) inset':''}">
      <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2)">
        <span style="font-family:var(--mono);font-weight:800;color:var(--accent)">${gcode}</span>
        ${fit?`<span style="font-size:9.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:99px;padding:1px 8px">${tx('thisLodging')}</span>`:''}
        <span style="margin-left:auto;font-size:11.5px;color:var(--text2)">${fmtMD(g.dep)}→${fmtMD(g.arr)} · ${g.accom} · ${tx('remainN',mem.length)}</span>
      </div>
      ${singleNote(g)?`<div style="padding:6px 10px 2px">${singleBadgeHtml(g)}</div>`:''}
      ${rows}
    </div>`;
  }).join('') : `<div style="padding:28px;text-align:center;color:var(--muted)">${tx('pickerNoCandidates')}</div>`;

  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='assign-picker';
  bg.innerHTML=`<div class="modal" style="max-width:580px">
    <h2 style="display:flex;align-items:center;justify-content:space-between;gap:8px">

  const upd=()=>{ const n=bg.querySelectorAll('.ap-chk:checked').length;
