// (구) 팀 단위 assign 은 호환용 래퍼 — 팀의 미배정자 전원을 한 방에 시도
async function assign(seq,inv){
  const ids=unassignedMembers(seq).map(m=>m.id);
  if(!ids.length){toast(tx('alreadyAssignedTeam'),'warn');return;}
  await assignMembers(ids, inv);
}

// ════════════════════════════════════════════════════════════════════════
//  자동배정 (회원 우선 강화 = 회원 짝을 일반 짝보다 먼저 배정 · 회원→디럭스 · 일반→예약종류 · 각 그룹 예약순 · 수기 보호)
//   · 대상: 야마나미 호텔(트윈/소형트윈/관내별장→호텔동) + 돔하우스·간지·쿠주·시즈노야도
//   · 제외: 소보별장/아소별장(비워둠) — autoRoute 가 null 반환
//   · 회원 판정: 공란·'일반고객'·'일반' = 일반, 그 외(회원권/다이아몬드1/EWRC…) = 회원
//   · 룸메 짝(A 규칙): 명단 순서 연속 2명(1-2,3-4). 짝에 회원이 1명이라도 있으면 디럭스, 없으면 예약종류.
//   · 디럭스 부족 시 예약종류로 자동 강등. 3명팀·진짜 홀수잔여는 보류(미배정).
//   · assign_source='auto' 만 재정렬(수기 배정·잠금은 안 건드림) → 재실행=승급 반영.
// ════════════════════════════════════════════════════════════════════════
const DELUXE_TYPES=['디럭스더블트윈','디럭스트윈']; // 우선순위 순(최상급 먼저)
// ── 3층 실질 등급 강등 (Min 2026-08, 현장 기준) ──────────────────────────────
//  3층은 같은 타입명이어도 급이 낮다 → 배정 계산에서만 한 단계 내려서 취급한다.
//   3층 디럭스 → '트윈' 취급 / 3층 트윈 → '컴팩트트윈'(소형) 취급.
//   ※3층엔 컴팩트트윈이 애초에 등록돼 있지 않음(트윈4·싱글4·디럭스더블트윈4).
//   ⚠ DB의 room_type·화면 표시는 그대로 — 자동배정 풀 판정에만 쓴다.
const LOW_GRADE_FLOOR=3;
const TYPE_DOWNGRADE={'디럭스더블트윈':'트윈','디럭스트윈':'트윈','트윈':'컴팩트트윈'};
function effType(inv){
  const t=inv&&inv.room_type||'';
  return (floorOf(inv)===LOW_GRADE_FLOOR && TYPE_DOWNGRADE[t]) ? TYPE_DOWNGRADE[t] : t;
}

// 예약순(선착) = event_seq 오름차순. 작을수록 먼저 예약 → 좋은 객실 우선.
//  엠클릭 번호 체계: 이전 시스템에서 이관한 '가장 빠른 예약'들 = 정상 번호대(~98,219, 예: 90000번대) /
//   2026-01 엠클릭 도입 후 '신규 예약' = 30,000,000번대. → 오름차순이면 옛(빠른)예약이 신규(늦은)예약보다 앞.
//  ⚠ 30M값은 합성쓰레기가 아니라 '신규=늦은 예약'이라 뒤로 가는 게 정상. 행사번호 접미로 바꾸지 말 것
//   (접미는 옛/신규를 못 가려 순서가 섞임). 날짜 변경해도 event_seq 불변이라 예약권·배정 보존.

// 회원 판정·등급 라벨은 공유 모듈(saizen-core.js)이 단일 진실원 — 여기선 위임만.
//   회원 판정 = 고객등급(T)·회원권구분(V)·회원구분(U) 3컬럼 OR(회원 우선).
function isMember(m){ return SZCore.isMember(m); }
function gradeLabel(m){ return SZCore.gradeLabel(m); }
// 회원권구분 배지 축약: 다이아몬드→DI1·다이아몬드Ⅱ→DI2·EWRC(이용권)→EW1·EWRCⅡ→EW2·골드/특별/일반은 그대로
function gradeShort(m){
  const s=String(gradeLabel(m)||'').trim(); if(!s) return '';
  if(/다이아몬드\s*(Ⅱ|II|2)/i.test(s)) return 'DI2';
  if(/다이아몬드/.test(s)) return 'DI1';
  if(/EWRC\s*(Ⅱ|II|2)/i.test(s)) return 'EW2';
  if(/EWRC/i.test(s)) return 'EW1';
  if(/골드|gold/i.test(s)) return '골드';
  if(/특별/.test(s)) return '특별';
  if(/일반|비회원/.test(s)) return '일반';
  return s;
}

// 팀의 판매분류·숙소 → 배정 라우팅. null 이면 자동배정 제외(소보 등).
// 일반 고객 객실 우선순위(야마나미 호텔동). 앞에서부터 소진한다.
const GEN_TYPES=['트윈','컴팩트트윈','더블'];
const SINGLE_TYPES=['싱글'];          // 홀수로 남는 1명 전용(정원 1)
function autoRoute(g){
  const st=g.sale_type, ac=g.accom;
  if(ac==='야마나미리조트'){
    // 일반은 "스탠다드트윈 또는 컴팩트트윈" — 예약종류 무관하게 스탠다드 트윈 먼저·컴팩트트윈은 최후 폴백(Min 결정).
    //   (현장은 트윈·컴팩트트윈을 사실상 동급으로 보므로 소형트윈 예약도 트윈 우선 = 업그레이드, 컴팩트를 항상 마지막에 소진)
    // 일반 = 스탠다드 트윈 → 컴팩트트윈 → 더블(2인실, 최후). 더블은 침대가 1개일 수 있어 맨 뒤(Min 2026-08).
    if(st==='호텔 트윈')     return {fac:ac, floorOnly:true, genTypes:GEN_TYPES, deluxe:true};
    if(st==='호텔 소형트윈') return {fac:ac, floorOnly:true, genTypes:GEN_TYPES, deluxe:true};
    if(st==='관내별장')      return {fac:ac, floorOnly:true, genTypes:GEN_TYPES, deluxe:true}; // 소보 비우고 호텔로
    if(st==='돔하우스')      return {fac:ac, zone:'돔하우스', genTypes:['트윈'],      deluxe:false};
    return null; // 그 외(소보·아소 현장지정) 제외
  }
  if(ac==='쿠주힐즈')        return {fac:ac, any:true, deluxe:false};
  if(ac==='간지호텔')        return {fac:ac, any:true, deluxe:false};
  if(ac==='시즈노야도 료칸') return null;   // ⚠ 시즈 자동배정은 shizu.html(autoAssignShizu)이 전담 — 페어(2인)만·빈방만·홀수 미배정. room.html 자동배정은 시즈 제외(정원3 트윈에 남의 팀 3번째 끼움 방지). 시즈 방배정은 시즈노야도 예약표 카드에서.
  return null;
}

// 라우팅+종류 → 후보 객실 풀(활성, 우선순위 정렬)
// 층 번호(3~12). 비호텔/별장 등은 0. 정렬에서 '높은 층 우선·3층 맨 뒤'에 사용.
function floorOf(r){ const m=String(r.zone||'').match(/^(\d+)층$/); return m?+m[1]:0; }

// ── 청소 효율 박수→층 배정 규칙 (야마나미 호텔동 전용) ──
//   · 존재 이유 = 객실 청소팀 가동 효율(Min). 같은 층을 같은 박수(=같은 퇴실일)로 맞추면
//     그 층이 한날 통째로 비어 청소팀이 층 단위로 한 번에 움직인다. 퇴실일이 섞이면
//     같은 층을 며칠에 걸쳐 몇 번씩 오가야 해 인원이 훨씬 많이 든다.
//   · 단 '우선순위'일 뿐 제한이 아니다 — 규칙 층이 차면 다른 층을 쓴다(미배정 금지).
//   · 3·4박 → 9·6·3층(무조건) / 7박 → 11·10·7·4층(무조건) / 그 외 박수 → 유동층 12·8·5
//   · 유동층(12·8·5)은 박수가 정해져 있지 않지만 '층마다 한 가지 박수'로만 채운다(혼합 금지).
// 한 층에 지금 들어있는(=DB 점유 occ + 이번 배치 pending) 서로 다른 박수 집합.
function floorNightSet(f, occ, pending){
  const s=new Set();
  const add=r=>{ if(!r.check_in||!r.check_out) return;
    const n=Math.round((new Date(r.check_out)-new Date(r.check_in))/864e5); if(n>0) s.add(n); };
  (occ||[]).forEach(r=>{ const inv=invById(r.inventory_id); if(inv&&floorOf(inv)===f) add(r); });
  (pending||[]).forEach(r=>{ const inv=invById(r.inventory_id); if(inv&&floorOf(inv)===f) add(r); });
  return s;
}
// 이 박수 팀이 들어갈 수 있는 층(우선순위 순) — 규칙·상수는 saizen-core(SZCore.allowedFloors) 단일 진실원.
function nightFloors(nights, occ, pending){
  return SZCore.allowedFloors(nights, f=>floorNightSet(f,occ,pending));
}
// 박수→층 규칙은 '우선순위'이지 '제한'이 아니다(Min 2026-08:
//  "비어있는데 다른 박수 손님이 투숙 못하게 막지 않는다. 그로 인해 미배정이 발생하면 안 된다").
//  → 허용 층을 앞으로 정렬하고, 나머지 층은 뒤에 남긴다(높은 층 우선). 필터하지 않는다.
function poolByFloorOrder(pool, floorOrder){
  const rank=new Map((floorOrder||[]).map((f,i)=>[f,i]));
  const r=inv=>{ const f=floorOf(inv); return rank.has(f) ? rank.get(f) : 1000-f; };  // 규칙 층 먼저 → 그 외 높은 층 순
  return pool.slice().sort((a,b)=>r(a)-r(b));
}
// 자동배정에서 '가장 마지막에' 채우는 방(현장 요청). 시즈노야도 北條 = 청소·동선상 최후 사용.
//   같은 풀 안에서 다른 방을 먼저 소진한 뒤에야 배정되도록 정렬 후순위로 민다(수기 배정엔 영향 없음).
const AUTO_LAST_ROOMS={'시즈노야도 료칸':['北條']};
function autoLastRank(r){ const l=AUTO_LAST_ROOMS[r.facility]; return (l&&l.indexOf(r.room_no)>=0)?1:0; }
function roomPool(route, kind){
  let rooms=state.inventory.filter(r=>r.facility===route.fac && r.active);
  if(route.floorOnly)      rooms=rooms.filter(r=>/^\d+층$/.test(r.zone||''));
  else if(route.zone)      rooms=rooms.filter(r=>(r.zone||'')===route.zone);
  // 공통 1순위: 높은 층 우선(3층=기피층이라 맨 뒤). 예약 빠른 팀이 먼저 좋은 층을 받음.
  const byFloorDesc=(a,b)=>floorOf(b)-floorOf(a);
  if(kind==='deluxe'){
    rooms=rooms.filter(r=>DELUXE_TYPES.includes(effType(r)));   // 3층 디럭스는 강등되어 여기서 빠짐
    rooms.sort((a,b)=>byFloorDesc(a,b)
                      || (DELUXE_TYPES.indexOf(effType(a))-DELUXE_TYPES.indexOf(effType(b)))
                      || (a.sort_order||0)-(b.sort_order||0));
  }else{
    if(route.genTypes){
      rooms=rooms.filter(r=>route.genTypes.includes(effType(r)));  // 3층 디럭스=트윈 / 3층 트윈=컴팩트 취급
      rooms.sort((a,b)=>byFloorDesc(a,b)
                        || (route.genTypes.indexOf(effType(a))-route.genTypes.indexOf(effType(b)))
                        || (a.sort_order||0)-(b.sort_order||0));
    }else{
      rooms=rooms.filter(r=>(r.max_capacity||r.capacity)>=2); // 비호텔: 2인 이상 방
      rooms.sort((a,b)=>autoLastRank(a)-autoLastRank(b) || (a.sort_order||0)-(b.sort_order||0)); // 北條 등 '최후 배정' 방은 뒤로
    }
  }
  return rooms;
}

// 특정 객실이 그 기간에 이미 쓰는 인원(occ=점유원장 + 이번 배치 pending)
//  · occ 기본값은 state.rooms(로드된 달)지만, 자동배정은 DB 전체 점유(다른 달 포함)를 넘겨
//    월 경계 팀이 다른 달 팀과 같은 방·겹치는 날에 초과되지 않도록 한다.
function roomUsedFor(invId,dep,arr,pending,occ){
  const base = occ || state.rooms;
  let s=0;
  base.forEach(r=>{ if(r.inventory_id===invId && overlaps(dep,arr,r.check_in,r.check_out)) s+=(r.assigned_pax||0); });
  pending.forEach(r=>{ if(r.inventory_id===invId && overlaps(dep,arr,r.check_in,r.check_out)) s+=(r.assigned_pax||0); });
  return s;
}
// 한 방의 [dep,arr) 겹침 점유를 DB에서 권위 조회(다른 달 포함). 수기·분할 정원 체크용.
//   overlaps(dep,arr,ci,co) = dep<co && ci<arr  →  .lt('check_in',arr).gt('check_out',dep)
async function dbRoomUsedPax(invId, dep, arr, excludeIds){
  const ex=new Set(excludeIds||[]);
  try{
    const r=await pagedQuery(()=>supa.from('rooms').select('id,assigned_pax,check_in,check_out')
      .eq('inventory_id',invId).lt('check_in',arr).gt('check_out',dep).order('id'));
    if(r.error) throw r.error;
    return (r.data||[]).filter(x=>!ex.has(x.id)).reduce((s,x)=>s+(x.assigned_pax||0),0);
  }catch(e){   // 폴백: 로드된 달만(state.rooms) — 최소 보장
    return state.rooms.filter(x=>x.inventory_id===invId && !ex.has(x.id) && overlaps(dep,arr,x.check_in,x.check_out)).reduce((s,x)=>s+(x.assigned_pax||0),0);
  }
}
function pickRoom(pool,dep,arr,need,pending,occ){
  for(const inv of pool){
    if(roomClosure(inv.id,dep,arr)) continue;   // 기간 폐쇄된 방은 자동배정 제외
    const cap=inv.max_capacity||inv.capacity;
    if(roomUsedFor(inv.id,dep,arr,pending,occ)+need<=cap) return inv;
  }
  return null;
}
// 미배정 사유 꼬리표: 날짜 · 대표 · 인원 (콘솔 로그용 — 화면은 팀 카드가 대신한다)
function holdTag(g){
  if(!g) return '';
  return ` · ${fmtMD(g.dep)}~${fmtMD(g.arr)} · ${g.rep||''} ${g.pax||''}${tx('nameUnit')}`;
}
// 사유 1건 = { t:사유문구, seq:행사번호, cat:분류 } (Min 2026-08)
//   예전엔 문자열 한 줄이라 '어느 팀인지·무엇을 하라는지' 알 수 없었다 → 팀 카드로 보여주려고 구조화.
function mkHold(t,g,cat){ return { t, seq:g?g.event_seq:null, cat:cat||'etc' }; }
function holdLine(h){
  if(typeof h==='string') return h;
  const g=h.seq!=null?state.guests.find(x=>x.event_seq===h.seq):null;
  return h.t+holdTag(g);
}
function mkRow(g,m,inv){
  return { event_seq:g.event_seq, member_id:m.id, inventory_id:inv.id,
    facility:inv.facility, room_type:inv.room_type, room_no:inv.room_no,
    check_in:g.dep, check_out:g.arr, assigned_pax:1, assign_source:'auto' };
}

// 그 팀 needRooms개가 '한 층에' 다 들어갈 수 있는 가장 높은 층(층 정보 있는 방만). 없으면 null.
//   → 같은 팀은 되도록 같은 층(기본 원칙). 별장·돔하우스 등 층 없는 방(floor 0)은 묶지 않음.
function pickFloor(pool,needRooms,dep,arr,pending,occ,floorOrder){
  const byFloor={};
  pool.forEach(inv=>{ const f=floorOf(inv); if(f>0) (byFloor[f]=byFloor[f]||[]).push(inv); });
  // 규칙 층을 먼저 보되, 거기서 못 묶으면 나머지 층도 본다(층 규칙 = 우선순위, Min 2026-08).
  const all = Object.keys(byFloor).map(Number).sort((a,b)=>b-a);
  const pref = (floorOrder&&floorOrder.length) ? floorOrder.filter(f=>byFloor[f]) : [];
  const floors = pref.concat(all.filter(f=>!pref.includes(f)));
  for(const f of floors){
    let free=0;
    for(const inv of byFloor[f]){
      if(roomClosure(inv.id,dep,arr)) continue;
      const cap=inv.max_capacity||inv.capacity;
      if(roomUsedFor(inv.id,dep,arr,pending,occ)+2<=cap) free++;
    }
    if(free>=needRooms) return f;
  }
  return null;
}

// list 를 2명씩 짝지어 primaryPool 에 배정. 없으면 fallbackPool(강등). 홀수 1명은 보류.
//   ★ 같은 팀 같은 층 원칙: 2방 이상이면 팀 전체가 들어갈 가장 높은 한 층으로 묶고,
//      그 층이 모자라면 전체 풀로 폴백(자리 없는 것보단 분산 배정).
// 명단 평탄 리스트 → 연속 짝(1-2,3-4)으로 묶어 위임. 홀수 잔여는 보류.
function placePairs(g,list,primaryPool,fallbackPool,label,pending,holds,occ,floorOrder){
  const pairs=[]; let i=0;
  for(; i+1<list.length; i+=2) pairs.push([list[i], list[i+1]]);
  placeGivenPairs(g,pairs,primaryPool,fallbackPool,label,pending,holds,occ,floorOrder);
  if(i<list.length){
    if(AUTO_OPTS.allowSingle) placeSingles(g,[list[i]],primaryPool,fallbackPool,label,pending,holds,occ,floorOrder);
    else { const gc=teamGroupCode(g.event_seq)||(tx('teamPrefix')+evNo(g.event_seq)); holds.push(mkHold(tx('holdOddLeft',gc,list[i].name_kr||''),g,'oddLeft')); }
  }
}
// 미리 구성된 짝 배열을 받아 같은 층 묶기 + 방 배정(부족 시 fallbackPool로 강등).
//   floorOrder 가 있으면(야마나미 호텔동) 박수 규칙 허용 층만 우선순위대로 사용.
//   widePool(선택): primaryPool(허용 층 디럭스)도 소진됐을 때, 강등(fallbackPool) 전에
//     먼저 시도할 '룸레벨 동일·층 규칙 무시' 풀(전층 디럭스). 룸레벨이 층수보다 우선이므로
//     디럭스가 다른 층에 있으면 층을 옮겨서라도 디럭스를 주고, 전층에도 없을 때만 강등한다.
function placeGivenPairs(g,pairs,primaryPool,fallbackPool,label,pending,holds,occ,floorOrder,widePool){
  if(!pairs||!pairs.length) return;
  const gc=teamGroupCode(g.event_seq)||(tx('teamPrefix')+evNo(g.event_seq));
  let usePool=primaryPool;
  if(pairs.length>=2){
    const f=pickFloor(primaryPool,pairs.length,g.dep,g.arr,pending,occ,floorOrder);
    if(f!=null) usePool=primaryPool.filter(inv=>floorOf(inv)===f);   // 그 팀은 이 층으로 묶기
  }
  for(const pair of pairs){
    let inv=pickRoom(usePool,g.dep,g.arr,2,pending,occ);
    if(!inv && usePool!==primaryPool) inv=pickRoom(primaryPool,g.dep,g.arr,2,pending,occ); // 같은 층 소진 → 허용 층 전체
    if(!inv && widePool && widePool!==primaryPool) inv=pickRoom(widePool,g.dep,g.arr,2,pending,occ); // 허용 층에 디럭스 없음 → 층 이동(전층 디럭스 = 룸레벨 우선)
    if(!inv && fallbackPool && fallbackPool!==primaryPool)
      inv=pickRoom(fallbackPool,g.dep,g.arr,2,pending,occ);          // 전층에도 디럭스 없음 → 다음 룸레벨로 강등
    if(!inv){ holds.push(mkHold(tx('holdNoRoom',gc,pair[0].name_kr||'',pair[1].name_kr||'',label),g,'noRoom')); continue; }
    pending.push(mkRow(g,pair[0],inv));
    pending.push(mkRow(g,pair[1],inv));
  }
}

// ── 자동배정 완화 옵션(Min 2026-08) ──────────────────────────────────────────
//  보류 사유별 '추천 조치' 스위치.
//   splitOdd     : (예비) 3명 팀 분리 — 현재는 기본 동작이라 미사용
//   allowSingle  : 싱글 방이 다 찼을 때 2인실을 1명이 단독 사용 — **기본 켜짐**(Min 2026-08:
//                  "자동배정 한 번에 미배정 최소"). 방 낭비보다 미배정이 나쁘다.
//   singleRemark : 비고에 「싱글」이라 적힌 팀도 자동으로 짝지어 배정.
//                  **기본 꺼짐** — 누가 싱글인지 팀 단위 비고로는 특정할 수 없어
//                  강행하면 싱글 요청자를 둘씩 묶어버린다. 보류 후 수기가 맞다.
//  ※ 박수→층 규칙은 '우선순위'라 막지 않으므로 별도 옵션이 없다.
const AUTO_OPT_DEFAULT={splitOdd:true, allowSingle:true, singleRemark:false};
let AUTO_OPTS={...AUTO_OPT_DEFAULT};
// 1명을 방 하나에 단독 배정(정원 2 이상 방도 1명만 쓰게 둠).
function placeSingles(g,list,primaryPool,fallbackPool,label,pending,holds,occ,floorOrder){
  if(!list||!list.length) return;
  const gc=teamGroupCode(g.event_seq)||(tx('teamPrefix')+evNo(g.event_seq));
  for(const m of list){
    let inv=pickRoom(primaryPool,g.dep,g.arr,1,pending,occ);
    if(!inv && fallbackPool && fallbackPool!==primaryPool) inv=pickRoom(fallbackPool,g.dep,g.arr,1,pending,occ);
    if(!inv){ holds.push(mkHold(tx('holdNoRoom',gc,m.name_kr||'','',label),g,'noRoom')); continue; }
    pending.push(mkRow(g,m,inv));
  }
}

// 홀수로 남는 1명 = 싱글 방(정원 1)에 배정. 허용 층 → 전층 순. 싱글이 없으면 보류
//  (옵션 allowSingle 을 켜면 2인실을 1명이 단독 사용).  Min 2026-08 결정.
function placeLeftovers(g, route, leftovers, flr, pending, holds, occ, floorOrder, genPool){
  if(!leftovers||!leftovers.length) return;
  const gc=teamGroupCode(g.event_seq)||(tx('teamPrefix')+evNo(g.event_seq));
  const sgAll=roomPool({fac:route.fac, floorOnly:route.floorOnly, zone:route.zone, genTypes:SINGLE_TYPES},'general');
  const sg=floorOrder?poolByFloorOrder(sgAll,floorOrder):sgAll;
  for(const m of leftovers){
    let inv=pickRoom(sg,g.dep,g.arr,1,pending,occ);                       // 허용 층 싱글
    if(!inv) inv=pickRoom(sgAll,g.dep,g.arr,1,pending,occ);               // 전층 싱글(층 넘기 허용)
    if(!inv && AUTO_OPTS.allowSingle && genPool) inv=pickRoom(genPool,g.dep,g.arr,1,pending,occ); // 2인실 단독(옵션)
    if(!inv){ holds.push(mkHold(tx('holdOddLeft',gc,m.name_kr||''),g,'oddLeft')); continue; }
    pending.push(mkRow(g,m,inv));
  }
}

// 월을 열 때 자동배정을 돌릴지 — 끄면 수기 전용(Min 2026-08)
function autoRunOn(){ try{ return localStorage.getItem('saizen_room_autorun')!=='0'; }catch(e){ return true; } }
let _autoRunning=false;
async function autoAssign(){
  if(!supa){toast(tx('connectFirst'),'warn');return;}
  if(!state.guests||!state.guests.length){toast(tx('loadDateFirst'),'warn');return;}
  if(_autoRunning) return;
  _autoRunning=true;
  const btn=$('#btn-auto'); if(btn){ btn.disabled=true; btn.dataset.busy='1'; btn.textContent=tx('autoBtnBusy'); }
  try{
    // 0) 이동 추적용 — 재배치 '전' 각 인원의 방을 스냅샷(어디서→어디로 기록)
    const _beforeRoom={}; state.rooms.forEach(r=>{ if(r.member_id!=null && _beforeRoom[r.member_id]==null) _beforeRoom[r.member_id]={f:r.facility,no:r.room_no}; });
    const _autoBefore=state.rooms.filter(r=>r.assign_source==='auto').map(_roomSnap);  // 되돌리기용(재실행 전 auto 배정)
    // 1) 기존 auto 배정 제거(재실행=재정렬, 수기 배정 보호)
    const autoIds=state.rooms.filter(r=>r.assign_source==='auto').map(r=>r.id);
    if(autoIds.length){
      const error=await deleteRoomsByIds(autoIds);
      if(error){toast(tx('autoClearFail',error.message),'err');return;}
      state.rooms=state.rooms.filter(r=>r.assign_source!=='auto');
    }
    rebuildAssignMap();

    // ── DB 기준 점유원장: 배정 대상 팀들의 전체 체류 구간에 걸치는 '모든' 기존 배정(다른 달 포함) ──
    //   · 위에서 이번 auto는 이미 삭제됨 → 남은 건 수기·분할 + 다른 달 배정. 정원 체크의 권위 소스.
    let occ = state.rooms.slice();   // 폴백
    try{
      const teamsAll=[...state.guests];
      const deps=teamsAll.map(g=>g.dep).filter(Boolean), arrs=teamsAll.map(g=>g.arr).filter(Boolean);
      if(deps.length && arrs.length){
        const spanFrom=deps.reduce((a,b)=>a<b?a:b), spanTo=arrs.reduce((a,b)=>a>b?a:b);
        // overlaps(span): check_in < spanTo AND check_out > spanFrom
        const occRes=await pagedQuery(()=>supa.from('rooms').select('id,inventory_id,assigned_pax,check_in,check_out,assign_source,event_seq,member_id').lt('check_in',spanTo).gt('check_out',spanFrom).order('id'));
        if(!occRes.error) occ=occRes.data||[];
      }
    }catch(e){ console.warn('점유원장 로드 실패, state.rooms로 폴백:', e.message); }

    const manual=assignedMemberSet();  // 수기로 이미 배정된 사람(보호)
    let pending=[], holds=[];
    const teams=[...state.guests].sort((a,b)=>a.event_seq-b.event_seq); // 예약순(선착): 옛(이관)예약 ~98,219 < 신규 30M

    // ── 회원 우선 강화(Min): 회원 짝을 일반 짝보다 '먼저' 배정 → 디럭스 소진 후 스탠다드도
    //    늦게 예약한 회원이 먼저 예약한 일반보다 우선. ① 팀별 계획 수립 ② 회원 패스 ③ 일반 패스.
    //    (각 패스 내부는 예약순 event_seq 선착 유지.)
    const plans=[];
    for(const g of teams){
      const route=autoRoute(g);
      if(!route) continue;
      const gc=teamGroupCode(g.event_seq)||(tx('teamPrefix')+evNo(g.event_seq));
      const roster=teamRoster(g.event_seq).filter(m=>!manual.has(m.id));
      if(!roster.length){
        // 동행자 명단(guest_members)이 없으면 배정할 대상이 없다. 예전에는 조용히 건너뛰어
        // 미배정 목록에 영원히 남았다(간지호텔 등에서 관측). 이제 사유로 남긴다.(Min 2026-08)
        if((state.members[g.event_seq]||[]).length===0) holds.push(mkHold(tx('holdNoRoster',gc),g,'noRoster'));
        continue;
      }

      // 싱글 지정 팀(현지비고/비고에 '싱글')
      //  · 야마나미 호텔동: 누가 싱글인지 팀 단위 비고로는 특정 불가 + 룸타입이 여러 개라
      //    강행하면 싱글 요청자를 둘씩 묶어버린다 → 보류 후 수기(기존 Min 결정 유지).
      //  · 그 외 시설(간지호텔·쿠주힐즈·돔하우스): 룸타입이 트윈 한 종류뿐이고 1인 사용 요금이
      //    이미 붙는다 → **1인 1실로 배정**한다. 방이 비어 있는데 미배정으로 남기지 않는다(Min 2026-08).
      // 대기예약(구분=대기)은 확정 전이라 방을 잡지 않는다 — 방이 없어도 정상(Min 2026-08)
      if(String(g.status||'').includes('대기')){ holds.push(mkHold(tx('holdWait',gc),g,'wait')); continue; }
      const _wantSingle=/싱글|single|シングル/i.test((g.remark_local||'')+' '+(g.remark||''));
      let _singleEach=false;
      if(_wantSingle && !AUTO_OPTS.singleRemark){
        if(route.floorOnly){ holds.push(mkHold(tx('holdSingle',gc),g,'single')); continue; }   // 야마나미 호텔동만 보류
        _singleEach=true;                                                   // 나머지는 1인 1실
      }
      // ── 청소 효율 박수→층 규칙: 야마나미 호텔동(floorOnly) 팀만 허용 층으로 제한 ──
      //   허용 층이 없거나(규칙 외 박수+유동층 만석) 만석이면 hold(객실부족) → 수기 배정으로.
      let floorOrder=null;
      if(route.floorOnly){
        floorOrder=nightFloors(teamNights(g), occ, pending);
        if(!floorOrder.length) floorOrder=null;   // 규칙 층이 없으면 층 우선순위 없이(전층) 진행 — 보류하지 않음
      }
      plans.push({g,route,roster,floorOrder,gc,singleEach:_singleEach});
    }
    // ── 관내별장 예약 → 소보별장 우선 (Min 2026-08, 올해 한정) ─────────────
    //   소보별장 가용 = 2호·3호 트윈(2인) + 5호 4인 1동 → 하룻밤 최대 8명.
    //   ① 일반고객으로만 구성된 관내별장 팀 먼저  ② 없으면 회원 포함 관내별장 팀
    //   팀을 쪼개지 않는다 — 팀 전원이 들어갈 때만 소보로 보낸다(남으면 호텔로).
    //   ※ 디럭스가 남아 있으면 일반고객도 디럭스로 채운다 — 그건 일반 패스의 폴백이 처리한다.
    const soboPool=state.inventory.filter(r=>r.facility==='야마나미리조트' && (r.zone||'')==='소보별장' && r.active)
      .slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    // 아소별장(8인 1동)도 관내별장 예약을 받는다 — 소보로 다 안 들어가면 통째로 아소로(Min 2026-08)
    const asoPool=state.inventory.filter(r=>r.facility==='야마나미리조트' && (r.zone||'')==='아소별장' && r.active);
    function placeSobo(){
      if(!soboPool.length) return;
      const cand=plans.filter(pl=>pl.g.sale_type==='관내별장' && !pl.done && pl.roster.length);
      const pure=cand.filter(pl=>!pl.roster.some(isMember));       // ① 일반만
      const rest=cand.filter(pl=>pl.roster.some(isMember));        // ② 회원 포함
      [...pure,...rest].forEach(pl=>{
        const {g,roster,gc}=pl;
        const rooms=[], used=[];
        let left=roster.length;
        // 큰 방(4인 1동)부터 채워 팀을 최소 방수로 담는다
        const pool=soboPool.slice().sort((a,b)=>(b.max_capacity||b.capacity)-(a.max_capacity||a.capacity));
        for(const inv of pool){
          if(left<=0) break;
          if(used.includes(inv.id)) continue;
          const cap=inv.max_capacity||inv.capacity;
          const free=cap-dbUsedFor(inv,g.dep,g.arr,occ,pending);
          if(free<=0) continue;
          const take=Math.min(free,left);
          rooms.push({inv,take}); used.push(inv.id); left-=take;
        }
        if(left>0){
          // 소보로 다 못 담으면 아소별장 한 동에 통째로 시도(8인 1동)
          // 아소별장은 관내별장 예약이 **딱 8명**일 때만 자동 배정한다(Min 2026-08).
          const aso=(roster.length===8)
            ? asoPool.find(inv=>((inv.max_capacity||inv.capacity)-dbUsedFor(inv,g.dep,g.arr,occ,pending))>=8) : null;
          if(!aso) return;                                          // 둘 다 안 되면 호텔로
          roster.forEach(m=>pending.push(mkRow(g,m,aso)));
          pl.done=true; console.info(tx('soboNote',gc,roster.length));
          return;
        }
        let i=0;
        rooms.forEach(({inv,take})=>{ for(let k=0;k<take;k++){ pending.push(mkRow(g,roster[i++],inv)); } });
        pl.done=true;                                               // 이후 호텔 패스에서 제외
        console.info(tx('soboNote',gc,roster.length));
      });
    }
    // 방별 기간 점유(자동배정 내부용) — pending 반영
    function dbUsedFor(inv,dep,arr,occAll,pend){
      const rows=(occAll||[]).concat(pend||[]);
      return rows.filter(r=>r.inventory_id===inv.id && overlaps(dep,arr,r.check_in,r.check_out))
                 .reduce((n,r)=>n+(r.assigned_pax||1),0);
    }

    // 한 팀의 짝 배정. phase='member'|'general'. 회원/일반 짝은 disjoint → 이중배정 없음.
    const placePlan=(plan,phase)=>{
      if(plan.done) return;                     // 소보별장으로 이미 보낸 팀
      const {g,route,roster,floorOrder,gc,singleEach}=plan;
      const flr = floorOrder ? (p=>poolByFloorOrder(p,floorOrder)) : (p=>p); // 호텔동만 허용 층으로 필터·정렬
      // 싱글 지정(비호텔) — 짝을 짓지 않고 1인 1실. 남는 방이 없으면 아래 일반 배정으로 넘어간다.
      if(singleEach){
        if(phase!=='general') return;                    // 한 번만 처리
        const gp=flr(roomPool(route,'general'));
        placeSingles(g,roster,gp,gp,'single',pending,holds,occ,floorOrder);
        return;
      }
      if(route.deluxe){
        // A 규칙: 명단 순서대로 짝(1-2,3-4) → 짝에 회원이 1명이라도 있으면 디럭스, 없으면 예약종류.
        const dlx=flr(roomPool(route,'deluxe')), gp=flr(roomPool(route,'general'));
        const dlxAny=roomPool(route,'deluxe');   // 전층 디럭스(고층 우선) — 룸레벨 우선 폴백
        // 회원 강등 풀: 디럭스 전층 만실 → 스탠다드 트윈 먼저, 그다음 컴팩트트윈(타입 우선·전층).
        const MEM_DOWN=['트윈','컴팩트트윈'];
        const memDown=roomPool({fac:route.fac, floorOnly:route.floorOnly, zone:route.zone, genTypes:MEM_DOWN},'general')
          .slice().sort((a,b)=> (MEM_DOWN.indexOf(effType(a))-MEM_DOWN.indexOf(effType(b))) || (floorOf(b)-floorOf(a)) || ((a.sort_order||0)-(b.sort_order||0)));
        // ── 짝짓기 = 회원 우선(Min 2026-08) ────────────────────────────────
        //  이전: 명단 순서대로 1-2·3-4 → 짝에 회원이 하나라도 있으면 디럭스
        //        → 회원2+일반2 팀이 (회원,일반)×2가 되어 디럭스 2실을 쓰고 일반 2명이 디럭스에 들어갔다.
        //  현재: 회원끼리 먼저 묶어 디럭스(→일반은 디럭스에 안 들어감).
        //        회원이 홀수로 남을 때만 그 1명이 일반 1명과 디럭스를 같이 쓴다(회원3+일반1 → 디럭스 2실).
        //        동행 일반도 없이 회원 1명만 남으면 보류(수기).
        const mems=roster.filter(m=>isMember(m)), gens=roster.filter(m=>!isMember(m));
        const memberPairs=[], generalPairs=[], leftovers=[];
        let mi=0, gi=0;
        for(; mi+1<mems.length; mi+=2) memberPairs.push([mems[mi], mems[mi+1]]);
        if(mi<mems.length){                                  // 회원 홀수 → 1명 남음
          if(gens.length){ memberPairs.push([mems[mi], gens[0]]); gi=1; }   // 일반 1명과 디럭스 동실
          else leftovers.push(mems[mi]);
        }
        for(; gi+1<gens.length; gi+=2) generalPairs.push([gens[gi], gens[gi+1]]);
        if(gi<gens.length) leftovers.push(gens[gi]);
        if(phase==='member'){
          // 회원 짝: 허용 층 디럭스 → 전층 디럭스(층 이동) → 스탠다드 트윈→컴팩트 강등
          placeGivenPairs(g, memberPairs, dlx, memDown, tx('deluxe'), pending, holds, occ, floorOrder, dlxAny);
        }else{
          // gp 는 이미 '규칙 층 우선 + 나머지 층'으로 정렬된 전층 풀 → 만석이어도 다른 층으로 이어진다.
          // ★ 마지막 수단 = **회원 배정 후 남은 디럭스**(Min 2026-08).
          //   회원 패스가 먼저 끝난 뒤라 여기 남은 디럭스는 '회원이 다 쓰고 남은 방'이다.
          //   호텔 트윈·소형 트윈·관내별장은 전부 호텔 배정 팀이므로 예약 순서대로 끝까지 채운다 —
          //   디럭스를 비워둔 채 일반 팀을 미배정으로 남기지 않는다.
          placeGivenPairs(g, generalPairs, gp, dlxAny, tx('byReservation'), pending, holds, occ, floorOrder);
          if(leftovers.length) placeLeftovers(g, route, leftovers, flr, pending, holds, occ, floorOrder, gp.concat(dlxAny));
        }
      }else{
        // 비디럭스 시설(쿠주·간지·돔): 룸타입 없음 → 회원 포함 팀은 회원 패스, 순수 일반팀은 일반 패스(회원 우선 일관)
        if((phase==='member')===roster.some(isMember))
          placePairs(g, roster, flr(roomPool(route,'general')), null, route.fac, pending, holds, occ, floorOrder);
      }
    };
    placeSobo();                                          // ⓞ 관내별장 예약 → 소보별장 우선(올해 한정)
    for(const plan of plans) placePlan(plan,'member');    // ① 회원 짝 먼저(전 팀, 예약순)
    for(const plan of plans) placePlan(plan,'general');   // ② 일반 짝(전 팀, 예약순)

    // 객실 마스터에 호수(room_no)가 비어 있는 방이 있으면 insert 가 통째로 실패한다
    //   (null value in column "room_no" violates not-null constraint).
    //   그 방만 빼고 나머지는 정상 저장하고, 어떤 방인지 알려준다.(Min 2026-08)
    {
      const bad=pending.filter(r=>!r.room_no||r.member_id==null||r.inventory_id==null);
      if(bad.length){
        const ids=[...new Set(bad.map(r=>r.inventory_id))].join(', ');
        pending=pending.filter(r=>r.room_no&&r.member_id!=null&&r.inventory_id!=null);
        holds.push(mkHold(tx('badInv',bad.length,ids),null,'etc'));
        toast(tx('badInv',bad.length,ids),'warn');
        console.warn('배정 제외(호수 없음):',bad);
      }
    }
    if(!pending.length){ toast(tx('autoNoTarget',holds.length),'warn'); return; }
    const {data,error}=await insertRoomsChunked(pending);
    if(error){toast(tx('autoSaveFail',error.message),'err');return;}
    (data||[]).forEach(r=>state.rooms.push(r));
    rebuildAssignMap(); render();
    logAssign('자동배정', `${state.from||''}~${state.to||''} 자동배정 재실행 — ${pending.length}명 재배치${holds.length?` · 보류 ${holds.length}건`:''}`);
    // 개인별 이동(어디서→어디로) 기록 — 이전 방과 달라진 사람만(신규 배정·미변경 제외)
    const _moves=[];
    (data||[]).forEach(r=>{
      const b=_beforeRoom[r.member_id]; if(!b) return;                       // 이전 배정 없음(신규)
      if(b.no===r.room_no && b.f===r.facility) return;                       // 같은 방(안 바뀜)
      const m=r.member_id!=null?memberById(r.member_id):null;
      const nm=(m&&(m.name_kr||m.name_en))||'';
      const gc=teamGroupCode(r.event_seq)||evNo(r.event_seq)||'';
      _moves.push(`${nm}(${gc}) ${b.f||''} ${b.no} → ${r.facility||''} ${r.room_no}`);
    });
    if(_moves.length) logMoves(_moves);
    // 직전 1회 되돌리기: 현재 auto 배정을 지우고 재실행 전 auto 배정으로 복원
    setLastBulk(tx('btnAuto'), async()=>{
      const curAuto=state.rooms.filter(r=>r.assign_source==='auto').map(r=>r.id);
      if(curAuto.length){ const e=await deleteRoomsByIds(curAuto); if(e) throw new Error(e.message); state.rooms=state.rooms.filter(r=>r.assign_source!=='auto'); }
      const e2=await _reinsertRooms(_autoBefore); if(e2) throw new Error(e2.message);
    });
    toast(tx('autoDone',pending.length,holds.length), holds.length?'warn':'ok');
    state.lastHolds = holds.slice();
    updateHoldsBtn();
    // 사유 모달은 자동으로 띄우지 않는다 — 화면 들어올 때마다 팝업이 뜨면 방해된다(Min 2026-08).
    //   상단 「미배정 N건 사유」 버튼으로 필요할 때 연다.
    if(holds.length) console.warn(tx('autoHoldsLog',holds.length)+holds.map(holdLine).join('\n'));
  }finally{ _autoRunning=false; if(btn){ btn.disabled=false; btn.dataset.busy=''; } updateAutoBtnLabel(); }
}

// ════════════════════════════════════════════════════════════════
//  충돌 점검 — 정원 초과(같은 방·겹치는 날 > 정원) 스캔 + 해소
//   · 초과분은 'auto'만 제거(수기·분할 보호) → 미배정 복귀 후 자동배정 재실행으로 재배치
//   · auto로 못 푸는(수기/분할이 초과) 방은 '수기확인'으로 표시
// ════════════════════════════════════════════════════════════════
// 한 방의 행들에서 정원 초과를 없애기 위해 제거할 auto 행 계획(늦은 예약 우선 제거)
function planResolve(rowsIn, cap){
  const rows=rowsIn.map(r=>({...r,_dropped:false}));
  const drop=[];
  const nights=()=>{ const ds=new Set(); rows.forEach(r=>{ if(!r._dropped) ds.add(r.check_in); }); return [...ds]; };
  const used=d=>rows.filter(r=>!r._dropped && r.check_in<=d && d<r.check_out).reduce((s,r)=>s+(r.assigned_pax||0),0);
  let guard=0;
  while(guard++<500){
    let worstD=null, worstU=cap;
    nights().forEach(d=>{ const u=used(d); if(u>worstU){ worstU=u; worstD=d; } });
    if(worstD===null) break;                       // 모든 밤 정원 이하
    const cand=rows.filter(r=>!r._dropped && r.assign_source==='auto' && r.check_in<=worstD && worstD<r.check_out);
    if(!cand.length) break;                         // auto 없음 → 수기만 남음(stuck)
    cand.sort((a,b)=>(b.event_seq||0)-(a.event_seq||0));   // 늦은 예약(낮은 우선순위) 먼저 제거 = event_seq 큰 순(신규)
    cand[0]._dropped=true; drop.push(cand[0].id);
  }
  const stuck = nights().some(d=>used(d)>cap);
  return { drop, stuck };
}

async function checkConflicts(){
  if(!supa){ toast(tx('connectFirst'),'warn'); return; }
  if(!state.from){ toast(tx('loadDateFirst'),'warn'); return; }
  const btn=$('#btn-conflicts'); if(!btn) return;   // 버튼 제거됨(정원 초과는 DB 트리거가 애초에 막는다)
  btn.disabled=true; const old=btn.textContent; btn.textContent=tx('conflBtnBusy');
  try{
    // 로드된 달 범위에 걸치는 모든 배정(다른 달 팀 포함) 조회
    const res=await pagedQuery(()=>supa.from('rooms')
      .select('id,inventory_id,assigned_pax,check_in,check_out,assign_source,event_seq,member_id,room_no')
      .lte('check_in', state.to).gt('check_out', state.from).order('inventory_id'));
    if(res.error){ toast(tx('conflFail',res.error.message),'err'); return; }
    const byInv={}; (res.data||[]).forEach(r=>{ (byInv[r.inventory_id]=byInv[r.inventory_id]||[]).push(r); });
    const conflicts=[];
    for(const invId in byInv){
      const inv=state.inventory.find(i=>String(i.id)===String(invId));
      const cap=inv?(inv.max_capacity||inv.capacity):2;
      const rr=byInv[invId];
      const dates=new Set(); rr.forEach(r=>dates.add(r.check_in));
      let worst=0, worstDate=null;
      dates.forEach(d=>{ const u=rr.filter(r=>r.check_in<=d && d<r.check_out).reduce((s,r)=>s+(r.assigned_pax||0),0); if(u>worst){ worst=u; worstDate=d; } });
      if(worst>cap){ conflicts.push({ inv, invId, cap, rows:rr, worst, worstDate, plan:planResolve(rr,cap) }); }
    }
    openConflictModal(conflicts);
  }catch(e){ toast(tx('conflErr',e.message),'err'); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

function closeConflictModal(){ const m=$('#conflict-modal'); if(m) m.remove(); }
function openConflictModal(conflicts){
  closeConflictModal();
  if(!conflicts.length){ toast(tx('conflNone'),'ok'); return; }
  const dropTotal=conflicts.reduce((s,c)=>s+c.plan.drop.length,0);
  const stuckCnt=conflicts.filter(c=>c.plan.stuck).length;
  const list=conflicts.map(c=>{
    const inv=c.inv||{};
    const rno=inv.room_no||c.rows[0].room_no||c.invId;
    const fac=inv.facility||'';
    const srcCnt=c.rows.reduce((o,r)=>{ o[r.assign_source||'?']=(o[r.assign_source||'?']||0)+(r.assigned_pax||0); return o; },{});
    const srcTxt=Object.entries(srcCnt).map(([k,v])=>`${k==='auto'?tx('srcAuto'):k==='manual'?tx('srcManual'):k} ${v}`).join(' · ');
    return `<div style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;background:${c.plan.stuck?'#fbf3e2':'#fdf1f0'}">
      <div style="font-weight:800;font-size:13px">${fac} ${rno} <span style="color:var(--err);font-family:var(--mono)">${c.worst}/${c.cap}</span> <span style="font-size:11px;color:var(--muted)">${tx('conflWorstAt',c.worstDate)}</span></div>
      <div style="font-size:11.5px;color:var(--text2);margin-top:2px">${srcTxt}</div>
      <div style="font-size:11.5px;margin-top:3px">${c.plan.stuck
        ? `<span style="color:var(--warn);font-weight:700">${tx('conflStuck')}</span>`
        : `<span style="color:var(--accent2);font-weight:700">${tx('conflAutoOk',c.plan.drop.length)}</span>`}</div>
    </div>`;
  }).join('');
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='conflict-modal';
  bg.innerHTML=`<div class="modal" style="max-width:560px">
    <h2>${tx('conflModalTitle',conflicts.length)}</h2>
    <div class="mbody">
      <p style="font-size:12.5px;color:var(--text2);margin-bottom:12px">${tx('conflModalDesc',dropTotal,stuckCnt)}</p>
      ${list}
    </div>
    <div class="mfoot">
      <button class="btn ghost sm" type="button" id="cf-close">${tx('close')}</button>
      <button class="btn sm" type="button" id="cf-resolve" ${dropTotal?'':'disabled'} style="background:var(--err);border-color:var(--err)">${tx('conflResolveBtn',dropTotal)}</button>
    </div>
  </div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeConflictModal(); });
  document.body.appendChild(bg);
  $('#cf-close').addEventListener('click', closeConflictModal);
  $('#cf-resolve').addEventListener('click', ()=>resolveConflicts(conflicts));
}

async function resolveConflicts(conflicts){
  const allDrop=[]; conflicts.forEach(c=>allDrop.push(...c.plan.drop));
  const stuckCnt=conflicts.filter(c=>c.plan.stuck).length;
  if(!allDrop.length){ toast(tx('resolveNoAuto',stuckCnt),'warn'); return; }
  const btn=$('#cf-resolve'); if(btn){ btn.disabled=true; btn.textContent=tx('resolveBusy'); }
  const err=await deleteRoomsByIds(allDrop);
  if(err){ toast(tx('resolveFail',err.message),'err'); return; }
  const ds=new Set(allDrop.map(String));
  state.rooms=state.rooms.filter(r=>!ds.has(String(r.id)));
  rebuildAssignMap(); render();
  closeConflictModal();
  toast(tx('resolveDone',allDrop.length,stuckCnt), stuckCnt?'warn':'ok');
}

// ── rooms 대량 삭제/삽입은 청크로 (in() URL 길이·body 한계 회피) ──
async function deleteRoomsByIds(ids){
  for(let i=0;i<ids.length;i+=50){
    const {error}=await supa.from('rooms').delete().in('id',ids.slice(i,i+50));
    if(error) return error;
  }
  return null;
}
async function insertRoomsChunked(rows){
  const out=[];
  for(let i=0;i<rows.length;i+=200){
    const {data,error}=await supa.from('rooms').insert(rows.slice(i,i+200)).select();
    if(error) return {error};
    if(data) out.push(...data);
  }
  return {data:out};
}

// ── 층(zone) 전체 배정 해제 ──
async function clearZone(fac,zone){
  const zoneInvIds=new Set(state.inventory.filter(r=>r.facility===fac && (r.zone||fac)===zone).map(r=>r.id));
  const targets=state.rooms.filter(r=>zoneInvIds.has(r.inventory_id));
  if(!targets.length){toast(tx('zoneNoAssign',zone),'warn');return;}
  if(!confirm(tx('zoneClearConfirm',zone,targets.length))) return;
  const snap=targets.map(_roomSnap);   // 되돌리기용(삭제 전 스냅샷)
  const ids=targets.map(r=>r.id);
  const error=await deleteRoomsByIds(ids);
  if(error){toast(tx('zoneClearFail',error.message),'err');return;}
  state.rooms=state.rooms.filter(r=>!ids.includes(r.id));
  setLastBulk(`${fac} ${zone}`, async()=>{ const e=await _reinsertRooms(snap); if(e) throw new Error(e.message); });
  rebuildAssignMap(); render();
  toast(tx('zoneCleared',zone,ids.length),'ok');
}

async function unassign(roomId, opts){
  opts=opts||{};

  const snap=_roomSnap(row);
  const {error}=await supa.from('rooms').delete().eq('id',roomId);
  if(error){toast(tx('cancelFail',error.message),'err');return null;}
  if(row){ const _mm=memberById(row.member_id); logAssign('해제', `${row.facility||''} ${row.room_no} ✕ ${(_mm&&(_mm.name_kr||_mm.name_en))||''}(${teamGroupCode(row.event_seq)||evNo(row.event_seq)||''})`, { undo:'reassign', room:{ inventory_id:row.inventory_id, event_seq:row.event_seq, member_id:row.member_id, check_in:row.check_in, check_out:row.check_out, assigned_pax:row.assigned_pax, assign_source:row.assign_source } }); }
  // 연동 추가요금 정리(같은 팀·해당 객실 설명 매칭)
  if(row){
    const inv=invById(row.inventory_id);
    if(inv && FEE_SINGLE[inv.facility] && row.assigned_pax===1){
      await supa.from('transactions').delete()
        .eq('event_seq',row.event_seq).eq('category','single_charge')
        .like('description',`%${inv.room_no}%`);
    }
    if(inv && inv.facility==='시즈노야도 료칸' && inv.zone==='별채'){
      await supa.from('transactions').delete()
        .eq('event_seq',row.event_seq).eq('category','byeolche_charge')
        .like('description',`%${inv.room_no}%`);
    }
  }
  state.rooms=state.rooms.filter(r=>r.id!==roomId);
  if(opts.silent) return snap;     // 일괄 호출(unassignMember)에서 모아서 처리
  rebuildAssignMap(); render();
  if(snap) toastUndo(tx('assignCancelled'), ()=>restoreRooms([snap])); else toast(tx('assignCancelled'),'ok');
  return snap;
}

    </div>
  </div>`;

async function saveHotelRooms(bg,types,cur){
  const toInsert=[];
  let order=0;
  for(const t of types){
    const want=parseInt(bg.querySelector(`input[data-type="${t.key}"]`).value,10)||0;
    const have=cur[t.key]||0;
    if(want>have){
      for(let i=have+1;i<=want;i++){
        toInsert.push({
          facility:'야마나미리조트', zone:'호텔동',
          room_no:`${t.label} ${i}`, room_type:t.key,
          capacity:t.cap, max_capacity:t.cap, active:true, sort_order:order++
        });
      }
    } else if(want<have){
      toast(tx('hrShrinkWarn',tx(t.labelKey)),'warn');
    }
  }
  if(!toInsert.length){toast(tx('hrNoAdd'),'warn');bg.remove();return;}
  const {error}=await supa.from('room_inventory').upsert(toInsert,{onConflict:'facility,room_no'});
  if(error){toast(tx('hrSaveFail',error.message),'err');return;}
  await loadInventory();
  bg.remove(); render();
  toast(tx('hrRegistered',toInsert.length),'ok');
}

function _curUser(){ try{ return (window.__so_getUser&&__so_getUser())||''; }catch(e){ return ''; } }
// 방배정 변경이력 — change_log(entity='room_assign') 재사용. 자동배정=요약 1건, 수기=개별.
async function logAssign(action, label, data){
  if(!supa) return;
  try{ await supa.from('change_log').insert({ entity:'room_assign', action, label:String(label||'').slice(0,300), changes:data||null, changed_by:_curUser() }); }
  catch(e){ /* 이력 실패는 무시 */ }
}
// 이력 [↩ 되돌리기] — 해제 항목만(가장 안전: 그 사람을 원래 방·기간으로 재삽입, 정원 트리거가 충돌 검증).
let _histChanges={};
async function revertUnassign(id){
  if(!supa) return;
  const ch=_histChanges[id]; const rm=ch&&ch.room; if(!rm){ return; }
  // 가드: 그 사람이 이미 그 기간에 배정돼 있으면 중복 방지
  if(state.rooms.some(x=>x.member_id===rm.member_id && x.check_in<rm.check_out && x.check_out>rm.check_in)){ toast(tx('histUndoExists'),'warn'); return; }
  const {data,error}=await supa.from('rooms').insert({
    inventory_id:rm.inventory_id, event_seq:rm.event_seq, member_id:rm.member_id,
    check_in:rm.check_in, check_out:rm.check_out, assigned_pax:rm.assigned_pax||1, assign_source:rm.assign_source||'manual'
  }).select().single();
  if(error){ toast(tx('histUndoConflict',error.message),'err'); return; }   // 정원 트리거 등 거부 → 안내(잘못된 상태 안 생김)
  state.rooms.push(data); rebuildAssignMap(); render();
  const mm=memberById(rm.member_id); const inv=invById(rm.inventory_id);
  logAssign('배정', `${(inv&&inv.facility)||''} ${(inv&&inv.room_no)||''} ↩ ${(mm&&(mm.name_kr||mm.name_en))||''}${tx('histUndoTag')}`);
  toast(tx('histUndoDone'),'ok'); loadHist(true);
}

//  방은 이미 미배정이라 복원 대상 없음(actual_dep만 해제). 방은 사용자가 별도 재배정.
async function cancelEcoByMember(mid){
  if(!supa) return;

  if(!confirm(tx('ecoUnassignedConfirm', m.name_kr||'', m.actual_dep))) return;

// 변경이력 조회 — 40건씩 페이지네이션, label ilike 검색. 데이터 부담 없이 전체 열람 가능.
const HIST_PAGE=40;
let _histOff=0, _histQ='', _histLoading=false;
const HIST_ICON={ '배정':'🛏', '해제':'✕', '분할':'✂', '자동배정':'🪄', '이동':'↪️', '충돌정리':'🧹' };
// 저장값(change_log.action = 한글)은 불변 — 화면 표시만 언어별로 매핑.
const HIST_ACT_KEY={ '배정':'actAssign', '해제':'actUnassign', '분할':'actSplit', '자동배정':'actAuto', '이동':'actMove', '충돌정리':'actResolve' };
function histActionLabel(a){ const k=HIST_ACT_KEY[a]; return k?tx(k):(a||''); }
async function loadHist(reset){
  if(!supa){ $('#hist-list').innerHTML=`<div class="empty-hint" style="padding:14px">${tx('histConnectFirst')}</div>`; return; }
  if(_histLoading) return; _histLoading=true;
  if(reset){ _histOff=0; _histChanges={}; $('#hist-list').innerHTML=`<div class="empty-hint" style="padding:14px">${tx('histLoading')}</div>`; }
  try{
    let q=supa.from('change_log').select('id,action,label,changed_by,changed_at,changes',{count:'exact'})
      .eq('entity','room_assign').order('changed_at',{ascending:false})
      .range(_histOff,_histOff+HIST_PAGE-1);
    if(_histQ) q=q.ilike('label','%'+_histQ+'%');

    if(error) throw error;
    const rows=data||[];
    const html=rows.map(r=>{
      const ic=HIST_ICON[r.action]||'•';
      const when=(r.changed_at||'').replace('T',' ').slice(5,16);
      const who=r.changed_by?` · <span style="color:var(--text2)">${_lsEsc(r.changed_by)}</span>`:'';
      const canUndo = r.action==='해제' && r.changes && r.changes.undo==='reassign';
      if(canUndo) _histChanges[r.id]=r.changes;
      const undoBtn = canUndo?`<button class="hist-undo" data-id="${r.id}" title="${tx('histUndoT')}" style="flex:none;font-size:11px;font-weight:700;color:var(--accent);background:none;border:1px solid var(--border2);border-radius:99px;padding:1px 8px;cursor:pointer">${tx('histUndoBtn')}</button>`:'';

        <span style="flex:0 0 86px;font-family:var(--mono);color:var(--muted)">${when}</span>
        <span style="flex:0 0 60px;font-weight:600">${_lsEsc(histActionLabel(r.action))}</span>
        <span style="flex:1;min-width:0">${_lsEsc(r.label)}${who}</span>

    }).join('');
    if(reset) $('#hist-list').innerHTML = html||`<div class="empty-hint" style="padding:14px">${tx('histNone')}</div>`;
    else $('#hist-list').insertAdjacentHTML('beforeend', html);
    _histOff+=rows.length;
    $('#hist-cnt').textContent = (count!=null)?tx('histTotal',count,!!_histQ):'';
    $('#hist-more').style.display = (count!=null && _histOff<count)?'':'none';
  }catch(e){
    $('#hist-list').innerHTML=`<div class="empty-hint" style="padding:14px">${tx('histQueryFail',_lsEsc(e.message||e))}</div>`;
  }finally{ _histLoading=false; }
}
function _histSearch(){ _histQ=($('#hist-q').value||'').trim(); loadHist(true); }
(function bindHist(){

// 카드 자물쇠(영구 잠금) 해제 — 모달 목록에서 바로. active=true 로 되돌리고 목록 갱신.
async function unlockInv(invId){
  const inv=(state.inventory||[]).find(r=>r.id===invId); if(!inv) return;
  const {error}=await supa.from('room_inventory').update({active:true}).eq('id',invId);
  if(error){toast(tx('invActiveToggleFail',error.message),'err');return;}
  inv.active=true; render();
  toast(`${inv.room_no} → ${tx('roomNowUsable')}`,'ok');
  const bg=document.querySelector('.modal-bg'); if(bg)bg.remove(); openClosureModal();
}
async function saveClosure(bg){
  const inv=bg.querySelector('#cl-inv').value;
  const from=bg.querySelector('#cl-from').value, to=bg.querySelector('#cl-to').value;
  const reason=bg.querySelector('#cl-reason').value.trim();
  if(!inv){toast(tx('pickRoom'),'warn');return;}
  if(!from||!to){toast(tx('pickRange'),'warn');return;}
  if(to<from){toast(tx('toAfterFrom'),'warn');return;}
  const btn=bg.querySelector('#cl-add'); btn.disabled=true; btn.textContent=tx('closureAdding');
  try{
    const {error}=await supa.from('room_closures').insert({inventory_id:inv,from_date:from,to_date:to,reason:reason||null,created_by:_curUser()});
    if(error) throw error;
    bg.remove(); toast(tx('closureAdded'),'ok'); await loadDay(); openClosureModal();
  }catch(e){ toast(tx('closureAddFail',(e.message||e)),'err'); btn.disabled=false; btn.textContent=tx('closureAdd'); }
}
async function delClosure(id){
  try{ const {error}=await supa.from('room_closures').delete().eq('id',id); if(error) throw error;
    toast(tx('closureReleased'),'ok'); const bg=document.querySelector('.modal-bg'); if(bg)bg.remove(); await loadDay(); openClosureModal();
  }catch(e){ toast(tx('closureReleaseFail',(e.message||e)),'err'); }
}

// 공유 HTML 이스케이프(객실 폐쇄 모달 등에서 사용)
function _lsEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* ── 현지예약 추가 기능 제거(2026-06): 현지예약은 엠클릭에 입력→step1으로 일원화(월 동기화 오삭제 방지) ── */



// ════════════════════════════════════════════════════════════════════════
//  엑셀 일괄 배정 (내보내기 / 업로드)
//  양식: eventSeq | 태그코드 | 대표자 | 인원 | 시설 | 호수
//   · 현재 점유 팀을 내보내면 호수만 비어서 나옴 → 채워서 다시 올리면 일괄 배정
//   · 매칭: eventSeq(1순위) → 객실은 시설+호수
// ════════════════════════════════════════════════════════════════════════
function exportAssignXlsx(){
  if(!state.guests||!state.guests.length){toast(tx('exportNoData'),'warn');return;}
  // 사람 1행씩 (v13.4 宿泊配置表 형태). member_id 로 배정 호수 매핑.
  const roomByMember={};
  state.rooms.forEach(r=>{ if(r.member_id!=null) (roomByMember[r.member_id]=roomByMember[r.member_id]||[]).push(r.room_no); });
  const rows=[];
  state.guests.forEach(g=>{
    teamRoster(g.event_seq).forEach(m=>{
      rows.push({
        행사번호:evNo(g.event_seq),
        태그코드:m.tag||'',
        대표자:g.rep||'',
        성명:m.name_kr||'',
        영문명:m.name_en||'',
        시설:g.accom||'',
        호수:(roomByMember[m.id]||[]).join(', ')
      });
    });
  });
  const ws=XLSX.utils.json_to_sheet(rows,{header:['행사번호','태그코드','대표자','성명','영문명','시설','호수']});
  ws['!cols']=[{wch:10},{wch:12},{wch:10},{wch:10},{wch:16},{wch:16},{wch:16}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'방배정');
  const label=(state.from||'')+(state.to&&state.to!==state.from?'_'+state.to:'');
  XLSX.writeFile(wb,`방배정양식_${label||'export'}.xlsx`);
  toast(tx('exportDone'),'ok');
}

async function importAssignXlsx(file){
  if(!supa){toast(tx('connectFirst'),'warn');return;}
  if(!state.guests||!state.guests.length){toast(tx('loadDateFirst'),'warn');return;}
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  // 호수 → inventory 매핑 (시설+호수, 또는 호수만)
  const invByRoom={};
  state.inventory.forEach(i=>{
    invByRoom[(i.facility+'|'+i.room_no)]=i;
    invByRoom[i.room_no]=i; // 호수만으로도 (중복 거의 없음)
  });
  // 태그코드 → member 매핑 (개인 단위)
  const memberByTag={};
  state.guests.forEach(g=>{ teamRoster(g.event_seq).forEach(m=>{ if(m.tag) memberByTag[m.tag]=m; }); });
  const doneSet=assignedMemberSet();
  let ok=0,skip=0,fail=0; const msgs=[];
  for(const row of rows){
    const tag=String(row['태그코드']||'').trim();
    const roomStr=String(row['호수']||'').trim();
    if(!tag||!roomStr){skip++;continue;}
    const m=memberByTag[tag];
    if(!m){fail++; msgs.push(tx('importTagNotFound',tag)); continue;}
    if(doneSet.has(m.id)){skip++;continue;} // 이미 배정됨
    const rn=roomStr.split(/[,，]/)[0].trim(); // 한 사람은 한 방
    const fac=String(row['시설']||'').trim();
    const inv=invByRoom[fac+'|'+rn]||invByRoom[rn];
    if(!inv){fail++; msgs.push(tx('importRoomNotFound',tag,rn)); continue;}
    await assignMembers([m.id], inv);
    doneSet.add(m.id);
    ok++;
  }
  toast(tx('importResult',ok,skip,fail), fail?'warn':'ok');
  if(msgs.length) console.warn(msgs.join('\n'));
}

      }).join('');
}

// 고정 컨트롤 바 높이 동기화 — topbar 높이로 ctrlbar top을 맞추고, (topbar+ctrlbar) 높이를
//   --stick2 로 내려 좌측 패널이 그 아래에 붙게. 스크롤 핸들러 없이 ResizeObserver만(랙 없음).
(function(){
  const tb=document.querySelector('.topbar'), cb=document.getElementById('ctrlbar');
  if(!tb||!cb) return;
  function sync(){
    const tbh=tb.offsetHeight||56;
    cb.style.top=tbh+'px';
    document.documentElement.style.setProperty('--stick2',(tbh+cb.offsetHeight+6)+'px');
  }
  sync();
  if(window.ResizeObserver){ const ro=new ResizeObserver(sync); ro.observe(tb); ro.observe(cb); }
  window.addEventListener('resize',sync);
})();

// ── 배정 검색 — 태그코드·한글명·영문명·행사번호로 '배정된 사람'을 찾아 위치 표시 + 점프 ──
(function(){
  const inp=document.getElementById('room-search'); if(!inp) return;
  const box=document.getElementById('room-search-results'), cnt=document.getElementById('room-search-cnt');
  let timer=null;
  function run(){
    const q=(inp.value||'').trim().toLowerCase();
    if(!q){ box.classList.remove('on'); box.innerHTML=''; cnt.textContent=''; return; }
    const hits=[];
    (state.rooms||[]).forEach(r=>{
      const m=r.member_id!=null?memberById(r.member_id):null;
      const nameKr=(m&&m.name_kr)||'', nameEn=(m&&m.name_en)||'';
      const tag=m?personTag(r.event_seq, m.seq_in_team||1):'';
      const gcode=teamGroupCode(r.event_seq)||'';
      const eno=String(evNo(r.event_seq)||'');
      if((nameKr+' '+nameEn+' '+tag+' '+gcode+' '+eno).toLowerCase().indexOf(q)>=0)
        hits.push({r,nameKr,nameEn,tag,gcode,eno});
    });
    hits.sort((a,b)=>String(a.r.check_in||'').localeCompare(String(b.r.check_in||''))
      || String(a.r.facility||'').localeCompare(String(b.r.facility||''))
      || String(a.r.room_no||'').localeCompare(String(b.r.room_no||'')));
    // 미배정 인원도 검색 — state.members(전체 명단) 중 방이 없는 사람
    const assigned=new Set((state.rooms||[]).map(r=>r.member_id));
    const unhits=[];
    Object.keys(state.members||{}).forEach(seq=>{
      const g=(state.guests||[]).find(x=>String(x.event_seq)===String(seq)); const dep=(g&&g.dep)||'';
      (state.members[seq]||[]).forEach(m=>{
        if(assigned.has(m.id)) return;
        const nameKr=m.name_kr||'', nameEn=m.name_en||'';
        const tag=personTag(Number(seq), m.seq_in_team||1)||'';
        const gcode=teamGroupCode(Number(seq))||''; const eno=String(evNo(Number(seq))||'');
        if((nameKr+' '+nameEn+' '+tag+' '+gcode+' '+eno).toLowerCase().indexOf(q)>=0)
          unhits.push({nameKr,nameEn,tag,gcode,eno,dep,eco:m.actual_dep||''});
      });
    });
    unhits.sort((a,b)=>String(a.dep).localeCompare(String(b.dep))||String(a.nameKr).localeCompare(String(b.nameKr)));
    const total=hits.length+unhits.length;
    cnt.textContent = total ? `${total}건${total>40?' · 40건씩 표시':''}` : '결과 없음';
    const aHtml=hits.slice(0,40).map(h=>{ const r=h.r;
      return `<div class="rs-item" data-inv="${r.inventory_id}" data-date="${r.check_in||''}">
        <b>${_lsEsc(h.nameKr||h.gcode||'-')}</b>${h.nameEn?`<span class="rs-en">${_lsEsc(h.nameEn)}</span>`:''}
        <span class="rs-tag">${_lsEsc(h.tag||h.gcode)}</span>${h.eno?`<span class="rs-eno">#${_lsEsc(h.eno)}</span>`:''}
        <span class="rs-loc">→ ${_lsEsc(r.facility||'')} ${_lsEsc(r.room_no||'')} · ${fmtMD(r.check_in)}~${fmtMD(r.check_out)}</span>
      </div>`; }).join('');
    const uHtml=unhits.slice(0,40).map(h=>
      `<div class="rs-item" data-date="${h.dep}" data-uns="1">
        <b>${_lsEsc(h.nameKr||h.gcode||'-')}</b>${h.nameEn?`<span class="rs-en">${_lsEsc(h.nameEn)}</span>`:''}
        <span class="rs-tag">${_lsEsc(h.tag||h.gcode)}</span>${h.eno?`<span class="rs-eno">#${_lsEsc(h.eno)}</span>`:''}
        <span class="rs-loc" style="color:#9a6b00">⚠ 미배정${h.eco?` · 🛫${fmtMD(h.eco)}`:''} · ${fmtMD(h.dep)} 도착</span>
      </div>`).join('');
    box.innerHTML = (aHtml+uHtml) || '<div class="rs-empty">일치하는 사람이 없습니다.</div>';
    box.classList.add('on');
  }
  inp.addEventListener('input',()=>{ clearTimeout(timer); timer=setTimeout(run,120); });
  inp.addEventListener('focus',()=>{ if(inp.value.trim()) run(); });
  box.addEventListener('click',e=>{
    const it=e.target.closest('.rs-item'); if(!it) return;
    const invId=it.dataset.inv; let date=it.dataset.date||state.from;
    if(state.from && date<state.from) date=state.from;
    if(state.to && date>state.to) date=state.to;
    state.focus=date;
    if(viewMode==='timeline') setView('card'); else render();   // 카드·표 보기에서 방으로 점프
    box.classList.remove('on');
    setTimeout(()=>{
      const el=document.querySelector('.room[data-inv-id="'+invId+'"]');
      if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('rs-flash'); setTimeout(()=>el.classList.remove('rs-flash'),1900); }
    },90);
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.rsearch')) box.classList.remove('on'); });
})();
</script>
