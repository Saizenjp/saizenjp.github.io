// ── 숙소(장소) 다중 필터 (Min 2026-08 정리) ──
//   · 「골프텔」 → 「호텔」 로 명칭 변경.
//   · 「관내별장」 칩 폐지 — 상품명이 야마나미 호텔 트윈·소형 트윈·관내별장 야마나미CC 골프투어면
//     전부 *호텔 배정 팀*이다. 별장은 호텔 배정을 마친 뒤 옮기는 것이라 예약 단계 구분이 아니다.
//   · 소보 5호(4인 1동)는 성격이 달라 「소보5동」으로 분리.
//   ⚠ 목록·판정은 saizen-core(SZCore)가 단일 진실원 — 객실 청소 화면도 같은 기준을 쓴다.
const PLACE_ITEMS=SZCore.PLACE_ITEMS;
const PLACE_COLOR={호텔:'y',소보별장:'y',소보5동:'y',아소별장:'y',돔하우스:'y',쿠주힐즈:'k',간지호텔:'g',시즈노야도:'s'};
// 외부 호텔(오프사이트) — 「전체」에는 포함 안 함(칩을 직접 눌러야 표시). 야마나미 리조트 복합만 전체.
const OFFSITE_PLACES=new Set(SZCore.OFFSITE_PLACES);
function _placeInScope(keys, sel){ return SZCore.placeInScope(keys, sel); }
// 숙소 토글은 **하나**다(Min 2026-08). 상단 하나로 미배정 목록·날짜 칩·객실 목록이 함께 움직인다.
//   placeSel(객실) 과 teamSel(미배정 팀) 은 같은 Set 을 가리킨다 — 둘로 나뉘어 있으면 화면이 어긋난다.
const teamSel=new Set();
const placeSel=teamSel;
function roomPlaceKeys(r){ return SZCore.roomPlaceKeys(r); }
function roomMatch(r){ return _placeInScope(roomPlaceKeys(r), placeSel) && typeMatch(r); }   // 전체=오프사이트 제외
// ── 방 타입 토글 (Min 2026-08: "숙소별 타입별로 보기 — 그 방들만 모아서") ──
//   숙소 토글로 좁힌 범위 안에 실제 존재하는 타입만 칩으로 낸다. 타입이 하나뿐이면 바를 숨긴다.
//   ⚠ 보기 전용 필터 — 자동배정·정원판정·배정 피커(위저드)는 이 필터를 보지 않는다.
const typeSel=new Set();
function typeKeyOf(r){ return r.room_type||''; }
function typeMatch(r){ return typeSel.size===0 || typeSel.has(typeKeyOf(r)); }
function buildTypeBar(){
  const box=$('#type-filter'); if(!box) return;
  // 타입 후보 = 숙소 토글까지만 적용한 범위(타입 선택 자신은 빼야 칩이 사라지지 않는다)
  const scope=(state.inventory||[]).filter(r=>_placeInScope(roomPlaceKeys(r), placeSel));
  const cnt={}; scope.forEach(r=>{ const k=typeKeyOf(r); cnt[k]=(cnt[k]||0)+1; });
  const keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  [...typeSel].forEach(k=>{ if(!cnt[k]) typeSel.delete(k); });   // 범위 밖 선택은 자동 해제(빈 화면 방지)
  if(keys.length<=1){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='flex';
  box.innerHTML=`<span class="tylbl">${tx('tyLbl')}</span>`
    +`<button class="ffbtn${typeSel.size===0?' active':''}" data-ty="전체" type="button">${tx('tyAll')}</button>`
    +keys.map(k=>`<button class="ffbtn${typeSel.has(k)?' active':''}" data-ty="${esc(k)}" type="button">`
        +`${esc(TYPE_KO[k]||k||'-')}<span class="tyn">${cnt[k]}</span></button>`).join('');
}
function teamPlaceKeys(g){
  const st=g.sale_type, ac=g.accom;
  if(ac==='야마나미리조트'){
    if(st==='돔하우스') return ['돔하우스'];
    // 호텔 트윈·소형트윈·관내별장 = 전부 호텔 배정 팀(Min 2026-08).
    // 별장 이동 후보면 그 칩에서도 보이게 키를 하나 더 붙인다.
    const k=['호텔'];
    if(asoEligible(g)) k.push('아소별장');
    return k;
  }
  if(ac==='쿠주힐즈')        return ['쿠주힐즈'];
  if(ac==='간지호텔')        return ['간지호텔'];
  if(ac==='시즈노야도 료칸') return ['시즈노야도'];
  return [];
}
function teamMatch(g){ return _placeInScope(teamPlaceKeys(g), teamSel); }   // 전체=오프사이트 제외

// ── 아소별장(8인 1동) 이동 후보 ─────────────────────────────────────────
//   Min 2026-08: 1차로 전원 호텔에 배정한 뒤, *팀 묶음* 이거나 *한 팀 8명* 인 예약을
//   아소별장으로 옮긴다. 자동배정은 하지 않고 후보만 띄운다(현장이 고른다).
//   추천은 *딱 8명* 만(Min 2026-08). 5~7명도 물리적으로는 들어가지만 자동 추천하지 않는다
//   — 필요하면 현장에서 수기로 옮긴다.
const ASO_CAP=8, ASO_MIN=8;
// 묶음 = 手配書 팀 묶기(print_overrides.team_group). 같은 묶음이면 한 동에 같이 들어간다.
function teamGroupKey(seq){ return (state.tgroup||{})[seq]||null; }
function asoPartners(g){
  const k=teamGroupKey(g.event_seq);
  if(!k) return [g];
  return state.guests.filter(x=>teamGroupKey(x.event_seq)===k);
}
function asoPax(g){ return asoPartners(g).reduce((s,x)=>s+(+x.pax||0),0); }
function asoEligible(g){
  if(g.accom!=='야마나미리조트') return false;
  if(g.sale_type==='돔하우스') return false;
  const p=asoPax(g);
  return p>=ASO_MIN && p<=ASO_CAP;
}
// 묶음 대표(가장 빠른 예약번호) 하나만 후보 목록에 띄운다
function asoIsLead(g){
  const ps=asoPartners(g);
  return ps.length<2 || ps.slice().sort((a,b)=>a.event_seq-b.event_seq)[0].event_seq===g.event_seq;
}
function asoInventory(){ return state.inventory.filter(i=>(i.zone||'')==='아소별장' && i.active); }

function isAsoRoom(invId){ const i=state.inventory.find(x=>x.id===invId); return !!i && (i.zone||'')==='아소별장'; }
// 이 날짜 범위에 있는 아소별장 이동 후보(묶음은 대표 1건만)
function asoCandidates(){
  return state.guests.filter(g=>teamInDayScope(g) && asoEligible(g) && asoIsLead(g)
    && !asoPartners(g).some(t=>state.rooms.some(r=>r.event_seq===t.event_seq && isAsoRoom(r.inventory_id))));
}
function asoNowRooms(g){
  const seqs=new Set(asoPartners(g).map(t=>t.event_seq));
  const nos=[...new Set(state.rooms.filter(r=>seqs.has(r.event_seq)).map(r=>r.room_no).filter(Boolean))];
  return nos.length?nos.join(', '):null;
}
function asoRowHtml(g){
  const ps=asoPartners(g), pax=asoPax(g);
  const code=ps.map(t=>teamGroupCode(t.event_seq)||evNo(t.event_seq)).filter(Boolean).join(' + ');
  const now=asoNowRooms(g);
  return `<div class="aso-row">
    <span class="g">${esc(code)}</span>
    <span>${esc(ps.map(t=>t.rep).filter(Boolean).join(' + '))}</span>
    <span>${esc(tx('asoRoom',pax))}</span>
    ${pax===ASO_CAP?`<span class="fit">${tx('asoFit')}</span>`:''}
    ${ps.length>1?`<span class="fit" style="background:var(--accent2)">${esc(tx('asoGroup',ps.length))}</span>`:''}
    <span class="now">${fmtMD(g.dep)}~${fmtMD(g.arr)} · ${tx('asoNow')} ${now?esc(now):tx('asoNoRoom')}</span>
    <button class="btn sm go" type="button" data-aso="${g.event_seq}">${tx('asoGo')}</button>
  </div>`;
}
// 그날 아소별장이 비었는지 — 비었으면 눌러서 배정 가능 팀을 연다
let asoOpen=false;
function asoStatus(){
  const d=state.focus||state.from;
  const inv=asoInventory()[0]; if(!inv) return null;
  const rows=state.rooms.filter(r=>r.inventory_id===inv.id && r.check_in<=d && d<r.check_out);
  if(!rows.length) return {free:true, d};
  const seqs=[...new Set(rows.map(r=>r.event_seq))];
  const who=seqs.map(sq=>teamGroupCode(sq)||evNo(sq)).join(', ');
  return {free:false, d, who};
}
function asoPanelHtml(){
  const st=asoStatus();
  if(!st) return '';
  if(!st.free) return `<div class="aso-panel"><h4>${esc(tx('asoBusy',fmtMD(st.d),st.who))}</h4></div>`;
  const list=asoCandidates();
  // 관내별장 예약(8명)을 먼저, 그다음 호텔 예약 8명
  const villa=list.filter(g=>g.sale_type==='관내별장'), hotel=list.filter(g=>g.sale_type!=='관내별장');
  const sec=(ttl,arr)=>arr.length?`<div style="font-size:11.5px;font-weight:800;color:#5e3a86;margin:6px 0 4px">${esc(ttl)} ${arr.length}</div>`+arr.map(asoRowHtml).join(''):'';
  return `<div class="aso-panel">
    <h4 style="cursor:pointer" id="aso-toggle">${asoOpen?'▾':'▸'} ${esc(tx('asoFree',fmtMD(st.d)))}</h4>
    ${asoOpen?`<div class="d">${tx('asoDesc')}</div>`
      +(list.length?(sec(tx('asoVilla'),villa)+sec(tx('asoHotel'),hotel))
        :`<div style="font-size:12px;color:var(--muted);padding:6px 2px">${tx('asoNone')}</div>`):''}
  </div>`;
}
function wireAsoButtons(root){
  root.querySelectorAll('[data-aso]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    const g=state.guests.find(x=>String(x.event_seq)===b.dataset.aso);
    if(g) moveToAso(g);
  }));
}
// 아소별장으로 이동 — 기존 배정 해제 후 아소별장 1동에 배정(되돌리기 제공)
async function moveToAso(g){
  const inv=asoInventory()[0];
  if(!inv){ toast(tx('asoNoInv'),'warn'); return; }
  const ps=asoPartners(g);
  const code=ps.map(t=>teamGroupCode(t.event_seq)||evNo(t.event_seq)).filter(Boolean).join(' + ');
  const mids=[]; ps.forEach(t=>teamRoster(t.event_seq).forEach(m=>mids.push(m.id)));
  if(!mids.length){ toast(tx('rosterNone'),'warn'); return; }
  if(!confirm(tx('asoConfirm',code,mids.length))) return;
  // 1) 기존 배정 해제(스냅샷 = 되돌리기)
  const rows=state.rooms.filter(r=>mids.includes(r.member_id));
  const snap=rows.map(_roomSnap);
  if(rows.length){
    const {error}=await supa.from('rooms').delete().in('id',rows.map(r=>r.id));
    if(error){ toast(tx('asoFail',error.message),'err'); return; }
    const del=new Set(rows.map(r=>r.id));
    state.rooms=state.rooms.filter(r=>!del.has(r.id));
    rebuildAssignMap();
  }
  // 2) 아소별장 배정(정원·폐쇄 검증은 assignMembers 가 DB 기준으로 수행)
  await assignMembers(mids, inv);
  logAssign('아소별장 이동', `${code} ${mids.length}명 → ${inv.room_no}`);
  render();
  if(snap.length) toastUndo(tx('asoMoved',code,mids.length), async()=>{
    const back=state.rooms.filter(r=>mids.includes(r.member_id)).map(r=>r.id);
    if(back.length) await supa.from('rooms').delete().in('id',back);
    state.rooms=state.rooms.filter(r=>!back.includes(r.id));
    await restoreRooms(snap);
    rebuildAssignMap(); render();
  });
  else toast(tx('asoMoved',code,mids.length),'ok');
}

function renderFacilities(){
  const box=$('#facilities'); box.innerHTML='';
  // 아소별장 칩을 켜면 이동 후보를 맨 위에(Min 2026-08)
  if(placeSel.has('아소별장')){
    const ap=document.createElement('div'); ap.innerHTML=asoPanelHtml();
    box.appendChild(ap); wireAsoButtons(ap);
    const at=ap.querySelector('#aso-toggle');
    if(at) at.addEventListener('click',()=>{ asoOpen=!asoOpen; renderFacilities(); });
  }
  if(state.splitPending){
    const b=document.createElement('div');
    b.style.cssText='font-size:12.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px';
    b.innerHTML=`${tx('splitMode',state.splitPending.name||'',state.splitPending.from,state.splitPending.to)} <button class="btn ghost sm" id="split-cancel" type="button" style="margin-left:auto;color:#fff;border-color:#fff">${tx('cancel')}</button>`;
    box.appendChild(b);
    b.querySelector('#split-cancel').addEventListener('click',cancelSplit);
  }
  const _span=selAssignSpan();
  if(_span){
    const h=document.createElement('div');
    h.style.cssText='position:sticky;top:0;z-index:6;font-size:12px;color:#fff;background:var(--accent2);border-radius:7px;padding:7px 12px;margin-bottom:10px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.18)';
    h.innerHTML=tx('spanNote',fmtMD(_span.dep),fmtMD(_span.arr));
    box.appendChild(h);
  } else if(state.from && state.to && state.from!==state.to){
    const h=document.createElement('div');
    h.style.cssText='font-size:12px;color:var(--text2);background:var(--surface3);border-radius:7px;padding:7px 12px;margin-bottom:10px';
    h.innerHTML=tx('rangeNote',state.focus||state.from);
    box.appendChild(h);
  }
  if(viewMode==='table'){ renderRoomTables(box); return; }
  const FACS=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸'];
  FACS.forEach(fac=>{
    const pfx=PFX[fac];
    const rooms=state.inventory.filter(r=>r.facility===fac && roomMatch(r));
    if(!rooms.length && (placeSel.size>0||typeSel.size>0)) return;   // 필터로 걸러진 시설은 숨김
    const facDiv=document.createElement('div');
    facDiv.className='fac f-'+pfx;
    // 가동률 — 기준일 하룻밤 점유 / 활성 정원 (한 달 누적 아님)
    const fd=state.focus||state.from;
    const totalCap=rooms.filter(r=>r.active).reduce((s,r)=>s+r.capacity,0);
    const used=rooms.reduce((s,inv)=>s+roomUsedPax(inv),0);   // span-aware(선택 시 그 기간 기준)
    facDiv.innerHTML=`<h3><span class="dot"></span>${accomL(fac)}<span class="util">${tx('facUtil',used,totalCap)}</span></h3>`;
    // zone별 그룹 — 호텔동은 3층→12층 순 정렬, 별장 등은 등장 순
    const zones=[...new Set(rooms.map(r=>r.zone||fac))].sort((a,b)=>{
      const fa=a.match(/^(\d+)층$/), fb=b.match(/^(\d+)층$/);
      if(fa&&fb) return (+fa[1])-(+fb[1]);   // 둘 다 층 → 숫자순(3→12)
      if(fa) return -1; if(fb) return 1;     // 층을 앞으로
      return 0;
    });
    zones.forEach(zone=>{
      const zr=rooms.filter(r=>(r.zone||fac)===zone);
      const isHotelFloor=/^\d+층$/.test(zone);
      if(zones.length>1){
        const zl=document.createElement('div'); zl.className='zone-label';
        zl.innerHTML=`<span>— ${zone}</span>`;
        if(isHotelFloor && parseInt(zone,10)===LOW_GRADE_FLOOR){
          // 3층 = 실질 등급 한 단계 아래로 계산됨을 현장이 알 수 있게 표기
          const lg=document.createElement('small');
          lg.className='zone-pin'; lg.textContent=tx('lowGrade'); lg.title=tx('lowGradeT');
          zl.appendChild(lg);
        }
        if(isHotelFloor){
          // 층 라벨 + 단면도 보기 버튼
          const btn=document.createElement('button');
          btn.className='floorplan-btn'; btn.type='button';
          btn.textContent=tx('floorplan'); btn.title=tx('floorplanT');
          btn.addEventListener('click',()=>openFloorplanModal(zone,zr));
          zl.appendChild(btn);
        }
        // 층별 통계: 사용 실수/총실 · 인원 · 정원미만(트윈 1명 등)
        const act=zr.filter(r=>r.active);
        const usedRooms=act.filter(inv=>roomUsedPax(inv)>0).length;
        const ppl=act.reduce((s,inv)=>s+roomUsedPax(inv),0);
        const under=act.filter(inv=>{const u=roomUsedPax(inv);return u>0&&u<inv.capacity;}).length;
        zl.insertAdjacentHTML('beforeend',
          `<span class="zstat">${tx('used')} ${usedRooms}/${act.length}${tx('roomsUnit')} · ${ppl}${tx('nameUnit')}${under?` · <span class="zwarn">${tx('under',under)}</span>`:''}</span>`);
        if(ppl>0){
          const cbtn=document.createElement('button');
          cbtn.className='floorplan-btn'; cbtn.type='button';
          cbtn.textContent=tx('clearZone'); cbtn.title=tx('clearZoneT',zone);
          cbtn.style.color='var(--err)'; cbtn.style.background='#f7e6e2'; cbtn.style.borderColor='#e3bdb4';
          cbtn.addEventListener('click',()=>clearZone(fac,zone));
          zl.appendChild(cbtn);
        }
        facDiv.appendChild(zl);
      }
      const grid=document.createElement('div'); grid.className='rooms-grid';
      zr.forEach(inv=>grid.appendChild(renderRoom(inv)));
      facDiv.appendChild(grid);
    });
    if(!rooms.length){
      const e=document.createElement('div'); e.className='empty-hint';
      e.innerHTML=fac==='야마나미리조트'
        ?tx('noHotelRooms')
        :tx('noRooms');
      facDiv.appendChild(e);
    }
    box.appendChild(facDiv);
  });
}



// ── 팀별 임시 그룹코드 부여 (회원 group_code 없으면 AA01, AA02… 순서대로) ──
//   v13.4 방식: 대표 그룹코드 + 개인번호 + 숙소Pfx (예: AA01-1Y)
let _tagMapCache=null;
// ── 개인(멤버) 단위 헬퍼 ─────────────────────────────────────────────
// rooms 1행 = 1명. member_id = guest_members.id. 화면 태그는 표시용.
function assignedMemberSet(){
  // 이번 세션에서 이미 방을 받은 member_id 집합
  const s=new Set();
  state.rooms.forEach(r=>{ if(r.member_id!=null) s.add(r.member_id); });
  return s;
}
function unassignedMembers(seq){
  // 해당 팀에서 아직 방 안 받은 멤버 목록(정렬+태그 포함)
  const done=assignedMemberSet();
  return teamRoster(seq).filter(m=>!done.has(m.id));
}
function teamFullyAssigned(seq){
  return unassignedMembers(seq).length===0 && (state.members[seq]||[]).length>0;
}
function memberById(mid){
  for(const seq in state.members){
    const hit=(state.members[seq]||[]).find(m=>m.id===mid);
    if(hit) return {...hit, event_seq:Number(seq)};
  }
  return null;
}
function selClear(){ state.sel=new Set(); }
function selCount(){ return state.sel?state.sel.size:0; }
function renderSelBar(){
  const bar=$('#sel-bar'); if(!bar) return;
  const n=selCount();
  bar.style.display=n? 'flex':'none';
  if(n){
    const sp=selAssignSpan();
    $('#sel-cnt').innerHTML=n+t('rm_selectedSuffix')+(sp?`<small style="font-weight:700;opacity:.85">${tx('selSpan',fmtMD(sp.dep),fmtMD(sp.arr))}</small>`:'');
  }
}

function buildTagMap(){
  const map={}; let idx=0;
  // 팀 정렬: 숙소→대표자 (일관된 임시코드 부여)
  const teams=[...state.guests].sort((a,b)=>(a.accom||'').localeCompare(b.accom||'')||(a.rep||'').localeCompare(b.rep||''));
  teams.forEach(g=>{
    let gcode=g.group_code;
    if(!gcode){
      // 임시코드 AA01, AA02 … (26*99 capacity)
      const n=idx++;
      const a=String.fromCharCode(65+Math.floor(n/26)%26);
      const b=String.fromCharCode(65+n%26);
      const num=String(Math.floor(n/676)+1);
      gcode='A'+a+b.replace('A','A'); // 단순화: AA,AB,AC...
      gcode='A'+String.fromCharCode(65+Math.floor(n/26)%26)+String(n%26+1).padStart(2,'0');
    }
    map[g.event_seq]={gcode, pfx:g.pfx||'Y'};
  });
  return map;
}
function personTag(seq, seqInTeam){
  if(!_tagMapCache) _tagMapCache=buildTagMap();
  const t=_tagMapCache[seq]; if(!t) return '';
  return `${t.gcode}-${seqInTeam}${t.pfx}`;
}
function teamGroupCode(seq){
  if(!_tagMapCache) _tagMapCache=buildTagMap();
  return _tagMapCache[seq]?_tagMapCache[seq].gcode:'';
}
// 팀 명단 (정렬된 멤버 + 태그코드)
function teamRoster(seq){
  const ms=(state.members[seq]||[]).slice().sort((a,b)=>(a.seq_in_team||0)-(b.seq_in_team||0));
  return ms.map((m,i)=>({
    ...m,
    num:m.seq_in_team||(i+1),
    tag:personTag(seq, m.seq_in_team||(i+1)),
  }));
}

// ── 팀의 영문명 목록 (객실 칩 표시용) ──
function teamEnNames(seq){
  const ms=(state.members[seq]||[]).filter(m=>m.name_en).map(m=>m.name_en);
  if(!ms.length) return '';
  return ms.slice(0,4).join(', ')+(ms.length>4?` 외 ${ms.length-4}`:'');
}

function invById(id){return state.inventory.find(i=>i.id===id);}

// ── 방 점유 칩 HTML (카드 보기 · 표 보기 공용) ──
//   compact=true → 표 보기용 인라인 칩(한 줄). 조작 버튼 class(.cx/.csplit/.ceco-btn)는 동일 → 이벤트 배선 공용.
function roomChipsHtml(assigned, refDay, compact){
  const byTeam={}; assigned.forEach(r=>{ (byTeam[r.event_seq]=byTeam[r.event_seq]||[]).push(r); });
  return Object.keys(byTeam).map(seq=>{
    const rows=byTeam[seq], r0=rows[0];
    const gcode=teamGroupCode(seq)||(tx('teamPrefix')+evNo(seq));
    // 아소별장(8인 1동)으로 옮길 수 있는 팀이면 현재 배정 옆에 표기(Min 2026-08)
    const _g=state.guests.find(x=>String(x.event_seq)===String(seq));
    const asoB='';   // 아소 후보 표기는 「아소별장」 토글 패널에서만(Min 2026-08)
    // 수기(분할 포함) 배정 = 고정. 자동배정이 다시 돌아도 이 방은 그대로다.
    const pinned = rows.some(r=>r.assign_source==='manual');
    const pin = pinned ? `<span class="cpin" title="${tx('pinT')}">${tx('pinMark')}</span>` : '';
    const isIn = refDay && r0.check_in===refDay;                       // 오늘 입실 팀
    const chipCls = !refDay ? '' : (isIn?' chip-in' : ' chip-cont');
    const flag = !refDay ? '' : (isIn?`<span class="cflag cf-in">${tx('flagIn')}</span>` : `<span class="cflag cf-cont">${tx('flagCont')}</span>`);
    const mem=r=>{
      const m=r.member_id!=null?memberById(r.member_id):null;
      const nameKr=m?(m.name_kr||'-'):gcode;
      const nameEn=m?(m.name_en||''):'';
      const gb=m?`<i class="gbadge${isMember(m)?' mem':''}" title="${esc(gradeLabel(m))}">${gradeShort(m)}</i>`:'';
      const ecoMk=(m&&m.actual_dep)?`<span class="ceco" title="${tx('ecoMark',m.actual_dep)}">🛫${fmtMD(m.actual_dep)}</span>`:'';
      const ecoBtn=m?`<span class="ceco-btn${m.actual_dep?' on':''}" data-room-id="${r.id}" title="${tx('chipEcoT')}">🛫</span>`:'';
      // 조작은 ✕(해제)만 인라인. 방 이동·조기 퇴실은 이름을 눌러 「투숙객 작업」 패널에서(Min 2026-08)
      const acts=`<span class="cx" data-room-id="${r.id}" title="${tx('chipCancelT')}">✕</span>`;
      const nm=m?`<b class="mm-name" data-mm-room="${r.id}" title="${tx('mmOpenT')}">${nameKr}</b>`:`<b>${nameKr}</b>`;
      if(compact) return `<span class="tmem${(m&&m.actual_dep)?' eco':''}">${nm}<span class="cmen">${nameEn}</span>${gb}${ecoMk}${acts}</span>`;
      return `<div class="cmem${(m&&m.actual_dep)?' eco':''}">${nm}<span class="cmen">${nameEn}</span>${gb}${ecoMk}<span class="cmem-act">${acts}</span></div>`;
    };
    if(compact){
      return `<span class="tchip${chipCls}" data-seq="${seq}"><span class="ctag">${gcode}</span>${pin}${asoB}${flag}`
        + rows.map(mem).join('')
        + `<span class="tdate">${fmtMD(r0.check_in)}~${fmtMD(r0.check_out)}</span></span>`;
    }
    return `<div class="chip${chipCls}" data-seq="${seq}">
      <div class="chip-head"><span class="ctag">${gcode}</span>${pin}${asoB}${flag}<span class="cnum">${rows.length}${tx('nameUnit')}</span><span class="cdate">${fmtMD(r0.check_in)}~${fmtMD(r0.check_out)}</span></div>
      <div class="cmems">${rows.map(mem).join('')}</div>
    </div>`;
  }).join('');
}

function renderRoom(inv){
  const div=document.createElement('div');
  const _span=selAssignSpan();
  const assigned = _span ? roomOccOver(inv.id,_span.dep,_span.arr).rows   // 선택팀 기간 점유
                         : roomOccAt(inv.id, state.focus||state.from);     // 평소=기준일 하룻밤
  const usedPax=roomUsedPax(inv);   // span-aware (선택 시 그 기간 최대점유)
  const cap=inv.max_capacity||inv.capacity;
  // 상태색: 초과=빨강(위험) · 정원 꽉참=초록(깔끔) · 정원 미달=앰버(주의)
  // ⚠ 초과 판정은 **최대 정원(max_capacity)** 기준이다. 간지호텔처럼 정원2·최대3인 방은
  //    3명이 들어가도 정상이며, capacity(2) 기준으로 보면 멀쩡한 방이 전부 「초과」로 찍힌다(Min 2026-08).
  const stCls = usedPax>cap ? ' warn' : (usedPax>0 && usedPax>=inv.capacity ? ' full' : (usedPax>0 ? ' partial' : ''));
  const clo=roomClosedFocus(inv.id);   // 기준일 폐쇄 여부
  div.className='room'+((inv.active&&!clo)?'':' inactive')+(assigned.length?' filled':'')+stCls;
  div.dataset.invId=inv.id;
  // 기준일(focus) 대비 체크인(초록)/연박(블루) 구분. 퇴실은 카드에서 빼고 별도 「오늘 퇴실」 목록으로.
  const refDay = _span ? null : (state.focus||state.from);
  // 같은 방 점유를 '팀 단위'로 묶어 표시(8인 별장도 한 칸에 안 터지게). 멤버별 ✕/분할은 유지.
  const chips=roomChipsHtml(assigned, refDay, false);
  div.innerHTML=`
    <span class="cap">${usedPax}/${inv.capacity}</span>
    <span class="lock" data-inv-id="${inv.id}" title="${inv.active?tx('lockOnT'):tx('lockOffT')}">${inv.active?'🔓':'🔒'}</span>
    <div class="rn">${inv.room_no}${zonePin(inv)}</div>
    <div class="rt">${typeLabel(inv.room_type,inv.facility,inv.zone)}</div>
    ${inv.note?`<div class="note">${inv.note}</div>`:''}
    ${clo?`<div class="note" style="color:#b13b2c;font-weight:700">${tx('closedNote',fmtMD(clo.from_date),fmtMD(clo.to_date),clo.reason)}</div>`:''}
    <div class="assigned">${chips}</div>
    ${usedPax>cap?`<span class="badge">${tx('over')}</span>`:''}`;
  wireRoomEl(div,inv);
  return div;
}

// ── 방 요소(카드 <div> · 표 <tr>) 공용 이벤트 배선 ──
function wireRoomEl(div,inv){
  // 칩 삭제
  div.querySelectorAll('.cx').forEach(x=>x.addEventListener('click',ev=>{ev.stopPropagation();unassign(x.dataset.roomId);}));
  // 이름 클릭 → 「투숙객 작업」 패널(방 이동·조기 퇴실·해제를 날짜와 함께 한 곳에서)
  div.querySelectorAll('.mm-name').forEach(x=>x.addEventListener('click',ev=>{ev.stopPropagation();openMemberModal(x.dataset.mmRoom);}));
  // 활성/비활성 토글
  const lk=div.querySelector('.lock');
  if(lk) lk.addEventListener('click',ev=>{ev.stopPropagation();toggleActive(inv);});
  // 카드/행 클릭 → 분할 모드면 이 방으로 뒷부분 이동, 아니면 선택 인원 배정
  div.addEventListener('click',ev=>{
    if(ev.target.closest('.cx')||ev.target.closest('.lock')||ev.target.closest('.mm-name')) return;
    if(window.getSelection) window.getSelection().removeAllRanges(); // 텍스트 파란선택 해제
    if(!inv.active){toast(inv.room_no+': '+tx('inactiveRoomShort'),'warn');return;}
    if(state.splitPending){ commitSplit(inv); return; }
    // 선택 인원이 있으면 곧바로 배정하던 것을 **확인 후 배정**으로. 표가 전폭이라
    // 빈 곳을 눌렀다가 사람이 들어가는 사고가 있었다(Min 2026-08).
    const _n=selCount();
    if(_n>0 && !confirm(tx('assignAsk',inv.room_no,_n))) return;
    assignSelectedTo(inv);
  });
  // 드롭
  if(inv.active){
    div.addEventListener('dragover',e=>{e.preventDefault();div.classList.add('over');});
    div.addEventListener('dragleave',()=>div.classList.remove('over'));
    div.addEventListener('drop',e=>{e.preventDefault();div.classList.remove('over');
      assignSelectedTo(inv);});
  }
}

// ── 표 보기: 행 1개 = 객실 1개 ──
function renderRoomRow(inv){
  const tr=document.createElement('tr');
  const _span=selAssignSpan();
  const assigned = _span ? roomOccOver(inv.id,_span.dep,_span.arr).rows
                         : roomOccAt(inv.id, state.focus||state.from);
  const usedPax=roomUsedPax(inv);
  const cap=inv.max_capacity||inv.capacity;
  // ⚠ 초과 판정은 **최대 정원(max_capacity)** 기준이다. 간지호텔처럼 정원2·최대3인 방은
  //    3명이 들어가도 정상이며, capacity(2) 기준으로 보면 멀쩡한 방이 전부 「초과」로 찍힌다(Min 2026-08).
  const stCls = usedPax>cap ? ' warn' : (usedPax>0 && usedPax>=inv.capacity ? ' full' : (usedPax>0 ? ' partial' : ''));
  const clo=roomClosedFocus(inv.id);
  tr.className='rrow'+((inv.active&&!clo)?'':' inactive')+stCls;
  tr.dataset.invId=inv.id;
  const refDay = _span ? null : (state.focus||state.from);
  const chips=roomChipsHtml(assigned, refDay, true);
  tr.innerHTML=`
    <td class="c-no">${inv.room_no}${zonePin(inv)}<span class="lock" data-inv-id="${inv.id}" title="${inv.active?tx('lockOnT'):tx('lockOffT')}">${inv.active?'🔓':'🔒'}</span></td>
    <td class="c-ty">${typeLabel(inv.room_type,inv.facility,inv.zone)}</td>
    <td class="c-cap">${usedPax}/${inv.capacity}${cap>inv.capacity&&usedPax>inv.capacity?`<small style="color:var(--muted)">(max ${cap})</small>`:''}${usedPax>cap?` <span class="badge">${tx('over')}</span>`:''}</td>
    <td class="c-gu">${chips}${clo?`<span class="c-clo">${tx('closedNote',fmtMD(clo.from_date),fmtMD(clo.to_date),clo.reason)}</span>`:''}${inv.note?`<span class="c-clo" style="color:var(--muted);font-weight:600">${esc(inv.note)}</span>`:''}</td>`;
  wireRoomEl(tr,inv);
  return tr;
}

// 표 보기 상태 — 빈 방만 보기 / 접은 층
let tblOnlyEmpty=false, tblOnlyPin=false;   // 📌 수기 배정만 보기(Min 2026-08)
const tblFold=new Set();
function renderRoomTables(box){
  const bar=document.createElement('div'); bar.className='tbl-bar';
  bar.innerHTML=`<label><input type="checkbox" id="tbl-empty"${tblOnlyEmpty?' checked':''}><span id="tbl-empty-lbl">${tx('onlyEmpty')}</span></label>`
    +`<label><input type="checkbox" id="tbl-pin"${tblOnlyPin?' checked':''}><span>${tx('pinOnly')}</span></label>`
    +`<span style="color:var(--muted);font-size:11.5px">${tx('onlyEmptyT')} · ${tx('pinListT')}</span>`;
  box.appendChild(bar);
  bar.querySelector('#tbl-empty').addEventListener('change',e=>{ tblOnlyEmpty=e.target.checked; renderFacilities(); });
  bar.querySelector('#tbl-pin').addEventListener('change',e=>{ tblOnlyPin=e.target.checked; renderFacilities(); });

  const FACS=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸'];
  let shown=0;
  FACS.forEach(fac=>{
    const pfx=PFX[fac];
    const rooms=state.inventory.filter(r=>r.facility===fac && roomMatch(r));
    if(!rooms.length && placeSel.size>0) return;
    if(!rooms.length) return;
    const facDiv=document.createElement('div'); facDiv.className='fac f-'+pfx;
    const totalCap=rooms.filter(r=>r.active).reduce((s,r)=>s+r.capacity,0);
    const used=rooms.reduce((s,inv)=>s+roomUsedPax(inv),0);
    facDiv.innerHTML=`<h3><span class="dot"></span>${accomL(fac)}<span class="util">${tx('facUtil',used,totalCap)}</span></h3>`;
    const tbl=document.createElement('table'); tbl.className='rtbl';
    tbl.innerHTML=`<thead><tr><th>${tx('thRoom')}</th><th>${tx('thType')}</th><th style="text-align:center">${tx('thCap')}</th><th>${tx('thGuests')}</th></tr></thead>`;
    const tb=document.createElement('tbody'); tbl.appendChild(tb);
    const zones=[...new Set(rooms.map(r=>r.zone||fac))].sort((a,b)=>{
      const fa=a.match(/^(\d+)층$/), fb=b.match(/^(\d+)층$/);
      if(fa&&fb) return (+fa[1])-(+fb[1]);
      if(fa) return -1; if(fb) return 1;
      return 0;
    });
    let facRows=0;
    zones.forEach(zone=>{
      const zrAll=rooms.filter(r=>(r.zone||fac)===zone);
      let zr=tblOnlyEmpty?zrAll.filter(inv=>roomUsedPax(inv)===0):zrAll;
      if(tblOnlyPin) zr=zr.filter(inv=>state.rooms.some(r=>r.inventory_id===inv.id && r.assign_source==='manual'));
      if(!zr.length) return;
      const isHotelFloor=/^\d+층$/.test(zone);
      const key=fac+'|'+zone, folded=tblFold.has(key);
      if(zones.length>1){
        const act=zrAll.filter(r=>r.active);
        const usedRooms=act.filter(inv=>roomUsedPax(inv)>0).length;
        const ppl=act.reduce((s,inv)=>s+roomUsedPax(inv),0);
        const under=act.filter(inv=>{const u=roomUsedPax(inv);return u>0&&u<inv.capacity;}).length;
        const fr=document.createElement('tr'); fr.className='frow';
        const td=document.createElement('td'); td.colSpan=4; td.title=tx('fldFold');
        td.innerHTML=`<span class="fcar">${folded?'▸':'▾'}</span>${zone}`
          +(isHotelFloor&&parseInt(zone,10)===LOW_GRADE_FLOOR?` <small class="zone-pin" title="${tx('lowGradeT')}">${tx('lowGrade')}</small>`:'')
          +`<span class="fstat">${tx('used')} ${usedRooms}/${act.length}${tx('roomsUnit')} · ${ppl}${tx('nameUnit')}${under?` · <span class="zwarn">${tx('under',under)}</span>`:''}</span>`;
        td.addEventListener('click',()=>{ folded?tblFold.delete(key):tblFold.add(key); renderFacilities(); });
        fr.appendChild(td); tb.appendChild(fr);
      }
      if(folded) return;
      zr.forEach(inv=>{ tb.appendChild(renderRoomRow(inv)); facRows++; });
    });
    if(!facRows && zones.length<=1) return;
    facDiv.appendChild(tbl); box.appendChild(facDiv); shown+=facRows;
  });
  if(!shown){
    const e=document.createElement('div'); e.className='empty-hint'; e.textContent=tx('tblNone');
    box.appendChild(e);
  }
}

// ── 분할 체류(): 기준일부터 뒷부분을 다른 방으로 ──
//   · 원래 배정 행을 [체크인~기준일]로 단축, 뒷부분[기준일~체크아웃]을 새 방에 수기 배정
//   · 빈 앞/뒷날엔 다른 팀을 넣을 수 있음. 표시는 타임라인·일별 카드가 자동 처리.
function startSplit(roomId, atDate){
  const row=state.rooms.find(r=>r.id===roomId);
  if(!row || row.member_id==null){toast(tx('splitOnlyMember'),'warn');return;}
  const D=atDate||state.focus||state.from;
  // 체크인 당일 = 분할이 아니라 체류 전체 이동
  if(D===row.check_in){
    const m0=memberById(row.member_id);
    state.splitPending={ srcId:row.id, member_id:row.member_id, event_seq:row.event_seq,
      from:row.check_in, to:row.check_out, name:(m0?m0.name_kr:''), whole:true };
    render(); openSplitPicker(row); return;
  }
  if(!(row.check_in < D && D < row.check_out)){
    toast(tx('splitMidOnly'),'warn');
    return;
  }
  const m=memberById(row.member_id);
  state.splitPending={ srcId:row.id, member_id:row.member_id, event_seq:row.event_seq, from:D, to:row.check_out, name:(m?m.name_kr:'') };
  render();
  openSplitPicker(row);   // 옮길 수 있는 방을 층별로 바로 보여준다(닫고 객실을 직접 눌러도 동일)
}

// ── 「투숙객 작업」 패널 ────────────────────────────────────────────────

          <input class="inp" type="date" id="mm-mv-date" value="${mvDef}" min="${mvMin}" max="${mvMax}">
          <button class="btn sm" type="button" id="mm-mv-go">${tx('mmPick')}</button>
        </div>
      </div>
      <div class="mm-sec">
        <h4>${tx('mmEco')}</h4>

          ? `<div class="n" style="color:var(--err);font-weight:700">${esc(tx('mmEcoOn',m.actual_dep))}${m.actual_dep_reason?' · '+esc(m.actual_dep_reason):''}</div>
             <button class="btn sm ghost" type="button" id="mm-eco-off">${tx('mmEcoOff')}</button>`
          : `<div class="n">${tx('mmEcoNote')}</div>

// ── ✂ 분할: 옮길 방 고르기 팝업 (층 단위 목록) ──
function closeSplitPicker(){ const el=$('#split-picker'); if(el) el.remove(); }
function openSplitPicker(srcRow){
  const sp=state.splitPending; if(!sp) return;
  closeSplitPicker();
  // 후보 = 그 기간에 빈자리가 있고, 폐쇄·비활성이 아닌 방(원래 방 제외)
  const cands=state.inventory.filter(inv=>{
    if(!inv.active) return false;
    if(srcRow && inv.id===srcRow.inventory_id) return false;
    if(roomClosure(inv.id, sp.from, sp.to)) return false;
    const cap=inv.max_capacity||inv.capacity;
    return (cap - roomOccOver(inv.id, sp.from, sp.to).peak) >= 1;
  }).map(inv=>({inv, free:(inv.max_capacity||inv.capacity)-roomOccOver(inv.id,sp.from,sp.to).peak}));

  const srcFac=srcRow?srcRow.facility:'';
  // 시설 → 층(zone) 묶음. 같은 숙소를 위로.
  const groups={};
  cands.forEach(c=>{ const fac=c.inv.facility||'', zone=c.inv.zone||fac;
    const k=fac+'|'+zone; (groups[k]=groups[k]||{fac,zone,list:[]}).list.push(c); });
  const keys=Object.keys(groups).sort((a,b)=>{
    const A=groups[a],B=groups[b];
    const sa=(A.fac===srcFac?0:1)-(B.fac===srcFac?0:1); if(sa) return sa;
    if(A.fac!==B.fac) return String(A.fac).localeCompare(String(B.fac));
    const fa=String(A.zone).match(/^(\d+)층$/), fb=String(B.zone).match(/^(\d+)층$/);
    if(fa&&fb) return (+fb[1])-(+fa[1]);      // 높은 층 우선(배정 규칙과 같은 방향)
    if(fa) return -1; if(fb) return 1;
    return String(A.zone).localeCompare(String(B.zone));
  });
  const body = keys.length ? keys.map(k=>{
    const g=groups[k];
    const items=g.list.sort((a,b)=>String(a.inv.room_no).localeCompare(String(b.inv.room_no),undefined,{numeric:true}))
      .map(c=>`<button type="button" class="sp-room" data-inv-id="${c.inv.id}"
          style="text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;cursor:pointer">
          <b style="font-family:var(--mono);font-size:14px">${esc(c.inv.room_no)}</b>
          <span style="display:block;font-size:10.5px;color:var(--text2)">${esc(TYPE_KO[c.inv.room_type]||c.inv.room_type||'')}</span>
          <span style="display:block;font-size:10.5px;font-weight:800;color:var(--ok)">${esc(tx('spFree',c.free))}</span>
        </button>`).join('');
    return `<div style="margin-bottom:10px">
      <div style="font-size:12px;font-weight:800;color:var(--text2);background:var(--surface3);border-radius:7px;padding:4px 9px;margin-bottom:6px">
        ${esc(g.zone)} <span style="font-weight:600;color:var(--muted)">${esc(accomL(g.fac))}</span>
        ${g.fac===srcFac?`<span style="font-size:9.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px">${esc(tx('spSame'))}</span>`:''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px">${items}</div>
    </div>`;
  }).join('') : `<div style="padding:28px;text-align:center;color:var(--muted)">${tx('spNone')}</div>`;

  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='split-picker';
  bg.innerHTML=`<div class="modal" style="max-width:640px">
    <h2>${esc(tx('spTitle',sp.name||'',fmtMD(sp.from),fmtMD(sp.to)))}</h2>
    <div style="padding:9px 18px 0"><input class="inp" id="sp-q" type="search" autocomplete="off" placeholder="${esc(tx('thRoom'))}" style="width:100%"></div>
    <div class="mbody" style="max-height:54vh;overflow:auto">${body}</div>
    <div style="padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center">
      <span style="margin-right:auto;font-size:11.5px;color:var(--muted)">${esc(tx('spHint'))}</span>
      <button class="btn ghost sm" type="button" id="sp-close">${tx('close')}</button>
    </div>
  </div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeSplitPicker(); });
  document.body.appendChild(bg);
  $('#sp-close').addEventListener('click',closeSplitPicker);
  const spq=$('#sp-q');
  if(spq) spq.addEventListener('input',()=>{
    const q=(spq.value||'').trim().toLowerCase();
    bg.querySelectorAll('.sp-room').forEach(b=>{
      b.style.display=(!q || b.textContent.toLowerCase().includes(q))?'':'none';
    });
  });
  bg.querySelectorAll('.sp-room').forEach(b=>b.addEventListener('click',async()=>{
    const inv=state.inventory.find(x=>String(x.id)===b.dataset.invId); if(!inv) return;
    closeSplitPicker();
    await commitSplit(inv);   // 정원·폐쇄 최종 확인은 commitSplit 이 DB 기준으로 한다
  }));
}
async function commitSplit(inv){
  const sp=state.splitPending; if(!sp) return;
  const srcRow=state.rooms.find(r=>r.id===sp.srcId);
  if(srcRow && srcRow.inventory_id===inv.id){ toast(tx('sameRoom'),'warn'); return; }
  const cap=inv.max_capacity||inv.capacity;
  // 폐쇄 가드(자동·수기·피커와 동일하게 분할에도 적용)
  const _cloSp=roomClosure(inv.id,sp.from,sp.to);
  if(_cloSp){ toast(tx('splitClosedT',inv.room_no,_cloSp.from_date,_cloSp.to_date,_cloSp.reason),'warn'); return; }
  // 정원 = DB 권위 점유(다른 달 포함, 원행 제외). state.rooms만 보던 월경계 회귀 수정.
  const used=await dbRoomUsedPax(inv.id, sp.from, sp.to, [sp.srcId]);
  if(used+1>cap){ toast(tx('capOverShort',inv.room_no,sp.from,sp.to),'warn'); return; }
  // 체류 전체 이동 — 행을 쪼개지 않고 그 행의 방만 바꾼다
  if(sp.whole){
    const {error:eW}=await supa.from('rooms')
      .update({inventory_id:inv.id, facility:inv.facility, room_type:inv.room_type, room_no:inv.room_no, assign_source:'manual'})
      .eq('id',sp.srcId);
    if(eW){ toast(tx('mmMoveFail',eW.message),'err'); return; }
    const r0=state.rooms.find(r=>r.id===sp.srcId);
    if(r0){ r0.inventory_id=inv.id; r0.facility=inv.facility; r0.room_type=inv.room_type; r0.room_no=inv.room_no; r0.assign_source='manual'; }
    state.splitPending=null;
    rebuildAssignMap(); render();
    logAssign('방 이동', `${sp.name||''}(${teamGroupCode(sp.event_seq)||evNo(sp.event_seq)||''}) → ${inv.facility||''} ${inv.room_no} (${sp.from}~${sp.to})`);
    toast(tx('mmMoved',sp.name||'',inv.room_no),'ok');
    return;
  }
  // 1) 원래 행을 앞부분으로 단축(수기 표시)
  const {error:e1}=await supa.from('rooms').update({check_out:sp.from, assign_source:'manual'}).eq('id',sp.srcId);
  if(e1){toast(tx('splitFailSrc',e1.message),'err');return;}
  // 2) 뒷부분을 새 방에 수기 배정
  const newRow={ event_seq:sp.event_seq, member_id:sp.member_id, inventory_id:inv.id, facility:inv.facility, room_type:inv.room_type, room_no:inv.room_no, check_in:sp.from, check_out:sp.to, assigned_pax:1, assign_source:'manual' };
  const {data,error:e2}=await supa.from('rooms').insert(newRow).select().single();
  if(e2){toast(tx('splitFailNew',e2.message),'err');return;}
  const src=state.rooms.find(r=>r.id===sp.srcId); if(src){ src.check_out=sp.from; src.assign_source='manual'; }
  state.rooms.push(data);
  state.splitPending=null;
  rebuildAssignMap(); render();
  logAssign('분할', `${sp.name||''}(${teamGroupCode(sp.event_seq)||evNo(sp.event_seq)||''}) ${srcRow?(srcRow.facility||'')+' '+srcRow.room_no+' ':''}→ ${inv.facility||''} ${inv.room_no} (${sp.from}부터)`);
  toast(tx('splitDone',sp.from,inv.room_no),'ok');
}
function cancelSplit(){ closeSplitPicker(); if(state.splitPending){ state.splitPending=null; render(); } }

// ── 조기 퇴실(개인 단위) ──
//   · 팀 전체가 아니라 1~2명만 예정보다 일찍 귀국하는 케이스.
//   · guest_members.actual_dep 기록 + 그 사람 방을 퇴실일로 단축(이후 방은 해제) → 침대 그날부터 비움.
//   · 다른 메뉴(정산 환불)에 후속 작업을 남기므로 「확인 필요(followups)」 항목 자동 생성 → 놓치지 않게.
//   · B2B 정산(settle_merit)은 불변. 환불은 현장 御請求書.
function settleDeepLink(seq){ const ym=($('#month-pick')&&$('#month-pick').value)||((state.from||'').slice(0,7)); return `settle.html?ym=${encodeURIComponent(ym)}&seq=${encodeURIComponent(seq)}`; }
// 프론트 데스크 딥링크(?seq): 그 팀이 배정된 방 카드로 스크롤 + 강조(rs-flash). 카드 뷰로 전환.
function focusTeamDeep(seq){
  if(typeof viewMode!=='undefined' && viewMode==='timeline'){ setView('card'); }   // 표 보기는 행으로 스크롤 가능
  setTimeout(()=>{
    const chips=[...document.querySelectorAll('.chip[data-seq="'+seq+'"],.tchip[data-seq="'+seq+'"]')];
    if(!chips.length){ toast(tx('deepNoRoom'),'warn'); return; }
    const rooms=[...new Set(chips.map(c=>c.closest('.room,.rrow')).filter(Boolean))];
    if(!rooms.length) return;
    rooms.forEach(el=>el.classList.add('rs-flash'));
    rooms[0].scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>rooms.forEach(el=>el.classList.remove('rs-flash')),2200);
  },140);
}
// memberById는 사본을 반환하므로 원본 state.members 항목을 직접 갱신해야 재렌더에 반영됨.
function patchMember(mid, patch){ for(const seq in state.members){ const hit=(state.members[seq]||[]).find(x=>x.id===mid); if(hit){ Object.assign(hit,patch); return; } } }
async function createFollowup(seq, area, kind, title, detail, link){
  try{ const {error}=await supa.from('followups').insert({ event_seq:seq, area, kind, title, detail:detail||null, link:link||null, created_by:_curUser()||null }); return !error; }
  catch(e){ return false; }
}
async function earlyCheckout(roomId, opts){
  const row=state.rooms.find(r=>r.id===roomId);
  if(!row || row.member_id==null){ toast(tx('splitOnlyMember'),'warn'); return; }
  const m=memberById(row.member_id);
  const name=m?(m.name_kr||''):'';
  const seq=row.event_seq;
  // 이미 조기퇴실로 설정된 경우 → 해제 제안
  if(m && m.actual_dep){
    if(!confirm(tx('ecoCancelConfirm',name,m.actual_dep))) return;
    const prevDep=m.actual_dep;
    const {error}=await supa.from('guest_members').update({actual_dep:null,actual_dep_reason:null}).eq('id',m.id);
    if(error){ toast(tx('ecoFail',error.message),'err'); return; }
    patchMember(m.id,{actual_dep:null,actual_dep_reason:null});
    // 방 자동 복구: 조기퇴실로 단축됐던 방(check_out===퇴실일)을 원래 퇴실일(팀 도착일)로 되돌림.
    //  정원 트리거가 충돌(그 침대를 다른 배정이 차지)을 막으면 복구 실패 → 수기 재배정 안내.
    const _g=state.guests.find(x=>x.event_seq===seq); const _arr=_g&&_g.arr; let restoreFail=false;
    if(_arr){
      for(const rr of memberRooms(m.id)){
        if(rr.check_out===prevDep && rr.check_out<_arr){
          const {error:eR}=await supa.from('rooms').update({check_out:_arr}).eq('id',rr.id);
          if(eR){ restoreFail=true; } else { rr.check_out=_arr; }
        }
      }
    }
    rebuildAssignMap();
    logAssign('조기퇴실 취소', `${name}(${teamGroupCode(seq)||evNo(seq)||''})${restoreFail?' — 방 복구 실패':' — 방 자동복구'}`);
    render(); toast(restoreFail?tx('ecoRestoreFail',name):tx('ecoCanceled',name), restoreFail?'warn':'ok'); return;
  }
  const def=state.focus||state.from;
  const d=(opts && opts.date) ? String(opts.date).trim() : (prompt(tx('ecoDatePrompt',name), def)||'').trim();
  if(!d) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast(tx('ecoBadDate'),'warn'); return; }
  const reason=(opts && opts.reason!=null) ? String(opts.reason).trim()
    : (prompt(tx('ecoReasonPrompt',name),'')||'').trim();
  // 1) actual_dep 기록
  const {error:e0}=await supa.from('guest_members').update({actual_dep:d,actual_dep_reason:reason||null}).eq('id',row.member_id);
  if(e0){ toast(tx('ecoFail',e0.message),'err'); return; }
  patchMember(row.member_id,{actual_dep:d,actual_dep_reason:reason||null});
  // 2) 그 사람 방 단축/해제 (분할 다건도 모두 반영)
  for(const rr of memberRooms(row.member_id)){
    if(rr.check_in>=d){                 // 퇴실일 이후 시작 방 → 불필요, 해제
      await supa.from('rooms').delete().eq('id',rr.id);
      state.rooms=state.rooms.filter(x=>x.id!==rr.id);
    } else if(rr.check_out>d){          // 퇴실일을 가로지름 → 퇴실일로 단축
      await supa.from('rooms').update({check_out:d,assign_source:'manual'}).eq('id',rr.id);
      rr.check_out=d; rr.assign_source='manual';
    }
  }
  // 3) 확인 필요(후속조치) 생성 — 정산/환불 확인 딥링크
  const ok=await createFollowup(seq,'settle','early_checkout', tx('ecoFollowTitle', name||(teamGroupCode(seq)||evNo(seq)||''), d), reason, settleDeepLink(seq));
  rebuildAssignMap(); render();
  logAssign('조기퇴실', `${name}(${teamGroupCode(seq)||evNo(seq)||''}) ${d} 퇴실 — 침대 해제${reason?(' / '+reason):''}`);
  toast(tx('ecoDone',name,d),'ok');
  if(!ok) toast(tx('ecoConfirmFail'),'warn');
}

// ── 객실 활성/비활성 토글 (담당자가 현장에서 켜고 끔) ──
async function toggleActive(inv){
  const next=!inv.active;
  // 비활성으로 끄는데 배정이 들어있으면 확인
  if(!next){
    const assigned=state.rooms.filter(r=>r.inventory_id===inv.id);
    if(assigned.length && !confirm(tx('toggleConfirm',inv.room_no))) return;
  }
  const {error}=await supa.from('room_inventory').update({active:next}).eq('id',inv.id);
  if(error){toast(tx('invActiveToggleFail',error.message),'err');return;}
  inv.active=next;
  render();
  toast(`${inv.room_no} → ${next?tx('roomNowUsable'):tx('roomNowInactive')}`, next?'ok':'warn');
}

// ── 단면도(원형 평면도) 프리뷰 모달 ──
// ── 자동배정 보류(미배정) 사유 목록 ────────────────────────────────────────
//  이전엔 콘솔에만 찍혀 현장에서 왜 안 됐는지 알 수 없었다(Min 2026-08) → 화면으로.
function updateHoldsBtn(){
  const b=$('#btn-holds'); if(!b) return;
  const n=(state.lastHolds||[]).length;
  b.style.display = n ? '' : 'none';
  b.textContent = tx('holdsBtn', n);
  b.title = tx('holdsBtnT');
}
function openHoldsModal(){
  const raw=state.lastHolds||[]; if(!raw.length){ toast(tx('holdsNone'),'ok'); return; }
  closeWizard();   // 배정 팝업이 열려 있으면 닫는다 — 닫았을 때 뒤에 남아 있으면 오작동처럼 보인다(Min 2026-08)
  // 사유 = 팀 카드로 보여준다(배정 팝업과 같은 모양) — 카드를 누르면 그 팀 배정 화면이 바로 열린다.
  //   예전엔 사유 문자열만 줄줄이 나와 "뭘 어떻게 하라는지" 알 수 없었다(Min 2026-08).
  const RULES=[
    ['oddTeam',  tx('holdCatOddTeam'),  tx('holdFixOddTeam'),  'splitOdd'],
    ['single',   tx('holdCatSingle'),   tx('holdFixSingle'),   'singleRemark'],
    ['noRoster', tx('holdCatNoRoster'), tx('holdFixNoRoster'), null],
    ['wait',     tx('holdCatWait'),     tx('holdFixWait'),     null],
    ['noFloor',  tx('holdCatNoFloor'),  tx('holdFixNoFloor'),  null],
    ['noRoom',   tx('holdCatNoRoom'),   tx('holdFixNoRoom'),   null],
    ['oddLeft',  tx('holdCatOddLeft'),  tx('holdFixOddLeft'),  null],
    ['etc',      tx('holdCatEtc'),      '',                    null]
  ];
  const OPT_LABEL={ splitOdd:tx('optSplitOdd'), allowSingle:tx('optAllowSingle'), singleRemark:tx('optSingleRemark') };
  const LABEL={}, FIX={}; RULES.forEach(([k,l,f])=>{ LABEL[k]=l; FIX[k]=f; });
  const holds=raw.map(h=>typeof h==='string'?{t:h,seq:null,cat:'etc'}:h);

  // 같은 팀의 사유는 카드 한 장으로 모은다
  const cards=[], at={};
  holds.forEach(h=>{
    const k=h.seq==null?('_'+cards.length):('s'+h.seq);
    if(at[k]==null){ at[k]=cards.length; cards.push({seq:h.seq, items:[h]}); }
    else cards[at[k]].items.push(h);
  });
  const catsOf=c=>[...new Set(c.items.map(h=>h.cat||'etc'))];
  const cnt={}; cards.forEach(c=>catsOf(c).forEach(k=>{ cnt[k]=(cnt[k]||0)+1; }));
  let filter='all';

  const cardHtml=c=>{
    const g=c.seq!=null?state.guests.find(x=>x.event_seq===c.seq):null;
    const reasons=c.items.map(h=>`<div class="hd-r"><span class="hd-cat">${esc(LABEL[h.cat]||LABEL.etc)}</span>${esc(h.t)}</div>`).join('');
    if(!g) return `<div class="hd-card hd-plain" data-cats="${esc(catsOf(c).join(' '))}" data-hay="${esc(c.items.map(h=>h.t).join(' ').toLowerCase())}">${reasons}</div>`;
    const rosterN=(state.members[g.event_seq]||[]).length;
    const left=unassignedMembers(g.event_seq).length;
    const gc=teamGroupCode(g.event_seq)||tx('codeUndecided');
    const isNon=(g.group_code||'').startsWith('F');
    const note=singleNote(g);
    const hay=[gc,g.rep,g.event_no,...c.items.map(h=>h.t),
      ...teamRoster(g.event_seq).map(m=>m.name_kr+' '+(m.name_en||''))].join(' ').toLowerCase();
    return `<button type="button" class="hd-card hd-team" data-seq="${g.event_seq}"
      data-cats="${esc(catsOf(c).join(' '))}" data-hay="${esc(hay)}"
      style="border-left:4px solid var(--${g.pfx==='K'?'k':g.pfx==='G'?'g':g.pfx==='S'?'s':'y'})">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <b style="font-family:var(--mono);color:var(--accent);font-size:14px">${esc(gc)}</b>
        <span class="mbadge ${isNon?'mb-non':'mb-mem'}">${isNon?t('rm_nonmember'):t('rm_member')}</span>
        ${String(g.status||'').includes('대기')?`<span class="sgb" style="background:#7a5aa8" title="${esc(tx('waitBadgeT'))}">${tx('waitBadge')}</span>`:''}
        ${note?`<span class="sgb">${tx('sgBadge')}</span>`:''}
        <span style="margin-left:auto;font-weight:800;color:var(--err)">${rosterN?tx('leftOf',left,g.pax):tx('rosterNone')+' · '+g.pax+tx('nameUnit')}</span>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-top:3px">${fmtMD(g.dep)}→${fmtMD(g.arr)} · ${teamNights(g)}${tx('nightUnit')} · ${esc(g.rep||'')} · ${esc(g.accom||'')}</div>
      ${reasons}
      <div class="hd-go">${tx('hdOpen')} →</div>
    </button>`;
  };

  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='holds-modal';
  const m=document.createElement('div'); m.className='modal'; m.style.maxWidth='760px';
  const chips=`<button type="button" class="ffbtn active" data-hdf="all">${tx('wzAll')} ${cards.length}</button>`
    +RULES.filter(([k])=>cnt[k]).map(([k,label])=>`<button type="button" class="ffbtn" data-hdf="${k}">${esc(label)} ${cnt[k]}</button>`).join('');
  const optCats=RULES.filter(([k,,,opt])=>opt&&cnt[k]);
  m.innerHTML=`<h2>${tx('holdsTitle',holds.length)}</h2>
    <div class="fac-filter" id="hd-chips" style="padding:8px 16px 0;display:flex">${chips}</div>
    <div style="padding:9px 16px 0"><input class="inp" id="hd-q" type="search" autocomplete="off" placeholder="${esc(tx('wzSearchTeam'))}" style="width:100%"></div>
    <div class="mbody" id="hd-body" style="max-height:58vh;overflow:auto;padding:9px 16px 4px">
      ${cards.map(cardHtml).join('')}
      <div id="hd-nohit" style="display:none;padding:24px;text-align:center;color:var(--muted)">${tx('wzNoTeam')}</div>
    </div>
    ${optCats.length?`<div style="padding:9px 16px 0;border-top:1px solid var(--border)">
      <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:6px">${tx('hdOptTitle')}</div>
      ${optCats.map(([k,label,,opt])=>`<label style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px;font-weight:700;
          background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:7px 10px;margin-bottom:6px;cursor:pointer">
          <input type="checkbox" class="hd-opt" data-opt="${opt}" style="margin-top:2px">
          <span>${esc(OPT_LABEL[opt])}<span style="display:block;font-weight:600;color:var(--text2)">${esc(label)} ${cnt[k]}</span></span></label>`).join('')}
    </div>`:''}
    <div class="mfoot">
      <button class="btn ghost sm" id="hd-close" type="button">${tx('close')}</button>
      ${optCats.length?`<button class="btn sm" id="hd-apply" type="button" disabled>${tx('holdsApply')}</button>`:''}
    </div>`;
  bg.appendChild(m); document.body.appendChild(bg);
  const close=()=>bg.remove();
  m.querySelector('#hd-close').addEventListener('click',close);
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });

  // 필터 칩 + 검색 (긴 목록이라 둘 다 필요 — CLAUDE.md §3-1)
  const q=m.querySelector('#hd-q');
  const apply=()=>{
    const kw=(q.value||'').trim().toLowerCase();
    let hit=0;
    m.querySelectorAll('.hd-card').forEach(el=>{
      const okC = filter==='all' || (el.dataset.cats||'').split(' ').includes(filter);
      const okQ = !kw || (el.dataset.hay||'').includes(kw);
      const on = okC && okQ; el.style.display = on?'':'none'; if(on) hit++;
    });
    m.querySelector('#hd-nohit').style.display = hit?'none':'';
  };
  m.querySelectorAll('[data-hdf]').forEach(b=>b.addEventListener('click',()=>{
    filter=b.dataset.hdf;
    m.querySelectorAll('[data-hdf]').forEach(x=>x.classList.toggle('active',x===b));
    apply();
  }));
  q.addEventListener('input',apply);

  // 카드 클릭 → 그 팀 배정 화면(위저드 2단계)로 바로
  m.querySelectorAll('.hd-team').forEach(b=>b.addEventListener('click',()=>{
    const seq=+b.dataset.seq; close(); openWizard(); _wzSeq=seq; renderWizard();
  }));

  const boxes=[...m.querySelectorAll('.hd-opt')];
  const btn=m.querySelector('#hd-apply');
  const sync=()=>{ if(btn) btn.disabled=!boxes.some(b=>b.checked); };
  boxes.forEach(b=>b.addEventListener('change',sync)); sync();
  if(btn) btn.addEventListener('click',async()=>{
    const opts={...AUTO_OPT_DEFAULT};
    boxes.forEach(b=>{ if(b.checked) opts[b.dataset.opt]=true; });
    close();
    AUTO_OPTS=opts;
    try{ await autoAssign(); } finally{ AUTO_OPTS={...AUTO_OPT_DEFAULT}; }
  });
}

function openFloorplanModal(zone, zoneRooms){
  const bg=document.createElement('div'); bg.className='modal-bg';
  const m=document.createElement('div'); m.className='modal'; m.style.maxWidth='640px';
  m.innerHTML=`<h2>${tx('floorplanTitle',zone)} <span style="font-size:11px;font-weight:600;color:var(--text2);margin-left:8px">${tx('floorplanSub')}</span></h2>
    <div class="mbody" id="fp-body" style="padding:10px 16px 18px"></div>
    <div class="mfoot"><button class="btn ghost sm" id="fp-close" type="button">${tx('close')}</button></div>`;
  bg.appendChild(m); document.body.appendChild(bg);
  m.querySelector('#fp-body').appendChild(renderFloorRing(zoneRooms));
  m.querySelector('#fp-close').addEventListener('click',()=>bg.remove());
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
}

// ── 야마나미 호텔동 층별 원형 평면도 (단면도 ①~⑭ 배치) ──
function renderFloorRing(zoneRooms){
  const wrap=document.createElement('div');
  wrap.className='floor-ring';
  // 가운데 EV/계단 표시
  wrap.innerHTML=`<div class="ring-core"><span>EV</span><span>EV</span></div>
    <div class="ring-compass c-n">N</div><div class="ring-compass c-s">S<small>입구</small></div>
    <div class="ring-compass c-e">E</div><div class="ring-compass c-w">W</div>`;
  zoneRooms.forEach(inv=>{
    const pos=inv.room_no.match(/(\d+)호/);
    const num=pos?parseInt(pos[1],10)%100:0;     // 끝 두 자리 = 위치 번호
    const xy=RING_POS[num];
    const node=document.createElement('div');
    const assigned=roomOccAt(inv.id, state.focus||state.from);   // 평면도도 기준일 하룻밤만
    const usedPax=assigned.reduce((s,r)=>s+(r.assigned_pax||0),0);
    node.className='ring-room t-'+inv.room_type+(inv.active?'':' inactive')+(assigned.length?' filled':'')+(usedPax>(inv.max_capacity||inv.capacity)?' warn':'');
    if(xy){ node.style.left=xy.x+'%'; node.style.top=xy.y+'%'; }
    else { node.style.position='relative'; node.style.display='inline-block'; } // 좌표 없으면 흐름배치
    const chips=assigned.map(r=>{
      const m=r.member_id!=null?memberById(r.member_id):null;
      const tag=m?personTag(r.event_seq,m.seq_in_team||1):(teamGroupCode(r.event_seq)||(tx('teamPrefix')+evNo(r.event_seq)));
      const nm=m?(m.name_kr||''):'';
      return `<span class="rchip"><b>${tag}</b> ${nm}</span>`;   // 평면도에선 ✕ 취소 없음(카드에서만)
    }).join('');
    node.innerHTML=`
      <span class="rlock" data-inv-id="${inv.id}" title="${inv.active?tx('lockOnT'):tx('lockOffT')}">${inv.active?'':'🔒'}</span>
      <div class="rno">${num}<small>${tx('roomNoSuffix')}</small></div>
      <div class="rtype" title="${typeLabel(inv.room_type,inv.facility,inv.zone)}">${TYPE_EN[inv.room_type]||inv.room_type}</div>
      <div class="rcap">${usedPax}/${inv.capacity}</div>
      <div class="rchips">${chips}</div>`;
    // 이벤트 (평면도에선 배정 취소 ✕ 없음 — 카드 보기에서만)
    node.querySelector('.rlock').addEventListener('click',ev=>{ev.stopPropagation();toggleActive(inv);});
    if(inv.active){
      node.addEventListener('dragover',e=>{e.preventDefault();node.classList.add('over');});
      node.addEventListener('dragleave',()=>node.classList.remove('over'));
      node.addEventListener('drop',e=>{e.preventDefault();node.classList.remove('over');
        assignSelectedTo(inv);});
    }
    wrap.appendChild(node);
  });
  return wrap;
}

function renderSummary(){
  // 기준일(그날 밤) 기준: 그날 묵는 인원 vs 그날 방 배정된 인원 (한 달 누적이 아니라 하룻밤).
  //   숙소 필터(fac-filter)가 켜져 있으면 그 숙소만 집계 → 단일 숙소 선택 시 그 숙소 미배정만 보임.
  const d=state.focus||state.from;
  // 숙소 필터 반영 + 「전체」(빈 필터)는 오프사이트(간지·시즈) 제외 = 야마나미 복합만.
  let stay=0; state.guests.forEach(g=>{ if(g.dep<=d && d<g.arr && _placeInScope(teamPlaceKeys(g),placeSel)) stay+=(g.pax||0); });
  let asg=0;  state.rooms.forEach(r=>{ if(!(r.check_in<=d && d<r.check_out)) return;
    const inv=invById(r.inventory_id); if(!_placeInScope(inv?roomPlaceKeys(inv):[],placeSel)) return;
    asg+=(r.assigned_pax||0); });
  const left=stay-asg, el=$('#assign-summary');
  el.innerHTML = `${fmtMD(d)} <b style="color:${(left<=0&&stay>0)?'var(--ok)':'inherit'}">${asg}/${stay}${tx('nameUnit')}</b>`
    + (left>0 ? ` <span style="color:var(--err);font-weight:700">${tx('summaryUnassigned',left)}</span>`
             : (stay>0 ? ` <span style="color:var(--ok);font-weight:700">${tx('summaryDone')}</span>` : ''));
  el.style.color=''; el.style.fontWeight='';
}

// ── 두 기간이 겹치는가 (체크인~체크아웃, 반개구간) ──
function overlaps(dep1,arr1,dep2,arr2){ return SZCore.overlaps(dep1,arr1,dep2,arr2); }  // 공유 모듈 위임

// ── 배정 ──
//  opts.byeolcheAdvance=true → 별채 온천 사전신청이 확정된 경로(현지예약 별채희망)에서
//    +2,000/박을 바로 기록. 그 외(수기 배정)는 사전신청 여부를 모달로 확인한다.
async function assignMembers(memberIds, inv, opts={}){
  if(!inv.active){toast(inv.room_no+': '+tx('inactiveRoomShort'),'warn');return;}
  const cap=inv.max_capacity||inv.capacity;
  // 대상 멤버를 팀별로 모아 검증/삽입
  const targets=[];
  for(const mid of memberIds){
    const m=memberById(mid); if(!m) continue;
    if(assignedMemberSet().has(mid)) continue; // 이미 배정됨
    targets.push(m);
  }
  if(!targets.length){toast(tx('noTargetMembers'),'warn');return;}

  // ── DB 권위 점유원장(다른 달 포함) — 월경계 더블부킹 방지. autoAssign과 동일 원칙. ──
  //   state.rooms는 로드된 달만 보므로, 다른 달 경계팀이 같은 방·겹치는 날을 점유해도
  //   합산에서 빠져 정원초과가 났다(회귀 버그). 대상 팀 체류구간에 걸치는 DB 전체 점유로 체크.
  let _occ=null;
  try{
    const _gs=targets.map(m=>state.guests.find(x=>x.event_seq===m.event_seq)).filter(Boolean);
    const _deps=_gs.map(g=>g.dep).filter(Boolean), _arrs=_gs.map(g=>g.arr).filter(Boolean);
    if(_deps.length&&_arrs.length){
      const spanFrom=_deps.reduce((a,b)=>a<b?a:b), spanTo=_arrs.reduce((a,b)=>a>b?a:b);
      const _r=await pagedQuery(()=>supa.from('rooms').select('id,inventory_id,assigned_pax,check_in,check_out,member_id,event_seq').lt('check_in',spanTo).gt('check_out',spanFrom).order('id'));
      if(!_r.error) _occ=_r.data||[];
    }
  }catch(e){ console.warn('점유원장 로드 실패, state.rooms 폴백:',e.message); }
  const _occBase=_occ||state.rooms;

  let ok=0, blocked=0; const blockMsg=[]; const byeolcheList=[]; const _logAssignNames=[];
  for(const m of targets){
    const g=state.guests.find(x=>x.event_seq===m.event_seq);
    if(!g){blocked++;continue;}
    const _clo=roomClosure(inv.id,g.dep,g.arr);
    if(_clo){ blocked++; blockMsg.push(tx('assignClosedT',inv.room_no,_clo.from_date,_clo.to_date,_clo.reason)); break; }
    // 이 방에서 기간 겹치는 기존 배정만 정원 합산(DB 권위 점유 = 다른 달 포함)
    const overlapRows=_occBase.filter(r=>r.inventory_id===inv.id && overlaps(g.dep,g.arr,r.check_in,r.check_out));
    const roomUsed=overlapRows.reduce((s,r)=>s+(r.assigned_pax||0),0);
    if(roomUsed>=cap){
      blocked++;
      // 누가·언제 쓰는지 명확히: 이름(그룹코드) 날짜~날짜  (코드만 나오던 문제 수정)
      const others=[...new Set(overlapRows.map(r=>{
        const mm=memberById(r.member_id);
        const gc=teamGroupCode(r.event_seq)||evNo(r.event_seq)||'';
        const nm=mm?(mm.name_kr||mm.name_en||''):'';
        const who=nm?(gc?`${nm}(${gc})`:nm):(gc||tx('unknown'));
        return `${who} ${fmtMD(r.check_in)}~${fmtMD(r.check_out)}`;
      }))].join(' / ');
      blockMsg.push(tx('assignBlocked',inv.room_no,others));
      break; // 더 넣어도 같은 방은 꽉 참
    }
    const row={
      event_seq:m.event_seq, member_id:m.id, inventory_id:inv.id,
      facility:inv.facility, room_type:inv.room_type, room_no:inv.room_no,
      check_in:g.dep, check_out:g.arr, assigned_pax:1
    };
    const {data,error}=await supa.from('rooms').insert(row).select().single();
    if(error){blocked++; blockMsg.push(`${m.name_kr||m.id}: ${error.message}`); continue;}
    state.rooms.push(data);
    if(_occ) _occ.push(data);   // 같은 호출 내 다음 멤버 정원 합산에 즉시 반영(DB 점유 배열)
    if(state.sel) state.sel.delete(m.id);
    ok++;
    _logAssignNames.push(`${m.name_kr||m.name_en||m.id}(${teamGroupCode(m.event_seq)||evNo(m.event_seq)||''})`);
    // 1인실 추가요금(간지) — 사람 단위 1명이므로 그대로 적용
    const nights=g.dep&&g.arr?Math.round((new Date(g.arr)-new Date(g.dep))/864e5):0;
    if(FEE_SINGLE[inv.facility] && nights>0){
      openSingleFeeModal(g, inv, nights, data.id, m);
    }
    // 시즈노야도 별채 = 객실은 본관과 동일 ¥17,000. 온천 사전신청 시에만 +2,000/박(별도).
    //   → 여기서 자동 청구하지 않고 모아뒀다가, 루프 후 경로에 따라 처리.
    if(inv.facility==='시즈노야도 료칸' && inv.zone==='별채' && nights>0){
      byeolcheList.push({g, m, nights});
    }
  }
  rebuildAssignMap(); render();
  if(_logAssignNames.length) logAssign('배정', `${inv.facility} ${inv.room_no} ← ${_logAssignNames.join(', ')}`);
  if(ok)   toast(tx('assignedN',inv.room_no,ok,blocked), blocked?'warn':'ok');
  else     toast(blockMsg[0]||tx('assignFail'),'warn');
  // 별채 온천 사전신청 추가요금: 확정 경로면 바로 기록, 수기 배정이면 모달로 확인
  if(byeolcheList.length){
    if(opts.byeolcheAdvance){ for(const x of byeolcheList) await recordByeolche(x.g, inv, x.nights, x.m); }
    else openByeolcheModal(inv, byeolcheList);
  }
}

// 별채 온천 사전신청 추가요금(¥2,000/박/인) 1건 기록
async function recordByeolche(g, inv, nights, m){
  if(!(nights>0)) return;
  try{ await supa.from('transactions').insert({
    event_seq:g.event_seq, member_id:m.id, category:'byeolche_charge',
    description:`별채 온천 사전신청비 (${inv.room_no}, ${nights}박)`,
    qty:nights, unit_price:BYEOLCHE_FEE, amount:BYEOLCHE_FEE*nights, currency:'JPY',
    posted_by:'front', settle_status:'onsite'
  }); toast(tx('bzRecorded',(BYEOLCHE_FEE*nights).toLocaleString(),m.name_kr||''),'ok'); }catch(e){}
}

// 수기로 별채에 배정했을 때: 온천 사전신청 인원만 골라 +2,000/박 기록(체크 안 하면 미기록)
function openByeolcheModal(inv, list){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <h2>${tx('bzTitle',inv.room_no)}</h2>
    <div class="mbody">
      <p style="font-size:12.5px;color:var(--text2);margin-bottom:10px">${tx('bzDesc',inv.room_no)}</p>
      <div class="mrow" style="grid-template-columns:1fr"><div>
        ${list.map((x,i)=>`<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer">
          <input type="checkbox" class="bz-chk" data-i="${i}" style="width:16px;height:16px">
          ${x.m.name_kr||tx('bzNoName')} <span class="desc">· ${x.nights}${tx('bzNight')} → +¥${(BYEOLCHE_FEE*x.nights).toLocaleString()}</span></label>`).join('')}
      </div></div>
    </div>
    <div class="mfoot">
      <button class="btn ghost sm" id="bz-skip" type="button">${tx('bzSkip')}</button>
      <button class="btn sm" id="bz-save" type="button">${tx('bzSave')}</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector('#bz-skip').addEventListener('click',close);
