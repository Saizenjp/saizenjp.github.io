<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 호텔 방배정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* 디자인 리프레시: 중립 회색 캔버스 + 올리브는 '강조'에만 (모던 SaaS 톤) */
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;   /* 중립 그레이 본문/보조 */
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e9eede;  /* 사이젠 올리브 / 골드 (강조 전용) */
    --accentDeep:#4c5a37;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    /* 숙소별 포인트색 (사이젠 앱 표준) */
    --y:#1e3a8a; --k:#5b21b6; --g:#065f46; --s:#92400e;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);line-height:1.55;min-height:100vh;
  }
  .topbar{
    position:sticky;top:0;z-index:30;background:var(--surface);
    border-bottom:3px solid var(--accent);padding:13px 22px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    box-shadow:0 1px 4px rgba(15,23,42,.06);
  }
  .topbar h1{font-size:19px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.connected:hover{background:#266a45}

  /* 연결 바 */
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .conn .hint{font-size:11px;color:var(--muted)}

  /* 날짜 선택 */
  .datebar{padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .datebar label{font-size:12px;color:var(--text2);font-weight:600}
  .mode-toggle{display:inline-flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
  .mode-btn{font-family:inherit;font-size:12px;font-weight:700;padding:6px 13px;border:none;background:var(--surface);color:var(--text2);cursor:pointer;transition:.12s}
  .mode-btn.active{background:var(--accent);color:#fff}
  .mode-btn:not(.active):hover{background:var(--accentSoft)}
  .datebar .legend{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--text2);align-items:center}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}

  /* 2단 레이아웃 */
  .stage{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 20px;align-items:start}
  /* 좌측 미배정 팀 패널 = 스크롤 동행(고정바 아래 sticky, 길면 내부 스크롤). 순수 CSS라 랙 없음 */
  /* 컨트롤 바(월·버튼+날짜칩) = 상단 topbar 아래 고정. top은 JS가 topbar 높이로 동기화. */
  .ctrlbar{position:sticky;top:56px;z-index:25;background:var(--bg);box-shadow:0 4px 8px -5px rgba(0,0,0,.22)}
  /* 좌측 미배정 패널 = 컨트롤 바 아래에 고정(높이는 JS가 --stick2로 계산) */
  .stage > .col:first-child{position:sticky;top:var(--stick2,150px);max-height:calc(100vh - var(--stick2,150px) - 12px);overflow:auto}
  @media(max-width:860px){.stage{grid-template-columns:1fr}.stage > .col:first-child{position:static;max-height:none;overflow:visible}}

  .col{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .col > h2{font-size:14px;font-weight:800;padding:12px 16px;border-bottom:2px solid var(--accentSoft);background:var(--surface2);color:var(--accent);display:flex;align-items:center;gap:8px}
  .col > h2 .cnt{font-size:12px;color:var(--text2);font-weight:700;margin-left:auto}
  .col-body{padding:13px;min-height:120px}

  /* 미배정 팀 카드 */
  .team-card{
    background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--muted);
    border-radius:8px;padding:10px 12px;margin-bottom:9px;cursor:grab;transition:.12s;
  }
  .team-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(15,23,42,.1)}
  .team-card.dragging{opacity:.4}
  .team-card.acc-Y{border-left-color:var(--y)} .team-card.acc-K{border-left-color:var(--k)}
  .team-card.acc-G{border-left-color:var(--g)} .team-card.acc-S{border-left-color:var(--s)}
  .team-card .tag{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--accent)}
  .team-card .tag.none{color:var(--muted);font-weight:600}
  .team-card .mbadge{font-size:9.5px;font-weight:700;border-radius:4px;padding:2px 6px;line-height:1;white-space:nowrap}
  .team-card .mbadge.mb-mem{color:var(--surface);background:var(--accent)}
  .team-card .mbadge.mb-non{color:var(--text2);background:var(--surface3);border:1px solid var(--border2)}
  .team-card .meta{font-size:13px;color:var(--text2);margin-top:3px}
  .team-card .evno{font-size:10px;font-weight:700;color:var(--accent2);background:var(--surface3);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;font-family:var(--mono);white-space:nowrap}
  .team-card .pax{display:inline-block;font-weight:700;color:var(--text)}
  .team-card .rtype{font-size:12px;color:var(--accent2);font-weight:700;margin-top:4px}
  .team-card .tag-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .team-card .roster{margin-top:7px;border-top:1px solid var(--border);padding-top:6px;display:flex;flex-direction:column;gap:3px}
  .team-card .rmember{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:baseline;font-size:12px;line-height:1.35}
  .team-card .rmember.rep{font-weight:700}
  .team-card .rmember.dim{color:var(--muted);font-size:11px}
  .team-card .rtag{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700}
  .team-card .rname{color:var(--text)}
  .team-card .rname .repbadge{display:inline-block;font-size:8.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:3px;padding:1px 4px;margin-left:5px;font-style:normal;vertical-align:middle}
  .team-card .ren{grid-column:2;font-family:var(--mono);font-size:10.5px;color:var(--text2);margin-top:-1px}
  /* 객실 칩: 그룹코드 헤더 + 사람 명단 */
  .room .chip{flex-direction:column;align-items:stretch;gap:3px}
  .room .chip .chip-head{display:flex;align-items:center;gap:6px}
  .room .chip .cpeople{display:flex;flex-direction:column;gap:1px;padding-left:2px}
  .room .chip .cperson{font-size:11px;color:var(--text2);line-height:1.3}
  .room .chip .cperson b{color:var(--text);font-weight:700}

  /* 시설 그룹 */
  .fac{margin-bottom:22px}
  .fac > h3{font-size:14.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .fac > h3 .dot{width:11px;height:11px;border-radius:2px}
  .fac.f-Y h3 .dot{background:var(--y)} .fac.f-K h3 .dot{background:var(--k)}
  .fac.f-G h3 .dot{background:var(--g)} .fac.f-S h3 .dot{background:var(--s)}
  .fac > h3 .util{font-size:12px;color:var(--text2);font-weight:600;margin-left:auto}
  .zone-label{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 7px;padding-left:2px;display:flex;align-items:center;gap:10px}
  .floorplan-btn{font-family:inherit;font-size:11px;font-weight:700;color:var(--accent);background:var(--accentSoft);border:1px solid #c4ddcc;border-radius:6px;padding:3px 11px;cursor:pointer;transition:.12s}
  .floorplan-btn:hover{background:var(--accent);color:#fff}

  .rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
  .room{
    background:var(--surface2);border:1px dashed var(--border2);border-radius:9px;
    padding:11px 13px 12px;min-height:80px;transition:.12s;position:relative;
  }
  .room.over{border-color:var(--accent);border-style:solid;background:var(--accentSoft)}
  .room.filled{border-style:solid;background:#fff;border-color:var(--accent);box-shadow:0 1px 4px rgba(15,23,42,.1)}
  .room.inactive{opacity:.5;background:repeating-linear-gradient(45deg,#f0eee7,#f0eee7 6px,#e9e6dd 6px,#e9e6dd 12px)}
  .room .rn{font-size:15px;font-weight:800}
  .room .rt{font-size:12px;color:var(--text2);margin-top:1px}
  /* 본관/별채 등 zone을 약하게(실제 객실명 옆 작은 muted 라벨) */
  .zone-pin{font-size:9px;font-weight:600;color:var(--muted);margin-left:5px;vertical-align:middle;letter-spacing:.02em}
  .zone-pin.bz{color:var(--s)}
  .room .cap{position:absolute;top:9px;right:11px;font-size:12px;color:var(--muted);font-family:var(--mono);font-weight:600}
    .room .lock{position:absolute;bottom:8px;right:10px;font-size:14px;cursor:pointer;opacity:.5;transition:.12s;user-select:none}
  .room .lock:hover{opacity:1;transform:scale(1.15)}
  .room .assigned{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .room .chip{
    display:flex;align-items:center;gap:6px;background:var(--accentSoft);border:1px solid #c4ddcc;
    border-radius:6px;padding:4px 8px;font-size:12.5px;
  }
  .room .chip .ctag{font-family:var(--mono);font-weight:700;color:var(--accent)}
  .room .chip .cx{margin-left:auto;cursor:pointer;color:var(--err);font-weight:700;padding:0 4px;font-size:13px}
  .room .chip .csplit{margin-left:auto;cursor:pointer;color:var(--accent2);font-weight:700;padding:0 3px;font-size:12px}
  .room .chip .csplit:hover{color:var(--accentDeep)}
  /* 체크인(오늘 입실)=초록 강조 / 연박(체류중)=차분한 블루 / 퇴실(오늘 마지막밤)=골드 */
  .room .chip.chip-in{border-left:4px solid var(--accent);background:#e6f1e3}
  .room .chip.chip-cont{border-left:4px solid #6b8cb5;background:#eef2f7;border-color:#cfdcea}
  .room .chip.chip-out{border-left:4px solid var(--accent2);background:#fbf4e6;border-color:#e6d3a3}
  .room .chip .cflag{font-size:8.5px;font-weight:800;border-radius:4px;padding:1px 5px;white-space:nowrap;line-height:1.4}
  .room .chip .cf-in{color:#fff;background:var(--accent)}
  .room .chip .cf-cont{color:#2b4a6b;background:#dbe6f2;border:1px solid #b9cde0}
  .room .chip .cf-out{color:#fff;background:var(--accent2)}
  .room .chip .cdate{font-size:9.5px;color:var(--muted);font-family:var(--mono);margin-left:4px}
  /* 팀묶음 칩: 헤더(그룹코드·인원·기간) + 멤버 행들 */
  .room .chip .cnum{font-size:9px;font-weight:800;color:var(--text2);background:rgba(255,255,255,.65);border-radius:4px;padding:0 5px}
  .room .chip .cmems{display:flex;flex-direction:column;gap:1px;margin-top:3px}
  .room .chip .cmem{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text);line-height:1.5}
  .room .chip .cmem b{font-weight:700}
  .room .chip .cmem .cmen{font-size:9.5px;color:var(--muted);font-family:var(--mono)}
  .room .chip .cmem .cmem-act{margin-left:auto;display:flex;gap:3px;align-items:center}
  .room .chip .cmem .cx,.room .chip .cmem .csplit{margin-left:0;font-size:11px}
  .room .chip .csplit + .cx{margin-left:4px}
  .room .chip .cpax{color:var(--text2)}
  .room .chip .cen{flex-basis:100%;font-size:10.5px;color:var(--text2);font-family:var(--mono);margin-top:2px;line-height:1.3}
  .room.warn{border-color:var(--err)!important;background:#fbeeeb!important;box-shadow:0 0 0 1px var(--err)}  /* 초과=위험(빨강) */
  .room.full{border-color:var(--ok)!important;background:#edf6ee!important}                                   /* 정원 꽉참=깔끔(초록) */
  .room.partial{border-color:var(--warn)!important;background:#fbf6e9!important}                              /* 정원 미달=주의(앰버) */
  .room.full .cap{color:var(--ok);font-weight:700} .room.partial .cap{color:var(--warn);font-weight:700} .room.warn .cap{color:var(--err);font-weight:700}
  .room .badge{position:absolute;bottom:8px;right:10px;font-size:10px;font-weight:700;color:var(--warn)}
  .room .note{font-size:11px;color:var(--muted);margin-top:3px}

  .empty-hint{font-size:12px;color:var(--muted);text-align:center;padding:24px 0}

  /* 호텔동 원형 평면도 */
  .floor-ring{position:relative;width:100%;max-width:560px;margin:6px auto 22px;aspect-ratio:1/0.92}
  .ring-core{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;gap:4px;z-index:1}
  .ring-core span{background:var(--surface3);border:1px solid var(--border2);border-radius:4px;font-size:9px;color:var(--text2);padding:8px 9px;font-weight:700}
  .ring-compass{position:absolute;font-size:11px;font-weight:800;color:var(--accent2);z-index:2;letter-spacing:.02em}
  .ring-compass.c-n{left:50%;top:-7px;transform:translateX(-50%)}
  .ring-compass.c-s{left:50%;bottom:-9px;transform:translateX(-50%);text-align:center;line-height:1}
  .ring-compass.c-s small{display:block;font-size:8px;font-weight:700;color:var(--text2)}
  .ring-compass.c-e{right:-9px;top:50%;transform:translateY(-50%)}
  .ring-compass.c-w{left:-9px;top:50%;transform:translateY(-50%)}
  .ring-room{position:absolute;width:15%;min-width:74px;transform:translate(-50%,-50%);
    background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:5px 4px 6px;
    text-align:center;cursor:default;transition:.12s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .ring-room.over{border-color:var(--accent);border-width:2px;background:var(--accentSoft)}
  .ring-room.filled{box-shadow:0 2px 7px rgba(0,0,0,.12)}
  .ring-room.inactive{opacity:.45;background:repeating-linear-gradient(45deg,#f0eee7,#f0eee7 5px,#e9e6dd 5px,#e9e6dd 10px)}
  .ring-room.warn{border-color:var(--warn)}
  .ring-room .rno{font-size:15px;font-weight:800;color:var(--text);line-height:1}
  .ring-room .rno small{font-size:9px;font-weight:600;color:var(--muted)}
  .ring-room .rtype{font-size:8.5px;font-weight:700;margin-top:1px;line-height:1.1}
  .ring-room .rcap{font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:1px}
  .ring-room .rlock{position:absolute;top:2px;right:4px;font-size:9px;cursor:pointer}
  .ring-room .rchips{display:flex;flex-direction:column;gap:2px;margin-top:3px}
  .ring-room .rchip{font-size:9px;background:var(--accentSoft);border-radius:3px;padding:1px 3px;display:flex;align-items:center;gap:3px;justify-content:center}
  .ring-room .rchip b{font-family:var(--mono);color:var(--accent);font-size:9px}
  .ring-room .rcx{cursor:pointer;color:var(--err);font-weight:700;margin-left:auto}
  /* 타입별 상단 색 띠 */
  .ring-room.t-디럭스더블트윈{border-top:3px solid #b5862f}
  .ring-room.t-디럭스트윈{border-top:3px solid #c9a44a}
  .ring-room.t-트윈{border-top:3px solid #1e3a8a}
  .ring-room.t-컴팩트트윈{border-top:3px solid #5b8ad4}
  .ring-room.t-트리플{border-top:3px solid #5b21b6}
  .ring-room.t-싱글{border-top:3px solid #6b7a90}
  .ring-room.t-더블{border-top:3px solid #065f46}
  .ring-empty-note{font-size:11px;color:var(--muted);text-align:center;margin-top:-12px}
  @media(max-width:600px){.floor-ring{max-width:100%}.ring-room{min-width:58px;font-size:8px}}

  /* 로그 토스트 */
  #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);animation:popUp .2s;text-align:center;min-width:200px}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}
  @keyframes popUp{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  /* 호텔동 호실 입력 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(40,39,34,.4);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal h2{font-size:15px;font-weight:800;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal .mbody{padding:18px 20px}
  .modal .mrow{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;margin-bottom:10px}
  .modal .mrow label{font-size:13px;font-weight:600}
  .modal .mrow .desc{font-size:11px;color:var(--muted)}
  .modal .mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* 개인 단위 배정 UI — 색은 사이젠 CSS 변수만 참조(HEX 하드코딩 금지) */
.rmember{cursor:pointer;user-select:none;border-radius:6px}
.rmember:hover{background:var(--surface3)}
.rmember .mchk{margin:0;cursor:pointer;accent-color:var(--accent)}
.rmember.sel{background:var(--accentSoft);outline:1px solid var(--accent)}
.rmember.done{opacity:.5}
.rmember.done .mchk{cursor:not-allowed}
.rmember .rdone{font-size:10px;color:var(--accent);margin-left:auto;font-weight:600}
#sel-bar .pill{background:var(--accent);color:#fff}
.room{cursor:pointer;user-select:none;-webkit-user-select:none}

<script>
// ════════════════════════════════════════════════════════════════════════
//  SaiZen Hub — STEP 2 호텔 방배정 모듈
//  · 좌: 그날 체크인 미배정 팀(guests)  · 우: 시설별 객실(room_inventory)
//  · 드래그앤드롭 → rooms 기록. 1인실 추가요금(간지·시즈노야도 4,400/박) 자동 transactions.
//  · 판매분류→현장등급 매핑은 ROOMTYPE_MAP 한 곳에서만 관리(예약정책 바뀌면 여기만 수정).
// ════════════════════════════════════════════════════════════════════════
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let _selInit=true;
let supa=null;
let state={ date:null, guests:[], rooms:[], inventory:[], assignMap:{}, members:{} }; // members: event_seq → [guest_members]
// 표시는 행사번호(event_no, guests에 적재). 없으면 event_seq 폴백. (예약번호=event_seq는 내부키)
function evNo(seq){ const g=state.guests.find(x=>x.event_seq===seq); return (g&&g.event_no)||seq; }

// ── 숙소 prefix (v13.4 동일) ──
const PFX={'야마나미리조트':'Y','쿠주힐즈':'K','간지호텔':'G','시즈노야도 료칸':'S'};
const FEE_SINGLE={'간지호텔':4400}; // 1인 사용 추가요금/박
const BYEOLCHE_FEE=2000;           // 시즈노야도 별채 사전희망 추가요금/박/인

// ── 판매분류(booking roomType) → 야마나미 현장 등급 기본값 ──
//   예약 정책이 '통합 리조트 숙박'으로 바뀌면 이 표만 수정하면 됨.
//   ※ 현장 실제 타입(엑셀 기준): 디럭스더블트윈/디럭스트윈/트윈/컴팩트트윈/트리플/싱글/더블
const ROOMTYPE_MAP={
  '호텔 트윈':'트윈',          // 표준 트윈
  '호텔 소형트윈':'컴팩트트윈', // 舊 SGL+SGL
  '돔하우스':'트윈',          // 돔하우스 동
  '관내별장':null,            // 소보/아소 현장 지정
  '장기숙박전용':'2인1동',    // 쿠주
  '호텔':'트윈',              // 간지
  '료칸':'트윈',              // 시즈노야도
};

// ── 객실 타입 한글 → 영문 (외국인 직원용 병기) ──
const TYPE_EN={
  '디럭스더블트윈':'Deluxe Double Twin','디럭스트윈':'Deluxe Twin','트윈':'Twin',
  '컴팩트트윈':'Compact Twin','트리플':'Triple','싱글':'Single','더블':'Double',
  '4인실':'Quad Room','8인실':'Octa Room','2인1동':'Cottage (2p)',
};
function typeLabel(t){const en=TYPE_EN[t];return en?`${t} · ${en}`:t;}
// 시즈노야도 등 본관/별채 zone 을 객실명 옆에 약하게 표기(실제 객실명이 주, zone 은 보조).
function zonePin(inv){
  const z=inv&&inv.zone;
  if(inv&&inv.facility==='시즈노야도 료칸'&&(z==='본관'||z==='별채'))
    return `<small class="zone-pin${z==='별채'?' bz':''}">${z==='별채'?'別棟':'本館'}</small>`;
  return '';
}

// ── 야마나미 호텔동 원형 배치 좌표 (단면도 ①~⑭ 기준, %). 4·13 결번 ──
//   가운데 EV, 북(쿠쥬)=상단. 호수 끝 두 자리 = 위치 번호.
const RING_POS={
  3:{x:38,y:6}, 5:{x:62,y:6},
  2:{x:22,y:18}, 6:{x:78,y:18},
  1:{x:11,y:37}, 7:{x:89,y:37},
  14:{x:11,y:60}, 8:{x:89,y:60},
  12:{x:22,y:79}, 9:{x:78,y:79},
  11:{x:38,y:91}, 10:{x:62,y:91},
};

function toast(msg,cls){
  const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:'');
  t.textContent=msg; $('#toast').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);
}
// 되돌리기 버튼이 달린 토스트(6초) — 배정 해제 직후 같은 방으로 즉시 복구. 취소 알림이라 빨강.
function toastUndo(msg,onUndo){
  const t=document.createElement('div'); t.className='toast err';
  t.innerHTML=`<span></span> <button type="button" class="tu-btn" style="margin-left:10px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:6px;padding:2px 9px;font-weight:800;cursor:pointer;font-family:inherit">↩ 되돌리기</button>`;
  t.querySelector('span').textContent=msg;
  t.querySelector('.tu-btn').addEventListener('click',()=>{ t.remove(); onUndo(); });
  $('#toast').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},6000);
}
// 해제했던 배정(snapshot 배열)을 같은 방·기간으로 다시 삽입
async function restoreRooms(snaps){
  if(!supa || !snaps || !snaps.length) return;
  const rows=snaps.map(s=>({ event_seq:s.event_seq, member_id:s.member_id, inventory_id:s.inventory_id,
    facility:s.facility, room_type:s.room_type, room_no:s.room_no,
    check_in:s.check_in, check_out:s.check_out, assigned_pax:s.assigned_pax, assign_source:s.assign_source }));
  const {data,error}=await supa.from('rooms').insert(rows).select();
  if(error){ toast('되돌리기 실패: '+error.message,'err'); return; }
  (data||[]).forEach(r=>state.rooms.push(r));
  rebuildAssignMap(); render();
  toast('↩ 되돌렸습니다','ok');
}
function _roomSnap(row){ if(!row) return null; const s={...row}; delete s.id; return s; }
function setConn(txt,cls){const e=$('#conn-state');e.textContent=txt;e.className='pill'+(cls?' '+cls:'');}

// ── 날짜/통계 헬퍼 ──
function isoToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function isoShift(iso,delta){const d=new Date((iso||isoToday())+'T00:00:00');d.setDate(d.getDate()+delta);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtMD(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${+m[2]}/${+m[3]}`:'-';}
function teamNights(g){if(!g.dep||!g.arr)return 0;return Math.max(0,Math.round((new Date(g.arr)-new Date(g.dep))/864e5));}
// 특정 객실의 '기준일(state.from) 하룻밤' 점유 행들 (카드 보기 = 그날 현황)
function roomOccAt(invId, d){
  return state.rooms.filter(r=>r.inventory_id===invId && (!d || (r.check_in<=d && d<r.check_out)));
}
// 기간 폐쇄: 체류 [dep,arr) 가 폐쇄 [from_date,to_date](종료 포함)와 겹치면 그 폐쇄 반환
function roomClosure(invId, dep, arr){
  return (state.closures||[]).find(c=>c.inventory_id===invId && dep<=c.to_date && arr>c.from_date) || null;
}
// 기준 하룻밤(focus) 폐쇄 여부
function roomClosedFocus(invId){
  const d=state.focus||state.from; if(!d) return null;
  const nx=fmtDate(addDays(parseISO(d),1));
  return roomClosure(invId, d, nx);
}
function parseISO(s){ const p=String(s).slice(0,10).split('-'); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }
function addDays(dt,n){ const d=new Date(dt); d.setDate(d.getDate()+n); return d; }
function fmtDate(d){ return SZCore.fmtDate(d); }  // 공유 모듈 위임
// ── 배정 맥락: 인원을 선택하면 카드/카운트를 '그 팀 체류기간' 점유로 보이게(빈 듯해도 그 기간 사용중이면 꽉 참) ──
function selAssignSpan(){
  if(!state.sel || !state.sel.size) return null;
  let dep=null, arr=null;
  state.sel.forEach(mid=>{ const m=memberById(mid); if(!m) return;
    const g=state.guests.find(x=>x.event_seq===m.event_seq); if(!g||!g.dep||!g.arr) return;
    if(dep===null||g.dep<dep) dep=g.dep; if(arr===null||g.arr>arr) arr=g.arr; });
  return (dep&&arr)?{dep,arr}:null;
}
// 기간 [dep,arr) 동안 그 방의 점유 행 + '하룻밤 최대 점유'(정원 판정 = 막힘 로직과 동일 프레임)
function roomOccOver(invId, dep, arr){
  const rows=state.rooms.filter(r=>r.inventory_id===invId && overlaps(dep,arr,r.check_in,r.check_out));
  const days=new Set([dep]); rows.forEach(r=>{ if(r.check_in>dep && r.check_in<arr) days.add(r.check_in); });
  let peak=0; days.forEach(d=>{ if(d<arr){ const u=rows.filter(r=>r.check_in<=d && d<r.check_out).reduce((s,r)=>s+(r.assigned_pax||0),0); if(u>peak) peak=u; } });
  return {rows, peak};
}
function roomUsedPax(inv){
  const span=selAssignSpan();
  if(span) return roomOccOver(inv.id, span.dep, span.arr).peak;     // 선택팀 기간 기준
  return roomOccAt(inv.id, state.focus||state.from).reduce((s,r)=>s+(r.assigned_pax||0),0);   // 평소=기준일 하룻밤
}
// 한 사람의 배정 객실(분할이면 여러 개) · 라벨 · 일괄 해제
function memberRooms(mid){return state.rooms.filter(r=>r.member_id===mid);}
function memberRoomLabel(mid){const rs=memberRooms(mid);return rs.length?[...new Set(rs.map(r=>r.room_no))].join(', '):'배정완료';}
async function unassignMember(mid){
  const rs=memberRooms(mid); const snaps=[];
  for(const r of rs){ const s=await unassign(r.id,{silent:true}); if(s) snaps.push(s); }
  rebuildAssignMap(); render();
  if(snaps.length) toastUndo(`배정 해제${snaps.length>1?` (${snaps.length}건)`:''}`, ()=>restoreRooms(snaps));
}
// ── 월 선택: 그 달 1일~말일을 범위로, 일별 칩은 그 달 전체 ──
function lastDayOfMonth(ym){ const [y,m]=ym.split('-').map(Number); return `${ym}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`; }
async function loadMonth(ym, focusDay){
  if(!ym) return;
  $('#month-pick').value=ym;
  $('#date-pick').value=ym+'-01';
  $('#date-to').value=lastDayOfMonth(ym);

  if(focusDay){ state.focus=focusDay; render(); }
}
function shiftMonth(delta){
  const ym=$('#month-pick').value||isoToday().slice(0,7);
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  loadMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
}
function gotoToday(){ const t=isoToday(); loadMonth(t.slice(0,7), t); }

// ── 선택 범위에 점유 중인 팀 + 배정 로드 ──
//   하루 모드: from=to=선택일 → 그날 머무는(dep<=날<arr) 모든 팀
//   기간 모드: from~to → 그 기간에 한 번이라도 머무는 팀 (dep < to+1 AND arr > from)
// Supabase 기본 1000행 제한 회피 — event_seq IN 조회를 id 순으로 페이지네이션(전 행 로드)
async function pagedInSeq(table, sel, seqs){
  let out=[], pg=0;
  while(true){
    const {data,error}=await supa.from(table).select(sel).in('event_seq',seqs).order('id').range(pg,pg+999);
    if(error) return {error};
    out=out.concat(data||[]);
    if(!data || data.length<1000) break;
    pg+=1000;
  }
  return {data:out};
}
// 임의 쿼리(빌더 팩토리)를 1000행 제한 없이 전부 로드. buildFn()은 매번 새 쿼리(.order 포함) 반환.
async function pagedQuery(buildFn){
  let out=[], pg=0;
  while(true){
    const {data,error}=await buildFn().range(pg,pg+999);
    if(error) return {error};
    out=out.concat(data||[]);
    if(!data || data.length<1000) break;
    pg+=1000;
  }
  return {data:out};
}
async function loadDay(){
  const from=$('#date-pick').value;
  let to = $('#date-to').value || from;     // 종료 비우면 단일일
  if(!from){toast('날짜를 선택하세요','warn');return;}
  if(to<from) to=from;                       // 종료<시작이면 단일일로 보정
  state.from=from; state.to=to; state.date=from; state.focus=from; state.days=new Set(); state.splitPending=null;   // 기준일=시작, 일별선택·분할모드 초기화

  // 점유 판정: dep_date <= to(범위끝) AND arr_date > from(범위시작)
  //   → 그 기간에 체크인~체크아웃이 한 번이라도 걸치는 팀
  const gres=await pagedQuery(()=>supa
    .from('guests')
    .select('event_seq,team_tag,group_code,accom,accom_prefix,pax,check_status,bookings!inner(event_no,rep_name,dep_date,arr_date,product_name,member_type,remark)')
    .lte('bookings.dep_date',to)
    .gt('bookings.arr_date',from)
    .order('event_seq'));
  if(gres.error){toast('팀 로드 실패: '+gres.error.message,'err');return;}
  const g=gres.data;
  state.guests=(g||[]).map(x=>({
    event_seq:x.event_seq, team_tag:x.team_tag, group_code:x.group_code,
    accom:x.accom, pfx:x.accom_prefix||PFX[x.accom]||'X', pax:x.pax,
    rep:x.bookings?.rep_name||'', dep:x.bookings?.dep_date, arr:x.bookings?.arr_date,
    event_no:x.bookings?.event_no||'',   // 행사번호(예약순 표시·우선순위)
    member_type:x.bookings?.member_type||'',
    remark:x.bookings?.remark||'',
    isNewCheckin: x.bookings?.dep_date===from,   // 이 범위 시작일에 신규 체크인
    sale_type:guessSaleType(x.bookings?.product_name, x.accom),
  }));
  // 기존 배정 rooms 로드
  const seqs=state.guests.map(g=>g.event_seq);
  state.rooms=[];
  state.members={};
  if(seqs.length){
    const rr=await pagedInSeq('rooms','*',seqs);
    if(rr.error){toast('배정 로드 실패: '+rr.error.message,'err');return;}
    state.rooms=rr.data||[];
    const mm=await pagedInSeq('guest_members','id,event_seq,seq_in_team,name_kr,name_en,is_rep,member_grade,member_class,member_div',seqs);
    if(mm.error){toast('명단 로드 실패: '+mm.error.message,'warn');}
    else (mm.data||[]).forEach(x=>{(state.members[x.event_seq]=state.members[x.event_seq]||[]).push(x);});
  }
  // 기간 폐쇄(잠금) 로드 — 범위에 겹치는 폐쇄(from_date<=to AND to_date>=from)
  state.closures=[];
  try{
    const cl=await supa.from('room_closures').select('*').lte('from_date',to).gte('to_date',from);
    if(!cl.error) state.closures=cl.data||[];
  }catch(e){}
  state.sel=new Set();
  rebuildAssignMap();
  render();
  const label = (state.from===state.to) ? state.from : `${state.from}~${state.to}`;
  toast(`${label} · 점유 ${state.guests.length}팀 로드`,'ok');
}

function guessSaleType(pname,accom){
  const s=String(pname||'');
  if(accom==='야마나미리조트'){
    if(s.includes('소형트윈')) return '호텔 소형트윈';
    if(s.includes('돔하우스')) return '돔하우스';
    if(s.includes('별장')) return '관내별장';
    return '호텔 트윈';
  }
  if(accom==='쿠주힐즈') return '장기숙박전용';
  if(accom==='간지호텔') return '호텔';
  if(accom==='시즈노야도 료칸') return '료칸';
  return '';
}

function rebuildAssignMap(){
  state.assignMap={};
  state.rooms.forEach(r=>{
    const k=r.inventory_id||('_free_'+r.id);
    (state.assignMap[k]=state.assignMap[k]||[]).push(r);
  });
}

function renderDayStrip(){

  // 그 날 현지도착인데 아직 미배정인 팀 수(=0 되도록 맞추면 그 날짜 완료)
  const unByDate={}; state.guests.forEach(g=>{ if(g.dep && unassignedMembers(g.event_seq).length>0) unByDate[g.dep]=(unByDate[g.dep]||0)+1; });
  const chip=(d,active)=>{
    const wd=WD[new Date(d+'T00:00:00').getDay()]; const we=(wd==='토'||wd==='일'); const cin=inByDate[d]||0; const un=unByDate[d]||0;
    return `<button class="day-chip${active?' active':''}${we?' we':''}" data-d="${d}" title="${d} · 체크인 ${cin}팀 · 미배정 도착 ${un}팀">${fmtMD(d)}<small>${wd}</small>${cin?`<span class="dcnt">+${cin}</span>`:''}${un?`<span class="dun">미${un}</span>`:''}</button>`;
  };
  if(viewMode==='timeline'){
    const all=state.days.size===0;
    box.innerHTML='<span class="ds-lbl">타임라인 일자 <small>복수 선택</small></span>'
      +`<button class="day-chip ds-all${all?' active':''}" data-d="전체" title="모든 날짜">${all?'✓ ':''}전체</button>`
      + dates.map(d=>chip(d, all || state.days.has(d))).join('');   // 전체면 전부 하이라이트
  } else {
    box.innerHTML='<span class="ds-lbl">날짜 <small>하루씩</small></span>'
      + dates.map(d=>chip(d, d===(state.focus||state.from))).join('');

// ── 타임라인(테이프 차트): 객실(행) × 날짜(열) 점유 한눈에 ──
function dateRangeList(from,to){
  const out=[]; let d=from, guard=0;
  while(d<=to && guard<400){ out.push(d); d=isoShift(d,1); guard++; }
  return out;
}
function tlTypeClass(rt){
  if(DELUXE_TYPES.includes(rt)) return 't-dlx';
  if(rt==='트윈') return 't-twin';
  if(rt==='컴팩트트윈') return 't-cmp';
  return 't-etc';
}
function renderTimeline(){

  if(!state.from){ box.innerHTML='<div class="empty-hint">날짜를 불러오세요</div>'; return; }

  const WD=['일','월','화','수','목','금','토'];
  const rooms=[...state.inventory].filter(r=>r.active && roomMatch(r))

// 선택한 날짜(카드=focus 하루 / 타임라인=선택 일자, 비면 전체)에 머무는 팀인가
//   · 객실 카드/타임라인이 보여주는 날짜와 미배정 목록을 일치시켜 "어느 날짜에 배정하는지" 명확화
function teamInDayScope(g){
  if(!g.dep || !g.arr) return true;
  if(viewMode==='timeline'){
    if(!state.days || state.days.size===0) return true;            // 전체
    for(const d of state.days){ if(g.dep<=d && d<g.arr) return true; }
    return false;
  }
  const d=state.focus||state.from;
  return g.dep<=d && d<g.arr;                                       // 그 하루에 점유
}
function dayScopeLabel(){
  if(viewMode==='timeline') return (state.days && state.days.size) ? [...state.days].sort().map(fmtMD).join('·') : '전체';
  return fmtMD(state.focus||state.from);
}

  const totalLeft=list.reduce((s,g)=>s+unassignedMembers(g.event_seq).length,0);
  $('#unassigned-cnt').innerHTML=`${dayScopeLabel()} 기준 · ${list.length}${t('rm_cntTeam')} · ${totalLeft}${t('rm_cntPpl')}`;
  // ── 🚪 오늘 퇴실(체크아웃) — 그날 나가는 팀 + 방번호(이 방들이 비워짐 → 같은 날 체크인 가능) ──
  const _coDay = (viewMode!=='timeline') ? (state.focus||state.from) : null;
  if(_coDay){
    const checkouts=state.guests.filter(g=>g.arr===_coDay && teamMatch(g))
      .sort((a,b)=>String(teamGroupCode(a.event_seq)||'').localeCompare(String(teamGroupCode(b.event_seq)||'')));
    if(checkouts.length){
      const sh=document.createElement('div'); sh.className='ua-sec';
      sh.style.cssText='background:#fbf4e6;color:#7a5a16;border:1px solid #e6d3a3';
      sh.innerHTML=`🚪 ${fmtMD(_coDay)} 퇴실 <b>${checkouts.length}팀</b> — 이 방들이 비워집니다(같은 날 체크인 가능)`;
      box.appendChild(sh);
      checkouts.forEach(g=>{
        const rooms=[...new Set(state.rooms.filter(r=>String(r.event_seq)===String(g.event_seq)).map(r=>r.room_no).filter(Boolean))];
        const row=document.createElement('div'); row.className='checkout-row';
        row.innerHTML=`<span class="co-gc">${teamGroupCode(g.event_seq)||evNo(g.event_seq)}</span> <b>${g.rep||''}</b> <span class="co-pax">${g.pax}명</span> <span class="co-rooms">${rooms.length?'🛏 '+rooms.join(', '):'<i style="color:var(--muted)">배정없음</i>'}</span>`;
        box.appendChild(row);
      });
    }
  }
  if(!list.length){ const e=document.createElement('div'); e.className='empty-hint'; e.innerHTML=t('rm_allAssigned'); box.appendChild(e); renderSelBar(); return; }
  function mkCard(g){
    const roster=teamRoster(g.event_seq);
    const leftN=unassignedMembers(g.event_seq).length;
    const card=document.createElement('div');
    card.className='team-card acc-'+g.pfx;
    card.dataset.seq=g.event_seq;
    const gcode=teamGroupCode(g.event_seq)||'(코드미정)';
    const rosterHtml=roster.length? roster.map(m=>{
      const isDone=done.has(m.id);
      const checked=state.sel.has(m.id);
      return `<div class="rmember${m.is_rep?' rep':''}${isDone?' done':''}${checked?' sel':''}" data-mid="${m.id}" ${isDone?'':'draggable="true"'}>
        <input type="checkbox" class="mchk" data-mid="${m.id}" ${isDone?'disabled':''} ${checked?'checked':''}>
        <span class="rtag">${m.tag||(m.num)}</span>
        <span class="rname">${m.name_kr||'-'}${m.is_rep?'<i class="repbadge">REP</i>':''}<i class="gbadge" style="display:inline-block;font-size:8.5px;font-weight:700;border-radius:3px;padding:1px 5px;margin-left:5px;vertical-align:middle;${isMember(m)?'color:#fff;background:var(--accent2)':'color:var(--text2);background:var(--surface3);border:1px solid var(--border2)'}">${gradeLabel(m)}</i></span>
        <span class="ren">${m.name_en||''}</span>
        ${isDone?`<span class="rdone" title="배정된 객실">${memberRoomLabel(m.id)} <button class="runassign" data-mid="${m.id}" title="배정 해제 → 명단으로">✕해제</button></span>`:''}
      </div>`;
    }).join('') : '<div class="rmember dim">명단 정보 없음</div>';
    const isNonMem=(g.group_code||'').startsWith('F');
    card.innerHTML=`
      <div class="tag-row">
        <span class="tag">${gcode}</span>
        <span class="mbadge ${isNonMem?'mb-non':'mb-mem'}">${isNonMem?t('rm_nonmember'):t('rm_member')}</span>
        ${g.event_no?`<span class="evno" title="행사번호(예약순 — 빠를수록 좋은 객실 우선)">${g.event_no}</span>`:''}
        <span class="meta"><span class="pax">${g.pax}명</span> · 잔여 ${leftN} · ${g.accom}</span>
      </div>
      <div class="cdates">${fmtMD(g.dep)} → ${fmtMD(g.arr)} · ${teamNights(g)}박${g.isNewCheckin?'<b class="cnew">오늘 체크인</b>':''}</div>
      <div class="rtype">${g.sale_type} → ${ROOMTYPE_MAP[g.sale_type]||'현장지정'}</div>
      <div class="roster">${rosterHtml}</div>`;
    // 행 선택 토글 (행 어디를 눌러도 1회 토글). 체크박스/행 클릭 일원화.
    function setSel(mid,on,rowEl){
      const beforeSpan=JSON.stringify(selAssignSpan());
      if(on) state.sel.add(mid); else state.sel.delete(mid);
      if(rowEl){ rowEl.classList.toggle('sel',on);
        const c=rowEl.querySelector('.mchk'); if(c) c.checked=on; }
      renderSelBar();
      // 선택팀 체류기간이 바뀌면 카드 점유를 그 기간 기준으로 다시 그림(빈 듯해도 사용중 표시)
      if(JSON.stringify(selAssignSpan())!==beforeSpan){ if(viewMode==='timeline') renderTimeline(); else renderFacilities(); }
    }
    card.querySelectorAll('.rmember[data-mid]').forEach(row=>{
      if(row.classList.contains('done')) return; // 배정완료 행은 무시
      const mid=row.dataset.mid;
      const chk=row.querySelector('.mchk');
      // 행 클릭 = 토글 (체크박스를 직접 누른 경우는 기본동작이 이미 토글하므로 중복방지)
      row.addEventListener('click',e=>{
        if(e.target===chk) return; // 체크박스 직접 클릭은 아래 change 가 처리
        const on=!state.sel.has(mid);
        setSel(mid,on,row);
      });
      if(chk){
        chk.addEventListener('change',()=>setSel(mid,chk.checked,row));
      }
      // 드래그 → 드롭 배정. 미선택이면 그 한 명 포함.
      row.addEventListener('dragstart',e=>{
        if(!state.sel.has(mid)) setSel(mid,true,row);
        e.dataTransfer.setData('text/plain','member');
        e.dataTransfer.effectAllowed='move';
        row.classList.add('dragging');
      });
      row.addEventListener('dragend',()=>row.classList.remove('dragging'));
    });
    // 배정완료 행의 ✕해제 → 그 사람 배정 전부 풀어 명단으로
    card.querySelectorAll('.runassign').forEach(btn=>btn.addEventListener('click',ev=>{ev.stopPropagation();unassignMember(btn.dataset.mid);}));
    return card;
  }
  // ── 현지도착일 기준 2그룹: 「오늘 현지도착」 / 「이전 도착·미배정 잔류」 (카드 보기) ──
  const leftOf=g=>unassignedMembers(g.event_seq).length;
  const focusDay = (viewMode!=='timeline') ? (state.focus||state.from) : null;
  function secHead(txt){ const d=document.createElement('div'); d.className='ua-sec'; d.innerHTML=txt; return d; }
  if(focusDay){
    const arrivals=list.filter(g=>g.dep===focusDay);
    const carry   =list.filter(g=>g.dep!==focusDay);
    box.appendChild(secHead(`📍 ${fmtMD(focusDay)} 현지도착 <b>${arrivals.length}팀 · ${arrivals.reduce((s,g)=>s+leftOf(g),0)}명</b>`));
    if(arrivals.length) arrivals.forEach(g=>box.appendChild(mkCard(g)));
    else { const e=document.createElement('div'); e.className='empty-hint'; e.style.cssText='padding:14px 10px;font-size:13px;color:var(--ok)'; e.textContent='이 날 현지도착 미배정 없음 ✓'; box.appendChild(e); }
    // 이전 도착·미배정 잔류는 카드로 안 띄움(헷갈림 방지) — 한 줄 안내 + 날짜 칩 「미N」으로 유도
    if(carry.length){
      const note=document.createElement('div');
      note.className='ua-sec'; note.style.cssText='background:transparent;border:1px dashed var(--border2);color:var(--text2);margin-top:8px';
      note.innerHTML=`⏳ 이전 도착·미배정 <b>${carry.length}팀 · ${carry.reduce((s,g)=>s+leftOf(g),0)}명</b> — 위 날짜 칩의 <b style="color:var(--err)">미N</b> 에서 그 날로 가 처리하세요`;
      box.appendChild(note);
    }
  } else {
    list.forEach(g=>box.appendChild(mkCard(g)));
  }
  renderSelBar();
}

// 선택된 멤버들을 한 방에 한꺼번에 배정. 선택이 없으면 → 그 방·날짜 배정가능 인원 팝업.
async function assignSelectedTo(inv){
  const ids=[...(state.sel||[])];
  if(!ids.length){ openAssignPicker(inv); return; }   // 잔소리 토스트 대신 팝업 피커
  await assignMembers(ids, inv);
}

// 그 방 숙소가 팀 예약 숙소와 맞는가(같은 숙소 우선정렬용)
function roomFitsTeam(inv,g){ const rk=roomPlaceKeys(inv)||[]; const tk=teamPlaceKeys(g)||[]; return rk.some(k=>tk.includes(k)); }
function closeAssignPicker(){ const m=$('#assign-picker'); if(m) m.remove(); }
// ── 빈 방 클릭 → "이 방·이 날짜에 배정 가능한 미배정 인원" 팝업 ──
function openAssignPicker(inv){
  closeAssignPicker();
  if(!inv.active){ toast(inv.room_no+': 비활성(잠금) 객실 — 🔓로 풀어주세요','warn'); return; }
  const _cloF=roomClosedFocus(inv.id);
  if(_cloF){ toast(`${inv.room_no}: 폐쇄 기간(${_cloF.from_date}~${_cloF.to_date}${_cloF.reason?' · '+_cloF.reason:''})`,'warn'); return; }
  const cap=inv.max_capacity||inv.capacity;
  const usedNow=roomUsedPax(inv);
  const remain=Math.max(0, cap-usedNow);
  // 후보: 선택 날짜 점유 + 미배정 인원 남은 팀. 같은 숙소 팀 먼저.
  const teams=state.guests.filter(g=>teamInDayScope(g) && unassignedMembers(g.event_seq).length>0);
  teams.sort((a,b)=>{
    const fa=roomFitsTeam(inv,a)?0:1, fb=roomFitsTeam(inv,b)?0:1;
    if(fa!==fb) return fa-fb;
    return String(a.event_no||'').localeCompare(String(b.event_no||'')) || a.event_seq-b.event_seq;
  });
  const gbadge=(m)=>`<i style="font-size:8.5px;font-weight:700;border-radius:3px;padding:1px 5px;margin-left:5px;${isMember(m)?'color:#fff;background:var(--accent2)':'color:var(--text2);background:var(--surface3);border:1px solid var(--border2)'}">${gradeLabel(m)}</i>`;
  const body = teams.length ? teams.map(g=>{
    const fit=roomFitsTeam(inv,g);
    const gcode=teamGroupCode(g.event_seq)||'(코드미정)';
    const mem=unassignedMembers(g.event_seq);
    const rows=mem.map(m=>`<label style="display:flex;align-items:center;gap:7px;padding:5px 9px;cursor:pointer;border-top:1px solid var(--border)">
        <input type="checkbox" class="ap-chk" data-mid="${m.id}" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer">
        <span style="font-family:var(--mono);font-size:11px;color:var(--text2);min-width:30px">${m.tag||m.num||''}</span>
        <span style="font-size:13px;font-weight:600">${m.name_kr||'-'}${m.is_rep?' <i style="font-size:8px;font-weight:800;color:var(--accent2)">REP</i>':''}${gbadge(m)}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--muted)">${m.name_en||''}</span>
      </label>`).join('');
    return `<div style="border:1px solid ${fit?'var(--accent)':'var(--border)'};border-radius:9px;margin-bottom:8px;overflow:hidden;${fit?'box-shadow:0 0 0 1px var(--accent) inset':''}">
      <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2)">
        <span style="font-family:var(--mono);font-weight:800;color:var(--accent)">${gcode}</span>
        ${fit?'<span style="font-size:9.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:99px;padding:1px 8px">이 숙소</span>':''}
        <span style="margin-left:auto;font-size:11.5px;color:var(--text2)">${fmtMD(g.dep)}→${fmtMD(g.arr)} · ${g.accom} · 잔여 ${mem.length}</span>
      </div>
      ${rows}
    </div>`;
  }).join('') : '<div style="padding:28px;text-align:center;color:var(--muted)">이 날짜에 배정 가능한 미배정 인원이 없습니다.</div>';

  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='assign-picker';
  bg.innerHTML=`<div class="modal" style="max-width:580px">
    <h2 style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span>${inv.facility||''} ${inv.room_no} <span style="font-size:12px;font-weight:600;color:var(--muted)">· ${dayScopeLabel()} 배정</span></span>
      <span style="font-size:12px;font-weight:700;color:${remain?'var(--accent2)':'var(--err)'}">현재 ${usedNow}/${cap} · 남은자리 ${remain}</span>
    </h2>
    <div class="mbody" style="max-height:58vh;overflow:auto">${body}</div>
    <div style="padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center">
      <span id="ap-cnt" style="margin-right:auto;font-size:12px;color:var(--text2)">선택 0명</span>
      <button class="btn ghost sm" type="button" id="ap-close">닫기</button>
      <button class="btn sm" type="button" id="ap-go" disabled>${inv.room_no}에 배정</button>
    </div>
  </div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeAssignPicker(); });
  document.body.appendChild(bg);
  const upd=()=>{ const n=bg.querySelectorAll('.ap-chk:checked').length;
    $('#ap-cnt').textContent=`선택 ${n}명`+(remain?` · 남은자리 ${remain}`:'')+(n>remain&&remain?` · ⚠ 정원 초과분은 보류됨`:'');
    $('#ap-go').disabled=!n; };
  bg.querySelectorAll('.ap-chk').forEach(c=>c.addEventListener('change',upd));
  $('#ap-close').addEventListener('click',closeAssignPicker);
  $('#ap-go').addEventListener('click',async()=>{
    const ids=[...bg.querySelectorAll('.ap-chk:checked')].map(c=>c.dataset.mid);
    if(!ids.length) return;
    closeAssignPicker();
    await assignMembers(ids, inv);   // 정원·날짜겹침·요금 가드는 assignMembers가 처리
  });
}

// ── 숙소(장소) 다중 필터 — 야마나미를 골프텔/돔하우스/소보별장/아소별장으로 분리 ──
const PLACE_ITEMS=['골프텔','관내별장','소보별장','아소별장','돔하우스','쿠주힐즈','간지호텔','시즈노야도'];
const PLACE_COLOR={골프텔:'y',관내별장:'y',소보별장:'y',아소별장:'y',돔하우스:'y',쿠주힐즈:'k',간지호텔:'g',시즈노야도:'s'};
let placeSel=new Set();   // 객실 배정 필터(비면 전체)
let teamSel=new Set();    // 미배정 팀 필터(비면 전체)
function roomPlaceKeys(r){
  if(r.facility==='야마나미리조트'){
    const z=r.zone||'';
    if(/^\d+층$/.test(z)) return ['골프텔'];
    if(z==='돔하우스')   return ['돔하우스'];
    if(z==='소보별장')   return ['소보별장','관내별장'];
    if(z==='아소별장')   return ['아소별장','관내별장'];
    return ['골프텔'];
  }
  if(r.facility==='쿠주힐즈')        return ['쿠주힐즈'];
  if(r.facility==='간지호텔')        return ['간지호텔'];
  if(r.facility==='시즈노야도 료칸') return ['시즈노야도'];
  return [];
}
function roomMatch(r){ return placeSel.size===0 || roomPlaceKeys(r).some(k=>placeSel.has(k)); }
function teamPlaceKeys(g){
  const st=g.sale_type, ac=g.accom;
  if(ac==='야마나미리조트'){
    if(st==='관내별장') return ['관내별장'];
    if(st==='돔하우스') return ['돔하우스'];
    return ['골프텔'];                    // 호텔 트윈/소형트윈 등
  }
  if(ac==='쿠주힐즈')        return ['쿠주힐즈'];
  if(ac==='간지호텔')        return ['간지호텔'];
  if(ac==='시즈노야도 료칸') return ['시즈노야도'];
  return [];
}
function teamMatch(g){ return teamSel.size===0 || teamPlaceKeys(g).some(k=>teamSel.has(k)); }

function renderFacilities(){
  const box=$('#facilities'); box.innerHTML='';
  if(state.splitPending){
    const b=document.createElement('div');
    b.style.cssText='font-size:12.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px';
    b.innerHTML=`분할 모드 — <b>${state.splitPending.name||''}</b> ${state.splitPending.from}~${state.splitPending.to} 배정할 방을 클릭하세요 <button class="btn ghost sm" id="split-cancel" type="button" style="margin-left:auto;color:#fff;border-color:#fff">취소</button>`;
    box.appendChild(b);
    b.querySelector('#split-cancel').addEventListener('click',cancelSplit);
  }
  const _span=selAssignSpan();
  if(_span){
    const h=document.createElement('div');
    h.style.cssText='font-size:12px;color:#fff;background:var(--accent2);border-radius:7px;padding:7px 12px;margin-bottom:10px;font-weight:700';
    h.innerHTML=`🧭 선택 인원 배정 기준 — 카드 점유는 <b>${fmtMD(_span.dep)}~${fmtMD(_span.arr)}</b> 기간 기준입니다. (그 기간에 차 있으면 오늘 비어 보여도 <b>꽉 참</b>으로 표시)`;
    box.appendChild(h);
  } else if(state.from && state.to && state.from!==state.to){
    const h=document.createElement('div');
    h.style.cssText='font-size:12px;color:var(--text2);background:var(--surface3);border-radius:7px;padding:7px 12px;margin-bottom:10px';
    h.innerHTML=`카드는 <b>${state.focus||state.from}</b> 하룻밤 기준이에요. 위 <b>일별</b> 칩으로 날짜를 바꾸고, 기간 전체 점유는 <b>타임라인</b> 으로 보세요.`;
    box.appendChild(h);
  }
  const FACS=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸'];
  FACS.forEach(fac=>{
    const pfx=PFX[fac];
    const rooms=state.inventory.filter(r=>r.facility===fac && roomMatch(r));
    if(!rooms.length && placeSel.size>0) return;   // 필터로 걸러진 시설은 숨김
    const facDiv=document.createElement('div');
    facDiv.className='fac f-'+pfx;
    // 가동률 — 기준일 하룻밤 점유 / 활성 정원 (한 달 누적 아님)
    const fd=state.focus||state.from;
    const totalCap=rooms.filter(r=>r.active).reduce((s,r)=>s+r.capacity,0);
    const used=rooms.reduce((s,inv)=>s+roomUsedPax(inv),0);   // span-aware(선택 시 그 기간 기준)
    facDiv.innerHTML=`<h3><span class="dot"></span>${fac}<span class="util">${used}/${totalCap}명</span></h3>`;
    // zone별 그룹 — 호텔동은 3층→12층 순 정렬, 별장 등은 등장 순
    const zones=[...new Set(rooms.map(r=>r.zone||fac))].sort((a,b)=>{
      const fa=a.match(/^(\d+)층$/), fb=b.match(/^(\d+)층$/);
      if(fa&&fb) return (+fa[1])-(+fb[1]);   // 둘 다 층 → 숫자순(3→12)
      if(fa) return -1; if(fb) return 1;     // 층을 앞으로
      return 0;
    });
    zones.forEach(zone=>{
      const zr=rooms.filter(r=>(r.zone||fac)===zone);
      const isHotelFloor=/^\d+층$/.test(zone);
      if(zones.length>1){
        const zl=document.createElement('div'); zl.className='zone-label';
        zl.innerHTML=`<span>— ${zone}</span>`;
        if(isHotelFloor){
          // 층 라벨 + 단면도 보기 버튼
          const btn=document.createElement('button');
          btn.className='floorplan-btn'; btn.type='button';
          btn.textContent='평면도'; btn.title='단면도(원형 배치) 보기';
          btn.addEventListener('click',()=>openFloorplanModal(zone,zr));
          zl.appendChild(btn);
        }
        // 층별 통계: 사용 실수/총실 · 인원 · 정원미만(트윈 1명 등)
        const act=zr.filter(r=>r.active);
        const usedRooms=act.filter(inv=>roomUsedPax(inv)>0).length;
        const ppl=act.reduce((s,inv)=>s+roomUsedPax(inv),0);
        const under=act.filter(inv=>{const u=roomUsedPax(inv);return u>0&&u<inv.capacity;}).length;
        zl.insertAdjacentHTML('beforeend',
          `<span class="zstat">사용 ${usedRooms}/${act.length}실 · ${ppl}명${under?` · <span class="zwarn">⚠정원미만 ${under}실</span>`:''}</span>`);
        if(ppl>0){
          const cbtn=document.createElement('button');
          cbtn.className='floorplan-btn'; cbtn.type='button';
          cbtn.textContent='비우기'; cbtn.title=`${zone} 배정 전체 해제`;
          cbtn.style.color='var(--err)'; cbtn.style.background='#f7e6e2'; cbtn.style.borderColor='#e3bdb4';
          cbtn.addEventListener('click',()=>clearZone(fac,zone));
          zl.appendChild(cbtn);
        }
        facDiv.appendChild(zl);
      }
      const grid=document.createElement('div'); grid.className='rooms-grid';
      zr.forEach(inv=>grid.appendChild(renderRoom(inv)));
      facDiv.appendChild(grid);
    });
    if(!rooms.length){
      const e=document.createElement('div'); e.className='empty-hint';
      e.innerHTML=fac==='야마나미리조트'
        ?'호텔동 객실 미등록 — 05_room_inventory_real.sql을 실행하세요.'
        :'등록된 객실이 없습니다.';
      facDiv.appendChild(e);
    }
    box.appendChild(facDiv);
  });
}



// ── 팀별 임시 그룹코드 부여 (회원 group_code 없으면 AA01, AA02… 순서대로) ──
//   v13.4 방식: 대표 그룹코드 + 개인번호 + 숙소Pfx (예: AA01-1Y)
let _tagMapCache=null;
// ── 개인(멤버) 단위 헬퍼 ─────────────────────────────────────────────
// rooms 1행 = 1명. member_id = guest_members.id. 화면 태그는 표시용.
function assignedMemberSet(){
  // 이번 세션에서 이미 방을 받은 member_id 집합
  const s=new Set();
  state.rooms.forEach(r=>{ if(r.member_id!=null) s.add(r.member_id); });
  return s;
}
function unassignedMembers(seq){
  // 해당 팀에서 아직 방 안 받은 멤버 목록(정렬+태그 포함)
  const done=assignedMemberSet();
  return teamRoster(seq).filter(m=>!done.has(m.id));
}
function teamFullyAssigned(seq){
  return unassignedMembers(seq).length===0 && (state.members[seq]||[]).length>0;
}
function memberById(mid){
  for(const seq in state.members){
    const hit=(state.members[seq]||[]).find(m=>m.id===mid);
    if(hit) return {...hit, event_seq:Number(seq)};
  }
  return null;
}
function selClear(){ state.sel=new Set(); }
function selCount(){ return state.sel?state.sel.size:0; }
function renderSelBar(){
  const bar=$('#sel-bar'); if(!bar) return;
  const n=selCount();
  bar.style.display=n? 'flex':'none';
  if(n) $('#sel-cnt').innerHTML=n+t('rm_selectedSuffix');
}

function buildTagMap(){
  const map={}; let idx=0;
  // 팀 정렬: 숙소→대표자 (일관된 임시코드 부여)
  const teams=[...state.guests].sort((a,b)=>(a.accom||'').localeCompare(b.accom||'')||(a.rep||'').localeCompare(b.rep||''));
  teams.forEach(g=>{
    let gcode=g.group_code;
    if(!gcode){
      // 임시코드 AA01, AA02 … (26*99 capacity)
      const n=idx++;
      const a=String.fromCharCode(65+Math.floor(n/26)%26);
      const b=String.fromCharCode(65+n%26);
      const num=String(Math.floor(n/676)+1);
      gcode='A'+a+b.replace('A','A'); // 단순화: AA,AB,AC...
      gcode='A'+String.fromCharCode(65+Math.floor(n/26)%26)+String(n%26+1).padStart(2,'0');
    }
    map[g.event_seq]={gcode, pfx:g.pfx||'Y'};
  });
  return map;
}
function personTag(seq, seqInTeam){
  if(!_tagMapCache) _tagMapCache=buildTagMap();
  const t=_tagMapCache[seq]; if(!t) return '';
  return `${t.gcode}-${seqInTeam}${t.pfx}`;
}
function teamGroupCode(seq){
  if(!_tagMapCache) _tagMapCache=buildTagMap();
  return _tagMapCache[seq]?_tagMapCache[seq].gcode:'';
}
// 팀 명단 (정렬된 멤버 + 태그코드)
function teamRoster(seq){
  const ms=(state.members[seq]||[]).slice().sort((a,b)=>(a.seq_in_team||0)-(b.seq_in_team||0));
  return ms.map((m,i)=>({
    ...m,
    num:m.seq_in_team||(i+1),
    tag:personTag(seq, m.seq_in_team||(i+1)),
  }));
}

// ── 팀의 영문명 목록 (객실 칩 표시용) ──
function teamEnNames(seq){
  const ms=(state.members[seq]||[]).filter(m=>m.name_en).map(m=>m.name_en);
  if(!ms.length) return '';
  return ms.slice(0,4).join(', ')+(ms.length>4?` 외 ${ms.length-4}`:'');
}

function invById(id){return state.inventory.find(i=>i.id===id);}

function renderRoom(inv){
  const div=document.createElement('div');
  const _span=selAssignSpan();
  const assigned = _span ? roomOccOver(inv.id,_span.dep,_span.arr).rows   // 선택팀 기간 점유
                         : roomOccAt(inv.id, state.focus||state.from);     // 평소=기준일 하룻밤
  const usedPax=roomUsedPax(inv);   // span-aware (선택 시 그 기간 최대점유)
  const cap=inv.max_capacity||inv.capacity;
  // 상태색: 초과=빨강(위험) · 정원 꽉참=초록(깔끔) · 정원 미달=앰버(주의)
  const stCls = usedPax>inv.capacity ? ' warn' : (usedPax>0 && usedPax>=inv.capacity ? ' full' : (usedPax>0 ? ' partial' : ''));
  const clo=roomClosedFocus(inv.id);   // 기준일 폐쇄 여부
  div.className='room'+((inv.active&&!clo)?'':' inactive')+(assigned.length?' filled':'')+stCls;
  div.dataset.invId=inv.id;
  // 기준일(focus) 대비 체크인(초록)/연박(블루) 구분. 퇴실은 카드에서 빼고 별도 「오늘 퇴실」 목록으로.
  const refDay = _span ? null : (state.focus||state.from);
  // 같은 방 점유를 '팀 단위'로 묶어 표시(8인 별장도 한 칸에 안 터지게). 멤버별 ✕/분할은 유지.
  const byTeam={}; assigned.forEach(r=>{ (byTeam[r.event_seq]=byTeam[r.event_seq]||[]).push(r); });
  let chips=Object.keys(byTeam).map(seq=>{
    const rows=byTeam[seq], r0=rows[0];
    const gcode=teamGroupCode(seq)||('팀'+evNo(seq));
    const isIn = refDay && r0.check_in===refDay;                       // 오늘 입실 팀
    const chipCls = !refDay ? '' : (isIn?' chip-in' : ' chip-cont');
    const flag = !refDay ? '' : (isIn?'<span class="cflag cf-in">체크인</span>' : '<span class="cflag cf-cont">연박</span>');
    const mems=rows.map(r=>{
      const m=r.member_id!=null?memberById(r.member_id):null;
      const nameKr=m?(m.name_kr||'-'):gcode;
      const nameEn=m?(m.name_en||''):'';
      const gb=m?`<i class="gbadge" style="display:inline-block;font-size:8px;font-weight:700;border-radius:3px;padding:0 4px;margin-left:3px;vertical-align:middle;${isMember(m)?'color:#fff;background:var(--accent2)':'color:var(--text2);background:var(--surface3);border:1px solid var(--border2)'}">${gradeLabel(m)}</i>`:'';
      return `<div class="cmem"><b>${nameKr}</b><span class="cmen">${nameEn}</span>${gb}<span class="cmem-act"><span class="csplit" data-room-id="${r.id}" title="기준일부터 다른 방으로 분할">✂</span><span class="cx" data-room-id="${r.id}" title="배정 취소">✕</span></span></div>`;
    }).join('');
    return `<div class="chip${chipCls}">
      <div class="chip-head"><span class="ctag">${gcode}</span>${flag}<span class="cnum">${rows.length}명</span><span class="cdate">${fmtMD(r0.check_in)}~${fmtMD(r0.check_out)}</span></div>
      <div class="cmems">${mems}</div>
    </div>`;
  }).join('');
  div.innerHTML=`
    <span class="cap">${usedPax}/${inv.capacity}</span>
    <span class="lock" data-inv-id="${inv.id}" title="${inv.active?'사용 가능 — 클릭하면 잠금(비활성)':'잠금(비활성) — 클릭하면 사용 가능'}">${inv.active?'🔓':'🔒'}</span>
    <div class="rn">${inv.room_no}${zonePin(inv)}</div>
    <div class="rt">${typeLabel(inv.room_type)}</div>
    ${inv.note?`<div class="note">${inv.note}</div>`:''}
    ${clo?`<div class="note" style="color:#b13b2c;font-weight:700">🔒 폐쇄 ${fmtMD(clo.from_date)}~${fmtMD(clo.to_date)}${clo.reason?' · '+clo.reason:''}</div>`:''}
    <div class="assigned">${chips}</div>
    ${usedPax>inv.capacity?'<span class="badge">초과</span>':''}`;
  // 칩 삭제
  div.querySelectorAll('.cx').forEach(x=>x.addEventListener('click',ev=>{ev.stopPropagation();unassign(x.dataset.roomId);}));
  // 분할(): 기준일부터 다른 방으로
  div.querySelectorAll('.csplit').forEach(x=>x.addEventListener('click',ev=>{ev.stopPropagation();startSplit(x.dataset.roomId);}));
  // 활성/비활성 토글
  div.querySelector('.lock').addEventListener('click',ev=>{ev.stopPropagation();toggleActive(inv);});
  // 카드 클릭 → 분할 모드면 이 방으로 뒷부분 이동, 아니면 선택 인원 배정
  div.addEventListener('click',ev=>{
    if(ev.target.closest('.cx')||ev.target.closest('.lock')||ev.target.closest('.csplit')) return;
    if(window.getSelection) window.getSelection().removeAllRanges(); // 텍스트 파란선택 해제
    if(!inv.active){toast(inv.room_no+': 비활성 객실','warn');return;}
    if(state.splitPending){ commitSplit(inv); return; }
    assignSelectedTo(inv);
  });
  // 드롭
  if(inv.active){
    div.addEventListener('dragover',e=>{e.preventDefault();div.classList.add('over');});
    div.addEventListener('dragleave',()=>div.classList.remove('over'));
    div.addEventListener('drop',e=>{e.preventDefault();div.classList.remove('over');
      assignSelectedTo(inv);});
  }
  return div;
}

// ── 분할 체류(): 기준일부터 뒷부분을 다른 방으로 ──
//   · 원래 배정 행을 [체크인~기준일]로 단축, 뒷부분[기준일~체크아웃]을 새 방에 수기 배정
//   · 빈 앞/뒷날엔 다른 팀을 넣을 수 있음. 표시는 타임라인·일별 카드가 자동 처리.
function startSplit(roomId){
  const row=state.rooms.find(r=>r.id===roomId);
  if(!row || row.member_id==null){toast('분할은 개인 배정에서만 됩니다','warn');return;}
  const D=state.focus||state.from;
  if(!(row.check_in < D && D < row.check_out)){
    toast('체류 중간 날에서만 분할됩니다. 위 일별 칩에서 옮길 첫 날을 고르세요.','warn');
    return;
  }
  const m=memberById(row.member_id);
  state.splitPending={ srcId:row.id, member_id:row.member_id, event_seq:row.event_seq, from:D, to:row.check_out, name:(m?m.name_kr:'') };
  render();
  toast(`${state.splitPending.name||''} ${D}~${row.check_out} 옮길 방을 클릭하세요 (Esc=취소)`,'ok');
}
async function commitSplit(inv){
  const sp=state.splitPending; if(!sp) return;
  const srcRow=state.rooms.find(r=>r.id===sp.srcId);
  if(srcRow && srcRow.inventory_id===inv.id){ toast('같은 방입니다 — 다른 방을 클릭하세요','warn'); return; }
  const cap=inv.max_capacity||inv.capacity;
  // 폐쇄 가드(자동·수기·피커와 동일하게 분할에도 적용)
  const _cloSp=roomClosure(inv.id,sp.from,sp.to);
  if(_cloSp){ toast(`${inv.room_no}: 폐쇄 기간(${_cloSp.from_date}~${_cloSp.to_date}${_cloSp.reason?' · '+_cloSp.reason:''}) — 분할 배정 불가`,'warn'); return; }
  // 정원 = DB 권위 점유(다른 달 포함, 원행 제외). state.rooms만 보던 월경계 회귀 수정.
  const used=await dbRoomUsedPax(inv.id, sp.from, sp.to, [sp.srcId]);
  if(used+1>cap){ toast(`${inv.room_no}: ${sp.from}~${sp.to} 정원 초과`,'warn'); return; }
  // 1) 원래 행을 앞부분으로 단축(수기 표시)
  const {error:e1}=await supa.from('rooms').update({check_out:sp.from, assign_source:'manual'}).eq('id',sp.srcId);
  if(e1){toast('분할 실패(원행 수정): '+e1.message,'err');return;}
  // 2) 뒷부분을 새 방에 수기 배정
  const newRow={ event_seq:sp.event_seq, member_id:sp.member_id, inventory_id:inv.id, facility:inv.facility, room_type:inv.room_type, room_no:inv.room_no, check_in:sp.from, check_out:sp.to, assigned_pax:1, assign_source:'manual' };
  const {data,error:e2}=await supa.from('rooms').insert(newRow).select().single();
  if(e2){toast('분할 실패(새 행): '+e2.message,'err');return;}
  const src=state.rooms.find(r=>r.id===sp.srcId); if(src){ src.check_out=sp.from; src.assign_source='manual'; }
  state.rooms.push(data);
  state.splitPending=null;
  rebuildAssignMap(); render();
  logAssign('분할', `${sp.name||''}(${teamGroupCode(sp.event_seq)||evNo(sp.event_seq)||''}) ${sp.from}부터 → ${inv.facility||''} ${inv.room_no}`);
  toast(`분할 완료 — ${sp.from}부터 ${inv.room_no}`,'ok');
}
function cancelSplit(){ if(state.splitPending){ state.splitPending=null; render(); } }

// ── 객실 활성/비활성 토글 (담당자가 현장에서 켜고 끔) ──
async function toggleActive(inv){
  const next=!inv.active;
  // 비활성으로 끄는데 배정이 들어있으면 확인
  if(!next){
    const assigned=state.rooms.filter(r=>r.inventory_id===inv.id);
    if(assigned.length && !confirm(`${inv.room_no}에 배정된 팀이 있습니다. 그래도 비활성으로 바꿀까요?\n(기존 배정은 유지되지만 새 배정은 막힙니다)`)) return;
  }
  const {error}=await supa.from('room_inventory').update({active:next}).eq('id',inv.id);
  if(error){toast('상태 변경 실패: '+error.message,'err');return;}
  inv.active=next;
  render();
  toast(`${inv.room_no} → ${next?'사용 가능':'비활성'}`, next?'ok':'warn');
}

// ── 단면도(원형 평면도) 프리뷰 모달 ──
function openFloorplanModal(zone, zoneRooms){
  const bg=document.createElement('div'); bg.className='modal-bg';
  const m=document.createElement('div'); m.className='modal'; m.style.maxWidth='640px';
  m.innerHTML=`<h2>${zone} 평면도 <span style="font-size:11px;font-weight:600;color:var(--text2);margin-left:8px">단면도 배치 · 드래그 배정 가능</span></h2>
    <div class="mbody" id="fp-body" style="padding:10px 16px 18px"></div>
    <div class="mfoot"><button class="btn ghost sm" id="fp-close" type="button">닫기</button></div>`;
  bg.appendChild(m); document.body.appendChild(bg);
  m.querySelector('#fp-body').appendChild(renderFloorRing(zoneRooms));
  m.querySelector('#fp-close').addEventListener('click',()=>bg.remove());
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
}

// ── 야마나미 호텔동 층별 원형 평면도 (단면도 ①~⑭ 배치) ──
function renderFloorRing(zoneRooms){
  const wrap=document.createElement('div');
  wrap.className='floor-ring';
  // 가운데 EV/계단 표시
  wrap.innerHTML=`<div class="ring-core"><span>EV</span><span>EV</span></div>
    <div class="ring-compass c-n">N</div><div class="ring-compass c-s">S<small>입구</small></div>
    <div class="ring-compass c-e">E</div><div class="ring-compass c-w">W</div>`;
  zoneRooms.forEach(inv=>{
    const pos=inv.room_no.match(/(\d+)호/);
    const num=pos?parseInt(pos[1],10)%100:0;     // 끝 두 자리 = 위치 번호
    const xy=RING_POS[num];
    const node=document.createElement('div');
    const assigned=roomOccAt(inv.id, state.focus||state.from);   // 평면도도 기준일 하룻밤만
    const usedPax=assigned.reduce((s,r)=>s+(r.assigned_pax||0),0);
    node.className='ring-room t-'+inv.room_type+(inv.active?'':' inactive')+(assigned.length?' filled':'')+(usedPax>inv.capacity?' warn':'');
    if(xy){ node.style.left=xy.x+'%'; node.style.top=xy.y+'%'; }
    else { node.style.position='relative'; node.style.display='inline-block'; } // 좌표 없으면 흐름배치
    const chips=assigned.map(r=>{
      const m=r.member_id!=null?memberById(r.member_id):null;
      const tag=m?personTag(r.event_seq,m.seq_in_team||1):(teamGroupCode(r.event_seq)||('팀'+evNo(r.event_seq)));
      const nm=m?(m.name_kr||''):'';
      return `<span class="rchip"><b>${tag}</b> ${nm}</span>`;   // 평면도에선 ✕ 취소 없음(카드에서만)
    }).join('');
    node.innerHTML=`
      <span class="rlock" data-inv-id="${inv.id}" title="${inv.active?'사용 가능 — 클릭하면 잠금':'잠금(비활성) — 클릭하면 사용 가능'}">${inv.active?'':'🔒'}</span>
      <div class="rno">${num}<small>호</small></div>
      <div class="rtype" title="${typeLabel(inv.room_type)}">${TYPE_EN[inv.room_type]||inv.room_type}</div>
      <div class="rcap">${usedPax}/${inv.capacity}</div>
      <div class="rchips">${chips}</div>`;
    // 이벤트 (평면도에선 배정 취소 ✕ 없음 — 카드 보기에서만)
    node.querySelector('.rlock').addEventListener('click',ev=>{ev.stopPropagation();toggleActive(inv);});
    if(inv.active){
      node.addEventListener('dragover',e=>{e.preventDefault();node.classList.add('over');});
      node.addEventListener('dragleave',()=>node.classList.remove('over'));
      node.addEventListener('drop',e=>{e.preventDefault();node.classList.remove('over');
        assignSelectedTo(inv);});
    }
    wrap.appendChild(node);
  });
  return wrap;
}

function renderSummary(){
  // 기준일(그날 밤) 기준: 그날 묵는 인원 vs 그날 방 배정된 인원 (한 달 누적이 아니라 하룻밤)
  const d=state.focus||state.from;
  let stay=0; state.guests.forEach(g=>{ if(g.dep<=d && d<g.arr) stay+=(g.pax||0); });
  let asg=0;  state.rooms.forEach(r=>{ if(r.check_in<=d && d<r.check_out) asg+=(r.assigned_pax||0); });
  const left=stay-asg, el=$('#assign-summary');
  el.innerHTML = `${fmtMD(d)} <b style="color:${(left<=0&&stay>0)?'var(--ok)':'inherit'}">${asg}/${stay}명</b>`
    + (left>0 ? ` <span style="color:var(--err);font-weight:700">· 미배정 ${left}</span>`
             : (stay>0 ? ' <span style="color:var(--ok);font-weight:700">✓ 완료</span>' : ''));
  el.style.color=''; el.style.fontWeight='';
}

// ── 두 기간이 겹치는가 (체크인~체크아웃, 반개구간) ──
function overlaps(dep1,arr1,dep2,arr2){ return SZCore.overlaps(dep1,arr1,dep2,arr2); }  // 공유 모듈 위임

// ── 배정 ──
//  opts.byeolcheAdvance=true → 별채 온천 사전신청이 확정된 경로(현지예약 별채희망)에서
//    +2,000/박을 바로 기록. 그 외(수기 배정)는 사전신청 여부를 모달로 확인한다.
async function assignMembers(memberIds, inv, opts={}){
  if(!inv.active){toast(inv.room_no+': 비활성 객실','warn');return;}
  const cap=inv.max_capacity||inv.capacity;
  // 대상 멤버를 팀별로 모아 검증/삽입
  const targets=[];
  for(const mid of memberIds){
    const m=memberById(mid); if(!m) continue;
    if(assignedMemberSet().has(mid)) continue; // 이미 배정됨
    targets.push(m);
  }
  if(!targets.length){toast('배정할 인원이 없습니다','warn');return;}

  // ── DB 권위 점유원장(다른 달 포함) — 월경계 더블부킹 방지. autoAssign과 동일 원칙. ──
  //   state.rooms는 로드된 달만 보므로, 다른 달 경계팀이 같은 방·겹치는 날을 점유해도
  //   합산에서 빠져 정원초과가 났다(회귀 버그). 대상 팀 체류구간에 걸치는 DB 전체 점유로 체크.
  let _occ=null;
  try{
    const _gs=targets.map(m=>state.guests.find(x=>x.event_seq===m.event_seq)).filter(Boolean);
    const _deps=_gs.map(g=>g.dep).filter(Boolean), _arrs=_gs.map(g=>g.arr).filter(Boolean);
    if(_deps.length&&_arrs.length){
      const spanFrom=_deps.reduce((a,b)=>a<b?a:b), spanTo=_arrs.reduce((a,b)=>a>b?a:b);
      const _r=await pagedQuery(()=>supa.from('rooms').select('id,inventory_id,assigned_pax,check_in,check_out,member_id,event_seq').lt('check_in',spanTo).gt('check_out',spanFrom).order('id'));
      if(!_r.error) _occ=_r.data||[];
    }
  }catch(e){ console.warn('점유원장 로드 실패, state.rooms 폴백:',e.message); }
  const _occBase=_occ||state.rooms;

  let ok=0, blocked=0; const blockMsg=[]; const byeolcheList=[]; const _logAssignNames=[];
  for(const m of targets){
    const g=state.guests.find(x=>x.event_seq===m.event_seq);
    if(!g){blocked++;continue;}
    const _clo=roomClosure(inv.id,g.dep,g.arr);
    if(_clo){ blocked++; blockMsg.push(`${inv.room_no}: 폐쇄 기간(${_clo.from_date}~${_clo.to_date}${_clo.reason?' · '+_clo.reason:''}) — 배정 불가`); break; }
    // 이 방에서 기간 겹치는 기존 배정만 정원 합산(DB 권위 점유 = 다른 달 포함)
    const overlapRows=_occBase.filter(r=>r.inventory_id===inv.id && overlaps(g.dep,g.arr,r.check_in,r.check_out));
    const roomUsed=overlapRows.reduce((s,r)=>s+(r.assigned_pax||0),0);
    if(roomUsed>=cap){
      blocked++;
      // 누가·언제 쓰는지 명확히: 이름(그룹코드) 날짜~날짜  (코드만 나오던 문제 수정)
      const others=[...new Set(overlapRows.map(r=>{
        const mm=memberById(r.member_id);
        const gc=teamGroupCode(r.event_seq)||evNo(r.event_seq)||'';
        const nm=mm?(mm.name_kr||mm.name_en||''):'';
        const who=nm?(gc?`${nm}(${gc})`:nm):(gc||'미상');
        return `${who} ${fmtMD(r.check_in)}~${fmtMD(r.check_out)}`;
      }))].join(' / ');
      blockMsg.push(`${inv.room_no} 정원 ${cap} 초과 — 사용중: ${others||'-'}`);
      break; // 더 넣어도 같은 방은 꽉 참
    }
    const row={
      event_seq:m.event_seq, member_id:m.id, inventory_id:inv.id,
      facility:inv.facility, room_type:inv.room_type, room_no:inv.room_no,
      check_in:g.dep, check_out:g.arr, assigned_pax:1
    };
    const {data,error}=await supa.from('rooms').insert(row).select().single();
    if(error){blocked++; blockMsg.push(`${m.name_kr||m.id}: ${error.message}`); continue;}
    state.rooms.push(data);
    if(_occ) _occ.push(data);   // 같은 호출 내 다음 멤버 정원 합산에 즉시 반영(DB 점유 배열)
    if(state.sel) state.sel.delete(m.id);
    ok++;
    _logAssignNames.push(`${m.name_kr||m.name_en||m.id}(${teamGroupCode(m.event_seq)||evNo(m.event_seq)||''})`);
    // 1인실 추가요금(간지) — 사람 단위 1명이므로 그대로 적용
    const nights=g.dep&&g.arr?Math.round((new Date(g.arr)-new Date(g.dep))/864e5):0;
    if(FEE_SINGLE[inv.facility] && nights>0){
      openSingleFeeModal(g, inv, nights, data.id, m);
    }
    // 시즈노야도 별채 = 객실은 본관과 동일 ¥17,000. 온천 사전신청 시에만 +2,000/박(별도).
    //   → 여기서 자동 청구하지 않고 모아뒀다가, 루프 후 경로에 따라 처리.
    if(inv.facility==='시즈노야도 료칸' && inv.zone==='별채' && nights>0){
      byeolcheList.push({g, m, nights});
    }
  }
  rebuildAssignMap(); render();
  if(_logAssignNames.length) logAssign('배정', `${inv.facility} ${inv.room_no} ← ${_logAssignNames.join(', ')}`);
  if(ok)   toast(`${inv.room_no} ← ${ok}명 배정`+(blocked?` (${blocked}명 보류)`:''), blocked?'warn':'ok');
  else     toast(blockMsg[0]||'배정 실패','warn');
  // 별채 온천 사전신청 추가요금: 확정 경로면 바로 기록, 수기 배정이면 모달로 확인
  if(byeolcheList.length){
    if(opts.byeolcheAdvance){ for(const x of byeolcheList) await recordByeolche(x.g, inv, x.nights, x.m); }
    else openByeolcheModal(inv, byeolcheList);
  }
}
