// (구) 팀 단위 assign 은 호환용 래퍼 — 팀의 미배정자 전원을 한 방에 시도
async function assign(seq,inv){
  const ids=unassignedMembers(seq).map(m=>m.id);
  if(!ids.length){toast('이미 전원 배정된 팀','warn');return;}
  await assignMembers(ids, inv);
}

// ════════════════════════════════════════════════════════════════════════
//  자동배정 (회원→디럭스 우선 · 일반→예약종류 · 예약순 · 수기배정 보호)
//   · 대상: 야마나미 호텔(트윈/소형트윈/관내별장→호텔동) + 돔하우스·간지·쿠주·시즈노야도
//   · 제외: 소보별장/아소별장(비워둠) — autoRoute 가 null 반환
//   · 회원 판정: 공란·'일반고객'·'일반' = 일반, 그 외(회원권/다이아몬드1/EWRC…) = 회원
//   · 룸메 짝: 명단 순서 2명. 외톨이 회원은 같은 팀 일반 1명을 디럭스로 끌어올림.
//   · 디럭스 부족 시 일반 예약종류로 자동 강등. 3명팀·진짜 홀수잔여는 보류.
//   · assign_source='auto' 만 재정렬(수기 배정·잠금은 안 건드림) → 재실행=승급 반영.
// ════════════════════════════════════════════════════════════════════════
const DELUXE_TYPES=['디럭스더블트윈','디럭스트윈']; // 우선순위 순(최상급 먼저)

// 회원 판정·등급 라벨은 공유 모듈(saizen-core.js)이 단일 진실원 — 여기선 위임만.
//   회원 판정 = 고객등급(T)·회원권구분(V)·회원구분(U) 3컬럼 OR(회원 우선).
function isMember(m){ return SZCore.isMember(m); }
function gradeLabel(m){ return SZCore.gradeLabel(m); }

// 팀의 판매분류·숙소 → 배정 라우팅. null 이면 자동배정 제외(소보 등).
function autoRoute(g){
  const st=g.sale_type, ac=g.accom;
  if(ac==='야마나미리조트'){
    // 일반은 "스탠다드트윈 또는 컴팩트트윈" — 예약종류 우선, 부족 시 다른 트윈으로 폴백
    if(st==='호텔 트윈')     return {fac:ac, floorOnly:true, genTypes:['트윈','컴팩트트윈'], deluxe:true};
    if(st==='호텔 소형트윈') return {fac:ac, floorOnly:true, genTypes:['컴팩트트윈','트윈'], deluxe:true};
    if(st==='관내별장')      return {fac:ac, floorOnly:true, genTypes:['트윈','컴팩트트윈'], deluxe:true}; // 소보 비우고 호텔로
    if(st==='돔하우스')      return {fac:ac, zone:'돔하우스', genTypes:['트윈'],      deluxe:false};
    return null; // 그 외(소보·아소 현장지정) 제외
  }
  if(ac==='쿠주힐즈')        return {fac:ac, any:true, deluxe:false};
  if(ac==='간지호텔')        return {fac:ac, any:true, deluxe:false};
  if(ac==='시즈노야도 료칸') return {fac:ac, zone:'본관', deluxe:false};   // 자동=본관만(예약순·회원순). 별채는 사전희망 시 수기 이동
  return null;
}

// 라우팅+종류 → 후보 객실 풀(활성, 우선순위 정렬)
// 층 번호(3~12). 비호텔/별장 등은 0. 정렬에서 '높은 층 우선·3층 맨 뒤'에 사용.
function floorOf(r){ const m=String(r.zone||'').match(/^(\d+)층$/); return m?+m[1]:0; }
function roomPool(route, kind){
  let rooms=state.inventory.filter(r=>r.facility===route.fac && r.active);
  if(route.floorOnly)      rooms=rooms.filter(r=>/^\d+층$/.test(r.zone||''));
  else if(route.zone)      rooms=rooms.filter(r=>(r.zone||'')===route.zone);
  // 공통 1순위: 높은 층 우선(3층=기피층이라 맨 뒤). 예약 빠른 팀이 먼저 좋은 층을 받음.
  const byFloorDesc=(a,b)=>floorOf(b)-floorOf(a);
  if(kind==='deluxe'){
    rooms=rooms.filter(r=>DELUXE_TYPES.includes(r.room_type));
    rooms.sort((a,b)=>byFloorDesc(a,b)
                      || (DELUXE_TYPES.indexOf(a.room_type)-DELUXE_TYPES.indexOf(b.room_type))
                      || (a.sort_order||0)-(b.sort_order||0));
  }else{
    if(route.genTypes){
      rooms=rooms.filter(r=>route.genTypes.includes(r.room_type));
      rooms.sort((a,b)=>byFloorDesc(a,b)
                        || (route.genTypes.indexOf(a.room_type)-route.genTypes.indexOf(b.room_type))
                        || (a.sort_order||0)-(b.sort_order||0));
    }else{
      rooms=rooms.filter(r=>(r.max_capacity||r.capacity)>=2); // 비호텔: 2인 이상 방
      rooms.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    }
  }
  return rooms;
}

// 특정 객실이 그 기간에 이미 쓰는 인원(occ=점유원장 + 이번 배치 pending)
//  · occ 기본값은 state.rooms(로드된 달)지만, 자동배정은 DB 전체 점유(다른 달 포함)를 넘겨
//    월 경계 팀이 다른 달 팀과 같은 방·겹치는 날에 초과되지 않도록 한다.
function roomUsedFor(invId,dep,arr,pending,occ){
  const base = occ || state.rooms;
  let s=0;
  base.forEach(r=>{ if(r.inventory_id===invId && overlaps(dep,arr,r.check_in,r.check_out)) s+=(r.assigned_pax||0); });
  pending.forEach(r=>{ if(r.inventory_id===invId && overlaps(dep,arr,r.check_in,r.check_out)) s+=(r.assigned_pax||0); });
  return s;
}
// 한 방의 [dep,arr) 겹침 점유를 DB에서 권위 조회(다른 달 포함). 수기·분할 정원 체크용.
//   overlaps(dep,arr,ci,co) = dep<co && ci<arr  →  .lt('check_in',arr).gt('check_out',dep)
async function dbRoomUsedPax(invId, dep, arr, excludeIds){
  const ex=new Set(excludeIds||[]);
  try{
    const r=await pagedQuery(()=>supa.from('rooms').select('id,assigned_pax,check_in,check_out')
      .eq('inventory_id',invId).lt('check_in',arr).gt('check_out',dep).order('id'));
    if(r.error) throw r.error;
    return (r.data||[]).filter(x=>!ex.has(x.id)).reduce((s,x)=>s+(x.assigned_pax||0),0);
  }catch(e){   // 폴백: 로드된 달만(state.rooms) — 최소 보장
    return state.rooms.filter(x=>x.inventory_id===invId && !ex.has(x.id) && overlaps(dep,arr,x.check_in,x.check_out)).reduce((s,x)=>s+(x.assigned_pax||0),0);
  }
}
function pickRoom(pool,dep,arr,need,pending,occ){
  for(const inv of pool){
    if(roomClosure(inv.id,dep,arr)) continue;   // 기간 폐쇄된 방은 자동배정 제외
    const cap=inv.max_capacity||inv.capacity;
    if(roomUsedFor(inv.id,dep,arr,pending,occ)+need<=cap) return inv;
  }
  return null;
}
function mkRow(g,m,inv){
  return { event_seq:g.event_seq, member_id:m.id, inventory_id:inv.id,
    facility:inv.facility, room_type:inv.room_type, room_no:inv.room_no,
    check_in:g.dep, check_out:g.arr, assigned_pax:1, assign_source:'auto' };
}

// 그 팀 needRooms개가 '한 층에' 다 들어갈 수 있는 가장 높은 층(층 정보 있는 방만). 없으면 null.
//   → 같은 팀은 되도록 같은 층(기본 원칙). 별장·돔하우스 등 층 없는 방(floor 0)은 묶지 않음.
function pickFloor(pool,needRooms,dep,arr,pending,occ){
  const byFloor={};
  pool.forEach(inv=>{ const f=floorOf(inv); if(f>0) (byFloor[f]=byFloor[f]||[]).push(inv); });
  const floors=Object.keys(byFloor).map(Number).sort((a,b)=>b-a);  // 높은 층 먼저
  for(const f of floors){
    let free=0;
    for(const inv of byFloor[f]){
      if(roomClosure(inv.id,dep,arr)) continue;
      const cap=inv.max_capacity||inv.capacity;
      if(roomUsedFor(inv.id,dep,arr,pending,occ)+2<=cap) free++;
    }
    if(free>=needRooms) return f;
  }
  return null;
}

// list 를 2명씩 짝지어 primaryPool 에 배정. 없으면 fallbackPool(강등). 홀수 1명은 보류.
//   ★ 같은 팀 같은 층 원칙: 2방 이상이면 팀 전체가 들어갈 가장 높은 한 층으로 묶고,
//      그 층이 모자라면 전체 풀로 폴백(자리 없는 것보단 분산 배정).
function placePairs(g,list,primaryPool,fallbackPool,label,pending,holds,occ){
  const gc=teamGroupCode(g.event_seq)||('팀'+evNo(g.event_seq));
  const needRooms=Math.floor(list.length/2);
  let usePool=primaryPool;
  if(needRooms>=2){
    const f=pickFloor(primaryPool,needRooms,g.dep,g.arr,pending,occ);
    if(f!=null) usePool=primaryPool.filter(inv=>floorOf(inv)===f);   // 그 팀은 이 층으로 묶기
  }
  let i=0;
  for(; i+1<list.length; i+=2){
    let inv=pickRoom(usePool,g.dep,g.arr,2,pending,occ);
    if(!inv && usePool!==primaryPool) inv=pickRoom(primaryPool,g.dep,g.arr,2,pending,occ); // 같은 층 소진 → 전체 풀
    if(!inv && fallbackPool && fallbackPool!==primaryPool)
      inv=pickRoom(fallbackPool,g.dep,g.arr,2,pending,occ);
    if(!inv){ holds.push(`${gc} ${list[i].name_kr||''}·${list[i+1].name_kr||''}: ${label} 객실부족`); continue; }
    pending.push(mkRow(g,list[i],inv));
    pending.push(mkRow(g,list[i+1],inv));
  }
  if(i<list.length) holds.push(`${gc} ${list[i].name_kr||''}: 홀수 잔여`);
}

async function autoAssign(){
  if(!supa){toast('먼저 연결하세요','warn');return;}
  if(!state.guests||!state.guests.length){toast('먼저 날짜를 불러오세요','warn');return;}
  const btn=$('#btn-auto'); btn.disabled=true; const old=btn.textContent; btn.textContent='배정 중…';
  try{
    // 1) 기존 auto 배정 제거(재실행=재정렬, 수기 배정 보호)
    const autoIds=state.rooms.filter(r=>r.assign_source==='auto').map(r=>r.id);
    if(autoIds.length){
      const error=await deleteRoomsByIds(autoIds);
      if(error){toast('기존 자동배정 정리 실패: '+error.message,'err');return;}
      state.rooms=state.rooms.filter(r=>r.assign_source!=='auto');
    }
    rebuildAssignMap();

    // ── DB 기준 점유원장: 배정 대상 팀들의 전체 체류 구간에 걸치는 '모든' 기존 배정(다른 달 포함) ──
    //   · 위에서 이번 auto는 이미 삭제됨 → 남은 건 수기·분할 + 다른 달 배정. 정원 체크의 권위 소스.
    let occ = state.rooms.slice();   // 폴백
    try{
      const teamsAll=[...state.guests];
      const deps=teamsAll.map(g=>g.dep).filter(Boolean), arrs=teamsAll.map(g=>g.arr).filter(Boolean);
      if(deps.length && arrs.length){
        const spanFrom=deps.reduce((a,b)=>a<b?a:b), spanTo=arrs.reduce((a,b)=>a>b?a:b);
        // overlaps(span): check_in < spanTo AND check_out > spanFrom
        const occRes=await pagedQuery(()=>supa.from('rooms').select('id,inventory_id,assigned_pax,check_in,check_out,assign_source,event_seq,member_id').lt('check_in',spanTo).gt('check_out',spanFrom).order('id'));
        if(!occRes.error) occ=occRes.data||[];
      }
    }catch(e){ console.warn('점유원장 로드 실패, state.rooms로 폴백:', e.message); }

    const manual=assignedMemberSet();  // 수기로 이미 배정된 사람(보호)
    const pending=[], holds=[];
    const teams=[...state.guests].sort((a,b)=>a.event_seq-b.event_seq); // 예약순(선착)

    for(const g of teams){
      const route=autoRoute(g);
      if(!route) continue;
      const placed=new Set(pending.map(p=>p.member_id));
      const roster=teamRoster(g.event_seq).filter(m=>!manual.has(m.id) && !placed.has(m.id));
      if(!roster.length) continue;
      if(roster.length===3){ holds.push(`${teamGroupCode(g.event_seq)||('팀'+evNo(g.event_seq))} 3명팀 보류`); continue; }

      let mem = route.deluxe ? roster.filter(m=>isMember(m)) : [];
      let gen = route.deluxe ? roster.filter(m=>!isMember(m)) : roster.slice();
      // 외톨이 회원: 명단 앞 일반 1명을 디럭스로 끌어올려 짝 채움(룸메 유지)
      if(route.deluxe && mem.length%2===1 && gen.length>0) mem.push(gen.shift());

      if(route.deluxe){
        const dlx=roomPool(route,'deluxe'), gp=roomPool(route,'general');
        placePairs(g, mem, dlx, gp, '디럭스', pending, holds, occ); // 부족 시 일반종류로 강등
        placePairs(g, gen, gp, null, '일반', pending, holds, occ);
      }else{
        const gp=roomPool(route,'general');
        placePairs(g, gen, gp, null, route.fac, pending, holds, occ);
      }
    }

    if(!pending.length){ toast(holds.length?`자동배정 대상 없음 · 보류 ${holds.length}건`:'자동배정할 미배정 인원이 없습니다','warn'); return; }
    const {data,error}=await insertRoomsChunked(pending);
    if(error){toast('자동배정 저장 실패: '+error.message,'err');return;}
    (data||[]).forEach(r=>state.rooms.push(r));
    rebuildAssignMap(); render();
    logAssign('자동배정', `${state.from||''}~${state.to||''} 자동배정 재실행 — ${pending.length}명 재배치${holds.length?` · 보류 ${holds.length}건`:''}`);
    toast(`자동배정 ${pending.length}명 완료${holds.length?` · 보류 ${holds.length}건(콘솔)`:''}`, holds.length?'warn':'ok');
    if(holds.length) console.warn('[자동배정 보류 '+holds.length+'건]\n'+holds.join('\n'));
  }finally{ btn.disabled=false; btn.textContent=old; }
}

// ════════════════════════════════════════════════════════════════
//  충돌 점검 — 정원 초과(같은 방·겹치는 날 > 정원) 스캔 + 해소
//   · 초과분은 'auto'만 제거(수기·분할 보호) → 미배정 복귀 후 자동배정 재실행으로 재배치
//   · auto로 못 푸는(수기/분할이 초과) 방은 '수기확인'으로 표시
// ════════════════════════════════════════════════════════════════
// 한 방의 행들에서 정원 초과를 없애기 위해 제거할 auto 행 계획(늦은 예약 우선 제거)
function planResolve(rowsIn, cap){
  const rows=rowsIn.map(r=>({...r,_dropped:false}));
  const drop=[];
  const nights=()=>{ const ds=new Set(); rows.forEach(r=>{ if(!r._dropped) ds.add(r.check_in); }); return [...ds]; };
  const used=d=>rows.filter(r=>!r._dropped && r.check_in<=d && d<r.check_out).reduce((s,r)=>s+(r.assigned_pax||0),0);
  let guard=0;
  while(guard++<500){
    let worstD=null, worstU=cap;
    nights().forEach(d=>{ const u=used(d); if(u>worstU){ worstU=u; worstD=d; } });
    if(worstD===null) break;                       // 모든 밤 정원 이하
    const cand=rows.filter(r=>!r._dropped && r.assign_source==='auto' && r.check_in<=worstD && worstD<r.check_out);
    if(!cand.length) break;                         // auto 없음 → 수기만 남음(stuck)
    cand.sort((a,b)=>(b.event_seq||0)-(a.event_seq||0));   // 늦은 예약(낮은 우선순위) 먼저 제거
    cand[0]._dropped=true; drop.push(cand[0].id);
  }
  const stuck = nights().some(d=>used(d)>cap);
  return { drop, stuck };
}

async function checkConflicts(){
  if(!supa){ toast('먼저 연결하세요','warn'); return; }
  if(!state.from){ toast('먼저 날짜를 불러오세요','warn'); return; }
  const btn=$('#btn-conflicts'); btn.disabled=true; const old=btn.textContent; btn.textContent='점검 중…';
  try{
    // 로드된 달 범위에 걸치는 모든 배정(다른 달 팀 포함) 조회
    const res=await pagedQuery(()=>supa.from('rooms')
      .select('id,inventory_id,assigned_pax,check_in,check_out,assign_source,event_seq,member_id,room_no')
      .lte('check_in', state.to).gt('check_out', state.from).order('inventory_id'));
    if(res.error){ toast('점검 실패: '+res.error.message,'err'); return; }
    const byInv={}; (res.data||[]).forEach(r=>{ (byInv[r.inventory_id]=byInv[r.inventory_id]||[]).push(r); });
    const conflicts=[];
    for(const invId in byInv){
      const inv=state.inventory.find(i=>String(i.id)===String(invId));
      const cap=inv?(inv.max_capacity||inv.capacity):2;
      const rr=byInv[invId];
      const dates=new Set(); rr.forEach(r=>dates.add(r.check_in));
      let worst=0, worstDate=null;
      dates.forEach(d=>{ const u=rr.filter(r=>r.check_in<=d && d<r.check_out).reduce((s,r)=>s+(r.assigned_pax||0),0); if(u>worst){ worst=u; worstDate=d; } });
      if(worst>cap){ conflicts.push({ inv, invId, cap, rows:rr, worst, worstDate, plan:planResolve(rr,cap) }); }
    }
    openConflictModal(conflicts);
  }catch(e){ toast('점검 오류: '+e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

function closeConflictModal(){ const m=$('#conflict-modal'); if(m) m.remove(); }
function openConflictModal(conflicts){
  closeConflictModal();
  if(!conflicts.length){ toast('✓ 정원 초과(충돌) 없음','ok'); return; }
  const dropTotal=conflicts.reduce((s,c)=>s+c.plan.drop.length,0);
  const stuckCnt=conflicts.filter(c=>c.plan.stuck).length;
  const list=conflicts.map(c=>{
    const inv=c.inv||{};
    const rno=inv.room_no||c.rows[0].room_no||c.invId;
    const fac=inv.facility||'';
    const srcCnt=c.rows.reduce((o,r)=>{ o[r.assign_source||'?']=(o[r.assign_source||'?']||0)+(r.assigned_pax||0); return o; },{});
    const srcTxt=Object.entries(srcCnt).map(([k,v])=>`${k==='auto'?'자동':k==='manual'?'수기/분할':k} ${v}`).join(' · ');
    return `<div style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;background:${c.plan.stuck?'#fbf3e2':'#fdf1f0'}">

      <div style="font-size:11.5px;color:var(--text2);margin-top:2px">${srcTxt}</div>
      <div style="font-size:11.5px;margin-top:3px">${c.plan.stuck
        ? '<span style="color:var(--warn);font-weight:700">⚠ 수기확인 필요(수기/분할이 초과 — 자동 정리 불가)</span>'
        : `<span style="color:var(--accent2);font-weight:700">자동 정리 가능: 초과 auto ${c.plan.drop.length}명 해제</span>`}</div>
    </div>`;
  }).join('');
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='conflict-modal';
  bg.innerHTML=`<div class="modal" style="max-width:560px">
    <h2>⚠ 방배정 충돌 ${conflicts.length}건 (정원 초과)</h2>
    <div class="mbody">
      <p style="font-size:12.5px;color:var(--text2);margin-bottom:12px">같은 방·겹치는 날에 정원을 초과한 방입니다. <b>초과 auto 배정 ${dropTotal}명</b>을 해제해 정원 안으로 맞춥니다(수기·분할은 보호).${stuckCnt?` <b style="color:var(--warn)">수기확인 ${stuckCnt}건</b>은 직접 조정하세요.`:''}</p>
      ${list}
    </div>
    <div class="mfoot">
      <button class="btn ghost sm" type="button" id="cf-close">닫기</button>
      <button class="btn sm" type="button" id="cf-resolve" ${dropTotal?'':'disabled'} style="background:var(--err);border-color:var(--err)">초과 auto ${dropTotal}명 정리</button>
    </div>
  </div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeConflictModal(); });
  document.body.appendChild(bg);
  $('#cf-close').addEventListener('click', closeConflictModal);
  $('#cf-resolve').addEventListener('click', ()=>resolveConflicts(conflicts));
}

async function resolveConflicts(conflicts){
  const allDrop=[]; conflicts.forEach(c=>allDrop.push(...c.plan.drop));
  const stuckCnt=conflicts.filter(c=>c.plan.stuck).length;
  if(!allDrop.length){ toast(stuckCnt?`auto로 풀 수 없는 충돌 ${stuckCnt}건 — 수기 확인`:'정리할 auto 초과 없음','warn'); return; }
  const btn=$('#cf-resolve'); if(btn){ btn.disabled=true; btn.textContent='정리 중…'; }
  const err=await deleteRoomsByIds(allDrop);
  if(err){ toast('정리 실패: '+err.message,'err'); return; }
  const ds=new Set(allDrop.map(String));
  state.rooms=state.rooms.filter(r=>!ds.has(String(r.id)));
  rebuildAssignMap(); render();
  closeConflictModal();
  toast(`✓ 초과 ${allDrop.length}명 해제 — 「자동배정」 다시 실행하면 빈 방으로 재배치됩니다${stuckCnt?` · 수기확인 ${stuckCnt}건`:''}`, stuckCnt?'warn':'ok');
}

// ── rooms 대량 삭제/삽입은 청크로 (in() URL 길이·body 한계 회피) ──
async function deleteRoomsByIds(ids){
  for(let i=0;i<ids.length;i+=50){
    const {error}=await supa.from('rooms').delete().in('id',ids.slice(i,i+50));
    if(error) return error;
  }
  return null;
}
async function insertRoomsChunked(rows){
  const out=[];
  for(let i=0;i<rows.length;i+=200){
    const {data,error}=await supa.from('rooms').insert(rows.slice(i,i+200)).select();
    if(error) return {error};
    if(data) out.push(...data);
  }
  return {data:out};
}

}

  return snap;
}

async function saveHotelRooms(bg,types,cur){
  const toInsert=[];
  let order=0;
  for(const t of types){
    const want=parseInt(bg.querySelector(`input[data-type="${t.key}"]`).value,10)||0;
    const have=cur[t.key]||0;
    if(want>have){
      for(let i=have+1;i<=want;i++){
        toInsert.push({
          facility:'야마나미리조트', zone:'호텔동',
          room_no:`${t.label} ${i}`, room_type:t.key,
          capacity:t.cap, max_capacity:t.cap, active:true, sort_order:order++
        });
      }
    } else if(want<have){
      toast(`${t.label} 축소는 화면에서 개별 비활성 처리하세요(데이터 보호)`,'warn');
    }
  }
  if(!toInsert.length){toast('추가할 호실 없음','warn');bg.remove();return;}
  const {error}=await supa.from('room_inventory').upsert(toInsert,{onConflict:'facility,room_no'});
  if(error){toast('저장 실패: '+error.message,'err');return;}
  await loadInventory();
  bg.remove(); render();
  toast(`호텔동 ${toInsert.length}실 등록`,'ok');
}

async function loadHist(reset){
  if(!supa){ $('#hist-list').innerHTML='<div class="empty-hint" style="padding:14px">먼저 연결하세요.</div>'; return; }
  if(_histLoading) return; _histLoading=true;

      .eq('entity','room_assign').order('changed_at',{ascending:false})
      .range(_histOff,_histOff+HIST_PAGE-1);
    if(_histQ) q=q.ilike('label','%'+_histQ+'%');

    else $('#hist-list').insertAdjacentHTML('beforeend', html);
    _histOff+=rows.length;

// ════════════════════════════════════════════════════════════════════════
//  엑셀 일괄 배정 (내보내기 / 업로드)
//  양식: eventSeq | 태그코드 | 대표자 | 인원 | 시설 | 호수
//   · 현재 점유 팀을 내보내면 호수만 비어서 나옴 → 채워서 다시 올리면 일괄 배정
//   · 매칭: eventSeq(1순위) → 객실은 시설+호수
// ════════════════════════════════════════════════════════════════════════
function exportAssignXlsx(){
  if(!state.guests||!state.guests.length){toast('먼저 날짜를 불러오세요','warn');return;}
  // 사람 1행씩 (v13.4 宿泊配置表 형태). member_id 로 배정 호수 매핑.
  const roomByMember={};
  state.rooms.forEach(r=>{ if(r.member_id!=null) (roomByMember[r.member_id]=roomByMember[r.member_id]||[]).push(r.room_no); });
  const rows=[];
  state.guests.forEach(g=>{
    teamRoster(g.event_seq).forEach(m=>{
      rows.push({
        행사번호:evNo(g.event_seq),
        태그코드:m.tag||'',
        대표자:g.rep||'',
        성명:m.name_kr||'',
        영문명:m.name_en||'',
        시설:g.accom||'',
        호수:(roomByMember[m.id]||[]).join(', ')
      });
    });
  });
  const ws=XLSX.utils.json_to_sheet(rows,{header:['행사번호','태그코드','대표자','성명','영문명','시설','호수']});
  ws['!cols']=[{wch:10},{wch:12},{wch:10},{wch:10},{wch:16},{wch:16},{wch:16}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'방배정');
  const label=(state.from||'')+(state.to&&state.to!==state.from?'_'+state.to:'');
  XLSX.writeFile(wb,`방배정양식_${label||'export'}.xlsx`);
  toast('양식 내보내기 완료 — 호수 칸을 채워 다시 올리세요','ok');
}

async function importAssignXlsx(file){
  if(!supa){toast('먼저 연결하세요','warn');return;}
  if(!state.guests||!state.guests.length){toast('먼저 날짜를 불러오세요','warn');return;}
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  // 호수 → inventory 매핑 (시설+호수, 또는 호수만)
  const invByRoom={};
  state.inventory.forEach(i=>{
    invByRoom[(i.facility+'|'+i.room_no)]=i;
    invByRoom[i.room_no]=i; // 호수만으로도 (중복 거의 없음)
  });
  // 태그코드 → member 매핑 (개인 단위)
  const memberByTag={};
  state.guests.forEach(g=>{ teamRoster(g.event_seq).forEach(m=>{ if(m.tag) memberByTag[m.tag]=m; }); });
  const doneSet=assignedMemberSet();
  let ok=0,skip=0,fail=0; const msgs=[];
  for(const row of rows){
    const tag=String(row['태그코드']||'').trim();
    const roomStr=String(row['호수']||'').trim();
    if(!tag||!roomStr){skip++;continue;}
    const m=memberByTag[tag];
    if(!m){fail++; msgs.push(`태그 '${tag}' 명단에 없음`); continue;}
    if(doneSet.has(m.id)){skip++;continue;} // 이미 배정됨
    const rn=roomStr.split(/[,，]/)[0].trim(); // 한 사람은 한 방
    const fac=String(row['시설']||'').trim();
    const inv=invByRoom[fac+'|'+rn]||invByRoom[rn];
    if(!inv){fail++; msgs.push(`${tag}: 호수 '${rn}' 못찾음`); continue;}
    await assignMembers([m.id], inv);
    doneSet.add(m.id);
    ok++;
  }
  toast(`일괄 배정: 성공 ${ok} · 건너뜀 ${skip} · 실패 ${fail}`, fail?'warn':'ok');
  if(msgs.length) console.warn(msgs.join('\n'));
}

$('#unassigned').addEventListener('drop',e=>{ e.preventDefault(); });

// 월 기본값(이번 달) + 저장된 연결정보로 자동 연결·자동 로드
loadCreds();
// 프론트 데스크 등에서 ?ym=&date= 딥링크 → 그 달 로드 후 그 날짜로 포커스
(function(){ const q=new URLSearchParams(location.search); const m=q.get('ym')||isoToday().slice(0,7); $('#month-pick').value=m; $('#date-pick').value=m+'-01'; $('#date-to').value=lastDayOfMonth(m); window._deepDate=q.get('date')||null; })();
if($('#sb-url').value && $('#sb-key').value){ connect(); }   // 진입 시 자동 연결

// 언어 전환 시 현재 화면 다시 그리기(로드된 데이터가 있으면)
window.onSaizenLangChange = function(){ try{ if(typeof render==='function' && state && state.guests) render(); }catch(e){} try{ renderSelBar(); }catch(e){} };

// 고정 컨트롤 바 높이 동기화 — topbar 높이로 ctrlbar top을 맞추고, (topbar+ctrlbar) 높이를
//   --stick2 로 내려 좌측 패널이 그 아래에 붙게. 스크롤 핸들러 없이 ResizeObserver만(랙 없음).
(function(){
  const tb=document.querySelector('.topbar'), cb=document.getElementById('ctrlbar');
  if(!tb||!cb) return;
  function sync(){
    const tbh=tb.offsetHeight||56;
    cb.style.top=tbh+'px';
    document.documentElement.style.setProperty('--stick2',(tbh+cb.offsetHeight+6)+'px');
  }
  sync();
  if(window.ResizeObserver){ const ro=new ResizeObserver(sync); ro.observe(tb); ro.observe(cb); }
  window.addEventListener('resize',sync);
})();
</script>
</body>
