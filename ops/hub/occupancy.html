<!DOCTYPE html>
<html lang="ja">
<!-- ============================================================================
  일별 체류 현황표 (occupancy.html)
  ----------------------------------------------------------------------------
  Min 2026-08: 메리트투어 「호텔 블록」 표는 *잔여* 객실을 보는 용도.
  현장(사이젠)은 반대로 *체류로 채워진 수량*을 봐야 하므로 같은 형식으로
  「사용 / 보유」를 보여준다. 읽기 전용(데이터 변경 없음).
   · 행 = 숙소 → 룸타입, 열 = 날짜(여러 달 이어보기)
   · 칸 위 = 그날 밤 사용 객실 수, 아래 = 보유 객실 수
   · 칸 클릭 = 그날 그 룸타입에 든 팀 목록이 아래에
============================================================================ -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 일별 체류 현황</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── 공통 chrome (전 ops 페이지 공유 정본) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);
    padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.xs{font-size:12px;padding:3px 9px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 ── */
  main{padding:16px 20px 70px;max-width:1800px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:4px}
  .panel .desc{font-size:12px;color:var(--text2);margin:6px 0 10px;line-height:1.55}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .lbl{font-size:12px;font-weight:800;color:var(--text2);margin-right:2px}
  .chip{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--surface3);
    color:var(--text2);border:1px solid var(--border);cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip[disabled]{opacity:.42;cursor:not-allowed;border-color:var(--border)}   /* 룸타입 칩 = 숙소를 먼저 고른 뒤에만(Min 2026-09) */
  .lock{font-size:11.5px;font-weight:700;color:var(--muted)}
  .deny{padding:38px 20px;text-align:center;color:var(--muted);font-size:14px;font-weight:700}

  .tw{overflow:auto;max-height:74vh;border:1px solid var(--border2);border-radius:10px;background:var(--surface)}
  table.oc{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}
  table.oc th,table.oc td{border-right:1px solid #e7eaee;border-bottom:1px solid #e7eaee;padding:0}
  table.oc thead th{position:sticky;top:0;z-index:3;background:#eef1f4;font-size:11.5px;font-weight:800;color:var(--text2);
    padding:5px 3px;text-align:center;min-width:40px;border-bottom:2px solid var(--border2)}
  table.oc thead th.sun{color:var(--err);background:#fbf0ee} table.oc thead th.sat{color:#2b5f9e;background:#eef3fa}
  table.oc thead th.today{background:var(--accent);color:#fff}
  table.oc thead th.mstart, table.oc td.c.mstart{border-left:2px solid var(--accent)}
  table.oc th.rh{position:sticky;left:0;z-index:4;background:#eef1f4;text-align:left;padding:6px 12px;min-width:230px;
    font-size:12.5px;font-weight:800;color:var(--text);border-bottom:2px solid var(--border2)}
  table.oc td.rh{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:7px 12px;min-width:230px;
    font-size:13.5px;font-weight:800;color:var(--text);border-right:2px solid var(--border2)}
  table.oc tr.fac td.rh{background:var(--surface3);font-size:12px;color:var(--accent)}
  table.oc td.rh .rt{font-weight:800}
  table.oc td.rh .own{font-family:var(--mono);font-size:11px;color:#fff;background:var(--text2);
    border-radius:99px;padding:1px 8px;margin-left:8px;font-weight:800}
  table.oc td.c{text-align:center;cursor:pointer;font-family:var(--mono);font-size:16px;font-weight:800;
    height:34px;padding:0 2px;color:#1b2a1b}
  table.oc td.c.wk{box-shadow:inset 0 0 0 99px rgba(0,0,0,.028)}
  /* 「예약 가능」 = 그 날짜부터 표준 패턴(3·4·7박)대로 끝까지 방이 남아 있다 */
  table.oc td.c .nd{display:inline;font-family:var(--sans);font-style:normal;font-size:10px;
    font-weight:800;color:#b3382c;margin-left:1px;vertical-align:super}
  /* 그날 폐쇄 객실 — 칸 오른쪽 위 작은 주황 모서리 표시만(Min 2026-09 「아주 작은 마킹, 커서 올리면 알아볼 정도」). 객실·사유는 칸 툴팁 */
  table.oc td.c{position:relative}
  table.oc td.c.hascl::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent #c2410c transparent transparent}
  .lgd i.cll{width:13px;height:13px;background:var(--surface);border:1px solid var(--border);border-radius:3px;position:relative;overflow:hidden;vertical-align:-2px}
  .lgd i.cll::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent #c2410c transparent transparent}
  /* 싱글 신청 통합 줄 = 룸타입 「싱글」 줄과 합침: 칸=신청 수(보유 대비 색), +N=미배정, ?=수량 못 읽음. 사용(배정 싱글)은 툴팁 */
  table.oc tr.sgm td.rh .rt{color:#6b5312}
  table.oc tr.sgm td.c i.tent{font-style:normal;font-size:10.5px;font-weight:800;color:#a8442f;margin-left:2px;vertical-align:super}
  table.oc tr.sgm td.c i.unk{font-style:normal;font-size:10.5px;font-weight:800;color:#8a8a8a;margin-left:2px;vertical-align:super}
  table.oc td.c .bk{display:block;font-family:var(--sans);font-style:normal;font-size:9px;font-weight:800;
    line-height:1.1;margin-top:1px;color:#0f6b34;letter-spacing:-.2px}
  /* 범례의 「3박」 표본 — 표 안 초록 라벨(.bk)과 같은 모양. ⚠ 범례 컨테이너는 .lgd (이전 선택자 .legend 는 안 맞아 13px 상자에 「3」만 갇혔다) */
  .lgd i.bkl{width:auto;height:auto;background:none;border:none;border-radius:0;white-space:nowrap;
    font-family:var(--sans);font-style:normal;font-size:10px;font-weight:800;color:#0f6b34;padding:0 2px;vertical-align:0}
  table.oc td.c.free{background:#cfe8d4}
  table.oc td.c.tight{background:#fbe6a8}
  table.oc td.c.full{background:#c8d4e6;color:#1f3a5f}                    /* 만실 = 딱 찼다(정상) */
  table.oc td.c.over{background:#c0392b;color:#fff;font-weight:800}        /* 초과 = 넘겼다(조치 필요) */
  table.oc td.c.over::after{content:"!";font-size:11px;vertical-align:super;margin-left:1px}
  table.oc td.c.zero{background:#fafbfc;color:#c9ced6;font-weight:600;font-size:13px}
  /* 대기 예약 줄 — 방을 차지하지 않는 예약이라 **객실 수가 아니라 팀·인원**으로 따로 보여준다 */
  /* 미배정 = 방을 아직 못 받은 인원(사용 수에 안 들어간다) — 빨강 계열로 눈에 걸리게 */
  table.oc tr.una td{background:#fdeceb;color:#8f2d24;border-top:1px dashed #e0a49d}
  table.oc tr.una td.rh{font-weight:800;font-size:12px;color:#8f2d24}
  table.oc tr.una td.c{font-size:12px;font-weight:800;cursor:default}
  table.oc tr.una td.c.none{color:#e3bdb8;font-weight:600}
  /* 싱글 신청 줄 — 비고에서 뽑은 요청 수량(배정 결과가 아니다) */
  table.oc tr.sgr td{background:#fdf6e7;color:#6b5312;border-top:1px dashed #e6d3a3}
  table.oc tr.sgr td.rh{font-weight:800;font-size:12px;color:#6b5312}
  table.oc tr.sgr td.c{font-size:12.5px;font-weight:800;cursor:default}
  table.oc tr.sgr td.c.none{color:#d8cba6;font-weight:600}
  table.oc tr.sgr td.c i.tent{font-style:normal;font-size:10.5px;font-weight:800;color:#a8442f;margin-left:2px}
  table.oc tr.sgr td.c i.unk{font-style:normal;font-size:10.5px;font-weight:800;color:#8a8a8a;margin-left:2px}   /* 싱글 언급은 있는데 수량을 못 읽음 → 비고 확인 */
  table.oc tr.wait td{background:#f2f0f7;color:#4a3d63;border-top:1px dashed #b9aed4}
  table.oc tr.wait td.rh{font-weight:800;font-size:12px;color:#4a3d63}
  table.oc tr.wait td.c{font-size:12px;font-weight:800;cursor:default}
  table.oc tr.wait td.c.none{color:#c3bcd4;font-weight:600}
  table.oc td.c.sel{outline:3px solid var(--accent);outline-offset:-3px}
  table.oc tr.sum td{background:#e3e7ec;font-weight:800;border-top:2px solid var(--border2)}
  table.oc tr.sum td.c{font-size:15px;color:var(--text)}
  table.oc tbody tr:hover td.rh{background:var(--accentSoft)}
  .lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);font-weight:700;margin-top:8px;align-items:center}
  .lgd i{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid var(--border2);margin-right:4px;vertical-align:-2px;font-style:normal}
  .lgd .f{background:#cfe8d4}.lgd .t{background:#fbe6a8}.lgd .u{background:#c8d4e6}.lgd .x{background:#c0392b}
  .lgd .w{background:#f2f0f7;border:1px dashed #b9aed4}

  table.dt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.dt th{background:var(--surface2);border-bottom:1px solid var(--border2);padding:6px 9px;text-align:left;font-size:11px;color:var(--text2);font-weight:800;white-space:nowrap}
  table.dt td{border-bottom:1px solid var(--border);padding:6px 9px;white-space:nowrap}
  table.dt td.m{font-family:var(--mono)}
  table.dt tr:hover td{background:var(--surface2)}
  .tag{font-family:var(--mono);font-weight:800;color:var(--accent2)}
</style>

</head>
<body data-so-area="occupancy">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈 / ホーム"><img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen"></a>
  <span class="step" id="t-step">일별 체류 현황</span>

<div class="conn">

</div>

<main id="content">
  <div class="panel"><div class="deny" id="t-preconn">연결 후 표시됩니다.</div></div>
</main>

<script>
const $=s=>document.querySelector(s);

const L={
  ja:{ step:'日別 滞在状況', connHint:'接続情報はこのブラウザにのみ保存されます。', preConn:'接続すると表示されます。',

    thRow:'施設・ルームタイプ', own:'保有',
    dtTitle:d=>`${d} の内訳`, dtNone:'この日この客室タイプに滞在中のチームはありません。',

    sumRow:'合計', noData:'データがありません。',

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}

function shiftYM(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymBounds(ym){const [y,m]=ym.split('-').map(Number);const last=new Date(y,m,0).getDate();return {from:`${ym}-01`,to:`${ym}-${String(last).padStart(2,'0')}`};}
function fmt(d){ return SZCore.fmtDate(d); }

async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.textContent=tx('connecting');
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect'); btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+esc(tx('loginTitle'))+'<br><small>'+esc(tx('loginSub'))+'</small></div></div>'; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn'); btn.classList.add('connected'); btn.disabled=false;
    renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn'); btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

async function paged(qf){
  const out=[]; let from=0;
  for(;;){ const {data,error}=await qf(from,from+999); if(error) return {error};
    out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return {data:out};
}
async function pagedIn(table,cols,col,vals){
  const out=[];
  for(let i=0;i<vals.length;i+=200){
    const ch=vals.slice(i,i+200);
    const r=await paged((a,b)=>supa.from(table).select(cols).in(col,ch).order(col).range(a,b));
    if(r.error) return r; out.push(...r.data);
  }
  return {data:out};
}

// 이번 달 기준 ±3개월을 칩으로. 여러 개 골라 이어서 본다(메리트 표와 같은 방식).
function renderMonthChips(){
  const box=$('#mchips'); if(!box) return;
  const base=thisYM(), opts=[];
  for(let i=-1;i<=4;i++) opts.push(shiftYM(base,i));
  box.innerHTML=opts.map(ym=>`<button type="button" class="chip${YMS.includes(ym)?' on':''}" data-ym="${ym}">${ym.slice(2).replace('-','/')}</button>`).join('');
  box.querySelectorAll('[data-ym]').forEach(b=>b.addEventListener('click',()=>{
    const ym=b.dataset.ym;
    if(YMS.includes(ym)){ if(YMS.length>1) YMS=YMS.filter(x=>x!==ym); }
    else YMS=YMS.concat([ym]).sort();
    renderMonthChips(); load();
  }));
}
function renderAccomChips(){
  const box=$('#achips'); if(!box) return;
  const list=[...new Set(INV.map(i=>i.facility).filter(Boolean))].sort((a,b)=>accomIdx(a)-accomIdx(b));
  box.innerHTML=`<button type="button" class="chip${ACCOMSEL.size?'':' on'}" data-a="">${esc(tx('all'))}</button>`
    +list.map(a=>`<button type="button" class="chip${ACCOMSEL.has(a)?' on':''}" data-a="${esc(a)}">${esc(accomL(a))}</button>`).join('');
  box.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.a;
    if(!a) ACCOMSEL.clear();
    else { if(ACCOMSEL.has(a)) ACCOMSEL.delete(a); else ACCOMSEL.add(a); }
    renderAccomChips(); renderTypeChips(); renderGrid();
  }));
}

// 룸타입 칩 = 지금 보이는 숙소의 줄 라벨(디럭스 트윈·트윈·…·아소별장·돔하우스)마다 보유 수량을 달아 다중 선택. 비면 전체.
function renderTypeChips(){
  const box=$('#tchips'); if(!box) return;
  //  숙소를 고르기 전에는 잠근다(Min 2026-09 「숙소 토글을 먼저 클릭해야 클릭할 수 있게」) — 전 숙소 라벨이 섞여 수량이 뜻을 잃는다.
  const locked=!ACCOMSEL.size; if(locked) TYPESEL.clear();
  const rows=ROWS.filter(r=>!ACCOMSEL.size||ACCOMSEL.has(r.facility));
  const cnt={}; rows.forEach(r=>{ const l=r.label||accomL(r.facility); cnt[l]=(cnt[l]||0)+r.own; });
  const labels=Object.keys(cnt);
  [...TYPESEL].forEach(t=>{ if(!labels.includes(t)) TYPESEL.delete(t); });   // 보기 전환으로 사라진 라벨은 해제
  const dis=locked?' disabled':'';
  box.innerHTML=`<button type="button" class="chip${TYPESEL.size||locked?'':' on'}" data-t=""${dis}>${esc(tx('all'))}</button>`
    +labels.map(l=>`<button type="button" class="chip${TYPESEL.has(l)?' on':''}" data-t="${esc(l)}"${dis}>${esc(l)} <b style="font-family:var(--mono)">${cnt[l]}</b></button>`).join('')
    +(locked?`<span class="lock">${esc(tx('rtypeLock'))}</span>`:'');
  box.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{
    if(locked) return;
    const t=b.dataset.t;
    if(!t) TYPESEL.clear(); else { if(TYPESEL.has(t)) TYPESEL.delete(t); else TYPESEL.add(t); }
    renderTypeChips(); renderGrid();
  }));
}

async function load(){
  if(!supa) return;
  $('#stat').textContent=tx('loading');
  try{
    const from=ymBounds(YMS[0]).from, to=ymBounds(YMS[YMS.length-1]).to;
    // 날짜 축 = 선택한 달들을 이어붙인 연속 일자
    DAYS=[];
    YMS.forEach(ym=>{ const b=ymBounds(ym); const d=SZCore.parseLocalDate(b.from), e=SZCore.parseLocalDate(b.to);
      for(;d<=e;d.setDate(d.getDate()+1)) DAYS.push(fmt(d)); });

    // 1) 객실 마스터(보유)
    const iv=await paged((a,b)=>supa.from('room_inventory')
      .select('id,facility,zone,room_type,max_capacity,active').order('id').range(a,b));
    if(iv.error) throw iv.error;
    INV_ALL=(iv.data||[]);
    INV=INV_ALL.filter(x=>x.active!==false);
    const invMap={}; INV_ALL.forEach(i=>{ invMap[i.id]=i; });
    // 객실 폐쇄(현지 담당자가 방배정 화면에서 기간 폐쇄) — 그 날짜 보유에서 뺀다(Min 2026-09)
    CLOSED={};
    try{ const {data:cl}=await supa.from('room_closures').select('inventory_id,from_date,to_date,reason').lte('from_date',to).gte('to_date',from);
      (cl||[]).forEach(c=>{ (CLOSED[c.inventory_id]=CLOSED[c.inventory_id]||[]).push({from:String(c.from_date).slice(0,10), to:String(c.to_date).slice(0,10), reason:c.reason||''}); }); }catch(e){ CLOSED={}; }

    // 2) 그 기간에 걸치는 배정 (체류 = check_in <= 날짜 < check_out)
    const rm=await paged((a,b)=>supa.from('rooms')
      .select('event_seq,member_id,inventory_id,room_no,check_in,check_out')
      .lt('check_in',to).gt('check_out',from).order('event_seq').range(a,b));
    if(rm.error) throw rm.error;
    ROOMS=(rm.data||[]).filter(r=>invMap[r.inventory_id]);

    // 3) 팀 라벨(그룹코드·대표)
    const seqs=[...new Set(ROOMS.map(r=>r.event_seq))];
    TEAM={};
    if(seqs.length){
      const gs=await pagedIn('guests','event_seq,group_code,team_tag,accom','event_seq',seqs);
      if(gs.error) throw gs.error;
      (gs.data||[]).forEach(g=>{ TEAM[g.event_seq]={tag:g.team_tag||g.group_code||'', accom:g.accom||'', rep:''}; });
      // 묶은 팀(現地手配書)은 대표팀 코드+팀번호로 표시 — 인쇄물과 같은 코드
      try{ const GT=(window.__so_groupTags? await __so_groupTags(supa,seqs) : {});
        Object.keys(GT).forEach(k=>{ if(TEAM[k]) TEAM[k].tag=GT[k]; }); }catch(e){}
      const bs=await pagedIn('bookings','event_seq,rep_name,status','event_seq',seqs);
      if(bs.error) throw bs.error;
      (bs.data||[]).forEach(b=>{ const t=(TEAM[b.event_seq]=TEAM[b.event_seq]||{tag:'',accom:''});
        t.rep=b.rep_name||''; t.status=b.status||''; });
    }
    // 3-2) 미배정 — 방을 아직 못 받은 인원. rooms 에 없으므로 **예약 인원과 대조해** 따로 센다.
    //   ⚠ 이 표는 배정된 방만 세므로, 미배정이 남아 있으면 실제보다 한산해 보인다(Min 지적 2026-08).
    //   그 숙소·그 날짜에 미배정이 있으면 「예약 가능」도 표시하지 않는다 — 들어갈 방이 아직 정해지지 않았기 때문.
    //   ⚠ 예약은 **그 기간에 걸치는 bookings 전체**에서 읽는다 — 방을 하나도 못 받은 팀은 rooms 에 없으므로
    //   rooms 의 팀 목록으로 bookings 를 찾으면 그 팀이 통째로 빠진다(2026-09 발견: 9~11월 야마나미 49팀이 안 보였다).
    const RB=await paged((a,b)=>supa.from('bookings')
      .select('event_seq,pax,dep_date,arr_date,rep_name,status,remark,remark_local,product_name')
      .lt('dep_date',to).gt('arr_date',from).order('event_seq').range(a,b)) /* 대기 포함: 「대기 예약」 줄로 따로 보이고, 사용 집계는 isWait 로 뺀다 */;
    if(RB.error) throw RB.error;
    const RBOOK=(RB.data||[]).filter(b=>!String(b.status||'').includes('대기'));
    const GACC={};   // event_seq → guests.accom (그 기간 예약 전부)
    { const rs=[...new Set(RBOOK.map(b=>b.event_seq))];
      for(let i=0;i<rs.length;i+=300){
        const {data:gs}=await supa.from('guests').select('event_seq,accom').in('event_seq',rs.slice(i,i+300));
        (gs||[]).forEach(g=>{ GACC[g.event_seq]=g.accom||''; }); } }
    // 3-3) 현지 수배서에서 묶은 팀(print_overrides.team_group) = 한 팀. 미배정·싱글 신청은 **묶음 단위**로 센다(Min 2026-09).
    //   예약이 두 건으로 갈린 한 팀은 같은 비고가 양쪽에 복사돼 싱글이 두 번 세어지고, 1명+3명이 예약별로 홀수라 싱글 2가 붙었다(9/10 32→24).
    const TG={}, TGREP={};
    { const rs=[...new Set(RBOOK.map(b=>b.event_seq))];
      for(let i=0;i<rs.length;i+=300){
        try{ const {data:po}=await supa.from('print_overrides').select('event_seq,team_group,team_group_rep').in('event_seq',rs.slice(i,i+300));
          (po||[]).forEach(x=>{ if(x.team_group){ TG[x.event_seq]=x.team_group; if(x.team_group_rep) TGREP[x.event_seq]=true; } }); }catch(e){}
      } }
    const GROUPS={};   // 묶음 키 → 예약들(묶이지 않은 팀은 자기 혼자)
    RBOOK.forEach(b=>{ const k=TG[b.event_seq]||('seq:'+b.event_seq); (GROUPS[k]=GROUPS[k]||[]).push(b); });
    Object.values(GROUPS).forEach(g=>g.sort((a,b)=>(TGREP[b.event_seq]?1:0)-(TGREP[a.event_seq]?1:0) || a.event_seq-b.event_seq));   // 대표 예약 먼저
    const stays=(b,ds)=>String(b.dep_date).slice(0,10)<=ds && ds<String(b.arr_date).slice(0,10);
    const nightsOf=g=>{ const set=new Set(); g.forEach(b=>{ const c=SZCore.parseLocalDate(b.dep_date), e=SZCore.parseLocalDate(b.arr_date); if(isNaN(c)||isNaN(e)) return;
      for(const d=new Date(c); d<e; d.setDate(d.getDate()+1)){ const ds=fmt(d); if(DAYS.includes(ds)) set.add(ds); } }); return [...set].sort(); };
    UNA={}; UNAG={};
    {
      const asgn={};   // event_seq → 배정된 사람 수
      ROOMS.forEach(r=>{ if(r.member_id!=null){ (asgn[r.event_seq]=asgn[r.event_seq]||new Set()).add(r.member_id); } });
      const leftOf=b=>Math.max(0,(Number(b.pax)||0)-((asgn[b.event_seq]&&asgn[b.event_seq].size)||0));
      Object.values(GROUPS).forEach(g=>{
        const fac=GACC[g[0].event_seq]||(TEAM[g[0].event_seq]&&TEAM[g[0].event_seq].accom)||''; if(!fac) return;
        const grp=needGroup(fac, g[0].product_name||'');   // 미배정 필요실이 들어갈 구역(돔하우스 상품=돔하우스 줄, Min 2026-09)
        nightsOf(g).forEach(ds=>{
          const left=g.filter(b=>stays(b,ds)).reduce((n,b)=>n+leftOf(b),0); if(!left) return;
          const rooms=Math.ceil(left/2);        // 2인 1실 기준(보수적) — 묶음 합계로 홀수 판정
          const m=(UNA[fac]=UNA[fac]||{}); const cell=(m[ds]=m[ds]||{teams:0,pax:0,need:0,reps:[],grp:{}});
          cell.teams++; cell.pax+=left; cell.need+=rooms;
          if(cell.reps.length<8) cell.reps.push(g[0].rep_name||'');
          const gc=(cell.grp[grp]=cell.grp[grp]||{teams:0,pax:0,need:0}); gc.teams++; gc.pax+=left; gc.need+=rooms;
          const gk=fac+(grp?'|'+grp:''); const gm=(UNAG[gk]=UNAG[gk]||{}); gm[ds]=(gm[ds]||0)+rooms;
        });
      });
    }
    // 4) 대기 예약 — **방을 안 잡아도** 보여야 하므로 bookings 에서 직접 읽는다.
    //    (만실이어도 받아 두는 예약이라 rooms 에 없다 — 있는 것이 오히려 이상하다)
    WAIT={};
    const wb=await paged((a,b)=>supa.from('bookings')
      .select('event_seq,pax,dep_date,arr_date,rep_name')
      .eq('status','대기').lt('dep_date',to).gt('arr_date',from).order('event_seq').range(a,b));
    if(wb.error) throw wb.error;
    const wseqs=(wb.data||[]).map(x=>x.event_seq);
    const WACC={};
    for(let i=0;i<wseqs.length;i+=300){
      const {data:gs}=await supa.from('guests').select('event_seq,accom').in('event_seq',wseqs.slice(i,i+300));
      (gs||[]).forEach(g=>{ WACC[g.event_seq]=g.accom||''; });
    }
    (wb.data||[]).forEach(b=>{
      const fac=WACC[b.event_seq]||'';
      const c=SZCore.parseLocalDate(b.dep_date), e=SZCore.parseLocalDate(b.arr_date);
      if(isNaN(c)||isNaN(e)) return;
      for(const d=new Date(c); d<e; d.setDate(d.getDate()+1)){
        const ds=fmt(d); if(!DAYS.includes(ds)) continue;
        const m=(WAIT[fac]=WAIT[fac]||{}); const cell=(m[ds]=m[ds]||{teams:0,pax:0,reps:[]});
        cell.teams++; cell.pax+=Number(b.pax)||0; if(cell.reps.length<6) cell.reps.push(b.rep_name||'');
      }
    });
    // 5) 싱글 신청 — 비고에 적힌 **싱글 방 수**를 그날 밤마다 더한다(Min 2026-08).
    //    표의 「싱글」 행은 배정된 **결과**라, 배정 전에는 신청이 얼마나 들어왔는지 볼 수가 없었다.
    //    ⚠ 대기 예약은 방을 안 잡으므로 여기서도 뺀다(표의 다른 줄과 같은 기준).
    //    빨간 +N = 신청한 싱글 중 **그날 밤 아직 싱글로 배정하지 않은 수**(신청 − 그 팀원 한 명만 들어간 방 수, Min 2026-09).
    //    「배정된 싱글」= 타입 무관 1인 사용 방(싱글 객실이든 트윈 1인 사용이든) — 싱글 타입만 세면 트윈 1인 사용이 영영 미배정으로 남는다.
    //    신청 수는 SZCore.singleRequested — 숫자 표기 외에 「전원 싱글」(=인원)·이름 나열·**홀수 인원 팀(남는 1명=1방, 트리플 언급 없을 때)** 도 센다. 못 읽으면 회색 「?」(비고 확인).
    //    이전의 「대기·불가 = 미확정」 판단은 뺐다 — 줄 수 있을지의 판단은 담당자 몫이고, 표는 남은 수량만 보여 주면 된다.
    SGR={};
    {
      //  묶음 단위: 그날 묵는 예약들의 인원을 합치고, 비고는 **서로 다른 문장마다 한 번씩** 읽어 가장 큰 수를 쓴다(같은 비고가 두 예약에 복사돼 있으면 한 번만).
      const reqOf=(texts,pax)=>{ const ts=[...new Set(texts.map(t=>String(t||'').trim()).filter(Boolean))]; if(!ts.length) ts.push('');
        let best={n:0,how:''}, none=false;
        ts.forEach(t=>{ const r=SZCore.singleRequested?SZCore.singleRequested(t,pax):{n:(SZCore.singleCount?SZCore.singleCount(t):0),how:'num'};
          if(r.how==='none') none=true; if((r.n||0)>best.n || (!best.how && r.how && r.how!=='none')) best={n:r.n||0,how:r.how}; });
        if(!best.n && none) return {n:0,how:'none'}; return best; };
      Object.values(GROUPS).forEach(g=>{
        const fac=GACC[g[0].event_seq]||''; if(!fac) return;
        const rep=g[0].rep_name||'';
        nightsOf(g).forEach(ds=>{
          const on=g.filter(b=>stays(b,ds)); if(!on.length) return;
          const pax=on.reduce((n,b)=>n+(Number(b.pax)||0),0);
          const x=reqOf(on.map(b=>[b.remark_local,b.remark].filter(Boolean).join('\n')), pax);
          if(!x.how) return;   // 싱글 수요 없음(짝수·언급 없음)
          const m=(SGR[fac]=SGR[fac]||{});
          const cell=(m[ds]=m[ds]||{rooms:0, una:0, unk:0, teams:[]});
          if(x.how==='none'){ cell.unk++; if(cell.teams.length<10) cell.teams.push(rep+' ?'); return; }
          const una=singleUnassigned(x.n, on.map(b=>b.event_seq), ds);
          cell.rooms+=x.n; cell.una+=una;
          if(cell.teams.length<10) cell.teams.push(rep+(on.length>1?'+'+(on.length-1):'')+' '+x.n+(x.how==='all'?tx('sgrAllTag'):x.how==='odd'?tx('sgrOddTag'):'')+(una?('('+tx('sgrUnaN')(una)+')'):''));
        });
      });
    }
    buildRows();
    renderAccomChips(); renderTypeChips();
    $('#stat').textContent=tx('statN')(ROWS.length,DAYS.length);
    renderGrid();
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFail')+': '+String(e&&e.message||e),'err'); }
}

// ── 룸타입 표시 통합(Min 2026-08) ────────────────────────────────────────
//  화면 표기·집계만 바꾼다. DB 의 room_type 값은 그대로 두므로 방배정·정산에 영향이 없다.
//   · 4인실 → 소보5동 · 8인실 → 아소별장 (실제로 그 건물 한 채라 이름이 더 분명하다)
//   · 더블 · 디럭스더블트윈 · 디럭스트윈 → 「디럭스 트윈」 하나로 (현장은 같은 급으로 본다)
//   · 트리플(5층 2실) → 트윈에 포함
//   · 컴팩트트윈 · 싱글은 지금처럼 따로
const TYPE_MERGE={'4인실':'소보5동','8인실':'아소별장',
  '더블':'디럭스 트윈','디럭스':'디럭스 트윈','디럭스더블트윈':'디럭스 트윈','디럭스트윈':'디럭스 트윈',
  '트리플':'트윈'};
function typeLabel(t){ const k=String(t==null?'':t).trim(); return TYPE_MERGE[k]||k||'-'; }
const TYPE_ORDER=['디럭스 트윈','트윈','컴팩트트윈','싱글','아소별장','소보5동'];
function typeIdx(t){ const i=TYPE_ORDER.indexOf(t); return i<0?TYPE_ORDER.length:i; }

// ── 표준 체류 패턴(Min 2026-08) ──────────────────────────────────────────
//  현장 예약은 요일이 정해져 있다: 목→일 3박 · 일→목 4박 · 수→수 7박.
//  쿠주힐즈만 7박이 일→일. (dow: 0=일 … 6=토)
const STAY_PAT=[{n:3,dow:4},{n:4,dow:0},{n:7,dow:3}];
const STAY_PAT_KUJU=[{n:3,dow:4},{n:4,dow:0},{n:7,dow:0}];
function patternsFor(fac){ return fac==='쿠주힐즈' ? STAY_PAT_KUJU : STAY_PAT; }

// ── 야마나미 구역 분리(Min 2026-09): 호텔동 / 돔하우스 / 소보별장(1~4호) / 소보5동(4인실) / 아소별장 — 별장을 호텔 트윈에 섞지 않는다.
//   방배정 화면의 숙소 필터와 같은 구분. 다른 숙소는 구역 없음(한 줄). 룸타입별 보기는 호텔동만 타입으로 쪼갠다.
const GROUP_ORDER=['','호텔동','아소별장','소보5동','소보별장','돔하우스'];   // 표시 순서(Min 2026-09): 호텔 → 아소별장 → 소보5동 → 소보별장 → 돔하우스
function zoneGroup(inv){
  if((inv.facility||'')!=='야마나미리조트') return '';
  const z=String(inv.zone||''), t=String(inv.room_type||'');
  if(z==='돔하우스') return '돔하우스';
  if(z==='소보별장') return (t==='4인실'||/5호/.test(String(inv.room_no||''))) ? '소보5동' : '소보별장';
  if(z==='아소별장') return '아소별장';
  return '호텔동';
}
function groupL(g){ const k={'호텔동':'grpHotel','돔하우스':'grpDome','소보별장':'grpSobo','소보5동':'grpSobo5','아소별장':'grpAso'}[g]; return k?tx(k):''; }
function groupIdx(g){ const i=GROUP_ORDER.indexOf(g); return i<0?GROUP_ORDER.length:i; }
// 행 = 숙소 → (구역) → 룸타입(호텔동만). 칸값 = 그 날 밤 사용 객실 수(중복 객실은 1실)·인원.
//  미배정 팀이 들어갈 구역 — 상품명으로 판정(돔하우스 상품 → 돔하우스 줄). 그 외 야마나미는 호텔동, 다른 숙소는 구역 없음.
//  ※ 2027년부터 상품명이 구역별로 확실히 갈리면(Min) 소보·아소별장도 같은 자리에서 늘린다.
function needGroup(fac, product){
  if(fac!=='야마나미리조트') return '';
  return /돔하우스|ドームハウス|dome/i.test(String(product||''))?'돔하우스':'호텔동';
}
function rowKey(inv){ const g=zoneGroup(inv); const base=(inv.facility||'')+(g?'|'+g:''); return (BYTYPE && (g==='호텔동'||!g)) ? base+'|'+typeLabel(inv.room_type) : base; }
//  그 객실이 그 날짜에 폐쇄인가(from<=d<=to)
function closedOn(invId,d){ const a=CLOSED[invId]; if(!a) return null; for(const c of a){ if(c.from<=d && d<=c.to) return c; } return null; }
//  예약 구분값 = 엠클릭 원본(정산·확정·견적·대기). '대기'는 확정 전이라 방이 빠질 수 있다.
function isWait(seq){ return (TEAM[seq]&&TEAM[seq].status)==='대기'; }
function buildRows(){
  const own={}, meta={}, invByKey={};
  const metaOf=i=>{ const g=zoneGroup(i); const splitType=BYTYPE && (g==='호텔동'||!g);
    return {facility:i.facility||'', group:g, type:splitType?typeLabel(i.room_type):'', label:splitType?typeLabel(i.room_type):(g?groupL(g):'')}; };
  INV.forEach(i=>{ const k=rowKey(i); own[k]=(own[k]||0)+1; meta[k]=meta[k]||metaOf(i); (invByKey[k]=invByKey[k]||[]).push(i.id); });
  INV_ALL.forEach(i=>{ const k=rowKey(i); if(!meta[k]){ meta[k]=metaOf(i); own[k]=own[k]||0; } });   // 비활성 방만 있는 줄(사용이 있으면 보임)
  const use={};   // key → date → {rooms:Set, pax:n}
  const invMap={}; INV_ALL.forEach(i=>{ invMap[i.id]=i; });
  const dset=new Set(DAYS);
  ROOMS.forEach(r=>{
    const inv=invMap[r.inventory_id]; if(!inv) return;
    const k=rowKey(inv);
    const c=SZCore.parseLocalDate(r.check_in), e=SZCore.parseLocalDate(r.check_out);
    if(isNaN(c)||isNaN(e)) return;
    for(const d=new Date(c); d<e; d.setDate(d.getDate()+1)){
      const ds=fmt(d); if(!dset.has(ds)) continue;
      // ⚠ 대기 예약은 **방을 차지하지 않는다**(만실이어도 받아 두는 예약) → 사용 수에서 뺀다.
      //   견적·확정·정산은 모두 실제로 들어온 예약이라 그대로 센다(Min 2026-08).
      if(isWait(r.event_seq)) return;
      const m=(use[k]=use[k]||{}); const cell=(m[ds]=m[ds]||{rooms:new Set(),pax:0});
      cell.rooms.add(r.inventory_id); cell.pax++;
    }
  });
  ROWS=Object.keys(own).filter(k=>own[k]>0 || Object.keys(use[k]||{}).length).map(k=>({
    key:k, facility:meta[k].facility, group:meta[k].group, type:meta[k].type, label:meta[k].label, own:own[k],
    days:DAYS.map(d=>{
      // 폐쇄 = 그 줄의 활성 객실 중 그날 폐쇄 기간인 것 → 그날 보유에서 뺀다(사유는 툴팁)
      const cls=[]; (invByKey[k]||[]).forEach(id=>{ const c=closedOn(id,d); if(c) cls.push({room:(invMap[id]||{}).room_no||'', reason:c.reason}); });
      const c=use[k]&&use[k][d]; if(!c) return {r:0,p:0,act:0,closed:cls.length,closedL:cls};
      // 사용 = 그날 밤 실제로 쓰인 객실 수(같은 방에 여러 팀·여러 명이 들어가도 1실).
      //  ⚠ 인원÷2 환산은 트리플(시즈 등)에서 같은 방을 2실로 세어 과대계상 → 폐기(Min 지적).
      return {r:c.rooms.size, p:c.pax, act:c.rooms.size, closed:cls.length, closedL:cls};
    })
  })).sort((a,b)=>accomIdx(a.facility)-accomIdx(b.facility)
      || String(a.facility).localeCompare(String(b.facility))
      || groupIdx(a.group)-groupIdx(b.group)                   // 호텔→아소별장→소보5동→소보별장→돔하우스
      || typeIdx(a.type)-typeIdx(b.type)                      // 디럭스→트윈→컴팩트→싱글
      || String(a.type).localeCompare(String(b.type)));
  // ── 미배정도 「이미 받은 예약」이다 — 방을 세어야 한다(Min 2026-08) ──────
  //   방배정이 아직 안 됐을 뿐 손님은 온다. 세지 않으면 표가 실제보다 한산해 보이고
  //   「예약 가능」이 없는 방을 있다고 말하게 된다.
  //   필요 객실 수 = 팀마다 ceil(미배정 인원 ÷ 2) — 2인 1실 기준(트리플·별장은 덜 쓰므로 보수적).
  //   구역별(UNAG): 돔하우스 상품 팀의 필요실은 돔하우스 줄, 그 외 야마나미는 호텔동 줄(Min 2026-09 「돔하우스면 돔하우스 줄에」).
  const needAt=(f,g,d)=>(UNAG[f+(g?'|'+g:'')]||{})[d]||0;
  //   숙소 단위 합계(룸타입별 보기에서도 「예약 가능」은 숙소 전체 잔여로 본다 —
  //   미배정이 어느 타입에 들어갈지는 배정 전에는 알 수 없다)
  //   합계 단위 = 숙소+구역(`aggKey`). 돔하우스·별장은 별개 상품이라 호텔동 잔여에 섞지 않는다(Min 2026-09 「돔하우스 수량은 호텔 쪽과 합치지 않아」).
  const aggKey=r=>r.facility+(r.group?'|'+r.group:'');
  const facAgg={};
  ROWS.forEach(r=>{
    const a=(facAgg[aggKey(r)]=facAgg[aggKey(r)]||{own:0, used:DAYS.map(()=>0), closed:DAYS.map(()=>0)});
    a.own+=r.own; r.days.forEach((c,i)=>{ a.used[i]+=c.r; a.closed[i]+=(c.closed||0); });
  });
  //   미배정 필요실은 그 구역 줄에 더한다 — 호텔동은 룸타입별 보기에서 타입을 모르므로 숙소 보기일 때만(미배정 줄엔 항상),
  //   돔하우스·별장 줄은 타입으로 안 쪼개므로 언제나 그 줄에 +N.
  ROWS.forEach(r=>{ const hotel=(!r.group||r.group==='호텔동'); if(hotel && BYTYPE) return;
    r.days.forEach((c,i)=>{ c.need=needAt(r.facility, r.group, DAYS[i]); }); });

  // ── 「예약 가능」 판정: 그 날짜부터 표준 패턴대로 묵을 방이 끝까지 남아 있는가 ──
  //   패턴 기간이 보고 있는 범위를 넘어가면 확인할 수 없으므로 표시하지 않는다.
  const di={}; DAYS.forEach((d,i)=>{ di[d]=i; });
  ROWS.forEach(r=>{
    const pats=patternsFor(r.facility);
    r.book=DAYS.map((d,i)=>{
      const w=SZCore.parseLocalDate(d).getDay();
      const ok=[];
      pats.filter(p=>p.dow===w).forEach(p=>{
        if(i+p.n>DAYS.length) return;                          // 범위 밖 — 판단 불가
        let free=true;
        for(let k=0;k<p.n;k++){
          const dd=DAYS[i+k];
          if(r.own-(r.days[i+k].closed||0)-r.days[i+k].r-((r.days[i+k].need)||0)<1){ free=false; break; }   // 그 줄 잔여(폐쇄 차감)
          const fa=facAgg[aggKey(r)];                                               // 그 구역 전체 잔여(미배정·폐쇄 차감) — 미배정 필요실도 구역별
          const needG=needAt(r.facility,r.group,dd);
          if(fa && fa.own-fa.closed[i+k]-fa.used[i+k]-needG<1){ free=false; break; }
        }
        if(free) ok.push(p.n);
      });
      return ok;
    });
  });
}

//  만실(딱 찼다)과 초과(정원을 넘겼다)는 뜻이 다르다 — 만실은 정상, 초과는 손을 써야 한다(Min 2026-08).
function cellCls(u,own){
  const left=own-u;
  if(left<0)  return 'over';     // 초과 = 받은 팀이 방보다 많다(대기·이관 필요)
  if(left===0) return 'full';    // 만실 = 딱 찼다(정상)
  if(left<=3) return 'tight';
  return 'free';
}
//  대기 예약 줄 — 그 숙소에 대기가 하나도 없으면 줄 자체를 안 그린다.
function waitRow(fac){
  const m=WAIT[fac]; if(!m || !Object.keys(m).length) return '';
  let prevM='';
  const tds=DAYS.map(d=>{
    const ms=d.slice(0,7)!==prevM; prevM=d.slice(0,7);
    const c=m[d];
    if(!c) return `<td class="c none${ms?' mstart':''}">·</td>`;
    return `<td class="c${ms?' mstart':''}" title="${esc(tx('waitT')(c.teams,c.pax)+(c.reps.length?' — '+c.reps.filter(Boolean).join(', '):''))}">${c.teams}<span style="font-weight:600">(${c.pax})</span></td>`;
  }).join('');
  return `<tr class="wait"><td class="rh">${tx('waitRowH')}</td>${tds}</tr>`;
}
//  싱글 신청 중 그날 밤 아직 싱글로 못 받은 수 = 신청 n − 그 팀원 **한 명만** 들어간 방 수(타입 무관, 체크인 ≤ 날짜 < 체크아웃)
//   싱글 객실이든 트윈에 혼자든 「1인 사용 방」이면 싱글로 준 것으로 본다(Min 2026-09).
function singleUnassigned(n, seq, ds){
  if(!(n>0)) return 0;
  const seqs=new Set(Array.isArray(seq)?seq:[seq]);   // 묶은 팀은 예약 여러 건 = 한 팀
  const occ={};
  ROOMS.forEach(r=>{ if(seqs.has(r.event_seq) && r.member_id!=null && r.check_in<=ds && r.check_out>ds) occ[r.inventory_id]=(occ[r.inventory_id]||0)+1; });
  const solo=Object.keys(occ).filter(k=>occ[k]===1).length;
  return Math.max(0, n-solo);
}
//  싱글 신청 줄 — 비고에 적힌 싱글 방 수(배정 전에도 보인다) + 빨간 +N = 아직 싱글 방을 배정하지 않은 수
function sgrRow(fac){
  const m=SGR[fac]; if(!m || !Object.keys(m).length) return '';
  let prevM='';
  const tds=DAYS.map(d=>{
    const ms=d.slice(0,7)!==prevM; prevM=d.slice(0,7);
    const c=m[d];
    if(!c||(!c.rooms&&!c.unk)) return `<td class="c none${ms?' mstart':''}">·</td>`;
    const t=tx('sgrT')(c.rooms,c.una)+(c.unk?' · '+tx('sgrUnkN')(c.unk):'')+(c.teams.length?' — '+c.teams.join(', '):'');
    return `<td class="c${ms?' mstart':''}" title="${esc(t)}">${c.rooms||'·'}${c.una?`<i class="tent">+${c.una}</i>`:''}${c.unk?`<i class="unk" title="${esc(tx('sgrUnkN')(c.unk))}">?</i>`:''}</td>`;
  }).join('');
  return `<tr class="sgr"><td class="rh">${tx('sgrRowH')}</td>${tds}</tr>`;
}
//  미배정 줄 — 방을 아직 못 받은 인원(표의 사용 수에는 안 들어간다)
function unaRow(fac){
  const m=UNA[fac]; if(!m || !Object.keys(m).length) return '';
  let prevM='';
  const tds=DAYS.map(d=>{
    const ms=d.slice(0,7)!==prevM; prevM=d.slice(0,7);
    const c=m[d];
    if(!c) return `<td class="c none${ms?' mstart':''}">·</td>`;
    const gks=Object.keys(c.grp||{}).filter(g=>g);   // 구역별 내역(야마나미만) — 「호텔 2팀 4명 2실 · 돔하우스 1팀 2명 1실」
    const gtxt=gks.length>1||(gks.length===1&&gks[0]!=='호텔동') ? ' ['+gks.map(g=>groupL(g)+' '+tx('unaT')(c.grp[g].teams,c.grp[g].pax)+' '+tx('roomsN')(c.grp[g].need)).join(' · ')+']' : '';
    return `<td class="c${ms?' mstart':''}" title="${esc(tx('unaT')(c.teams,c.pax)+' · '+tx('roomsN')(c.need||0)+gtxt+(c.reps.filter(Boolean).length?' — '+c.reps.filter(Boolean).join(', '):''))}">${c.teams}<span style="font-weight:600">(${c.pax})</span></td>`;
  }).join('');
  return `<tr class="una"><td class="rh">${tx('unaRowH')}</td>${tds}</tr>`;
}
function renderGrid(){
  const box=$('#grid'); if(!box) return;
  const rows=ROWS.filter(r=>(!ACCOMSEL.size||ACCOMSEL.has(r.facility)) && (!TYPESEL.size||TYPESEL.has(r.label||accomL(r.facility))));
  if(!rows.length){ box.innerHTML=`<div class="cnt" style="color:var(--muted);padding:14px">${tx('noData')}</div>`; return; }
  const WD=[0,1,2,3,4,5,6].map(i=>SZCore.weekday('2026-02-0'+(i+1),lang()));
  let prevM='';
  const head=DAYS.map(d=>{
    const dt=SZCore.parseLocalDate(d), w=dt.getDay();
    const ms=d.slice(0,7)!==prevM; prevM=d.slice(0,7);
    const isToday=(d===SZCore.fmtDate(new Date()));
    return `<th class="${w===0?'sun':(w===6?'sat':'')}${isToday?' today':''}${ms?' mstart':''}">${ms?dt.getMonth()+1+'/':''}${dt.getDate()}<br><span style="font-weight:600">${esc(WD[w])}</span></th>`;
  }).join('');
  // 숙소가 바뀌는 첫 행 앞에 숙소 헤더 행
  let lastFac=null; const body=[]; const mergedSgr={};   // 싱글 신청을 「싱글」 줄에 합친 숙소(끝의 별도 줄 생략)
  const facRows={}; rows.forEach(r=>{ facRows[r.facility]=(facRows[r.facility]||0)+1; });
  rows.forEach(r=>{
    if((BYTYPE || facRows[r.facility]>1) && r.facility!==lastFac){
      lastFac=r.facility;
      body.push(`<tr class="fac"><td class="rh">${esc(accomL(r.facility))}</td><td colspan="${DAYS.length}"></td></tr>`);   // 구역별 보유는 각 줄에(합산 표기 없음 — 돔·별장은 호텔과 안 합친다)
    }
    prevM='';
    const sgm=(r.type==='싱글') && !!(SGR[r.facility] && Object.keys(SGR[r.facility]).length);   // 싱글 줄 + 싱글 신청 통합
    if(sgm) mergedSgr[r.facility]=true;
    const tds=r.days.map((c,i)=>{
      const d=DAYS[i]; const ms=d.slice(0,7)!==prevM; prevM=d.slice(0,7);
      const nd=c.need||0, shown=c.r+nd;          // 미배정도 이미 받은 예약 — 사용 수에 포함
      const ownD=r.own-(c.closed||0);            // 그날 보유 = 활성 객실 − 폐쇄
      const cls=shown?cellCls(shown,ownD):'zero';
      const clT=c.closed?' ('+tx('closedT')(c.closed)+' — '+c.closedL.map(x=>x.room+(x.reason?'('+x.reason+')':'')).join(', ')+')':'';   // 폐쇄=칸 모서리 표시 + 툴팁만
      const sel=(SEL&&SEL.key===r.key&&SEL.date===d)?' sel':'';
      const w=SZCore.parseLocalDate(d).getDay(), wk=(w===0||w===6)?' wk':'';
      // 싱글 신청 통합 줄: 룸타입 「싱글」 줄에 싱글 신청(비고)을 얹는다 — 칸=신청 수, 색=보유(폐쇄 차감) 대비, +N=미배정, ?=수량 못 읽음(Min 2026-09 「두 줄 합치기」)
      if(sgm){ const sc=(SGR[r.facility]||{})[d]||null; const req=sc?sc.rooms:0, una=sc?sc.una:0, unk=sc?sc.unk:0;
        const scls=(req||unk)?cellCls(req,ownD):'zero';
        const st=accomL(r.facility)+' · '+tx('sgrRowH')+' · '+d+' — '+tx('sgrT')(req,una)+' / '+tx('own')+' '+ownD+clT+' · '+tx('sgrAsg')(c.r)+(unk?' · '+tx('sgrUnkN')(unk):'')+(sc&&sc.teams.length?' — '+sc.teams.join(', '):'');
        return `<td class="c ${scls}${wk}${ms?' mstart':''}${sel}${c.closed?' hascl':''}" data-k="${esc(r.key)}" data-d="${d}" title="${esc(st)}">${req||'·'}${una?`<i class="tent">+${una}</i>`:''}${unk?`<i class="unk">?</i>`:''}</td>`; }
      const bk=(r.book&&r.book[i])||[];
      const bkHtml=bk.length?`<i class="bk">${bk.map(n=>n+tx('nightUnit')).join('·')}</i>`:'';
      const bkT=bk.length?' · '+tx('bookOkT')(bk.map(n=>tx('nights')(n)).join('·')):'';
      return `<td class="c ${cls}${wk}${ms?' mstart':''}${sel}${c.closed?' hascl':''}" data-k="${esc(r.key)}" data-d="${d}"
        title="${esc(accomL(r.facility)+(r.label?' · '+r.label:'')+' · '+d)} — ${esc(tx('roomsN')(shown))} / ${esc(tx('own'))} ${ownD}${esc(clT)} · ${esc(tx('paxN')(c.p))}${nd?' · '+esc(tx('needT')(c.r,nd)):''}${(!BYTYPE&&c.act&&c.act!==c.r)?' · '+esc(tx('actRooms')(c.act)):''}${esc(bkT)}">${shown||'·'}${nd?'<i class="nd">+'+nd+'</i>':''}${bkHtml}</td>`;
    }).join('');
    body.push(`<tr${sgm?' class="sgm"':''}><td class="rh"><span class="rt">${esc(sgm?tx('sgrRowH'):(r.label||accomL(r.facility)))}</span><span class="own">${esc(tx('own'))} ${r.own}</span></td>${tds}</tr>`);
    // 그 숙소의 마지막 행 뒤에 대기 예약 줄(방을 안 잡는 예약이라 팀·인원으로)
    const nxt=rows[rows.indexOf(r)+1];
    if(!nxt || nxt.facility!==r.facility){ if(!mergedSgr[r.facility]) body.push(sgrRow(r.facility)); body.push(unaRow(r.facility)); body.push(waitRow(r.facility)); }
  });
  // 합계 행
  const tot=DAYS.map((d,i)=>rows.reduce((n,r)=>n+r.days[i].r+(r.days[i].need||0),0));
  const ownTot=rows.reduce((n,r)=>n+r.own,0);
  prevM='';
  const totTds=tot.map((v,i)=>{ const d=DAYS[i]; const ms=d.slice(0,7)!==prevM; prevM=d.slice(0,7);
    const w=SZCore.parseLocalDate(d).getDay();
    return `<td class="c${(w===0||w===6)?' wk':''}${ms?' mstart':''}">${v||'·'}</td>`; }).join('');
  body.push(`<tr class="sum"><td class="rh">${esc(tx('sumRow'))}<span class="own">${esc(tx('own'))} ${ownTot}</span></td>${totTds}</tr>`);

  box.innerHTML=`<table class="oc"><thead><tr><th class="rh">${esc(tx('thRow'))}</th>${head}</tr></thead><tbody>${body.join('')}</tbody></table>`;
  box.querySelectorAll('td.c[data-k]').forEach(td=>td.addEventListener('click',()=>{
    SEL={key:td.dataset.k, date:td.dataset.d}; renderGrid(); renderDetail();
  }));
}

// 칸 클릭 → 그날 그 룸타입에 든 팀
function renderDetail(){
  const box=$('#detail'), ttl=$('#dt-title'); if(!box) return;
  if(!SEL){ box.innerHTML=`<div class="cnt" style="color:var(--muted);padding:8px 0">${tx('dtPick')}</div>`; return; }
  const invMap={}; INV.forEach(i=>{ invMap[i.id]=i; });
  const rows=ROOMS.filter(r=>{
    const inv=invMap[r.inventory_id]; if(!inv || rowKey(inv)!==SEL.key) return false;
    return r.check_in<=SEL.date && SEL.date<r.check_out;
  });
  const meta=ROWS.find(r=>r.key===SEL.key)||{facility:'',type:'',label:''};
  if(ttl) ttl.textContent=tx('dtTitle')(`${SEL.date} · ${accomL(meta.facility)}${meta.label?' · '+meta.label:''}`);
  //  여기서 바로 방배정으로 — 규칙(정원·폐쇄·확정·분할)이 한 곳에만 있도록 화면을 새로 만들지 않고
  //  방배정 화면을 그 달·그 날짜로 연다. 미배정을 그 자리에서 처리할 수 있다(Min 2026-08).
  const una=(UNA[meta.facility]||{})[SEL.date];
  //  시즈노야도는 방배정을 시즈노야도 예약표(shizu.html)에서 하므로 그쪽을 연다(room.html 은 시즈 자동배정 제외, Min 2026-09).
  const isShizu=(meta.facility==='시즈노야도 료칸');
  const goHref=(isShizu?'shizu.html':'room.html')+`?ym=${encodeURIComponent(SEL.date.slice(0,7))}&date=${encodeURIComponent(SEL.date)}`;
  const goBtn=`<a class="btn sm" target="_blank" rel="noopener"
      href="${goHref}"
      style="text-decoration:none">${esc(tx(isShizu?'goShizu':'goAssign'))}${una?` <b style="color:var(--err)">${esc(tx('unaT')(una.teams,una.pax))}</b>`:''}</a>`;
  if(!rows.length){ box.innerHTML=`<div style="padding:6px 0 10px">${goBtn}</div><div class="cnt" style="color:var(--muted);padding:8px 0">${tx('dtNone')}</div>`; return; }
  // 방 단위로 묶는다 — 같은 방에 두 팀이 들어가 있으면 한 줄에 함께(실수 계산과 일치)
  const g={};
  rows.forEach(r=>{
    const k=String(r.inventory_id);
    const t=TEAM[r.event_seq]||{};
    if(!g[k]) g[k]={room:r.room_no||'', teams:{}, pax:0, ci:r.check_in, co:r.check_out, accom:t.accom||meta.facility};
    const key=r.event_seq;
    if(!g[k].teams[key]) g[k].teams[key]={tag:t.tag||'', rep:t.rep||'', pax:0, ci:r.check_in, co:r.check_out};
    g[k].teams[key].pax++; g[k].pax++;
    if(r.check_in<g[k].ci) g[k].ci=r.check_in;
    if(r.check_out>g[k].co) g[k].co=r.check_out;
  });
  const list=Object.values(g).map(x=>{
    const ts=Object.values(x.teams);
    return {room:x.room, pax:x.pax, accom:x.accom,
      tag:ts.map(t=>t.tag).join(' + '), rep:ts.map(t=>`${t.rep}(${t.pax})`).join(' + '),
      ci:x.ci, co:x.co, multi:ts.length>1};
  }).sort((a,b)=>String(a.room).localeCompare(String(b.room),undefined,{numeric:true}));
  box.innerHTML=`<div style="padding:6px 0 10px">${goBtn}</div><table class="dt"><thead><tr>
      <th>${tx('cRoom')}</th><th>${tx('cTeam')}</th><th>${tx('cRep')}</th>
      <th>${tx('cPax')}</th><th>${tx('cStay')}</th><th>${tx('cAccom')}</th>
    </tr></thead><tbody>${list.map(x=>`<tr>
      <td class="m">${esc(x.room)}</td>
      <td><span class="tag">${esc(x.tag)}</span></td>
      <td>${esc(x.rep)}</td>
      <td class="m">${x.pax}</td>
      <td class="m">${esc((x.ci||'').slice(5))}~${esc((x.co||'').slice(5))}</td>
      <td>${esc(accomL(x.accom))}</td>
    </tr>`).join('')}</tbody></table>
    <div class="cnt" style="color:var(--muted);margin-top:7px">${esc(tx('dtRooms')(list.length))}</div>`;
}

function applyStatic(){
  const st=$('#t-step'); if(st) st.textContent=tx('step');
  const ch=$('#t-connhint'); if(ch) ch.textContent=tx('connHint');
  const pc=$('#t-preconn'); if(pc) pc.textContent=tx('preConn');
  const btn=$('#btn-connect');
  if(supa){ setConn(tx('connOk'),'ok'); if(btn) btn.textContent=tx('connectedBtn'); }
  else { setConn(tx('notConn'),''); if(btn) btn.textContent=tx('connect'); }
}
window.onSaizenLangChange=function(){
  applyStatic();
  if(supa && $('#grid')){ renderUI(); renderAccomChips(); renderTypeChips(); renderGrid(); renderDetail(); }
};

$('#btn-connect').addEventListener('click',connect);
applyStatic(); loadCreds();
if($('#sb-url').value && $('#sb-key').value) connect();
</script>
