<style>
  /* ── 공통 chrome (전 ops 페이지 공유 정본) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 ── */
  main{padding:16px 20px 70px;max-width:1180px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:6px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .lbl{font-size:12px;color:var(--text2);font-weight:700;min-width:44px}
  .deny{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
  /* 화면 미리보기 카드 */
  .pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .pv-card{border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:10px;padding:11px 13px;background:var(--surface)}
  .pv-tag{font-family:var(--mono);font-weight:800;color:var(--accent);font-size:13px}
  .pv-rep{font-weight:700;font-size:15px;margin-top:2px}
  .pv-sub{font-size:11.5px;color:var(--text2);margin-top:3px}
  .pv-no{font-size:10.5px;color:#b45; font-weight:700}
  /* 표 보기 — 실무자는 카드보다 표에서 훨씬 빨리 찾는다(숙소·층으로 묶고 검색으로 좁힌다) */
  .tblwrap{overflow-x:auto}
  table.qt{width:100%;border-collapse:collapse;font-size:12.5px}
  table.qt th{background:var(--surface2);border-bottom:1px solid var(--border2);padding:7px 9px;text-align:left;font-size:11.5px;color:var(--text2);white-space:nowrap}
  table.qt td{border-bottom:1px solid var(--border);padding:6px 9px;vertical-align:middle}
  table.qt tr.gh td{background:var(--accentSoft);font-weight:800;color:var(--accentDeep);font-size:12px;padding:5px 9px}
  table.qt tr:hover td{background:var(--surface2)}
  .qt .tag{font-family:var(--mono);font-weight:800;color:var(--accent)}
  .qt .rno{font-family:var(--mono);font-weight:700}
  .qt .fl{font-weight:800;color:var(--text2)}
  .qt .nt{color:var(--muted)}
  .qt .warn{color:var(--err);font-weight:700}
  .rebtn{font-family:inherit;font-size:11.5px;font-weight:700;color:var(--text2);background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  .rebtn:hover{border-color:var(--err);color:var(--err);background:#fbeeeb}
  /* 팀 묶음 배지 — 手配書·전기카트와 같은 표기(「팀」 + 묶음별 색) */
  .gbadge{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;border-radius:99px;padding:1px 7px;margin-left:5px;vertical-align:middle}
  .srch{flex:1;min-width:220px}
</style>

<script>
const $=s=>document.querySelector(s);
let supa=null, YM=null, ROWS=[], TOKMAP={}, DATESEL=new Set(), ACCOMSEL=new Set(), Q='', TG={};
// 묶음 색 — 手配書·전기카트 배정표와 같은 팔레트(어느 화면에서 봐도 같은 묶음=같은 색)
const GRP_COLORS=['#647548','#9a7322','#2f6f8f','#8a4b6b','#4f6f4f','#7a5a16','#3f5d8a','#8a5a3a'];
function grpColor(g){ let h=0; const s=String(g||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return GRP_COLORS[h%GRP_COLORS.length]; }
function grpBadge(r){
  if(!r.grp) return '';
  const mates=ROWS.filter(x=>x.grp===r.grp).map(x=>x.tag);
  return `<span class="gbadge" style="background:${grpColor(r.grp)}" title="${esc(tx('grpT',mates.join(' · ')))}">${tx('grpMark')}</span>`;
}
// 방호수 → 층. zone('9층')이 정본이고, 없으면 간지호텔처럼 3자리 호수(201호=2층)에서 뽑는다.
//  야마나미 호텔동은 호수(13xx~22xx)와 실제 층(3~12층)이 달라 손님이 헷갈린다 → 층을 반드시 같이 적는다.
function floorNo(zone, roomNo){
  const m=/^(\d+)\s*층$/.exec(String(zone||'').trim()); if(m) return +m[1];
  const r=/^(\d)\d{2}\s*호$/.exec(String(roomNo||'').trim()); if(r) return +r[1];
  return 0;
}
function floorLabel(zone, roomNo){ const f=floorNo(zone,roomNo); return f?tx('floorU',f):''; }
const ACCOM_ORDER=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸','시즈노야도','소보별장','아소별장','돔하우스'];

function setConn(t,c){ const e=$('#conn-state'); if(e){ e.textContent=t; e.className='pill'+(c?' '+c:''); } }
function toast(msg,cls){ const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:''); t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); },2600); }
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function thisYM(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function shiftYM(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+String(m).padStart(2,'0'); }
function fmtMD(iso){ if(!iso) return ''; const p=String(iso).slice(0,10).split('-'); return p.length===3?`${+p[1]}/${+p[2]}`:iso; }
function accomOrd(a){ const i=ACCOM_ORDER.indexOf(a); return i<0?99:i; }

// ── i18n (일본어 기본 + 한국어 + 영어) ──
function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function accomL(a){ return (window.SZCore&&SZCore.accomLabel)?SZCore.accomLabel(a,lang()):(a||''); }   // 숙소·구역 표시 라벨(ja/ko/en) = saizen-core 단일 진실원

    connHint:'お客様が注文時に提示するチーム別QRカードを印刷します。チェックイン時にお客様がスマホで撮影して保管 → 注文時にPOSでスキャン。',
    waitConn:'接続後に表示されます。', loginNeeded:'ログインが必要です。ホームでログイン後、再度接続してください。',

    printBtn:'🖨 QRカード プレビュー', arrLbl:'入国日', accomLbl:'宿泊', allChip:'全体',

    noData:'今月のデータがありません。', noMatch:'選択条件に合うチームがありません。',

    reissueDone:(tag)=>`${tag} 再発行しました — 旧QRは無効です`, reissuePrint:'新しいカードを今すぐ印刷しますか？', reissueFail:(e)=>'再発行に失敗: '+e,
    pvNoTok:'⚠ QRトークンなし', paxUnit:'名', roomLbl:'部屋', roomEach:' ※部屋ごとに1枚',

  ko:{ pageStep:'주문 QR카드', connect:'연결', connecting:'연결 중…', connectedBtn:'✓ 연결됨', connRetry:'연결 실패 · 재시도',
    notConn:'미연결', connOk:'연결됨', connFail:'연결 실패', needUrlKey:'URL·key 필요', needLogin:'로그인 필요', connFailToast:msg=>`연결 실패: ${msg}`,
    connHint:'손님이 주문 때 제시할 팀별 QR 카드를 인쇄합니다. 체크인 때 손님이 폰으로 찍어 보관 → 주문 시 POS 스캔.',
    waitConn:'연결 후 표시됩니다.', loginNeeded:'로그인이 필요합니다. 홈에서 로그인 후 다시 연결하세요.',
    panelH:'주문 QR카드 인쇄',
    panelDesc:'체크인 팀을 골라 <b>팀별 미니 QR 카드</b>를 인쇄합니다(A4에 여러 장). 손님이 폰으로 찍어 보관 → 주문 때 POS에서 스캔하면 그 팀이 자동 선택됩니다. 카드엔 이름·QR·안내문만 담깁니다.',
    printBtn:'🖨 QR카드 미리보기', arrLbl:'입국일', accomLbl:'숙소', allChip:'전체',
    loading:'로딩…', noMonth:'이 달 데이터 없음', loadFail:'로드 실패', loadFailToast:msg=>`로드 실패: ${msg}`,
    statCount:(v,t,nt)=>`${v} / ${t}팀${nt?` · ⚠ 토큰없음 ${nt}`:''}`,
    noData:'이 달 데이터가 없습니다.', noMatch:'선택 조건에 맞는 팀이 없습니다.',
    reissue:'재발급', reissueConfirm:(tag,rep)=>`${tag} ${rep} 님의 QR 카드를 재발급합니다.\n\n· 지금까지의 QR(카드)은 이 시점부터 사용할 수 없습니다(분실 카드 악용 방지).\n· 주문·정산 내역은 그대로 남습니다.\n\n재발급할까요?`,
    reissueDone:(tag)=>`${tag} 재발급 완료 — 이전 QR은 무효`, reissuePrint:'새 카드를 지금 인쇄할까요?', reissueFail:(e)=>'재발급 실패: '+e,
    pvNoTok:'⚠ QR 토큰 없음', paxUnit:'名', roomLbl:'방', roomEach:' ※방마다 1장',
    searchPh:'대표자·태그코드·방호수로 검색', searchClr:'✕ 지움', srchHit:n=>`검색 ${n}건`,
    thTag:'태그코드', thRep:'대표자', thAccom:'숙소', thFloor:'층', thRoom:'방호수', thStay:'체류', thPax:'인원', thTok:'QR',

    teamUnit:'팀' },
  en:{ pageStep:'Order QR cards', connect:'Connect', connecting:'Connecting…', connectedBtn:'✓ Connected', connRetry:'Failed · retry',
    notConn:'Not connected', connOk:'Connected', connFail:'Connection failed', needUrlKey:'URL·key required', needLogin:'Login required', connFailToast:msg=>`Connection failed: ${msg}`,

    waitConn:'Shown after connecting.', loginNeeded:'Login required. Log in from Home, then connect again.',
    panelH:'Print order QR cards',
    panelDesc:'Pick check-in teams and print <b>per-team mini QR cards</b> (several per A4). Guests photograph and keep it → scanning it at the POS auto-selects that team when ordering. Cards contain only name, QR and instructions.',
    printBtn:'🖨 QR card preview', arrLbl:'Arrival', accomLbl:'Stay', allChip:'All',
    loading:'Loading…', noMonth:'No data this month', loadFail:'Load failed', loadFailToast:msg=>`Load failed: ${msg}`,
    statCount:(v,t,nt)=>`${v} / ${t} teams${nt?` · ⚠ no token ${nt}`:''}`,
    noData:'No data this month.', noMatch:'No teams match the selection.',
    reissue:'Reissue', reissueConfirm:(tag,rep)=>`Reissue the QR card for ${tag} ${rep}.\n\n· The previous QR (card) stops working immediately (protects a lost card).\n· Orders and billing history stay as they are.\n\nReissue?`,
    reissueDone:(tag)=>`${tag} reissued — the old QR is now invalid`, reissuePrint:'Print the new card now?', reissueFail:(e)=>'Reissue failed: '+e,
    pvNoTok:'⚠ No QR token', paxUnit:'', roomLbl:'Room', roomEach:' ※1 card per room',
    searchPh:'Search by name, tag code or room no', searchClr:'✕ Clear', srchHit:n=>`${n} found`,
    thTag:'Tag code', thRep:'Rep', thAccom:'Stay', thFloor:'Floor', thRoom:'Room', thStay:'Dates', thPax:'Pax', thTok:'QR',
    grpMark:'Grp', grpT:tags=>`Grouped: ${tags}`, floorU:n=>`${n}F`, noRoom:'unassigned', unassigned:'Unassigned',
    noCards:'No cards to print (no token).', qrLibFail:'QR library failed to load — refresh and try again.', popupBlocked:'Pop-up was blocked.',

};
function tx(k,...a){ const d=L[lang()]||L.ja; let v=d[k]; if(v===undefined) v=L.ja[k]; if(v===undefined) return k; return (typeof v==='function')?v(...a):v; }
function applyStatic(){
  const st=$('#page-step'); if(st) st.textContent=tx('pageStep');
  const hint=document.querySelector('.conn .hint'); if(hint) hint.textContent=tx('connHint');
  const tw=$('#t-wait'); if(tw) tw.textContent=tx('waitConn');
  if(!supa){ const cb=$('#btn-connect'); if(cb) cb.textContent=tx('connect'); const cs=$('#conn-state'); if(cs) cs.textContent=tx('notConn'); }
}

async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.textContent=tx('connecting');
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect'); btn.disabled=false;
      $('#content').innerHTML=`<div class="panel"><div class="deny">${tx('loginNeeded')}</div></div>`; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn'); btn.disabled=false;
    YM=YM||thisYM(); renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connRetry'); btn.disabled=false; supa=null; toast(tx('connFailToast',e.message),'err'); }
}

function newToken(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,'').slice(0,16):(Date.now().toString(36)+Math.random().toString(36).slice(2,10)); }

// ── 카드 분실 재발급 — 새 토큰으로 갱신하면 옛 QR은 그 즉시 무효.
//    주문·정산 내역은 event_seq 로 묶여 있어 그대로 남는다(토큰은 팀을 여는 열쇠일 뿐).
async function reissueToken(seq){
  const r=ROWS.find(x=>x.seq===seq); if(!r) return;
  if(!confirm(tx('reissueConfirm',r.tag,r.rep||''))) return;
  const tok=newToken(), by=(window.__so_getUser&&__so_getUser())||null;
  try{
    const {data:cur}=await supa.from('order_tokens').select('reissue_count').eq('event_seq',seq).maybeSingle();
    const n=Number((cur&&cur.reissue_count)||0)+1;
    const {error}=await supa.from('order_tokens')
      .update({token:tok, created_by:by, reissued_at:new Date().toISOString(), reissue_count:n}).eq('event_seq',seq);
    if(error) throw error;
    TOKMAP[seq]=tok; r.token=tok;
    try{ await supa.from('change_log').insert({entity:'qr_token', entity_id:String(seq), action:'reissue',
      label:`${r.tag} ${r.rep||''}`, changes:{count:n}, changed_by:by}); }catch(_){}
    renderPreview();
    toast(tx('reissueDone',r.tag),'ok');
    if(confirm(tx('reissuePrint'))) printCards([r]);
  }catch(e){ toast(tx('reissueFail',String(e.message||e)),'err'); }
}

// 토큰 확보 — 없으면 즉시 발급(팀 고유 랜덤). 권한(print/room) 없으면 조용히 스킵.
async function ensureTokens(seqs){
  TOKMAP={};
  for(let i=0;i<seqs.length;i+=300){
    const chunk=seqs.slice(i,i+300);
    const {data}=await supa.from('order_tokens').select('event_seq,token').in('event_seq',chunk);
    (data||[]).forEach(t=>{ TOKMAP[t.event_seq]=t.token; });
  }
  const by=(window.__so_getUser&&__so_getUser())||null;
  const miss=seqs.filter(s=>!TOKMAP[s]).map(s=>({event_seq:s, token:newToken(), created_by:by}));
  if(miss.length){
    const {error}=await supa.from('order_tokens').insert(miss);
    if(!error) miss.forEach(m=>{ TOKMAP[m.event_seq]=m.token; });
  }
}

async function load(){
  if(!supa) return;
  $('#stat').textContent=tx('loading'); $('#btn-print').disabled=true; $('#ym-label').textContent=YM;
  try{
    const {data:bs,error:e1}=await supa.from('bookings').select('event_seq,event_no,rep_name,dep_date,arr_date').eq('session_ym',YM);
    if(e1) throw e1;
    const seqs=(bs||[]).map(b=>b.event_seq);
    if(!seqs.length){ ROWS=[]; DATESEL.clear(); ACCOMSEL.clear(); $('#stat').textContent=tx('noMonth'); renderChips(); renderPreview(); return; }
    const GMAP={};
    for(let i=0;i<seqs.length;i+=300){
      const chunk=seqs.slice(i,i+300);
      const {data:gs}=await supa.from('guests').select('event_seq,team_tag,group_code,accom,pax').in('event_seq',chunk);
      (gs||[]).forEach(g=>{ GMAP[g.event_seq]=g; });
    }
    await ensureTokens(seqs);
    // 방배정 로드 — event_seq → 배정된 방호수 목록(중복 제거·정렬). room_inventory로 호수 해석.
    const INVN={}; { const {data:inv}=await supa.from('room_inventory').select('id,room_no,zone'); (inv||[]).forEach(r=>INVN[r.id]=r); }
    const RM={};
    for(let i=0;i<seqs.length;i+=300){ const chunk=seqs.slice(i,i+300);
      const {data:rr}=await supa.from('rooms').select('event_seq,inventory_id').in('event_seq',chunk);
      (rr||[]).forEach(r=>{ const iv=INVN[r.inventory_id]; if(iv&&iv.room_no){
        const m=(RM[r.event_seq]=RM[r.event_seq]||new Map());
        if(!m.has(iv.room_no)) m.set(iv.room_no,{no:iv.room_no, zone:iv.zone||''});
      }});
    }
    // 팀 묶음(手配書에서 묶은 그룹) — 배지 표기를 다른 화면과 똑같이 맞춘다
    TG={};
    for(let i=0;i<seqs.length;i+=300){ const chunk=seqs.slice(i,i+300);
      const {data:po}=await supa.from('print_overrides').select('event_seq,team_group').in('event_seq',chunk);
      (po||[]).forEach(x=>{ if(x.team_group) TG[x.event_seq]=x.team_group; });
    }
    ROWS=(bs||[]).map(b=>{ const g=GMAP[b.event_seq]||{};
      return { seq:b.event_seq, eventNo:b.event_no||'', rep:b.rep_name||'', dep:(b.dep_date||'').slice(0,10), arr:(b.arr_date||'').slice(0,10),
        tag:g.team_tag||g.group_code||('#'+(b.event_no||b.event_seq)), accom:g.accom||'', pax:g.pax||0, token:TOKMAP[b.event_seq]||'',
        grp:TG[b.event_seq]||'',
        rooms:[...(RM[b.event_seq]||new Map()).values()].sort((x,y)=>String(x.no).localeCompare(String(y.no),'ko',{numeric:true})) };
    }).sort((a,b)=>(a.dep||'').localeCompare(b.dep||'')||accomOrd(a.accom)-accomOrd(b.accom)||(a.rep||'').localeCompare(b.rep||''));
    DATESEL.clear();
    // 숙소 기본선택 = 야마나미·쿠주힐즈(그 달에 있는 것만). 다른 페이지와 동일.
    ACCOMSEL=new Set(['야마나미리조트','쿠주힐즈'].filter(a=>ROWS.some(r=>r.accom===a)));
    renderChips(); renderPreview();
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFailToast',e.message),'err'); }
}

function renderChips(){
  const dates=[...new Set(ROWS.map(r=>r.dep).filter(Boolean))].sort();
  const accoms=[...new Set(ROWS.map(r=>r.accom).filter(Boolean))].sort((a,b)=>accomOrd(a)-accomOrd(b));
  const allLbl=tx('allChip');
  $('#datechips').innerHTML = `<button type="button" class="chip${DATESEL.size?'':' on'}" data-date="__all">${allLbl}</button>`
    + dates.map(d=>`<button type="button" class="chip${DATESEL.has(d)?' on':''}" data-date="${esc(d)}">${esc(SZCore.mdWd(d,lang()))}</button>`).join('');
  $('#accomchips').innerHTML = `<button type="button" class="chip${ACCOMSEL.size?'':' on'}" data-accom="__all">${allLbl}</button>`
    + accoms.map(a=>`<button type="button" class="chip${ACCOMSEL.has(a)?' on':''}" data-accom="${esc(a)}">${esc(accomL(a))}</button>`).join('');
  $('#datechips').querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.date; if(v==='__all') DATESEL.clear(); else { DATESEL.has(v)?DATESEL.delete(v):DATESEL.add(v); } renderChips(); renderPreview();
  }));
  $('#accomchips').querySelectorAll('[data-accom]').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.accom; if(v==='__all') ACCOMSEL.clear(); else { ACCOMSEL.has(v)?ACCOMSEL.delete(v):ACCOMSEL.add(v); } renderChips(); renderPreview();
  }));
}

function pass(r){
  if(DATESEL.size && !DATESEL.has(r.dep)) return false;
  if(ACCOMSEL.size && !ACCOMSEL.has(r.accom)) return false;
  // 검색은 날짜·숙소 필터보다 우선한다 — 「인쇄물 잃어버린 그 팀만 다시」 쓰는 용도라
  // 무슨 칩이 켜져 있든 이름만 치면 찾아진다.
  return true;
}
function hit(r){
  const q=Q.trim().toLowerCase(); if(!q) return true;
  const hay=[r.rep, r.tag, r.eventNo, r.seq, accomL(r.accom), ...(r.rooms||[]).map(x=>x.no)].join(' ').toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w));
}
function visibleRows(){ const q=Q.trim(); return q ? ROWS.filter(hit) : ROWS.filter(pass); }

function renderPreview(){
  const vis=visibleRows();
  const noTok=vis.filter(r=>!r.token).length;
  $('#stat').textContent = ROWS.length?(Q.trim()?tx('srchHit',vis.length)+' · ':'')+tx('statCount',vis.length,ROWS.length,noTok):'';
  $('#btn-print').disabled = !vis.some(r=>r.token);
  if(!ROWS.length){ $('#preview').innerHTML=`<div class="deny">${tx('noData')}</div>`; return; }
  if(!vis.length){ $('#preview').innerHTML=`<div class="deny">${tx('noMatch')}</div>`; return; }
  // 표 보기 — 숙소로 묶고, 그 안은 층 → 방호수 순. 방배정 화면과 같은 순서로 눈이 따라간다.
  const key=r=>accomL(r.accom)||tx('unassigned');
  const minFloor=r=>{ const fs=(r.rooms||[]).map(x=>floorNo(x.zone,x.no)).filter(Boolean); return fs.length?Math.min(...fs):99; };
  const firstRoom=r=>(r.rooms&&r.rooms[0])?String(r.rooms[0].no):'~';
  const sorted=vis.slice().sort((a,b)=>
    accomOrd(a.accom)-accomOrd(b.accom) || minFloor(a)-minFloor(b) ||
    firstRoom(a).localeCompare(firstRoom(b),'ko',{numeric:true}) || (a.dep||'').localeCompare(b.dep||''));
  let cur=null; const body=[];
  sorted.forEach(r=>{
    const k=key(r);
    if(k!==cur){ cur=k; body.push(`<tr class="gh"><td colspan="9">${esc(k)}</td></tr>`); }
    const fl=[...new Set((r.rooms||[]).map(x=>floorLabel(x.zone,x.no)).filter(Boolean))].join(' · ');
    const rooms=(r.rooms||[]).map(x=>esc(x.no)).join(' · ');
    body.push(`<tr>
      <td class="tag">${esc(r.tag)}${grpBadge(r)}</td>
      <td>${esc(r.rep||'-')}</td>
      <td class="nt">${esc(accomL(r.accom))}</td>
      <td class="fl">${esc(fl)}</td>
      <td class="rno">${rooms||`<span class="nt">${tx('noRoom')}</span>`}</td>
      <td class="nt">${fmtMD(r.dep)}~${fmtMD(r.arr)}</td>
      <td>${r.pax}</td>
      <td>${r.token?'✓':`<span class="warn">${tx('pvNoTok')}</span>`}</td>
      <td>${r.token?`<button type="button" class="rebtn" data-reissue="${r.seq}">${tx('reissue')}</button>`:''}</td>
    </tr>`);
  });
  $('#preview').innerHTML=`<div class="tblwrap"><table class="qt">
    <thead><tr><th>${tx('thTag')}</th><th>${tx('thRep')}</th><th>${tx('thAccom')}</th><th>${tx('thFloor')}</th>
      <th>${tx('thRoom')}</th><th>${tx('thStay')}</th><th>${tx('thPax')}</th><th>${tx('thTok')}</th><th></th></tr></thead>
    <tbody>${body.join('')}</tbody></table></div>`;
  $('#preview').querySelectorAll('[data-reissue]').forEach(b=>b.addEventListener('click',()=>reissueToken(Number(b.dataset.reissue))));
}

// QR 데이터URL 생성 — 자체 호스팅 qrcode-generator(동기, 전역 window.qrcode). CDN 의존 없음.
function qrDataURL(text){
  try{
    const qr=qrcode(0,'M'); qr.addData(String(text)); qr.make();
    return qr.createDataURL(8, 0);   // cellSize 8px, margin 0 (카드 CSS가 26mm로 스케일)
  }catch(_){ return ''; }
}
// 손님 폰 카메라로 찍으면 결제내역(bill.html) 이 열리는 URL. 직원 POS 스캔도 ?t= 를 파싱해 호환.
function billUrl(token){ return new URL('bill.html?t='+encodeURIComponent(token), location.href).href; }
// 카드 그리드 인쇄(새 창) — QR dataURL을 img로 삽입
async function printCards(only){
  const cards=(Array.isArray(only)?only:visibleRows()).filter(r=>r.token);
  if(!cards.length){ toast(tx('noCards'),'err'); return; }
  if(typeof qrcode!=='function'){ toast(tx('qrLibFail'),'err'); return; }
  const w=window.open('','_blank','width=920,height=950'); if(!w){ toast(tx('popupBlocked'),'err'); return; }
  const qmap={};
  cards.forEach(r=>{ qmap[r.seq]=qrDataURL(billUrl(r.token)); });   // QR=bill URL(손님 폰=결제내역, POS=?t= 파싱)
  // 방배정된 팀 = 배정 방마다 카드 1장(같은 QR토큰·방호수만 다름). 미배정 팀 = 카드 1장.
  const units=[];
  cards.filter(r=>qmap[r.seq]).forEach(r=>{ const rooms=(r.rooms&&r.rooms.length)?r.rooms:[null]; rooms.forEach(rm=>units.push({r,rm})); });
  const cardHTML=units.map(({r,rm})=>`<div class="qc">
      ${rm?`<div class="qc-room">${floorLabel(rm.zone,rm.no)?`<b>${esc(floorLabel(rm.zone,rm.no))}</b>`:''}${esc(rm.no)}</div>`:''}
      <div class="qc-h">
        <div class="qc-name">${esc(r.rep||'-')} <span>様</span></div>
        <div class="qc-sub">${esc(r.tag||'')} ・ ${esc(accomL(r.accom))}</div>
      </div>
      <img class="qc-qr" src="${qmap[r.seq]}" alt="QR">
      <div class="qc-inst">注文時にこのQRをご提示ください<br><span>주문 시 이 QR을 보여주세요</span></div>
      <div class="qc-brand">SaiZen ・ Aso Yamanami</div>
    </div>`).join('');
  const today=new Date().toISOString().slice(0,10);
  const fullHTML=`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>注文QRカード_${today}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e8eaf0;font-family:'Yu Gothic','Meiryo','Malgun Gothic',sans-serif;color:#1a2030;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;display:flex;gap:14px;align-items:center;background:#1e3a5f;color:#fff;padding:10px 16px;z-index:10}
  .bar h1{font-size:14px;font-weight:700}.bar .meta{font-size:11px;opacity:.85}
  .bar button{background:#fff;color:#1e3a5f;border:none;border-radius:5px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer}
  .bar .x{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
  .grid{padding:8mm;display:flex;flex-wrap:wrap;gap:6mm;align-content:flex-start;justify-content:center}
  .qc{width:88mm;height:56mm;background:#fff;border:0.4mm solid #1e3a5f;border-radius:3mm;padding:4mm 5mm;display:flex;flex-direction:column;align-items:center;position:relative}
  /* 오른쪽 위 방번호 뱃지와 겹치지 않게 양옆을 비운다(가운데 정렬 유지) */
  .qc-h{width:100%;text-align:center;padding:0 19mm}
  .qc-name{font-size:14pt;font-weight:800;color:#1e3a5f;line-height:1.15}
  .qc-name span{font-size:10pt;font-weight:600}
  .qc-sub{font-size:8.5pt;color:#555;font-family:Consolas,Menlo,monospace;margin-top:0.6mm}
  .qc-qr{width:24mm;height:24mm;margin:1.4mm 0}
  .qc-inst{font-size:8.5pt;font-weight:800;color:#111;text-align:center;line-height:1.3}
  .qc-inst span{font-weight:700;color:#1e3a5f}
  /* 회사명은 흐름 안에서 맨 아래(margin-top:auto) — 절대배치로 두면 위 문구와 겹친다 */
  .qc-brand{margin-top:auto;padding-top:1mm;font-size:6.5pt;color:#9aa;letter-spacing:.5px}
  .qc-room{position:absolute;top:3mm;right:3.5mm;font-size:12pt;font-weight:800;color:#1e3a5f;background:#eaf0f8;border:0.35mm solid #1e3a5f;border-radius:2mm;padding:1mm 2.4mm;line-height:1.15;text-align:center}
  /* 호수와 층이 다른 번호체계(1902호=9층)라 손님이 헷갈린다 → 층을 호수 위에 함께 인쇄 */

</style></head><body>
  <div class="bar"><h1>注文QRカード / 주문 QR카드</h1><div class="meta">${today} ・ ${units.length}${tx('teamUnit')}</div>
    <div style="flex:1"></div>
    <button onclick="window.print()">🖨 ${lang()==='ja'?'印刷':lang()==='en'?'Print':'인쇄'}</button>
    <button class="x" onclick="window.close()">✕ ${lang()==='ja'?'閉じる':lang()==='en'?'Close':'닫기'}</button>
  </div>
  <div class="grid">${cardHTML}</div>
</body></html>`;
  try{ w.document.open(); w.document.write(fullHTML); w.document.close(); }catch(_){}
}
