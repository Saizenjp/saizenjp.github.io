function bind(){
  // 라운딩 예외 패널 — 펼침 상태는 재렌더를 넘어 유지한다
  document.querySelectorAll('details.so-fold[data-fold]').forEach(d=>d.addEventListener('toggle',()=>{ FOLD[d.dataset.fold]=d.open; }));
  // 라운딩 예외 패널 — 홀수 버튼 · 이름(불참) · 라운딩 안 함
  document.querySelectorAll('[data-exh]').forEach(b=>b.addEventListener('click',()=>setHoles(b.dataset.exh, +b.dataset.h)));
  document.querySelectorAll('[data-exa]').forEach(b=>b.addEventListener('click',()=>toggleAbsent(b.dataset.exa, b.dataset.seq)));
  document.querySelectorAll('[data-exskip]').forEach(b=>b.addEventListener('click',()=>toggleSkip(b.dataset.exskip)));
  document.querySelectorAll('#board .cell').forEach(b=>{
    b.addEventListener('click',e=>{
      const del=e.target&&e.target.getAttribute&&e.target.getAttribute('data-del');
      if(del!=null&&del!==''){
        e.stopPropagation();
        snap();
        const gone=BOARD[+del], seq=gone&&gone.seq;
        BOARD.splice(+del,1); SELG=null; MSEL=new Set();
        // 그 팀의 조가 하나도 안 남았다면 = 오늘 안 나간다는 뜻 → 제외로 넘긴다.
        //  이렇게 하지 않으면 자동 배정이 다시 채워 「지웠는데 또 있다」가 된다.
        if(seq!=null && !BOARD.some(g=>String(g.seq)===String(seq))){ markSkip(seq); }
        render(); touch(); return;
      }
      const c=b.getAttribute('data-c'), slot=+b.getAttribute('data-s');
      const gi=b.getAttribute('data-i');
      // 여러 조 일괄 선택 모드 — 조 클릭=선택 토글 · 빈 칸 클릭=그 자리부터 연속 배치(변경 확인 바)
      if(MULTI){
        if(gi!=null&&gi!==''){ if(MSEL.has(+gi)) MSEL.delete(+gi); else MSEL.add(+gi); PEND=null; render(); return; }
        if(!MSEL.size) return;
        PEND={kind:'mmulti', gis:[...MSEL], c, slot}; render(); return;
      }
      // 조를 한 번 누르면 선택(하단에 안내가 뜬다) → 옮길 자리를 누르면 이동.
      //   빈 칸·다른 조 어디든 놓을 수 있다(드래그와 같은 규칙: 찬 자리는 끼워넣고 아래를 민다).
      //   같은 조를 다시 누르면 선택 해제. ESC 로도 취소된다.
      if(SELG==null){ if(gi!=null&&gi!=='') { SELG=+gi; PEND=null; render(); } return; }
      if(gi!=null&&gi!=='' && +gi===SELG){ SELG=null; PEND=null; render(); return; }
      // 두 번째 클릭 = 바로 옮기지 않고 아래 바에 「무엇 → 어디로」를 띄운다 → [변경]으로 확정(Min 2026-10-25)
      const g0=BOARD[SELG]; if(g0 && g0.course===c && g0.slot===slot) return;
      PEND={kind:'move', gi:SELG, c, slot}; render();
    });
    // ≡ 를 잡고 자유 이동. 찬 칸에 놓으면 그 자리에 끼워넣고 아래를 한 칸씩 민다.
    b.addEventListener('dragstart',e=>{
      const gi=b.getAttribute('data-i'); if(gi==null||gi===''){ e.preventDefault(); return; }
      DRAG=+gi; b.classList.add('dragging');
      try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(gi)); }catch(_){}
    });
    b.addEventListener('dragend',()=>{ DRAG=null; document.querySelectorAll('#board .cell').forEach(x=>x.classList.remove('dragging','over')); });
    b.addEventListener('dragover',e=>{ if(DRAG==null) return; e.preventDefault(); b.classList.add('over'); });
    b.addEventListener('dragleave',()=>b.classList.remove('over'));
    b.addEventListener('drop',e=>{
      e.preventDefault(); b.classList.remove('over');
      if(DRAG==null) return;
      const c=b.getAttribute('data-c'), slot=+b.getAttribute('data-s');
      snap(); moveGroup(DRAG, c, slot); DRAG=null; SELG=null; PEND=null; render(); touch();
    });
  });
  document.querySelectorAll('#board .un[data-seq]').forEach(b=>b.addEventListener('click',e=>{
    if(e.target&&e.target.classList&&e.target.classList.contains('skipb')) return;
    placeTeam(+b.getAttribute('data-seq'));
  }));
  // 이름을 누르면 집는다 → ① 다른 이름을 누르면 **교환** ② 조(시각) 버튼을 누르면 그 조로 **이동**
  document.querySelectorAll('#board .ckm').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const gi=+b.getAttribute('data-gi'), mid=String(b.getAttribute('data-mid'));
    if(!PICK){ PICK={gi,mid}; PEND=null; render(); return; }
    if(PICK.mid===mid){ PICK=null; PEND=null; render(); return; }
    const A=BOARD[PICK.gi], B=BOARD[gi];
    if(A&&B){
      const ai=(A.members||[]).findIndex(m=>String(m.id)===PICK.mid);
      const bi=(B.members||[]).findIndex(m=>String(m.id)===mid);
      // 두 번째 이름 = 바로 바꾸지 않고 아래 바에 「A ↔ B」 → [변경]으로 확정(Min 2026-10-25)
      if(ai>=0&&bi>=0){ PEND={kind:'swap', a:{gi:PICK.gi,mid:PICK.mid}, b:{gi,mid}}; render(); return; }
    }
    PICK=null; PEND=null; render();
  }));
  // 집어든 사람을 그 조로 옮긴다(정원 4명까지)
  document.querySelectorAll('#board .ckg').forEach(b=>b.addEventListener('click',e=>{
    const gi=+b.getAttribute('data-goto');
    if(PICK==null){ SELG=(SELG===gi)?null:gi; PEND=null; render(); return; }
    e.stopPropagation();
    const A=BOARD[PICK.gi], B=BOARD[gi];
    if(!A||!B||PICK.gi===gi){ PICK=null; PEND=null; render(); return; }
    if((B.members||[]).length>=4){ toast(tx('rosFull'),'warn'); PICK=null; PEND=null; render(); return; }
    const ai=(A.members||[]).findIndex(m=>String(m.id)===PICK.mid);
    if(ai<0){ PICK=null; PEND=null; render(); return; }
    // 조(시각) 버튼 = 바로 옮기지 않고 아래 바에 「이름 → 조」 → [변경]으로 확정(Min 2026-10-25)
    PEND={kind:'mmove', a:{gi:PICK.gi,mid:PICK.mid}, gi}; render();
  }));
  document.querySelectorAll('#board [data-okseq]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); const seq=b.getAttribute('data-okseq');
    snap(); BOARD.filter(g=>String(g.seq)===String(seq)).forEach(markManual);
    render(); touch(); toast(tx('chkOkDone'),'ok');
  }));

  document.querySelectorAll('#board .skipb').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); toggleSkip(+b.getAttribute('data-skip'));
  }));
  bindRoster();
}

// 조를 (코스, 슬롯)으로 옮긴다.
//  · 빈 칸  → 그대로 이동
//  · 찬 칸  → 그 자리에 끼워넣고, 그 아래 연속된 조를 한 칸씩 아래로 민다
//  · 아래에 빈 자리가 없으면 → 두 조를 맞바꾼다
function moveGroup(gi, course, slot){
  const g=BOARD[gi]; if(!g) return;
  if(g.course===course && g.slot===slot) return;
  const col=BOARD.filter((x,i)=>i!==gi && x.course===course);
  const taken=new Set(col.map(x=>x.slot));
  markManual(g);
  if(!taken.has(slot)){ setPos(g,course,slot); return; }
  let free=-1;
  for(let sN=slot+1; sN<=SLOTS.length; sN++){ if(!taken.has(sN)){ free=sN; break; } }
  if(free<0){                                   // 아래가 끝까지 찼다 → 맞바꾸기
    const other=col.find(x=>x.slot===slot);
    const oc=g.course, os=g.slot;
    setPos(g,course,slot); if(other) setPos(other,oc,os);
    toast(tx('noShift'),'warn'); return;
  }
  col.filter(x=>x.slot>=slot && x.slot<free).sort((a,b)=>b.slot-a.slot)
     .forEach(x=>setPos(x,course,x.slot+1));
  setPos(g,course,slot);
  toast(tx('moveDone'),'ok');
}
function setPos(g,course,slot){ g.course=course; g.slot=slot; g.tee=SLOTS[slot-1]||''; }
// 확인 완료 표시 — [✓ 이대로 확정] 과 조를 다른 자리로 옮겼을 때만 쓴다.
//  ⚠ 조원을 바꾸는 것은 「고치는 중」이지 확인 완료가 아니다 → 목록에서 사라지면 안 된다.
function markManual(g){ if(g) g.src='manual'; }

// 빈 슬롯 찾기 — 늦은 조(쿠주힐즈)도 **마지막 조 바로 다음** 자리에 넣는다.
//  ⚠ 맨 뒤에서부터 채우면 앞 조와 사이에 빈 출발 시각이 생긴다 → 안 된다(Min 2026-08).
function firstFree(late){
  const idx=[...SLOTS.keys()];
  if(!late) { for(const i of idx){ for(const c of COURSES){ if(groupAt(c.code,i+1)<0) return {course:c.code, slot:i+1}; } } return null; }
  const last=BOARD.reduce((m,g)=>Math.max(m,g.slot||0),0);
  const order=idx.filter(i=>i+1>=last).concat(idx.filter(i=>i+1<last));
  for(const i of order){ for(const c of COURSES){ if(groupAt(c.code,i+1)<0) return {course:c.code, slot:i+1}; } }
  return null;
}
function placeTeam(seq){
  if(isSkip(seq)) return;
  const t=teamsOnDate(DATESEL).find(x=>String(x.seq)===String(seq)); if(!t) return;
  const placed=BOARD.filter(g=>String(g.seq)===String(seq)).reduce((s,g)=>s+(g.pax||0),0);
  const rest=t.pax-placed; if(rest<=0) return;
  const parts=SZCore.splitTeam(rest,4);
  let added=0;
  parts.forEach(n=>{
    const f=firstFree(isLate(t)); if(!f){ toast(tx('noSlot'),'warn'); return; }
    const auto = (t.pax<=4) ? (ROSTER[t.seq]||[]).slice(0,n) : [];
    BOARD.push({ seq:t.seq, course:f.course, slot:f.slot, tee:SLOTS[f.slot-1]||'', pax:n,
      tag:t.tag, rep:t.rep, holes:holesOn(t,DATESEL), late:isLate(t), cart:'', note:'', members:auto });
    added++;
  });
  if(added) render();
}

// 한 날짜의 부족분을 계획한다 — 기존 조는 건드리지 않고 빈 자리에만 채운다.
//  자리 배분 = 한 시간대의 아소→소보→쿠주를 다 채우고 다음 시간대로(공평·로테이션).
//  날짜마다 시작 코스를 한 칸씩 밀어 같은 팀이 날마다 다른 코스를 돌게 한다.
//  자리가 모자라면 6:50부터 7분 간격으로 필요한 만큼 뒤로 늘린다(연장 표시).
function planDate(date, existing, dateIdx){
  const teams=teamsOnDate(date).filter(t=>!skipOn(date,t.seq));
  if(!teams.length) return {rows:[], slots:SLOTS};
  const placed={}; (existing||[]).forEach(e=>{ placed[e.event_seq]=(placed[e.event_seq]||0)+(e.capacity||0); });
  // 팀 단위로 필요한 조를 만든다 — 한 팀은 한 코스에 연속으로 붙인다.
  const need=[];
  teams.slice().sort((a,b)=>a.seq-b.seq).forEach(t=>{
    const rest=paxOn(date,t)-(placed[t.seq]||0);   // 불참자는 빼고 조를 만든다(Min 2026-08)
    // 전날 조 유지 — 어제 조 크기(예 [4,3])가 오늘 인원과 맞으면 그대로, 아니면 균등 분할
    const cf=(!placed[t.seq])?carryFor(t.seq,date):null;
    const parts=(cf && cf.sizes.reduce((a,b)=>a+b,0)===rest) ? cf.sizes : SZCore.splitTeam(rest,4);
    const early=isDepartRound(t,date);
    if(rest>0) need.push({ t, parts, early, late:isLate(t)&&!early, pref:prefCourse(t.seq,date) });   // pref=어제 출발 코스의 다음(일별 로테이션)
  });
  if(!need.length) return {rows:[], slots:SLOTS};
  const cs=COURSES.map(c=>c.code);
  const occ=new Set((existing||[]).map(e=>e.course_code+'|'+e.slot_no));
  const load={}; cs.forEach(c=>load[c]=0);
  (existing||[]).forEach(e=>{ if(load[e.course_code]!=null) load[e.course_code]++; });
  const totalG=(existing||[]).length + need.reduce((n,x)=>n+x.parts.length,0);
  let slots=makeSlots(Math.max(STD_N, Math.ceil(totalG/cs.length)+2));
  // 그 코스에서 연속 k칸이 비어 있는 첫 자리(늦은 조는 뒤에서부터)
  const freeRun=(c,k,fromEnd)=>{
    const fits=st=>{ for(let j=0;j<k;j++) if(occ.has(c+'|'+(st+j))) return false; return true; };
    if(fromEnd){ for(let st=slots.length-k+1; st>=1; st--) if(fits(st)) return st; }
    else { for(let st=1; st+k-1<=slots.length; st++) if(fits(st)) return st; }
    return -1;
  };
  const rows=[];
  const place=(x,ti)=>{
    const k=x.parts.length;
    // 코스 선택 = ① 어제 출발 코스의 다음 코스(일별 로테이션 「가」, Min 2026-10-25) → ② 가장 덜 찬 코스(공평·1/3 분배) → ③ 날짜·순번 tie-break
    //   어제도 균등했다면 전 팀이 한 칸씩 돌아도 오늘 역시 균등하다. 첫날 팀(어제 기록 없음)만 ②로 빈 곳을 메운다.
    const pref=x.pref||null;
    const order=cs.slice().sort((a,b)=>{
      if(pref){ if(a===pref && b!==pref) return -1; if(b===pref && a!==pref) return 1; }
      if(load[a]!==load[b]) return load[a]-load[b];
      const ra=(cs.indexOf(a)-((ti+(dateIdx||0))%cs.length)+cs.length)%cs.length;
      const rb=(cs.indexOf(b)-((ti+(dateIdx||0))%cs.length)+cs.length)%cs.length;
      return ra-rb;
    });
    for(let pass=0; pass<2; pass++){
      for(const c of order){
        const st=freeRun(c,k,x.late);
        if(st<0) continue;
        x.parts.forEach((n,j)=>{
          const slot=st+j; occ.add(c+'|'+slot); load[c]++;
          rows.push({ seq:x.t.seq, tag:x.t.tag, rep:x.t.rep, pax:n, course:c, slot,
            tee:slots[slot-1]||'', late:x.late, holes:holesOn(x.t,date) });
        });
        return true;
      }
      slots=makeSlots(slots.length+Math.max(k,3));   // 연속 자리가 없으면 뒤로 늘린다
    }
    return false;
  };
  let ti=0;
  need.filter(x=>x.early).forEach(x=>place(x,ti++));            // 귀국일 팀 = 오전 18H → 맨 앞 티오프(Min 2026-10-25)
  need.filter(x=>!x.early&&!x.late).forEach(x=>place(x,ti++));
  need.filter(x=>!x.early&&x.late).forEach(x=>place(x,ti++));   // 쿠주힐즈 숙박 = 늦은 조(뒤에서부터 자리를 잡는다)
  // ⚠ 늦은 조를 뒤에서 채우면 앞 조와 사이에 빈 출발 시각이 생긴다 → 앞으로 당겨 메운다(Min 2026-08).
  //   이미 있던 조(existing)의 자리는 그대로 두고, 새로 넣은 조만 그 코스의 빈 자리를 앞에서부터 다시 채운다.
  //   배치 순서(일반 → 늦은 조)는 유지되므로 늦은 조는 여전히 맨 뒤에 온다.
  cs.forEach(c=>{
    const fixed=new Set((existing||[]).filter(e=>e.course_code===c).map(e=>e.slot_no));
    const mine=rows.filter(r=>r.course===c).sort((a,b)=>a.slot-b.slot);
    let s=1;
    mine.forEach(r=>{ while(fixed.has(s)) s++; r.slot=s++; });
  });
  // 당긴 뒤에는 늘렸던 연장 줄이 필요 없어진다 → 실제 쓰는 만큼으로 줄인다
  const maxUsed=Math.max(0, ...rows.map(r=>r.slot), ...((existing||[]).map(e=>e.slot_no||0)));
  slots=makeSlots(Math.max(STD_N, maxUsed));
  // 슬롯을 늘린 뒤 앞서 배정된 조의 티오프 문자열을 맞춘다
  rows.forEach(r=>{ r.tee=slots[r.slot-1]||r.tee; });
  return {rows, slots};
}

// 이달 전체 — 날짜를 열지 않아도 그 달 라운딩일 전부를 배정·저장한다.
async function autoAssignMonth(){
  if(!supa) return;
  const btn=$('#btn-month'); if(btn){ btn.disabled=true; btn.textContent=tx('monthRun'); }
  const by=(window.__so_getUser&&__so_getUser())||null;
  let days=0, made=0;
  try{
    const ax=golfDates();
    await loadMonthState();   // ⚠ 오래된 월 상태로 돌리면 이미 저장된 날의 조를 다시 넣는다(2026-10-25 중복 사고)
    for(let di=0; di<ax.length; di++){
      const date=ax[di];
      // 진행률 — 며칠 중 몇째 날인지(Min 2026-08: 얼마나 남았는지 보이게)
      if(btn){ btn.textContent=tx('monthRunP', Math.round(di/ax.length*100), di, ax.length); }
      await new Promise(r=>setTimeout(r,0));   // 버튼 글자가 실제로 다시 그려지도록 양보
      const existing=(date===DATESEL && BOARD.length)? BOARD.map(g=>({event_seq:g.seq,course_code:g.course,slot_no:g.slot,capacity:g.pax})) : (MONTHG[date]||[]);
      const {rows}=planDate(date, existing, di);
      if(!rows.length) continue;
      const ins=rows.map(r=>({ play_date:date, event_seq:r.seq, course_code:r.course, tee_time:r.tee,
        slot_no:r.slot, label:r.tag||null, capacity:r.pax, assign_source:'auto', created_by:by }));
      for(let i=0;i<ins.length;i+=400){
        const chunk=ins.slice(i,i+400);
        const {data,error}=await supa.from('golf_groups').insert(chunk).select('id,event_seq,capacity,slot_no,course_code');
        if(error) throw error;
        // 4명 이하 팀은 조원까지 자동(조가 하나뿐이라 나눌 여지가 없다)
        // 조원 기본값 — 그 팀 안에서 명단 순서대로 1조·2조로 나눈다
        const mrows=[]; const byTeam={};
        (data||[]).forEach(g=>{ (byTeam[g.event_seq]=byTeam[g.event_seq]||[]).push(g); });
        Object.keys(byTeam).forEach(seq=>{
          const cf=carryFor(seq,date);                     // 전날 조 유지(있으면 그 순서)
          const roster=cf?cf.roster:(ROSTER[seq]||[]); let i=0;
          byTeam[seq].sort((a,b)=>(a.slot_no||0)-(b.slot_no||0)).forEach(g=>{
            roster.slice(i, i+(g.capacity||4)).forEach((m,k)=>mrows.push({group_id:g.id, member_id:m.id, event_seq:m.seq, seq:k+1}));
            i+=(g.capacity||4);
          });
        });
        for(let j=0;j<mrows.length;j+=500){ await supa.from('golf_group_members').insert(mrows.slice(j,j+500)); }
        // 다음 날이 오늘 조를 이어받도록 월 상태에 바로 반영
        (data||[]).forEach(g=>{ (MONTHG[date]=MONTHG[date]||[]).push({ id:g.id, play_date:date, event_seq:g.event_seq, course_code:g.course_code, slot_no:g.slot_no, capacity:g.capacity, assign_source:'auto',
          members:mrows.filter(r=>r.group_id===g.id).map(r=>String(r.member_id)) }); });
        made+=chunk.length;
      }
      days++;
    }
    await loadMonthState();
    renderDateChips();
    if(DATESEL) await loadBoard(DATESEL,true); else render();
    toast(days?tx('monthDone',days,made):tx('monthNone'), days?'ok':'warn');
  }catch(e){ toast(tx('saveFail')+e.message,'err'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=tx('autoMonth'); } }
}


// 그 날짜를 처음부터 다시 짠다 — 확정(manual)한 조는 그대로 두고 나머지만 새로 배분한다.
//  자동 채움은 빠진 팀만 메우므로, 한 번 치우친 배치(예: 쿠주만 비어 있음)는 이걸로 고친다.
async function redoDate(quiet){
  if(!DATESEL||!supa) return 0;
  if(!quiet && !confirm(tx('redoAsk',DATESEL))) return 0;
  snap();
  const keep=BOARD.filter(g=>g.src==='manual');
  BOARD=keep.slice(); SELG=null; PEND=null; PICK=null; SLOTS=STD_SLOTS.slice();
  const {rows,slots}=planDate(DATESEL, keep.map(g=>({event_seq:g.seq,course_code:g.course,slot_no:g.slot,capacity:g.pax})), 0);
  SLOTS=slots;
  rows.forEach(r=>BOARD.push({ seq:r.seq, course:r.course, slot:r.slot, tee:r.tee, pax:r.pax,
    tag:r.tag, rep:r.rep, holes:r.holes, late:r.late, cart:'', note:'', src:'auto', members:[] }));
  [...new Set(rows.map(r=>r.seq))].forEach(fillTeamMembers);
  ensureSlots(BOARD.reduce((m,g)=>Math.max(m,g.slot||0),0));
  render(); await save(true);
  if(!quiet) toast(tx('redoDone',BOARD.length),'ok');
  return BOARD.length;
}
// 이달 전체 재배정 — 날짜마다 확정 조만 남기고 다시 짠다.
async function redoMonth(){
  if(!supa) return;
  if(!confirm(tx('redoMAsk'))) return;
  const btn=$('#btn-redom'); if(btn){ btn.disabled=true; btn.textContent=tx('monthRun'); }
  let n=0;
  try{
    const ax=golfDates(); const cur=DATESEL;
    for(const d of ax){
      DATESEL=d; await loadBoard(d,true);       // 그 날짜를 화면 상태로 올린 뒤
      n+=await redoDate(true);                   // 확정 조만 남기고 다시 짠다
    }
    DATESEL=cur||ax[0];
    await loadMonthState(); renderDateChips();
    if(DATESEL) await loadBoard(DATESEL,true);
    toast(tx('redoDone',n),'ok');
  }catch(e){ toast(tx('saveFail')+e.message,'err'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=tx('redoMBtn'); } }
}

// 저장이 도는 동안 또 저장이 걸리면 끝난 뒤 한 번만 더 — 두 저장이 겹쳐 id 없는 조를 두 번 넣는 일을 막는다
let SAVING=null, SAVE_AGAIN=false;
async function save(quiet){
  if(SAVING){ SAVE_AGAIN=true; return SAVING; }
  SAVING=_save(quiet);
  try{ await SAVING; } finally{ SAVING=null; }
  if(SAVE_AGAIN){ SAVE_AGAIN=false; return save(true); }
}
async function _save(quiet){
  if(!DATESEL||!supa||TV) return;
  const by=(window.__so_getUser&&__so_getUser())||null;
  // 샷건 날에 새로 생긴 조(미배정 넣기·재배정)는 홀이 비어 있다 → 저장 전에 뽑아 둔다
  if(isShotgun(DATESEL) && assignStartHoles(false)){ try{ render(); }catch(e){} }
  // 새로 생긴 조(미배정 넣기·재배정)는 카트가 비어 있다 → 저장 전에 규칙으로 배분해 둔다(조당 1대)
  if(BOARD.some(g=>!g.cart)){ try{ await loadUnits(); if(autoCartNos(false).changed) render(); }catch(e){} }
  try{
    // 화면에서 사라진 조만 삭제(남은 조는 id 유지 → 조원 배정·카트번호가 보존된다)
    const keep=new Set(BOARD.map(g=>g.id).filter(Boolean));
    const gone=DBIDS.filter(id=>!keep.has(id));
    if(gone.length){ const {error}=await supa.from('golf_groups').delete().in('id',gone); if(error) throw error; }
    for(const g of BOARD){
      const row={ play_date:DATESEL, event_seq:g.seq, course_code:g.course||null, tee_time:g.tee||null,
        slot_no:g.slot||null, label:g.tag||null, capacity:g.pax||4, cart_no:g.cart||null, note:g.note||null,
        start_hole:g.hole||null, pm_tee:g.pmTee||null, pm_course:g.pmCourse||null, ...(HAS_LUNCH?{lunch_after:g.lunch||null}:{}), ...(HAS_CARTTYPE?{cart_type:g.ctype||null}:{}) };
      if(g.id){
        // update 는 「그 id 가 아직 있을 때」만 통한다. 되돌리기로 되살린 조는 이미 지워진
        // id 라 0행이 되어 조용히 사라진다 → upsert 로 없으면 그 id 그대로 다시 넣는다.
        const {error}=await supa.from('golf_groups')
          .upsert({ id:g.id, ...row, assign_source:g.src||'auto', created_by:by }, {onConflict:'id'});
        if(error) throw error;
      }
      else{ const {data,error}=await supa.from('golf_groups').insert({...row, assign_source:g.src||'manual', created_by:by}).select('id').single();
        if(error) throw error; g.id=data.id; }
    }
    // 조원(사람 배치)도 같이 저장 — 그날 조의 조원을 통째 교체
    const ids=BOARD.map(g=>g.id).filter(Boolean);
    if(ids.length){
      for(let i=0;i<ids.length;i+=150){
        const {error:de}=await supa.from('golf_group_members').delete().in('group_id',ids.slice(i,i+150));
        if(de) throw de;
      }
      const rows=[];
      BOARD.forEach(g=>{ (g.members||[]).forEach((m,i)=>rows.push({ group_id:g.id, member_id:m.id, event_seq:m.seq||g.seq, seq:i+1 })); });
      for(let i=0;i<rows.length;i+=500){
        const {error:ie}=await supa.from('golf_group_members').insert(rows.slice(i,i+500));
        if(ie) throw ie;
      }
    }
    DBIDS=BOARD.map(g=>g.id).filter(Boolean);
    // 월 상태도 같이 맞춘다 — 다음 날의 로테이션(어제 코스)·전날 조 유지·날짜 칩이 방금 저장한 조를 본다
    MONTHG[DATESEL]=BOARD.map(g=>({ id:g.id, play_date:DATESEL, event_seq:g.seq, course_code:g.course, slot_no:g.slot, capacity:g.pax,
      assign_source:g.src||'auto', members:(g.members||[]).map(m=>String(m.id)) }));
    if(!quiet) toast(tx('savedN',BOARD.length),'ok');
  }catch(e){ toast(tx('saveFail')+e.message,'err'); }
}

// A4 가로 — 화면 표와 같은 배열(WYSIWYG)
// ── 코스 입구 모니터 화면 ──────────────────────────────────────────────
//  손님이 지나가며 보는 화면 — 큰 글씨, 지난 조는 흐리게, 다음 출발은 강조.
function renderTV(){
  let box=document.getElementById('tv'); if(!box){ box=document.createElement('div'); box.id='tv'; document.body.appendChild(box); }
  const now=new Date();
  const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const rows=SLOTS.map((tee,i)=>{
    const slot=i+1;
    const any=COURSES.some(c=>groupAt(c.code,slot)>=0);
    if(!any) return '';
    const past=tee<hhmm;
    const tds=COURSES.map(c=>{
      const gi=groupAt(c.code,slot);
      if(gi<0) return '<td></td>';
      const g=BOARD[gi];
      const no=gnoOf(gi);
      return `<td><b>${esc(g.tag||('#'+g.seq))}</b>${no?`<i>${tx('grpNo',no)}</i>`:''}${(isShotgun(DATESEL)&&g.hole)?`<i>H${g.hole}</i>`:''}${g.lunch?`<i>${esc(tx('lunchB',g.lunch))}</i>`:''} `
        +`<span class="nm">${esc(pn(g.rep,''))}${tx('teamOf')}</span> <span class="pax">${(g.members&&g.members.length)||g.pax}${tx('person')}</span></td>`;
    }).join('');
    return `<tr class="${past?'past':''}"><td class="tee">${esc(tee)}</td>${tds}</tr>`;
  }).join('');
  // 다음 출발 = 아직 지나지 않은 첫 줄
  const nextTee=SLOTS.find((t,i)=>t>=hhmm && COURSES.some(c=>groupAt(c.code,i+1)>=0));
  box.innerHTML=`
    <div class="tv-hd">
      <div class="tv-t">${esc(tx('tvTitle'))}</div>
      <div class="tv-d">${esc(DATESEL||'')} ${esc(DATESEL?SZCore.mdWd(DATESEL,lang()):'')}${isShotgun(DATESEL)?` · ${esc(tx('pvSg',shotgunTime(DATESEL)))}`:''}</div>
      <div class="tv-c">${esc(hhmm)}${nextTee?` <span>▶ ${esc(nextTee)} ${esc(tx('tvNow'))}</span>`:''}</div>
    </div>
    <table class="tv-tb"><thead><tr><th>${esc(tx('thTee'))}</th>${COURSES.map(c=>
      `<th class="c-${c.code}">${esc(courseL(c.code))} ${esc(tx('startHd'))}<span>${esc(rotLabel(c.code,27))}</span></th>`).join('')}</tr></thead>
      <tbody>${rows||`<tr><td colspan="4" class="tv-none">${esc(tx('noData'))}</td></tr>`}</tbody></table>`;
  // 다음 출발 줄이 화면 안에 오게
  const nr=box.querySelector('tr:not(.past)'); if(nr && nr.scrollIntoView) try{ nr.scrollIntoView({block:'center'}); }catch(_){}
}

// ── A3 세로 공지용 인쇄 ────────────────────────────────────────────────
//  코스 입구·클럽하우스에 붙이는 공지물이라 멀리서 읽혀야 한다 →
//  A3 세로 한 장에 꽉 채우고, 줄이 많은 날은 글자배율(--fs)을 자동으로 줄여 맞춘다.
// 인쇄물은 **10시 이전 출발까지만** 낸다(Min 2026-08) — 손님이 보는 표라 그 뒤는 필요 없다.
const PRINT_UNTIL='10:00';
function boardRowsHTML(forPrint){
  return SLOTS.map((tee,i)=>{
    if(forPrint && String(tee)>=PRINT_UNTIL) return '';
    const slot=i+1;
    const tds=COURSES.map(c=>{
      const gi=groupAt(c.code,slot);
      if(gi<0) return '<td class="e"></td>';
      const g=BOARD[gi];
      const no=gnoOf(gi);
      const who = forPrint ? `${esc(pn(g.rep,''))}${tx('teamOf')}`
        : ((g.members&&g.members.length)? g.members.map(m=>esc(m.name)).join(' · ') : esc(pn(g.rep,'')));
      // 손님이 보는 인쇄물에는 **홀수(27H)를 넣지 않는다**(Min 2026-08). 화면에서는 그대로 본다.
      const holes = forPrint ? '' : (()=>{ const ov=holesOv(DATESEL,g.seq); const hh=ov||g.holes;
        return hh?` <span class="h">${hh}H${ov?'*':''}</span>`:''; })();
      const hole=(isShotgun(DATESEL)&&g.hole)?` <span class="h">H${g.hole}</span>`:'';   // 샷건 날 = 조별 스타트 홀
      const lunch=g.lunch?` <span class="h">${esc(tx('lunchB',g.lunch))}</span>`:'';   // 식사 시점(9H/18H 뒤 식사) — 손님 표에도(Min 2026-10-25)
      return `<td><b>${esc(g.tag||('#'+g.seq))}</b>${no?`<i>${tx('grpNo',no)}</i>`:''} ${who}`
        +` <span class="p">${(g.members&&g.members.length)||g.pax}${forPrint?'名':tx('person')}</span>`
        +holes+hole+lunch+`</td>`;
    }).join('');
    const ext = slot>STD_N;
    return `<tr${ext?' class="ext"':''}><td class="tee">${esc(tee)}</td>${tds}</tr>`;
  }).join('');
}
// 인쇄물 하단 「昼食後 再スタート」 — 담당자가 지정한 조만(시각·코스·태그·대표·인원). 없으면 빈 문자열.
function pmPrintHTML(){
  const gs=BOARD.map((g,i)=>({g,i})).filter(o=>o.g.pmTee)
    .sort((a,b)=>String(a.g.pmTee).localeCompare(String(b.g.pmTee))||String(a.g.pmCourse||'').localeCompare(String(b.g.pmCourse||'')));
  if(!gs.length) return '';
  return `<div class="pm"><h3>${esc(tx('pvPm'))}</h3><table class="pmt"><tbody>${gs.map(({g,i})=>{
    const no=gnoOf(i);
    return `<tr><td class="tee">${esc(g.pmTee)}</td><td class="pc">${esc(courseL(g.pmCourse||''))}</td>`
      +`<td><b>${esc(g.tag||('#'+g.seq))}</b>${no?`<i>${tx('grpNo',no)}</i>`:''} ${esc(pn(g.rep,''))}${tx('teamOf')} <span class="p">${(g.members&&g.members.length)||g.pax}名</span></td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function headHTML(){
  return `<tr><th class="th-tee">${esc(tx('thTee'))}</th>${COURSES.map(c=>
    `<th class="c-${c.code}">${esc(courseL(c.code))} ${esc(tx('startHd'))}<span class="rt">${esc(rotLabel(c.code,27))}</span></th>`).join('')}</tr>`;
}
function printBoard(){
  if(!DATESEL) return;
  const w=window.open('','_blank','width=1000,height=980'); if(!w){ toast(tx('popupBlocked'),'err'); return; }
  const html=`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>${esc(tx('pvTitle'))}_${DATESEL}</title>
<style>${window.__SO_JP_FONT||''}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Yu Gothic','Meiryo','Malgun Gothic',sans-serif;color:#111;background:#eef0f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;display:flex;gap:12px;align-items:center;background:#3b4a2f;color:#fff;padding:9px 14px;z-index:5}
  .bar h1{font-size:14px}.bar button{background:#fff;color:#3b4a2f;border:0;border-radius:5px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
  .bar .x{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
  /* A3 세로 297×420mm — 인쇄영역(여백 8mm)에 맞춰 403mm */
  .page{width:281mm;min-height:403mm;background:#fff;margin:8mm auto;padding:8mm 8mm 6mm;display:flex;flex-direction:column;--fs:1}
  .hd{display:flex;align-items:flex-end;gap:6mm;border-bottom:1.2mm solid #111;padding-bottom:2.5mm;margin-bottom:3mm}
  h2{font-size:30pt;font-weight:800;letter-spacing:.5pt}
  .dt{font-size:23pt;font-weight:800}
  .sub{margin-left:auto;font-size:13pt;font-weight:700;color:#111;text-align:right;line-height:1.35}
  table{width:100%;border-collapse:collapse;table-layout:fixed;flex:1 1 auto}
  th,td{border:.5mm solid #000;padding:calc(2.4mm * var(--fs)) 2.2mm;vertical-align:middle}
  th{background:#d7dcd0;color:#000;font-size:calc(17pt * var(--fs));font-weight:800;line-height:1.2}
  th .rt{display:block;font-size:calc(11pt * var(--fs));font-weight:700;color:#111}
  th.th-tee{width:28mm}
  /* 줄 따라가기 쉽게 얼룩무늬 — 뒤의 .e/.ext 규칙이 덮어쓴다 */
  tbody tr:nth-child(even) td{background:#f0f0f0}
  td{font-size:calc(18pt * var(--fs));font-weight:700;color:#000;white-space:nowrap;overflow:hidden}
  td.tee{text-align:center;font-weight:800;font-family:Consolas,monospace;background:#e6e6e6;font-size:calc(21pt * var(--fs))}
  td b{font-family:Consolas,'SZJpMono',monospace;font-weight:800;font-size:calc(17pt * var(--fs))}
  td i{font-style:normal;font-size:calc(12.5pt * var(--fs));font-weight:800;color:#000}
  .p{color:#000;font-weight:800;font-size:calc(15pt * var(--fs))}
  .h{color:#000;font-weight:800;font-size:calc(14pt * var(--fs))}
  td.e{background:#fafafa}
  tr.ext td{background:#e9e9e9}
  tr.ext td.tee{background:#dcdcdc}
  /* 점심 후 재스타트(담당자 지정 조만) — 본표 아래 작은 표 */
  .pm{margin-top:4mm;flex:0 0 auto}
  .pm h3{font-size:16pt;font-weight:800;margin:0 0 1.5mm}
  table.pmt{flex:0 0 auto;table-layout:auto;width:auto;min-width:60%}
  table.pmt td{font-size:calc(15pt * var(--fs))}
  table.pmt td.tee{width:28mm}
  table.pmt td.pc{width:30mm;font-weight:800}
  @media print{ @page{size:A3 portrait;margin:8mm} body{background:#fff} .bar{display:none}
    .page{margin:0;width:auto;min-height:auto;padding:0} }
</style></head><body>
  <div class="bar"><h1>${esc(tx('pvTitle'))} ${esc(DATESEL)} — A3</h1><div style="flex:1"></div>
    <button onclick="window.print()">🖨 ${esc(tx('pvPrint'))}</button>
    <button class="x" onclick="window.close()">✕ ${esc(tx('pvClose'))}</button></div>
  <div class="page" id="pg">
    <div class="hd"><h2>${esc(tx('pvTitle'))}</h2>
      <div class="dt">${esc(DATESEL)} ${esc(SZCore.mdWd(DATESEL,lang()))}</div>
      <div class="sub">${esc(tx('totalG',BOARD.length))}${isShotgun(DATESEL)?`<br>${esc(tx('pvSg',shotgunTime(DATESEL)))}`:''}</div></div>
    <table><thead>${headHTML()}</thead><tbody>${boardRowsHTML(true)}</tbody></table>
    ${pmPrintHTML()}
    <!-- 손님이 보는 인쇄물 — 홀수·코스 로테이션 설명·라운딩 예외 목록은 넣지 않는다(Min 2026-08).
         그 정보는 담당자 화면(코스 배정표·라운딩 예외 패널)에서 그대로 본다. -->
  </div>
<script>
  // A3 세로 인쇄영역을 넘으면 글자배율을 이분탐색으로 낮춰 한 장에 맞춘다
  (function(){
    function fit(){
      var pg=document.getElementById('pg'); if(!pg) return;
      var limit=403/25.4*96;               // 403mm → px
      pg.style.setProperty('--fs',1);
      if(pg.scrollHeight<=limit) return;
      var lo=0.62, hi=1;                 // 하한 — 이보다 작으면 못 읽는다(넘치면 2장으로)
      for(var i=0;i<18;i++){ var mid=(lo+hi)/2; pg.style.setProperty('--fs',mid);
        if(pg.scrollHeight<=limit) lo=mid; else hi=mid; }
      pg.style.setProperty('--fs',lo<0.62?0.62:lo);
    }
    window.addEventListener('load',fit); window.addEventListener('beforeprint',fit);
  })();
<\/script>
</body></html>`;
  try{ w.document.open(); w.document.write(html); w.document.close(); }catch(_){}
}

// ESC = 선택 취소(옮기다 마음이 바뀌면)
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && (SELG!=null||PEND||PICK||MULTI)){ SELG=null; PEND=null; PICK=null; MULTI=false; MSEL=new Set(); render(); } });
$('#btn-connect').addEventListener('click',connect);
window.onSaizenLangChange=function(){ try{ applyStatic(); }catch(e){} try{ if(supa){ renderUI(); $('#ym-label').textContent=YM||''; renderDateChips(); render(); } }catch(e){} };
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value) connect();
</script>
