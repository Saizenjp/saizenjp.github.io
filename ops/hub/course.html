<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 코스 배정표</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── 공통 chrome (전 ops 페이지 공유 정본) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.xs{font-size:11.5px;padding:4px 10px}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 ── */
  main{padding:16px 20px 80px;max-width:1280px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .daychip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer}
  .daychip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px}

  /* 코스 배정표 = 세로 티오프 × 가로 3코스 */
  .cbwrap{overflow-x:auto}
  table.cb{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
  table.cb th{background:var(--surface2);border:1px solid var(--border2);padding:7px 8px;font-size:12px;color:var(--text2)}
  table.cb th.chd{font-size:13px;font-weight:800;color:#fff}
  th.chd.aso{background:#5a7a52;border-color:#4b6a45}
  th.chd.sobo{background:#2f6f8f;border-color:#28607c}
  th.chd.kuju{background:#9a7322;border-color:#84621d}
  table.cb td{border:1px solid var(--border);padding:0;height:36px;vertical-align:middle}
  table.cb td.tee{background:var(--surface2);font-family:var(--mono);font-weight:800;text-align:center;width:74px;white-space:nowrap}
  .cell{display:block;width:100%;height:100%;min-height:34px;padding:4px 7px;cursor:pointer;text-align:left;background:transparent;border:0;font-family:inherit;font-size:12.5px}
  .cell:hover{background:var(--accentSoft)}
  .cell.has{background:var(--surface)}
  .cell.sel{outline:2px solid var(--accent2);outline-offset:-2px;background:#fdf6e6}
  .cell .g-tag{font-family:var(--mono);font-weight:800;color:var(--accent)}
  .cell .g-rep{color:var(--text);margin-left:5px}
  .cell .g-pax{color:var(--text2);margin-left:5px;font-size:11.5px}
  .cell .g-holes{color:var(--muted);font-size:11px;margin-left:5px}
  .cell .gno{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--text2);border-radius:99px;padding:0 5px;margin-left:4px}
  table.cb th.chd small{display:block;font-size:10px;font-weight:600;opacity:.85}
  .cell .g-x{float:right;color:var(--muted);font-weight:800;padding:0 3px}
  .cell .g-x:hover{color:var(--err)}
  .lateb{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#9a7322;border-radius:99px;padding:0 6px;margin-left:5px}
  /* 미배정 팀 */
  .un-list{display:flex;flex-wrap:wrap;gap:7px}
  .un{border:1px solid var(--border2);border-radius:9px;padding:6px 10px;font-size:12.5px;background:var(--surface);cursor:pointer}
  .un:hover{border-color:var(--accent);background:var(--accentSoft)}
  .un b{font-family:var(--mono);color:var(--accent)}
  .un small{color:var(--text2);margin-left:5px}
  .legend{font-size:11.5px;color:var(--muted);margin-top:7px}
  .cell{position:relative}
  .cell .grip{display:inline-block;color:var(--muted);font-weight:800;cursor:grab;margin-right:5px;user-select:none}
  .cell .grip:active{cursor:grabbing}
  .cell.dragging{opacity:.45}
  .cell.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accentSoft)}
  .un{display:inline-flex;align-items:center;gap:4px}
  .un.off{opacity:.6;border-style:dashed;cursor:default}
  .skipb{font-family:inherit;font-size:11px;font-weight:700;border:1px solid var(--border2);background:var(--surface);
    color:var(--text2);border-radius:99px;padding:1px 8px;margin-left:6px;cursor:pointer}
  .skipb:hover{border-color:var(--err);color:var(--err)}
  .skipb.on{border-color:var(--accent);color:var(--accent)}
  .skipb.on:hover{background:var(--accentSoft)}
  /* 조 편성(사람 배치) — 코스 배정표 안에서 바로 */
  .rlbl{font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:5px;display:flex;align-items:center;gap:8px}
  .rsrch{padding:3px 9px;font-size:12px;max-width:200px}
  .mlist{display:flex;flex-wrap:wrap;gap:6px}
  .mchip{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--border2);background:var(--surface);
    color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer}
  .mchip:hover{border-color:var(--accent);background:var(--accentSoft)}
  .mchip.in{background:var(--accent);border-color:var(--accent);color:#fff}
  .mchip.in:hover{background:var(--err);border-color:var(--err)}
  .mchip.oth{border-style:dashed}
  .mg{font-size:11px;margin-right:3px}
  .mg.m{color:#2f6f8f}.mg.f{color:#b1567a}
  .rcart{padding:3px 9px;font-size:12px;width:110px}
  .chkb{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--err);border-radius:99px;padding:0 6px;margin-left:5px}
  .cartb{display:inline-block;font-size:10.5px;font-weight:700;color:var(--text2);margin-left:5px}
  .dbadge{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--err);border-radius:99px;padding:0 5px;margin-left:5px}
  .dbadge.ok{background:var(--ok)}
  .dbadge.warn{background:var(--err)}
  .dbadge.gold{background:var(--accent2)}
  .daychip.on .dbadge.gold{background:#fff;color:var(--accent2)}
  .daychip.on .dbadge.warn{background:#fff;color:var(--warn)}
  .daychip.on .dbadge{background:#fff;color:var(--err)}
  .daychip.on .dbadge.ok{background:#fff;color:var(--ok)}
  .extrow td{background:#fbf7ef}
  .extb{display:block;font-size:9px;font-weight:800;color:var(--warn)}
  /* 모니터 화면 — 코스 입구에 띄운다(읽기 전용 전체화면) */
  body.tvmode{background:#10160f;color:#fff;overflow:hidden}
  body.tvmode .topbar,body.tvmode .conn,body.tvmode main,body.tvmode #so-totop,body.tvmode .so-footer{display:none!important}
  #tv{position:fixed;inset:0;padding:1.4vh 1.6vw;display:flex;flex-direction:column;overflow:hidden}
  .tv-hd{display:flex;align-items:baseline;gap:2vw;border-bottom:.4vh solid #7f9a5f;padding-bottom:1vh;margin-bottom:1vh}
  .tv-t{font-size:3.4vh;font-weight:800;letter-spacing:.1vw}
  .tv-d{font-size:2.8vh;font-weight:700;color:#cfe0bd}
  .tv-c{margin-left:auto;font-size:3.2vh;font-weight:800;font-family:var(--mono);color:#f4e6bf}
  .tv-c span{font-size:2.2vh;color:#a9d18b;margin-left:1vw}
  .tv-tb{width:100%;border-collapse:collapse;table-layout:fixed}
  .tv-tb th{padding:.9vh .8vw;font-size:2.4vh;font-weight:800;background:#22301c;border:.15vh solid #3c5030;color:#fff}
  .tv-tb th span{display:block;font-size:1.5vh;font-weight:600;color:#a9bd94}
  .tv-tb th:first-child{width:12vw}
  .tv-tb td{padding:.75vh .8vw;font-size:2.5vh;border:.15vh solid #2c3a24;white-space:nowrap;overflow:hidden}
  .tv-tb td.tee{font-family:var(--mono);font-weight:800;text-align:center;background:#1b2417;font-size:2.8vh}
  .tv-tb td b{font-family:var(--mono);color:#f0d99a;font-size:2.2vh}
  .tv-tb td i{font-style:normal;font-size:1.7vh;font-weight:800;color:#9fb98a;margin-left:.4vw}
  .tv-tb td .nm{font-weight:700}
  .tv-tb tr:not(.past):first-of-type td{background:#2b3a22}
  .tv-none{text-align:center;color:#9fb98a;padding:6vh 0}
  /* 조편성이 남은 팀 — 사람이 손대야 하는 목록이라 눈에 띄게 */
  .ckpanel{border-left:4px solid var(--accent2)}
  .warnc{color:var(--accent2)}
  .cklist{display:flex;flex-direction:column;gap:7px}
  .ckrow{border:1.5px solid #e0d3ad;background:#fffdf6;border-radius:11px;padding:10px 13px}
  .ck-hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .ck-tag{font-family:var(--mono);font-weight:800;color:var(--accent);font-size:13.5px}
  .ck-rep{font-weight:800;font-size:14px}
  .ck-pax{font-size:12.5px;color:var(--text2);font-weight:700}
  .ck-st{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--accent2)}
  .ck-hd .ckok{margin-left:8px}
  .ck-gs{display:flex;flex-direction:column;gap:5px;margin-top:7px}
  .ck-g{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:3px 0;border-top:1px dashed #e6dcc2}
  .ck-g:first-child{border-top:none}
  .ck-nm{display:flex;flex-wrap:wrap;gap:4px}
  .ckm{font-family:inherit;font-size:14px;font-weight:800;color:var(--text);background:#fff;
    border:1.5px solid var(--border2);border-radius:8px;padding:5px 12px;cursor:pointer;line-height:1.2}
  .ckm:hover{border-color:var(--accent);background:var(--accentSoft);color:var(--accentDeep)}
  .ckm.pick{background:var(--accent2);border-color:var(--accent2);color:#fff;box-shadow:0 0 0 3px rgba(154,115,34,.25)}
  /* 집어든 상태에서는 옮길 수 있는 곳이 어디인지 또렷하게 */
  .picking .ckg{border-color:var(--accent);color:var(--accent);background:var(--accentSoft)}
  .picking .ckm:not(.pick){border-style:dashed}
  .ck-none{color:var(--muted);font-style:normal}
  .ckg{font-family:inherit;font-size:13px;font-weight:800;border:1.5px solid var(--border2);background:var(--surface);
    color:var(--text2);border-radius:8px;padding:5px 12px;cursor:pointer;min-width:118px;text-align:left}
  .ckg:hover{border-color:var(--accent2);color:var(--accent2);background:#fff}
  .ckg.on{border-color:var(--accent2);background:#fdf6e6;color:var(--text)}
  .ckg b{font-family:var(--mono);margin-left:5px;color:var(--text)}
  .ckok{font-family:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--accent);background:var(--accent);
    color:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
  .ckok:hover{background:var(--accentDeep)}
</style>

<script>
const $=s=>document.querySelector(s);
// 코스 3개 = 같은 시간대에 동시 출발(현장 게시판과 같은 배열 순서)
const COURSES=[ {code:'aso',ko:'아소',ja:'阿蘇',en:'Aso'}, {code:'sobo',ko:'소보',ja:'祖母',en:'Sobo'}, {code:'kuju',ko:'쿠주',ja:'久住',en:'Kuju'} ];
const CMAP={}; COURSES.forEach(c=>CMAP[c.code]=c);
// 27홀 = 9홀 3개(아소·소보·쿠주)를 이어서 돈다. 이 표는 **출발 코스·출발 시각**만 정한다.
//  아소 출발 → 소보 → 쿠주 / 소보 출발 → 쿠주 → 아소 / 쿠주 출발 → 아소 → 소보.
//  그래서 한 사람은 하루에 한 번만(출발 자리 하나만) 표에 나온다.
const ROT={ aso:['aso','sobo','kuju'], sobo:['sobo','kuju','aso'], kuju:['kuju','aso','sobo'] };
function rotOf(start, holes){
  const r=ROT[start]||ROT.aso;
  const n = holes>=27 ? 3 : holes>=18 ? 2 : 1;   // 27H=3바퀴 · 18H=2바퀴 · 9H=1바퀴
  return r.slice(0,n);
}
function rotLabel(start, holes){ return rotOf(start,holes).map(courseL).join('→'); }

const L={
  ja:{ step:'コース割当表', connHint:'接続情報はこのブラウザにのみ保存されます。',
    daySel:'ラウンド日', dayNote:'※ 商品名からラウンド日を自動抽出(入国ICN・滞在中・帰国PUS)。ホール数も自動(平日27H=18+9・週末/祝日18H・帰国PUS 9H)。',
    boardH:'コース割当(組単位)', unH:'スタート枠のないチーム(未割当)',
    unWhy:'その日ラウンドするのに<b>まだスタート枠がない</b>チームです。通常は自動で埋まるので0になります — 残るのは<b>除外したチーム</b>か<b>枠が足りない</b>ときだけ。チームを押すと空き枠に入ります。',
    auto:'🪄 자동 배정', clear:'🧹 全消去', save:'💾 保存', print:'🖨 プレビュー',
    noDay:'ラウンド日を選択してください。', noData:'この日にラウンドはありません。',
    allSet:'全チーム割当済', pickCell:'空きマスを押すと移動します', moveDone:'移動しました', full:'そのマスは埋まっています',
    savedN:n=>`${n}組を保存しました`, saveFail:'保存失敗: ', loadFail:'読み込み失敗',
    noSlot:'ティ枠が足りません — 手動で調整してください', autoDone:n=>`${n}組を割り当てました`,
    late:'遅め', lateT:'久住ヒルズ宿泊 — 16:30〜17:00終了→シャワー→18時食事に合わせ遅い組',
    grp:'組', person:'名', teamUnit:'チーム', unassignedN:n=>`未割当 ${n}チーム`,
    excl:'除外', incl:'↩ 戻す', exclH:'除外したチーム(この日はラウンドなし)', exclN:n=>`${n}チーム`,
    exclDone:'この日から除外しました', exclAuto:'組をすべて外したので、このチームは本日「除外」にしました(↩ で戻せます)', inclDone:'戻しました', exclNone:'除外なし',
    dragHint:'≡ をつかんでドラッグ — 空きマスへ移動、埋まったマスへ落とすと その位置に割り込み(以下は1つずつ下へ)',
    noShift:'下に空きがありません — 入れ替えました',
    autoFirst:'この日はまだ割当がなかったので自動で割り当てて保存しました',
    autoMonth:'📅 今月まとめて自動割当', monthRun:'今月分を割り当て中…', monthDone:(d,g)=>`${d}日分 ${g}組を自動割当しました`,
    monthNone:'割り当てるチームがありません', extRow:'延長', extT:'6:50〜8:42(コース17組)を超えた分 — チーム数が多い日は7分間隔でそのまま延長します',
    dcMiss:n=>`枠${n}`, dcPend:n=>`確認${n}`, dcDone:'✓', dcDoneT:'この日は確定済み', dcPendT:'組編成が未確定のチーム数(5名以上)', dcMissT:'スタート枠が足りないチーム数',

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k,...a){ const d=L[lang()]||L.ja; let v=d[k]; if(v===undefined) v=L.ja[k]; if(v===undefined) return k; return (typeof v==='function')?v(...a):v; }
function courseL(code){ const c=CMAP[code]; if(!c) return code||''; return lang()==='ja'?c.ja:lang()==='en'?c.en:c.ko; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2500);}
function setConn(t,c){const e=$('#conn-state');if(e){e.textContent=t;e.className='pill'+(c?' '+c:'');}}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}

}

let supa=null, YM=null, DATESEL=null;

let SKIP=new Set();  // 그날 라운딩 제외한 팀(event_seq)

let ROSTER={};       // event_seq → [{id,name,eng,gender}]  그날 라운딩 인원
let RQ='';           // 조원 검색어

// 코스 입구 모니터 화면(?tv=1) — 읽기 전용 전체화면. 자동 배정·저장은 하지 않는다.
const TVQ=new URLSearchParams(location.search);
const TV=TVQ.get('tv')==='1';
let SAVET=null;      // 자동 저장 디바운스
// 되돌리기 — 바꾸기 전 상태를 쌓아 두고 [↩ 되돌리기]로 직전 상태로 복구한다.
//  (자동 저장이라 잘못 눌렀을 때 돌아갈 길이 없으면 안 된다)
let UNDO=[];
function snap(){
  UNDO.push({ board:JSON.parse(JSON.stringify(BOARD)), skip:[...SKIP], slots:SLOTS.slice() });
  if(UNDO.length>30) UNDO.shift();
  const b=$('#btn-undo'); if(b) b.disabled=false;
}
async function undo(){
  const st=UNDO.pop();
  if(!st){ toast(tx('undoNone'),'warn'); return; }
  BOARD=st.board; SKIP=new Set(st.skip); SLOTS=st.slots; SELG=null;
  SKIPM[DATESEL]=new Set(st.skip);
  // 제외 상태도 DB와 맞춘다
  try{
    const {data}=await supa.from('golf_skips').select('event_seq').eq('play_date',DATESEL);
    const cur=new Set((data||[]).map(x=>String(x.event_seq)));
    for(const seq of cur) if(!SKIP.has(seq)) await supa.from('golf_skips').delete().eq('play_date',DATESEL).eq('event_seq',seq);
    for(const seq of SKIP) if(!cur.has(seq)) await supa.from('golf_skips').insert({play_date:DATESEL, event_seq:Number(seq)});
  }catch(e){}
  render(); await save(true);
  const b=$('#btn-undo'); if(b) b.disabled=!UNDO.length;
  toast(tx('undoDone'),'ok');
}
function touch(){ clearTimeout(SAVET); SAVET=setTimeout(()=>{ save(true); },900); }
let MONTHG={};       // 날짜 → [{event_seq,course_code,slot_no,capacity}]  그 달 저장된 조

// 티오프 자리 — 기본은 6:50~8:42(7분 간격 17조). 팀이 많은 날은 필요한 만큼 뒤로 이어 붙인다.
//  (코스당 17조 × 3코스 = 51조. 성수기엔 67팀이 들어와 자리가 모자라므로 늘려야 전원 배정된다.)
const STD_SLOTS=(window.SZCore&&SZCore.teeSlots)?SZCore.teeSlots():[];
const STD_N=STD_SLOTS.length||17;
function makeSlots(n){
  const out=[]; let t=6*60+50;
  for(let i=0;i<Math.max(1,n);i++){ out.push(String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')); t+=7; }
  return out;
}
let SLOTS=STD_SLOTS.slice();
function ensureSlots(n){ if(n>SLOTS.length) SLOTS=makeSlots(n); }
// ⚠ SZCore.fmtDate 는 Date 전용(문자열을 주면 '')이라 DB의 date 문자열엔 이걸 쓴다.
function dstr(d){ if(!d) return ''; if(d instanceof Date) return SZCore.fmtDate(d); return String(d).slice(0,10); }
function normGender(g){ g=String(g||'').trim(); if(/여|女/.test(g)||/^f/i.test(g))return '女'; if(/남|男/.test(g)||/^m/i.test(g))return '男'; return ''; }
function titleCase(s){ return String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()); }

function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthBounds(ym){const [y,m]=ym.split('-').map(Number);const start=`${y}-${String(m).padStart(2,'0')}-01`;const endD=new Date(y,m,0).getDate();const end=`${y}-${String(m).padStart(2,'0')}-${String(endD).padStart(2,'0')}`;return {start,end};}

async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.textContent=tx('connecting');
  try{

async function pagedIn(table, cols, key, vals){
  const out=[]; const uniq=[...new Set(vals)];
  for(let i=0;i<uniq.length;i+=80){ const chunk=uniq.slice(i,i+80); let from=0;
    for(;;){ const {data,error}=await supa.from(table).select(cols).in(key,chunk).range(from,from+999); if(error)throw error; out.push(...(data||[])); if(!data||data.length<1000)break; from+=1000; } }
  return out;
}

async function load(){
  if(!supa)return;
  $('#ym-label').textContent=YM; $('#stat').textContent='…';
  try{
    const {start,end}=monthBounds(YM);
    const bs=[]; { let from=0;
      for(;;){ const {data,error}=await supa.from('bookings').select('event_seq,dep_date,arr_date,rep_name,origin')
          .lte('dep_date',end).gt('arr_date',start).order('event_seq').range(from,from+999);
        if(error)throw error; bs.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; } }
    const seqs=(bs||[]).map(b=>b.event_seq);
    const gs = seqs.length? await pagedIn('guests','event_seq,accom,group_code,team_tag','event_seq',seqs):[];
    const gmap={}; gs.forEach(g=>gmap[g.event_seq]=g);
    // 인원 = 명단 실제 행수(예약 pax보다 우선 — 방배정·정산과 같은 기준)
    const gms = seqs.length? await pagedIn('guest_members','id,event_seq,seq_in_team,name_kr,name_en','event_seq',seqs):[];
    const cnt={}; gms.forEach(m=>{ cnt[m.event_seq]=(cnt[m.event_seq]||0)+1; });
    // 대표 출발지(귀국 부산편 판정) + 성별(이름 매칭)
    const pxs = seqs.length? await pagedIn('passengers','event_seq,name_kr,gender,origin,dep_flight','event_seq',seqs):[];
    const oriMap={}; pxs.forEach(p=>{ if(oriMap[p.event_seq]==null) oriMap[p.event_seq]=SZCore.isPus(p.origin,p.dep_flight); });
    const genMap={}; pxs.forEach(p=>{ const k=p.event_seq+'|'+String(p.name_kr||'').trim(); if(!genMap[k]) genMap[k]=normGender(p.gender); });
    ROSTER={};
    gms.slice().sort((a,b)=>(a.seq_in_team||0)-(b.seq_in_team||0)).forEach(m=>{
      const nm=String(m.name_kr||'').trim();
      (ROSTER[m.event_seq]=ROSTER[m.event_seq]||[]).push({ id:m.id, seq:m.event_seq, name:nm||(m.name_en||'-'),
        eng:titleCase(m.name_en), gender:genMap[m.event_seq+'|'+nm]||'' });
    });
    TEAMS=(bs||[]).map(b=>{ const g=gmap[b.event_seq]||{};
      return { seq:b.event_seq, dep:dstr(b.dep_date), arr:dstr(b.arr_date), accom:g.accom||'',
        tag:(SZCore.tagStripSeq?SZCore.tagStripSeq(g.team_tag||g.group_code||''):(g.team_tag||g.group_code||'')),
        rep:b.rep_name||'', isPus: oriMap[b.event_seq]!=null?oriMap[b.event_seq]:SZCore.isPus(b.origin,''),
        pax: cnt[b.event_seq]||0 };
    }).filter(t=>t.pax>0);
    _todCache={};
    await loadMonthState();
    const ax=golfDates();
    if(DATESEL && !ax.includes(DATESEL)) DATESEL=null;
    if(!DATESEL && ax.length){
      const today=SZCore.fmtDate(new Date());
      DATESEL = ax.includes(today) ? today : (ax.find(d=>d>=today) || ax[0]);
    }
    renderDateChips();
    $('#stat').textContent=`${TEAMS.length}${tx('teamUnit')}`;
    if(DATESEL) await loadBoard(DATESEL); else render();
    // 날짜를 열지 않아도 그 달 전체가 배정돼 있게 — 부족한 날이 있으면 한 번 돌린다.
    if(!TV && !MONTHRUN.has(YM) && golfDates().some(d=>missOn(d)>0)){
      MONTHRUN.add(YM);
      await autoAssignMonth();
    }
  }catch(e){ toast(tx('loadFail')+': '+e.message,'err'); $('#stat').textContent=''; }
}

// 그 팀이 그날 라운딩하는가 + 홀수 — 규칙은 SZCore.golfRows 단일 진실원
function rowFor(t,date){ return SZCore.golfRows({dep:t.dep,arr:t.arr,accom:t.accom}, t.isPus).find(r=>r.date===date)||null; }
function holesOn(t,date){ const r=rowFor(t,date); if(!r) return 0;
  // 평일 체류일은 18H + 9H 서비스 = 27H
  return /\+9H/.test(r.note||'') ? 27 : r.holes; }
function golfDates(){ const s=new Set();
  TEAMS.forEach(t=>SZCore.golfRows({dep:t.dep,arr:t.arr,accom:t.accom},t.isPus).forEach(r=>{ if(r.date.slice(0,7)===YM) s.add(r.date); }));
  return [...s].sort(); }
let _todCache={};
function teamsOnDate(date){
  if(_todCache[date]) return _todCache[date];
  return (_todCache[date]=TEAMS.filter(t=>!!rowFor(t,date)));
}
// 그 팀이 그날 몇 번째 라운딩인지(코스 로테이션 기준)
function dayIdxOf(t,date){ const rs=SZCore.golfRows({dep:t.dep,arr:t.arr,accom:t.accom},t.isPus); return Math.max(0, rs.findIndex(r=>r.date===date)); }
function isLate(t){ return String(t.accom||'').indexOf('쿠주')>=0; }

// 그 달의 저장된 조·제외를 한 번에 읽어 날짜 칩 배지(미배정 N)를 만든다.
async function loadMonthState(){
  MONTHG={}; SKIPM={};
  const {start,end}=monthBounds(YM);
  try{
    let from=0;
    for(;;){
      const {data,error}=await supa.from('golf_groups').select('play_date,event_seq,course_code,slot_no,capacity,assign_source')
        .gte('play_date',start).lte('play_date',end).order('play_date').range(from,from+999);
      if(error) throw error;
      (data||[]).forEach(g=>{ const d=dstr(g.play_date); (MONTHG[d]=MONTHG[d]||[]).push(g); });
      if(!data||data.length<1000) break; from+=1000;
    }
  }catch(e){}
  try{
    const {data}=await supa.from('golf_skips').select('play_date,event_seq').gte('play_date',start).lte('play_date',end);
    (data||[]).forEach(x=>{ const d=dstr(x.play_date); (SKIPM[d]=SKIPM[d]||new Set()).add(String(x.event_seq)); });
  }catch(e){}
}
function skipOn(date,seq){ const s=SKIPM[date]; return !!(s&&s.has(String(seq))); }
// 그 날짜에 아직 출발 자리가 없는 팀 — 날짜 칩 배지와 화면 목록이 **같은 함수**를 쓴다.
//  (예전엔 칩은 MONTHG·SKIPM, 목록은 BOARD·SKIP 을 봐서 「✓ 인데 미배정이 있다」가 나왔다)
function unassignedTeams(date){
  // 선택한 날짜는 화면(BOARD)이 정답이지만, 아직 로드 전이라 비어 있으면 DB 현황을 쓴다
  //  (그렇지 않으면 「자리66」처럼 로드 직전 상태가 칩에 그대로 찍힌다)
  const cur = (DATESEL===date) && (BOARD.length>0 || !(MONTHG[date]||[]).length);
  const rows = cur ? BOARD.map(g=>({event_seq:g.seq, capacity:g.pax})) : (MONTHG[date]||[]);
  const skip = cur ? SKIP : (SKIPM[date]||new Set());
  const placed={}; rows.forEach(g=>{ placed[g.event_seq]=(placed[g.event_seq]||0)+(g.capacity||0); });
  return teamsOnDate(date).filter(t=>!skip.has(String(t.seq)) && (placed[t.seq]||0)<t.pax);
}
function missOn(date){ return unassignedTeams(date).length; }
// 그 날짜에 **조편성이 미확정인 팀 수** — 배정은 자동으로 끝나므로 현장에 남은 일은 이것뿐이다.
//  (5명 이상 팀은 사람이 「✓ 이대로 확정」을 눌러야 끝난다)
function pendingTeams(date){
  const cur=(DATESEL===date) && (BOARD.length>0 || !(MONTHG[date]||[]).length);
  const rows = cur ? BOARD.map(g=>({event_seq:g.seq, assign_source:g.src})) : (MONTHG[date]||[]);
  const by={}; rows.forEach(r=>{ (by[r.event_seq]=by[r.event_seq]||[]).push(r); });
  return Object.keys(by).filter(seq=>teamPax(seq)>=5 && by[seq].some(r=>(r.assign_source||'auto')!=='manual'));
}

function renderDateChips(){
  const box=$('#daychips'); if(!box)return;
  const ax=golfDates();
  box.innerHTML=ax.map(d=>{
    const any=teamsOnDate(d).length; if(!any) return '';
    const pend=pendingTeams(d).length, miss=missOn(d);
    const b1 = (!pend&&!miss)? `<span class="dbadge ok" title="${esc(tx('dcDoneT'))}">${tx('dcDone')}</span>` : '';
    const b2 = pend? `<span class="dbadge gold" title="${esc(tx('dcPendT'))}">${tx('dcPend',pend)}</span>` : '';
    const b3 = miss? `<span class="dbadge warn" title="${esc(tx('dcMissT'))}">${tx('dcMiss',miss)}</span>` : '';
    return `<button type="button" class="daychip${DATESEL===d?' on':''}" data-d="${d}">${esc(SZCore.mdWd(d,lang()))}${b1}${b2}${b3}</button>`;
  }).join('')
    || `<span class="cnt" style="color:var(--muted)">${tx('noData')}</span>`;
  box.querySelectorAll('.daychip').forEach(b=>b.addEventListener('click',async()=>{ DATESEL=b.getAttribute('data-d'); SELG=null; renderDateChips(); await loadBoard(DATESEL); }));
}

let FILLED=false;
async function loadBoard(date, skipAuto){
  BOARD=[]; DBIDS=[]; SELG=null; SKIP=new Set(); DRAG=null; SLOTS=STD_SLOTS.slice(); FILLED=false;
  try{
    const {data:sk}=await supa.from('golf_skips').select('event_seq').eq('play_date',date);
    (sk||[]).forEach(x=>SKIP.add(String(x.event_seq)));
  }catch(e){ /* 표가 없으면 제외 없음으로 */ }
  try{
    const {data:grps,error}=await supa.from('golf_groups')
      .select('id,event_seq,course_code,tee_time,slot_no,label,capacity,cart_no,note,assign_source')
      .eq('play_date',date).order('slot_no',{nullsFirst:false});
    if(error) throw error;
    const teams=teamsOnDate(date);
    const ghost=[];
    (grps||[]).forEach(g=>{
      const t=teams.find(x=>String(x.seq)===String(g.event_seq));
      // 예약이 지워졌거나 그날 라운딩 팀이 아니면 유령 조 → 화면에 올리지 않고 DB에서도 정리한다
      if(!t){ ghost.push(g.id); return; }
      DBIDS.push(g.id);
      BOARD.push({ id:g.id, seq:g.event_seq, course:g.course_code||'', slot:g.slot_no||null,
        tee:g.tee_time||(g.slot_no?SLOTS[g.slot_no-1]:''), pax:g.capacity||0,
        tag:(t?t.tag:'')||g.label||'', rep:t?t.rep:'', holes:t?holesOn(t,date):0,
        late:t?isLate(t):false, cart:g.cart_no||'', note:g.note||'', src:g.assign_source||'auto', members:[] });
    });
    if(ghost.length && !TV){
      try{ await supa.from('golf_group_members').delete().in('group_id',ghost);
           await supa.from('golf_groups').delete().in('id',ghost); }catch(e){}
    }
    // 조원(사람 배치) — 조편성을 이 화면에서 같이 한다
    const gids=BOARD.map(g=>g.id).filter(Boolean);
    if(gids.length){
      const gm=await pagedIn('golf_group_members','group_id,member_id,event_seq,seq','group_id',gids);
      const byG={}; (gm||[]).forEach(x=>{ (byG[x.group_id]=byG[x.group_id]||[]).push(x); });
      BOARD.forEach(g=>{
        g.members=(byG[g.id]||[]).sort((a,b)=>(a.seq||0)-(b.seq||0)).map(x=>{
          const r=(ROSTER[x.event_seq]||[]).find(m=>m.id===x.member_id);
          return r||{ id:x.member_id, seq:x.event_seq, name:'?', eng:'', gender:'' };
        });
      });
    }
    // 조원이 비어 있는 조는 기본값(팀 안 명단 순서)으로 채운다 —
    //  사람이 확인(manual)한 조는 손대지 않는다.
    const need=[...new Set(BOARD.filter(g=>g.src!=='manual').map(g=>g.seq))]
      .filter(seq=>{
        const gs=BOARD.filter(g=>String(g.seq)===String(seq));
        const have=gs.reduce((n,g)=>n+((g.members||[]).length),0);
        return have < Math.min(teamPax(seq), gs.reduce((n,g)=>n+(g.pax||0),0));
      });
    if(need.length){ need.forEach(fillTeamMembers); if(!TV) FILLED=true; }
  }catch(e){ /* 없으면 빈 표 */ }
  // 저장된 조가 기본 17자리를 넘으면 표를 그만큼 늘려야 보인다(연장 줄)
  ensureSlots(BOARD.reduce((m,g)=>Math.max(m,g.slot||0),0));
  render();
  // 배정이 모자란 날이면 빈 자리에만 자동으로 채운다(기존 조는 그대로 — 수기 조정 보호)
  if(!TV && !skipAuto && missOn(date)>0){
    const {rows,slots}=planDate(date, BOARD.map(g=>({event_seq:g.seq,course_code:g.course,slot_no:g.slot,capacity:g.pax})), 0);
    if(rows.length){
      SLOTS=slots;
      rows.forEach(r=>BOARD.push({ seq:r.seq, course:r.course, slot:r.slot, tee:r.tee, pax:r.pax,
        tag:r.tag, rep:r.rep, holes:r.holes, late:r.late, cart:'', note:'', src:'auto', members:[] }));
      [...new Set(rows.map(r=>r.seq))].forEach(fillTeamMembers);
      render();
      await save();
    }
  } else if(FILLED && !TV){ await save(true); }
}

function isSkip(seq){ return SKIP.has(String(seq)); }
// 2~4명 팀은 그대로 한 조 = 나눌 여지가 없다 → 조원까지 자동으로 채운다.
// 5명 이상은 「누구와 누구를 한 조로」를 사람이 정해야 한다 → 조만 잡아두고 조원은 비워 확인 대기로 둔다.
function teamPax(seq){ const t=TEAMS.find(x=>String(x.seq)===String(seq)); return t?t.pax:0; }
// 조원은 **그 팀 안에서** 명단 순서대로 나눈다(1조=1~4번, 2조=5~8번 …).
//  8명이면 2조, 9~12명이면 3조 — 사람이 따로 정하지 않아도 되게 기본값을 채워 둔다.
//  5명 이상 팀은 이 기본값을 사람이 한 번 「확인」한다(그때 assign_source 가 manual 이 된다).
function fillTeamMembers(seq){
  const gs=BOARD.filter(g=>String(g.seq)===String(seq)).sort((a,b)=>(a.slot||0)-(b.slot||0));
  if(!gs.length) return;
  const roster=(ROSTER[seq]||[]).slice();
  let i=0;
  gs.forEach(g=>{ g.members=roster.slice(i, i+(g.pax||4)); i+=(g.pax||4); });
}
function needsCheck(g){ return teamPax(g.seq)>=5 && g.src!=='manual'; }
// 그날 라운딩하지 않는 팀 — 규칙(상품명)으로는 라운딩일이지만 실제로는 안 나가는 경우.
//  제외하면 자동 배정에서 빠지고, 이미 잡힌 조도 표에서 내린다(성수기 티오프 자리 확보).
// 제외로 넘기기(조를 다 뺐을 때 자동 호출)
async function markSkip(seq){
  if(!supa||!DATESEL||isSkip(seq)) return;
  SKIP.add(String(seq)); (SKIPM[DATESEL]=SKIPM[DATESEL]||new Set()).add(String(seq));
  renderDateChips();
  try{
    const by=(window.__so_getUser&&__so_getUser())||null;
    await supa.from('golf_skips').insert({play_date:DATESEL, event_seq:seq, created_by:by});
    toast(tx('exclAuto'),'ok');
  }catch(e){}
}
async function toggleSkip(seq){
  if(!supa||!DATESEL) return;
  snap();
  const on=isSkip(seq);
  try{
    if(on){
      const {error}=await supa.from('golf_skips').delete().eq('play_date',DATESEL).eq('event_seq',seq);
      if(error) throw error;
      SKIP.delete(String(seq));
      if(SKIPM[DATESEL]) SKIPM[DATESEL].delete(String(seq));
      toast(tx('inclDone'),'ok');
    }else{
      const by=(window.__so_getUser&&__so_getUser())||null;
      const {error}=await supa.from('golf_skips').insert({play_date:DATESEL, event_seq:seq, created_by:by});
      if(error) throw error;
      SKIP.add(String(seq));
      (SKIPM[DATESEL]=SKIPM[DATESEL]||new Set()).add(String(seq));
      // 이미 배정된 조가 있으면 함께 내린다(저장 때 DB에서도 삭제된다)
      BOARD=BOARD.filter(g=>String(g.seq)!==String(seq));
      SELG=null; touch(); toast(tx('exclDone'),'ok');
    }
  }catch(e){ toast(tx('saveFail')+e.message,'err'); return; }
  render();
}

// 같은 팀이 두 조 이상이면 몇 조인지 — 같은 이름이 두 번 보이는 혼동을 막는다
function gnoOf(i){
  const g=BOARD[i]; if(!g) return 0;
  const mine=BOARD.map((x,k)=>({x,k})).filter(o=>String(o.x.seq)===String(g.seq))
    .sort((a,b)=>(a.x.slot||0)-(b.x.slot||0));
  if(mine.length<2) return 0;
  return mine.findIndex(o=>o.k===i)+1;
}
function cellKey(course,slot){ return course+'|'+slot; }
function groupAt(course,slot){ return BOARD.findIndex(g=>g.course===course && g.slot===slot); }

function render(){
  const box=$('#board'); if(!box) return;
  const on=!!DATESEL;
  ['#btn-print','#btn-tv','#btn-redo'].forEach(s=>{ const b=$(s); if(b) b.disabled=!on; });
  { const b=$('#btn-undo'); if(b) b.disabled=!(on&&UNDO.length); }
  if(!on){ box.innerHTML=`<div class="panel"><div class="deny">${tx('noDay')}</div></div>`; return; }
  const teams=teamsOnDate(DATESEL);
  if(!teams.length){ box.innerHTML=`<div class="panel"><div class="deny">${tx('noData')}</div></div>`; return; }

  // 미배정 = 그날 라운딩인데 조가 모자란 팀(제외한 팀은 뺀다)
  const placed={}; BOARD.forEach(g=>{ placed[g.seq]=(placed[g.seq]||0)+(g.pax||0); });
  const un=unassignedTeams(DATESEL);
  const skipped=teams.filter(t=>isSkip(t.seq));
  const unHTML = un.length? un.map(t=>{
    const rest=t.pax-(placed[t.seq]||0);
    return `<span class="un" data-seq="${t.seq}"><b>${esc(t.tag||('#'+t.seq))}</b>`
      +`<small>${esc(t.rep||'')} · ${rest}${tx('person')} · ${holesOn(t,DATESEL)}${tx('holesU')}</small>`
      +`${isLate(t)?`<span class="lateb" title="${esc(tx('lateT'))}">${tx('late')}</span>`:''}`
      +`<button type="button" class="skipb" data-skip="${t.seq}">${tx('excl')}</button></span>`;
  }).join('') : `<span class="cnt" style="color:var(--muted)">${tx('allSet')}</span>`;
  // 조편성이 남은 팀 = 5명 이상이라 「누구와 누구를 한 조로」를 사람이 정해야 하는 팀.
  //  조를 흩어 놓으면 무슨 일을 해야 하는지 안 보인다 → 팀으로 묶어 크게 보여준다.
  const chk=BOARD.map((g,i)=>({g,i})).filter(x=>needsCheck(x.g));
  const chkTeams=[...new Set(chk.map(x=>String(x.g.seq)))];
  // 그 팀의 조는 확정 여부와 관계없이 전부 펼쳐 보여준다(비교하며 바로 옮기기 위해)
  const chkBy={}; chkTeams.forEach(seq=>{
    chkBy[seq]=BOARD.map((g,i)=>({g,i})).filter(o=>String(o.g.seq)===seq);
  });
  const chkHTML = chkTeams.length? chkTeams.map(seq=>{
    const list=chkBy[seq].sort((a,b)=>(a.g.slot||0)-(b.g.slot||0));
    const g0=list[0].g;
    const done=BOARD.filter(x=>String(x.seq)===String(seq)).reduce((n,x)=>n+((x.members||[]).length),0);
    return `<div class="ckrow">
      <div class="ck-hd"><span class="ck-tag">${esc(g0.tag||('#'+seq))}</span>
        <span class="ck-rep">${esc(g0.rep||'')}</span>
        <span class="ck-pax">${teamPax(seq)}${tx('person')}</span>
        <span class="ck-st">${tx('memCnt',done,teamPax(seq))}</span>
        <button type="button" class="ckok" data-okseq="${seq}">${tx('chkOk')}</button></div>
      <div class="ck-gs">${list.map(({g,i})=>
        `<div class="ck-g">
           <button type="button" class="ckg${SELG===i?' on':''}" data-goto="${i}">${esc(courseL(g.course))} ${esc(g.tee||'')}<b>${tx('memCnt',(g.members||[]).length,g.pax)}</b></button>
           <span class="ck-nm">${(g.members&&g.members.length)? g.members.map(m=>
             `<button type="button" class="ckm${(PICK&&PICK.mid===String(m.id))?' pick':''}" data-gi="${i}" data-mid="${m.id}">${esc(m.name)}</button>`
           ).join('') : '<i class="ck-none">-</i>'}</span>
         </div>`).join('')}</div>
    </div>`;
  }).join('') : `<span class="cnt" style="color:var(--muted)">${tx('chkNone')}</span>`;
  const skHTML = skipped.length? skipped.map(t=>
    `<span class="un off"><b>${esc(t.tag||('#'+t.seq))}</b><small>${esc(t.rep||'')} · ${t.pax}${tx('person')}</small>`
    +`<button type="button" class="skipb on" data-skip="${t.seq}">${tx('incl')}</button></span>`).join('')
    : `<span class="cnt" style="color:var(--muted)">${tx('exclNone')}</span>`;

  const rows=SLOTS.map((tee,i)=>{
    const slot=i+1;
    const tds=COURSES.map(c=>{
      const gi=groupAt(c.code,slot);
      if(gi<0) return `<td><div class="cell" data-c="${c.code}" data-s="${slot}"></div></td>`;
      const g=BOARD[gi];
      return `<td><div class="cell has${SELG===gi?' sel':''}" data-c="${c.code}" data-s="${slot}" data-i="${gi}" draggable="true">`
        +`<span class="grip" title="${esc(tx('dragHint'))}">≡</span>`
        +`<span class="g-x" data-del="${gi}">✕</span>`
        +`<span class="g-tag">${esc(g.tag||('#'+g.seq))}</span>`
        +`<span class="g-rep">${esc(g.rep||'')}${gnoOf(gi)?`<i class="gno">${tx('grpNo',gnoOf(gi))}</i>`:''}</span>`
        +`<span class="g-pax">${(g.members&&g.members.length)?tx('memCnt',g.members.length,g.pax):g.pax+tx('person')}</span>`
        +`<span class="g-holes">${g.holes?g.holes+tx('holesU'):''}</span>`
        +`${g.late?`<span class="lateb" title="${esc(tx('lateT'))}">${tx('late')}</span>`:''}`
        +`${needsCheck(g)?`<span class="chkb" title="${esc(tx('chkT'))}">${tx('chkMark')}</span>`:''}`
        +`${g.cart?`<span class="cartb">🛺${esc(g.cart)}</span>`:''}`
        +`</div></td>`;
    }).join('');
    const ext = slot>STD_N;
    return `<tr class="${ext?'extrow':''}"><td class="tee">${esc(tee)}${ext?`<span class="extb" title="${esc(tx('extT'))}">${tx('extRow')}</span>`:''}</td>${tds}</tr>`;
  }).join('');

  box.className=PICK?'picking':'';
  box.innerHTML=`
    <div class="panel ckpanel">
      <h3>${tx('chkH')} <span class="cnt warnc">${tx('chkTeamN',chkTeams.length,chk.length)}</span></h3>
      <div class="legend" style="margin:0 0 9px">${tx('chkT')}</div>
      <div class="cklist">${chkHTML}</div>
    </div>
    <div class="panel">
      <h3>${tx('unH')} <span class="cnt">${tx('unassignedN',un.length)}</span></h3>
      <div class="legend" style="margin:0 0 8px">${tx('unWhy')}</div>
      <div class="un-list">${unHTML}</div>
      <div class="legend">${tx('pickCell')} · ${tx('dragHint')}</div>
    </div>
    <div class="panel">
      <h3>${tx('exclH')} <span class="cnt">${tx('exclN',skipped.length)}</span></h3>
      <div class="un-list">${skHTML}</div>
    </div>
    <div class="panel" id="roster-panel">${rosterHTML()}</div>
    <div class="panel">
      <h3>${tx('boardH')} <span class="cnt">${tx('totalG',BOARD.length)}</span></h3>
      <div class="cbwrap"><table class="cb">
        <thead><tr><th>${tx('thTee')}</th>${COURSES.map(c=>
          `<th class="chd ${c.code}">${esc(courseL(c.code))} ${tx('startHd')}<small>${esc(rotLabel(c.code,27))}</small></th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="legend">${tx('rotNote')}</div>
    </div>`;
  bind();
  if(TV) renderTV();
}

// 이미 어느 조엔가 들어간 사람(그날 기준)
function usedMemberIds(){ const s=new Set(); BOARD.forEach(g=>(g.members||[]).forEach(m=>s.add(String(m.id)))); return s; }
function memChip(m,cls,act){
  const g=m.gender==='男'?'<span class="mg m">♂</span>':m.gender==='女'?'<span class="mg f">♀</span>':'';
  return `<button type="button" class="mchip${cls?' '+cls:''}" data-${act}="${m.id}">${g}${esc(m.name)}</button>`;
}
function rosterHTML(){
  if(SELG==null||!BOARD[SELG]) return `<h3>${tx('rosH')}</h3><div class="cnt" style="color:var(--muted)">${tx('rosPick')}</div>`;
  const g=BOARD[SELG];
  const used=usedMemberIds();
  const inHTML=(g.members&&g.members.length)? g.members.map(m=>memChip(m,'in','out')).join('')
    : `<span class="cnt" style="color:var(--muted)">${tx('rosNone')}</span>`;
  const q=RQ.trim().toLowerCase();
  const own=(ROSTER[g.seq]||[]).filter(m=>!used.has(String(m.id)));
  let others=[];
  if(q){
    teamsOnDate(DATESEL).filter(t=>!isSkip(t.seq)&&String(t.seq)!==String(g.seq)).forEach(t=>{
      (ROSTER[t.seq]||[]).forEach(m=>{ if(!used.has(String(m.id)) && (m.name+' '+(m.eng||'')).toLowerCase().includes(q)) others.push({...m,_tag:t.tag}); });
    });
  }
  const ownF=q? own.filter(m=>(m.name+' '+(m.eng||'')).toLowerCase().includes(q)) : own;
  const addHTML=(ownF.length||others.length)
    ? ownF.map(m=>memChip(m,'','add')).join('')
      + others.map(m=>memChip({...m,name:m.name+' ('+(m._tag||tx('rosOther'))+')'},'oth','add')).join('')
    : `<span class="cnt" style="color:var(--muted)">-</span>`;
  return `<h3>${tx('rosH')} <span class="cnt">${esc(g.tag||('#'+g.seq))} · ${esc(courseL(g.course))} ${esc(g.tee||'')} · ${tx('memCnt',(g.members||[]).length,g.pax)}</span>
      <span style="flex:1"></span>
      <button class="btn xs ghost" id="r-all" type="button">${tx('rosAll')}</button>
      <span class="cnt">${tx('cartLbl')}</span>
      <input class="inp rcart" id="r-cart" type="text" placeholder="${esc(tx('cartPh'))}" value="${esc(g.cart||'')}">
      <button class="btn xs ghost" id="r-clr" type="button" style="color:var(--err)">${tx('rosClr')}</button>
    </h3>
    <div class="legend" style="margin:0 0 8px">${tx('rosHow')}</div>
    <div class="rlbl">${tx('rosIn')}</div><div class="mlist">${inHTML}</div>
    <div class="rlbl" style="margin-top:9px">${tx('rosAdd')}
      <button class="btn xs ghost" id="r-m" type="button">${tx('male')}</button>
      <button class="btn xs ghost" id="r-f" type="button">${tx('female')}</button>
      <input class="inp rsrch" id="r-q" type="search" placeholder="${esc(tx('rosSearch'))}" value="${esc(RQ)}"></div>
    <div class="mlist">${addHTML}</div>`;
}
function memberById(id){
  for(const k in ROSTER){ const m=(ROSTER[k]||[]).find(x=>String(x.id)===String(id)); if(m) return m; }
  return null;
}
function bindRoster(){
  const q=$('#r-q'); if(q){ q.addEventListener('input',()=>{ RQ=q.value; const p=$('#roster-panel'); if(p){ p.innerHTML=rosterHTML(); bindRoster(); const e=$('#r-q'); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } } }); }
  document.querySelectorAll('#roster-panel [data-add]').forEach(b=>b.addEventListener('click',()=>{
    const g=BOARD[SELG]; if(!g) return;
    if((g.members||[]).length>=(g.pax||4)){ toast(tx('rosFull'),'warn'); return; }
    const m=memberById(b.getAttribute('data-add')); if(!m) return;
    snap(); (g.members=g.members||[]).push(m); render(); touch();
  }));
  document.querySelectorAll('#roster-panel [data-out]').forEach(b=>b.addEventListener('click',()=>{
    const g=BOARD[SELG]; if(!g) return;
    snap(); g.members=(g.members||[]).filter(m=>String(m.id)!==String(b.getAttribute('data-out'))); render(); touch();
  }));
  const all=$('#r-all'); if(all) all.addEventListener('click',()=>{
    const g=BOARD[SELG]; if(!g) return; snap(); const used=usedMemberIds();
    (ROSTER[g.seq]||[]).forEach(m=>{ if(!used.has(String(m.id)) && (g.members||[]).length<(g.pax||4)) (g.members=g.members||[]).push(m); });
    render(); touch();
  });
  const clr=$('#r-clr'); if(clr) clr.addEventListener('click',()=>{ const g=BOARD[SELG]; if(!g) return; snap(); g.members=[]; render(); touch(); });
  // 성별로 몰아 넣기(남자끼리·여자끼리 편성) — 같은 팀 미배정 인원에서 정원까지
  const byGender=gd=>{ const g=BOARD[SELG]; if(!g) return; snap(); const used=usedMemberIds();
    (ROSTER[g.seq]||[]).forEach(m=>{ if(m.gender===gd && !used.has(String(m.id)) && (g.members||[]).length<(g.pax||4)) (g.members=g.members||[]).push(m); });
    render(); touch(); };
  const rc=$('#r-cart'); if(rc) rc.addEventListener('change',()=>{ const g=BOARD[SELG]; if(g){ g.cart=rc.value.trim(); render(); touch(); } });
  const bm=$('#r-m'); if(bm) bm.addEventListener('click',()=>byGender('男'));
  const bf=$('#r-f'); if(bf) bf.addEventListener('click',()=>byGender('女'));
}

function bind(){
  document.querySelectorAll('#board .cell').forEach(b=>{
    b.addEventListener('click',e=>{
      const del=e.target&&e.target.getAttribute&&e.target.getAttribute('data-del');
      if(del!=null&&del!==''){
        e.stopPropagation();
        snap();
        const gone=BOARD[+del], seq=gone&&gone.seq;
        BOARD.splice(+del,1); SELG=null;
        // 그 팀의 조가 하나도 안 남았다면 = 오늘 안 나간다는 뜻 → 제외로 넘긴다.
        //  이렇게 하지 않으면 자동 배정이 다시 채워 「지웠는데 또 있다」가 된다.
        if(seq!=null && !BOARD.some(g=>String(g.seq)===String(seq))){ markSkip(seq); }
        render(); touch(); return;
      }
      const c=b.getAttribute('data-c'), slot=+b.getAttribute('data-s');
      const gi=b.getAttribute('data-i');
      if(gi!=null&&gi!==''){ SELG=(SELG===+gi)?null:+gi; render(); return; }
      if(SELG==null) return;                       // 빈 칸 — 선택한 조가 있으면 그 자리로
      snap(); moveGroup(SELG, c, slot); SELG=null; render(); touch();
    });
    // ≡ 를 잡고 자유 이동. 찬 칸에 놓으면 그 자리에 끼워넣고 아래를 한 칸씩 민다.
    b.addEventListener('dragstart',e=>{
      const gi=b.getAttribute('data-i'); if(gi==null||gi===''){ e.preventDefault(); return; }
      DRAG=+gi; b.classList.add('dragging');
      try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(gi)); }catch(_){}
    });
    b.addEventListener('dragend',()=>{ DRAG=null; document.querySelectorAll('#board .cell').forEach(x=>x.classList.remove('dragging','over')); });
    b.addEventListener('dragover',e=>{ if(DRAG==null) return; e.preventDefault(); b.classList.add('over'); });
    b.addEventListener('dragleave',()=>b.classList.remove('over'));
    b.addEventListener('drop',e=>{
      e.preventDefault(); b.classList.remove('over');
      if(DRAG==null) return;
      const c=b.getAttribute('data-c'), slot=+b.getAttribute('data-s');
      snap(); moveGroup(DRAG, c, slot); DRAG=null; SELG=null; render(); touch();
    });
  });
  document.querySelectorAll('#board .un[data-seq]').forEach(b=>b.addEventListener('click',e=>{
    if(e.target&&e.target.classList&&e.target.classList.contains('skipb')) return;
    placeTeam(+b.getAttribute('data-seq'));
  }));
  // 이름을 누르면 집는다 → ① 다른 이름을 누르면 **교환** ② 조(시각) 버튼을 누르면 그 조로 **이동**
  document.querySelectorAll('#board .ckm').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const gi=+b.getAttribute('data-gi'), mid=String(b.getAttribute('data-mid'));
    if(!PICK){ PICK={gi,mid}; render(); return; }
    if(PICK.mid===mid){ PICK=null; render(); return; }
    const A=BOARD[PICK.gi], B=BOARD[gi];
    if(A&&B){
      const ai=(A.members||[]).findIndex(m=>String(m.id)===PICK.mid);
      const bi=(B.members||[]).findIndex(m=>String(m.id)===mid);
      if(ai>=0&&bi>=0){
        snap();
        const tmp=A.members[ai]; A.members[ai]=B.members[bi]; B.members[bi]=tmp;
        PICK=null; render(); touch(); return;
      }
    }
    PICK=null; render();
  }));
  // 집어든 사람을 그 조로 옮긴다(정원 4명까지)
  document.querySelectorAll('#board .ckg').forEach(b=>b.addEventListener('click',e=>{
    const gi=+b.getAttribute('data-goto');
    if(PICK==null){ SELG=(SELG===gi)?null:gi; render(); return; }
    e.stopPropagation();
    const A=BOARD[PICK.gi], B=BOARD[gi];
    if(!A||!B||PICK.gi===gi){ PICK=null; render(); return; }
    if((B.members||[]).length>=4){ toast(tx('rosFull'),'warn'); PICK=null; render(); return; }
    const ai=(A.members||[]).findIndex(m=>String(m.id)===PICK.mid);
    if(ai<0){ PICK=null; render(); return; }
    snap();
    const m=A.members.splice(ai,1)[0];
    (B.members=B.members||[]).push(m);
    A.pax=A.members.length; B.pax=B.members.length;   // 표기(4/4)와 저장 정원을 실제 인원에 맞춘다
    PICK=null; render(); touch();
  }));
  document.querySelectorAll('#board [data-okseq]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); const seq=b.getAttribute('data-okseq');
    snap(); BOARD.filter(g=>String(g.seq)===String(seq)).forEach(markManual);
    render(); touch(); toast(tx('chkOkDone'),'ok');
  }));

  document.querySelectorAll('#board .skipb').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); toggleSkip(+b.getAttribute('data-skip'));
  }));
  bindRoster();
}

// 조를 (코스, 슬롯)으로 옮긴다.
//  · 빈 칸  → 그대로 이동
//  · 찬 칸  → 그 자리에 끼워넣고, 그 아래 연속된 조를 한 칸씩 아래로 민다
//  · 아래에 빈 자리가 없으면 → 두 조를 맞바꾼다
function moveGroup(gi, course, slot){
  const g=BOARD[gi]; if(!g) return;
  if(g.course===course && g.slot===slot) return;
  const col=BOARD.filter((x,i)=>i!==gi && x.course===course);
  const taken=new Set(col.map(x=>x.slot));
  markManual(g);
  if(!taken.has(slot)){ setPos(g,course,slot); return; }
  let free=-1;
  for(let sN=slot+1; sN<=SLOTS.length; sN++){ if(!taken.has(sN)){ free=sN; break; } }
  if(free<0){                                   // 아래가 끝까지 찼다 → 맞바꾸기
    const other=col.find(x=>x.slot===slot);
    const oc=g.course, os=g.slot;
    setPos(g,course,slot); if(other) setPos(other,oc,os);
    toast(tx('noShift'),'warn'); return;
  }
  col.filter(x=>x.slot>=slot && x.slot<free).sort((a,b)=>b.slot-a.slot)
     .forEach(x=>setPos(x,course,x.slot+1));
  setPos(g,course,slot);
  toast(tx('moveDone'),'ok');
}
function setPos(g,course,slot){ g.course=course; g.slot=slot; g.tee=SLOTS[slot-1]||''; }
// 확인 완료 표시 — [✓ 이대로 확정] 과 조를 다른 자리로 옮겼을 때만 쓴다.
//  ⚠ 조원을 바꾸는 것은 「고치는 중」이지 확인 완료가 아니다 → 목록에서 사라지면 안 된다.
function markManual(g){ if(g) g.src='manual'; }

// 빈 슬롯 찾기 — 늦은 조(쿠주힐즈)는 뒤에서부터 채운다
function firstFree(late){
  const order=late?[...SLOTS.keys()].reverse():[...SLOTS.keys()];
  for(const i of order){ for(const c of COURSES){ if(groupAt(c.code,i+1)<0) return {course:c.code, slot:i+1}; } }
  return null;
}
function placeTeam(seq){
  if(isSkip(seq)) return;
  const t=teamsOnDate(DATESEL).find(x=>String(x.seq)===String(seq)); if(!t) return;
  const placed=BOARD.filter(g=>String(g.seq)===String(seq)).reduce((s,g)=>s+(g.pax||0),0);
  const rest=t.pax-placed; if(rest<=0) return;
  const parts=SZCore.splitTeam(rest,4);
  let added=0;
  parts.forEach(n=>{
    const f=firstFree(isLate(t)); if(!f){ toast(tx('noSlot'),'warn'); return; }
    const auto = (t.pax<=4) ? (ROSTER[t.seq]||[]).slice(0,n) : [];
    BOARD.push({ seq:t.seq, course:f.course, slot:f.slot, tee:SLOTS[f.slot-1]||'', pax:n,
      tag:t.tag, rep:t.rep, holes:holesOn(t,DATESEL), late:isLate(t), cart:'', note:'', members:auto });
    added++;
  });
  if(added) render();
}

// 한 날짜의 부족분을 계획한다 — 기존 조는 건드리지 않고 빈 자리에만 채운다.
//  자리 배분 = 한 시간대의 아소→소보→쿠주를 다 채우고 다음 시간대로(공평·로테이션).
//  날짜마다 시작 코스를 한 칸씩 밀어 같은 팀이 날마다 다른 코스를 돌게 한다.
//  자리가 모자라면 6:50부터 7분 간격으로 필요한 만큼 뒤로 늘린다(연장 표시).
function planDate(date, existing, dateIdx){
  const teams=teamsOnDate(date).filter(t=>!skipOn(date,t.seq));
  if(!teams.length) return {rows:[], slots:SLOTS};
  const placed={}; (existing||[]).forEach(e=>{ placed[e.event_seq]=(placed[e.event_seq]||0)+(e.capacity||0); });
  // 팀 단위로 필요한 조를 만든다 — 한 팀은 한 코스에 연속으로 붙인다.
  const need=[];
  teams.slice().sort((a,b)=>a.seq-b.seq).forEach(t=>{
    const rest=t.pax-(placed[t.seq]||0);
    if(rest>0) need.push({ t, parts:SZCore.splitTeam(rest,4), late:isLate(t) });
  });
  if(!need.length) return {rows:[], slots:SLOTS};
  const cs=COURSES.map(c=>c.code);
  const occ=new Set((existing||[]).map(e=>e.course_code+'|'+e.slot_no));
  const load={}; cs.forEach(c=>load[c]=0);
  (existing||[]).forEach(e=>{ if(load[e.course_code]!=null) load[e.course_code]++; });
  const totalG=(existing||[]).length + need.reduce((n,x)=>n+x.parts.length,0);
  let slots=makeSlots(Math.max(STD_N, Math.ceil(totalG/cs.length)+2));
  // 그 코스에서 연속 k칸이 비어 있는 첫 자리(늦은 조는 뒤에서부터)
  const freeRun=(c,k,fromEnd)=>{
    const fits=st=>{ for(let j=0;j<k;j++) if(occ.has(c+'|'+(st+j))) return false; return true; };
    if(fromEnd){ for(let st=slots.length-k+1; st>=1; st--) if(fits(st)) return st; }
    else { for(let st=1; st+k-1<=slots.length; st++) if(fits(st)) return st; }
    return -1;
  };
  const rows=[];
  const place=(x,ti)=>{
    const k=x.parts.length;
    // 코스 선택 = 가장 덜 찬 코스 우선(공평), 같으면 날짜·순번으로 로테이션
    const order=cs.slice().sort((a,b)=>{
      if(load[a]!==load[b]) return load[a]-load[b];
      const ra=(cs.indexOf(a)-((ti+(dateIdx||0))%cs.length)+cs.length)%cs.length;
      const rb=(cs.indexOf(b)-((ti+(dateIdx||0))%cs.length)+cs.length)%cs.length;
      return ra-rb;
    });
    for(let pass=0; pass<2; pass++){
      for(const c of order){
        const st=freeRun(c,k,x.late);
        if(st<0) continue;
        x.parts.forEach((n,j)=>{
          const slot=st+j; occ.add(c+'|'+slot); load[c]++;
          rows.push({ seq:x.t.seq, tag:x.t.tag, rep:x.t.rep, pax:n, course:c, slot,
            tee:slots[slot-1]||'', late:x.late, holes:holesOn(x.t,date) });
        });
        return true;
      }
      slots=makeSlots(slots.length+Math.max(k,3));   // 연속 자리가 없으면 뒤로 늘린다
    }
    return false;
  };
  let ti=0;
  need.filter(x=>!x.late).forEach(x=>place(x,ti++));
  need.filter(x=>x.late).forEach(x=>place(x,ti++));   // 쿠주힐즈 숙박 = 늦은 조(뒤에서부터)
  // 슬롯을 늘린 뒤 앞서 배정된 조의 티오프 문자열을 맞춘다
  rows.forEach(r=>{ r.tee=slots[r.slot-1]||r.tee; });
  return {rows, slots};
}

// 이달 전체 — 날짜를 열지 않아도 그 달 라운딩일 전부를 배정·저장한다.
async function autoAssignMonth(){
  if(!supa) return;
  const btn=$('#btn-month'); if(btn){ btn.disabled=true; btn.textContent=tx('monthRun'); }
  const by=(window.__so_getUser&&__so_getUser())||null;
  let days=0, made=0;
  try{
    const ax=golfDates();
    for(let di=0; di<ax.length; di++){
      const date=ax[di];
      const {rows}=planDate(date, MONTHG[date]||[], di);
      if(!rows.length) continue;
      const ins=rows.map(r=>({ play_date:date, event_seq:r.seq, course_code:r.course, tee_time:r.tee,
        slot_no:r.slot, label:r.tag||null, capacity:r.pax, assign_source:'auto', created_by:by }));
      for(let i=0;i<ins.length;i+=400){
        const chunk=ins.slice(i,i+400);
        const {data,error}=await supa.from('golf_groups').insert(chunk).select('id,event_seq,capacity,slot_no');
        if(error) throw error;
        // 4명 이하 팀은 조원까지 자동(조가 하나뿐이라 나눌 여지가 없다)
        // 조원 기본값 — 그 팀 안에서 명단 순서대로 1조·2조로 나눈다
        const mrows=[]; const byTeam={};
        (data||[]).forEach(g=>{ (byTeam[g.event_seq]=byTeam[g.event_seq]||[]).push(g); });
        Object.keys(byTeam).forEach(seq=>{
          const roster=(ROSTER[seq]||[]); let i=0;
          byTeam[seq].sort((a,b)=>(a.slot_no||0)-(b.slot_no||0)).forEach(g=>{
            roster.slice(i, i+(g.capacity||4)).forEach((m,k)=>mrows.push({group_id:g.id, member_id:m.id, event_seq:m.seq, seq:k+1}));
            i+=(g.capacity||4);
          });
        });
        for(let j=0;j<mrows.length;j+=500){ await supa.from('golf_group_members').insert(mrows.slice(j,j+500)); }
        made+=chunk.length;
      }
      days++;
    }
    await loadMonthState();
    renderDateChips();
    if(DATESEL) await loadBoard(DATESEL,true); else render();
    toast(days?tx('monthDone',days,made):tx('monthNone'), days?'ok':'warn');
  }catch(e){ toast(tx('saveFail')+e.message,'err'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=tx('autoMonth'); } }
}

function autoAssign(quiet){
  if(!DATESEL) return;
  BOARD=[]; SELG=null; SLOTS=STD_SLOTS.slice();
  const {rows,slots}=planDate(DATESEL, [], 0);
  SLOTS=slots;
  let filled=0;
  rows.forEach(r=>{
    const ms = teamPax(r.seq)<=4 ? (ROSTER[r.seq]||[]).slice(0,r.pax) : [];
    if(ms.length) filled++;
    BOARD.push({ seq:r.seq, course:r.course, slot:r.slot, tee:r.tee, pax:r.pax,
      tag:r.tag, rep:r.rep, holes:r.holes, late:r.late, cart:'', note:'', members:ms });
  });
  render();
  if(quiet) return;
  toast(tx('autoDone',BOARD.length),'ok');
  if(filled) toast(tx('autoFilled',filled),'ok');
}

// 그 날짜를 처음부터 다시 짠다 — 확정(manual)한 조는 그대로 두고 나머지만 새로 배분한다.
//  자동 채움은 빠진 팀만 메우므로, 한 번 치우친 배치(예: 쿠주만 비어 있음)는 이걸로 고친다.
async function redoDate(quiet){
  if(!DATESEL||!supa) return 0;
  if(!quiet && !confirm(tx('redoAsk',DATESEL))) return 0;
  snap();
  const keep=BOARD.filter(g=>g.src==='manual');
  BOARD=keep.slice(); SELG=null; SLOTS=STD_SLOTS.slice();
  const {rows,slots}=planDate(DATESEL, keep.map(g=>({event_seq:g.seq,course_code:g.course,slot_no:g.slot,capacity:g.pax})), 0);
  SLOTS=slots;
  rows.forEach(r=>BOARD.push({ seq:r.seq, course:r.course, slot:r.slot, tee:r.tee, pax:r.pax,
    tag:r.tag, rep:r.rep, holes:r.holes, late:r.late, cart:'', note:'', src:'auto', members:[] }));
  [...new Set(rows.map(r=>r.seq))].forEach(fillTeamMembers);
  ensureSlots(BOARD.reduce((m,g)=>Math.max(m,g.slot||0),0));
  render(); await save(true);
  if(!quiet) toast(tx('redoDone',BOARD.length),'ok');
  return BOARD.length;
}
// 이달 전체 재배정 — 날짜마다 확정 조만 남기고 다시 짠다.
async function redoMonth(){
  if(!supa) return;
  if(!confirm(tx('redoMAsk'))) return;
  const btn=$('#btn-redom'); if(btn){ btn.disabled=true; btn.textContent=tx('monthRun'); }
  let n=0;
  try{
    const ax=golfDates(); const cur=DATESEL;
    for(const d of ax){
      DATESEL=d; await loadBoard(d,true);       // 그 날짜를 화면 상태로 올린 뒤
      n+=await redoDate(true);                   // 확정 조만 남기고 다시 짠다
    }
    DATESEL=cur||ax[0];
    await loadMonthState(); renderDateChips();
    if(DATESEL) await loadBoard(DATESEL,true);
    toast(tx('redoDone',n),'ok');
  }catch(e){ toast(tx('saveFail')+e.message,'err'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=tx('redoMBtn'); } }
}

async function save(quiet){
  if(!DATESEL||!supa||TV) return;
  const by=(window.__so_getUser&&__so_getUser())||null;
  try{
    // 화면에서 사라진 조만 삭제(남은 조는 id 유지 → golf.html 이 넣은 조원 배정이 보존된다)
    const keep=new Set(BOARD.map(g=>g.id).filter(Boolean));
    const gone=DBIDS.filter(id=>!keep.has(id));
    if(gone.length){ const {error}=await supa.from('golf_groups').delete().in('id',gone); if(error) throw error; }
    for(const g of BOARD){
      const row={ play_date:DATESEL, event_seq:g.seq, course_code:g.course||null, tee_time:g.tee||null,
        slot_no:g.slot||null, label:g.tag||null, capacity:g.pax||4, cart_no:g.cart||null, note:g.note||null };
      if(g.id){
        // update 는 「그 id 가 아직 있을 때」만 통한다. 되돌리기로 되살린 조는 이미 지워진
        // id 라 0행이 되어 조용히 사라진다 → upsert 로 없으면 그 id 그대로 다시 넣는다.
        const {error}=await supa.from('golf_groups')
          .upsert({ id:g.id, ...row, assign_source:g.src||'auto', created_by:by }, {onConflict:'id'});
        if(error) throw error;
      }
      else{ const {data,error}=await supa.from('golf_groups').insert({...row, assign_source:g.src||'manual', created_by:by}).select('id').single();
        if(error) throw error; g.id=data.id; }
    }
    // 조원(사람 배치)도 같이 저장 — 그날 조의 조원을 통째 교체
    const ids=BOARD.map(g=>g.id).filter(Boolean);
    if(ids.length){
      for(let i=0;i<ids.length;i+=150){
        const {error:de}=await supa.from('golf_group_members').delete().in('group_id',ids.slice(i,i+150));
        if(de) throw de;
      }
      const rows=[];
      BOARD.forEach(g=>{ (g.members||[]).forEach((m,i)=>rows.push({ group_id:g.id, member_id:m.id, event_seq:m.seq||g.seq, seq:i+1 })); });
      for(let i=0;i<rows.length;i+=500){
        const {error:ie}=await supa.from('golf_group_members').insert(rows.slice(i,i+500));
        if(ie) throw ie;
      }
    }
    DBIDS=BOARD.map(g=>g.id).filter(Boolean);
    if(!quiet) toast(tx('savedN',BOARD.length),'ok');
  }catch(e){ toast(tx('saveFail')+e.message,'err'); }
}

// A4 가로 — 화면 표와 같은 배열(WYSIWYG)
// ── 코스 입구 모니터 화면 ──────────────────────────────────────────────
//  손님이 지나가며 보는 화면 — 큰 글씨, 지난 조는 흐리게, 다음 출발은 강조.
function renderTV(){
  let box=document.getElementById('tv'); if(!box){ box=document.createElement('div'); box.id='tv'; document.body.appendChild(box); }
  const now=new Date();
  const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const rows=SLOTS.map((tee,i)=>{
    const slot=i+1;
    const any=COURSES.some(c=>groupAt(c.code,slot)>=0);
    if(!any) return '';
    const past=tee<hhmm;
    const tds=COURSES.map(c=>{
      const gi=groupAt(c.code,slot);
      if(gi<0) return '<td></td>';
      const g=BOARD[gi];
      const names=(g.members&&g.members.length)? g.members.map(m=>esc(m.name)).join(' · ') : esc(g.rep||'');
      const no=gnoOf(gi);
      return `<td><b>${esc(g.tag||('#'+g.seq))}</b>${no?`<i>${tx('grpNo',no)}</i>`:''} <span class="nm">${names}</span></td>`;
    }).join('');
    return `<tr class="${past?'past':''}"><td class="tee">${esc(tee)}</td>${tds}</tr>`;
  }).join('');
  // 다음 출발 = 아직 지나지 않은 첫 줄
  const nextTee=SLOTS.find((t,i)=>t>=hhmm && COURSES.some(c=>groupAt(c.code,i+1)>=0));
  box.innerHTML=`
    <div class="tv-hd">
      <div class="tv-t">${esc(tx('tvTitle'))}</div>
      <div class="tv-d">${esc(DATESEL||'')} ${esc(DATESEL?SZCore.mdWd(DATESEL,lang()):'')}</div>
      <div class="tv-c">${esc(hhmm)}${nextTee?` <span>▶ ${esc(nextTee)} ${esc(tx('tvNow'))}</span>`:''}</div>
    </div>
    <table class="tv-tb"><thead><tr><th>${esc(tx('thTee'))}</th>${COURSES.map(c=>
      `<th class="c-${c.code}">${esc(courseL(c.code))} ${esc(tx('startHd'))}<span>${esc(rotLabel(c.code,27))}</span></th>`).join('')}</tr></thead>
      <tbody>${rows||`<tr><td colspan="4" class="tv-none">${esc(tx('noData'))}</td></tr>`}</tbody></table>`;
  // 다음 출발 줄이 화면 안에 오게
  const nr=box.querySelector('tr:not(.past)'); if(nr && nr.scrollIntoView) try{ nr.scrollIntoView({block:'center'}); }catch(_){}
}

// ── A3 세로 공지용 인쇄 ────────────────────────────────────────────────
//  코스 입구·클럽하우스에 붙이는 공지물이라 멀리서 읽혀야 한다 →
//  A3 세로 한 장에 꽉 채우고, 줄이 많은 날은 글자배율(--fs)을 자동으로 줄여 맞춘다.
function boardRowsHTML(forPrint){
  return SLOTS.map((tee,i)=>{
    const slot=i+1;
    const tds=COURSES.map(c=>{
      const gi=groupAt(c.code,slot);
      if(gi<0) return '<td class="e"></td>';
      const g=BOARD[gi];
      const names=(g.members&&g.members.length)? g.members.map(m=>esc(m.name)).join(' · ') : esc(g.rep||'');
      const no=gnoOf(gi);
      return `<td><b>${esc(g.tag||('#'+g.seq))}</b>${no?`<i>${tx('grpNo',no)}</i>`:''} ${names}`
        +` <span class="p">${(g.members&&g.members.length)||g.pax}${forPrint?'名':tx('person')}</span>`
        +`${g.holes?` <span class="h">${g.holes}H</span>`:''}</td>`;
    }).join('');
    const ext = slot>STD_N;
    return `<tr${ext?' class="ext"':''}><td class="tee">${esc(tee)}</td>${tds}</tr>`;
  }).join('');
}

}
