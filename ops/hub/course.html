<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 코스 배정표</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── 공통 chrome (전 ops 페이지 공유 정본) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.xs{font-size:11.5px;padding:4px 10px}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:200px;text-align:center}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fbf3e2;color:#7a5a16}

  /* ── 페이지 전용 ── */
  main{padding:16px 20px 80px;max-width:1280px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .daychip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer}
  .daychip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px}

  /* 코스 배정표 = 세로 티오프 × 가로 3코스 */
  .cbwrap{overflow-x:auto}
  table.cb{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
  table.cb th{background:var(--surface2);border:1px solid var(--border2);padding:7px 8px;font-size:12px;color:var(--text2)}
  table.cb th.chd{font-size:13px;font-weight:800;color:#fff}
  th.chd.aso{background:#5a7a52;border-color:#4b6a45}
  th.chd.sobo{background:#2f6f8f;border-color:#28607c}
  th.chd.kuju{background:#9a7322;border-color:#84621d}
  table.cb td{border:1px solid var(--border);padding:0;height:36px;vertical-align:middle}
  table.cb td.tee{background:var(--surface2);font-family:var(--mono);font-weight:800;text-align:center;width:74px;white-space:nowrap}
  .cell{display:block;width:100%;height:100%;min-height:36px;padding:5px 7px;cursor:pointer;text-align:left;background:transparent;border:0;font-family:inherit;font-size:14px;font-weight:600}
  .cell:hover{background:var(--accentSoft)}
  .cell.has{background:var(--surface)}
  .cell.sel{outline:2px solid var(--accent2);outline-offset:-2px;background:#fdf6e6}
  /* 선택 안내 — 무엇을 골랐고 다음에 무엇을 하면 되는지 화면 아래에 붙여 둔다 */
  #gsel-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:120;display:none;
    align-items:center;gap:12px;background:var(--accentDeep,#3b4a2f);color:#fff;border-radius:12px;
    padding:11px 16px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:13.5px;max-width:94vw}
  #gsel-bar b{font-family:var(--mono);font-size:15px}
  #gsel-bar .who{font-weight:800;font-size:15px}
  #gsel-bar .at{opacity:.85}
  #gsel-bar .hintx{opacity:.9;border-left:1px solid rgba(255,255,255,.35);padding-left:12px}
  #gsel-bar button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);
    border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  #gsel-bar button:hover{background:rgba(255,255,255,.28)}
  @media print{ #gsel-bar{display:none!important} }
  .cell .g-tag{font-family:var(--mono);font-weight:800;color:var(--accent)}
  .cell .g-rep{color:var(--text);font-weight:700;margin-left:5px}
  .cell .g-pax{color:var(--text);font-weight:700;margin-left:5px;font-size:12.5px}
  /* 검색 강조 — 찾은 조는 또렷하게, 나머지는 흐리게 */
  .cell.qhit{outline:2px solid var(--accent2);outline-offset:-2px}
  .cell.qdim{opacity:.33}
  /* 라운딩 예외 패널 */
  .exrow{border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-bottom:7px;background:var(--surface)}
  .exrow.skip{background:var(--surface3);opacity:.75}
  .exhd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px}
  .exhd .exrep{font-weight:700}
  .exhd .exsp{flex:1}
  .exeff{font-weight:800;color:var(--accent)}
  .exeff i{color:var(--accent2);font-style:normal}
  .exh,.exskip{font-size:11.5px;font-weight:700;border:1px solid var(--border2);background:var(--surface);color:var(--text2);border-radius:99px;padding:3px 10px;cursor:pointer}
  .exh.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .exskip.on{background:var(--err);border-color:var(--err);color:#fff}
  .exabs{color:var(--err);font-weight:800}
  .exmem{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .exm{font-size:12px;font-weight:700;border:1px solid var(--border2);background:var(--surface2);color:var(--text);border-radius:7px;padding:4px 9px;cursor:pointer}
  .exm.off{text-decoration:line-through;color:var(--err);border-color:#e3bdb4;background:#fbeeeb}
  .exm i{font-style:normal;font-size:10px;font-weight:800}
  .cell .g-holes{color:var(--text2);font-weight:700;font-size:12px;margin-left:5px}
  .cell .gno{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--text2);border-radius:99px;padding:0 5px;margin-left:4px}
  table.cb th.chd small{display:block;font-size:10px;font-weight:600;opacity:.85}
  .cell .g-x{float:right;color:var(--muted);font-weight:800;padding:0 3px}
  .cell .g-x:hover{color:var(--err)}
  .lateb{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#9a7322;border-radius:99px;padding:0 6px;margin-left:5px}
  /* 1단계(Min 2026-10-25) — 샷건 스타트 홀 · 점심 후 재스타트 · 우산 대여 · 참고사항 배지 */
  .holeb{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:#1A4D8F;border-radius:99px;padding:0 6px;margin-left:5px}
  .pmb{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#5a7a52;border-radius:99px;padding:0 6px;margin-left:5px}
  .umbb{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--err);border-radius:99px;padding:0 6px;margin-left:5px}
  .umbb.back{background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
  .noteb{display:inline-block;font-size:10.5px;font-weight:600;color:var(--text2);margin-left:5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;padding:7px 10px;border:1px solid var(--border2);border-radius:9px;background:var(--surface2)}
  .daybar .sgb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .daybar .legend{margin:0}
  /* 3·4단계(Min 2026-10-25) — 팀 색 띠 · 합동 조 · 여러 조 선택 · 식사 시점 · 전기카트 · 빠른 처리 · 손님 화면 공개 */
  .cell .tcol{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:3px 0 0 3px}
  .cell.has{padding-left:11px}
  .cell .g-plus{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;border-radius:99px;padding:0 7px;margin-left:5px;vertical-align:middle}
  .ckm.tm,.mchip.tm{border-left-width:5px}
  .cell.msel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accentSoft)}
  .cell .msk{position:absolute;right:22px;top:4px;font-style:normal;font-size:11px;font-weight:900;color:#fff;background:var(--accent);border-radius:99px;padding:0 6px}
  .bd-h .mon{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lunchb{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#7a5c2e;border-radius:99px;padding:0 6px;margin-left:5px}
  .evb{display:inline-block;font-size:10px;font-weight:800;color:#1a4d8f;background:#e3ecf7;border:1px solid #b9cde8;border-radius:99px;padding:0 6px;margin-left:5px}
  #gsel-bar{flex-wrap:wrap;justify-content:center;row-gap:8px}
  #gsel-bar .qa{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;border-top:1px solid rgba(255,255,255,.25);padding-top:8px}
  #gsel-bar .qa .qal{font-size:11.5px;font-weight:800;opacity:.8;margin-right:4px}
  #gsel-bar .qa button{font-size:12px;padding:5px 10px}
  #gsel-bar .qa button.on{background:#fff;color:#3b4a2f;border-color:#fff}
  .daybar .relwrap{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .daybar .relst{font-size:11.5px;font-weight:800;color:var(--text2)}
  .daybar .relst.on{color:var(--ok)} .daybar .relst.dirty{color:var(--err)} .daybar .relst.hid{color:var(--warn)}
  .rmeta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 6px;padding:8px 10px;border:1px solid var(--border2);border-radius:9px;background:var(--surface2)}
  .rmeta label{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--text2)}
  .rmeta .inp{padding:3px 8px;font-size:12px;width:auto}
  .rmeta .lend{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text)}
  .rmeta .lend.back{color:var(--muted);text-decoration:line-through}
  .rmeta .lend button{font-family:inherit;font-size:11px;font-weight:700;border:1px solid var(--border2);background:var(--surface);color:var(--text2);border-radius:99px;padding:1px 8px;cursor:pointer}
  .rmeta .lend button:hover{border-color:var(--accent);color:var(--accent)}
  /* 변경 확인 — 누르고 누르면 아래 바에 「무엇을 무엇으로」가 뜨고 [변경]을 눌러야 바뀐다(Min 2026-10-25) */
  .cell.pend{outline:2px dashed var(--accent2);outline-offset:-2px;background:#fdf6e6}
  .ckm.pick2{outline:2px solid var(--accent2);outline-offset:1px}
  .ckg.pend{outline:2px dashed var(--accent2);outline-offset:1px}
  #gsel-bar .pend{font-weight:800;font-size:14px}
  #gsel-bar .pend b{font-size:14px}
  #gsel-bar .pend small{font-weight:600;opacity:.85;font-size:12px}
  #gsel-bar button.ok{background:#fff;color:#3b4a2f;border-color:#fff}
  #gsel-bar button.ok:hover{background:#f1f3ea}
  /* 미배정 팀 */
  .un-list{display:flex;flex-wrap:wrap;gap:7px}
  .un{border:1px solid var(--border2);border-radius:9px;padding:6px 10px;font-size:12.5px;background:var(--surface);cursor:pointer}
  .un:hover{border-color:var(--accent);background:var(--accentSoft)}
  .un b{font-family:var(--mono);color:var(--accent)}
  .un small{color:var(--text2);margin-left:5px}
  .legend{font-size:11.5px;color:var(--muted);margin-top:7px}
  .cell{position:relative}
  .cell .grip{display:inline-block;color:var(--muted);font-weight:800;cursor:grab;margin-right:5px;user-select:none}
  .cell .grip:active{cursor:grabbing}
  .cell.dragging{opacity:.45}
  .cell.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accentSoft)}
  .un{display:inline-flex;align-items:center;gap:4px}
  .un.off{opacity:.6;border-style:dashed;cursor:default}
  .skipb{font-family:inherit;font-size:11px;font-weight:700;border:1px solid var(--border2);background:var(--surface);
    color:var(--text2);border-radius:99px;padding:1px 8px;margin-left:6px;cursor:pointer}
  .skipb:hover{border-color:var(--err);color:var(--err)}
  .skipb.on{border-color:var(--accent);color:var(--accent)}
  .skipb.on:hover{background:var(--accentSoft)}
  /* 조 편성(사람 배치) — 코스 배정표 안에서 바로 */
  .rlbl{font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:5px;display:flex;align-items:center;gap:8px}
  .rsrch{padding:3px 9px;font-size:12px;max-width:200px}
  .mlist{display:flex;flex-wrap:wrap;gap:6px}
  .mchip{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--border2);background:var(--surface);
    color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer}
  .mchip:hover{border-color:var(--accent);background:var(--accentSoft)}
  .mchip.in{background:var(--accent);border-color:var(--accent);color:#fff}
  .mchip.in:hover{background:var(--err);border-color:var(--err)}
  .mchip.oth{border-style:dashed}
  .mg{font-size:11px;margin-right:3px}
  .ckm .mg{font-size:12px;margin-right:4px}
  .ckm.pick .mg{color:#fff}
  .mg.m{color:#1A4D8F}.mg.f{color:#c0392b}
  /* 조 단위 표 제목줄 — 인쇄 버튼을 오른쪽 끝에(표를 보다가 바로 낼 수 있게) */
  .bd-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .bd-h .bd-print{margin-left:auto;font-weight:700}
  .rcart{padding:3px 9px;font-size:12px;width:110px}
  .chkb{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--err);border-radius:99px;padding:0 6px;margin-left:5px}
  /* 카트 배지 = 종류 + 번호(Min 2026-10-26 조당 1대) — 전기=파랑(신청 배지 .evb 와 같은 계열) · 2인승=회색 테두리 · 4인승=회색 채움 · 미배정=빨강 */
  .cartb{display:inline-block;font-size:10.5px;font-weight:800;color:#1a3f6b;background:#e3ecf7;border:1px solid #b9cde8;border-radius:99px;padding:0 7px;margin-left:5px;font-family:var(--mono)}
  .cartb.gas2{color:#4a4f44;background:var(--surface2);border-color:var(--border2)}
  .cartb.gas4{color:#fff;background:#5f6b57;border-color:#5f6b57}
  .cartb.none{color:var(--err);background:#fbeeeb;border-color:#e3bdb4;font-family:inherit;font-weight:700}
  .daybar .cartst{font-size:11.5px;font-weight:800;color:var(--text2)} .daybar .cartst.miss{color:var(--err)}
  .rcart.sel{width:auto}
  .carryb{font-size:10px;font-weight:800;color:var(--accent);background:var(--accentSoft);border-radius:99px;padding:1px 6px;margin-left:3px}
  .dbadge{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--err);border-radius:99px;padding:0 5px;margin-left:5px}
  .dbadge.ok{background:var(--ok)}
  .dbadge.warn{background:var(--err)}
  .dbadge.gold{background:var(--accent2)}
  .daychip.on .dbadge.gold{background:#fff;color:var(--accent2)}
  .daychip.on .dbadge.warn{background:#fff;color:var(--warn)}
  .daychip.on .dbadge{background:#fff;color:var(--err)}
  .daychip.on .dbadge.ok{background:#fff;color:var(--ok)}
  .extrow td{background:#fbf7ef}
  .extb{display:block;font-size:9px;font-weight:800;color:var(--warn)}
  /* 모니터 화면 — 코스 입구에 띄운다(읽기 전용 전체화면) */
  body.tvmode{background:#10160f;color:#fff;overflow:hidden}
  body.tvmode .topbar,body.tvmode .conn,body.tvmode main,body.tvmode #so-totop,body.tvmode .so-footer{display:none!important}
  #tv{position:fixed;inset:0;padding:1.4vh 1.6vw;display:flex;flex-direction:column;overflow:hidden}
  .tv-hd{display:flex;align-items:baseline;gap:2vw;border-bottom:.4vh solid #7f9a5f;padding-bottom:1vh;margin-bottom:1vh}
  .tv-t{font-size:3.4vh;font-weight:800;letter-spacing:.1vw}
  .tv-d{font-size:3vh;font-weight:800;color:#e8f2dd}
  .tv-c{margin-left:auto;font-size:3.6vh;font-weight:800;font-family:var(--mono);color:#ffe9a8}
  .tv-c span{font-size:2.6vh;font-weight:800;color:#bfe39a;margin-left:1vw}
  .tv-tb{width:100%;border-collapse:collapse;table-layout:fixed}
  .tv-tb th{padding:1vh .8vw;font-size:2.9vh;font-weight:800;background:#2a3b22;border:.25vh solid #56704a;color:#fff}
  .tv-tb th span{display:block;font-size:1.9vh;font-weight:700;color:#d3e4c2}
  .tv-tb th:first-child{width:12vw}
  .tv-tb td{padding:.9vh .8vw;font-size:3.1vh;font-weight:700;border:.25vh solid #46583b;white-space:nowrap;overflow:hidden}
  .tv-tb tbody tr:nth-child(even) td{background:#182115}
  .tv-tb td.tee{font-family:var(--mono);font-weight:800;text-align:center;background:#232f1d;font-size:3.5vh;color:#fff}
  .tv-tb td b{font-family:var(--mono);color:#ffdf9c;font-size:2.8vh;font-weight:800}

// 코스 3개 = 같은 시간대에 동시 출발(현장 게시판과 같은 배열 순서)
const COURSES=[ {code:'aso',ko:'아소',ja:'阿蘇',en:'Aso'}, {code:'sobo',ko:'소보',ja:'祖母',en:'Sobo'}, {code:'kuju',ko:'쿠주',ja:'久住',en:'Kuju'} ];
const CMAP={}; COURSES.forEach(c=>CMAP[c.code]=c);
// 27홀 = 9홀 3개(아소·소보·쿠주)를 이어서 돈다. 이 표는 **출발 코스·출발 시각**만 정한다.
//  아소 출발 → 소보 → 쿠주 / 소보 출발 → 쿠주 → 아소 / 쿠주 출발 → 아소 → 소보.
//  그래서 한 사람은 하루에 한 번만(출발 자리 하나만) 표에 나온다.
const ROT={ aso:['aso','sobo','kuju'], sobo:['sobo','kuju','aso'], kuju:['kuju','aso','sobo'] };
function rotOf(start, holes){
  const r=ROT[start]||ROT.aso;
  const n = holes>=27 ? 3 : holes>=18 ? 2 : 1;   // 27H=3바퀴 · 18H=2바퀴 · 9H=1바퀴
  return r.slice(0,n);
}
function rotLabel(start, holes){ return rotOf(start,holes).map(courseL).join('→'); }

function courseL(code){ const c=CMAP[code]; if(!c) return code||''; return lang()==='ja'?c.ja:lang()==='en'?c.en:c.ko; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

//  (자동 저장이라 잘못 눌렀을 때 돌아갈 길이 없으면 안 된다)
let UNDO=[];
function snap(){
  UNDO.push({ board:JSON.parse(JSON.stringify(BOARD)), skip:[...SKIP], slots:SLOTS.slice() });
  if(UNDO.length>30) UNDO.shift();
  const b=$('#btn-undo'); if(b) b.disabled=false;
}
async function undo(){
  const st=UNDO.pop();
  if(!st){ toast(tx('undoNone'),'warn'); return; }
  BOARD=st.board; SKIP=new Set(st.skip); SLOTS=st.slots; SELG=null; PEND=null; PICK=null; MSEL=new Set();
  SKIPM[DATESEL]=new Set(st.skip);
  // 제외 상태도 DB와 맞춘다
  try{
    const {data}=await supa.from('golf_skips').select('event_seq').eq('play_date',DATESEL);
    const cur=new Set((data||[]).map(x=>String(x.event_seq)));
    for(const seq of cur) if(!SKIP.has(seq)) await supa.from('golf_skips').delete().eq('play_date',DATESEL).eq('event_seq',seq);
    for(const seq of SKIP) if(!cur.has(seq)) await supa.from('golf_skips').insert({play_date:DATESEL, event_seq:Number(seq)});
  }catch(e){}
  render(); await save(true);
  const b=$('#btn-undo'); if(b) b.disabled=!UNDO.length;
  toast(tx('undoDone'),'ok');
}
function touch(){ clearTimeout(SAVET); SAVET=setTimeout(()=>{ save(true); },900); }

//  2026-10-26 테크노크래프트 회신의 사양서·IC Green 표본 파일과 칸 단위로 대조해 맞췄다(docs/marshal-ai-export.md).
//  한 조(카트) = 한 줄 19칸. 문자코드 **Shift-JIS(CP932)** · 줄끝 **CRLF** · 머리글 없음(스펙 2장 기본사양).
//  ① 카트번호(필수·0 금지 — 없는 조는 파일에서 뺀다)
//  ②③④ ×4 = コンペ番号(행사번호 — 手配書 묶음은 대표팀 행사번호: 같은 번호 = 한 컴페로 집계) · 플레이어번호(따옴표) · "영문명-태그코드[묶음순번]"
//  ⑤⑥ 캐디(빈칸) ⑦ 스코어입력종별 0 ⑧ 스타트 예정 코스(MR_COURSE: 아소 0·소보 1·쿠주 2) ⑨ 스타트 예정시각(hhmm) ⑩ コンペ名(태그코드)
//  ⚠ 플레이어번호는 그날 고정이어야 한다 — 바뀌면 그때까지의 스코어가 지워진다(스펙 주의문).
//    그래서 marshal_player_no 에 한 번 준 번호를 붙들어 둔다(SQL 127).
function _cp932(ch){
  const cp=ch.codePointAt(0);
  if(cp<0x80) return [cp];                                            // ASCII
  if(cp>=0xFF61&&cp<=0xFF9F) return [cp-0xFF61+0xA1];                 // 반각 가타카나(1바이트)
  if(cp>=0x3041&&cp<=0x3093){ const b=0x829F+(cp-0x3041); return [b>>8,b&0xFF]; }   // 히라가나
  if(cp>=0x30A1&&cp<=0x30F6){ let b2=0x40+(cp-0x30A1); if(b2>=0x7F) b2++; return [0x83,b2]; } // 가타카나
  const X={0x30FC:[0x81,0x5B],0x30FB:[0x81,0x45],0x3000:[0x81,0x40],0xFF0D:[0x81,0x7C]};
  return X[cp]||[0x3F];                                               // 옮길 수 없는 글자는 '?'
}
function cp932Bytes(str){
  const out=[]; for(const ch of String(str==null?'':str)) out.push(..._cp932(ch));
  return new Uint8Array(out);
}
//  「KIM OK JU」 → 「KimOkJu」 (샘플 파일과 같은 표기)
function mrName(eng){
  return String(eng||'').trim().toLowerCase().split(/[^A-Za-z]+/).filter(Boolean)
    .map(w=>w[0].toUpperCase()+w.slice(1)).join('');
}
//  태그코드에서 그룹코드 3자만(영문2+가나1) — 샘플이 「WKﾓ」 형태다
function mrTag(t){ const m=String(t||'').match(/([A-Za-z]{2}[ぁ-ゖァ-ヶｦ-ﾝ])/); return m?m[1]:''; }   // 가나 = 히라가나·가타카나(전각/반각) 모두
//  가타카나는 반각으로(IC Green 표본 「WKﾓ」·「RRﾋ」 — 히라가나는 그대로 「HXめ」) — 마샬 화면에 지금 보이는 표기와 같게
const _KF='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンァィゥェォッャュョー', _KH='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝｧｨｩｪｫｯｬｭｮｰ';
const _KD='ガギグゲゴザジズゼゾダヂヅデドバビブベボ', _KDB='カキクケコサシスセソタチツテトハヒフヘホ', _KP='パピプペポ', _KPB='ハヒフヘホ';
function mrKanaHalf(str){
  return String(str||'').split('').map(ch=>{
    let k=_KF.indexOf(ch); if(k>=0) return _KH[k];
    k=_KD.indexOf(ch); if(k>=0) return _KH[_KF.indexOf(_KDB[k])]+'ﾞ';
    k=_KP.indexOf(ch); if(k>=0) return _KH[_KF.indexOf(_KPB[k])]+'ﾟ';
    if(ch==='ヴ') return 'ｳﾞ';
    return ch;
  }).join('');
}
//  手配書 묶음 순번 — __so_groupTags 가 준 태그 「DRヨ-Y2」의 끝 숫자(묶이지 않은 팀 「DRヨ-Y」는 없음)
function mrGrpNo(tag){ const m=String(tag||'').match(/(\d+)$/); return m?m[1]:''; }
//  ⑧ スタート予定コース — 18H 는 0:OUT 1:IN, 27H 는 「別途協議」. IC Green 표본은 0·1·2 세 값을 쓴다.
//  순서 = 아소 0 · 소보 1 · 쿠주 2 (Min 결정 2026-10-27 「이렇게 가정하고 진행」). 마샬 쪽 설정과 다르면 이 한 줄만 바꾼다(docs/marshal-ai-export.md).
const MR_COURSE={aso:0,sobo:1,kuju:2};
function mrCsvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
//  순수 부분 — BOARD 의 조(조원 있는 것만)·플레이어번호 맵·묶음 키(TG={seq:{key,rep}})로 CSV 본문을 만든다(검증용으로 분리)
//  コンペ番号: 묶음이면 그날 보드에 있는 대표팀(team_group_rep) 행사번호 → 없으면 그 묶음에서 그날 가장 작은 행사번호 → 묶음 아니면 자기 행사번호
function marshalLines(gs, NO, TG){
  TG=TG||{};
  let noCart=0, noEng=0, people=0;
  const keyOf=seq=>{ const t=TG[String(seq)]; return t&&t.key?t.key:''; };
  const anchors={};
  gs.forEach(g=>{ const k=keyOf(g.seq); if(!k) return; const sq=Number(g.seq); const a=anchors[k]||(anchors[k]={rep:0,min:sq});
    if(TG[String(g.seq)].rep) a.rep=sq; if(sq<a.min) a.min=sq; });
  const compNo=g=>{ const a=anchors[keyOf(g.seq)]; return String(a?(a.rep||a.min):(g.seq||0)); };
  const lines=[];
  gs.forEach(g=>{
    const cart=String(g.cart||'').replace(/[^0-9]/g,'');
    if(!cart||cart==='0'){ noCart++; return; }                    // ① 필수·0 금지 — 번호 없는 조는 파일에서 뺀다
    const ms=(g.members||[]).slice().sort((a,b)=>(a.sit||0)-(b.sit||0));
    const tag=mrKanaHalf(mrTag(g.tag||'')), gno=tag?mrGrpNo(g.tag||''):'', cno=compNo(g);
    const f=[cart];
    for(let i=0;i<4;i++){
      const m=ms[i];
      if(!m){ f.push('','',''); continue; }
      people++;
      const nm=mrName(m.eng); if(!nm) noEng++;
      f.push(cno, mrCsvCell(NO[m.id]||''), mrCsvCell((nm||'?')+(tag?('-'+tag+gno):'')));   // ② 컴페번호 ③ "플레이어번호" ④ "이름-태그순번"
    }
    f.push('','');                                  // ⑤⑥ 캐디
    f.push('0');                                    // ⑦ 스코어 입력 종별
    f.push(MR_COURSE[g.course]==null?'':String(MR_COURSE[g.course]));   // ⑧ 스타트 예정 코스
    f.push(String(Number(String(g.tee||'').replace(':',''))||''));   // ⑨ hhmm(앞 0 없이 — 표본과 같이)
    f.push(mrCsvCell(tag));                         // ⑩ 컴페명
    lines.push(f.join(','));
  });
  return { text: lines.length?lines.join('\r\n')+'\r\n':'', noCart, noEng, people, groups: lines.length };
}
async function downloadMarshal(){
  const btn=$('#btn-marshal');
  const gs=BOARD.filter(g=>(g.members||[]).length && g.slot).slice().sort((a,b)=>(a.slot-b.slot)||String(a.course).localeCompare(String(b.course)));
  if(!DATESEL||!gs.length){ toast(tx('mrNone'),'warn'); return; }
  if(btn) btn.disabled=true;
  try{
    // ① 그날 고정 플레이어번호 확보(없는 사람만 새로 받는다)
    const ids=[]; gs.forEach(g=>g.members.forEach(m=>{ if(m.id&&ids.indexOf(m.id)<0) ids.push(m.id); }));
    const {data:nos,error}=await supa.rpc('marshal_assign_player_no',{p_date:DATESEL,p_ids:ids});
    if(error) throw error;
    const NO={}; (nos||[]).forEach(r=>{ NO[r.member_id]=r.player_no; });
    // ② 한 조 = 한 줄
    const {text,noCart,noEng,people,groups}=marshalLines(gs,NO,TGA);
    if(!groups){ toast(tx('mrNoCart',noCart),'warn'); return; }
    const blob=new Blob([cp932Bytes(text)],{type:'text/csv'});
    const d=new Date(), z=n=>String(n).padStart(2,'0');
    const stamp=`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=`${stamp}PlayerFile.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },400);
    toast(tx('mrDone',groups,people),'ok');
    if(noCart) toast(tx('mrNoCart',noCart),'warn');
    if(noEng)  toast(tx('mrNoEng',noEng),'warn');
  }catch(e){ toast(tx('mrFail')+(e.message||e),'err'); }
  finally{ if(btn) btn.disabled=false; }
}
// ── 티오프 일괄 이동(Min 2026-09) — 비·안개로 시작을 미룰 때 코스(또는 전체)의 조를 한 칸(7분)씩 통째로 민다 ──
//   자리(slot) 단위라 7분 격자가 유지되고, 06:50 앞으로는 못 간다. 되돌리기 가능.
function shiftSlots(course, k){
  const gs=BOARD.filter(g=>g.slot && (!course || g.course===course));
  if(!gs.length){ toast(tx('shiftNone'),'warn'); return; }
  if(k<0 && gs.some(g=>g.slot+k<1)){ toast(tx('shiftNeg'),'err'); return; }
  snap();
  const maxSlot=Math.max(...gs.map(g=>g.slot+k));
  ensureSlots(Math.min(MAX_SLOT_N, maxSlot));
  if(maxSlot>SLOTS.length){ UNDO.pop(); toast(tx('shiftMax'),'err'); return; }
  gs.forEach(g=>{ g.slot+=k; g.tee=SLOTS[g.slot-1]||g.tee; });
  render(); touch();
  toast(tx('shiftDone',gs.length,k*7),'ok');
}

let WALK={};  // 당일 골프 손님(워크인) 부가정보 — 홀수·희망 티오프·연락처

}

let MONTHRUN=new Set();  // 이번 세션에 이달 자동배정을 이미 돌린 달(중복 실행 방지)

// 티오프 자리 — 기본은 6:50~8:42(7분 간격 17조). 팀이 많은 날은 필요한 만큼 뒤로 이어 붙인다.
//  (코스당 17조 × 3코스 = 51조. 성수기엔 67팀이 들어와 자리가 모자라므로 늘려야 전원 배정된다.)
const STD_SLOTS=(window.SZCore&&SZCore.teeSlots)?SZCore.teeSlots():[];
const STD_N=STD_SLOTS.length||17;
// 하루 자리의 끝 = 16:59(6:50부터 7분 간격). 늦게 나가는 팀도 손으로 넣을 수 있게 한다(Min 2026-08).
//   기본 화면은 지금처럼 짧게 두고, 표 아래 버튼으로 여기까지 늘린다.
const MAX_TEE='16:59';
const MAX_SLOT_N=Math.floor(((16*60+59)-(6*60+50))/7)+1;   // = 88
function makeSlots(n){
  const out=[]; let t=6*60+50;
  for(let i=0;i<Math.max(1,n);i++){ out.push(String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')); t+=7; }
  return out;
}
let SLOTS=STD_SLOTS.slice();
function ensureSlots(n){ if(n>SLOTS.length) SLOTS=makeSlots(Math.min(n,MAX_SLOT_N)); }
//  접었을 때 남길 줄 수 — 기본 17줄과 '조가 들어 있는 마지막 자리' 중 큰 쪽.
function minSlots(){ return Math.max(STD_N, BOARD.reduce((m,g)=>Math.max(m,g.slot||0),0)); }

function normGender(g){ g=String(g||'').trim(); if(/여|女/.test(g)||/^f/i.test(g))return '女'; if(/남|男/.test(g)||/^m/i.test(g))return '男'; return ''; }
function titleCase(s){ return String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()); }

function monthBounds(ym){const [y,m]=ym.split('-').map(Number);const start=`${y}-${String(m).padStart(2,'0')}-01`;const endD=new Date(y,m,0).getDate();const end=`${y}-${String(m).padStart(2,'0')}-${String(endD).padStart(2,'0')}`;return {start,end};}

}

async function pagedIn(table, cols, key, vals){
  const out=[]; const uniq=[...new Set(vals)];
  for(let i=0;i<uniq.length;i+=80){ const chunk=uniq.slice(i,i+80); let from=0;
    for(;;){ const {data,error}=await supa.from(table).select(cols).in(key,chunk).range(from,from+999); if(error)throw error; out.push(...(data||[])); if(!data||data.length<1000)break; from+=1000; } }
  return out;
}

async function load(){
  if(!supa)return;
  $('#ym-label').textContent=YM; $('#stat').textContent='…';
  try{
    const {start,end}=monthBounds(YM);
    const bs=[]; { let from=0;
      for(;;){ const {data,error}=await supa.from('bookings').select('event_seq,dep_date,arr_date,rep_name,origin')
          .lte('dep_date',end).gt('arr_date',start).neq('status','대기').order('event_seq').range(from,from+999);
        if(error)throw error; bs.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; } }
    const seqs=(bs||[]).map(b=>b.event_seq);
    const gs = seqs.length? await pagedIn('guests','event_seq,accom,group_code,team_tag','event_seq',seqs):[];
    const gmap={}; gs.forEach(g=>gmap[g.event_seq]=g);
    // 인원 = 명단 실제 행수(예약 pax보다 우선 — 방배정·정산과 같은 기준)
    const gms = seqs.length? await pagedIn('guest_members','id,event_seq,seq_in_team,name_kr,name_en,actual_dep','event_seq',seqs):[];
    const cnt={}; gms.forEach(m=>{ cnt[m.event_seq]=(cnt[m.event_seq]||0)+1; });
    // 대표 출발지(귀국 부산편 판정) + 성별(이름 매칭)
    const pxs = seqs.length? await pagedIn('passengers','event_seq,name_kr,gender,origin,dep_flight','event_seq',seqs):[];
    const oriMap={}; pxs.forEach(p=>{ if(oriMap[p.event_seq]==null) oriMap[p.event_seq]=SZCore.isPus(p.origin,p.dep_flight); });
    const genMap={}; pxs.forEach(p=>{ const k=p.event_seq+'|'+String(p.name_kr||'').trim(); if(!genMap[k]) genMap[k]=normGender(p.gender); });
    ROSTER={}; MIDEARLY={};
    gms.slice().sort((a,b)=>(a.seq_in_team||0)-(b.seq_in_team||0)).forEach(m=>{
      const nm=String(m.name_kr||'').trim();
      const early=m.actual_dep?String(m.actual_dep).slice(0,10):'';
      if(early) MIDEARLY[m.id]=early;
      (ROSTER[m.event_seq]=ROSTER[m.event_seq]||[]).push({ id:m.id, seq:m.event_seq,
        name:pn(nm,m.name_en)||nm||(m.name_en||'-'), kr:nm,
        eng:titleCase(m.name_en), gender:genMap[m.event_seq+'|'+nm]||'', early, sit:m.seq_in_team||0 });   // sit=팀 내 순번(마샬 명단에서 카트 안 사람 순서)
    });
    // 現地手配書에서 묶은 팀은 대표팀 코드+팀번호로 통일(手配書·航空カバー·네임택과 같은 코드)
    const GT=(window.__so_groupTags? await __so_groupTags(supa,seqs) : {});
    TGA=(window.__so_groupKeys? await __so_groupKeys(supa,seqs) : {});
    TEAMS=(bs||[]).map(b=>{ const g=gmap[b.event_seq]||{};
      return { seq:b.event_seq, dep:dstr(b.dep_date), arr:dstr(b.arr_date), accom:g.accom||'',
        tag:GT[b.event_seq]||(SZCore.tagStripSeq?SZCore.tagStripSeq(g.team_tag||g.group_code||''):(g.team_tag||g.group_code||'')),
        rep:b.rep_name||'', isPus: oriMap[b.event_seq]!=null?oriMap[b.event_seq]:SZCore.isPus(b.origin,''),
        pax: cnt[b.event_seq]||0 };
    }).filter(t=>t.pax>0);
    // 당일 골프 손님(워크인, SQL 123) — 숙박 예약에 없으므로 따로 읽어 같은 모양으로 붙인다.
    //  하루짜리 체류(dep=arr=그날)로 두면 golfRows 가 그날 1행만 만든다.
    WALK={};
    try{
      const {data:wk}=await supa.from('walkins')
        .select('event_seq,walk_date,name,pax,holes,tee_pref,course,phone,note')
        .gte('walk_date',start).lte('walk_date',end);
      (wk||[]).forEach(w=>{
        const d=dstr(w.walk_date);
        WALK[w.event_seq]={holes:w.holes||18, tee:w.tee_pref||'', course:w.course||'', phone:w.phone||'', note:w.note||''};
        TEAMS.push({ seq:w.event_seq, dep:d, arr:d, accom:'', walkin:true,
          tag:tx('wkTag'), rep:w.name||('#'+w.event_seq), isPus:false, pax:w.pax||1 });
        ROSTER[w.event_seq]=[];   // 명단 없음 — 조원은 사람이 확인해서 넣는다
      });
    }catch(e){}   // 테이블 미적용이면 조용히 넘어간다
    _todCache={};
    await loadMonthState();
    const ax=golfDates();
    if(DATESEL && !ax.includes(DATESEL)) DATESEL=null;
    if(!DATESEL && ax.length){
      const today=SZCore.fmtDate(new Date());
      DATESEL = ax.includes(today) ? today : (ax.find(d=>d>=today) || ax[0]);
    }
    renderDateChips();
    $('#stat').textContent=`${TEAMS.length}${tx('teamUnit')}`;
    if(DATESEL) await loadBoard(DATESEL); else render();
    // 날짜를 열지 않아도 그 달 전체가 배정돼 있게 — 부족한 날이 있으면 한 번 돌린다.
    if(!TV && !MONTHRUN.has(YM) && golfDates().some(d=>missOn(d)>0)){
      MONTHRUN.add(YM);
      await autoAssignMonth();
    }
  }catch(e){ toast(tx('loadFail')+': '+e.message,'err'); $('#stat').textContent=''; }
}

// 그 팀이 그날 라운딩하는가 + 홀수 — 규칙은 SZCore.golfRows 단일 진실원
function rowFor(t,date){
  if(t && t.walkin) return (t.dep===date)? {date, course:'やまなみCC', holes:(WALK[t.seq]||{}).holes||18, note:'当日'} : null;
  return SZCore.golfRows({dep:t.dep,arr:t.arr,accom:t.accom}, t.isPus).find(r=>r.date===date)||null;
}
// 그날 그 팀이 실제로 가는 골프장 — 수기 지정(play_course)이 규칙보다 우선.
//  주말·공휴일은 규칙(isNonWorkday)이 이미 야마나미로 계산한다.
//  현장에서 구주고원 라운딩이 안 되는 날만 사람이 야마나미로 옮긴다.
function venueOf(t,date){
  if(t && t.walkin) return 'やまなみCC';   // 당일 골프 손님은 여기서 친다
  const ov=(PCM[date]||{})[String(t.seq)];
  if(ov) return ov;
  const r=rowFor(t,date); return r?r.course:'';
}
//  이 화면은 야마나미CC 배정표다 — 구주고원으로 가는 팀은 자리를 잡지 않는다.
function atYamanami(t,date){ return venueOf(t,date)==='やまなみCC'; }
function holesOn(t,date){ const r=rowFor(t,date); if(!r) return 0;
  const ov=holesOv(date,t.seq); if(ov) return ov;   // 담당자가 지정한 홀수가 규칙보다 우선(Min 2026-08)
  // 평일 체류일은 18H + 9H 서비스 = 27H
  return /\+9H/.test(r.note||'') ? 27 : r.holes; }
function golfDates(){ const s=new Set();
  TEAMS.forEach(t=>SZCore.golfRows({dep:t.dep,arr:t.arr,accom:t.accom},t.isPus).forEach(r=>{ if(r.date.slice(0,7)===YM) s.add(r.date); }));
  return [...s].sort(); }
let _todCache={};
function clearTodCache(){ _todCache={}; }
function teamsOnDate(date){
  if(_todCache[date]) return _todCache[date];
  return (_todCache[date]=TEAMS.filter(t=>!!rowFor(t,date) && atYamanami(t,date)));
}
//  그날 구주고원CC 로 가는 팀(= 이 배정표에서 빠지는 팀). 현장 사정으로 옮길 때 여기서 고른다.
function teamsAtKuju(date){
  return TEAMS.filter(t=>!!rowFor(t,date) && venueOf(t,date)==='九重高原CC');
}
// 이름 표기 — 일본어 화면이면 가타카나(표시 전용, 검색은 원문도 같이 건다)
function pn(kr,en){ return window.__so_pname?__so_pname(kr,en):(kr||en||''); }
function isLate(t){ return String(t.accom||'').indexOf('쿠주')>=0; }
// 귀국일 라운딩(부산편 마지막 날) = 오전 18H 스루 → 맨 앞 티오프부터(Min 2026-10-25). 쿠주 숙박의 늦은 조 규칙보다 우선.
function isDepartRound(t,date){ return !!t && !t.walkin && String(t.arr||'')===String(date); }

// ── 일별 코스 로테이션(Min 2026-10-25 「매일 아소→소보→쿠주 순서로 로테이션」 = 팀 단위 「가」) ──
//  어제 아소에서 출발한 팀은 오늘 소보, 소보→쿠주, 쿠주→아소. 어제 기록이 없는 팀(첫날)은 가장 덜 찬 코스(기존 규칙).
//  어제가 지금 보고 있는 날짜면 화면(BOARD), 아니면 월 상태(MONTHG — 월초는 전달 말일까지 읽어 둔다).
function prefCourse(seq, date){
  const pd=prevDayOf(date); if(!pd||!SZCore.nextStartCourse) return null;
  const src=(pd===DATESEL && BOARD.length)? BOARD.map(g=>({event_seq:g.seq,course_code:g.course,slot_no:g.slot})) : (MONTHG[pd]||[]);
  const prev=src.filter(g=>String(g.event_seq)===String(seq) && g.course_code).sort((a,b)=>(a.slot_no||0)-(b.slot_no||0));
  if(!prev.length) return null;
  return SZCore.nextStartCourse(prev[0].course_code);
}
// ── 샷건 플레이 날(SQL 144 golf_day_settings) ──────────────────────────────
//  그날 전 조가 같은 시각에 조별 스타트 홀(1~9)에서 동시에 출발한다. 홀은 첫날 자동으로 뽑고(랜덤), 조를 골라 바꿀 수 있다.
function isShotgun(date){ const d=DAYSET[date||DATESEL]; return !!(d&&d.shotgun); }
function shotgunTime(date){ const d=DAYSET[date||DATESEL]; return (d&&d.shotgun_time)||''; }
//  코스마다 조에 1~9 홀을 겹치지 않게 뽑는다(9조를 넘으면 두 바퀴). force=false 면 비어 있는 조만. 바뀐 게 있으면 true.
function assignStartHoles(force){
  let changed=false;
  COURSES.forEach(c=>{
    const gs=BOARD.filter(g=>g.course===c.code).sort((a,b)=>(a.slot||0)-(b.slot||0));
    const used=new Set(force?[]:gs.filter(g=>g.hole).map(g=>g.hole));
    let pool=[];
    gs.forEach(g=>{
      if(g.hole && !force) return;
      if(!pool.length){
        pool=[1,2,3,4,5,6,7,8,9].filter(h=>!used.has(h)); if(!pool.length){ pool=[1,2,3,4,5,6,7,8,9]; used.clear(); }
        for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
      }
      g.hole=pool.shift(); used.add(g.hole); changed=true;
    });
  });
  return changed;
}
async function toggleShotgun(){
  if(!DATESEL||!supa) return;
  const by=(window.__so_getUser&&__so_getUser())||null;
  const cur=DAYSET[DATESEL]||{shotgun:false,shotgun_time:'',note:''};
  const on=!cur.shotgun;
  const row={play_date:DATESEL, shotgun:on, shotgun_time:cur.shotgun_time||(on?'08:00':null), note:cur.note||null, updated_by:by, updated_at:new Date().toISOString()};
  try{
    const {error}=await supa.from('golf_day_settings').upsert(row,{onConflict:'play_date'}); if(error) throw error;
    DAYSET[DATESEL]={shotgun:on, shotgun_time:row.shotgun_time||'', note:cur.note||''};
    if(on && assignStartHoles(false)) touch();   // 홀이 없는 조에 첫날 랜덤 배정 → 저장
    render(); toast(tx('exSaved'),'ok');
  }catch(e){ toast(tx('exFail',e.message),'err'); }
}
async function setShotgunTime(t){
  if(!DATESEL||!supa) return;
  const by=(window.__so_getUser&&__so_getUser())||null;
  const cur=DAYSET[DATESEL]||{shotgun:true,shotgun_time:'',note:''};
  try{
    const {error}=await supa.from('golf_day_settings').upsert({play_date:DATESEL, shotgun:!!cur.shotgun, shotgun_time:t||null, note:cur.note||null, updated_by:by, updated_at:new Date().toISOString()},{onConflict:'play_date'});
    if(error) throw error;
    DAYSET[DATESEL]={...cur, shotgun_time:t||''}; render(); toast(tx('exSaved'),'ok');
  }catch(e){ toast(tx('exFail',e.message),'err'); }
}
// ── 대여 물품(우산, SQL 144 golf_lends) — 조 단위로 누가 언제 빌려주고 돌려받았는지 ──
function lendsOf(g){ return (g&&g.id&&LENDS[g.id])||[]; }
function lendOut(g){ return lendsOf(g).filter(x=>!x.returned_at).reduce((n,x)=>n+(x.qty||0),0); }
function lendBack(g){ return lendsOf(g).filter(x=>!!x.returned_at).reduce((n,x)=>n+(x.qty||0),0); }
function hhmmOf(ts){ if(!ts) return ''; const d=new Date(ts); if(isNaN(d)) return ''; return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
async function lendUmbrella(gi, qty){
  const g=BOARD[gi]; if(!g||!supa) return;
  qty=Math.max(1,Math.min(20,parseInt(qty,10)||1));
  const by=(window.__so_getUser&&__so_getUser())||null;
  try{
    if(!g.id){ await save(true); if(!g.id) throw new Error('unsaved'); }   // 저장 전인 조는 먼저 저장해 id 를 받는다
    const {data,error}=await supa.from('golf_lends').insert({group_id:g.id, play_date:DATESEL, event_seq:g.seq, item:'umbrella', qty, lent_by:by})
      .select('id,group_id,event_seq,item,qty,lent_by,lent_at,returned_by,returned_at').single();
    if(error) throw error;
    (LENDS[g.id]=LENDS[g.id]||[]).push(data||{id:'', group_id:g.id, qty, lent_by:by, lent_at:new Date().toISOString(), returned_at:null});
    render(); toast(tx('exSaved'),'ok');
  }catch(e){ toast(tx('exFail',e.message),'err'); }
}
async function returnLend(id){
  if(!supa||!id) return;
  const by=(window.__so_getUser&&__so_getUser())||null;
  const now=new Date().toISOString();
  try{
    const {error}=await supa.from('golf_lends').update({returned_at:now, returned_by:by}).eq('id',id); if(error) throw error;
    Object.values(LENDS).forEach(arr=>arr.forEach(x=>{ if(String(x.id)===String(id)){ x.returned_at=now; x.returned_by=by; } }));
    render(); toast(tx('exSaved'),'ok');
  }catch(e){ toast(tx('exFail',e.message),'err'); }
}

// 그 달의 저장된 조·제외를 한 번에 읽어 날짜 칩 배지(미배정 N)를 만든다.
async function loadMonthState(){
  MONTHG={}; SKIPM={}; HOLESM={}; ABSM={}; PCM={}; DAYSET={};
  const {start,end}=monthBounds(YM);
  try{
    let from=0;
    for(;;){
      // 조원(golf_group_members)도 같이 — 「전날 조 유지」가 어제 누가 누구와 한 조였는지 본다
      //  하루 앞(전달 말일)까지 읽는다 — 월초에도 「어제 출발 코스」(일별 로테이션)·「전날 조 유지」가 보이도록
      const {data,error}=await supa.from('golf_groups').select('id,play_date,event_seq,course_code,slot_no,capacity,assign_source,golf_group_members(member_id,seq)')
        .gte('play_date',prevDayOf(start)||start).lte('play_date',end).order('play_date').range(from,from+999);
      if(error) throw error;
      (data||[]).forEach(g=>{ const d=dstr(g.play_date);
        g.members=(g.golf_group_members||[]).slice().sort((a,b)=>(a.seq||0)-(b.seq||0)).map(x=>String(x.member_id)); delete g.golf_group_members;
        (MONTHG[d]=MONTHG[d]||[]).push(g); });
      if(!data||data.length<1000) break; from+=1000;
    }
  }catch(e){}
  try{
    const {data}=await supa.from('golf_skips').select('play_date,event_seq').gte('play_date',start).lte('play_date',end);
    (data||[]).forEach(x=>{ const d=dstr(x.play_date); (SKIPM[d]=SKIPM[d]||new Set()).add(String(x.event_seq)); });
  }catch(e){}
  // 샷건 날 설정(SQL 144) — 그날 전 조가 같은 시각에 조별 스타트 홀에서 출발
  try{
    const {data}=await supa.from('golf_day_settings').select('play_date,shotgun,shotgun_time,note').gte('play_date',start).lte('play_date',end);
    (data||[]).forEach(x=>{ DAYSET[dstr(x.play_date)]={shotgun:!!x.shotgun, shotgun_time:x.shotgun_time||'', note:x.note||''}; });
  }catch(e){}
  // 골프장 수기 지정(SQL 99) — 현장에서 구주고원 라운딩이 안 되는 날 야마나미로 옮긴 기록
  try{
    const {data}=await supa.from('play_course').select('play_date,event_seq,course').gte('play_date',start).lte('play_date',end);
    (data||[]).forEach(x=>{ const d=dstr(x.play_date); (PCM[d]=PCM[d]||{})[String(x.event_seq)]=x.course; });
  }catch(e){}   // 테이블 미적용이면 규칙대로
  // 라운딩 예외(SQL 106) — 팀 홀수 수기 지정 · 개인 불참
  try{
    const {data}=await supa.from('golf_holes').select('play_date,event_seq,holes,note').gte('play_date',start).lte('play_date',end);
    (data||[]).forEach(x=>{ const d=dstr(x.play_date); (HOLESM[d]=HOLESM[d]||{})[String(x.event_seq)]={holes:x.holes,note:x.note||''}; });
  }catch(e){}
  try{
    const {data}=await supa.from('golf_absentees').select('play_date,member_id,event_seq,reason').gte('play_date',start).lte('play_date',end);
    (data||[]).forEach(x=>{ const d=dstr(x.play_date); (ABSM[d]=ABSM[d]||new Map()).set(String(x.member_id),{seq:String(x.event_seq),reason:x.reason||''}); });
  }catch(e){}
}
// 검색 — 팀(태그·대표·행사번호) + 그 팀 팀원 이름/영문명까지 훑는다
function qOn(){ return (CQ||'').trim().toLowerCase(); }
function teamHit(seq){
  const q=qOn(); if(!q) return true;
  const t=TEAMS.find(x=>String(x.seq)===String(seq)); if(!t) return false;
  const base=[t.tag,t.rep,pn(t.rep,''),t.seq,t.accom].filter(Boolean).join(' ').toLowerCase();
  if(base.includes(q)) return true;
  return (ROSTER[String(seq)]||[]).some(m=>((m.name||'')+' '+(m.kr||'')+' '+(m.eng||'')).toLowerCase().includes(q));
}
// 그 날짜 예외 조회 헬퍼
function holesOv(date,seq){ const m=HOLESM[date]; const v=m&&m[String(seq)]; return v?v.holes:0; }
function absMap(date){ return ABSM[date]||new Map(); }
//  조기퇴실(room.html 🛫, actual_dep)한 사람은 그날부터 라운딩에도 없다 — 별도 표시 없이 자동 제외(Min 2026-08).
function earlyGone(date,mid){ const d=MIDEARLY[mid]; return !!(d && d<=date); }
function isAbsent(date,mid){ return absMap(date).has(String(mid)) || earlyGone(date,mid); }
function skipOn(date,seq){ const s=SKIPM[date]; return !!(s&&s.has(String(seq))); }
// 그 날짜에 아직 출발 자리가 없는 팀 — 날짜 칩 배지와 화면 목록이 **같은 함수**를 쓴다.
//  (예전엔 칩은 MONTHG·SKIPM, 목록은 BOARD·SKIP 을 봐서 「✓ 인데 미배정이 있다」가 나왔다)
function unassignedTeams(date){
  // 선택한 날짜는 화면(BOARD)이 정답이지만, 아직 로드 전이라 비어 있으면 DB 현황을 쓴다
  //  (그렇지 않으면 「자리66」처럼 로드 직전 상태가 칩에 그대로 찍힌다)
  const cur = (DATESEL===date) && (BOARD.length>0 || !(MONTHG[date]||[]).length);
  const rows = cur ? BOARD.map(g=>({event_seq:g.seq, capacity:g.pax})) : (MONTHG[date]||[]);
  const skip = cur ? SKIP : (SKIPM[date]||new Set());
  const placed={}; rows.forEach(g=>{ placed[g.event_seq]=(placed[g.event_seq]||0)+(g.capacity||0); });
  return teamsOnDate(date).filter(t=>!skip.has(String(t.seq)) && (placed[t.seq]||0)<paxOn(date,t) && paxOn(date,t)>0);
}
function missOn(date){ return unassignedTeams(date).length; }
// 그 날짜에 **조편성이 미확정인 팀 수** — 배정은 자동으로 끝나므로 현장에 남은 일은 이것뿐이다.
//  (5명 이상 팀은 사람이 「✓ 이대로 확정」을 눌러야 끝난다)
function pendingTeams(date){
  const cur=(DATESEL===date) && (BOARD.length>0 || !(MONTHG[date]||[]).length);
  const rows = cur ? BOARD.map(g=>({event_seq:g.seq, assign_source:g.src})) : (MONTHG[date]||[]);
  const by={}; rows.forEach(r=>{ (by[r.event_seq]=by[r.event_seq]||[]).push(r); });
  return Object.keys(by).filter(seq=>teamPax(seq)>=5 && by[seq].some(r=>(r.assign_source||'auto')!=='manual'));
}

let FILLED=false;
let LOADSEQ=0;   // 마지막으로 시작된 loadBoard 번호(뒤늦게 깨어난 호출을 가려내는 표식)
// ── 조 중복·자리 충돌 점검(2026-10-25 사고: 「이달 전체 자동 배정」이 오래된 월 상태로 오늘 조를 다시 넣어 69조→138조) ──
//  dup  = 같은 팀 + 같은 조원 집합(조원 없으면 코스·슬롯·정원까지 같음) 조가 2개 이상 → 가장 늦게 만든 1개만 남긴다
//  coll = 같은 코스·같은 슬롯에 조 2개 이상(표는 한 칸에 하나만 그려 나머지가 숨는다) → 수기·먼저 만든 조가 자리를 지키고 나머지는 그 코스 빈 슬롯으로
let ISSUES={dup:[],coll:[]};
function groupKey(g){ const ms=(g.members||[]).map(m=>String(m.id)).sort(); return String(g.seq)+'|'+(ms.length?ms.join(','):('slot:'+(g.course||'')+'#'+(g.slot||'')+'/'+(g.pax||0))); }
function findBoardIssues(){
  const byKey={}; BOARD.forEach((g,i)=>{ const k=groupKey(g); (byKey[k]=byKey[k]||[]).push(i); });
  const dup=[];
  Object.values(byKey).forEach(ix=>{ if(ix.length<2) return;
    const sorted=ix.slice().sort((a,b)=>String(BOARD[b].cat||'').localeCompare(String(BOARD[a].cat||'')));   // 최신 먼저 → 그 뒤는 중복
    sorted.slice(1).forEach(i=>dup.push(i)); });
  const dupSet=new Set(dup);
  const bySlot={}; BOARD.forEach((g,i)=>{ if(dupSet.has(i)||!g.course||!g.slot) return; const k=g.course+'|'+g.slot; (bySlot[k]=bySlot[k]||[]).push(i); });
  const coll=[];
  Object.values(bySlot).forEach(ix=>{ if(ix.length<2) return;
    const sorted=ix.slice().sort((a,b)=>((BOARD[a].src==='manual'?0:1)-(BOARD[b].src==='manual'?0:1)) || String(BOARD[a].cat||'').localeCompare(String(BOARD[b].cat||'')));
    sorted.slice(1).forEach(i=>coll.push(i)); });
  return {dup,coll};
}
function renderIssues(){
  let bar=document.getElementById('issuebar');
  const n=ISSUES.dup.length, c=ISSUES.coll.length;
  if(!n && !c){ if(bar) bar.remove(); return; }
  if(!bar){ const b=$('#board'); if(!b||!b.parentNode) return; bar=document.createElement('div'); bar.id='issuebar'; bar.className='issuebar'; b.parentNode.insertBefore(bar,b); }
  bar.innerHTML=`<span>${tx('dupWarn',n,c)}</span><button class="btn sm" type="button" id="btn-fixdup">${tx('dupFix')}</button>`;
  $('#btn-fixdup').addEventListener('click',fixBoardIssues);
}
async function fixBoardIssues(){
  if(!supa||!DATESEL) return;
  const {dup,coll}=ISSUES; if(!dup.length && !coll.length) return;
  const btn=$('#btn-fixdup'); if(btn) btn.disabled=true;
  const by=(window.__so_getUser&&__so_getUser())||null;
  try{
    const ids=dup.map(i=>BOARD[i].id).filter(Boolean);
    if(ids.length){ const {error}=await supa.from('golf_groups').delete().in('id',ids); if(error) throw error; }   // 조원은 cascade
    const dupSet=new Set(dup); const movedG=coll.map(i=>BOARD[i]);
    BOARD=BOARD.filter((g,i)=>!dupSet.has(i)); DBIDS=BOARD.map(g=>g.id).filter(Boolean);
    movedG.forEach(g=>{ const used=new Set(BOARD.filter(x=>x!==g&&x.course===g.course).map(x=>x.slot)); let s=(g.slot||0)+1; while(used.has(s)) s++; g.slot=s; ensureSlots(s); g.tee=SLOTS[s-1]||g.tee; });
    try{ render(); }catch(e){}   // 그리기가 실패해도 DB 정리는 끝까지
    await save(true);
    try{ await supa.from('change_log').insert({ entity:'golf_groups', entity_id:DATESEL, action:'fix', label:`${DATESEL} 중복 ${ids.length}조 삭제 · 자리 충돌 ${movedG.length}조 이동`, changed_by:by }); }catch(e){}
    toast(tx('dupDone',ids.length,movedG.length),'ok');
    ISSUES={dup:[],coll:[]}; renderIssues();
    await loadBoard(DATESEL,true);
  }catch(e){ toast(tx('saveFail')+e.message,'err'); if(btn) btn.disabled=false; }
}

async function loadBoard(date, skipAuto){
  const myLoad=++LOADSEQ;
  const stale=()=>myLoad!==LOADSEQ;   // 내가 도는 사이 새 요청이 시작됐나
  BOARD=[]; DBIDS=[]; SELG=null; SKIP=new Set(); DRAG=null; SLOTS=STD_SLOTS.slice(); FILLED=false; LENDS={}; PEND=null; PICK=null;
  MULTI=false; MSEL=new Set(); EVQ={}; REL=null;
  try{
    const {data:sk}=await supa.from('golf_skips').select('event_seq').eq('play_date',date);
    if(stale()) return;
    (sk||[]).forEach(x=>SKIP.add(String(x.event_seq)));
  }catch(e){ /* 표가 없으면 제외 없음으로 */ }
  if(stale()) return;
  try{
    const gsel=()=>'id,event_seq,course_code,tee_time,slot_no,label,capacity,cart_no,note,assign_source,created_at,start_hole,pm_tee,pm_course'+(HAS_LUNCH?',lunch_after':'')+(HAS_CARTTYPE?',cart_type':'');
    let {data:grps,error}=await supa.from('golf_groups').select(gsel()).eq('play_date',date).order('slot_no',{nullsFirst:false});
    for(let k=0;k<2 && error;k++){   // SQL 146(lunch_after)·147(cart_type) 미적용 — 그 컬럼 없이 다시 읽는다
      const m=error.message||'';
      if(HAS_LUNCH && /lunch_after/i.test(m)) HAS_LUNCH=false; else if(HAS_CARTTYPE && /cart_type/i.test(m)) HAS_CARTTYPE=false; else break;
      ({data:grps,error}=await supa.from('golf_groups').select(gsel()).eq('play_date',date).order('slot_no',{nullsFirst:false}));
    }
    if(error) throw error;
    if(stale()) return;               // 늦게 온 응답 — 다른 날짜가 이미 올라와 있다
    const teams=teamsOnDate(date);
    const ghost=[];
    (grps||[]).forEach(g=>{
      const t=teams.find(x=>String(x.seq)===String(g.event_seq));
      // 예약이 지워졌거나 그날 라운딩 팀이 아니면 유령 조 → 화면에 올리지 않고 DB에서도 정리한다
      if(!t){ ghost.push(g.id); return; }
      DBIDS.push(g.id);
      BOARD.push({ id:g.id, seq:g.event_seq, course:g.course_code||'', slot:g.slot_no||null,
        tee:g.tee_time||(g.slot_no?SLOTS[g.slot_no-1]:''), pax:g.capacity||0,
        tag:(t?t.tag:'')||g.label||'', rep:t?t.rep:'', holes:t?holesOn(t,date):0,
        late:t?isLate(t):false, cart:g.cart_no||'', ctype:g.cart_type||'', note:g.note||'', src:g.assign_source||'auto', cat:g.created_at||'',
        hole:g.start_hole||null, pmTee:g.pm_tee||'', pmCourse:g.pm_course||'', lunch:g.lunch_after||null, members:[] });
    });
    if(ghost.length && !TV){
      try{ await supa.from('golf_group_members').delete().in('group_id',ghost);
           await supa.from('golf_groups').delete().in('id',ghost); }catch(e){}
    }
    // 조원(사람 배치) — 조편성을 이 화면에서 같이 한다
    const gids=BOARD.map(g=>g.id).filter(Boolean);
    if(gids.length){
      const gm=await pagedIn('golf_group_members','group_id,member_id,event_seq,seq','group_id',gids);
      if(stale()) return;
      const byG={}; (gm||[]).forEach(x=>{ (byG[x.group_id]=byG[x.group_id]||[]).push(x); });
      BOARD.forEach(g=>{
        g.members=(byG[g.id]||[]).sort((a,b)=>(a.seq||0)-(b.seq||0)).map(x=>{
          const r=(ROSTER[x.event_seq]||[]).find(m=>m.id===x.member_id);
          return r||{ id:x.member_id, seq:x.event_seq, name:'?', eng:'', gender:'' };
        });
      });
    }
    // 대여 물품(우산) — 그날 조 단위 대여·반납 기록(SQL 144)
    try{
      const {data:ld}=await supa.from('golf_lends').select('id,group_id,event_seq,item,qty,lent_by,lent_at,returned_by,returned_at').eq('play_date',date).order('lent_at');
      if(stale()) return;
      (ld||[]).forEach(x=>{ (LENDS[x.group_id]=LENDS[x.group_id]||[]).push(x); });
    }catch(e){}
    // 전기카트 신청 대수(카트 배차표와 같은 행, 취소분 제외) — 셀 배지·퀵 액션·손님 화면 EV 표시
    try{
      let {data:cb,error:ce}=await supa.from('cart_bookings').select('event_seq,qty,cancelled').eq('play_date',date).eq('cart_code','electric');
      if(ce && /cancelled/i.test(ce.message||'')) ({data:cb,error:ce}=await supa.from('cart_bookings').select('event_seq,qty').eq('play_date',date).eq('cart_code','electric'));
      if(stale()) return;
      (cb||[]).forEach(x=>{ const q=String(x.event_seq); EVQ[q]=(EVQ[q]||0)+Math.max(0,(x.qty||0)-(x.cancelled||0)); });
    }catch(e){}
    // 손님 화면 공개 상태(SQL 146) — 없으면 실시간(종전)
    if(HAS_REL){
      try{
        const {data:rl,error:re}=await supa.from('signage_release').select('mode,payload,released_at,released_by').eq('play_date',date).eq('screen','course').maybeSingle();
        if(stale()) return;
        if(re){ if(/signage_release|schema cache/i.test(re.message||'')) HAS_REL=false; }
        else REL=rl?{mode:rl.mode, payload:rl.payload, released_at:rl.released_at, released_by:rl.released_by||''}:null;
      }catch(e){}
    }
    ISSUES=findBoardIssues();   // 같은 조가 두 번 저장됐거나 같은 자리에 두 조 — 띠로 알리고 [정리]로 고친다
    applyAbsentToBoard();   // 저장된 조에도 이미 불참·조기퇴실인 사람이 남아있으면 빼둔다
    // 조원이 비어 있는 조는 기본값(팀 안 명단 순서)으로 채운다 —
    //  사람이 확인(manual)한 조는 손대지 않는다.
    const need=[...new Set(BOARD.filter(g=>g.src!=='manual').map(g=>g.seq))]
      .filter(seq=>{
        const gs=BOARD.filter(g=>String(g.seq)===String(seq));
        const have=gs.reduce((n,g)=>n+((g.members||[]).length),0);
        return have < Math.min(teamPax(seq), gs.reduce((n,g)=>n+(g.pax||0),0));
      });
    if(need.length){ need.forEach(fillTeamMembers); if(!TV) FILLED=true; }
  }catch(e){ /* 없으면 빈 표 */ }
  // 저장된 조가 기본 17자리를 넘으면 표를 그만큼 늘려야 보인다(연장 줄)
  if(stale()) return;
  ensureSlots(BOARD.reduce((m,g)=>Math.max(m,g.slot||0),0));
  render(); if(!TV) renderIssues();
  // 배정이 모자란 날이면 빈 자리에만 자동으로 채운다(기존 조는 그대로 — 수기 조정 보호)
  //  ⚠ 여기서부터는 DB 에 쓴다 — 늦게 온 호출이 남의 날짜를 덮지 않도록 반드시 확인 후 진행
  if(!TV && !skipAuto && !stale() && missOn(date)>0){
    const {rows,slots}=planDate(date, BOARD.map(g=>({event_seq:g.seq,course_code:g.course,slot_no:g.slot,capacity:g.pax})), 0);
    if(rows.length){
      SLOTS=slots;
      rows.forEach(r=>BOARD.push({ seq:r.seq, course:r.course, slot:r.slot, tee:r.tee, pax:r.pax,
        tag:r.tag, rep:r.rep, holes:r.holes, late:r.late, cart:'', ctype:'', note:'', src:'auto', members:[] }));
      [...new Set(rows.map(r=>r.seq))].forEach(fillTeamMembers);
      if(stale()) return;
      render();
      await save();
    }
  } else if(FILLED && !TV && !stale()){ await save(true); }
  // 샷건 날인데 스타트 홀이 없는 조가 있으면 자동으로 뽑아 둔다(첫날 랜덤 — Min 2026-10-25)
  if(!TV && !stale() && isShotgun(date) && BOARD.some(g=>!g.hole)){ if(assignStartHoles(false)){ render(); await save(true); } }
  // 카트 번호 — 비어 있는 조만 자동 배분(조당 1대 · 전기 신청 팀=전기 · 2명=2인승 · 그 외 4인승, Min 2026-10-26). 번호 풀은 카트 관리표의 등록 번호.
  if(!TV && !stale() && BOARD.some(g=>!g.cart)){ try{ await loadUnits(); if(!stale() && autoCartNos(false).changed){ render(); await save(true); } }catch(e){} }
}

// ── 카트 번호 풀·자동 배분(Min 2026-10-26 「조당 카트 한 대 · 전기 신청 팀은 전기 · 그 외 4인승 · 2명은 2인승 · 번호는 조별 하나」) ─────
//  번호의 단일 진실원 = golf_groups.cart_no(+cart_type, SQL 147). 카트 관리표(cart.html)는 이 값을 읽어 보여 주고, 번호 레지스트리(cart_units)를 등록한다.
async function loadUnits(force){
  if(!supa) return UNITS;
  if(!force && UNITS_AT && Date.now()-UNITS_AT<5*60*1000) return UNITS;
  const out={};
  try{   // 등록이 없는 종류는 cart_types 의 번호 범위(numbers) 또는 1..보유 대수
    const {data:ts}=await supa.from('cart_types').select('code,total_count,numbers,active,sort_order').order('sort_order');
    (ts||[]).forEach(t=>{ if(t.active===false) return;
      const nums=(SZCore.parseCartNos?SZCore.parseCartNos(t.numbers||''):[]);
      out[t.code]=nums.length?nums:Array.from({length:Math.max(0,+t.total_count||0)},(_,i)=>String(i+1)); });
  }catch(e){}
  try{   // 레지스트리가 있는 종류는 그것만(사용 불가=active false 는 뺀다)
    const {data:us,error}=await supa.from('cart_units').select('cart_code,no,active,sort_order').order('sort_order').order('no');
    if(!error && us && us.length){
      const by={}; us.forEach(u=>{ (by[u.cart_code]=by[u.cart_code]||[]).push(u); });
      Object.keys(by).forEach(c=>{ out[c]=by[c].filter(u=>u.active!==false).sort((a,b)=>((a.sort_order||0)-(b.sort_order||0))||cartNoCmp(a.no,b.no)).map(u=>String(u.no)); });
    }
  }catch(e){}
  UNITS=out; UNITS_AT=Date.now(); return UNITS;
}
function cartNoCmp(a,b){ const x=parseInt(String(a).replace(/\D/g,''),10), y=parseInt(String(b).replace(/\D/g,''),10); if(!isNaN(x)&&!isNaN(y)&&x!==y) return x-y; return String(a).localeCompare(String(b)); }
function cartTypeS(c){ const m=tx('ctypeS'); return (m&&typeof m==='object'&&m[c])||''; }
function cartTypeL(c){ const m=tx('ctypeL'); return (m&&typeof m==='object'&&m[c])||''; }
function cartPaxOf(g){ return (g.members&&g.members.length)||g.pax||0; }
function cartOrder(){ return BOARD.map((g,i)=>i).sort((a,b)=>((BOARD[a].slot||0)-(BOARD[b].slot||0))||((CIDX[BOARD[a].course]??9)-(CIDX[BOARD[b].course]??9))); }
// 조가 받아야 할 종류: 전기 신청 팀은 신청 대수만큼 앞 조부터 전기, 그 외 2명 이하=2인승 · 3명 이상=4인승
function cartWantOf(g, evLeft){
  const k=String(g.seq);
  if(evLeft && evLeft[k]>0){ evLeft[k]--; return 'electric'; }
  return cartPaxOf(g)<=2?'gas2':'gas4';
}
function cartFallback(want){ return want==='electric'?['gas4','gas2']:want==='gas2'?['gas4']:['gas2']; }   // 모자라면 다른 가솔린으로(전기 부족도 가솔린)
function cartUsed(except){ const u=new Set(); BOARD.forEach(g=>{ if(g!==except && g.cart) u.add((g.ctype||'')+'|'+g.cart); }); return u; }
// 그날 조에 카트 번호를 배분한다. force=false 는 비어 있는 조만(이미 있는 번호는 그대로·풀에서 제외), force=true 는 전 조 처음부터.
function autoCartNos(force){
  const res={changed:false, n:{electric:0,gas2:0,gas4:0}, miss:[], fallback:0};
  const order=cartOrder(); if(!order.length) return res;
  const pool={}; CTYPES.forEach(c=>{ pool[c]=(UNITS[c]||[]).map(String); });
  const evLeft={}; Object.keys(EVQ).forEach(k=>{ evLeft[k]=EVQ[k]||0; });
  const take=(c,no)=>{ const i=(pool[c]||[]).indexOf(String(no)); if(i>=0) pool[c].splice(i,1); return i>=0; };
  if(force){ order.forEach(i=>{ const g=BOARD[i]; if(g.cart||g.ctype){ g.cart=''; g.ctype=''; res.changed=true; } }); }
  else{   // 남길 번호 — 종류가 없는 옛 번호는 규칙으로 종류를 붙인다. 등록 안 된 번호도 다른 풀에서 빼 둔다(겹침 방지)
    order.forEach(i=>{ const g=BOARD[i]; if(!g.cart) return;
      let c=g.ctype;
      if(!CTYPES.includes(c)){ c=cartWantOf(g,evLeft); g.ctype=c; res.changed=true; }
      else if(c==='electric' && evLeft[String(g.seq)]>0) evLeft[String(g.seq)]--;
      if(!take(c,g.cart)) CTYPES.some(o=>o!==c && take(o,g.cart));
    });
  }
  order.forEach(i=>{ const g=BOARD[i]; if(g.cart) return;
    const want=cartWantOf(g,evLeft);
    let c=want, no=(pool[c]||[]).shift();
    if(!no){ for(const o of cartFallback(want)){ no=(pool[o]||[]).shift(); if(no){ c=o; res.fallback++; break; } } }
    if(!no){ res.miss.push(i); if(g.ctype!==want){ g.ctype=want; res.changed=true; } return; }
    g.cart=String(no); g.ctype=c; res.n[c]++; res.changed=true;
  });
  return res;
}
// 표 위 요약 — 카트 없는 조 · 전기 신청 대수와 전기 카트 수가 다른 팀
function cartIssues(){
  const out={miss:0, ev:0, n:{electric:0,gas2:0,gas4:0}};
  const bySeq={};
  BOARD.forEach(g=>{ if(!g.cart) out.miss++; else if(out.n[g.ctype]!=null) out.n[g.ctype]++;

  return out;
}

function isSkip(seq){ return SKIP.has(String(seq)); }
// 2~4명 팀은 그대로 한 조 = 나눌 여지가 없다 → 조원까지 자동으로 채운다.
// 5명 이상은 「누구와 누구를 한 조로」를 사람이 정해야 한다 → 조만 잡아두고 조원은 비워 확인 대기로 둔다.
// 그날 불참(golf_absentees) 인원 수 — 조 인원 계산은 모두 이 값을 뺀 '실제 나가는 인원' 기준
function absCount(date,seq){ return (ROSTER[seq]||[]).filter(m=>isAbsent(date,m.id)).length; }
function paxOn(date,t){ return Math.max(0,(t.pax||0)-absCount(date,t.seq)); }
function teamPax(seq){ const t=TEAMS.find(x=>String(x.seq)===String(seq)); return t?paxOn(DATESEL,t):0; }
// 조원은 **그 팀 안에서** 명단 순서대로 나눈다(1조=1~4번, 2조=5~8번 …).
//  8명이면 2조, 9~12명이면 3조 — 사람이 따로 정하지 않아도 되게 기본값을 채워 둔다.
//  5명 이상 팀은 이 기본값을 사람이 한 번 「확인」한다(그때 assign_source 가 manual 이 된다).
// ── 전날 조 유지(연속일 규칙, Min 2026-09) ─────────────────────────────────
//  같은 팀이 어제도 라운딩했으면 어제의 조 구성(누가 누구와)을 오늘 그대로 이어받는다.
//  사람이 첫날 한 번 정하면 체류 내내 유지되고, 오늘 없는 사람(불참·조기퇴실)은 빠지고 새 사람은 빈자리부터 채운다.
//  → {sizes:[4,3], roster:[조1 순서…, 조2 순서…]} 또는 null(어제 조가 없으면 명단 순서 기본값).
function prevDayOf(date){ const d=SZCore.parseLocalDate(date); if(!d||isNaN(d)) return ''; d.setDate(d.getDate()-1); return dstr(d); }
function carryFor(seq, date){
  const pd=prevDayOf(date); if(!pd) return null;
  const prev=(MONTHG[pd]||[]).filter(g=>String(g.event_seq)===String(seq) && g.members && g.members.length)
    .sort((a,b)=>(a.slot_no||0)-(b.slot_no||0));
  if(!prev.length) return null;
  const present=(ROSTER[seq]||[]).filter(m=>!isAbsent(date,m.id));
  if(!present.length) return null;
  const byId={}; present.forEach(m=>{ byId[String(m.id)]=m; });
  const used=new Set();
  const parts=prev.map(g=>g.members.map(id=>byId[id]).filter(m=>m&&!used.has(String(m.id))&&(used.add(String(m.id)),true)));
  const left=present.filter(m=>!used.has(String(m.id)));
  // 새 사람은 자리가 남는 조부터, 그래도 남으면 새 조(4명씩)
  left.forEach(m=>{ const p=parts.find(x=>x.length<4); if(p) p.push(m); else parts.push([m]); });
  const out=parts.filter(p=>p.length);
  if(!out.length) return null;
  return { sizes:out.map(p=>p.length), roster:out.flat(), prevDate:pd };
}
//  이 조가 어제의 어느 조와 같은 사람들인가(표시용 배지)
function isCarried(g){
  if(!g||!g.members||g.members.length<2) return false;
  const pd=prevDayOf(DATESEL); const prev=(MONTHG[pd]||[]).filter(x=>String(x.event_seq)===String(g.seq)&&x.members&&x.members.length);
  const mine=g.members.map(m=>String(m.id)).sort().join(',');
  return prev.some(x=>x.members.slice().sort().join(',')===mine);
}
function fillTeamMembers(seq){
  const gs=BOARD.filter(g=>String(g.seq)===String(seq)).sort((a,b)=>(a.slot||0)-(b.slot||0));
  if(!gs.length) return;
  const cf=carryFor(seq,DATESEL);   // 어제 조가 있으면 그 순서(같은 조끼리 붙어 있다)로 채운다
  const roster=cf ? cf.roster : (ROSTER[seq]||[]).filter(m=>!isAbsent(DATESEL,m.id));   // 불참자는 조에 넣지 않는다
  let i=0;
  gs.forEach(g=>{ g.members=roster.slice(i, i+(g.pax||4)); i+=(g.pax||4); });
}
//  워크인은 명단(guest_members)이 없어 조원을 자동으로 채울 수 없다 →
//   인원이 적어도 사람이 한 번 확인해야 한다(5명 이상 팀과 같은 이유).
function isWalkinSeq(seq){ const t=TEAMS.find(x=>String(x.seq)===String(seq)); return !!(t&&t.walkin); }
function needsCheck(g){ return (isWalkinSeq(g.seq) || teamPax(g.seq)>=5) && g.src!=='manual'; }

//  이 표는 야마나미CC 배정표라 그 팀들은 자리를 잡지 않는다.
//  현장에서 구주고원 라운딩이 안 되는 날만 사람이 야마나미로 옮긴다(play_course).

//  골프장 수기 지정 저장 — 옮기면 그 팀이 배정표에 나타나고, 되돌리면 사라진다.
async function setVenue(seq, course){

  }catch(e){ toast(tx('kjFail',e.message||e),'err'); }

// 그날 라운딩하지 않는 팀 — 규칙(상품명)으로는 라운딩일이지만 실제로는 안 나가는 경우.
//  제외하면 자동 배정에서 빠지고, 이미 잡힌 조도 표에서 내린다(성수기 티오프 자리 확보).
// 제외로 넘기기(조를 다 뺐을 때 자동 호출)
async function markSkip(seq){

      (SKIPM[DATESEL]=SKIPM[DATESEL]||new Set()).add(String(seq));

      BOARD=BOARD.filter(g=>String(g.seq)!==String(seq));
      SELG=null; touch(); toast(tx('exclDone'),'ok');

  }catch(e){ toast(tx('saveFail')+e.message,'err'); return; }

// 같은 팀이 두 조 이상이면 몇 조인지 — 같은 이름이 두 번 보이는 혼동을 막는다
function gnoOf(i){
  const g=BOARD[i]; if(!g) return 0;
  const mine=BOARD.map((x,k)=>({x,k})).filter(o=>String(o.x.seq)===String(g.seq))
    .sort((a,b)=>(a.x.slot||0)-(b.x.slot||0));
  if(mine.length<2) return 0;
  return mine.findIndex(o=>o.k===i)+1;
}
function groupAt(course,slot){ return BOARD.findIndex(g=>g.course===course && g.slot===slot); }

// 선택 안내 — 고른 조가 무엇인지, 다음에 무엇을 하면 되는지 화면 아래에 보여 준다.
// ── 변경 확인(Min 2026-10-25 「누르고 누르면 아래에 뭘 뭐로 바꾸는지 나오게」) ──────────────
//  조 이동(조 클릭 → 자리 클릭)·조편성 재확인의 이름 맞바꾸기(이름 → 이름)·이름 이동(이름 → 조)은
//  바로 바뀌지 않고 PEND 에 담아 아래 바에 「무엇 → 무엇」을 띄운다 → [변경]으로 적용, [취소]·ESC 로 그만.
//  ≡ 드래그는 손으로 끌어 놓는 동작이라 그대로 바로 옮긴다.
function gLabel(g,gi){
  if(!g) return '';
  const no=(gi!=null&&gi>=0)?gnoOf(gi):0;
  return `<b>${esc(g.tag||('#'+g.seq))}</b>${no?` ${esc(tx('grpNo',no))}`:''} ${esc(courseL(g.course))} ${esc(g.tee||'')}`;
}
//  moveGroup 과 같은 판정 — 빈 칸 / 끼워넣기(아래로 밀기) / 맞바꾸기(아래가 끝까지 찼을 때)
function moveKind(gi, course, slot){
  const col=BOARD.filter((x,i)=>i!==gi && x.course===course);
  const taken=new Set(col.map(x=>x.slot));
  const other=col.find(x=>x.slot===slot);
  if(!other) return {kind:'free'};
  for(let sN=slot+1; sN<=SLOTS.length; sN++){ if(!taken.has(sN)) return {kind:'shift', other}; }
  return {kind:'swap', other};
}
function pendHTML(){
  if(!PEND) return '';
  if(PEND.kind==='move'){
    const g=BOARD[PEND.gi]; if(!g) return '';
    const mk=moveKind(PEND.gi, PEND.c, PEND.slot);
    const to=`${esc(courseL(PEND.c))} ${esc(SLOTS[PEND.slot-1]||'')}`;
    const ot=mk.other?(mk.other.tag||('#'+mk.other.seq)):'';
    const how= mk.kind==='free'? tx('pendFree') : mk.kind==='shift'? tx('pendShift',ot) : tx('pendSwapG',ot);

function applyPend(){

  if(p.kind==='swap'){

// ── 팀 색(Min 2026-10-25 「○○○님 팀 표기 + 합동 조 색 구분 방안」) ───────────────
//  그날 팀마다 색을 하나씩(예약번호 순, 팔레트 순환). 조 칸 왼쪽 띠가 그 팀 색.
//  다른 팀 사람이 들어온 합동 조는 띠가 두 색(그라데이션)이 되고 「+○○○님 팀」 알약이 붙으며,
//  재확인·조편성 패널의 이름 칩은 각자 팀 색 테두리를 받는다 → 누가 어느 팀인지 보인다.
const TCOL=['#5a7a52','#2f6f8f','#9a7322','#8a4f9e','#c0392b','#1a4d8f','#2e8b7a','#b5651d','#6d6d2e','#7a3b5e','#3d7a9e','#9e3d3d'];
let _tcMap=null;
function teamColor(seq){
  if(!_tcMap){ _tcMap={}; teamsOnDate(DATESEL).map(t=>String(t.seq)).sort().forEach((q,i)=>{ _tcMap[q]=TCOL[i%TCOL.length]; }); }
  return _tcMap[String(seq)]||TCOL[0];
}
//  조에 든 팀들(앞 = 조의 팀, 뒤 = 다른 팀) — 같은 색이 겹치면 뒤 팀은 다음 색으로
function groupTeams(g){
  const main=String(g.seq); const others=[]; (g.members||[]).forEach(m=>{ const q=String(m.seq||main); if(q!==main && !others.includes(q)) others.push(q); });
  const cols={}; const used=new Set(); [main,...others].forEach(q=>{ let c=teamColor(q); let k=0; while(used.has(c) && k<TCOL.length){ c=TCOL[(TCOL.indexOf(c)+1)%TCOL.length]; k++; } used.add(c); cols[q]=c; });
  return {main, others, cols};
}
function memberColor(g,m){ const gt=groupTeams(g); if(!gt.others.length) return ''; return gt.cols[String(m.seq||g.seq)]||''; }
function teamRep(seq){ const t=TEAMS.find(x=>String(x.seq)===String(seq)); return t?(pn(t.rep,'')||t.tag||('#'+seq)):('#'+seq); }
function teamStripeHTML(g){

  const bg = cs.length===1 ? cs[0] : `linear-gradient(to bottom, ${cs.map((c,i)=>`${c} ${Math.round(i*100/cs.length)}% ${Math.round((i+1)*100/cs.length)}%`).join(', ')})`;
  return `<span class="tcol" style="background:${bg}" title="${esc(teamRep(gt.main))}${esc(tx('teamOf'))}${gt.others.map(q=>' + '+esc(teamRep(q))+esc(tx('teamOf'))).join('')}"></span>`;
}
function plusTeamsHTML(g){

// ── 여러 조 일괄 이동(Min 2026-10-25 「워크인 팀 여러 개를 한 번에 선택해 이동」) ─────────
//  MULTI 모드에서 조를 눌러 고르고(MSEL) 빈 자리를 누르면 그 자리부터 아래로 연속 배치(변경 확인 바 → [변경]).
//  찬 자리를 만나면 moveGroup 과 같은 규칙으로 그 조부터 아래로 민다. 자리가 끝까지 없으면 거기서 멈춘다.
function moveGroups(gis, course, slot){
  const movers=gis.map(i=>BOARD[i]).filter(Boolean).sort((a,b)=>((a.slot||0)-(b.slot||0))||String(a.course).localeCompare(String(b.course)));   // 원래 출발 순서(티오프 → 코스)를 유지해 붙인다
  if(!movers.length) return false;
  movers.forEach(g=>{ g._mv=true; });
  let s=slot, placed=0;
  for(const g of movers){
    const others=BOARD.filter(x=>!x._mv && x.course===course);
    const taken=new Set(others.map(x=>x.slot));
    if(taken.has(s)){
      let free=-1; for(let k=s+1;k<=MAX_SLOT_N;k++){ if(!taken.has(k)){ free=k; break; } }
      if(free<0){ toast(tx('multiNoRoom'),'warn'); break; }
      ensureSlots(free);
      others.filter(x=>x.slot>=s && x.slot<free).sort((a,b)=>b.slot-a.slot).forEach(x=>setPos(x,course,x.slot+1));
    }
    if(s>MAX_SLOT_N){ toast(tx('multiNoRoom'),'warn'); break; }
    ensureSlots(s); setPos(g,course,s); markManual(g); placed++; s++;
  }
  movers.forEach(g=>{ delete g._mv; });
  if(placed) toast(tx('moveDone'),'ok');
  return placed>0;
}

// ── 화면 흔들림 방지 ────────────────────────────────────────────────────
//   조를 고르면 표 **위쪽** 패널(조원 편성·미배정·재확인)이 커져 코스 표가 통째로
//   밀린다 → 방금 누른 줄이 눈앞에서 사라진다. 다시 그리기 전에 「보고 있던 줄」을
//   기억해 두고, 그린 뒤 같은 자리에 오도록 스크롤을 맞춘다(눈에 안 띄는 보정).
function topOffset(){ return ((document.querySelector('.topbar')||{}).offsetHeight||56)+4; }
function anchorRow(){
  const off=topOffset();
  const rows=document.querySelectorAll('table.cb tbody tr');
  for(const r of rows){
    const t=r.getBoundingClientRect().top;
    if(t>=off){ const c=r.querySelector('td.tee'); if(c) return {tee:c.textContent, top:t}; }
  }
  return null;
}
function restoreRow(a){
  if(!a||!a.tee) return;
  const rows=document.querySelectorAll('table.cb tbody tr');
  for(const r of rows){
    const c=r.querySelector('td.tee');
    if(c && c.textContent===a.tee){
      const d=r.getBoundingClientRect().top-a.top;
      if(Math.abs(d)>2) window.scrollBy(0,d);
      return;
    }
  }
}
function render(){
  const _a=anchorRow();
  _render();
  try{ restoreRow(_a); }catch(e){}
}

//   담당자가 여기서 정리해 두면 화면·인쇄물이 그대로 따라간다.
function exceptionsHTML(){
  const teams=teamsOnDate(DATESEL).filter(t=>teamHit(t.seq));   // 검색으로 좁힌다
  // 검색 중에는 결과가 접혀서 안 보이면 안 되니 자동으로 펼친다
  const open=foldOpen('ex',false)||qOn();
  const wrap=(sum,body)=>fold('ex',tx('exH'),sum,body,open);
  if(!teams.length) return wrap(`<span class="so-fsum">${tx('exSetNone')}</span>`,
    `<div class="legend">${qOn()?tx('qNone'):tx('exNone')}</div>`);
  const abs=absMap(DATESEL);
  const rows=teams.map(t=>{
    const seq=String(t.seq);
    const sk=isSkip(seq);
    const ov=holesOv(DATESEL,seq);
    const eff=holesOn(t,DATESEL);
    const btn=(h)=>`<button type="button" class="exh${ov===h?' on':''}" data-exh="${seq}" data-h="${h}">${tx('exHoles',h)}</button>`;
    const mem=(ROSTER[seq]||[]).map(m=>{
      const a=abs.has(String(m.id));
      return `<button type="button" class="exm${a?' off':''}" data-exa="${m.id}" data-seq="${seq}" title="${tx('exAbsent')}">${esc(m.name)}${a?` <i>${tx('exAbsent')}</i>`:''}</button>`;
    }).join('');
    const nAbs=(ROSTER[seq]||[]).filter(m=>abs.has(String(m.id))).length;
    return `<div class="exrow${sk?' skip':''}">
      <div class="exhd">
        <b>${esc(t.tag||('#'+seq))}</b> <span class="exrep">${esc(pn(t.rep,''))}</span>
        <span class="cnt">${t.pax}${tx('person')}${nAbs?` · <span class="exabs">${tx('exAbsN',nAbs)}</span>`:''}</span>
        <span class="exsp"></span>
        <span class="exeff">${sk?tx('exNoPlay'):tx('exHoles',eff)}${(!sk&&ov)?'<i>*</i>':''}</span>
        <button type="button" class="exh${!ov?' on':''}" data-exh="${seq}" data-h="0">${tx('exRule')}</button>
        ${btn(27)}${btn(18)}${btn(9)}
        <button type="button" class="exskip${sk?' on':''}" data-exskip="${seq}">${tx('exNoPlay')}</button>
      </div>
      ${(!sk&&mem)?`<div class="exmem">${mem}</div>`:''}
    </div>`;
  }).join('');
  // 접힌 채로도 「예외가 걸린 팀이 몇인지」는 보이게 — 열지 않아도 그날 상태를 안다
  const nSet=teams.filter(t=>{ const q=String(t.seq);
    return isSkip(q) || !!holesOv(DATESEL,q) || (ROSTER[q]||[]).some(m=>abs.has(String(m.id))); }).length;
  const sum=nSet?`<span class="so-fsum on">${tx('exSetN',nSet)}</span>`:`<span class="so-fsum">${tx('exSetNone')}</span>`;
  return wrap(sum, `<div class="legend" style="margin:0 0 9px">${tx('exT')}</div>${rows}`);
}
async function setHoles(seq, h){
  const by=(window.__so_getUser&&__so_getUser())||null;
  try{
    if(!h){ await supa.from('golf_holes').delete().eq('play_date',DATESEL).eq('event_seq',Number(seq));
      if(HOLESM[DATESEL]) delete HOLESM[DATESEL][String(seq)]; }
    else { const {error}=await supa.from('golf_holes')
        .upsert({play_date:DATESEL,event_seq:Number(seq),holes:h,updated_by:by,updated_at:new Date().toISOString()},{onConflict:'play_date,event_seq'});
      if(error) throw error;
      (HOLESM[DATESEL]=HOLESM[DATESEL]||{})[String(seq)]={holes:h,note:''}; }
    render(); toast(tx('exSaved'),'ok');
  }catch(e){ toast(tx('exFail',e.message),'err'); }
}
// 불참·조기퇴실(room.html 🛫)로 바뀐 사람을 이미 짜인 조에서 빼고 조 인원을 줄인다(빈 조는 없앤다).
//  다시 참가로 돌리면 미배정으로 남아 조편성 패널·자동배정이 다시 넣는다.
function applyAbsentToBoard(){
  let changed=false;
  BOARD.forEach(g=>{
    if(!g.members||!g.members.length) return;
    const keep=g.members.filter(m=>!isAbsent(DATESEL,m.id));
    if(keep.length!==g.members.length){ g.members=keep; g.pax=Math.max(keep.length,0); changed=true; }
  });
  if(changed){
    for(let i=BOARD.length-1;i>=0;i--){ const g=BOARD[i];
      if(g.members && g.members.length===0){ BOARD.splice(i,1); if(SELG===i) SELG=null; } }
  }
  return changed;
}
async function toggleAbsent(mid, seq){
  const by=(window.__so_getUser&&__so_getUser())||null;
  const map=(ABSM[DATESEL]=ABSM[DATESEL]||new Map());
  try{
    if(map.has(String(mid))){
      const {error}=await supa.from('golf_absentees').delete().eq('play_date',DATESEL).eq('member_id',mid);
      if(error) throw error; map.delete(String(mid));
    } else {
      const {error}=await supa.from('golf_absentees')
        .upsert({play_date:DATESEL,member_id:mid,event_seq:Number(seq),created_by:by},{onConflict:'play_date,member_id'});
      if(error) throw error; map.set(String(mid),{seq:String(seq),reason:''});
    }
    applyAbsentToBoard(); render(); touch();   // 이미 짜인 조에서도 빼고 저장
    toast(tx('exSaved'),'ok');
  }catch(e){ toast(tx('exFail',e.message),'err'); }
}

    (ROSTER[g.seq]||[]).forEach(m=>{ if(m.gender===gd && !used.has(String(m.id)) && (g.members||[]).length<(g.pax||4)) (g.members=g.members||[]).push(m); });

  const rc=$('#r-cart'); if(rc) rc.addEventListener('change',()=>{ const g=BOARD[SELG]; if(!g) return; snap(); g.cart=rc.value.trim();

  const rct=$('#r-ctype'); if(rct) rct.addEventListener('change',()=>{ const g=BOARD[SELG]; if(!g) return; snap(); g.ctype=rct.value||'';
