<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 카트 관리표</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.xs{font-size:11px;padding:2px 8px;border-radius:6px}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1320px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:4px}
  .panel .desc{font-size:12px;color:var(--text2);margin:6px 0 11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .dctrl{display:flex;align-items:center;gap:6px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  /* 보유·사용·잔여 */
  .stock{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:4px}
  .st{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
  .st h4{font-size:13px;font-weight:800;color:var(--text);margin-bottom:7px}
  .st .nums{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .st .n{display:flex;flex-direction:column}
  .st .n span{font-size:10.5px;color:var(--muted);font-weight:700}
  .st .n b{font-size:21px;font-family:var(--mono);line-height:1.15}
  .st .n.use b{color:var(--accent2)} .st .n.left b{color:var(--ok)} .st .n.left.bad b{color:var(--err)}
  .st .own{display:flex;align-items:center;gap:5px;margin-top:7px}
  .st .own input{width:62px;text-align:center}
  .st .fee{font-size:11px;color:var(--muted);font-weight:600;margin-top:5px}
  /* 월별 캘린더 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
  .cal .wd{font-size:11px;font-weight:800;color:var(--text2);text-align:center;padding:3px 0}
  .cal .wd.sun{color:var(--err)} .cal .wd.sat{color:#2b5f9e}
  .cd{min-height:82px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .cd:hover{border-color:var(--accent);background:var(--accentSoft)}
  .cd.empty{background:transparent;border-color:transparent;cursor:default}
  .cd.empty:hover{background:transparent}
  .cd.none{opacity:.45;cursor:default}
  .cd .d{font-size:12px;font-weight:800;font-family:var(--mono)}
  .cd .d.sun{color:var(--err)} .cd .d.sat{color:#2b5f9e}
  .cd .tm{font-size:10.5px;color:var(--text2);font-weight:700}
  .cd .ln{display:flex;justify-content:space-between;font-size:10.5px;font-family:var(--mono);font-weight:700}
  .cd .ln3{display:flex;justify-content:space-between;gap:3px;font-size:10.5px;font-family:var(--mono);font-weight:800;margin-top:1px}
  .cd .ln3 i{font-style:normal;color:var(--muted);font-weight:600;margin-right:2px}
  .cd .ln3 .u{color:var(--accent2)} .cd .ln3 .l{color:var(--ok)}
  .cd .ln3.over .l{color:var(--err)}
  .cd.sel{border-color:var(--accent);background:var(--accentSoft);box-shadow:0 0 0 2px var(--accent) inset}
  .cd .ln i{font-style:normal;color:var(--muted)}
  .cd .ln.over b{color:var(--err)}
  .cd .un{font-size:10px;font-weight:800;color:var(--err)}
  .cd.today{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
  /* 관리표 */
  table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.t th{background:var(--surface2);border-bottom:1px solid var(--border2);padding:7px 8px;text-align:center;font-size:11px;color:var(--text2);font-weight:700;white-space:nowrap}
  table.t td{border-bottom:1px solid var(--border);padding:5px 8px;text-align:center;white-space:nowrap;vertical-align:middle}
  table.t td.l{text-align:left}
  table.t tr:hover td{background:var(--surface2)}
  table.t tr.sum td{border-top:2px solid var(--border2);font-weight:800;background:var(--surface2);font-family:var(--mono)}
  table.t tr.dirty td{background:#fdf6e7}
  .tag{font-weight:800;color:var(--accent2);font-family:Arial,sans-serif}
  .qty{width:52px;text-align:center;padding:4px 5px;font-family:var(--mono);font-weight:700}
  .nos{width:96px;padding:4px 6px;font-size:12px}
  .memo{width:120px;padding:4px 6px;font-size:12px}
  .src{padding:4px 6px;font-size:12px}
  .bdg{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
  .bdg.ok{background:var(--accentSoft);color:#234d2f;border:1px solid #b4cda0}
  .bdg.cond{background:#fdf6e7;color:#6b5312;border:1px solid #e6d3a3}
  .bdg.no{background:#f7e6e2;color:#8a2a1c;border:1px solid #e3bdb4}
  .course{font-size:11.5px;color:var(--text2);font-weight:700}
  .course.kuju{color:#8a5a12}
  .tee{font-family:var(--mono);font-weight:700}
  .warnbox{background:#fdf6e7;border:1px solid #e6d3a3;border-radius:9px;padding:9px 12px;font-size:12px;color:#6b5312;font-weight:600;margin-top:10px}
  .okbox{background:var(--accentSoft);border:1px solid #b4cda0;border-radius:9px;padding:9px 12px;font-size:12px;color:#234d2f;font-weight:700;margin-top:10px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fdf6e7;color:#6b5312}
  @media print{
    .topbar,.conn,#toast,.noprint{display:none!important}
    body{background:#fff}.wrap{max-width:none;padding:0}
    .panel{border:none;box-shadow:none;padding:0 0 8px;margin-bottom:8px;break-inside:avoid}
    table.t{font-size:10.5pt}
    .qty,.nos,.memo,.src{border:none;background:transparent;font-size:10.5pt}
    @page{size:A4 landscape;margin:10mm}
  }
</style>

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }
function accomL(a){ return (window.SZCore&&SZCore.accomLabel)?SZCore.accomLabel(a,lang()):(a||''); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shiftDay(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function ymBounds(ym){ const [y,m]=ym.split('-').map(Number); const last=new Date(y,m,0).getDate();
  return {from:`${ym}-01`, to:`${ym}-${String(last).padStart(2,'0')}`}; }
function shiftYM(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1);

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+tx('loginNeedTitle')+'<small>'+tx('loginNeedSub')+'</small></div></div>'; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;
    renderUI(); loadMonth(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

async function paged(qf){
  const out=[]; let from=0;
  for(;;){ const {data,error}=await qf(from,from+999); if(error) return {error};
    out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return {data:out};
}

// 숙소별 전기카트 사전신청 자격 — 야마나미CC를 쓰는 날인지로 판정(Min 2026-08)
//  야마나미·쿠주힐즈·시즈노야도 = 항상 야마나미CC → 가능
//  간지호텔 = 평일 구주고원CC → 야마나미CC 날(주말·공휴일·입국일)만 가능
function eligOf(team){
  const yc = SZCore.usesYamanamiCC({dep:team.dep,arr:team.arr,accom:team.accom}, team.isPus, DATE);
  if(!yc) return 'no';
  return team.accom==='간지호텔' ? 'cond' : 'ok';
}

async function load(){
  if(!supa) return;
  $('#stat').textContent=tx('loading');
  const dl=$('#d-label'); if(dl) dl.textContent=SZCore.mdWd(DATE,lang());
  const dw=$('#d-wd'); if(dw) dw.textContent=SZCore.mdWd(DATE,lang());
  try{
    // 1) 카트 종류(보유 대수)
    const ct=await supa.from('cart_types').select('*').eq('active',true).order('sort_order');
    if(ct.error) throw ct.error;
    TYPES=visibleTypes(ct.data);
    // 2) 그 날짜에 체류 중인 팀(입국<=날짜<=귀국) — 라운딩 여부는 규칙으로 거른다
    const bs=await paged((a,b)=>supa.from('bookings')
      .select('event_seq,rep_name,dep_date,arr_date,origin,airline,pax,remark_local')
      .lte('dep_date',DATE).gte('arr_date',DATE).order('event_seq').range(a,b));
    if(bs.error) throw bs.error;
    const seqs=(bs.data||[]).map(b=>b.event_seq);
    if(!seqs.length){ ROWS=[]; DIRTY.clear(); $('#stat').textContent=''; renderStock(); renderTable(); return; }
    // 3) 팀 정보(숙소·그룹코드) · 대표 항공편 · 조편성 · 카트 배정
    const GM={}, PX={}, GG={}, CB={};
    for(let i=0;i<seqs.length;i+=200){ const ch=seqs.slice(i,i+200);
      const {data:gs}=await supa.from('guests').select('event_seq,group_code,team_tag,accom,pax').in('event_seq',ch);
      (gs||[]).forEach(g=>GM[g.event_seq]=g);
      const {data:ps}=await supa.from('passengers').select('event_seq,seq_in_team,origin,dep_flight,ret_flight').in('event_seq',ch).order('seq_in_team');
      (ps||[]).forEach(p=>{ if(!PX[p.event_seq]) PX[p.event_seq]=p; });
    }
    const {data:gg}=await supa.from('golf_groups').select('event_seq,course_code,tee_time,cart_no,slot_no').eq('play_date',DATE);
    (gg||[]).forEach(g=>{ if(g.event_seq!=null && !GG[g.event_seq]) GG[g.event_seq]=g; });
    const {data:cb}=await supa.from('cart_bookings').select('*').eq('play_date',DATE);
    (cb||[]).forEach(x=>{ (CB[x.event_seq]=CB[x.event_seq]||{})[x.cart_code]=x; });

    // 4) 라운딩하는 팀만 남긴다
    ROWS=[];
    (bs.data||[]).forEach(b=>{
      const g=GM[b.event_seq]||{}; const p=PX[b.event_seq]||{};
      const accom=g.accom||'';
      const isPus = SZCore.isPus(p.origin||b.origin||'', p.ret_flight||p.dep_flight||b.airline||'');
      const team={dep:b.dep_date,arr:b.arr_date,accom};
      const row=SZCore.golfRows(team,isPus).find(x=>x.date===DATE);
      if(!row) return;                                   // 그날 라운딩 없음(인천팀 귀국일 등)
      const grp=GG[b.event_seq]||{}; const bk=CB[b.event_seq]||{};
      const qty={}, src={}; let memo='';
      TYPES.forEach(t=>{ const r=bk[t.code]; qty[t.code]=r?r.qty:0; if(r){ src[t.code]=r.source; memo=memo||r.note||''; } });
      let srcOne=Object.values(src)[0]||'pre';
      // 저장된 배정이 없으면 규칙(SZCore)으로 자동 채운다 — 화면은 클릭 없이 바로 정답.
      // 비고 표기 판정: sure=집계 · maybe=재확인(집계 제외) · none=없음 (Min 2026-08)
      const _elecKind=SZCore.cartRemarkKind(b.remark_local||'');
      const saved=TYPES.some(t=>(+qty[t.code]||0)>0);
      let auto=false;
      if(!saved){
        const courseOk=(row.course==='やまなみCC');
        const p=SZCore.cartPlan(g.pax||b.pax||0, _elecKind==='sure'&&courseOk);
        if(p && TYPES.some(t=>t.code===p.code)){ qty[p.code]=p.qty; srcOne=(p.code==='electric'?'pre':'onsite'); auto=true; }
      }
      ROWS.push({
        seq:b.event_seq, tag:g.team_tag||g.group_code||'', rep:b.rep_name||'', accom,
        pax:g.pax||b.pax||0, dep:b.dep_date, arr:b.arr_date, isPus,
        elec:_elecKind==='sure', elecKind:_elecKind, remarkLocal:b.remark_local||'',
        ruleCourse:row.course, holes:row.holes, note:row.note,
        grpCourse:grp.course_code||'', tee:grp.tee_time||'', cartNo:grp.cart_no||'',
        qty, src:srcOne, memo, auto, orig:JSON.stringify({qty,src:srcOne,memo})
      });
    });
    ROWS.sort((a,b)=>String(a.tee||'zz').localeCompare(String(b.tee||'zz'))||String(a.tag).localeCompare(String(b.tag)));
    DIRTY.clear();
    $('#stat').textContent=`${ROWS.length}${lang()==='en'?' teams':'팀'}`;
    renderStock(); renderTable();
  }catch(e){
    $('#stat').textContent=tx('loadFail');
    // 테이블 미생성(93_cart.sql 미실행)은 '오류'가 아니라 '설치 안내'로 보여준다.
    const msg=String(e&&e.message||e);
    if(/cart_types|cart_bookings/.test(msg) && /schema cache|does not exist|not find/i.test(msg)){
      const w=$('#warn');
      if(w) w.innerHTML=`<div class="warnbox" style="font-size:13px;line-height:1.65">
        <b style="font-size:14px">⚠ ${esc(tx('sqlTitle'))}</b><br>${tx('sqlBody')}
        <div style="margin-top:9px"><button class="btn sm" type="button" id="sql-retry">${esc(tx('sqlRetry'))}</button></div>
        <div style="margin-top:7px;font-size:11px;opacity:.75">${esc(msg)}</div></div>`;
      const rb=$('#sql-retry'); if(rb) rb.addEventListener('click',load);
      const st=$('#stock'); if(st) st.innerHTML='';
      const tb=$('#tbl'); if(tb) tb.innerHTML='';
      return;
    }
    toast(tx('loadFail')+': '+msg,'err');
  }
}

function usedOf(code){ return ROWS.reduce((n,r)=>n+(+r.qty[code]||0),0); }

// ── 자동 분배 규칙(Min 2026-08) ────────────────────────────────────────────
//  · 현지전달비고(remark_local)에 전기카트 신청 표기 → 전기카트.
//    단 전기카트는 야마나미CC 이용일만 가능하므로(간지호텔 평일=구주고원CC)
//    그 조건이 안 되는 날은 가솔린으로 내린다.
//  · 그 외 팀 → 가솔린. 2인 예약팀=2인승, 3인 이상=4인승(4명당 1대).
//  규칙 자체는 SZCore.cartPlan / wantsElectricCart (단일 진실원·단위테스트 있음).
function planFor(team, courseOk){
  const wantElec = team.elec && courseOk;
  return SZCore.cartPlan(team.pax, wantElec);
}
//  화면은 이미 규칙대로 자동으로 채워져 있다. 이 버튼은 그 자동분을 '확정(저장)' 한다.
function autoAssignDay(){
  if(!ROWS.length) return;
  let n=0;
  ROWS.forEach(r=>{ if(!r.auto) return; if(!TYPES.some(t=>(+r.qty[t.code]||0)>0)) return; DIRTY.add(r.seq); n++; });
  if(!n){ toast(tx('autoNone')); return; }
  renderTable();
  toast(tx('autoDone')(n),'ok');
}

// 보유 대수만 관리(Min 2026-08: "칩 관리 없이 총 블럭 수만"). 못 쓰는 카트는 보유 수를 줄인다.
//  ⚠ cart_units 테이블(94)은 그대로 두되 화면에서는 쓰지 않는다(추후 개별 관리가 필요해지면 복구).
function ownOf(t){ return +t.total_count||0; }
function activeOf(t){ return ownOf(t); }

function renderStock(){
  const box=$('#stock'); if(!box) return;
  box.innerHTML=TYPES.map(t=>{
    const use=usedOf(t.code), own=ownOf(t), left=own-use;
    return `<div class="st">
      <h4>${esc(lang()==='ja'?t.name_ja:t.name_ko)}</h4>
      <div class="nums">
        <div class="n"><span>${tx('own')}</span><b>${own}</b></div>
        <div class="n use"><span>${tx('use')}</span><b>${use}</b></div>
        <div class="n left ${left<0?'bad':''}"><span>${tx('left')}</span><b>${left}</b></div>
      </div>
      <div class="own noprint"><span class="cnt">${tx('own')}</span>
        <input class="inp" type="number" min="0" data-own="${t.code}" value="${own}"><span class="cnt">${tx('unit')}</span></div>
      <div class="fee">${(+t.fee_yen||0)?tx('feeEach')(+t.fee_yen||0):''}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-own]').forEach(el=>el.addEventListener('change',()=>saveOwn(el.dataset.own,Math.max(0,+el.value||0))));
  const w=$('#warn'); if(w){
    const over=TYPES.filter(t=>usedOf(t.code)>ownOf(t));
    w.innerHTML=over.length?over.map(t=>`<div class="warnbox">${esc(tx('overWarn')(lang()==='ja'?t.name_ja:t.name_ko,ownOf(t)))}</div>`).join(''):'';
  }
}

async function saveOwn(code,n){
  try{
    const {error}=await supa.from('cart_types').update({total_count:n}).eq('code',code);
    if(error) throw error;
    const t=TYPES.find(x=>x.code===code); if(t) t.total_count=n;
    renderStock(); renderTable(); toast(tx('saveOk')(1),'ok');
  }catch(e){ toast(tx('saveFail')+': '+String(e&&e.message||e),'err'); }
}

// 그 날 팀별 카트 번호 = 종류별 번호 풀에서 표시 순서대로 자동 배분(결정적).
function allocForDay(){
  const out={};
  TYPES.forEach(t=>{
    // 번호 풀 = 1..보유 대수(보유 수만 관리하므로 번호는 순번으로 자동 부여)
    const pool=Array.from({length:ownOf(t)},(_,i)=>String(i+1));
    const need=ROWS.map((r,i)=>({key:i, qty:+r.qty[t.code]||0}));
    const got=SZCore.allocCartNos(pool,need);
    Object.keys(got).forEach(i=>{ if(got[i].length){ (out[i]=out[i]||{})[t.code]=got[i]; } });
  });
  return out;   // { 행번호: { cart_code: ['1','2'] } }
}

function eligBadge(r){
  const e=eligOf(r);
  const k=e==='ok'?'eligOk':e==='cond'?'eligCond':'eligNo';
  const t=e==='ok'?'eligOkT':e==='cond'?'eligCondT':'eligNoT';
  return `<span class="bdg ${e}" title="${esc(tx(t))}">${esc(tx(k))}</span>`;
}

function shownRows(){

// 現地手配書를 팝업으로 — dispatch.html 딥링크(?ym=&seq=)가 그 팀 인쇄 미리보기까지 열어준다.
function openDispatch(seq){
  const ym=DATE.slice(0,7);
  const w=window.open(`dispatch.html?ym=${encodeURIComponent(ym)}&seq=${encodeURIComponent(seq)}`,
    'saizen_dispatch','width=1180,height=900,scrollbars=yes,resizable=yes');
  if(w) w.focus(); else toast(tx('saveFail'),'err');
}

function mark(r){
  const now=JSON.stringify({qty:r.qty,src:r.src,memo:r.memo});
  if(now!==r.orig) DIRTY.add(r.seq); else DIRTY.delete(r.seq);
  $('#tbl-cnt').textContent = DIRTY.size?tx('dirty')(DIRTY.size):'';
  $('#btn-save').disabled = !DIRTY.size;
  document.querySelectorAll('tr[data-i]').forEach(tr=>tr.classList.toggle('dirty',DIRTY.has(ROWS[+tr.dataset.i].seq)));
}

async function save(){
  if(!DIRTY.size) return;
  const btn=$('#btn-save'); btn.disabled=true;
  const by=curUser()||null;
  const ups=[], dels=[];
  ROWS.filter(r=>DIRTY.has(r.seq)).forEach(r=>{
    TYPES.forEach(t=>{
      const q=+r.qty[t.code]||0;
      if(q>0) ups.push({play_date:DATE,event_seq:r.seq,cart_code:t.code,qty:q,source:r.src||'pre',note:r.memo||null,created_by:by});
      else dels.push({seq:r.seq,code:t.code});
    });
  });
  try{
    if(ups.length){
      const {error}=await supa.from('cart_bookings').upsert(ups,{onConflict:'play_date,event_seq,cart_code,source'});
      if(error) throw error;
    }
    for(const d of dels){
      const {error}=await supa.from('cart_bookings').delete().eq('play_date',DATE).eq('event_seq',d.seq).eq('cart_code',d.code);
      if(error) throw error;
    }
    toast(tx('saveOk')(DIRTY.size),'ok');
    await load();
  }catch(e){ toast(tx('saveFail')+': '+e.message,'err'); btn.disabled=false; }
}

// ════════════════════════════════════════════════════════════════════════
//  월별 배정현황 — 등록 데이터(step1)가 갱신되면 그대로 반영된다(저장값+규칙 계산).
//   · 월 토글(◀▶)로 3월~12월 등 등록된 달을 이어서 조회.
//   · 표시는 저장된 cart_bookings 가 우선, 없는 팀은 '미배정'으로 규칙 예상치를 보여준다.
// ════════════════════════════════════════════════════════════════════════
async function loadMonth(){
  if(!supa) return;
  const ms=$('#m-stat'); if(ms) ms.textContent=tx('mLoading');
  const ml=$('#m-label'); if(ml) ml.textContent=YM;
  try{
    if(!TYPES.length){
      const ct=await supa.from('cart_types').select('*').eq('active',true).order('sort_order');
      if(ct.error) throw ct.error; TYPES=visibleTypes(ct.data);
    }
    const b=ymBounds(YM);
    const bs=await paged((a,z)=>supa.from('bookings')
      .select('event_seq,rep_name,dep_date,arr_date,origin,airline,pax,remark_local')
      .lte('dep_date',b.to).gte('arr_date',b.from).order('event_seq').range(a,z));
    if(bs.error) throw bs.error;
    const seqs=(bs.data||[]).map(x=>x.event_seq);
    const GM={}, PX={};
    for(let i=0;i<seqs.length;i+=200){ const ch=seqs.slice(i,i+200);
      const {data:gs}=await supa.from('guests').select('event_seq,group_code,team_tag,accom,pax').in('event_seq',ch);
      (gs||[]).forEach(g=>GM[g.event_seq]=g);
      const {data:ps}=await supa.from('passengers').select('event_seq,seq_in_team,origin,dep_flight,ret_flight').in('event_seq',ch).order('seq_in_team');
      (ps||[]).forEach(p=>{ if(!PX[p.event_seq]) PX[p.event_seq]=p; });
    }
    const cbAll=await paged((a,z)=>supa.from('cart_bookings').select('*')
      .gte('play_date',b.from).lte('play_date',b.to).order('play_date').range(a,z));
    if(cbAll.error) throw cbAll.error;
    const CB={};   // seq|date → {code:qty}
    (cbAll.data||[]).forEach(x=>{ const k=x.event_seq+'|'+x.play_date;
      (CB[k]=CB[k]||{})[x.cart_code]=(CB[k][x.cart_code]||0)+(+x.qty||0); });

    // 팀별 라운딩일(그 달 안) + 배정 현황
    MTEAMS=[]; const byDate={};
    (bs.data||[]).forEach(bk=>{
      const g=GM[bk.event_seq]||{}, p=PX[bk.event_seq]||{};
      const accom=g.accom||'';
      const isPus=SZCore.isPus(p.origin||bk.origin||'', p.ret_flight||p.dep_flight||bk.airline||'');
      const rows=SZCore.golfRows({dep:bk.dep_date,arr:bk.arr_date,accom},isPus)
        .filter(r=>r.date>=b.from && r.date<=b.to);
      if(!rows.length) return;
      const pax=g.pax||bk.pax||0;
      const elec=SZCore.wantsElectricCart(bk.remark_local||'');
      const t={ seq:bk.event_seq, tag:g.team_tag||g.group_code||'', rep:bk.rep_name||'', accom, pax, elec,
                days:rows.map(r=>r.date), planned:{}, saved:{}, missing:[] };
      rows.forEach(r=>{
        const courseOk = (r.course==='やまなみCC');
        let plan=SZCore.cartPlan(pax, elec&&courseOk);
        if(plan && !SHOW_CODES.includes(plan.code)) plan=null;      // 표시 대상 외(가솔린)는 집계하지 않음
        const got0=CB[bk.event_seq+'|'+r.date]||null;
        let got=null;
        if(got0){ const f={}; Object.keys(got0).forEach(c=>{ if(SHOW_CODES.includes(c)) f[c]=got0[c]; });
                  if(Object.keys(f).length) got=f; }
        const eff = got || (plan?{[plan.code]:plan.qty}:{});
        if(!Object.keys(eff).length) return;                        // 전기 대상 아닌 날은 집계 제외
        if(!got) t.missing.push({date:r.date, plan});
        Object.keys(eff).forEach(c=>{
          t[got?'saved':'planned'][c]=(t[got?'saved':'planned'][c]||0)+eff[c];
          const d=(byDate[r.date]=byDate[r.date]||{teams:0,qty:{},unassigned:0});
          d.qty[c]=(d.qty[c]||0)+eff[c];
        });
        const d=(byDate[r.date]=byDate[r.date]||{teams:0,qty:{},unassigned:0});
        d.teams++; if(!got) d.unassigned++;
      });
      if(Object.keys(t.saved).length||Object.keys(t.planned).length) MTEAMS.push(t);
    });
    MDAYS=Object.keys(byDate).sort().map(d=>Object.assign({date:d},byDate[d]));
    MTEAMS.sort((a,b2)=>String(a.days[0]).localeCompare(String(b2.days[0]))||String(a.tag).localeCompare(String(b2.tag)));
    if(ms) ms.textContent=`${MTEAMS.length}${lang()==='en'?' teams':(lang()==='ja'?'チーム':'팀')}`;
    renderMonth();
  }catch(e){
    if(ms) ms.textContent=tx('loadFail');
    toast(tx('loadFail')+': '+String(e&&e.message||e),'err');
  }
}

function typeName(code){ const t=TYPES.find(x=>x.code===code); return t?(lang()==='ja'?t.name_ja:t.name_ko):code; }
function feeOf(qty){ return TYPES.reduce((s,t)=>s+(+qty[t.code]||0)*(+t.fee_yen||0),0); }

function renderMonth(){
  const sum=$('#m-sum'), team=$('#m-team'); if(!sum||!team) return;
  if(!MDAYS.length){ sum.innerHTML=`<div class="cnt" style="color:var(--muted);padding:10px 0">${tx('mNone')}</div>`; team.innerHTML=''; return; }

  // ── 캘린더(Min 2026-08: 표보다 달력이 낫다) ─────────────────────────────
  const byD={}; MDAYS.forEach(d=>byD[d.date]=d);
  const [Y,M]=YM.split('-').map(Number);
  const first=new Date(Y,M-1,1), lastDay=new Date(Y,M,0).getDate(), lead=first.getDay();
  const WD=tx('wd');
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div class="cd empty"></div>');
  for(let d=1;d<=lastDay;d++){
    const ds=`${YM}-${String(d).padStart(2,'0')}`;
    const wd=new Date(Y,M-1,d).getDay();
    const dc=wd===0?' sun':(wd===6?' sat':'');
    const x=byD[ds];
    if(!x){ cells.push(`<div class="cd none"><div class="d${dc}">${d}</div><div class="tm">${esc(tx('calNone'))}</div></div>`); continue; }
    // 실제 보유 · 사용 · 잔여 (Min 2026-08)
    const lines=TYPES.map(t=>{
      const q=+x.qty[t.code]||0, own=activeOf(t), left=own-q;
      return `<div class="ln3${left<0?' over':''}">
        <span><i>${esc(tx('own'))}</i>${own}</span>
        <span class="u"><i>${esc(tx('use'))}</i>${q}</span>
        <span class="l"><i>${esc(tx('left'))}</i>${left}</span></div>`;
    }).join('');
    cells.push(`<div class="cd${ds===todayISO()?' today':''}" data-d="${ds}">
      <div class="d${dc}">${d}</div>
      <div class="tm">${x.teams}${lang()==='en'?' teams':(lang()==='ja'?'チーム':'팀')}</div>
      ${lines}
      ${x.unassigned?`<div class="un" title="${esc(tx('unassignedT'))}">${esc(tx('unassigned'))} ${x.unassigned}</div>`:''}
    </div>`);
  }
  const gTot={}; MDAYS.forEach(d=>TYPES.forEach(t=>{ gTot[t.code]=(gTot[t.code]||0)+(+d.qty[t.code]||0); }));
  const totLine=TYPES.map(t=>`${esc(shortType(t.code))} ${gTot[t.code]||0}`).join(' · ');
  sum.innerHTML=`<div class="cal">${WD.map((w,i)=>`<div class="wd${i===0?' sun':(i===6?' sat':'')}">${esc(w)}</div>`).join('')}${cells.join('')}</div>`
    +`<div class="lgd" style="margin-top:8px;font-size:12px;color:var(--text2);font-weight:700">${esc(tx('thTotal'))}: ${totLine} · ${tx('thFee')} ¥${feeOf(gTot).toLocaleString()}</div>`;
  sum.querySelectorAll('.cd[data-d]').forEach(el=>el.addEventListener('click',()=>{
    DATE=el.dataset.d; const dp=$('#d-pick'); if(dp) dp.value=DATE;
    markCalendar(); load();
    const st=$('#stock'); if(st) st.scrollIntoView({behavior:'smooth',block:'start'});
  }));
  markCalendar();

  const teamRows=MTEAMS.map(t=>{
    const all={}; Object.keys(t.saved).forEach(c=>all[c]=(all[c]||0)+t.saved[c]);
    Object.keys(t.planned).forEach(c=>all[c]=(all[c]||0)+t.planned[c]);
    const alloc=Object.keys(all).map(c=>`${esc(typeName(c))} ×${all[c]}`).join(' · ')||'-';
    const cd=Object.values(all).reduce((n,v)=>n+v,0);
    return `<tr>
      <td class="l"><span class="tag">${esc(t.tag)}</span></td>
      <td class="l">${esc(t.rep)}</td>
      <td class="l">${esc(accomL(t.accom))}</td>
      <td>${t.pax}</td>
      <td>${t.elec?`<span class="bdg ok">${esc(tx('kindElec'))}</span>`:`<span class="bdg">${esc(tx('kindGas'))}</span>`}</td>
      <td>${t.days.length}</td>
      <td class="l">${alloc}${t.missing.length?` <span class="bdg no">${esc(tx('unassigned'))} ${t.missing.length}</span>`:''}</td>
      <td>${cd}</td>
      <td class="tee">${feeOf(all)?('¥'+feeOf(all).toLocaleString()):'-'}</td>
    </tr>`;
  }).join('');
  team.innerHTML=`<table class="t"><thead><tr>
      <th>${tx('thTeam')}</th><th>${tx('thRep')}</th><th>${tx('thAccom')}</th><th>${tx('thPax')}</th>
      <th>${tx('thKind')}</th><th>${tx('thDays')}</th><th>${tx('thAlloc')}</th><th>${tx('thCartDays')}</th><th>${tx('thFee')}</th>
    </tr></thead><tbody>${teamRows}</tbody></table>`;
}
// 캘린더 칸이 좁아 종류명을 짧게(전기/2인/4인)
function shortType(code){
  const ja={electric:'電動',gas2:'2人',gas4:'4人'}, ko={electric:'전기',gas2:'2인',gas4:'4인'}, en={electric:'EV',gas2:'2s',gas4:'4s'};
  const m=lang()==='ja'?ja:(lang()==='en'?en:ko);
  return m[code]||typeName(code);
}

async function autoAssignMonth(){
  if(!MTEAMS.length) return;
  const ups=[]; const dates=new Set();
  MTEAMS.forEach(t=>t.missing.forEach(m=>{
    if(!m.plan) return;
    if(!TYPES.some(x=>x.code===m.plan.code)) return;
    ups.push({play_date:m.date, event_seq:t.seq, cart_code:m.plan.code, qty:m.plan.qty,
      source:(m.plan.code==='electric'?'pre':'onsite'), created_by:curUser()||null});
    dates.add(m.date);
  }));
  if(!ups.length){ toast(tx('autoNone')); return; }
  if(!confirm(tx('autoMConfirm')(YM,ups.length))) return;
  const btn=$('#btn-mauto'); btn.disabled=true;
  try{
    for(let i=0;i<ups.length;i+=500){
      const {error}=await supa.from('cart_bookings').upsert(ups.slice(i,i+500),{onConflict:'play_date,event_seq,cart_code,source'});
      if(error) throw error;
    }
    toast(tx('autoMDone')(ups.length,dates.size),'ok');
    await loadMonth();
  }catch(e){ toast(tx('saveFail')+': '+String(e&&e.message||e),'err'); }
  finally{ btn.disabled=false; }
}

function applyStatic(){
  const step=$('#t-step'); if(step) step.textContent=tx('step');
  const home=$('#t-home'); if(home) home.textContent=tx('home');
  const hint=$('#t-connhint'); if(hint) hint.textContent=tx('connHint');
  const pre=$('#t-preconn'); if(pre) pre.textContent=tx('preConn');
  const btn=$('#btn-connect');
  if(supa){ setConn(tx('connOk'),'ok'); if(btn) btn.textContent=tx('connectedBtn'); }
  else { setConn(tx('notConn'),''); if(btn) btn.textContent=tx('connect'); }
}
window.onSaizenLangChange=function(){ applyStatic(); if(supa){ renderUI(); $('#d-pick').value=DATE; renderStock(); renderTable(); } };

$('#btn-connect').addEventListener('click',connect);
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }
</script>
