<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · 재고 · 내부 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* 중립 회색 캔버스(디자인 리프레시) — accent 등은 saizen-ops.css 가 통일 */
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#EDF0E2; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;
  }
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);
    padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  .navhome:hover{text-decoration:underline}
  .grow{flex:1}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover:not(:disabled){background:var(--accentSoft)}
  .btn.sm{font-size:12px;padding:5px 12px}
  .btn.xs{font-size:12px;padding:3px 9px}
  .btn.connected{background:var(--ok);border-color:var(--ok);color:#fff}
  .conn{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:230px}
  .hint{font-size:11px;color:var(--muted)}
  .inv-wrap{ padding:14px 20px 80px; max-width:1180px; margin:0 auto; }
  .inv-bar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px }
  .dept-toggle{ display:flex; gap:6px }
  .dept-toggle button{ font-size:14px; font-weight:700; padding:8px 18px; border-radius:9px; border:1px solid var(--border2);
    background:var(--surface); color:var(--text2); cursor:pointer }
  .dept-toggle button.on{ background:var(--accent); color:#fff; border-color:var(--accent) }
  .inv-sum{ margin-left:auto; font-size:13px; color:var(--text2); font-weight:700 }
  .inv-sum .low{ color:#b3473a }
  .catchips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px }
  .catchip{ font-size:12.5px; font-weight:700; padding:5px 13px; border-radius:99px; border:1px solid var(--border2);
    background:var(--surface); color:var(--text2); cursor:pointer }
  .catchip.on{ background:var(--accent2); color:#fff; border-color:var(--accent2) }
  .addrow{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; background:var(--surface); border:1px solid var(--border);
    border-radius:11px; padding:11px 13px; margin-bottom:14px }
  .addrow .inp{ font-size:13px }
  .inv-table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:11px; overflow:hidden }
  .inv-table th{ background:var(--surface3); font-size:12px; font-weight:800; color:var(--text2); padding:9px 10px; text-align:left; white-space:nowrap }
  .inv-table td{ font-size:13.5px; padding:8px 10px; border-top:1px solid var(--border); vertical-align:middle }
  .inv-table tr.cat-h td{ background:var(--surface2); font-weight:800; color:var(--accent2); font-size:12.5px; padding:6px 12px }
  .inv-table tr.low td{ background:#fdf2f0 }
  .qty{ font-family:'Consolas',monospace; font-weight:800; font-size:15px }
  .st-badge{ font-size:11px; font-weight:800; border-radius:6px; padding:2px 8px }
  .st-ok{ background:#e7efe1; color:#3c5230 } .st-low{ background:#f7e0db; color:#b3473a } .st-zero{ background:#eceff0; color:#7a8088 }
  .actbtns button{ font-size:12px; font-weight:700; border-radius:6px; padding:4px 8px; margin-right:3px; cursor:pointer; border:1px solid var(--border2); background:var(--surface) }
  .actbtns .b-in{ color:#2f7d4f; border-color:#bcd9c4 } .actbtns .b-out{ color:#b3473a; border-color:#e3bdb4 }
  .actbtns .b-stk{ color:#3a6ea5; border-color:#bcd0e5 }
  .inv-empty{ padding:26px; text-align:center; color:var(--muted) }
  .txn-panel{ margin-top:22px; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:14px 16px }
  .txn-panel h3{ font-size:14px; margin:0 0 10px }
  .txn-row{ display:flex; gap:10px; align-items:center; font-size:12.5px; padding:5px 0; border-top:1px solid var(--border); color:var(--text2) }
  .txn-row:first-of-type{ border-top:none }
  .txn-row .d-in{ color:#2f7d4f; font-weight:800; font-family:'Consolas',monospace } .txn-row .d-out{ color:#b3473a; font-weight:800; font-family:'Consolas',monospace }
  .txn-row .tn{ flex:1; font-weight:700; color:var(--text) }
  /* 페이지 설명서(접이식) */
  .page-help{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:11px; margin-bottom:14px; overflow:hidden }
  .page-help>summary{ cursor:pointer; padding:11px 16px; font-weight:800; font-size:13.5px; color:var(--accent); list-style:none; user-select:none }
  .page-help>summary::-webkit-details-marker{ display:none }
  .page-help>summary::before{ content:'▸ ' }
  .page-help[open]>summary::before{ content:'▾ ' }
  .page-help .ph-body{ padding:2px 18px 16px; font-size:13px; color:var(--text2); line-height:1.7 }
  .page-help .ph-body h4{ font-size:12.5px; color:var(--text); margin:11px 0 2px }
  .page-help .ph-body code{ background:var(--surface3); padding:1px 5px; border-radius:4px; font-size:11.5px; font-family:'Consolas',monospace }
  .page-help .ph-body ul{ margin:3px 0 0 18px } .page-help .ph-body li{ margin:1px 0 }
  .page-help .ph-body b{ color:var(--text) }
  /* toast — 화면 하단 중앙 고정(흐름에 끼지 않게) */
  #toast{ position:fixed; bottom:60px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; max-width:90vw }
  .toast{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:9px; padding:10px 18px; font-size:13px; font-weight:600; color:var(--text); box-shadow:0 6px 18px rgba(0,0,0,.16); min-width:200px; text-align:center }
  .toast.err{ border-left-color:#b3473a; background:#fbeeeb; color:#8a2a1c }
  .toast.ok{ border-left-color:#3f7d4e; background:#e7efe1; color:#234d2f }
  .toast.warn{ border-left-color:#b8860b; background:#fbf3e2; color:#7a5a16 }
</style>

    <div id="txn-list"></div>
  </div>
</div>

function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }

// 카테고리·사유는 DB 저장값(한국어 키) — 저장은 유지, 표시만 번역
const CATL={
  '식자재':{ja:'食材',en:'Ingredients'}, '음료':{ja:'飲料',en:'Beverages'}, '주류':{ja:'酒類',en:'Alcohol'},
  '주방소모품':{ja:'厨房消耗品',en:'Kitchen supplies'}, '기타':{ja:'その他',en:'Other'},
  '객실비품':{ja:'客室備品',en:'Room amenities'}, '린넨':{ja:'リネン',en:'Linen'}, '어메니티':{ja:'アメニティ',en:'Amenities'},
  '청소용품':{ja:'清掃用品',en:'Cleaning'}, '미니바':{ja:'ミニバー',en:'Minibar'}
};
function catLabel(c){ const m=CATL[c]; if(!m) return c; const lg=lang(); return lg==='ja'?m.ja:(lg==='en'?m.en:c); }
const REASONL={ '입고':{ja:'入庫',en:'Stock in'}, '사용':{ja:'使用',en:'Use'}, '실사조정':{ja:'棚卸調整',en:'Stocktake adj.'} };
function reasonLabel(r){ const m=REASONL[r]; if(!m) return r; const lg=lang(); return lg==='ja'?m.ja:(lg==='en'?m.en:r); }

const DEPTS={
  fnb:{ label:'F&B', cats:['식자재','음료','주류','주방소모품','기타'] },
  room:{ label:'객실', cats:['객실비품','린넨','어메니티','청소용품','미니바','기타'] },
  golf:{ label:'골프/카트', cats:['ゴルフカート','送迎カート','기타'] }
};
const state={ dept:'fnb', catFilter:'__all', items:[], txns:[], conn:'none' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function curUser(){ return (window.__so_getUser?(__so_getUser()||''):'')||localStorage.getItem('saizen_ops_user')||''; }
function setConn(t,c){ const e=$('#conn-state'); if(e){ e.textContent=t; e.className='pill'+(c?' '+c:''); } }
function refreshConn(){
  const b=$('#btn-connect'); if(!b) return;
  if(state.conn==='ok'){ setConn(tx('connOk'),'ok'); b.textContent=tx('connectedBtn'); b.classList.add('connected'); }
  else if(state.conn==='fail'){ setConn(tx('connFail'),'err'); b.textContent=tx('connFailBtn'); b.classList.remove('connected'); }
  else if(state.conn==='connecting'){ b.textContent=tx('connecting'); b.classList.remove('connected'); }
  else { setConn(tx('notConn'),''); b.textContent=tx('connect'); b.classList.remove('connected'); }
}
function applyStatic(){
  $('#t-step').textContent=tx('step');
  $('#t-connhint').textContent=tx('connHint');
  $('#dept-room').textContent=tx('deptRoom');
  { const g=$('#dept-golf'); if(g) g.textContent=tx('deptGolf'); }
  $('#btn-reload').textContent=tx('reload');
  $('#add-name').placeholder=tx('phName');
  $('#add-unit').placeholder=tx('phUnit');
  $('#add-loc').placeholder=tx('phLoc');
  $('#add-par').placeholder=tx('phPar'); $('#add-par').title=tx('tipPar');
  $('#add-qty').placeholder=tx('phQty'); $('#add-qty').title=tx('tipQty');
  $('#btn-add').textContent=tx('btnAdd');
  const emp=$('#t-empty'); if(emp) emp.textContent=tx('emptyConnect');
  $('#t-helpsum').textContent=tx('helpSum');
  $('#t-helpbody').innerHTML=tx('helpBody');
  refreshConn();
}
function toast(msg,cls){ const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:''); t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); },2400); }
function num(v){ const n=Number(v); return isFinite(n)?n:0; }
function fmtQ(n){ const x=num(n); return Number.isInteger(x)?String(x):x.toFixed(2).replace(/0+$/,'').replace(/\.$/,''); }

/* ── 연결 ── */
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ state.conn='fail'; setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; state.conn='connecting'; refreshConn();
  try{
    supa=window.supabase.createClient(url,key);
    const { error }=await supa.from('inv_items').select('id',{count:'exact',head:true});
    if(error) throw error;
    state.conn='ok'; refreshConn(); toast(tx('connectedToast'),'ok'); btn.disabled=false;
    await load();
  }catch(e){
    state.conn='fail'; refreshConn(); toast(tx('connFail')+': '+e.message+' (SQL 36 / key)','err');
    btn.disabled=false; supa=null;
  }
}

/* ── 로드 ── */
async function load(){
  if(!supa) return;
  try{
    const { data:items, error:e1 }=await supa.from('inv_items').select('*').eq('dept',state.dept).order('category').order('sort_order').order('name_ko');
    if(e1) throw e1;
    state.items=items||[];
    const ids=state.items.map(i=>i.id);
    state.txns=[];
    if(ids.length){
      const { data:txns }=await supa.from('inv_txns').select('*').in('item_id',ids).order('created_at',{ascending:false}).limit(30);
      state.txns=txns||[];
    }
    render();
  }catch(e){ toast(tx('loadFail')+e.message,'err'); }
}

/* ── 렌더 ── */
function setDeptBtns(){ $('#dept-fnb').classList.toggle('on',state.dept==='fnb'); $('#dept-room').classList.toggle('on',state.dept==='room'); const g=$('#dept-golf'); if(g) g.classList.toggle('on',state.dept==='golf'); }
function renderAddCats(){ $('#add-cat').innerHTML=DEPTS[state.dept].cats.map(c=>`<option value="${esc(c)}">${esc(catLabel(c))}</option>`).join(''); }
function renderCatChips(){
  const cats=DEPTS[state.dept].cats.filter(c=>state.items.some(i=>(i.category||'기타')===c));
  const extra=[...new Set(state.items.map(i=>i.category||'기타').filter(c=>!DEPTS[state.dept].cats.includes(c)))];
  const all=[...cats,...extra];
  const chip=(k,l)=>`<div class="catchip${state.catFilter===k?' on':''}" data-cat="${esc(k)}">${esc(l)}</div>`;
  $('#catchips').innerHTML=chip('__all',tx('all'))+all.map(c=>chip(c,catLabel(c))).join('');
  $('#catchips').querySelectorAll('[data-cat]').forEach(c=>c.addEventListener('click',()=>{ state.catFilter=c.dataset.cat; render(); }));
}
function isLow(i){ return num(i.par_level)>0 && num(i.current_qty)<=num(i.par_level); }
function render(){
  setDeptBtns(); renderAddCats(); renderCatChips();
  const rows=state.items.filter(i=>state.catFilter==='__all'||(i.category||'기타')===state.catFilter);
  const lowN=state.items.filter(isLow).length;
  $('#inv-sum').innerHTML=`${tx('all')} ${state.items.length}${tx('sumTotal')}`+(lowN?` · <span class="low">${tx('sumLow')} ${lowN}</span>`:` · ${tx('sumLow0')}`);
  const box=$('#inv-list');
  if(!rows.length){ box.innerHTML=`<div class="inv-empty">${tx('emptyNoItems')}</div>`; renderTxns(); return; }
  let html=`<table class="inv-table"><thead><tr><th>${tx('thItem')}</th><th>${tx('thLoc')}</th><th>${tx('thUnit')}</th><th style="text-align:right">${tx('thQty')}</th><th style="text-align:right">${tx('thPar')}</th><th>${tx('thStat')}</th><th>${tx('thAct')}</th></tr></thead><tbody>`;
  let lastCat=null;
  rows.forEach(i=>{
    const cat=i.category||'기타';
    if(cat!==lastCat){ lastCat=cat; html+=`<tr class="cat-h"><td colspan="7">▸ ${esc(catLabel(cat))}</td></tr>`; }
    const low=isLow(i), zero=num(i.current_qty)<=0;
    const badge=zero?`<span class="st-badge st-zero">${tx('stZero')}</span>`:(low?`<span class="st-badge st-low">${tx('stLow')}</span>`:`<span class="st-badge st-ok">${tx('stOk')}</span>`);
    html+=`<tr class="${low?'low':''}" data-id="${i.id}">
      <td><b>${esc(i.name_ko)}</b>${i.name_ja?` <span style="color:var(--muted);font-size:11px">${esc(i.name_ja)}</span>`:''}</td>
      <td style="color:var(--text2)">${esc(i.location||'')}</td>
      <td style="color:var(--text2)">${esc(i.unit||'')}</td>
      <td style="text-align:right" class="qty">${fmtQ(i.current_qty)}</td>
      <td style="text-align:right;color:var(--muted)">${num(i.par_level)?fmtQ(i.par_level):'-'}</td>
      <td>${badge}</td>
      <td class="actbtns">
        <button class="b-in"  data-act="in"  data-id="${i.id}">${tx('actIn')}</button>
        <button class="b-out" data-act="out" data-id="${i.id}">${tx('actOut')}</button>
        <button class="b-stk" data-act="stk" data-id="${i.id}">${tx('actStk')}</button>
        <button data-act="edit" data-id="${i.id}">${tx('actEdit')}</button>
        <button data-act="del"  data-id="${i.id}" title="${tx('actDelTitle')}">✕</button>
      </td></tr>`;
  });
  html+='</tbody></table>';
  box.innerHTML=html;
  box.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>onAct(b.dataset.act,b.dataset.id)));
  renderTxns();
}
function renderTxns(){
  const p=$('#txn-panel'), l=$('#txn-list');
  $('#t-txnh').innerHTML=`${tx('txnH')} <span style="font-weight:600;color:var(--muted);font-size:12px">${tx('txnHsub')}</span>`;
  if(!state.txns.length){ p.style.display='none'; return; }
  const byId=Object.fromEntries(state.items.map(i=>[i.id,i]));
  p.style.display='';
  l.innerHTML=state.txns.map(t=>{
    const it=byId[t.item_id]; const nm=it?it.name_ko:tx('delItemGone');
    const d=num(t.delta), cls=d>=0?'d-in':'d-out', sign=d>=0?'+':'';
    const when=String(t.created_at||'').slice(5,16).replace('T',' ');
    return `<div class="txn-row"><span style="color:var(--muted);width:90px">${when}</span>
      <span class="tn">${esc(nm)}</span>
      <span class="${cls}">${sign}${fmtQ(d)}</span>
      <span style="width:80px">${esc(reasonLabel(t.reason||''))}</span>
      <span style="width:110px;text-align:right;color:var(--muted)">${esc(t.created_by||'')}</span></div>`;
  }).join('');
}

/* ── 품목 추가 ── */
async function addItem(){
  if(!supa){ toast(tx('needConn'),'err'); return; }
  const name=$('#add-name').value.trim();
  if(!name){ toast(tx('needName'),'err'); return; }
  const row={ dept:state.dept, category:$('#add-cat').value, name_ko:name,
    unit:$('#add-unit').value.trim()||tx('unitDefault'), location:$('#add-loc').value.trim()||null,
    par_level:num($('#add-par').value), current_qty:num($('#add-qty').value) };
  try{
    const { data, error }=await supa.from('inv_items').insert(row).select().single();
    if(error) throw error;
    // 초기 현재고가 있으면 입고 이력 1건 (reason=DB 저장값 '입고')
    if(num(row.current_qty)>0){
      await supa.from('inv_txns').insert({ item_id:data.id, delta:num(row.current_qty), reason:'입고', note:'초기 등록', qty_after:num(row.current_qty), created_by:curUser() });
    }
    $('#add-name').value=''; $('#add-loc').value=''; $('#add-par').value=''; $('#add-qty').value='';
    toast(tx('added'),'ok'); await load();
  }catch(e){ toast(tx('addFail')+e.message,'err'); }
}

/* ── 입출고 / 실사 / 수정 / 삭제 ── */
async function onAct(act,id){
  const it=state.items.find(x=>x.id===id); if(!it) return;
  if(act==='edit') return editItem(it);
  if(act==='del') return delItem(it);
  let delta=0, reason='';
  const arg={ name:it.name_ko, cur:fmtQ(it.current_qty), unit:it.unit||'' };
  if(act==='in'){
    const q=num(prompt(tx('promptIn')(arg),''));
    if(q<=0) return; delta=q; reason='입고';
  } else if(act==='out'){
    const q=num(prompt(tx('promptOut')(arg),''));
    if(q<=0) return; delta=-q; reason='사용';
  } else if(act==='stk'){
    const v=prompt(tx('promptStk')(arg), fmtQ(it.current_qty));
    if(v===null||v==='') return; const target=num(v); delta=target-num(it.current_qty); reason='실사조정';
    if(delta===0){ toast(tx('noChange')); return; }
  }
  const after=num(it.current_qty)+delta;
  try{
    const { error:e1 }=await supa.from('inv_items').update({ current_qty:after }).eq('id',id);
    if(e1) throw e1;
    await supa.from('inv_txns').insert({ item_id:id, delta, reason, qty_after:after, created_by:curUser() });
    toast(`${reasonLabel(reason)} ${delta>0?'+':''}${fmtQ(delta)} → ${fmtQ(after)}`,'ok'); await load();
  }catch(e){ toast(tx('actFail')+e.message,'err'); }
}
async function editItem(it){
  const name=prompt(tx('pEditName'), it.name_ko); if(name===null) return;
  const par=prompt(tx('pEditPar'), fmtQ(it.par_level)); if(par===null) return;
  const loc=prompt(tx('pEditLoc'), it.location||''); if(loc===null) return;
  try{
    const { error }=await supa.from('inv_items').update({ name_ko:name.trim()||it.name_ko, par_level:num(par), location:loc.trim()||null }).eq('id',it.id);
    if(error) throw error; toast(tx('saved'),'ok'); await load();
  }catch(e){ toast(tx('saveFail')+e.message,'err'); }
}
async function delItem(it){
  if(!confirm(tx('confirmDel')(it.name_ko))) return;
  try{ const { error }=await supa.from('inv_items').delete().eq('id',it.id); if(error) throw error; toast(tx('deleted'),'ok'); await load(); }
  catch(e){ toast(tx('delFail')+e.message,'err'); }
}

// 언어 토글 시 정적 라벨 + 동적 목록 재렌더
window.onSaizenLangChange=function(){ applyStatic(); if(supa){ render(); } else { setDeptBtns(); renderAddCats(); } };

/* ── 부팅 ── */
$('#btn-connect').addEventListener('click',connect);
$('#btn-reload').addEventListener('click',load);
$('#btn-add').addEventListener('click',addItem);
$('#add-name').addEventListener('keypress',e=>{ if(e.key==='Enter') addItem(); });
$('#dept-fnb').addEventListener('click',()=>{ state.dept='fnb'; state.catFilter='__all'; if(supa)load(); else { setDeptBtns(); renderAddCats(); } });
$('#dept-room').addEventListener('click',()=>{ state.dept='room'; state.catFilter='__all'; if(supa)load(); else { setDeptBtns(); renderAddCats(); } });
$('#dept-golf').addEventListener('click',()=>{ state.dept='golf'; state.catFilter='__all'; if(supa)load(); else { setDeptBtns(); renderAddCats(); } });
(function init(){
  const d=new URLSearchParams(location.search).get('dept'); if(d==='room') state.dept='room';
  applyStatic(); setDeptBtns(); renderAddCats();
  loadCreds();
  if($('#sb-url').value && $('#sb-key').value) connect();
})();
</script>
