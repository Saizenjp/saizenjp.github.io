<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yamanami 운영 관리 · 안내문 제작기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    /* 산출물(용지) 토큰 — 변경 금지 */
    --ink:#111111; --line:#111111; --muted:#6b6b6b; --paper:#ffffff;
    /* 편집 UI 토큰(화면 전용) */
    --ui-bg:#f3f4f2; --ui-surface:#ffffff; --ui-border:#d9ddd4; --ui-border2:#c3c9ba;
    --ui-text:#242a22; --ui-text2:#5c6356; --ui-muted:#8b917f;
    --ui-accent:#647548; --ui-accentDeep:#4F5E38; --ui-soft:#e6ecdd;
    --ui-sans:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--ui-sans);background:var(--ui-bg);color:var(--ui-text);-webkit-font-smoothing:antialiased}

  /* ── 앱 레이아웃 ── */
  .app{display:flex;flex-direction:column;height:100vh}
  .toolbar{flex:none;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--ui-surface);border-bottom:1px solid var(--ui-border);
    box-shadow:0 1px 3px rgba(0,0,0,.05);padding:11px 20px}
  .toolbar .home{font-size:13px;font-weight:700;color:var(--ui-accent);text-decoration:none;white-space:nowrap}
  .toolbar .home:hover{color:var(--ui-accentDeep)}
  .toolbar .brand{font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--ui-accentDeep)}
  .toolbar .brand small{display:block;font-size:10.5px;font-weight:600;color:var(--ui-muted);letter-spacing:.04em}
  .toolbar .spacer{flex:1}
  .seg-toggle{display:inline-flex;border:1px solid var(--ui-border2);border-radius:9px;overflow:hidden;background:var(--ui-surface)}
  .seg-toggle button{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;
    color:var(--ui-text2);padding:7px 15px;cursor:pointer}
  .seg-toggle button.on{background:var(--ui-accent);color:#fff}
  .btn{font-family:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:9px 18px;border:1px solid var(--ui-accent);
    background:var(--ui-accent);color:#fff;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--ui-accentDeep)}
  .print-hint{font-size:11.5px;color:var(--ui-muted);font-weight:600;max-width:230px;line-height:1.35}
  .print-hint b{color:var(--ui-accent2,#9a7322)}

  .body{flex:1;display:flex;min-height:0}
  .editor{flex:0 0 40%;max-width:520px;overflow-y:auto;padding:20px 22px 40px;border-right:1px solid var(--ui-border)}
  .preview{flex:1;min-width:0;background:#e9e9e9;overflow:auto}
  .stage{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:26px}

  /* ── 편집 패널 ── */
  .grp{margin-bottom:20px}
  .grp > .gl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-muted);margin:0 0 9px}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .preset{text-align:left;border:1px solid var(--ui-border2);background:var(--ui-surface);border-radius:10px;
    padding:10px 12px;cursor:pointer;font-family:inherit;transition:.12s}
  .preset:hover{border-color:var(--ui-accent);background:var(--ui-soft)}
  .preset .pn{font-size:13px;font-weight:800;color:var(--ui-text)}
  .preset .pd{font-size:11px;color:var(--ui-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ui-text2);margin-bottom:5px}
  .field label .hint{font-weight:500;color:var(--ui-muted);font-size:11px}
  .field input, .field textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ui-text);
    border:1px solid var(--ui-border2);border-radius:8px;padding:9px 11px;background:var(--ui-surface);resize:vertical}
  .field textarea{min-height:96px;line-height:1.7}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--ui-accent);box-shadow:0 0 0 3px var(--ui-soft)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  :focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}

  /* ── 용지(산출물) — §4 토큰 정확 재현 ── */
  .page-wrap{flex:none}
  .page{background:var(--paper);box-shadow:0 6px 30px rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;transform-origin:top left;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page.a4{width:210mm;height:297mm;padding:22mm}
  .page.b5{width:176mm;height:250mm;padding:15mm}
  .frame{width:100%;height:100%;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .page.a4 .frame{padding:24mm 18mm}
  .page.b5 .frame{padding:18mm 14mm}

  .kicker{font-family:'Pretendard',sans-serif;color:var(--muted);font-weight:500;margin-bottom:1.5mm}
  .page.a4 .kicker{font-size:13pt;letter-spacing:.42em;text-indent:.42em}
  .page.b5 .kicker{font-size:11pt;letter-spacing:.40em;text-indent:.40em}
  .kicker-jp{font-family:'Noto Serif JP',serif;color:var(--muted);font-weight:400}
  .page.a4 .kicker-jp{font-size:11.5pt;letter-spacing:.30em;text-indent:.30em}
  .page.b5 .kicker-jp{font-size:10pt;letter-spacing:.28em;text-indent:.28em}

  .rule-top{height:1px;background:var(--line);flex:none}
  .page.a4 .rule-top{width:34mm;margin:12mm 0}
  .page.b5 .rule-top{width:30mm;margin:9mm 0}

  .ko{font-family:'Noto Serif KR',serif;color:var(--ink);font-weight:400;letter-spacing:-.01em}
  .ko strong{font-weight:600}
  .page.a4 .ko{font-size:27pt;line-height:1.85}
  .page.b5 .ko{font-size:21pt;line-height:1.85}

  .divider{display:flex;align-items:center;justify-content:center;flex:none}
  .page.a4 .divider{width:60mm;margin:14mm 0;gap:6mm}
  .page.b5 .divider{width:52mm;margin:11mm 0;gap:5mm}
  .divider .seg{flex:1;height:1px;background:var(--line);opacity:.55}
  .divider .dot{width:5px;height:5px;border:1px solid var(--line);transform:rotate(45deg);flex:none}

  .jp{font-family:'Noto Serif JP',serif;color:#222;font-weight:300;letter-spacing:.01em}
  .page.a4 .jp{font-size:16pt;line-height:2.0}
  .page.b5 .jp{font-size:13pt;line-height:2.0}

  .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:1.5mm}
  .page.a4 .foot{padding-top:16mm}
  .page.b5 .foot{padding-top:12mm}
  .foot-logo{display:flex;justify-content:center;margin-bottom:2.5mm}
  .foot-logo img{display:block;height:auto}
  .page.a4 .foot-logo img{width:48mm}
  .page.b5 .foot-logo img{width:41mm}
  .foot-resort{font-family:'Noto Serif JP',serif;color:#333;letter-spacing:.14em;text-indent:.14em}
  .page.a4 .foot-resort{font-size:11.5pt}
  .page.b5 .foot-resort{font-size:11pt}
  .foot-co{font-family:'Pretendard',sans-serif;color:#6b6b6b;letter-spacing:.20em;text-indent:.20em}
  .page.a4 .foot-co{font-size:10pt}
  .page.b5 .foot-co{font-size:9pt}

  /* ── 반응형 ── */
  @media (max-width:768px){
    .app{height:auto}
    .body{flex-direction:column}
    .editor{flex:none;max-width:none;width:100%;border-right:0;border-bottom:1px solid var(--ui-border)}
    .preview{min-height:70vh}
    .print-hint{display:none}
  }

  /* ── 인쇄: 용지(.page)만 실제 크기로 ── */
  @media print{
    html,body{height:auto;background:#fff}
    .toolbar,.editor,.print-hint{display:none!important}
    .app,.body{display:block;height:auto}
    .preview{display:block;overflow:visible;background:#fff}
    .stage{display:block;padding:0;min-height:0;overflow:visible}
    .page-wrap{width:auto!important;height:auto!important}
    .page{transform:none!important;box-shadow:none;margin:0}
  }
</style>
</head>
<body>
<div class="app">

  <header class="toolbar">
    <a class="home" href="../index.html" title="홈 / ホーム">← 홈</a>
    <div class="brand">안내문 제작기<small>야마나미 리조트 · 현장 안내문</small></div>
    <div class="spacer"></div>
    <div class="seg-toggle" id="paper-toggle" role="group" aria-label="용지 크기">
      <button type="button" data-paper="a4">A4</button>
      <button type="button" data-paper="b5">B5</button>
    </div>
    <div class="print-hint">인쇄 대화상자에서 <b>용지=선택 크기</b>, <b>여백=없음</b>으로 설정하세요.</div>
    <button class="btn" id="btn-print" type="button">🖨 인쇄 / PDF 저장</button>
  </header>

  <div class="body">
    <!-- 편집 패널 -->
    <section class="editor">
      <div class="grp">
        <p class="gl">프리셋</p>
        <div class="presets" id="presets"></div>
      </div>

      <div class="grp">
        <p class="gl">상단 라벨</p>
        <div class="row2">
          <div class="field">
            <label for="f-labelKo">한국어</label>
            <input id="f-labelKo" type="text" autocomplete="off">
          </div>
          <div class="field">
            <label for="f-labelJp">일본어</label>
            <input id="f-labelJp" type="text" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="grp">
        <p class="gl">본문</p>
        <div class="field">
          <label for="f-ko">한국어 본문 <span class="hint">— 줄바꿈 유지 · <code>**강조**</code> 굵게</span></label>
          <textarea id="f-ko"></textarea>
        </div>
        <div class="field">
          <label for="f-jp">일본어 본문 <span class="hint">— 줄바꿈 유지</span></label>
          <textarea id="f-jp"></textarea>
        </div>
      </div>

      <div class="grp">
        <p class="gl">하단 서명 <span class="hint" style="font-weight:500;text-transform:none;letter-spacing:0">— 비우면 해당 줄 숨김</span></p>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ui-text2);margin:0 0 13px;cursor:pointer"><input type="checkbox" id="f-logo" checked style="width:16px;height:16px;accent-color:var(--ui-accent)"> 하단 SaiZen 로고 표시</label>
        <div class="field">
          <label for="f-resort">리조트명</label>
          <input id="f-resort" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-co">회사명</label>
          <input id="f-co" type="text" autocomplete="off">
        </div>
      </div>
    </section>

    <!-- 미리보기 -->

        <div class="page-wrap" id="page-wrap">

            <div class="frame">

              <div class="rule-top"></div>
              <div class="ko" id="pv-ko"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);

/* ── 프리셋 (일본어 문구는 검증본 — 임의 변경 금지) ── */
const PRESETS = [
  { id:"table", name:"테이블 / 자리 정리", labelKo:"이용 안내", labelJp:"ご案内",
    ko:"사용하신 후에는\n다음 이용하시는 분을 위해\n자리를 **간단히 정리**해 주시면\n감사하겠습니다.",
    jp:"ご利用後は、次にご利用の方のために\nテーブルを簡単にお片付けいただけますと\n幸いです。" },
  { id:"cart", name:"카트 이용 안내", labelKo:"이용 안내", labelJp:"ご案内",
    ko:"카트는 안전을 위해\n지정된 장소에 주차해 주시고\n**저속으로 운행**해 주시기\n바랍니다.",
    jp:"カートは安全のため\n所定の場所に駐車いただき\n低速での走行にご協力\nお願いいたします。" },
  { id:"quiet", name:"정숙 / 매너", labelKo:"매너 안내", labelJp:"お願い",
    ko:"다른 이용객을 위해\n**조용한 이용**에\n협조해 주시면\n감사하겠습니다.",
    jp:"他のお客様のために\nお静かにご利用いただけますと\n幸いです。" },
  { id:"recycle", name:"분리수거 / 쓰레기", labelKo:"분리수거 안내", labelJp:"ご案内",
    ko:"쓰레기는 종류별로\n**분리수거**에\n협조해 주시기\n바랍니다.",
    jp:"ゴミは種類ごとに\n分別へのご協力を\nお願いいたします。" }
];

const DEFAULT_RESORT = "阿蘇やまなみリゾート";
const DEFAULT_CO = "株式会社SaiZen";
const LS_KEY = "notice_builder_v1";

const els = {
  labelKo:$("#f-labelKo"), labelJp:$("#f-labelJp"), ko:$("#f-ko"), jp:$("#f-jp"),
  resort:$("#f-resort"), co:$("#f-co"),
  pvK:$("#pv-kicker"), pvKJ:$("#pv-kickerJp"), pvKo:$("#pv-ko"), pvJp:$("#pv-jp"),
  pvR:$("#pv-resort"), pvCo:$("#pv-co"),
  page:$("#page"), wrap:$("#page-wrap"), stage:$("#stage"), pageSize:$("#page-size"),
  logoWrap:$("#pv-logo"), logoChk:$("#f-logo")
};
let paper = "b5";

/* ── **강조** 파서 (XSS 안전: escape → strong → br) ── */
function esc(t){ return String(t==null?"":t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(t, bold){
  let s = esc(t);
  if(bold) s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s.replace(/\n/g, '<br>');
}

function render(){
  els.logoWrap.style.display = els.logoChk.checked ? "" : "none";
  els.pvK.textContent  = els.labelKo.value;
  els.pvKJ.textContent = els.labelJp.value;
  els.pvKo.innerHTML   = fmt(els.ko.value, true);
  els.pvJp.innerHTML   = fmt(els.jp.value, false);
  const r = els.resort.value.trim(), c = els.co.value.trim();
  els.pvR.textContent = r; els.pvR.style.display = r ? "" : "none";
  els.pvCo.textContent = c; els.pvCo.style.display = c ? "" : "none";
}

function applyPaper(p){
  paper = p;
  els.page.classList.remove("a4","b5");
  els.page.classList.add(p);
  els.pageSize.textContent = "@page{size:" + p.toUpperCase() + " portrait;margin:0}";
  document.querySelectorAll("#paper-toggle button").forEach(b =>
    b.classList.toggle("on", b.dataset.paper === p));
  fit();
}

/* 미리보기를 스테이지에 맞춰 축소(픽셀 동일, 확대는 안 함) */
function fit(){
  els.page.style.transform = "none";
  const pw = els.page.offsetWidth, ph = els.page.offsetHeight;
  if(!pw || !ph) return;
  const availW = els.stage.clientWidth  - 52;   // padding 26*2
  const availH = els.stage.clientHeight - 52;
  const s = Math.min(1, availW / pw, availH / ph);
  els.page.style.transform = "scale(" + s + ")";
  els.wrap.style.width  = (pw * s) + "px";
  els.wrap.style.height = (ph * s) + "px";
}

function loadPreset(p){
  els.labelKo.value = p.labelKo; els.labelJp.value = p.labelJp;
  els.ko.value = p.ko; els.jp.value = p.jp;
  els.resort.value = els.resort.value || DEFAULT_RESORT;
  els.co.value = els.co.value || DEFAULT_CO;
  render(); save();
}

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({
    paper, labelKo:els.labelKo.value, labelJp:els.labelJp.value,
    ko:els.ko.value, jp:els.jp.value, resort:els.resort.value, co:els.co.value, logo:els.logoChk.checked
  })); }catch(e){}
}
function restore(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(LS_KEY) || "null"); }catch(e){}
  if(!d){ // 최초 = 첫 프리셋 + 기본 서명
    els.resort.value = DEFAULT_RESORT; els.co.value = DEFAULT_CO;
    loadPreset(PRESETS[0]); applyPaper("b5"); return;
  }
  els.labelKo.value = d.labelKo || ""; els.labelJp.value = d.labelJp || "";
  els.ko.value = d.ko || ""; els.jp.value = d.jp || "";
  els.resort.value = d.resort != null ? d.resort : DEFAULT_RESORT;
  els.co.value = d.co != null ? d.co : DEFAULT_CO;
  els.logoChk.checked = d.logo !== false;
  render(); applyPaper(d.paper === "a4" ? "a4" : "b5");
}

/* ── 프리셋 버튼 ── */
const pbox = $("#presets");
PRESETS.forEach(p => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "preset";
  b.innerHTML = '<div class="pn"></div><div class="pd"></div>';
  b.querySelector(".pn").textContent = p.name;
  b.querySelector(".pd").textContent = p.ko.replace(/\*\*/g,"").replace(/\n/g," ");
  b.addEventListener("click", () => loadPreset(p));
  pbox.appendChild(b);
});

/* ── 이벤트 ── */
["labelKo","labelJp","ko","jp","resort","co"].forEach(k =>
  els[k].addEventListener("input", () => { render(); save(); }));
els.logoChk.addEventListener("change", () => { render(); save(); });
document.querySelectorAll("#paper-toggle button").forEach(b =>
  b.addEventListener("click", () => { applyPaper(b.dataset.paper); save(); }));
$("#btn-print").addEventListener("click", () => window.print());

if(window.ResizeObserver) new ResizeObserver(fit).observe(els.stage);
window.addEventListener("resize", fit);
window.addEventListener("beforeprint", () => els.page.style.transform = "none");
window.addEventListener("afterprint", fit);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

restore();
setTimeout(fit, 60);
</script>
</body>
</html>
