<!DOCTYPE html>
<html lang="ja">
<!-- ============================================================================
  정산 보고서 · 精算 日報 / 週報 / 月報 / 年報 + 일 마감(日次締め)
  (Min 2026-10-27 「ops로 최종 정산까지 마무리하고 최종 정산된 화면까지 · 일마다 정산일보·주보·월보·연보」)
  ----------------------------------------------------------------------------
  · 서버 RPC settle_report(from,to)(SQL 156)가 일별 집계를 한 번에 주고, 화면이 주(월~일)·월·연으로 묶는다.
  · 매출 = charges(취소 제외) 税込, 날짜 = charged_at JST · 입금 = payments 현금/카드, 날짜 = paid_at JST
  · 정산 완료 = folios settled(closed_at JST) · 미수 기말 = 그날까지 누적 청구 − 누적 입금(전 기간)
  · 체크인/체크아웃/재실 = bookings(대기 제외) · 워크인 = walkins · 미정산 체크아웃 = 체크아웃인데 잔액≠0 또는 청구 있는 계산서가 미마감
  · 일보 [일 마감] = settle_day_close RPC → 그날 숫자를 스냅샷으로 고정(마감 완료 화면). 마감 뒤 숫자가 바뀌면 「마감 후 변경 있음」.
  · B2B(現地精算表) 금액은 월보·연보에 「참고」로만 — 현장 정산(folio)과 섞지 않는다(§11 정산 2종 분리).
  · 인쇄 = A4 세로(네이비/모노톤, @page 는 최상위) · 엑셀 = ExcelJS(영문 파일명).
============================================================================ -->

  if(typeof v==='function') return v(...a); return v; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg,cls){ const t=document.createElement('div'); t.className='toast'+(cls?' '+cls:''); t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); },2600); }

function yen(n){ n=Math.round(Number(n||0)); return (n<0?'-':'')+'¥'+Math.abs(n).toLocaleString('ja-JP'); }
function num(n){ return Number(n||0).toLocaleString('ja-JP'); }

// ── 날짜(JST · 문자열 연산 — 브라우저 시간대에 흔들리지 않게 UTC 로 계산) ──
function jstToday(){ return new Date(Date.now()+9*3600e3).toISOString().slice(0,10); }
function addDays(ds,n){ const t=Date.UTC(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10)); return new Date(t+n*86400e3).toISOString().slice(0,10); }
function wdIdx(ds){ return new Date(ds+'T00:00:00Z').getUTCDay(); }
function wdName(ds){ return tx('wd')[wdIdx(ds)]; }
function monthEnd(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10); }
function md(ds){ return Number(ds.slice(5,7))+'/'+Number(ds.slice(8,10)); }
function rangeOf(unit, base){
  if(unit==='day') return {from:base, to:base};
  if(unit==='week'){ const mon=addDays(base, -((wdIdx(base)+6)%7)); return {from:mon, to:addDays(mon,6)}; }   // 월~일
  if(unit==='month'){ const ym=base.slice(0,7); return {from:ym+'-01', to:monthEnd(ym)}; }
  const y=base.slice(0,4); return {from:y+'-01-01', to:y+'-12-31'};
}
function shiftBase(n){
  if(UNIT==='day') BASE=addDays(BASE,n);
  else if(UNIT==='week') BASE=addDays(BASE,7*n);
  else if(UNIT==='month'){ const y=+BASE.slice(0,4), m=+BASE.slice(5,7); BASE=new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,10); }
  else { BASE=(+BASE.slice(0,4)+n)+'-01-01'; }
}
function rangeText(r){
  if(UNIT==='day') return `${r.from} (${wdName(r.from)})`;
  if(UNIT==='week') return tx('weekRange', `${r.from} (${wdName(r.from)})`, `${r.to} (${wdName(r.to)})`);
  if(UNIT==='month') return tx('monthLbl', r.from.slice(0,7));
  return tx('yearLbl', r.from.slice(0,4));
}
function titleOf(){ return tx({day:'titleDay',week:'titleWeek',month:'titleMonth',year:'titleYear'}[UNIT]); }
function catLabel(c){ const v=tx('cat_'+c); return v==='cat_'+c?c:v; }
function srcLabel(s){ const v=tx('src_'+s); return v==='src_'+s?s:v; }

// ── 입력 동기화 ──

  $('#p-date').style.display=(UNIT==='day'||UNIT==='week')?'':'none';
  $('#p-month').style.display=(UNIT==='month')?'':'none';
  $('#p-year').style.display=(UNIT==='year')?'':'none';
  $('#p-date').value=BASE; $('#p-month').value=BASE.slice(0,7); $('#p-year').value=BASE.slice(0,4);

// ── 로드 ──
async function load(){
  renderLabel();
  if(!supa){ return; }
  const r=rangeOf(UNIT,BASE);
  LOADING=true; $('#report').innerHTML=`<div class="empty">${esc(tx('loading'))}</div>`;
  $('#btn-print').disabled=true; $('#btn-xlsx').disabled=true;
  const {data,error}=await supa.rpc('settle_report',{p_from:r.from, p_to:r.to});
  LOADING=false;
  if(error){ DATA=null; $('#report').innerHTML=`<div class="empty">${esc(tx('loadFail')+error.message)}</div>`; return; }
  DATA=data||null; render();
}

// ── 버킷(연보 = 월별) ──
function monthBuckets(days){
  const m={}; days.forEach(d=>{ const k=d.d.slice(0,7); const b=m[k]=m[k]||{ym:k, days:[], gross:0,net:0,tax:0,ch_n:0,pay:0,cash:0,card:0,pay_n:0,set_n:0,set_amount:0,ci_teams:0,ci_pax:0,co_teams:0,co_pax:0,wk_teams:0,wk_pax:0,closed:0,past:0,ar_end:0};
    b.days.push(d); ['gross','net','tax','ch_n','pay','cash','card','pay_n','set_n','set_amount','ci_teams','ci_pax','co_teams','co_pax','wk_teams','wk_pax'].forEach(k=>{ b[k]+=Number(d[k]||0); });
    if(d.closed) b.closed++; if(d.d<=DATA.range.today) b.past++; b.ar_end=Number(d.ar_end||0); });
  return Object.keys(m).sort().map(k=>m[k]);
}

// ── 그리기 ──
function render(){
  if(!DATA){ return; }
  const r=DATA.range, days=DATA.days||[], tot=DATA.totals||{}, today=r.today;
  renderLabel();
  let html='';
  if(UNIT==='day') html+=closeHTML(days[0]||{d:r.from}, today);
  html+=kpiHTML(tot, days, today);
  html+=`<div class="grid2">${catHTML(DATA.by_cat||[], tot)}${payHTML(tot, DATA.by_source||[])}</div>`;
  if(UNIT==='week'||UNIT==='month') html+=daysHTML(days, today);
  if(UNIT==='year') html+=monthsHTML(monthBuckets(days), today);
  if(UNIT!=='year') html+=unsettledHTML(DATA.unsettled||[]);
  if(UNIT==='month'||UNIT==='year') html+=b2bHTML(DATA.b2b||{});
  $('#report').innerHTML=html;
  wire();
  $('#btn-print').disabled=false; $('#btn-xlsx').disabled=false;
  $('#ph-title').textContent=`${titleOf()} · ${rangeText(r)}`;
  const u=curUser(); $('#ph-meta').textContent=`${tx('printedAt')} ${tsShort(new Date().toISOString())}${u?' · '+tx('printedBy')+' '+u:''}`;
}

async function closeDay(){
  if(!supa||!DATA) return;
  const d=(DATA.days||[])[0]; if(!d) return;
  const cashRaw=$('#cl-cash').value.trim(); const cash=cashRaw===''?null:Math.round(Number(cashRaw));
  const note=$('#cl-note').value.trim();
  const un=(DATA.unsettled||[]).length;
  if(!confirm(tx('clConfirm', `${d.d} (${wdName(d.d)})`, yen(d.gross), yen(d.pay), un))) return;
  const btn=$('#btn-close'); if(btn) btn.disabled=true;
  try{
    const {error}=await supa.rpc('settle_day_close',{p_date:d.d, p_cash:cash, p_note:note||null, p_by:curUser()});
    if(error) throw error;
    toast(tx('clDoneToast'),'ok'); await load();
  }catch(e){
    const msg=String(e.message||e);
    toast((/function|schema cache|does not exist/i.test(msg)?tx('clNoRpc'):tx('clFail')+msg),'err');
    if(btn) btn.disabled=false;
  }
}
async function reopenDay(){
  if(!supa||!DATA) return;
  const d=(DATA.days||[])[0]; if(!d||!d.closed) return;
  if(!confirm(tx('clReopenConfirm', `${d.d} (${wdName(d.d)})`))) return;
  const btn=$('#btn-reopen'); if(btn) btn.disabled=true;
  try{
    const {error}=await supa.rpc('settle_day_reopen',{p_date:d.d, p_by:curUser()});

function fileName(){ const f=DATA.range.from.replace(/-/g,''); if(UNIT==='day') return `settle_daily_${f}.xlsx`; if(UNIT==='week') return `settle_weekly_${f}.xlsx`; if(UNIT==='month') return `settle_monthly_${f.slice(0,6)}.xlsx`; return `settle_yearly_${f.slice(0,4)}.xlsx`; }
async function downloadXlsx(){
  if(!DATA) return;
  if(!window.ExcelJS){ toast(tx('xlsxFail')+'ExcelJS','err'); return; }
  const NAVY='FF1A2540', SOFT='FFEAF0F7', LINE='FFB9C4D6';
  const bAll=()=>{ const s={style:'thin',color:{argb:LINE}}; return {top:s,left:s,bottom:s,right:s}; };
  const head=(ws,row,heads)=>{ heads.forEach((h,i)=>{ const c=ws.getRow(row).getCell(i+1); c.value=h; c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.border=bAll(); c.alignment={horizontal:i?'right':'left'}; }); };
  const put=(ws,row,vals,yenCols,bold)=>{ vals.forEach((v,i)=>{ const c=ws.getRow(row).getCell(i+1); c.value=v; c.border=bAll(); c.alignment={horizontal:(typeof v==='number')?'right':'left'};
      if(yenCols&&yenCols.includes(i)) c.numFmt='¥#,##0'; if(bold){ c.font={bold:true,color:{argb:NAVY}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:SOFT}}; } }); };
  const title=(ws,text,cols)=>{ ws.mergeCells(1,1,1,cols); const c=ws.getCell('A1'); c.value=text; c.font={bold:true,size:14,color:{argb:NAVY}}; };
  const N=v=>Number(v||0);
  try{
    const wb=new ExcelJS.Workbook(); wb.creator='SaiZen';
    const r=DATA.range, t=DATA.totals||{}, days=DATA.days||[];
    const ttl=`${titleOf()} ${rangeText(r)}`;
    // 要約
    const w1=wb.addWorksheet('要約'); w1.columns=[{width:30},{width:20},{width:14}];
    title(w1, ttl, 3);
    let rr=3;
    const line=(k,v,isYen,unit)=>{ put(w1,rr,[k,v,unit||''], isYen?[1]:[]); rr++; };
    line(tx('kSales'), N(t.gross), true); line(tx('kNet'), N(t.net), true); line(tx('kTax'), N(t.tax), true); line(tx('thN'), N(t.ch_n), false, tx('uCnt'));
    line(tx('kPay'), N(t.pay), true); line(tx('kCash'), N(t.cash), true); line(tx('kCard'), N(t.card), true); line(tx('kPay')+' '+tx('thN'), N(t.pay_n), false, tx('uCnt'));
    line(tx('kSettled'), N(t.set_n), false, tx('uCnt')); line(tx('kSettled')+' '+tx('thGross'), N(t.set_amount), true);
    line(tx('kAr')+' ('+tx('kArStart')+')', N(t.ar_start), true); line(tx('kAr'), N(t.ar_end), true);
    line(tx('kCi')+' '+tx('uTeam'), N(t.ci_teams)); line(tx('kCi')+' '+tx('uPax'), N(t.ci_pax)); line(tx('kCo')+' '+tx('uTeam'), N(t.co_teams)); line(tx('kCo')+' '+tx('uPax'), N(t.co_pax));
    line(tx('kWalkin')+' '+tx('uTeam'), N(t.wk_teams)); line(tx('kWalkin')+' '+tx('uPax'), N(t.wk_pax));
    line(tx('kClosedDays'), `${N(t.closed_days)} / ${N(t.past_days)}`);
    if(UNIT==='day'){ const d=days[0]||{}; line(tx('kStay'), N(d.stay_pax), false, tx('uPax'));
      if(d.closed){ line(tx('clDone'), `${tsShort(d.closed.closed_at)} · ${d.closed.closed_by||'-'}`); if(d.closed.cash_counted!=null){ line(tx('clCash'), N(d.closed.cash_counted), true); line(tx('clDiff'), N(d.closed.cash_counted)-N(d.cash), true); } if(d.closed.note) line(tx('clNote'), d.closed.note); }
      else line(tx('thClosed'), d.d>r.today?tx('clFuture'):tx('clOpen')); }
    // 区分別(税込만) + 税率別(세액=계산서·세율별 1회 버림)
    const w2=wb.addWorksheet('区分別'); w2.columns=[{width:18},{width:10},{width:14},{width:13},{width:14}];
    title(w2, ttl, 5); head(w2,3,[tx('thCat'),tx('thN'),tx('thGross')]);
    let r2=4; const byCat=DATA.by_cat||[]; const map={}; byCat.forEach(x=>{ map[x.category]=x; });
    CATS.concat(byCat.map(x=>x.category).filter(c=>!CATS.includes(c))).forEach(c=>{ const x=map[c]; if(!x) return; put(w2,r2,[catLabel(c),N(x.n),N(x.gross)],[2]); r2++; });
    put(w2,r2,[tx('thTotal'),N(t.ch_n),N(t.gross)],[2],true); r2+=2;
    if(DATA.by_rate){ w2.getCell(`A${r2}`).value=tx('sRate'); w2.getCell(`A${r2}`).font={bold:true,color:{argb:NAVY}}; r2++;
      head(w2,r2,[tx('thRate'),tx('thN'),tx('thGross'),tx('thTax'),tx('thNet')]); r2++;
      DATA.by_rate.forEach(b=>{ put(w2,r2,[rateLabel(b),N(b.n),N(b.gross),N(b.tax),N(b.net)],[2,3,4]); r2++; });
      put(w2,r2,[tx('thTotal'),N(t.ch_n),N(t.gross),N(t.tax),N(t.net)],[2,3,4],true); r2++;
      w2.getCell(`A${r2}`).value=tx('taxNote'); }
    else { w2.getCell(`A${r2}`).value=tx('rateNA'); }
    // 店舗別
    const w3=wb.addWorksheet('店舗別'); w3.columns=[{width:24},{width:10},{width:14}];
    title(w3, ttl, 3); head(w3,3,[tx('thSource'),tx('thN'),tx('thGross')]);
    let r3=4; (DATA.by_source||[]).forEach(x=>{ put(w3,r3,[srcLabel(x.source),N(x.n),N(x.gross)],[2]); r3++; });
    // 日別 / 月別
    if(UNIT!=='day'){
      const isY=UNIT==='year';
      const w4=wb.addWorksheet(isY?'月別':'日別'); w4.columns=[{width:14},{width:14},{width:13},{width:13},{width:14},{width:9},{width:14},{width:9},{width:9},{width:9},{width:9},{width:12}];
      title(w4, ttl, 12); head(w4,3,[isY?tx('thMonth'):tx('thDate'),tx('thSales'),tx('thCash'),tx('thCard'),tx('thPay'),tx('thSettled'),tx('thAr'),tx('thCi')+' '+tx('uTeam'),tx('thCi')+' '+tx('uPax'),tx('thCo')+' '+tx('uTeam'),tx('thCo')+' '+tx('uPax'),tx('thClosed')]);
      let r4=4;
      const rows=isY?monthBuckets(days):days;
      rows.forEach(d=>{ const lbl=isY?d.ym:`${d.d} (${wdName(d.d)})`; const closed=isY?`${d.closed} / ${d.past}`:(d.closed?tx('clDone'):(d.d>r.today?'':tx('clOpen')));
        put(w4,r4,[lbl,N(d.gross),N(d.cash),N(d.card),N(d.pay),N(d.set_n),N(d.ar_end),N(d.ci_teams),N(d.ci_pax),N(d.co_teams),N(d.co_pax),closed],[1,2,3,4,6]); r4++; });
      put(w4,r4,[tx('thTotal'),N(t.gross),N(t.cash),N(t.card),N(t.pay),N(t.set_n),N(t.ar_end),N(t.ci_teams),N(t.ci_pax),N(t.co_teams),N(t.co_pax),`${N(t.closed_days)} / ${N(t.past_days)}`],[1,2,3,4,6],true);
    }
    // 未精算
    if(UNIT!=='year'){
      const w5=wb.addWorksheet('未精算'); w5.columns=[{width:12},{width:16},{width:13},{width:14},{width:14},{width:14},{width:12}];
      title(w5, ttl, 7); head(w5,3,[tx('thTeam'),tx('thRep'),tx('thCoDate'),tx('thGrossT'),tx('thPaid'),tx('thBalance'),tx('thStatus')]);
      let r5=4; (DATA.unsettled||[]).forEach(u=>{ const bal=N(u.balance); put(w5,r5,[u.tag||'',(u.walkin?tx('unWalkin')+' ':'')+(u.rep_name||''),u.co_date||'',N(u.gross),N(u.paid),bal,bal>0?tx('unDue'):(bal<0?tx('unOver'):tx('unPaid'))],[3,4,5]); r5++; });
      if(r5===4) put(w5,4,[tx('unNone')]);
    }
    // B2B 参考
    if(UNIT==='month'||UNIT==='year'){
      const b=DATA.b2b||{}; const w6=wb.addWorksheet('B2B参考'); w6.columns=[{width:10},{width:10},{width:16},{width:16},{width:16}];
      title(w6, ttl+' · '+tx('sB2B'), 5); head(w6,3,[tx('b2bTeams'),tx('b2bPax'),tx('b2bLodge'),tx('b2bTrans'),tx('b2bTotal')]);
      put(w6,4,[N(b.teams),N(b.pax),N(b.lodge),N(b.trans),N(b.total)],[2,3,4]); w6.getCell('A6').value=tx('b2bNote');
    }
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileName(); document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    toast(tx('xlsxDone'),'ok');
  }catch(e){ toast(tx('xlsxFail')+String(e.message||e),'err'); }
}

// ── 연결 ──
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn(tx('needUrlKey'),'err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.textContent=tx('connecting'); btn.classList.remove('connected');
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('bookings').select('event_seq',{count:'exact',head:true});
    if(error) throw error;
    setConn(tx('connected'),'ok');
    btn.textContent='✓ '+tx('connected'); btn.classList.add('connected'); btn.disabled=false;
    $('#btn-reload').disabled=false;
    await load();
  }catch(e){
    setConn(tx('connFail'),'err'); toast(tx('connFail')+': '+e.message,'err');
    btn.textContent=tx('connFailRetry'); btn.classList.remove('connected'); btn.disabled=false; supa=null;
  }
}

// ── 이벤트 ──
$$('.chip[data-u]').forEach(b=>b.addEventListener('click',()=>setUnit(b.dataset.u)));
$('#nav-prev').addEventListener('click',()=>{ shiftBase(-1); syncInputs(); load(); });
$('#nav-next').addEventListener('click',()=>{ shiftBase(1); syncInputs(); load(); });
$('#nav-today').addEventListener('click',()=>{ BASE=jstToday(); syncInputs(); load(); });
$('#p-date').addEventListener('change',e=>{ if(e.target.value){ BASE=e.target.value; syncInputs(); load(); } });
$('#p-month').addEventListener('change',e=>{ if(e.target.value){ BASE=e.target.value+'-01'; syncInputs(); load(); } });
$('#p-year').addEventListener('change',e=>{ const y=String(e.target.value||'').trim(); if(/^\d{4}$/.test(y)){ BASE=y+'-01-01'; syncInputs(); load(); } });
$('#btn-print').addEventListener('click',printReport);
$('#btn-xlsx').addEventListener('click',downloadXlsx);
$('#btn-reload').addEventListener('click',load);
$('#btn-connect').addEventListener('click',connect);

// ── 시작: 딥링크(?unit=&d=) → 기본 오늘 일보 ──
(function init(){
  const q=new URLSearchParams(location.search);
  const u=q.get('unit'); if(['day','week','month','year'].includes(u)) UNIT=u;
  const d=q.get('d'); BASE=(d&&/^\d{4}-\d{2}-\d{2}$/.test(d))?d:jstToday();
  applyStatic(); syncInputs(); renderLabel();
  loadCreds();
  if($('#sb-url').value && $('#sb-key').value) connect();
})();
</script>
