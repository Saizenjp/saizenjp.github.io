<!-- ============================================================================
  월간 숙박 현황표 · 月間 日別宿泊現況 (Min 2026-10-26 「현지 담당자가 A3 로 프린트해 보던 수기 엑셀 — 더 좋은 양식으로 인쇄」)
  ----------------------------------------------------------------------------
  · 팀(예약) × 날짜 표: 묵는 밤마다 인원을 적는다(체크인 밤 〜 체크아웃 전날 밤 = bookings dep_date ≤ 날짜 < arr_date). 사진의 양식과 같은 뼈대.
  · 등록 데이터에서 자동 생성(bookings·guests·guest_members·passengers) — 손으로 옮겨 적지 않는다. 대기 예약 제외(§3-3).
  · 사진보다 나아진 점: ① 숙소별 묶음 + 숙소별 소계 줄 ② 머리에 날짜별 宿泊·到着·出発 인원 ③ 태그코드·회원 구분·숙박 일수·도착/출발 편 시각(명단의 대표자 항공편)
    ④ 일·공휴일 빨강/토 파랑 열 ⑤ 월 경계 팀(전달 입국·다음 달 귀국)도 그 달 밤만 표시 ⑥ 촘촘한 치수 하나(토글 없음 — Min 2026-10-26) ⑦ A3 가로, 페이지마다 머리 반복 ⑧ 입국·귀국일이 토·일·공휴일이면 날짜 칸에 색, 4명 이상 팀은 줄을 노랗게(Min 2026-10-26).
  · 직원용 인쇄물 = 일본어 우선·한국어 병기(표 머리 고정). 툴바만 언어 토글.
  · 권한: staychart 영역(객실(room) 그룹의 자식, SQL 153 — 권한 관리에 자기 체크표. Min 2026-10-27). 읽기 전용(DB 쓰기 없음).
============================================================================ -->

<style>
  /* ── 공통 chrome (docs/ops-page-skeleton.html 정본 — 통째 복사) ── */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef1;
    --border:#e3e6ea; --border2:#cdd2d8;
    --text:#1f2937; --text2:#525b66; --muted:#8b919b;

  }

  .btn:hover:not(:disabled){background:var(--accentDeep)}

  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}

  /* ── 페이지 전용 ── */

  .pt{display:none}
  .wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px;max-height:calc(100vh - 230px)}
  table.sc{border-collapse:separate;border-spacing:0;font-size:10px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}   /* 촘촘한 치수 하나(옛 「촘촘하게」 토글 값, Min 2026-10-26 토글 폐지) */
  .sc th,.sc td{border-right:1px solid #cfd4da;border-bottom:1px solid #cfd4da;padding:0 3px;text-align:center;vertical-align:middle}

  .sc thead tr:nth-child(1) th{top:0} .sc thead tr:nth-child(2) th{top:22px} .sc thead tr:nth-child(3) th{top:40px} .sc thead tr:nth-child(4) th{top:58px} .sc thead tr:nth-child(5) th{top:76px}

  .sc th.tt{background:#e4e9dc}
  .sc td.cls{font-size:.9em} .sc td.name{font-weight:700}
  .sc td.pax{font-weight:800}
  /* 입국·귀국 날짜 칸: 토=파랑 · 일/공휴일=빨강(머리줄과 같은 색) / 4명 이상 팀: 왼쪽 정보 칸 연노랑·인원 칸 진한 노랑(Min 2026-10-26) */
  .sc td.dt.sun{color:#b3261e;font-weight:800} .sc td.dt.sat{color:#2b5fa8;font-weight:800}
  .sc tr.team.big td:not(.d){background:#fff1c2} .sc tr.team.big td.pax{background:#f6cf5d;color:#4a3200}
  .sc tr.team.big td.dt.sun{background:#fbeceb} .sc tr.team.big td.dt.sat{background:#eaf1fb}
  .sc tr.mem td.name{color:#1f3a12}
  .sc th.day{line-height:1.05} .sc th.day .wd{display:block;font-size:.85em}

  /* 한 장 맞춤(Min 2026-10-26 「야마나미 제외하고 무조건 1장」): 인쇄 표 치수 = 아래 변수 × --fs(배율, fitOnePage 가 이분탐색으로 정한다).
     body.fitm 은 화면에서 인쇄와 같은 치수로 잠깐 바꿔 높이를 재는 용도(표는 nowrap 이라 폭과 무관하게 높이가 같다). */
  :root{--fs:1; --p-fs:7.4pt; --p-lh:1.05; --p-ph:0.8mm}   /* 인쇄 치수 = 옛 「촘촘하게」 값 하나(토글 폐지) */
  body.fitm table.sc{font-size:calc(var(--p-fs)*var(--fs));line-height:var(--p-lh)} body.fitm .sc th,body.fitm .sc td{padding:0 calc(var(--p-ph)*var(--fs))!important}
  body.fitm .pt{display:flex;align-items:baseline;gap:14px;margin:0 0 3mm;font-size:12pt;font-weight:800}
  .fitnote{font-weight:700;color:var(--accent2);margin-left:8px}

  /* ⚠ @page 는 @media print 안에 넣지 않는다 — 브라우저 인쇄 창이 기본 용지(A3 가로)를 여기서 읽는다. 안에 두면 A4 로 뜬다(Min 2026-10-27). dinner.html 도 같은 방식 */
  @page{size:A3 landscape;margin:7mm}
  @media print{
    body{background:#fff;color:#000}
    .topbar,.conn,.page-help,.bar,.desc,#toast,.so-totop,.so-footer,details.so-help{display:none!important}
    main{padding:0}
    .pt{display:flex;align-items:baseline;gap:14px;margin:0 0 3mm;font-size:12pt;font-weight:800}
    .pt small{font-size:9pt;font-weight:600;color:#444}
    .pt .sp{flex:1}
    .wrap{overflow:visible;border:0;border-radius:0;max-height:none}
    table.sc{font-size:calc(var(--p-fs)*var(--fs));line-height:var(--p-lh);width:100%;border-left:1px solid #999;border-top:1px solid #999}
    .sc th,.sc td{border-color:#999;padding:0 calc(var(--p-ph)*var(--fs))!important}   /* !important: 화면 전용 .sc .d / tr.grp td 의 고정 padding 을 이긴다 — 측정(body.fitm)과 같은 치수 */
    .sc thead th{position:static;background:#e8ece2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    thead{display:table-header-group}
    tr{page-break-inside:avoid;break-inside:avoid}
    tr.grp{page-break-after:avoid;break-after:avoid}
    .sc td,.sc th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

// ── 날짜 유틸(문자열 'YYYY-MM-DD' 비교만 — 시간대 영향 없음) ──
function pad2(n){ return String(n).padStart(2,'0'); }
function daysIn(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function dstr(ym,d){ return ym+'-'+pad2(d); }
function wdOf(ds){ const [y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d).getDay(); }
function md(ds){ return ds?String(Number(ds.slice(5,7)))+'/'+String(Number(ds.slice(8,10))):''; }
function hhmm(s){ const m=String(s||'').match(/(\d{1,2}):(\d{2})/); return m?pad2(m[1])+':'+m[2]:''; }
function nightsOf(dep,arr){ try{ return SZCore.nightsBetween(dep,arr); }catch(e){ return Math.max(0,Math.round((new Date(arr)-new Date(dep))/86400000)); } }
function accomKey(a){ return ACCOM_KEY[a]||((window.SZCore&&SZCore.accomPrefix)?SZCore.accomPrefix(a):'Y')||'Y'; }
function classOf(rep){   // 회원 구분(사진의 Grouping): 실제 등급(회원권구분) 우선 → 회원/일반
  if(!rep) return '一般';
  const c=String(rep.member_class||'').trim(); if(c) return c;
  try{ if(window.SZCore&&SZCore.isMember&&SZCore.isMember(rep)) return '会員'; }catch(e){}
  return '一般';
}
function portOf(origin,flight){ try{ return (window.SZCore&&SZCore.originPort)?(SZCore.originPort(origin,flight)||''):''; }catch(e){ return ''; } }

// ── 로드 ──
async function fetchAll(q){ let out=[], pg=0; while(true){ const {data,error}=await q.range(pg,pg+999); if(error) throw error; out=out.concat(data||[]); if(!data||data.length<1000) break; pg+=1000; } return out; }
async function load(){
  if(!supa||!YM) return;
  const m1=dstr(YM,1), mEnd=dstr(YM,daysIn(YM));
  $('#sum').textContent=tx('loading');
  try{
    // 그 달에 밤이 하나라도 있는 예약: dep ≤ 월말 && arr > 월초 (arr=체크아웃일, 그날 밤은 안 묵음). 대기 제외.
    const bs=await fetchAll(supa.from('bookings').select('event_seq,event_no,rep_name,dep_date,arr_date,pax,product_name,origin,airline,status,nights_label').lte('dep_date',mEnd).gt('arr_date',m1).neq('status','대기').order('dep_date').order('event_seq'));
    const seqs=bs.map(b=>b.event_seq);
    const G={}, REP={}, PX={};
    for(let i=0;i<seqs.length;i+=200){ const ch=seqs.slice(i,i+200);
      const {data:gs,error:e1}=await supa.from('guests').select('event_seq,accom,team_tag,group_code,pax').in('event_seq',ch); if(e1) throw e1; (gs||[]).forEach(g=>{ G[g.event_seq]=g; });
      const {data:gm,error:e2}=await supa.from('guest_members').select('event_seq,is_rep,seq_in_team,passenger_id,member_class,member_grade,member_div').in('event_seq',ch); if(e2) throw e2;
      (gm||[]).forEach(r=>{ const cur=REP[r.event_seq]; if(!cur || (r.is_rep&&!cur.is_rep) || (!!r.is_rep===!!cur.is_rep && (r.seq_in_team||99)<(cur.seq_in_team||99))) REP[r.event_seq]=r; });
    }
    const pids=Object.values(REP).map(r=>r.passenger_id).filter(Boolean);
    for(let i=0;i<pids.length;i+=200){ const {data:ps,error:e3}=await supa.from('passengers').select('id,loc_arr_time,ret_dep_time,dep_flight,ret_flight,origin,airline').in('id',pids.slice(i,i+200)); if(e3) throw e3; (ps||[]).forEach(p=>{ PX[p.id]=p; }); }
    TEAMS=bs.map(b=>{ const g=G[b.event_seq]||{}, rep=REP[b.event_seq]||null, p=rep?(PX[rep.passenger_id]||{}):{};
      const accom=g.accom||((window.SZCore&&SZCore.accomFromProduct)?SZCore.accomFromProduct(b.product_name||''):'')||'야마나미리조트';
      const depF=p.dep_flight||'', retF=p.ret_flight||'';
      return { seq:b.event_seq, no:String(b.event_no||b.event_seq||''), rep:b.rep_name||'', tag:g.team_tag||g.group_code||'', cls:classOf(rep),
        pax:Number(b.pax||g.pax||0)||0, accom, ak:accomKey(accom), dep:String(b.dep_date||'').slice(0,10), arr:String(b.arr_date||'').slice(0,10),
        arrT:hhmm(p.loc_arr_time), depT:hhmm(p.ret_dep_time), port:portOf(p.origin||b.origin, depF||b.airline), retPort:portOf(p.origin||b.origin, retF||b.airline),
        nights:nightsOf(String(b.dep_date||'').slice(0,10),String(b.arr_date||'').slice(0,10)), member:(rep?!!(window.SZCore&&SZCore.isMember&&SZCore.isMember(rep)):false) };
    });
    LOADED=YM; render();
  }catch(e){ toast(tx('loadFail')+': '+(e&&e.message||e),'err'); $('#sum').textContent=''; }
}

// ── 렌더 ──
function visibleTeams(){ return TEAMS.filter(t=>!ACC.size||ACC.has(t.ak)); }
function nightSpan(t, ym){   // 이 달 안에서 묵는 날짜 집합(1..N) — dep ≤ d < arr
  const N=daysIn(ym), out=[]; for(let d=1;d<=N;d++){ const ds=dstr(ym,d); if(t.dep<=ds && ds<t.arr) out.push(d); } return out;
}
function dayTotals(list, ym){
  const N=daysIn(ym), stay=Array(N+1).fill(0), arrv=Array(N+1).fill(0), leave=Array(N+1).fill(0), teams=Array(N+1).fill(0);
  list.forEach(t=>{ nightSpan(t,ym).forEach(d=>{ stay[d]+=t.pax; teams[d]++; }); const a=t.dep.startsWith(ym+'-')?Number(t.dep.slice(8,10)):0; const l=t.arr.startsWith(ym+'-')?Number(t.arr.slice(8,10)):0; if(a) arrv[a]+=t.pax; if(l) leave[l]+=t.pax; });
  return {stay,arrv,leave,teams};
}
function dateCls(ds){ if(!ds) return ''; const w=wdOf(ds); return (w===0||HOL.has(ds))?' sun'+(HOL.has(ds)?' hol':''):(w===6?' sat':''); }   // 일·공휴일 sun(+hol) / 토 sat
function dayCls(ym,d){ return dateCls(dstr(ym,d)); }
const BIG_PAX=4;   // 이 인원 이상이면 팀 줄을 노랗게(Min 2026-10-26)
function headHTML(ym, tot){
  const N=daysIn(ym);
  const info=[['No.','행사'],['代表者','대표자'],['タグ','태그'],['区分','회원구분'],['人数','인원'],['宿泊先','숙소'],['入国','입국'],['到着','도착'],['帰国','귀국'],['出発','출발'],['泊','박수']];
  const r1='<tr>'+info.map(([j,k])=>`<th rowspan="5" class="tt">${j}<small>${k}</small></th>`).join('')+Array.from({length:N},(_,i)=>`<th class="d day num${dayCls(ym,i+1)}">${i+1}</th>`).join('')+'</tr>';
  const r2='<tr>'+Array.from({length:N},(_,i)=>`<th class="d day${dayCls(ym,i+1)}"><span class="wd">${WD_JA[wdOf(dstr(ym,i+1))]}</span></th>`).join('')+'</tr>';
  const row=(lbl,arr,cls)=>'<tr>'+Array.from({length:N},(_,i)=>`<th class="d ${cls}${dayCls(ym,i+1)}" title="${lbl}">${arr[i+1]||''}</th>`).join('')+'</tr>';
  // 머리 3~5줄: 그날 밤 宿泊 인원 · 그날 到着 인원 · 그날 出発 인원 (왼쪽 라벨은 info 칸 rowspan 아래 첫 칸에 못 넣어 툴팁+범례로)
  return '<thead>'+r1+r2+row('宿泊 · 숙박',tot.stay,'num stay')+row('到着 · 도착',tot.arrv,'num arr')+row('出発 · 출발',tot.leave,'num lv')+'</thead>';
}
function teamRowHTML(t, ym){
  const N=daysIn(ym), span=new Set(nightSpan(t,ym));
  const cells=Array.from({length:N},(_,i)=>{ const d=i+1, ds=dstr(ym,d); const on=span.has(d);
    const first=on&&ds===t.dep, last=on&&dstr(ym,d+1)===t.arr;
    return `<td class="d${dayCls(ym,d)}${on?' on':''}${first?' first':''}${last?' last':''}">${on?t.pax:''}</td>`; }).join('');
  const noTail=t.no.includes('-')?t.no.split('-').pop():t.no;
  return `<tr class="team${t.member?' mem':''}${t.pax>=BIG_PAX?' big':''}" data-seq="${t.seq}">`
    +`<td class="mono num" title="${esc(t.no)}">${esc(noTail)}</td><td class="l name">${esc(t.rep)}</td><td class="mono">${esc(t.tag)}</td><td class="cls">${esc(t.cls)}</td><td class="pax">${t.pax}</td><td>${ACCOM_JA[t.ak]||esc(t.accom)}</td>`
    +`<td class="mono dt${dateCls(t.dep)}">${md(t.dep)}</td><td class="mono">${esc(t.arrT)}${t.port?`<small>${t.port}</small>`:''}</td><td class="mono dt${dateCls(t.arr)}">${md(t.arr)}</td><td class="mono">${esc(t.depT)}${t.retPort?`<small>${t.retPort}</small>`:''}</td><td>${t.nights}</td>`+cells+'</tr>';
}
function totRowHTML(label, list, ym, cls){
  const N=daysIn(ym), tot=dayTotals(list,ym);
  const pax=list.reduce((s,t)=>s+t.pax,0), nights=list.reduce((s,t)=>s+nightSpan(t,ym).length*t.pax,0);
  return `<tr class="${cls}"><td colspan="4" class="l">${label}</td><td class="pax">${pax}</td><td colspan="5" class="l"><small>${list.length} ${esc(tx('teams'))} · ${nights} ${esc(tx('nights'))}</small></td><td></td>`
    +Array.from({length:N},(_,i)=>`<td class="d${dayCls(ym,i+1)}">${tot.stay[i+1]||''}</td>`).join('')+'</tr>';
}
function sortTeams(a,b){ return a.dep<b.dep?-1:a.dep>b.dep?1:(a.arr<b.arr?-1:a.arr>b.arr?1:String(a.rep).localeCompare(String(b.rep),'ko')); }
function render(){
  const tbl=$('#tbl'); if(!tbl) return;
  const ym=LOADED||YM; if(!ym||!TEAMS.length){ tbl.innerHTML=`<tbody><tr><td class="empty">${esc(supa?tx('empty'):tx('needConn'))}</td></tr></tbody>`; $('#sum').textContent=''; $('#pt').innerHTML=''; return; }
  const list=visibleTeams().slice().sort(sortTeams);
  const tot=dayTotals(list,ym);
  let body='';
  if(GROUP){
    const order=['Y','K','G','S'];
    order.forEach(k=>{ const gl=list.filter(t=>t.ak===k); if(!gl.length) return;
      body+=`<tr class="grp"><td colspan="${11+daysIn(ym)}">${ACCOM_FULL[k]} — ${gl.length} ${esc(tx('teams'))} · ${gl.reduce((s,t)=>s+t.pax,0)} ${esc(tx('pax'))}</td></tr>`;
      body+=gl.map(t=>teamRowHTML(t,ym)).join('');
      body+=totRowHTML(`${ACCOM_FULL[k]} 小計`, gl, ym, 'sub');
    });
  } else body=list.map(t=>teamRowHTML(t,ym)).join('');
  body+=totRowHTML('合計 · 합계', list, ym, 'tot');
  tbl.innerHTML=headHTML(ym,tot)+'<tbody>'+body+'</tbody>';
  const pax=list.reduce((s,t)=>s+t.pax,0), nights=list.reduce((s,t)=>s+nightSpan(t,ym).length*t.pax,0);
  $('#sum').textContent=tx('sum')(list.length,pax,nights);
  const [y,m]=ym.split('-').map(Number); const now=new Date();
  const accLbl=ACC.size?[...ACC].map(k=>ACCOM_FULL[k]).join(' · '):'全宿泊先 · 전체 숙소';
  $('#pt').innerHTML=`<span>月間 日別宿泊現況 <small>월간 숙박 현황표</small></span><span>${y}年${m}月</span><small>${esc(accLbl)}</small><span class="sp"></span><small>${list.length} ${esc(tx('teams'))} · ${pax} ${esc(tx('pax'))} · ${nights} ${esc(tx('nights'))} · 宿泊/到着/出発 = 各日の人数</small><small>${esc(tx('outAt'))} ${pad2(now.getMonth()+1)}/${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}</small>`;
  fitOnePage();   // 제목까지 채운 뒤 측정(제목 높이 포함)
}
// ── 한 장 맞춤(Min 2026-10-26 「객실 월간 숙박 현황표는 야마나미 제외하고 무조건 1장에 나오게」) ──
//  보이는 팀에 야마나미가 없으면(쿠주·간지·시즈만) A3 가로 한 장(인쇄 영역 283mm)에 들어가도록 --fs(글자·여백 배율)를 이분탐색으로 낮춘다.
//  측정은 화면에서 body.fitm(인쇄와 같은 치수)을 잠깐 켜고 제목+표 높이를 잰다 — 표가 nowrap 이라 폭이 달라도 높이는 인쇄와 같다. 야마나미가 섞이면 여러 장 그대로.
const PAGE_H_MM=283, FIT_SAFETY_MM=6, FIT_MIN=0.25;
let FIT=1;
function onePageMode(){ const list=visibleTeams(); return list.length>0 && !list.some(t=>t.ak==='Y'); }
function mm2px(mm){ return mm/25.4*96; }
function fitOnePage(){
  const root=document.documentElement, note=$('#fitnote');
  root.style.setProperty('--fs','1'); FIT=1;
  if(!TEAMS.length){ if(note) note.textContent=''; return 1; }
  if(!onePageMode()){ if(note) note.textContent=tx('fitMulti'); return 1; }
  document.body.classList.add('fitm');
  try{
    const limit=mm2px(PAGE_H_MM-FIT_SAFETY_MM);
    const h=()=>$('#tbl').getBoundingClientRect().height + $('#pt').getBoundingClientRect().height;
    const search=()=>{ let lo=FIT_MIN, hi=1; for(let i=0;i<16;i++){ const mid=(lo+hi)/2; root.style.setProperty('--fs',String(mid)); if(h()<=limit) lo=mid; else hi=mid; } return Math.max(FIT_MIN,Math.floor(lo*1000)/1000); };
    if(h()>limit) FIT=search();   // 표 치수는 촘촘한 것 하나(토글 폐지) — 하한 25%면 120행도 한 장
  }finally{ document.body.classList.remove('fitm'); }
  root.style.setProperty('--fs',String(FIT));
  if(note) note.textContent=tx('fit')(Math.round(FIT*100));
  return FIT;
}
window.addEventListener('beforeprint',fitOnePage);
function renderChips(){
  const box=$('#accom-chips'); if(!box) return;
  const keys=[['','all'],['Y','accY'],['K','accK'],['G','accG'],['S','accS']];
  box.innerHTML=keys.map(([k,l])=>`<button type="button" class="chip${(k?ACC.has(k):!ACC.size)?' on':''}" data-k="${k}">${esc(tx(l))}</button>`).join('');
  box.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.k; if(!k) ACC.clear(); else if(ACC.has(k)) ACC.delete(k); else ACC.add(k); renderChips(); render(); }));
}
function applyStatic(){
  $('#t-step').textContent=tx('step'); $('#t-connHint').textContent=tx('connHint'); $('#t-group').textContent=tx('group');
  $('#btn-print').textContent=tx('print'); $('#t-desc').textContent=tx('desc'); const em=$('#t-empty'); if(em) em.textContent=tx('needConn');
  renderChips();
}
window.onSaizenLangChange=function(){ applyStatic(); if(TEAMS.length) render(); };

// ── 월 이동 ──
function shiftYm(n){ const [y,m]=YM.split('-').map(Number); const d=new Date(y,m-1+n,1); YM=d.getFullYear()+'-'+pad2(d.getMonth()+1); $('#ym').value=YM; load(); }

// ── 연결(키 내장 자동연결: saizen-ops 가 localStorage 를 채운다) ──
function loadCreds(){ $('#sb-url').value=localStorage.getItem('saizen_sb_url')||''; $('#sb-key').value=localStorage.getItem('saizen_sb_key')||''; }
async function connect(){
  const url=$('#sb-url').value.trim(), key=$('#sb-key').value.trim();
  if(!url||!key){ setConn('URL·key','err'); return; }
  localStorage.setItem('saizen_sb_url',url); localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect'); btn.disabled=true; btn.classList.remove('connected');
  try{
    supa=window.supabase.createClient(url,key);
    const {error}=await supa.from('bookings').select('event_seq',{count:'exact',head:true}); if(error) throw error;
    setConn('✓','ok'); btn.textContent='✓'; btn.classList.add('connected'); btn.disabled=false;
    await load();
  }catch(e){ setConn('✕','err'); toast(tx('loadFail')+': '+e.message,'err'); btn.textContent='↻'; btn.classList.remove('connected'); btn.disabled=false; supa=null; }
}
$('#btn-connect').addEventListener('click',connect);
$('#ym').addEventListener('change',()=>{ if($('#ym').value){ YM=$('#ym').value; load(); } });
$('#ym-prev').addEventListener('click',()=>shiftYm(-1)); $('#ym-next').addEventListener('click',()=>shiftYm(1));
$('#opt-group').addEventListener('change',e=>{ GROUP=!!e.target.checked; render(); });
$('#btn-print').addEventListener('click',()=>window.print());
(function init(){
  const q=new URLSearchParams(location.search); const now=new Date();
  YM=(q.get('ym')&&/^\d{4}-\d{2}$/.test(q.get('ym')))?q.get('ym'):(now.getFullYear()+'-'+pad2(now.getMonth()+1));
  $('#ym').value=YM; applyStatic(); loadCreds();
  if($('#sb-url').value && $('#sb-key').value) connect();
})();
</script>
