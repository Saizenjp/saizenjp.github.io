<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#3d5424; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#2c3d19;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .preview{display:flex;flex-direction:column;gap:8px}
  .pv-day{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface2)}
  .pv-day b{font-size:13px;color:var(--accent)}
  .pv-meal{font-family:var(--mono);font-size:12px;color:var(--text2);margin-top:3px}
  table.tedit{width:100%;border-collapse:collapse;font-size:12px}
  table.tedit th{background:var(--surface3);border:1px solid var(--border);padding:5px 7px;font-weight:700;color:var(--text2);white-space:nowrap}
  table.tedit td{border:1px solid var(--border);padding:4px 7px}
  table.tedit td.c{text-align:center}
  table.tedit td.mono{font-family:var(--mono)}
  table.tedit input{border:1px solid var(--border2);border-radius:5px;padding:4px 6px;font-size:12px;font-family:inherit}
  .dg-badge{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;border:1px solid var(--border2);white-space:nowrap}
  .exr{font-size:10.5px;color:var(--err);font-weight:700}
  label.adf{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.5}
  label.adf select,label.adf input{font-family:inherit;font-size:13px;border:1px solid var(--border2);border-radius:5px;padding:5px 7px;color:var(--text)}
  #ad-list .btn.sm{padding:2px 8px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>

<script>
const $=s=>document.querySelector(s);
let supa=null, YM=null, TEAMS=[], DATESEL=new Set(), ACCOMSEL=new Set(), OVR={}, ADDONS=[];
function curUser(){ try{ return (window.__so_getUser&&__so_getUser())||''; }catch(e){ return ''; } }
const ACCOM_ORDER=['간지호텔','시즈노야도 료칸','쿠주힐즈','야마나미리조트'];
const OFFSITE=new Set(['간지호텔','시즈노야도 료칸']);
// 요일별 기본 석식 메뉴 (getDay: 0=일~6=토). 코드에서 수정 가능.
const BASE_DINNER=['해물전골','일본산 삼겹살','매운탕','소불고기 코스','해물 순두부찌개','일본산 삼겹살','흑돼지 샤브샤브'];
function baseDinnerFor(date){ try{ return BASE_DINNER[parseLocalDate(date).getDay()]||''; }catch(e){ return ''; } }
// 별주 입력 자동완성용 메뉴(업그레이드 ¥3,000/인 · 추가/안주)
const MENU_SUGGEST=['카이세키 요리','스키야키','소고기 샤브샤브','바베큐',
  '도미 스가타츠쿠리(회 모듬)','왕새우(이세에비) 추가','우나기 카바야키(장어구이)','와규 스테이크','말고기 육회',
  '낙지튀김','감자튀김','닭튀김','우엉튀김','타코와사비'];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// 동그라미 숫자(①~⑳) — 인쇄물 팀 인원 표기(예 ←DJわ④名). 범위 밖은 (n).
function circ(n){ n=parseInt(n,10)||0; return (n>=1&&n<=20)?'①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'[n-1]:`(${n})`; }
// 그 날짜·팀의 업그레이드 인분 합계(기본 석식에서 차감할 수)
function upQtyFor(date,seq){ return ADDONS.filter(a=>a.kind==='upgrade'&&a.order_date===date&&String(a.event_seq)===String(seq))
  .reduce((s,a)=>s+(parseInt(a.qty,10)||0),0); }
const ADDON_LABEL={add:'追加',upgrade:'アップグレード',allergy:'アレルギー'};
// 그 날짜의 別注·알레르기 목록(팀 태그·인원 결합, 숙소 필터 반영). 알레르기는 뒤로 정렬.
function addonsForDate(date){
  const _accomSet=ACCOMSEL.size?ACCOMSEL:null;
  return ADDONS.filter(a=>a.order_date===date).map(a=>{
    const t=TEAMS.find(x=>String(x.seq)===String(a.event_seq));
    return Object.assign({}, a, {tag:(t&&t.tag)||'', pax:(t?parseInt(t.pax,10)||0:0), accom:(t&&t.accom)||'', repName:(t&&t.repName)||''});
  }).filter(a=> !_accomSet || _accomSet.has(a.accom))
    .sort((x,y)=> (x.kind==='allergy'?1:0)-(y.kind==='allergy'?1:0) || String(x.tag).localeCompare(String(y.tag)) || x.id-y.id);
}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){ if(!d)return ''; if(d instanceof Date){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;} return String(d).slice(0,10); }
function parseLocalDate(s){ return SZCore.parseLocalDate(s); }  // 공유 모듈 위임
function getWD(d){ const w=['(月)','(火)','(水)','(木)','(金)','(土)','(日)']; try{ const day=new Date(d).getDay(); return w[day===0?6:day-1]; }catch(e){ return ''; } }
function fmtMD(s){ if(!s)return ''; return `${parseInt(s.slice(5,7),10)}/${parseInt(s.slice(8,10),10)}`; }
function isPusOf(o){ const u=String(o||'').toUpperCase(); return String(o||'').includes('부산')||String(o||'').includes('김해')||u==='PUS'||u==='BUS'||u==='PNS'; }
function monthBounds(ym){ const [y,m]=ym.split('-').map(Number); const start=`${y}-${String(m).padStart(2,'0')}-01`; const endD=new Date(y,m,0).getDate(); const end=`${y}-${String(m).padStart(2,'0')}-${String(endD).padStart(2,'0')}`; return {start,end}; }

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn('URL·key 필요','err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent='연결 중…';btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn('로그인 필요','err'); btn.textContent='연결';btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">로그인이 필요합니다.<small>가운데 로그인 카드에서 로그인 후 다시 연결하세요.</small></div></div>'; return; }
    setConn('연결됨','ok'); btn.textContent='✓ 연결됨';btn.disabled=false;
    YM=YM||thisYM();
    renderUI(); load();
  }catch(e){ setConn('연결 실패','err'); btn.textContent='연결·재시도';btn.disabled=false; supa=null; toast('연결 실패: '+e.message,'err'); }
}

function renderUI(){
  $('#content').innerHTML=`
    <div class="panel">
      <h3>월 선택 · 필터</h3>
      <div class="row">
        <div class="ymctrl">
          <button class="btn sm ghost" id="ym-prev" type="button">◀</button>
          <b id="ym-label"></b>
          <button class="btn sm ghost" id="ym-next" type="button">▶</button>
        </div>
        <span style="width:1px;height:20px;background:var(--border)"></span>
        <span style="flex:1"></span>
        <span class="cnt" id="stat"></span>
        <button class="btn" id="btn-print" type="button" disabled>🖨 夕食オーダー A3 인쇄</button>
        <button class="btn ghost" id="btn-nameplate" type="button" disabled>🍽 レストラン名札 인쇄</button>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="cnt" style="min-width:46px">날짜</span>
        <div id="datechips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="cnt" style="min-width:46px">숙소</span>
        <div id="accomchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="desc" style="margin-top:10px">날짜 1일 = A3 가로 1페이지(夕食オーダー 명단 + 朝食·昼食·夕食 식수표). <b>A3 가로, 배율 100%</b>로 인쇄. ※테이블No·끼니제외·ウォークイン·일본고객 식수는 /app/ 수기항목이라 비어 있습니다(식수 자동집계는 동일 규칙).</div>
    </div>
    <div class="panel">
      <h3>別注 · 알레르기 <span class="cnt">— 추가/업그레이드 메뉴 · 알레르기. 날짜+팀 선택 후 등록. <b>업그레이드는 인분만큼 석식 기본 수량 자동 차감</b>. 夕食オーダー 인쇄에 빨강 표기</span></h3>
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">
        <label class="adf">날짜<br><select id="ad-date"></select></label>
        <label class="adf">팀<br><select id="ad-team" style="min-width:200px"></select></label>
        <label class="adf">종류<br><select id="ad-kind">
          <option value="add">추가메뉴</option>
          <option value="upgrade">업그레이드(기본 차감)</option>
          <option value="allergy">알레르기/식이</option>
        </select></label>
        <label class="adf" style="flex:1;min-width:150px"><span id="ad-item-lb">메뉴명</span><br><input id="ad-item" list="ad-menu-list" placeholder="例) ステーキ" style="width:100%"></label>
        <datalist id="ad-menu-list">${MENU_SUGGEST.map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
        <span id="ad-menu-fields" style="display:flex;gap:8px;align-items:flex-end">
          <label class="adf">단가¥<br><input id="ad-price" type="number" min="0" placeholder="5000" style="width:92px"></label>
          <label class="adf">수량<br><input id="ad-qty" type="number" min="1" value="1" style="width:60px"></label>
          <label class="adf">단위<br><input id="ad-unit" value="人前" style="width:70px"></label>
        </span>
        <span id="ad-allergy-quick" style="display:none;gap:5px;align-items:center">
          <button class="btn ghost sm" type="button" data-al="肉×">고기×</button>
          <button class="btn ghost sm" type="button" data-al="魚×">생선×</button>
          <button class="btn ghost sm" type="button" data-al="豚肉×">돼지×</button>
        </span>
        <button class="btn sm" id="ad-add" type="button">＋ 등록</button>
      </div>
      <div id="ad-list" style="margin-top:12px"></div>
      <details class="menu-ref" style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px">
        <summary style="cursor:pointer;font-weight:800;font-size:12.5px;color:var(--accent)">📋 석식 메뉴 · 신청 안내 (요일별 기본메뉴 · 업그레이드 · 추가 · 안주)</summary>
        <div style="font-size:12.5px;color:var(--text2);line-height:1.7;margin-top:8px">
          <b style="color:var(--text)">■ 요일별 기본 석식</b><br>
          일 해물전골 · 월 일본산 삼겹살 · 화 매운탕 · 수 소불고기 코스 · 목 해물 순두부찌개 · 금 일본산 삼겹살 · 토 흑돼지 샤브샤브<br><br>
          <b style="color:var(--text)">■ 신청 마감</b><br>
          메리트투어 출발 <b>3일 전</b>까지 · 체류 중에는 <b>전일 오후 2시</b>까지 호텔 프론트<br><br>
          <b style="color:var(--text)">■ 업그레이드 메뉴</b> <span style="color:var(--muted)">(기본 메뉴 제공X · 전원 같은 메뉴 신청 필수)</span><br>
          카이세키 요리 ¥3,000/인 · 스키야키 ¥3,000/인 · 소고기 샤브샤브 ¥3,000/인 · 바베큐 ¥3,000/인 <span style="color:var(--muted)">(바베큐는 4인 이상)</span><br><br>
          <b style="color:var(--text)">■ 추가 메뉴</b><br>
          도미 스가타츠쿠리(회 모듬) ¥150,000 단품 <span style="color:var(--muted)">(왕새우/이세에비 추가 시 +¥20,000)</span> · 우나기 카바야키(장어구이) ¥5,000/마리 · 와규 스테이크 ¥5,000/인분 · 말고기 육회 ¥5,000/인분<br><br>
          <b style="color:var(--text)">■ 안주</b><br>
          낙지튀김 · 감자튀김 · 닭튀김 · 우엉튀김 · 타코와사비 — 각 ¥800
        </div>
      </details>
    </div>
    <div class="panel">
      <h3>날짜별 식수 미리보기 <span class="cnt" id="pv-cnt"></span></h3>
      <div id="preview" class="preview"></div>

async function saveDiningGroup(seqs,key){
  if(!supa) return;
  try{
    for(const seq of seqs){
      const cur=OVR[seq]||{};
      const merged={event_seq:Number(seq),session_ym:YM,updated_by:curUser(),
        excluded:!!cur.excluded, dining_group:key};
      const {error}=await supa.from('print_overrides').upsert(merged,{onConflict:'event_seq'}); if(error)throw error;
      OVR[seq]=merged; const t=TEAMS.find(x=>x.seq===String(seq)); if(t) t.dgroup=key;
    }
    renderTeamEdit(); renderPreview();
  }catch(e){ toast('저장 실패: '+e.message,'err'); }
}
function accomIdx(ac){ const i=ACCOM_ORDER.indexOf(ac); return i===-1?99:i; }
// 夕食オーダー 제외 토글 + 제외 사유(선택 입력). 태그·인원 수정은 폐지(step1 데이터 기준).
async function saveDinnerOverride(seq,field,val){
  if(field!=='excluded')return;
  const t=TEAMS.find(x=>x.seq===String(seq)); if(!t)return;
  const cur=OVR[seq]||{};
  const excluded=!!val;
  let reason='';
  if(excluded){
    const r=prompt('夕食除外 사유를 입력하세요 (선택 — 비워도 제외됩니다)\n※석식 수량에서만 빠지고 朝·昼食 식수는 유지됩니다\n예: 외식 / 업그레이드 / 노쇼', t.excludeReason||'');
    if(r===null) return;               // 취소 → 제외하지 않음
    reason=String(r).trim();
  }
  t.excluded=excluded; t.excludeReason=reason;
  try{
    const merged={event_seq:Number(seq),session_ym:YM,updated_by:curUser(),excluded,exclude_reason:reason||null,dining_group:cur.dining_group||null};
    const {error}=await supa.from('print_overrides').upsert(merged,{onConflict:'event_seq'}); if(error)throw error;
    OVR[seq]=merged;
    toast(excluded?(reason?'夕食除外 — '+reason:'夕食除外 — 석식 수량에서만 빠짐(朝·昼食 유지)'):'夕食除外 해제','ok');
    renderTeamEdit(); renderPreview();   // 사유 표시 위해 표 재렌더
  }catch(e){ toast('저장 실패: '+e.message,'err'); }
}

// 선택 월 안에서, 숙박 1박 이상 발생하는 모든 날짜(dep<=D<arr)
function allDates(){
  const {start,end}=monthBounds(YM); const set=new Set();
  TEAMS.forEach(t=>{ if(ACCOMSEL.size && !ACCOMSEL.has(t.accom)) return; if(!t.dep||!t.arr) return;
    let cur=parseLocalDate(t.dep); const arr=parseLocalDate(t.arr);
    for(;cur<arr;cur.setDate(cur.getDate()+1)){ const ds=fmtDate(cur); if(ds>=start&&ds<=end) set.add(ds); }
  });
  return [...set].sort();
}

async function load(){
  if(!supa)return;
  $('#ym-label').textContent=YM; $('#stat').textContent='불러오는 중…'; $('#btn-print').disabled=true;
  try{
    const {start,end}=monthBounds(YM);
    // 월에 걸치는 모든 팀(경계 포함): dep<=월말 && arr>월초
    const {data:bs,error:e1}=await supa.from('bookings')
      .select('event_seq,rep_name,dep_date,arr_date,origin,airline,pax')
      .lte('dep_date',end).gt('arr_date',start);
    if(e1)throw e1;
    const seqs=(bs||[]).map(b=>b.event_seq);
    if(!seqs.length){ TEAMS=[]; $('#stat').textContent='해당 월 데이터 없음'; DATESEL.clear();ACCOMSEL.clear(); renderDateChips();renderAccomChips();renderPreview(); return; }
    // guests(accom·tag), passengers(rep origin), guest_members(rep tag·name)
    const GMAP={}, REP={}, ORI={};
    for(let i=0;i<seqs.length;i+=200){
      const chunk=seqs.slice(i,i+200);
      const {data:gs}=await supa.from('guests').select('event_seq,group_code,team_tag,accom,pax').in('event_seq',chunk);
      (gs||[]).forEach(g=>{GMAP[g.event_seq]=g;});
      // 대표 origin/tag/name: guest_members.is_rep → passenger
      let mg=0;
      for(;;){
        const {data,error}=await supa.from('guest_members').select('event_seq,person_tag,is_rep,seq_in_team,name_kr,name_en,passenger_id').in('event_seq',chunk).order('event_seq').order('seq_in_team').range(mg,mg+999);
        if(error)throw error;
        (data||[]).forEach(m=>{ const cur=REP[m.event_seq]; const curSeq=cur?(cur._seq==null?99:cur._seq):99;
          if(!cur || (m.is_rep&&curSeq!==0) || (!m.is_rep&&curSeq!==0&&(m.seq_in_team||99)<curSeq)){
            REP[m.event_seq]={tag:m.person_tag||'',_seq:m.is_rep?0:(m.seq_in_team||99),pid:m.passenger_id,name:m.name_kr||'',eng:m.name_en||''};
          }
        });
        if(!data||data.length<1000)break; mg+=1000;
      }
      // passengers origin (대표 pid 우선, 없으면 팀 어느 한 명)
      let pg=0;
      for(;;){
        const {data,error}=await supa.from('passengers').select('id,event_seq,origin,name_en').in('event_seq',chunk).range(pg,pg+999);
        if(error)throw error;
        (data||[]).forEach(p=>{ const rep=REP[p.event_seq]; if(!(p.event_seq in ORI) || (rep&&rep.pid===p.id)) ORI[p.event_seq]={origin:p.origin||'',eng:p.name_en||'',byRep:!!(rep&&rep.pid===p.id)}; });
        if(!data||data.length<1000)break; pg+=1000;
      }
    }
    // 제외·묶기(print_overrides) — 태그·인원 수정은 폐지(step1 데이터 기준). 묶기는 航空カバー 영향 없음. event_seq 기준(월경계 포함)
    OVR={};
    for(let i=0;i<seqs.length;i+=400){ const chunk=seqs.slice(i,i+400);
      const {data:ov}=await supa.from('print_overrides').select('event_seq,excluded,exclude_reason,dining_group').in('event_seq',chunk);
      (ov||[]).forEach(o=>{ OVR[o.event_seq]=o; });
    }
    // 別注(추가/업그레이드 메뉴) + 알레르기 — event_seq 기준(월경계 포함)
    ADDONS=[];
    for(let i=0;i<seqs.length;i+=400){ const chunk=seqs.slice(i,i+400);
      const {data:ad}=await supa.from('dinner_addons').select('id,order_date,event_seq,kind,item,price,qty,unit,note').in('event_seq',chunk).order('id');
      (ad||[]).forEach(a=>{ a.order_date=fmtDate(a.order_date); ADDONS.push(a); });
    }
    TEAMS=(bs||[]).map(b=>{ const g=GMAP[b.event_seq]||{}; const r=REP[b.event_seq]||{}; const o=ORI[b.event_seq]||{}; const ov=OVR[b.event_seq]||{};
      const origin=(o.byRep?o.origin:'')||o.origin||b.origin||'';
      const basePax=b.pax||g.pax||0;
      return { seq:String(b.event_seq), accom:g.accom||'', dep:fmtDate(b.dep_date), arr:fmtDate(b.arr_date),
        pax:basePax, basePax, excluded:!!ov.excluded, excludeReason:ov.exclude_reason||'', dgroup:ov.dining_group||null,
        repName:b.rep_name||r.name||'', engName:r.eng||o.eng||'',
        tag:r.tag||g.team_tag||g.group_code||'', isPus:isPusOf(origin) };
    }).filter(t=>t.accom);
    // 숙소 기본 선택 = 야마나미리조트·쿠주힐즈(데이터에 있는 것만). 「전체」 토글로 전체.
    ACCOMSEL.clear();
    { const _ac=new Set(TEAMS.map(t=>t.accom));
      ['야마나미리조트','쿠주힐즈'].forEach(a=>{ if(_ac.has(a)) ACCOMSEL.add(a); }); }
    // 기본 선택 = 첫날 하루만(전체 인쇄 시 랙 방지). 「전체」 토글로 전 날짜 선택 가능.
    const _ds=allDates(); DATESEL.clear(); if(_ds.length) DATESEL.add(_ds[0]);
    $('#stat').textContent=`${TEAMS.length}팀 · ${_ds.length}일`;
    renderDateChips(); renderAccomChips(); renderPreview();
    fillAddonDates(); toggleAddonKind(); renderAddonList();
  }catch(e){ $('#stat').textContent='로드 실패'; toast('로드 실패: '+e.message,'err'); }
}

// 날짜별 식수 집계 (/app/ generateAndPrintDinnerOrder 규칙 동일)
function mealCounts(date){
  const _accomSet=ACCOMSEL.size?ACCOMSEL:null;
  const _wd=parseLocalDate(date).getDay();
  const isWTS=(_wd===3||_wd===4||_wd===0), isSatSun=(_wd===6||_wd===0);
  let breakfastN=0, lunchContinue=0, lunchArrICN=0;
  // 夕食除外는 '석식만' 제외 → 朝食·昼食 식수는 그대로 계산(제외 skip 안 함)
  TEAMS.forEach(t=>{
    if(_accomSet && !_accomSet.has(t.accom)) return;
    const pax=parseInt(t.pax,10)||0; if(!pax) return;
    const isPus=t.isPus, isIn=(t.dep===date), isOut=(t.arr===date), isMid=(t.dep<date&&t.arr>date);
    const eatsBreakfast = OFFSITE.has(t.accom) ? (isOut&&isWTS) : (t.dep<date && t.arr>=date);
    if(eatsBreakfast) breakfastN+=pax;
    let lunchKind='';
    if(!OFFSITE.has(t.accom)){ if(isMid)lunchKind='cont'; else if(isIn&&!isPus)lunchKind='arr'; else if(isOut&&isPus)lunchKind='cont'; }
    else{ if(isIn&&isWTS&&!isPus)lunchKind='arr'; else if(isIn&&isSatSun&&t.accom==='간지호텔')lunchKind='arr'; else if(isOut&&isWTS&&isPus)lunchKind='cont'; }
    if(lunchKind){ if(lunchKind==='arr')lunchArrICN+=pax; else lunchContinue+=pax; }
  });
  // 석식 = 그날 묵는 전원(dep<=date<arr) − 夕食除外 팀 − 업그레이드 인분(기본메뉴 안 나감)
  let dinnerN=0, teamCnt=0, exDinnerN=0, exTeamCnt=0, upN=0;
  TEAMS.forEach(t=>{ if(_accomSet&&!_accomSet.has(t.accom))return; if(!(t.dep<=date&&t.arr>date))return;
    const pax=parseInt(t.pax,10)||0;
    if(t.excluded){ exDinnerN+=pax; exTeamCnt++; return; }
    const up=Math.min(pax, upQtyFor(date,t.seq)); upN+=up;   // 업그레이드 인분만큼 기본 차감
    dinnerN+=Math.max(0,pax-up); teamCnt++; });
  return {breakfastN, lunchN:lunchContinue+lunchArrICN, lunchArrICN, dinnerN, teamCnt, exDinnerN, exTeamCnt, upN};
}

// ── レストラン名札 印刷 (/app/ 완전 동일 양식: A4 가로·1팀1페이지·좌우 동일 텐트 반접기) ──
//   입국일(dep===date) 기준 팀을 대표자名(큰글씨)+님·영문명·"일 행"·人数·기간·태그코드로.
//   ※テーブルNo는 /app/ localStorage 수기항목이라 ops에선 빈칸(양식은 동일).
function printNameplates(){
  const dates=selectedDates();
  if(!dates.length){ toast('출력할 날짜가 없습니다','err'); return; }
  const _accomSet=ACCOMSEL.size?ACCOMSEL:null;
  const todayStr=today();
  const accomOrder=['간지호텔','시즈노야도 료칸','쿠주힐즈','야마나미리조트'];
  const fmtJP=(s)=>{ if(!s) return ''; return `${parseInt(s.slice(5,7),10)}月${parseInt(s.slice(8,10),10)}日`; };
  const cards=[];
  dates.forEach(date=>{
    const teams=TEAMS.filter(t=> t.accom && !t.excluded && t.dep===date && (!_accomSet||_accomSet.has(t.accom)))
      .sort((a,b)=>{ const ai=accomOrder.indexOf(a.accom),bi=accomOrder.indexOf(b.accom); if(ai!==bi) return (ai===-1?99:ai)-(bi===-1?99:bi); return (a.repName||'').localeCompare(b.repName||''); });
    // 묶음(dining_group) 단위로 합쳐 1장: 인원 합산 + 대표자·태그 모두 표기. 단독은 그대로.
    const byG=new Map(), gOrder=[];
    teams.forEach(t=>{ const key=t.dgroup||('_solo:'+t.seq); if(!byG.has(key)){ byG.set(key,[]); gOrder.push(key); } byG.get(key).push(t); });
    gOrder.forEach(key=>{
      const grp=byG.get(key);
      const names=grp.map(t=>(t.repName||'').trim()).filter(Boolean);
      const engs=grp.map(t=>(t.engName&&t.engName!=='(미등록)')?t.engName.trim():'').filter(Boolean);
      const tags=grp.map(t=>(t.tag||'').trim()).filter(Boolean);
      const pax=grp.reduce((s,t)=>s+(parseInt(t.pax,10)||0),0);
      const f=grp[0];
      cards.push({ repName:names.join(' · '), engName:engs.join(' · '), pax,
        period:`${fmtJP(f.dep)} 〜 ${fmtJP(f.arr)}`, tagCode:tags.join('  '), nTeams:grp.length,
        members: grp.map(t=>({ name:(t.repName||'').trim(),
          eng:(t.engName&&t.engName!=='(미등록)')?t.engName.trim():'',
          tag:(t.tag||'').trim(), pax:parseInt(t.pax,10)||0 })) });
    });
  });
  if(!cards.length){ toast('출력할 데이터가 없습니다','err'); return; }
  const pages=cards.map(c=>[c,c]);   // 양쪽 동일(반 접기 텐트)
  const cellHTML=(c)=>{
    if(!c) return `<div class="rn-card rn-card-empty"></div>`;
    const repName=(c.repName||'').trim();
    const merged=(c.nTeams||1)>1;   // 묶음(합석) 명패
    // 묶음=세로로 쌓아 각 이름을 크게 유지(가로로 이어붙여 작아지지 않게).
    if(merged && c.members && c.members.length){
      const n=c.members.length;
      const nameBase = n<=2?72: n===3?60: n===4?48: 38;   // 이름 크게(합석 머리글 제거로 자리 확보)
      const tagBase  = n<=2?20: n===3?18: 16;             // 태그 전체 축소
      const rowsHTML=c.members.map(m=>{
        const len=(m.name||'').length;
        let ns=nameBase; if(len>9) ns=Math.round(nameBase*0.68); else if(len>6) ns=Math.round(nameBase*0.84);
        return `<div class="rn-mrow">
          <div class="rn-mname" style="font-size:${ns}pt">${esc(m.name)}<span class="rn-honorific">님</span>${m.eng?`<span class="rn-meng">${esc(m.eng)}</span>`:''}</div>
          <div class="rn-mtag" style="font-size:${tagBase}pt">${esc(m.tag)}　<span class="rn-mpax">${m.pax}名</span></div>
        </div>`;
      }).join('');
      return `<div class="rn-card rn-merged">
        <div class="rn-mlist">${rowsHTML}</div>
        <div class="rn-mfoot">合計 ${c.pax}名　${esc(c.period)}</div>
      </div>`;
    }
    const hasKorean=/[가-힣]/.test(repName); const nameLen=repName.length; let nameSize;
    // 한글명을 최대한 크게. 묶음이면 '일행'·태그·날짜를 줄여 이름에 자리를 양보.
    if(hasKorean){
      if(merged) nameSize = nameLen<=6?'58pt': nameLen<=9?'46pt': nameLen<=13?'38pt': nameLen<=18?'30pt':'24pt';
      else       nameSize = nameLen<=2?'112pt': nameLen===3?'92pt': nameLen===4?'72pt': nameLen<=6?'56pt': nameLen<=9?'44pt': nameLen<=13?'34pt':'26pt';
    }else{
      if(merged) nameSize = nameLen<=10?'48pt': nameLen<=16?'38pt': nameLen<=24?'30pt':'24pt';
      else       nameSize = nameLen<=5?'92pt': nameLen<=7?'74pt': nameLen<=10?'58pt': nameLen<=14?'46pt': nameLen<=20?'34pt':'28pt';
    }
    const tagLen=(c.tagCode||'').length;
    const tagSize = tagLen<=5?'32pt': tagLen<=9?'26pt': tagLen<=14?'22pt':'18pt';   // 태그 전체 축소
    const ilSize   = '38pt';   // '일 행' 글씨 축소
    const dateSize = '18pt';
    // 행 높이 합 < 카드 높이 → align-content:center로 상하여백 균등 분배.
    // (테이블No 빈 행은 제거 — ops는 항상 빈칸이라 하단 여백만 키움)
    const rows = '50mm 10mm 22mm 28mm 12mm 16mm';
    return `<div class="rn-card" style="grid-template-rows:${rows}">
      <div class="rn-r1" style="font-size:${nameSize}">${esc(repName)}<span class="rn-honorific">님</span></div>
