<style>

  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .preview{display:flex;flex-direction:column;gap:8px}
  .pv-day{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface2)}
  .pv-day b{font-size:13px;color:var(--accent)}
  .pv-meal{font-family:var(--mono);font-size:12px;color:var(--text2);margin-top:3px}
  table.tedit{width:100%;border-collapse:collapse;font-size:12px}
  table.tedit th{background:var(--surface3);border:1px solid var(--border);padding:5px 7px;font-weight:700;color:var(--text2);white-space:nowrap}
  table.tedit td{border:1px solid var(--border);padding:4px 7px}
  table.tedit td.c{text-align:center}
  table.tedit td.mono{font-family:var(--mono)}
  table.tedit input{border:1px solid var(--border2);border-radius:5px;padding:4px 6px;font-size:12px;font-family:inherit}
  .tgbadge{display:inline-block;font-size:10.5px;font-weight:700;color:#5a6b3e;background:#eef2e6;border:1px solid #cdd9bd;border-radius:5px;padding:1px 6px}
  .dg-badge{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;border:1px solid var(--border2);white-space:nowrap}
  .exr{font-size:10.5px;color:var(--err);font-weight:700}
  label.adf{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.5}
  label.adf select,label.adf input{font-family:inherit;font-size:13px;border:1px solid var(--border2);border-radius:5px;padding:5px 7px;color:var(--text)}
  #ad-list .btn.sm{padding:2px 8px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}

async function loadAddonMenu(){
  MENU_ADDON={add:[],upgrade:[]};
  if(!supa) return;
  try{
    const {data}=await supa.from('menu_items').select('code,name_ja,unit_price')
      .eq('venue','restaurant').eq('active',true).order('sort_order').order('code');
    (data||[]).forEach(m=>{ const c=String(m.code||'');
      if(/^ADD-/i.test(c)) MENU_ADDON.add.push(m);
      else if(/^UP-/i.test(c)) MENU_ADDON.upgrade.push(m); });
  }catch(e){ /* 메뉴 로드 실패는 조용히(빈 목록) */ }

async function addAddon(){

  if(!date||!seq){toast(tx('tNoDateTeam'),'warn');return;}

    $('#ad-item').value='';

// 운영팀(team_group) 배지 — 現地手配書 표기법과 동일하게 그 팀에 속한 '모든 팀 태그'를 나열.
//   라벨(team_group)은 묶음 중 한 팀의 태그라 그것만 보이면 헷갈림 → 같은 team_group 공유 팀 태그 전부 표시.
function tgPfx(t){ return String(t||'').split('-')[0]; }   // 태그 접두(그룹코드)만 — '-1Y' 개인번호 제거
function tgroupTags(label){ if(!label) return ''; const tags=TEAMS.filter(t=>t.tgroup===label).map(t=>tgPfx(t.tag)).filter(Boolean); return [...new Set(tags)].join('·'); }
// 묶은 팀(대표 지정 시)의 통일 표시태그 = 대표 기준코드 + 팀번호(DRな-Y1/Y2). 대표 미지정이면 null(원래 태그 유지).
function buildTeamGroupTags(){
  _TGT={};
  if(!(window.SZCore&&SZCore.teamTagN&&SZCore.orderGroup&&SZCore.tagStripSeq)) return;
  const groups={};
  TEAMS.forEach(t=>{ if(t.tgroup){ (groups[t.tgroup]=groups[t.tgroup]||[]).push(t); } });
  Object.keys(groups).forEach(k=>{ const list=groups[k]; if(list.length<2)return;
    const rep=list.find(t=>t.tgroupRep); if(!rep)return;
    const base=SZCore.tagStripSeq(rep.tag);
    SZCore.orderGroup(list.map(t=>({event_seq:t.seq,dep:t.dep})),rep.seq).forEach((o,i)=>{ _TGT[o.event_seq]=SZCore.teamTagN(base,i+1); });
  });
}
function teamGroupTag(t){ return (_TGT&&_TGT[t.seq])||null; }   // 묶음 통일태그 or null
function tgroupBadge(label){ if(!label) return '<span style="color:var(--muted)">-</span>'; const tags=tgroupTags(label); const n=TEAMS.filter(t=>t.tgroup===label).length; return `<span class="tgbadge" title="${tx('thTeam')}: ${esc(label)}">${esc(tags)} <b>(${n})</b></span>`; }
function accomIdx(ac){ const i=ACCOM_ORDER.indexOf(ac); return i===-1?99:i; }
// ── 팀별 규칙 정렬(手配書·航空カバー와 동일): 入国 → 숙소 → 코드 → 묶음번호(Y1,Y2 인접) → 대표자 ──
function stripSeqTag(t){ return (window.SZCore&&SZCore.tagStripSeq)?SZCore.tagStripSeq(t):String(t||''); }
function teamDisplayTag(t){ return teamGroupTag(t)||stripSeqTag((t.tag||'').trim()); }   // DRな-Y1 or 단독코드
function teamCodeNo(t){ const s=String(teamDisplayTag(t)); const m=s.match(/(\d+)$/); return {code:s.replace(/\d+$/,''), no:m?+m[1]:0}; }
function teamSortByCode(a,b){
  if((a.dep||'')!==(b.dep||'')) return (a.dep||'')<(b.dep||'')?-1:1;
  const ai=accomIdx(a.accom), bi=accomIdx(b.accom); if(ai!==bi) return ai-bi;
  const ca=teamCodeNo(a), cb=teamCodeNo(b);
  if(ca.code!==cb.code) return ca.code.localeCompare(cb.code);   // 코드순(ㄱㄴㄷ 대신)
  if(ca.no!==cb.no) return ca.no-cb.no;                          // 묶음 Y1→Y2 인접
  return (a.repName||'').localeCompare(b.repName||'');
}
// ── 팀 묶음(team_group) = 식사 1단위로 병합: 대표 1명·대표코드(DRな-Y)·인원 합산 ──
//   묶으면 같은 테이블 → 명패·오더 1개(Y1/Y2로 쪼개지 않음). 테이블을 나눠야 하면 별도 기능.
//   teams: 이미 정렬된 배열. 같은 tgroup은 한 unit, 단독은 그대로.
function dinnerUnits(teams){
  const byG=new Map(), order=[];
  teams.forEach(t=>{ const key=t.tgroup?('tg:'+t.tgroup):('solo:'+t.seq); if(!byG.has(key)){ byG.set(key,[]); order.push(key); } byG.get(key).push(t); });
  return order.map(key=>{
    const grp=byG.get(key);
    const rep=(grp.length>1?grp.find(t=>t.tgroupRep):null)||grp[0];   // 대표=現地手配書 지정
    return { rep, teams:grp, seqs:grp.map(t=>t.seq),
      tag:stripSeqTag((rep.tag||'').trim()),                          // 대표 코드 스트립(DRな-Y)
      repName:rep.repName||'', engName:rep.engName||'',
      dep:rep.dep, arr:rep.arr, accom:rep.accom, isPus:rep.isPus,
      pax:grp.reduce((s,t)=>s+(parseInt(t.pax,10)||0),0) };            // 인원 합산(8名)
  });
}
// 夕食 오버라이드: 제외(excluded·사유)만. 팀 묶음은 現地手配書(team_group) 단일 소스. 기존 필드는 보존(spread).
async function saveDinnerOverride(seq,field,val){
  if(field!=='excluded') return;
  const t=TEAMS.find(x=>x.seq===String(seq)); if(!t)return;
  const cur=OVR[seq]||{};
  const merged={...cur, event_seq:Number(seq), session_ym:YM, updated_by:curUser()};
  let reason=cur.exclude_reason||'';
  const excluded=!!val;
  if(excluded){
    const r=prompt(tx('promptReason'), t.excludeReason||'');
    if(r===null) return;             // 취소 → 제외하지 않음
    reason=String(r).trim();
  } else reason='';
  merged.excluded=excluded; merged.exclude_reason=reason||null;
  t.excluded=excluded; t.excludeReason=reason;
  try{
    const {error}=await supa.from('print_overrides').upsert(merged,{onConflict:'event_seq'}); if(error)throw error;
    OVR[seq]=merged;
    toast(merged.excluded?(reason?tx('tExReason')+reason:tx('tExOnly')):tx('tExRelease'),'ok');
    renderTeamEdit(); renderPreview();
  }catch(e){ toast(tx('tSaveFail')+': '+e.message,'err'); }
}

// 선택 월 안에서, 숙박 1박 이상 발생하는 모든 날짜(dep<=D<arr)
function allDates(){
  const {start,end}=monthBounds(YM); const set=new Set();
  TEAMS.forEach(t=>{ if(ACCOMSEL.size && !ACCOMSEL.has(t.accom)) return; if(!t.dep||!t.arr) return;
    let cur=parseLocalDate(t.dep); const arr=parseLocalDate(t.arr);
    for(;cur<arr;cur.setDate(cur.getDate()+1)){ const ds=fmtDate(cur); if(ds>=start&&ds<=end) set.add(ds); }
  });
  return [...set].sort();
}

async function load(){
  if(!supa)return;
  $('#ym-label').textContent=YM; $('#stat').textContent=tx('statLoading'); $('#btn-print').disabled=true; {const x=$('#btn-xlsx'); if(x)x.disabled=true;}
  try{
    const {start,end}=monthBounds(YM);
    // 월에 걸치는 모든 팀(경계 포함): dep<=월말 && arr>월초
    const {data:bs,error:e1}=await supa.from('bookings')
      .select('event_seq,rep_name,dep_date,arr_date,origin,airline,pax')
      .lte('dep_date',end).gt('arr_date',start);
    if(e1)throw e1;
    const seqs=(bs||[]).map(b=>b.event_seq);
    if(!seqs.length){ TEAMS=[]; $('#stat').textContent=tx('statNoData'); DATESEL.clear();ACCOMSEL.clear(); renderDateChips();renderAccomChips();renderPreview(); return; }
    // guests(accom·tag), passengers(rep origin), guest_members(rep tag·name)
    const GMAP={}, REP={}, ORI={};
    EARLY={};   // event_seq → [조기퇴실 실제일…] (개인별 actual_dep) — 식수 차감용
    for(let i=0;i<seqs.length;i+=200){
      const chunk=seqs.slice(i,i+200);
      const {data:gs}=await supa.from('guests').select('event_seq,group_code,team_tag,accom,pax').in('event_seq',chunk);
      (gs||[]).forEach(g=>{GMAP[g.event_seq]=g;});
      // 대표 origin/tag/name: guest_members.is_rep → passenger
      let mg=0;
      for(;;){
        const {data,error}=await supa.from('guest_members').select('event_seq,person_tag,is_rep,seq_in_team,name_kr,name_en,passenger_id,actual_dep').in('event_seq',chunk).order('event_seq').order('seq_in_team').range(mg,mg+999);
        if(error)throw error;
        (data||[]).forEach(m=>{ const cur=REP[m.event_seq]; const curSeq=cur?(cur._seq==null?99:cur._seq):99;
          if(!cur || (m.is_rep&&curSeq!==0) || (!m.is_rep&&curSeq!==0&&(m.seq_in_team||99)<curSeq)){
            REP[m.event_seq]={tag:m.person_tag||'',_seq:m.is_rep?0:(m.seq_in_team||99),pid:m.passenger_id,name:m.name_kr||'',eng:m.name_en||''};
          }
          if(m.actual_dep){ (EARLY[m.event_seq]=EARLY[m.event_seq]||[]).push(fmtDate(m.actual_dep)); }
        });
        if(!data||data.length<1000)break; mg+=1000;
      }
      // passengers origin (대표 pid 우선, 없으면 팀 어느 한 명)
      let pg=0;
      for(;;){
        const {data,error}=await supa.from('passengers').select('id,event_seq,origin,name_en').in('event_seq',chunk).range(pg,pg+999);
        if(error)throw error;
        (data||[]).forEach(p=>{ const rep=REP[p.event_seq]; if(!(p.event_seq in ORI) || (rep&&rep.pid===p.id)) ORI[p.event_seq]={origin:p.origin||'',eng:p.name_en||'',byRep:!!(rep&&rep.pid===p.id)}; });
        if(!data||data.length<1000)break; pg+=1000;
      }
    }
    // 제외·묶기(print_overrides) — 태그·인원 수정은 폐지(step1 데이터 기준). 묶기는 航空カバー 영향 없음. event_seq 기준(월경계 포함)
    OVR={};
    for(let i=0;i<seqs.length;i+=400){ const chunk=seqs.slice(i,i+400);
      const {data:ov}=await supa.from('print_overrides').select('event_seq,excluded,exclude_reason,team_group,team_group_rep').in('event_seq',chunk);
      (ov||[]).forEach(o=>{ OVR[o.event_seq]=o; });
    }
    // 別注(추가/업그레이드 메뉴) + 알레르기 — event_seq 기준(월경계 포함)
    ADDONS=[];
    for(let i=0;i<seqs.length;i+=400){ const chunk=seqs.slice(i,i+400);
      const {data:ad}=await supa.from('dinner_addons').select('id,order_date,event_seq,kind,item,price,qty,unit,note').in('event_seq',chunk).order('id');
      (ad||[]).forEach(a=>{ a.order_date=fmtDate(a.order_date); ADDONS.push(a); });
    }
    TEAMS=(bs||[]).map(b=>{ const g=GMAP[b.event_seq]||{}; const r=REP[b.event_seq]||{}; const o=ORI[b.event_seq]||{}; const ov=OVR[b.event_seq]||{};
      const origin=(o.byRep?o.origin:'')||o.origin||b.origin||'';
      const basePax=b.pax||g.pax||0;
      return { seq:String(b.event_seq), accom:g.accom||'', dep:fmtDate(b.dep_date), arr:fmtDate(b.arr_date),
        pax:basePax, basePax, excluded:!!ov.excluded, excludeReason:ov.exclude_reason||'', tgroup:ov.team_group||'', tgroupRep:!!ov.team_group_rep,
        repName:b.rep_name||r.name||'', engName:r.eng||o.eng||'',
        tag:r.tag||g.team_tag||g.group_code||'', isPus:isPusOf(origin) };
    }).filter(t=>t.accom);
    buildTeamGroupTags();   // 대표 지정 묶음의 통일 태그(DRな-Y1/Y2) 계산
    // 숙소 기본 선택 = 야마나미리조트·쿠주힐즈(데이터에 있는 것만). 「전체」 토글로 전체.
    ACCOMSEL.clear();
    { const _ac=new Set(TEAMS.map(t=>t.accom));
      ['야마나미리조트','쿠주힐즈'].forEach(a=>{ if(_ac.has(a)) ACCOMSEL.add(a); }); }
    // 기본 선택 = 첫날 하루만(전체 인쇄 시 랙 방지). 「전체」 토글로 전 날짜 선택 가능.
    const _ds=allDates(); DATESEL.clear(); if(_ds.length) DATESEL.add(_ds[0]);

  }catch(e){ $('#stat').textContent=tx('statFail'); toast(tx('loadFail')+': '+e.message,'err'); }
}

function selectedDates(){ const all=allDates(); return DATESEL.size? all.filter(d=>DATESEL.has(d)) : all; }

// 조기 퇴실(개인 actual_dep) 인원 차감 — 그날 그 끼니에 이미 떠난 사람 수.
//  · 朝食(b): 전날 밤 묵음 기준 → 퇴실일 '아침'엔 아직 있음 → actual_dep < date 면 떠남.
//  · 昼/夕食(l/d): 퇴실일 '아침'에 떠남 → actual_dep <= date 면 떠남.
function goneEarly(seq, date, meal){ return SZCore.mealGoneCount(EARLY[seq], date, meal); }  // 규칙=saizen-core 단일 진실원
// 날짜별 식수 집계 (/app/ generateAndPrintDinnerOrder 규칙 동일 — 끼니 판정은 SZCore.mealPlan 단일 진실원)
function mealCounts(date){
  const _accomSet=ACCOMSEL.size?ACCOMSEL:null;
  let breakfastN=0, lunchContinue=0, lunchArrICN=0;
  // 夕食除外는 '석식만' 제외 → 朝食·昼食 식수는 그대로 계산(제외 skip 안 함)
  TEAMS.forEach(t=>{
    if(_accomSet && !_accomSet.has(t.accom)) return;
    const base=parseInt(t.pax,10)||0; if(!base) return;
    const bPax=Math.max(0, base-goneEarly(t.seq,date,'b'));   // 朝食 실인원
    const lPax=Math.max(0, base-goneEarly(t.seq,date,'l'));   // 昼食 실인원
    const plan=SZCore.mealPlan(t, date);                       // {breakfast, lunchKind, dinner}
    if(plan.breakfast) breakfastN+=bPax;
    if(plan.lunchKind){ if(plan.lunchKind==='arr')lunchArrICN+=lPax; else lunchContinue+=lPax; }
  });
  // 석식 = 그날 묵는 전원(dep<=date<arr) − 조기퇴실 − 夕食除外 팀 − 업그레이드 인분(기본메뉴 안 나감)
  let dinnerN=0, teamCnt=0, exDinnerN=0, exTeamCnt=0, upN=0;
  TEAMS.forEach(t=>{ if(_accomSet&&!_accomSet.has(t.accom))return; if(!(t.dep<=date&&t.arr>date))return;
    const pax=Math.max(0,(parseInt(t.pax,10)||0)-goneEarly(t.seq,date,'d'));   // 夕食 실인원
    if(t.excluded){ exDinnerN+=pax; exTeamCnt++; return; }
    if(!pax) return;                                          // 전원 조기퇴실 → 표시 안 함
    const up=Math.min(pax, upQtyFor(date,t.seq)); upN+=up;   // 업그레이드 인분만큼 기본 차감
    dinnerN+=Math.max(0,pax-up); teamCnt++; });
  return {breakfastN, lunchN:lunchContinue+lunchArrICN, lunchArrICN, dinnerN, teamCnt, exDinnerN, exTeamCnt, upN};
}

// ── 夕食オーダー Excel 다운로드 (임시 대응 — 현장에서 열어 조정·인쇄) ──
//   인쇄와 같은 데이터(units·mealCounts)를 날짜별 시트로. 파일명 영문(회사 PC 한글차단).
function downloadOrderXlsx(){
  const dates=selectedDates();
  if(!dates.length){ toast(tx('noOutDate'),'err'); return; }
  if(typeof XLSX==='undefined'){ toast(tx('xlsxLoading'),'warn'); return; }
  const _accomSet=ACCOMSEL.size?ACCOMSEL:null;
  const HEAD=['No','入国','帰国','出発地','名前','英文名','Group','テーブルNo','人数','日次','単価','料理','参考事項'];
  const wb=XLSX.utils.book_new(); let made=0;
  dates.forEach(date=>{
    const staying=TEAMS.filter(t=> !t.excluded && t.dep<=date && t.arr>date
      && (Math.max(0,(parseInt(t.pax,10)||0)-goneEarly(t.seq,date,'d'))>0));
    if(!staying.length) return;
    const units=dinnerUnits(staying.slice().sort(teamSortByCode)).filter(u=>!_accomSet||_accomSet.has(u.accom));
    if(!units.length) return;
    const mc=mealCounts(date);
    const aoa=[[`夕食オーダー  ${date}(${getWD(date)})`,'','','',`本日の基本夕食: ${baseDinnerFor(date)}`,'','','','',`${mc.teamCnt}チーム`,'',`${mc.dinnerN}名`,''], HEAD];
    let no=0;
    units.forEach(u=>{ no++;
      let stayDay='';
      if(u.dep){ const days=Math.round((parseLocalDate(date)-parseLocalDate(u.dep))/86400000)+1; const nights=(u.dep&&u.arr)?Math.round((parseLocalDate(u.arr)-parseLocalDate(u.dep))/86400000):0; if(days>=1&&days<=nights+1) stayDay=`${days}日目`; }
      const ePax=u.teams.reduce((s,x)=>s+Math.max(0,(parseInt(x.pax,10)||0)-goneEarly(x.seq,date,'d')),0);
      const engShow=(u.engName&&u.engName!=='(미등록)')?u.engName:'';
      aoa.push([no, fmtMD(u.dep), fmtMD(u.arr), u.isPus?'PUS':'ICN', u.repName||'', engShow, u.tag||'', '', ePax, stayDay, '', '', '']);
    });
    aoa.push([]); aoa.push(['','朝食','昼食','夕食']);
    aoa.push(['予約', mc.breakfastN, mc.lunchN, mc.dinnerN]);
    aoa.push(['合計', mc.breakfastN, mc.lunchN, mc.dinnerN]);
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:4},{wch:7},{wch:7},{wch:7},{wch:14},{wch:22},{wch:10},{wch:9},{wch:6},{wch:7},{wch:7},{wch:9},{wch:22}];
    XLSX.utils.book_append_sheet(wb, ws, date.slice(5).replace(/-/g,'') || 'S'+(made+1));
    made++;
  });
  if(!made){ toast(tx('noOutData'),'err'); return; }
  XLSX.writeFile(wb, `dinner_order_${YM}.xlsx`);
  toast(tx('xlsxDone')(made),'ok');
}

    const staying=TEAMS.filter(t=> !t.excluded && t.dep<=date && t.arr>date
      && (Math.max(0,(parseInt(t.pax,10)||0)-goneEarly(t.seq,date,'d'))>0));   // 전원 조기퇴실 팀은 명단에서 제외
    if(!staying.length) return '';
    const sorted=staying.slice().sort(teamSortByCode);   // 팀별 규칙: 入国→숙소→코드
    const units=dinnerUnits(sorted).filter(u=>!_accomSet||_accomSet.has(u.accom));   // 묶음=대표 1행(合算)·대표 숙소 기준 필터

    const trHTML=units.map(u=>{ no++;
      const depD=fmtMD(u.dep), arrD=fmtMD(u.arr);

      const originCode=u.isPus?'PUS':'ICN';

        <td></td>

    const mc=mealCounts(date);
    // 夕食除外 팀 흔적 — 석식에서만 빠짐(朝·昼食은 유지) "무엇을 왜 뺐는지" 인쇄물에 남김
    const excl=TEAMS.filter(t=>(!_accomSet||_accomSet.has(t.accom)) && t.excluded && t.dep<=date && t.arr>date)

      const paxC=parseInt(a.pax,10)||0;   // 동그라미숫자(④) 폐지 → 평문 4名

        p.style.setProperty('--fs','1');
        if(p.scrollHeight <= MAXH + 1) continue;         // 이미 한 장 → 크게 유지
        var lo = 0.2, hi = 1;
        for(var k=0;k<16;k++){
          var mid = (lo+hi)/2;
          p.style.setProperty('--fs', mid);
          if(p.scrollHeight <= MAXH) lo = mid; else hi = mid;   // 맞으면 더 크게 시도
        }
        p.style.setProperty('--fs', lo);
      }
    }
    window.addEventListener('load', fit);
    window.addEventListener('beforeprint', fit);
  })();
  <\/script>
</body></html>`;
  const w=window.open('','_blank'); if(!w){ toast(tx('popupBlock'),'err'); return; }
  w.document.write(fullHTML); w.document.close();
}

// ── レストラン名札 印刷 (/app/ 완전 동일 양식: A4 가로·1팀1페이지·좌우 동일 텐트 반접기) ──
//   입국일(dep===date) 기준 팀을 대표자名(큰글씨)+님·영문명·"일 행"·人数·기간·태그코드로.
//   ※テーブルNo는 /app/ localStorage 수기항목이라 ops에선 빈칸(양식은 동일).
function printNameplates(){
  const dates=selectedDates();
  if(!dates.length){ toast(tx('noOutDate'),'err'); return; }
  const _accomSet=ACCOMSEL.size?ACCOMSEL:null;
  const todayStr=today();
  const fmtJP=(s)=>{ if(!s) return ''; return `${parseInt(s.slice(5,7),10)}月${parseInt(s.slice(8,10),10)}日`; };
  const cards=[];
  // ⚠ 병합을 먼저: 묶음 팀이 서로 다른 숙소/입국일에 걸쳐 있어도 대표 기준 1단위(8名)로.
  //   숙소·날짜 필터는 '대표(unit)' 기준으로 병합 후 적용(필터가 서브팀을 먼저 떨궈 4名 되던 버그 수정).
  const _pool=TEAMS.filter(t=> t.accom && !t.excluded).sort(teamSortByCode);
  const _units=dinnerUnits(_pool).sort(teamSortByCode);
  dates.forEach(date=>{
    _units.filter(u=> u.dep===date && (!_accomSet||_accomSet.has(u.accom))).forEach(u=>{
      const eng=(u.engName&&u.engName!=='(미등록)')?u.engName.trim():'';
      cards.push({ repName:u.repName, engName:eng, pax:u.pax,
        period:`${fmtJP(u.dep)} 〜 ${fmtJP(u.arr)}`, tagCode:u.tag, nTeams:1,
        members:[{ name:u.repName, eng, tag:u.tag, pax:u.pax }] });
    });
  });
  if(!cards.length){ toast(tx('noOutData'),'err'); return; }
  const pages=cards.map(c=>[c,c]);   // 양쪽 동일(반 접기 텐트)
  const cellHTML=(c)=>{
    if(!c) return `<div class="rn-card rn-card-empty"></div>`;
    const repName=(c.repName||'').trim();
    const merged=(c.nTeams||1)>1;   // 묶음(합석) 명패
    // 묶음=세로로 쌓아 각 이름을 크게 유지(가로로 이어붙여 작아지지 않게).
    if(merged && c.members && c.members.length){
      const n=c.members.length;
      const nameBase = n<=2?84: n===3?68: n===4?54: 42;   // 이름 최대한 크게(가장 중요) — 합석 머리글 제거로 자리 확보
      const tagBase  = n<=2?20: n===3?18: 16;             // 태그 전체 축소
      const rowsHTML=c.members.map(m=>{
        const len=(m.name||'').length;
        let ns=nameBase; if(len>9) ns=Math.round(nameBase*0.68); else if(len>6) ns=Math.round(nameBase*0.84);
        return `<div class="rn-mrow">
          <div class="rn-mname" style="font-size:${ns}pt">${esc(m.name)}<span class="rn-honorific">님</span>${m.eng?`<span class="rn-meng">${esc(m.eng)}</span>`:''}</div>
          <div class="rn-mtag" style="font-size:${tagBase}pt">${esc(m.tag)}　<span class="rn-mpax">${m.pax}名</span></div>
        </div>`;
      }).join('');
      return `<div class="rn-card rn-merged">
        <div class="rn-mlist">${rowsHTML}</div>
        <div class="rn-mfoot">合計 ${c.pax}名　${esc(c.period)}</div>
      </div>`;
    }
    const hasKorean=/[가-힣]/.test(repName); const nameLen=repName.length; let nameSize;
    // 한글명을 최대한 크게. 묶음이면 '일행'·태그·날짜를 줄여 이름에 자리를 양보.
    // 이름이 명패에서 가장 중요 → 크게. 단 "님"까지 한 줄에 들어오는 폭으로(줄바꿈=겹침 방지).
    if(hasKorean){
      if(merged) nameSize = nameLen<=6?'60pt': nameLen<=9?'48pt': nameLen<=13?'38pt': nameLen<=18?'30pt':'24pt';
      else       nameSize = nameLen<=2?'116pt': nameLen===3?'92pt': nameLen===4?'74pt': nameLen<=6?'54pt': nameLen<=9?'42pt': nameLen<=13?'32pt':'26pt';
    }else{
      if(merged) nameSize = nameLen<=10?'50pt': nameLen<=16?'40pt': nameLen<=24?'32pt':'26pt';
      else       nameSize = nameLen<=5?'96pt': nameLen<=7?'78pt': nameLen<=10?'60pt': nameLen<=14?'46pt': nameLen<=20?'36pt':'28pt';
    }
    const tagLen=(c.tagCode||'').length;
    const tagSize = tagLen<=5?'32pt': tagLen<=9?'26pt': tagLen<=14?'22pt':'18pt';   // 태그 전체 축소
    const ilSize   = '38pt';   // '일 행' 글씨 축소
    const dateSize = '18pt';
    // 행 높이 합 < 카드 높이 → align-content:center로 상하여백 균등 분배.
    // (테이블No 빈 행은 제거 — ops는 항상 빈칸이라 하단 여백만 키움)
    const rows = '50mm 10mm 22mm 28mm 12mm 16mm';
    return `<div class="rn-card" style="grid-template-rows:${rows}">
      <div class="rn-r1" style="font-size:${nameSize}">${esc(repName)}<span class="rn-honorific">님</span></div>
      <div class="rn-r1b">${esc(c.engName||'')}</div>
      <div class="rn-r2" style="font-size:${ilSize}">일  행</div>
      <div class="rn-r3">${c.pax}名</div>
      <div class="rn-r4" style="font-size:${dateSize}">${esc(c.period)}</div>
      <div class="rn-r5" style="font-size:${tagSize}">${esc(c.tagCode)}</div>
    </div>`;
  };
  const pagesHTML=pages.map(pg=>`<div class="rn-page">${pg.map(cellHTML).join('')}</div>`).join('');
  const fullHTML=`<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>レストラン名札 印刷 — ${todayStr}</title>
<style>
  @page { size: A4 landscape; margin: 8mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: 'Malgun Gothic', 'Meiryo', sans-serif; background: #f5f5f5; color: #000; }
  .rn-toolbar { position: sticky; top: 0; background: #fff; padding: 14px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: flex; align-items: center; gap: 16px; z-index: 100; }
  .rn-toolbar h1 { font-size: 16px; font-weight: 700; color: #1a2540; }
  .rn-toolbar .meta { font-size: 11px; color: #666; }
  .rn-toolbar button { padding: 8px 20px; background: #15803D; color: #fff; border: none; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .rn-toolbar .rn-close { background: #999; }
  .rn-container { padding: 20px; -webkit-user-select: none; user-select: none; }
  .rn-page { width: 281mm; height: 194mm; margin: 0 auto 20px; background: #fff; display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; box-shadow: 0 2px 12px rgba(0,0,0,.08); page-break-after: always; }
  .rn-page:last-child { page-break-after: auto; }
  .rn-card { border: 3pt solid #1A2540; border-radius: 4mm; padding: 4mm 4mm; display: grid; grid-template-rows: 48mm 10mm 36mm 28mm 12mm 24mm 18mm; align-items: center; align-content: center; text-align: center; overflow: hidden; color: #000; }
  .rn-card-empty { border: 3pt dashed #ddd; }
  /* 묶음(합석) = 세로 스택: 이름을 가로로 붙이지 않고 줄마다 크게 */
  .rn-merged { display: flex; flex-direction: column; justify-content: center; gap: 4mm; }
  .rn-mhead { font-size: 15pt; font-weight: 700; color: #1A4D8F; letter-spacing: 2pt; }
  .rn-mlist { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 5mm; }
  .rn-mrow { border-bottom: 1.2pt dashed #aab; padding-bottom: 4mm; }
  .rn-mrow:last-child { border-bottom: none; padding-bottom: 0; }
  .rn-mname { font-weight: 900; line-height: 1.05; letter-spacing: -1pt; white-space: nowrap; overflow: hidden; }
  .rn-meng { display: block; font-size: 13pt; font-weight: 500; color: #333; letter-spacing: 1pt; font-family: 'Arial','Meiryo',sans-serif; margin-top: 1mm; }
  .rn-mtag { font-weight: 900; line-height: 1; font-family: 'Arial','Meiryo',sans-serif; letter-spacing: 2pt; color: #1A2540; margin-top: 2.5mm; }
  .rn-mpax { font-family: 'Malgun Gothic','Meiryo',sans-serif; }
  .rn-mfoot { font-size: 16pt; font-weight: 700; color: #1A2540; letter-spacing: 1pt; }
  .rn-r1 { font-size: 100pt; font-weight: 900; line-height: 1; letter-spacing: -2pt; white-space: nowrap; overflow: hidden; }
  .rn-honorific { font-size: 0.5em; margin-left: 0.2em; font-weight: 800; opacity: 0.85; white-space: nowrap; }
  .rn-r1b { font-size: 16pt; font-weight: 500; line-height: 1; letter-spacing: 1.5pt; color: #333; font-family: 'Arial', 'Meiryo', sans-serif; }
  .rn-r2 { font-size: 54pt; font-weight: 700; line-height: 1; letter-spacing: 6pt; }
  .rn-r3 { font-size: 50pt; font-weight: 700; line-height: 1; }
  .rn-r4 { font-size: 18pt; font-weight: 500; color: #333; line-height: 1; letter-spacing: 2pt; }
  .rn-r5 { font-size: 54pt; font-weight: 900; line-height: 1; font-family: 'Arial', 'Meiryo', sans-serif; letter-spacing: 3pt; color: #000; }
  .rn-table { font-size: 34pt; font-weight: 800; line-height: 1; font-family: 'Arial', 'Meiryo', sans-serif; letter-spacing: 2pt; color: #1A2540; border-top: 1.5pt solid #1A2540; padding-top: 3mm; margin: 0 8mm; }
  .rn-table:empty { border-top: none; }
  @media print {
    html, body { background: #fff; }
    .rn-toolbar { display: none; }
    .rn-container { padding: 0; }
    .rn-page { margin: 0 auto; box-shadow: none; }
  }
</style>
</head><body>
  <div class="rn-toolbar">
    <h1>レストラン名札 인쇄 미리보기</h1>
    <div class="meta">A4 가로 · 1장 1페이지(묶음=합석 1장) · 양쪽 동일 (반 접기 텐트형) · 총 ${cards.length}장 · ${pages.length}페이지 · ${todayStr}</div>
    <div style="flex:1"></div>
    <button onclick="window.print()">🖨 ${lang()==='ja'?'印刷':lang()==='en'?'Print':'인쇄'}</button>
    <button class="rn-close" onclick="window.close()">✕ ${lang()==='ja'?'閉じる':lang()==='en'?'Close':'닫기'}</button>
  </div>
  <div class="rn-container">${pagesHTML}</div>
</body></html>`;
  const w=window.open('','_blank'); if(!w){ toast(tx('popupBlock'),'err'); return; }
  w.document.write(fullHTML); w.document.close();
}

}
