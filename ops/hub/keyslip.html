function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function accomL(a){ return (window.SZCore&&SZCore.accomLabel)?SZCore.accomLabel(a,lang()):(a||''); }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }

// ── 라벨 크기 프리셋 (A4 210×297mm 기준 · 여백은 남는 폭/높이를 반으로) ──
// 라벨 크기 = 52.5×37.125mm 고정(4열×8행 = A4 32면). Min 2026-08 결정.
//  210/4·297/8 로 A4를 여백 없이 정확히 나눈다(종이 낭비 0) + 한 장에 32장으로 가장 많이 뽑힌다.
//  가로가 길어(1.41) 방번호·방이름은 한 줄 유지 — 긴 이름은 roomSize()가 글자만 줄인다.
const SIZE='52x37';
const SIZES={ '52x37':{w:52.5, h:37.125, cols:4, rows:8, label:'52×37mm'} };
const NIGHT_CATS=['3','4','7','etc'];
// 박수별 글씨 색 — 한눈에 3박/4박/7박/8박+를 구분(인쇄·화면 동일).
//  인쇄 대비를 위해 진한 색만 사용(옅은 색은 프린터에서 흐려짐).
const NIGHT_COLOR={'3':'#C0392B','4':'#1F6FB2','7':'#1E7A46','etc':'#7B3F9D'};
function catColor(c){ return NIGHT_COLOR[c]||NIGHT_COLOR.etc; }
const CAT_KEY={'3':'n3','4':'n4','7':'n7','etc':'netc'};
// 룸키 통은 야마나미·쿠주가 주력 → 칩을 앞에 두고 기본으로 켜 둔다(Min 2026-08).
const ACCOM_ORDER=['야마나미리조트','쿠주힐즈','간지호텔','시즈노야도 료칸'];
const ACCOM_DEFAULT=['야마나미리조트','쿠주힐즈'];
const WD_JA=['日','月','火','水','木','金','土'];

let supa=null, YM=null, LABELS=[], UNASSIGNED=[],
    SELCATS=new Set(), SELDATES=new Set(), SELACCOMS=new Set(), ORIGINSEL='all';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymFirst(ym){ return ym+'-01'; }
function ymLast(ym){ const [y,m]=ym.split('-').map(Number); return `${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`; }
function pd(s){ const m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
// 인쇄용 날짜 = 8/5(水) — 요일은 현장 운영대로 일본어 고정
function mdw(s){ const d=pd(s); return d?`${d.getMonth()+1}/${d.getDate()}(${WD_JA[d.getDay()]})`:'-'; }
function nights(ci,co){ const a=pd(ci),b=pd(co); if(!a||!b) return 0; return Math.max(0,Math.round((b-a)/86400000)); }
// 3·4·7박은 정형 패턴, 그 외(1·2·5·6·8박+ …)는 모두 '특이 패턴' 한 묶음(Min 2026-08)
function nightCat(n){ if(n===3)return '3'; if(n===4)return '4'; if(n===7)return '7'; return 'etc'; }
function roomCmp(a,b){ const na=parseInt(a,10),nb=parseInt(b,10);
  if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb; return String(a||'').localeCompare(String(b||'')); }

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+tx('loginNeedTitle')+'<small>'+tx('loginNeedSub')+'</small></div></div>'; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;
    YM=YM||thisYM();
    renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

// 1000행 제한 회피 — range() 페이지네이션
async function paged(qf){
  const out=[]; let from=0;
  for(;;){ const {data,error}=await qf(from,from+999); if(error) return {error};
    out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return {data:out};
}
async function pagedIn(table, cols, col, vals, extra){
  const out=[];
  for(let i=0;i<vals.length;i+=200){
    const chunk=vals.slice(i,i+200);
    const r=await paged((a,b)=>{ let q=supa.from(table).select(cols).in(col,chunk); if(extra) q=extra(q); return q.order(col).range(a,b); });
    if(r.error) return r; out.push(...r.data);
  }
  return {data:out};
}

        <span class="cnt" id="stat"></span>
        <button class="btn" id="btn-print" type="button" disabled>${tx('printBtn')}</button>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="cnt" style="min-width:62px">${tx('lodging')}</span>
        <div id="accomchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="row" style="margin-top:8px">

    + NIGHT_CATS.filter(c=>cnt[c]).map(c=>`<div class="chip ${SELCATS.has(c)?'on':''}" data-c="${c}"`

async function load(){
  if(!supa) return;
  $('#ym-label').textContent=YM; $('#stat').textContent=tx('loading'); $('#btn-print').disabled=true;
  const from=ymFirst(YM), to=ymLast(YM);
  try{
    // 1) 그 달에 체크인하는 방배정(rooms 1행=1명)
    const rr=await paged((a,b)=>supa.from('rooms')
      .select('id,event_seq,member_id,inventory_id,facility,room_type,room_no,check_in,check_out')
      .gte('check_in',from).lte('check_in',to).order('id').range(a,b));
    if(rr.error) throw rr.error;
    const rooms=rr.data||[];
    // 2) 팀(guests+bookings) — 그 달 체크인 팀 + 미배정 점검용으로 그 달 입국 팀도 함께
    const gs=await paged((a,b)=>supa.from('guests')
      .select('event_seq,group_code,team_tag,accom,bookings!inner(rep_name,dep_date,arr_date,origin,airline)')
      .lte('bookings.dep_date',to).gt('bookings.arr_date',from).order('event_seq').range(a,b));
    if(gs.error) throw gs.error;
    const gmap={}; (gs.data||[]).forEach(g=>{ gmap[g.event_seq]=g; });
    // 3) 투숙자 이름(guest_members)
    const mids=[...new Set(rooms.map(r=>r.member_id).filter(Boolean))];
    const mm=mids.length? await pagedIn('guest_members','id,event_seq,seq_in_team,name_kr,name_en,passenger_id,person_tag','id',mids) : {data:[]};
    if(mm.error) throw mm.error;
    const mmap={}; (mm.data||[]).forEach(m=>{ mmap[m.id]=m; });
    // 팀 기준 태그(개인 순번 뺀 "FMカ-Y") — 묶음 통일 태그의 base. 手配書·航空カバー와 같은 소스.
    const ptagBySeq={};
    (mm.data||[]).slice().sort((a,b)=>(a.seq_in_team||0)-(b.seq_in_team||0))
      .forEach(m=>{ if(m.person_tag && !ptagBySeq[m.event_seq]) ptagBySeq[m.event_seq]=m.person_tag; });
    // 3.5) 인별 출발지(혼합 출발지 팀 지원) — 없으면 예약(팀) 출발지로 폴백
    const seqsForPx=[...new Set(rooms.map(r=>r.event_seq))];
    const px=seqsForPx.length? await pagedIn('passengers','id,event_seq,origin,dep_flight','event_seq',seqsForPx) : {data:[]};
    if(px.error) throw px.error;
    const pmap={}; (px.data||[]).forEach(x=>{ pmap[x.id]=x; });

    // 4) 라벨 단위로 묶기 = 같은 팀 · 같은 방 · 같은 체류구간(분할 체류는 각각 별도 라벨)
    const byKey={};
    rooms.forEach(r=>{
      const k=`${r.event_seq}|${r.inventory_id}|${r.check_in}|${r.check_out}`;
      const g=gmap[r.event_seq]||{};
      if(!byKey[k]) byKey[k]={
        eventSeq:r.event_seq, roomNo:r.room_no||'', facility:r.facility||'',
        ci:r.check_in, co:r.check_out,
        code:g.group_code||g.team_tag||'', rep:(g.bookings&&g.bookings.rep_name)||'',
        // 룸키 라벨의 숙소 = 실제로 배정된 객실의 시설(rooms.facility).
        // 예약상 숙소(guests.accom)로 거르면 콤보 상품·시설 이동 팀의 방이 엉뚱한 숙소 칩에 딸려 나온다
        // (예: 쿠주힐즈 예약인데 시즈노야도 志津·合歓에 배정 → 쿠주만 골라도 시즈 방이 인쇄됨).
        accom:r.facility||g.accom||'',
        members:[]
      };
      const m=mmap[r.member_id]; if(m) byKey[k].members.push(m);
      const _b=g.bookings||{};
      if(!byKey[k].bk) byKey[k].bk={origin:_b.origin||'',airline:_b.airline||''};
    });
    LABELS=Object.values(byKey).map(l=>{
      l.members.sort((a,b)=>(a.seq_in_team||0)-(b.seq_in_team||0)||String(a.name_kr||'').localeCompare(String(b.name_kr||'')));
      l.names=l.members.map(m=>(window.__so_pname?__so_pname(m.name_kr,m.name_en):(m.name_kr||m.name_en||''))).filter(Boolean);
      l.pax=l.members.length;
      // 출발지 = 그 방 투숙자 기준(인별). 인별 정보가 없으면 예약(팀) 출발지·항공편으로.
      const st=new Set();
      l.members.forEach(m=>{ const p=(m.passenger_id!=null)?pmap[m.passenger_id]:null;
        if(p) st.add(SZCore.originPort(p.origin||'', p.dep_flight||'')); });
      if(!st.size){ const bk=l.bk||{}; st.add(SZCore.originPort(bk.origin||'', bk.airline||'')); }
      l.ports=[...st]; l.port=l.ports.length===1?l.ports[0]:l.ports.join('/');
      l.n=nights(l.ci,l.co);
      l.cat=nightCat(l.n);
      return l;
    });

    // 4.5) 팀 묶음(現地手配書 print_overrides.team_group) = 대표 기준코드+팀번호로 통일
    //   航空カバー·ネームタグ와 같은 규칙(DRな-Y1 · DRな-Y2). 묶음 상대가 다른 달이어도
    //   번호가 맞도록 그룹 전원을 달과 무관하게 조회한다.
    try{
      const lseqs=[...new Set(LABELS.map(l=>String(l.eventSeq)))];
      const OVR={};
      for(let i=0;i<lseqs.length;i+=400){ const ch=lseqs.slice(i,i+400);
        const {data:ov}=await supa.from('print_overrides').select('event_seq,team_group').in('event_seq',ch);
        (ov||[]).forEach(o=>{ if(o.team_group) OVR[o.event_seq]=o; });
      }
      const gkeys=[...new Set(Object.values(OVR).map(o=>o.team_group))];
      if(gkeys.length && window.SZCore && SZCore.orderGroup && SZCore.teamTagN && SZCore.tagStripSeq){
        const {data:allOv}=await supa.from('print_overrides')
          .select('event_seq,team_group,team_group_rep,team_group_seq').in('team_group',gkeys);
        const ovRows=allOv||[];
        // 이 화면(그 달 체크인)에 없는 팀도 번호 자리를 차지 → 기준코드·입국일 보강
        const need=[...new Set(ovRows.map(r=>String(r.event_seq)))].filter(x=>!gmap[x]);
        const ext={};
        for(let i=0;i<need.length;i+=200){ const ch=need.slice(i,i+200);
          const {data:g2}=await supa.from('guests').select('event_seq,group_code,team_tag,bookings!inner(dep_date)').in('event_seq',ch);
          (g2||[]).forEach(g=>{ ext[g.event_seq]={dep:(g.bookings||{}).dep_date||'', tag:g.group_code||g.team_tag||''}; });
          const {data:m2}=await supa.from('guest_members').select('event_seq,person_tag,seq_in_team').in('event_seq',ch).order('seq_in_team');
          (m2||[]).forEach(m=>{ const e=ext[m.event_seq]; if(e && !e.ptag && m.person_tag) e.ptag=m.person_tag; });
        }
        const strip=t=>SZCore.tagStripSeq(t||'');
        const GRP={}, _seen=new Set();
        ovRows.forEach(r=>{
          const k=r.team_group+'|'+r.event_seq; if(_seen.has(k)) return; _seen.add(k);   // 중복=번호 밀림
          const g=gmap[r.event_seq], e=ext[r.event_seq]||{};
          (GRP[r.team_group]=GRP[r.team_group]||[]).push({
            seq:String(r.event_seq), rep:!!r.team_group_rep,
            gseq:(r.team_group_seq==null?null:r.team_group_seq),
            dep: g?((g.bookings||{}).dep_date||''):(e.dep||''),
            tag: strip(g?(ptagBySeq[r.event_seq]||g.group_code||g.team_tag||''):(e.ptag||e.tag||''))
          });
        });
        Object.keys(GRP).forEach(k=>{
          let all=GRP[k]; if(!all||all.length<2) return;
          // 같은 태그코드를 쓰는 다른 시기 묶음이 합쳐지는 것 방지(번호 밀림)
          const anch=LABELS.find(l=>all.some(x=>x.seq===String(l.eventSeq)));
          if(SZCore.clusterOf && anch){
            const cl=SZCore.clusterOf(all.map(x=>({...x,event_seq:x.seq})), String(anch.eventSeq));
            if(cl && cl.length>=2) all=cl;
          }
          if(all.length<2) return;
          const rep=all.find(x=>x.rep); if(!rep||!rep.tag) return;   // 대표 미지정(구 묶음)=원래 태그 유지
          const base=rep.tag;
          const hasManual=all.every(x=>x.gseq!=null);
          const ordered = hasManual
            ? all.slice().sort((a,b)=>(a.gseq-b.gseq)||(Number(a.seq)-Number(b.seq)))
            : SZCore.orderGroup(all.map(x=>({event_seq:x.seq,dep:x.dep})), rep.seq)
                    .map(o=>all.find(x=>x.seq===String(o.event_seq))).filter(Boolean);
          ordered.forEach((x,i)=>{
            const tg=SZCore.teamTagN(base,i+1);
            LABELS.forEach(l=>{ if(String(l.eventSeq)===x.seq) l.code=tg; });
          });
        });
      }
    }catch(e){ console.warn('묶음 태그 통일 실패:', e && e.message); }

    // 5) 그 달 체크인(입국)인데 방배정이 하나도 없는 팀 — 라벨이 안 나오므로 경고
    const assigned=new Set(rooms.map(r=>r.event_seq));
    UNASSIGNED=(gs.data||[]).filter(g=>{
      const dep=g.bookings&&g.bookings.dep_date;
      return dep && dep>=from && dep<=to && !assigned.has(g.event_seq);
    }).map(g=>`${g.group_code||g.team_tag||g.event_seq}${g.bookings&&g.bookings.rep_name?' '+g.bookings.rep_name:''}`);

    SELCATS.clear(); SELDATES.clear(); SELACCOMS.clear(); ORIGINSEL='all';
    // 숙소 기본값 = 야마나미·쿠주(그 달에 실제로 있는 것만). 둘 다 없으면 전체.
    { const have=new Set(LABELS.map(l=>l.accom));
      ACCOM_DEFAULT.forEach(a=>{ if(have.has(a)) SELACCOMS.add(a); }); }
    if(!LABELS.length){ $('#stat').textContent=tx('noMonthData'); }
    else $('#stat').textContent=tx('cntRooms')(LABELS.length,new Set(LABELS.map(l=>l.eventSeq)).size);
    renderCatChips(); renderOriginChips(); renderDayChips(); renderAccomChips(); renderUnassigned(); renderPreview();
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFail')+': '+e.message,'err'); }
}

function renderUnassigned(){
  const box=$('#unassigned-box'); if(!box) return;
  if(!UNASSIGNED.length){ box.innerHTML=''; return; }
  const show=UNASSIGNED.slice(0,12).map(esc).join(', ')+(UNASSIGNED.length>12?' …':'');
  box.innerHTML=`<div class="warnbox">${tx('unassigned')(UNASSIGNED.length,show)}</div>`;
}

function filtered(){
  return LABELS.filter(l=>{
    if(ORIGINSEL!=='all' && !(l.ports||[]).includes(ORIGINSEL)) return false;
    if(SELCATS.size && !SELCATS.has(l.cat)) return false;
    if(SELDATES.size && !SELDATES.has(l.ci)) return false;
    if(SELACCOMS.size && !SELACCOMS.has(l.accom)) return false;
    return true;
  }).sort((a,b)=>{
    const ai=NIGHT_CATS.indexOf(a.cat), bi=NIGHT_CATS.indexOf(b.cat);
    if(ai!==bi) return ai-bi;                       // 박수(=포스트잇 색)별로 묶어 출력
    if(a.port!==b.port) return String(a.port).localeCompare(String(b.port));   // ICN/PUS 묶기
    if(a.ci!==b.ci) return a.ci.localeCompare(b.ci);
    return roomCmp(a.roomNo,b.roomNo);
  });
}

// 라벨에 찍는 기간 = 체크인일 ~ 퇴실일 (Min 확정 — 현장 수기 방식과 동일).
//  일~목 4박이면 8/9(日)~8/13(木). 선택지 없음.

// 방번호·방이름은 항상 한 줄 — 「志津の宿 合歓」 같은 긴 이름은 글자만 줄여 넣는다.
// 방 번호 표시 = 영문 + 번호 (Min 2026-08: "KUJU 1 이런식으로 영어와 번호로만").
//  DB 저장값(쿠주 1호)은 그대로 두고 인쇄·목록 표시만 바꾼다.
const ROOM_EN=[[/^쿠주\s*/,'KUJU '],[/^돔\s*/,'DOME '],[/^소보\s*/,'SOBO '],[/^아소\s*/,'ASO '],[/^간지\s*/,'GNZ ']];
function roomLabel(no){
  let t=String(no==null?'':no).trim();
  for(const [re,en] of ROOM_EN){ if(re.test(t)){ t=t.replace(re,en); break; } }
  return t.replace(/호\s*$/,'').trim();
}
function roomSize(no){
  const len=String(no||'').length;
  if(len<=6) return 1; if(len<=8) return .82; if(len<=11) return .66; return .52;
}
// 이름 길이에 따라 자동 축소(방 최대 4명까지 한 줄에)
function nameSize(names){
  const len=names.join(' ').length;
  if(len<=10) return 1; if(len<=15) return .84; if(len<=20) return .70; return .58;
}

function printLabels(){
  const list=filtered();
  if(!list.length){ toast(tx('noPrintList'),'err'); return; }
  const s=SIZES[SIZE], PER=s.cols*s.rows;
  const mx=(210-s.w*s.cols)/2, my=(297-s.h*s.rows)/2;
  const slots=[...list];   // A4 라벨지는 항상 1번 칸부터(Min 2026-08 — 시작칸 설정 폐지)
  const pages=[]; for(let i=0;i<slots.length;i+=PER){ const pg=slots.slice(i,i+PER); while(pg.length<PER) pg.push(null); pages.push(pg); }
  const cell=l=> l? `<div class="ks-cell"><div class="ks-body">
      <div class="ks-top"><span class="ks-code" style="color:${catColor(l.cat)}">${esc(l.code)}</span><span class="ks-names" style="font-size:calc(var(--fn) * ${nameSize(l.names)})">${esc(l.names.join(' '))}</span></div>
      <div class="ks-room"><span class="ks-rno" style="font-size:${(roomSize(l.roomNo)*100).toFixed(0)}%">${esc(roomLabel(l.roomNo))}</span><span class="ks-pax">${l.pax}名</span></div>
      <div class="ks-stay">${esc(stayText(l))}</div>
      <div class="ks-meta"><span class="ks-port">${esc(l.port||'')}</span><span class="ks-nt" style="color:${catColor(l.cat)};border-color:${catColor(l.cat)}">${l.n}泊</span></div>
    </div></div>` : '<div class="ks-cell ks-empty"></div>';
  const sizeLabel=`${s.label} · ${lang()==='ja'?'1枚':lang()==='en'?'per sheet':'1장'} ${PER}${lang()==='en'?'':'면'}`;
  const html=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>ルームキー ラベル — ${esc(YM)}</title>

  /* 절취선 — 잘라 쓰는 라벨이라 인쇄에도 자르는 선이 나와야 한다(Min 2026-08).
     미리보기와 인쇄가 같게(WYSIWYG). 칸이 맞붙어 선이 겹쳐도 0.4pt 점선이라 두꺼워 보이지 않는다. */

  // 줄별 자동 축소 — 태그코드+이름(3명)·긴 방이름·긴 날짜가 칸을 넘지 않게 실제로 재서 줄인다.
  //  (글자수 계산식만으론 한글·가나·영문 혼합 폭을 못 맞춘다)
  function ksFit(){
    var LINES=['.ks-top','.ks-room','.ks-stay','.ks-meta'];
    document.querySelectorAll('.ks-cell').forEach(function(cell){
      // 1) 가로 — 줄마다 폭에 맞을 때까지 축소
      LINES.forEach(function(sel){
        var box=cell.querySelector(sel); if(!box) return;
        box.style.fontSize='';
        var pt=parseFloat(getComputedStyle(box).fontSize)/(96/72);
        for(var i=0;i<60 && box.scrollWidth>box.clientWidth+0.5; i++){ pt-=0.4; box.style.fontSize=pt+'pt'; }
      });
      // 2) 세로 — 줄 간격을 먼저 좁히고, 그래도 넘치면 전 줄을 조금씩 줄인다.
      //    (라벨은 overflow:hidden 이라 넘치면 잘린다 — 날짜가 잘리던 문제 재발 방지)
      var body=cell.querySelector('.ks-body'); if(!body) return;
      var gap=parseFloat(getComputedStyle(body).rowGap||getComputedStyle(body).gap)||0;
      for(var g=0; g<40 && body.scrollHeight>body.clientHeight+0.5 && gap>0.5; g++){
        gap-=1; body.style.gap=Math.max(0,gap)+'px';
      }
      for(var k=0; k<40 && body.scrollHeight>body.clientHeight+0.5; k++){
        LINES.forEach(function(sel){
          var box=cell.querySelector(sel); if(!box) return;
          var pt=parseFloat(getComputedStyle(box).fontSize)/(96/72);
          box.style.fontSize=(pt-0.3)+'pt';
        });
      }
    });
  }
  window.addEventListener('load',ksFit);
  window.addEventListener('beforeprint',ksFit);
  <\/script>
  </body></html>`;
