<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 · ネームタグ(네임택) 인쇄</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#3d5424; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#2c3d19;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1000px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  /* 라벨지 칸 미니 지도(3열×8행 = 24면, 왼→오·위→아래) */
  .slot-map{display:grid;grid-template-columns:repeat(3,32px);gap:3px}
  .slot-map .sm-cell{width:32px;height:23px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--mono);border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:var(--text2);cursor:pointer;transition:.1s}
  .slot-map .sm-cell:hover{border-color:var(--accent)}
  .slot-map .sm-cell.used{background:var(--surface3);color:var(--muted);text-decoration:line-through}
  .slot-map .sm-cell.use{background:var(--accentSoft);color:var(--accent);border-color:#b4cda0}
  .slot-map .sm-cell.start{background:var(--accent);color:#fff;border-color:var(--accent)}
  .slot-legend{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
  .slot-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
  /* 미리보기(축소) 라벨 그리드 */
  .prev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
  .prev-cell{border:1px solid var(--border);border-radius:6px;padding:7px 9px;background:var(--surface2);text-align:center}
  .prev-tag{font-size:17px;font-weight:800;font-family:Arial,sans-serif;line-height:1}
  .prev-name{font-size:12px;font-weight:700;margin-top:3px}
  .prev-eng{font-size:9px;color:var(--muted)}
  .prev-io{font-size:9.5px;font-family:var(--mono);color:var(--text2);margin-top:2px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>

<body data-so-area="print">
<div class="topbar so-bar">
  <a class="so-logo" href="../index.html" title="홈"><img class="so-logo-img" src="../../assets/logo-saizen-horizontal.svg" alt="SaiZen"></a>

<script>
const $=s=>document.querySelector(s);

  ja:{ step:'ネームタグ印刷', home:'← ホーム',
    connect:'接続', connecting:'接続中…', connectedBtn:'✓ 接続済', connFailBtn:'接続失敗・再試行',
    notConn:'未接続', connOk:'接続済', connFail:'接続失敗', needUrlKey:'URL・key必要', needLogin:'ログイン必要',
    connHint:'step1で登録した個人タグ(person_tag)を読み込み、Askul 70×33.9mm 24面ラベルで印刷します。',
    preConn:'接続すると表示されます。', loginNeedTitle:'ログインが必要です。', loginNeedSub:'中央のログインカードでログインしてから再接続してください。',
    monFilter:'月選択 · フィルター', origin:'出発地', all:'全体', oIcn:'ICN(仁川)', oPus:'PUS(釜山)',
    startSlot:'開始マス', startSlotT:'ラベル用紙の開始位置(1〜24) — 使いかけのラベル用紙の続き印刷',
    slotMap:'用紙のマス', slotMapHint:'クリックで開始マス指定 ・ 1=左上 → 右 → 下(3列×8行)', slotUsed:'使用済み', slotPrint:'印刷される', slotStart:'開始マス',
    printBtn:'🖨 ラベル印刷', date:'日付', lodging:'宿泊施設',
    deskNote:'選択した月に<b>入国(出発日)</b>するチームの個人名簿。日付・宿泊施設・出発地で絞り込み、<b>日付→ICN/PUS→宿泊施設</b>の順に並べてラベル(1名につき1枚)を出力します。',
    preview:'プレビュー', loading:'読み込み中…', noMonthData:'当月データなし', loadFail:'読み込み失敗',
    cntPeopleTeams:(n,t)=>`${n}名 · ${t}チーム`, sheets:n=>`(${n}枚)`, noList:'表示する名簿がありません。',
    previewCap:n=>`※ プレビューは120枚まで · 印刷は全体 ${n}枚`,
    noPrintList:'印刷する名簿がありません', popupBlocked:'ポップアップブロック — 許可が必要' },
  ko:{ step:'네임택 인쇄', home:'← 홈',
    connect:'연결', connecting:'연결 중…', connectedBtn:'✓ 연결됨', connFailBtn:'연결·재시도',
    notConn:'미연결', connOk:'연결됨', connFail:'연결 실패', needUrlKey:'URL·key 필요', needLogin:'로그인 필요',
    connHint:'step1에서 등록한 개인 태그(person_tag)를 읽어 Askul 70×33.9mm 24면 라벨로 인쇄합니다.',
    preConn:'연결 후 표시됩니다.', loginNeedTitle:'로그인이 필요합니다.', loginNeedSub:'가운데 로그인 카드에서 로그인 후 다시 연결하세요.',
    monFilter:'월 선택 · 필터', origin:'출발지', all:'전체', oIcn:'ICN(인천)', oPus:'PUS(부산)',
    startSlot:'시작칸', startSlotT:'라벨지 시작 위치(1~24) — 쓰던 라벨지 이어쓰기',
    slotMap:'라벨지 칸', slotMapHint:'클릭=시작칸 지정 ・ 1=좌상단 → 오른쪽 → 아래(3열×8행)', slotUsed:'이미 쓴 칸', slotPrint:'인쇄될 칸', slotStart:'시작칸',
    printBtn:'🖨 라벨 인쇄', date:'날짜', lodging:'숙소',
    deskNote:'선택 월에 <b>입국(출발일)</b>하는 팀의 개인 명단. 날짜·숙소·출발지로 거르고, <b>날짜→ICN/PUS→숙소</b> 순으로 정렬해 라벨(개인 1명당 1장)을 출력합니다.',
    preview:'미리보기', loading:'불러오는 중…', noMonthData:'해당 월 데이터 없음', loadFail:'로드 실패',
    cntPeopleTeams:(n,t)=>`${n}명 · ${t}팀`, sheets:n=>`(${n}장)`, noList:'표시할 명단이 없습니다.',
    previewCap:n=>`※ 미리보기는 120장까지 · 인쇄는 전체 ${n}장`,
    noPrintList:'인쇄할 명단이 없음', popupBlocked:'팝업 차단 — 허용 필요' },
  en:{ step:'Name tag print', home:'← Home',
    connect:'Connect', connecting:'Connecting…', connectedBtn:'✓ Connected', connFailBtn:'Failed · retry',
    notConn:'Not connected', connOk:'Connected', connFail:'Connection failed', needUrlKey:'URL·key required', needLogin:'Login required',
    connHint:'Reads the personal tags (person_tag) registered in step1 and prints them as Askul 70×33.9mm 24-up labels.',
    preConn:'Shown after connecting.', loginNeedTitle:'Login required.', loginNeedSub:'Log in via the central login card, then reconnect.',
    monFilter:'Month · Filter', origin:'Origin', all:'All', oIcn:'ICN (Incheon)', oPus:'PUS (Busan)',
    startSlot:'Start cell', startSlotT:'Start position on the label sheet (1–24) — continue on a partly-used sheet',
    slotMap:'Sheet cells', slotMapHint:'Click to set the start cell ・ 1 = top-left → right → down (3 cols × 8 rows)', slotUsed:'Used', slotPrint:'Will print', slotStart:'Start',
    printBtn:'🖨 Print labels', date:'Date', lodging:'Lodging',
    deskNote:'Personal roster of teams <b>arriving (departure date)</b> in the selected month. Filter by date / lodging / origin, sorted by <b>date → ICN/PUS → lodging</b>, and print one label per person.',
    preview:'Preview', loading:'Loading…', noMonthData:'No data for this month', loadFail:'Load failed',
    cntPeopleTeams:(n,t)=>`${n} ppl · ${t} teams`, sheets:n=>`(${n})`, noList:'No roster to show.',
    previewCap:n=>`※ Preview up to 120 · printing all ${n}`,
    noPrintList:'No roster to print', popupBlocked:'Popup blocked — allow it' }
};
function lang(){ return (window.SaizenOps&&SaizenOps.lang)||localStorage.getItem('saizen_lang')||'ja'; }
function tx(k){ const d=L[lang()]||L.ja; return d[k]!==undefined?d[k]:(L.ja[k]||k); }

let supa=null, YM=null, CELLS=[], ORIGIN='all', SELDATES=new Set(), SELACCOMS=new Set(), START=1;
const ACCOM_ORDER=['간지호텔','시즈노야도 료칸','쿠주힐즈','야마나미리조트'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}
function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftYM(ym,delta){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function mmdd(d){if(!d)return '-';const m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}`:String(d);}

// 숙소 → 색/포트 (app 항공커버·라벨과 동일 톤)
const ACCOM_COLOR={Y:'#111111',K:'#5B21B6',G:'#065F46',S:'#92400E'};
function accomPfx(g){ if(g.accom_prefix) return g.accom_prefix; const a=g.accom||''; if(a.includes('쿠주'))return 'K'; if(a.includes('간지')||a.includes('ガーン'))return 'G'; if(a.includes('시즈'))return 'S'; return 'Y'; }
function portOf(origin){ return SZCore.originPort(origin); }  // PUS/ICN = saizen-core 단일 진실원(김해 포함)

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+tx('loginNeedTitle')+'<small>'+tx('loginNeedSub')+'</small></div></div>'; return; }
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;
    YM=YM||thisYM();
    renderUI(); load();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connFailBtn');btn.disabled=false; supa=null; toast(tx('connFail')+': '+e.message,'err'); }
}

function renderUI(){
  $('#content').innerHTML=`
    <div class="panel">
      <h3>${tx('monFilter')}</h3>
      <div class="row">
        <div class="ymctrl">
          <button class="btn sm ghost" id="ym-prev" type="button">◀</button>
          <b id="ym-label"></b>
          <button class="btn sm ghost" id="ym-next" type="button">▶</button>
        </div>
        <span style="width:1px;height:20px;background:var(--border)"></span>
        <span class="cnt">${tx('origin')}</span>
        <div class="chip on" data-o="all">${tx('all')}</div>
        <div class="chip" data-o="icn">${tx('oIcn')}</div>
        <div class="chip" data-o="pus">${tx('oPus')}</div>
        <span style="width:1px;height:20px;background:var(--border)"></span>
        <span class="cnt">${tx('startSlot')}</span>
        <input class="inp" id="start-slot" type="number" min="1" max="24" value="1" style="width:64px;text-align:center" title="${tx('startSlotT')}">
        <span style="flex:1"></span>
        <span class="cnt" id="stat"></span>
        <button class="btn" id="btn-print" type="button" disabled>${tx('printBtn')}</button>
      </div>
      <div class="row" style="margin-top:10px;align-items:flex-start">
        <span class="cnt" style="min-width:46px">${tx('slotMap')}</span>
        <div id="slot-map" class="slot-map"></div>
        <div class="slot-legend">
          <span>${tx('slotMapHint')}</span>
          <span><i style="background:var(--accent)"></i>${tx('slotStart')} &nbsp; <i style="background:var(--accentSoft);border:1px solid #b4cda0"></i>${tx('slotPrint')} &nbsp; <i style="background:var(--surface3)"></i>${tx('slotUsed')}</span>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="cnt" style="min-width:46px">${tx('date')}</span>
        <div id="daychips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="cnt" style="min-width:46px">${tx('lodging')}</span>
        <div id="accomchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="desc" style="margin-top:10px">${tx('deskNote')}</div>
    </div>
    <div class="panel">
      <h3>${tx('preview')} <span class="cnt" id="prev-cnt"></span></h3>
      <div id="prev"></div>
    </div>`;
  $('#ym-prev').addEventListener('click',()=>{YM=shiftYM(YM,-1);load();});
  $('#ym-next').addEventListener('click',()=>{YM=shiftYM(YM,1);load();});
  $('#btn-print').addEventListener('click',printLabels);
  $('#start-slot').addEventListener('input',e=>{ START=Math.max(1,Math.min(24,parseInt(e.target.value,10)||1)); renderSlotMap(); });
  renderSlotMap();
  document.querySelectorAll('.chip[data-o]').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('.chip[data-o]').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); ORIGIN=c.dataset.o; renderPreview();
  }));
}

// 날짜(입국일) 칩 — 멀티 선택, 빈 Set=전체
function renderDayChips(){
  const dates=[...new Set(CELLS.map(c=>c.depRaw).filter(Boolean))].sort();
  const box=$('#daychips'); if(!box) return;
  box.innerHTML=`<div class="chip ${SELDATES.size===0?'on':''}" data-d="__all">${tx('all')}</div>`
    + dates.map(d=>`<div class="chip ${SELDATES.has(d)?'on':''}" data-d="${d}">${mmdd(d)}</div>`).join('');
  box.querySelectorAll('.chip[data-d]').forEach(c=>c.addEventListener('click',()=>{
    const d=c.dataset.d;
    if(d==='__all'){ SELDATES.clear(); } else { if(SELDATES.has(d)) SELDATES.delete(d); else SELDATES.add(d); }
    renderDayChips(); renderPreview();
  }));
}
// 숙소 칩 — 멀티 선택, 빈 Set=전체
function renderAccomChips(){
  const accoms=[...new Set(CELLS.map(c=>c.accom).filter(Boolean))]
    .sort((a,b)=>{const ai=ACCOM_ORDER.indexOf(a),bi=ACCOM_ORDER.indexOf(b);return (ai<0?9:ai)-(bi<0?9:bi);});
  const box=$('#accomchips'); if(!box) return;
  box.innerHTML=`<div class="chip ${SELACCOMS.size===0?'on':''}" data-a="__all">${tx('all')}</div>`
    + accoms.map(a=>`<div class="chip ${SELACCOMS.has(a)?'on':''}" data-a="${esc(a)}">${esc(a)}</div>`).join('');
  box.querySelectorAll('.chip[data-a]').forEach(c=>c.addEventListener('click',()=>{
    const a=c.dataset.a;
    if(a==='__all'){ SELACCOMS.clear(); } else { if(SELACCOMS.has(a)) SELACCOMS.delete(a); else SELACCOMS.add(a); }
    renderAccomChips(); renderPreview();
  }));
}

async function load(){
  if(!supa) return;
  $('#ym-label').textContent=YM; $('#stat').textContent=tx('loading'); $('#btn-print').disabled=true;
  try{
    // 1) 선택 월 팀(guests+bookings)
    const {data:gs,error:e1}=await supa.from('guests')
      .select('event_seq,group_code,accom,accom_prefix,bookings!inner(rep_name,dep_date,arr_date,origin,session_ym)')
      .eq('session_ym',YM);
    if(e1) throw e1;
    const gmap={}; (gs||[]).forEach(g=>{ gmap[g.event_seq]={accom:g.accom,accom_prefix:g.accom_prefix,b:g.bookings||{}}; });
    const seqs=Object.keys(gmap).map(Number);
    if(!seqs.length){ CELLS=[]; $('#stat').textContent=tx('noMonthData'); renderPreview(); return; }
    // 2) 개인(guest_members) — event_seq 청크로 로드
    const members=[];
    for(let i=0;i<seqs.length;i+=200){
      const chunk=seqs.slice(i,i+200);
      let pg=0;
      for(;;){
        const {data,error}=await supa.from('guest_members')
          .select('event_seq,person_tag,seq_in_team,name_kr,name_en,is_rep')
          .in('event_seq',chunk).order('event_seq').order('seq_in_team').range(pg,pg+999);
        if(error) throw error;
        members.push(...(data||[]));
        if(!data||data.length<1000) break; pg+=1000;
      }
    }
    // 3) 셀 구성
    CELLS=members.map(m=>{
      const g=gmap[m.event_seq]||{}; const b=g.b||{};
      const pfx=accomPfx(g);
      return {
        tag:m.person_tag||'', kor:m.name_kr||'', eng:m.name_en||'',
        seq:m.seq_in_team||0,
        port:portOf(b.origin), dep:mmdd(b.dep_date), arr:mmdd(b.arr_date), depRaw:b.dep_date||'',
        accom:g.accom||'', origin:b.origin||'', accomColor:ACCOM_COLOR[pfx]||'#111'
      };
    }).filter(c=>c.tag||c.kor);
    // 월이 바뀌면 선택 초기화
    SELDATES.clear(); SELACCOMS.clear();
    $('#stat').textContent=tx('cntPeopleTeams')(CELLS.length,seqs.length);
    renderDayChips(); renderAccomChips(); renderPreview();
  }catch(e){ $('#stat').textContent=tx('loadFail'); toast(tx('loadFail')+': '+e.message,'err'); }
}

// 정렬: 날짜 → ICN/PUS → 숙소순 → 팀내순번
function sortCells(a,b){
  if(a.depRaw!==b.depRaw) return (a.depRaw||'').localeCompare(b.depRaw||'');
  if(a.port!==b.port) return a.port==='ICN'?-1:1;
  const ai=ACCOM_ORDER.indexOf(a.accom), bi=ACCOM_ORDER.indexOf(b.accom);
  if(ai!==bi) return (ai<0?9:ai)-(bi<0?9:bi);
  return (a.seq||0)-(b.seq||0);
}
function filtered(){
  return CELLS.filter(c=>{
    if(ORIGIN==='icn' && c.port!=='ICN') return false;
    if(ORIGIN==='pus' && c.port!=='PUS') return false;
    if(SELDATES.size && !SELDATES.has(c.depRaw)) return false;
    if(SELACCOMS.size && !SELACCOMS.has(c.accom)) return false;
    return true;
  }).sort(sortCells);
}
function renderPreview(){
  const list=filtered();
  $('#btn-print').disabled=!list.length;
  $('#prev-cnt').textContent=list.length?tx('sheets')(list.length):'';
  const box=$('#prev');
  if(!list.length){ box.innerHTML='<div class="deny" style="color:var(--muted);padding:24px">'+tx('noList')+'</div>'; return; }
  box.innerHTML='<div class="prev-grid">'+list.slice(0,120).map(c=>`
    <div class="prev-cell">
      <div class="prev-tag" style="color:${c.accomColor}">${esc(c.tag)}</div>
      <div class="prev-name">${esc(c.kor)} <span class="prev-eng">${c.eng?'('+esc(c.eng)+')':''}</span></div>
      <div class="prev-io">IN ${c.port} ${esc(c.dep)} / OUT ${c.port} ${esc(c.arr)}</div>
    </div>`).join('')+'</div>'
    +(list.length>120?`<div class="cnt" style="margin-top:8px">${tx('previewCap')(list.length)}</div>`:'');
}

// 라벨지 칸 미니 지도 — 24면(3열×8행). 클릭=시작칸 지정. 1=좌상단→오른쪽→아래.
function renderSlotMap(){
  const box=$('#slot-map'); if(!box) return;
  let h='';
  for(let i=1;i<=24;i++){
    const cls = i<START ? 'used' : (i===START ? 'start' : 'use');
    h+=`<div class="sm-cell ${cls}" data-slot="${i}" title="${i}">${i}</div>`;
  }
  box.innerHTML=h;
  box.querySelectorAll('[data-slot]').forEach(c=>c.addEventListener('click',()=>{
    START=parseInt(c.dataset.slot,10)||1; const inp=$('#start-slot'); if(inp) inp.value=START; renderSlotMap();
  }));
}

// Askul AR9-0796 70×33.9mm 24면 라벨 인쇄창
function printLabels(){
  const list=filtered();
  if(!list.length){ toast(tx('noPrintList'),'err'); return; }
  const PER=24, pages=[];
  const slots=[...Array(Math.max(0,START-1)).fill(null), ...list];   // 시작칸만큼 빈 셀 앞에 채움
  for(let i=0;i<slots.length;i+=PER){ const pg=slots.slice(i,i+PER); while(pg.length<PER) pg.push(null); pages.push(pg); }
  const cell=c=> c? `<div class="lp-cell"><div class="lp-hole"></div><div class="lp-body">
      <div class="lp-r1" style="color:${c.accomColor}">${esc(c.tag)}</div>
      <div class="lp-r2">${esc(c.kor)} <span class="lp-r2-eng">${c.eng?'('+esc(c.eng)+')':''}</span></div>
      <div class="lp-r3">IN&nbsp; ${esc(c.port)} ${esc(c.dep)}</div>
      <div class="lp-r4">OUT ${esc(c.port)} ${esc(c.arr)}</div>
    </div></div>` : '<div class="lp-cell lp-cell-empty"></div>';
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>ネームタグ 印刷 — ${YM}</title>
  <style>
  @page{size:A4 portrait;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{font-family:'Meiryo','Malgun Gothic',sans-serif;background:#f5f5f5;color:#1a2540}
  .lp-toolbar{position:sticky;top:0;background:#fff;padding:14px 20px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;gap:16px;z-index:100}
  .lp-toolbar h1{font-size:16px;font-weight:700}.lp-toolbar .meta{font-size:11px;color:#666}
  .lp-toolbar button{padding:8px 20px;background:#15803D;color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer}
  .lp-toolbar .lp-close{background:#999}.lp-container{padding:20px}
  .lp-page{width:210mm;height:297mm;margin:0 auto 20px;background:#fff;position:relative;padding:12.9mm 0;display:grid;grid-template-columns:repeat(3,70mm);grid-template-rows:repeat(8,33.9mm);box-shadow:0 2px 12px rgba(0,0,0,.08);page-break-after:always}
  .lp-page:last-child{page-break-after:auto}
  .lp-cell{width:70mm;height:33.9mm;overflow:hidden;border:.3pt dashed #e0e0e0;position:relative;display:flex;flex-direction:row;align-items:center;padding:1.5mm 2.5mm 1.5mm 1mm}
  .lp-hole{width:5mm;height:100%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .lp-hole::after{content:'';width:2.5mm;height:2.5mm;border:.4pt solid #c8c8c8;border-radius:50%}
  .lp-body{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .lp-cell-empty{border:.3pt dashed #e0e0e0;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f0f0f0 6px,#f0f0f0 12px)}
  .lp-r1{font-size:25pt;font-weight:700;text-align:center;font-family:'Arial','Meiryo',sans-serif;letter-spacing:.5px;line-height:1;margin-bottom:.8mm}
  .lp-r2{font-size:15pt;font-weight:700;text-align:center;line-height:1.05;margin-bottom:.6mm}
  .lp-r2-eng{font-size:7pt;color:#6b7a90;font-weight:500}
  .lp-r3,.lp-r4{font-size:7.5pt;text-align:center;font-family:'Consolas','Menlo',monospace;color:#1a2540;line-height:1.25}
  @media print{html,body{background:#fff}.lp-toolbar{display:none}.lp-container{padding:0}.lp-page{margin:0 auto;box-shadow:none}.lp-cell{border:none}.lp-cell-empty{background:#fff;border:none}}
  </style></head><body>
  <div class="lp-toolbar"><h1>ネームタグ 인쇄 미리보기</h1>
    <div class="meta">A4 24면 (70×33.9mm · 3열×8단) · ${list.length}장 · ${pages.length}페이지 · ${YM}</div>
    <div style="flex:1"></div>
    <button onclick="window.print()">인쇄</button><button class="lp-close" onclick="window.close()">✕ 닫기</button>
  </div>
  <div class="lp-container">${pages.map(pg=>`<div class="lp-page">${pg.map(cell).join('')}</div>`).join('')}</div>
  </body></html>`;
  const w=window.open('','_blank'); if(!w){ toast(tx('popupBlocked'),'err'); return; }
  w.document.write(html); w.document.close();
}

// 연결 전 정적 chrome(topbar·conn·대기 화면) 라벨 적용. 연결 후 패널은 renderUI/load가 tx로 직접 렌더.
function applyStatic(){
  const step=$('#t-step'); if(step) step.textContent=tx('step');
  const home=$('#t-home'); if(home) home.textContent=tx('home');
  const hint=$('#t-connhint'); if(hint) hint.textContent=tx('connHint');
  const pre=$('#t-preconn'); if(pre) pre.textContent=tx('preConn');
  // 연결 상태 pill·버튼 — 현재 상태에 맞게만 갱신(미연결 기본)
  const btn=$('#btn-connect');
  if(supa){ setConn(tx('connOk'),'ok'); if(btn) btn.textContent=tx('connectedBtn'); }
  else { setConn(tx('notConn'),''); if(btn) btn.textContent=tx('connect'); }
}
// 언어 토글 시 정적 chrome + (연결돼 있으면) 패널 재렌더
window.onSaizenLangChange=function(){ applyStatic(); if(supa){ renderUI(); load(); } };

$('#btn-connect').addEventListener('click',connect);
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }
