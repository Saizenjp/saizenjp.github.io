<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>안내 모니터 · 案内モニター</title>
<!--
  안내 모니터(디지털 사이니지) — 로비·2층 엘리베이터 앞 TV 에 켜 두는 전체화면.
  · 로그인 없음: signage_dinner / signage_lobby RPC(SQL 134·135) 만 부른다 — 오늘·내일만 답하고 방번호·연락처는 안 준다.
  · saizen-ops.js 는 싣지 않는다(상단바·로그인 카드가 화면을 가린다). 공용은 saizen-core.js(순수 규칙)만.
  · ?screen=dinner (2층: 오늘 석식 명단) · ?screen=lobby (로비: 환영판·출발 안내·석식·날씨·공지 로테이션)
  · ?screen=course (코스 입구·클럽하우스: 오늘 組合せ表 — signage_course, SQL 136. 17시 이후엔 내일)
  · ?screen=office (사무실·프론트 뒤, 직원용: 오늘 진행 현황 숫자판 — signage_office, SQL 137. 일본어 우선. 이름·방번호·금액 없음)
  · ?date=YYYY-MM-DD (시험용) · ?cut=21 (석식: 이 시각 이후엔 내일) · ?refresh=60 (초) · ?rot=20 (로비 화면 전환 초)
  · 표기 원칙(Min): 손님용 = 한국어 우선 · 한·일 병기. 공개 장소라 방번호·연락처·생년은 어디에도 없다.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/saizen-core.js?v=40"></script>
<style>
  :root{ --bg:#10160e; --panel:#182115; --line:#3a4d31; --ink:#f4f7ee; --ink2:#d3e4c2; --muted:#93a585; --gold:#ffe9a8; --acc:#a9d18b;
         --mono:'SFMono-Regular',Consolas,Menlo,'SZJpMono',monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;cursor:none}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic',system-ui,sans-serif;display:flex;flex-direction:column;padding:2.2vh 2.6vw;gap:1.6vh}
  .hd{display:flex;align-items:baseline;gap:2vw;border-bottom:.4vh solid #7f9a5f;padding-bottom:1vh}
  .hd .t{font-size:3.6vh;font-weight:800;letter-spacing:.05vw}
  .hd .t small{font-size:2.4vh;font-weight:800;color:var(--ink2);margin-left:1vw}
  .hd .d{font-size:3vh;font-weight:800;color:var(--ink2)}
  .hd .d b{color:var(--gold);margin-right:.8vw}
  .hd .c{margin-left:auto;font-size:3.8vh;font-weight:800;font-family:var(--mono);color:var(--gold)}
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:1.6vw;align-items:stretch}
  .box{background:var(--panel);border:.25vh solid var(--line);border-radius:1.2vh;padding:1.8vh 2vw}
  .box .lb{font-size:2.1vh;font-weight:800;color:var(--muted);letter-spacing:.1vw}
  .venue .ko{font-size:9vh;font-weight:900;line-height:1.05;color:#fff;margin-top:.6vh}
  .venue .ja{font-size:4.2vh;font-weight:800;color:var(--acc);margin-top:.4vh}
  .venue.unset .ko{font-size:4.6vh;color:var(--ink2)}
  .venue.unset .ja{font-size:3vh}
  .time{display:flex;flex-direction:column;justify-content:center}
  .time .tm{font-size:7.4vh;font-weight:900;font-family:var(--mono);color:var(--gold);line-height:1.1}
  .time .menu{font-size:2.9vh;font-weight:800;color:var(--ink2);margin-top:1vh}
  .time .menu b{color:#fff}
  .note{font-size:2.8vh;font-weight:800;color:#fff;background:#384d2a;border-left:.9vw solid var(--acc);padding:1vh 1.4vw;border-radius:.8vh}
  .list{flex:1;min-height:0;display:grid;gap:.5vh .9vw;align-content:start;grid-auto-flow:column}
  .row{display:flex;align-items:center;gap:.6vw;background:var(--panel);border:.2vh solid var(--line);border-radius:.8vh;padding:.55vh .9vw;font-size:var(--fs,2.6vh);white-space:nowrap;overflow:hidden}
  .row .tag{font-family:var(--mono);font-weight:800;color:var(--gold);min-width:6.2em}
  .row .nm{font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis}
  .row .nm i{font-style:normal;font-size:.72em;color:var(--ink2);margin-left:.3em}
  .row .px{margin-left:auto;font-weight:800;color:var(--ink2);font-size:.85em}
  .row .px b{color:#fff;font-size:1.15em}
  .row.k{border-color:#5d7c4a;background:#1d2a19}
  .ft{display:flex;gap:2vw;align-items:center;font-size:2vh;font-weight:800;color:var(--muted);border-top:.2vh solid var(--line);padding-top:.9vh}
  .ft .tot{color:var(--ink2)}
  .ft .tot b{color:#fff;font-size:1.2em}
  .ft .pg{color:var(--acc)}
  .ft .upd{margin-left:auto;font-family:var(--mono)}
  .ft .upd.err{color:#ffb4a6}
  .none{grid-column:1/-1;text-align:center;color:var(--ink2);font-size:3.4vh;padding:8vh 0}
  /* ── 로비 화면(로테이션) ── */
  .pane{flex:1;min-height:0;display:none;flex-direction:column;gap:1.4vh}
  .pane.on{display:flex}
  .dots{display:flex;gap:.8vw;align-items:center}
  .dots i{display:block;width:1.1vw;height:1.1vw;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--acc)}
  .big{font-size:6.4vh;font-weight:900;color:#fff;line-height:1.15}
  .big small{display:block;font-size:2.8vh;color:var(--acc);font-weight:800;margin-top:.4vh}
  .fl{background:var(--panel);border:.25vh solid var(--line);border-radius:1.2vh;padding:1.4vh 1.8vw;display:flex;flex-direction:column;gap:.8vh}
  .fl .fh{display:flex;align-items:baseline;gap:1.4vw;flex-wrap:wrap}
  .fl .fh .day{font-size:2.4vh;font-weight:800;color:var(--acc);background:#243320;border-radius:.6vh;padding:.2vh 1vw}
  .fl .fh .fno{font-family:var(--mono);font-size:4.2vh;font-weight:900;color:var(--gold)}
  .fl .fh .ftm{font-family:var(--mono);font-size:4.2vh;font-weight:900;color:#fff}
  .fl .fh .frt{font-size:2.8vh;font-weight:800;color:var(--ink2)}
  .fl .fh .fpx{margin-left:auto;font-size:2.6vh;font-weight:800;color:var(--ink2)}
  .fl .bus{display:flex;gap:1.2vw;flex-wrap:wrap;align-items:center;font-size:3vh;font-weight:800;color:#fff}
  .fl .bus .dep{font-family:var(--mono);font-size:4.4vh;font-weight:900;color:var(--gold);background:#384d2a;border-radius:.8vh;padding:.2vh 1.2vw}
  .fl .bus .lb2{font-size:2.3vh;color:var(--ink2)}
  .fl .bus.none2{color:var(--muted);font-size:2.4vh}
  .fl .tags{display:flex;flex-wrap:wrap;gap:.5vh .7vw}
  .fl .tags span{font-family:var(--mono);font-size:2.3vh;font-weight:800;color:var(--gold);background:#0f150c;border:.2vh solid var(--line);border-radius:.6vh;padding:.15vh .8vw}
  .fl .tags span b{font-family:inherit;color:var(--ink2);font-weight:800;margin-left:.4vw}
  .wx{display:grid;grid-template-columns:repeat(8,1fr);gap:.8vw;flex:1;align-content:start}
  .wx .h{background:var(--panel);border:.25vh solid var(--line);border-radius:1.2vh;padding:1.4vh 0;text-align:center}
  .wx .h.now{border-color:var(--acc);background:#243320}
  .wx .h .hh{font-size:2.6vh;font-weight:800;color:var(--ink2)}
  .wx .h .ic{font-size:6.5vh;line-height:1.3}
  .wx .h .tp{font-size:4.2vh;font-weight:900;color:#fff}
  .wx .h .pp{font-size:2.3vh;font-weight:800;color:#9fc8ff}
  .wx .h .ds{font-size:2.2vh;font-weight:800;color:var(--ink2)}
  .wx .h.day{grid-column:1/-1;display:flex;gap:2vw;align-items:center;justify-content:center;padding:1vh}
  .nts{display:flex;flex-direction:column;gap:1.2vh;flex:1;min-height:0;overflow:hidden}
  .nt{background:var(--panel);border:.25vh solid var(--line);border-radius:1.2vh;padding:1.6vh 2vw}
  .nt.pin{border-color:var(--acc)}
  .nt .ttl{font-size:3.6vh;font-weight:900;color:#fff}
  .nt .bd{font-size:2.8vh;font-weight:700;color:var(--ink2);margin-top:.6vh;white-space:pre-wrap;line-height:1.45}
  /* ── 코스 배정표 ── */
  .crs{flex:1;min-height:0;overflow:hidden}
  .crs table{width:100%;border-collapse:collapse;table-layout:fixed}
  .crs th{padding:.9vh .8vw;font-size:2.7vh;font-weight:800;background:#2a3b22;border:.25vh solid #56704a;color:#fff}
  .crs th span{display:block;font-size:1.8vh;font-weight:700;color:var(--ink2)}
  .crs th:first-child{width:11vw}
  .crs td{padding:.55vh .8vw;font-size:var(--fs,3vh);font-weight:700;border:.25vh solid #46583b;white-space:nowrap;overflow:hidden;line-height:1.35}
  .crs tbody tr:nth-child(even) td{background:#182115}
  .crs td.tee{font-family:var(--mono);font-weight:800;text-align:center;background:#232f1d;font-size:calc(var(--fs,3vh)*1.1);color:#fff}
  .crs td b{font-family:var(--mono);color:var(--gold);font-size:.92em}
  .crs td i{font-style:normal;font-size:.68em;color:var(--ink2);margin-left:.4vw}
  .crs td .nm{color:#fff;margin-left:.5vw}
  .crs td .pax{color:var(--ink2);font-size:.78em;margin-left:.6vw}
  .crs tr.past td{opacity:.42}
  .crs tr.next td{background:#384d2a}
  .crs tr.next td.tee{box-shadow:inset .7vw 0 0 var(--acc)}
  /* ── 직원용 운영 현황 ── */
  .kpi{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:1.1vw}
  .k{background:var(--panel);border:.25vh solid var(--line);border-radius:1.2vh;padding:1.4vh 1.4vw;display:flex;flex-direction:column;gap:.4vh;overflow:hidden}
  .k.warn{border-color:#c46a5a;background:#2a1a17}
  .k.ok{border-color:#5d7c4a}
  .k .lb{font-size:2.4vh;font-weight:800;color:#fff}
  .k .lb small{display:block;font-size:1.7vh;color:var(--muted);font-weight:700}
  .k .v{font-size:6.2vh;font-weight:900;color:var(--gold);font-family:var(--mono);line-height:1.05}
  .k .v small{font-size:2.6vh;color:var(--ink2);font-family:var(--mono);margin-left:.3vw}
  .k.warn .v{color:#ffb4a6}
  .k .sub{font-size:2vh;font-weight:800;color:var(--ink2)}
  .k .tg{display:flex;flex-wrap:wrap;gap:.4vh .5vw;overflow:hidden;align-content:flex-start}
  .k .tg span{font-family:var(--mono);font-size:1.75vh;font-weight:800;color:var(--gold);background:#0f150c;border:.2vh solid var(--line);border-radius:.5vh;padding:.1vh .6vw}
  .fixed{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw}
  .fixed .box .v{font-size:4.6vh;font-weight:900;color:#fff;font-family:var(--mono);margin-top:.4vh}
</style>
</head>
<body>
  <div class="hd">
    <div class="t" id="hd-title">석식 안내<small>夕食のご案内</small></div>
    <div class="d" id="hd-date"></div>
    <div class="c" id="clock">--:--</div>
  </div>

  <!-- ── 2층: 석식 명단 ── -->
  <div class="pane" id="p-dinner">
    <div class="hero">
      <div class="box venue unset" id="v-venue">
        <div class="lb">석식 장소 · 夕食会場</div>
        <div class="ko" id="v-ko">준비 중</div>
        <div class="ja" id="v-ja">準備中</div>
      </div>
      <div class="box time">
        <div class="lb">시간 · 時間</div>
        <div class="tm" id="v-time">—</div>
        <div class="menu" id="v-menu"></div>
      </div>
    </div>
    <div class="note" id="v-note" hidden></div>
    <div class="list" id="list"><div class="none">불러오는 중… / 読み込み中…</div></div>
  </div>

  <!-- ── 로비: 환영판 ── -->
  <div class="pane" id="p-welcome">
    <div class="big">어서 오세요<small>ようこそ 阿蘇やまなみリゾートへ</small></div>
    <div class="list" id="w-list"></div>
  </div>
  <!-- ── 로비: 출발 안내 ── -->
  <div class="pane" id="p-depart"><div id="d-list" style="display:flex;flex-direction:column;gap:1.2vh;flex:1;min-height:0;overflow:hidden"></div></div>
  <!-- ── 로비: 석식 요약 ── -->
  <div class="pane" id="p-dsum">
    <div class="hero">
      <div class="box venue unset" id="s-venue"><div class="lb">석식 장소 · 夕食会場</div><div class="ko" id="s-ko"></div><div class="ja" id="s-ja"></div></div>
      <div class="box time"><div class="lb">시간 · 時間</div><div class="tm" id="s-time">—</div><div class="menu" id="s-menu"></div></div>
    </div>
    <div class="note" id="s-note" hidden></div>
    <div class="box" style="font-size:2.8vh;font-weight:800;color:var(--ink2)">팀별 명단은 2층 레스토랑 앞 모니터에서 확인해 주세요<br><span style="color:var(--muted)">チーム別のご案内は2階レストラン前のモニターをご覧ください</span></div>
  </div>
  <!-- ── 로비: 날씨 ── -->
  <div class="pane" id="p-weather"><div class="wx" id="wx"></div></div>
  <!-- ── 로비: 공지 ── -->
  <div class="pane" id="p-notice"><div class="nts" id="nts"></div></div>
  <!-- ── 직원용: 운영 현황 ── -->
  <div class="pane" id="p-office"><div class="kpi" id="kpi"><div class="none">読み込み中… / 불러오는 중…</div></div></div>
  <!-- ── 코스 입구: 組合せ表 ── -->
  <div class="pane" id="p-course"><div class="crs" id="crs"><div class="none">불러오는 중… / 読み込み中…</div></div></div>

  <div class="ft">
    <div class="tot" id="tot"></div>
    <div class="pg" id="pg"></div>
    <div class="dots" id="dots"></div>
    <div class="upd" id="upd"></div>
  </div>
<script>
const $=s=>document.querySelector(s);
const Q=new URLSearchParams(location.search);
const SCREEN=['lobby','course','office'].includes(Q.get('screen'))?Q.get('screen'):'dinner';
const _cut=parseInt(Q.get('cut'),10); const CUT_H=isNaN(_cut)?(SCREEN==='course'?17:21):Math.max(0,Math.min(23,_cut));   // 이 시각(JST) 이후엔 내일(석식 21시 · 코스 17시)
const REFRESH=Math.max(15,parseInt(Q.get('refresh')||(SCREEN==='office'?'30':'60'),10)||60);   // 직원 화면은 30초
const ROT=Math.max(8,parseInt(Q.get('rot')||'20',10)||20);   // 로비 화면 전환(초)
const PAGE_ROWS=72;   // 석식 명단 한 화면 최대 줄 — 넘으면 12초마다 넘김
const SB_URL=localStorage.getItem('saizen_sb_url')||'https://wzfmloivrolpwpiuyhbs.supabase.co';
const SB_KEY=localStorage.getItem('saizen_sb_key')||'sb_publishable_W76Uh3D9gRPjPoxHwl-LYw_dR9BIj6L';   // publishable(공개용) — saizen-ops.js 기본값과 같다
const VENUE={restaurant:{ko:'레스토랑',ja:'レストラン'},convention:{ko:'컨벤션홀',ja:'コンベンションホール'}};
const WD_KO=['일','월','화','수','목','금','토'], WD_JA=['日','月','火','水','木','金','土'];
const LAT=32.95, LON=131.12;   // 홈 날씨와 같은 좌표(아소 야마나미 리조트 인근)
let supa=null, DATA=null, PAGE=0, PAGES=1, LASTOK='', WX=null, WXAT=0;
let COURSE=null;   // 로비: 코스 배정표(signage_course)도 같이 돌린다 — 아침 로비 문의 감소(Min)
let PANES=[], PI=0;   // 로비: 지금 돌릴 화면 목록·현재 인덱스

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jst(){ const n=new Date(); return new Date(n.getTime()+(n.getTimezoneOffset()+540)*60000); }   // 모니터 PC 시간대와 무관하게 JST
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hhmm(){ const n=jst(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
// 석식 표시 날짜: ?date 우선, 없으면 오늘 — CUT_H 이후엔 내일(저녁이 끝난 뒤 내일 것을 미리)
function targetDate(){
  const f=Q.get('date'); if(f&&/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const n=jst(); if(SCREEN!=='lobby' && SCREEN!=='office' && n.getHours()>=CUT_H){ n.setDate(n.getDate()+1); }
  return ymd(n);
}
function dateLabel(iso){ const d=new Date(iso+'T00:00:00'); const m=d.getMonth()+1, day=d.getDate(), w=d.getDay();
  return `${m}월 ${day}일 (${WD_KO[w]}) <small style="font-size:.75em;color:var(--muted)">${m}月${day}日(${WD_JA[w]})</small>`; }
function mdLabel(iso){ const d=new Date(iso+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()} (${WD_KO[d.getDay()]}·${WD_JA[d.getDay()]})`; }
function tick(){ $('#clock').textContent=hhmm(); }
function setUpd(ok){ const e=$('#upd'); if(ok){ LASTOK=hhmm(); e.className='upd'; e.textContent=LASTOK+' 갱신'; }
  else { e.className='upd err'; e.textContent='⚠ 갱신 실패 '+hhmm()+(LASTOK?' · 마지막 '+LASTOK:''); } }

async function load(){
  const date=targetDate();
  try{
    if(!supa) supa=window.supabase.createClient(SB_URL,SB_KEY);
    const {data,error}=await supa.rpc({lobby:'signage_lobby',course:'signage_course',office:'signage_office'}[SCREEN]||'signage_dinner',{p_date:date});
    if(error) throw error;
    if(!data||data.ok===false) throw new Error((data&&data.reason)||'no data');
    if(SCREEN==='lobby'){ try{ const c=await supa.rpc('signage_course',{p_date:date}); COURSE=(c.data&&c.data.ok!==false)?c.data:null; }catch(e){ COURSE=null; } }   // 코스 표는 실패해도 로비는 돈다
    DATA=data; PAGE=0; setUpd(true);
    if(SCREEN==='lobby') renderLobby(); else if(SCREEN==='course') renderCourse(); else if(SCREEN==='office') renderOffice(); else render();
  }catch(e){
    setUpd(false);
    if(!DATA){ const el=$({lobby:'#w-list',course:'#crs',office:'#kpi'}[SCREEN]||'#list'); el.innerHTML='<div class="none">데이터를 불러오지 못했습니다<br>データを取得できませんでした</div>'; if(SCREEN==='lobby'){ showPane('p-welcome'); } }
  }
}

// ── 2층: 석식 명단 ──────────────────────────────────────────────────────
function fillVenue(pre, v, tm, base, note){
  const vb=$('#'+pre+'venue'); vb.classList.toggle('unset',!v);
  $('#'+pre+'ko').textContent=v?v.ko:'장소는 프론트에 문의해 주세요';
  $('#'+pre+'ja').textContent=v?v.ja:'会場はフロントへお尋ねください';
  $('#'+pre+'time').textContent=tm||'—';
  $('#'+pre+'menu').innerHTML=base?`오늘의 기본 석식 · 本日の基本夕食<br><b>${esc(base)}</b>`:'';
  const nt=$('#'+pre+'note'); if(note){ nt.hidden=false; nt.textContent=note; } else nt.hidden=true;
}
function render(){
  const d=DATA; if(!d) return;
  const isTomorrow=d.date!==d.today;
  $('#hd-date').innerHTML=(isTomorrow?'<b>내일 · 明日</b>':'<b>오늘 · 本日</b>')+dateLabel(d.date);
  const base=(window.SZCore&&SZCore.baseDinner)?SZCore.baseDinner(d.date):'';
  fillVenue('v-', VENUE[d.venue], [d.start_time,d.end_time].filter(Boolean).join(' 〜 '), base, d.note);
  const teams=Array.isArray(d.teams)?d.teams:[];
  PAGES=Math.max(1,Math.ceil(teams.length/PAGE_ROWS));
  const slice=teams.slice(PAGE*PAGE_ROWS,(PAGE+1)*PAGE_ROWS);
  gridRows($('#list'), slice, '오늘 석식 명단이 없습니다<br>本日の夕食予約はありません');
  $('#tot').innerHTML=`<b>${d.units||0}</b>팀 · <b>${d.total||0}</b>명 <span style="color:var(--muted)">/ ${d.units||0}チーム · ${d.total||0}名</span>`;
  $('#pg').textContent=PAGES>1?`${PAGE+1} / ${PAGES}`:'';
  showPane('p-dinner');
}
// 태그·대표·인원 줄을 한 화면에 — 열 수=12줄/열 기준(최대 6열), 열이 늘수록 글자 축소
function gridRows(list, rows, emptyMsg, extra){
  if(!rows.length){ list.style.cssText=''; list.innerHTML=`<div class="none">${emptyMsg}</div>`; return; }
  const n=rows.length, cols=n<=6?1:Math.min(6,Math.max(2,Math.ceil(n/12))), r=Math.ceil(n/cols);
  const fs=[0,3.2,3.0,2.7,2.45,2.2,2.0][cols]||2.0;
  list.style.cssText=`grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${r},auto);--fs:${fs}vh`;
  list.innerHTML=rows.map(t=>`<div class="row ${t.accom==='쿠주힐즈'?'k':''}"><span class="tag">${esc(t.tag||'')}</span><span class="nm">${esc(t.rep||'')}<i>様</i>${t.teams>1?`<i>+${t.teams-1}</i>`:''}${extra?extra(t):''}</span><span class="px"><b>${esc(t.pax)}</b>名</span></div>`).join('');
}
function flip(){ if(SCREEN==='dinner'){ if(PAGES>1){ PAGE=(PAGE+1)%PAGES; render(); } } }

// ── 로비: 화면 로테이션 ─────────────────────────────────────────────────
const TITLES={ 'p-office':['本日の運営状況','오늘 운영 현황'], 'p-course':['오늘의 출발 시각','本日のスタート時刻'], 'p-welcome':['환영합니다','ようこそ'], 'p-depart':['출발 안내','ご出発のご案内'], 'p-dsum':['석식 안내','夕食のご案内'], 'p-weather':['날씨','天気'], 'p-notice':['안내','お知らせ'] };
function showPane(id){
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===id));
  const t=TITLES[id]; if(t) $('#hd-title').innerHTML=`${esc(t[0])}<small>${esc(t[1])}</small>`;
  $('#dots').innerHTML=PANES.length>1?PANES.map(p=>`<i class="${p===id?'on':''}"></i>`).join(''):'';
}
function renderLobby(){
  const d=DATA; if(!d) return;
  $('#hd-date').innerHTML='<b>오늘 · 本日</b>'+dateLabel(d.date);
  // 환영판 — 오늘 체크인 팀
  const w=Array.isArray(d.welcome)?d.welcome:[];
  gridRows($('#w-list'), w, '오늘 도착 예정 팀이 없습니다<br>本日ご到着のチームはありません', t=>t.time?`<i>${esc(t.port||'')} ${esc(t.time)}</i>`:'');
  // 출발 안내 — 오늘 남은 便 + 내일. 오늘 便이 이미 떠났으면(시각 지남) 숨긴다.
  const now=hhmm();
  const deps=(Array.isArray(d.departures)?d.departures:[]).filter(g=>!(g.date===d.today && g.time && g.time<now));
  $('#d-list').innerHTML=deps.length?deps.map(g=>{
    const dl=g.date===d.today?'오늘 · 本日':'내일 · 明日';
    const bus=(g.dispatch||[]).filter(x=>x.depart||x.vehicle);
    const busHTML=bus.length?`<div class="bus"><span class="lb2">호텔 출발 · ホテル出発</span>${bus.map(x=>`<span class="dep">${esc(x.depart||'—')}</span>${x.vehicle?`<span>${esc(x.vehicle)}</span>`:''}${x.dest?`<span class="lb2">→ ${esc(x.dest)}</span>`:''}`).join('')}</div>`
      :`<div class="bus none2">호텔 출발 시각은 프론트에서 안내해 드립니다 · ホテル出発時刻はフロントでご案内します</div>`;
    return `<div class="fl"><div class="fh"><span class="day">${dl} ${mdLabel(g.date)}</span><span class="fno">${esc(g.flight||'—')}</span><span class="ftm">${esc(g.time||'')}</span><span class="frt">${esc([g.from,g.to].filter(Boolean).join(' → '))}</span><span class="fpx">${g.teams_n}팀 · ${g.pax}名</span></div>${busHTML}<div class="tags">${(g.teams||[]).map(t=>`<span>${esc(t.tag||'')}<b>${esc(t.rep||'')}</b></span>`).join('')}</div></div>`;
  }).join(''):'<div class="none">오늘·내일 출발 예정 팀이 없습니다<br>本日・明日ご出発のチームはありません</div>';
  // 석식 요약
  const dn=d.dinner||{};
  const base=(window.SZCore&&SZCore.baseDinner)?SZCore.baseDinner(d.date):'';
  fillVenue('s-', VENUE[dn.venue], [dn.start_time,dn.end_time].filter(Boolean).join(' 〜 '), base, dn.note);
  // 공지
  const nts=Array.isArray(d.notices)?d.notices:[];
  $('#nts').innerHTML=nts.map(n=>`<div class="nt ${n.pinned?'pin':''}"><div class="ttl">${esc(n.title)}</div>${n.body?`<div class="bd">${esc(n.body)}</div>`:''}</div>`).join('');
  $('#tot').innerHTML=`체크인 <b>${d.welcome_teams||0}</b>팀 · 석식 <b>${dn.total||0}</b>명`;
  // 돌릴 화면 — 내용 없는 것은 뺀다
  const list=['p-welcome'];
  // 코스 배정표 — 오늘 아직 나갈 조가 남아 있을 때만(다 나가면 빠진다)
  const cr=COURSE?paintCourse(COURSE):null;
  if(cr&&cr.upcoming) list.push('p-course');
  if(deps.length) list.push('p-depart');
  list.push('p-dsum');
  if(WX) list.push('p-weather');
  if(nts.length) list.push('p-notice');
  const cur=PANES[PI]; PANES=list; PI=Math.max(0,PANES.indexOf(cur));
  showPane(PANES[PI]);
}
function rotate(){ if(SCREEN!=='lobby'||PANES.length<2) return; PI=(PI+1)%PANES.length; showPane(PANES[PI]); }

// ── 직원용: 오늘 운영 현황(숫자판, 일본어 우선) ─────────────────────────────
function tile(cls,lbJa,lbKo,val,sub,tags){
  return `<div class="k ${cls||''}"><div class="lb">${lbJa}<small>${lbKo}</small></div><div class="v">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}${tags&&tags.length?`<div class="tg">${tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}</div>`;
}
function renderOffice(){
  const d=DATA; if(!d) return;
  $('#hd-date').innerHTML='<b>本日 · 오늘</b>'+dateLabel(d.date);
  const ci=d.checkin||{}, co=d.checkout||{}, st=d.staying||{}, un=d.unassigned||{}, kt=d.kitchen||{}, tr=d.transfer||{}, dn=d.dinner||{}, cs=d.course||{};
  const now=hhmm();
  const nextTee=(Array.isArray(cs.tees)?cs.tees:[]).filter(Boolean).sort().find(t=>t>=now)||'';
  const v=VENUE[dn.venue];
  const ciPend=(ci.teams||0)-(ci.arrived||0), coPend=(co.teams||0)-(co.done||0);
  $('#kpi').innerHTML=[
    tile(ci.teams?(ciPend?'warn':'ok'):'', 'チェックイン 到着確認','체크인 도착 확인', `${ci.arrived||0}<small>/ ${ci.teams||0}チーム</small>`, `${ci.pax||0}名 · 未到着 ${ciPend}`, ci.pending_tags),
    tile(co.teams?(coPend?'warn':'ok'):'', 'チェックアウト 完了','체크아웃 완료', `${co.done||0}<small>/ ${co.teams||0}チーム</small>`, `${co.pax||0}名 · 未完了 ${coPend}`, co.pending_tags),
    tile('', '在館','재실(오늘 밤)', `${st.pax||0}<small>名</small>`, `${st.teams||0}チーム`),
    tile((un.n||0)>0?'warn':(ci.teams?'ok':''), '本日到着 部屋未割当','오늘 도착 방 미배정', `${un.n||0}<small>チーム</small>`, (un.n||0)>0?'部屋割当(room)で確認':'', un.tags),
    tile((kt.new||0)>0?'warn':'', '厨房 オーダー','주방 주문', `${kt.new||0}<small>待ち</small>`, `調理中 ${kt.accepted||0} · 完了 ${kt.done||0}`),
    tile(((tr.in_teams||0)>(tr.in_done||0)||(tr.out_teams||0)>(tr.out_done||0))?'warn':(tr.in_teams||tr.out_teams?'ok':''), '送迎 乗車確認','송영 승차 확인', `${tr.in_done||0}<small>/ ${tr.in_teams||0} 到着</small>`, `出発 ${tr.out_done||0} / ${tr.out_teams||0}チーム`),
    tile(v?'':'warn', '夕食','석식', v?`${esc(v.ja)}`:'会場 未設定', `${[dn.start_time,dn.end_time].filter(Boolean).join('〜')||'—'} · ${dn.units||0}チーム ${dn.total||0}名`),
    tile('', 'ゴルフ 組合せ','골프 조편성', `${cs.n||0}<small>組 · ${cs.total||0}名</small>`, nextTee?`▶ 次のスタート ${nextTee}`:(cs.n?'本日のスタート終了':'組合せなし')),
  ].join('');
  $('#tot').innerHTML=`在館 <b>${st.teams||0}</b>チーム · <b>${st.pax||0}</b>名`;
  $('#pg').textContent='';
  showPane('p-office');
}

// ── 코스 입구: 組合せ表(course.html?tv=1 과 같은 표, 로그인 없이) ────────────
const COURSES=[{code:'aso',ko:'아소',ja:'阿蘇'},{code:'sobo',ko:'소보',ja:'祖母'},{code:'kuju',ko:'쿠주',ja:'久住'}];
const CROT={aso:['aso','sobo','kuju'],sobo:['sobo','kuju','aso'],kuju:['kuju','aso','sobo']};   // 27H = 3코스 순환(course.html 과 같다)
const CNAME=Object.fromEntries(COURSES.map(c=>[c.code,c]));
function slotTee(n){ const t=6*60+50+7*((+n||1)-1); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }   // 06:50 부터 7분 간격 = SZCore.teeSlots
// 표를 #crs 에 그리고 {rows,nextRow,now,upcoming} 을 돌려준다 — 코스 화면(단독)과 로비 로테이션이 같이 쓴다
function paintCourse(d){
  const isTomorrow=d.date!==d.today;
  const gs=Array.isArray(d.groups)?d.groups:[];
  const bySlot={}; gs.forEach(g=>{ (bySlot[g.slot]=bySlot[g.slot]||{slot:g.slot,tee:g.tee||slotTee(g.slot),cells:{}}).cells[g.course]=g; });
  let rows=Object.values(bySlot).sort((a,b)=>a.slot-b.slot);
  const now=isTomorrow?'':hhmm();
  const past=r=>!!now && r.tee<now;
  // 줄이 많으면 한 시간 넘게 지난 줄은 치운다(다음 출발이 화면 안에 있게)
  if(rows.length>20 && now){ const cut=(()=>{ const [h,m]=now.split(':').map(Number); const t=h*60+m-60; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(((t%60)+60)%60).padStart(2,'0'); })(); rows=rows.filter(r=>r.tee>=cut); }
  const nextRow=now?rows.find(r=>!past(r)):null;   // 내일 표에는 '다음 출발' 표시가 없다
  const fs=Math.min(3.2,Math.max(1.8,76/((rows.length||1)*2.3)));
  const box=$('#crs');
  if(!rows.length){ box.innerHTML='<div class="none">오늘 조편성이 없습니다<br>本日の組合せはありません</div>'; }
  else{
    box.style.setProperty('--fs',fs.toFixed(2)+'vh');
    box.innerHTML=`<table><thead><tr><th>티오프<span>スタート</span></th>${COURSES.map(c=>`<th>${esc(c.ko)} 출발<span>${esc(c.ja)}スタート · ${CROT[c.code].map(k=>CNAME[k].ko).join('→')}</span></th>`).join('')}</tr></thead><tbody>${
      rows.map(r=>`<tr class="${past(r)?'past':''}${r===nextRow?' next':''}"><td class="tee">${esc(r.tee)}</td>${COURSES.map(c=>{ const g=r.cells[c.code]; if(!g) return '<td></td>';
        return `<td><b>${esc(g.tag||'')}</b>${g.gno?`<i>${g.gno}조·${g.gno}組目</i>`:''}${g.rep?`<span class="nm">${esc(g.rep)}<i>様</i></span>`:''}<span class="pax">${esc(g.pax)}名</span></td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
  }
  return {rows, nextRow, now, upcoming: rows.length>0 && (!now || !!nextRow)};
}
function renderCourse(){
  const d=DATA; if(!d) return;
  const isTomorrow=d.date!==d.today;
  $('#hd-date').innerHTML=(isTomorrow?'<b>내일 · 明日</b>':'<b>오늘 · 本日</b>')+dateLabel(d.date);
  const r=paintCourse(d);
  $('#tot').innerHTML=`<b>${d.n||0}</b>조 · <b>${d.total||0}</b>명 <span style="color:var(--muted)">/ ${d.n||0}組 · ${d.total||0}名</span>`;
  $('#pg').textContent=r.nextRow&&r.now?`▶ ${r.nextRow.tee} 곧 출발 · まもなくスタート`:'';
  showPane('p-course');
}

// ── 날씨(로비) — Open-Meteo, 홈과 같은 좌표. 30분마다 ──
function wmap(c){
  if(c===0) return ['☀️','맑음','晴れ']; if(c===1||c===2) return ['🌤️','대체로 맑음','晴れ時々曇り']; if(c===3) return ['☁️','흐림','曇り'];
  if(c===45||c===48) return ['🌫️','안개','霧']; if(c>=51&&c<=57) return ['🌦️','이슬비','霧雨'];
  if(c>=61&&c<=67) return ['🌧️','비','雨']; if(c>=71&&c<=77) return ['🌨️','눈','雪'];
  if(c>=80&&c<=82) return ['🌧️','소나기','にわか雨']; if(c>=85&&c<=86) return ['🌨️','눈','雪']; if(c>=95) return ['⛈️','뇌우','雷雨'];
  return ['·','',''];
}
async function loadWeather(){
  if(SCREEN!=='lobby') return;
  if(WX && Date.now()-WXAT<30*60*1000) return;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Asia%2FTokyo&forecast_days=2`;
    const r=await fetch(url); const d=await r.json();
    if(!d||!d.hourly) throw new Error('wx');
    WX=d; WXAT=Date.now(); renderWeather(); if(DATA) renderLobby();
  }catch(e){ /* 날씨 실패는 그 화면만 빠진다 */ }
}
function renderWeather(){
  const H=WX.hourly, D=WX.daily||{};
  const j=jst(); const fromKey=ymd(j)+'T'+String(j.getHours()).padStart(2,'0');
  let html='', n=0;
  if(D.time){ html+=`<div class="h day">${D.time.slice(0,2).map((t,i)=>{ const w=wmap(D.weather_code[i]); return `<span class="ds">${i===0?'오늘·今日':'내일·明日'} ${w[0]} ${w[1]}${w[2]?' · '+w[2]:''} <b style="color:#fff">${Math.round(D.temperature_2m_min[i])}° / ${Math.round(D.temperature_2m_max[i])}°</b></span>`; }).join('')}</div>`; }
  for(let i=0;i<H.time.length && n<16;i++){
    if(H.time[i].slice(0,13)<fromKey) continue;
    const hh=parseInt(H.time[i].slice(11,13),10), w=wmap(H.weather_code[i]), pp=H.precipitation_probability?H.precipitation_probability[i]:null; n++;
    html+=`<div class="h ${n===1?'now':''}"><div class="hh">${n===1?'지금·今':hh+'시'}</div><div class="ic">${w[0]}</div><div class="tp">${Math.round(H.temperature_2m[i])}°</div><div class="pp">💧${pp==null?'-':pp+'%'}</div></div>`;
  }
  $('#wx').innerHTML=html;
}
async function keepAwake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }

tick(); setInterval(tick,1000);
load(); setInterval(load,REFRESH*1000); setInterval(flip,12000);
loadWeather(); setInterval(loadWeather,5*60*1000); setInterval(rotate,ROT*1000);
keepAwake(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ keepAwake(); load(); } });
// 화면을 한 번 클릭하면 전체화면(키오스크 설정이 없는 PC 용)
document.addEventListener('click',()=>{ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); }catch(e){} });
</script>
