<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>안내 모니터 · 案内モニター</title>
<!--
  안내 모니터(디지털 사이니지) — 로비·2층 엘리베이터 앞·코스 입구·통로(디지털 월) TV 에 켜 두는 전체화면.
  · 로그인 없음: signage_dinner / signage_lobby / signage_course / signage_office RPC(SQL 134~137·146) 만 부른다 — 오늘·내일만 답하고 방번호·연락처는 안 준다.
  · saizen-ops.js 는 싣지 않는다(상단바·로그인 카드가 화면을 가린다). 공용은 saizen-core.js(순수 규칙)만.
  · ?screen=dinner (2층: 오늘 석식 명단) · ?screen=lobby (로비: 환영판·코스·출발 안내·석식·날씨·공지 로테이션)
  · ?screen=course (코스 입구·클럽하우스: 오늘 스타트표 — 행 양식 = 시간 · 코스 · 그룹코드 · ○○○님 팀 · 스타트 홀 · 카트 · 전기카트 · 식사(Min 2026-10-25). 17시 이후엔 내일)
  · ?screen=wall (통로 65형 디지털 월: 한 화면 고정 분할 — 오늘의 식사 / 스타트표 + 점심 후 재스타트 / 안내·날씨. 로테이션 없음)
  · ?screen=office (사무실·프론트 뒤, 직원용: 오늘 진행 현황 숫자판 — signage_office. 일본어 우선. 이름·방번호·금액 없음)
  · ?date=YYYY-MM-DD (시험용) · ?cut=21 (석식: 이 시각 이후엔 내일 / 코스·월: 17) · ?refresh=60 (초) · ?rot=20 (로비 화면 전환 초) · ?rows=14 (코스 표 한 화면 줄 수)
  · ?scale=1.2 (글자 배율 — 큰 TV·먼 거리면 올린다. 시인성 최우선: 밝은 글자·굵은 서체·줄 수 적게·페이지로 넘김)
  · 공개 제어(SQL 146 signage_release): 담당자가 코스 배정표에서 [손님 화면에 공개]를 누른 최종본만 보인다(released:true). 숨김이면 「준비 중」(released:false). 행이 없으면 실시간(종전).
  · 디자인 원칙(Min 2026-10-25 「깔끔하고 정제된, 모던한 느낌」): 글자 중심 · 여백 넉넉 · 배경 1 + 강조 1 색 · 얇은 구분선 · 장식 아이콘 없음(날씨 기호만 기능용) · 시인성 규칙 유지.
  · 표기 원칙(Min): 손님용 = 한국어 우선 · 한·일 병기. 공개 장소라 방번호·연락처·생년은 어디에도 없다.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/saizen-core.js?v=46"></script>
<style>
  :root{ --bg:#0f1311; --panel:#161c18; --panel2:#1c2420; --line:#293229; --line2:#3b473c; --ink:#f7f9f3; --ink2:#dfe7d8; --muted:#a2b19c;
         --acc:#a9d38f; --acc2:#5f8a4e; --warm:#f1dc9e; --z:1;
         --mono:'SFMono-Regular',Consolas,Menlo,'SZJpMono',monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;cursor:none}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic',system-ui,sans-serif;display:flex;flex-direction:column;padding:2.4vh 3vw;gap:1.8vh;font-variant-numeric:tabular-nums}
  /* 머리 — 얇은 선 하나, 제목·날짜·시계 */
  .hd{display:flex;align-items:baseline;gap:2.2vw;border-bottom:.16vh solid var(--line2);padding-bottom:1.2vh}
  .hd .t{font-size:calc(3.9vh*var(--z));font-weight:800;letter-spacing:.04vw}
  .hd .t small{font-size:calc(2.4vh*var(--z));font-weight:700;color:var(--muted);margin-left:1vw}
  .hd .d{font-size:calc(3.1vh*var(--z));font-weight:700;color:var(--ink2)}
  .hd .d b{color:var(--acc);margin-right:.8vw;font-weight:800}
  .hd .c{margin-left:auto;font-size:calc(4.2vh*var(--z));font-weight:700;font-family:var(--mono);color:var(--ink);letter-spacing:.05vw}
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:1.6vw;align-items:stretch}
  .box{background:var(--panel);border:.12vh solid var(--line);border-radius:1.4vh;padding:2vh 2.2vw}
  .box .lb{font-size:calc(2.2vh*var(--z));font-weight:700;color:var(--muted);letter-spacing:.12vw}
  .venue .ko{font-size:calc(9vh*var(--z));font-weight:800;white-space:nowrap;line-height:1.05;color:var(--ink);margin-top:.8vh;letter-spacing:-.05vw}
  .venue .ja{font-size:calc(4.4vh*var(--z));font-weight:700;color:var(--acc);margin-top:.5vh}
  .venue.unset .ko{font-size:calc(4.8vh*var(--z));color:var(--ink2)}
  .venue.unset .ja{font-size:calc(3vh*var(--z))}
  .time{display:flex;flex-direction:column;justify-content:center}
  .time .tm{font-size:calc(6.4vh*var(--z));font-weight:700;white-space:nowrap;font-family:var(--mono);color:var(--ink);line-height:1.1}
  .time .menu{font-size:calc(3vh*var(--z));font-weight:700;color:var(--muted);margin-top:1vh}
  .time .menu b{color:var(--ink);font-weight:800;display:block;margin-top:.3vh}
  .note{font-size:calc(3vh*var(--z));font-weight:700;color:var(--ink);background:var(--panel2);border-left:.5vw solid var(--acc);padding:1.1vh 1.6vw;border-radius:.9vh}
  .list{flex:1;min-height:0;display:grid;gap:.6vh 1vw;align-content:start;grid-auto-flow:column}
  .row{display:flex;align-items:center;gap:.7vw;background:var(--panel);border:.12vh solid var(--line);border-radius:.9vh;padding:.7vh 1vw;font-size:var(--fs,3vh);white-space:nowrap;overflow:hidden}
  .row .tag{font-family:var(--mono);font-weight:700;color:var(--acc);min-width:5.6em;flex:0 0 auto}
  .row .nm{font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .row .nm i{font-style:normal;font-size:.78em;color:var(--muted);margin-left:.3em;font-weight:700}
  .row .px{margin-left:auto;font-weight:700;color:var(--muted);font-size:.9em;flex:0 0 auto}
  .row .px b{color:var(--ink);font-size:1.15em;font-weight:800}
  .row.k{border-color:var(--acc2)}
  /* 팀별 석식 장소(SQL 145) — 장소 머리줄 + 컨벤션홀 팀은 따뜻한 띠 */
  .row.vh{background:var(--panel2);border-color:var(--line2)} .row.vh .nm{color:var(--acc)} .row.vh .nm i{color:var(--muted)}
  .row.vh.convention .nm{color:var(--warm)}
  .row.vh.none .nm{color:var(--ink2)}
  .row.v-convention{border-left:.5vw solid var(--warm)}
  .ft{display:flex;gap:2vw;align-items:center;font-size:calc(2.1vh*var(--z));font-weight:700;color:var(--muted);border-top:.12vh solid var(--line);padding-top:1vh}
  .ft .tot{color:var(--ink2)}
  .ft .tot b{color:var(--ink);font-size:1.2em;font-weight:800}
  .ft .pg{color:var(--acc)}
  .ft .upd{margin-left:auto;font-family:var(--mono)}
  .ft .upd.err{color:#f2b8ab}
  .none{grid-column:1/-1;text-align:center;color:var(--ink2);font-size:calc(3.6vh*var(--z));padding:8vh 0;font-weight:700}
  /* 준비 중(공개 전) */
  .prep{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:30vh;gap:1.4vh;color:var(--ink2)}
  .prep b{font-size:calc(6.5vh*var(--z));font-weight:800;color:var(--ink);letter-spacing:.1vw}
  .prep small{font-size:calc(2.8vh*var(--z));font-weight:700;color:var(--muted)}
  /* ── 로비 화면(로테이션) ── */
  .pane{flex:1;min-height:0;display:none;flex-direction:column;gap:1.4vh}
  .pane.on{display:flex}
  .dots{display:flex;gap:.8vw;align-items:center}
  .dots i{display:block;width:.9vw;height:.9vw;border-radius:50%;background:var(--line2)}
  .dots i.on{background:var(--acc)}
  .big{font-size:calc(6.6vh*var(--z));font-weight:800;color:var(--ink);line-height:1.15;letter-spacing:-.05vw}
  .big small{display:block;font-size:calc(3vh*var(--z));color:var(--acc);font-weight:700;margin-top:.5vh}
  .fl{background:var(--panel);border:.12vh solid var(--line);border-radius:1.4vh;padding:1.6vh 2vw;display:flex;flex-direction:column;gap:.9vh}
  .fl .fh{display:flex;align-items:baseline;gap:1.4vw;flex-wrap:wrap}
  .fl .fh .day{font-size:calc(2.6vh*var(--z));font-weight:700;color:var(--acc);background:var(--panel2);border-radius:.7vh;padding:.2vh 1vw}
  .fl .fh .fno{font-family:var(--mono);font-size:calc(4.8vh*var(--z));font-weight:700;color:var(--ink)}
  .fl .fh .ftm{font-family:var(--mono);font-size:calc(4.8vh*var(--z));font-weight:700;color:var(--ink)}
  .fl .fh .frt{font-size:calc(3.1vh*var(--z));font-weight:700;color:var(--ink2)}
  .fl .fh .fpx{margin-left:auto;font-size:calc(2.8vh*var(--z));font-weight:700;color:var(--muted)}
  .fl .bus{display:flex;gap:1.2vw;flex-wrap:wrap;align-items:center;font-size:calc(3.2vh*var(--z));font-weight:700;color:var(--ink)}
  .fl .bus .dep{font-family:var(--mono);font-size:calc(5.2vh*var(--z));font-weight:700;color:var(--ink);background:var(--panel2);border:.12vh solid var(--line2);border-radius:.9vh;padding:.2vh 1.2vw}
  .fl .bus .lb2{font-size:calc(2.5vh*var(--z));color:var(--muted)}
  .fl .bus.none2{color:var(--ink2);font-size:calc(2.7vh*var(--z))}
  .fl .tags{display:flex;flex-wrap:wrap;gap:.5vh .7vw}
  .fl .tags span{font-family:var(--mono);font-size:calc(2.7vh*var(--z));font-weight:700;color:var(--acc);background:var(--bg);border:.12vh solid var(--line);border-radius:.7vh;padding:.15vh .8vw}
  .fl .tags span b{font-family:inherit;color:var(--ink2);font-weight:700;margin-left:.4vw}
  .wx{display:grid;grid-template-columns:repeat(8,1fr);gap:.8vw;flex:1;align-content:start}
  .wx .h{background:var(--panel);border:.12vh solid var(--line);border-radius:1.4vh;padding:1.4vh 0;text-align:center}
  .wx .h.now{border-color:var(--acc)}
  .wx .h .hh{font-size:calc(2.8vh*var(--z));font-weight:700;color:var(--muted)}
  .wx .h .ic{font-size:calc(6.5vh*var(--z));line-height:1.3}
  .wx .h .tp{font-size:calc(4.6vh*var(--z));font-weight:800;color:var(--ink)}
  .wx .h .pp{font-size:calc(2.5vh*var(--z));font-weight:700;color:#9fc8ff}
  .wx .h .ds{font-size:calc(2.7vh*var(--z));font-weight:700;color:var(--ink2)}
  .wx .h.day{grid-column:1/-1;display:flex;gap:2vw;align-items:center;justify-content:center;padding:1vh}
  .nts{display:flex;flex-direction:column;gap:1.2vh;flex:1;min-height:0;overflow:hidden}
  .nt{background:var(--panel);border:.12vh solid var(--line);border-radius:1.4vh;padding:1.8vh 2vw}
  .nt.pin{border-left:.5vw solid var(--acc)}
  .nt .ttl{font-size:calc(4vh*var(--z));font-weight:800;color:var(--ink)}
  .nt .bd{font-size:calc(3.1vh*var(--z));font-weight:600;color:var(--ink2);margin-top:.7vh;white-space:pre-wrap;line-height:1.45}
  /* ── 코스 스타트표(행 양식: 시간 · 코스 · 그룹코드 · ○○○님 팀 · 홀 · 카트 · 전기카트 · 식사 · 인원) ── */
  .crs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1.2vh}
  .crs table{width:100%;border-collapse:collapse;table-layout:fixed}
  .crs th{padding:.7vh .8vw;font-size:calc(2.1vh*var(--z));font-weight:700;color:var(--muted);border-bottom:.16vh solid var(--line2);text-align:left;letter-spacing:.08vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crs th span{font-weight:600;margin-left:.4vw;opacity:.8}
  .crs td{padding:.55vh .8vw;font-size:var(--fs,3vh);font-weight:700;border-bottom:.1vh solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;color:var(--ink2)}
  .crs td.tee{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:calc(var(--fs,3vh)*1.05)}
  .crs td.cc{font-weight:800}
  .crs td.cc.aso{color:#b9d7a6} .crs td.cc.sobo{color:#9fc4e2} .crs td.cc.kuju{color:#e6cf93}
  .crs td.tag{font-family:var(--mono);color:var(--acc);font-weight:700}
  .crs td.nm{color:var(--ink);font-weight:800}
  .crs td.nm i{font-style:normal;font-size:.72em;color:var(--muted);margin-left:.3em;font-weight:700}
  .crs td.hl{font-family:var(--mono);color:var(--ink)}
  .crs td.ev b{display:inline-block;font-size:.72em;font-weight:800;color:var(--bg);background:var(--acc);border-radius:.5vh;padding:0 .5vw;line-height:1.5}
  .crs td.lu{color:var(--warm);font-weight:700;font-size:calc(var(--fs,3vh)*.82)}
  .crs td.lu i{font-style:normal;font-size:.75em;color:var(--muted);margin-left:.4em;font-weight:600}
  /* 컴팩트(디지털 월 가운데 칸) — 일본어 부제 숨기고 폭에 맞춘다 */
  .crs.compact th span,.crs.compact td.cc i,.crs.compact td.lu i,.crs.compact td.nm i{display:none}
  .crs.compact th,.crs.compact td{padding-left:.5vw;padding-right:.5vw}
  .crs.compact td.tee{font-size:var(--fs,3vh)}
  .crs td.px{text-align:right;color:var(--muted)}
  .crs td.px b{color:var(--ink);font-weight:800}
  .crs tr.past td{opacity:.42}
  .crs tr.next td{background:var(--panel2)}
  .crs tr.next td.tee{box-shadow:inset .45vw 0 0 var(--acc)}
  .crs .pmt{flex:0 0 auto;background:var(--panel);border:.12vh solid var(--line);border-radius:1.2vh;padding:1.2vh 1.4vw}
  .crs .pmt h3{font-size:calc(2.3vh*var(--z));font-weight:700;color:var(--muted);letter-spacing:.1vw;margin-bottom:.5vh}
  .crs .pmt table td{font-size:calc(2.9vh*var(--z));border-bottom:0;padding:.3vh .8vw}
  .crs.compact .pmt table td{font-size:calc(2.3vh*var(--z))}
  .crs.compact .pmt h3{font-size:calc(2vh*var(--z))}
  /* ── 직원용 운영 현황 ── */
  .kpi{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:1.1vw}
  .kp{background:var(--panel);border:.12vh solid var(--line);border-radius:1.4vh;padding:1.4vh 1.4vw;display:flex;flex-direction:column;gap:.4vh;overflow:hidden}
  .kp.warn{border-color:#b7584a;background:#231715}
  .kp.ok{border-color:var(--acc2)}
  .kp .lb{font-size:2.4vh;font-weight:800;color:var(--ink)}
  .kp .lb small{display:block;font-size:1.7vh;color:var(--muted);font-weight:700}
  .kp .v{font-size:6.2vh;font-weight:800;color:var(--ink);font-family:var(--mono);line-height:1.05}
  .kp .v small{font-size:2.6vh;color:var(--muted);font-family:var(--mono);margin-left:.3vw}
  .kp.warn .v{color:#f2b8ab}
  .kp .sub{font-size:2vh;font-weight:700;color:var(--ink2)}
  .kp .tg{display:flex;flex-wrap:wrap;gap:.4vh .5vw;overflow:hidden;align-content:flex-start}
  .kp .tg span{font-family:var(--mono);font-size:1.75vh;font-weight:700;color:var(--acc);background:var(--bg);border:.12vh solid var(--line);border-radius:.5vh;padding:.1vh .6vw}
  /* ── 디지털 월(통로 65형) — 한 화면 고정 분할 ── */
  .wall{flex:1;min-height:0;display:grid;grid-template-columns:1fr 2.5fr 1fr;gap:1.6vw}
  .wcol{min-height:0;display:flex;flex-direction:column;gap:1.2vh;overflow:hidden}
  .wcol h3{font-size:calc(2.3vh*var(--z));font-weight:700;color:var(--muted);letter-spacing:.14vw;padding-bottom:.6vh;border-bottom:.12vh solid var(--line2)}
  .wcol h3 small{font-weight:600;margin-left:.6vw;opacity:.8}
  .meal{background:var(--panel);border:.12vh solid var(--line);border-radius:1.4vh;padding:1.6vh 1.8vw;display:flex;flex-direction:column;gap:.5vh}
  .meal .k{font-size:calc(2.3vh*var(--z));font-weight:700;color:var(--muted)}
  .meal .v{font-size:calc(3.9vh*var(--z));font-weight:800;color:var(--ink);line-height:1.15;word-break:keep-all}
  .meal .v small{display:block;font-size:.55em;color:var(--acc);font-weight:700;margin-top:.2vh}
  .meal .s{font-size:calc(2.5vh*var(--z));font-weight:700;color:var(--ink2);word-break:keep-all}
  .meal .s b{color:var(--ink)}
  .meal.dn{border-left:.5vw solid var(--acc)}
  .wxs{display:grid;grid-template-columns:repeat(4,1fr);gap:.6vw}
  .wxs .h{padding:1vh 0;background:var(--panel);border:.12vh solid var(--line);border-radius:1.2vh;text-align:center}
  .wxs .h .hh{font-size:calc(2vh*var(--z));color:var(--muted);font-weight:700}
  .wxs .h .ic{font-size:calc(4.2vh*var(--z));line-height:1.3}
  .wxs .h .tp{font-size:calc(3.2vh*var(--z));font-weight:800;color:var(--ink)}
  .wxs .h.now{border-color:var(--acc)}
  .wxd{display:flex;gap:1vw;font-size:calc(2.5vh*var(--z));font-weight:700;color:var(--ink2)}
  .wxd span{flex:1;background:var(--panel);border:.12vh solid var(--line);border-radius:1.2vh;padding:1vh 1vw;text-align:center}
  .wxd b{color:var(--ink);display:block;font-size:1.25em}
  .wcol .nts{gap:1vh;flex:1 1 auto} .wcol .nt{padding:1.3vh 1.4vw} .wcol .nt .ttl{font-size:calc(3vh*var(--z));word-break:keep-all} .wcol .nt .bd{font-size:calc(2.4vh*var(--z));word-break:keep-all;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .wcol #w-wx{flex:0 0 auto}
  .wcol .none{padding:4vh 0;font-size:calc(2.8vh*var(--z))}
</style>
</head>
<body>
  <div class="hd">
    <div class="t" id="hd-title">석식 안내<small>夕食のご案内</small></div>
    <div class="d" id="hd-date"></div>
    <div class="c" id="clock">--:--</div>
  </div>

  <!-- ── 2층: 석식 명단 ── -->
  <div class="pane" id="p-dinner">
    <div class="hero">
      <div class="box venue unset" id="v-venue">
        <div class="lb">석식 장소 · 夕食会場</div>
        <div class="ko" id="v-ko">준비 중</div>
        <div class="ja" id="v-ja">準備中</div>
      </div>
      <div class="box time">
        <div class="lb">시간 · 時間</div>
        <div class="tm" id="v-time">—</div>
        <div class="menu" id="v-menu"></div>
      </div>
    </div>
    <div class="note" id="v-note" hidden></div>
    <div class="list" id="list"><div class="none">불러오는 중… / 読み込み中…</div></div>
  </div>

  <!-- ── 로비: 환영판 ── -->
  <div class="pane" id="p-welcome">
    <div class="big">어서 오세요<small>ようこそ 阿蘇やまなみリゾートへ</small></div>
    <div class="list" id="w-list"></div>
  </div>
  <!-- ── 로비: 출발 안내 ── -->
  <div class="pane" id="p-depart"><div id="d-list" style="display:flex;flex-direction:column;gap:1.2vh;flex:1;min-height:0;overflow:hidden"></div></div>
  <!-- ── 로비: 석식 요약 ── -->
  <div class="pane" id="p-dsum">
    <div class="hero">
      <div class="box venue unset" id="s-venue"><div class="lb">석식 장소 · 夕食会場</div><div class="ko" id="s-ko"></div><div class="ja" id="s-ja"></div></div>
      <div class="box time"><div class="lb">시간 · 時間</div><div class="tm" id="s-time">—</div><div class="menu" id="s-menu"></div></div>
    </div>

    <div class="box" style="font-size:2.8vh;font-weight:700;color:var(--ink2)">팀별 명단은 2층 레스토랑 앞 모니터에서 확인해 주세요<br><span style="color:var(--muted)">チーム別のご案内は2階レストラン前のモニターをご覧ください</span></div>
  </div>
  <!-- ── 로비: 날씨 ── -->
  <div class="pane" id="p-weather"><div class="wx" id="wx"></div></div>
  <!-- ── 로비: 공지 ── -->
  <div class="pane" id="p-notice"><div class="nts" id="nts"></div></div>
  <!-- ── 직원용: 운영 현황 ── -->
  <div class="pane" id="p-office"><div class="kpi" id="kpi"><div class="none">読み込み中… / 불러오는 중…</div></div></div>
  <!-- ── 코스 입구: 스타트표 ── -->
  <div class="pane" id="p-course"><div class="crs" id="crs"><div class="none">불러오는 중… / 読み込み中…</div></div></div>
  <!-- ── 디지털 월: 식사 / 스타트표·재스타트 / 안내·날씨 ── -->
  <div class="pane" id="p-wall">
    <div class="wall">
      <div class="wcol"><h3>오늘의 식사<small>本日のお食事</small></h3><div id="w-meals"></div></div>
      <div class="wcol"><h3 id="w-ctitle">오늘의 라운딩<small>本日のスタート</small></h3><div class="crs compact" id="w-crs"><div class="none">불러오는 중… / 読み込み中…</div></div></div>
      <div class="wcol"><h3>안내<small>お知らせ</small></h3><div class="nts" id="w-nts"></div><div id="w-wx"></div></div>
    </div>
  </div>

  <div class="ft">
    <div class="tot" id="tot"></div>
    <div class="pg" id="pg"></div>
    <div class="dots" id="dots"></div>
    <div class="upd" id="upd"></div>
  </div>
<script>
const $=s=>document.querySelector(s);
const Q=new URLSearchParams(location.search);
const SCREEN=['lobby','course','office','wall'].includes(Q.get('screen'))?Q.get('screen'):'dinner';
const _cut=parseInt(Q.get('cut'),10); const CUT_H=isNaN(_cut)?((SCREEN==='course'||SCREEN==='wall')?17:21):Math.max(0,Math.min(23,_cut));   // 이 시각(JST) 이후엔 내일(석식 21시 · 코스/월 17시)
const REFRESH=Math.max(15,parseInt(Q.get('refresh')||(SCREEN==='office'?'30':'60'),10)||60);   // 직원 화면은 30초
const ROT=Math.max(8,parseInt(Q.get('rot')||'20',10)||20);   // 로비 화면 전환(초)
const SCALE=Math.max(.6,Math.min(1.6,parseFloat(Q.get('scale'))||1));   // ?scale=1.2 = 현장 글자 배율(모니터 크기·거리에 맞춰)
document.documentElement.style.setProperty('--z',String(SCALE));
const ROWS_PER_COL=12;   // 명단 한 열 줄 수 · 최대 4열(더 좁히면 이름이 잘린다) — 시인성 최우선(Min 2026-09)
const MAX_COLS=4;
const PAGE_ROWS=48;      // 석식 명단 한 화면 최대 줄(4열×12) — 넘으면 12초마다 넘김
const COURSE_ROWS=Math.max(6,Math.min(30,parseInt(Q.get('rows'),10)||(SCREEN==='wall'?16:14)));   // 코스 표 한 화면 줄 수 — 넘으면 다음 출발 2줄 앞부터 잘라 12초마다 넘김(글자를 줄이지 않는다)
const SB_URL=localStorage.getItem('saizen_sb_url')||'https://wzfmloivrolpwpiuyhbs.supabase.co';
const SB_KEY=localStorage.getItem('saizen_sb_key')||'sb_publishable_W76Uh3D9gRPjPoxHwl-LYw_dR9BIj6L';   // publishable(공개용) — saizen-ops.js 기본값과 같다
const VENUE={restaurant:{ko:'레스토랑',ja:'レストラン'},convention:{ko:'컨벤션홀',ja:'コンベンションホール'}};
const WD_KO=['일','월','화','수','목','금','토'], WD_JA=['日','月','火','水','木','金','土'];
const LAT=32.95, LON=131.12;   // 홈 날씨와 같은 좌표(아소 야마나미 리조트 인근)
let supa=null, DATA=null, PAGE=0, PAGES=1, LASTOK='', WX=null, WXAT=0;
let COURSE=null;   // 로비·월: 코스 스타트표(signage_course)도 같이 돌린다 — 아침 로비 문의 감소(Min)
let PANES=[], PI=0;   // 로비: 지금 돌릴 화면 목록·현재 인덱스

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jst(){ const n=new Date(); return new Date(n.getTime()+(n.getTimezoneOffset()+540)*60000); }   // 모니터 PC 시간대와 무관하게 JST
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hhmm(){ const n=jst(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
// 표시 날짜: ?date 우선, 없으면 오늘 — CUT_H 이후엔 내일(저녁이 끝난 뒤 내일 것을 미리). 로비·직원·월(식사·안내)은 항상 오늘.
function targetDate(){
  const f=Q.get('date'); if(f&&/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const n=jst(); if(SCREEN!=='lobby' && SCREEN!=='office' && SCREEN!=='wall' && n.getHours()>=CUT_H){ n.setDate(n.getDate()+1); }
  return ymd(n);
}
// 월 화면의 스타트표 날짜 — 17시 이후엔 내일(저녁에 지나가며 내일 티오프를 본다)
function courseDate(){
  const f=Q.get('date'); if(f&&/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const n=jst(); if(n.getHours()>=CUT_H){ n.setDate(n.getDate()+1); } return ymd(n);
}
function dateLabel(iso){ const d=new Date(iso+'T00:00:00'); const m=d.getMonth()+1, day=d.getDate(), w=d.getDay();
  return `${m}월 ${day}일 (${WD_KO[w]}) <small style="font-size:.75em;color:var(--muted)">${m}月${day}日(${WD_JA[w]})</small>`; }
function mdLabel(iso){ const d=new Date(iso+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()} (${WD_KO[d.getDay()]}·${WD_JA[d.getDay()]})`; }
function tick(){ $('#clock').textContent=hhmm(); }
function setUpd(ok){ const e=$('#upd'); if(ok){ LASTOK=hhmm(); e.className='upd'; e.textContent=LASTOK+' 갱신'; }
  else { e.className='upd err'; e.textContent='갱신 실패 '+hhmm()+(LASTOK?' · 마지막 '+LASTOK:''); } }

async function load(){
  const date=targetDate();
  try{
    if(!supa) supa=window.supabase.createClient(SB_URL,SB_KEY);
    const rpcName={lobby:'signage_lobby',wall:'signage_lobby',course:'signage_course',office:'signage_office'}[SCREEN]||'signage_dinner';
    const {data,error}=await supa.rpc(rpcName,{p_date:date});
    if(error) throw error;
    if(!data||data.ok===false) throw new Error((data&&data.reason)||'no data');
    if(SCREEN==='lobby'||SCREEN==='wall'){   // 코스 표는 실패해도 로비·월은 돈다
      try{ const c=await supa.rpc('signage_course',{p_date:SCREEN==='wall'?courseDate():date}); COURSE=(c.data&&c.data.ok!==false)?c.data:null; }catch(e){ COURSE=null; } }
    DATA=data; PAGE=0; setUpd(true);
    if(SCREEN==='lobby') renderLobby(); else if(SCREEN==='wall') renderWall(); else if(SCREEN==='course') renderCourse(); else if(SCREEN==='office') renderOffice(); else render();
  }catch(e){
    setUpd(false);
    if(!DATA){ const el=$({lobby:'#w-list',wall:'#w-crs',course:'#crs',office:'#kpi'}[SCREEN]||'#list'); el.innerHTML='<div class="none">데이터를 불러오지 못했습니다<br>データを取得できませんでした</div>'; if(SCREEN==='lobby'){ showPane('p-welcome'); } if(SCREEN==='wall'){ showPane('p-wall'); } }
  }
}

// ── 2층: 석식 명단 ──────────────────────────────────────────────────────
function fillVenue(pre, v, tm, base, note){
  const vb=$('#'+pre+'venue'); vb.classList.toggle('unset',!v);
  $('#'+pre+'ko').textContent=v?v.ko:'장소는 프론트에 문의해 주세요';
  $('#'+pre+'ja').textContent=v?v.ja:'会場はフロントへお尋ねください';
  $('#'+pre+'time').textContent=tm||'—';
  $('#'+pre+'menu').innerHTML=base?`오늘의 기본 석식 · 本日の基本夕食<b>${esc(base)}</b>`:'';
  const nt=$('#'+pre+'note'); if(note){ nt.hidden=false; nt.textContent=note; } else nt.hidden=true;
}
function render(){
  const d=DATA; if(!d) return;
  const isTomorrow=d.date!==d.today;
  $('#hd-date').innerHTML=(isTomorrow?'<b>내일 · 明日</b>':'<b>오늘 · 本日</b>')+dateLabel(d.date);
  const base=(window.SZCore&&SZCore.baseDinner)?SZCore.baseDinner(d.date):'';
  const teams=Array.isArray(d.teams)?d.teams:[];
  // 팀별 장소(SQL 145): 장소가 갈리는 날은 레스토랑 → 컨벤션홀 → 미정 순으로 머리줄을 넣어 나눈다
  const vOf=t=>t.venue||d.venue||'';
  const sumPax=v=>teams.filter(t=>vOf(t)===v).reduce((s,t)=>s+(Number(t.pax)||0),0);
  const nR=teams.filter(t=>vOf(t)==='restaurant').length, nC=teams.filter(t=>vOf(t)==='convention').length, nN=teams.length-nR-nC;
  const split=(nR>0&&nC>0)||(nN>0&&(nR>0||nC>0));
  if(split){
    fillVenue('v-', {ko:[nR?VENUE.restaurant.ko:'',nC?VENUE.convention.ko:''].filter(Boolean).join(' · '), ja:[nR?VENUE.restaurant.ja:'',nC?VENUE.convention.ja:''].filter(Boolean).join(' ／ ')},
      [d.start_time,d.end_time].filter(Boolean).join(' 〜 '), base, d.note||'장소는 팀마다 다릅니다 · 명단의 구분을 확인해 주세요 ／ 会場はチームごとに異なります・名簿の区分をご確認ください');
  } else {
    fillVenue('v-', VENUE[d.venue], [d.start_time,d.end_time].filter(Boolean).join(' 〜 '), base, d.note);
  }
  let rows=teams;
  if(split){
    rows=[];
    [['restaurant',nR],['convention',nC],['',nN]].forEach(([v,n])=>{ if(!n) return;
      const grp=teams.filter(t=>vOf(t)===v);
      rows.push({hdr:v, n:grp.length, pax:grp.reduce((s,t)=>s+(Number(t.pax)||0),0)});
      grp.forEach(t=>rows.push({...t,_v:v}));
    });
  }
  PAGES=Math.max(1,Math.ceil(rows.length/PAGE_ROWS));
  const slice=rows.slice(PAGE*PAGE_ROWS,(PAGE+1)*PAGE_ROWS);
  gridRows($('#list'), slice, '오늘 석식 명단이 없습니다<br>本日の夕食予約はありません');
  $('#tot').innerHTML=`<b>${d.units||0}</b>팀 · <b>${d.total||0}</b>명 <span style="color:var(--muted)">/ ${d.units||0}チーム · ${d.total||0}名</span>`
    +(split?` <span style="color:var(--muted)">· ${VENUE.restaurant.ko} <b>${sumPax('restaurant')}</b> · ${VENUE.convention.ko} <b>${sumPax('convention')}</b></span>`:'');
  $('#pg').textContent=PAGES>1?`${PAGE+1} / ${PAGES}`:'';
  showPane('p-dinner');
}
// 태그·대표·인원 줄을 한 화면에 — 열 수=12줄/열 기준(최대 4열), 열이 늘수록 글자 축소
function gridRows(list, rows, emptyMsg, extra){
  if(!rows.length){ list.style.cssText=''; list.innerHTML=`<div class="none">${emptyMsg}</div>`; return; }
  const n=rows.length, cols=n<=5?1:Math.min(MAX_COLS,Math.max(2,Math.ceil(n/ROWS_PER_COL))), r=Math.ceil(n/cols);
  const fs=([0,3.8,3.5,3.2,2.9][cols]||2.9)*SCALE;
  list.style.cssText=`grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${r},auto);--fs:${fs.toFixed(2)}vh`;
  list.innerHTML=rows.map(t=>{
    if(t.hdr!==undefined){   // 장소 머리줄(팀별 석식 장소, SQL 145)
      const v=VENUE[t.hdr];
      return `<div class="row vh ${t.hdr||'none'}"><span class="nm">${v?`${esc(v.ko)} <i>${esc(v.ja)}</i>`:'장소 미정 <i>会場未定</i>'}</span><span class="px"><b>${t.n}</b>팀 · <b>${t.pax}</b>名</span></div>`; }
    return `<div class="row ${t.accom==='쿠주힐즈'?'k':''}${t._v?' v-'+t._v:''}"><span class="tag">${esc(t.tag||'')}</span><span class="nm">${esc(t.rep||'')}<i>様</i>${t.teams>1?`<i>+${t.teams-1}</i>`:''}${extra?extra(t):''}</span><span class="px"><b>${esc(t.pax)}</b>名</span></div>`;
  }).join('');
}
function flip(){
  if(PAGES<=1) return;
  if(SCREEN==='dinner'){ PAGE=(PAGE+1)%PAGES; render(); }
  else if(SCREEN==='course'){ PAGE=(PAGE+1)%PAGES; renderCourse(); }
  else if(SCREEN==='wall'){ PAGE=(PAGE+1)%PAGES; renderWall(); }
}

// ── 로비: 화면 로테이션 ─────────────────────────────────────────────────
const TITLES={ 'p-office':['本日の運営状況','오늘 운영 현황'], 'p-course':['오늘의 라운딩','本日のスタート時刻'], 'p-welcome':['환영합니다','ようこそ'], 'p-depart':['출발 안내','ご出発のご案内'], 'p-dsum':['석식 안내','夕食のご案内'], 'p-weather':['날씨','天気'], 'p-notice':['안내','お知らせ'], 'p-wall':['오늘의 안내','本日のご案内'] };
function showPane(id){
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===id));
  const t=TITLES[id]; if(t) $('#hd-title').innerHTML=`${esc(t[0])}<small>${esc(t[1])}</small>`;
  $('#dots').innerHTML=PANES.length>1?PANES.map(p=>`<i class="${p===id?'on':''}"></i>`).join(''):'';
}
function renderLobby(){
  const d=DATA; if(!d) return;
  $('#hd-date').innerHTML='<b>오늘 · 本日</b>'+dateLabel(d.date);
  // 환영판 — 오늘 체크인 팀
  const w=Array.isArray(d.welcome)?d.welcome:[];
  gridRows($('#w-list'), w, '오늘 도착 예정 팀이 없습니다<br>本日ご到着のチームはありません', t=>t.time?`<i>${esc(t.port||'')} ${esc(t.time)}</i>`:'');
  // 출발 안내 — 오늘 남은 便 + 내일. 오늘 便이 이미 떠났으면(시각 지남) 숨긴다.
  const now=hhmm();
  const deps=(Array.isArray(d.departures)?d.departures:[]).filter(g=>!(g.date===d.today && g.time && g.time<now));
  $('#d-list').innerHTML=deps.length?deps.map(g=>{
    const dl=g.date===d.today?'오늘 · 本日':'내일 · 明日';
    const bus=(g.dispatch||[]).filter(x=>x.depart||x.vehicle);
    const busHTML=bus.length?`<div class="bus"><span class="lb2">호텔 출발 · ホテル出発</span>${bus.map(x=>`<span class="dep">${esc(x.depart||'—')}</span>${x.vehicle?`<span>${esc(x.vehicle)}</span>`:''}${x.dest?`<span class="lb2">→ ${esc(x.dest)}</span>`:''}`).join('')}</div>`
      :`<div class="bus none2">호텔 출발 시각은 프론트에서 안내해 드립니다 · ホテル出発時刻はフロントでご案内します</div>`;
    return `<div class="fl"><div class="fh"><span class="day">${dl} ${mdLabel(g.date)}</span><span class="fno">${esc(g.flight||'—')}</span><span class="ftm">${esc(g.time||'')}</span><span class="frt">${esc([g.from,g.to].filter(Boolean).join(' → '))}</span><span class="fpx">${g.teams_n}팀 · ${g.pax}名</span></div>${busHTML}<div class="tags">${(g.teams||[]).map(t=>`<span>${esc(t.tag||'')}<b>${esc(t.rep||'')}</b></span>`).join('')}</div></div>`;
  }).join(''):'<div class="none">오늘·내일 출발 예정 팀이 없습니다<br>本日・明日ご出発のチームはありません</div>';
  // 석식 요약
  const dn=d.dinner||{};
  const base=(window.SZCore&&SZCore.baseDinner)?SZCore.baseDinner(d.date):'';
  fillVenue('s-', VENUE[dn.venue], [dn.start_time,dn.end_time].filter(Boolean).join(' 〜 '), base, dn.note);
  // 장소가 갈리는 날(by_venue, SQL 145)은 두 장소를 함께 — 팀별 구분은 2층 모니터
  { const bv=dn.by_venue||null; const r=bv&&bv.restaurant?(Number(bv.restaurant.units)||0):0, c=bv&&bv.convention?(Number(bv.convention.units)||0):0;
    if(r>0&&c>0){ $('#s-ko').textContent=`${VENUE.restaurant.ko} · ${VENUE.convention.ko}`; $('#s-ja').textContent=`${VENUE.restaurant.ja} ／ ${VENUE.convention.ja}`; $('#s-venue').classList.remove('unset');
      const nt=$('#s-note'); if(nt.hidden){ nt.hidden=false; nt.textContent=`${VENUE.restaurant.ko} ${bv.restaurant.pax}명 · ${VENUE.convention.ko} ${bv.convention.pax}명 ／ 会場はチームごとに異なります`; } } }
  // 공지
  const nts=Array.isArray(d.notices)?d.notices:[];
  $('#nts').innerHTML=nts.map(n=>`<div class="nt ${n.pinned?'pin':''}"><div class="ttl">${esc(n.title)}</div>${n.body?`<div class="bd">${esc(n.body)}</div>`:''}</div>`).join('');
  $('#tot').innerHTML=`체크인 <b>${d.welcome_teams||0}</b>팀 · 석식 <b>${dn.total||0}</b>명`;
  // 돌릴 화면 — 내용 없는 것은 뺀다
  const list=['p-welcome'];
  // 코스 스타트표 — 공개돼 있고 오늘 아직 나갈 조가 남아 있을 때만(다 나가면 빠진다)
  const cr=COURSE?paintCourse(COURSE,$('#crs')):null;
  if(cr&&cr.upcoming) list.push('p-course');
  if(deps.length) list.push('p-depart');
  list.push('p-dsum');
  if(WX) list.push('p-weather');
  if(nts.length) list.push('p-notice');
  const cur=PANES[PI]; PANES=list; PI=Math.max(0,PANES.indexOf(cur));
  showPane(PANES[PI]);
}

// ── 코스 스타트표(손님용, 로그인 없이) ─────────────────────────────────────
//  행 양식(Min 2026-10-25): 시간 · 코스 · 그룹코드 · ○○○님 팀 · 스타트 홀 · 카트 번호 · 전기카트 · 식사 · 인원.
//  홀·카트·전기카트·식사 열은 RPC 가 그 값을 줄 때만(SQL 146 적용 후) 나타난다 — 없으면 종전처럼 시간·코드·팀·인원.
const COURSES=[{code:'aso',ko:'아소',ja:'阿蘇'},{code:'sobo',ko:'소보',ja:'祖母'},{code:'kuju',ko:'쿠주',ja:'久住'}];
const CORDER={aso:0,sobo:1,kuju:2};
const CNAME=Object.fromEntries(COURSES.map(c=>[c.code,c]));
function slotTee(n){ const t=6*60+50+7*((+n||1)-1); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }   // 06:50 부터 7분 간격 = SZCore.teeSlots
function teamLabel(g){   // 손님용 = 한국어 우선(「○○○님 팀」) · 당일 손님(일본인)은 「○○様チーム」
  const rep=esc(g.rep||''); if(!rep) return `<span class="nm">${esc(g.tag||'')}</span>`;
  return g.walkin ? `${rep}<i>様チーム</i>` : `${rep}<i>님 팀</i>`;
}
function lunchLabel(n){ return n===9?'9H 뒤 식사<i>9H後 昼食</i>':n===18?'18H 뒤 식사<i>18H後 昼食</i>':''; }
// 표를 box 에 그리고 {rows,nextRow,now,upcoming} 을 돌려준다 — 코스 화면(단독)·로비 로테이션·디지털 월이 같이 쓴다
function paintCourse(d, box){
  box=box||$('#crs');
  const isTomorrow=d.date!==d.today;
  // 공개 제어(SQL 146): 담당자가 숨겼으면 「준비 중」만
  if(d.released===false){
    box.innerHTML=`<div class="prep"><b>준비 중</b><small>準備中 — スタッフが確定後に表示されます</small><small>스타트표가 확정되면 표시됩니다</small></div>`;
    PAGES=1; return {rows:[], nextRow:null, now:'', upcoming:false, hidden:true};
  }
  const gs=(Array.isArray(d.groups)?d.groups:[]).map(g=>({...g, tee:g.tee||slotTee(g.slot)}));
  const sg=!!d.shotgun && !!d.shotgun_time;
  // 정렬 — 시간 → 코스(아소·소보·쿠주) → 홀. 샷건 날은 전 조 같은 시각이라 코스 → 홀.
  gs.sort((a,b)=>(sg?0:String(a.tee).localeCompare(String(b.tee)))||((CORDER[a.course]??9)-(CORDER[b.course]??9))||((a.hole||0)-(b.hole||0))||((a.slot||0)-(b.slot||0)));
  const HAS={hole:gs.some(g=>g.hole!=null), cart:gs.some(g=>g.cart!=null&&g.cart!==''), ev:gs.some(g=>g.ev!=null), lunch:gs.some(g=>g.lunch!=null)};
  let rows=gs;
  const compact=box.classList.contains('compact');
  // 점심 후 재스타트(담당자 지정 조만, 1단계 pm_tee) — 표 아래 작은 표(최대 5줄, 넘치면 「외 N조」). 그만큼 본표 줄 수를 줄인다.
  const pmAll=gs.filter(g=>g.pm_tee).sort((a,b)=>String(a.pm_tee).localeCompare(String(b.pm_tee)));
  const pm=pmAll.slice(0,5), pmMore=pmAll.length-pm.length;
  const ROWS=Math.max(6, COURSE_ROWS-(pm.length?pm.length+(pmMore?2:1)+(compact?1:0):0));
  const now=isTomorrow?'':hhmm();
  const teeOf=g=>sg?(d.shotgun_time||g.tee):g.tee;
  const past=g=>!!now && teeOf(g)<now;
  // 줄이 많으면 한 시간 넘게 지난 줄은 치운다(다음 출발이 화면 안에 있게)
  if(rows.length>ROWS && now){ const cut=(()=>{ const [h,m]=now.split(':').map(Number); const t=h*60+m-60; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(((t%60)+60)%60).padStart(2,'0'); })(); rows=rows.filter(g=>teeOf(g)>=cut); }
  const nextRow=now?rows.find(g=>!past(g)):null;   // 내일 표에는 '다음 출발' 표시가 없다
  const nextTee=nextRow?teeOf(nextRow):'';
  const allRows=rows;
  // 한 화면 COURSE_ROWS 줄 — 넘으면 다음 출발 2줄 앞부터 잘라 페이지로(글자를 줄이지 않는다)
  if(rows.length>ROWS){
    const ni=nextRow?rows.indexOf(nextRow):0; const start=Math.max(0,ni-2);
    const tail=rows.slice(start); PAGES=Math.max(1,Math.ceil(tail.length/ROWS)); const pg=Math.min(PAGE,PAGES-1);
    rows=tail.slice(pg*ROWS,(pg+1)*ROWS);
  } else PAGES=1;
  // 줄 높이 ≈ fs×1.35 + 1.4vh(여백·선) → 표 영역(72vh − 재스타트 표)에 rows 줄이 딱 들어가는 fs.
  //  컴팩트(월 가운데 칸)는 폭이 좁으니 상한을 낮춘다(글자를 키워 잘리는 것보다 작아도 전부 보이는 쪽).
  const avail=(compact?68:72)-(pm.length?(pm.length+(pmMore?1:0))*3.2+6:0);
  const fs=Math.min(compact?2.55:3.6,Math.max(1.9,((avail/(Math.max(rows.length,8)))-1.4)/1.35))*SCALE;
  if(!gs.length){ box.innerHTML='<div class="none">오늘 조편성이 없습니다<br>本日の組合せはありません</div>'; PAGES=1; return {rows:[], nextRow:null, now, upcoming:false}; }
  box.style.setProperty('--fs',fs.toFixed(2)+'vh');
  const th=(ko,ja,w)=>`<th${w?` style="width:${w}"`:''}>${ko}<span>${ja}</span></th>`;
  const W=compact?{tee:'13%',cc:'9%',tag:'14%',hl:'8%',cart:'8%',ev:'8%',lu:'16%',px:'8%'}:{tee:'11%',cc:'9%',tag:'12%',hl:'7%',cart:'9%',ev:'8%',lu:'17%',px:'7%'};
  box.innerHTML=`<table><thead><tr>${th(sg?'출발':'시간','スタート',W.tee)}${th('코스','コース',W.cc)}${th('코드','コード',W.tag)}${th('팀','チーム','')}`
    +`${HAS.hole?th('홀','ホール',W.hl):''}${HAS.cart?th('카트','カート',W.cart):''}${HAS.ev?th('전동','電動',W.ev):''}${HAS.lunch?th('식사','昼食',W.lu):''}${th('인원','名',W.px)}</tr></thead><tbody>${
    rows.map(g=>{ const c=CNAME[g.course]||{ko:g.course||'',ja:''};
      return `<tr class="${past(g)?'past':''}${g===nextRow?' next':''}"><td class="tee">${esc(teeOf(g))}</td><td class="cc ${esc(g.course||'')}">${esc(c.ko)}<i style="font-style:normal;font-size:.7em;color:var(--muted);margin-left:.3vw">${esc(c.ja)}</i></td>`
        +`<td class="tag">${esc(g.tag||'')}</td><td class="nm">${teamLabel(g)}${g.gno?`<i>${g.gno}조·${g.gno}組</i>`:''}</td>`
        +`${HAS.hole?`<td class="hl">${g.hole?'H'+esc(g.hole):''}</td>`:''}${HAS.cart?`<td class="hl">${esc(g.cart||'')}</td>`:''}${HAS.ev?`<td class="ev">${g.ev?'<b>EV</b>':''}</td>`:''}${HAS.lunch?`<td class="lu">${lunchLabel(g.lunch)}</td>`:''}`
        +`<td class="px"><b>${esc(g.pax)}</b>名</td></tr>`; }).join('')}</tbody></table>`
    +(pm.length?`<div class="pmt"><h3>점심 후 재스타트 <span style="font-weight:600;opacity:.8">昼食後 再スタート</span></h3><table><tbody>${pm.map(g=>{ const c=CNAME[g.pm_course]||{ko:'',ja:''};
        return `<tr><td class="tee" style="width:${compact?'16%':'12%'}">${esc(g.pm_tee)}</td><td class="cc ${esc(g.pm_course||'')}" style="width:12%">${esc(c.ko)}</td><td class="tag" style="width:16%">${esc(g.tag||'')}</td><td class="nm">${teamLabel(g)}</td><td class="px" style="width:10%"><b>${esc(g.pax)}</b>名</td></tr>`; }).join('')}${pmMore?`<tr><td colspan="5" style="color:var(--muted)">외 ${pmMore}조 · 他${pmMore}組</td></tr>`:''}</tbody></table></div>`:'');
  return {rows, nextRow, nextTee, now, upcoming: allRows.length>0 && (!now || !!nextRow)};
}

// ── 날씨(로비·월) — Open-Meteo, 홈과 같은 좌표. 30분마다 ──
function wmap(c){
  if(c===0) return ['☀️','맑음','晴れ']; if(c===1||c===2) return ['🌤️','대체로 맑음','晴れ時々曇り']; if(c===3) return ['☁️','흐림','曇り'];
  if(c===45||c===48) return ['🌫️','안개','霧']; if(c>=51&&c<=57) return ['🌦️','이슬비','霧雨'];
  if(c>=61&&c<=67) return ['🌧️','비','雨']; if(c>=71&&c<=77) return ['🌨️','눈','雪'];
  if(c>=80&&c<=82) return ['🌧️','소나기','にわか雨']; if(c>=85&&c<=86) return ['🌨️','눈','雪']; if(c>=95) return ['⛈️','뇌우','雷雨'];
  return ['·','',''];
}
async function loadWeather(){
  if(SCREEN!=='lobby' && SCREEN!=='wall') return;
  if(WX && Date.now()-WXAT<30*60*1000) return;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Asia%2FTokyo&forecast_days=2`;
    const r=await fetch(url); const d=await r.json();
    if(!d||!d.hourly) throw new Error('wx');
    WX=d; WXAT=Date.now();
    if(SCREEN==='wall'){ renderWeatherSmall(); } else { renderWeather(); if(DATA) renderLobby(); }
  }catch(e){ /* 날씨 실패는 그 화면만 빠진다 */ }
}
function renderWeather(){
  const H=WX.hourly, D=WX.daily||{};
  const j=jst(); const fromKey=ymd(j)+'T'+String(j.getHours()).padStart(2,'0');
  let html='', n=0;
  if(D.time){ html+=`<div class="h day">${D.time.slice(0,2).map((t,i)=>{ const w=wmap(D.weather_code[i]); return `<span class="ds">${i===0?'오늘·今日':'내일·明日'} ${w[0]} ${w[1]}${w[2]?' · '+w[2]:''} <b style="color:var(--ink)">${Math.round(D.temperature_2m_min[i])}° / ${Math.round(D.temperature_2m_max[i])}°</b></span>`; }).join('')}</div>`; }
  for(let i=0;i<H.time.length && n<16;i++){
    if(H.time[i].slice(0,13)<fromKey) continue;
    const hh=parseInt(H.time[i].slice(11,13),10), w=wmap(H.weather_code[i]), pp=H.precipitation_probability?H.precipitation_probability[i]:null; n++;
    html+=`<div class="h ${n===1?'now':''}"><div class="hh">${n===1?'지금·今':hh+'시'}</div><div class="ic">${w[0]}</div><div class="tp">${Math.round(H.temperature_2m[i])}°</div><div class="pp">${pp==null?'-':pp+'%'}</div></div>`;
  }
  $('#wx').innerHTML=html;
}
// 월 화면 오른쪽 아래 — 오늘/내일 최저·최고(한 줄, 공지 자리를 뺏지 않게 작게)
function renderWeatherSmall(){
  const box=$('#w-wx'); if(!box||!WX) return;
  const D=WX.daily||{};
  const days=D.time?D.time.slice(0,2).map((t,i)=>{ const w=wmap(D.weather_code[i]); return `<span>${i===0?'오늘 · 今日':'내일 · 明日'} ${w[0]} ${esc(w[1])}<b>${Math.round(D.temperature_2m_min[i])}° / ${Math.round(D.temperature_2m_max[i])}°</b></span>`; }).join(''):'';
  box.innerHTML=`<div class="wxd">${days}</div>`;
}
async function keepAwake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }

tick(); setInterval(tick,1000);
load(); setInterval(load,REFRESH*1000); setInterval(flip,12000);
loadWeather(); setInterval(loadWeather,5*60*1000); setInterval(rotate,ROT*1000);
keepAwake(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ keepAwake(); load(); } });
// 화면을 한 번 클릭하면 전체화면(키오스크 설정이 없는 PC 용)
document.addEventListener('click',()=>{ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); }catch(e){} });
</script>
