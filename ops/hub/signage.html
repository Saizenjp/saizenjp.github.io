<!DOCTYPE html>
<html lang="ko">

<title>안내 모니터 · 案内モニター</title>
<meta name="theme-color" content="#f4f6f2">
<script>
// 테마(Min 2026-10-26 「낮에는 밝은색, 저녁에는 어두운 테마로」): 기본 auto = JST 06:00~17:59 밝음 · 18:00~05:59 어두움. 화면마다 주소로 바꾼다 —
//  ?theme=light | dark | auto · &dark=19-6 (auto 의 어두운 시간대, 시작-끝 시). 첫 그리기 전에 붙이고, 본문 스크립트가 매초 다시 확인한다(재시작 없이 전환).
(function(){ try{
  var q=new URLSearchParams(location.search), m=(q.get('theme')||'auto').toLowerCase(), r=String(q.get('dark')||'18-6').split('-').map(Number);
  if(r.length!==2||isNaN(r[0])||isNaN(r[1])) r=[18,6];
  function jh(){ var n=new Date(); return new Date(n.getTime()+(n.getTimezoneOffset()+540)*60000).getHours(); }
  function dark(){ if(m==='dark') return true; if(m==='light') return false; var h=jh(), a=r[0], b=r[1]; return a<b ? (h>=a&&h<b) : (a>b ? (h>=a||h<b) : false); }
  window.__soTheme=function(){ var d=dark(), el=document.documentElement, cur=el.getAttribute('data-theme')==='dark'; if(d!==cur){ if(d) el.setAttribute('data-theme','dark'); else el.removeAttribute('data-theme'); } return d; };
  window.__soThemeMode=m; window.__soTheme();
}catch(e){} })();
</script>
<!--
  안내 모니터(디지털 사이니지) — 로비·2층 엘리베이터 앞·코스 입구·통로(디지털 월) TV 에 켜 두는 전체화면.
  · 로그인 없음: signage_dinner / signage_lobby / signage_course / signage_office RPC(SQL 134~137·146) 만 부른다 — 오늘·내일만 답하고 방번호·연락처는 안 준다.
  · saizen-ops.js 는 싣지 않는다(상단바·로그인 카드가 화면을 가린다). 공용은 saizen-core.js(순수 규칙)만.
  · ?screen=dinner (2층: 오늘 석식 명단) · ?screen=lobby (로비: 환영판·코스·출발 안내·석식·날씨·공지 로테이션)
  · ?screen=course (코스 입구·클럽하우스: 오늘 스타트표 — **아소 | 소보 | 쿠주 세 열**(Min 2026-10-26 「코스별로 나눠서」), 각 열 티오프 순 · 행 = 시간 · 그룹코드 · ○○○님 팀 · (홀) · 카트(+EV) · 식사 · 인원. 17시 이후엔 내일)
  · ?screen=guide (43형 안내·광고 — Min 2026-10-27: 업체 광고(이미지·동영상·문구, 공지 보드 홍보 kind=promo·화면=guide·Storage signage 버킷)와
      기본 안내 4종(골프장·대욕장·레스토랑·리조트 매너, signage_texts manner_*)을 교대로 로테이션. RPC signage_guide(anon). 동영상은 끝날 때까지(최대 90초) 유지.
      디지털 월(wall) 카드는 같은 날 폐지(1층 엘리베이터 앞 = 로비 화면) — ?screen=wall 코드는 주소로만 남는다.)
  · ?screen=wall (통로 65~75형 디지털 월: 화면 로테이션 — 오늘의 식사 안내(조식·중식 기본 문구 signage_texts + 석식 장소·시간) → 오늘의 라운딩 3열 → 리조트 안내(홍보) → 안내 → 날씨. Min 2026-10-26 「한 화면에 묶으면 자리가 부족 — 나눠서」)
  · 홍보(announcements.kind='promo', screens): 로비·월은 「리조트 안내」 화면(카드 격자), 2층 석식·코스 화면은 맨 아래 띠(최대 3장) — 없으면 띠가 사라진다. 석식 공개 제어(signage_release screen='dinner')는 코스와 같다(hidden=준비 중).
  · **한 페이지 원칙(Min 2026-10-26)**: 코스·석식 명단은 1·2페이지로 넘기지 않는다 — 줄 수에 맞춰 글자를 줄이고(하한 있음), 석식은 열 수(최대 6)를 늘린다. 그래도 넘치면 지난 줄부터 치운다. 큰 TV(75형)·`?scale=` 로 현장 조정.
  · ?screen=office (사무실·프론트 뒤, 직원용: 오늘 진행 현황 숫자판 — signage_office. 일본어 우선. 이름·방번호·금액 없음)
  · ?date=YYYY-MM-DD (시험용) · ?cut=21 (석식: 이 시각 이후엔 내일 / 코스·월: 17) · ?refresh=60 (초) · ?rot=20 (로비 화면 전환 초) · ?rows= (옛 인자, 지금은 무시 — 한 페이지 자동)
  · ?scale=1.2 (글자 배율 — 큰 TV·먼 거리면 올린다. 시인성 최우선: 굵은 서체·줄 수 적게)
  · 테마: **기본 auto = 낮(JST 06~17시) 밝은 화면 · 저녁(18~05시) 어두운 화면**(Min 2026-10-26 「밝은 테마로」 → 「낮에는 밝은색 저녁에는 어두운 테마로」). 화면마다 주소로: ?theme=light | dark | auto, &dark=19-6 (어두운 시간대). 토큰 팔레트만 바뀐다(모든 screen 공통)
  · 공개 제어(SQL 146 signage_release): 담당자가 코스 배정표에서 [손님 화면에 공개]를 누른 최종본만 보인다(released:true). 숨김이면 「준비 중」(released:false). 행이 없으면 실시간(종전).
  · 디자인 원칙(Min 2026-10-25 「깔끔하고 정제된, 모던한 느낌」): 글자 중심 · 여백 넉넉 · 배경 1 + 강조 1 색 · 얇은 구분선 · 장식 아이콘 없음(날씨 기호만 기능용) · 시인성 규칙 유지.
  · 표기 원칙(Min): 손님용 = 한국어 우선 · 한·일 병기. 공개 장소라 방번호·연락처·생년은 어디에도 없다.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/saizen-core.js?v=50"></script>
<style>
  /* 기본 = 밝은 화면(Min 2026-10-26 「밝은 테마로 진행해」 — 고령층 가독성: 밝은 바탕에 진한 글자). 어두운 복도는 ?theme=dark(아래 팔레트). 토큰 이름은 둘이 같다. */
  :root{ --bg:#f4f6f2; --panel:#ffffff; --panel2:#e9eee3; --line:#d2d8cc; --line2:#b4bfab; --ink:#1b211b; --ink2:#2f3a2f; --muted:#5d6a5a;
         --acc:#3f6a2a; --acc2:#7c9a66; --warm:#9a7322; --err:#a43d2f; --rain:#2d6cb5;
         --c-aso:#3f7a2e; --c-sobo:#2b6a9c; --c-kuju:#8a6a1c; --warn-bd:#c9634f; --warn-bg:#fbe9e5; --warn-ink:#b3261e; --z:1;
         --cap-bg:rgba(0,0,0,.72); --cap-ink:#ffffff;   /* 광고 이미지 위 캡션 띠(테마 무관) */
         --mono:'SFMono-Regular',Consolas,Menlo,'SZJpMono',monospace; }
  html[data-theme="dark"]{ --bg:#0f1311; --panel:#161c18; --panel2:#1c2420; --line:#293229; --line2:#3b473c; --ink:#f7f9f3; --ink2:#dfe7d8; --muted:#a2b19c;
         --acc:#a9d38f; --acc2:#5f8a4e; --warm:#f1dc9e; --err:#f2b8ab; --rain:#9fc8ff;
         --c-aso:#b9d7a6; --c-sobo:#9fc4e2; --c-kuju:#e6cf93; --warn-bd:#b7584a; --warn-bg:#231715; --warn-ink:#f2b8ab; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;cursor:none}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic',system-ui,sans-serif;display:flex;flex-direction:column;padding:2.4vh 3vw;gap:1.8vh;font-variant-numeric:tabular-nums}
  /* 머리 — 얇은 선 하나, 제목·날짜·시계 */
  .hd{display:flex;align-items:baseline;gap:2.2vw;border-bottom:.16vh solid var(--line2);padding-bottom:1.2vh}
  .hd .t{font-size:calc(3.9vh*var(--z));font-weight:800;letter-spacing:.04vw}
  .hd .t small{font-size:calc(2.4vh*var(--z));font-weight:700;color:var(--muted);margin-left:1vw}
  .hd .d{font-size:calc(3.1vh*var(--z));font-weight:700;color:var(--ink2)}
  .hd .d b{color:var(--acc);margin-right:.8vw;font-weight:800}
  .hd .c{margin-left:auto;font-size:calc(4.2vh*var(--z));font-weight:700;font-family:var(--mono);color:var(--ink);letter-spacing:.05vw}
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:1.6vw;align-items:stretch}
  .box{background:var(--panel);border:.12vh solid var(--line);border-radius:1.4vh;padding:2vh 2.2vw}
  .box .lb{font-size:calc(2.2vh*var(--z));font-weight:700;color:var(--muted);letter-spacing:.12vw}
  .venue .ko{font-size:calc(9vh*var(--z));font-weight:800;white-space:nowrap;line-height:1.05;color:var(--ink);margin-top:.8vh;letter-spacing:-.05vw}
  .venue .ja{font-size:calc(4.4vh*var(--z));font-weight:700;color:var(--acc);margin-top:.5vh}
  .venue.unset .ko{font-size:calc(4.8vh*var(--z));color:var(--ink2)}
  .venue.unset .ja{font-size:calc(3vh*var(--z))}
  .time{display:flex;flex-direction:column;justify-content:center}
  .time .tm{font-size:calc(6.4vh*var(--z));font-weight:700;white-space:nowrap;font-family:var(--mono);color:var(--ink);line-height:1.1}
  .time .menu{font-size:calc(3vh*var(--z));font-weight:700;color:var(--muted);margin-top:1vh}
  .time .menu b{color:var(--ink);font-weight:800;display:block;margin-top:.3vh}
  .time .menu i{font-style:normal;color:var(--muted);font-weight:700;font-size:.72em;display:block;margin-top:.1vh}   /* 기본 석식 = 한국어 크게 + 일본어 작게(Min 2026-10-26) */
  .time .entry{font-size:calc(2.5vh*var(--z));font-weight:700;color:var(--ink2);margin-top:.6vh;word-break:keep-all}
  .time .entry small{color:var(--muted);font-size:.82em;margin-left:.6vw}
  .time .tm[hidden]{display:none}
  .note{font-size:calc(3vh*var(--z));font-weight:700;color:var(--ink);background:var(--panel2);border-left:.5vw solid var(--acc);padding:1.1vh 1.6vw;border-radius:.9vh}
  .list{flex:1;min-height:0;display:grid;gap:.6vh 1vw;align-content:start;grid-auto-flow:column}
  .list.c5 .row .tag,.list.c6 .row .tag{min-width:4.4em}
  .list.c5 .row,.list.c6 .row{padding:.55vh .7vw;gap:.5vw}
  .list.c5 .row.vh .nm i,.list.c6 .row.vh .nm i{display:none}
  .pane.dense .note{font-size:calc(2.3vh*var(--z));padding:.8vh 1.4vw}
  /* 팀이 많은 날(dense) — 머리 상자를 낮춰 명단에 자리를 준다(한 페이지 원칙) */
  .pane.dense .venue .ko{font-size:calc(5.4vh*var(--z))} .pane.dense .venue .ja{font-size:calc(3vh*var(--z))}
  .pane.dense .time .tm{font-size:calc(4.4vh*var(--z))} .pane.dense .time .menu{font-size:calc(2.3vh*var(--z))}
  .pane.dense .box{padding:1.2vh 1.8vw} .pane.dense .hero{gap:1.2vw}
  .row{display:flex;align-items:center;gap:.7vw;background:var(--panel);border:.12vh solid var(--line);border-radius:.9vh;padding:.7vh 1vw;font-size:var(--fs,3vh);white-space:nowrap;overflow:hidden}
  .row .tag{font-family:var(--mono);font-weight:700;color:var(--acc);min-width:5.6em;flex:0 0 auto}
  .row .nm{font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .row .nm i{font-style:normal;font-size:.78em;color:var(--muted);margin-left:.3em;font-weight:700}
  .row .px{margin-left:auto;font-weight:700;color:var(--muted);font-size:.9em;flex:0 0 auto}
  .row .px b{color:var(--ink);font-size:1.15em;font-weight:800}
  .row .nm i.ja,.row .px i.ja{font-style:normal;font-size:.72em;color:var(--muted);margin-left:.25em;font-weight:700}   /* 한·일 병기(Min 2026-10-26) */
  .row.k{border-color:var(--acc2)}
  /* 팀별 석식 장소(SQL 145) — 장소 머리줄 + 컨벤션홀 팀은 따뜻한 띠 */
  .row.vh{background:var(--panel2);border-color:var(--line2)} .row.vh .nm{color:var(--acc)} .row.vh .nm i{color:var(--muted)}
  .row.vh.convention .nm{color:var(--warm)}
  .row.vh.none .nm{color:var(--ink2)}
  .row.v-convention{border-left:.5vw solid var(--warm)}
  .ft{display:flex;gap:2vw;align-items:center;font-size:calc(2.1vh*var(--z));font-weight:700;color:var(--muted);border-top:.12vh solid var(--line);padding-top:1vh}

  .ft .tot{color:var(--ink2)}
  .ft .tot b{color:var(--ink);font-size:1.2em;font-weight:800}
  .ft .pg{color:var(--acc)}
  .ft .upd{margin-left:auto;font-family:var(--mono)}
  .ft .upd.err{color:var(--err)}
  .none{grid-column:1/-1;text-align:center;color:var(--ink2);font-size:calc(3.6vh*var(--z));padding:8vh 0;font-weight:700}
  /* 홍보 띠(2층 석식·코스 화면 맨 아래, 최대 3장) */
  .band{display:flex;gap:1.2vw;flex:0 0 auto;min-height:0}
  .band[hidden]{display:none}
  .band .bc{flex:1;min-width:0;background:var(--panel2);border:.12vh solid var(--line);border-left:.5vw solid var(--warm);border-radius:1vh;padding:1vh 1.4vw}

  /* 리조트 안내(홍보 카드 격자 — 로비·월 로테이션 화면) */
  .pgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:1.4vw;align-content:start;overflow:hidden}
  .pgrid.one{grid-template-columns:1fr}
  .pc{background:var(--panel);border:.12vh solid var(--line);border-left:.6vw solid var(--warm);border-radius:1.4vh;padding:2.2vh 2.2vw;min-height:0}
  .pc .ttl{font-size:calc(4.2vh*var(--z));font-weight:800;color:var(--ink);word-break:keep-all}
  .pc .bd{font-size:calc(3vh*var(--z));font-weight:600;color:var(--ink2);margin-top:.9vh;white-space:pre-wrap;line-height:1.45;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .pc.info{border-left-color:var(--acc)} .pc.info .ttl small{font-size:.6em;color:var(--muted);margin-left:1vw;font-weight:700}
  .pc.info .bd{-webkit-line-clamp:8;font-weight:700;color:var(--ink)} .pc.info .bd.ja{font-size:calc(2.3vh*var(--z));color:var(--muted);font-weight:600;margin-top:.6vh;-webkit-line-clamp:6}
  /* 숙소행 출발(로비 출발 안내) */
  .fl.lodg .frt i{font-style:normal;color:var(--muted);margin-left:.6vw;font-size:.8em}
  .lrows{display:flex;flex-direction:column;gap:.6vh}

  .lrow .lb2{font-size:.75em;color:var(--ink2);font-weight:600}
  /* 오늘의 식사 안내(디지털 월) — 조식·중식·석식 세 줄, 큰 글자·한·일 병기 */
  .meals{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.6vh;justify-content:center}
  .mrow{display:grid;grid-template-columns:15vw 1fr 1.5fr;align-items:center;gap:2vw;background:var(--panel);border:.12vh solid var(--line);border-radius:1.6vh;padding:2.4vh 2.6vw}

  .mrow .mi{font-size:calc(3.2vh*var(--z));font-weight:700;color:var(--ink2);line-height:1.4;word-break:keep-all;min-width:0}
  .mrow .mi .ml{display:block} .mrow .mi .ml small{font-size:.72em;color:var(--muted);margin-left:.6vw;font-weight:600}

  .mrow .mi .ml.prep{color:var(--warm)}
  /* 준비 중(공개 전) */

  .prep b{font-size:calc(6.5vh*var(--z));font-weight:800;color:var(--ink);letter-spacing:.1vw}
  .prep small{font-size:calc(2.8vh*var(--z));font-weight:700;color:var(--muted)}
  /* ── 로비 화면(로테이션) ── */
  .pane{flex:1;min-height:0;display:none;flex-direction:column;gap:1.4vh}
  .pane.on{display:flex}
  .dots{display:flex;gap:.8vw;align-items:center}
  .dots i{display:block;width:.9vw;height:.9vw;border-radius:50%;background:var(--line2)}

<script>
const $=s=>document.querySelector(s);
const Q=new URLSearchParams(location.search);
const SCREEN=['lobby','course','office','wall','guide'].includes(Q.get('screen'))?Q.get('screen'):'dinner';
const _cut=parseInt(Q.get('cut'),10); const CUT_H=isNaN(_cut)?((SCREEN==='course'||SCREEN==='wall')?17:21):Math.max(0,Math.min(23,_cut));   // 이 시각(JST) 이후엔 내일(석식 21시 · 코스/월 17시)
const REFRESH=Math.max(15,parseInt(Q.get('refresh')||(SCREEN==='office'?'30':'60'),10)||60);   // 직원 화면은 30초
const ROT=Math.max(8,parseInt(Q.get('rot')||'20',10)||20);   // 로비 화면 전환(초)
const SCALE=Math.max(.6,Math.min(1.6,parseFloat(Q.get('scale'))||1));   // ?scale=1.2 = 현장 글자 배율(모니터 크기·거리에 맞춰)
document.documentElement.style.setProperty('--z',String(SCALE));
const MAX_COLS=6;        // 석식 명단 최대 열 수 — 한 페이지에 다 보이게 열을 늘린다(Min 2026-10-26 「1,2 페이지로 넘어가는 게 아니라 한 페이지에」). 7열부터는 이름이 잘린다.
const FS_MIN=1.5;        // 글자 하한(vh) — 이보다 작아지면 줄을 줄이지 글자를 더 줄이지 않는다(75형 기준 약 1.5cm)
const SB_URL=localStorage.getItem('saizen_sb_url')||'https://wzfmloivrolpwpiuyhbs.supabase.co';
const SB_KEY=localStorage.getItem('saizen_sb_key')||'sb_publishable_W76Uh3D9gRPjPoxHwl-LYw_dR9BIj6L';   // publishable(공개용) — saizen-ops.js 기본값과 같다
const VENUE={restaurant:{ko:'레스토랑',ja:'レストラン'},convention:{ko:'컨벤션홀',ja:'コンベンションホール'}};
const WD_KO=['일','월','화','수','목','금','토'], WD_JA=['日','月','火','水','木','金','土'];
const LAT=32.95, LON=131.12;   // 홈 날씨와 같은 좌표(아소 야마나미 리조트 인근)
let supa=null, DATA=null, PAGES=1, LASTOK='', WX=null, WXAT=0;   // PAGES 는 호환용(항상 1 — 한 페이지 원칙)
let COURSE=null, DINNER=null, OUT=[];   // DINNER: 로비 로테이션의 석식 팀 명단(1층·2층 같은 화면, Min 2026-10-26) · OUT: 신청제 행사(outings, SQL 152)   // 로비·월: 코스 스타트표(signage_course)도 같이 돌린다 — 아침 로비 문의 감소(Min)
let PANES=[], PI=0;   // 로비·월: 지금 돌릴 화면 목록·현재 인덱스

// 손님 화면 기본 문구(signage_texts, SQL 149 — 공지 보드 「손님 화면 기본 문구」에서 고친다). RPC 가 키를 안 주면(미적용) 이 값. 키는 있는데 비어 있으면 「안 쓴다」.
const DEF_TEXTS={ breakfast:{ko:'06:00 오픈 · 08:00까지 입장 가능',ja:'06:00 オープン · 08:00 まで入場可'},
  lunch:{ko:'10:30 오픈 · 13:30까지 입장 가능',ja:'10:30 オープン · 13:30 まで入場可'},
  dinner:{ko:'17:50 오픈 · 18:30까지 입장 가능',ja:'17:50 オープン · 18:30 まで入場可'},
  bath:{ko:'05:00~22:00 오픈\n타올은 객실에서 가져와 주세요\n청소 시간 08:00~11:00 이용 불가\n일·수·목요일은 09:00부터 탕(욕조) 이용 불가 — 샤워만 가능',
        ja:'05:00〜22:00\nタオルはお部屋からお持ちください\n清掃時間 08:00〜11:00 はご利用いただけません\n日・水・木曜日は 09:00 から浴槽はご利用いただけません（シャワーのみご利用可）'} };
function txt(T,key){ const v=(T&&typeof T==='object'&&T[key])?T[key]:DEF_TEXTS[key]; return {ko:String(v&&v.ko||''),ja:String(v&&v.ja||'')}; }
// 리조트 안내 화면 = 고정 시설 안내(대욕장 — signage_texts.bath) + 홍보 카드. 고정 안내는 ko 줄·ja 줄을 각각 블록으로.
function infoCardsHTML(T){
  const b=txt(T,'bath'); if(!b.ko&&!b.ja) return '';
  const lines=v=>v.split(/\n/).map(x=>x.trim()).filter(Boolean).map(esc).join('<br>');
  return `<div class="pc info"><div class="ttl">1층 대욕장<small>1F 大浴場</small></div>${b.ko?`<div class="bd">${lines(b.ko)}</div>`:''}${b.ja?`<div class="bd ja">${lines(b.ja)}</div>`:''}</div>`;
}
const DEST={shizu:{ko:'시즈노야도',ja:'志津の宿'},ganji:{ko:'간지호텔',ja:'ガンジーホテル'},kuju:{ko:'쿠쥬 프라이빗 타운',ja:'クジュ プライベートタウン'}};   // 숙소행 출발(lobby_departures.dest)
function prepHTML(ko,ja){ return `<div class="prep"><b>준비 중</b><small>準備中 — ${ja}</small><small>${ko}</small></div>`; }
// 홍보 카드(리조트 안내 화면) / 홍보 띠(2층 석식·코스 맨 아래, 최대 3장 — 없으면 띠 자체가 사라진다)
function promoCardsHTML(list){ const arr=Array.isArray(list)?list:[]; return arr.length? arr.map(p=>`<div class="pc${p.pinned?' pin':''}"><div class="ttl">${esc(p.title)}</div>${p.body?`<div class="bd">${esc(p.body)}</div>`:''}</div>`).join('') : '<div class="none">안내가 없습니다<br>ご案内はありません</div>'; }
function renderPromoBand(list){
  const b=$('#band'); const arr=(Array.isArray(list)?list:[]).slice(0,3);
  BAND_VH=arr.length?11:0;
  if(!arr.length){ b.hidden=true; b.innerHTML=''; return; }
  b.hidden=false; b.innerHTML=arr.map(p=>`<div class="bc${p.pinned?' pin':''}"><b>${esc(p.title)}</b>${p.body?`<span>${esc(p.body)}</span>`:''}</div>`).join('');
}
// 숙소행 출발(각 사무실이 기입한 시각) — 오늘 것은 시각이 지나면 숨긴다
function lodgingList(d,now){ return (Array.isArray(d.lodging)?d.lodging:[]).filter(x=>x&&x.dest&&x.time&&!(x.date===d.today&&now&&x.time<now)); }
function lodgingHTML(d,now){
  const rows=lodgingList(d,now); if(!rows.length) return '';
  return [...new Set(rows.map(x=>x.date))].map(dt=>{ const dl=dt===d.today?'오늘 · 本日':'내일 · 明日';
    return `<div class="fl lodg"><div class="fh"><span class="day">${dl} ${mdLabel(dt)}</span><span class="frt">숙소행 출발 <i>ご宿泊先へのご出発</i></span></div>`
      +`<div class="lrows">${rows.filter(x=>x.date===dt).map(x=>{ const ds=DEST[x.dest]||{ko:x.dest,ja:''};
          return `<div class="lrow"><span class="dn">${esc(ds.ko)}<i>${esc(ds.ja)}</i></span><span class="dep">${esc(x.time)}</span>${x.note?`<span class="lb2">${esc(x.note)}</span>`:''}</div>`; }).join('')}</div></div>`; }).join('');
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jst(){ const n=new Date(); return new Date(n.getTime()+(n.getTimezoneOffset()+540)*60000); }   // 모니터 PC 시간대와 무관하게 JST
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hhmm(){ const n=jst(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
// 표시 날짜: ?date 우선, 없으면 오늘 — CUT_H 이후엔 내일(저녁이 끝난 뒤 내일 것을 미리). 로비·직원·월(식사·안내)은 항상 오늘.
function targetDate(){
  const f=Q.get('date'); if(f&&/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const n=jst(); if(SCREEN!=='lobby' && SCREEN!=='office' && SCREEN!=='wall' && n.getHours()>=CUT_H){ n.setDate(n.getDate()+1); }
  return ymd(n);
}
// 월 화면의 스타트표 날짜 — 17시 이후엔 내일(저녁에 지나가며 내일 티오프를 본다)
function courseDate(){
  const f=Q.get('date'); if(f&&/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const n=jst(); if(n.getHours()>=CUT_H){ n.setDate(n.getDate()+1); } return ymd(n);
}
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function dateLabel(iso){ const d=new Date(iso+'T00:00:00'); const m=d.getMonth()+1, day=d.getDate(), w=d.getDay();
  return `${m}월 ${day}일 (${WD_KO[w]}) <small style="font-size:.75em;color:var(--muted)">${m}月${day}日(${WD_JA[w]})</small>`; }
function mdLabel(iso){ const d=new Date(iso+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()} (${WD_KO[d.getDay()]}·${WD_JA[d.getDay()]})`; }
function tick(){ $('#clock').textContent=hhmm(); if(window.__soTheme) window.__soTheme(); }   // 시계와 함께 테마(auto)도 매초 확인 — 18시가 되면 그 자리에서 어두워진다
function setUpd(ok){ const e=$('#upd'); if(ok){ LASTOK=hhmm(); e.className='upd'; e.textContent=LASTOK+' 갱신'; }
  else { e.className='upd err'; e.textContent='갱신 실패 '+hhmm()+(LASTOK?' · 마지막 '+LASTOK:''); } }

async function load(){
  const date=targetDate();
  try{
    if(!supa) supa=window.supabase.createClient(SB_URL,SB_KEY);
    const rpcName={lobby:'signage_lobby',wall:'signage_lobby',course:'signage_course',office:'signage_office',guide:'signage_guide'}[SCREEN]||'signage_dinner';
    const {data,error}=await (SCREEN==='guide'?supa.rpc(rpcName):supa.rpc(rpcName,{p_date:date}));   // 안내·광고는 날짜 무관
    if(error) throw error;
    if(!data||data.ok===false) throw new Error((data&&data.reason)||'no data');
    if(SCREEN==='lobby'||SCREEN==='wall'){   // 코스 표는 실패해도 로비·월은 돈다
      try{ const c=await supa.rpc('signage_course',{p_date:SCREEN==='wall'?courseDate():date}); COURSE=(c.data&&c.data.ok!==false)?c.data:null; }catch(e){ COURSE=null; }
      if(SCREEN==='lobby'){ try{ const r=await supa.rpc('signage_dinner',{p_date:date}); DINNER=(r.data&&r.data.ok!==false)?r.data:null; }catch(e){ DINNER=null; } }   // 석식 팀 명단(공개 제어 포함)
      try{ const r=await supa.from('outings').select('id,outing_date,kind,title_ko,title_ja,meet_time,meet_place,return_time,capacity,fee,signed,note_ko,note_ja,status').in('outing_date',[date,addDays(date,1)]).neq('status','cancelled').order('outing_date').order('meet_time'); OUT=Array.isArray(r.data)?r.data:[]; }catch(e){ OUT=[]; } }
    DATA=data; setUpd(true);
    if(SCREEN==='lobby') renderLobby(); else if(SCREEN==='wall') renderWall(); else if(SCREEN==='course') renderCourse(); else if(SCREEN==='office') renderOffice(); else if(SCREEN==='guide') renderGuide(); else render();
  }catch(e){
    setUpd(false);
    if(!DATA){ const el=$({lobby:'#w-list',wall:'#wm-list',course:'#crs',office:'#kpi',guide:'#p-guide'}[SCREEN]||'#list'); el.innerHTML='<div class="none">데이터를 불러오지 못했습니다<br>データを取得できませんでした</div>'; if(SCREEN==='lobby'){ showPane('p-welcome'); } if(SCREEN==='wall'){ showPane('p-wmeal'); } if(SCREEN==='guide'){ PANES=['p-guide']; PI=0; showPane('p-guide'); } }
  }
}

// ── 2층: 석식 명단 ──────────────────────────────────────────────────────
function fillVenue(pre, v, tm, base, note, entry){
  const vb=$('#'+pre+'venue'); vb.classList.toggle('unset',!v);
  $('#'+pre+'ko').textContent=v?v.ko:'장소는 프론트에 문의해 주세요';
  $('#'+pre+'ja').textContent=v?v.ja:'会場はフロントへお尋ねください';
  const tmEl=$('#'+pre+'time'); tmEl.textContent=tm||''; tmEl.hidden=!tm;   // 그날 시간(dinner_venue)이 있을 때만 — 없으면 입장 안내만
  const en=$('#'+pre+'entry'); if(en){ en.innerHTML=(entry&&(entry.ko||entry.ja))?`${esc(entry.ko)}${entry.ja?`<small>${esc(entry.ja)}</small>`:''}`:''; }
  $('#'+pre+'menu').innerHTML=base?`오늘의 기본 석식 · 本日の基本夕食<b>${esc(base.ko||base.ja||'')}</b>${(base.ko&&base.ja)?`<i>${esc(base.ja)}</i>`:''}`:'';
  const nt=$('#'+pre+'note'); if(note){ nt.hidden=false; nt.textContent=note; } else nt.hidden=true;
}
// 요일별 기본 석식 — 한국어 크게·일본어 작게(SZCore 표 하나). 없으면 null.
function baseDinnerOf(date){ try{ const ja=SZCore.baseDinner(date), ko=SZCore.baseDinnerKo?SZCore.baseDinnerKo(date):''; return (ja||ko)?{ko,ja}:null; }catch(e){ return null; } }
function render(){ renderDinnerPane(DATA, true); }
// 석식 명단 화면 — standalone=2층 전용(?screen=dinner) / false=로비 로테이션의 한 화면(머리·푸터는 로비가 관리)
function renderDinnerPane(d, standalone){
  if(!d) return;
  const isTomorrow=d.date!==d.today;
  if(standalone) $('#hd-date').innerHTML=(isTomorrow?'<b>내일 · 明日</b>':'<b>오늘 · 本日</b>')+dateLabel(d.date);
  const base=baseDinnerOf(d.date), entry=txt(d.texts,'dinner');
  if(standalone) renderPromoBand(d.promos);   // 특식·안주 신청 안내 등(공지 보드 홍보, 화면=2층 석식)
  if(d.released===false){   // 공개 전(숨김) — 장소·시간은 보이고 명단은 「준비 중」(dinner.html [공개 중지])
    fillVenue('v-', VENUE[d.venue], [d.start_time,d.end_time].filter(Boolean).join(' 〜 '), base, d.note, entry);
    const l=$('#list'); l.style.cssText=''; l.className='list'; l.innerHTML=prepHTML('명단이 확정되면 표시됩니다','名簿が確定次第 表示します');
    if(standalone){ $('#tot').innerHTML=''; $('#pg').textContent=''; showPane('p-dinner'); } return;
  }
  const teams=Array.isArray(d.teams)?d.teams:[];
  // 팀별 장소(SQL 145): 장소가 갈리는 날은 레스토랑 → 컨벤션홀 → 미정 순으로 머리줄을 넣어 나눈다
  const vOf=t=>t.venue||d.venue||'';
  const sumPax=v=>teams.filter(t=>vOf(t)===v).reduce((s,t)=>s+(Number(t.pax)||0),0);
  const nR=teams.filter(t=>vOf(t)==='restaurant').length, nC=teams.filter(t=>vOf(t)==='convention').length, nN=teams.length-nR-nC;
  const split=(nR>0&&nC>0)||(nN>0&&(nR>0||nC>0));
  if(split){
    fillVenue('v-', {ko:[nR?VENUE.restaurant.ko:'',nC?VENUE.convention.ko:''].filter(Boolean).join(' · '), ja:[nR?VENUE.restaurant.ja:'',nC?VENUE.convention.ja:''].filter(Boolean).join(' ／ ')},
      [d.start_time,d.end_time].filter(Boolean).join(' 〜 '), base, d.note||'장소는 팀마다 다릅니다 · 명단의 구분을 확인해 주세요 ／ 会場はチームごとに異なります・名簿の区分をご確認ください');
  } else {
    fillVenue('v-', VENUE[d.venue], [d.start_time,d.end_time].filter(Boolean).join(' 〜 '), base, d.note, entry);
  }
  let rows=teams;
  if(split){
    rows=[];
    [['restaurant',nR],['convention',nC],['',nN]].forEach(([v,n])=>{ if(!n) return;
      const grp=teams.filter(t=>vOf(t)===v);
      rows.push({hdr:v, n:grp.length, pax:grp.reduce((s,t)=>s+(Number(t.pax)||0),0)});
      grp.forEach(t=>rows.push({...t,_v:v}));
    });
  }
  PAGES=1;   // 한 페이지 원칙 — 넘기지 않고 열 수·글자를 맞춘다
  $('#p-dinner').classList.toggle('dense', rows.length>40);
  gridRows($('#list'), rows, '오늘 석식 명단이 없습니다<br>本日の夕食予約はありません');
  if(!standalone) return;
  $('#tot').innerHTML=`<b>${d.units||0}</b>팀 · <b>${d.total||0}</b>명 <span style="color:var(--muted)">/ ${d.units||0}チーム · ${d.total||0}名</span>`
    +(split?` <span style="color:var(--muted)">· ${VENUE.restaurant.ko} <b>${sumPax('restaurant')}</b> · ${VENUE.convention.ko} <b>${sumPax('convention')}</b></span>`:'')
    +(d.released?` <span style="color:var(--muted)">· 확정 ${esc(String(d.released_at||'').slice(11,16))}</span>`:'');
  $('#pg').textContent='';
  showPane('p-dinner');
}
// ── 신청제 행사(outings) 안내 화면 — 로비·월 로테이션(오늘·내일, 취소 제외). 제목·시각·장소·인원만(개인정보 없음) ──
const KIND_L={shopping:['쇼핑 투어','ショッピングツアー'],tour:['관광 안내','観光案内'],other:['안내 행사','ご案内行事']};
function outingsFor(date){ const tm=addDays(date,1); return OUT.filter(o=>o.outing_date===date||o.outing_date===tm); }
function renderOutingPane(date){
  const el=$('#o-list'); if(!el) return; const list=outingsFor(date);
  const yen=v=>'¥'+Number(v).toLocaleString('ja-JP');
  el.innerHTML=list.map(o=>{ const k=KIND_L[o.kind]||KIND_L.other, tmr=o.outing_date!==date, t=String(o.meet_time||'').slice(0,5), rt=String(o.return_time||'').slice(0,5), closed=o.status==='closed';

      ${(o.note_ko||o.note_ja)?`<div class="on">${esc(o.note_ko||'')}${(o.note_ko&&o.note_ja)?'\n':''}${esc(o.note_ja||'')}</div>`:''}</div>
      <div class="oq"><b>${Number(o.signed)||0}${o.capacity?`<i>/${esc(String(o.capacity))}</i>`:''}</b>${closed?'접수 마감 · 受付終了':'신청 · お申込み'}<small>프론트에서 접수 · フロントで受付</small></div></div>`; }).join('');

}
// 태그·대표·인원 줄을 **한 페이지**에 — 열을 1→6까지 늘려 보며 글자가 충분히 커지는 가장 적은 열 수를 고르고, 줄 높이에 맞춰 글자를 정한다.
//  avail(세로 여유)은 실제 명단 영역 높이(clientHeight) — 레이아웃이 없는 환경(테스트)이나 0 이면 화면 비율 추정값.
function gridRows(list, rows, emptyMsg, extra){
  if(!rows.length){ list.style.cssText=''; list.className='list'; list.innerHTML=`<div class="none">${emptyMsg}</div>`; return; }
  const n=rows.length;
  const vh=window.innerHeight||1080;
  const availVh=(list.clientHeight>0)? list.clientHeight/vh*100 : (n>40?60:52);
  let cols=1, r=n, fs=0;
  for(let c=1;c<=MAX_COLS;c++){ const rr=Math.ceil(n/c); const f=((availVh/rr)-1.9)/1.25; cols=c; r=rr; fs=f; if(f>=(c===1?3.6:2.7)) break; }   // 줄 높이 ≈ fs×1.25 + 1.9vh(여백·선)
  fs=Math.min(3.8,Math.max(FS_MIN,fs))*SCALE;
  list.className='list c'+cols;
  list.style.cssText=`grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${r},auto);--fs:${fs.toFixed(2)}vh`;
  list.innerHTML=rows.map(t=>{
    if(t.hdr!==undefined){   // 장소 머리줄(팀별 석식 장소, SQL 145)
      const v=VENUE[t.hdr];
      return `<div class="row vh ${t.hdr||'none'}"><span class="nm">${v?`${esc(v.ko)} <i>${esc(v.ja)}</i>`:'장소 미정 <i>会場未定</i>'}</span><span class="px"><b>${t.n}</b>팀 · <b>${t.pax}</b>名</span></div>`; }
    return `<div class="row ${t.accom==='쿠주힐즈'?'k':''}${t._v?' v-'+t._v:''}"><span class="tag">${esc(t.tag||'')}</span><span class="nm">${esc(t.rep||'')}<i>님</i><i class="ja">様</i>${t.teams>1?`<i>+${t.teams-1}</i>`:''}${extra?extra(t):''}</span><span class="px"><b>${esc(t.pax)}</b>명<i class="ja">名</i></span></div>`;
  }).join('');
  fitListWidth(list);   // pane 이 숨겨져 있으면(폭 0) 건너뛰고 showPane 때 다시 잰다
}
// 폭 맞춤 — 높이로 정한 글자가 열 폭에 안 들어가 이름이 「김대표…」로 잘리면 글자를 줄인다(한·일 병기로 줄이 길어진 뒤 실측, Min 2026-10-26).
//  이름이 다 보이는 쪽이 꽉 채우는 쪽보다 우선. 숨긴 pane 은 폭이 0 이라 못 재므로 showPane 이 보이는 pane 의 .list 마다 다시 부른다.
function fitListWidth(list){
  if(!list||!list.clientWidth) return;
  let fs=parseFloat(list.style.getPropertyValue('--fs')); if(!fs) return;
  const cut=()=>[...list.querySelectorAll('.row .nm')].some(e=>e.scrollWidth>e.clientWidth+1);
  let k=0; while(k++<14 && fs>FS_MIN && cut()){ fs=Math.max(FS_MIN, fs*0.93); list.style.setProperty('--fs', fs.toFixed(2)+'vh'); }
}

const COURSES=[{code:'aso',ko:'아소',ja:'阿蘇'},{code:'sobo',ko:'소보',ja:'祖母'},{code:'kuju',ko:'쿠주',ja:'久住'}];

function slotTee(n){ const t=6*60+50+7*((+n||1)-1); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }   // 06:50 부터 7분 간격 = SZCore.teeSlots
function teamLabel(g){   // 손님용 = 한국어 우선(「○○○님 팀」) · 당일 손님(일본인)은 「○○様チーム」

// 표를 box 에 그리고 {rows,nextRow,nextTee,now,upcoming} 을 돌려준다 — 코스 화면(단독)·로비 로테이션·디지털 월이 같이 쓴다.
//  **아소 | 소보 | 쿠주 세 열**(Min 2026-10-26) — 각 열은 그 코스에서 출발하는 조를 티오프 순(샷건 날은 홀 순)으로. 한 페이지: 가장 긴 열의 줄 수에 글자를 맞추고(하한 FS_MIN), 그래도 넘치면 한 시간 넘게 지난 줄부터 치운다.
function paintCourse(d, box){
  box=box||$('#crs');

  }
  PAGES=1;
  const gs=(Array.isArray(d.groups)?d.groups:[]).map(g=>({...g, tee:g.tee||slotTee(g.slot)}));
  if(!gs.length){ box.innerHTML='<div class="none">오늘 조편성이 없습니다<br>本日の組合せはありません</div>'; return {rows:[], nextRow:null, nextTee:'', now:'', upcoming:false}; }
  const sg=!!d.shotgun && !!d.shotgun_time;
  const teeOf=g=>sg?(d.shotgun_time||g.tee):g.tee;
  const now=isTomorrow?'':hhmm();
  const past=g=>!!now && teeOf(g)<now;
  const compact=box.classList.contains('compact');
  const HAS={hole:gs.some(g=>g.hole!=null), cart:gs.some(g=>('cart' in g)||('cart_type' in g)||g.ev!=null), lunch:gs.some(g=>'lunch' in g)};   // RPC 가 필드를 주면(SQL 146~) 값이 비어도 열은 보인다(Min 2026-10-26 「컬럼이 없네」) — 옛 RPC 엔 키가 없어 종전대로
  const byTee=(a,b)=>(sg?0:String(a.tee).localeCompare(String(b.tee)))||((a.hole||0)-(b.hole||0))||((a.slot||0)-(b.slot||0))||((CORDER[a.course]??9)-(CORDER[b.course]??9));
  const cols=COURSES.map(c=>({c, rows:gs.filter(g=>g.course===c.code).sort(byTee)}));
  const other=gs.filter(g=>!CNAME[g.course]); if(other.length) cols[cols.length-1].rows.push(...other.sort(byTee));   // 예상 밖 코스 코드는 마지막 열에
  // 점심 후 재스타트(담당자 지정 조만) — 표 아래 한 줄(시각 · 코스 · 코드 · 팀)
  const pmAll=gs.filter(g=>g.pm_tee).sort((a,b)=>String(a.pm_tee).localeCompare(String(b.pm_tee)));
  const pm=pmAll.slice(0,6), pmMore=pmAll.length-pm.length;
  const maxRows=()=>Math.max(...cols.map(x=>x.rows.length));
  const availVh=(compact?68:73)-BAND_VH-(pm.length?5.5:0);
  const fit=(r,oh)=>Math.min(compact?2.5:3.3, ((availVh/Math.max(r,8))-oh)/1.3);   // 줄 높이 ≈ fs×1.3 + 여백(oh vh)
  const upcomingAll=gs.filter(g=>!past(g)).sort(byTee);
  // 글자 상한 = 열 폭: 한 줄이 약 24em(컴팩트 20em)이라 열 내용폭(≈28vw·컴팩트 22vw)을 넘으면 칸이 「…」로 잘린다 → vw 기준 상한을 vh 로 환산
  const ratio=(window.innerWidth&&window.innerHeight)?window.innerWidth/window.innerHeight:16/9;
  const capVh=(compact?1.65:(sg?2.0:2.2))*(ratio/(16/9));   // 칸 폭(%)에 글자가 들어가는 상한 — 1080p 16:9 실측, 화면비에 비례
  let fs=fit(maxRows(),1.25), tight=false;
  if(fs<1.8 && now && upcomingAll.length){   // 줄이 많으면 한 시간 넘게 지난 줄부터 치운다 — 아직 나갈 조가 있을 때만(다 나간 뒤엔 흐리게 전부)
    const cut=hhmmMinus(now,60); cols.forEach(x=>{ x.rows=x.rows.filter(g=>teeOf(g)>=cut); }); fs=fit(maxRows(),1.25); }
  if(fs<1.8){ tight=true; fs=fit(maxRows(),0.85); }   // 그다음 여백을 줄인다(글자보다 먼저)
  fs=Math.max(FS_MIN,Math.min(fs,capVh))*SCALE;
  box.classList.toggle('tight',tight);
  const nextOf=x=>now?x.rows.find(g=>!past(g)):null;

  const nextTee=nextRow?teeOf(nextRow):'';
  box.style.setProperty('--fs',fs.toFixed(2)+'vh');
  const th=(ko,ja,cls)=>`<div class="th ${cls||''}">${ko}<span>${ja}</span></div>`;
  const gcols=['max-content','max-content','minmax(0,1fr)'].concat(HAS.hole?['max-content']:[],HAS.cart?['max-content']:[],HAS.lunch?['max-content']:[],['max-content']).join(' ');
  const cell=(g,nr)=>`<div class="tr${past(g)?' past':''}${g===nr?' next':''}"><div class="td tee">${esc(teeOf(g))}</div>`
    +`<div class="td tag">${esc(g.tag||'')}</div><div class="td nm">${teamLabel(g)}${g.gno?`<i>${g.gno}조</i>`:''}</div>`
    +`${HAS.hole?`<div class="td hl">${g.hole?'H'+esc(g.hole):''}</div>`:''}${HAS.cart?`<div class="td ct">${esc(g.cart||'')}${g.ev?'<b>EV</b>':''}</div>`:''}${HAS.lunch?`<div class="td lu">${lunchLabel(g.lunch)}</div>`:''}`
    +`<div class="td px"><b>${esc(g.pax)}</b><i>名</i></div></div>`;
  box.innerHTML=`<div class="ccols">${cols.map(x=>{ const nr=nextOf(x); const pax=x.rows.reduce((s,g)=>s+(Number(g.pax)||0),0);
      return `<div class="ccol ${esc(x.c.code)}"><div class="ch${x.rows.length?'':' empty'}"><b>${esc(x.c.ko)}</b><i>${esc(x.c.ja)}</i><span>${x.rows.length}組 · ${pax}名</span></div>`
        +(x.rows.length?`<div class="gt" style="grid-template-columns:${gcols}">${th(sg?'출발':'시간','スタート','tee')}${th('코드','コード','tag')}${th('팀','チーム','nm')}${HAS.hole?th('홀','ホール','hl'):''}${HAS.cart?th('카트','カート','ct'):''}${HAS.lunch?th('식사','昼食','lu'):''}${th('인원','名','px')}${x.rows.map(g=>cell(g,nr)).join('')}</div>`
        :`<div class="none">출발 없음<br>スタートなし</div>`)+`</div>`; }).join('')}</div>`
    +(pm.length?`<div class="pmt"><h3>점심 후 재스타트 <span style="font-weight:600;opacity:.8">昼食後 再スタート</span></h3>${pm.map(g=>{ const c=CNAME[g.pm_course]||{ko:'',ja:''};

}

  const mn=MANNER.map(([k,ko,ja])=>{ const v=T[k]; if(!v) return null; const lines={ko:String(v.ko||''),ja:String(v.ja||'')}; if(!lines.ko.trim()&&!lines.ja.trim()) return null; return {id:'g-'+k,kind:'mn',key:k,ko,ja,lines}; }).filter(Boolean);

// ── 날씨(로비·월) — Open-Meteo, 홈과 같은 좌표. 30분마다 ──
function wmap(c){
  if(c===0) return ['☀️','맑음','晴れ']; if(c===1||c===2) return ['🌤️','대체로 맑음','晴れ時々曇り']; if(c===3) return ['☁️','흐림','曇り'];
  if(c===45||c===48) return ['🌫️','안개','霧']; if(c>=51&&c<=57) return ['🌦️','이슬비','霧雨'];
  if(c>=61&&c<=67) return ['🌧️','비','雨']; if(c>=71&&c<=77) return ['🌨️','눈','雪'];
  if(c>=80&&c<=82) return ['🌧️','소나기','にわか雨']; if(c>=85&&c<=86) return ['🌨️','눈','雪']; if(c>=95) return ['⛈️','뇌우','雷雨'];
  return ['·','',''];
}
async function loadWeather(){
  if(SCREEN!=='lobby' && SCREEN!=='wall') return;
  if(WX && Date.now()-WXAT<30*60*1000) return;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Asia%2FTokyo&forecast_days=2`;
    const r=await fetch(url); const d=await r.json();
    if(!d||!d.hourly) throw new Error('wx');
    WX=d; WXAT=Date.now();
    renderWeather(); if(DATA){ if(SCREEN==='wall') renderWall(); else renderLobby(); }
  }catch(e){ /* 날씨 실패는 그 화면만 빠진다 */ }
}
function renderWeather(){
  const H=WX.hourly, D=WX.daily||{};
  const j=jst(); const fromKey=ymd(j)+'T'+String(j.getHours()).padStart(2,'0');
  let html='', n=0;
  if(D.time){ html+=`<div class="h day">${D.time.slice(0,2).map((t,i)=>{ const w=wmap(D.weather_code[i]); return `<span class="ds">${i===0?'오늘·今日':'내일·明日'} ${w[0]} ${w[1]}${w[2]?' · '+w[2]:''} <b style="color:var(--ink)">${Math.round(D.temperature_2m_min[i])}° / ${Math.round(D.temperature_2m_max[i])}°</b></span>`; }).join('')}</div>`; }
  for(let i=0;i<H.time.length && n<16;i++){
    if(H.time[i].slice(0,13)<fromKey) continue;
    const hh=parseInt(H.time[i].slice(11,13),10), w=wmap(H.weather_code[i]), pp=H.precipitation_probability?H.precipitation_probability[i]:null; n++;
    html+=`<div class="h ${n===1?'now':''}"><div class="hh">${n===1?'지금·今':hh+'시'}</div><div class="ic">${w[0]}</div><div class="tp">${Math.round(H.temperature_2m[i])}°</div><div class="pp">${pp==null?'-':pp+'%'}</div></div>`;
  }
  $('#wx').innerHTML=html;
}

// 무인 TV 자동 갱신(Min 2026-10-26 「여기도 한국어가 없어서」 = 옛 페이지를 들고 있던 TV): 10분마다 이 파일의 ETag 를 캐시 없이 확인해 배포가 바뀌면 그 자리에서 다시 연다.
//  GitHub Pages 는 HTML 을 10분 캐시하므로 cache:'no-store' HEAD 로 본다. 첫 값은 부팅 때 저장. 실패(오프라인)는 무시.
let PAGE_TAG=null;
async function checkUpdate(){ try{ const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'}); if(!r.ok) return; const tag=r.headers.get('etag')||r.headers.get('last-modified')||''; if(!tag) return; if(PAGE_TAG===null){ PAGE_TAG=tag; return; } if(tag!==PAGE_TAG){ location.reload(); } }catch(e){} }
checkUpdate(); setInterval(checkUpdate, 10*60*1000);
load(); setInterval(load,REFRESH*1000);
loadWeather(); setInterval(loadWeather,5*60*1000); setInterval(rotate,ROT*1000);
keepAwake(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ keepAwake(); load(); } });
// 화면을 한 번 클릭하면 전체화면(키오스크 설정이 없는 PC 용)
document.addEventListener('click',()=>{ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); }catch(e){} });
</script>
