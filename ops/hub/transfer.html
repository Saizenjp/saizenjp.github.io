<style>

  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,'SZJpMono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input,select{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:1060px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:78px;text-align:center}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip .c{opacity:.7;font-weight:600;margin-left:4px}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  .sep{width:1px;height:20px;background:var(--border)}
  /* 화면 목록 */
  .ttbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .ttbl th{background:var(--surface2);border-bottom:1px solid var(--border2);padding:6px 8px;text-align:left;font-size:11px;color:var(--text2);font-weight:700;white-space:nowrap}
  .ttbl td{border-bottom:1px solid var(--border);padding:5px 8px;vertical-align:middle}
  .ttbl tr:hover td{background:var(--surface2)}
  .ttbl .fl{font-family:var(--mono);font-weight:800}
  .ttbl .tm{font-family:var(--mono);font-weight:800;font-size:13.5px}
  .ttbl .gc{font-weight:800;color:var(--accent2)}
  .ttbl .px{font-weight:800;text-align:center}
  .ttbl tr.gh td{background:var(--accentSoft);font-weight:800;color:var(--accentDeep);font-size:12px}
  .dirbadge{font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 7px;white-space:nowrap}
  .d-in{background:#e7efe1;color:#2f7d4f;border:1px solid #a9c39a}
  .d-out{background:#f5ecd8;color:#8a6410;border:1px solid #dcc48d}
  .d-stay{background:#e6edf5;color:#2f4f7d;border:1px solid #a8bdd6}
  .ymctrl{display:flex;align-items:center;gap:6px}
  .ymctrl b{font-size:15px;font-family:var(--mono);min-width:104px;text-align:center}
  .sumline{font-size:12.5px;color:var(--text2);font-weight:700;margin-top:8px}

  .flcard{border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:12px;overflow:hidden}
  .flcard>.fh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;background:var(--accentSoft);border-bottom:1px solid var(--border)}
  .fh .fno{font-family:var(--mono);font-size:21px;font-weight:800;color:var(--accentDeep)}
  .fh .ftm{font-family:var(--mono);font-size:26px;font-weight:800}
  .fh .frt{font-family:var(--mono);font-size:20px;font-weight:800;color:var(--text)}
  .fh .fdir{font-size:12px;font-weight:800;border-radius:6px;padding:3px 9px}
  .fh .fcnt{margin-left:auto;font-size:15px;font-weight:800;color:var(--text2)}
  .fh .fcnt b{color:var(--accent)}
  .trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--border)}
  .trow:first-of-type{border-top:none}
  .trow.done{background:#f2f7ee}
  .trow .tg{font-family:var(--mono);font-size:17px;font-weight:800;color:var(--accent2);min-width:74px}
  .trow .rp{font-size:16px;font-weight:700}
  .trow .ac{font-size:13.5px;font-weight:700;color:var(--text2)}
  .trow .pxn{font-size:17px;font-weight:800;min-width:52px;text-align:right}
  .bigck{margin-left:auto;min-height:52px;min-width:150px;font-size:16px;font-weight:800;border:2px solid var(--border2);
    background:var(--surface);color:var(--text);border-radius:12px;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:9px;justify-content:center}
  .bigck::before{content:'○';font-size:19px;color:var(--muted)}
  .bigck.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bigck.on::before{content:'✓';color:#fff}
  .mems{display:flex;flex-wrap:wrap;gap:9px;padding:4px 14px 13px}
  .memck{min-height:52px;min-width:132px;font-size:16.5px;font-weight:800;border:2px solid var(--border2);background:var(--surface);
    color:var(--text);border-radius:12px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .memck::before{content:'○';font-size:18px;color:var(--muted)}
  .memck.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .memck.on::before{content:'✓';color:#fff}

  .dph{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .dph b{font-size:12.5px;color:var(--accent)}
  .dpnone{font-size:11.5px;color:var(--muted)}
  .dpadd{margin-left:auto;font-family:inherit;font-size:12px;font-weight:700;padding:4px 11px;
    border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:7px;cursor:pointer}
  .dpe{display:flex;gap:6px;align-items:center;margin-bottom:5px}
  .dpe .dv{flex:1;min-width:0;font-family:inherit;font-size:13px;padding:6px 9px;
    border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text)}
  .dpe .dv.tm{flex:0 0 84px;font-family:var(--mono);font-weight:700;text-align:center}
  .dpe .dx{flex:0 0 auto;font-family:inherit;font-size:12px;font-weight:800;padding:5px 9px;
    border:1px solid var(--border2);background:var(--surface);color:var(--err);border-radius:6px;cursor:pointer}
  .gsx{display:inline-block;font-size:12px;font-weight:800;line-height:1;margin-left:3px;vertical-align:middle}
  .gsx.m{color:#1A4D8F}.gsx.f{color:#c0392b}
  .thead2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2)}
  .thead2 .tprog{margin-left:auto;font-size:15px;font-weight:800}
  .thead2 .tprog.full{color:var(--ok)}
  .norost{padding:6px 14px 12px;font-size:13px;color:var(--muted);font-weight:600}
  @media(max-width:1100px){ .bigck,.memck{min-height:60px;font-size:18px} .fh .ftm{font-size:24px} }
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
  .toast.warn{border-left-color:var(--warn);background:#fdf6e7;color:#6b5312}

async function pagedIn(table, cols, col, vals){
  const out=[];
  for(let i=0;i<vals.length;i+=200){
    const chunk=vals.slice(i,i+200);
    let from=0;
    for(;;){ const {data,error}=await supa.from(table).select(cols).in(col,chunk).order(col).range(from,from+999);
      if(error) return {error}; out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  }
  return {data:out};
}

          if(earlyMembers.length){
            // 정상 귀국 인원만 — 항공편별로 다시 쪼개지 않고 팀 단위 한 줄(조기퇴실이 섞이면 便 그룹핑이 부정확해진다)
            const remain=normalCount==null?Number(b.pax)||0:normalCount;
            if(remain>0){
              const normalIds=new Set(teamMembers.filter(m=>!(m.early&&m.early!==b.arr_date)).map(m=>m.id));
              const p0=list[0]||{};
              rows.push({dir:'out', seq:b.event_seq, no:b.event_no||b.event_seq, tag, rep:b.rep_name||'',
                accom:g.accom||'', dep:b.dep_date, arr:b.arr_date, pax:remain,
                flight:p0.ret_flight||'', time:p0.ret_dep_time||'', from:p0.dest||'', to:p0.origin||'',
                memberIds:teamMembers.length?normalIds:null});
            }
          } else {
            mk('out').forEach(u=>rows.push({dir:'out', seq:b.event_seq, no:b.event_no||b.event_seq,
              tag, rep:b.rep_name||'', accom:g.accom||'', dep:b.dep_date, arr:b.arr_date, ...u}));
          }
        }
        // 조기퇴실 인원 — 실제 떠나는 날짜가 오늘(DATE)인 사람만, 같은 날짜끼리 묶어 별도 줄로
        if(earlyMembers.length){
          const byDate={};
          earlyMembers.forEach(m=>{ (byDate[m.early]=byDate[m.early]||[]).push(m); });
          Object.keys(byDate).forEach(d=>{
            if(d!==DATE) return;
            const ms=byDate[d];
            rows.push({dir:'out', seq:b.event_seq, no:b.event_no||b.event_seq, tag, rep:b.rep_name||'',
              accom:g.accom||'', dep:b.dep_date, arr:b.arr_date, pax:ms.length,
              flight:'', time:'', from:'', to:'', early:true, memberIds:new Set(ms.map(m=>m.id))});
          });
        }
      }
      // ── 체류중(도착일·출발일이 아닌 날) 왕복 셔틀 ──
      if(b.dep_date!==DATE && b.arr_date!==DATE){
        const plan=STAY_PLAN[g.accom||''];
        if(plan){
          const p0=list[0]||{};
          //  이미 조기퇴실한 사람은 그날 라운딩 셔틀에 타지 않는다
          const stayMembers=teamMembers.filter(m=>!(m.early && m.early<=DATE));
          const stayPax=teamMembers.length?stayMembers.length:(Number(b.pax)||0);
          const isPus=(window.SZCore&&SZCore.isPus)?SZCore.isPus(p0.origin,p0.dep_flight):false;
          // 그날 라운딩 코스 — 간지호텔 팀은 평일 구주고원, 주말·공휴일은 야마나미(SZCore.golfRows)
          let gr=null;
          try{ gr=(SZCore.golfRows({dep:b.dep_date,arr:b.arr_date,accom:g.accom},isPus)||[])
                 .find(x=>x.date===DATE) || null; }catch(_){ gr=null; }
          const yama = !gr || gr.course==='やまなみCC';
          const go = plan.golf==='none' ? true : (plan.golf==='yama' ? (!!gr && yama) : !!gr);
          if(go && stayPax>0){
            const dest = yama ? YAMANAMI : KUJU_CC;   // 라운딩장 = 야마나미 또는 구주고원
            const base={seq:b.event_seq, no:b.event_no||b.event_seq, tag, rep:b.rep_name||'',
              accom:g.accom||'', pax:stayPax, flight:'', dep:b.dep_date, arr:b.arr_date,
              memberIds:teamMembers.length?new Set(stayMembers.map(m=>m.id)):null};
            rows.push({dir:'stay', leg:'am', time:'', from:g.accom, to:dest, ...base});
            rows.push({dir:'stay', leg:'pm', time:'', from:dest, to:g.accom, ...base});
          }
        }
      }
    });
    ROWS=rows;
    await loadChecks();
    await loadDispatch();
    renderPortChips();
    renderAccomChips();
    renderList();
  }catch(e){ const b2=$('#list'); if(b2) b2.innerHTML=`<div class="deny">${esc(tx('loadFail')+': '+(e.message||e))}</div>`; }
}

// ── 현장 점검 상태(태블릿) ────────────────────────────────────────────
//  그날 배차를 읽는다 — 화면 편집·인쇄가 같은 값을 본다
async function loadDispatch(){
  DISP={};
  try{
    const {data}=await supa.from('transfer_dispatch')
      .select('id,leg,grp_key,seq,vehicle,driver,depart,dest,note')
      .eq('work_date',DATE).order('seq');
    (data||[]).forEach(d=>{ const k=d.leg+'|'+d.grp_key; (DISP[k]=DISP[k]||[]).push(d); });
  }catch(e){}   // 표가 없으면 빈칸으로(예전처럼 손기입)
}
async function loadChecks(){
  CK={in:{team:new Set(),member:new Set()}, out:{team:new Set(),member:new Set()},
      stay_am:{team:new Set(),member:new Set()}, stay_pm:{team:new Set(),member:new Set()}};
  try{
    const {data}=await supa.from('transfer_checks').select('leg,kind,ref').eq('work_date',DATE);
    (data||[]).forEach(c=>{ if(CK[c.leg]&&CK[c.leg][c.kind]) CK[c.leg][c.kind].add(String(c.ref)); });
  }catch(e){}
}
async function toggleCheck(leg,kind,ref,seq){
  const on=ckHas(leg,kind,ref);
  const by=(window.__so_getUser&&__so_getUser())||null;
  try{
    if(on){
      const {error}=await supa.from('transfer_checks').delete()
        .eq('work_date',DATE).eq('leg',leg).eq('kind',kind).eq('ref',String(ref));
      if(error) throw error;
      CK[leg][kind].delete(String(ref));
    }else{
      const {error}=await supa.from('transfer_checks').upsert(
        {work_date:DATE, leg, kind, ref:String(ref), event_seq:seq!=null?seq:null, done_by:by, done_at:new Date().toISOString()},
        {onConflict:'work_date,leg,kind,ref'});
      if(error) throw error;
      CK[leg][kind].add(String(ref));
    }
  }catch(e){ toast(tx('saveFail')+': '+(e.message||e),'err'); return false; }
  return true;
}
function pass(r){
  if(DIR!=='all' && r.dir!==DIR) return false;
  if(ACCOMSEL.size && !ACCOMSEL.has(r.accom||'')) return false;
  if(PORTSEL.size && !PORTSEL.has(korPort(r))) return false;
  return true;
}
function visible(){ return ROWS.filter(pass); }
// 便 → 그 편에 붙는 팀들. 기사·차량 배차는 편 단위로 움직인다.
function groupByFlight(rows){
  const g={};
  rows.forEach(r=>{ const k=r.dir+'|'+(r.leg||'')+'|'+(r.early?'E':'')+'|'+(r.flight||'-')+'|'+(r.time||'')+'|'+r.from+'|'+r.to;
    (g[k]=g[k]||{dir:r.dir,leg:r.leg||'',early:!!r.early,flight:r.flight,time:r.time,from:r.from,to:r.to,rows:[]}).rows.push(r); });
  const dord=d=>d==='in'?0:(d==='stay'?1:2);
  return Object.values(g).sort((a,b)=>
    dord(a.dir)-dord(b.dir) || tmv(a.time)-tmv(b.time) || String(a.flight).localeCompare(String(b.flight)))
    .map(x=>{ x.rows.sort((p,q)=>accomOrd(p.accom)-accomOrd(q.accom)||String(p.tag).localeCompare(String(q.tag)));
      x.teams=x.rows.length; x.pax=x.rows.reduce((s,r)=>s+r.pax,0); return x; });
}

  { const a=$('#t-portlab'); if(a){ a.title=tx('portT'); a.style.cursor='help'; a.style.textDecoration='underline dotted'; }

function renderDirChips(){
  const box=$('#dir-chips'); if(!box) return;
  const opt=[['all','dAll'],['in','dIn'],['out','dOut'],['stay','dStay']];
  box.innerHTML=opt.map(([k,l])=>`<button type="button" class="chip${DIR===k?' on':''}" data-d="${k}">${esc(tx(l))}</button>`).join('');
  box.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{ DIR=b.dataset.d; renderDirChips(); renderList(); }));
}
function renderViewChips(){
  const box=$('#view-chips'); if(!box) return;
  box.innerHTML=[['driver','vDriver'],['meet','vMeet']].map(([k,l])=>
    `<button type="button" class="chip${VIEW===k?' on':''}" data-v="${k}">${esc(tx(l))}</button>`).join('');
  box.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{
    VIEW=b.dataset.v; localStorage.setItem('saizen_transfer_view',VIEW);
    renderViewChips(); applyStatic(); renderList();
  }));
}
// 공항 칩 — 인천팀(TW·09:25)과 부산팀(ZE·13:25)은 시간이 달라 담당·차량이 갈린다.
function renderPortChips(){
  const box=$('#port-chips'); if(!box) return;
  const have=[...new Set(ROWS.map(korPort).filter(Boolean))].sort();
  if(have.length<=1){ box.innerHTML=''; PORTSEL.clear(); return; }
  const allOn=PORTSEL.size===0;
  box.innerHTML=`<button type="button" class="chip${allOn?' on':''}" data-p="__all">${esc(tx('all'))}</button>`
    +have.map(p=>`<button type="button" class="chip${PORTSEL.has(p)?' on':''}" data-p="${esc(p)}">${esc(p)}<span class="c">${ROWS.filter(r=>korPort(r)===p).length}</span></button>`).join('');
  box.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.p;
    if(k==='__all') PORTSEL.clear();
    else { if(PORTSEL.has(k)) PORTSEL.delete(k); else PORTSEL.add(k); }
    renderPortChips(); renderList();
  }));
}
function renderAccomChips(){
  const box=$('#accom-chips'); if(!box) return;
  const have=[...new Set(ROWS.map(r=>r.accom||''))].sort((a,b)=>accomOrd(a)-accomOrd(b));
  const allOn=ACCOMSEL.size===0;
  box.innerHTML=`<button type="button" class="chip${allOn?' on':''}" data-a="__all">${esc(tx('all'))}</button>`
    +have.map(a=>`<button type="button" class="chip${ACCOMSEL.has(a)?' on':''}" data-a="${esc(a)}">${esc(accomL(a)||'-')}<span class="c">${ROWS.filter(r=>r.accom===a).length}</span></button>`).join('');
  box.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.a;
    if(k==='__all') ACCOMSEL.clear();
    else { if(ACCOMSEL.has(k)) ACCOMSEL.delete(k); else ACCOMSEL.add(k); }
    renderAccomChips(); renderList();
  }));
}
function renderList(){
  const box=$('#list'); if(!box) return;
  const vis=visible(), groups=groupByFlight(vis);
  const ins=vis.filter(r=>r.dir==='in'), outs=vis.filter(r=>r.dir==='out');
  const sum=$('#sum'); if(sum) sum.textContent=
    tx('sumIn',ins.length,ins.reduce((s,r)=>s+r.pax,0))+'  ·  '+tx('sumOut',outs.length,outs.reduce((s,r)=>s+r.pax,0));
  const bp=$('#btn-print'); if(bp) bp.disabled=!vis.length;
  if(!vis.length){ box.innerHTML=`<div class="deny" style="color:var(--muted)">${tx('noData')}</div>`; return; }
  if(VIEW==='driver') return renderDriver(box,groups);
  return renderMeet(box,groups);
}

// 성별 기호(M/F) — MEM[].sex('M'/'F')를 이름 옆에 작게(room.html과 같은 표기). 값이 없으면 아무것도 안 낸다.
function gsym(sex){
  if(sex==='M') return '<i class="gsx m" title="M">M</i>';
  if(sex==='F') return '<i class="gsx f" title="F">F</i>';
  return '';
}
// 기사용 — 便 단위 운행표. 팀마다 [승차 완료] 하나. 이름은 안 쓴다. 이제 대표자만 함께 표시(누구 팀인지 구분용).
function flHead(g,doneN,totN){
  const lab = g.dir==='stay' ? tx(g.leg==='pm'?'stayPm':'stayAm') : (g.flight||'-');
  return `<div class="fh"><span class="fdir ${g.dir==='in'?'d-in':(g.dir==='stay'?'d-stay':'d-out')}">${esc(dirShort(g.dir))}</span>`
    +`${g.time?`<span class="ftm">${esc(g.time)}</span>`:''}<span class="fno">${esc(lab)}</span>`
    +`<span class="frt">${esc(routeOf(g)||'-')}</span>`
    +`<span class="fcnt"><b>${esc(tx('prog',doneN,totN))}</b> · ${esc(tx('cntSum',g.teams,g.pax))}</span></div>`;
}
//  배차 편집 — 便마다 차량·기사·출발시각을 넣는다. 여기 넣은 값이 인쇄물에 그대로 찍힌다.
//   행선지는 비워도 된다(便 전체를 한 대로 옮기는 경우).
function dispHTML(g){
  const k=dispKey(g), rows=dispRows(g);
  const line=(d,i)=>`<div class="dpe" data-k="${esc(k)}" data-i="${i}">
      <input class="dv" data-f="vehicle" placeholder="${esc(tx('dpVeh'))}" value="${esc(d.vehicle||'')}">
      <input class="dv" data-f="driver"  placeholder="${esc(tx('dpDrv'))}" value="${esc(d.driver||'')}">
      <input class="dv tm" data-f="depart" placeholder="${esc(tx('dpDep'))}" value="${esc(d.depart||'')}">
      <input class="dv" data-f="dest"    placeholder="${esc(tx('dpDest'))}" value="${esc(d.dest||'')}">
      <button type="button" class="dx" data-del="${esc(k)}" data-i="${i}" title="${esc(tx('dpDel'))}">✕</button>
    </div>`;
  return `<div class="dpbox">
      <div class="dph"><b>${esc(tx('dpH'))}</b>
        ${rows.length?'':`<span class="dpnone">${esc(tx('dpNone'))}</span>`}
        <button type="button" class="dpadd" data-add="${esc(k)}">${esc(tx('dpAdd'))}</button></div>
      ${rows.map(line).join('')}
    </div>`;
}
function renderDriver(box,groups){
  box.innerHTML=groups.map(g=>{
    const lg=legOf(g);
    const doneN=g.rows.filter(r=>ckHas(lg,'team',r.seq)).length;
    return `<div class="flcard">${flHead(g,doneN,g.rows.length)}${dispHTML(g)}`
      +g.rows.map(r=>{ const on=ckHas(lg,'team',r.seq);
        return `<div class="trow${on?' done':''}" data-seq="${r.seq}" data-leg="${lg}">
          <span class="tg">${esc(r.tag)}</span>
          <span class="rp">${esc(r.rep||'-')}</span>
          <span class="ac">${esc(accomL(r.accom)||'-')}</span>
          <span class="pxn">${r.pax}${esc(tx('thPax')===''?'':'')}</span>
          <button type="button" class="bigck${on?' on':''}" data-ck="team" data-leg="${lg}" data-ref="${r.seq}" data-seq="${r.seq}">${esc(on?tx('boarded'):tx('boardedOff'))}</button>
        </div>`; }).join('')
      +`</div>`;
  }).join('');
  wireChecks(box);
}

// 미팅·샌딩용 — 팀별 **이름 명단**에 개인 체크. 손님을 맞이하는 사람이 본다.
function renderMeet(box,groups){
  box.innerHTML=groups.map(g=>{
    const lg=legOf(g);
    const tot=g.rows.reduce((s,r)=>s+(rowMembers(r).length||r.pax),0);
    const done=g.rows.reduce((s,r)=>s+rowMembers(r).filter(m=>ckHas(lg,'member',m.id)).length,0);
    return `<div class="flcard">${flHead(g,done,tot)}`
      +g.rows.map(r=>{
        const list=rowMembers(r);
        const dn=list.filter(m=>ckHas(lg,'member',m.id)).length;
        const full=list.length&&dn===list.length;
        return `<div class="thead2">
            <span class="tg">${esc(r.tag)}</span>
            <span class="rp">${esc(r.rep||'')}</span>
            <span class="ac">${esc(accomL(r.accom)||'-')}</span>
            <span class="tprog${full?' full':''}">${esc(tx('progPax',dn,list.length||r.pax))}</span>
            <button type="button" class="bigck${full?' on':''}" data-ck="all" data-leg="${lg}" data-seq="${r.seq}">${esc(full?tx('clearTeam'):tx('teamAll'))}</button>
          </div>`
          +(list.length
            ? `<div class="mems">`+list.map(m=>{ const on=ckHas(lg,'member',m.id);
                return `<button type="button" class="memck${on?' on':''}" data-ck="member" data-leg="${lg}" data-ref="${m.id}" data-seq="${r.seq}">`
                  +`<span class="sq">${m.seq<99?m.seq:''}</span>${esc(m.kr||m.en||'-')}${gsym(m.sex)}</button>`; }).join('')+`</div>`
            : `<div class="norost">${esc(tx('noRoster'))}</div>`);
      }).join('')
      +`</div>`;
  }).join('');
  wireChecks(box);
  wireDisp(box);
}
//  입력은 칸을 벗어날 때 저장(타이핑마다 쓰지 않는다). 추가·삭제는 즉시.
function wireDisp(box){
  box.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>dispAdd(b.dataset.add)));
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>dispDel(b.dataset.del,+b.dataset.i)));
  box.querySelectorAll('.dpe .dv').forEach(el=>el.addEventListener('change',()=>{
    const row=el.closest('.dpe'); dispSave(row.dataset.k, +row.dataset.i, el.dataset.f, el.value.trim());
  }));
}
function dispParts(k){ const i=k.indexOf('|'); return {leg:k.slice(0,i), grp:k.slice(i+1)}; }
async function dispAdd(k){
  const list=DISP[k]=DISP[k]||[];
  const seq=(list.reduce((m,d)=>Math.max(m,d.seq||0),0))+1;
  const {leg,grp}=dispParts(k);
  try{
    const {data,error}=await supa.from('transfer_dispatch')
      .insert({work_date:DATE, leg, grp_key:grp, seq, created_by:(window.__so_getUser&&__so_getUser())||null})
      .select('id,leg,grp_key,seq,vehicle,driver,depart,dest,note').single();
    if(error) throw error;
    list.push(data); renderList();
  }catch(e){ toast(tx('dpFail',e.message||e),'err'); }
}
async function dispDel(k,i){
  const d=(DISP[k]||[])[i]; if(!d) return;
  try{
    const {error}=await supa.from('transfer_dispatch').delete().eq('id',d.id);
    if(error) throw error;
    DISP[k].splice(i,1); renderList();
  }catch(e){ toast(tx('dpFail',e.message||e),'err'); }
}
async function dispSave(k,i,field,val){
  const d=(DISP[k]||[])[i]; if(!d || d[field]===val) return;
  d[field]=val;
  try{
    const {error}=await supa.from('transfer_dispatch').update({[field]:val||null}).eq('id',d.id);
    if(error) throw error;
    toast(tx('dpSaved'),'ok');
  }catch(e){ toast(tx('dpFail',e.message||e),'err'); }
}
function wireChecks(box){
  box.querySelectorAll('[data-ck]').forEach(b=>b.addEventListener('click',async()=>{
    const kind=b.dataset.ck, leg=b.dataset.leg, seq=Number(b.dataset.seq);
    b.disabled=true;
    if(kind==='all'){
      const row=(ROWS||[]).find(x=>x.seq===seq&&legOf(x)===leg);
      const list=rowMembers(row||{seq}); const full=list.length&&list.every(m=>ckHas(leg,'member',m.id));
      for(const m of list){ if(full===ckHas(leg,'member',m.id)) await toggleCheck(leg,'member',m.id,seq); }
    }else{
      await toggleCheck(leg,kind,b.dataset.ref,seq);
    }
    b.disabled=false; renderList();
  }));
}
function dirShort(d){ const ja=lang()==='ja', en=lang()==='en';
  if(d==='stay') return ja?'滞在':(en?'STAY':'체류');
  return d==='in'?(ja?'到着':(en?'IN':'도착')):(ja?'出発':(en?'OUT':'출발')); }

// ── 인쇄 ①: 기사·배차용 운행표(Min 2026-08, 현장 「来場者状況」 3장 대조 후 재구성) ──
//   담는 정보는 현장 종이와 같다(便·시각·인원·대표자·Group·반대쪽 날짜·숙소·車両·ドライバー).
//   다르게 한 곳 = **사람이 손으로 계산해 적던 것을 시스템이 대신 낸다**:
//    · 배차는 팀이 아니라 **便 단위**로 정해진다 → 車両·ドライバー 칸을 팀마다 두지 않고 便마다 하나.
//    · 그 사람이 여백에 적던 「やまなみへ 85人 / 九重ヒルズ 125人」 = **행선지별 인원 소계**를 便 머리에 자동으로.
//      (몇 대가 필요한지가 여기서 바로 나온다 — 종이의 목적이 그것이었다.)
//   한 장에 담기는 것이 최선(Min) → 넘치면 글자배율을 0.62까지 낮춰 한 장에 맞추고,
//   그래도 안 되면 억지로 줄이지 않고 IN / OUT 이 자연스럽게 다음 장으로 넘어간다(실물도 바쁜 날은 2장).
function printSheet(){
  const vis=visible(); if(!vis.length){ toast(tx('noData'),'err'); return; }
  const w=window.open('','_blank','width=980,height=1000'); if(!w){ toast(tx('popupBlocked'),'err'); return; }
  //  현장 종이의 약칭 — 칸이 좁아 정식 명칭 대신 실물과 같은 표기를 쓴다
  const SHORT={'간지호텔':'ガンジー','야마나미리조트':'やまなみ','구주고원CC':'九重高原'};
  const shortJa=a=>SHORT[String(a||'').trim()]||accomJa(a);
  const acHTML=a=>`<b style="color:${accomColor(a)}">${esc(shortJa(a))}</b>`;
  const md=v=>{ const d=pd(v); return d?`${d.getMonth()+1}/${d.getDate()}`:''; };   // 귀국일 표기용
  // 행선지(=숙소)별 인원 소계 — 배차 대수를 여기서 바로 읽는다
  const subtotal=rows=>{
    const m={}; rows.forEach(r=>{ const k=r.accom||''; m[k]=(m[k]||0)+r.pax; });
    return Object.keys(m).sort((a,b)=>accomOrd(a)-accomOrd(b))
      .map(k=>`${acHTML(k)} <u>${m[k]}</u>名`).join('　·　');
  };
  //  배차 기입란 — 「차량·기사·출발시각」은 한 몸이라 한 줄로 묶는다(Min 2026-08).
  //   행선지가 갈리면 버스도 갈리므로 **숙소(행선지)별 한 줄**. 줄 수 = 필요한 최소 대수.
  //  배차 — **시스템에 입력한 대로** 찍는다(Min 2026-08). 입력이 없으면 예전처럼 행선지별 빈칸.
  //   입력이 있으면 그 줄만 나온다(대수·행선지 모두 사람이 정한 대로).
  const filled=v=>`<em class="w">${esc(v)}</em>`;
  const dispatchFor=(rows,g)=>{
    const saved=g?dispRows(g):[];
    if(saved.length){
      return saved.map(d=>`<div class="dp">
          <span class="to">${d.dest?acHTML(d.dest):'&nbsp;'}</span>
          <span>車両 <i>차량</i></span>${d.vehicle?filled(d.vehicle):'<em class="v"></em>'}
          <span>ドライバー <i>기사</i></span>${d.driver?filled(d.driver):'<em class="dr"></em>'}
          <span>出発 <i>출발</i></span>${d.depart?filled(d.depart):'<em class="s"></em>'}</div>`).join('')
        + `<div class="dp note"><span>特記 <i>특이사항</i></span><em class="sp"></em></div>`;
    }
    const m={}; (rows||[]).forEach(r=>{ const k=r.accom||''; m[k]=(m[k]||0)+r.pax; });
    const ks=Object.keys(m).sort((a,b)=>accomOrd(a)-accomOrd(b));
    const line=k=>`<div class="dp">
        <span class="to">${k?acHTML(k):'—'} <u>${m[k]||0}</u>名</span>
        <span>車両 <i>차량</i></span><em class="v"></em>
        <span>ドライバー <i>기사</i></span><em class="dr"></em>
        <span>出発 <i>출발</i></span><em class="s"></em></div>`;
    return (ks.length?ks:['']).map(line).join('')
      + `<div class="dp note"><span>特記 <i>특이사항</i></span><em class="sp"></em></div>`;
  };

  // 체류중은 왕복 한 줄(⇔) — 화면은 아침·저녁 두 다리로 나누지만 종이는 팀당 한 줄이다
  const stayBy={};
  vis.filter(r=>r.dir==='stay').forEach(r=>{ if(!stayBy[r.seq]) stayBy[r.seq]={...r, course:(r.leg==='am'?r.to:r.from)}; });
  const stays=Object.values(stayBy);
  const ins =vis.filter(r=>r.dir==='in');
  const outs=vis.filter(r=>r.dir==='out');

  //  기사가 보는 건 **누가(태그코드·대표자) 몇 명**인가 뿐이다(Min 2026-08).
  //   숙소 열은 두지 않는다 — 행선지별 인원은 便 머리줄 소계에 있고,
  //   어느 숙소 팀인지는 **태그코드 색**(네임택·航空カバー와 같은 숙소 구분색)으로 보인다.
  //  ⚠ 4칸짜리 목록이 190mm 를 다 쓰면 세로로만 길어져 글씨가 작아진다 →
  //   **여러 단으로 흘려** 세로를 줄이고 그만큼 글씨를 키운다(단 수는 아래 스크립트가 고른다).
  const teamRows=rows=>`<div class="tl">`+rows
    .sort((a,b)=>accomOrd(a.accom)-accomOrd(b.accom)||String(a.tag).localeCompare(String(b.tag)))
    .map(r=>`<div class="tr"><span class="c" style="color:${accomColor(r.accom)}">${esc(r.tag)}</span>
      <span class="r">${esc(r.rep||'-')}</span><span class="p">${r.pax}</span>
      <span class="d">${r.arr?esc(md(r.arr))+'帰':''}</span><span class="m"></span></div>`).join('')
    +`</div>`;

  // ── IN / OUT = 便(항공편) 카드. 배차는 便 단위로 정해진다 ──
  const flightBlock=(kind,rows)=>{
    if(!rows.length) return '';
    const m={};
    rows.forEach(r=>{ const k=(r.early?'E|':'')+(r.flight||'-')+'|'+(r.time||'');
      (m[k]=m[k]||{dir:kind,early:!!r.early,flight:r.flight||'',time:r.time||'',rows:[]}).rows.push(r); });
    const gs=Object.values(m).sort((a,b)=>tmv(a.time)-tmv(b.time)||String(a.flight).localeCompare(String(b.flight)));
    const pax=rows.reduce((s,r)=>s+r.pax,0);
    return `<div class="blk">
      <div class="blk-h"><b>${kind==='in'?'IN':'OUT'}</b><span class="sub">${kind==='in'?'到着 · 空港 → 宿 / 도착':'出発 · 宿 → 空港 / 출발'}</span>
        <span class="big">${pax}</span><span class="unit">名</span><span class="cnt">${rows.length}チーム · ${gs.length}便</span></div>
      ${gs.map(g=>{
        const p0=g.rows[0]||{}, p0Port=(kind==='in'?p0.from:p0.to)||'';
        const gp=g.rows.reduce((s,r)=>s+r.pax,0);
        return `<div class="fl">
          <div class="fl-h"><b class="mono">${esc(g.early?'早期帰国':(g.flight||'-'))}</b><span class="tm mono">${esc(g.time||'')}</span>
            <span class="rt">${esc(cityDir(p0Port,kind)[0])}<i>${esc(cityDir(p0Port,kind)[1])}</i></span>

          ${teamRows(g.rows)}
        </div>`; }).join('')}
    </div>`;
  };

  // ── 滞在 = 숙소↔라운딩장 왕복. 배차는 숙소 단위 ──
  const stayBlock=()=>{
    if(!stays.length) return '';
    const m={};
    stays.forEach(r=>{ const k=(r.accom||'')+'|'+(r.course||'');
      (m[k]=m[k]||{dir:'stay',accom:r.accom,course:r.course,rows:[]}).rows.push(r); });
    const gs=Object.values(m).sort((a,b)=>accomOrd(a.accom)-accomOrd(b.accom));
    const pax=stays.reduce((s,r)=>s+r.pax,0);
    return `<div class="blk">
      <div class="blk-h"><b>滞在</b><span class="sub">滞在中 · 宿 ⇔ ゴルフ場 / 체류중</span>
        <span class="big">${pax}</span><span class="unit">名</span><span class="cnt">${stays.length}チーム</span></div>
      ${gs.map(g=>{
        const course=(g.course&&g.course!==YAMANAMI)?`ゴルフ場(${esc(shortJa(g.course))})`:'ゴルフ場';
        const gp=g.rows.reduce((s,r)=>s+r.pax,0);
        return `<div class="fl">
          <div class="fl-h"><b>${acHTML(g.accom)} ⇔ ${course}</b>
            <span class="sb">${g.rows.length}チーム · <u>${gp}</u>名</span></div>
          ${dispatchFor(g.rows,g)}
          ${teamRows(g.rows)}
        </div>`; }).join('')}
    </div>`;
  };

  //  IN · 체류중 · OUT 은 **각각 다른 장**으로(Min 2026-08).
  //   같은 종이에 섞이면 기사가 자기 구간을 찾기 어렵다. 빈 구간은 장을 만들지 않는다.
  const hd=`<div class="hd"><h2>送迎表 <i>송영표</i></h2>
      <div class="rest">休み <u></u></div>
      <div class="date">${mdw(DATE)}</div></div>`;
  const sections=[flightBlock('in',ins), stayBlock(), flightBlock('out',outs)].filter(Boolean);
  const body=sections.map(sec=>`<div class="page">${hd}${sec}</div>`).join('');
  const html=`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>送迎表_${DATE}</title>

  <div class="bar"><h1>送迎表 / 송영표</h1><div class="meta">${DATE} · ${vis.length}${lang()==='ja'?'件':(lang()==='en'?' rows':'건')}</div><div style="flex:1"></div>

<script>
  // 한 장에 담기는 것이 최선(Min). 넘치면 글자배율(--fs)로 **최소 장수에 딱 맞춘다** —
  //  0.55(가독 하한)에서 몇 장이 되는지 재고, 그 장수를 유지하는 **가장 큰** 배율을 쓴다.
  //  → 1.2장짜리 날은 한 장으로, 2.4장짜리 날은 세 장이 아니라 두 장으로(빈 장이 안 생긴다).
  (function(){
    // ⚠ 2026-08: printMeet()와 같은 폰트 레이스 수정(로컬 일본어 폰트 확정 전에 재면 컴퓨터마다
    //   다르게 맞는다) — document.fonts.ready 이후에만 계산 + 한도 3% 여유 + 이분탐색 12→9.
    var FLOOR=0.7, MAXUP=1.35, TCOLS=[2,1], SAFETY=0.97;
    function fit(){
      var mm=(function(){ var d=document.createElement('div');
        d.style.cssText='height:100mm;position:absolute;visibility:hidden';
        document.body.appendChild(d); var h=d.offsetHeight/100; d.remove(); return h; })();
      var LIMIT=297*mm*SAFETY;
      var pages=document.querySelectorAll('.page'); if(!pages.length) return;
      for(var pi=0;pi<pages.length;pi++) fitPage(pages[pi], LIMIT);
    }
    //  한 장을 그 장 안에서만 맞춘다(IN·체류·OUT 이 서로 다른 장이라 배율도 따로 잡힌다)
    function fitPage(pg, LIMIT){
      var keep=pg.style.minHeight; pg.style.minHeight='auto';
      reset(pg);
      function H(tc,fs){ pg.style.setProperty('--tcols',String(tc));
        pg.style.setProperty('--fs',String(fs)); return pg.scrollHeight; }
      function maxFs(tc){                                        // 그 단 수로 한 장에 들어가는 가장 큰 배율
        if(H(tc,FLOOR)>LIMIT) return 0;
        var lo=FLOOR, hi=MAXUP, b=FLOOR;
        for(var k=0;k<9;k++){ var mid=(lo+hi)/2; if(H(tc,mid)<=LIMIT){ b=mid; lo=mid; } else { hi=mid; } }
        return b;
      }
      var bc=0, bf=0;
      for(var t=0;t<TCOLS.length;t++){ var f=maxFs(TCOLS[t]); if(f>bf){ bf=f; bc=TCOLS[t]; } }

        for(var k2=0;k2<9;k2++){ var m2=(lo2+hi2)/2; if(H(tc2,m2)<=target){ b2=m2; lo2=m2; } else { hi2=m2; } }

    function shrink(pg){

  const shortJa=a=>SHORT[String(a||'').trim()]||accomJa(a);

  const TINY={'간지호텔':'ガンジー','쿠주힐즈':'久住','시즈노야도 료칸':'志津','시즈노야도':'志津'};

    const m={};

      (m[k]=m[k]||{dir, early:!!r.early, flight:r.flight||'', time:r.time||'', rows:[]}).rows.push(r); });
    Object.values(m).sort((a,b)=>tmv(a.time)-tmv(b.time)).forEach(g=>PAGES.push(g));
  });
  { const m={};
    vis.filter(r=>r.dir==='stay').forEach(r=>{ if(m['x'+r.seq]) return; m['x'+r.seq]=r; });

    return `<div class="tm" style="border-left-color:${col}">

      </div>

    </div>`;
  }).join('');

  const html=`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>送迎名簿_${DATE}</title>
<style>${window.__SO_JP_FONT||''}
  *{margin:0;padding:0;box-sizing:border-box}

  <div class="bar"><h1>送迎名簿 / 송영 명단표</h1><div class="meta">${DATE} · ${PAGES.length}枚</div><div style="flex:1"></div>

<script>
  // 「한 장 + 가장 큰 글씨」 — 단 수(3~6)와 글자배율(--fs)의 조합 중 한 장에 들어가는 가장 큰 배율을 고른다.

  //  둘을 같이 탐색해야 실제로 가장 크게 나온다. 어떤 조합으로도 한 장이 안 되면 최소 장수에 맞춘다.
  (function(){

          return b;
        };
        var pickC=0, pickF=0, bestC=0, bestF=0;

        }

          var c2=COLS[COLS.length-1], minP=Math.ceil(H(c2,FLOOR)/LIMIT), tg=minP*LIMIT;
