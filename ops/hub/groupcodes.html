<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad; --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#647548; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#4F5E38;
    --ok:#2f7d4f; --warn:#9a7322; --err:#b13b2c; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:3px solid var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
  .topbar .step{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}
  .topbar .grow{flex:1}
  .navhome{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
  .pill.ok{background:var(--accentSoft);color:var(--ok);border-color:#b4cda0}
  .pill.err{background:#f7e6e2;color:var(--err);border-color:#e3bdb4}
  input{font-family:inherit}
  .inp{padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:7px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accentDeep)}
  .btn.sm{font-size:12px;padding:5px 11px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.danger{border-color:#e3bdb4;color:var(--err);background:transparent}
  .conn{padding:9px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .conn input{width:220px;padding:6px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px}
  .conn .hint{font-size:11px;color:var(--muted)}
  .wrap{max-width:960px;margin:0 auto;padding:16px 20px 90px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .panel h3{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .panel .desc{font-size:12px;color:var(--text2);margin-bottom:11px}
  .form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .form-row .inp{flex:0 0 auto}
  .deny{padding:40px 20px;text-align:center;color:var(--err);font-size:15px;font-weight:700}
  .deny small{display:block;margin-top:8px;color:var(--muted);font-weight:500;font-size:12.5px}
  table.gc{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  table.gc th{text-align:left;font-size:11px;color:#fff;background:var(--accent);font-weight:700;padding:7px 8px;white-space:nowrap}
  table.gc td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
  table.gc .mono{font-family:var(--mono)}
  .cnt{font-size:12px;color:var(--text2);font-weight:700}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .toast.err{border-left-color:var(--err);background:#fbeeeb;color:#8a2a1c}
  .toast.ok{border-left-color:var(--ok);background:var(--accentSoft);color:#234d2f}
</style>

function gradeLabel(g){ if(!g) return ''; const m=GRADE_LABEL[lang()]||GRADE_LABEL.ja; return m[g]!==undefined?m[g]:g; }
function applyStatic(){
  const set=(id,v)=>{const e=$('#'+id);if(e)e.textContent=v;};
  set('t-step',tx('step')); set('t-home',tx('home'));
  const ch=$('#t-connhint'); if(ch) ch.textContent=tx('connHint');
  const d0=$('#t-deny0'); if(d0) d0.textContent=tx('deny0');
  $('#sb-url').placeholder='Supabase Project URL';
  $('#sb-key').placeholder='Publishable key';
  const cs=$('#conn-state'); if(cs && !cs.className.replace('pill','').trim()) cs.textContent=tx('notConn');
  const cb=$('#btn-connect'); if(cb && !cb.disabled && !supa) cb.textContent=tx('connect');
}

const GC_KANA=['あ','ウ','カ','キ','コ','サ','す','セ','た','ち','テ','と','な','ニ','ネ','の','は','ヒ','ふ','ホ','マ','み','ム','め','モ','ヤ','ヨ','ラ','リ','ル','れ','ロ','わ'];
const GC_GRADE_PREFIX={'다이아몬드':['D','M'],'다이아몬드Ⅱ':['H'],'골드':['G'],'특별':['T','S'],'EWRC이용권':['E'],'EWRCⅡ':['W','R','C']};
function gcNormGrade(g){g=String(g||'').trim();if(GC_GRADE_PREFIX[g])return g;if(/다이아몬드\s*Ⅱ|다이아몬드\s*2/.test(g))return '다이아몬드Ⅱ';if(/다이아/.test(g))return '다이아몬드';if(/골드/i.test(g))return '골드';if(/특별/.test(g))return '특별';if(/EWRC\s*Ⅱ|EWRC\s*2/i.test(g))return 'EWRCⅡ';if(/EWRC/i.test(g))return 'EWRC이용권';return '';}
let _gcUsed=null, _gcPickCb=null;
async function gcLoadUsed(force){
  if(_gcUsed && !force) return _gcUsed;
  const used={}; let from=0; const SZ=1000;
  for(;;){
    const {data,error}=await supa.from('member_codes').select('code,name_kr').range(from,from+SZ-1);
    if(error) throw error;
    (data||[]).forEach(r=>{ if(r.code){ (used[r.code]=used[r.code]||[]).push(r.name_kr||'?'); } });
    if(!data || data.length<SZ) break;
    from+=SZ;
  }
  _gcUsed=used; return used;
}
async function gcOpenPicker(grade, onPick){
  grade=gcNormGrade(grade)||Object.keys(GC_GRADE_PREFIX)[0]; _gcPickCb=onPick;
  let bg=document.getElementById('gc-pick-bg'); if(bg) bg.remove();
  bg=document.createElement('div'); bg.id='gc-pick-bg';
  bg.style.cssText='position:fixed;inset:0;z-index:300;background:rgba(31,42,24,.5);display:flex;align-items:center;justify-content:center;padding:18px';
  bg.innerHTML='<div style="background:#fff;border-radius:12px;padding:28px 36px;font-weight:700;color:#566049">'+esc(tx('pickCalc'))+'</div>';
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{if(e.target===bg){bg.remove();_gcPickCb=null;}});
  let used; try{ used=await gcLoadUsed(); }catch(e){ bg.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px;color:#b13b2c">'+esc(tx('loadFail'))+esc(e.message)+'</div>'; return; }
  gcRenderPicker(bg, grade, used);
}
function gcRenderPicker(bg, grade, used){
  const prefixes=GC_GRADE_PREFIX[grade];
  const thS='padding:5px 9px;text-align:center;background:var(--surface2);color:var(--text2);font-weight:700;font-size:12px;border:.5px solid var(--border);position:sticky';
  const grid=prefixes.map(pfx=>{
    const head=`<tr><th style="${thS};left:0;z-index:2">${pfx}${tx('kanaCol')}</th>${GC_POS2.map(c=>`<th style="${thS};top:0">${c}</th>`).join('')}</tr>`;
    const rows=GC_KANA.map(kana=>{
      const cells=GC_POS2.map(c2=>{
        const code=pfx+c2+kana; const mem=used[code]||[]; const n=mem.length;
        let cb,cf; if(n===0){cb='#e4ecd9';cf='#2f7d4f';}else{cb='#f5ecd6';cf='#9a7322';}
        const t=n?code+' · '+n+tx('cellPpl')+mem.join(', '):code+' · '+tx('cellEmpty');
        return `<td title="${esc(t)}" onclick="gcPick('${code}',${n})" style="cursor:pointer;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;padding:7px 10px;min-width:30px;background:${cb};color:${cf};border:.5px solid var(--border)">${n||''}</td>`;
      }).join('');
      return `<tr><th style="${thS};left:0">${kana}</th>${cells}</tr>`;
    }).join('');
    return `<div style="margin-bottom:14px"><div style="font-weight:700;font-size:12px;color:var(--accent2);margin-bottom:4px">prefix「${pfx}」 18×33=594</div><div style="overflow:auto;max-height:44vh;border:1px solid var(--border);border-radius:6px"><table style="border-collapse:collapse">${head}${rows}</table></div></div>`;
  }).join('');
  const gradeSel=Object.keys(GC_GRADE_PREFIX).map(g=>`<option value="${esc(g)}" ${g===grade?'selected':''}>${esc(gradeLabel(g))}</option>`).join('');
  bg.innerHTML=`<div style="background:#fff;border-radius:12px;max-width:1120px;width:100%;max-height:90vh;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)">
      <b style="font-size:15px;color:var(--accent)">${esc(tx('pickTitle'))}</b>
      <select onchange="gcReopen(this.value)" class="inp" style="padding:4px 8px;font-weight:700;color:var(--accent2)">${gradeSel}</select>
      <span style="flex:1"></span>
      <button onclick="document.getElementById('gc-pick-bg').remove();_gcPickCb=null" class="btn ghost sm">${esc(tx('pickClose'))}</button>
    </div>
    <div style="padding:14px 18px;overflow:auto">
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.7;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px">
        <span style="display:inline-block;width:11px;height:11px;background:#e4ecd9;border:1px solid #b4cda0;vertical-align:middle"></span> <b style="color:#2f7d4f">${esc(tx('legendEmpty'))}</b>${esc(tx('legendEmptyD'))}
        <span style="display:inline-block;width:11px;height:11px;background:#f5ecd6;border:1px solid #e0c48f;vertical-align:middle"></span> <b style="color:#9a7322">${esc(tx('legendFull'))}</b>${esc(tx('legendFullD'))}<br>
        ${tx('legendNote')}
      </div>
      ${grid}
    </div>
  </div>`;
}
function gcReopen(g){ const bg=document.getElementById('gc-pick-bg'); if(bg && _gcUsed) gcRenderPicker(bg, gcNormGrade(g)||g, _gcUsed); }
function gcPick(code,n){
  if(n>0 && !confirm(tx('pickConfirm1')+n+tx('pickConfirm2'))) return;
  const cb=_gcPickCb; _gcPickCb=null; const bg=document.getElementById('gc-pick-bg'); if(bg) bg.remove(); if(typeof cb==='function') cb(code);
}
function toast(m,c){const t=document.createElement('div');t.className='toast'+(c?' '+c:'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
function setConn(t,c){const e=$('#conn-state');e.textContent=t;e.className='pill'+(c?' '+c:'');}
function loadCreds(){$('#sb-url').value=localStorage.getItem('saizen_sb_url')||'';$('#sb-key').value=localStorage.getItem('saizen_sb_key')||'';}

async function connect(){
  const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();
  if(!url||!key){setConn(tx('needUrlKey'),'err');return;}
  localStorage.setItem('saizen_sb_url',url);localStorage.setItem('saizen_sb_key',key);
  const btn=$('#btn-connect');btn.textContent=tx('connecting');btn.disabled=true;
  try{
    supa=window.supabase.createClient(url,key);
    const {data:sess}=await supa.auth.getSession();
    if(!sess||!sess.session){ setConn(tx('needLogin'),'err'); btn.textContent=tx('connect');btn.disabled=false;
      $('#content').innerHTML='<div class="panel"><div class="deny">'+esc(tx('denyLogin'))+'<small>'+esc(tx('denyLoginSub'))+'</small></div></div>'; return; }
    const acc=(window.__so_meAccess)?await __so_meAccess():null;
    setConn(tx('connOk'),'ok'); btn.textContent=tx('connectedBtn');btn.disabled=false;
    // 마스터(admin) 또는 groupcodes 영역(쓰기/보기) 보유자만. (PII라 admin.html에서 개별 부여)
    const okG = acc && (acc.role==='admin' || (acc.areas||[]).indexOf('groupcodes')>=0 || (acc.read_areas||[]).indexOf('groupcodes')>=0);
    if(!okG){
      $('#content').innerHTML='<div class="panel"><div class="deny">'+esc(tx('denyAdmin'))+'<small>'+esc(tx('denyAdminSub'))+'</small></div></div>';
      return;
    }
    renderUI();
  }catch(e){ setConn(tx('connFail'),'err'); btn.textContent=tx('connRetryBtn');btn.disabled=false; supa=null; toast(tx('connFailToast')+': '+e.message,'err'); }
}

function renderUI(){
  const clsOpts=CLASSES.map(c=>`<option value="${esc(c)}">${esc(c?gradeLabel(c):tx('clsNone'))}</option>`).join('');
  $('#content').innerHTML=`
    <div id="gc-regbar" style="display:none;align-items:center;flex-wrap:wrap;gap:8px 14px;background:#e3f8ec;border:1px solid #1fb257;border-left:4px solid #1fb257;border-radius:10px;padding:10px 16px;margin-bottom:14px;color:var(--text)">
      <span style="font-weight:800;color:#127a3b;white-space:nowrap">${esc(tx('masterTitle'))}</span>
      <span id="gc-regbar-info" style="font-size:12.5px"></span>
    </div>
    <div class="panel">
      <h3>${esc(tx('addTitle'))}</h3>
      <div class="desc">${tx('addDesc')}</div>
      <div class="form-row">
        <input class="inp" id="f-name" placeholder="${esc(tx('phName'))}" style="width:120px">
        <input class="inp" id="f-birth" placeholder="${esc(tx('phBirth'))}" maxlength="6" style="width:110px">
        <select class="inp" id="f-class" style="width:140px">${clsOpts}</select>
        <input class="inp" id="f-code" placeholder="${esc(tx('phCode'))}" style="width:120px;font-family:var(--mono);font-weight:700;color:var(--accent2)" readonly>
        <button class="btn sm" id="f-pick" type="button">${esc(tx('pickBtn'))}</button>
        <button class="btn" id="f-save" type="button">${esc(tx('save'))}</button>
        <button class="btn ghost sm" id="f-clear" type="button">${esc(tx('clear'))}</button>
      </div>
      <div class="desc" style="margin:8px 0 0">${tx('addHint')}</div>
    </div>
    <div class="panel">
      <h3>${esc(tx('impTitle'))}</h3>
      <div class="desc">${tx('impDesc')}</div>
      <div class="form-row">
        <input class="inp" id="imp-file" type="file" accept=".xlsx,.xls">
        <button class="btn" id="imp-go" type="button" disabled>${esc(tx('impGo'))}</button>
        <span class="cnt" id="imp-stat"></span>
      </div>
    </div>
    <div class="panel">
      <h3>${esc(tx('searchTitle'))} <span class="cnt" id="gc-cnt"></span></h3>
      <div class="form-row" style="margin-bottom:8px">
        <input class="inp" id="q" placeholder="${esc(tx('searchPh'))}" style="width:260px">
        <button class="btn sm" id="btn-search" type="button">${esc(tx('search'))}</button>
        <span class="cnt">${esc(tx('searchMax'))}</span>
      </div>
      <div id="gc-list"></div>
    </div>`;
  $('#f-save').addEventListener('click',saveMember);
  $('#f-pick').addEventListener('click',()=>{
    const cls=$('#f-class').value;
    if(!gcNormGrade(cls)){ toast(tx('pickNeedGrade'),'err'); return; }
    gcOpenPicker(cls, c=>{ $('#f-code').value=c; });
  });
  $('#f-clear').addEventListener('click',()=>{['f-name','f-birth','f-code'].forEach(id=>$('#'+id).value='');$('#f-class').value='';});
  $('#btn-search').addEventListener('click',search);
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
  wireImport();
  loadMasterStatus();
}

// ── 회원 마스터 등록 현황: 총 행수 + 최초 등록 / 최근 갱신 ──
async function loadMasterStatus(){
  const bar=$('#gc-regbar'), info=$('#gc-regbar-info'); if(!bar||!info||!supa) return;
  try{
    const {count}=await supa.from('member_codes').select('*',{count:'exact',head:true});
    if(!count){ info.textContent=tx('masterEmpty'); bar.style.display='flex'; return; }
    const {count:learned}=await supa.from('member_codes').select('*',{count:'exact',head:true}).eq('is_learned',true);
    const {data:first}=await supa.from('member_codes').select('created_at').order('created_at',{ascending:true}).limit(1);
    const {data:last}=await supa.from('member_codes').select('updated_at').order('updated_at',{ascending:false}).limit(1);
    const fmt=s=>{ if(!s) return '-'; const d=new Date(s),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
    const master=(count||0)-(learned||0);
    info.innerHTML=`<b>${(count||0).toLocaleString()}</b>${esc(tx('masterRows'))}`
      + ` <span style="color:var(--muted)">(${esc(tx('masterMaster'))} ${master.toLocaleString()} · ${esc(tx('masterLearned'))} ${(learned||0).toLocaleString()})</span>`
      + ` · ${esc(tx('masterFirst'))} <b>${fmt(first&&first[0]&&first[0].created_at)}</b>`
      + ` · ${esc(tx('masterLast'))} <b>${fmt(last&&last[0]&&last[0].updated_at)}</b>`;
    bar.style.display='flex';
  }catch(e){ /* 권한·네트워크 오류 시 조용히 숨김 */ }
}

// ── 일괄 등록(xlsx): 회원_배정_현황 → member_codes upsert ──
let impRows=[];
function wireImport(){
  const f=$('#imp-file'); if(!f) return;
  f.addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file){ impRows=[]; $('#imp-go').disabled=true; $('#imp-stat').textContent=''; return; }
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const sh=wb.SheetNames.includes('회원_배정_현황')?'회원_배정_현황':wb.SheetNames[0];
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{defval:''});
        impRows=rows.map(r=>({
          code:String(r['코드']||'').trim(),
          member_key:String(r['그룹 내 배정된 아이디']||'').trim(),
          member_class:String(r['고객 구분']||'').trim()||null,
          name_kr:String(r['성명']||'').trim()||null,
          is_learned:false
        })).filter(x=>x.code&&x.member_key);
        $('#imp-stat').textContent=`${impRows.length.toLocaleString()}${tx('impRecog')}${sh}${tx('impSheetEnd')}`;
        $('#imp-go').disabled=!impRows.length;
      }catch(err){ impRows=[]; $('#imp-go').disabled=true; $('#imp-stat').textContent=tx('impReadFail')+err.message; toast(tx('impReadFail')+err.message,'err'); }
    };
    rd.readAsArrayBuffer(file);
  });
  $('#imp-go').addEventListener('click',importGo);
}
async function importGo(){
  if(!impRows.length||!supa) return;
  $('#imp-go').disabled=true;
  const CH=500; let done=0;
  try{
    for(let i=0;i<impRows.length;i+=CH){
      const chunk=impRows.slice(i,i+CH);
      const {error}=await supa.from('member_codes').upsert(chunk,{onConflict:'code,member_key'});
      if(error) throw error;
      done+=chunk.length; $('#imp-stat').textContent=`${done.toLocaleString()}/${impRows.length.toLocaleString()}${tx('impProg')}`;
    }
    $('#imp-stat').textContent=`${done.toLocaleString()}${tx('impDone')}`;
    toast(`${done.toLocaleString()}${tx('impDone')}`,'ok');
    $('#imp-file').value=''; impRows=[]; _gcUsed=null; search(); loadMasterStatus();
  }catch(e){ toast(tx('impFail')+e.message,'err'); $('#imp-go').disabled=false; }
}

async function saveMember(){
  const name=$('#f-name').value.trim(), birth=$('#f-birth').value.trim(), code=$('#f-code').value.trim(), cls=$('#f-class').value;
  if(!name||!birth){ toast(tx('needNameBirth'),'err'); return; }
  if(!/^\d{6}$/.test(birth)){ toast(tx('needBirth6'),'err'); return; }
  if(!code){ toast(tx('needCode'),'err'); return; }
  const member_key=name+birth;
  const {error}=await supa.from('member_codes').upsert({code,member_key,name_kr:name,member_class:cls||null,is_learned:false},{onConflict:'code,member_key'});
  if(error){ toast(tx('saveFail')+error.message,'err'); return; }
  toast(tx('saved')+member_key,'ok'); _gcUsed=null; search(); loadMasterStatus();
}

async function search(){
  const q=$('#q').value.trim();
  let query=supa.from('member_codes').select('*').order('name_kr').limit(200);
  if(q) query=query.or(`name_kr.ilike.%${q}%,member_key.ilike.%${q}%,code.ilike.%${q}%`);
  const {data,error}=await query;
  if(error){ toast(tx('searchFail')+error.message,'err'); return; }
  renderList(data||[]);
}
function renderList(rows){
  $('#gc-cnt').textContent=rows.length?`(${rows.length}${tx('cntUnit')})`:'';
  const box=$('#gc-list');
  if(!rows.length){ box.innerHTML='<div class="deny" style="color:var(--muted);padding:24px">'+esc(tx('listEmpty'))+'</div>'; return; }
  box.innerHTML='<table class="gc"><thead><tr><th>'+esc(tx('thCode'))+'</th><th>'+esc(tx('thName'))+'</th><th>'+esc(tx('thKey'))+'</th><th>'+esc(tx('thGrade'))+'</th><th></th></tr></thead><tbody>'
    + rows.map(r=>`<tr data-code="${esc(r.code)}" data-key="${esc(r.member_key)}">
        <td class="mono"><b>${esc(r.code)}</b></td>
        <td>${esc(r.name_kr||'')}</td>
        <td class="mono" style="font-size:11px;color:var(--muted)">${esc(r.member_key)}</td>
        <td>${esc(gradeLabel(r.member_class||''))}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn sm ghost" data-edit>${esc(tx('edit'))}</button>
          <button class="btn sm danger" data-del>${esc(tx('del'))}</button>
        </td></tr>`).join('')
    + '</tbody></table>';
  box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',e=>{
    const tr=e.target.closest('tr'); const r=rows.find(x=>x.code===tr.dataset.code&&x.member_key===tr.dataset.key);
    if(!r) return;
    $('#f-name').value=r.name_kr||''; $('#f-birth').value=(r.member_key||'').slice(-6);
    $('#f-code').value=r.code; $('#f-class').value=CLASSES.includes(r.member_class)?r.member_class:'';
    window.scrollTo({top:0,behavior:'smooth'});
  }));
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',e=>{
    const tr=e.target.closest('tr'); delMember(tr.dataset.code,tr.dataset.key);
  }));
}
async function delMember(code,key){
  if(!confirm(tx('delConfirm')+`${code} · ${key}`)) return;
  const {error}=await supa.from('member_codes').delete().eq('code',code).eq('member_key',key);
  if(error){ toast(tx('delFail')+error.message,'err'); return; }
  toast(tx('deleted'),'ok'); _gcUsed=null; search(); loadMasterStatus();
}

// 언어 토글 시: 정적 chrome + (연결됨이면) UI 재렌더 → 모든 패널·표 라벨 갱신
window.onSaizenLangChange=function(){
  applyStatic();
  const cs=$('#conn-state'); if(cs && cs.classList.contains('ok')) setConn(tx('connOk'),'ok');
  if(supa){ const btn=$('#btn-connect'); if(btn && !btn.disabled) btn.textContent=tx('connectedBtn'); if($('#content').querySelector('#gc-list')){ renderUI(); search(); } }
};
$('#btn-connect').addEventListener('click',connect);
applyStatic();
loadCreds();
if($('#sb-url').value && $('#sb-key').value){ connect(); }
</script>
