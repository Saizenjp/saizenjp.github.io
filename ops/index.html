<style>
  :root{
    --bg:#f4f5f2; --surface:#ffffff; --surface2:#fafbf8; --surface3:#eceee7;
    --border:#e2e4dd; --border2:#cdd0c6;
    --text:#1b201a; --text2:#5a6054; --muted:#8d9285;
    --accent:#3d5424; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#2c3d19;
    --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;padding:0 0 56px;-webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:sticky;top:0;z-index:30;background:var(--surface);
    border-bottom:1px solid var(--border);box-shadow:inset 0 -2px 0 var(--accent);
    padding:11px 24px;display:flex;align-items:center;gap:12px;
  }
  .topbar h1{font-size:17px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
  .topbar .env{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--text2);background:var(--surface3);border:1px solid var(--border);border-radius:5px;padding:3px 9px}

  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  .hero{padding:24px 2px 14px;border-bottom:1px solid var(--border);margin-bottom:4px}
  .hero h2{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--text)}
  .hero p{font-size:12.5px;color:var(--text2);margin-top:4px;max-width:700px}
  .hero .note{font-size:11.5px;color:var(--muted);margin-top:8px}
  .hero .note b{color:var(--accent)}

  .group{margin-top:22px}
  .group > h3{
    font-size:11px;font-weight:800;color:var(--text2);letter-spacing:.08em;
    text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:10px;
  }
  .group > h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .group .desc{font-size:11px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
  /* 부서 공지 — 섹터 제목 옆 */
  .deptboard{margin-left:8px;font-size:10.5px;font-weight:700;color:var(--text2);text-decoration:none;text-transform:none;letter-spacing:0;white-space:nowrap;background:var(--surface);border:1px solid var(--border2);border-radius:5px;padding:2px 9px}
  .deptboard:hover{border-color:var(--accent);color:var(--accent)}
  /* 새 정보 N 뱃지 */
  .nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 4px;margin-left:5px;font-size:9.5px;font-weight:800;color:#fff;background:#b5402f;border-radius:4px;line-height:1;vertical-align:middle}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:10px}
  .card{
    display:block;text-decoration:none;color:inherit;background:var(--surface);
    border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;
    padding:14px 15px 12px;transition:.12s;position:relative;
  }
  .card:hover{border-color:var(--accent);background:var(--surface2)}
  .card .step{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.04em}
  .card h4{font-size:14.5px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em;color:var(--text)}
  .card .cd{font-size:12px;color:var(--text2);line-height:1.5}
  .card .go{margin-top:10px;font-size:11.5px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
  .card .go::after{content:"→";transition:.12s}
  .card:hover .go::after{transform:translateX(2px)}

  .card.soon{border-left-color:var(--border2);opacity:.6;cursor:default;pointer-events:none}
  .card.soon .step{color:var(--muted)}
  .card.soon .badge{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:700;color:var(--muted);background:var(--surface3);border:1px solid var(--border);border-radius:5px;padding:1px 7px}

  .card.print{border-left-color:var(--accent2)}
  .card.print .step{color:var(--accent2)}

  /* 마스터급 중요도 표시 — 이 카드는 권한 지정자(보통 마스터)만 보임을 한눈에 */
  .card .lvlm{position:absolute;top:11px;right:11px;font-size:9.5px;font-weight:800;letter-spacing:.02em;color:#8a2f22;background:#f7e6e2;border:1px solid #e3bdb4;border-radius:5px;padding:2px 7px;white-space:nowrap}

  /* 데이터 등록 — 시스템의 출발점 */
  .group.foundation{margin-top:6px}
  .cards.one{grid-template-columns:1fr}
  .card.feature{border:1px solid var(--accent);border-left:3px solid var(--accent);background:var(--surface)}
  .card.feature h4{font-size:16px;color:var(--accentDeep)}
  .card.feature .cd{font-size:12.5px}
  .card.feature .req{display:inline-block;margin-bottom:6px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:4px;padding:2px 8px}
  .card.feature .go{font-size:12.5px}

  .foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
  .foot b{color:var(--text2)}
  .foot code{font-family:var(--mono);font-size:11px;background:var(--surface3);padding:1px 6px;border-radius:4px;color:var(--text2)}
</style>

    </div>
  </div>

  <!-- ※ /app/(v13.4 레거시 단발 출력) 카드는 홈에서 제거(Min 2026-07). 인쇄물은 ops 4종으로 일원화.
       파일 자체는 /app/index.html 에 남아 있어 직접 URL로는 접근 가능(백업용). -->

  <!-- 로그인했지만 부여된 영역이 0개 → 빈 화면 대신 안내 -->
  <div id="noperm-notice" style="display:none;text-align:center;padding:48px 20px;margin-top:8px">
    <div style="font-size:18px;font-weight:800;color:var(--accent)" data-i18n="ix_noPermH"></div>
    <div style="margin-top:10px;color:var(--text2);font-size:13.5px;line-height:1.6" data-i18n="ix_noPermP"></div>
  </div>

  <div class="foot" data-i18n="ix_foot"></div>
</div>

<!-- 로그인 필요 안내(미로그인 시) -->
<div id="login-notice" style="display:none;position:fixed;inset:0;z-index:25;background:rgba(238,241,234,.97);align-items:center;justify-content:center;text-align:center;padding:24px">
  <div>
    <div style="font-size:19px;font-weight:800;color:var(--accent)" data-i18n="ix_loginH"></div>
    <div style="margin-top:10px;color:var(--text2);font-size:14px" data-i18n="ix_loginP"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/saizen-ops.js?v=15.45"></script>
<script>
// ── 랜딩 게이트: 미로그인=안내 / 로그인=허용 카드만 표시 ──
(function(){
  // ── 카드 '업데이트 N' 뱃지 — 최근 수정된 카드에 표시, 방문(클릭)하면 사라짐 ──
  //   값(날짜)을 올리면 그 카드에 N 재표시. localStorage로 계정·기기별 본 상태 기억.
  var CARD_UPDATES = {
    'hub/dispatch.html':'2026-07-09', 'hub/nametag.html':'2026-07-09', 'hub/aircover.html':'2026-07-09',
    'hub/dinner.html':'2026-07-09', 'hub/shizu.html':'2026-07-09'
  };
  function _cardSeen(){ try{ return JSON.parse(localStorage.getItem('saizen_card_seen')||'{}'); }catch(e){ return {}; } }
  function markCardBadges(){
    var seen=_cardSeen();
    document.querySelectorAll('.card[href]').forEach(function(card){
      var href=card.getAttribute('href'), upd=CARD_UPDATES[href];
      var old=card.querySelector('.nbadge.upd'); if(old) old.remove();
      if(upd && (!seen[href]||seen[href]<upd)){
        var h4=card.querySelector('h4'); if(h4){ var s=document.createElement('span'); s.className='nbadge upd'; s.textContent='N'; s.title='업데이트됨 / 更新あり'; h4.appendChild(s); }
      }
    });
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('.card[href]'); if(!a) return;
    var href=a.getAttribute('href'), upd=CARD_UPDATES[href]; if(!upd) return;
    var seen=_cardSeen(); seen[href]=upd; try{ localStorage.setItem('saizen_card_seen',JSON.stringify(seen)); }catch(e){}
  });
  function gate(){
    if(!window.__so_meAccess){ return; }
    window.__so_meAccess().then(function(acc){
      var groups=document.querySelectorAll('.wrap .group');
      var notice=document.getElementById('login-notice');
      if(!acc){ // 미로그인 → 카드 숨기고 가운데 정식 로그인 카드 표시
        groups.forEach(function(g){ g.style.display='none'; });
        if(window.__so_loginCard && !notice._carded){ notice.innerHTML=''; notice.appendChild(window.__so_loginCard()); notice._carded=1; }
        notice.style.display='flex';
        return;
      }
      notice.style.display='none';
      // 고정 공지 띠 — 활성 고정(pin_until 미경과) 여러 건을 5초마다 페이드 전환(캐러셀)
      if(window.__so_authClient){ var _c=__so_authClient();
        if(_c) _c.from('announcements').select('title,pin_until,dept').eq('pinned',true)
          .order('sort_order',{ascending:true}).order('created_at',{ascending:false}).then(function(r){
          var now=Date.now();
          var pins=(r.data||[]).filter(function(a){ return !a.pin_until || new Date(a.pin_until).getTime()>now; });
          if(!pins.length) return;
          var st=document.getElementById('ann-strip'), el=document.getElementById('ann-strip-t');
          if(st.dataset.annWired) return;                 // gate 재호출 시 중복 배치·타이머 방지
          st.dataset.annWired='1';
          var DEPTL={front:'프론트',fnb:'식음',golf:'골프',acct:'회계',room:'객실'};
          function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
          function item(a){ var d=a.dept?(DEPTL[a.dept]||a.dept):'전체';
            return '<span style="display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--accent2);border-radius:4px;padding:1px 6px;margin-right:7px;vertical-align:middle">'+esc(d)+'</span>'+esc(a.title); }
          st.style.display='flex'; el.style.transition='opacity .35s'; el.innerHTML=item(pins[0]);
          if(pins.length>1){
            var cnt=document.createElement('span');
            cnt.style.cssText='font-size:11px;font-weight:700;color:var(--accent2);margin-right:2px';
            cnt.textContent='📌'+pins.length;
            el.parentNode.insertBefore(cnt, el);           // 제목 앞(왼쪽)에 — '보드 열기'는 우측 그대로
            var i=0;
            setInterval(function(){
              i=(i+1)%pins.length; el.style.opacity='0';
              setTimeout(function(){ el.innerHTML=item(pins[i]); el.style.opacity='1'; },350);
            }, 5000);
          }
        }).catch(function(){});
      }
      loadRegStrip();    // 등록된 데이터 현황(월·등록자·시각)
      loadFollowupStrip(); // 확인 필요(후속 조치) 미완료 N건
      markNewBadges();   // 부서 공지 새 글 N 표시
      if(acc.role==='admin') markMissingCodes();   // 그룹코드 카드에 코드 미보유 회원 수 배지(admin 전용)
      var all=(acc.role==='admin');   // 마스터만 전체. 매니저도 지정 영역만 노출(역할=구분, 노출=지정영역).
      var wr=acc.areas||[], rd=acc.read_areas||[];   // 쓰기 영역 ∪ 보기 영역 = 카드 노출(페이지 가드가 보기=읽기전용 처리)
      document.querySelectorAll('.card[data-area]').forEach(function(card){
        var area=card.getAttribute('data-area');
        // stats(경영 통계) = admin 또는 'stats' 명시 보유자만(매니저 자동노출 제외)
        var ok = (area==='stats')
          ? (acc.role==='admin' || wr.indexOf('stats')>=0 || rd.indexOf('stats')>=0)
          : (all || wr.indexOf(area)>=0 || rd.indexOf(area)>=0);
        card.style.display = ok ? '' : 'none';
      });
      if(acc.role==='admin'){ document.getElementById('admin-group').style.display=''; }
      // 카드가 하나도 없는 그룹은 헤더 숨김
      document.querySelectorAll('.wrap .group').forEach(function(g){
        if(g.id==='admin-group') return;
        var cards=g.querySelectorAll('.card');
        if(!cards.length) return;
        var anyVisible=[...cards].some(function(c){ return c.style.display!=='none'; });
        g.style.display = anyVisible ? '' : 'none';
      });
      // 로그인했지만 보이는 섹션이 0개 → 빈 화면 대신 '권한 없음' 안내
      var seen=false;
      document.querySelectorAll('.wrap .group').forEach(function(g){
        if(g.style.display==='none') return;
        if([].some.call(g.querySelectorAll('.card'),function(c){return c.style.display!=='none';})) seen=true;
      });
      var np=document.getElementById('noperm-notice');
      if(np) np.style.display = seen ? 'none' : 'block';
      markCardBadges();   // 업데이트 N 뱃지(보이는 카드에)
    });
  }
  // ── 확인 필요(후속 조치) 미완료 건수 → 프론트데스크 딥링크 ──
  function loadFollowupStrip(){
    if(!window.__so_authClient) return; var c=__so_authClient(); if(!c) return;
    c.from('followups').select('title',{count:'exact'}).eq('status','open')
      .order('created_at',{ascending:false}).limit(1).then(function(r){
      var n=r.count||0; if(!n) return;
      var st=document.getElementById('fu-strip'); if(!st) return;
      var first=(r.data&&r.data[0]&&r.data[0].title)||'';
      var tEl=document.getElementById('fu-strip-t'); if(tEl) tEl.textContent='('+n+') '+first;
      st.style.display='flex';
    }).catch(function(){});
  }
  // ── 등록된 데이터 현황 — 월 목록은 실제 데이터(bookings.session_ym) 기준,
  //    등록 시각·등록자는 import_log에서 보강. (import_log 누락/한도와 무관하게 등록된 모든 달 표시) ──
  function loadRegStrip(){
    if(!window.__so_authClient) return; var c=__so_authClient(); if(!c) return;
    var p=function(n){ return String(n).padStart(2,'0'); };
    // 1) who/when 맵(import_log) — best-effort
    var infoBy={};
    c.from('import_log').select('session_ym,uploaded_by,uploaded_at').order('uploaded_at',{ascending:false}).limit(200).then(function(r){
      (r&&r.data||[]).forEach(function(x){ String(x.session_ym||'').split(',').forEach(function(raw){ var ym=raw.trim(); if(ym&&!infoBy[ym]) infoBy[ym]=x; }); });
    }).catch(function(){}).then(function(){
      // 2) 실제 등록 월·팀수 = bookings 전수 스캔(session_ym만, 페이지네이션)
      var teams={};
      function page(off){
        return c.from('bookings').select('session_ym').range(off,off+999).then(function(r){
          var rows=(r&&r.data)||[];
          rows.forEach(function(b){ if(b.session_ym) teams[b.session_ym]=(teams[b.session_ym]||0)+1; });
          if(rows.length===1000) return page(off+1000);
        });
      }
      return page(0).then(function(){ return teams; });
    }).then(function(teams){
      var yms=Object.keys(teams||{}).sort();
      if(!yms.length) return;
      // 3) 월별 인원(passengers) 병렬 카운트
      return Promise.all(yms.map(function(ym){
        return c.from('passengers').select('event_seq,bookings!inner(session_ym)',{count:'exact',head:true}).eq('bookings.session_ym',ym)
          .then(function(r){ return {ym:ym,ppl:(r&&r.count)}; }).catch(function(){ return {ym:ym,ppl:null}; });
      })).then(function(pplArr){
        var pplBy={}; pplArr.forEach(function(o){ pplBy[o.ym]=o.ppl; });
        var html=yms.map(function(ym){
          var info=infoBy[ym]; var who='', ts='';
          if(info){ var d=new Date(info.uploaded_at); ts=' · <span style="color:var(--muted)">'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+'</span>'; who=info.uploaded_by?(' · '+info.uploaded_by):''; }
          var cnt=' · <b style="color:#127a3b">'+(teams[ym]||0).toLocaleString()+'</b>'+t('ix_teamUnit')+(pplBy[ym]!=null?' <b style="color:#127a3b">'+pplBy[ym].toLocaleString()+'</b>'+t('ix_pplUnit'):'');
          return '<span style="background:#fff;border:1px solid #b6e6c8;border-radius:99px;padding:3px 11px">'
               + '<b style="font-family:var(--mono)">'+ym+'</b>'+who+ts+cnt+'</span>';
        }).join('');
        var box=document.getElementById('reg-strip-list'); if(box){ box.innerHTML=html; document.getElementById('reg-strip').style.display='flex'; }
      });
    }).catch(function(){});
  }
  // ── 부서 공지 "새 글" N 뱃지 ──
  function boardSeen(){ try{ return JSON.parse(localStorage.getItem('saizen_board_seen')||'{}'); }catch(e){ return {}; } }
  function setBoardSeen(key){ var s=boardSeen(); s[key]=new Date().toISOString(); localStorage.setItem('saizen_board_seen',JSON.stringify(s)); }
  function toggleN(el,on){
    if(!el) return; var b=el.querySelector(':scope > .nbadge');
    if(on){ if(!b){ b=document.createElement('span'); b.className='nbadge'; b.textContent='N'; el.appendChild(b); } b.style.display=''; }
    else if(b){ b.style.display='none'; }
  }
  // ── 그룹코드 카드에 '코드 미보유 회원' 수 배지(admin 전용 RPC) ──
  function markMissingCodes(){
    if(!window.__so_authClient) return; var c=__so_authClient(); if(!c) return;
    c.rpc('gc_missing_codes').then(function(r){
      if(r.error||!r.data) return;   // 비admin은 에러 → 배지 없음
      var n=r.data.length;
      var card=document.querySelector('a.card[href="hub/groupcodes.html"]');
      var h=card&&card.querySelector('h4'); if(!h) return;
      var b=h.querySelector(':scope > .nbadge.miss');
      if(n>0){ if(!b){ b=document.createElement('span'); b.className='nbadge miss'; h.appendChild(b); } b.textContent=n; b.title='코드 미보유 회원 '+n+'명 / コード未保有 '+n+'名'; b.style.display=''; }
      else if(b){ b.style.display='none'; }
    }).catch(function(){});
  }
  function markNewBadges(){
    if(!window.__so_authClient) return; var c=__so_authClient(); if(!c) return;
    c.from('announcements').select('dept,created_at').then(function(r){
      if(r.error||!r.data) return;
      var latest={}, all=null;
      r.data.forEach(function(a){ var d=a.dept||'all'; if(!latest[d]||a.created_at>latest[d]) latest[d]=a.created_at; if(!all||a.created_at>all) all=a.created_at; });
      var seen=boardSeen();
      // 부서별 공지 링크
      document.querySelectorAll('.deptboard').forEach(function(link){
        var m=(link.getAttribute('href')||'').match(/dept=(\w+)/); var dep=m?m[1]:null; if(!dep) return;
        var lt=latest[dep]; toggleN(link, !!lt && (!seen[dep] || lt>seen[dep]));
        if(!link._nbWired){ link._nbWired=1; link.addEventListener('click',function(){ setBoardSeen(dep); }); }
      });
      // 통합 보드판 카드(전사 포함 전체)
      var bc=document.querySelector('a.card[href="hub/board.html"]'); var h=bc&&(bc.querySelector('h4'));
      if(h){ toggleN(h, !!all && (!seen['all'] || all>seen['all']));
        if(!bc._nbWired){ bc._nbWired=1; bc.addEventListener('click',function(){ setBoardSeen('all'); }); } }
    }).catch(function(){});
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(gate,60); });
  else setTimeout(gate,60);
})();

// ── 오늘 시간별 날씨(야마나미 리조트, 아소) — Open-Meteo 공개 API(키·인증 불필요). 라운딩 참고 ──
(function(){
  var LAT=32.95, LON=131.12;   // 아소 야마나미 리조트 인근
  function wmap(c){
    if(c===0) return ['☀️','맑음']; if(c===1||c===2) return ['🌤️','대체로 맑음']; if(c===3) return ['☁️','흐림'];
    if(c===45||c===48) return ['🌫️','안개']; if(c>=51&&c<=57) return ['🌦️','이슬비'];
    if(c>=61&&c<=67) return ['🌧️','비']; if(c>=71&&c<=77) return ['🌨️','눈'];
    if(c>=80&&c<=82) return ['🌧️','소나기']; if(c>=85&&c<=86) return ['🌨️','눈']; if(c>=95) return ['⛈️','뇌우'];
    return ['·',''];
  }
  var url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON
    +'&hourly=temperature_2m,weather_code,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=1';
  fetch(url).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.hourly||!d.hourly.time) return;
    var H=d.hourly;
    // 현재 JST 시각(보는 사람 시간대와 무관하게 리조트 기준)
    var nowH=parseInt(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo',hour:'2-digit',hour12:false}),10);
    var html='';
    for(var i=0;i<H.time.length;i++){
      var hh=parseInt(H.time[i].slice(11,13),10);
      if(hh<nowH) continue;                              // 지난 시간 제외(지금부터 자정까지)
      var w=wmap(H.weather_code[i]), cur=hh===nowH;
      var pp=H.precipitation_probability?H.precipitation_probability[i]:null;
      html+='<div style="flex:0 0 auto;min-width:62px;text-align:center;padding:6px 4px;border-radius:8px;'
        +(cur?'background:var(--accentSoft,#e4ecd9);':'')+'">'
        +'<div style="font-size:11px;color:var(--text2);font-weight:'+(cur?'800':'600')+'">'+(cur?t('ix_wxNow'):(hh+t('ix_wxHour')))+'</div>'
        +'<div style="font-size:19px;line-height:1.5" title="'+w[1]+'">'+w[0]+'</div>'
        +'<div style="font-size:12px"><b>'+Math.round(H.temperature_2m[i])+'°</b></div>'
        +'<div style="font-size:10px;color:#1a4d8f">💧'+(pp==null?'-':pp+'%')+'</div></div>';
    }
    if(!html) html='<div style="padding:10px;color:var(--muted);font-size:12px">'+t('ix_wxNone')+'</div>';
    var days=document.getElementById('wx-days'); if(!days) return;
    days.innerHTML=html;
    var mt=document.getElementById('wx-meta'); if(mt) mt.textContent=t('ix_wxProvider');
    document.getElementById('wx-strip').style.display='';
  }).catch(function(){ /* 날씨 로드 실패는 조용히 숨김 */ });
})();
</script>
