<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamanami 운영 관리 시스템</title>
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface2:#f6f8f2; --surface3:#e9ede1;
    --border:#d6dccb; --border2:#bcc4ad;
    --text:#1f2a18; --text2:#566049; --muted:#8a937c;
    --accent:#3d5424; --accent2:#9a7322; --accentSoft:#e4ecd9; --accentDeep:#2c3d19;
    --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
    --ya:#2f5fa6; --ku:#6d4ea6; --ka:#2e7d5b; --si:#b5642a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(180deg,#f2f5ec 0%,var(--bg) 260px),var(--bg);
    color:var(--text);line-height:1.55;min-height:100vh;padding:0 0 60px;
  }
  .topbar{
    position:sticky;top:0;z-index:30;background:var(--surface);
    border-bottom:3px solid var(--accent);padding:14px 28px;
    display:flex;align-items:center;gap:12px;
  }
  .topbar h1{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
  .topbar .tagline{font-size:12px;color:var(--text2);font-weight:600;margin-left:6px}
  .topbar .env{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:var(--accent2);border-radius:99px;padding:3px 11px}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  .hero{padding:40px 4px 26px}
  .hero h2{font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
  .hero p{font-size:14px;color:var(--text2);margin-top:8px;max-width:680px}
  .hero .note{font-size:12px;color:var(--muted);margin-top:10px}
  .hero .note b{color:var(--accent)}

  .group{margin-top:30px}
  .group > h3{
    font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.02em;
    text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:13px;
  }
  .group > h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .group .desc{font-size:12px;color:var(--text2);font-weight:600;text-transform:none;letter-spacing:0}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
  .card{
    display:block;text-decoration:none;color:inherit;background:var(--surface);
    border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;
    padding:18px 18px 16px;transition:.15s;position:relative;box-shadow:0 1px 3px rgba(44,61,25,.04);
  }
  .card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(44,61,25,.12);transform:translateY(-2px)}
  .card .step{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.04em}
  .card h4{font-size:16px;font-weight:800;margin:5px 0 6px;letter-spacing:-.01em}
  .card .cd{font-size:12.5px;color:var(--text2);line-height:1.5}
  .card .go{margin-top:12px;font-size:12px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
  .card .go::after{content:"→";transition:.15s}
  .card:hover .go::after{transform:translateX(3px)}

  .card.soon{border-left-color:var(--border2);opacity:.62;cursor:default;pointer-events:none}
  .card.soon .step{color:var(--muted)}
  .card.soon .badge{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;color:var(--text2);background:var(--surface3);border-radius:99px;padding:2px 9px}

  .card.print{border-left-color:var(--accent2)}
  .card.print .step{color:var(--accent2)}

  .foot{margin-top:38px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
  .foot b{color:var(--text2)}
  .foot code{font-family:var(--mono);font-size:11px;background:var(--surface3);padding:1px 6px;border-radius:4px;color:var(--text2)}
</style>
<link rel="stylesheet" href="assets/saizen-ops.css?v=14.7">
</head>
<body>
<div class="topbar so-bar">
  <button class="so-logo" type="button" onclick="location.reload()" title="홈 / ホーム">
    <img class="so-logo-img" src="../assets/logo-saizen-horizontal.svg" alt="SaiZen">
    <span class="so-logo-sub" data-i18n="brandSub"></span>
  </button>
  <span class="so-spacer"></span>
  <div class="so-controls">
    <div class="so-lang">
      <button id="so-lang-ja" onclick="__so_setLang('ja')">日本語</button>
      <button id="so-lang-ko" onclick="__so_setLang('ko')">한국어</button>
      <button id="so-lang-en" onclick="__so_setLang('en')">EN</button>
    </div>
    <button class="so-furi" id="so-furi" onclick="__so_toggleFuri()"></button>
    <span class="env" data-i18n="ix_envBadge"></span>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <h2 data-i18n="ix_heroH"></h2>
    <p data-i18n="ix_heroP"></p>
  </div>

  <!-- 데이터 준비 -->
  <div class="group">
    <h3><span data-i18n="ix_g1H"></span> <span class="desc" data-i18n="ix_g1Desc"></span></h3>
    <div class="cards">
      <a class="card" href="hub/step1.html">
        <h4 data-i18n="ix_c1H"></h4>
        <div class="cd" data-i18n="ix_c1Cd"></div>
        <span class="go" data-i18n="ix_goEnter"></span>
      </a>
    </div>
  </div>

  <!-- 현장 운영 -->
  <div class="group">
    <h3><span data-i18n="ix_g2H"></span> <span class="desc" data-i18n="ix_g2Desc"></span></h3>
    <div class="cards">
      <a class="card" href="hub/room.html">
        <h4 data-i18n="ix_c2H"></h4>
        <div class="cd" data-i18n="ix_c2Cd"></div>
        <span class="go" data-i18n="ix_goEnter"></span>
      </a>
      <div class="card soon">
        <span class="badge" data-i18n="ix_soon"></span>
        <h4 data-i18n="ix_c3H"></h4>
        <div class="cd" data-i18n="ix_c3Cd"></div>
      </div>
      <div class="card soon">
        <span class="badge" data-i18n="ix_soon"></span>
        <h4 data-i18n="ix_c4H"></h4>
        <div class="cd" data-i18n="ix_c4Cd"></div>
      </div>
      <a class="card" href="hub/settle.html">
        <h4 data-i18n="ix_c5H"></h4>
        <div class="cd" data-i18n="ix_c5Cd"></div>
        <span class="go" data-i18n="ix_goEnter"></span>
      </a>
    </div>
  </div>

  <!-- 인쇄물 -->
  <div class="group">
    <h3><span data-i18n="ix_g3H"></span> <span class="desc" data-i18n="ix_g3Desc"></span></h3>
    <div class="cards">
      <a class="card print" href="../app/index.html">
        <h4 data-i18n="ix_cpH"></h4>
        <div class="cd" data-i18n="ix_cpCd"></div>
        <span class="go" data-i18n="ix_cpGo"></span>
      </a>
    </div>
  </div>

  <div class="foot" data-i18n="ix_foot"></div>
</div>
<script src="assets/saizen-ops.js?v=14.7"></script>
</body>
</html>
